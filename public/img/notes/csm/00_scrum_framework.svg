<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 500" width="980" height="500" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">The Scrum framework on one page</title><desc id="d">A Sprint of one month or less contains Sprint Planning, the Daily Scrum, the Sprint Review and the Sprint Retrospective. The Product Backlog feeds Sprint Planning, which creates the Sprint Backlog; the Developers turn selected items into an Increment that meets the Definition of Done. Each artifact has a commitment: Product Goal, Sprint Goal, Definition of Done.</desc><defs><marker id="ah0" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker><marker id="ah1" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker><marker id="ah2" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker></defs><rect x="0.75" y="0.75" width="978.5" height="498.5" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><text x="20.0" y="28.0" font-size="18" font-weight="bold" fill="#1f2937" text-anchor="start">The Scrum framework on one page</text><text x="20.0" y="48.0" font-size="12" font-weight="normal" fill="#6b7280" text-anchor="start">Scrum Guide 2020: 1 Sprint = 4 other events + 3 artifacts, each artifact with one commitment</text><rect x="196.0" y="66.0" width="768.0" height="262.0" rx="12" fill="#faf5ff" stroke="#7c3aed" stroke-width="2" stroke-dasharray="8 5"/><text x="212.0" y="88.0" font-size="12" font-weight="bold" fill="#5b21b6" text-anchor="start">THE SPRINT: one month or less, fixed length, the container for all other events</text><rect x="212.0" y="106.0" width="166.0" height="74.0" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="295.0" y="132.4" font-size="11.5" font-weight="bold" fill="#1e3a8a" text-anchor="middle">Sprint Planning</text><text x="295.0" y="146.7" font-size="11.5" font-weight="normal" fill="#1e3a8a" text-anchor="middle">why, what, how</text><text x="295.0" y="161.1" font-size="11.5" font-weight="normal" fill="#1e3a8a" text-anchor="middle">max 8 h (1-month Sprint)</text><line x1="380.0" y1="143.0" x2="402.0" y2="143.0" stroke="#1f2937" stroke-width="2" marker-end="url(#ah0)"/><rect x="404.0" y="106.0" width="166.0" height="74.0" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="487.0" y="125.2" font-size="11.5" font-weight="bold" fill="#1e3a8a" text-anchor="middle">Daily Scrum</text><text x="487.0" y="139.6" font-size="11.5" font-weight="normal" fill="#1e3a8a" text-anchor="middle">Developers, same time and</text><text x="487.0" y="153.9" font-size="11.5" font-weight="normal" fill="#1e3a8a" text-anchor="middle">place</text><text x="487.0" y="168.3" font-size="11.5" font-weight="normal" fill="#1e3a8a" text-anchor="middle">15 min every working day</text><line x1="572.0" y1="143.0" x2="594.0" y2="143.0" stroke="#1f2937" stroke-width="2" marker-end="url(#ah0)"/><rect x="596.0" y="106.0" width="166.0" height="74.0" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="679.0" y="132.4" font-size="11.5" font-weight="bold" fill="#1e3a8a" text-anchor="middle">Sprint Review</text><text x="679.0" y="146.7" font-size="11.5" font-weight="normal" fill="#1e3a8a" text-anchor="middle">Scrum Team + stakeholders</text><text x="679.0" y="161.1" font-size="11.5" font-weight="normal" fill="#1e3a8a" text-anchor="middle">max 4 h (1-month Sprint)</text><line x1="764.0" y1="143.0" x2="786.0" y2="143.0" stroke="#1f2937" stroke-width="2" marker-end="url(#ah0)"/><rect x="788.0" y="106.0" width="166.0" height="74.0" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="871.0" y="132.4" font-size="11.5" font-weight="bold" fill="#1e3a8a" text-anchor="middle">Sprint Retrospective</text><text x="871.0" y="146.7" font-size="11.5" font-weight="normal" fill="#1e3a8a" text-anchor="middle">Scrum Team</text><text x="871.0" y="161.1" font-size="11.5" font-weight="normal" fill="#1e3a8a" text-anchor="middle">max 3 h (1-month Sprint)</text><rect x="232.0" y="226.0" width="290.0" height="84.0" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="377.0" y="250.2" font-size="11.5" font-weight="bold" fill="#78350f" text-anchor="middle">Sprint Backlog</text><text x="377.0" y="264.6" font-size="11.5" font-weight="normal" fill="#78350f" text-anchor="middle">Sprint Goal (why) + selected Product Backlog items</text><text x="377.0" y="278.9" font-size="11.5" font-weight="normal" fill="#78350f" text-anchor="middle">(what) + plan (how)</text><text x="377.0" y="293.3" font-size="11.5" font-weight="bold" fill="#78350f" text-anchor="middle">Commitment: Sprint Goal</text><rect x="640.0" y="226.0" width="290.0" height="84.0" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="785.0" y="250.2" font-size="11.5" font-weight="bold" fill="#78350f" text-anchor="middle">Increment</text><text x="785.0" y="264.6" font-size="11.5" font-weight="normal" fill="#78350f" text-anchor="middle">Usable step toward the Product Goal; the sum is</text><text x="785.0" y="278.9" font-size="11.5" font-weight="normal" fill="#78350f" text-anchor="middle">inspected at the Sprint Review</text><text x="785.0" y="293.3" font-size="11.5" font-weight="bold" fill="#78350f" text-anchor="middle">Commitment: Definition of Done</text><line x1="295.0" y1="180.0" x2="302.0" y2="226.0" stroke="#d97706" stroke-width="2" marker-end="url(#ah1)"/><text x="289.0" y="208.0" font-size="10.5" font-weight="normal" fill="#78350f" text-anchor="end" font-style="italic">creates</text><line x1="487.0" y1="226.0" x2="487.0" y2="180.0" stroke="#d97706" stroke-width="2" marker-end="url(#ah1)"/><text x="493.0" y="208.0" font-size="10.5" font-weight="normal" fill="#78350f" text-anchor="start" font-style="italic">updates</text><line x1="524.0" y1="268.0" x2="638.0" y2="268.0" stroke="#1f2937" stroke-width="2" marker-end="url(#ah0)"/><text x="582.0" y="258.0" font-size="10.5" font-weight="normal" fill="#78350f" text-anchor="middle" font-style="italic">Developers</text><text x="582.0" y="292.0" font-size="10.5" font-weight="normal" fill="#78350f" text-anchor="middle" font-style="italic">build</text><line x1="785.0" y1="226.0" x2="679.0" y2="180.0" stroke="#d97706" stroke-width="2" marker-end="url(#ah1)"/><text x="709.0" y="208.0" font-size="10.5" font-weight="normal" fill="#78350f" text-anchor="start" font-style="italic">inspected</text><rect x="20.0" y="124.0" width="156.0" height="134.0" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="98.0" y="158.8" font-size="11.5" font-weight="bold" fill="#78350f" text-anchor="middle">Product Backlog</text><text x="98.0" y="173.2" font-size="11.5" font-weight="normal" fill="#78350f" text-anchor="middle">Ordered by the Product</text><text x="98.0" y="187.6" font-size="11.5" font-weight="normal" fill="#78350f" text-anchor="middle">Owner; refined as needed;</text><text x="98.0" y="201.9" font-size="11.5" font-weight="normal" fill="#78350f" text-anchor="middle">feeds Sprint Planning</text><text x="98.0" y="216.3" font-size="11.5" font-weight="bold" fill="#78350f" text-anchor="middle">Commitment: Product</text><text x="98.0" y="230.7" font-size="11.5" font-weight="bold" fill="#78350f" text-anchor="middle">Goal</text><line x1="178.0" y1="150.0" x2="211.0" y2="126.0" stroke="#1f2937" stroke-width="2" marker-end="url(#ah0)"/><polyline points="944.0,180.0 944.0,340.0 60.0,340.0 60.0,261.0" fill="none" stroke="#7c3aed" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#ah2)" stroke-linejoin="round"/><text x="500.0" y="358.0" font-size="11.5" font-weight="bold" fill="#5b21b6" text-anchor="middle">A new Sprint starts immediately after the previous one ends; the Review's outcome may adjust the Product Backlog</text><rect x="20.0" y="380.0" width="300.0" height="100.0" rx="8" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.6"/><text x="170.0" y="419.4" font-size="11.5" font-weight="bold" fill="#134e4a" text-anchor="middle">Scrum Team</text><text x="170.0" y="433.7" font-size="11.5" font-weight="normal" fill="#134e4a" text-anchor="middle">1 Scrum Master + 1 Product Owner + Developers;</text><text x="170.0" y="448.1" font-size="11.5" font-weight="normal" fill="#134e4a" text-anchor="middle">typically 10 or fewer; no sub-teams or hierarchies</text><rect x="340.0" y="380.0" width="300.0" height="100.0" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="490.0" y="419.4" font-size="11.5" font-weight="bold" fill="#14532d" text-anchor="middle">Scrum theory</text><text x="490.0" y="433.7" font-size="11.5" font-weight="normal" fill="#14532d" text-anchor="middle">Empiricism + lean thinking</text><text x="490.0" y="448.1" font-size="11.5" font-weight="normal" fill="#14532d" text-anchor="middle">Pillars: transparency, inspection, adaptation</text><rect x="660.0" y="380.0" width="300.0" height="100.0" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.6"/><text x="810.0" y="426.6" font-size="11.5" font-weight="bold" fill="#4c1d95" text-anchor="middle">Scrum values</text><text x="810.0" y="440.9" font-size="11.5" font-weight="normal" fill="#4c1d95" text-anchor="middle">Commitment, Focus, Openness, Respect, Courage</text></svg>