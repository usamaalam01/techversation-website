<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 520" width="980" height="520" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">Who does what across the Sprint</title><desc id="d">A grid of the Product Owner, the Developers and the Scrum Master across Sprint Planning, the work during the Sprint, the Sprint Review and the Sprint Retrospective.</desc><defs></defs><rect x="0.75" y="0.75" width="978.5" height="518.5" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><text x="20.0" y="28.0" font-size="18" font-weight="bold" fill="#1f2937" text-anchor="start">How the three accountabilities interact across a Sprint</text><text x="20.0" y="48.0" font-size="12" font-weight="normal" fill="#6b7280" text-anchor="start">Scrum Guide 2020: one team, one goal; each accountability contributes at every step</text><rect x="148.0" y="62.0" width="195.0" height="34.0" rx="8" fill="#1e3a8a" stroke="#1e3a8a" stroke-width="1.6"/><text x="245.5" y="83.1" font-size="12.5" font-weight="bold" fill="#ffffff" text-anchor="middle">Sprint Planning</text><rect x="351.0" y="62.0" width="195.0" height="34.0" rx="8" fill="#1e3a8a" stroke="#1e3a8a" stroke-width="1.6"/><text x="448.5" y="83.1" font-size="12.5" font-weight="bold" fill="#ffffff" text-anchor="middle">During the Sprint</text><rect x="554.0" y="62.0" width="195.0" height="34.0" rx="8" fill="#1e3a8a" stroke="#1e3a8a" stroke-width="1.6"/><text x="651.5" y="83.1" font-size="12.5" font-weight="bold" fill="#ffffff" text-anchor="middle">Sprint Review</text><rect x="757.0" y="62.0" width="195.0" height="34.0" rx="8" fill="#1e3a8a" stroke="#1e3a8a" stroke-width="1.6"/><text x="854.5" y="83.1" font-size="12.5" font-weight="bold" fill="#ffffff" text-anchor="middle">Sprint Retrospective</text><rect x="20.0" y="104.0" width="120.0" height="124.0" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="80.0" y="170.2" font-size="13" font-weight="bold" fill="#14532d" text-anchor="middle">Product Owner</text><rect x="148.0" y="104.0" width="195.0" height="124.0" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="1.4"/><text x="158.0" y="124.0" font-size="11.2" font-weight="normal" fill="#1f2937" text-anchor="start">Proposes how the product could</text><text x="158.0" y="138.3" font-size="11.2" font-weight="normal" fill="#1f2937" text-anchor="start">increase its value; ensures</text><text x="158.0" y="152.7" font-size="11.2" font-weight="normal" fill="#1f2937" text-anchor="start">attendees are prepared; helps</text><text x="158.0" y="167.0" font-size="11.2" font-weight="normal" fill="#1f2937" text-anchor="start">define the Sprint Goal</text><rect x="351.0" y="104.0" width="195.0" height="124.0" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="1.4"/><text x="361.0" y="124.0" font-size="11.2" font-weight="normal" fill="#1f2937" text-anchor="start">Orders and refines the Product</text><text x="361.0" y="138.3" font-size="11.2" font-weight="normal" fill="#1f2937" text-anchor="start">Backlog; negotiates scope without</text><text x="361.0" y="152.7" font-size="11.2" font-weight="normal" fill="#1f2937" text-anchor="start">endangering the Sprint Goal</text><rect x="554.0" y="104.0" width="195.0" height="124.0" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="1.4"/><text x="564.0" y="124.0" font-size="11.2" font-weight="normal" fill="#1f2937" text-anchor="start">Discusses progress toward the</text><text x="564.0" y="138.3" font-size="11.2" font-weight="normal" fill="#1f2937" text-anchor="start">Product Goal with stakeholders;</text><text x="564.0" y="152.7" font-size="11.2" font-weight="normal" fill="#1f2937" text-anchor="start">the Product Backlog may be</text><text x="564.0" y="167.0" font-size="11.2" font-weight="normal" fill="#1f2937" text-anchor="start">adjusted</text><rect x="757.0" y="104.0" width="195.0" height="124.0" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="1.4"/><text x="767.0" y="124.0" font-size="11.2" font-weight="normal" fill="#1f2937" text-anchor="start">Takes part as a member of the</text><text x="767.0" y="138.3" font-size="11.2" font-weight="normal" fill="#1f2937" text-anchor="start">Scrum Team</text><rect x="20.0" y="236.0" width="120.0" height="124.0" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="80.0" y="302.2" font-size="13" font-weight="bold" fill="#1e3a8a" text-anchor="middle">Developers</text><rect x="148.0" y="236.0" width="195.0" height="124.0" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.4"/><text x="158.0" y="256.0" font-size="11.2" font-weight="normal" fill="#1f2937" text-anchor="start">Select Product Backlog items; plan</text><text x="158.0" y="270.3" font-size="11.2" font-weight="normal" fill="#1f2937" text-anchor="start">how to create an Increment that</text><text x="158.0" y="284.7" font-size="11.2" font-weight="normal" fill="#1f2937" text-anchor="start">meets the Definition of Done</text><rect x="351.0" y="236.0" width="195.0" height="124.0" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.4"/><text x="361.0" y="256.0" font-size="11.2" font-weight="normal" fill="#1f2937" text-anchor="start">Create the Increment; hold the</text><text x="361.0" y="270.3" font-size="11.2" font-weight="normal" fill="#1f2937" text-anchor="start">Daily Scrum; adapt the plan daily</text><text x="361.0" y="284.7" font-size="11.2" font-weight="normal" fill="#1f2937" text-anchor="start">toward the Sprint Goal</text><rect x="554.0" y="236.0" width="195.0" height="124.0" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.4"/><text x="564.0" y="256.0" font-size="11.2" font-weight="normal" fill="#1f2937" text-anchor="start">Present the work that is Done;</text><text x="564.0" y="270.3" font-size="11.2" font-weight="normal" fill="#1f2937" text-anchor="start">discuss what happened</text><rect x="757.0" y="236.0" width="195.0" height="124.0" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.4"/><text x="767.0" y="256.0" font-size="11.2" font-weight="normal" fill="#1f2937" text-anchor="start">Inspect how the Sprint went; agree</text><text x="767.0" y="270.3" font-size="11.2" font-weight="normal" fill="#1f2937" text-anchor="start">improvements</text><rect x="20.0" y="368.0" width="120.0" height="124.0" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.6"/><text x="80.0" y="434.2" font-size="13" font-weight="bold" fill="#4c1d95" text-anchor="middle">Scrum Master</text><rect x="148.0" y="368.0" width="195.0" height="124.0" rx="8" fill="#ffffff" stroke="#7c3aed" stroke-width="1.4"/><text x="158.0" y="388.0" font-size="11.2" font-weight="normal" fill="#1f2937" text-anchor="start">Ensures the event takes place and</text><text x="158.0" y="402.3" font-size="11.2" font-weight="normal" fill="#1f2937" text-anchor="start">is positive, productive and</text><text x="158.0" y="416.7" font-size="11.2" font-weight="normal" fill="#1f2937" text-anchor="start">timeboxed</text><rect x="351.0" y="368.0" width="195.0" height="124.0" rx="8" fill="#ffffff" stroke="#7c3aed" stroke-width="1.4"/><text x="361.0" y="388.0" font-size="11.2" font-weight="normal" fill="#1f2937" text-anchor="start">Coaches the team; causes the</text><text x="361.0" y="402.3" font-size="11.2" font-weight="normal" fill="#1f2937" text-anchor="start">removal of impediments</text><rect x="554.0" y="368.0" width="195.0" height="124.0" rx="8" fill="#ffffff" stroke="#7c3aed" stroke-width="1.4"/><text x="564.0" y="388.0" font-size="11.2" font-weight="normal" fill="#1f2937" text-anchor="start">Facilitates stakeholder</text><text x="564.0" y="402.3" font-size="11.2" font-weight="normal" fill="#1f2937" text-anchor="start">collaboration as requested or</text><text x="564.0" y="416.7" font-size="11.2" font-weight="normal" fill="#1f2937" text-anchor="start">needed</text><rect x="757.0" y="368.0" width="195.0" height="124.0" rx="8" fill="#ffffff" stroke="#7c3aed" stroke-width="1.4"/><text x="767.0" y="388.0" font-size="11.2" font-weight="normal" fill="#1f2937" text-anchor="start">Takes part as a member; works on</text><text x="767.0" y="402.3" font-size="11.2" font-weight="normal" fill="#1f2937" text-anchor="start">the team's effectiveness</text></svg>