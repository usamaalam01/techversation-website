<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 470" width="980" height="470" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">The three topics of Sprint Planning</title><desc id="d">Topic One, why is this Sprint valuable, produces the Sprint Goal. Topic Two, what can be Done, produces the selected Product Backlog items. Topic Three, how will the work get done, produces the plan. Together they form the Sprint Backlog.</desc><defs><marker id="ah0" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker><marker id="ah1" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker></defs><rect x="0.75" y="0.75" width="978.5" height="468.5" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><text x="20.0" y="28.0" font-size="18" font-weight="bold" fill="#1f2937" text-anchor="start">The three topics of Sprint Planning</text><text x="20.0" y="48.0" font-size="12" font-weight="normal" fill="#6b7280" text-anchor="start">Scrum Guide 2020: the whole Scrum Team plans; the output is the Sprint Backlog (max 8 hours for a one-month Sprint)</text><rect x="20.0" y="76.0" width="170.0" height="210.0" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="105.0" y="148.8" font-size="11.5" font-weight="bold" fill="#78350f" text-anchor="middle">Inputs</text><text x="105.0" y="163.2" font-size="11.5" font-weight="normal" fill="#78350f" text-anchor="middle">Product Backlog, ordered</text><text x="105.0" y="177.6" font-size="11.5" font-weight="normal" fill="#78350f" text-anchor="middle">Product Goal</text><text x="105.0" y="191.9" font-size="11.5" font-weight="normal" fill="#78350f" text-anchor="middle">Past performance</text><text x="105.0" y="206.3" font-size="11.5" font-weight="normal" fill="#78350f" text-anchor="middle">Upcoming capacity</text><text x="105.0" y="220.7" font-size="11.5" font-weight="normal" fill="#78350f" text-anchor="middle">Definition of Done</text><rect x="214.0" y="76.0" width="232.0" height="40.0" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="330.0" y="100.2" font-size="13" font-weight="bold" fill="#1e3a8a" text-anchor="middle">Topic One: Why?</text><rect x="214.0" y="122.0" width="232.0" height="164.0" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/><text x="226.0" y="144.0" font-size="12" font-weight="bold" fill="#2563eb" text-anchor="start">Why is this Sprint valuable?</text><text x="226.0" y="164.0" font-size="11.5" font-weight="normal" fill="#1f2937" text-anchor="start">The Product Owner proposes how the</text><text x="226.0" y="178.7" font-size="11.5" font-weight="normal" fill="#1f2937" text-anchor="start">product could increase its value. The</text><text x="226.0" y="193.4" font-size="11.5" font-weight="normal" fill="#1f2937" text-anchor="start">whole Scrum Team defines the Sprint</text><text x="226.0" y="208.2" font-size="11.5" font-weight="normal" fill="#1f2937" text-anchor="start">Goal.</text><line x1="330.0" y1="288.0" x2="330.0" y2="320.0" stroke="#6b7280" stroke-width="2" marker-end="url(#ah0)"/><rect x="214.0" y="322.0" width="232.0" height="44.0" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="330.0" y="347.9" font-size="12" font-weight="bold" fill="#1e3a8a" text-anchor="middle">Sprint Goal</text><line x1="448.0" y1="96.0" x2="470.0" y2="96.0" stroke="#1f2937" stroke-width="2.2" marker-end="url(#ah1)"/><rect x="472.0" y="76.0" width="232.0" height="40.0" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="588.0" y="100.2" font-size="13" font-weight="bold" fill="#14532d" text-anchor="middle">Topic Two: What?</text><rect x="472.0" y="122.0" width="232.0" height="164.0" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/><text x="484.0" y="144.0" font-size="12" font-weight="bold" fill="#16a34a" text-anchor="start">What can be Done this Sprint?</text><text x="484.0" y="164.0" font-size="11.5" font-weight="normal" fill="#1f2937" text-anchor="start">The Developers select items, in</text><text x="484.0" y="178.7" font-size="11.5" font-weight="normal" fill="#1f2937" text-anchor="start">discussion with the Product Owner. The</text><text x="484.0" y="193.4" font-size="11.5" font-weight="normal" fill="#1f2937" text-anchor="start">team may refine items.</text><line x1="588.0" y1="288.0" x2="588.0" y2="320.0" stroke="#6b7280" stroke-width="2" marker-end="url(#ah0)"/><rect x="472.0" y="322.0" width="232.0" height="44.0" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="588.0" y="347.9" font-size="12" font-weight="bold" fill="#14532d" text-anchor="middle">Selected Product Backlog items</text><line x1="706.0" y1="96.0" x2="728.0" y2="96.0" stroke="#1f2937" stroke-width="2.2" marker-end="url(#ah1)"/><rect x="730.0" y="76.0" width="232.0" height="40.0" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.6"/><text x="846.0" y="100.2" font-size="13" font-weight="bold" fill="#4c1d95" text-anchor="middle">Topic Three: How?</text><rect x="730.0" y="122.0" width="232.0" height="164.0" rx="8" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/><text x="742.0" y="144.0" font-size="12" font-weight="bold" fill="#7c3aed" text-anchor="start">How will the work get done?</text><text x="742.0" y="164.0" font-size="11.5" font-weight="normal" fill="#1f2937" text-anchor="start">The Developers plan the work, often in</text><text x="742.0" y="178.7" font-size="11.5" font-weight="normal" fill="#1f2937" text-anchor="start">items of one day or less. No one else</text><text x="742.0" y="193.4" font-size="11.5" font-weight="normal" fill="#1f2937" text-anchor="start">tells them how.</text><line x1="846.0" y1="288.0" x2="846.0" y2="320.0" stroke="#6b7280" stroke-width="2" marker-end="url(#ah0)"/><rect x="730.0" y="322.0" width="232.0" height="44.0" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.6"/><text x="846.0" y="347.9" font-size="12" font-weight="bold" fill="#4c1d95" text-anchor="middle">The plan</text><line x1="192.0" y1="180.0" x2="212.0" y2="180.0" stroke="#1f2937" stroke-width="2.2" marker-end="url(#ah1)"/><rect x="214.0" y="386.0" width="722.0" height="44.0" rx="8" fill="#1e3a8a" stroke="#1e3a8a" stroke-width="1.6"/><text x="575.0" y="412.2" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">Sprint Backlog = Sprint Goal + selected Product Backlog items + the plan</text><text x="490.0" y="450.0" font-size="11.8" font-weight="bold" fill="#5b21b6" text-anchor="middle">The Sprint Goal must be finalized before the end of Sprint Planning. Others may be invited for advice only.</text></svg>