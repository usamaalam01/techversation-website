<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 400" width="980" height="400" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">Three artifacts, three commitments</title><desc id="d">The Product Backlog has the Product Goal as its commitment, the Sprint Backlog has the Sprint Goal and the Increment has the Definition of Done. Commitments reinforce empiricism and the Scrum values.</desc><defs><marker id="ah0" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker></defs><rect x="0.75" y="0.75" width="978.5" height="398.5" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><text x="20.0" y="28.0" font-size="18" font-weight="bold" fill="#1f2937" text-anchor="start">Three artifacts, three commitments</text><text x="20.0" y="48.0" font-size="12" font-weight="normal" fill="#6b7280" text-anchor="start">Scrum Guide 2020: each artifact contains a commitment that enhances transparency and focus</text><rect x="20.0" y="66.0" width="300.0" height="46.0" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="170.0" y="93.5" font-size="14" font-weight="bold" fill="#1e3a8a" text-anchor="middle">Product Backlog</text><rect x="20.0" y="118.0" width="300.0" height="112.0" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/><text x="32.0" y="142.0" font-size="12" font-weight="normal" fill="#1f2937" text-anchor="start">An emergent, ordered list of what is needed to</text><text x="32.0" y="157.4" font-size="12" font-weight="normal" fill="#1f2937" text-anchor="start">improve the product; the single source of work</text><line x1="170.0" y1="232.0" x2="170.0" y2="262.0" stroke="#6b7280" stroke-width="2" marker-end="url(#ah0)"/><rect x="20.0" y="264.0" width="300.0" height="70.0" rx="22" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="170.0" y="287.4" font-size="12.5" font-weight="bold" fill="#1e3a8a" text-anchor="middle">Commitment: Product Goal</text><text x="170.0" y="303.1" font-size="12.5" font-weight="normal" fill="#1e3a8a" text-anchor="middle">a future state of the product, the long-term</text><text x="170.0" y="318.7" font-size="12.5" font-weight="normal" fill="#1e3a8a" text-anchor="middle">objective</text><rect x="340.0" y="66.0" width="300.0" height="46.0" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="490.0" y="93.5" font-size="14" font-weight="bold" fill="#14532d" text-anchor="middle">Sprint Backlog</text><rect x="340.0" y="118.0" width="300.0" height="112.0" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/><text x="352.0" y="142.0" font-size="12" font-weight="normal" fill="#1f2937" text-anchor="start">The Sprint Goal (why), the selected items (what)</text><text x="352.0" y="157.4" font-size="12" font-weight="normal" fill="#1f2937" text-anchor="start">and an actionable plan (how); a plan by and for the</text><text x="352.0" y="172.7" font-size="12" font-weight="normal" fill="#1f2937" text-anchor="start">Developers</text><line x1="490.0" y1="232.0" x2="490.0" y2="262.0" stroke="#6b7280" stroke-width="2" marker-end="url(#ah0)"/><rect x="340.0" y="264.0" width="300.0" height="70.0" rx="22" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="490.0" y="295.2" font-size="12.5" font-weight="bold" fill="#14532d" text-anchor="middle">Commitment: Sprint Goal</text><text x="490.0" y="310.9" font-size="12.5" font-weight="normal" fill="#14532d" text-anchor="middle">the single objective for the Sprint</text><rect x="660.0" y="66.0" width="300.0" height="46.0" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="810.0" y="93.5" font-size="14" font-weight="bold" fill="#78350f" text-anchor="middle">Increment</text><rect x="660.0" y="118.0" width="300.0" height="112.0" rx="8" fill="#ffffff" stroke="#d97706" stroke-width="1.5"/><text x="672.0" y="142.0" font-size="12" font-weight="normal" fill="#1f2937" text-anchor="start">A concrete, usable stepping stone toward the</text><text x="672.0" y="157.4" font-size="12" font-weight="normal" fill="#1f2937" text-anchor="start">Product Goal; additive to all prior Increments</text><line x1="810.0" y1="232.0" x2="810.0" y2="262.0" stroke="#6b7280" stroke-width="2" marker-end="url(#ah0)"/><rect x="660.0" y="264.0" width="300.0" height="70.0" rx="22" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="810.0" y="295.2" font-size="12.5" font-weight="bold" fill="#78350f" text-anchor="middle">Commitment: Definition of Done</text><text x="810.0" y="310.9" font-size="12.5" font-weight="normal" fill="#78350f" text-anchor="middle">the quality measures an Increment must meet</text><rect x="20.0" y="354.0" width="940.0" height="36.0" rx="8" fill="#1e3a8a" stroke="#1e3a8a" stroke-width="1.6"/><text x="490.0" y="376.1" font-size="12.5" font-weight="normal" fill="#ffffff" text-anchor="middle">Commitments reinforce empiricism and the Scrum values, and give everyone the same basis for adaptation</text></svg>