<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 506" width="980" height="506" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">Daily Scrum or status meeting</title><desc id="d">The Daily Scrum is the Developers' own 15-minute planning event toward the Sprint Goal that produces an actionable plan for the next day. A status meeting is a report to someone who oversees the work.</desc><defs></defs><rect x="0.75" y="0.75" width="978.5" height="504.5" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><text x="20.0" y="28.0" font-size="18" font-weight="bold" fill="#1f2937" text-anchor="start">Daily Scrum or status meeting?</text><text x="20.0" y="48.0" font-size="12" font-weight="normal" fill="#6b7280" text-anchor="start">The Daily Scrum is a planning event owned by the Developers, not a report to a manager</text><rect x="20.0" y="66.0" width="450.0" height="44.0" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="245.0" y="92.9" font-size="15" font-weight="bold" fill="#14532d" text-anchor="middle">Daily Scrum</text><rect x="510.0" y="66.0" width="450.0" height="44.0" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.6"/><text x="735.0" y="92.9" font-size="15" font-weight="bold" fill="#374151" text-anchor="middle">Status meeting</text><rect x="20.0" y="120.0" width="450.0" height="52.0" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.2"/><rect x="510.0" y="120.0" width="450.0" height="52.0" rx="8" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.2"/><text x="30.0" y="134.0" font-size="9.5" font-weight="bold" fill="#16a34a" text-anchor="start">PURPOSE</text><text x="30.0" y="150.0" font-size="12" font-weight="normal" fill="#1f2937" text-anchor="start">Plan the next day toward the Sprint Goal and adapt the Sprint Backlog</text><text x="520.0" y="134.0" font-size="9.5" font-weight="bold" fill="#6b7280" text-anchor="start">PURPOSE</text><text x="520.0" y="150.0" font-size="12" font-weight="normal" fill="#1f2937" text-anchor="start">Report what was done and compare it with a plan</text><text x="490.0" y="151.0" font-size="10.5" font-weight="bold" fill="#6b7280" text-anchor="middle">vs</text><rect x="20.0" y="178.0" width="450.0" height="52.0" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.2"/><rect x="510.0" y="178.0" width="450.0" height="52.0" rx="8" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.2"/><text x="30.0" y="192.0" font-size="9.5" font-weight="bold" fill="#16a34a" text-anchor="start">WHOSE EVENT</text><text x="30.0" y="208.0" font-size="12" font-weight="normal" fill="#1f2937" text-anchor="start">The Developers', for themselves</text><text x="520.0" y="192.0" font-size="9.5" font-weight="bold" fill="#6b7280" text-anchor="start">WHOSE EVENT</text><text x="520.0" y="208.0" font-size="12" font-weight="normal" fill="#1f2937" text-anchor="start">A manager's, who receives the reports</text><text x="490.0" y="209.0" font-size="10.5" font-weight="bold" fill="#6b7280" text-anchor="middle">vs</text><rect x="20.0" y="236.0" width="450.0" height="52.0" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.2"/><rect x="510.0" y="236.0" width="450.0" height="52.0" rx="8" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.2"/><text x="30.0" y="250.0" font-size="9.5" font-weight="bold" fill="#16a34a" text-anchor="start">INFORMATION FLOWS</text><text x="30.0" y="266.0" font-size="12" font-weight="normal" fill="#1f2937" text-anchor="start">Developers talk to each other</text><text x="520.0" y="250.0" font-size="9.5" font-weight="bold" fill="#6b7280" text-anchor="start">INFORMATION FLOWS</text><text x="520.0" y="266.0" font-size="12" font-weight="normal" fill="#1f2937" text-anchor="start">Each person reports upward</text><text x="490.0" y="267.0" font-size="10.5" font-weight="bold" fill="#6b7280" text-anchor="middle">vs</text><rect x="20.0" y="294.0" width="450.0" height="52.0" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.2"/><rect x="510.0" y="294.0" width="450.0" height="52.0" rx="8" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.2"/><text x="30.0" y="308.0" font-size="9.5" font-weight="bold" fill="#16a34a" text-anchor="start">OUTCOME</text><text x="30.0" y="324.0" font-size="12" font-weight="normal" fill="#1f2937" text-anchor="start">An actionable plan for the next day of work</text><text x="520.0" y="308.0" font-size="9.5" font-weight="bold" fill="#6b7280" text-anchor="start">OUTCOME</text><text x="520.0" y="324.0" font-size="12" font-weight="normal" fill="#1f2937" text-anchor="start">A status report and follow-up tasks</text><text x="490.0" y="325.0" font-size="10.5" font-weight="bold" fill="#6b7280" text-anchor="middle">vs</text><rect x="20.0" y="352.0" width="450.0" height="52.0" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.2"/><rect x="510.0" y="352.0" width="450.0" height="52.0" rx="8" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.2"/><text x="30.0" y="366.0" font-size="9.5" font-weight="bold" fill="#16a34a" text-anchor="start">STRUCTURE</text><text x="30.0" y="382.0" font-size="12" font-weight="normal" fill="#1f2937" text-anchor="start">Chosen by the Developers</text><text x="520.0" y="366.0" font-size="9.5" font-weight="bold" fill="#6b7280" text-anchor="start">STRUCTURE</text><text x="520.0" y="382.0" font-size="12" font-weight="normal" fill="#1f2937" text-anchor="start">Set by the manager</text><text x="490.0" y="383.0" font-size="10.5" font-weight="bold" fill="#6b7280" text-anchor="middle">vs</text><rect x="20.0" y="410.0" width="450.0" height="52.0" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.2"/><rect x="510.0" y="410.0" width="450.0" height="52.0" rx="8" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.2"/><text x="30.0" y="424.0" font-size="9.5" font-weight="bold" fill="#16a34a" text-anchor="start">TIME</text><text x="30.0" y="440.0" font-size="12" font-weight="normal" fill="#1f2937" text-anchor="start">15 minutes, same time and place, every working day</text><text x="520.0" y="424.0" font-size="9.5" font-weight="bold" fill="#6b7280" text-anchor="start">TIME</text><text x="520.0" y="440.0" font-size="12" font-weight="normal" fill="#1f2937" text-anchor="start">Often longer; no fixed rule</text><text x="490.0" y="441.0" font-size="10.5" font-weight="bold" fill="#6b7280" text-anchor="middle">vs</text><text x="490.0" y="494.0" font-size="11.8" font-weight="bold" fill="#14532d" text-anchor="middle">Status for outsiders is visible in the Sprint Backlog and the Increment, and inspected at the Sprint Review.</text></svg>