<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 440" width="980" height="440" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">The four Manifesto values and Scrum</title><desc id="d">Individuals and interactions map to a self-managing team guided by few rules; working software maps to the Increment and Definition of Done; customer collaboration maps to the Sprint Review and an ordered Product Backlog; responding to change maps to an emergent Product Backlog and inspect and adapt events.</desc><defs><marker id="ah0" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker></defs><rect x="0.75" y="0.75" width="978.5" height="438.5" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><text x="20.0" y="28.0" font-size="18" font-weight="bold" fill="#1f2937" text-anchor="start">The Agile Manifesto values and how Scrum reflects them</text><text x="20.0" y="48.0" font-size="12" font-weight="normal" fill="#6b7280" text-anchor="start">The authors value the items on the left more; the items on the right still have value</text><text x="20.0" y="82.0" font-size="12.5" font-weight="bold" fill="#6b7280" text-anchor="start">Manifesto: we value</text><text x="660.0" y="82.0" font-size="12.5" font-weight="bold" fill="#6b7280" text-anchor="start">Scrum reflects it with</text><rect x="20.0" y="92.0" width="250.0" height="70.0" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="145.0" y="131.4" font-size="13.5" font-weight="bold" fill="#1e3a8a" text-anchor="middle">Individuals and interactions</text><text x="280.0" y="130.0" font-size="12" font-weight="normal" fill="#6b7280" text-anchor="start" font-style="italic">over</text><rect x="318.0" y="100.0" width="250.0" height="54.0" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.2"/><text x="443.0" y="132.0" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">processes and tools</text><line x1="574.0" y1="127.0" x2="640.0" y2="127.0" stroke="#1f2937" stroke-width="2" marker-end="url(#ah0)"/><rect x="648.0" y="92.0" width="312.0" height="70.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="660.0" y="123.5" font-size="11.8" font-weight="normal" fill="#1f2937" text-anchor="start">Self-managing team; rules guide relationships and</text><text x="660.0" y="138.2" font-size="11.8" font-weight="normal" fill="#1f2937" text-anchor="start">interactions</text><rect x="20.0" y="174.0" width="250.0" height="70.0" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="145.0" y="213.4" font-size="13.5" font-weight="bold" fill="#14532d" text-anchor="middle">Working software</text><text x="280.0" y="212.0" font-size="12" font-weight="normal" fill="#6b7280" text-anchor="start" font-style="italic">over</text><rect x="318.0" y="182.0" width="250.0" height="54.0" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.2"/><text x="443.0" y="214.0" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">comprehensive documentation</text><line x1="574.0" y1="209.0" x2="640.0" y2="209.0" stroke="#1f2937" stroke-width="2" marker-end="url(#ah0)"/><rect x="648.0" y="174.0" width="312.0" height="70.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="660.0" y="205.5" font-size="11.8" font-weight="normal" fill="#1f2937" text-anchor="start">A usable Increment every Sprint that meets the</text><text x="660.0" y="220.2" font-size="11.8" font-weight="normal" fill="#1f2937" text-anchor="start">Definition of Done</text><rect x="20.0" y="256.0" width="250.0" height="70.0" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="145.0" y="295.4" font-size="13.5" font-weight="bold" fill="#78350f" text-anchor="middle">Customer collaboration</text><text x="280.0" y="294.0" font-size="12" font-weight="normal" fill="#6b7280" text-anchor="start" font-style="italic">over</text><rect x="318.0" y="264.0" width="250.0" height="54.0" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.2"/><text x="443.0" y="296.0" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">contract negotiation</text><line x1="574.0" y1="291.0" x2="640.0" y2="291.0" stroke="#1f2937" stroke-width="2" marker-end="url(#ah0)"/><rect x="648.0" y="256.0" width="312.0" height="70.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="660.0" y="287.5" font-size="11.8" font-weight="normal" fill="#1f2937" text-anchor="start">Sprint Review with stakeholders; the Product Owner</text><text x="660.0" y="302.2" font-size="11.8" font-weight="normal" fill="#1f2937" text-anchor="start">keeps the Product Backlog current</text><rect x="20.0" y="338.0" width="250.0" height="70.0" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.6"/><text x="145.0" y="377.4" font-size="13.5" font-weight="bold" fill="#4c1d95" text-anchor="middle">Responding to change</text><text x="280.0" y="376.0" font-size="12" font-weight="normal" fill="#6b7280" text-anchor="start" font-style="italic">over</text><rect x="318.0" y="346.0" width="250.0" height="54.0" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.2"/><text x="443.0" y="378.0" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">following a plan</text><line x1="574.0" y1="373.0" x2="640.0" y2="373.0" stroke="#1f2937" stroke-width="2" marker-end="url(#ah0)"/><rect x="648.0" y="338.0" width="312.0" height="70.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="660.0" y="369.5" font-size="11.8" font-weight="normal" fill="#1f2937" text-anchor="start">Emergent Product Backlog; every event inspects and</text><text x="660.0" y="384.2" font-size="11.8" font-weight="normal" fill="#1f2937" text-anchor="start">adapts; Sprint Backlog updated daily</text><text x="490.0" y="426.0" font-size="11.5" font-weight="bold" fill="#5b21b6" text-anchor="middle">The Manifesto is a mindset of 4 values and 12 principles; Scrum is a framework with accountabilities, events and artifacts.</text></svg>