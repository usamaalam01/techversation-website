<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 400" width="980" height="400" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">Shorter or longer Sprints</title><desc id="d">Shorter Sprints give more learning cycles and limit risk of cost and effort. A Sprint horizon that is too long may make the Sprint Goal invalid, raise complexity and increase risk. The maximum is one month.</desc><defs></defs><rect x="0.75" y="0.75" width="978.5" height="398.5" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><text x="20.0" y="28.0" font-size="18" font-weight="bold" fill="#1f2937" text-anchor="start">Choosing a Sprint length</text><text x="20.0" y="48.0" font-size="12" font-weight="normal" fill="#6b7280" text-anchor="start">Scrum Guide 2020: one month or less; shorter Sprints generate more learning cycles and limit risk</text><rect x="20.0" y="66.0" width="440.0" height="40.0" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="240.0" y="90.5" font-size="14" font-weight="bold" fill="#14532d" text-anchor="middle">Shorter Sprints</text><rect x="20.0" y="112.0" width="440.0" height="150.0" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/><text x="36.0" y="136.0" font-size="13" font-weight="bold" fill="#16a34a" text-anchor="start">•</text><text x="50.0" y="136.0" font-size="12" font-weight="normal" fill="#1f2937" text-anchor="start">More learning cycles and feedback</text><text x="36.0" y="159.0" font-size="13" font-weight="bold" fill="#16a34a" text-anchor="start">•</text><text x="50.0" y="159.0" font-size="12" font-weight="normal" fill="#1f2937" text-anchor="start">Cost and effort limited to a smaller time frame</text><text x="36.0" y="182.0" font-size="13" font-weight="bold" fill="#16a34a" text-anchor="start">•</text><text x="50.0" y="182.0" font-size="12" font-weight="normal" fill="#1f2937" text-anchor="start">The Sprint Goal stays valid</text><text x="36.0" y="205.0" font-size="13" font-weight="bold" fill="#16a34a" text-anchor="start">•</text><text x="50.0" y="205.0" font-size="12" font-weight="normal" fill="#1f2937" text-anchor="start">More events overall (more overhead)</text><rect x="520.0" y="66.0" width="440.0" height="40.0" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="740.0" y="90.5" font-size="14" font-weight="bold" fill="#78350f" text-anchor="middle">Longer Sprints (never above one month)</text><rect x="520.0" y="112.0" width="440.0" height="150.0" rx="8" fill="#ffffff" stroke="#d97706" stroke-width="1.5"/><text x="536.0" y="136.0" font-size="13" font-weight="bold" fill="#d97706" text-anchor="start">•</text><text x="550.0" y="136.0" font-size="12" font-weight="normal" fill="#1f2937" text-anchor="start">Larger bets before feedback</text><text x="536.0" y="159.0" font-size="13" font-weight="bold" fill="#d97706" text-anchor="start">•</text><text x="550.0" y="159.0" font-size="12" font-weight="normal" fill="#1f2937" text-anchor="start">The Sprint Goal may become invalid</text><text x="536.0" y="182.0" font-size="13" font-weight="bold" fill="#d97706" text-anchor="start">•</text><text x="550.0" y="182.0" font-size="12" font-weight="normal" fill="#1f2937" text-anchor="start">Complexity may rise and risk may increase</text><text x="536.0" y="205.0" font-size="13" font-weight="bold" fill="#d97706" text-anchor="start">•</text><text x="550.0" y="205.0" font-size="12" font-weight="normal" fill="#1f2937" text-anchor="start">Fewer events, but fewer chances to adapt</text><rect x="20.0" y="284.0" width="940.0" height="54.0" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.6"/><text x="490.0" y="314.9" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">Weigh: how fast feedback is needed and needs change, uncertainty and risk, how long a usable Increment takes, stakeholder availability, event overhead, team experience</text><text x="490.0" y="366.0" font-size="11.8" font-weight="bold" fill="#374151" text-anchor="middle">Pick the shortest length in which the team can regularly finish a usable Increment, and keep it fixed. Two weeks is a common practice, not a rule.</text></svg>