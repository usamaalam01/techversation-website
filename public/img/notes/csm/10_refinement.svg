<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 420" width="980" height="420" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">Refinement turns big, vague items into small, clear items</title><desc id="d">Refinement is an ongoing activity that breaks down and further defines Product Backlog items. Items that can be Done within one Sprint are ready for selection in Sprint Planning.</desc><defs><marker id="ah0" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker><marker id="ah1" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker></defs><rect x="0.75" y="0.75" width="978.5" height="418.5" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><text x="20.0" y="28.0" font-size="18" font-weight="bold" fill="#1f2937" text-anchor="start">Product Backlog refinement</text><text x="20.0" y="48.0" font-size="12" font-weight="normal" fill="#6b7280" text-anchor="start">Scrum Guide 2020: breaking down and further defining items into smaller, more precise items; an ongoing activity</text><rect x="20.0" y="76.0" width="250.0" height="120.0" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.6"/><text x="145.0" y="124.4" font-size="12.5" font-weight="bold" fill="#374151" text-anchor="middle">Large or vague item</text><text x="145.0" y="140.1" font-size="12.5" font-weight="normal" fill="#374151" text-anchor="middle">hard to size, cannot be Done in one</text><text x="145.0" y="155.7" font-size="12.5" font-weight="normal" fill="#374151" text-anchor="middle">Sprint</text><rect x="365.0" y="76.0" width="250.0" height="120.0" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.6"/><text x="490.0" y="124.4" font-size="12.5" font-weight="bold" fill="#4c1d95" text-anchor="middle">Refinement</text><text x="490.0" y="140.1" font-size="12.5" font-weight="normal" fill="#4c1d95" text-anchor="middle">an ongoing activity, as needed, during the</text><text x="490.0" y="155.7" font-size="12.5" font-weight="normal" fill="#4c1d95" text-anchor="middle">Sprint or in Planning</text><rect x="710.0" y="76.0" width="250.0" height="120.0" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="835.0" y="124.4" font-size="12.5" font-weight="bold" fill="#14532d" text-anchor="middle">Ready for selection</text><text x="835.0" y="140.1" font-size="12.5" font-weight="normal" fill="#14532d" text-anchor="middle">smaller, clearer, can be Done by the</text><text x="835.0" y="155.7" font-size="12.5" font-weight="normal" fill="#14532d" text-anchor="middle">Scrum Team within one Sprint</text><line x1="272.0" y1="136.0" x2="363.0" y2="136.0" stroke="#1f2937" stroke-width="2.4" marker-end="url(#ah0)"/><line x1="617.0" y1="136.0" x2="708.0" y2="136.0" stroke="#1f2937" stroke-width="2.4" marker-end="url(#ah0)"/><line x1="835.0" y1="198.0" x2="835.0" y2="236.0" stroke="#16a34a" stroke-width="2.2" marker-end="url(#ah1)"/><rect x="710.0" y="238.0" width="250.0" height="40.0" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="835.0" y="262.1" font-size="12.5" font-weight="bold" fill="#1e3a8a" text-anchor="middle">Sprint Planning: Topic Two</text><text x="20.0" y="226.0" font-size="12" font-weight="bold" fill="#6b7280" text-anchor="start">Typical activities</text><rect x="20.0" y="238.0" width="105.1" height="21.5" rx="10.75" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.2"/><text x="72.6" y="251.0" font-size="11.5" font-weight="bold" fill="#4c1d95" text-anchor="middle">Split large items</text><rect x="135.1" y="238.0" width="71.7" height="21.5" rx="10.75" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.2"/><text x="171.0" y="251.0" font-size="11.5" font-weight="bold" fill="#4c1d95" text-anchor="middle">Add detail</text><rect x="216.8" y="238.0" width="112.1" height="21.5" rx="10.75" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.2"/><text x="272.9" y="251.0" font-size="11.5" font-weight="bold" fill="#4c1d95" text-anchor="middle">Size (Developers)</text><rect x="338.9" y="238.0" width="140.8" height="21.5" rx="10.75" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.2"/><text x="409.3" y="251.0" font-size="11.5" font-weight="bold" fill="#4c1d95" text-anchor="middle">Order (Product Owner)</text><rect x="489.7" y="238.0" width="152.5" height="21.5" rx="10.75" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.2"/><text x="566.0" y="251.0" font-size="11.5" font-weight="bold" fill="#4c1d95" text-anchor="middle">Clarify with stakeholders</text><rect x="20.0" y="272.0" width="144.8" height="21.5" rx="10.75" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.2"/><text x="92.4" y="285.0" font-size="11.5" font-weight="bold" fill="#4c1d95" text-anchor="middle">Remove obsolete items</text><rect x="20.0" y="318.0" width="940.0" height="80.0" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.6"/><text x="490.0" y="346.9" font-size="12" font-weight="bold" fill="#374151" text-anchor="middle">Who</text><text x="490.0" y="361.9" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">The Product Owner is accountable for the Product Backlog and for making it transparent. The Developers who will do the work size the items. The Scrum Team decides how</text><text x="490.0" y="376.9" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">and when to refine; the Guide sets no time allocation and no format.</text></svg>