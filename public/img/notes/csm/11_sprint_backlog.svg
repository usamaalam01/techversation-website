<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 380" width="980" height="380" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">The Sprint Backlog</title><desc id="d">The Sprint Backlog is the Sprint Goal (why), the selected Product Backlog items (what) and an actionable plan (how), a plan by and for the Developers, visible and updated throughout the Sprint.</desc><defs></defs><rect x="0.75" y="0.75" width="978.5" height="378.5" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><text x="20.0" y="28.0" font-size="18" font-weight="bold" fill="#1f2937" text-anchor="start">The Sprint Backlog: why, what and how</text><text x="20.0" y="48.0" font-size="12" font-weight="normal" fill="#6b7280" text-anchor="start">Scrum Guide 2020: a plan by and for the Developers, updated throughout the Sprint</text><rect x="20.0" y="70.0" width="300.0" height="44.0" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="170.0" y="96.2" font-size="13" font-weight="bold" fill="#1e3a8a" text-anchor="middle">WHY: Sprint Goal</text><rect x="20.0" y="120.0" width="300.0" height="74.0" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/><text x="32.0" y="144.0" font-size="12" font-weight="normal" fill="#1f2937" text-anchor="start">The single objective of the Sprint; the commitment</text><rect x="340.0" y="70.0" width="300.0" height="44.0" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="490.0" y="96.2" font-size="13" font-weight="bold" fill="#14532d" text-anchor="middle">WHAT: Selected Product Backlog items</text><rect x="340.0" y="120.0" width="300.0" height="74.0" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/><text x="352.0" y="144.0" font-size="12" font-weight="normal" fill="#1f2937" text-anchor="start">The items the Developers select in discussion with</text><text x="352.0" y="159.4" font-size="12" font-weight="normal" fill="#1f2937" text-anchor="start">the Product Owner</text><rect x="660.0" y="70.0" width="300.0" height="44.0" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.6"/><text x="810.0" y="96.2" font-size="13" font-weight="bold" fill="#4c1d95" text-anchor="middle">HOW: Actionable plan</text><rect x="660.0" y="120.0" width="300.0" height="74.0" rx="8" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/><text x="672.0" y="144.0" font-size="12" font-weight="normal" fill="#1f2937" text-anchor="start">The work to create an Increment that meets the</text><text x="672.0" y="159.4" font-size="12" font-weight="normal" fill="#1f2937" text-anchor="start">Definition of Done</text><rect x="20.0" y="214.0" width="940.0" height="56.0" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/><text x="490.0" y="238.0" font-size="12.5" font-weight="bold" fill="#78350f" text-anchor="middle">Highly visible, real-time picture of the work; updated throughout the Sprint as more is learned</text><text x="490.0" y="258.0" font-size="12" font-weight="normal" fill="#78350f" text-anchor="middle">with enough detail that the Developers can inspect their progress in the Daily Scrum</text><rect x="20.0" y="288.0" width="460.0" height="60.0" rx="8" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.6"/><text x="250.0" y="314.4" font-size="12" font-weight="bold" fill="#134e4a" text-anchor="middle">Owned by the Developers</text><text x="250.0" y="329.4" font-size="12" font-weight="normal" fill="#134e4a" text-anchor="middle">they update it; the Product Owner negotiates scope with them</text><rect x="500.0" y="288.0" width="460.0" height="60.0" rx="8" fill="#1e3a8a" stroke="#1e3a8a" stroke-width="1.6"/><text x="730.0" y="314.4" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">Commitment: the Sprint Goal</text><text x="730.0" y="329.4" font-size="12" font-weight="normal" fill="#ffffff" text-anchor="middle">flexible about the exact work, fixed during the Sprint</text></svg>