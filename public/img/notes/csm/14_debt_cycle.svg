<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 430" width="980" height="430" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">The technical debt cycle</title><desc id="d">Shortcuts create technical debt, debt slows delivery and raises defects, pressure grows and more shortcuts follow. A strong Definition of Done, visibility and engineering practices break the cycle.</desc><defs><marker id="ah0" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker></defs><rect x="0.75" y="0.75" width="978.5" height="428.5" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><text x="20.0" y="28.0" font-size="18" font-weight="bold" fill="#1f2937" text-anchor="start">The technical debt cycle</text><text x="20.0" y="48.0" font-size="12" font-weight="normal" fill="#6b7280" text-anchor="start">Not in the Scrum Guide: an exam-practice view of why quality is built in every Sprint</text><rect x="60.0" y="100.0" width="250.0" height="76.0" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="185.0" y="134.4" font-size="12" font-weight="bold" fill="#78350f" text-anchor="middle">Shortcuts: tests skipped, quick fixes,</text><text x="185.0" y="149.4" font-size="12" font-weight="bold" fill="#78350f" text-anchor="middle">Definition of Done relaxed</text><rect x="380.0" y="100.0" width="250.0" height="76.0" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.6"/><text x="505.0" y="134.4" font-size="12" font-weight="bold" fill="#7f1d1d" text-anchor="middle">Technical debt grows: code is harder to</text><text x="505.0" y="149.4" font-size="12" font-weight="bold" fill="#7f1d1d" text-anchor="middle">change</text><rect x="700.0" y="100.0" width="250.0" height="76.0" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.6"/><text x="825.0" y="134.4" font-size="12" font-weight="bold" fill="#7f1d1d" text-anchor="middle">Delivery slows, defects rise, cost of</text><text x="825.0" y="149.4" font-size="12" font-weight="bold" fill="#7f1d1d" text-anchor="middle">change grows</text><rect x="700.0" y="214.0" width="250.0" height="76.0" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="825.0" y="255.9" font-size="12" font-weight="bold" fill="#78350f" text-anchor="middle">Pressure to deliver grows</text><line x1="312.0" y1="138.0" x2="378.0" y2="138.0" stroke="#1f2937" stroke-width="2.4" marker-end="url(#ah0)"/><line x1="632.0" y1="138.0" x2="698.0" y2="138.0" stroke="#1f2937" stroke-width="2.4" marker-end="url(#ah0)"/><line x1="825.0" y1="178.0" x2="825.0" y2="212.0" stroke="#1f2937" stroke-width="2.4" marker-end="url(#ah0)"/><polyline points="698.0,252.0 185.0,252.0 185.0,178.0" fill="none" stroke="#1f2937" stroke-width="2.4" marker-end="url(#ah0)" stroke-linejoin="round"/><text x="440.0" y="242.0" font-size="11.5" font-weight="bold" fill="#6b7280" text-anchor="middle">so the team takes more shortcuts</text><rect x="20.0" y="312.0" width="940.0" height="96.0" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="490.0" y="348.4" font-size="12.5" font-weight="bold" fill="#14532d" text-anchor="middle">How Scrum breaks the cycle</text><text x="490.0" y="364.1" font-size="12.5" font-weight="normal" fill="#14532d" text-anchor="middle">A strong Definition of Done (quality does not decrease) · debt made visible, so the Product Owner can order it with other items · engineering practices (automated</text><text x="490.0" y="379.7" font-size="12.5" font-weight="normal" fill="#14532d" text-anchor="middle">tests, continuous integration, refactoring) · no hardening Sprints: all necessary work happens in every Sprint</text></svg>