<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 400" width="980" height="400" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">The five events in one Sprint</title><desc id="d">A Sprint of one month or less starts with Sprint Planning, has a Daily Scrum every working day, and ends with the Sprint Review (second to last) and the Sprint Retrospective (which concludes the Sprint). The next Sprint starts immediately.</desc><defs><marker id="ah0" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker></defs><rect x="0.75" y="0.75" width="978.5" height="398.5" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><text x="20.0" y="28.0" font-size="18" font-weight="bold" fill="#1f2937" text-anchor="start">The five events in one Sprint (not to scale)</text><text x="20.0" y="48.0" font-size="12" font-weight="normal" fill="#6b7280" text-anchor="start">Scrum Guide 2020: the Sprint contains Sprint Planning, Daily Scrums, the Sprint Review and the Sprint Retrospective</text><rect x="20.0" y="66.0" width="940.0" height="170.0" rx="12" fill="#faf5ff" stroke="#7c3aed" stroke-width="2" stroke-dasharray="8 5"/><text x="34.0" y="88.0" font-size="12.5" font-weight="bold" fill="#5b21b6" text-anchor="start">THE SPRINT: one month or less, fixed length</text><rect x="34.0" y="100.0" width="150.0" height="100.0" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="109.0" y="138.9" font-size="12" font-weight="bold" fill="#1e3a8a" text-anchor="middle">Sprint Planning</text><text x="109.0" y="153.9" font-size="12" font-weight="normal" fill="#1e3a8a" text-anchor="middle">starts the Sprint</text><text x="109.0" y="168.9" font-size="12" font-weight="bold" fill="#1e3a8a" text-anchor="middle">max 8 hours</text><rect x="200.0" y="100.0" width="540.0" height="100.0" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/><text x="470.0" y="120.0" font-size="12" font-weight="bold" fill="#14532d" text-anchor="middle">Work to create the Increment, with a Daily Scrum on every working day</text><rect x="216.0" y="136.0" width="28.0" height="36.0" rx="5" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/><text x="230.0" y="158.0" font-size="10.5" font-weight="bold" fill="#14532d" text-anchor="middle">DS</text><rect x="254.0" y="136.0" width="28.0" height="36.0" rx="5" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/><text x="268.0" y="158.0" font-size="10.5" font-weight="bold" fill="#14532d" text-anchor="middle">DS</text><rect x="292.0" y="136.0" width="28.0" height="36.0" rx="5" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/><text x="306.0" y="158.0" font-size="10.5" font-weight="bold" fill="#14532d" text-anchor="middle">DS</text><rect x="330.0" y="136.0" width="28.0" height="36.0" rx="5" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/><text x="344.0" y="158.0" font-size="10.5" font-weight="bold" fill="#14532d" text-anchor="middle">DS</text><rect x="368.0" y="136.0" width="28.0" height="36.0" rx="5" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/><text x="382.0" y="158.0" font-size="10.5" font-weight="bold" fill="#14532d" text-anchor="middle">DS</text><rect x="406.0" y="136.0" width="28.0" height="36.0" rx="5" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/><text x="420.0" y="158.0" font-size="10.5" font-weight="bold" fill="#14532d" text-anchor="middle">DS</text><rect x="444.0" y="136.0" width="28.0" height="36.0" rx="5" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/><text x="458.0" y="158.0" font-size="10.5" font-weight="bold" fill="#14532d" text-anchor="middle">DS</text><rect x="482.0" y="136.0" width="28.0" height="36.0" rx="5" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/><text x="496.0" y="158.0" font-size="10.5" font-weight="bold" fill="#14532d" text-anchor="middle">DS</text><rect x="520.0" y="136.0" width="28.0" height="36.0" rx="5" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/><text x="534.0" y="158.0" font-size="10.5" font-weight="bold" fill="#14532d" text-anchor="middle">DS</text><rect x="558.0" y="136.0" width="28.0" height="36.0" rx="5" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/><text x="572.0" y="158.0" font-size="10.5" font-weight="bold" fill="#14532d" text-anchor="middle">DS</text><rect x="596.0" y="136.0" width="28.0" height="36.0" rx="5" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/><text x="610.0" y="158.0" font-size="10.5" font-weight="bold" fill="#14532d" text-anchor="middle">DS</text><rect x="634.0" y="136.0" width="28.0" height="36.0" rx="5" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/><text x="648.0" y="158.0" font-size="10.5" font-weight="bold" fill="#14532d" text-anchor="middle">DS</text><rect x="672.0" y="136.0" width="28.0" height="36.0" rx="5" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/><text x="686.0" y="158.0" font-size="10.5" font-weight="bold" fill="#14532d" text-anchor="middle">DS</text><rect x="710.0" y="136.0" width="28.0" height="36.0" rx="5" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/><text x="724.0" y="158.0" font-size="10.5" font-weight="bold" fill="#14532d" text-anchor="middle">DS</text><text x="470.0" y="192.0" font-size="11.5" font-weight="normal" fill="#14532d" text-anchor="middle">Daily Scrum: 15 minutes, Developers, same time and place</text><rect x="748.0" y="100.0" width="96.0" height="100.0" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="796.0" y="139.4" font-size="11.5" font-weight="bold" fill="#1e3a8a" text-anchor="middle">Sprint Review</text><text x="796.0" y="153.7" font-size="11.5" font-weight="normal" fill="#1e3a8a" text-anchor="middle">second to last</text><text x="796.0" y="168.1" font-size="11.5" font-weight="bold" fill="#1e3a8a" text-anchor="middle">max 4 hours</text><rect x="850.0" y="100.0" width="100.0" height="100.0" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="900.0" y="132.9" font-size="11" font-weight="bold" fill="#1e3a8a" text-anchor="middle">Sprint</text><text x="900.0" y="146.7" font-size="11" font-weight="bold" fill="#1e3a8a" text-anchor="middle">Retrospective</text><text x="900.0" y="160.4" font-size="11" font-weight="normal" fill="#1e3a8a" text-anchor="middle">concludes</text><text x="900.0" y="174.2" font-size="11" font-weight="bold" fill="#1e3a8a" text-anchor="middle">max 3 hours</text><text x="470.0" y="224.0" font-size="11.5" font-weight="normal" fill="#6b7280" text-anchor="middle" font-style="italic">Refinement of the Product Backlog goes on during the Sprint as needed (an activity, not an event)</text><line x1="900.0" y1="238.0" x2="900.0" y2="268.0" stroke="#7c3aed" stroke-width="2.2" marker-end="url(#ah0)"/><rect x="700.0" y="270.0" width="260.0" height="40.0" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.6"/><text x="830.0" y="294.1" font-size="12.5" font-weight="normal" fill="#4c1d95" text-anchor="middle">The next Sprint starts immediately</text><rect x="20.0" y="270.0" width="660.0" height="40.0" rx="8" fill="#1e3a8a" stroke="#1e3a8a" stroke-width="1.6"/><text x="350.0" y="294.1" font-size="12.5" font-weight="normal" fill="#ffffff" text-anchor="middle">Each event is a formal opportunity to inspect and adapt; skipping one loses it</text><text x="490.0" y="346.0" font-size="12" font-weight="normal" fill="#6b7280" text-anchor="middle">Maximum timeboxes are for a one-month Sprint. For shorter Sprints, Planning, Review and Retrospective are usually shorter.</text><text x="490.0" y="368.0" font-size="12" font-weight="bold" fill="#14532d" text-anchor="middle">The Daily Scrum is always 15 minutes.</text></svg>