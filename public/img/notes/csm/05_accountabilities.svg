<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 470" width="980" height="470" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">Three accountabilities in one Scrum Team</title><desc id="d">Developers, Product Owner and Scrum Master each have specific accountabilities; the whole Scrum Team is accountable for creating a valuable, useful Increment every Sprint.</desc><defs></defs><rect x="0.75" y="0.75" width="978.5" height="468.5" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><text x="20.0" y="28.0" font-size="18" font-weight="bold" fill="#1f2937" text-anchor="start">Three accountabilities, one Scrum Team</text><text x="20.0" y="48.0" font-size="12" font-weight="normal" fill="#6b7280" text-anchor="start">Scrum Guide 2020: no sub-teams, no hierarchies; the Scrum Master is neither the team's manager nor its project manager</text><rect x="20.0" y="66.0" width="300.0" height="46.0" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="170.0" y="93.2" font-size="13" font-weight="bold" fill="#1e3a8a" text-anchor="middle">Developers</text><rect x="20.0" y="118.0" width="300.0" height="240.0" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/><text x="32.0" y="140.0" font-size="13" font-weight="bold" fill="#2563eb" text-anchor="start">•</text><text x="46.0" y="140.0" font-size="11.8" font-weight="normal" fill="#1f2937" text-anchor="start">Create the plan for the Sprint: the Sprint Backlog</text><text x="32.0" y="162.8" font-size="13" font-weight="bold" fill="#2563eb" text-anchor="start">•</text><text x="46.0" y="162.8" font-size="11.8" font-weight="normal" fill="#1f2937" text-anchor="start">Instil quality by adhering to the Definition of Done</text><text x="32.0" y="185.5" font-size="13" font-weight="bold" fill="#2563eb" text-anchor="start">•</text><text x="46.0" y="185.5" font-size="11.8" font-weight="normal" fill="#1f2937" text-anchor="start">Adapt their plan each day toward the Sprint Goal</text><text x="32.0" y="208.2" font-size="13" font-weight="bold" fill="#2563eb" text-anchor="start">•</text><text x="46.0" y="208.2" font-size="11.8" font-weight="normal" fill="#1f2937" text-anchor="start">Hold each other accountable as professionals</text><text x="32.0" y="231.0" font-size="13" font-weight="bold" fill="#2563eb" text-anchor="start">•</text><text x="46.0" y="231.0" font-size="11.8" font-weight="normal" fill="#1f2937" text-anchor="start">Decide how to turn Product Backlog items into</text><text x="46.0" y="245.8" font-size="11.8" font-weight="normal" fill="#1f2937" text-anchor="start">Increments, at their sole discretion</text><rect x="340.0" y="66.0" width="300.0" height="46.0" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="490.0" y="93.2" font-size="13" font-weight="bold" fill="#14532d" text-anchor="middle">Product Owner</text><rect x="340.0" y="118.0" width="300.0" height="240.0" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/><text x="352.0" y="140.0" font-size="13" font-weight="bold" fill="#16a34a" text-anchor="start">•</text><text x="366.0" y="140.0" font-size="11.8" font-weight="normal" fill="#1f2937" text-anchor="start">Maximizes the value of the product</text><text x="352.0" y="162.8" font-size="13" font-weight="bold" fill="#16a34a" text-anchor="start">•</text><text x="366.0" y="162.8" font-size="11.8" font-weight="normal" fill="#1f2937" text-anchor="start">Develops and communicates the Product Goal</text><text x="352.0" y="185.5" font-size="13" font-weight="bold" fill="#16a34a" text-anchor="start">•</text><text x="366.0" y="185.5" font-size="11.8" font-weight="normal" fill="#1f2937" text-anchor="start">Creates and communicates Product Backlog items</text><text x="352.0" y="208.2" font-size="13" font-weight="bold" fill="#16a34a" text-anchor="start">•</text><text x="366.0" y="208.2" font-size="11.8" font-weight="normal" fill="#1f2937" text-anchor="start">Orders Product Backlog items</text><text x="352.0" y="231.0" font-size="13" font-weight="bold" fill="#16a34a" text-anchor="start">•</text><text x="366.0" y="231.0" font-size="11.8" font-weight="normal" fill="#1f2937" text-anchor="start">Makes the Product Backlog transparent, visible</text><text x="366.0" y="245.8" font-size="11.8" font-weight="normal" fill="#1f2937" text-anchor="start">and understood</text><text x="352.0" y="268.5" font-size="13" font-weight="bold" fill="#16a34a" text-anchor="start">•</text><text x="366.0" y="268.5" font-size="11.8" font-weight="normal" fill="#1f2937" text-anchor="start">Is one person, not a committee; only the Product</text><text x="366.0" y="283.2" font-size="11.8" font-weight="normal" fill="#1f2937" text-anchor="start">Owner can cancel a Sprint</text><rect x="660.0" y="66.0" width="300.0" height="46.0" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.6"/><text x="810.0" y="93.2" font-size="13" font-weight="bold" fill="#4c1d95" text-anchor="middle">Scrum Master</text><rect x="660.0" y="118.0" width="300.0" height="240.0" rx="8" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/><text x="672.0" y="140.0" font-size="13" font-weight="bold" fill="#7c3aed" text-anchor="start">•</text><text x="686.0" y="140.0" font-size="11.8" font-weight="normal" fill="#1f2937" text-anchor="start">Establishes Scrum as defined in the Scrum Guide</text><text x="672.0" y="162.8" font-size="13" font-weight="bold" fill="#7c3aed" text-anchor="start">•</text><text x="686.0" y="162.8" font-size="11.8" font-weight="normal" fill="#1f2937" text-anchor="start">Is accountable for the Scrum Team's effectiveness</text><text x="672.0" y="185.5" font-size="13" font-weight="bold" fill="#7c3aed" text-anchor="start">•</text><text x="686.0" y="185.5" font-size="11.8" font-weight="normal" fill="#1f2937" text-anchor="start">Serves the team, the Product Owner and the</text><text x="686.0" y="200.2" font-size="11.8" font-weight="normal" fill="#1f2937" text-anchor="start">organization</text><text x="672.0" y="223.0" font-size="13" font-weight="bold" fill="#7c3aed" text-anchor="start">•</text><text x="686.0" y="223.0" font-size="11.8" font-weight="normal" fill="#1f2937" text-anchor="start">Is a true leader who serves; the team has no</text><text x="686.0" y="237.8" font-size="11.8" font-weight="normal" fill="#1f2937" text-anchor="start">hierarchy</text><rect x="20.0" y="380.0" width="940.0" height="62.0" rx="8" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.6"/><text x="490.0" y="399.9" font-size="12" font-weight="bold" fill="#134e4a" text-anchor="middle">Whole Scrum Team</text><text x="490.0" y="414.9" font-size="12" font-weight="normal" fill="#134e4a" text-anchor="middle">Accountable for creating a valuable, useful Increment every Sprint, and responsible for all product-related activities: stakeholder collaboration, verification, maintenance,</text><text x="490.0" y="429.9" font-size="12" font-weight="normal" fill="#134e4a" text-anchor="middle">operation, experimentation, research and development</text></svg>