<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 500" width="980" height="500" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">The Scrum Master serves three audiences</title><desc id="d">The Scrum Master is accountable for establishing Scrum and for the Scrum Team's effectiveness, and serves the Scrum Team, the Product Owner and the organization.</desc><defs><marker id="ah0" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker></defs><rect x="0.75" y="0.75" width="978.5" height="498.5" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><text x="20.0" y="28.0" font-size="18" font-weight="bold" fill="#1f2937" text-anchor="start">The Scrum Master serves three audiences</text><text x="20.0" y="48.0" font-size="12" font-weight="normal" fill="#6b7280" text-anchor="start">Scrum Guide 2020, Scrum Master section: a true leader who serves the Scrum Team and the larger organization</text><rect x="180.0" y="62.0" width="620.0" height="40.0" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.6"/><text x="490.0" y="86.2" font-size="13" font-weight="bold" fill="#4c1d95" text-anchor="middle">Scrum Master: accountable for</text><rect x="180.0" y="104.0" width="306.0" height="62.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="333.0" y="131.6" font-size="11.5" font-weight="normal" fill="#1f2937" text-anchor="middle">Establishing Scrum as defined in the Scrum Guide, by</text><text x="333.0" y="145.9" font-size="11.5" font-weight="normal" fill="#1f2937" text-anchor="middle">helping everyone understand Scrum theory and practice</text><rect x="494.0" y="104.0" width="306.0" height="62.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="647.0" y="131.6" font-size="11.5" font-weight="normal" fill="#1f2937" text-anchor="middle">The Scrum Team's effectiveness, by enabling the team</text><text x="647.0" y="145.9" font-size="11.5" font-weight="normal" fill="#1f2937" text-anchor="middle">to improve its practices within the Scrum framework</text><rect x="20.0" y="196.0" width="300.0" height="46.0" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="170.0" y="223.2" font-size="13" font-weight="bold" fill="#1e3a8a" text-anchor="middle">Serves the Scrum Team</text><rect x="20.0" y="248.0" width="300.0" height="205.0" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/><text x="32.0" y="270.0" font-size="13" font-weight="bold" fill="#2563eb" text-anchor="start">•</text><text x="46.0" y="270.0" font-size="11.8" font-weight="normal" fill="#1f2937" text-anchor="start">Coaches members in self-management and</text><text x="46.0" y="284.8" font-size="11.8" font-weight="normal" fill="#1f2937" text-anchor="start">cross-functionality</text><text x="32.0" y="307.5" font-size="13" font-weight="bold" fill="#2563eb" text-anchor="start">•</text><text x="46.0" y="307.5" font-size="11.8" font-weight="normal" fill="#1f2937" text-anchor="start">Helps the team focus on high-value Increments</text><text x="46.0" y="322.2" font-size="11.8" font-weight="normal" fill="#1f2937" text-anchor="start">that meet the Definition of Done</text><text x="32.0" y="345.0" font-size="13" font-weight="bold" fill="#2563eb" text-anchor="start">•</text><text x="46.0" y="345.0" font-size="11.8" font-weight="normal" fill="#1f2937" text-anchor="start">Causes the removal of impediments to the team's</text><text x="46.0" y="359.8" font-size="11.8" font-weight="normal" fill="#1f2937" text-anchor="start">progress</text><text x="32.0" y="382.5" font-size="13" font-weight="bold" fill="#2563eb" text-anchor="start">•</text><text x="46.0" y="382.5" font-size="11.8" font-weight="normal" fill="#1f2937" text-anchor="start">Ensures all Scrum events take place and are</text><text x="46.0" y="397.2" font-size="11.8" font-weight="normal" fill="#1f2937" text-anchor="start">positive, productive and within the timebox</text><rect x="340.0" y="196.0" width="300.0" height="46.0" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="490.0" y="223.2" font-size="13" font-weight="bold" fill="#14532d" text-anchor="middle">Serves the Product Owner</text><rect x="340.0" y="248.0" width="300.0" height="205.0" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/><text x="352.0" y="270.0" font-size="13" font-weight="bold" fill="#16a34a" text-anchor="start">•</text><text x="366.0" y="270.0" font-size="11.8" font-weight="normal" fill="#1f2937" text-anchor="start">Helps find techniques for effective Product Goal</text><text x="366.0" y="284.8" font-size="11.8" font-weight="normal" fill="#1f2937" text-anchor="start">definition and Product Backlog management</text><text x="352.0" y="307.5" font-size="13" font-weight="bold" fill="#16a34a" text-anchor="start">•</text><text x="366.0" y="307.5" font-size="11.8" font-weight="normal" fill="#1f2937" text-anchor="start">Helps the team understand the need for clear and</text><text x="366.0" y="322.2" font-size="11.8" font-weight="normal" fill="#1f2937" text-anchor="start">concise Product Backlog items</text><text x="352.0" y="345.0" font-size="13" font-weight="bold" fill="#16a34a" text-anchor="start">•</text><text x="366.0" y="345.0" font-size="11.8" font-weight="normal" fill="#1f2937" text-anchor="start">Helps establish empirical product planning for a</text><text x="366.0" y="359.8" font-size="11.8" font-weight="normal" fill="#1f2937" text-anchor="start">complex environment</text><text x="352.0" y="382.5" font-size="13" font-weight="bold" fill="#16a34a" text-anchor="start">•</text><text x="366.0" y="382.5" font-size="11.8" font-weight="normal" fill="#1f2937" text-anchor="start">Facilitates stakeholder collaboration as requested</text><text x="366.0" y="397.2" font-size="11.8" font-weight="normal" fill="#1f2937" text-anchor="start">or needed</text><rect x="660.0" y="196.0" width="300.0" height="46.0" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="810.0" y="223.2" font-size="13" font-weight="bold" fill="#78350f" text-anchor="middle">Serves the organization</text><rect x="660.0" y="248.0" width="300.0" height="205.0" rx="8" fill="#ffffff" stroke="#d97706" stroke-width="1.5"/><text x="672.0" y="270.0" font-size="13" font-weight="bold" fill="#d97706" text-anchor="start">•</text><text x="686.0" y="270.0" font-size="11.8" font-weight="normal" fill="#1f2937" text-anchor="start">Leads, trains and coaches the organization in its</text><text x="686.0" y="284.8" font-size="11.8" font-weight="normal" fill="#1f2937" text-anchor="start">Scrum adoption</text><text x="672.0" y="307.5" font-size="13" font-weight="bold" fill="#d97706" text-anchor="start">•</text><text x="686.0" y="307.5" font-size="11.8" font-weight="normal" fill="#1f2937" text-anchor="start">Plans and advises Scrum implementations</text><text x="672.0" y="330.2" font-size="13" font-weight="bold" fill="#d97706" text-anchor="start">•</text><text x="686.0" y="330.2" font-size="11.8" font-weight="normal" fill="#1f2937" text-anchor="start">Helps employees and stakeholders understand</text><text x="686.0" y="345.0" font-size="11.8" font-weight="normal" fill="#1f2937" text-anchor="start">and enact an empirical approach to complex work</text><text x="672.0" y="367.8" font-size="13" font-weight="bold" fill="#d97706" text-anchor="start">•</text><text x="686.0" y="367.8" font-size="11.8" font-weight="normal" fill="#1f2937" text-anchor="start">Removes barriers between stakeholders and</text><text x="686.0" y="382.5" font-size="11.8" font-weight="normal" fill="#1f2937" text-anchor="start">Scrum Teams</text><line x1="490.0" y1="168.0" x2="170.0" y2="194.0" stroke="#6b7280" stroke-width="1.6" marker-end="url(#ah0)"/><line x1="490.0" y1="168.0" x2="490.0" y2="194.0" stroke="#6b7280" stroke-width="1.6" marker-end="url(#ah0)"/><line x1="490.0" y1="168.0" x2="810.0" y2="194.0" stroke="#6b7280" stroke-width="1.6" marker-end="url(#ah0)"/><text x="490.0" y="484.0" font-size="11.5" font-weight="normal" fill="#6b7280" text-anchor="middle" font-style="italic">Guide wording: “causes the removal” and “ensures” mean the Scrum Master is accountable for the result; others may do the work.</text></svg>