<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 470" width="980" height="470" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">Sprint Review and Sprint Retrospective</title><desc id="d">The Sprint Review inspects the outcome of the Sprint with key stakeholders and adapts the Product Backlog. The Sprint Retrospective inspects the way of working of the Scrum Team and plans improvements. The Review is second to last and the Retrospective concludes the Sprint.</desc><defs></defs><rect x="0.75" y="0.75" width="978.5" height="468.5" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><text x="20.0" y="28.0" font-size="18" font-weight="bold" fill="#1f2937" text-anchor="start">Review and Retrospective: product and process</text><text x="20.0" y="48.0" font-size="12" font-weight="normal" fill="#6b7280" text-anchor="start">Scrum Guide 2020: the Review is second to last; the Retrospective concludes the Sprint</text><rect x="20.0" y="66.0" width="450.0" height="46.0" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="245.0" y="85.0" font-size="13.5" font-weight="bold" fill="#1e3a8a" text-anchor="middle">Sprint Review: the product</text><text x="245.0" y="101.8" font-size="13.5" font-weight="normal" fill="#1e3a8a" text-anchor="middle">max 4 hours (one-month Sprint)</text><rect x="510.0" y="66.0" width="450.0" height="46.0" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="735.0" y="85.0" font-size="13.5" font-weight="bold" fill="#14532d" text-anchor="middle">Sprint Retrospective: the way of working</text><text x="735.0" y="101.8" font-size="13.5" font-weight="normal" fill="#14532d" text-anchor="middle">max 3 hours (one-month Sprint)</text><rect x="20.0" y="124.0" width="450.0" height="56.0" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.2"/><rect x="510.0" y="124.0" width="450.0" height="56.0" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.2"/><text x="30.0" y="139.0" font-size="9.5" font-weight="bold" fill="#2563eb" text-anchor="start">QUESTION</text><text x="30.0" y="157.0" font-size="12" font-weight="normal" fill="#1f2937" text-anchor="start">What did we build, and what should we do next?</text><text x="520.0" y="139.0" font-size="9.5" font-weight="bold" fill="#16a34a" text-anchor="start">QUESTION</text><text x="520.0" y="157.0" font-size="12" font-weight="normal" fill="#1f2937" text-anchor="start">How did we work, and how can we do it better?</text><line x1="472.0" y1="152.0" x2="508.0" y2="152.0" stroke="#9ca3af" stroke-width="1.4"/><rect x="20.0" y="186.0" width="450.0" height="56.0" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.2"/><rect x="510.0" y="186.0" width="450.0" height="56.0" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.2"/><text x="30.0" y="201.0" font-size="9.5" font-weight="bold" fill="#2563eb" text-anchor="start">INSPECTS</text><text x="30.0" y="219.0" font-size="12" font-weight="normal" fill="#1f2937" text-anchor="start">The Increment and what has changed in the environment</text><text x="520.0" y="201.0" font-size="9.5" font-weight="bold" fill="#16a34a" text-anchor="start">INSPECTS</text><text x="520.0" y="219.0" font-size="12" font-weight="normal" fill="#1f2937" text-anchor="start">Individuals, interactions, processes, tools and the Definition of Done</text><line x1="472.0" y1="214.0" x2="508.0" y2="214.0" stroke="#9ca3af" stroke-width="1.4"/><rect x="20.0" y="248.0" width="450.0" height="56.0" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.2"/><rect x="510.0" y="248.0" width="450.0" height="56.0" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.2"/><text x="30.0" y="263.0" font-size="9.5" font-weight="bold" fill="#2563eb" text-anchor="start">WHO</text><text x="30.0" y="281.0" font-size="12" font-weight="normal" fill="#1f2937" text-anchor="start">The Scrum Team and key stakeholders</text><text x="520.0" y="263.0" font-size="9.5" font-weight="bold" fill="#16a34a" text-anchor="start">WHO</text><text x="520.0" y="281.0" font-size="12" font-weight="normal" fill="#1f2937" text-anchor="start">The Scrum Team</text><line x1="472.0" y1="276.0" x2="508.0" y2="276.0" stroke="#9ca3af" stroke-width="1.4"/><rect x="20.0" y="310.0" width="450.0" height="56.0" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.2"/><rect x="510.0" y="310.0" width="450.0" height="56.0" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.2"/><text x="30.0" y="325.0" font-size="9.5" font-weight="bold" fill="#2563eb" text-anchor="start">NATURE</text><text x="30.0" y="343.0" font-size="12" font-weight="normal" fill="#1f2937" text-anchor="start">A working session, never a release gate</text><text x="520.0" y="325.0" font-size="9.5" font-weight="bold" fill="#16a34a" text-anchor="start">NATURE</text><text x="520.0" y="343.0" font-size="12" font-weight="normal" fill="#1f2937" text-anchor="start">An open, honest look at assumptions, what went well and what did not</text><line x1="472.0" y1="338.0" x2="508.0" y2="338.0" stroke="#9ca3af" stroke-width="1.4"/><rect x="20.0" y="372.0" width="450.0" height="56.0" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.2"/><rect x="510.0" y="372.0" width="450.0" height="56.0" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.2"/><text x="30.0" y="387.0" font-size="9.5" font-weight="bold" fill="#2563eb" text-anchor="start">ADAPTS</text><text x="30.0" y="405.0" font-size="12" font-weight="normal" fill="#1f2937" text-anchor="start">The Product Backlog, to meet new opportunities</text><text x="520.0" y="387.0" font-size="9.5" font-weight="bold" fill="#16a34a" text-anchor="start">ADAPTS</text><text x="520.0" y="405.0" font-size="12" font-weight="normal" fill="#1f2937" text-anchor="start">The team's practices; improvements may enter the next Sprint Backlog</text><line x1="472.0" y1="400.0" x2="508.0" y2="400.0" stroke="#9ca3af" stroke-width="1.4"/><text x="20.0" y="444.0" font-size="11.5" font-weight="bold" fill="#1e3a8a" text-anchor="start">Second to last event</text><text x="960.0" y="444.0" font-size="11.5" font-weight="bold" fill="#14532d" text-anchor="end">Concludes the Sprint</text></svg>