<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 460" width="980" height="460" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">Who influences the Product Backlog</title><desc id="d">Stakeholders try to convince the Product Owner. The Product Owner, one person, decides the content and order of the Product Backlog. The Developers size items and select what fits in the Sprint through discussion with the Product Owner. The Scrum Master helps with techniques. The organization respects the decisions, which are visible in the Product Backlog and the Increment.</desc><defs><marker id="ah0" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker><marker id="ah1" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker><marker id="ah2" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker><marker id="ah3" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0d9488"/></marker></defs><rect x="0.75" y="0.75" width="978.5" height="458.5" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><text x="20.0" y="28.0" font-size="18" font-weight="bold" fill="#1f2937" text-anchor="start">Who influences the Product Backlog and who decides</text><text x="20.0" y="48.0" font-size="12" font-weight="normal" fill="#6b7280" text-anchor="start">Scrum Guide 2020: one Product Owner, many voices</text><rect x="20.0" y="100.0" width="220.0" height="150.0" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.6"/><text x="130.0" y="163.9" font-size="12" font-weight="bold" fill="#374151" text-anchor="middle">Stakeholders</text><text x="130.0" y="178.9" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">many people with needs and opinions</text><text x="130.0" y="193.9" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">they advocate; they do not decide</text><rect x="380.0" y="100.0" width="220.0" height="150.0" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="490.0" y="155.6" font-size="12.5" font-weight="bold" fill="#14532d" text-anchor="middle">Product Owner</text><text x="490.0" y="171.2" font-size="12.5" font-weight="normal" fill="#14532d" text-anchor="middle">one person, not a committee</text><text x="490.0" y="186.9" font-size="12.5" font-weight="normal" fill="#14532d" text-anchor="middle">decides the content and order of the</text><text x="490.0" y="202.5" font-size="12.5" font-weight="normal" fill="#14532d" text-anchor="middle">Product Backlog</text><rect x="740.0" y="100.0" width="220.0" height="150.0" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="850.0" y="156.4" font-size="12" font-weight="bold" fill="#1e3a8a" text-anchor="middle">Developers</text><text x="850.0" y="171.4" font-size="12" font-weight="normal" fill="#1e3a8a" text-anchor="middle">size the items they will do</text><text x="850.0" y="186.4" font-size="12" font-weight="normal" fill="#1e3a8a" text-anchor="middle">select what fits in the Sprint</text><text x="850.0" y="201.4" font-size="12" font-weight="normal" fill="#1e3a8a" text-anchor="middle">decide how to build</text><line x1="242.0" y1="160.0" x2="378.0" y2="160.0" stroke="#1f2937" stroke-width="2.4" marker-end="url(#ah0)"/><text x="310.0" y="148.0" font-size="11.5" font-weight="bold" fill="#6b7280" text-anchor="middle">try to convince</text><line x1="742.0" y1="200.0" x2="602.0" y2="200.0" stroke="#1f2937" stroke-width="2.4" marker-end="url(#ah0)"/><line x1="602.0" y1="140.0" x2="740.0" y2="140.0" stroke="#1f2937" stroke-width="2.4" marker-end="url(#ah0)"/><text x="671.0" y="128.0" font-size="11" font-weight="bold" fill="#6b7280" text-anchor="middle">trade-offs, order</text><text x="671.0" y="218.0" font-size="11" font-weight="bold" fill="#6b7280" text-anchor="middle">size, capacity</text><rect x="380.0" y="286.0" width="220.0" height="56.0" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="490.0" y="310.4" font-size="12" font-weight="bold" fill="#78350f" text-anchor="middle">Product Backlog</text><text x="490.0" y="325.4" font-size="12" font-weight="normal" fill="#78350f" text-anchor="middle">ordered, transparent</text><line x1="490.0" y1="252.0" x2="490.0" y2="284.0" stroke="#d97706" stroke-width="2.4" marker-end="url(#ah1)"/><rect x="20.0" y="286.0" width="300.0" height="80.0" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.6"/><text x="170.0" y="308.6" font-size="11.2" font-weight="bold" fill="#4c1d95" text-anchor="middle">Scrum Master</text><text x="170.0" y="322.6" font-size="11.2" font-weight="normal" fill="#4c1d95" text-anchor="middle">helps find techniques for the Product Goal and the</text><text x="170.0" y="336.6" font-size="11.2" font-weight="normal" fill="#4c1d95" text-anchor="middle">Product Backlog; facilitates stakeholder collaboration as</text><text x="170.0" y="350.6" font-size="11.2" font-weight="normal" fill="#4c1d95" text-anchor="middle">requested or needed</text><line x1="322.0" y1="326.0" x2="378.0" y2="326.0" stroke="#7c3aed" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#ah2)"/><rect x="660.0" y="286.0" width="300.0" height="80.0" rx="8" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.6"/><text x="810.0" y="315.6" font-size="11.2" font-weight="bold" fill="#134e4a" text-anchor="middle">Sprint Review</text><text x="810.0" y="329.6" font-size="11.2" font-weight="normal" fill="#134e4a" text-anchor="middle">the Increment and the Product Backlog show the</text><text x="810.0" y="343.6" font-size="11.2" font-weight="normal" fill="#134e4a" text-anchor="middle">Product Owner's decisions to stakeholders</text><line x1="602.0" y1="314.0" x2="658.0" y2="314.0" stroke="#0d9488" stroke-width="2" marker-end="url(#ah3)"/><rect x="20.0" y="392.0" width="940.0" height="40.0" rx="8" fill="#1e3a8a" stroke="#1e3a8a" stroke-width="1.6"/><text x="490.0" y="416.1" font-size="12.5" font-weight="normal" fill="#ffffff" text-anchor="middle">The whole organization must respect the Product Owner's decisions. The Product Owner may delegate the work but remains accountable.</text></svg>