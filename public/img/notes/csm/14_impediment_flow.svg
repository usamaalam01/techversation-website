<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 440" width="980" height="440" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">Resolving an impediment</title><desc id="d">Make the impediment visible, find the root cause, then decide whether the team can resolve it. If yes the team acts with the Scrum Master's coaching; if not the Scrum Master works with the organization and escalates with evidence. Then verify it is gone and learn in the Retrospective.</desc><defs><marker id="ah0" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker><marker id="ah1" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker><marker id="ah2" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker><marker id="ah3" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker></defs><rect x="0.75" y="0.75" width="978.5" height="438.5" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><text x="20.0" y="28.0" font-size="18" font-weight="bold" fill="#1f2937" text-anchor="start">Resolving an impediment</text><text x="20.0" y="48.0" font-size="12" font-weight="normal" fill="#6b7280" text-anchor="start">The Scrum Master is accountable for causing the removal; the team, the Scrum Master or others do the work</text><rect x="20.0" y="80.0" width="190.0" height="70.0" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="115.0" y="111.4" font-size="12" font-weight="bold" fill="#1e3a8a" text-anchor="middle">1. Make it visible</text><text x="115.0" y="126.4" font-size="12" font-weight="normal" fill="#1e3a8a" text-anchor="middle">Daily Scrum, impediment board</text><rect x="250.0" y="80.0" width="190.0" height="70.0" rx="8" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.6"/><text x="345.0" y="111.4" font-size="12" font-weight="bold" fill="#134e4a" text-anchor="middle">2. Find the root cause</text><text x="345.0" y="126.4" font-size="12" font-weight="normal" fill="#134e4a" text-anchor="middle">5 Whys, fishbone</text><rect x="480.0" y="80.0" width="190.0" height="70.0" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="575.0" y="111.4" font-size="12" font-weight="bold" fill="#78350f" text-anchor="middle">3. Who can resolve it?</text><text x="575.0" y="126.4" font-size="12" font-weight="normal" fill="#78350f" text-anchor="middle">the team, or the organization</text><line x1="212.0" y1="115.0" x2="248.0" y2="115.0" stroke="#1f2937" stroke-width="2.2" marker-end="url(#ah0)"/><line x1="442.0" y1="115.0" x2="478.0" y2="115.0" stroke="#1f2937" stroke-width="2.2" marker-end="url(#ah0)"/><rect x="720.0" y="60.0" width="240.0" height="70.0" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="840.0" y="83.9" font-size="12" font-weight="bold" fill="#14532d" text-anchor="middle">Team level</text><text x="840.0" y="98.9" font-size="12" font-weight="normal" fill="#14532d" text-anchor="middle">the team resolves it, coached by the</text><text x="840.0" y="113.9" font-size="12" font-weight="normal" fill="#14532d" text-anchor="middle">Scrum Master</text><rect x="720.0" y="150.0" width="240.0" height="80.0" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.6"/><text x="840.0" y="172.2" font-size="11.5" font-weight="bold" fill="#4c1d95" text-anchor="middle">Organizational level</text><text x="840.0" y="186.6" font-size="11.5" font-weight="normal" fill="#4c1d95" text-anchor="middle">the Scrum Master works with managers</text><text x="840.0" y="200.9" font-size="11.5" font-weight="normal" fill="#4c1d95" text-anchor="middle">and other groups, escalating with evidence</text><text x="840.0" y="215.3" font-size="11.5" font-weight="normal" fill="#4c1d95" text-anchor="middle">(time lost, quality)</text><line x1="672.0" y1="108.0" x2="718.0" y2="94.0" stroke="#16a34a" stroke-width="2.2" marker-end="url(#ah1)"/><line x1="672.0" y1="130.0" x2="718.0" y2="184.0" stroke="#7c3aed" stroke-width="2.2" marker-end="url(#ah2)"/><rect x="250.0" y="270.0" width="420.0" height="56.0" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.6"/><text x="460.0" y="294.4" font-size="12" font-weight="bold" fill="#374151" text-anchor="middle">4. Verify it is gone</text><text x="460.0" y="309.4" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">check the effect in the next days and Sprint</text><rect x="250.0" y="346.0" width="420.0" height="56.0" rx="8" fill="#1e3a8a" stroke="#1e3a8a" stroke-width="1.6"/><text x="460.0" y="370.4" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">5. Learn: Sprint Retrospective</text><text x="460.0" y="385.4" font-size="12" font-weight="normal" fill="#ffffff" text-anchor="middle">prevent it from returning; improve the Definition of Done if needed</text><polyline points="840.0,232.0 840.0,298.0 672.0,298.0" fill="none" stroke="#6b7280" stroke-width="2" marker-end="url(#ah3)" stroke-linejoin="round"/><line x1="460.0" y1="328.0" x2="460.0" y2="344.0" stroke="#1f2937" stroke-width="2.2" marker-end="url(#ah0)"/><text x="60.0" y="290.0" font-size="12" font-weight="bold" fill="#5b21b6" text-anchor="start">As soon as possible:</text><text x="60.0" y="308.0" font-size="11.5" font-weight="normal" fill="#6b7280" text-anchor="start">adapt the moment you learn</text><text x="60.0" y="322.4" font-size="11.5" font-weight="normal" fill="#6b7280" text-anchor="start">something new; do not save</text><text x="60.0" y="336.8" font-size="11.5" font-weight="normal" fill="#6b7280" text-anchor="start">impediments for later</text></svg>