<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 420" width="980" height="420" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">Iterative versus incremental</title><desc id="d">Iterative means repeated cycles that improve the same thing using feedback. Incremental means building the product in usable slices, each added to the previous ones. A Sprint is both: it repeats the inspect and adapt cycle and it produces an Increment.</desc><defs><marker id="ah0" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker><marker id="ah1" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker></defs><rect x="0.75" y="0.75" width="978.5" height="418.5" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><text x="20.0" y="28.0" font-size="18" font-weight="bold" fill="#1f2937" text-anchor="start">Iterative versus incremental</text><text x="20.0" y="48.0" font-size="12" font-weight="normal" fill="#6b7280" text-anchor="start">A Sprint is both: it repeats the cycle (iterative) and delivers a usable slice (incremental)</text><rect x="20.0" y="66.0" width="460.0" height="290.0" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/><text x="250.0" y="92.0" font-size="13.5" font-weight="bold" fill="#1e3a8a" text-anchor="middle">Iterative: improve the same thing each cycle</text><rect x="40.0" y="230.0" width="120.0" height="70.0" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><text x="100.0" y="263.0" font-size="12" font-weight="bold" fill="#1e3a8a" text-anchor="middle">Cycle 1</text><text x="100.0" y="279.0" font-size="10.5" font-weight="normal" fill="#1e3a8a" text-anchor="middle">first version</text><line x1="162.0" y1="262.0" x2="183.0" y2="262.0" stroke="#1f2937" stroke-width="2" marker-end="url(#ah0)"/><rect x="185.0" y="210.0" width="120.0" height="90.0" rx="6" fill="#bfdbfe" stroke="#2563eb" stroke-width="1.5"/><text x="245.0" y="253.0" font-size="12" font-weight="bold" fill="#1e3a8a" text-anchor="middle">Cycle 2</text><text x="245.0" y="269.0" font-size="10.5" font-weight="normal" fill="#1e3a8a" text-anchor="middle">improved after feedback</text><line x1="307.0" y1="262.0" x2="328.0" y2="262.0" stroke="#1f2937" stroke-width="2" marker-end="url(#ah0)"/><rect x="330.0" y="190.0" width="120.0" height="110.0" rx="6" fill="#93c5fd" stroke="#2563eb" stroke-width="1.5"/><text x="390.0" y="243.0" font-size="12" font-weight="bold" fill="#1e3a8a" text-anchor="middle">Cycle 3</text><text x="390.0" y="259.0" font-size="10.5" font-weight="normal" fill="#1e3a8a" text-anchor="middle">improved again</text><polyline points="100.0,310.0 100.0,336.0 410.0,336.0 410.0,290.0" fill="none" stroke="#7c3aed" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#ah1)" stroke-linejoin="round"/><text x="255.0" y="328.0" font-size="11" font-weight="bold" fill="#5b21b6" text-anchor="middle">inspect and adapt</text><rect x="500.0" y="66.0" width="460.0" height="290.0" rx="10" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/><text x="730.0" y="92.0" font-size="13.5" font-weight="bold" fill="#14532d" text-anchor="middle">Incremental: add usable slices to what exists</text><rect x="530.0" y="248.0" width="120.0" height="48.0" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/><text x="590.0" y="280.0" font-size="11.5" font-weight="bold" fill="#14532d" text-anchor="middle">Increment 1</text><text x="590.0" y="322.0" font-size="10.5" font-weight="normal" fill="#6b7280" text-anchor="middle">usable</text><rect x="675.0" y="248.0" width="120.0" height="48.0" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/><text x="735.0" y="280.0" font-size="11.5" font-weight="bold" fill="#14532d" text-anchor="middle">Increment 1</text><rect x="675.0" y="196.0" width="120.0" height="48.0" rx="6" fill="#bbf7d0" stroke="#16a34a" stroke-width="1.5"/><text x="735.0" y="228.0" font-size="11.5" font-weight="bold" fill="#14532d" text-anchor="middle">Increment 2</text><text x="735.0" y="322.0" font-size="10.5" font-weight="normal" fill="#6b7280" text-anchor="middle">1 to 2 together</text><rect x="820.0" y="248.0" width="120.0" height="48.0" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/><text x="880.0" y="280.0" font-size="11.5" font-weight="bold" fill="#14532d" text-anchor="middle">Increment 1</text><rect x="820.0" y="196.0" width="120.0" height="48.0" rx="6" fill="#bbf7d0" stroke="#16a34a" stroke-width="1.5"/><text x="880.0" y="228.0" font-size="11.5" font-weight="bold" fill="#14532d" text-anchor="middle">Increment 2</text><rect x="820.0" y="144.0" width="120.0" height="48.0" rx="6" fill="#86efac" stroke="#16a34a" stroke-width="1.5"/><text x="880.0" y="176.0" font-size="11.5" font-weight="bold" fill="#14532d" text-anchor="middle">Increment 3</text><text x="880.0" y="322.0" font-size="10.5" font-weight="normal" fill="#6b7280" text-anchor="middle">1 to 3 together</text><text x="490.0" y="394.0" font-size="12" font-weight="bold" fill="#14532d" text-anchor="middle">Each Increment is additive to all prior Increments and thoroughly verified, so that they work together.</text></svg>