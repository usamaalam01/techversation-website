<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 400" width="980" height="400" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">What may and may not change during a Sprint</title><desc id="d">The Sprint Goal, quality and the Sprint length stay fixed. The plan and the scope can change: the Developers update the plan daily and negotiate scope with the Product Owner without endangering the Sprint Goal.</desc><defs></defs><rect x="0.75" y="0.75" width="978.5" height="398.5" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><text x="20.0" y="28.0" font-size="18" font-weight="bold" fill="#1f2937" text-anchor="start">During the Sprint: the goal is fixed, the scope can flex</text><text x="20.0" y="48.0" font-size="12" font-weight="normal" fill="#6b7280" text-anchor="start">Scrum Guide 2020: no changes that endanger the Sprint Goal; quality does not decrease; scope may be renegotiated with the Product Owner</text><rect x="20.0" y="70.0" width="450.0" height="44.0" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.6"/><text x="245.0" y="96.5" font-size="14" font-weight="bold" fill="#7f1d1d" text-anchor="middle">Fixed during the Sprint</text><rect x="20.0" y="120.0" width="450.0" height="190.0" rx="8" fill="#ffffff" stroke="#dc2626" stroke-width="1.5"/><text x="36.0" y="144.0" font-size="13" font-weight="bold" fill="#dc2626" text-anchor="start">•</text><text x="50.0" y="144.0" font-size="12.2" font-weight="normal" fill="#1f2937" text-anchor="start">The Sprint Goal: nothing endangers it</text><text x="36.0" y="171.2" font-size="13" font-weight="bold" fill="#dc2626" text-anchor="start">•</text><text x="50.0" y="171.2" font-size="12.2" font-weight="normal" fill="#1f2937" text-anchor="start">Quality: the Definition of Done does not decrease</text><text x="36.0" y="198.5" font-size="13" font-weight="bold" fill="#dc2626" text-anchor="start">•</text><text x="50.0" y="198.5" font-size="12.2" font-weight="normal" fill="#1f2937" text-anchor="start">The Sprint length: fixed</text><text x="36.0" y="225.8" font-size="13" font-weight="bold" fill="#dc2626" text-anchor="start">•</text><text x="50.0" y="225.8" font-size="12.2" font-weight="normal" fill="#1f2937" text-anchor="start">Who decides how: the Developers, at their sole discretion</text><rect x="510.0" y="70.0" width="450.0" height="44.0" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="735.0" y="96.5" font-size="14" font-weight="bold" fill="#14532d" text-anchor="middle">May change as more is learned</text><rect x="510.0" y="120.0" width="450.0" height="190.0" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/><text x="526.0" y="144.0" font-size="13" font-weight="bold" fill="#16a34a" text-anchor="start">•</text><text x="540.0" y="144.0" font-size="12.2" font-weight="normal" fill="#1f2937" text-anchor="start">The plan: tasks and their order, updated daily</text><text x="526.0" y="169.2" font-size="13" font-weight="bold" fill="#16a34a" text-anchor="start">•</text><text x="540.0" y="169.2" font-size="12.2" font-weight="normal" fill="#1f2937" text-anchor="start">The scope: negotiated between the Developers and the Product Owner</text><text x="540.0" y="184.5" font-size="12.2" font-weight="normal" fill="#1f2937" text-anchor="start">(a smaller item, a split, a dropped lower-priority item)</text><text x="526.0" y="209.8" font-size="13" font-weight="bold" fill="#16a34a" text-anchor="start">•</text><text x="540.0" y="209.8" font-size="12.2" font-weight="normal" fill="#1f2937" text-anchor="start">The Product Backlog: refined as needed</text><text x="526.0" y="235.0" font-size="13" font-weight="bold" fill="#16a34a" text-anchor="start">•</text><text x="540.0" y="235.0" font-size="12.2" font-weight="normal" fill="#1f2937" text-anchor="start">Detail in the Sprint Backlog</text><rect x="20.0" y="330.0" width="940.0" height="50.0" rx="8" fill="#1e3a8a" stroke="#1e3a8a" stroke-width="1.6"/><text x="490.0" y="351.2" font-size="12.5" font-weight="bold" fill="#ffffff" text-anchor="middle">If the Sprint Goal becomes obsolete, only the Product Owner may cancel the Sprint</text><text x="490.0" y="366.9" font-size="12.5" font-weight="normal" fill="#ffffff" text-anchor="middle">being behind or finding the work harder is not a reason to cancel</text></svg>