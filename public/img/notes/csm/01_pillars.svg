<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 420" width="980" height="420" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">Transparency, inspection and adaptation</title><desc id="d">Transparency enables inspection and inspection enables adaptation. Without transparency inspection is misleading and wasteful, without adaptation inspection is pointless. The five events give the cadence and the Scrum values make the pillars work by building trust.</desc><defs><marker id="ah0" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker></defs><rect x="0.75" y="0.75" width="978.5" height="418.5" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><text x="20.0" y="28.0" font-size="18" font-weight="bold" fill="#1f2937" text-anchor="start">The three empirical pillars</text><text x="20.0" y="48.0" font-size="12" font-weight="normal" fill="#6b7280" text-anchor="start">Scrum Guide 2020, Scrum Theory: transparency enables inspection, inspection enables adaptation</text><rect x="20.0" y="66.0" width="280.0" height="46.0" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="160.0" y="93.5" font-size="14" font-weight="bold" fill="#1e3a8a" text-anchor="middle">Transparency</text><rect x="20.0" y="118.0" width="280.0" height="126.0" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/><text x="32.0" y="142.0" font-size="13" font-weight="bold" fill="#2563eb" text-anchor="start">•</text><text x="46.0" y="142.0" font-size="11.8" font-weight="normal" fill="#1f2937" text-anchor="start">The process and the work are visible to</text><text x="46.0" y="156.8" font-size="11.8" font-weight="normal" fill="#1f2937" text-anchor="start">those doing it and those receiving it</text><text x="32.0" y="177.5" font-size="13" font-weight="bold" fill="#2563eb" text-anchor="start">•</text><text x="46.0" y="177.5" font-size="11.8" font-weight="normal" fill="#1f2937" text-anchor="start">Decisions rest on the perceived state of the</text><text x="46.0" y="192.2" font-size="11.8" font-weight="normal" fill="#1f2937" text-anchor="start">three formal artifacts</text><rect x="20.0" y="254.0" width="280.0" height="60.0" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.6"/><text x="160.0" y="273.8" font-size="11" font-weight="bold" fill="#7f1d1d" text-anchor="middle">Without it</text><text x="160.0" y="287.6" font-size="11" font-weight="normal" fill="#7f1d1d" text-anchor="middle">Low transparency leads to decisions that diminish</text><text x="160.0" y="301.3" font-size="11" font-weight="normal" fill="#7f1d1d" text-anchor="middle">value and increase risk</text><line x1="302.0" y1="90.0" x2="348.0" y2="90.0" stroke="#1f2937" stroke-width="2.4" marker-end="url(#ah0)"/><text x="325.0" y="78.0" font-size="10.5" font-weight="bold" fill="#6b7280" text-anchor="middle">enables</text><rect x="350.0" y="66.0" width="280.0" height="46.0" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="490.0" y="93.5" font-size="14" font-weight="bold" fill="#14532d" text-anchor="middle">Inspection</text><rect x="350.0" y="118.0" width="280.0" height="126.0" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/><text x="362.0" y="142.0" font-size="13" font-weight="bold" fill="#16a34a" text-anchor="start">•</text><text x="376.0" y="142.0" font-size="11.8" font-weight="normal" fill="#1f2937" text-anchor="start">Artifacts and progress toward agreed goals</text><text x="376.0" y="156.8" font-size="11.8" font-weight="normal" fill="#1f2937" text-anchor="start">are checked frequently and diligently</text><text x="362.0" y="177.5" font-size="13" font-weight="bold" fill="#16a34a" text-anchor="start">•</text><text x="376.0" y="177.5" font-size="11.8" font-weight="normal" fill="#1f2937" text-anchor="start">Looking for undesirable variances or</text><text x="376.0" y="192.2" font-size="11.8" font-weight="normal" fill="#1f2937" text-anchor="start">problems</text><rect x="350.0" y="254.0" width="280.0" height="60.0" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.6"/><text x="490.0" y="273.8" font-size="11" font-weight="bold" fill="#7f1d1d" text-anchor="middle">Without it</text><text x="490.0" y="287.6" font-size="11" font-weight="normal" fill="#7f1d1d" text-anchor="middle">Inspection without transparency is misleading and</text><text x="490.0" y="301.3" font-size="11" font-weight="normal" fill="#7f1d1d" text-anchor="middle">wasteful</text><line x1="632.0" y1="90.0" x2="678.0" y2="90.0" stroke="#1f2937" stroke-width="2.4" marker-end="url(#ah0)"/><text x="655.0" y="78.0" font-size="10.5" font-weight="bold" fill="#6b7280" text-anchor="middle">enables</text><rect x="680.0" y="66.0" width="280.0" height="46.0" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="820.0" y="93.5" font-size="14" font-weight="bold" fill="#78350f" text-anchor="middle">Adaptation</text><rect x="680.0" y="118.0" width="280.0" height="126.0" rx="8" fill="#ffffff" stroke="#d97706" stroke-width="1.5"/><text x="692.0" y="142.0" font-size="13" font-weight="bold" fill="#d97706" text-anchor="start">•</text><text x="706.0" y="142.0" font-size="11.8" font-weight="normal" fill="#1f2937" text-anchor="start">Adjust the process or the materials as soon</text><text x="706.0" y="156.8" font-size="11.8" font-weight="normal" fill="#1f2937" text-anchor="start">as possible when they deviate or the</text><text x="706.0" y="171.5" font-size="11.8" font-weight="normal" fill="#1f2937" text-anchor="start">product is unacceptable</text><text x="692.0" y="192.2" font-size="13" font-weight="bold" fill="#d97706" text-anchor="start">•</text><text x="706.0" y="192.2" font-size="11.8" font-weight="normal" fill="#1f2937" text-anchor="start">The team adapts the moment it learns</text><text x="706.0" y="207.0" font-size="11.8" font-weight="normal" fill="#1f2937" text-anchor="start">anything new</text><rect x="680.0" y="254.0" width="280.0" height="60.0" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.6"/><text x="820.0" y="280.7" font-size="11" font-weight="bold" fill="#7f1d1d" text-anchor="middle">Without it</text><text x="820.0" y="294.4" font-size="11" font-weight="normal" fill="#7f1d1d" text-anchor="middle">Inspection without adaptation is pointless</text><rect x="20.0" y="330.0" width="610.0" height="40.0" rx="8" fill="#1e3a8a" stroke="#1e3a8a" stroke-width="1.6"/><text x="325.0" y="353.9" font-size="12" font-weight="normal" fill="#ffffff" text-anchor="middle">Cadence: five events give the rhythm of inspection and adaptation (the Sprint plus four events inside it)</text><rect x="650.0" y="330.0" width="310.0" height="40.0" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.6"/><text x="805.0" y="353.9" font-size="12" font-weight="normal" fill="#4c1d95" text-anchor="middle">Values bring the pillars to life and build trust</text><text x="490.0" y="392.0" font-size="12" font-weight="bold" fill="#5b21b6" text-anchor="middle">Do not mix them up: courage, openness, focus, commitment and respect are values, not pillars.</text></svg>