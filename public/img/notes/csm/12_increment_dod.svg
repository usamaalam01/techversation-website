<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 470" width="980" height="470" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">Increments and the Definition of Done</title><desc id="d">Product Backlog items that meet the Definition of Done become Increments, each added to the earlier ones. Several Increments may be created in a Sprint and may be delivered before the Sprint Review. Items that do not meet the Definition of Done return to the Product Backlog and are not presented. The organization's standard is the minimum; teams on one product share one Definition of Done.</desc><defs><marker id="ah0" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker><marker id="ah1" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker><marker id="ah2" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker></defs><rect x="0.75" y="0.75" width="978.5" height="468.5" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><text x="20.0" y="28.0" font-size="18" font-weight="bold" fill="#1f2937" text-anchor="start">From item to Increment: the Definition of Done is the gate</text><text x="20.0" y="48.0" font-size="12" font-weight="normal" fill="#6b7280" text-anchor="start">Scrum Guide 2020: the moment an item meets the Definition of Done, an Increment is born</text><rect x="20.0" y="90.0" width="190.0" height="80.0" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="115.0" y="118.9" font-size="12" font-weight="bold" fill="#1e3a8a" text-anchor="middle">Selected item</text><text x="115.0" y="133.9" font-size="12" font-weight="normal" fill="#1e3a8a" text-anchor="middle">being worked on by the</text><text x="115.0" y="148.9" font-size="12" font-weight="normal" fill="#1e3a8a" text-anchor="middle">Developers</text><rect x="260.0" y="90.0" width="190.0" height="80.0" rx="8" fill="#1e3a8a" stroke="#1e3a8a" stroke-width="1.6"/><text x="355.0" y="118.4" font-size="12.5" font-weight="bold" fill="#ffffff" text-anchor="middle">Definition of Done</text><text x="355.0" y="134.1" font-size="12.5" font-weight="normal" fill="#ffffff" text-anchor="middle">quality measures required for</text><text x="355.0" y="149.7" font-size="12.5" font-weight="normal" fill="#ffffff" text-anchor="middle">the product</text><line x1="212.0" y1="130.0" x2="258.0" y2="130.0" stroke="#1f2937" stroke-width="2.4" marker-end="url(#ah0)"/><rect x="520.0" y="70.0" width="250.0" height="56.0" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="645.0" y="94.4" font-size="12" font-weight="bold" fill="#14532d" text-anchor="middle">Meets it: an Increment</text><text x="645.0" y="109.4" font-size="12" font-weight="normal" fill="#14532d" text-anchor="middle">usable, added to prior Increments</text><rect x="520.0" y="150.0" width="250.0" height="56.0" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.6"/><text x="645.0" y="174.4" font-size="12" font-weight="bold" fill="#7f1d1d" text-anchor="middle">Does not meet it</text><text x="645.0" y="189.4" font-size="12" font-weight="normal" fill="#7f1d1d" text-anchor="middle">cannot be released or presented</text><line x1="452.0" y1="116.0" x2="518.0" y2="100.0" stroke="#16a34a" stroke-width="2.4" marker-end="url(#ah1)"/><line x1="452.0" y1="144.0" x2="518.0" y2="176.0" stroke="#dc2626" stroke-width="2.4" marker-end="url(#ah2)"/><rect x="810.0" y="150.0" width="150.0" height="56.0" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="885.0" y="174.6" font-size="11.5" font-weight="bold" fill="#78350f" text-anchor="middle">Returns to the Product</text><text x="885.0" y="188.9" font-size="11.5" font-weight="bold" fill="#78350f" text-anchor="middle">Backlog</text><line x1="772.0" y1="178.0" x2="808.0" y2="178.0" stroke="#dc2626" stroke-width="2.2" marker-end="url(#ah2)"/><text x="20.0" y="244.0" font-size="12.5" font-weight="bold" fill="#14532d" text-anchor="start">Several Increments in one Sprint, each added to the earlier ones:</text><rect x="20.0" y="322.0" width="170.0" height="34.0" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.4"/><text x="105.0" y="346.0" font-size="11.5" font-weight="bold" fill="#14532d" text-anchor="middle">Increment 1</text><text x="105.0" y="380.0" font-size="10.5" font-weight="normal" fill="#6b7280" text-anchor="middle">after item 1 is Done</text><rect x="215.0" y="322.0" width="170.0" height="34.0" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.4"/><text x="300.0" y="346.0" font-size="11.5" font-weight="bold" fill="#14532d" text-anchor="middle">Increment 1</text><rect x="215.0" y="284.0" width="170.0" height="34.0" rx="6" fill="#bbf7d0" stroke="#16a34a" stroke-width="1.4"/><text x="300.0" y="308.0" font-size="11.5" font-weight="bold" fill="#14532d" text-anchor="middle">Increment 2</text><text x="300.0" y="380.0" font-size="10.5" font-weight="normal" fill="#6b7280" text-anchor="middle">after item 2 is Done</text><rect x="410.0" y="322.0" width="170.0" height="34.0" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.4"/><text x="495.0" y="346.0" font-size="11.5" font-weight="bold" fill="#14532d" text-anchor="middle">Increment 1</text><rect x="410.0" y="284.0" width="170.0" height="34.0" rx="6" fill="#bbf7d0" stroke="#16a34a" stroke-width="1.4"/><text x="495.0" y="308.0" font-size="11.5" font-weight="bold" fill="#14532d" text-anchor="middle">Increment 2</text><rect x="410.0" y="246.0" width="170.0" height="34.0" rx="6" fill="#86efac" stroke="#16a34a" stroke-width="1.4"/><text x="495.0" y="270.0" font-size="11.5" font-weight="bold" fill="#14532d" text-anchor="middle">Increment 3</text><text x="495.0" y="380.0" font-size="10.5" font-weight="normal" fill="#6b7280" text-anchor="middle">after item 3 is Done</text><rect x="620.0" y="262.0" width="340.0" height="54.0" rx="8" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.6"/><text x="790.0" y="285.4" font-size="12" font-weight="bold" fill="#134e4a" text-anchor="middle">May be delivered to stakeholders before the end of the</text><text x="790.0" y="300.4" font-size="12" font-weight="bold" fill="#134e4a" text-anchor="middle">Sprint</text><rect x="620.0" y="326.0" width="340.0" height="54.0" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.6"/><text x="790.0" y="349.6" font-size="11.5" font-weight="bold" fill="#4c1d95" text-anchor="middle">The sum of the Increments is presented at the Sprint</text><text x="790.0" y="363.9" font-size="11.5" font-weight="bold" fill="#4c1d95" text-anchor="middle">Review; the Review is never a gate</text><rect x="20.0" y="404.0" width="940.0" height="48.0" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.6"/><text x="490.0" y="424.4" font-size="12" font-weight="bold" fill="#374151" text-anchor="middle">Organization standard = the minimum for every team. No standard: the Scrum Team creates one. Several teams on one product share the same Definition of</text><text x="490.0" y="439.4" font-size="12" font-weight="bold" fill="#374151" text-anchor="middle">Done.</text></svg>