<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 440" width="980" height="440" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">Teaching, mentoring, coaching and facilitating</title><desc id="d">Teaching and mentoring: the Scrum Master holds the knowledge or experience and shares it. Coaching: the coachee holds the answer and the Scrum Master asks questions. Facilitating: the group holds the answer and the Scrum Master guides the process neutrally.</desc><defs><marker id="ah0" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker></defs><rect x="0.75" y="0.75" width="978.5" height="438.5" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><text x="20.0" y="28.0" font-size="18" font-weight="bold" fill="#1f2937" text-anchor="start">Four stances: who has the answer?</text><text x="20.0" y="48.0" font-size="12" font-weight="normal" fill="#6b7280" text-anchor="start">A Scrum Master moves between them as the situation requires</text><rect x="20.0" y="66.0" width="218.0" height="44.0" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="129.0" y="92.5" font-size="14" font-weight="bold" fill="#1e3a8a" text-anchor="middle">Teaching</text><rect x="20.0" y="116.0" width="218.0" height="208.0" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/><text x="30.0" y="138.0" font-size="9.5" font-weight="bold" fill="#2563eb" text-anchor="start">WHO HOLDS THE ANSWER</text><text x="30.0" y="153.0" font-size="11.8" font-weight="normal" fill="#1f2937" text-anchor="start">The Scrum Master</text><text x="30.0" y="179.8" font-size="9.5" font-weight="bold" fill="#2563eb" text-anchor="start">SCRUM MASTER</text><text x="30.0" y="194.8" font-size="11.8" font-weight="normal" fill="#1f2937" text-anchor="start">Explains and shows how</text><text x="30.0" y="221.5" font-size="9.5" font-weight="bold" fill="#2563eb" text-anchor="start">USE WHEN</text><text x="30.0" y="236.5" font-size="11.8" font-weight="normal" fill="#1f2937" text-anchor="start">Lack of knowledge of Scrum or a</text><text x="30.0" y="251.2" font-size="11.8" font-weight="normal" fill="#1f2937" text-anchor="start">practice</text><text x="30.0" y="278.0" font-size="9.5" font-weight="bold" fill="#2563eb" text-anchor="start">SAYS</text><text x="30.0" y="293.0" font-size="11.8" font-weight="normal" fill="#1f2937" text-anchor="start">"This is how the Definition of Done</text><text x="30.0" y="307.8" font-size="11.8" font-weight="normal" fill="#1f2937" text-anchor="start">works."</text><rect x="259.0" y="66.0" width="218.0" height="44.0" rx="8" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.6"/><text x="368.0" y="92.5" font-size="14" font-weight="bold" fill="#134e4a" text-anchor="middle">Mentoring</text><rect x="259.0" y="116.0" width="218.0" height="208.0" rx="8" fill="#ffffff" stroke="#0d9488" stroke-width="1.5"/><text x="269.0" y="138.0" font-size="9.5" font-weight="bold" fill="#0d9488" text-anchor="start">WHO HOLDS THE ANSWER</text><text x="269.0" y="153.0" font-size="11.8" font-weight="normal" fill="#1f2937" text-anchor="start">The Scrum Master (experience)</text><text x="269.0" y="179.8" font-size="9.5" font-weight="bold" fill="#0d9488" text-anchor="start">SCRUM MASTER</text><text x="269.0" y="194.8" font-size="11.8" font-weight="normal" fill="#1f2937" text-anchor="start">Shares experience and options</text><text x="269.0" y="221.5" font-size="9.5" font-weight="bold" fill="#0d9488" text-anchor="start">USE WHEN</text><text x="269.0" y="236.5" font-size="11.8" font-weight="normal" fill="#1f2937" text-anchor="start">Someone wants to learn from</text><text x="269.0" y="251.2" font-size="11.8" font-weight="normal" fill="#1f2937" text-anchor="start">experience</text><text x="269.0" y="278.0" font-size="9.5" font-weight="bold" fill="#0d9488" text-anchor="start">SAYS</text><text x="269.0" y="293.0" font-size="11.8" font-weight="normal" fill="#1f2937" text-anchor="start">"When I faced this, I tried ... and</text><text x="269.0" y="307.8" font-size="11.8" font-weight="normal" fill="#1f2937" text-anchor="start">learned ..."</text><rect x="498.0" y="66.0" width="218.0" height="44.0" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="607.0" y="92.5" font-size="14" font-weight="bold" fill="#78350f" text-anchor="middle">Coaching</text><rect x="498.0" y="116.0" width="218.0" height="208.0" rx="8" fill="#ffffff" stroke="#d97706" stroke-width="1.5"/><text x="508.0" y="138.0" font-size="9.5" font-weight="bold" fill="#d97706" text-anchor="start">WHO HOLDS THE ANSWER</text><text x="508.0" y="153.0" font-size="11.8" font-weight="normal" fill="#1f2937" text-anchor="start">The coachee</text><text x="508.0" y="179.8" font-size="9.5" font-weight="bold" fill="#d97706" text-anchor="start">SCRUM MASTER</text><text x="508.0" y="194.8" font-size="11.8" font-weight="normal" fill="#1f2937" text-anchor="start">Asks questions and listens</text><text x="508.0" y="221.5" font-size="9.5" font-weight="bold" fill="#d97706" text-anchor="start">USE WHEN</text><text x="508.0" y="236.5" font-size="11.8" font-weight="normal" fill="#1f2937" text-anchor="start">Capable but stuck; mindset and</text><text x="508.0" y="251.2" font-size="11.8" font-weight="normal" fill="#1f2937" text-anchor="start">behaviour</text><text x="508.0" y="278.0" font-size="9.5" font-weight="bold" fill="#d97706" text-anchor="start">SAYS</text><text x="508.0" y="293.0" font-size="11.8" font-weight="normal" fill="#1f2937" text-anchor="start">"What have you tried? What would</text><text x="508.0" y="307.8" font-size="11.8" font-weight="normal" fill="#1f2937" text-anchor="start">you like?"</text><rect x="737.0" y="66.0" width="218.0" height="44.0" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.6"/><text x="846.0" y="92.5" font-size="14" font-weight="bold" fill="#4c1d95" text-anchor="middle">Facilitating</text><rect x="737.0" y="116.0" width="218.0" height="208.0" rx="8" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/><text x="747.0" y="138.0" font-size="9.5" font-weight="bold" fill="#7c3aed" text-anchor="start">WHO HOLDS THE ANSWER</text><text x="747.0" y="153.0" font-size="11.8" font-weight="normal" fill="#1f2937" text-anchor="start">The group</text><text x="747.0" y="179.8" font-size="9.5" font-weight="bold" fill="#7c3aed" text-anchor="start">SCRUM MASTER</text><text x="747.0" y="194.8" font-size="11.8" font-weight="normal" fill="#1f2937" text-anchor="start">Guides the process, stays neutral</text><text x="747.0" y="221.5" font-size="9.5" font-weight="bold" fill="#7c3aed" text-anchor="start">USE WHEN</text><text x="747.0" y="236.5" font-size="11.8" font-weight="normal" fill="#1f2937" text-anchor="start">A group must collaborate or decide</text><text x="747.0" y="263.2" font-size="9.5" font-weight="bold" fill="#7c3aed" text-anchor="start">SAYS</text><text x="747.0" y="278.2" font-size="11.8" font-weight="normal" fill="#1f2937" text-anchor="start">"Let us agree how we decide this."</text><line x1="20.0" y1="330.0" x2="960.0" y2="330.0" stroke="#6b7280" stroke-width="2" marker-end="url(#ah0)"/><text x="20.0" y="354.0" font-size="11.5" font-weight="bold" fill="#1e3a8a" text-anchor="start">Scrum Master gives knowledge and experience</text><text x="960.0" y="354.0" font-size="11.5" font-weight="bold" fill="#78350f" text-anchor="end">Scrum Master draws the answer out of others</text><text x="490.0" y="400.0" font-size="13" font-weight="bold" fill="#5b21b6" text-anchor="middle">Test for the exam: who has the answer?</text></svg>