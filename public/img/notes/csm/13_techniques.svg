<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 430" width="980" height="430" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">Choosing a decision technique</title><desc id="d">Dot voting to select several options from a list, Roman voting for a quick check, Fist of Five for the strength of support, 1-2-4-All for hard topics, consensus when everyone must support it and majority vote for low-impact choices.</desc><defs></defs><rect x="0.75" y="0.75" width="978.5" height="428.5" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><text x="20.0" y="28.0" font-size="18" font-weight="bold" fill="#1f2937" text-anchor="start">Choosing a group decision technique</text><text x="20.0" y="48.0" font-size="12" font-weight="normal" fill="#6b7280" text-anchor="start">Agree on the method and the threshold before voting; the Scrum Master facilitates and stays neutral on content</text><rect x="20.0" y="70.0" width="176.0" height="44.0" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="108.0" y="96.2" font-size="13" font-weight="bold" fill="#1e3a8a" text-anchor="middle">Dot voting</text><rect x="20.0" y="120.0" width="176.0" height="190.0" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/><text x="30.0" y="142.0" font-size="9.5" font-weight="bold" fill="#2563eb" text-anchor="start">USE WHEN</text><text x="30.0" y="158.0" font-size="11.8" font-weight="bold" fill="#1f2937" text-anchor="start">Pick several options from a</text><text x="30.0" y="172.8" font-size="11.8" font-weight="bold" fill="#1f2937" text-anchor="start">longer list</text><text x="30.0" y="201.5" font-size="9.5" font-weight="bold" fill="#2563eb" text-anchor="start">HOW</text><text x="30.0" y="217.5" font-size="11.3" font-weight="normal" fill="#1f2937" text-anchor="start">Everyone gets the same</text><text x="30.0" y="231.6" font-size="11.3" font-weight="normal" fill="#1f2937" text-anchor="start">number of dots; the top</text><text x="30.0" y="245.8" font-size="11.3" font-weight="normal" fill="#1f2937" text-anchor="start">vote-getters win</text><rect x="211.0" y="70.0" width="176.0" height="44.0" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="299.0" y="96.2" font-size="13" font-weight="bold" fill="#14532d" text-anchor="middle">Roman voting</text><rect x="211.0" y="120.0" width="176.0" height="190.0" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/><text x="221.0" y="142.0" font-size="9.5" font-weight="bold" fill="#16a34a" text-anchor="start">USE WHEN</text><text x="221.0" y="158.0" font-size="11.8" font-weight="bold" fill="#1f2937" text-anchor="start">A quick check on one</text><text x="221.0" y="172.8" font-size="11.8" font-weight="bold" fill="#1f2937" text-anchor="start">proposal</text><text x="221.0" y="201.5" font-size="9.5" font-weight="bold" fill="#16a34a" text-anchor="start">HOW</text><text x="221.0" y="217.5" font-size="11.3" font-weight="normal" fill="#1f2937" text-anchor="start">Thumb up, sideways or down</text><rect x="402.0" y="70.0" width="176.0" height="44.0" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="490.0" y="96.2" font-size="13" font-weight="bold" fill="#78350f" text-anchor="middle">Fist of Five</text><rect x="402.0" y="120.0" width="176.0" height="190.0" rx="8" fill="#ffffff" stroke="#d97706" stroke-width="1.5"/><text x="412.0" y="142.0" font-size="9.5" font-weight="bold" fill="#d97706" text-anchor="start">USE WHEN</text><text x="412.0" y="158.0" font-size="11.8" font-weight="bold" fill="#1f2937" text-anchor="start">How strongly does the</text><text x="412.0" y="172.8" font-size="11.8" font-weight="bold" fill="#1f2937" text-anchor="start">group support it?</text><text x="412.0" y="201.5" font-size="9.5" font-weight="bold" fill="#d97706" text-anchor="start">HOW</text><text x="412.0" y="217.5" font-size="11.3" font-weight="normal" fill="#1f2937" text-anchor="start">Closed fist (block) to five</text><text x="412.0" y="231.6" font-size="11.3" font-weight="normal" fill="#1f2937" text-anchor="start">fingers (full support); agree the</text><text x="412.0" y="245.8" font-size="11.3" font-weight="normal" fill="#1f2937" text-anchor="start">level first</text><rect x="593.0" y="70.0" width="176.0" height="44.0" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.6"/><text x="681.0" y="96.2" font-size="13" font-weight="bold" fill="#4c1d95" text-anchor="middle">1-2-4-All</text><rect x="593.0" y="120.0" width="176.0" height="190.0" rx="8" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/><text x="603.0" y="142.0" font-size="9.5" font-weight="bold" fill="#7c3aed" text-anchor="start">USE WHEN</text><text x="603.0" y="158.0" font-size="11.8" font-weight="bold" fill="#1f2937" text-anchor="start">Hard topics; far from</text><text x="603.0" y="172.8" font-size="11.8" font-weight="bold" fill="#1f2937" text-anchor="start">agreement</text><text x="603.0" y="201.5" font-size="9.5" font-weight="bold" fill="#7c3aed" text-anchor="start">HOW</text><text x="603.0" y="217.5" font-size="11.3" font-weight="normal" fill="#1f2937" text-anchor="start">Alone, then pairs, then fours,</text><text x="603.0" y="231.6" font-size="11.3" font-weight="normal" fill="#1f2937" text-anchor="start">then everyone</text><rect x="784.0" y="70.0" width="176.0" height="44.0" rx="8" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.6"/><text x="872.0" y="96.2" font-size="13" font-weight="bold" fill="#134e4a" text-anchor="middle">Consensus</text><rect x="784.0" y="120.0" width="176.0" height="190.0" rx="8" fill="#ffffff" stroke="#0d9488" stroke-width="1.5"/><text x="794.0" y="142.0" font-size="9.5" font-weight="bold" fill="#0d9488" text-anchor="start">USE WHEN</text><text x="794.0" y="158.0" font-size="11.8" font-weight="bold" fill="#1f2937" text-anchor="start">Everyone must be able to</text><text x="794.0" y="172.8" font-size="11.8" font-weight="bold" fill="#1f2937" text-anchor="start">live with it</text><text x="794.0" y="201.5" font-size="9.5" font-weight="bold" fill="#0d9488" text-anchor="start">HOW</text><text x="794.0" y="217.5" font-size="11.3" font-weight="normal" fill="#1f2937" text-anchor="start">A gradient of agreement; set</text><text x="794.0" y="231.6" font-size="11.3" font-weight="normal" fill="#1f2937" text-anchor="start">the required level first</text><rect x="20.0" y="330.0" width="940.0" height="42.0" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.6"/><text x="490.0" y="354.9" font-size="12" font-weight="bold" fill="#374151" text-anchor="middle">Majority vote: only for low-impact choices the team can make itself</text><rect x="20.0" y="380.0" width="940.0" height="40.0" rx="8" fill="#1e3a8a" stroke="#1e3a8a" stroke-width="1.6"/><text x="490.0" y="404.1" font-size="12.5" font-weight="normal" fill="#ffffff" text-anchor="middle">The Product Owner still decides the order of the Product Backlog; the Developers decide how to build</text></svg>