<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 470" width="980" height="470" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">Where project management duties go in Scrum</title><desc id="d">Scrum has no project manager. Scope and priorities go to the Product Owner, planning and quality to the Developers, and the process and impediments to the Scrum Master. Reporting is replaced by transparency of the artifacts.</desc><defs><marker id="ah0" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker></defs><rect x="0.75" y="0.75" width="978.5" height="468.5" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><text x="20.0" y="28.0" font-size="18" font-weight="bold" fill="#1f2937" text-anchor="start">Scrum has no project manager: the duties are shared</text><text x="20.0" y="48.0" font-size="12" font-weight="normal" fill="#6b7280" text-anchor="start">Scrum Guide 2020: three accountabilities, no sub-teams or hierarchies</text><rect x="340.0" y="64.0" width="300.0" height="56.0" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.6"/><text x="490.0" y="96.2" font-size="13" font-weight="bold" fill="#374151" text-anchor="middle">Traditional project manager's duties</text><line x1="490.0" y1="122.0" x2="170.0" y2="168.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#ah0)"/><rect x="20.0" y="170.0" width="300.0" height="44.0" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="170.0" y="196.4" font-size="13.5" font-weight="bold" fill="#14532d" text-anchor="middle">Product Owner</text><rect x="20.0" y="220.0" width="300.0" height="150.0" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/><text x="32.0" y="244.0" font-size="13" font-weight="bold" fill="#16a34a" text-anchor="start">•</text><text x="46.0" y="244.0" font-size="12" font-weight="normal" fill="#1f2937" text-anchor="start">Scope and priorities</text><text x="32.0" y="267.0" font-size="13" font-weight="bold" fill="#16a34a" text-anchor="start">•</text><text x="46.0" y="267.0" font-size="12" font-weight="normal" fill="#1f2937" text-anchor="start">The Product Backlog and the Product Goal</text><text x="32.0" y="290.0" font-size="13" font-weight="bold" fill="#16a34a" text-anchor="start">•</text><text x="46.0" y="290.0" font-size="12" font-weight="normal" fill="#1f2937" text-anchor="start">Stakeholder communication, with the Scrum</text><text x="46.0" y="305.0" font-size="12" font-weight="normal" fill="#1f2937" text-anchor="start">Team at the Review</text><line x1="490.0" y1="122.0" x2="490.0" y2="168.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#ah0)"/><rect x="340.0" y="170.0" width="300.0" height="44.0" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="490.0" y="196.4" font-size="13.5" font-weight="bold" fill="#1e3a8a" text-anchor="middle">Developers</text><rect x="340.0" y="220.0" width="300.0" height="150.0" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/><text x="352.0" y="244.0" font-size="13" font-weight="bold" fill="#2563eb" text-anchor="start">•</text><text x="366.0" y="244.0" font-size="12" font-weight="normal" fill="#1f2937" text-anchor="start">Planning and sizing the work</text><text x="352.0" y="267.0" font-size="13" font-weight="bold" fill="#2563eb" text-anchor="start">•</text><text x="366.0" y="267.0" font-size="12" font-weight="normal" fill="#1f2937" text-anchor="start">Who does what, when and how</text><text x="352.0" y="290.0" font-size="13" font-weight="bold" fill="#2563eb" text-anchor="start">•</text><text x="366.0" y="290.0" font-size="12" font-weight="normal" fill="#1f2937" text-anchor="start">Quality through the Definition of Done</text><text x="352.0" y="313.0" font-size="13" font-weight="bold" fill="#2563eb" text-anchor="start">•</text><text x="366.0" y="313.0" font-size="12" font-weight="normal" fill="#1f2937" text-anchor="start">Adapting daily</text><line x1="490.0" y1="122.0" x2="810.0" y2="168.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#ah0)"/><rect x="660.0" y="170.0" width="300.0" height="44.0" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.6"/><text x="810.0" y="196.4" font-size="13.5" font-weight="bold" fill="#4c1d95" text-anchor="middle">Scrum Master</text><rect x="660.0" y="220.0" width="300.0" height="150.0" rx="8" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/><text x="672.0" y="244.0" font-size="13" font-weight="bold" fill="#7c3aed" text-anchor="start">•</text><text x="686.0" y="244.0" font-size="12" font-weight="normal" fill="#1f2937" text-anchor="start">The Scrum process and its health</text><text x="672.0" y="267.0" font-size="13" font-weight="bold" fill="#7c3aed" text-anchor="start">•</text><text x="686.0" y="267.0" font-size="12" font-weight="normal" fill="#1f2937" text-anchor="start">Removing impediments</text><text x="672.0" y="290.0" font-size="13" font-weight="bold" fill="#7c3aed" text-anchor="start">•</text><text x="686.0" y="290.0" font-size="12" font-weight="normal" fill="#1f2937" text-anchor="start">Coaching, facilitating, training</text><text x="672.0" y="313.0" font-size="13" font-weight="bold" fill="#7c3aed" text-anchor="start">•</text><text x="686.0" y="313.0" font-size="12" font-weight="normal" fill="#1f2937" text-anchor="start">Working with the organization</text><rect x="20.0" y="400.0" width="940.0" height="50.0" rx="8" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.6"/><text x="490.0" y="421.4" font-size="12" font-weight="bold" fill="#134e4a" text-anchor="middle">Reporting status is replaced by transparency</text><text x="490.0" y="436.4" font-size="12" font-weight="normal" fill="#134e4a" text-anchor="middle">the Sprint Backlog, the Increment and the Sprint Review show the real state of the work</text></svg>