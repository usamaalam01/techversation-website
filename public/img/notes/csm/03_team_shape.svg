<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 430" width="980" height="430" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">The Scrum Team</title><desc id="d">One Scrum Master, one Product Owner and Developers form one cohesive Scrum Team of typically ten or fewer people, with no sub-teams or hierarchies, cross-functional and self-managing, focused on the Product Goal. A team that grows too large becomes several Scrum Teams that share the same Product Goal, Product Backlog and Product Owner.</desc><defs><marker id="ah0" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker></defs><rect x="0.75" y="0.75" width="978.5" height="428.5" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><text x="20.0" y="28.0" font-size="18" font-weight="bold" fill="#1f2937" text-anchor="start">The Scrum Team</text><text x="20.0" y="48.0" font-size="12" font-weight="normal" fill="#6b7280" text-anchor="start">Scrum Guide 2020: one cohesive unit of professionals focused on one objective at a time, the Product Goal</text><rect x="20.0" y="66.0" width="600.0" height="300.0" rx="14" fill="#f8fafc" stroke="#0d9488" stroke-width="2"/><text x="36.0" y="90.0" font-size="12.5" font-weight="bold" fill="#134e4a" text-anchor="start">ONE SCRUM TEAM: typically 10 or fewer people, no sub-teams, no hierarchies</text><rect x="40.0" y="108.0" width="180.0" height="96.0" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.6"/><text x="130.0" y="138.2" font-size="11.5" font-weight="bold" fill="#4c1d95" text-anchor="middle">Scrum Master</text><text x="130.0" y="152.6" font-size="11.5" font-weight="normal" fill="#4c1d95" text-anchor="middle">one</text><text x="130.0" y="166.9" font-size="11.5" font-weight="normal" fill="#4c1d95" text-anchor="middle">serves the team, the Product</text><text x="130.0" y="181.3" font-size="11.5" font-weight="normal" fill="#4c1d95" text-anchor="middle">Owner and the organization</text><rect x="240.0" y="108.0" width="180.0" height="96.0" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="330.0" y="138.2" font-size="11.5" font-weight="bold" fill="#14532d" text-anchor="middle">Product Owner</text><text x="330.0" y="152.6" font-size="11.5" font-weight="normal" fill="#14532d" text-anchor="middle">one person, not a committee</text><text x="330.0" y="166.9" font-size="11.5" font-weight="normal" fill="#14532d" text-anchor="middle">maximizes the value of the</text><text x="330.0" y="181.3" font-size="11.5" font-weight="normal" fill="#14532d" text-anchor="middle">product</text><rect x="440.0" y="108.0" width="160.0" height="96.0" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="520.0" y="145.4" font-size="11.5" font-weight="bold" fill="#1e3a8a" text-anchor="middle">Developers</text><text x="520.0" y="159.7" font-size="11.5" font-weight="normal" fill="#1e3a8a" text-anchor="middle">all the people who create</text><text x="520.0" y="174.1" font-size="11.5" font-weight="normal" fill="#1e3a8a" text-anchor="middle">the Increment</text><rect x="40.0" y="224.0" width="270.0" height="56.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="175.0" y="248.6" font-size="11.5" font-weight="bold" fill="#1f2937" text-anchor="middle">Cross-functional</text><text x="175.0" y="262.9" font-size="11.5" font-weight="normal" fill="#1f2937" text-anchor="middle">all the skills needed to create value each Sprint</text><rect x="330.0" y="224.0" width="270.0" height="56.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="465.0" y="248.6" font-size="11.5" font-weight="bold" fill="#1f2937" text-anchor="middle">Self-managing</text><text x="465.0" y="262.9" font-size="11.5" font-weight="normal" fill="#1f2937" text-anchor="middle">decides who does what, when and how</text><rect x="40.0" y="298.0" width="560.0" height="52.0" rx="8" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.6"/><text x="320.0" y="320.4" font-size="12" font-weight="bold" fill="#134e4a" text-anchor="middle">Accountable together for a valuable, useful Increment every Sprint</text><text x="320.0" y="335.4" font-size="12" font-weight="normal" fill="#134e4a" text-anchor="middle">focus: one objective at a time, the Product Goal</text><rect x="660.0" y="66.0" width="300.0" height="120.0" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="810.0" y="114.9" font-size="12" font-weight="bold" fill="#78350f" text-anchor="middle">Too large?</text><text x="810.0" y="129.9" font-size="12" font-weight="normal" fill="#78350f" text-anchor="middle">Reorganize into multiple cohesive Scrum Teams,</text><text x="810.0" y="144.9" font-size="12" font-weight="normal" fill="#78350f" text-anchor="middle">each focused on the same product</text><rect x="660.0" y="206.0" width="300.0" height="160.0" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="810.0" y="259.9" font-size="12" font-weight="bold" fill="#14532d" text-anchor="middle">They share</text><text x="810.0" y="274.9" font-size="12" font-weight="normal" fill="#14532d" text-anchor="middle">the same Product Goal</text><text x="810.0" y="289.9" font-size="12" font-weight="normal" fill="#14532d" text-anchor="middle">the same Product Backlog</text><text x="810.0" y="304.9" font-size="12" font-weight="normal" fill="#14532d" text-anchor="middle">the same Product Owner</text><text x="810.0" y="319.9" font-size="12" font-weight="normal" fill="#14532d" text-anchor="middle">(and one Definition of Done, Topic 12)</text><line x1="660.0" y1="126.0" x2="624.0" y2="126.0" stroke="#1f2937" stroke-width="2" marker-end="url(#ah0)"/><text x="490.0" y="408.0" font-size="11.5" font-weight="normal" fill="#6b7280" text-anchor="middle" font-style="italic">2017 wording: a Development Team of 3 to 9 members inside the Scrum Team. 2020: one Scrum Team, typically 10 or fewer.</text></svg>