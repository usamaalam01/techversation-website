<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 400" width="980" height="400" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">The five Scrum values</title><desc id="d">Commitment, focus, openness, respect and courage. They give direction to the Scrum Team and, when embodied, bring the empirical pillars of transparency, inspection and adaptation to life, building trust.</desc><defs><marker id="ah0" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker></defs><rect x="0.75" y="0.75" width="978.5" height="398.5" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><text x="20.0" y="28.0" font-size="18" font-weight="bold" fill="#1f2937" text-anchor="start">The five Scrum values</text><text x="20.0" y="48.0" font-size="12" font-weight="normal" fill="#6b7280" text-anchor="start">Scrum Guide 2020: values give direction, and bring the empirical pillars to life, building trust</text><rect x="20.0" y="66.0" width="172.0" height="46.0" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="106.0" y="93.5" font-size="14" font-weight="bold" fill="#1e3a8a" text-anchor="middle">Commitment</text><rect x="20.0" y="118.0" width="172.0" height="150.0" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/><text x="30.0" y="142.0" font-size="12" font-weight="normal" fill="#1f2937" text-anchor="start">Commits to achieving its</text><text x="30.0" y="157.0" font-size="12" font-weight="normal" fill="#1f2937" text-anchor="start">goals and to supporting</text><text x="30.0" y="172.0" font-size="12" font-weight="normal" fill="#1f2937" text-anchor="start">each other</text><text x="30.0" y="216.0" font-size="10.5" font-weight="bold" fill="#2563eb" text-anchor="start">You see it in:</text><text x="30.0" y="231.0" font-size="10.8" font-weight="normal" fill="#6b7280" text-anchor="start">Sprint Goal, Definition of Done</text><rect x="212.0" y="66.0" width="172.0" height="46.0" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="298.0" y="93.5" font-size="14" font-weight="bold" fill="#14532d" text-anchor="middle">Focus</text><rect x="212.0" y="118.0" width="172.0" height="150.0" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/><text x="222.0" y="142.0" font-size="12" font-weight="normal" fill="#1f2937" text-anchor="start">Primary focus on the work</text><text x="222.0" y="157.0" font-size="12" font-weight="normal" fill="#1f2937" text-anchor="start">of the Sprint, for the best</text><text x="222.0" y="172.0" font-size="12" font-weight="normal" fill="#1f2937" text-anchor="start">possible progress toward</text><text x="222.0" y="187.0" font-size="12" font-weight="normal" fill="#1f2937" text-anchor="start">the goals</text><text x="222.0" y="216.0" font-size="10.5" font-weight="bold" fill="#16a34a" text-anchor="start">You see it in:</text><text x="222.0" y="231.0" font-size="10.8" font-weight="normal" fill="#6b7280" text-anchor="start">Sprint Goal, Daily Scrum</text><rect x="404.0" y="66.0" width="172.0" height="46.0" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="490.0" y="93.5" font-size="14" font-weight="bold" fill="#78350f" text-anchor="middle">Openness</text><rect x="404.0" y="118.0" width="172.0" height="150.0" rx="8" fill="#ffffff" stroke="#d97706" stroke-width="1.5"/><text x="414.0" y="142.0" font-size="12" font-weight="normal" fill="#1f2937" text-anchor="start">Open about the work and</text><text x="414.0" y="157.0" font-size="12" font-weight="normal" fill="#1f2937" text-anchor="start">the challenges</text><text x="414.0" y="216.0" font-size="10.5" font-weight="bold" fill="#d97706" text-anchor="start">You see it in:</text><text x="414.0" y="231.0" font-size="10.8" font-weight="normal" fill="#6b7280" text-anchor="start">Visible artifacts, Review,</text><text x="414.0" y="244.5" font-size="10.8" font-weight="normal" fill="#6b7280" text-anchor="start">Retrospective</text><rect x="596.0" y="66.0" width="172.0" height="46.0" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.6"/><text x="682.0" y="93.5" font-size="14" font-weight="bold" fill="#4c1d95" text-anchor="middle">Respect</text><rect x="596.0" y="118.0" width="172.0" height="150.0" rx="8" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/><text x="606.0" y="142.0" font-size="12" font-weight="normal" fill="#1f2937" text-anchor="start">Respect each other as</text><text x="606.0" y="157.0" font-size="12" font-weight="normal" fill="#1f2937" text-anchor="start">capable, independent</text><text x="606.0" y="172.0" font-size="12" font-weight="normal" fill="#1f2937" text-anchor="start">people</text><text x="606.0" y="216.0" font-size="10.5" font-weight="bold" fill="#7c3aed" text-anchor="start">You see it in:</text><text x="606.0" y="231.0" font-size="10.8" font-weight="normal" fill="#6b7280" text-anchor="start">Collaboration, respected</text><text x="606.0" y="244.5" font-size="10.8" font-weight="normal" fill="#6b7280" text-anchor="start">Product Owner</text><rect x="788.0" y="66.0" width="172.0" height="46.0" rx="8" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.6"/><text x="874.0" y="93.5" font-size="14" font-weight="bold" fill="#134e4a" text-anchor="middle">Courage</text><rect x="788.0" y="118.0" width="172.0" height="150.0" rx="8" fill="#ffffff" stroke="#0d9488" stroke-width="1.5"/><text x="798.0" y="142.0" font-size="12" font-weight="normal" fill="#1f2937" text-anchor="start">The courage to do the right</text><text x="798.0" y="157.0" font-size="12" font-weight="normal" fill="#1f2937" text-anchor="start">thing and to work on tough</text><text x="798.0" y="172.0" font-size="12" font-weight="normal" fill="#1f2937" text-anchor="start">problems</text><text x="798.0" y="216.0" font-size="10.5" font-weight="bold" fill="#0d9488" text-anchor="start">You see it in:</text><text x="798.0" y="231.0" font-size="10.8" font-weight="normal" fill="#6b7280" text-anchor="start">Saying no, honest</text><text x="798.0" y="244.5" font-size="10.8" font-weight="normal" fill="#6b7280" text-anchor="start">Retrospective</text><line x1="490.0" y1="284.0" x2="490.0" y2="306.0" stroke="#6b7280" stroke-width="2" marker-end="url(#ah0)"/><rect x="20.0" y="308.0" width="940.0" height="40.0" rx="8" fill="#1e3a8a" stroke="#1e3a8a" stroke-width="1.6"/><text x="490.0" y="332.1" font-size="12.5" font-weight="normal" fill="#ffffff" text-anchor="middle">Together they give direction to the Scrum Team and bring the empirical pillars (transparency, inspection, adaptation) to life, building trust</text><text x="490.0" y="376.0" font-size="12" font-weight="bold" fill="#5b21b6" text-anchor="middle">Values are not pillars: transparency, inspection and adaptation are the pillars.</text></svg>