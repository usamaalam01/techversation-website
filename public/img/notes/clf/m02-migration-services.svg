<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 176" width="880" height="176" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">m02-migration-services</title><desc id="d">Four migration services: Application Discovery Service finds servers, Migration Hub tracks progress, Application Migration Service moves servers and Migration Evaluator builds the business case.</desc><defs></defs><rect x="0.75" y="0.75" width="878.5" height="174.5" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><rect x="8.0" y="8.0" width="207.0" height="150.0" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="111.5" y="68.2" font-size="16" font-weight="bold" fill="#1e3a8a" text-anchor="middle">Discovery Service</text><text x="111.5" y="88.2" font-size="16" font-weight="normal" fill="#1e3a8a" text-anchor="middle">finds servers and their</text><text x="111.5" y="108.2" font-size="16" font-weight="normal" fill="#1e3a8a" text-anchor="middle">usage</text><rect x="227.0" y="8.0" width="207.0" height="150.0" rx="8" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.6"/><text x="330.5" y="68.2" font-size="16" font-weight="bold" fill="#134e4a" text-anchor="middle">Migration Hub</text><text x="330.5" y="88.2" font-size="16" font-weight="normal" fill="#134e4a" text-anchor="middle">plans and tracks</text><text x="330.5" y="108.2" font-size="16" font-weight="normal" fill="#134e4a" text-anchor="middle">migrations</text><rect x="446.0" y="8.0" width="207.0" height="150.0" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="549.5" y="58.2" font-size="16" font-weight="bold" fill="#14532d" text-anchor="middle">Application Migration</text><text x="549.5" y="78.2" font-size="16" font-weight="bold" fill="#14532d" text-anchor="middle">Service</text><text x="549.5" y="98.2" font-size="16" font-weight="normal" fill="#14532d" text-anchor="middle">moves servers (AWS</text><text x="549.5" y="118.2" font-size="16" font-weight="norma