<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 236" width="880" height="236" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">m08-storage-types</title><desc id="d">Three kinds of storage: object storage in Amazon S3 holds objects in buckets, block storage in Amazon EBS and instance store is a virtual disk for one server, and file storage in Amazon EFS and Amazon FSx is a shared file system.</desc><defs></defs><rect x="0.75" y="0.75" width="878.5" height="234.5" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><rect x="8.0" y="8.0" width="278.7" height="56.0" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="147.3" y="42.5" font-size="20" font-weight="bold" fill="#1e3a8a" text-anchor="middle">Object</text><rect x="8.0" y="72.0" width="278.7" height="148.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="147.3" y="119.7" font-size="17" font-weight="bold" fill="#1f2937" text-anchor="middle">Amazon S3</text><text x="147.3" y="140.9" font-size="17" font-weight="normal" fill="#1f2937" text-anchor="middle">objects in buckets</text><text x="147.3" y="162.2" font-size="17" font-weight="normal" fill="#1f2937" text-anchor="middle">websites, backups,</text><text x="147.3" y="183.4" font-size="17" font-weight="normal" fill="#1f2937" text-anchor="middle">archives, data lakes</text><rect x="300.7" y="8.0" width="278.7" height="56.0" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="440.0" y="42.5" font-size="20" font-weight="bold" fill="#14532d" text-anchor="middle">Block</text><rect x="300.7" y="72.0" width="278.7" height="148.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="440.0" y="119.7" font-size="17" font-weight="bold" fill="#1f2937" text-anchor="middle">Amazon EBS</text><text x="440.0" y="140.9" font-size="17" font-weight="bold" fill="#1f2937" text-anchor="middle">EC2 instance store</text><text x="440.0" y="162.2" font-size="17" font-weight="normal" fill="#1f2937" text-anchor="middle">a virtual disk for</text><text x="440.0" y="183.4" font-size="17" font-weight="normal" fill="#1f2937" text-anchor="middle">one server</text><rect x="593.3" y="8.0" width="278.7" height="56.0" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="732.7" y="42.5" font-size="20" font-weight="bold" fill="#78350f" text-anchor="middle">File</text><rect x="593.3" y="72.0" width="278.7" height="148.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="732.7" y="119.7" font-size="17" font-weight="bold" fill="#1f2937" text-anchor="middle">Amazon EFS</text><text x="732.7" y="140.9" font-size="17" font-weight="bold" fill="#1f2937" text-anchor="middle">Amazon FSx</text><text x="732.7" y="162.2" font-size="17" font-weight="normal" fill="#1f2937" text-anchor="middle">a shared file system</text><text x="732.7" y="183.4" font-size="17" font-weight="normal" fill="#1f2937" text-anchor="middle">many servers mount</text></svg>