<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 236" width="880" height="236" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">m04-cognito</title><desc id="d">A mobile app signs customers in through a Cognito user pool and receives temporary AWS credentials from an identity pool to use Amazon S3.</desc><defs><marker id="ah0" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker></defs><rect x="0.75" y="0.75" width="878.5" height="234.5" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><rect x="8.0" y="8.0" width="196.5" height="124.0" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.6"/><text x="106.2" y="55.2" font-size="16" font-weight="bold" fill="#374151" text-anchor="middle">Mobile app</text><text x="106.2" y="75.2" font-size="16" font-weight="normal" fill="#374151" text-anchor="middle">customer signs up or</text><text x="106.2" y="95.2" font-size="16" font-weight="normal" fill="#374151" text-anchor="middle">signs in</text><line x1="206.5" y1="70.0" x2="228.5" y2="70.0" stroke="#1f2937" stroke-width="2.6" marker-end="url(#ah0)"/><rect x="230.5" y="8.0" width="196.5" height="124.0" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="328.8" y="65.2" font-size="16" font-weight="bold" fill="#1e3a8a" text-anchor="middle">User pool</text><text x="328.8" y="85.2" font-size="16" font-weight="normal" fill="#1e3a8a" text-anchor="middle">directory, sign-in, tokens</text><line x1="429.0" y1="70.0" x2="451.0" y2="70.0" stroke="#1f2937" stroke-width="2.6" marker-end="url(#ah0)"/><rect x="453.0" y="8.0" width="196.5" height="124.0" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="551.2" y="55.2" font-size="16" font-weight="bold" fill="#78350f" text-anchor="middle">Identity pool</text><text x="551.2" y="75.2" font-size="16" font-weight="normal" fill="#78350f" text-anchor="middle">swaps the sign-in for</text><text x="551.2" y="95.2" font-size="16" font-weight="normal" fill="#78350f" text-anchor="middle">temporary credentials</text><line x1="651.5" y1="70.0" x2="673.5" y2="70.0" stroke="#1f2937" stroke-width="2.6" marker-end="url(#ah0)"/><rect x="675.5" y="8.0" width="196.5" height="124.0" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="773.8" y="65.2" font-size="16" font-weight="bold" fill="#14532d" text-anchor="middle">AWS service</text><text x="773.8" y="85.2" font-size="16" font-weight="normal" fill="#14532d" text-anchor="middle">for example Amazon S3</text><rect x="8.0" y="148.0" width="424.0" height="74.0" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="220.0" y="180.2" font-size="16" font-weight="bold" fill="#1e3a8a" text-anchor="middle">User pool answers</text><text x="220.0" y="200.2" font-size="16" font-weight="normal" fill="#1e3a8a" text-anchor="middle">who is this user?</text><rect x="448.0" y="148.0" width="424.0" height="74.0" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="660.0" y="180.2" font-size="16" font-weight="bold" fill="#78350f" text-anchor="middle">Identity pool answers</text><text x="660.0" y="200.2" font-size="16" font-weight="normal" fill="#78350f" text-anchor="middle">what AWS resources may they reach?</text></svg>