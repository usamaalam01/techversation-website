<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 268" width="880" height="268" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">m02-seven-rs</title><desc id="d">Four strategies from no change to a full redesign (rehost, relocate, replatform, refactor), plus repurchase, retire and retain.</desc><defs><marker id="ah0" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker><marker id="ah1" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker></defs><rect x="0.75" y="0.75" width="878.5" height="266.5" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><line x1="8.0" y1="22.0" x2="872.0" y2="22.0" stroke="#6b7280" stroke-width="2.4" marker-end="url(#ah0)"/><rect x="360.0" y="8.0" width="160.0" height="28.0" rx="0" fill="#ffffff" stroke="#ffffff" stroke-width="0"/><text x="440.0" y="28.0" font-size="15" font-weight="bold" fill="#374151" text-anchor="middle">more change</text><rect x="8.0" y="40.0" width="198.0" height="94.0" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="107.0" y="82.2" font-size="16" font-weight="bold" fill="#14532d" text-anchor="middle">Rehost</text><text x="107.0" y="102.2" font-size="16" font-weight="normal" fill="#14532d" text-anchor="middle">move it as it is</text><line x1="208.0" y1="87.0" x2="228.0" y2="87.0" stroke="#374151" stroke-width="2.4" marker-end="url(#ah1)"/><rect x="230.0" y="40.0" width="198.0" height="94.0" rx="8" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.6"/><text x="329.0" y="72.2" font-size="16" font-weight="bold" fill="#134e4a" text-anchor="middle">Relocate</text><text x="329.0" y="92.2" font-size="16" font-weight="normal" fill="#134e4a" text-anchor="middle">to the cloud version of</text><text x="329.0" y="112.2" font-size="16" font-weight="normal" fill="#134e4a" text-anchor="middle">the platform</text><line x1="430.0" y1="87.0" x2="450.0" y2="87.0" stroke="#374151" stroke-width="2.4" marker-end="url(#ah1)"/><rect x="452.0" y="40.0" width="198.0" height="94.0" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="551.0" y="82.2" font-size="16" font-weight="bold" fill="#78350f" text-anchor="middle">Replatform</text><text x="551.0" y="102.2" font-size="16" font-weight="normal" fill="#78350f" text-anchor="middle">some optimization</text><line x1="652.0" y1="87.0" x2="672.0" y2="87.0" stroke="#374151" stroke-width="2.4" marker-end="url(#ah1)"/><rect x="674.0" y="40.0" width="198.0" height="94.0" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.6"/><text x="773.0" y="82.2" font-size="16" font-weight="bold" fill="#7f1d1d" text-anchor="middle">Refactor</text><text x="773.0" y="102.2" font-size="16" font-weight="normal" fill="#7f1d1d" text-anchor="middle">cloud-native redesign</text><text x="8.0" y="160.0" font-size="16" font-weight="bold" fill="#374151" text-anchor="start">Three more</text><rect x="8.0" y="170.0" width="280.0" height="90.0" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.6"/><text x="148.0" y="200.2" font-size="16" font-weight="bold" fill="#4c1d95" text-anchor="middle">Repurchase</text><text x="148.0" y="220.2" font-size="16" font-weight="normal" fill="#4c1d95" text-anchor="middle">replace it with a different product,</text><text x="148.0" y="240.2" font-size="16" font-weight="normal" fill="#4c1d95" text-anchor="middle">often SaaS</text><rect x="300.0" y="170.0" width="280.0" height="90.0" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.6"/><text x="440.0" y="210.2" font-size="16" font-weight="bold" fill="#374151" text-anchor="middle">Retire</text><text x="440.0" y="230.2" font-size="16" font-weight="normal" fill="#374151" text-anchor="middle">switch it off</text><rect x="592.0" y="170.0" width="280.0" height="90.0" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.6"/><text x="732.0" y="210.2" font-size="16" font-weight="bold" fill="#374151" text-anchor="middle">Retain</text><text x="732.0" y="230.2" font-size="16" font-weight="normal" fill="#374151" text-anchor="middle">keep it where it is for now</text></svg>