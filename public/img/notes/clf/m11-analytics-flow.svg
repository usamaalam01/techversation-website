<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 262" width="880" height="262" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">m11-analytics-flow</title><desc id="d">The analytics flow: collect with Kinesis and S3, prepare with Glue, analyze with Athena, Redshift, EMR or OpenSearch, and visualize with Amazon Quick.</desc><defs><marker id="ah0" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker></defs><rect x="0.75" y="0.75" width="878.5" height="260.5" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><rect x="8.0" y="8.0" width="190.0" height="46.0" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="103.0" y="36.8" font-size="18" font-weight="bold" fill="#1e3a8a" text-anchor="middle">Collect</text><rect x="8.0" y="62.0" width="190.0" height="130.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="103.0" y="103.8" font-size="15" font-weight="bold" fill="#1f2937" text-anchor="middle">Amazon Kinesis</text><text x="103.0" y="122.5" font-size="15" font-weight="bold" fill="#1f2937" text-anchor="middle">Amazon S3</text><text x="103.0" y="141.2" font-size="15" font-weight="normal" fill="#1f2937" text-anchor="middle">streams and</text><text x="103.0" y="160.0" font-size="15" font-weight="normal" fill="#1f2937" text-anchor="middle">the data lake</text><line x1="198.0" y1="31.0" x2="230.0" y2="31.0" stroke="#374151" stroke-width="2.6" marker-end="url(#ah0)"/><rect x="232.0" y="8.0" width="190.0" height="46.0" rx="8" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.6"/><text x="327.0" y="36.8" font-size="18" font-weight="bold" fill="#134e4a" text-anchor="middle">Prepare</text><rect x="232.0" y="62.0" width="190.0" height="130.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="327.0" y="103.8" font-size="15" font-weight="bold" fill="#1f2937" text-anchor="middle">AWS Glue</text><text x="327.0" y="122.5" font-size="15" font-weight="normal" fill="#1f2937" text-anchor="middle"></text><text x="327.0" y="141.2" font-size="15" font-weight="normal" fill="#1f2937" text-anchor="middle">discover, catalog</text><text x="327.0" y="160.0" font-size="15" font-weight="normal" fill="#1f2937" text-anchor="middle">and transform</text><line x1="422.0" y1="31.0" x2="454.0" y2="31.0" stroke="#374151" stroke-width="2.6" marker-end="url(#ah0)"/><rect x="456.0" y="8.0" width="190.0" height="46.0" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="551.0" y="36.8" font-size="18" font-weight="bold" fill="#78350f" text-anchor="middle">Analyze</text><rect x="456.0" y="62.0" width="190.0" height="130.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="551.0" y="103.8" font-size="15" font-weight="bold" fill="#1f2937" text-anchor="middle">Amazon Athena</text><text x="551.0" y="122.5" font-size="15" font-weight="bold" fill="#1f2937" text-anchor="middle">Amazon Redshift</text><text x="551.0" y="141.2" font-size="15" font-weight="bold" fill="#1f2937" text-anchor="middle">Amazon EMR</text><text x="551.0" y="160.0" font-size="15" font-weight="bold" fill="#1f2937" text-anchor="middle">OpenSearch Service</text><line x1="646.0" y1="31.0" x2="678.0" y2="31.0" stroke="#374151" stroke-width="2.6" marker-end="url(#ah0)"/><rect x="680.0" y="8.0" width="190.0" height="46.0" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.6"/><text x="775.0" y="36.8" font-size="18" font-weight="bold" fill="#4c1d95" text-anchor="middle">Visualize</text><rect x="680.0" y="62.0" width="190.0" height="130.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="775.0" y="103.8" font-size="15" font-weight="bold" fill="#1f2937" text-anchor="middle">Amazon Quick</text><text x="775.0" y="122.5" font-size="15" font-weight="normal" fill="#1f2937" text-anchor="middle"></text><text x="775.0" y="141.2" font-size="15" font-weight="normal" fill="#1f2937" text-