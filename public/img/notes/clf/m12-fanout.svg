<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 342" width="880" height="342" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">m12-fanout</title><desc id="d">The shop publishes one order message to an SNS topic, and SNS delivers a copy to an SQS queue for fulfillment, to an email address and to a text message.</desc><defs><marker id="ah0" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker></defs><rect x="0.75" y="0.75" width="878.5" height="340.5" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><rect x="8.0" y="100.0" width="176.0" height="90.0" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.6"/><text x="96.0" y="130.2" font-size="16" font-weight="bold" fill="#374151" text-anchor="middle">Shop</text><text x="96.0" y="150.2" font-size="16" font-weight="normal" fill="#374151" text-anchor="middle">publishes one</text><text x="96.0" y="170.2" font-size="16" font-weight="normal" fill="#374151" text-anchor="middle">order message</text><line x1="184.0" y1="145.0" x2="298.0" y2="145.0" stroke="#374151" stroke-width="2.8" marker-end="url(#ah0)"/><rect x="300.0" y="70.0" width="200.0" height="150.0" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="400.0" y="120.2" font-size="16" font-weight="bold" fill="#1e3a8a" text-anchor="middle">Amazon SNS</text><text x="400.0" y="140.2" font-size="16" font-weight="bold" fill="#1e3a8a" text-anchor="middle">topic</text><text x="400.0" y="160.2" font-size="16" font-weight="normal" fill="#1e3a8a" text-anchor="middle">copies to every</text><text x="400.0" y="180.2" font-size="16" font-weight="normal" fill="#1e3a8a" text-anchor="middle">subscriber</text><rect x="640.0" y="8.0" width="232.0" height="82.0" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="756.0" y="44.2" font-size="16" font-weight="bold" fill="#14532d" text-anchor="middle">Amazon SQS queue</text><text x="756.0" y="64.2" font-size="16" font-weight="normal" fill="#14532d" text-anchor="middle">fulfillment system</text><line x1="500.0" y1="145.0" x2="638.0" y2="49.0" stroke="#374151" stroke-width="2.4" marker-end="url(#ah0)"/><rect x="640.0" y="106.0" width="232.0" height="82.0" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="756.0" y="142.2" font-size="16" font-weight="bold" fill="#78350f" text-anchor="middle">Email</text><text x="756.0" y="162.2" font-size="16" font-weight="normal" fill="#78350f" text-anchor="middle">order confirmation</text><line x1="500.0" y1="145.0" x2="638.0" y2="147.0" stroke="#374151" stroke-width="2.4" marker-end="url(#ah0)"/><rect x="640.0" y="204.0" width="232.0" height="82.0" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.6"/><text x="756.0" y="240.2" font-size="16" font-weight="bold" fill="#4c1d95" text-anchor="middle">Text message</text><text x="756.0" y="260.2" font-size="16" font-weight="normal" fill="#4c1d95" text-anchor="middle">alert to the warehouse</text><line x1="500.0" y1="145.0" x2="638.0" y2="245.0" stroke="#374151" stroke-width="2.4" marker-end="url(#ah0)"/><rect x="8.0" y="296.0" width="864.0" height="38.0" rx="8" fill="#1e3a8a" stroke="#1e3a8a" stroke-width="1.6"/><text x="440.0" y="320.2" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">SNS: one message, many subscribers. SQS: messages wait for a consumer</text></svg>