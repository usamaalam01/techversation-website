<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 264" width="880" height="264" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">m12-pipeline</title><desc id="d">A CodePipeline pipeline moves a code change through source, build, test and deploy stages, with CodeBuild doing the build and test work, while X-Ray traces requests in the running application.</desc><defs><marker id="ah0" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker><marker id="ah1" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker></defs><rect x="0.75" y="0.75" width="878.5" height="262.5" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><rect x="8.0" y="8.0" width="864.0" height="138.0" rx="12" fill="#f9fafb" stroke="#9ca3af" stroke-width="2"/><text x="24.0" y="34.0" font-size="17" font-weight="bold" fill="#374151" text-anchor="start">Pipeline: AWS CodePipeline automates the release steps</text><rect x="24.0" y="54.0" width="176.0" height="76.0" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="112.0" y="87.2" font-size="16" font-weight="bold" fill="#1e3a8a" text-anchor="middle">Source</text><text x="112.0" y="107.2" font-size="16" font-weight="normal" fill="#1e3a8a" text-anchor="middle">code change</text><line x1="200.0" y1="92.0" x2="234.0" y2="92.0" stroke="#374151" stroke-width="2.6" marker-end="url(#ah0)"/><rect x="236.0" y="54.0" width="176.0" height="76.0" rx="8" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.6"/><text x="324.0" y="87.2" font-size="16" font-weight="bold" fill="#134e4a" text-anchor="middle">Build</text><text x="324.0" y="107.2" font-size="16" font-weight="normal" fill="#134e4a" text-anchor="middle">AWS CodeBuild</text><line x1="412.0" y1="92.0" x2="446.0" y2="92.0" stroke="#374151" stroke-width="2.6" marker-end="url(#ah0)"/><rect x="448.0" y="54.0" width="176.0" height="76.0" rx="8" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.6"/><text x="536.0" y="87.2" font-size="16" font-weight="bold" fill="#134e4a" text-anchor="middle">Test</text><text x="536.0" y="107.2" font-size="16" font-weight="normal" fill="#134e4a" text-anchor="middle">AWS CodeBuild</text><line x1="624.0" y1="92.0" x2="658.0" y2="92.0" stroke="#374151" stroke-width="2.6" marker-end="url(#ah0)"/><rect x="660.0" y="54.0" width="176.0" height="76.0" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="748.0" y="87.2" font-size="16" font-weight="bold" fill="#14532d" text-anchor="middle">Deploy</text><text x="748.0" y="107.2" font-size="16" font-weight="normal" fill="#14532d" text-anchor="middle">release</text><line x1="660.0" y1="130.0" x2="660.0" y2="170.0" stroke="#7c3aed" stroke-width="2.6" marker-end="url(#ah1)"/><rect x="540.0" y="172.0" width="332.0" height="72.0" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.6"/><text x="706.0" y="203.2" font-size="16" font-weight="bold" fill="#4c1d95" text-anchor="middle">AWS X-Ray</text><text x="706.0" y="223.2" font-size="16" font-weight="normal" fill="#4c1d95" text-anchor="middle">traces requests in the running application</text><rect x="8.0" y="172.0" width="512.0" height="72.0" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.6"/><text x="264.0" y="213.2" font-size="16" font-weight="bold" fill="#374151" text-anchor="middle">A code change moves through the stages automatically</text></svg>