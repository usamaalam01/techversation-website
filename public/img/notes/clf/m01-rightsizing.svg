<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 292" width="880" height="292" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">m01-rightsizing</title><desc id="d">Three servers: too large and mostly idle, right-sized, and too small and overflowing.</desc><defs><marker id="ah0" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker></defs><rect x="0.75" y="0.75" width="878.5" height="290.5" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><rect x="40.0" y="40.0" width="200.0" height="160.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="2"/><rect x="40.0" y="184.0" width="200.0" height="16.0" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.6"/><text x="140.0" y="24.0" font-size="18" font-weight="bold" fill="#1f2937" text-anchor="middle">Too large</text><text x="140.0" y="228.0" font-size="16" font-weight="bold" fill="#dc2626" text-anchor="middle">wastes money</text><text x="140.0" y="176.0" font-size="15" font-weight="bold" fill="#1f2937" text-anchor="middle">10% used</text><rect x="330.0" y="40.0" width="200.0" height="160.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="2"/><rect x="330.0" y="88.0" width="200.0" height="112.0" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="430.0" y="24.0" font-size="18" font-weight="bold" fill="#1f2937" text-anchor="middle">Right size</text><text x="430.0" y="228.0" font-size="16" font-weight="bold" fill="#16a34a" text-anchor="middle">fits the workload</text><text x="430.0" y="150.0" font-size="15" font-weight="bold" fill="#1f2937" text-anchor="middle">70% used</text><rect x="620.0" y="40.0" width="200.0" height="160.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="2"/><rect x="620.0" y="40.0" width="200.0" height="160.0" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="720.0" y="24.0" font-size="18" font-weight="bold" fill="#1f2937" text-anchor="middle">Too small</text><text x="720.0" y="228.0" font-size="16" font-weight="bold" fill="#d97706" text-anchor="middle">hurts performance</text><text x="720.0" y="126.0" font-size="15" font-weight="bold" fill="#1f2937" text-anchor="middle">all used</text><line x1="792.0" y1="40.0" x2="792.0" y2="10.0" stroke="#d97706" stroke-width="2.6" marker-end="url(#ah0)"/><text x="800.0" y="22.0" font-size="14" font-weight="bold" fill="#78350f" text-anchor="start">overflow</text></svg>