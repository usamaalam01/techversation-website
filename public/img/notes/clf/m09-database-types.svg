<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 190" width="880" height="190" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">m09-database-types</title><desc id="d">Five data models and the AWS database service for each: relational in RDS and Aurora, key-value in DynamoDB, document in DocumentDB, in-memory in ElastiCache and graph in Neptune.</desc><defs></defs><rect x="0.75" y="0.75" width="878.5" height="188.5" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><rect x="8.0" y="8.0" width="164.8" height="46.0" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="90.4" y="36.5" font-size="17" font-weight="bold" fill="#1e3a8a" text-anchor="middle">Relational</text><rect x="8.0" y="62.0" width="164.8" height="112.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="90.4" y="105.0" font-size="14" font-weight="bold" fill="#1f2937" text-anchor="middle">Amazon RDS</text><text x="90.4" y="122.5" font-size="14" font-weight="bold" fill="#1f2937" text-anchor="middle">Amazon Aurora</text><text x="90.4" y="140.1" font-size="14" font-weight="normal" fill="#1f2937" text-anchor="middle">tables and SQL</text><rect x="182.8" y="8.0" width="164.8" height="46.0" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="265.2" y="36.5" font-size="17" font-weight="bold" fill="#14532d" text-anchor="middle">Key-value</text><rect x="182.8" y="62.0" width="164.8" height="112.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="265.2" y="105.0" font-size="14" font-weight="bold" fill="#1f2937" text-anchor="middle">Amazon DynamoDB</text><text x="265.2" y="122.5" font-size="14" font-weight="normal" fill="#1f2937" text-anchor="middle">fast lookups</text><text x="265.2" y="140.1" font-size="14" font-weight="normal" fill="#1f2937" text-anchor="middle">at any scale</text><rect x="357.6" y="8.0" width="164.8" height="46.0" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="440.0" y="36.5" font-size="17" font-weight="bold" fill="#78350f" text-anchor="middle">Document</text><rect x="357.6" y="62.0" width="164.8" height="112.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="440.0" y="105.0" font-size="14" font-weight="bold" fill="#1f2937" text-anchor="middle">Amazon DocumentDB</text><text x="440.0" y="122.5" font-size="14" font-weight="normal" fill="#1f2937" text-anchor="middle">JSON-like</text><text x="440.0" y="140.1" font-size="14" font-weight="normal" fill="#1f2937" text-anchor="middle">MongoDB-compatible</text><rect x="532.4" y="8.0" width="164.8" height="46.0" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.6"/><text x="614.8" y="36.5" font-size="17" font-weight="bold" fill="#4c1d95" text-anchor="middle">In-memory</text><rect x="532.4" y="62.0" width="164.8" height="112.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="614.8" y="105.0" font-size="14" font-weight="bold" fill="#1f2937" text-anchor="middle">Amazon ElastiCache</text><text x="614.8" y="122.5" font-size="14" font-weight="normal" fill="#1f2937" text-anchor="middle">data and caches</text><text x="614.8" y="140.1" font-size="14" font-weight="normal" fill="#1f2937" text-anchor="middle">held in memory</text><rect x="707.2" y="8.0" width="164.8" height="46.0" rx="8" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.6"/><text x="789.6" y="36.5" font-size="17" font-weight="bold" fill="#134e4a" text-anchor="middle">Graph</text><rect x="707.2" y="62.0" width="164.8" height="112.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="789.6" y="105.0" font-size="14" font-weight="bold" fill="#1f2937" text-anchor="middle">Amazon Neptune</text><text x="789.6" y="122.5" font-size="14" font-weight="normal" fill="#1f2937" text-anchor="middle">relationships</text><text x="789.6" y="140.1" font-size="14" font-weight="normal" fill="#1f2937" text-anchor="middle">between things</text></svg>