dth="232.0" height="90.0" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="756.0" y="50.2" font-size="16" font-weight="bold" fill="#14532d" text-anchor="middle">Resource A</text><text x="756.0" y="70.2" font-size="16" font-weight="normal" fill="#14532d" text-anchor="middle">healthy: gets traffic</text><rect x="640.0" y="140.0" width="232.0" height="90.0" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.6"/><text x="756.0" y="180.2" font-size="16" font-weight="bold" fill="#7f1d1d" text-anchor="middle">Resource B</text><text x="756.0" y="200.2" font-size="16" font-weight="normal" fill="#7f1d1d" text-anchor="middle">unhealthy: skipped</text><line x1="500.0" y1="100.0" x2="638.0" y2="56.0" stroke="#16a34a" stroke-width="2.8" marker-end="url(#ah1)"/><line x1="500.0" y1="150.0" x2="638.0" y2="184.0" stroke="#9ca3af" stroke-width="2.4" marker-end="url(#ah2)"/><line x1="561.0" y1="159.0" x2="579.0" y2="177.0" stroke="#dc2626" stroke-width="3.6"/><line x1="579.0" y1="159.0" x2="561.0" y2="177.0" stroke="#dc2626" stroke-width="3.6"/><rect x="8.0" y="244.0" width="864.0" height="38.0" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.6"/><text x="440.0" y="268.2" font-size="16" font-weight="bold" fill="#374151" text-anchor="middle">Health checks let Route 53 route traffic away from unhealthy resources</text></svg>