<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 262" width="880" height="262" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">m01-six-advantages</title><desc id="d">Six cards for the six advantages of cloud computing: variable expense, economies of scale, no capacity guessing, speed and agility, no data center upkeep and going global in minutes.</desc><defs></defs><rect x="0.75" y="0.75" width="878.5" height="260.5" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><rect x="8.0" y="8.0" width="280.0" height="116.0" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="148.0" y="60.9" font-size="17" font-weight="bold" fill="#1e3a8a" text-anchor="middle">Variable expense</text><text x="148.0" y="82.2" font-size="17" font-weight="normal" fill="#1e3a8a" text-anchor="middle">pay only for what you use</text><rect x="300.0" y="8.0" width="280.0" height="116.0" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="440.0" y="60.9" font-size="17" font-weight="bold" fill="#14532d" text-anchor="middle">Economies of scale</text><text x="440.0" y="82.2" font-size="17" font-weight="normal" fill="#14532d" text-anchor="middle">lower prices from shared volume</text><rect x="592.0" y="8.0" width="280.0" height="116.0" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="732.0" y="60.9" font-size="17" font-weight="bold" fill="#78350f" text-anchor="middle">Stop guessing capacity</text><text x="732.0" y="82.2" font-size="17" font-weight="normal" fill="#78350f" text-anchor="middle">scale up and down as needed</text><rect x="8.0" y="136.0" width="280.0" height="116.0" rx="8" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.6"/><text x="148.0" y="188.9" font-size="17" font-weight="bold" fill="#134e4a" text-anchor="middle">Speed and agility</text><text x="148.0" y="210.2" font-size="17" font-weight="normal" fill="#134e4a" text-anchor="middle">resources in minutes, not weeks</text><rect x="300.0" y="136.0" width="280.0" height="116.0" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.6"/><text x="440.0" y="188.9" font-size="17" font-weight="bold" fill="#4c1d95" text-anchor="middle">No data center upkeep</text><text x="440.0" y="210.2" font-size="17" font-weight="normal" fill="#4c1d95" text-anchor="middle">focus on your business</text><rect x="592.0" y="136.0" width="280.0" height="116.0" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.6"/><text x="732.0" y="188.9" font-size="17" font-weight="bold" fill="#7f1d1d" text-anchor="middle">Go global in minutes</text><text x="732.0" y="210.2" font-size="17" font-weight="normal" fill="#7f1d1d" text-anchor="middle">deploy in several Regions</text></svg>