<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 262" width="880" height="262" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">m02-six-pillars</title><desc id="d">Six cards, one for each pillar of the Well-Architected Framework, with a short meaning for each.</desc><defs></defs><rect x="0.75" y="0.75" width="878.5" height="260.5" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><rect x="8.0" y="8.0" width="280.0" height="116.0" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="148.0" y="60.9" font-size="17" font-weight="bold" fill="#1e3a8a" text-anchor="middle">Operational excellence</text><text x="148.0" y="82.2" font-size="17" font-weight="normal" fill="#1e3a8a" text-anchor="middle">build correctly, run and improve</text><rect x="300.0" y="8.0" width="280.0" height="116.0" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.6"/><text x="440.0" y="60.9" font-size="17" font-weight="bold" fill="#7f1d1d" text-anchor="middle">Security</text><text x="440.0" y="82.2" font-size="17" font-weight="normal" fill="#7f1d1d" text-anchor="middle">protect data, systems and assets</text><rect x="592.0" y="8.0" width="280.0" height="116.0" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="732.0" y="60.9" font-size="17" font-weight="bold" fill="#14532d" text-anchor="middle">Reliability</text><text x="732.0" y="82.2" font-size="17" font-weight="normal" fill="#14532d" text-anchor="middle">work correctly and consistently</text><rect x="8.0" y="136.0" width="280.0" height="116.0" rx="8" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.6"/><text x="148.0" y="188.9" font-size="17" font-weight="bold" fill="#134e4a" text-anchor="middle">Performance efficiency</text><text x="148.0" y="210.2" font-size="17" font-weight="normal" fill="#134e4a" text-anchor="middle">use resources efficiently</text><rect x="300.0" y="136.0" width="280.0" height="116.0" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="440.0" y="188.9" font-size="17" font-weight="bold" fill="#78350f" text-anchor="middle">Cost optimization</text><text x="440.0" y="210.2" font-size="17" font-weight="normal" fill="#78350f" text-anchor="middle">business value at the lowest price</text><rect x="592.0" y="136.0" width="280.0" height="116.0" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.6"/><text x="732.0" y="188.9" font-size="17" font-weight="bold" fill="#4c1d95" text-anchor="middle">Sustainability</text><text x="732.0" y="210.2" font-size="17" font-weight="normal" fill="#4c1d95" text-anchor="middle">reduce environmental impact</text></svg>