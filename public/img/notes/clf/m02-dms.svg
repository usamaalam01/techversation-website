<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 256" width="880" height="256" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">m02-dms</title><desc id="d">AWS DMS copies data from a source database to a target and keeps them in sync with ongoing changes; schema conversion comes first when the engine changes.</desc><defs><marker id="ah0" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker><marker id="ah1" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker></defs><rect x="0.75" y="0.75" width="878.5" height="254.5" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><rect x="140.0" y="8.0" width="400.0" height="62.0" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.6" stroke-dasharray="7 4"/><text x="340.0" y="34.2" font-size="16" font-weight="bold" fill="#78350f" text-anchor="middle">Schema conversion first</text><text x="340.0" y="54.2" font-size="16" font-weight="normal" fill="#78350f" text-anchor="middle">only if the database engine changes</text><rect x="8.0" y="104.0" width="210.0" height="110.0" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.6"/><text x="113.0" y="153.9" font-size="17" font-weight="bold" fill="#374151" text-anchor="middle">Source database</text><text x="113.0" y="175.2" font-size="17" font-weight="normal" fill="#374151" text-anchor="middle">on premises</text><rect x="330.0" y="104.0" width="220.0" height="110.0" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="440.0" y="153.9" font-size="17" font-weight="bold" fill="#1e3a8a" text-anchor="middle">AWS DMS</text><text x="440.0" y="175.2" font-size="17" font-weight="normal" fill="#1e3a8a" text-anchor="middle">copies the data</text><rect x="662.0" y="104.0" width="210.0" height="110.0" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="767.0" y="153.9" font-size="17" font-weight="bold" fill="#14532d" text-anchor="middle">Target database</text><text x="767.0" y="175.2" font-size="17" font-weight="normal" fill="#14532d" text-anchor="middle">on AWS</text><line x1="218.0" y1="159.0" x2="328.0" y2="159.0" stroke="#374151" stroke-width="2.6" marker-end="url(#ah0)"/><line x1="550.0" y1="159.0" x2="660.0" y2="159.0" stroke="#374151" stroke-width="2.6" marker-end="url(#ah0)"/><line x1="440.0" y1="70.0" x2="440.0" y2="102.0" stroke="#d97706" stroke-width="2.2" marker-end="url(#ah1)"/><text x="440.0" y="242.0" font-size="15" font-weight="bold" fill="#1e3a8a" text-anchor="middle">ongoing changes keep source and target in sync</text></svg>