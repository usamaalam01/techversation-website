<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 276" width="880" height="276" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">m01-high-availability</title><desc id="d">A load balancer sends customers to two servers in separate locations; one location fails and the other keeps serving.</desc><defs><marker id="ah0" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker><marker id="ah1" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#9ca3af"/></marker></defs><rect x="0.75" y="0.75" width="878.5" height="274.5" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><rect x="8.0" y="100.0" width="150.0" height="80.0" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="83.0" y="145.5" font-size="17" font-weight="bold" fill="#1e3a8a" text-anchor="middle">Customers</text><rect x="228.0" y="100.0" width="170.0" height="80.0" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="313.0" y="135.2" font-size="16" font-weight="bold" fill="#78350f" text-anchor="middle">Load balancer</text><text x="313.0" y="155.2" font-size="16" font-weight="normal" fill="#78350f" text-anchor="middle">spreads requests</text><line x1="158.0" y1="140.0" x2="226.0" y2="140.0" stroke="#374151" stroke-width="2.6" marker-end="url(#ah0)"/><rect x="486.0" y="8.0" width="386.0" height="128.0" rx="12" fill="#f9fafb" stroke="#9ca3af" stroke-width="2"/><text x="504.0" y="36.0" font-size="17" font-weight="bold" fill="#374151" text-anchor="start">Location A</text><rect x="504.0" y="48.0" width="350.0" height="76.0" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="679.0" y="81.2" font-size="16" font-weight="bold" fill="#14532d" text-anchor="middle">Server</text><text x="679.0" y="101.2" font-size="16" font-weight="normal" fill="#14532d" text-anchor="middle">keeps serving</text><line x1="398.0" y1="140.0" x2="484.0" y2="72.0" stroke="#374151" stroke-width="2.4" marker-end="url(#ah0)"/><rect x="486.0" y="148.0" width="386.0" height="128.0" rx="12" fill="#f9fafb" stroke="#9ca3af" stroke-width="2"/><text x="504.0" y="176.0" font-size="17" font-weight="bold" fill="#374151" text-anchor="start">Location B</text><rect x="504.0" y="188.0" width="350.0" height="76.0" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.6"/><text x="679.0" y="221.2" font-size="16" font-weight="bold" fill="#7f1d1d" text-anchor="middle">Server</text><text x="679.0" y="241.2" font-size="16" font-weight="normal" fill="#7f1d1d" text-anchor="middle">has a problem</text><line x1="398.0" y1="140.0" x2="484.0" y2="212.0" stroke="#9ca3af" stroke-width="2.4" stroke-dasharray="6 4" marker-end="url(#ah1)"/><line x1="824.0" y1="190.0" x2="848.0" y2="214.0" stroke="#dc2626" stroke-width="3.8"/><line x1="848.0" y1="190.0" x2="824.0" y2="214.0" stroke="#dc2626" stroke-width="3.8"/><text x="244.0" y="236.0" font-size="16" font-weight="bold" fill="#1e3a8a" text-anchor="middle">No single point of failure: the shop keeps selling</text></svg>