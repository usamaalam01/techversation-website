<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 282" width="880" height="282" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">m09-migration</title><desc id="d">AWS SCT converts the schema and code from the source engine to the target engine, and AWS DMS then moves the data and keeps replicating changes.</desc><defs><marker id="ah0" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker></defs><rect x="0.75" y="0.75" width="878.5" height="280.5" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><rect x="8.0" y="8.0" width="240.0" height="100.0" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.6"/><text x="128.0" y="53.2" font-size="16" font-weight="bold" fill="#374151" text-anchor="middle">Source database</text><text x="128.0" y="73.2" font-size="16" font-weight="normal" fill="#374151" text-anchor="middle">for example Oracle</text><rect x="320.0" y="8.0" width="240.0" height="100.0" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="440.0" y="53.2" font-size="16" font-weight="bold" fill="#78350f" text-anchor="middle">Step 1: AWS SCT</text><text x="440.0" y="73.2" font-size="16" font-weight="normal" fill="#78350f" text-anchor="middle">converts schema and code</text><rect x="632.0" y="8.0" width="240.0" height="100.0" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="752.0" y="53.5" font-size="15" font-weight="bold" fill="#14532d" text-anchor="middle">Target database</text><text x="752.0" y="72.2" font-size="15" font-weight="normal" fill="#14532d" text-anchor="middle">for example Aurora PostgreSQL</text><line x1="248.0" y1="58.0" x2="318.0" y2="58.0" stroke="#374151" stroke-width="2.6" marker-end="url(#ah0)"/><line x1="560.0" y1="58.0" x2="630.0" y2="58.0" stroke="#374151" stroke-width="2.6" marker-end="url(#ah0)"/><rect x="8.0" y="132.0" width="864.0" height="62.0" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="440.0" y="168.5" font-size="17" font-weight="bold" fill="#1e3a8a" text-anchor="middle">Step 2: AWS DMS moves the data and keeps replicating ongoing changes</text><rect x="8.0" y="214.0" width="864.0" height="46.0" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.6"/><text x="440.0" y="242.2" font-size="16" font-weight="bold" fill="#374151" text-anchor="middle">Same engine on both sides? AWS DMS alone can move the data</text></svg>