<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 220" width="880" height="220" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">m04-mfa-options</title><desc id="d">Three supported MFA types: passkeys and security keys, virtual authenticator apps and hardware TOTP tokens; SMS text message MFA is shown crossed out because it is no longer supported.</desc><defs></defs><rect x="0.75" y="0.75" width="878.5" height="218.5" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><rect x="8.0" y="8.0" width="207.0" height="118.0" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="111.5" y="52.2" font-size="16" font-weight="bold" fill="#14532d" text-anchor="middle">Passkey or security key</text><text x="111.5" y="72.2" font-size="16" font-weight="normal" fill="#14532d" text-anchor="middle">phishing-resistant,</text><text x="111.5" y="92.2" font-size="16" font-weight="normal" fill="#14532d" text-anchor="middle">recommended first</text><rect x="227.0" y="8.0" width="207.0" height="118.0" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="330.5" y="42.2" font-size="16" font-weight="bold" fill="#1e3a8a" text-anchor="middle">Virtual authenticator</text><text x="330.5" y="62.2" font-size="16" font-weight="bold" fill="#1e3a8a" text-anchor="middle">app</text><text x="330.5" y="82.2" font-size="16" font-weight="normal" fill="#1e3a8a" text-anchor="middle">time-based one-time</text><text x="330.5" y="102.2" font-size="16" font-weight="normal" fill="#1e3a8a" text-anchor="middle">codes</text><rect x="446.0" y="8.0" width="207.0" height="118.0" rx="8" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.6"/><text x="549.5" y="62.2" font-size="16" font-weight="bold" fill="#134e4a" text-anchor="middle">Hardware TOTP token</text><text x="549.5" y="82.2" font-size="16" font-weight="normal" fill="#134e4a" text-anchor="middle">shows a six-digit code</text><rect x="665.0" y="8.0" width="207.0" height="118.0" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.6"/><text x="768.5" y="62.2" font-size="16" font-weight="bold" fill="#7f1d1d" text-anchor="middle">SMS text message</text><text x="768.5" y="82.2" font-size="16" font-weight="normal" fill="#7f1d1d" text-anchor="middle">no longer supported</text><line x1="840.0" y1="20.0" x2="860.0" y2="40.0" stroke="#dc2626" stroke-width="3.6"/><line x1="860.0" y1="20.0" x2="840.0" y2="40.0" stroke="#dc2626" stroke-width="3.6"/><rect x="8.0" y="142.0" width="864.0" height="62.0" rx="8" fill="#1e3a8a" stroke="#1e3a8a" stroke-width="1.6"/><text x="440.0" y="167.9" font-size="17" font-weight="bold" fill="#ffffff" text-anchor="middle">Up to eight MFA devices per user</text><text x="440.0" y="189.2" font-size="17" font-weight="normal" fill="#ffffff" text-anchor="middle">one is enough to sign in</text></svg>