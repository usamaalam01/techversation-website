<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 316" width="880" height="316" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">m13-purchase-chooser</title><desc id="d">Five needs and the EC2 purchasing option for each: steady use suits Savings Plans or Reserved Instances, interruptible work suits Spot, short or unpredictable use suits On-Demand, your own licenses suit Dedicated Hosts, and guaranteed capacity suits Capacity Reservations.</desc><defs><marker id="ah0" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker></defs><rect x="0.75" y="0.75" width="878.5" height="314.5" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><rect x="8.0" y="8.0" width="360.0" height="48.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="188.0" y="37.2" font-size="16" font-weight="bold" fill="#1f2937" text-anchor="middle">Steady, predictable use</text><line x1="368.0" y1="32.0" x2="470.0" y2="32.0" stroke="#374151" stroke-width="2.6" marker-end="url(#ah0)"/><rect x="472.0" y="8.0" width="400.0" height="48.0" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="672.0" y="37.2" font-size="16" font-weight="bold" fill="#1e3a8a" text-anchor="middle">Savings Plans or Reserved Instances</text><rect x="8.0" y="68.0" width="360.0" height="48.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="188.0" y="97.2" font-size="16" font-weight="bold" fill="#1f2937" text-anchor="middle">Work that can be interrupted</text><line x1="368.0" y1="92.0" x2="470.0" y2="92.0" stroke="#374151" stroke-width="2.6" marker-end="url(#ah0)"/><rect x="472.0" y="68.0" width="400.0" height="48.0" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="672.0" y="97.2" font-size="16" font-weight="bold" fill="#14532d" text-anchor="middle">Spot Instances</text><rect x="8.0" y="128.0" width="360.0" height="48.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="188.0" y="157.2" font-size="16" font-weight="bold" fill="#1f2937" text-anchor="middle">Short or unpredictable use</text><line x1="368.0" y1="152.0" x2="470.0" y2="152.0" stroke="#374151" stroke-width="2.6" marker-end="url(#ah0)"/><rect x="472.0" y="128.0" width="400.0" height="48.0" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.6"/><text x="672.0" y="157.2" font-size="16" font-weight="bold" fill="#374151" text-anchor="middle">On-Demand Instances</text><rect x="8.0" y="188.0" width="360.0" height="48.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="188.0" y="217.2" font-size="16" font-weight="bold" fill="#1f2937" text-anchor="middle">Your own licenses or compliance</text><line x1="368.0" y1="212.0" x2="470.0" y2="212.0" stroke="#374151" stroke-width="2.6" marker-end="url(#ah0)"/><rect x="472.0" y="188.0" width="400.0" height="48.0" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="672.0" y="217.2" font-size="16" font-weight="bold" fill="#78350f" text-anchor="middle">Dedicated Hosts</text><rect x="8.0" y="248.0" width="360.0" height="48.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="188.0" y="277.2" font-size="16" font-weight="bold" fill="#1f2937" text-anchor="middle">Capacity guaranteed in a zone</text><line x1="368.0" y1="272.0" x2="470.0" y2="272.0" stroke="#374151" stroke-width="2.6" marker-end="url(#ah0)"/><rect x="472.0" y="248.0" width="400.0" height="48.0" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.6"/><text x="672.0" y="277.2" font-size="16" font-weight="bold" fill="#4c1d95" text-anchor="middle">Capacity Reservations</text></svg>