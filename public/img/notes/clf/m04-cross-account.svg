<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 372" width="880" height="372" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">m04-cross-account</title><desc id="d">A role in the trusting account holds a trust policy that names who may assume it and a permissions policy that says what they may do; a user from another account or a federated identity assumes it.</desc><defs><marker id="ah0" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="ah1" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker></defs><rect x="0.75" y="0.75" width="878.5" height="370.5" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><rect x="8.0" y="8.0" width="224.0" height="218.0" rx="12" fill="#f9fafb" stroke="#9ca3af" stroke-width="2"/><text x="120.0" y="36.0" font-size="17" font-weight="bold" fill="#374151" text-anchor="middle">Another account</text><rect x="24.0" y="52.0" width="192.0" height="72.0" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="120.0" y="83.2" font-size="16" font-weight="bold" fill="#1e3a8a" text-anchor="middle">User</text><text x="120.0" y="103.2" font-size="16" font-weight="normal" fill="#1e3a8a" text-anchor="middle">wants access</text><rect x="300.0" y="8.0" width="572.0" height="218.0" rx="12" fill="#f9fafb" stroke="#9ca3af" stroke-width="2"/><text x="586.0" y="36.0" font-size="17" font-weight="bold" fill="#374151" text-anchor="middle">Your account: the role</text><rect x="316.0" y="52.0" width="262.0" height="156.0" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="447.0" y="125.2" font-size="16" font-weight="bold" fill="#78350f" text-anchor="middle">Trust policy</text><text x="447.0" y="145.2" font-size="16" font-weight="normal" fill="#78350f" text-anchor="middle">who may assume the role</text><rect x="594.0" y="52.0" width="262.0" height="156.0" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="725.0" y="125.2" font-size="16" font-weight="bold" fill="#14532d" text-anchor="middle">Permissions policy</text><text x="725.0" y="145.2" font-size="16" font-weight="normal" fill="#14532d" text-anchor="middle">what they may do</text><line x1="216.0" y1="88.0" x2="314.0" y2="88.0" stroke="#2563eb" stroke-width="2.6" marker-end="url(#ah0)"/><text x="266.0" y="76.0" font-size="15" font-weight="bold" fill="#1e3a8a" text-anchor="middle">assume</text><rect x="24.0" y="140.0" width="192.0" height="72.0" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.6"/><text x="120.0" y="162.1" font-size="15" font-weight="bold" fill="#4c1d95" text-anchor="middle">Outside identity</text><text x="120.0" y="180.9" font-size="15" font-weight="normal" fill="#4c1d95" text-anchor="middle">SAML 2.0 or OpenID</text><text x="120.0" y="199.6" font-size="15" font-weight="normal" fill="#4c1d95" text-anchor="middle">Connect</text><line x1="216.0" y1="176.0" x2="314.0" y2="176.0" stroke="#7c3aed" stroke-width="2.6" marker-end="url(#ah1)"/><text x="266.0" y="164.0" font-size="15" font-weight="bold" fill="#4c1d95" text-anchor="middle">federate</text><rect x="8.0" y="246.0" width="864.0" height="54.0" rx="8" fill="#1e3a8a" stroke="#1e3a8a" stroke-width="1.6"/><text x="440.0" y="278.5" font-size="17" font-weight="bold" fill="#ffffff" text-anchor="middle">Both routes end the same way: a role and temporary credentials</text><rect x="8.0" y="312.0" width="864.0" height="52.0" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.6"/><text x="440.0" y="343.2" font-size="16" font-weight="normal" fill="#374151" text-anchor="middle">The trust policy is a resource-based policy; the permissions policy is identity-based</text></svg>