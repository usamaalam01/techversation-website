<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 266" width="880" height="266" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">m09-cache</title><desc id="d">An application asks ElastiCache first: a hit returns data from memory, and a miss reads the database and stores the answer in the cache for next time.</desc><defs><marker id="ah0" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker><marker id="ah1" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker><marker id="ah2" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker></defs><rect x="0.75" y="0.75" width="878.5" height="264.5" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><rect x="8.0" y="52.0" width="190.0" height="112.0" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.6"/><text x="103.0" y="103.2" font-size="16" font-weight="bold" fill="#374151" text-anchor="middle">Application</text><text x="103.0" y="123.2" font-size="16" font-weight="normal" fill="#374151" text-anchor="middle">needs product data</text><rect x="345.0" y="52.0" width="190.0" height="112.0" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.6"/><text x="440.0" y="103.2" font-size="16" font-weight="bold" fill="#4c1d95" text-anchor="middle">ElastiCache</text><text x="440.0" y="123.2" font-size="16" font-weight="normal" fill="#4c1d95" text-anchor="middle">data in memory</text><rect x="682.0" y="52.0" width="190.0" height="112.0" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="777.0" y="103.2" font-size="16" font-weight="bold" fill="#1e3a8a" text-anchor="middle">Database</text><text x="777.0" y="123.2" font-size="16" font-weight="normal" fill="#1e3a8a" text-anchor="middle">the source of truth</text><line x1="198.0" y1="92.0" x2="343.0" y2="92.0" stroke="#374151" stroke-width="2.6" marker-end="url(#ah0)"/><line x1="343.0" y1="126.0" x2="200.0" y2="126.0" stroke="#16a34a" stroke-width="2.6" marker-end="url(#ah1)"/><line x1="535.0" y1="92.0" x2="680.0" y2="92.0" stroke="#d97706" stroke-width="2.6" marker-end="url(#ah2)"/><line x1="680.0" y1="126.0" x2="537.0" y2="126.0" stroke="#d97706" stroke-width="2.6" marker-end="url(#ah2)"/><text x="270.0" y="80.0" font-size="15" font-weight="bold" fill="#374151" text-anchor="middle">ask the cache</text><text x="270.0" y="152.0" font-size="15" font-weight="bold" fill="#14532d" text-anchor="middle">hit: from memory</text><text x="608.0" y="80.0" font-size="15" font-weight="bold" fill="#78350f" text-anchor="middle">miss</text><text x="608.0" y="152.0" font-size="15" font-weight="bold" fill="#78350f" text-anchor="middle">answer</text><rect x="8.0" y="204.0" width="864.0" height="46.0" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.6"/><text x="440.0" y="232.2" font-size="16" font-weight="bold" fill="#374151" text-anchor="middle">A miss reads the database and stores the answer in the cache for next time</text></svg>