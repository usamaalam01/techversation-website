<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 386" width="880" height="386" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">m04-policy-anatomy</title><desc id="d">A policy statement says whether to allow or deny, which actions, on which resources and under which conditions; a resource-based policy also names a principal.</desc><defs></defs><rect x="0.75" y="0.75" width="878.5" height="384.5" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><rect x="8.0" y="8.0" width="230.0" height="52.0" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="123.0" y="39.2" font-size="16" font-weight="bold" fill="#1e3a8a" text-anchor="middle">Effect</text><rect x="248.0" y="8.0" width="624.0" height="52.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="264.0" y="38.9" font-size="15" font-weight="normal" fill="#1f2937" text-anchor="start">Allow or Deny</text><rect x="8.0" y="70.0" width="230.0" height="52.0" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="123.0" y="101.2" font-size="16" font-weight="bold" fill="#14532d" text-anchor="middle">Action</text><rect x="248.0" y="70.0" width="624.0" height="52.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="264.0" y="100.9" font-size="15" font-weight="normal" fill="#1f2937" text-anchor="start">what can be done, for example read an object</text><rect x="8.0" y="132.0" width="230.0" height="52.0" rx="8" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.6"/><text x="123.0" y="163.2" font-size="16" font-weight="bold" fill="#134e4a" text-anchor="middle">Resource</text><rect x="248.0" y="132.0" width="624.0" height="52.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="264.0" y="162.9" font-size="15" font-weight="normal" fill="#1f2937" text-anchor="start">what it can be done to, for example one bucket</text><rect x="8.0" y="194.0" width="230.0" height="52.0" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="123.0" y="225.2" font-size="16" font-weight="bold" fill="#78350f" text-anchor="middle">Condition (optional)</text><rect x="248.0" y="194.0" width="624.0" height="52.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="264.0" y="224.9" font-size="15" font-weight="normal" fill="#1f2937" text-anchor="start">when it applies, for example only with MFA</text><rect x="8.0" y="256.0" width="230.0" height="52.0" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.6"/><text x="123.0" y="287.2" font-size="16" font-weight="bold" fill="#374151" text-anchor="middle">Principal</text><rect x="248.0" y="256.0" width="624.0" height="52.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="264.0" y="286.9" font-size="15" font-weight="normal" fill="#1f2937" text-anchor="start">who is allowed: only in resource-based policies</text><rect x="8.0" y="332.0" width="864.0" height="46.0" rx="8" fill="#1e3a8a" stroke="#1e3a8a" stroke-width="1.6"/><text x="440.0" y="360.5" font-size="17" font-weight="bold" fill="#ffffff" text-anchor="middle">An explicit Deny always wins over an Allow</text></svg>