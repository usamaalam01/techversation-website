<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 316" width="880" height="316" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">m13-data-transfer</title><desc id="d">Data into AWS from the internet is free, data out to the internet is charged, data within one Availability Zone is free, and data across Availability Zones or Regions is typically charged.</desc><defs></defs><rect x="0.75" y="0.75" width="878.5" height="314.5" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><rect x="8.0" y="8.0" width="560.0" height="48.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="288.0" y="37.5" font-size="17" font-weight="bold" fill="#1f2937" text-anchor="middle">Internet to AWS</text><rect x="592.0" y="8.0" width="280.0" height="48.0" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="732.0" y="37.5" font-size="17" font-weight="bold" fill="#14532d" text-anchor="middle">Free</text><rect x="8.0" y="68.0" width="560.0" height="48.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="288.0" y="97.5" font-size="17" font-weight="bold" fill="#1f2937" text-anchor="middle">AWS to the internet</text><rect x="592.0" y="68.0" width="280.0" height="48.0" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.6"/><text x="732.0" y="97.5" font-size="17" font-weight="bold" fill="#7f1d1d" text-anchor="middle">Charged</text><rect x="8.0" y="128.0" width="560.0" height="48.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="288.0" y="157.5" font-size="17" font-weight="bold" fill="#1f2937" text-anchor="middle">Within one Availability Zone</text><rect x="592.0" y="128.0" width="280.0" height="48.0" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="732.0" y="157.5" font-size="17" font-weight="bold" fill="#14532d" text-anchor="middle">Free</text><rect x="8.0" y="188.0" width="560.0" height="48.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="288.0" y="217.5" font-size="17" font-weight="bold" fill="#1f2937" text-anchor="middle">Between Availability Zones</text><rect x="592.0" y="188.0" width="280.0" height="48.0" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="732.0" y="217.5" font-size="17" font-weight="bold" fill="#78350f" text-anchor="middle">Typically charged</text><rect x="8.0" y="248.0" width="560.0" height="48.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="288.0" y="277.5" font-size="17" font-weight="bold" fill="#1f2937" text-anchor="middle">Between Regions</text><rect x="592.0" y="248.0" width="280.0" height="48.0" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="732.0" y="277.5" font-size="17" font-weight="bold" fill="#78350f" text-anchor="middle">Typically charged</text></svg>