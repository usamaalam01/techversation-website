<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 262" width="880" height="262" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">m02-caf</title><desc id="d">Six CAF perspectives (business, people, governance, platform, security, operations) above four adoption phases (envision, align, launch, scale).</desc><defs></defs><rect x="0.75" y="0.75" width="878.5" height="260.5" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><text x="8.0" y="24.0" font-size="17" font-weight="bold" fill="#374151" text-anchor="start">Six perspectives</text><rect x="8.0" y="36.0" width="137.3" height="78.0" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="76.7" y="80.2" font-size="16" font-weight="bold" fill="#1e3a8a" text-anchor="middle">Business</text><rect x="153.3" y="36.0" width="137.3" height="78.0" rx="8" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.6"/><text x="222.0" y="80.2" font-size="16" font-weight="bold" fill="#134e4a" text-anchor="middle">People</text><rect x="298.7" y="36.0" width="137.3" height="78.0" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="367.3" y="80.2" font-size="16" font-weight="bold" fill="#78350f" text-anchor="middle">Governance</text><rect x="444.0" y="36.0" width="137.3" height="78.0" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="512.7" y="80.2" font-size="16" font-weight="bold" fill="#14532d" text-anchor="middle">Platform</text><rect x="589.3" y="36.0" width="137.3" height="78.0" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.6"/><text x="658.0" y="80.2" font-size="16" font-weight="bold" fill="#7f1d1d" text-anchor="middle">Security</text><rect x="734.7" y="36.0" width="137.3" height="78.0" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.6"/><text x="803.3" y="80.2" font-size="16" font-weight="bold" fill="#4c1d95" text-anchor="middle">Operations</text><text x="8.0" y="150.0" font-size="17" font-weight="bold" fill="#374151"