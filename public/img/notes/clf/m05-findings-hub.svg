<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 342" width="880" height="342" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">m05-findings-hub</title><desc id="d">GuardDuty, Inspector, Macie and partner products send findings to AWS Security Hub, which also runs standards checks and gives one view and automated actions.</desc><defs><marker id="ah0" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker><marker id="ah1" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker><marker id="ah2" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker></defs><rect x="0.75" y="0.75" width="878.5" height="340.5" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><rect x="8.0" y="8.0" width="214.0" height="66.0" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="115.0" y="36.5" font-size="15" font-weight="bold" fill="#1e3a8a" text-anchor="middle">Amazon GuardDuty</text><text x="115.0" y="55.2" font-size="15" font-weight="normal" fill="#1e3a8a" text-anchor="middle">threat findings</text><line x1="222.0" y1="41.0" x2="328.0" y2="80.0" stroke="#374151" stroke-width="2.2" marker-end="url(#ah0)"/><rect x="8.0" y="86.0" width="214.0" height="66.0" rx="8" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.6"/><text x="115.0" y="114.5" font-size="15" font-weight="bold" fill="#134e4a" text-anchor="middle">Amazon Inspector</text><text x="115.0" y="133.2" font-size="15" font-weight="normal" fill="#134e4a" text-anchor="middle">vulnerability findings</text><line x1="222.0" y1="119.0" x2="328.0" y2="126.0" stroke="#374151" stroke-width="2.2" marker-end="url(#ah0)"/><rect x="8.0" y="164.0" width="214.0" height="66.0" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.6"/><text x="115.0" y="192.5" font-size="15" font-weight="bold" fill="#4c1d95" text-anchor="middle">Amazon Macie</text><text x="115.0" y="211.2" font-size="15" font-weight="normal" fill="#4c1d95" text-anchor="middle">sensitive data findings</text><line x1="222.0" y1="197.0" x2="328.0" y2="172.0" stroke="#374151" stroke-width="2.2" marker-end="url(#ah0)"/><rect x="8.0" y="242.0" width="214.0" height="66.0" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.6"/><text x="115.0" y="270.5" font-size="15" font-weight="bold" fill="#374151" text-anchor="middle">Partner products</text><text x="115.0" y="289.2" font-size="15" font-weight="normal" fill="#374151" text-anchor="middle">third-party findings</text><line x1="222.0" y1="275.0" x2="328.0" y2="218.0" stroke="#374151" stroke-width="2.2" marker-end="url(#ah0)"/><rect x="330.0" y="52.0" width="224.0" height="196.0" rx="8" fill="#1e3a8a" stroke="#1e3a8a" stroke-width="1.6"/><text x="442.0" y="125.2" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">AWS Security Hub</text><text x="442.0" y="145.2" font-size="16" font-weight="normal" fill="#ffffff" text-anchor="middle">collects and prioritizes</text><text x="442.0" y="165.2" font-size="16" font-weight="normal" fill="#ffffff" text-anchor="middle">findings across</text><text x="442.0" y="185.2" font-size="16" font-weight="normal" fill="#ffffff" text-anchor="middle">accounts and services</text><rect x="330.0" y="268.0" width="224.0" height="62.0" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="442.0" y="294.5" font-size="15" font-weight="bold" fill="#78350f" text-anchor="middle">Standards checks</text><text x="442.0" y="313.2" font-size="15" font-weight="normal" fill="#78350f" text-anchor="middle">CIS, PCI DSS, NIST</text><line x1="442.0" y1="268.0" x2="442.0" y2="250.0" stroke="#d97706" stroke-width="2.4" marker-end="url(#ah1)"/><line x1="554.0" y1="120.0" x2="668.0" y2="84.0" stroke="#16a34a" stroke-width="2.6" marker-end="url