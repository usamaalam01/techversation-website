<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 330" width="880" height="330" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">m04-users-groups-roles</title><desc id="d">A comparison of an IAM user, an IAM group and an IAM role: what each is, how it authenticates and when to use it.</desc><defs></defs><rect x="0.75" y="0.75" width="878.5" height="328.5" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><rect x="140.0" y="8.0" width="238.7" height="46.0" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="259.3" y="36.5" font-size="17" font-weight="bold" fill="#78350f" text-anchor="middle">IAM user</text><rect x="386.7" y="8.0" width="238.7" height="46.0" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="506.0" y="36.5" font-size="17" font-weight="bold" fill="#1e3a8a" text-anchor="middle">IAM group</text><rect x="633.3" y="8.0" width="238.7" height="46.0" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="752.7" y="36.5" font-size="17" font-weight="bold" fill="#14532d" text-anchor="middle">IAM role</text><rect x="8.0" y="62.0" width="124.0" height="84.0" rx="8" fill="#1e3a8a" stroke="#1e3a8a" stroke-width="1.6"/><text x="70.0" y="109.2" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">What it is</text><rect x="140.0" y="62.0" width="238.7" height="84.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="150.0" y="99.5" font-size="15" font-weight="normal" fill="#1f2937" text-anchor="start">a person or app identity in one</text><text x="150.0" y="118.2" font-size="15" font-weight="normal" fill="#1f2937" text-anchor="start">account</text><rect x="386.7" y="62.0" width="238.7" height="84.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="396.7" y="99.5" font-size="15" font-weight="normal" fill="#1f2937" text-anchor="start">a set of users that share</text><text x="396.7" y="118.2" font-size="15" font-weight="normal" fill="#1f2937" text-anchor="start">permissions</text><rect x="633.3" y="62.0" width="238.7" height="84.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="643.3" y="99.5" font-size="15" font-weight="normal" fill="#1f2937" text-anchor="start">an identity that is assumed when</text><text x="643.3" y="118.2" font-size="15" font-weight="normal" fill="#1f2937" text-anchor="start">needed</text><rect x="8.0" y="154.0" width="124.0" height="84.0" rx="8" fill="#1e3a8a" stroke="#1e3a8a" stroke-width="1.6"/><text x="70.0" y="201.2" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">Credentials</text><rect x="140.0" y="154.0" width="238.7" height="84.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="150.0" y="191.5" font-size="15" font-weight="normal" fill="#1f2937" text-anchor="start">long-term: a password and up to</text><text x="150.0" y="210.2" font-size="15" font-weight="normal" fill="#1f2937" text-anchor="start">two access keys</text><rect x="386.7" y="154.0" width="238.7" height="84.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="396.7" y="200.9" font-size="15" font-weight="normal" fill="#1f2937" text-anchor="start">none: it never signs in</text><rect x="633.3" y="154.0" width="238.7" height="84.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="643.3" y="191.5" font-size="15" font-weight="normal" fill="#1f2937" text-anchor="start">none long-term: temporary</text><text x="643.3" y="210.2" font-size="15" font-weight="normal" fill="#1f2937" text-anchor="start">credentials per session</text><rect x="8.0" y="246.0" width="124.0" height="84.0" rx="8" fill="#1e3a8a" stroke="#1e3a8a" stroke-width="1.6"/><text x="70.0" y="293.2" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">Use it for</text><rect x="140.0" y="246.0" width="238.7" height="84.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="150.0" y="283.5" font-size="15" font-weight="normal" fill="#1f2937" text-anchor="start">the few cases federation cannot</text><text x="150.0" y="302.2" font-size="15" font-weight="normal" fill="#1f2937" text-anchor="start">cover</text><rect x="386.7" y="246.0" width="238.7" height="84.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="396.7" y="283.5" font-size="15" font-weight="normal" fill="#1f2937" text-anchor="start">giving the same permissions to</text><text x="396.7" y="302.2" font-size="15" font-weight="normal" fill="#1f2937" text-anchor="start">many users</text><rect x="633.3" y="246.0" width="238.7" height="84.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="643.3" y="283.5" font-size="15" font-weight="normal" fill="#1f2937" text-anchor="start">workloads, cross-account</text><text x="643.3" y="302.2" font-size="15" font-weight="normal" fill="#1f2937" text-anchor="start">access, federated people</text></svg>