<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 236" width="880" height="236" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">m03-control-types</title><desc id="d">Three columns: inherited controls come fully from AWS, shared controls apply to both sides, and customer-specific controls belong to the customer alone.</desc><defs></defs><rect x="0.75" y="0.75" width="878.5" height="234.5" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><rect x="8.0" y="8.0" width="278.7" height="56.0" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="147.3" y="41.8" font-size="18" font-weight="bold" fill="#1e3a8a" text-anchor="middle">Inherited</text><rect x="8.0" y="72.0" width="278.7" height="156.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="20.0" y="135.2" font-size="16" font-weight="normal" fill="#1f2937" text-anchor="start">Fully from AWS</text><text x="20.0" y="155.2" font-size="16" font-weight="normal" fill="#1f2937" text-anchor="start">Physical and</text><text x="20.0" y="175.2" font-size="16" font-weight="normal" fill="#1f2937" text-anchor="start">environmental controls</text><rect x="300.7" y="8.0" width="278.7" height="56.0" rx="8" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.6"/><text x="440.0" y="41.8" font-size="18" font-weight="bold" fill="#134e4a" text-anchor="middle">Shared</text><rect x="300.7" y="72.0" width="278.7" height="156.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="312.7" y="125.2" font-size="16" font-weight="normal" fill="#1f2937" text-anchor="start">Both sides, each in its own context</text><text x="312.7" y="145.2" font-size="16" font-weight="normal" fill="#1f2937" text-anchor="start">Patch management</text><text x="312.7" y="165.2" font-size="16" font-weight="normal" fill="#1f2937" text-anchor="start">Configuration management</text><text x="312.7" y="185.2" font-size="16" font-weight="normal" fill="#1f2937" text-anchor="start">Awareness and training</text><rect x="593.3" y="8.0" width="278.7" height="56.0" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="732.7" y="41.8" font-size="18" font-weight="bold" fill="#78350f" text-anchor="middle">Customer-specific</text><rect x="593.3" y="72.0" width="278.7" height="156.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="605.3" y="135.2" font-size="16" font-weight="normal" fill="#1f2937" text-anchor="start">Yours alone</text><text x="605.3" y="155.2" font-size="16" font-weight="normal" fill="#1f2937" text-anchor="start">Set by your application</text><text x="605.3" y="175.2" font-size="16" font-weight="normal" fill="#1f2937" text-anchor="start">Example: security zones</text></svg>