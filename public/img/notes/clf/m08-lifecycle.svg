<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 232" width="880" height="232" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">m08-lifecycle</title><desc id="d">A lifecycle rule moves an object from S3 Standard to S3 Standard-IA after 30 days, to S3 Glacier Flexible Retrieval after a year, and then expires it.</desc><defs><marker id="ah0" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker></defs><rect x="0.75" y="0.75" width="878.5" height="230.5" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><rect x="8.0" y="14.0" width="190.0" height="110.0" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="103.0" y="64.2" font-size="16" font-weight="bold" fill="#14532d" text-anchor="middle">Upload</text><text x="103.0" y="84.2" font-size="16" font-weight="bold" fill="#14532d" text-anchor="middle">S3 Standard</text><line x1="198.0" y1="69.0" x2="230.0" y2="69.0" stroke="#374151" stroke-width="2.6" marker-end="url(#ah0)"/><rect x="232.0" y="14.0" width="190.0" height="110.0" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="327.0" y="64.2" font-size="16" font-weight="bold" fill="#1e3a8a" text-anchor="middle">Day 30</text><text x="327.0" y="84.2" font-size="16" font-weight="bold" fill="#1e3a8a" text-anchor="middle">S3 Standard-IA</text><line x1="422.0" y1="69.0" x2="454.0" y2="69.0" stroke="#374151" stroke-width="2.6" marker-end="url(#ah0)"/><rect x="456.0" y="14.0" width="190.0" height="110.0" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.6"/><text x="551.0" y="54.2" font-size="16" font-weight="bold" fill="#4c1d95" text-anchor="middle">Day 365</text><text x="551.0" y="74.2" font-size="16" font-weight="bold" fill="#4c1d95" text-anchor="middle">S3 Glacier</text><text x="551.0" y="94.2" font-size="16" font-weight="normal" fill="#4c1d95" text-anchor="middle">Flexible Retrieval</text><line x1="646.0" y1="69.0" x2="678.0" y2="69.0" stroke="#374151" stroke-width="2.6" marker-end="url(#ah0)"/><rect x="680.0" y="14.0" width="190.0" height="110.0" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.6"/><text x="775.0" y="54.2" font-size="16" font-weight="bold" fill="#374151" text-anchor="middle">Then</text><text x="775.0" y="74.2" font-size="16" font-weight="bold" fill="#374151" text-anchor="middle">Expire</text><text x="775.0" y="94.2" font-size="16" font-weight="normal" fill="#374151" text-anchor="middle">object deleted</text><text x="8.0" y="152.0" font-size="15" font-weight="bold" fill="#14532d" text-anchor="start">Frequent access</text><text x="872.0" y="152.0" font-size="15" font-weight="bold" fill="#374151" text-anchor="end">Archive, then delete</text><rect x="8.0" y="170.0" width="864.0" height="50.0" rx="8" fill="#1e3a8a" stroke="#1e3a8a" stroke-width="1.6"/><text x="440.0" y="200.2" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">Storage cost falls as the data cools: transition rules move it, an expiration rule deletes it</text></svg>