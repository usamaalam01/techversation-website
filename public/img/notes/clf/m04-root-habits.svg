<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 196" width="880" height="196" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">m04-root-habits</title><desc id="d">Five cards for the habits that protect the root user: MFA, a strong unique password, no access keys, a group email address and an administrative identity for daily work.</desc><defs></defs><rect x="0.75" y="0.75" width="878.5" height="194.5" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><rect x="8.0" y="8.0" width="164.8" height="128.0" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="90.4" y="58.1" font-size="15" font-weight="bold" fill="#14532d" text-anchor="middle">MFA on</text><text x="90.4" y="76.9" font-size="15" font-weight="normal" fill="#14532d" text-anchor="middle">required for every</text><text x="90.4" y="95.6" font-size="15" font-weight="normal" fill="#14532d" text-anchor="middle">root user</text><rect x="182.8" y="8.0" width="164.8" height="128.0" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="265.2" y="48.8" font-size="15" font-weight="bold" fill="#1e3a8a" text-anchor="middle">Strong, unique</text><text x="265.2" y="67.5" font-size="15" font-weight="bold" fill="#1e3a8a" text-anchor="middle">password</text><text x="265.2" y="86.2" font-size="15" font-weight="normal" fill="#1e3a8a" text-anchor="middle">in a password</text><text x="265.2" y="105.0" font-size="15" font-weight="normal" fill="#1e3a8a" text-anchor="middle">manager</text><rect x="357.6" y="8.0" width="164.8" height="128.0" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.6"/><text x="440.0" y="67.5" font-size="15" font-weight="bold" fill="#7f1d1d" text-anchor="middle">No access keys</text><text x="440.0" y="86.2" font-size="15" font-weight="normal" fill="#7f1d1d" text-anchor="middle">delete any that exist</text><rect x="532.4" y="8.0" width="164.8" height="128.0" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="614.8" y="58.1" font-size="15" font-weight="bold" fill="#78350f" text-anchor="middle">Group email</text><text x="614.8" y="76.9" font-size="15" font-weight="normal" fill="#78350f" text-anchor="middle">watched by several</text><text x="614.8" y="95.6" font-size="15" font-weight="normal" fill="#78350f" text-anchor="middle">people</text><rect x="707.2" y="8.0" width="164.8" height="128.0" rx="8" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.6"/><text x="789.6" y="67.5" font-size="15" font-weight="bold" fill="#134e4a" text-anchor="middle">Admin identity</text><text x="789.6" y="86.2" font-size="15" font-weight="normal" fill="#134e4a" text-anchor="middle">for all daily work</text><rect x="8.0" y="148.0" width="864.0" height="40.0" rx="8" fill="#1e3a8a" stroke="#1e3a8a" stroke-width="1.6"/><text x="440.0" y="173.5" font-size="17" font-weight="bold" fill="#ffffff" text-anchor="middle">Root user: only for the few tasks that need it</text></svg>