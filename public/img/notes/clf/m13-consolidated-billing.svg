<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 292" width="880" height="292" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">m13-consolidated-billing</title><desc id="d">Four member accounts roll up to the management account of an organization, which pays one bill and shares volume, Reserved Instance and Savings Plans discounts across the accounts.</desc><defs><marker id="ah0" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker><marker id="ah1" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker><marker id="ah2" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker></defs><rect x="0.75" y="0.75" width="878.5" height="290.5" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><rect x="8.0" y="8.0" width="210.0" height="56.0" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.6"/><text x="113.0" y="41.2" font-size="16" font-weight="bold" fill="#374151" text-anchor="middle">Member account A</text><line x1="218.0" y1="36.0" x2="318.0" y2="142.0" stroke="#374151" stroke-width="2.2" marker-end="url(#ah0)"/><rect x="8.0" y="78.0" width="210.0" height="56.0" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.6"/><text x="113.0" y="111.2" font-size="16" font-weight="bold" fill="#374151" text-anchor="middle">Member account B</text><line x1="218.0" y1="106.0" x2="318.0" y2="142.0" stroke="#374151" stroke-width="2.2" marker-end="url(#ah0)"/><rect x="8.0" y="148.0" width="210.0" height="56.0" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.6"/><text x="113.0" y="181.2" font-size="16" font-weight="bold" fill="#374151" text-anchor="middle">Member account C</text><line x1="218.0" y1="176.0" x2="318.0" y2="142.0" stroke="#374151" stroke-width="2.2" marker-end="url(#ah0)"/><rect x="8.0" y="218.0" width="210.0" height="56.0" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.6"/><text x="113.0" y="251.2" font-size="16" font-weight="bold" fill="#374151" text-anchor="middle">Member account D</text><line x1="218.0" y1="246.0" x2="318.0" y2="142.0" stroke="#374151" stroke-width="2.2" marker-end="url(#ah0)"/><rect x="320.0" y="82.0" width="220.0" height="120.0" rx="8" fill="#1e3a8a" stroke="#1e3a8a" stroke-width="1.6"/><text x="430.0" y="127.2" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">Management account</text><text x="430.0" y="147.2" font-size="16" font-weight="normal" fill="#ffffff" text-anchor="middle">pays the charges</text><text x="430.0" y="167.2" font-size="16" font-weight="normal" fill="#ffffff" text-anchor="middle">of every member</text><rect x="650.0" y="20.0" width="222.0" height="100.0" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="761.0" y="64.9" font-size="17" font-weight="bold" fill="#14532d" text-anchor="middle">One bill</text><text x="761.0" y="86.2" font-size="17" font-weight="normal" fill="#14532d" text-anchor="middle">no extra fee</text><rect x="650.0" y="162.0" width="222.0" height="110.0" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="761.0" y="202.2" font-size="16" font-weight="bold" fill="#78350f" text-anchor="middle">Shared discounts</text><text x="761.0" y="222.2" font-size="16" font-weight="normal" fill="#78350f" text-anchor="middle">volume, Reserved</text><text x="761.0" y="242.2" font-size="16" font-weight="normal" fill="#78350f" text-anchor="middle">Instance, Savings Plans</text><line x1="540.0" y1="120.0" x2="648.0" y2="70.0" stroke="#16a34a" stroke-width="2.6" marker-end="url(#ah1)"/><line x1="540.0" y1="168.0" x2="648.0" y2="216.0" stroke="#d97706" stroke-width="2.6" marker-end="url(#ah2)"/></svg>