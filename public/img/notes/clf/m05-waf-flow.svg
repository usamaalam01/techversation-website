<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 300" width="880" height="300" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">m05-waf-flow</title><desc id="d">AWS WAF checks each web request against the rules in a web ACL, then allows it to the shop application or blocks it with a 403 Forbidden response.</desc><defs><marker id="ah0" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker><marker id="ah1" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker><marker id="ah2" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker></defs><rect x="0.75" y="0.75" width="878.5" height="298.5" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><rect x="8.0" y="80.0" width="176.0" height="90.0" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.6"/><text x="96.0" y="120.2" font-size="16" font-weight="bold" fill="#374151" text-anchor="middle">Web request</text><text x="96.0" y="140.2" font-size="16" font-weight="normal" fill="#374151" text-anchor="middle">from a visitor or a bot</text><line x1="184.0" y1="125.0" x2="248.0" y2="125.0" stroke="#374151" stroke-width="2.6" marker-end="url(#ah0)"/><rect x="250.0" y="10.0" width="336.0" height="224.0" rx="12" fill="#fffbeb" stroke="#d97706" stroke-width="2"/><text x="418.0" y="38.0" font-size="17" font-weight="bold" fill="#78350f" text-anchor="middle">Web ACL (protection pack)</text><rect x="266.0" y="54.0" width="304.0" height="44.0" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="418.0" y="80.9" font-size="15" font-weight="bold" fill="#78350f" text-anchor="middle">Managed rules: SQL injection</text><rect x="266.0" y="110.0" width="304.0" height="44.0" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="418.0" y="136.9" font-size="15" font-weight="bold" fill="#78350f" text-anchor="middle">Rate-based rule: too fast</text><rect x="266.0" y="166.0" width="304.0" height="44.0" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="418.0" y="192.9" font-size="15" font-weight="bold" fill="#78350f" text-anchor="middle">IP address rule</text><line x1="586.0" y1="80.0" x2="676.0" y2="60.0" stroke="#16a34a" stroke-width="2.6" marker-end="url(#ah1)"/><line x1="586.0" y1="164.0" x2="676.0" y2="184.0" stroke="#dc2626" stroke-width="2.6" marker-end="url(#ah2)"/><rect x="678.0" y="18.0" width="194.0" height="84.0" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="775.0" y="55.5" font-size="15" font-weight="bold" fill="#14532d" text-anchor="middle">Allowed</text><text x="775.0" y="74.2" font-size="15" font-weight="normal" fill="#14532d" text-anchor="middle">to the shop application</text><rect x="678.0" y="142.0" width="194.0" height="84.0" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.6"/><text x="775.0" y="179.5" font-size="15" font-weight="bold" fill="#7f1d1d" text-anchor="middle">Blocked</text><text x="775.0" y="198.2" font-size="15" font-weight="normal" fill="#7f1d1d" text-anchor="middle">403 Forbidden</text><rect x="8.0" y="248.0" width="864.0" height="44.0" rx="8" fill="#1e3a8a" stroke="#1e3a8a" stroke-width="1.6"/><text x="440.0" y="275.2" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">AWS WAF works at the application layer: it reads HTTP and HTTPS requests</text></svg>