<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 300" width="880" height="300" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">m01-elasticity</title><desc id="d">Two panels over six time periods: fixed capacity set at the peak leaves idle capacity most of the time, while elastic capacity rises and falls with demand.</desc><defs></defs><rect x="0.75" y="0.75" width="878.5" height="298.5" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><rect x="8.0" y="8.0" width="424.0" height="264.0" rx="12" fill="#f9fafb" stroke="#9ca3af" stroke-width="2"/><text x="220.0" y="34.0" font-size="17" font-weight="bold" fill="#1f2937" text-anchor="middle">Fixed capacity: sized for the peak</text><rect x="30.0" y="97.0" width="46.0" height="90.0" rx="4" fill="#fee2e2" stroke="#dc2626" stroke-width="1.2"/><rect x="30.0" y="187.0" width="46.0" height="45.0" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><rect x="94.0" y="97.0" width="46.0" height="60.0" rx="4" fill="#fee2e2" stroke="#dc2626" stroke-width="1.2"/><rect x="94.0" y="157.0" width="46.0" height="75.0" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><rect x="158.0" y="97.0" width="46.0" height="0.0" rx="4" fill="#fee2e2" stroke="#dc2626" stroke-width="1.2"/><rect x="158.0" y="97.0" width="46.0" height="135.0" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><rect x="222.0" y="97.0" width="46.0" height="60.0" rx="4" fill="#fee2e2" stroke="#dc2626" stroke-width="1.2"/><rect x="222.0" y="157.0" width="46.0" height="75.0" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><rect x="286.0" y="97.0" width="46.0" height="90.0" rx="4" fill="#fee2e2" stroke="#dc2626" stroke-width="1.2"/><rect x="286.0" y="187.0" width="46.0" height="45.0" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><rect x="350.0" y="97.0" width="46.0" height="105.0" rx="4" fill="#fee2e2" stroke="#dc2626" stroke-width="1.2"/><rect x="350.0" y="202.0" width="46.0" height="30.0" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><line x1="22.0" y1="97.0" x2="418.0" y2="97.0" stroke="#dc2626" stroke-width="2.2" stroke-dasharray="7 5"/><text x="220.0" y="258.0" font-size="15" font-weight="bold" fill="#7f1d1d" text-anchor="middle">red = idle capacity you still pay for</text><rect x="448.0" y="8.0" width="424.0" height="264.0" rx="12" fill="#f9fafb" stroke="#9ca3af" stroke-width="2"/><text x="660.0" y="34.0" font-size="17" font-weight="bold" fill="#1f2937" text-anchor="middle">Elastic capacity: follows demand</text><rect x="470.0" y="187.0" width="46.0" height="45.0" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><rect x="534.0" y="157.0" width="46.0" height="75.0" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><rect x="598.0" y="97.0" width="46.0" height="135.0" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><rect x="662.0" y="157.0" width="46.0" height="75.0" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><rect x="726.0" y="187.0" width="46.0" height="45.0" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><rect x="790.0" y="202.0" width="46.0" height="30.0" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="660.0" y="258.0" font-size="15" font-weight="bold" fill="#1e3a8a" text-anchor="middle">blue = demand, and capacity matches it</text></svg>