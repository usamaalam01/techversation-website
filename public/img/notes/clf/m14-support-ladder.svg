<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 292" width="880" height="292" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">m14-support-ladder</title><desc id="d">Support plans step up with how critical the workload is: Basic for every customer, Business Support+ for production workloads, Enterprise Support for business-critical workloads with a designated TAM, and Unified Operations for mission-critical workloads with the fastest incident response.</desc><defs></defs><rect x="0.75" y="0.75" width="878.5" height="290.5" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><rect x="8.0" y="146.0" width="205.5" height="90.0" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.6"/><text x="110.8" y="177.1" font-size="15" font-weight="bold" fill="#374151" text-anchor="middle">Basic Support</text><text x="110.8" y="195.9" font-size="15" font-weight="normal" fill="#374151" text-anchor="middle">every customer</text><text x="110.8" y="214.6" font-size="15" font-weight="normal" fill="#374151" text-anchor="middle">docs, forums, core checks</text><rect x="227.5" y="116.0" width="205.5" height="120.0" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="330.2" y="162.1" font-size="15" font-weight="bold" fill="#1e3a8a" text-anchor="middle">Business Support+</text><text x="330.2" y="180.9" font-size="15" font-weight="normal" fill="#1e3a8a" text-anchor="middle">production workloads</text><text x="330.2" y="199.6" font-size="15" font-weight="normal" fill="#1e3a8a" text-anchor="middle">24/7 engineers, full checks</text><rect x="447.0" y="86.0" width="205.5" height="150.0" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="549.8" y="147.1" font-size="15" font-weight="bold" fill="#14532d" text-anchor="middle">Enterprise Support</text><text x="549.8" y="165.9" font-size="15" font-weight="normal" fill="#14532d" text-anchor="middle">business-critical</text><text x="549.8" y="184.6" font-size="15" font-weight="normal" fill="#14532d" text-anchor="middle">designated TAM</text><rect x="666.5" y="56.0" width="205.5" height="180.0" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.6"/><text x="769.2" y="132.1" font-size="15" font-weight="bold" fill="#4c1d95" text-anchor="middle">Unified Operations</text><text x="769.2" y="150.9" font-size="15" font-weight="normal" fill="#4c1d95" text-anchor="middle">mission-critical</text><text x="769.2" y="169.6" font-size="15" font-weight="normal" fill="#4c1d95" text-anchor="middle">fastest incident response</text><rect x="8.0" y="248.0" width="864.0" height="36.0" rx="8" fill="#1e3a8a" stroke="#1e3a8a" stroke-width="1.6"/><text x="440.0" y="271.2" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">More critical workload, higher plan; a TAM starts at Enterprise Support</text></svg>