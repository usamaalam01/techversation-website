<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 336" width="880" height="336" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">m04-identity-center</title><desc id="d">An identity source feeds IAM Identity Center, which assigns permission sets to several AWS accounts so that one sign-in reaches them all.</desc><defs><marker id="ah0" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker><marker id="ah1" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker></defs><rect x="0.75" y="0.75" width="878.5" height="334.5" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><rect x="8.0" y="96.0" width="210.0" height="130.0" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.6"/><text x="113.0" y="146.2" font-size="16" font-weight="bold" fill="#4c1d95" text-anchor="middle">Identity source</text><text x="113.0" y="166.2" font-size="16" font-weight="normal" fill="#4c1d95" text-anchor="middle">Identity Center directory or</text><text x="113.0" y="186.2" font-size="16" font-weight="normal" fill="#4c1d95" text-anchor="middle">an outside provider</text><rect x="292.0" y="70.0" width="250.0" height="182.0" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="417.0" y="136.2" font-size="16" font-weight="bold" fill="#1e3a8a" text-anchor="middle">IAM Identity Center</text><text x="417.0" y="156.2" font-size="16" font-weight="normal" fill="#1e3a8a" text-anchor="middle">one place to manage the</text><text x="417.0" y="176.2" font-size="16" font-weight="normal" fill="#1e3a8a" text-anchor="middle">workforce</text><text x="417.0" y="196.2" font-size="16" font-weight="normal" fill="#1e3a8a" text-anchor="middle">AWS access portal</text><line x1="218.0" y1="161.0" x2="290.0" y2="161.0" stroke="#374151" stroke-width="2.6" marker-end="url(#ah0)"/><rect x="676.0" y="10.0" width="196.0" height="74.0" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="774.0" y="42.2" font-size="16" font-weight="bold" fill="#14532d" text-anchor="middle">Account A</text><text x="774.0" y="62.2" font-size="16" font-weight="normal" fill="#14532d" text-anchor="middle">permission set</text><line x1="542.0" y1="161.0" x2="674.0" y2="47.0" stroke="#2563eb" stroke-width="2.4" marker-end="url(#ah1)"/><rect x="676.0" y="98.0" width="196.0" height="74.0" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="774.0" y="130.2" font-size="16" font-weight="bold" fill="#14532d" text-anchor="middle">Account B</text><text x="774.0" y="150.2" font-size="16" font-weight="normal" fill="#14532d" text-anchor="middle">permission set</text><line x1="542.0" y1="161.0" x2="674.0" y2="135.0" stroke="#2563eb" stroke-width="2.4" marker-end="url(#ah1)"/><rect x="676.0" y="186.0" width="196.0" height="74.0" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="774.0" y="218.2" font-size="16" font-weight="bold" fill="#14532d" text-anchor="middle">Account C</text><text x="774.0" y="238.2" font-size="16" font-weight="normal" fill="#14532d" text-anchor="middle">permission set</text><line x1="542.0" y1="161.0" x2="674.0" y2="223.0" stroke="#2563eb" stroke-width="2.4" marker-end="url(#ah1)"/><rect x="8.0" y="278.0" width="864.0" height="50.0" rx="8" fill="#1e3a8a" stroke="#1e3a8a" stroke-width="1.6"/><text x="440.0" y="308.2" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">Permission sets are templates of policies; assigning one creates roles in the account</text></svg>