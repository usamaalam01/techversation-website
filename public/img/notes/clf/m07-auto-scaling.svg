<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 330" width="880" height="330" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">m07-auto-scaling</title><desc id="d">An Auto Scaling group keeps its instances between a minimum of two and a maximum of eight: demand rises and instances are added, demand falls and instances are removed.</desc><defs><marker id="ah0" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker><marker id="ah1" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker></defs><rect x="0.75" y="0.75" width="878.5" height="328.5" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><rect x="8.0" y="8.0" width="270.0" height="60.0" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.6"/><text x="143.0" y="33.2" font-size="16" font-weight="bold" fill="#374151" text-anchor="middle">Minimum: 2</text><text x="143.0" y="53.2" font-size="16" font-weight="normal" fill="#374151" text-anchor="middle">never fewer</text><rect x="305.0" y="8.0" width="270.0" height="60.0" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="440.0" y="33.2" font-size="16" font-weight="bold" fill="#1e3a8a" text-anchor="middle">Desired: 4</text><text x="440.0" y="53.2" font-size="16" font-weight="normal" fill="#1e3a8a" text-anchor="middle">the normal size</text><rect x="602.0" y="8.0" width="270.0" height="60.0" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.6"/><text x="737.0" y="33.2" font-size="16" font-weight="bold" fill="#374151" text-anchor="middle">Maximum: 8</text><text x="737.0" y="53.2" font-size="16" font-weight="normal" fill="#374151" text-anchor="middle">never more</text><rect x="8.0" y="96.0" width="96.0" height="54.0" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="56.0" y="127.9" font-size="15" font-weight="bold" fill="#14532d" text-anchor="middle">Server</text><rect x="116.0" y="96.0" width="96.0" height="54.0" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="164.0" y="127.9" font-size="15" font-weight="bold" fill="#14532d" text-anchor="middle">Server</text><rect x="224.0" y="96.0" width="96.0" height="54.0" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="272.0" y="127.9" font-size="15" font-weight="bold" fill="#14532d" text-anchor="middle">Server</text><rect x="332.0" y="96.0" width="96.0" height="54.0" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="380.0" y="127.9" font-size="15" font-weight="bold" fill="#14532d" text-anchor="middle">Server</text><rect x="440.0" y="96.0" width="96.0" height="54.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="488.0" y="127.9" font-size="15" font-weight="bold" fill="#1f2937" text-anchor="middle">Server</text><rect x="548.0" y="96.0" width="96.0" height="54.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="596.0" y="127.9" font-size="15" font-weight="bold" fill="#1f2937" text-anchor="middle">Server</text><rect x="656.0" y="96.0" width="96.0" height="54.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="704.0" y="127.9" font-size="15" font-weight="bold" fill="#1f2937" text-anchor="middle">Server</text><rect x="764.0" y="96.0" width="96.0" height="54.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="812.0" y="127.9" font-size="15" font-weight="bold" fill="#1f2937" text-anchor="middle">Server</text><text x="8.0" y="176.0" font-size="16" font-weight="bold" fill="#374151" text-anchor="start">Four running; four more can start</text><line x1="10.0" y1="226.0" x2="120.0" y2="226.0" stroke="#16a34a" stroke-width="3.4" marker-end="url(#ah0)"/><text x="134.0" y="232.0" font-size="16" font-weight="bold" fill="#14532d" text-anchor="start">Demand rises: add instances</text><line x1="870.0" y1="226.0" x2="760.0" y2="226.0" stroke="#d97706" stroke-width="3.4" marker-end="url(#ah1)"/><text x="746.0" y="232.0" font-size="16" font-weight="bold" fill="#78350f" text-anchor="end">Demand falls: remove instances</text><rect x="8.0" y="274.0" width="864.0" height="46.0" rx="8" fill="#1e3a8a" stroke="#1e3a8a" stroke-width="1.6"/><text x="440.0" y="302.5" font-size="17" font-weight="bold" fill="#ffffff" text-anchor="middle">Elasticity: capacity follows demand, up and down, automatically</text></svg>