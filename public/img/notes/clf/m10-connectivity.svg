<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 300" width="880" height="300" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">m10-connectivity</title><desc id="d">A Site-to-Site VPN carries an encrypted tunnel over the internet, AWS Direct Connect uses a dedicated line that bypasses internet service providers, and Client VPN lets a remote user connect from anywhere.</desc><defs><marker id="ah0" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker><marker id="ah1" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker><marker id="ah2" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker></defs><rect x="0.75" y="0.75" width="878.5" height="298.5" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><rect x="8.0" y="20.0" width="170.0" height="90.0" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.6"/><text x="93.0" y="60.2" font-size="16" font-weight="bold" fill="#374151" text-anchor="middle">Your site</text><text x="93.0" y="80.2" font-size="16" font-weight="normal" fill="#374151" text-anchor="middle">on premises</text><rect x="702.0" y="20.0" width="170.0" height="230.0" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="787.0" y="130.2" font-size="16" font-weight="bold" fill="#1e3a8a" text-anchor="middle">Your VPC</text><text x="787.0" y="150.2" font-size="16" font-weight="normal" fill="#1e3a8a" text-anchor="middle">in AWS</text><line x1="178.0" y1="50.0" x2="700.0" y2="50.0" stroke="#d97706" stroke-width="3" marker-end="url(#ah0)"/><text x="440.0" y="40.0" font-size="16" font-weight="bold" fill="#78350f" text-anchor="middle">Site-to-Site VPN: encrypted tunnel over the internet</text><line x1="178.0" y1="84.0" x2="700.0" y2="84.0" stroke="#16a34a" stroke-width="3" marker-end="url(#ah1)"/><text x="440.0" y="112.0" font-size="16" font-weight="bold" fill="#14532d" text-anchor="middle">AWS Direct Connect: dedicated line</text><rect x="8.0" y="170.0" width="170.0" height="80.0" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.6"/><text x="93.0" y="205.2" font-size="16" font-weight="bold" fill="#374151" text-anchor="middle">Remote user</text><text x="93.0" y="225.2" font-size="16" font-weight="normal" fill="#374151" text-anchor="middle">working from home</text><line x1="178.0" y1="210.0" x2="700.0" y2="210.0" stroke="#7c3aed" stroke-width="3" marker-end="url(#ah2)"/><text x="440.0" y="200.0" font-size="16" font-weight="bold" fill="#4c1d95" text-anchor="middle">AWS Client VPN: a user connects from anywhere</text><rect x="8.0" y="262.0" width="864.0" height="30.0" rx="8" fill="#1e3a8a" stroke="#1e3a8a" stroke-width="1.6"/><text x="440.0" y="281.9" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">VPN uses the internet; Direct Connect bypasses internet service providers</text></svg>