<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 262" width="880" height="262" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">m03-encryption</title><desc id="d">Two panels: encryption in transit protects data travelling between a customer and the shop with TLS, and encryption at rest protects a stored object, server-side by the service or client-side by you.</desc><defs><marker id="ah0" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker><marker id="ah1" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker></defs><rect x="0.75" y="0.75" width="878.5" height="260.5" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><rect x="8.0" y="8.0" width="424.0" height="246.0" rx="12" fill="#f9fafb" stroke="#9ca3af" stroke-width="2"/><text x="220.0" y="36.0" font-size="17" font-weight="bold" fill="#1f2937" text-anchor="middle">In transit: protected on the way</text><rect x="26.0" y="78.0" width="120.0" height="84.0" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="86.0" y="125.2" font-size="16" font-weight="bold" fill="#1e3a8a" text-anchor="middle">Customer</text><rect x="294.0" y="78.0" width="120.0" height="84.0" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="354.0" y="125.2" font-size="16" font-weight="bold" fill="#14532d" text-anchor="middle">Shop server</text><line x1="146.0" y1="120.0" x2="292.0" y2="120.0" stroke="#16a34a" stroke-width="3.4" marker-end="url(#ah0)"/><text x="220.0" y="108.0" font-size="20" font-weight="bold" fill="#14532d" text-anchor="middle">TLS</text><text x="220.0" y="226.0" font-size="15" font-weight="bold" fill="#374151" text-anchor="middle">SSL/TLS keeps data private in motion</text><rect x="448.0" y="8.0" width="424.0" height="246.0" rx="12" fill="#f9fafb" stroke="#9ca3af" stroke-width="2"/><text x="660.0" y="36.0" font-size="17" font-weight="bold" fill="#1f2937" text-anchor="middle">At rest: protected when stored</text><rect x="468.0" y="64.0" width="176.0" height="70.0" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="556.0" y="94.2" font-size="16" font-weight="bold" fill="#78350f" text-anchor="middle">Stored object</text><text x="556.0" y="114.2" font-size="16" font-weight="normal" fill="#78350f" text-anchor="middle">encrypted</text><rect x="676.0" y="64.0" width="180.0" height="70.0" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.6"/><text x="766.0" y="94.5" font-size="15" font-weight="bold" fill="#4c1d95" text-anchor="middle">KMS key</text><text x="766.0" y="113.2" font-size="15" font-weight="normal" fill="#4c1d95" text-anchor="middle">controls the keys</text><line x1="676.0" y1="99.0" x2="646.0" y2="99.0" stroke="#7c3aed" stroke-width="2.4" marker-end="url(#ah1)"/><rect x="468.0" y="150.0" width="176.0" height="84.0" rx="8" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.6"/><text x="556.0" y="187.5" font-size="15" font-weight="bold" fill="#134e4a" text-anchor="middle">Server-side</text><text x="556.0" y="206.2" font-size="15" font-weight="normal" fill="#134e4a" text-anchor="middle">the service encrypts</text><rect x="676.0" y="150.0" width="180.0" height="84.0" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.6"/><text x="766.0" y="187.5" font-size="15" font-weight="bold" fill="#7f1d1d" text-anchor="middle">Client-side</text><text x="766.0" y="206.2" font-size="15" font-weight="normal" fill="#7f1d1d" text-anchor="middle">you encrypt first</text></svg>