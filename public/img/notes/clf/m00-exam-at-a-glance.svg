<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 244" width="880" height="244" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">m00-exam-at-a-glance</title><desc id="d">Six key numbers of the exam: 65 questions, 50 scored, 15 unscored, 90 minutes, a pass mark of 700 and a scale of 100 to 1,000.</desc><defs></defs><rect x="0.75" y="0.75" width="878.5" height="242.5" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><rect x="8.0" y="8.0" width="280.0" height="104.0" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="1.8"/><text x="148.0" y="62.1" font-size="40" font-weight="bold" fill="#1e3a8a" text-anchor="middle">65</text><text x="148.0" y="88.1" font-size="16" font-weight="normal" fill="#1e3a8a" text-anchor="middle">questions in all</text><rect x="300.0" y="8.0" width="280.0" height="104.0" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="1.8"/><text x="440.0" y="62.1" font-size="40" font-weight="bold" fill="#14532d" text-anchor="middle">50</text><text x="440.0" y="88.1" font-size="16" font-weight="normal" fill="#14532d" text-anchor="middle">scored questions</text><rect x="592.0" y="8.0" width="280.0" height="104.0" rx="12" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.8"/><text x="732.0" y="62.1" font-size="40" font-weight="bold" fill="#374151" text-anchor="middle">15</text><text x="732.0" y="88.1" font-size="16" font-weight="normal" fill="#374151" text-anchor="middle">unscored trial questions</text><rect x="8.0" y="124.0" width="280.0" height="104.0" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="1.8"/><text x="148.0" y="178.1" font-size="40" font-weight="bold" fill="#78350f" text-anchor="middle">90</text><text x="148.0" y="204.1" font-size="16" font-weight="normal" fill="#78350f" text-anchor="middle">minutes in all</text><rect x="300.0" y="124.0" width="280.0" height="104.0" rx="12" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.8"/><text x="440.0" y="178.1" font-size="40" font-weight="bold" fill="#134e4a" text-anchor="middle">700</text><text x="440.0" y="204.1" font-size="16" font-weight="normal" fill="#134e4a" text-anchor="middle">to pass</text><rect x="592.0" y="124.0" width="280.0" height="104.0" rx="12" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.8"/><text x="732.0" y="178.1" font-size="40" font-weight="bold" fill="#4c1d95" text-anchor="middle">100-1,000</text><text x="732.0" y="204.1" font-size="16" font-weight="normal" fill="#4c1d95" text-anchor="middle">scaled score</text></svg>