<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 354" width="880" height="354" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">m07-load-balancer</title><desc id="d">A load balancer receives customer traffic and sends it only to healthy servers in two Availability Zones, skipping one unhealthy server.</desc><defs><marker id="ah0" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker><marker id="ah1" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker></defs><rect x="0.75" y="0.75" width="878.5" height="352.5" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><rect x="8.0" y="110.0" width="150.0" height="90.0" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.6"/><text x="83.0" y="150.2" font-size="16" font-weight="bold" fill="#374151" text-anchor="middle">Customers</text><text x="83.0" y="170.2" font-size="16" font-weight="normal" fill="#374151" text-anchor="middle">sending requests</text><line x1="158.0" y1="155.0" x2="228.0" y2="155.0" stroke="#374151" stroke-width="2.6" marker-end="url(#ah0)"/><rect x="230.0" y="95.0" width="180.0" height="120.0" rx="8" fill="#1e3a8a" stroke="#1e3a8a" stroke-width="1.6"/><text x="320.0" y="140.2" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">Load balancer</text><text x="320.0" y="160.2" font-size="16" font-weight="normal" fill="#ffffff" text-anchor="middle">checks health</text><text x="320.0" y="180.2" font-size="16" font-weight="normal" fill="#ffffff" text-anchor="middle">shares traffic</text><rect x="480.0" y="8.0" width="392.0" height="134.0" rx="12" fill="#f9fafb" stroke="#9ca3af" stroke-width="2"/><text x="496.0" y="36.0" font-size="16" font-weight="bold" fill="#374151" text-anchor="start">Availability Zone A</text><rect x="496.0" y="56.0" width="170.0" height="70.0" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="581.0" y="86.5" font-size="15" font-weight="bold" fill="#14532d" text-anchor="middle">Server</text><text x="581.0" y="105.2" font-size="15" font-weight="normal" fill="#14532d" text-anchor="middle">healthy</text><rect x="686.0" y="56.0" width="170.0" height="70.0" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="771.0" y="86.5" font-size="15" font-weight="bold" fill="#14532d" text-anchor="middle">Server</text><text x="771.0" y="105.2" font-size="15" font-weight="normal" fill="#14532d" text-anchor="middle">healthy</text><line x1="410.0" y1="155.0" x2="478.0" y2="78.0" stroke="#16a34a" stroke-width="2.6" marker-end="url(#ah1)"/><rect x="480.0" y="158.0" width="392.0" height="134.0" rx="12" fill="#f9fafb" stroke="#9ca3af" stroke-width="2"/><text x="496.0" y="186.0" font-size="16" font-weight="bold" fill="#374151" text-anchor="start">Availability Zone B</text><rect x="496.0" y="206.0" width="170.0" height="70.0" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="581.0" y="236.5" font-size="15" font-weight="bold" fill="#14532d" text-anchor="middle">Server</text><text x="581.0" y="255.2" font-size="15" font-weight="normal" fill="#14532d" text-anchor="middle">healthy</text><rect x="686.0" y="206.0" width="170.0" height="70.0" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.6"/><text x="771.0" y="236.5" font-size="15" font-weight="bold" fill="#7f1d1d" text-anchor="middle">Server</text><text x="771.0" y="255.2" font-size="15" font-weight="normal" fill="#7f1d1d" text-anchor="middle">unhealthy: skipped</text><line x1="410.0" y1="155.0" x2="478.0" y2="228.0" stroke="#16a34a" stroke-width="2.6" marker-end="url(#ah1)"/><rect x="8.0" y="306.0" width="864.0" height="40.0" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="440.0" y="331.2" font-size="16" font-weight="bold" fill="#78350f" text-anchor="middle">Traffic goes only to healthy targets, in one or 