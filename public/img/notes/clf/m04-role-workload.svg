<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 232" width="880" height="232" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">m04-role-workload</title><desc id="d">An Amazon EC2 instance receives temporary credentials from its role and uses them to read an Amazon S3 bucket, with no access keys stored anywhere.</desc><defs><marker id="ah0" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker></defs><rect x="0.75" y="0.75" width="878.5" height="230.5" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><rect x="8.0" y="14.0" width="241.3" height="112.0" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="128.7" y="64.9" font-size="17" font-weight="bold" fill="#1e3a8a" text-anchor="middle">EC2 instance</text><text x="128.7" y="86.2" font-size="17" font-weight="normal" fill="#1e3a8a" text-anchor="middle">runs the web shop</text><line x1="251.3" y1="70.0" x2="317.3" y2="70.0" stroke="#1f2937" stroke-width="2.6" marker-end="url(#ah0)"/><rect x="319.3" y="14.0" width="241.3" height="112.0" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="440.0" y="54.3" font-size="17" font-weight="bold" fill="#78350f" text-anchor="middle">IAM role</text><text x="440.0" y="75.5" font-size="17" font-weight="normal" fill="#78350f" text-anchor="middle">permissions to read the</text><text x="440.0" y="96.8" font-size="17" font-weight="normal" fill="#78350f" text-anchor="middle">bucket</text><line x1="562.7" y1="70.0" x2="628.7" y2="70.0" stroke="#1f2937" stroke-width="2.6" marker-end="url(#ah0)"/><rect x="630.7" y="14.0" width="241.3" height="112.0" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="751.3" y="64.9" font-size="17" font-weight="bold" fill="#14532d" text-anchor="middle">S3 bucket</text><text x="751.3" y="86.2" font-size="17" font-weight="normal" fill="#14532d" text-anchor="middle">product photos</text><text x="224.0" y="152.0" font-size="15" font-weight="bold" fill="#78350f" text-anchor="middle">temporary credentials</text><text x="656.0" y="152.0" font-size="15" font-weight="bold" fill="#14532d" text-anchor="middle">read objects</text><rect x="8.0" y="172.0" width="864.0" height="50.0" rx="8" fill="#1e3a8a" stroke="#1e3a8a" stroke-width="1.6"/><text x="440.0" y="202.5" font-size="17" font-weight="bold" fill="#ffffff" text-anchor="middle">No access keys are stored on the server</text></svg>