<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 272" width="880" height="272" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">m08-storage-gateway</title><desc id="d">On-premises applications reach AWS storage through a Storage Gateway that keeps frequently used data in a local cache; the gateway offers file, volume and tape interfaces.</desc><defs><marker id="ah0" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker></defs><rect x="0.75" y="0.75" width="878.5" height="270.5" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><rect x="8.0" y="8.0" width="241.3" height="110.0" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.6"/><text x="128.7" y="58.2" font-size="16" font-weight="bold" fill="#374151" text-anchor="middle">On-premises applications</text><text x="128.7" y="78.2" font-size="16" font-weight="normal" fill="#374151" text-anchor="middle">your data center</text><line x1="251.3" y1="63.0" x2="317.3" y2="63.0" stroke="#1f2937" stroke-width="2.6" marker-end="url(#ah0)"/><rect x="319.3" y="8.0" width="241.3" height="110.0" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="440.0" y="58.2" font-size="16" font-weight="bold" fill="#1e3a8a" text-anchor="middle">Storage Gateway</text><text x="440.0" y="78.2" font-size="16" font-weight="normal" fill="#1e3a8a" text-anchor="middle">local cache for hot data</text><line x1="562.7" y1="63.0" x2="628.7" y2="63.0" stroke="#1f2937" stroke-width="2.6" marker-end="url(#ah0)"/><rect x="630.7" y="8.0" width="241.3" height="110.0" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="751.3" y="58.2" font-size="16" font-weight="bold" fill="#14532d" text-anchor="middle">AWS storage</text><text x="751.3" y="78.2" font-size="16" font-weight="normal" fill="#14532d" text-anchor="middle">for example Amazon S3</text><rect x="8.0" y="140.0" width="272.0" height="58.0" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="144.0" y="164.5" font-size="15" font-weight="bold" fill="#78350f" text-anchor="middle">File</text><text x="144.0" y="183.2" font-size="15" font-weight="normal" fill="#78350f" text-anchor="middle">NFS and SMB shares</text><rect x="304.0" y="140.0" width="272.0" height="58.0" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="440.0" y="164.5" font-size="15" font-weight="bold" fill="#78350f" text-anchor="middle">Volume</text><text x="440.0" y="183.2" font-size="15" font-weight="normal" fill="#78350f" text-anchor="middle">iSCSI volumes</text><rect x="600.0" y="140.0" width="272.0" height="58.0" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="736.0" y="164.5" font-size="15" font-weight="bold" fill="#78350f" text-anchor="middle">Tape</text><text x="736.0" y="183.2" font-size="15" font-weight="normal" fill="#78350f" text-anchor="middle">virtual tape library</text><rect x="8.0" y="216.0" width="864.0" height="44.0" rx="8" fill="#1e3a8a" stroke="#1e3a8a" stroke-width="1.6"/><text x="440.0" y="243.2" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">Frequently used data stays local for low latency</text></svg>