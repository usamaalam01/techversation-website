<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 262" width="880" height="262" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">m07-compute-spectrum</title><desc id="d">Four compute choices from Amazon EC2 to AWS Lambda: you manage the most on the left, and AWS manages the most on the right.</desc><defs><marker id="ah0" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker></defs><rect x="0.75" y="0.75" width="878.5" height="260.5" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><rect x="8.0" y="14.0" width="205.5" height="100.0" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="110.8" y="59.2" font-size="16" font-weight="bold" fill="#1e3a8a" text-anchor="middle">Amazon EC2</text><text x="110.8" y="79.2" font-size="16" font-weight="normal" fill="#1e3a8a" text-anchor="middle">virtual servers</text><rect x="227.5" y="14.0" width="205.5" height="100.0" rx="8" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.6"/><text x="330.2" y="59.2" font-size="16" font-weight="bold" fill="#134e4a" text-anchor="middle">Containers on EC2</text><text x="330.2" y="79.2" font-size="16" font-weight="normal" fill="#134e4a" text-anchor="middle">ECS or EKS</text><rect x="447.0" y="14.0" width="205.5" height="100.0" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.6"/><text x="549.8" y="59.2" font-size="16" font-weight="bold" fill="#4c1d95" text-anchor="middle">Containers on Fargate</text><text x="549.8" y="79.2" font-size="16" font-weight="normal" fill="#4c1d95" text-anchor="middle">no servers</text><rect x="666.5" y="14.0" width="205.5" height="100.0" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="769.2" y="59.2" font-size="16" font-weight="bold" fill="#78350f" text-anchor="middle">AWS Lambda</text><text x="769.2" y="79.2" font-size="16" font-weight="normal" fill="#78350f" text-anchor="middle">functions</text><line x1="60.0" y1="160.0" x2="820.0" y2="160.0" stroke="#374151" stroke-width="3" marker-end="url(#ah0)"/><line x1="820.0" y1="160.0" x2="60.0" y2="160.0" stroke="#374151" stroke-width="3" marker-end="url(#ah0)"/><text x="8.0" y="200.0" font-size="17" font-weight="bold" fill="#78350f" text-anchor="start">You manage more</text><text x="872.0" y="200.0" font-size="17" font-weight="bold" fill="#1e3a8a" text-anchor="end">AWS manages more</text><rect x="8.0" y="214.0" width="864.0" height="40.0" rx="8" fill="#1e3a8a" stroke="#1e3a8a" stroke-width="1.6"/><text x="440.0" y="239.2" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">The more AWS manages, the less you patch and operate</text></svg>