<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 344" width="880" height="344" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">m03-shared-responsibility</title><desc id="d">Two bands: the customer's security in the cloud (data, access, applications, configuration) above AWS's security of the cloud (software, hardware, global infrastructure, facilities).</desc><defs></defs><rect x="0.75" y="0.75" width="878.5" height="342.5" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><rect x="8.0" y="8.0" width="864.0" height="152.0" rx="12" fill="#fffbeb" stroke="#d97706" stroke-width="2"/><text x="24.0" y="36.0" font-size="18" font-weight="bold" fill="#78350f" text-anchor="start">Customer: security IN the cloud</text><rect x="24.0" y="52.0" width="200.5" height="94.0" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="124.2" y="94.2" font-size="16" font-weight="bold" fill="#78350f" text-anchor="middle">Your data</text><text x="124.2" y="114.2" font-size="16" font-weight="normal" fill="#78350f" text-anchor="middle">classify and protect it</text><rect x="234.5" y="52.0" width="200.5" height="94.0" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="334.8" y="94.2" font-size="16" font-weight="bold" fill="#78350f" text-anchor="middle">Identity and access</text><text x="334.8" y="114.2" font-size="16" font-weight="normal" fill="#78350f" text-anchor="middle">IAM users, roles, MFA</text><rect x="445.0" y="52.0" width="200.5" height="94.0" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="545.2" y="94.2" font-size="16" font-weight="bold" fill="#78350f" text-anchor="middle">Applications</text><text x="545.2" y="114.2" font-size="16" font-weight="normal" fill="#78350f" text-anchor="middle">and the guest OS you run</text><rect x="655.5" y="52.0" width="200.5" height="94.0" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="755.8" y="84.2" font-size="16" font-weight="bold" fill="#78350f" text-anchor="middle">Configuration</text><text x="755.8" y="104.2" font-size="16" font-weight="normal" fill="#78350f" text-anchor="middle">security groups,</text><text x="755.8" y="124.2" font-size="16" font-weight="normal" fill="#78350f" text-anchor="middle">encryption</text><rect x="8.0" y="176.0" width="864.0" height="160.0" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="24.0" y="204.0" font-size="18" font-weight="bold" fill="#1e3a8a" text-anchor="start">AWS: security OF the cloud</text><rect x="24.0" y="220.0" width="270.7" height="104.0" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="159.3" y="257.2" font-size="16" font-weight="bold" fill="#1e3a8a" text-anchor="middle">Software</text><text x="159.3" y="277.2" font-size="16" font-weight="normal" fill="#1e3a8a" text-anchor="middle">compute, storage, database,</text><text x="159.3" y="297.2" font-size="16" font-weight="normal" fill="#1e3a8a" text-anchor="middle">networking</text><rect x="304.7" y="220.0" width="270.7" height="104.0" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="440.0" y="267.2" font-size="16" font-weight="bold" fill="#1e3a8a" text-anchor="middle">Hardware</text><text x="440.0" y="287.2" font-size="16" font-weight="normal" fill="#1e3a8a" text-anchor="middle">servers and the virtualization layer</text><rect x="585.3" y="220.0" width="270.7" height="104.0" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="720.7" y="257.2" font-size="16" font-weight="bold" fill="#1e3a8a" text-anchor="middle">Global infrastructure</text><text x="720.7" y="277.2" font-size="16" font-weight="normal" fill="#1e3a8a" text-anchor="middle">Regions, Availability Zones,</text><text x="720.7" y="297.2" font-size="16" font-weight="normal" fill="#1e3a8a" text-anchor="middle">facilities</text></svg>