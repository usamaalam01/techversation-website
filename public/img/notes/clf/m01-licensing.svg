<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 234" width="880" height="234" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">m01-licensing</title><desc id="d">Bring Your Own License reuses a license you already own and track, while an included license is part of the price of the AWS resource.</desc><defs></defs><rect x="0.75" y="0.75" width="878.5" height="232.5" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><rect x="8.0" y="8.0" width="424.0" height="56.0" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="220.0" y="41.8" font-size="18" font-weight="bold" fill="#1e3a8a" text-anchor="middle">Bring Your Own License</text><rect x="8.0" y="72.0" width="424.0" height="154.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="20.0" y="133.3" font-size="17" font-weight="normal" fill="#1f2937" text-anchor="start">You already own the license</text><text x="20.0" y="154.5" font-size="17" font-weight="normal" fill="#1f2937" text-anchor="start">You follow the vendor's terms</text><text x="20.0" y="175.8" font-size="17" font-weight="normal" fill="#1f2937" text-anchor="start">You track the usage</text><rect x="448.0" y="8.0" width="424.0" height="56.0" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="660.0" y="41.8" font-size="18" font-weight="bold" fill="#14532d" text-anchor="middle">Included license</text><rect x="448.0" y="72.0" width="424.0" height="154.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="460.0" y="133.3" font-size="17" font-weight="normal" fill="#1f2937" text-anchor="start">The license cost is in the price</text><text x="460.0" y="154.5" font-size="17" font-weight="normal" fill="#1f2937" text-anchor="start">Nothing separate to buy</text><text x="460.0" y="175.8" font-size="17" font-weight="normal" fill="#1f2937" text-anchor="start">Simpler to run</text></svg>