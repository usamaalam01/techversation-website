<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 262" width="880" height="262" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">m07-lambda-events</title><desc id="d">Events such as a photo upload, an API request or a queue message start a Lambda function, which runs the code and produces a result, with no servers to manage.</desc><defs><marker id="ah0" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker></defs><rect x="0.75" y="0.75" width="878.5" height="260.5" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><rect x="8.0" y="8.0" width="270.0" height="54.0" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="143.0" y="40.2" font-size="16" font-weight="bold" fill="#1e3a8a" text-anchor="middle">Photo uploaded to S3</text><line x1="278.0" y1="35.0" x2="358.0" y2="111.0" stroke="#374151" stroke-width="2.4" marker-end="url(#ah0)"/><rect x="8.0" y="74.0" width="270.0" height="54.0" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="143.0" y="106.2" font-size="16" font-weight="bold" fill="#1e3a8a" text-anchor="middle">Request through an API</text><line x1="278.0" y1="101.0" x2="358.0" y2="111.0" stroke="#374151" stroke-width="2.4" marker-end="url(#ah0)"/><rect x="8.0" y="140.0" width="270.0" height="54.0" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="143.0" y="172.2" font-size="16" font-weight="bold" fill="#1e3a8a" text-anchor="middle">Message in a queue</text><line x1="278.0" y1="167.0" x2="358.0" y2="111.0" stroke="#374151" stroke-width="2.4" marker-end="url(#ah0)"/><rect x="360.0" y="56.0" width="210.0" height="110.0" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="465.0" y="96.2" font-size="16" font-weight="bold" fill="#78350f" text-anchor="middle">Lambda function</text><text x="465.0" y="116.2" font-size="16" font-weight="normal" fill="#78350f" text-anchor="middle">your code runs</text><text x="465.0" y="136.2" font-size="16" font-weight="normal" fill="#78350f" text-anchor="middle">no servers to manage</text><line x1="570.0" y1="111.0" x2="658.0" y2="111.0" stroke="#374151" stroke-width="2.6" marker-end="url(#ah0)"/><rect x="660.0" y="56.0" width="212.0" height="110.0" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="766.0" y="96.2" font-size="16" font-weight="bold" fill="#14532d" text-anchor="middle">Result</text><text x="766.0" y="116.2" font-size="16" font-weight="normal" fill="#14532d" text-anchor="middle">thumbnail saved,</text><text x="766.0" y="136.2" font-size="16" font-weight="normal" fill="#14532d" text-anchor="middle">reply sent</text><rect x="8.0" y="212.0" width="864.0" height="40.0" rx="8" fill="#1e3a8a" stroke="#1e3a8a" stroke-width="1.6"/><text x="440.0" y="237.2" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">You pay for requests and execution time</text></svg>