<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 336" width="880" height="336" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">m09-multi-az-replica</title><desc id="d">An RDS primary database copies synchronously to a standby in another Availability Zone for automatic failover, and asynchronously to a read-only read replica that can be in another Region.</desc><defs><marker id="ah0" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker><marker id="ah1" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker></defs><rect x="0.75" y="0.75" width="878.5" height="334.5" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><rect x="310.0" y="8.0" width="260.0" height="72.0" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="440.0" y="39.2" font-size="16" font-weight="bold" fill="#1e3a8a" text-anchor="middle">Primary DB instance</text><text x="440.0" y="59.2" font-size="16" font-weight="normal" fill="#1e3a8a" text-anchor="middle">reads and writes</text><rect x="8.0" y="176.0" width="400.0" height="100.0" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="208.0" y="212.1" font-size="15" font-weight="bold" fill="#14532d" text-anchor="middle">Standby in another Availability Zone</text><text x="208.0" y="230.9" font-size="15" font-weight="normal" fill="#14532d" text-anchor="middle">automatic failover</text><text x="208.0" y="249.6" font-size="15" font-weight="normal" fill="#14532d" text-anchor="middle">does not serve reads (instance deployment)</text><rect x="472.0" y="176.0" width="400.0" height="100.0" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="672.0" y="212.1" font-size="15" font-weight="bold" fill="#78350f" text-anchor="middle">Read replica</text><text x="672.0" y="230.9" font-size="15" font-weight="normal" fill="#78350f" text-anchor="middle">read-only queries, scales reads</text><text x="672.0" y="249.6" font-size="15" font-weight="normal" fill="#78350f" text-anchor="middle">can be in another Region</text><line x1="400.0" y1="80.0" x2="270.0" y2="174.0" stroke="#16a34a" stroke-width="3" marker-end="url(#ah0)"/><line x1="480.0" y1="80.0" x2="610.0" y2="174.0" stroke="#d97706" stroke-width="3" marker-end="url(#ah1)"/><text x="316.0" y="126.0" font-size="16" font-weight="bold" fill="#14532d" text-anchor="end">synchronous</text><text x="564.0" y="126.0" font-size="16" font-weight="bold" fill="#78350f" text-anchor="start">asynchronous</text><rect x="8.0" y="292.0" width="864.0" height="40.0" rx="8" fill="#1e3a8a" stroke="#1e3a8a" stroke-width="1.6"/><text x="440.0" y="317.2" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">Multi-AZ is for availability; read replicas are for scaling reads</text></svg>