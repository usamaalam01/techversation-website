<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 262" width="880" height="262" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">m01-fixed-variable</title><desc id="d">Fixed expense is paid up front for capacity sized for the peak; variable expense follows what you use.</desc><defs></defs><rect x="0.75" y="0.75" width="878.5" height="260.5" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><rect x="156.0" y="8.0" width="354.0" height="46.0" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="333.0" y="36.8" font-size="18" font-weight="bold" fill="#78350f" text-anchor="middle">Fixed expense</text><rect x="518.0" y="8.0" width="354.0" height="46.0" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="695.0" y="36.8" font-size="18" font-weight="bold" fill="#14532d" text-anchor="middle">Variable expense</text><text x="142.0" y="93.0" font-size="15" font-weight="bold" fill="#6b7280" text-anchor="end">When you pay</text><rect x="156.0" y="62.0" width="354.0" height="52.0" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="168.0" y="93.2" font-size="16" font-weight="normal" fill="#78350f" text-anchor="start">before you use anything</text><rect x="518.0" y="62.0" width="354.0" height="52.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="530.0" y="93.2" font-size="16" font-weight="normal" fill="#1f2937" text-anchor="start">as you use it</text><text x="142.0" y="153.0" font-size="15" font-weight="bold" fill="#6b7280" text-anchor="end">Capacity</text><rect x="156.0" y="122.0" width="354.0" height="52.0" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="168.0" y="153.2" font-size="16" font-weight="normal" fill="#78350f" text-anchor="start">sized for the peak</text><rect x="518.0" y="122.0" width="354.0" height="52.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="530.0" y="153.2" font-size="16" font-weight="normal" fill="#1f2937" text-anchor="start">added or stopped at will</text><text x="142.0" y="213.0" font-size="15" font-weight="bold" fill="#6b7280" text-anchor="end">Idle capacity</text><rect x="156.0" y="182.0" width="354.0" height="52.0" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="168.0" y="213.2" font-size="16" font-weight="normal" fill="#78350f" text-anchor="start">you still pay for it</text><rect x="518.0" y="182.0" width="354.0" height="52.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="530.0" y="213.2" font-size="16" font-weight="normal" fill="#1f2937" text-anchor="start">you stop paying for it</text></svg>