<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 286" width="880" height="286" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">m05-advisor-categories</title><desc id="d">AWS Trusted Advisor groups its checks into six categories: cost optimization, performance, security, fault tolerance, service limits and operational excellence; the security category is highlighted.</desc><defs></defs><rect x="0.75" y="0.75" width="878.5" height="284.5" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><rect x="8.0" y="8.0" width="278.7" height="96.0" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.6"/><text x="147.3" y="51.2" font-size="16" font-weight="bold" fill="#374151" text-anchor="middle">Cost optimization</text><text x="147.3" y="71.2" font-size="16" font-weight="normal" fill="#374151" text-anchor="middle">find savings</text><rect x="300.7" y="8.0" width="278.7" height="96.0" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.6"/><text x="440.0" y="51.2" font-size="16" font-weight="bold" fill="#374151" text-anchor="middle">Performance</text><text x="440.0" y="71.2" font-size="16" font-weight="normal" fill="#374151" text-anchor="middle">speed and capacity</text><rect x="593.3" y="8.0" width="278.7" height="96.0" rx="8" fill="#1e3a8a" stroke="#1e3a8a" stroke-width="1.6"/><text x="732.7" y="51.2" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">Security</text><text x="732.7" y="71.2" font-size="16" font-weight="normal" fill="#ffffff" text-anchor="middle">close security gaps</text><rect x="8.0" y="118.0" width="278.7" height="96.0" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.6"/><text x="147.3" y="161.2" font-size="16" font-weight="bold" fill="#374151" text-anchor="middle">Fault tolerance</text><text x="147.3" y="181.2" font-size="16" font-weight="normal" fill="#374151" text-anchor="middle">resilience and backups</text><rect x="300.7" y="118.0" width="278.7" height="96.0" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.6"/><text x="440.0" y="161.2" font-size="16" font-weight="bold" fill="#374151" text-anchor="middle">Service limits</text><text x="440.0" y="181.2" font-size="16" font-weight="normal" fill="#374151" text-anchor="middle">quotas near their cap</text><rect x="593.3" y="118.0" width="278.7" height="96.0" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.6"/><text x="732.7" y="161.2" font-size="16" font-weight="bold" fill="#374151" text-anchor="middle">Operational excellence</text><text x="732.7" y="181.2" font-size="16" font-weight="normal" fill="#374151" text-anchor="middle">run and monitor well</text><rect x="8.0" y="230.0" width="864.0" height="48.0" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="440.0" y="259.2" font-size="16" font-weight="bold" fill="#78350f" text-anchor="middle">Every account gets service limits and core security checks; the full set needs a paid plan</text></svg>