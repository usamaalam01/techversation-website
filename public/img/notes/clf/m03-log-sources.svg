<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 262" width="880" height="262" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">m03-log-sources</title><desc id="d">Account activity goes to CloudTrail and then to an S3 bucket, service and application logs go to CloudWatch Logs, and network traffic goes to VPC Flow Logs, which publish to CloudWatch Logs, S3 or Data Firehose.</desc><defs><marker id="ah0" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker></defs><rect x="0.75" y="0.75" width="878.5" height="260.5" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><rect x="8.0" y="8.0" width="261.3" height="72.0" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.6"/><text x="138.7" y="49.2" font-size="16" font-weight="bold" fill="#374151" text-anchor="middle">Account activity</text><line x1="271.3" y1="44.0" x2="307.3" y2="44.0" stroke="#1f2937" stroke-width="2.6" marker-end="url(#ah0)"/><rect x="309.3" y="8.0" width="261.3" height="72.0" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="440.0" y="49.2" font-size="16" font-weight="bold" fill="#1e3a8a" text-anchor="middle">AWS CloudTrail</text><line x1="572.7" y1="44.0" x2="608.7" y2="44.0" stroke="#1f2937" stroke-width="2.6" marker-end="url(#ah0)"/><rect x="610.7" y="8.0" width="261.3" height="72.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="741.3" y="49.2" font-size="16" font-weight="bold" fill="#1f2937" text-anchor="middle">Amazon S3 bucket (a trail)</text><rect x="8.0" y="92.0" width="261.3" height="72.0" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.6"/><text x="138.7" y="133.2" font-size="16" font-weight="bold" fill="#374151" text-anchor="middle">Service and application logs</text><line x1="271.3" y1="128.0" x2="307.3" y2="128.0" stroke="#1f2937" stroke-width="2.6" marker-end="url(#ah0)"/><rect x="309.3" y="92.0" width="261.3" height="72.0" rx="8" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.6"/><text x="440.0" y="133.2" font-size="16" font-weight="bold" fill="#134e4a" text-anchor="middle">CloudWatch Logs</text><line x1="572.7" y1="128.0" x2="608.7" y2="128.0" stroke="#1f2937" stroke-width="2.6" marker-end="url(#ah0)"/><rect x="610.7" y="92.0" width="261.3" height="72.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="741.3" y="133.2" font-size="16" font-weight="bold" fill="#1f2937" text-anchor="middle">log groups</text><rect x="8.0" y="176.0" width="261.3" height="72.0" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.6"/><text x="138.7" y="217.2" font-size="16" font-weight="bold" fill="#374151" text-anchor="middle">Network traffic</text><line x1="271.3" y1="212.0" x2="307.3" y2="212.0" stroke="#1f2937" stroke-width="2.6" marker-end="url(#ah0)"/><rect x="309.3" y="176.0" width="261.3" height="72.0" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="440.0" y="217.2" font-size="16" font-weight="bold" fill="#78350f" text-anchor="middle">VPC Flow Logs</text><line x1="572.7" y1="212.0" x2="608.7" y2="212.0" stroke="#1f2937" stroke-width="2.6" marker-end="url(#ah0)"/><rect x="610.7" y="176.0" width="261.3" height="72.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="741.3" y="207.2" font-size="16" font-weight="bold" fill="#1f2937" text-anchor="middle">CloudWatch Logs, S3 or</text><text x="741.3" y="227.2" font-size="16" font-weight="bold" fill="#1f2937" text-anchor="middle">Firehose</text></svg>