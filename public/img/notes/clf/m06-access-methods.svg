<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 340" width="880" height="340" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">m06-access-methods</title><desc id="d">The Management Console for people, the AWS CLI for scripts and the AWS SDKs for applications all end up calling the same AWS service APIs, which reach the AWS services.</desc><defs><marker id="ah0" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker></defs><rect x="0.75" y="0.75" width="878.5" height="338.5" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><rect x="8.0" y="10.0" width="250.0" height="74.0" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="133.0" y="42.2" font-size="16" font-weight="bold" fill="#1e3a8a" text-anchor="middle">Management Console</text><text x="133.0" y="62.2" font-size="16" font-weight="normal" fill="#1e3a8a" text-anchor="middle">for people, in a web browser</text><line x1="258.0" y1="47.0" x2="358.0" y2="125.0" stroke="#374151" stroke-width="2.4" marker-end="url(#ah0)"/><rect x="8.0" y="100.0" width="250.0" height="74.0" rx="8" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.6"/><text x="133.0" y="132.2" font-size="16" font-weight="bold" fill="#134e4a" text-anchor="middle">AWS CLI</text><text x="133.0" y="152.2" font-size="16" font-weight="normal" fill="#134e4a" text-anchor="middle">for scripts, in a shell</text><line x1="258.0" y1="137.0" x2="358.0" y2="125.0" stroke="#374151" stroke-width="2.4" marker-end="url(#ah0)"/><rect x="8.0" y="190.0" width="250.0" height="74.0" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.6"/><text x="133.0" y="222.2" font-size="16" font-weight="bold" fill="#4c1d95" text-anchor="middle">AWS SDKs</text><text x="133.0" y="242.2" font-size="16" font-weight="normal" fill="#4c1d95" text-anchor="middle">for applications, in code</text><line x1="258.0" y1="227.0" x2="358.0" y2="125.0" stroke="#374151" stroke-width="2.4" marker-end="url(#ah0)"/><rect x="360.0" y="60.0" width="180.0" height="130.0" rx="8" fill="#1e3a8a" stroke="#1e3a8a" stroke-width="1.6"/><text x="450.0" y="110.2" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">AWS service APIs</text><text x="450.0" y="130.2" font-size="16" font-weight="normal" fill="#ffffff" text-anchor="middle">one set of calls</text><text x="450.0" y="150.2" font-size="16" font-weight="normal" fill="#ffffff" text-anchor="middle">behind every tool</text><line x1="540.0" y1="125.0" x2="628.0" y2="125.0" stroke="#374151" stroke-width="2.6" marker-end="url(#ah0)"/><rect x="630.0" y="60.0" width="242.0" height="130.0" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="751.0" y="110.2" font-size="16" font-weight="bold" fill="#14532d" text-anchor="middle">AWS services</text><text x="751.0" y="130.2" font-size="16" font-weight="normal" fill="#14532d" text-anchor="middle">compute, storage,</text><text x="751.0" y="150.2" font-size="16" font-weight="normal" fill="#14532d" text-anchor="middle">databases and more</text><rect x="8.0" y="284.0" width="864.0" height="46.0" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="440.0" y="312.5" font-size="17" font-weight="bold" fill="#78350f" text-anchor="middle">Same actions, different front doors</text></svg>