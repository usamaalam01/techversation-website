<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">Automation, assistance and augmentation</title><desc id="d">Three AI strategies by task complexity and human involvement: automation for low complexity and little human intervention, assistance for analysis that needs human review, augmentation for complex strategic tasks with iterative human-AI collaboration.</desc><defs><marker id="ah0" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker></defs><rect x="0.75" y="0.75" width="958.5" height="468.5" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><text x="20.0" y="28.0" font-size="18" font-weight="bold" fill="#1f2937" text-anchor="start">AI strategies: how much human involvement?</text><text x="20.0" y="48.0" font-size="12" font-weight="normal" fill="#6b7280" text-anchor="start">PMBOK 8 Appendix X3.1.1 and Figure X3-2: classify tasks by complexity and the need for human supervision</text><rect x="20.0" y="66.0" width="300.0" height="40.0" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.6"/><text x="170.0" y="90.9" font-size="15" font-weight="bold" fill="#374151" text-anchor="middle">AUTOMATION</text><rect x="20.0" y="112.0" width="300.0" height="296.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5"/><text x="32.0" y="134.0" font-size="12" font-weight="bold" fill="#374151" text-anchor="start">Low complexity, little human intervention</text><text x="32.0" y="154.0" font-size="12" font-weight="bold" fill="#9ca3af" text-anchor="start">•</text><text x="46.0" y="154.0" font-size="11.8" font-weight="normal" fill="#1f2937" text-anchor="start">Automated reporting</text><text x="32.0" y="173.8" font-size="12" font-weight="bold" fill="#9ca3af" text-anchor="start">•</text><text x="46.0" y="173.8" font-size="11.8" font-weight="normal" fill="#1f2937" text-anchor="start">Process automation</text><text x="32.0" y="193.5" font-size="12" font-weight="bold" fill="#9ca3af" text-anchor="start">•</text><text x="46.0" y="193.5" font-size="11.8" font-weight="normal" fill="#1f2937" text-anchor="start">Real-time monitoring</text><text x="32.0" y="213.2" font-size="12" font-weight="bold" fill="#9ca3af" text-anchor="start">•</text><text x="46.0" y="213.2" font-size="11.8" font-weight="normal" fill="#1f2937" text-anchor="start">Task management and reminders</text><text x="32.0" y="233.0" font-size="12" font-weight="bold" fill="#9ca3af" text-anchor="start">•</text><text x="46.0" y="233.0" font-size="11.8" font-weight="normal" fill="#1f2937" text-anchor="start">AI chatbots for routine queries</text><text x="32.0" y="252.8" font-size="12" font-weight="bold" fill="#9ca3af" text-anchor="start">•</text><text x="46.0" y="252.8" font-size="11.8" font-weight="normal" fill="#1f2937" text-anchor="start">Meeting transcription and minutes</text><text x="32.0" y="272.5" font-size="12" font-weight="bold" fill="#9ca3af" text-anchor="start">•</text><text x="46.0" y="272.5" font-size="11.8" font-weight="normal" fill="#1f2937" text-anchor="start">Reusable standard prompts</text><text x="32.0" y="372.0" font-size="11.5" font-weight="italic" fill="#374151" text-anchor="start" font-style="italic">Machine does the work; human sets rules and</text><text x="32.0" y="386.4" font-size="11.5" font-weight="italic" fill="#374151" text-anchor="start" font-style="italic">spot-checks</text><rect x="340.0" y="66.0" width="300.0" height="40.0" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="490.0" y="90.9" font-size="15" font-weight="bold" fill="#1e3a8a" text-anchor="middle">ASSISTANCE</text><rect x="340.0" y="112.0" width="300.0" height="296.0" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/><text x="352.0" y="134.0" font-size="12" font-weight="bold" fill="#1e3a8a" text-anchor="start">Medium complexity; tool complements analysis</text><text x="352.0" y="154.0" font-size="12" font-weight="bold" fill="#2563eb" text-anchor="start">•</text><text x="366.0" y="154.0" font-size="11.8" font-weight="normal" fill="#1f2937" text-anchor="start">Drafting a risk register or schedule with buffers</text><text x="352.0" y="173.8" font-size="12" font-weight="bold" fill="#2563eb" text-anchor="start">•</text><text x="366.0" y="173.8" font-size="11.8" font-weight="normal" fill="#1f2937" text-anchor="start">Schedule conflict resolution</text><text x="352.0" y="193.5" font-size="12" font-weight="bold" fill="#2563eb" text-anchor="start">•</text><text x="366.0" y="193.5" font-size="11.8" font-weight="normal" fill="#1f2937" text-anchor="start">Dynamic scheduling</text><text x="352.0" y="213.2" font-size="12" font-weight="bold" fill="#2563eb" text-anchor="start">•</text><text x="366.0" y="213.2" font-size="11.8" font-weight="normal" fill="#1f2937" text-anchor="start">Predictive analytics for planning</text><text x="352.0" y="233.0" font-size="12" font-weight="bold" fill="#2563eb" text-anchor="start">•</text><text x="366.0" y="233.0" font-size="11.8" font-weight="normal" fill="#1f2937" text-anchor="start">Early warning signals</text><text x="352.0" y="252.8" font-size="12" font-weight="bold" fill="#2563eb" text-anchor="start">•</text><text x="366.0" y="252.8" font-size="11.8" font-weight="normal" fill="#1f2937" text-anchor="start">Risk impact analysis</text><text x="352.0" y="372.0" font-size="11.5" font-weight="italic" fill="#1e3a8a" text-anchor="start" font-style="italic">First outputs are not final: the professional reviews for</text><text x="352.0" y="386.4" font-size="11.5" font-weight="italic" fill="#1e3a8a" text-anchor="start" font-style="italic">accuracy and completeness</text><rect x="660.0" y="66.0" width="300.0" height="40.0" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.6"/><text x="810.0" y="90.9" font-size="15" font-weight="bold" fill="#4c1d95" text-anchor="middle">AUGMENTATION</text><rect x="660.0" y="112.0" width="300.0" height="296.0" rx="8" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/><text x="672.0" y="134.0" font-size="12" font-weight="bold" fill="#4c1d95" text-anchor="start">High complexity, strategic tasks</text><text x="672.0" y="154.0" font-size="12" font-weight="bold" fill="#7c3aed" text-anchor="start">•</text><text x="686.0" y="154.0" font-size="11.8" font-weight="normal" fill="#1f2937" text-anchor="start">Balancing a portfolio for ROI</text><text x="672.0" y="173.8" font-size="12" font-weight="bold" fill="#7c3aed" text-anchor="start">•</text><text x="686.0" y="173.8" font-size="11.8" font-weight="normal" fill="#1f2937" text-anchor="start">Risk forecasting using external variables</text><text x="672.0" y="193.5" font-size="12" font-weight="bold" fill="#7c3aed" text-anchor="start">•</text><text x="686.0" y="193.5" font-size="11.8" font-weight="normal" fill="#1f2937" text-anchor="start">Baseline optimization (scope-schedule-cost</text><text x="686.0" y="208.2" font-size="11.8" font-weight="normal" fill="#1f2937" text-anchor="start">trade-offs)</text><text x="672.0" y="228.0" font-size="12" font-weight="bold" fill="#7c3aed" text-anchor="start">•</text><text x="686.0" y="228.0" font-size="11.8" font-weight="normal" fill="#1f2937" text-anchor="start">Stakeholder sentiment analysis</text><text x="672.0" y="247.8" font-size="12" font-weight="bold" fill="#7c3aed" text-anchor="start">•</text><text x="686.0" y="247.8" font-size="11.8" font-weight="normal" fill="#1f2937" text-anchor="start">Brainstorming and idea generation</text><text x="672.0" y="267.5" font-size="12" font-weight="bold" fill="#7c3aed" text-anchor="start">•</text><text x="686.0" y="267.5" font-size="11.8" font-weight="normal" fill="#1f2937" text-anchor="start">Data-driven decisions on project selection</text><text x="672.0" y="372.0" font-size="11.5" font-weight="italic" fill="#4c1d95" text-anchor="start" font-style="italic">Human and AI iterate: AI is a brainstorming partner;</text><text x="672.0" y="386.4" font-size="11.5" font-weight="italic" fill="#4c1d95" text-anchor="start" font-style="italic">the human decides</text><line x1="40.0" y1="442.0" x2="920.0" y2="442.0" stroke="#6b7280" stroke-width="2.4" marker-end="url(#ah0)"/><text x="40.0" y="432.0" font-size="12" font-weight="bold" fill="#6b7280" text-anchor="start">More machine, less human</text><text x="920.0" y="432.0" font-size="12" font-weight="bold" fill="#6b7280" text-anchor="end">More human judgment, more complexity</text></svg>