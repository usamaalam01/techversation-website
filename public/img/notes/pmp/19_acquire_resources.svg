<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 520" width="980" height="520" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">Acquiring resources: sources, tools and fallbacks</title><desc id="d">Resource requirements and calendars lead to internal sources (functional or resource managers, PMO pool, preassignment) or external sources (procurement, partnerships, joint ventures). Negotiation and decision tools secure assignments; if resources are unavailable, alternatives are allowed if risks are acknowledged and legal or regulatory criteria are not violated; escalate if needed.</desc><defs><marker id="ah0" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker></defs><rect x="0.75" y="0.75" width="978.5" height="518.5" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><text x="20.0" y="28.0" font-size="18" font-weight="bold" fill="#1f2937" text-anchor="start">Acquire Resources: from requirement to assignment</text><text x="20.0" y="48.0" font-size="12" font-weight="normal" fill="#6b7280" text-anchor="start">Follow the sourcing route in the resource management plan; negotiate; document impacts when the first choice is not available</text><rect x="20.0" y="64.0" width="190.0" height="110.0" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="115.0" y="101.2" font-size="11.5" font-weight="bold" fill="#1e3a8a" text-anchor="middle">Need</text><text x="115.0" y="115.5" font-size="11.5" font-weight="normal" fill="#1e3a8a" text-anchor="middle">Resource requirements, resource</text><text x="115.0" y="129.9" font-size="11.5" font-weight="normal" fill="#1e3a8a" text-anchor="middle">calendars, activity list, schedule</text><text x="115.0" y="144.3" font-size="11.5" font-weight="normal" fill="#1e3a8a" text-anchor="middle">and budget</text><line x1="211.0" y1="119.0" x2="249.0" y2="119.0" stroke="#1f2937" stroke-width="2.2" marker-end="url(#ah0)"/><rect x="250.0" y="64.0" width="300.0" height="52.0" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="400.0" y="79.8" font-size="11" font-weight="bold" fill="#14532d" text-anchor="middle">Internal sources</text><text x="400.0" y="93.6" font-size="11" font-weight="normal" fill="#14532d" text-anchor="middle">Functional or resource managers, PMO resource pool,</text><text x="400.0" y="107.3" font-size="11" font-weight="normal" fill="#14532d" text-anchor="middle">preassigned people</text><rect x="250.0" y="122.0" width="300.0" height="52.0" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.6"/><text x="400.0" y="137.8" font-size="11" font-weight="bold" fill="#4c1d95" text-anchor="middle">External sources</text><text x="400.0" y="151.6" font-size="11" font-weight="normal" fill="#4c1d95" text-anchor="middle">Procurement of contractors or suppliers, partnerships,</text><text x="400.0" y="165.3" font-size="11" font-weight="normal" fill="#4c1d95" text-anchor="middle">joint ventures (Topic 22)</text><line x1="551.0" y1="119.0" x2="589.0" y2="119.0" stroke="#1f2937" stroke-width="2.2" marker-end="url(#ah0)"/><rect x="590.0" y="64.0" width="370.0" height="110.0" rx="8" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.6"/><text x="775.0" y="101.5" font-size="11.3" font-weight="bold" fill="#134e4a" text-anchor="middle">Tools to secure them</text><text x="775.0" y="115.6" font-size="11.3" font-weight="normal" fill="#134e4a" text-anchor="middle">Negotiate and influence; collaborate with resource owners;</text><text x="775.0" y="129.7" font-size="11.3" font-weight="normal" fill="#134e4a" text-anchor="middle">multicriteria decision analysis to choose among candidates; virtual</text><text x="775.0" y="143.9" font-size="11.3" font-weight="normal" fill="#134e4a" text-anchor="middle">teams to widen the pool; problem-solving</text><line x1="775.0" y1="175.0" x2="775.0" y2="202.0" stroke="#1f2937" stroke-width="2.2" marker-end="url(#ah0)"/><rect x="590.0" y="200.0" width="370.0" height="64.0" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.6"/><text x="775.0" y="221.6" font-size="11.2" font-weight="bold" fill="#374151" text-anchor="middle">Result</text><text x="775.0" y="235.6" font-size="11.2" font-weight="normal" fill="#374151" text-anchor="middle">Physical or virtual resource assignments, project team assignments,</text><text x="775.0" y="249.6" font-size="11.2" font-weight="normal" fill="#374151" text-anchor="middle">updated resource calendars, change requests if the baselines move</text><rect x="20.0" y="190.0" width="530.0" height="190.0" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="1.6"/><text x="34.0" y="212.0" font-size="12.5" font-weight="bold" fill="#78350f" text-anchor="start">If a resource is not available (economics, other projects, limits)</text><text x="34.0" y="232.0" font-size="11.2" font-weight="bold" fill="#6b7280" text-anchor="start">•</text><text x="46.0" y="232.0" font-size="11.2" font-weight="normal" fill="#1f2937" text-anchor="start">Assign an alternative resource, possibly with different competence, features or cost, only if the</text><text x="46.0" y="245.7" font-size="11.2" font-weight="normal" fill="#1f2937" text-anchor="start">risks are acknowledged and legal, regulatory, mandatory or other criteria are not violated.</text><text x="34.0" y="264.3" font-size="11.2" font-weight="bold" fill="#6b7280" text-anchor="start">•</text><text x="46.0" y="264.3" font-size="11.2" font-weight="normal" fill="#1f2937" text-anchor="start">Document the effect of the unavailability on schedule, budget, risks, quality and training plans, and</text><text x="46.0" y="278.0" font-size="11.2" font-weight="normal" fill="#1f2937" text-anchor="start">update those plans.</text><text x="34.0" y="296.7" font-size="11.2" font-weight="bold" fill="#6b7280" text-anchor="start">•</text><text x="46.0" y="296.7" font-size="11.2" font-weight="normal" fill="#1f2937" text-anchor="start">Negotiate with the resource owner, then escalate through the sponsor or governance if it cannot</text><text x="46.0" y="310.3" font-size="11.2" font-weight="normal" fill="#1f2937" text-anchor="start">be resolved.</text><text x="34.0" y="329.0" font-size="11.2" font-weight="bold" fill="#6b7280" text-anchor="start">•</text><text x="46.0" y="329.0" font-size="11.2" font-weight="normal" fill="#1f2937" text-anchor="start">Failing to get needed resources can hurt schedule, budget, quality and satisfaction, raise risk and,</text><text x="46.0" y="342.6" font-size="11.2" font-weight="normal" fill="#1f2937" text-anchor="start">at worst, cancel the project.</text><rect x="20.0" y="394.0" width="940.0" height="112.0" rx="8" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.2"/><text x="32.0" y="414.0" font-size="12" font-weight="bold" fill="#1f2937" text-anchor="start">Working with the organization's structure (Topic 01)</text><text x="32.0" y="432.0" font-size="11" font-weight="bold" fill="#6b7280" text-anchor="start">•</text><text x="44.0" y="432.0" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="start">Functional and weak matrix: the project manager has little authority; negotiate and align the functional managers rather than overrule them.</text><text x="32.0" y="449.2" font-size="11" font-weight="bold" fill="#6b7280" text-anchor="start">•</text><text x="44.0" y="449.2" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="start">Strong matrix or projectized: more authority and dedicated resources. Preassigned people (named in a proposal or needed for their expertise) come with availability you must plan</text><text x="44.0" y="462.4" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="start">around.</text><text x="32.0" y="479.6" font-size="11" font-weight="bold" fill="#6b7280" text-anchor="start">•</text><text x="44.0" y="479.6" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="start">Agile teams work best with dedicated, cross-functional members; part-time or shared members cause context switching and waiting.</text></svg>