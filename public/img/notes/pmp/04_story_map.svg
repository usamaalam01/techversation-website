<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 470" width="980" height="470" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">Story map with an MVP gap</title><desc id="d">A clinic appointment app. The backbone of user activities runs across the top: sign up, find a slot, book, get a reminder, check in. Release 1 has a card under every activity except Book, so nobody can complete an appointment in release 1.</desc><defs><marker id="ah0" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker></defs><rect x="0.75" y="0.75" width="978.5" height="468.5" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><text x="20.0" y="28.0" font-size="18" font-weight="bold" fill="#1f2937" text-anchor="start">Story map: backbone, details and release slices</text><text x="20.0" y="48.0" font-size="12" font-weight="normal" fill="#6b7280" text-anchor="start">Read left to right for the user's journey, top to bottom for priority; each horizontal slice is a release</text><text x="20.0" y="102.0" font-size="12" font-weight="bold" fill="#6b7280" text-anchor="start">Backbone</text><text x="20.0" y="117.0" font-size="11" font-weight="normal" fill="#6b7280" text-anchor="start">(user activities)</text><rect x="130.0" y="76.0" width="150.0" height="46.0" rx="8" fill="#1e3a8a" stroke="#1e3a8a" stroke-width="1.6"/><text x="205.0" y="103.2" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">Sign up</text><line x1="281.0" y1="99.0" x2="291.0" y2="99.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#ah0)"/><rect x="292.0" y="76.0" width="150.0" height="46.0" rx="8" fill="#1e3a8a" stroke="#1e3a8a" stroke-width="1.6"/><text x="367.0" y="103.2" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">Find a slot</text><line x1="443.0" y1="99.0" x2="453.0" y2="99.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#ah0)"/><rect x="454.0" y="76.0" width="150.0" height="46.0" rx="8" fill="#1e3a8a" stroke="#1e3a8a" stroke-width="1.6"/><text x="529.0" y="103.2" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">Book</text><line x1="605.0" y1="99.0" x2="615.0" y2="99.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#ah0)"/><rect x="616.0" y="76.0" width="150.0" height="46.0" rx="8" fill="#1e3a8a" stroke="#1e3a8a" stroke-width="1.6"/><text x="691.0" y="103.2" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">Get a reminder</text><line x1="767.0" y1="99.0" x2="777.0" y2="99.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#ah0)"/><rect x="778.0" y="76.0" width="150.0" height="46.0" rx="8" fill="#1e3a8a" stroke="#1e3a8a" stroke-width="1.6"/><text x="853.0" y="103.2" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">Check in</text><line x1="20.0" y1="142.0" x2="960.0" y2="142.0" stroke="#9ca3af" stroke-width="1.4" stroke-dasharray="6 4"/><text x="20.0" y="176.0" font-size="12.5" font-weight="bold" fill="#1f2937" text-anchor="start">Release 1</text><text x="20.0" y="191.0" font-size="12.5" font-weight="bold" fill="#1f2937" text-anchor="start">(MVP)</text><rect x="130.0" y="150.0" width="150.0" height="54.0" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="205.0" y="180.9" font-size="12" font-weight="normal" fill="#14532d" text-anchor="middle">E-mail sign-up</text><rect x="292.0" y="150.0" width="150.0" height="54.0" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="367.0" y="180.9" font-size="12" font-weight="normal" fill="#14532d" text-anchor="middle">List by date</text><rect x="454.0" y="150.0" width="150.0" height="54.0" rx="8" fill="#fff7ed" stroke="#dc2626" stroke-width="2.2" stroke-dasharray="5 4"/><text x="529.0" y="172.0" font-size="12" font-weight="bold" fill="#7f1d1d" text-anchor="middle">No card:</text><text x="529.0" y="186.4" font-size="12" font-weight="bold" fill="#7f1d1d" text-anchor="middle">nobody can book</text><rect x="616.0" y="150.0" width="150.0" height="54.0" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="691.0" y="180.9" font-size="12" font-weight="normal" fill="#14532d" text-anchor="middle">SMS reminder</text><rect x="778.0" y="150.0" width="150.0" height="54.0" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="853.0" y="180.9" font-size="12" font-weight="normal" fill="#14532d" text-anchor="middle">Code at desk</text><line x1="20.0" y1="224.0" x2="960.0" y2="224.0" stroke="#9ca3af" stroke-width="1.4" stroke-dasharray="6 4"/><text x="20.0" y="258.0" font-size="12.5" font-weight="bold" fill="#1f2937" text-anchor="start">Release 2</text><rect x="130.0" y="232.0" width="150.0" height="54.0" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="205.0" y="262.9" font-size="12" font-weight="normal" fill="#1e3a8a" text-anchor="middle">Social login</text><rect x="292.0" y="232.0" width="150.0" height="54.0" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="367.0" y="262.9" font-size="12" font-weight="normal" fill="#1e3a8a" text-anchor="middle">Filter by doctor</text><rect x="454.0" y="232.0" width="150.0" height="54.0" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="529.0" y="262.9" font-size="12" font-weight="normal" fill="#1e3a8a" text-anchor="middle">Book online</text><rect x="616.0" y="232.0" width="150.0" height="54.0" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="691.0" y="262.9" font-size="12" font-weight="normal" fill="#1e3a8a" text-anchor="middle">Choose reminder time</text><rect x="778.0" y="232.0" width="150.0" height="54.0" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="853.0" y="262.9" font-size="12" font-weight="normal" fill="#1e3a8a" text-anchor="middle">Self check-in kiosk</text><line x1="20.0" y1="306.0" x2="960.0" y2="306.0" stroke="#9ca3af" stroke-width="1.4" stroke-dasharray="6 4"/><text x="20.0" y="340.0" font-size="12.5" font-weight="bold" fill="#1f2937" text-anchor="start">Later</text><rect x="130.0" y="314.0" width="150.0" height="54.0" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.6"/><text x="205.0" y="344.9" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">Family accounts</text><rect x="292.0" y="314.0" width="150.0" height="54.0" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.6"/><text x="367.0" y="344.9" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">Map view</text><rect x="454.0" y="314.0" width="150.0" height="54.0" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.6"/><text x="529.0" y="344.9" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">Recurring visits</text><rect x="616.0" y="314.0" width="150.0" height="54.0" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.6"/><text x="691.0" y="344.9" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">Preparation notes</text><rect x="778.0" y="314.0" width="150.0" height="54.0" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.6"/><text x="853.0" y="344.9" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">Wait-time estimate</text><line x1="20.0" y1="388.0" x2="960.0" y2="388.0" stroke="#9ca3af" stroke-width="1.4" stroke-dasharray="6 4"/><rect x="20.0" y="404.0" width="940.0" height="48.0" rx="8" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.4"/><text x="34.0" y="424.0" font-size="12" font-weight="normal" fill="#1f2937" text-anchor="start">Walking skeleton check: the MVP must work end to end, so every column of the backbone needs a card in release 1. The empty cell under Book shows the gap: bring</text><text x="34.0" y="438.6" font-size="12" font-weight="normal" fill="#1f2937" text-anchor="start">'Book online' forward (or slice it thinner) before release 1 is declared ready.</text></svg>