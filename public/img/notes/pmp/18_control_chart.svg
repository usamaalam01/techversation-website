<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 560" width="980" height="560" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">Reading a control chart</title><desc id="d">A control chart with mean, upper and lower control limits, and wider specification limits. Patterns that signal a special cause: a point outside the control limits, seven consecutive points on one side of the mean, and a run of points trending in one direction.</desc><defs></defs><rect x="0.75" y="0.75" width="978.5" height="558.5" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><text x="20.0" y="28.0" font-size="18" font-weight="bold" fill="#1f2937" text-anchor="start">Reading a control chart</text><text x="20.0" y="48.0" font-size="12" font-weight="normal" fill="#6b7280" text-anchor="start">Control limits come from the process; specification limits come from the customer. Watch patterns, not just limits</text><line x1="70.0" y1="116.0" x2="650.0" y2="116.0" stroke="#7c3aed" stroke-width="1.6" stroke-dasharray="2 4"/><line x1="70.0" y1="404.0" x2="650.0" y2="404.0" stroke="#7c3aed" stroke-width="1.6" stroke-dasharray="2 4"/><text x="656.0" y="120.0" font-size="10.5" font-weight="bold" fill="#4c1d95" text-anchor="start">USL</text><text x="656.0" y="408.0" font-size="10.5" font-weight="bold" fill="#4c1d95" text-anchor="start">LSL</text><line x1="70.0" y1="140.0" x2="650.0" y2="140.0" stroke="#dc2626" stroke-width="1.8" stroke-dasharray="6 4"/><text x="656.0" y="144.0" font-size="10.5" font-weight="bold" fill="#991b1b" text-anchor="start">UCL</text><line x1="70.0" y1="260.0" x2="650.0" y2="260.0" stroke="#16a34a" stroke-width="1.8"/><text x="656.0" y="264.0" font-size="10.5" font-weight="bold" fill="#14532d" text-anchor="start">Mean</text><line x1="70.0" y1="380.0" x2="650.0" y2="380.0" stroke="#dc2626" stroke-width="1.8" stroke-dasharray="6 4"/><text x="656.0" y="384.0" font-size="10.5" font-weight="bold" fill="#991b1b" text-anchor="start">LCL</text><line x1="70.0" y1="220.0" x2="650.0" y2="220.0" stroke="#d1d5db" stroke-width="1" stroke-dasharray="2 4"/><line x1="70.0" y1="180.0" x2="650.0" y2="180.0" stroke="#d1d5db" stroke-width="1" stroke-dasharray="2 4"/><line x1="70.0" y1="300.0" x2="650.0" y2="300.0" stroke="#d1d5db" stroke-width="1" stroke-dasharray="2 4"/><line x1="70.0" y1="340.0" x2="650.0" y2="340.0" stroke="#d1d5db" stroke-width="1" stroke-dasharray="2 4"/><line x1="70.0" y1="80.0" x2="70.0" y2="440.0" stroke="#6b7280" stroke-width="1.5"/><line x1="70.0" y1="440.0" x2="650.0" y2="440.0" stroke="#6b7280" stroke-width="1.5"/><polyline points="90.0,244.0 109.4,288.0 128.8,224.0 148.2,272.0 167.6,236.0 187.0,304.0 206.4,252.0 225.8,280.0 245.2,228.0 264.6,268.0 284.0,236.0 303.4,224.0 322.8,244.0 342.2,216.0 361.6,232.0 381.0,240.0 400.4,212.0 419.8,228.0 439.2,248.0 458.6,276.0 478.0,124.0 497.4,268.0 516.8,224.0 536.2,192.0 555.6,208.0 575.0,224.0 594.4,244.0 613.8,264.0 633.2,288.0 652.6,312.0" fill="none" stroke="#2563eb" stroke-width="1.8" stroke-linejoin="round"/><circle cx="90.0" cy="244.0" r="4" fill="#2563eb" stroke="#ffffff" stroke-width="1.2"/><circle cx="109.4" cy="288.0" r="4" fill="#2563eb" stroke="#ffffff" stroke-width="1.2"/><circle cx="128.8" cy="224.0" r="4" fill="#2563eb" stroke="#ffffff" stroke-width="1.2"/><circle cx="148.2" cy="272.0" r="4" fill="#2563eb" stroke="#ffffff" stroke-width="1.2"/><circle cx="167.6" cy="236.0" r="4" fill="#2563eb" stroke="#ffffff" stroke-width="1.2"/><circle cx="187.0" cy="304.0" r="4" fill="#2563eb" stroke="#ffffff" stroke-width="1.2"/><circle cx="206.4" cy="252.0" r="4" fill="#2563eb" stroke="#ffffff" stroke-width="1.2"/><circle cx="225.8" cy="280.0" r="4" fill="#2563eb" stroke="#ffffff" stroke-width="1.2"/><circle cx="245.2" cy="228.0" r="4" fill="#2563eb" stroke="#ffffff" stroke-width="1.2"/><circle cx="264.6" cy="268.0" r="4" fill="#2563eb" stroke="#ffffff" stroke-width="1.2"/><circle cx="284.0" cy="236.0" r="4" fill="#d97706" stroke="#ffffff" stroke-width="1.2"/><circle cx="303.4" cy="224.0" r="4" fill="#d97706" stroke="#ffffff" stroke-width="1.2"/><circle cx="322.8" cy="244.0" r="4" fill="#d97706" stroke="#ffffff" stroke-width="1.2"/><circle cx="342.2" cy="216.0" r="4" fill="#d97706" stroke="#ffffff" stroke-width="1.2"/><circle cx="361.6" cy="232.0" r="4" fill="#d97706" stroke="#ffffff" stroke-width="1.2"/><circle cx="381.0" cy="240.0" r="4" fill="#d97706" stroke="#ffffff" stroke-width="1.2"/><circle cx="400.4" cy="212.0" r="4" fill="#d97706" stroke="#ffffff" stroke-width="1.2"/><circle cx="419.8" cy="228.0" r="4" fill="#d97706" stroke="#ffffff" stroke-width="1.2"/><circle cx="439.2" cy="248.0" r="4" fill="#d97706" stroke="#ffffff" stroke-width="1.2"/><circle cx="458.6" cy="276.0" r="4" fill="#2563eb" stroke="#ffffff" stroke-width="1.2"/><circle cx="478.0" cy="124.0" r="4" fill="#dc2626" stroke="#ffffff" stroke-width="1.2"/><circle cx="497.4" cy="268.0" r="4" fill="#2563eb" stroke="#ffffff" stroke-width="1.2"/><circle cx="516.8" cy="224.0" r="4" fill="#2563eb" stroke="#ffffff" stroke-width="1.2"/><circle cx="536.2" cy="192.0" r="4" fill="#0d9488" stroke="#ffffff" stroke-width="1.2"/><circle cx="555.6" cy="208.0" r="4" fill="#0d9488" stroke="#ffffff" stroke-width="1.2"/><circle cx="575.0" cy="224.0" r="4" fill="#0d9488" stroke="#ffffff" stroke-width="1.2"/><circle cx="594.4" cy="244.0" r="4" fill="#0d9488" stroke="#ffffff" stroke-width="1.2"/><circle cx="613.8" cy="264.0" r="4" fill="#0d9488" stroke="#ffffff" stroke-width="1.2"/><circle cx="633.2" cy="288.0" r="4" fill="#0d9488" stroke="#ffffff" stroke-width="1.2"/><circle cx="652.6" cy="312.0" r="4" fill="#0d9488" stroke="#ffffff" stroke-width="1.2"/><rect x="274.0" y="196.0" width="175.2" height="86.0" rx="6" fill="none" stroke="#d97706" stroke-width="1.6" stroke-dasharray="4 3"/><text x="361.6" y="188.0" font-size="10.5" font-weight="bold" fill="#78350f" text-anchor="middle">A: 7+ points above the mean</text><circle cx="478.0" cy="124.0" r="11" fill="none" stroke="#dc2626" stroke-width="1.8"/><text x="462.0" y="134.0" font-size="10.5" font-weight="bold" fill="#991b1b" text-anchor="end">B: beyond UCL</text><rect x="508.8" y="184.0" width="151.8" height="148.0" rx="6" fill="none" stroke="#0d9488" stroke-width="1.6" stroke-dasharray="4 3"/><text x="584.7" y="350.0" font-size="10.5" font-weight="bold" fill="#134e4a" text-anchor="middle">C: steady drift</text><text x="360.0" y="464.0" font-size="11.5" font-weight="bold" fill="#6b7280" text-anchor="middle">Samples or time</text><rect x="710.0" y="64.0" width="250.0" height="440.0" rx="8" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.2"/><text x="722.0" y="86.0" font-size="12.5" font-weight="bold" fill="#1f2937" text-anchor="start">What the chart tells you</text><text x="722.0" y="108.0" font-size="11" font-weight="bold" fill="#1e3a8a" text-anchor="start">Control limits</text><text x="722.0" y="122.0" font-size="10.5" font-weight="normal" fill="#1f2937" text-anchor="start">Usually mean ± 3 standard deviations,</text><text x="722.0" y="134.6" font-size="10.5" font-weight="normal" fill="#1f2937" text-anchor="start">calculated from the process data; show its</text><text x="722.0" y="147.2" font-size="10.5" font-weight="normal" fill="#1f2937" text-anchor="start">natural variation. A stable process is predictable.</text><text x="722.0" y="168.8" font-size="11" font-weight="bold" fill="#1e3a8a" text-anchor="start">Specification limits</text><text x="722.0" y="182.8" font-size="10.5" font-weight="normal" fill="#1f2937" text-anchor="start">Set by requirements (maximum and minimum</text><text x="722.0" y="195.4" font-size="10.5" font-weight="normal" fill="#1f2937" text-anchor="start">allowed). They are not the control limits.</text><text x="722.0" y="217.0" font-size="11" font-weight="bold" fill="#1e3a8a" text-anchor="start">Special cause signals</text><text x="722.0" y="231.0" font-size="10.5" font-weight="normal" fill="#1f2937" text-anchor="start">A point outside the control limits; about seven</text><text x="722.0" y="243.6" font-size="10.5" font-weight="normal" fill="#1f2937" text-anchor="start">consecutive points on one side of the mean (rule</text><text x="722.0" y="256.2" font-size="10.5" font-weight="normal" fill="#1f2937" text-anchor="start">of seven); a run of points trending up or down.</text><text x="722.0" y="277.8" font-size="11" font-weight="bold" fill="#1e3a8a" text-anchor="start">Action</text><text x="722.0" y="291.8" font-size="10.5" font-weight="normal" fill="#1f2937" text-anchor="start">Investigate the assignable cause, even when all</text><text x="722.0" y="304.4" font-size="10.5" font-weight="normal" fill="#1f2937" text-anchor="start">points are inside the limits. Do not adjust a</text><text x="722.0" y="317.0" font-size="10.5" font-weight="normal" fill="#1f2937" text-anchor="start">stable process because of normal variation.</text><text x="722.0" y="338.6" font-size="11" font-weight="bold" fill="#1e3a8a" text-anchor="start">Coverage (normal data)</text><text x="722.0" y="352.6" font-size="10.5" font-weight="normal" fill="#1f2937" text-anchor="start">±1 sigma about 68%; ±2 sigma about 95%; ±3</text><text x="722.0" y="365.2" font-size="10.5" font-weight="normal" fill="#1f2937" text-anchor="start">sigma about 99.7%. Six Sigma aims at about 3.4</text><text x="722.0" y="377.8" font-size="10.5" font-weight="normal" fill="#1f2937" text-anchor="start">defects per million.</text></svg>