<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 520" width="980" height="520" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">Evaluate, prioritize and highlight impediments</title><desc id="d">A two by two grid of impact against urgency tells where to act first: remove high impact high urgency items now, plan and own high impact lower urgency items, quick-fix or batch low impact high urgency items, and watch low-low items. An example impediment list shows description, severity, action being taken and owner. Rank criteria and ways to highlight are listed below.</desc><defs></defs><rect x="0.75" y="0.75" width="978.5" height="518.5" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><text x="20.0" y="28.0" font-size="18" font-weight="bold" fill="#1f2937" text-anchor="start">Evaluate, prioritize and highlight</text><text x="20.0" y="48.0" font-size="12" font-weight="normal" fill="#6b7280" text-anchor="start">Work the highest impact first; do not spread the team across every open item</text><text x="185.0" y="82.0" font-size="11.5" font-weight="bold" fill="#6b7280" text-anchor="middle">Lower urgency</text><text x="371.0" y="82.0" font-size="11.5" font-weight="bold" fill="#6b7280" text-anchor="middle">High urgency</text><text x="20.0" y="146.0" font-size="11.5" font-weight="bold" fill="#6b7280" text-anchor="start">High</text><text x="20.0" y="159.8" font-size="11.5" font-weight="bold" fill="#6b7280" text-anchor="start">impact</text><text x="20.0" y="262.0" font-size="11.5" font-weight="bold" fill="#6b7280" text-anchor="start">Lower</text><text x="20.0" y="275.8" font-size="11.5" font-weight="bold" fill="#6b7280" text-anchor="start">impact</text><rect x="92.0" y="92.0" width="186.0" height="116.0" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.7"/><text x="102.0" y="114.0" font-size="12.5" font-weight="bold" fill="#78350f" text-anchor="start">Plan and own</text><text x="102.0" y="132.0" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">Schedule the fix, name an owner,</text><text x="102.0" y="145.2" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">get the right decision-maker</text><text x="102.0" y="158.4" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">involved, and track it.</text><rect x="278.0" y="92.0" width="186.0" height="116.0" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.7"/><text x="288.0" y="114.0" font-size="12.5" font-weight="bold" fill="#7f1d1d" text-anchor="start">Remove now</text><text x="288.0" y="132.0" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">Owner, action and date today.</text><text x="288.0" y="145.2" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">Escalate quickly if it is beyond</text><text x="288.0" y="158.4" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">your authority.</text><rect x="92.0" y="208.0" width="186.0" height="116.0" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.7"/><text x="102.0" y="230.0" font-size="12.5" font-weight="bold" fill="#374151" text-anchor="start">Watch</text><text x="102.0" y="248.0" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">Keep on the list and review.</text><text x="102.0" y="261.2" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">Accept it if removal costs more</text><text x="102.0" y="274.4" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">than it returns.</text><rect x="278.0" y="208.0" width="186.0" height="116.0" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.7"/><text x="288.0" y="230.0" font-size="12.5" font-weight="bold" fill="#1e3a8a" text-anchor="start">Quick fix</text><text x="288.0" y="248.0" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">Clear it fast or batch it, without</text><text x="288.0" y="261.2" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">letting it distract from the top</text><text x="288.0" y="274.4" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">items.</text><text x="278.0" y="340.0" font-size="10.5" font-weight="normal" fill="#6b7280" text-anchor="middle">Impact on objectives (rows) against urgency (columns)</text><rect x="500.0" y="64.0" width="460.0" height="262.0" rx="10" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/><text x="512.0" y="86.0" font-size="12.5" font-weight="bold" fill="#1f2937" text-anchor="start">Impediment list (visual chart on the team board)</text><rect x="508.0" y="98.0" width="444.0" height="24.0" rx="4" fill="#f3f4f6" stroke="#d1d5db" stroke-width="1.0"/><text x="512.0" y="114.0" font-size="11" font-weight="bold" fill="#1f2937" text-anchor="start">#</text><text x="538.0" y="114.0" font-size="11" font-weight="bold" fill="#1f2937" text-anchor="start">Impediment</text><text x="688.0" y="114.0" font-size="11" font-weight="bold" fill="#1f2937" text-anchor="start">Severity</text><text x="750.0" y="114.0" font-size="11" font-weight="bold" fill="#1f2937" text-anchor="start">Action being taken</text><line x1="508.0" y1="124.0" x2="952.0" y2="124.0" stroke="#d1d5db" stroke-width="1.0"/><text x="512.0" y="142.0" font-size="11" font-weight="bold" fill="#1f2937" text-anchor="start">1</text><text x="538.0" y="142.0" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">Test hardware approvals take</text><text x="538.0" y="155.0" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">days</text><rect x="688.0" y="132.0" width="38.2" height="20.0" rx="10.0" fill="#fee2e2" stroke="#dc2626" stroke-width="1.2"/><text x="707.1" y="143.5" font-size="10" font-weight="bold" fill="#7f1d1d" text-anchor="middle">High</text><text x="750.0" y="142.0" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">PM agrees a standing approval slot with</text><text x="750.0" y="155.0" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">the central IT group</text><line x1="508.0" y1="170.0" x2="952.0" y2="170.0" stroke="#d1d5db" stroke-width="1.0"/><text x="512.0" y="188.0" font-size="11" font-weight="bold" fill="#1f2937" text-anchor="start">2</text><text x="538.0" y="188.0" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">No access to the client data</text><text x="538.0" y="201.0" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">set</text><rect x="688.0" y="178.0" width="38.2" height="20.0" rx="10.0" fill="#fee2e2" stroke="#dc2626" stroke-width="1.2"/><text x="707.1" y="189.5" font-size="10" font-weight="bold" fill="#7f1d1d" text-anchor="middle">High</text><text x="750.0" y="188.0" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">Sponsor asked to approve access;</text><text x="750.0" y="201.0" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">owner: sponsor</text><line x1="508.0" y1="216.0" x2="952.0" y2="216.0" stroke="#d1d5db" stroke-width="1.0"/><text x="512.0" y="234.0" font-size="11" font-weight="bold" fill="#1f2937" text-anchor="start">3</text><text x="538.0" y="234.0" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">Build server slow in the</text><text x="538.0" y="247.0" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">mornings</text><rect x="688.0" y="224.0" width="53.8" height="20.0" rx="10.0" fill="#fef3c7" stroke="#d97706" stroke-width="1.2"/><text x="714.9" y="235.5" font-size="10" font-weight="bold" fill="#78350f" text-anchor="middle">Medium</text><text x="750.0" y="234.0" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">Team builds after noon; infrastructure</text><text x="750.0" y="247.0" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">ticket raised</text><line x1="508.0" y1="262.0" x2="952.0" y2="262.0" stroke="#d1d5db" stroke-width="1.0"/><text x="512.0" y="280.0" font-size="11" font-weight="bold" fill="#1f2937" text-anchor="start">4</text><text x="538.0" y="280.0" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">Unclear naming rules for</text><text x="538.0" y="293.0" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">reports</text><rect x="688.0" y="270.0" width="36.0" height="20.0" rx="10.0" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/><text x="706.0" y="281.5" font-size="10" font-weight="bold" fill="#14532d" text-anchor="middle">Low</text><text x="750.0" y="280.0" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">Agree rules at the next</text><text x="750.0" y="293.0" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">working-agreement review</text><text x="512.0" y="316.0" font-size="10.5" font-weight="normal" fill="#6b7280" text-anchor="start">PMBOK 8 chart content: description, severity, actions being taken</text><rect x="20.0" y="354.0" width="460.0" height="150.0" rx="10" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.6"/><text x="32.0" y="376.0" font-size="12.5" font-weight="bold" fill="#134e4a" text-anchor="start">Rank by (evaluate the impact)</text><text x="32.0" y="396.0" font-size="10.8" font-weight="bold" fill="#6b7280" text-anchor="start">•</text><text x="44.0" y="396.0" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">Effect on the critical path, sprint goal, release or a contract date</text><text x="32.0" y="413.2" font-size="10.8" font-weight="bold" fill="#6b7280" text-anchor="start">•</text><text x="44.0" y="413.2" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">Number of people or teams blocked, and days lost per day of delay</text><text x="32.0" y="430.4" font-size="10.8" font-weight="bold" fill="#6b7280" text-anchor="start">•</text><text x="44.0" y="430.4" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">Downstream dependencies and the risk of knock-on effects</text><text x="32.0" y="447.5" font-size="10.8" font-weight="bold" fill="#6b7280" text-anchor="start">•</text><text x="44.0" y="447.5" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">Compliance, safety or ethical exposure</text><text x="32.0" y="464.7" font-size="10.8" font-weight="bold" fill="#6b7280" text-anchor="start">•</text><text x="44.0" y="464.7" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">Is the cause inside the team's control, or with another group?</text><text x="32.0" y="481.9" font-size="10.8" font-weight="bold" fill="#6b7280" text-anchor="start">•</text><text x="44.0" y="481.9" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">Is the same blocker recurring? A pattern points to a system fix</text><rect x="500.0" y="354.0" width="460.0" height="150.0" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="512.0" y="376.0" font-size="12.5" font-weight="bold" fill="#78350f" text-anchor="start">Highlight so it cannot be ignored</text><text x="512.0" y="396.0" font-size="10.8" font-weight="bold" fill="#6b7280" text-anchor="start">•</text><text x="524.0" y="396.0" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">Flag it on the task board and put it first on the daily meeting agenda</text><text x="512.0" y="413.2" font-size="10.8" font-weight="bold" fill="#6b7280" text-anchor="start">•</text><text x="524.0" y="413.2" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">Show severity, age, owner and the action under way</text><text x="512.0" y="430.4" font-size="10.8" font-weight="bold" fill="#6b7280" text-anchor="start">•</text><text x="524.0" y="430.4" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">Report key issues to the sponsor and governance with the cost of delay</text><text x="512.0" y="447.5" font-size="10.8" font-weight="bold" fill="#6b7280" text-anchor="start">•</text><text x="524.0" y="447.5" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">One owner per item; limit how many items are worked at once</text><text x="512.0" y="464.7" font-size="10.8" font-weight="bold" fill="#6b7280" text-anchor="start">•</text><text x="524.0" y="464.7" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">Tell people when it is cleared, and say what changed</text></svg>