<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 470" width="980" height="470" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">The iteration cycle and roles</title><desc id="d">Product backlog to iteration planning to iteration backlog, daily coordination, working increment that meets the definition of done, iteration review and retrospective, then back to backlog refinement.</desc><defs><marker id="ah0" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker><marker id="ah1" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker></defs><rect x="0.75" y="0.75" width="978.5" height="468.5" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><text x="20.0" y="28.0" font-size="18" font-weight="bold" fill="#1f2937" text-anchor="start">The iteration cycle (sprint) and who does what</text><text x="20.0" y="48.0" font-size="12" font-weight="normal" fill="#6b7280" text-anchor="start">PMBOK 8 terms with the common Scrum names in brackets [Beyond PMBOK 8 for the Scrum names]</text><rect x="20.0" y="80.0" width="124.0" height="46.0" rx="8" fill="#1e3a8a" stroke="#1e3a8a" stroke-width="1.6"/><text x="82.0" y="107.1" font-size="12.5" font-weight="bold" fill="#ffffff" text-anchor="middle">Product backlog</text><rect x="20.0" y="132.0" width="124.0" height="84.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="82.0" y="163.8" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="middle">Ordered by value by</text><text x="82.0" y="177.6" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="middle">the product owner;</text><text x="82.0" y="191.3" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="middle">refined continuously</text><line x1="145.0" y1="103.0" x2="153.0" y2="103.0" stroke="#1f2937" stroke-width="2" marker-end="url(#ah0)"/><rect x="154.0" y="80.0" width="124.0" height="46.0" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="216.0" y="99.5" font-size="11.5" font-weight="bold" fill="#1e3a8a" text-anchor="middle">Iteration planning</text><text x="216.0" y="113.9" font-size="11.5" font-weight="bold" fill="#1e3a8a" text-anchor="middle">[sprint planning]</text><rect x="154.0" y="132.0" width="124.0" height="84.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="216.0" y="156.9" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="middle">Team selects what it</text><text x="216.0" y="170.7" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="middle">can commit to;</text><text x="216.0" y="184.4" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="middle">clarifies acceptance</text><text x="216.0" y="198.2" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="middle">criteria and effort</text><line x1="279.0" y1="103.0" x2="287.0" y2="103.0" stroke="#1f2937" stroke-width="2" marker-end="url(#ah0)"/><rect x="288.0" y="80.0" width="124.0" height="46.0" rx="8" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.6"/><text x="350.0" y="99.5" font-size="11.5" font-weight="bold" fill="#134e4a" text-anchor="middle">Iteration backlog</text><text x="350.0" y="113.9" font-size="11.5" font-weight="bold" fill="#134e4a" text-anchor="middle">[sprint backlog]</text><rect x="288.0" y="132.0" width="124.0" height="84.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="350.0" y="170.7" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="middle">Selected stories and</text><text x="350.0" y="184.4" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="middle">tasks for this timebox</text><line x1="413.0" y1="103.0" x2="421.0" y2="103.0" stroke="#1f2937" stroke-width="2" marker-end="url(#ah0)"/><rect x="422.0" y="80.0" width="124.0" height="46.0" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="484.0" y="99.5" font-size="11.5" font-weight="bold" fill="#14532d" text-anchor="middle">Daily coordination</text><text x="484.0" y="113.9" font-size="11.5" font-weight="bold" fill="#14532d" text-anchor="middle">[daily scrum]</text><rect x="422.0" y="132.0" width="124.0" height="84.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="484.0" y="163.8" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="middle">15 minutes or less:</text><text x="484.0" y="177.6" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="middle">progress, plan,</text><text x="484.0" y="191.3" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="middle">obstacles</text><line x1="547.0" y1="103.0" x2="555.0" y2="103.0" stroke="#1f2937" stroke-width="2" marker-end="url(#ah0)"/><rect x="556.0" y="80.0" width="124.0" height="46.0" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="618.0" y="99.2" font-size="12.5" font-weight="bold" fill="#14532d" text-anchor="middle">Working</text><text x="618.0" y="114.9" font-size="12.5" font-weight="bold" fill="#14532d" text-anchor="middle">increment</text><rect x="556.0" y="132.0" width="124.0" height="84.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="618.0" y="163.8" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="middle">Meets the definition</text><text x="618.0" y="177.6" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="middle">of done; potentially</text><text x="618.0" y="191.3" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="middle">releasable</text><line x1="681.0" y1="103.0" x2="689.0" y2="103.0" stroke="#1f2937" stroke-width="2" marker-end="url(#ah0)"/><rect x="690.0" y="80.0" width="124.0" height="46.0" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="752.0" y="99.5" font-size="11.5" font-weight="bold" fill="#78350f" text-anchor="middle">Iteration review</text><text x="752.0" y="113.9" font-size="11.5" font-weight="bold" fill="#78350f" text-anchor="middle">[sprint review]</text><rect x="690.0" y="132.0" width="124.0" height="84.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="752.0" y="156.9" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="middle">Demo to</text><text x="752.0" y="170.7" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="middle">stakeholders; collect</text><text x="752.0" y="184.4" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="middle">feedback; update</text><text x="752.0" y="198.2" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="middle">backlog</text><line x1="815.0" y1="103.0" x2="823.0" y2="103.0" stroke="#1f2937" stroke-width="2" marker-end="url(#ah0)"/><rect x="824.0" y="80.0" width="124.0" height="46.0" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.6"/><text x="886.0" y="107.1" font-size="12.5" font-weight="bold" fill="#4c1d95" text-anchor="middle">Retrospective</text><rect x="824.0" y="132.0" width="124.0" height="84.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="886.0" y="163.8" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="middle">Team improves its</text><text x="886.0" y="177.6" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="middle">process; actions with</text><text x="886.0" y="191.3" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="middle">owners</text><polyline points="886.0,218.0 886.0,240.0 82.0,240.0 82.0,218.0" fill="none" stroke="#7c3aed" stroke-width="2.2" stroke-dasharray="7 5" marker-end="url(#ah1)" stroke-linejoin="round"/><text x="484.0" y="234.0" font-size="12.5" font-weight="bold" fill="#5b21b6" text-anchor="middle">Next iteration: feedback and lessons feed the refined backlog</text><rect x="20.0" y="270.0" width="226.0" height="140.0" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="32.0" y="294.0" font-size="13" font-weight="bold" fill="#78350f" text-anchor="start">Product owner</text><text x="32.0" y="314.0" font-size="11.8" font-weight="normal" fill="#1f2937" text-anchor="start">Maximizes product value; owns and</text><text x="32.0" y="329.1" font-size="11.8" font-weight="normal" fill="#1f2937" text-anchor="start">orders the backlog; voice of the</text><text x="32.0" y="344.2" font-size="11.8" font-weight="normal" fill="#1f2937" text-anchor="start">customer; accepts work</text><rect x="258.0" y="270.0" width="226.0" height="140.0" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="270.0" y="294.0" font-size="13" font-weight="bold" fill="#1e3a8a" text-anchor="start">Scrum master / agile coach / PM</text><text x="270.0" y="314.0" font-size="11.8" font-weight="normal" fill="#1f2937" text-anchor="start">Servant leader: facilitates events,</text><text x="270.0" y="329.1" font-size="11.8" font-weight="normal" fill="#1f2937" text-anchor="start">removes impediments, coaches the</text><text x="270.0" y="344.2" font-size="11.8" font-weight="normal" fill="#1f2937" text-anchor="start">team and organization, shields the</text><text x="270.0" y="359.3" font-size="11.8" font-weight="normal" fill="#1f2937" text-anchor="start">team</text><rect x="496.0" y="270.0" width="226.0" height="140.0" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="508.0" y="294.0" font-size="13" font-weight="bold" fill="#14532d" text-anchor="start">Team</text><text x="508.0" y="314.0" font-size="11.8" font-weight="normal" fill="#1f2937" text-anchor="start">Cross-functional, self-organizing,</text><text x="508.0" y="329.1" font-size="11.8" font-weight="normal" fill="#1f2937" text-anchor="start">ideally dedicated; commits to and</text><text x="508.0" y="344.2" font-size="11.8" font-weight="normal" fill="#1f2937" text-anchor="start">delivers the increment (often 3 to 9</text><text x="508.0" y="359.3" font-size="11.8" font-weight="normal" fill="#1f2937" text-anchor="start">people)</text><rect x="734.0" y="270.0" width="226.0" height="140.0" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.6"/><text x="746.0" y="294.0" font-size="13" font-weight="bold" fill="#374151" text-anchor="start">Stakeholders and sponsor</text><text x="746.0" y="314.0" font-size="11.8" font-weight="normal" fill="#1f2937" text-anchor="start">Give feedback at reviews; provide</text><text x="746.0" y="329.1" font-size="11.8" font-weight="normal" fill="#1f2937" text-anchor="start">resources and decisions; engage</text><text x="746.0" y="344.2" font-size="11.8" font-weight="normal" fill="#1f2937" text-anchor="start">through the product owner</text><text x="490.0" y="456.0" font-size="11.5" font-weight="normal" fill="#6b7280" text-anchor="middle" font-style="italic">Scope changes go through the backlog; the team's commitment inside an iteration is protected.</text></svg>