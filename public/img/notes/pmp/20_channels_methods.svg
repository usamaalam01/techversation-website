<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 540" width="980" height="540" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">Communication channels and methods</title><desc id="d">Number of potential communication channels grows as n times n minus one over two: 3 people have 3 channels, 4 have 6, 5 have 10, 6 have 15, 10 have 45, 20 have 190. Interactive, push and pull methods with examples.</desc><defs></defs><rect x="0.75" y="0.75" width="978.5" height="538.5" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><text x="20.0" y="28.0" font-size="18" font-weight="bold" fill="#1f2937" text-anchor="start">Channels, forms and methods</text><text x="20.0" y="48.0" font-size="12" font-weight="normal" fill="#6b7280" text-anchor="start">More people mean many more channels; pick the method for the message and audience</text><line x1="80.0" y1="104.0" x2="111.2" y2="158.0" stroke="#6b7280" stroke-width="1.2"/><line x1="80.0" y1="104.0" x2="48.8" y2="158.0" stroke="#6b7280" stroke-width="1.2"/><line x1="111.2" y1="158.0" x2="48.8" y2="158.0" stroke="#6b7280" stroke-width="1.2"/><circle cx="80.0" cy="104.0" r="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><circle cx="111.2" cy="158.0" r="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><circle cx="48.8" cy="158.0" r="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="80.0" y="200.0" font-size="11.5" font-weight="bold" fill="#1e3a8a" text-anchor="middle">3 people</text><text x="80.0" y="216.0" font-size="11.5" font-weight="bold" fill="#dc2626" text-anchor="middle">3 channels</text><line x1="192.0" y1="104.0" x2="228.0" y2="140.0" stroke="#6b7280" stroke-width="1.2"/><line x1="192.0" y1="104.0" x2="192.0" y2="176.0" stroke="#6b7280" stroke-width="1.2"/><line x1="192.0" y1="104.0" x2="156.0" y2="140.0" stroke="#6b7280" stroke-width="1.2"/><line x1="228.0" y1="140.0" x2="192.0" y2="176.0" stroke="#6b7280" stroke-width="1.2"/><line x1="228.0" y1="140.0" x2="156.0" y2="140.0" stroke="#6b7280" stroke-width="1.2"/><line x1="192.0" y1="176.0" x2="156.0" y2="140.0" stroke="#6b7280" stroke-width="1.2"/><circle cx="192.0" cy="104.0" r="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><circle cx="228.0" cy="140.0" r="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><circle cx="192.0" cy="176.0" r="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><circle cx="156.0" cy="140.0" r="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="192.0" y="200.0" font-size="11.5" font-weight="bold" fill="#1e3a8a" text-anchor="middle">4 people</text><text x="192.0" y="216.0" font-size="11.5" font-weight="bold" fill="#dc2626" text-anchor="middle">6 channels</text><line x1="304.0" y1="104.0" x2="338.2" y2="128.9" stroke="#6b7280" stroke-width="1.2"/><line x1="304.0" y1="104.0" x2="325.2" y2="169.1" stroke="#6b7280" stroke-width="1.2"/><line x1="304.0" y1="104.0" x2="282.8" y2="169.1" stroke="#6b7280" stroke-width="1.2"/><line x1="304.0" y1="104.0" x2="269.8" y2="128.9" stroke="#6b7280" stroke-width="1.2"/><line x1="338.2" y1="128.9" x2="325.2" y2="169.1" stroke="#6b7280" stroke-width="1.2"/><line x1="338.2" y1="128.9" x2="282.8" y2="169.1" stroke="#6b7280" stroke-width="1.2"/><line x1="338.2" y1="128.9" x2="269.8" y2="128.9" stroke="#6b7280" stroke-width="1.2"/><line x1="325.2" y1="169.1" x2="282.8" y2="169.1" stroke="#6b7280" stroke-width="1.2"/><line x1="325.2" y1="169.1" x2="269.8" y2="128.9" stroke="#6b7280" stroke-width="1.2"/><line x1="282.8" y1="169.1" x2="269.8" y2="128.9" stroke="#6b7280" stroke-width="1.2"/><circle cx="304.0" cy="104.0" r="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><circle cx="338.2" cy="128.9" r="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><circle cx="325.2" cy="169.1" r="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><circle cx="282.8" cy="169.1" r="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><circle cx="269.8" cy="128.9" r="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="304.0" y="200.0" font-size="11.5" font-weight="bold" fill="#1e3a8a" text-anchor="middle">5 people</text><text x="304.0" y="216.0" font-size="11.5" font-weight="bold" fill="#dc2626" text-anchor="middle">10 channels</text><line x1="416.0" y1="104.0" x2="447.2" y2="122.0" stroke="#6b7280" stroke-width="1.2"/><line x1="416.0" y1="104.0" x2="447.2" y2="158.0" stroke="#6b7280" stroke-width="1.2"/><line x1="416.0" y1="104.0" x2="416.0" y2="176.0" stroke="#6b7280" stroke-width="1.2"/><line x1="416.0" y1="104.0" x2="384.8" y2="158.0" stroke="#6b7280" stroke-width="1.2"/><line x1="416.0" y1="104.0" x2="384.8" y2="122.0" stroke="#6b7280" stroke-width="1.2"/><line x1="447.2" y1="122.0" x2="447.2" y2="158.0" stroke="#6b7280" stroke-width="1.2"/><line x1="447.2" y1="122.0" x2="416.0" y2="176.0" stroke="#6b7280" stroke-width="1.2"/><line x1="447.2" y1="122.0" x2="384.8" y2="158.0" stroke="#6b7280" stroke-width="1.2"/><line x1="447.2" y1="122.0" x2="384.8" y2="122.0" stroke="#6b7280" stroke-width="1.2"/><line x1="447.2" y1="158.0" x2="416.0" y2="176.0" stroke="#6b7280" stroke-width="1.2"/><line x1="447.2" y1="158.0" x2="384.8" y2="158.0" stroke="#6b7280" stroke-width="1.2"/><line x1="447.2" y1="158.0" x2="384.8" y2="122.0" stroke="#6b7280" stroke-width="1.2"/><line x1="416.0" y1="176.0" x2="384.8" y2="158.0" stroke="#6b7280" stroke-width="1.2"/><line x1="416.0" y1="176.0" x2="384.8" y2="122.0" stroke="#6b7280" stroke-width="1.2"/><line x1="384.8" y1="158.0" x2="384.8" y2="122.0" stroke="#6b7280" stroke-width="1.2"/><circle cx="416.0" cy="104.0" r="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><circle cx="447.2" cy="122.0" r="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><circle cx="447.2" cy="158.0" r="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><circle cx="416.0" cy="176.0" r="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><circle cx="384.8" cy="158.0" r="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><circle cx="384.8" cy="122.0" r="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="416.0" y="200.0" font-size="11.5" font-weight="bold" fill="#1e3a8a" text-anchor="middle">6 people</text><text x="416.0" y="216.0" font-size="11.5" font-weight="bold" fill="#dc2626" text-anchor="middle">15 channels</text><rect x="20.0" y="238.0" width="450.0" height="76.0" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/><text x="32.0" y="260.0" font-size="13" font-weight="bold" fill="#78350f" text-anchor="start">channels = n × (n − 1) ÷ 2   [Beyond PMBOK 8 formula]</text><text x="32.0" y="280.0" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="start">PMBOK 8 asks you to consider the number of potential channels (one-to-one,</text><text x="32.0" y="293.4" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="start">one-to-many, many-to-many) in communication requirements analysis. The exam</text><text x="32.0" y="306.8" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="start">usually uses the formula.</text><rect x="20.0" y="330.0" width="450.0" height="28.0" rx="0" fill="#1e3a8a" stroke="#1e3a8a" stroke-width="1.2"/><text x="75.0" y="349.0" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">People</text><text x="172.5" y="349.0" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">10</text><text x="257.5" y="349.0" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">12</text><text x="342.5" y="349.0" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">15</text><text x="427.5" y="349.0" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">20</text><rect x="20.0" y="358.0" width="450.0" height="28.0" rx="0" fill="#ffffff" stroke="#d1d5db" stroke-width="1.2"/><text x="75.0" y="377.0" font-size="12" font-weight="bold" fill="#1f2937" text-anchor="middle">Channels</text><text x="172.5" y="377.0" font-size="12" font-weight="bold" fill="#1f2937" text-anchor="middle">45</text><text x="257.5" y="377.0" font-size="12" font-weight="bold" fill="#1f2937" text-anchor="middle">66</text><text x="342.5" y="377.0" font-size="12" font-weight="bold" fill="#1f2937" text-anchor="middle">105</text><text x="427.5" y="377.0" font-size="12" font-weight="bold" fill="#1f2937" text-anchor="middle">190</text><text x="20.0" y="408.0" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="start">Example: adding 2 people to a team of 10 raises the channels from 45 to 66 (21 more).</text><text x="20.0" y="421.4" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="start">Plan structure, tools and meeting formats for growth.</text><text x="500.0" y="84.0" font-size="13" font-weight="bold" fill="#1f2937" text-anchor="start">Communication methods (PMBOK 8)</text><rect x="500.0" y="96.0" width="460.0" height="73.4" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/><text x="512.0" y="117.0" font-size="12.5" font-weight="bold" fill="#14532d" text-anchor="start">Interactive</text><text x="512.0" y="133.0" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="start">Real-time, multidirectional exchange between two or more parties: meetings, phone</text><text x="512.0" y="146.8" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="start">calls, instant messaging, videoconferencing. Best for complex, sensitive or disputed</text><text x="512.0" y="160.5" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="start">content and for confirming understanding.</text><rect x="500.0" y="179.4" width="460.0" height="59.6" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><text x="512.0" y="200.4" font-size="12.5" font-weight="bold" fill="#1e3a8a" text-anchor="start">Push</text><text x="512.0" y="216.4" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="start">Sent to specific recipients: letters, memos, reports, email, voicemail, press releases.</text><text x="512.0" y="230.2" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="start">Ensures distribution but not that it is read or understood.</text><rect x="500.0" y="249.0" width="460.0" height="73.4" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/><text x="512.0" y="270.0" font-size="12.5" font-weight="bold" fill="#4c1d95" text-anchor="start">Pull</text><text x="512.0" y="286.0" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="start">Recipients access content when they choose: web portals, intranets, e-learning,</text><text x="512.0" y="299.8" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="start">lessons learned databases, knowledge repositories. Good for large, complex</text><text x="512.0" y="313.5" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="start">information or large audiences, subject to security.</text><rect x="500.0" y="332.4" width="460.0" height="189.6" rx="8" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.2"/><text x="512.0" y="352.4" font-size="12" font-weight="bold" fill="#1f2937" text-anchor="start">Forms of communication</text><text x="512.0" y="370.4" font-size="11" font-weight="bold" fill="#6b7280" text-anchor="start">•</text><text x="524.0" y="370.4" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="start">Interpersonal: between individuals, usually face to face</text><text x="512.0" y="386.6" font-size="11" font-weight="bold" fill="#6b7280" text-anchor="start">•</text><text x="524.0" y="386.6" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="start">Small group: three to six people</text><text x="512.0" y="402.8" font-size="11" font-weight="bold" fill="#6b7280" text-anchor="start">•</text><text x="524.0" y="402.8" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="start">Public: one speaker or group to a larger audience</text><text x="512.0" y="419.0" font-size="11" font-weight="bold" fill="#6b7280" text-anchor="start">•</text><text x="524.0" y="419.0" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="start">Mass: minimal connection between sender and large, sometimes anonymous</text><text x="524.0" y="432.2" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="start">audiences</text><text x="512.0" y="448.4" font-size="11" font-weight="bold" fill="#6b7280" text-anchor="start">•</text><text x="524.0" y="448.4" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="start">Networks and social computing: many-to-many</text></svg>