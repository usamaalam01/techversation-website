<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 520" width="940" height="520" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">Budget buildup and reserves</title><desc id="d">Two scenarios from PMBOK 8 Figure 2-25: reserves managed implicitly and reserves managed explicitly. Contingency reserve covers known-unknowns; management reserve covers unknown-unknowns and is never part of the cost baseline.</desc><defs><marker id="ah0" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1e3a8a"/></marker></defs><rect x="0.75" y="0.75" width="938.5" height="518.5" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><text x="20.0" y="28.0" font-size="18" font-weight="bold" fill="#1f2937" text-anchor="start">Budget buildup: where the reserves sit</text><text x="20.0" y="48.0" font-size="12" font-weight="normal" fill="#6b7280" text-anchor="start">After PMBOK 8 Figure 2-25 (two possible scenarios; organizations differ)</text><text x="184.0" y="82.0" font-size="14.5" font-weight="bold" fill="#1f2937" text-anchor="middle">Reserves managed implicitly</text><rect x="34.0" y="230.0" width="92.0" height="130.0" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="80.0" y="291.0" font-size="12.5" font-weight="bold" fill="#1e3a8a" text-anchor="middle">Work cost</text><text x="80.0" y="306.6" font-size="12.5" font-weight="bold" fill="#1e3a8a" text-anchor="middle">estimates</text><rect x="138.0" y="190.0" width="92.0" height="170.0" rx="6" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.6"/><text x="184.0" y="291.0" font-size="12.5" font-weight="bold" fill="#4c1d95" text-anchor="middle">Cost</text><text x="184.0" y="306.6" font-size="12.5" font-weight="bold" fill="#4c1d95" text-anchor="middle">baseline</text><rect x="144.0" y="196.0" width="80.0" height="28.0" rx="5" fill="#ffffff" stroke="#7c3aed" stroke-width="1.4" stroke-dasharray="4 3"/><text x="184.0" y="208.0" font-size="10.5" font-weight="bold" fill="#4c1d95" text-anchor="middle">Contingency</text><rect x="242.0" y="150.0" width="92.0" height="210.0" rx="6" fill="#fce7f3" stroke="#db2777" stroke-width="1.6"/><text x="288.0" y="291.0" font-size="12.5" font-weight="bold" fill="#831843" text-anchor="middle">Initial</text><text x="288.0" y="306.6" font-size="12.5" font-weight="bold" fill="#831843" text-anchor="middle">budget</text><rect x="248.0" y="156.0" width="80.0" height="28.0" rx="5" fill="#ffffff" stroke="#db2777" stroke-width="1.4" stroke-dasharray="4 3"/><text x="288.0" y="168.0" font-size="10.5" font-weight="bold" fill="#831843" text-anchor="middle">Mgmt reserve</text><text x="644.0" y="82.0" font-size="14.5" font-weight="bold" fill="#1f2937" text-anchor="middle">Reserves managed explicitly</text><rect x="494.0" y="230.0" width="92.0" height="130.0" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="540.0" y="291.0" font-size="12.5" font-weight="bold" fill="#1e3a8a" text-anchor="middle">Work cost</text><text x="540.0" y="306.6" font-size="12.5" font-weight="bold" fill="#1e3a8a" text-anchor="middle">estimates</text><rect x="598.0" y="230.0" width="92.0" height="130.0" rx="6" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.6"/><text x="644.0" y="291.0" font-size="12.5" font-weight="bold" fill="#4c1d95" text-anchor="middle">Cost</text><text x="644.0" y="306.6" font-size="12.5" font-weight="bold" fill="#4c1d95" text-anchor="middle">baseline</text><rect x="604.0" y="192.0" width="80.0" height="32.0" rx="5" fill="#ffffff" stroke="#7c3aed" stroke-width="1.4" stroke-dasharray="4 3"/><text x="644.0" y="206.0" font-size="10.5" font-weight="bold" fill="#4c1d95" text-anchor="middle">Contingency</text><rect x="702.0" y="190.0" width="92.0" height="170.0" rx="6" fill="#fce7f3" stroke="#db2777" stroke-width="1.6"/><text x="748.0" y="291.0" font-size="12.5" font-weight="bold" fill="#831843" text-anchor="middle">Initial</text><text x="748.0" y="306.6" font-size="12.5" font-weight="bold" fill="#831843" text-anchor="middle">budget</text><rect x="708.0" y="152.0" width="80.0" height="32.0" rx="5" fill="#ffffff" stroke="#db2777" stroke-width="1.4" stroke-dasharray="4 3"/><text x="748.0" y="166.0" font-size="10.5" font-weight="bold" fill="#831843" text-anchor="middle">Mgmt reserve</text><line x1="450.0" y1="360.0" x2="450.0" y2="130.0" stroke="#1e3a8a" stroke-width="2" marker-end="url(#ah0)"/><text x="436.0" y="250.0" transform="rotate(-90 436 250)" font-size="11.5" font-weight="bold" fill="#1e3a8a" text-anchor="middle">Total amount</text><rect x="24.0" y="392.0" width="892.0" height="112.0" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.6"/><text x="38.0" y="414.4" font-size="12" font-weight="bold" fill="#374151" text-anchor="start">Read it like this</text><text x="38.0" y="429.4" font-size="12" font-weight="normal" fill="#374151" text-anchor="start">Cost baseline: the approved time-phased budget used to measure performance. It never contains management reserve.</text><text x="38.0" y="444.4" font-size="12" font-weight="normal" fill="#374151" text-anchor="start">Contingency reserve: time or money for identified (known) risks that have active responses. Usually sits in the initial budget, inside or just outside the baseline</text><text x="38.0" y="459.4" font-size="12" font-weight="normal" fill="#374151" text-anchor="start">depending on the organization.</text><text x="38.0" y="474.4" font-size="12" font-weight="normal" fill="#374151" text-anchor="start">Management reserve: set aside by management for unforeseen in-scope work (unknown-unknowns). Released at senior management's discretion; in some</text><text x="38.0" y="489.4" font-size="12" font-weight="normal" fill="#374151" text-anchor="start">organizations by the project manager.</text></svg>