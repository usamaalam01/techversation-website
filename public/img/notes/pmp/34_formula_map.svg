<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 540" width="980" height="540" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">Formula map for the PMP exam</title><desc id="d">Eight families of calculations: schedule (forward and backward pass, float, three-point estimates), cost and earned value (variances, indices, estimate at completion, to-complete index), risk (expected monetary value, decision trees), team and communication (channels, duration from effort, capacity), value and finance (NPV, IRR, payback, ROI, benefit-cost ratio), procurement (make or buy, target-cost sharing, point of total assumption), quality and statistics (sigma bands, control limits, process capability) and agile flow (velocity, cycle time, lead time, Little's law).</desc><defs></defs><rect x="0.75" y="0.75" width="978.5" height="538.5" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><text x="20.0" y="28.0" font-size="18" font-weight="bold" fill="#1f2937" text-anchor="start">Formula map</text><text x="20.0" y="48.0" font-size="12" font-weight="normal" fill="#6b7280" text-anchor="start">Know what each family answers; the worked examples in this topic show how to use them</text><rect x="22.0" y="62.0" width="224.0" height="184.0" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="34.0" y="84.0" font-size="12.5" font-weight="bold" fill="#1e3a8a" text-anchor="start">Schedule</text><text x="34.0" y="104.0" font-size="10.4" font-weight="bold" fill="#6b7280" text-anchor="start">•</text><text x="46.0" y="104.0" font-size="10.4" font-weight="normal" fill="#1f2937" text-anchor="start">EF = ES + D − 1; LS = LF − D + 1</text><text x="34.0" y="121.5" font-size="10.4" font-weight="bold" fill="#6b7280" text-anchor="start">•</text><text x="46.0" y="121.5" font-size="10.4" font-weight="normal" fill="#1f2937" text-anchor="start">Total float = LS − ES = LF − EF</text><text x="34.0" y="139.0" font-size="10.4" font-weight="bold" fill="#6b7280" text-anchor="start">•</text><text x="46.0" y="139.0" font-size="10.4" font-weight="normal" fill="#1f2937" text-anchor="start">Free float = ES(next) − EF − 1</text><text x="34.0" y="156.4" font-size="10.4" font-weight="bold" fill="#6b7280" text-anchor="start">•</text><text x="46.0" y="156.4" font-size="10.4" font-weight="normal" fill="#1f2937" text-anchor="start">Triangular = (O + M + P) ÷ 3</text><text x="34.0" y="173.9" font-size="10.4" font-weight="bold" fill="#6b7280" text-anchor="start">•</text><text x="46.0" y="173.9" font-size="10.4" font-weight="normal" fill="#1f2937" text-anchor="start">PERT = (O + 4M + P) ÷ 6; SD = (P − O)</text><text x="46.0" y="186.4" font-size="10.4" font-weight="normal" fill="#1f2937" text-anchor="start">÷ 6 [Beyond]</text><rect x="260.7" y="62.0" width="224.0" height="184.0" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="272.7" y="84.0" font-size="12.5" font-weight="bold" fill="#14532d" text-anchor="start">Cost and earned value</text><text x="272.7" y="104.0" font-size="10.4" font-weight="bold" fill="#6b7280" text-anchor="start">•</text><text x="284.7" y="104.0" font-size="10.4" font-weight="normal" fill="#1f2937" text-anchor="start">CV = EV − AC; SV = EV − PV</text><text x="272.7" y="121.5" font-size="10.4" font-weight="bold" fill="#6b7280" text-anchor="start">•</text><text x="284.7" y="121.5" font-size="10.4" font-weight="normal" fill="#1f2937" text-anchor="start">CPI = EV ÷ AC; SPI = EV ÷ PV</text><text x="272.7" y="139.0" font-size="10.4" font-weight="bold" fill="#6b7280" text-anchor="start">•</text><text x="284.7" y="139.0" font-size="10.4" font-weight="normal" fill="#1f2937" text-anchor="start">EAC = BAC ÷ CPI (typical)</text><text x="272.7" y="156.4" font-size="10.4" font-weight="bold" fill="#6b7280" text-anchor="start">•</text><text x="284.7" y="156.4" font-size="10.4" font-weight="normal" fill="#1f2937" text-anchor="start">EAC = AC + (BAC − EV) (one-off)</text><text x="272.7" y="173.9" font-size="10.4" font-weight="bold" fill="#6b7280" text-anchor="start">•</text><text x="284.7" y="173.9" font-size="10.4" font-weight="normal" fill="#1f2937" text-anchor="start">ETC = EAC − AC; VAC = BAC − EAC</text><text x="272.7" y="191.4" font-size="10.4" font-weight="bold" fill="#6b7280" text-anchor="start">•</text><text x="284.7" y="191.4" font-size="10.4" font-weight="normal" fill="#1f2937" text-anchor="start">TCPI = (BAC − EV) ÷ (BAC − AC)</text><rect x="499.3" y="62.0" width="224.0" height="184.0" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="1.6"/><text x="511.3" y="84.0" font-size="12.5" font-weight="bold" fill="#7f1d1d" text-anchor="start">Risk</text><text x="511.3" y="104.0" font-size="10.4" font-weight="bold" fill="#6b7280" text-anchor="start">•</text><text x="523.3" y="104.0" font-size="10.4" font-weight="normal" fill="#1f2937" text-anchor="start">Score = probability × impact</text><text x="511.3" y="121.5" font-size="10.4" font-weight="bold" fill="#6b7280" text-anchor="start">•</text><text x="523.3" y="121.5" font-size="10.4" font-weight="normal" fill="#1f2937" text-anchor="start">EMV = probability × impact value</text><text x="511.3" y="139.0" font-size="10.4" font-weight="bold" fill="#6b7280" text-anchor="start">•</text><text x="523.3" y="139.0" font-size="10.4" font-weight="normal" fill="#1f2937" text-anchor="start">Decision EMV = sum of branch EMVs −</text><text x="523.3" y="151.4" font-size="10.4" font-weight="normal" fill="#1f2937" text-anchor="start">cost</text><text x="511.3" y="168.9" font-size="10.4" font-weight="bold" fill="#6b7280" text-anchor="start">•</text><text x="523.3" y="168.9" font-size="10.4" font-weight="normal" fill="#1f2937" text-anchor="start">Contingency ≈ sum of threat EMVs</text><text x="523.3" y="181.4" font-size="10.4" font-weight="normal" fill="#1f2937" text-anchor="start">[Beyond]</text><text x="511.3" y="198.9" font-size="10.4" font-weight="bold" fill="#6b7280" text-anchor="start">•</text><text x="523.3" y="198.9" font-size="10.4" font-weight="normal" fill="#1f2937" text-anchor="start">Respond only if cost &lt; exposure</text><text x="523.3" y="211.4" font-size="10.4" font-weight="normal" fill="#1f2937" text-anchor="start">reduced</text><rect x="738.0" y="62.0" width="224.0" height="184.0" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.6"/><text x="750.0" y="84.0" font-size="12.5" font-weight="bold" fill="#4c1d95" text-anchor="start">Team and communication</text><text x="750.0" y="104.0" font-size="10.4" font-weight="bold" fill="#6b7280" text-anchor="start">•</text><text x="762.0" y="104.0" font-size="10.4" font-weight="normal" fill="#1f2937" text-anchor="start">Channels = n(n − 1) ÷ 2 [Beyond]</text><text x="750.0" y="121.5" font-size="10.4" font-weight="bold" fill="#6b7280" text-anchor="start">•</text><text x="762.0" y="121.5" font-size="10.4" font-weight="normal" fill="#1f2937" text-anchor="start">Duration = effort ÷ (people × availability)</text><text x="750.0" y="139.0" font-size="10.4" font-weight="bold" fill="#6b7280" text-anchor="start">•</text><text x="762.0" y="139.0" font-size="10.4" font-weight="normal" fill="#1f2937" text-anchor="start">Capacity = people × days × focus factor</text><text x="762.0" y="151.4" font-size="10.4" font-weight="normal" fill="#1f2937" text-anchor="start">[Beyond]</text><text x="750.0" y="168.9" font-size="10.4" font-weight="bold" fill="#6b7280" text-anchor="start">•</text><text x="762.0" y="168.9" font-size="10.4" font-weight="normal" fill="#1f2937" text-anchor="start">Utilization = productive hours ÷ available</text><text x="762.0" y="181.4" font-size="10.4" font-weight="normal" fill="#1f2937" text-anchor="start">hours [Beyond]</text><rect x="22.0" y="258.0" width="224.0" height="184.0" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="34.0" y="280.0" font-size="12.5" font-weight="bold" fill="#78350f" text-anchor="start">Value and finance</text><text x="34.0" y="300.0" font-size="10.4" font-weight="bold" fill="#6b7280" text-anchor="start">•</text><text x="46.0" y="300.0" font-size="10.4" font-weight="normal" fill="#1f2937" text-anchor="start">NPV = sum of CFt ÷ (1 + r)^t −</text><text x="46.0" y="312.5" font-size="10.4" font-weight="normal" fill="#1f2937" text-anchor="start">investment</text><text x="34.0" y="330.0" font-size="10.4" font-weight="bold" fill="#6b7280" text-anchor="start">•</text><text x="46.0" y="330.0" font-size="10.4" font-weight="normal" fill="#1f2937" text-anchor="start">IRR: the rate where NPV = 0</text><text x="34.0" y="347.4" font-size="10.4" font-weight="bold" fill="#6b7280" text-anchor="start">•</text><text x="46.0" y="347.4" font-size="10.4" font-weight="normal" fill="#1f2937" text-anchor="start">Payback = investment ÷ net inflow</text><text x="34.0" y="364.9" font-size="10.4" font-weight="bold" fill="#6b7280" text-anchor="start">•</text><text x="46.0" y="364.9" font-size="10.4" font-weight="normal" fill="#1f2937" text-anchor="start">ROI = net benefit ÷ cost</text><text x="34.0" y="382.4" font-size="10.4" font-weight="bold" fill="#6b7280" text-anchor="start">•</text><text x="46.0" y="382.4" font-size="10.4" font-weight="normal" fill="#1f2937" text-anchor="start">BCR = PV benefits ÷ PV costs</text><rect x="260.7" y="258.0" width="224.0" height="184.0" rx="10" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.6"/><text x="272.7" y="280.0" font-size="12.5" font-weight="bold" fill="#134e4a" text-anchor="start">Procurement</text><text x="272.7" y="300.0" font-size="10.4" font-weight="bold" fill="#6b7280" text-anchor="start">•</text><text x="284.7" y="300.0" font-size="10.4" font-weight="normal" fill="#1f2937" text-anchor="start">Make = fixed + variable × units; Buy =</text><text x="284.7" y="312.5" font-size="10.4" font-weight="normal" fill="#1f2937" text-anchor="start">price × units</text><text x="272.7" y="330.0" font-size="10.4" font-weight="bold" fill="#6b7280" text-anchor="start">•</text><text x="284.7" y="330.0" font-size="10.4" font-weight="normal" fill="#1f2937" text-anchor="start">Break-even = fixed ÷ (buy − variable)</text><text x="272.7" y="347.4" font-size="10.4" font-weight="bold" fill="#6b7280" text-anchor="start">•</text><text x="284.7" y="347.4" font-size="10.4" font-weight="normal" fill="#1f2937" text-anchor="start">Fee = target fee + share × (target −</text><text x="284.7" y="359.9" font-size="10.4" font-weight="normal" fill="#1f2937" text-anchor="start">actual cost) [Beyond]</text><text x="272.7" y="377.4" font-size="10.4" font-weight="bold" fill="#6b7280" text-anchor="start">•</text><text x="284.7" y="377.4" font-size="10.4" font-weight="normal" fill="#1f2937" text-anchor="start">PTA = (ceiling − target price) ÷ buyer</text><text x="284.7" y="389.9" font-size="10.4" font-weight="normal" fill="#1f2937" text-anchor="start">share + target cost [Beyond]</text><rect x="499.3" y="258.0" width="224.0" height="184.0" rx="10" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.6"/><text x="511.3" y="280.0" font-size="12.5" font-weight="bold" fill="#374151" text-anchor="start">Quality and statistics</text><text x="511.3" y="300.0" font-size="10.4" font-weight="bold" fill="#6b7280" text-anchor="start">•</text><text x="523.3" y="300.0" font-size="10.4" font-weight="normal" fill="#1f2937" text-anchor="start">±1σ 68.27%, ±2σ 95.45%, ±3σ 99.73%</text><text x="511.3" y="317.5" font-size="10.4" font-weight="bold" fill="#6b7280" text-anchor="start">•</text><text x="523.3" y="317.5" font-size="10.4" font-weight="normal" fill="#1f2937" text-anchor="start">Control limits = mean ± 3σ</text><text x="511.3" y="335.0" font-size="10.4" font-weight="bold" fill="#6b7280" text-anchor="start">•</text><text x="523.3" y="335.0" font-size="10.4" font-weight="normal" fill="#1f2937" text-anchor="start">Cp = (USL − LSL) ÷ 6σ [Beyond]</text><text x="511.3" y="352.4" font-size="10.4" font-weight="bold" fill="#6b7280" text-anchor="start">•</text><text x="523.3" y="352.4" font-size="10.4" font-weight="normal" fill="#1f2937" text-anchor="start">Cost of quality = conformance +</text><text x="523.3" y="364.9" font-size="10.4" font-weight="normal" fill="#1f2937" text-anchor="start">nonconformance</text><text x="511.3" y="382.4" font-size="10.4" font-weight="bold" fill="#6b7280" text-anchor="start">•</text><text x="523.3" y="382.4" font-size="10.4" font-weight="normal" fill="#1f2937" text-anchor="start">Six Sigma = 3.4 defects per million</text><rect x="738.0" y="258.0" width="224.0" height="184.0" rx="10" fill="#1e3a8a" stroke="#1e3a8a" stroke-width="1.6"/><text x="750.0" y="280.0" font-size="12.5" font-weight="bold" fill="#ffffff" text-anchor="start">Agile and flow</text><text x="750.0" y="300.0" font-size="10.4" font-weight="bold" fill="#6b7280" text-anchor="start">•</text><text x="762.0" y="300.0" font-size="10.4" font-weight="normal" fill="#ffffff" text-anchor="start">Velocity = points accepted per iteration</text><text x="750.0" y="317.5" font-size="10.4" font-weight="bold" fill="#6b7280" text-anchor="start">•</text><text x="762.0" y="317.5" font-size="10.4" font-weight="normal" fill="#ffffff" text-anchor="start">Iterations left = remaining ÷ average</text><text x="762.0" y="330.0" font-size="10.4" font-weight="normal" fill="#ffffff" text-anchor="start">velocity</text><text x="750.0" y="347.4" font-size="10.4" font-weight="bold" fill="#6b7280" text-anchor="start">•</text><text x="762.0" y="347.4" font-size="10.4" font-weight="normal" fill="#ffffff" text-anchor="start">Cycle time: start to done; lead time:</text><text x="762.0" y="359.9" font-size="10.4" font-weight="normal" fill="#ffffff" text-anchor="start">request to delivery</text><text x="750.0" y="377.4" font-size="10.4" font-weight="bold" fill="#6b7280" text-anchor="start">•</text><text x="762.0" y="377.4" font-size="10.4" font-weight="normal" fill="#ffffff" text-anchor="start">Little's law: cycle time = WIP ÷</text><text x="762.0" y="389.9" font-size="10.4" font-weight="normal" fill="#ffffff" text-anchor="start">throughput [Beyond]</text><text x="750.0" y="407.4" font-size="10.4" font-weight="bold" fill="#6b7280" text-anchor="start">•</text><text x="762.0" y="407.4" font-size="10.4" font-weight="normal" fill="#ffffff" text-anchor="start">NPS = % promoters − % detractors</text><text x="762.0" y="419.8" font-size="10.4" font-weight="normal" fill="#ffffff" text-anchor="start">[Beyond]</text><rect x="22.0" y="458.0" width="936.0" height="50.8" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/><text x="34.0" y="478.0" font-size="11" font-weight="bold" fill="#78350f" text-anchor="start">PMBOK 8 prints the schedule, earned value, TCPI and triangular formulas and shows an EMV decision tree. It names ROI, IRR, NPV and payback without formulas, so those</text><text x="34.0" y="491.4" font-size="11" font-weight="bold" fill="#78350f" text-anchor="start">and the items marked [Beyond] are exam practice.</text></svg>