fill="#1f2937" text-anchor="middle">3</text><text x="265.0" y="151.0" font-size="12" font-weight="bold" fill="#1f2937" text-anchor="middle">4</text><text x="308.3" y="98.0" font-size="12" font-weight="normal" fill="#1f2937" text-anchor="middle">5</text><text x="308.3" y="151.0" font-size="12" font-weight="normal" fill="#1f2937" text-anchor="middle">9</text><text x="265.0" y="124.5" font-size="13" font-weight="bold" fill="#1f2937" text-anchor="middle">B</text><rect x="380.0" y="82.0" width="130.0" height="76.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><line x1="380.0" y1="104.0" x2="510.0" y2="104.0" stroke="#6b7280" stroke-width="1"/><line x1="380.0" y1="136.0" x2="510.0" y2="136.0" stroke="#6b7280" stroke-width="1"/><line x1="423.3" y1="82.0" x2="423.3" y2="104.0" stroke="#6b7280" stroke-width="1"/><line x1="423.3" y1="136.0" x2="423.3" y2="158.0" stroke="#6b7280" stroke-width="1"/><line x1="466.7" y1="82.0" x2="466.7" y2="104.0" stroke="#6b7280" stroke-width="1"/><line x1="466.7" y1="136.0" x2="466.7" y2="158.0" stroke="#6b7280" stroke-width="1"/><text x="401.7" y="98.0" font-size="12" font-weight="normal" fill="#1f2937" text-anchor="middle">6</text><text x="401.7" y="151.0" font-size="12" font-weight="normal" fill="#1f2937" text-anchor="middle">10</text><text x="445.0" y="98.0" font-size="12" font-weight="bold" fill="#1f2937" text-anchor="middle">3</text><text x="445.0" y="151.0" font-size="12" font-weight="bold" fill="#1f2937" text-anchor="middle">4</text><text x="488.3" y="98.0" font-size="12" font-weight="normal" fill="#1f2937" text-anchor="middle">8</text><text x="488.3" y="151.0" font-size="12" font-weight="normal" fill="#1f2937" text-anchor="middle">12</text><text x="445.0" y="124.5" font-size="13" font-weight="bold" fill="#1f2937" text-anchor="middle">C</text><rect x="200.0" y="218.0" width="130.0" height="76.0" rx="6" fill="#fff1f2" stroke="#dc2626" stroke-width="2.2"/><line x1="200.0" y1="240.0" x2="330.0" y2="240.0" stroke="#dc2626" stroke-width="1"/><line x1="200.0" y1="272.0" x2="330.0" y2="272.0" stroke="#dc2626" stroke-width="1"/><line x1="243.3" y1="218.0" x2="243.3" y2="240.0" stroke="#dc2626" stroke-width="1"/><line x1="243.3" y1="272.0" x2="243.3" y2="294.0" stroke="#dc2626" stroke-width="1"/><line x1="286.7" y1="218.0" x2="286.7" y2="240.0" stroke="#dc2626" stroke-width="1"/><line x1="286.7" y1="272.0" x2="286.7" y2="294.0" stroke="#dc2626" stroke-width="1"/><text x="221.7" y="234.0" font-size="12" font-weight="normal" fill="#1f2937" text-anchor="middle">3</text><text x="221.7" y="287.0" font-size="12" font-weight="normal" fill="#1f2937" text-anchor="middle">3</text><text x="265.0" y="234.0" font-size="12" font-weight="bold" fill="#1f2937" text-anchor="middle">10</text><text x="265.0" y="287.0" font-size="12" font-weight="bold" fill="#dc2626" text-anchor="middle">0</text><text x="308.3" y="234.0" font-size="12" font-weight="normal" fill="#1f2937" text-anchor="middle">12</text><text x="308.3" y="287.0" font-size="12" font-weight="normal" fill="#1f2937" text-anchor="middle">12</text><text x="265.0" y="260.5" font-size="13" font-weight="bold" fill="#1f2937" text-anchor="middle">D</text><rect x="560.0" y="150.0" width="130.0" height="76.0" rx="6" fill="#fff1f2" stroke="#dc2626" stroke-width="2.2"/><line x1="560.0" y1="172.0" x2="690.0" y2="172.0" stroke="#dc2626" stroke-width="1"/><line x1="560.0" y1="204.0" x2="690.0" y2="204.0" stroke="#dc2626" stroke-width="1"/><line x1="603.3" y1="150.0" x2="603.3" y2="172.0" stroke="#dc2626" stroke-width="1"/><line x1="603.3" y1="204.0" x2="603.3" y2="226.0" stroke="#dc2626" stroke-width="1"/><line x1="646.7" y1="150.0" x2="646.7" y2="172.0" stroke="#dc2626" stroke-width="1"/><line x1="646.7" y1="204.0" x2="646.7" y2="226.0" stroke="#dc2626" stroke-width="1"/><text x="581.7" y="166.0" font-size="12" font-weight="normal" fill="#1f2937" text-anchor="middle">13</text><text x="581.7" y="219.0" font-size="12" font-weight="normal" fill="#1f2937" text-anchor="middle">13</text><text x="625.0" y="166.0" font-size="12" font-weight="bold" fill="#1f2937" text-anchor="middle">2</text><text x="625.0" y="219.0" font-size="12" font-weight="bold" fill="#dc2626" text-anchor="middle">0</text><text x="668.3" y="166.0" font-size="12" font-weight="normal" fill="#1f2937" text-anchor="middle">14</text><text x="668.3" y="219.0" font-size="12" font-weight="normal" fill="#1f2937" text-anchor="middle">14</text><text x="625.0" y="192.5" font-size="13" font-weight="bold" fill="#1f2937" text-anchor="middle">F</text><text x="20.0" y="314.0" font-size="11.5" font-weight="bold" fill="#1f2937" text-anchor="start">Paths: A–D–F = 2 + 10 + 2 = 14 days (critical, zero total float).   A–B–C–F = 2 + 3 + 3 + 2 = 10 days (4 days of total float).</text><text x="20.0" y="332.0" font-size="11" font-weight="normal" fill="#6b7280" text-anchor="start">Node key: top row = early start | duration | early finish; bottom row = late start | total float | late finish.</text><rect x="730.0" y="64.0" width="230.0" height="256.0" rx="8" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.2"/><text x="742.0" y="84.0" font-size="12.5" font-weight="bold" fill="#1f2937" text-anchor="start">Rules (day-1 convention)</text><text x="742.0" y="104.0" font-size="11" font-weight="bold" fill="#1e3a8a" text-anchor="start">Forward pass</text><text x="742.0" y="117.0" font-size="10.5" font-weight="normal" fill="#1f2937" text-anchor="start">ES(successor) = EF(predecessor) + 1; EF =</text><text x="742.0" y="129.6" font-size="10.5" font-weight="normal" fill="#1f2937" text-anchor="start">ES + D − 1</text><text x="742.0" y="150.2" font-size="11" font-weight="bold" fill="#1e3a8a" text-anchor="start">Backward pass</text><text x="742.0" y="163.2" font-size="10.5" font-weight="normal" fill="#1f2937" text-anchor="start">LF(predecessor) = LS(successor) − 1; LS =</text><text x="742.0" y="175.8" font-size="10.5" font-weight="normal" fill="#1f2937" text-anchor="start">LF − D + 1</text><text x="742.0" y="196.4" font-size="11" font-weight="bold" fill="#1e3a8a" text-anchor="start">Total float</text><text x="742.0" y="209.4" font-size="10.5" font-weight="normal" fill="#1f2937" text-anchor="start">LS − ES = LF − EF: delay without delaying</text><text x="742.0" y="222.0" font-size="10.5" font-weight="normal" fill="#1f2937" text-anchor="start">the finish</text><text x="742.0" y="242.6" font-size="11" font-weight="bold" fill="#1e3a8a" text-anchor="start">Free float</text><text x="742.0" y="255.6" font-size="10.5" font-weight="normal" fill="#1f2937" text-anchor="start">ES(next) − EF − 1: delay without delaying</text><text x="742.0" y="268.2" font-size="10.5" font-weight="normal" fill="#1f2937" text-anchor="start">the next activity</text><text x="742.0" y="288.8" font-size="11" font-weight="bold" fill="#7f1d1d" text-anchor="start">Critical path</text><text x="742.0" y="301.8" font-size="10.5" font-weight="normal" fill="#1f2937" text-anchor="start">Longest path; zero (lowest) total float.</text><text x="742.0" y="314.4" font-size="10.5" font-weight="normal" fill="#1f2937" text-anchor="start">Negative float: behind a constraint</text><rect x="20.0" y="352.0" width="840.0" height="26.0" rx="4" fill="#1e3a8a" stroke="#1e3a8a" stroke-width="1"/><text x="65.0" y="369.0" font-size="11.5" font-weight="bold" fill="#ffffff" text-anchor="middle">Activity</text><text x="155.0" y="369.0" font-size="11.5" font-weight="bold" fill="#ffffff" text-anchor="middle">Duration</text><text x="235.0" y="369.0" font-size="11.5" font-weight="bold" fill="#ffffff" text-anchor="middle">ES</text><text x="305.0" y="369.0" font-size="11.5" font-weight="bold" fill="#ffffff" text-anchor="middle">EF</text><text x="375.0" y="369.0" font-size="11.5" font-weight="bold" fill="#ffffff" text-anchor="middle">LS</text><text x="445.0" y="369.0" font-size="11.5" font-weight="bold" fill="#ffffff" text-anchor="middle">LF</text><text x="535.0" y="369.0" font-size="11.5" font-weight="bold" fill="#ffffff" text-anchor="middle">Total float</text><text x="645.0" y="369.0" font-size="11.5" font-weight="bold" fill="#ffffff" text-anchor="middle">Free float</text><text x="780.0" y="369.0" font-size="11.5" font-weight="bold" fill="#ffffff" text-anchor="middle">On critical path?</text><rect x="20.0" y="378.0" width="840.0" height="26.0" rx="0" fill="#fff1f2" stroke="#d1d5db" stroke-width="1"/><text x="65.0" y="395.0" font-size="11.5" font-weight="bold" fill="#1f2937" text-anchor="middle">A</text><text x="155.0" y="395.0" font-size="11.5" font-weight="normal" fill="#1f2937" text-anchor="middle">2</text><text x="235.0" y="395.0" font-size="11.5" font-weight="normal" fill="#1f2937" text-anchor="middle">1</text><text x="305.0" y="395.0" font-size="11.5" font-weight="normal" fill="#1f2937" text-anchor="middle">2</text><text x="375.0" y="395.0" font-size="11.5" font-weight="normal" fill="#1f2937" text-anchor="middle">1</text><text x="445.0" y="395.0" font-size="11.5" font-weight="normal" fill="#1f2937" text-anchor="middle">2</text><text x="535.0" y="395.0" font-size="11.5" font-weight="bold" fill="#dc2626" text-anchor="middle">0</text><text x="645.0" y="395.0" font-size="11.5" font-weight="normal" fill="#1f2937" text-anchor="middle">0</text><text x="780.0" y="395.0" font-size="11.5" font-weight="normal" fill="#dc2626" text-anchor="middle">Yes</text><rect x="20.0" y="404.0" width="840.0" height="26.0" rx="0" fill="#f9fafb" stroke="#d1d5db" stroke-width="1"/><text x="65.0" y="421.0" font-size="11.5" font-weight="bold" fill="#1f2937" text-anchor="middle">B</text><text x="155.0" y="421.0" font-size="11.5" font-weight="normal" fill="#1f2937" text-anchor="middle">3</text><text x="235.0" y="421.0" font-size="11.5" font-weight="normal" fill="#1f2937" text-anchor="middle">3</text><text x="305.0" y="421.0" font-size="11.5" font-weight="normal" fill="#1f2937" text-anchor="middle">5</text><text x="375.0" y="421.0" font-size="11.5" font-weight="normal" fill="#1f2937" text-anchor="middle">7</text><text x="445.0" y="421.0" font-size="11.5" font-weight="normal" fill="#1f2937" text-anchor="middle">9</text><text x="535.0" y="421.0" font-size="11.5" font-weight="bold" fill="#1f2937" text-anchor="middle">4</text><text x="645.0" y="421.0" font-size="11.5" font-weight="normal" fill="#1f2937" text-anchor="middle">0</text><text x="780.0" y="421.0" font-size="11.5" font-weight="normal" fill="#1f2937" text-anchor="middle">No</text><rect x="20.0" y="430.0" width="840.0" height="26.0" rx="0" fill="#ffffff" stroke="#d1d5db" stroke-width="1"/><text x="65.0" y="447.0" font-size="11.5" font-weight="bold" fill="#1f2937" text-anchor="middle">C</text><text x="155.0" y="447.0" font-size="11.5" font-weight="normal" fill="#1f2937" text-anchor="middle">3</text><text x="235.0" y="447.0" font-size="11.5" font-weight="normal" fill="#1f2937" text-anchor="middle">6</text><text x="305.0" y="447.0" font-size="11.5" font-weight="normal" fill="#1f2937" text-anchor="middle">8</text><text x="375.0" y="447.0" font-size="11.5" font-weight="normal" fill="#1f2937" text-anchor="middle">10</text><text x="445.0" y="447.0" font-size="11.5" font-weight="normal" fill="#1f2937" text-anchor="middle">12</text><text x="535.0" y="447.0" font-size="11.5" font-weight="bold" fill="#1f2937" text-anchor="middle">4</text><text x="645.0" y="447.0" font-size="11.5" font-weight="normal" fill="#1f2937" text-anchor="middle">4</text><text x="780.0" y="447.0" font-size="11.5" font-weight="normal" fill="#1f2937" text-anchor="middle">No</text><rect x="20.0" y="456.0" width="840.0" height="26.0" rx="0" fill="#fff1f2" stroke="#d1d5db" stroke-width="1"/><text x="65.0" y="473.0" font-size="11.5" font-weight="bold" fill="#1f2937" text-anchor="middle">D</text><text x="155.0" y="473.0" font-size="11.5" font-weight="normal" fill="#1f2937" text-anchor="middle">10</text><text x="235.0" y="473.0" font-size="11.5" font-weight="normal" fill="#1f2937" text-anchor="middle">3</text><text x="305.0" y="473.0" font-size="11.5" font-weight="normal" fill="#1f2937" text-anchor="middle">12</text><text x="375.0" y="473.0" font-size="11.5" font-weight="normal" fill="#1f2937" text-anchor="middle">3</text><text x="445.0" y="473.0" font-size="11.5" font-weight="normal" fill="#1f2937" text-anchor="middle">12</text><text x="535.0" y="473.0" font-size="11.5" font-weight="bold" fill="#dc2626" text-anchor="middle">0</text><text x="645.0" y="473.0" font-size="11.5" font-weight="normal" fill="#1f2937" text-anchor="middle">0</text><text x="780.0" y="473.0" font-size="11.5" font-weight="normal" fill="#dc2626" text-anchor="middle">Yes</text><rect x="20.0" y="482.0" width="840.0" height="26.0" rx="0" fill="#fff1f2" stroke="#d1d5db" stroke-width="1"/><text x="65.0" y="499.0" font-size="11.5" font-weight="bold" fill="#1f2937" text-anchor="middle">F</text><text x="155.0" y="499.0" font-size="11.5" font-weight="normal" fill="#1f2937" text-anchor="middle">2</text><text x="235.0" y="499.0" font-size="11.5" font-weight="normal" fill="#1f2937" text-anchor="middle">13</text><text x="305.0" y="499.0" font-size="11.5" font-weight="normal" fill="#1f2937" text-anchor="middle">14</text><text x="375.0" y="499.0" font-size="11.5" font-weight="normal" fill="#1f2937" text-anchor="middle">13</text><text x="445.0" y="499.0" font-size="11.5" font-weight="normal" fill="#1f2937" text-anchor="middle">14</text><text x="535.0" y="499.0" font-size="11.5" font-weight="bold" fill="#dc2626" text-anchor="middle">0</text><text x="645.0" y="499.0" font-size="11.5" font-weight="normal" fill="#1f2937" text-anchor="middle">0</text><text x="780.0" y="499.0" font-size="11.5" font-weight="normal" fill="#dc2626" text-anchor="middle">Yes</text><rect x="20.0" y="518.0" width="940.0" height="78.0" rx="8" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.2"/><text x="32.0" y="536.0" font-size="11.2" font-weight="bold" fill="#6b7280" text-anchor="start">•</text><text x="44.0" y="536.0" font-size="11.2" font-weight="normal" fill="#1f2937" text-anchor="start">Total float is shared along a path: B and C together can slip 4 days without delaying the project. Free float is not shared: B has none (any slip delays C's early start), while C can slip</text><text x="44.0" y="549.7" font-size="11.2" font-weight="normal" fill="#1f2937" text-anchor="start">4 days without touching F.</text><text x="32.0" y="567.3" font-size="11.2" font-weight="bold" fill="#6b7280" text-anchor="start">•</text><text x="44.0" y="567.3" font-size="11.2" font-weight="normal" fill="#1f2937" text-anchor="start">With the older convention EF = ES + duration, every date shifts by one day; the critical path and the float values are the same.</text></svg>