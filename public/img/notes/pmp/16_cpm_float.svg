<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 600" width="980" height="600" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">Critical path method: forward pass, backward pass and float</title><desc id="d">Example network: A then B, C then F, and A then D then F. The critical path A, D, F is 14 days. B and C share 4 days of total float; free float for B is 0 and for C is 4.</desc><defs><marker id="ah0" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker><marker id="ah1" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker></defs><rect x="0.75" y="0.75" width="978.5" height="598.5" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><text x="20.0" y="28.0" font-size="18" font-weight="bold" fill="#1f2937" text-anchor="start">Critical path method: forward pass, backward pass, float</text><text x="20.0" y="48.0" font-size="12" font-weight="normal" fill="#6b7280" text-anchor="start">Worked example using the day-1 convention PMBOK 8 uses (EF = ES + duration − 1)</text><line x1="150.0" y1="188.0" x2="198.0" y2="120.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#ah0)"/><line x1="330.0" y1="120.0" x2="378.0" y2="120.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#ah0)"/><line x1="510.0" y1="120.0" x2="558.0" y2="188.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#ah0)"/><line x1="150.0" y1="188.0" x2="198.0" y2="256.0" stroke="#dc2626" stroke-width="2.4" marker-end="url(#ah1)"/><line x1="330.0" y1="256.0" x2="558.0" y2="188.0" stroke="#dc2626" stroke-width="2.4" marker-end="url(#ah1)"/><rect x="20.0" y="150.0" width="130.0" height="76.0" rx="6" fill="#fff1f2" stroke="#dc2626" stroke-width="2.2"/><line x1="20.0" y1="172.0" x2="150.0" y2="172.0" stroke="#dc2626" stroke-width="1"/><line x1="20.0" y1="204.0" x2="150.0" y2=