<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 530" width="980" height="530" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">Escalation path and decision thresholds</title><desc id="d">Levels from project team to project manager to sponsor and steering committee to portfolio or board, with illustrative thresholds. Decisions beyond a level's authority are escalated with analysis and recommendations.</desc><defs><marker id="ah0" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker></defs><rect x="0.75" y="0.75" width="978.5" height="528.5" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><text x="20.0" y="28.0" font-size="18" font-weight="bold" fill="#1f2937" text-anchor="start">Governance escalation path and thresholds</text><text x="20.0" y="48.0" font-size="12" font-weight="normal" fill="#6b7280" text-anchor="start">Define the path and thresholds up front (illustrative numbers); decisions beyond authority go up with options and a recommendation</text><rect x="20.0" y="72.0" width="640.0" height="78.0" rx="8" fill="#1e3a8a" stroke="#1e3a8a" stroke-width="1.6"/><text x="32.0" y="94.0" font-size="13.5" font-weight="bold" fill="#ffffff" text-anchor="start">Portfolio / executive board</text><text x="32.0" y="112.0" font-size="11.5" font-weight="normal" fill="#ffffff" text-anchor="start">Strategic changes, cancellation, funding beyond the project, enterprise-wide risk</text><text x="690.0" y="102.0" font-size="11" font-weight="bold" fill="#6b7280" text-anchor="start">Threshold / authority:</text><text x="690.0" y="118.0" font-size="11.5" font-weight="normal" fill="#1f2937" text-anchor="start">Above sponsor limit</text><rect x="40.0" y="158.0" width="620.0" height="78.0" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="52.0" y="180.0" font-size="13.5" font-weight="bold" fill="#1e3a8a" text-anchor="start">Sponsor / steering committee / CCB</text><text x="52.0" y="198.0" font-size="11.5" font-weight="normal" fill="#1f2937" text-anchor="start">Baseline changes above PM authority, scope trade-offs, reserve use per policy, phase-gate decisions</text><text x="690.0" y="188.0" font-size="11" font-weight="bold" fill="#6b7280" text-anchor="start">Threshold / authority:</text><text x="690.0" y="204.0" font-size="11.5" font-weight="normal" fill="#1f2937" text-anchor="start">e.g., cost change over 10% or schedule slip</text><text x="690.0" y="218.0" font-size="11.5" font-weight="normal" fill="#1f2937" text-anchor="start">over 4 weeks</text><rect x="60.0" y="244.0" width="600.0" height="78.0" rx="8" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.6"/><text x="72.0" y="266.0" font-size="13.5" font-weight="bold" fill="#134e4a" text-anchor="start">Project manager</text><text x="72.0" y="284.0" font-size="11.5" font-weight="normal" fill="#1f2937" text-anchor="start">Day-to-day decisions within the plan, minor changes inside tolerance, assigning risk owners, resolving team</text><text x="72.0" y="298.0" font-size="11.5" font-weight="normal" fill="#1f2937" text-anchor="start">issues</text><text x="690.0" y="274.0" font-size="11" font-weight="bold" fill="#6b7280" text-anchor="start">Threshold / authority:</text><text x="690.0" y="290.0" font-size="11.5" font-weight="normal" fill="#1f2937" text-anchor="start">e.g., within 5% of budget, no baseline impact</text><rect x="80.0" y="330.0" width="580.0" height="78.0" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="92.0" y="352.0" font-size="13.5" font-weight="bold" fill="#14532d" text-anchor="start">Team / product owner (adaptive)</text><text x="92.0" y="370.0" font-size="11.5" font-weight="normal" fill="#1f2937" text-anchor="start">How to build, task assignment, backlog ordering by value (product owner), local problem-solving</text><text x="690.0" y="360.0" font-size="11" font-weight="bold" fill="#6b7280" text-anchor="start">Threshold / authority:</text><text x="690.0" y="376.0" font-size="11.5" font-weight="normal" fill="#1f2937" text-anchor="start">Within iteration scope and team agreements</text><line x1="965.0" y1="410.0" x2="965.0" y2="80.0" stroke="#dc2626" stroke-width="2.4" marker-end="url(#ah0)"/><text x="955.0" y="250.0" transform="rotate(-90 955 250)" font-size="11.5" font-weight="bold" fill="#991b1b" text-anchor="middle">ESCALATE when</text><rect x="20.0" y="430.0" width="940.0" height="86.0" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.6"/><text x="34.0" y="461.9" font-size="12" font-weight="bold" fill="#374151" text-anchor="start">Escalate when:</text><text x="34.0" y="476.9" font-size="12" font-weight="normal" fill="#374151" text-anchor="start">the decision exceeds your authority or threshold; a threat is outside project scope; a persistent obstacle or conflict cannot be resolved at your level; a compliance or ethics</text><text x="34.0" y="491.9" font-size="12" font-weight="normal" fill="#374151" text-anchor="start">threat appears; a baseline would change. Bring the problem with alternatives, impacts and a recommendation (do not bring me problems, bring me solutions).</text></svg>