<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 540" width="980" height="540" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">Explicit and tacit knowledge</title><desc id="d">Explicit knowledge is codifiable, formal and easily communicated, shared through information management tools. Tacit knowledge is personal, embedded in experience, hard to articulate and shared through conversations and interaction, using knowledge management tools. The aim is to convert tacit to explicit where possible.</desc><defs></defs><rect x="0.75" y="0.75" width="978.5" height="538.5" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><text x="20.0" y="28.0" font-size="18" font-weight="bold" fill="#1f2937" text-anchor="start">Explicit vs tacit knowledge: different knowledge, different tools</text><text x="20.0" y="48.0" font-size="12" font-weight="normal" fill="#6b7280" text-anchor="start">Managing knowledge is more than documenting it or collecting lessons at the end</text><rect x="20.0" y="66.0" width="460.0" height="330.0" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="1.8"/><rect x="20.0" y="66.0" width="460.0" height="36.0" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.8"/><text x="34.0" y="90.0" font-size="14" font-weight="bold" fill="#1e3a8a" text-anchor="start">Explicit knowledge</text><text x="34.0" y="124.0" font-size="11.5" font-weight="bold" fill="#6b7280" text-anchor="start">Characteristics</text><text x="34.0" y="142.0" font-size="11.2" font-weight="bold" fill="#6b7280" text-anchor="start">•</text><text x="46.0" y="142.0" font-size="11.2" font-weight="normal" fill="#1f2937" text-anchor="start">Codifiable: words, pictures, numbers</text><text x="34.0" y="159.7" font-size="11.2" font-weight="bold" fill="#6b7280" text-anchor="start">•</text><text x="46.0" y="159.7" font-size="11.2" font-weight="normal" fill="#1f2937" text-anchor="start">Formal and systematic; structured</text><text x="34.0" y="177.3" font-size="11.2" font-weight="bold" fill="#6b7280" text-anchor="start">•</text><text x="46.0" y="177.3" font-size="11.2" font-weight="normal" fill="#1f2937" text-anchor="start">Easily communicated: manuals, procedures, documented processes</text><text x="34.0" y="195.0" font-size="11.2" font-weight="bold" fill="#6b7280" text-anchor="start">•</text><text x="46.0" y="195.0" font-size="11.2" font-weight="normal" fill="#1f2937" text-anchor="start">Lacks context; open to different interpretations</text><text x="34.0" y="224.7" font-size="11.5" font-weight="bold" fill="#1e3a8a" text-anchor="start">Information management tools</text><text x="34.0" y="242.7" font-size="11.2" font-weight="bold" fill="#6b7280" text-anchor="start">•</text><text x="46.0" y="242.7" font-size="11.2" font-weight="normal" fill="#1f2937" text-anchor="start">Lessons learned register and repository</text><text x="34.0" y="260.3" font-size="11.2" font-weight="bold" fill="#6b7280" text-anchor="start">•</text><text x="46.0" y="260.3" font-size="11.2" font-weight="normal" fill="#1f2937" text-anchor="start">Library services, web searches, databases</text><text x="34.0" y="278.0" font-size="11.2" font-weight="bold" fill="#6b7280" text-anchor="start">•</text><text x="46.0" y="278.0" font-size="11.2" font-weight="normal" fill="#1f2937" text-anchor="start">PMIS and document management systems</text><text x="34.0" y="295.6" font-size="11.2" font-weight="bold" fill="#6b7280" text-anchor="start">•</text><text x="46.0" y="295.6" font-size="11.2" font-weight="normal" fill="#1f2937" text-anchor="start">A “contact me” link to the originator adds interaction</text><text x="34.0" y="313.3" font-size="11.2" font-weight="bold" fill="#6b7280" text-anchor="start">•</text><text x="46.0" y="313.3" font-size="11.2" font-weight="normal" fill="#1f2937" text-anchor="start">Methods for codifying lessons-to-be-learned</text><rect x="500.0" y="66.0" width="460.0" height="330.0" rx="10" fill="#ffffff" stroke="#7c3aed" stroke-width="1.8"/><rect x="500.0" y="66.0" width="460.0" height="36.0" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.8"/><text x="514.0" y="90.0" font-size="14" font-weight="bold" fill="#4c1d95" text-anchor="start">Tacit knowledge</text><text x="514.0" y="124.0" font-size="11.5" font-weight="bold" fill="#6b7280" text-anchor="start">Characteristics</text><text x="514.0" y="142.0" font-size="11.2" font-weight="bold" fill="#6b7280" text-anchor="start">•</text><text x="526.0" y="142.0" font-size="11.2" font-weight="normal" fill="#1f2937" text-anchor="start">Personal and embedded in a person's mind</text><text x="514.0" y="159.7" font-size="11.2" font-weight="bold" fill="#6b7280" text-anchor="start">•</text><text x="526.0" y="159.7" font-size="11.2" font-weight="normal" fill="#1f2937" text-anchor="start">Experience-based: skills, insights, practical judgment</text><text x="514.0" y="177.3" font-size="11.2" font-weight="bold" fill="#6b7280" text-anchor="start">•</text><text x="526.0" y="177.3" font-size="11.2" font-weight="normal" fill="#1f2937" text-anchor="start">Hard to articulate and to transfer</text><text x="514.0" y="195.0" font-size="11.2" font-weight="bold" fill="#6b7280" text-anchor="start">•</text><text x="526.0" y="195.0" font-size="11.2" font-weight="normal" fill="#1f2937" text-anchor="start">Has context, but difficult to codify</text><text x="514.0" y="224.7" font-size="11.5" font-weight="bold" fill="#4c1d95" text-anchor="start">Knowledge management tools</text><text x="514.0" y="242.7" font-size="11.2" font-weight="bold" fill="#6b7280" text-anchor="start">•</text><text x="526.0" y="242.7" font-size="11.2" font-weight="normal" fill="#1f2937" text-anchor="start">Networking; communities of practice</text><text x="514.0" y="260.3" font-size="11.2" font-weight="bold" fill="#6b7280" text-anchor="start">•</text><text x="526.0" y="260.3" font-size="11.2" font-weight="normal" fill="#1f2937" text-anchor="start">Work shadowing and reverse shadowing</text><text x="514.0" y="278.0" font-size="11.2" font-weight="bold" fill="#6b7280" text-anchor="start">•</text><text x="526.0" y="278.0" font-size="11.2" font-weight="normal" fill="#1f2937" text-anchor="start">Workshops, learning reviews, discussion forums, seminars</text><text x="514.0" y="295.6" font-size="11.2" font-weight="bold" fill="#6b7280" text-anchor="start">•</text><text x="526.0" y="295.6" font-size="11.2" font-weight="normal" fill="#1f2937" text-anchor="start">Knowledge fairs and cafés; interactive training</text><text x="514.0" y="313.3" font-size="11.2" font-weight="bold" fill="#6b7280" text-anchor="start">•</text><text x="526.0" y="313.3" font-size="11.2" font-weight="normal" fill="#1f2937" text-anchor="start">Mentoring, storytelling, face-to-face brainstorming; AI interview bots</text><rect x="20.0" y="410.0" width="940.0" height="112.0" rx="8" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.3"/><text x="32.0" y="430.0" font-size="12" font-weight="bold" fill="#1f2937" text-anchor="start">Aim: convert tacit knowledge into explicit knowledge when possible, but do not assume documents carry judgment</text><text x="32.0" y="450.0" font-size="11" font-weight="bold" fill="#6b7280" text-anchor="start">•</text><text x="44.0" y="450.0" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="start">Tacit knowledge lives in experts and groups and is shared through conversation and interaction in a collaborative, trust-filled environment: open communication, mentoring, team</text><text x="44.0" y="463.2" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="start">building, face-to-face contact, regular brainstorming.</text><text x="32.0" y="480.4" font-size="11" font-weight="bold" fill="#6b7280" text-anchor="start">•</text><text x="44.0" y="480.4" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="start">Codified explicit knowledge lacks context and can be misread, so pair it with explanation and practice.</text><text x="32.0" y="497.6" font-size="11" font-weight="bold" fill="#6b7280" text-anchor="start">•</text><text x="44.0" y="497.6" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="start">Choice of tools depends on how innovative and complex the project is and how diverse the team is (including diversity of disciplines).</text></svg>