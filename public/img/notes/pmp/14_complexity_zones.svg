<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 500" width="980" height="500" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">Complexity zones (Stacey-type graph)</title><desc id="d">Horizontal axis: how far requirements are from agreement. Vertical axis: how far technology is from certainty. Close to both is simple; far from one is complicated; far from both is complex; far from both and unstable is chaotic.</desc><defs><marker id="ah0" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker></defs><rect x="0.75" y="0.75" width="978.5" height="498.5" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><text x="20.0" y="28.0" font-size="18" font-weight="bold" fill="#1f2937" text-anchor="start">Complexity zones: where does the project sit?</text><text x="20.0" y="48.0" font-size="12" font-weight="normal" fill="#6b7280" text-anchor="start">A Stacey-type graph [Beyond PMBOK 8 exam practice]; PMBOK 8 asks you to assess complexity (people, systems, ambiguity) before choosing the approach</text><rect x="235.2" y="82.0" width="324.8" height="222.6" rx="0" fill="#fef3c7" stroke="#d97706" stroke-width="1.4"/><rect x="430.1" y="82.0" width="129.9" height="89.0" rx="0" fill="#fee2e2" stroke="#dc2626" stroke-width="1.4"/><rect x="235.2" y="304.6" width="324.8" height="95.4" rx="0" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/><rect x="96.0" y="82.0" width="139.2" height="222.6" rx="0" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/><rect x="96.0" y="304.6" width="139.2" height="95.4" rx="0" fill="#dcfce7" stroke="#16a34a" stroke-width="1.4"/><line x1="96.0" y1="400.0" x2="576.0" y2="400.0" stroke="#1f2937" stroke-width="1.8" marker-end="url(#ah0)"/><line x1="96.0" y1="400.0" x2="96.0" y2="66.0" stroke="#1f2937" stroke-width="1.8" marker-end="url(#ah0)"/><text x="96.0" y="420.0" font-size="11.5" font-weight="normal" fill="#6b7280" text-anchor="start">Close to agreement</text><text x="560.0" y="420.0" font-size="11.5" font-weight="normal" fill="#6b7280" text-anchor="end">Far from agreement</text><text x="328.0" y="440.0" font-size="12.5" font-weight="bold" fill="#1f2937" text-anchor="middle">Requirements: how far from agreement?</text><text x="86.0" y="400.0" font-size="11.5" font-weight="normal" fill="#6b7280" text-anchor="end">Close to</text><text x="86.0" y="414.0" font-size="11.5" font-weight="normal" fill="#6b7280" text-anchor="end">certainty</text><text x="86.0" y="90.0" font-size="11.5" font-weight="normal" fill="#6b7280" text-anchor="end">Far from</text><text x="86.0" y="104.0" font-size="11.5" font-weight="normal" fill="#6b7280" text-anchor="end">certainty</text><text x="34.0" y="241.0" transform="rotate(-90 34 241.0)" font-size="12.5" font-weight="bold" fill="#1f2937" text-anchor="middle">Technology: how far from certainty?</text><text x="165.6" y="350.0" font-size="13" font-weight="bold" fill="#14532d" text-anchor="middle">SIMPLE</text><text x="165.6" y="367.0" font-size="10.5" font-weight="normal" fill="#14532d" text-anchor="middle">known practice</text><text x="344.6" y="350.0" font-size="13" font-weight="bold" fill="#1e3a8a" text-anchor="middle">COMPLICATED</text><text x="344.6" y="367.0" font-size="10.5" font-weight="normal" fill="#1e3a8a" text-anchor="middle">stakeholders disagree, proven technology</text><text x="165.6" y="116.0" font-size="12" font-weight="bold" fill="#1e3a8a" text-anchor="middle">COMPLICATED</text><text x="165.6" y="132.0" font-size="10.5" font-weight="normal" fill="#1e3a8a" text-anchor="middle">agreed needs,</text><text x="165.6" y="144.1" font-size="10.5" font-weight="normal" fill="#1e3a8a" text-anchor="middle">new technology</text><text x="352.6" y="213.3" font-size="14" font-weight="bold" fill="#78350f" text-anchor="middle">COMPLEX</text><text x="352.6" y="231.3" font-size="10.5" font-weight="normal" fill="#78350f" text-anchor="middle">both uncertain</text><text x="495.0" y="126.5" font-size="12.5" font-weight="bold" fill="#7f1d1d" text-anchor="middle">CHAOTIC</text><text x="495.0" y="142.5" font-size="10.5" font-weight="normal" fill="#7f1d1d" text-anchor="middle">crisis</text><circle cx="522.9" cy="371.4" r="11" fill="#ffffff" stroke="#1f2937" stroke-width="1.8"/><text x="522.9" y="375.9" font-size="12" font-weight="bold" fill="#1f2937" text-anchor="middle">A</text><circle cx="142.4" cy="202.8" r="11" fill="#ffffff" stroke="#1f2937" stroke-width="1.8"/><text x="142.4" y="207.3" font-size="12" font-weight="bold" fill="#1f2937" text-anchor="middle">B</text><circle cx="318.7" cy="253.7" r="11" fill="#ffffff" stroke="#1f2937" stroke-width="1.8"/><text x="318.7" y="258.2" font-size="12" font-weight="bold" fill="#1f2937" text-anchor="middle">C</text><text x="620.0" y="86.0" font-size="13" font-weight="bold" fill="#1f2937" text-anchor="start">Typical approach by zone</text><rect x="620.0" y="98.0" width="92.0" height="56.0" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="666.0" y="129.7" font-size="11.5" font-weight="bold" fill="#14532d" text-anchor="middle">Simple</text><rect x="716.0" y="98.0" width="244.0" height="56.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="724.0" y="129.6" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="start">Predictive; apply known good practice</text><rect x="620.0" y="164.0" width="92.0" height="56.0" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="666.0" y="195.7" font-size="11.5" font-weight="bold" fill="#1e3a8a" text-anchor="middle">Complicated</text><rect x="716.0" y="164.0" width="244.0" height="56.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="724.0" y="188.7" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="start">Analysis, expertise and structured alignment;</text><text x="724.0" y="202.4" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="start">predictive or incremental</text><rect x="620.0" y="230.0" width="92.0" height="56.0" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="666.0" y="261.7" font-size="11.5" font-weight="bold" fill="#78350f" text-anchor="middle">Complex</text><rect x="716.0" y="230.0" width="244.0" height="56.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="724.0" y="254.7" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="start">Experiment in short cycles; adaptive or</text><text x="724.0" y="268.4" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="start">iterative with fast feedback</text><rect x="620.0" y="296.0" width="92.0" height="56.0" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.6"/><text x="666.0" y="327.7" font-size="11.5" font-weight="bold" fill="#7f1d1d" text-anchor="middle">Chaotic</text><rect x="716.0" y="296.0" width="244.0" height="56.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="724.0" y="320.7" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="start">Act to stabilize first, then sense and move to a</text><text x="724.0" y="334.4" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="start">complex or complicated approach</text><text x="620.0" y="378.0" font-size="11.5" font-weight="normal" fill="#1f2937" text-anchor="start">Examples: A stakeholders disagree on what to build but the</text><text x="620.0" y="392.4" font-size="11.5" font-weight="normal" fill="#1f2937" text-anchor="start">technology is proven (complicated). B needs are agreed but the</text><text x="620.0" y="406.8" font-size="11.5" font-weight="normal" fill="#1f2937" text-anchor="start">technology is new (complicated). C needs unclear and technology</text><text x="620.0" y="421.1" font-size="11.5" font-weight="normal" fill="#1f2937" text-anchor="start">new (complex).</text><rect x="20.0" y="450.0" width="940.0" height="36.0" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.6"/><text x="490.0" y="471.9" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">Cynefin uses the same logic: clear, complicated, complex, chaotic. Re-assess during the project: a complex start often becomes complicated as learning reduces uncertainty.</text></svg>