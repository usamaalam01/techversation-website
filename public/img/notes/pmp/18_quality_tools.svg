<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 530" width="980" height="530" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">Basic quality tools</title><desc id="d">Cause-and-effect diagram, flowchart, checklist or check sheet, histogram, Pareto chart, scatter diagram, control chart and affinity diagram, each with a mini graphic and its use.</desc><defs><marker id="ah0" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker><marker id="ah1" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker></defs><rect x="0.75" y="0.75" width="978.5" height="528.5" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><text x="20.0" y="28.0" font-size="18" font-weight="bold" fill="#1f2937" text-anchor="start">Basic quality tools at a glance</text><text x="20.0" y="48.0" font-size="12" font-weight="normal" fill="#6b7280" text-anchor="start">PMBOK 8 names cause-and-effect diagrams, flowcharts, checklists, control charts, histograms and affinity diagrams; Pareto and scatter use is common exam practice</text><rect x="21.0" y="66.0" width="224.0" height="214.0" rx="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.3"/><text x="31.0" y="85.0" font-size="12" font-weight="bold" fill="#1e3a8a" text-anchor="start">Cause-and-effect (fishbone)</text><text x="31.0" y="240.0" font-size="10.2" font-weight="normal" fill="#6b7280" text-anchor="start">Traces an effect back to root causes</text><text x="31.0" y="252.2" font-size="10.2" font-weight="normal" fill="#6b7280" text-anchor="start">grouped by category. Use for defects and</text><text x="31.0" y="264.5" font-size="10.2" font-weight="normal" fill="#6b7280" text-anchor="start">variances.</text><line x1="37.0" y1="162.0" x2="191.0" y2="162.0" stroke="#1f2937" stroke-width="2.2" marker-end="url(#ah0)"/><rect x="193.0" y="148.0" width="44.0" height="28.0" rx="5" fill="#fee2e2" stroke="#dc2626" stroke-width="1.4"/><text x="215.0" y="166.0" font-size="10" font-weight="bold" fill="#7f1d1d" text-anchor="middle">Effect</text><line x1="65.0" y1="122.0" x2="89.0" y2="162.0" stroke="#6b7280" stroke-width="1.6"/><line x1="65.0" y1="202.0" x2="89.0" y2="162.0" stroke="#6b7280" stroke-width="1.6"/><text x="57.0" y="118.0" font-size="9.5" font-weight="bold" fill="#374151" text-anchor="start">People</text><text x="57.0" y="214.0" font-size="9.5" font-weight="bold" fill="#374151" text-anchor="start">Material</text><line x1="111.0" y1="122.0" x2="135.0" y2="162.0" stroke="#6b7280" stroke-width="1.6"/><line x1="111.0" y1="202.0" x2="135.0" y2="162.0" stroke="#6b7280" stroke-width="1.6"/><text x="103.0" y="118.0" font-size="9.5" font-weight="bold" fill="#374151" text-anchor="start">Method</text><text x="103.0" y="214.0" font-size="9.5" font-weight="bold" fill="#374151" text-anchor="start">Measure</text><line x1="157.0" y1="122.0" x2="181.0" y2="162.0" stroke="#6b7280" stroke-width="1.6"/><line x1="157.0" y1="202.0" x2="181.0" y2="162.0" stroke="#6b7280" stroke-width="1.6"/><text x="149.0" y="118.0" font-size="9.5" font-weight="bold" fill="#374151" text-anchor="start">Tools</text><text x="149.0" y="214.0" font-size="9.5" font-weight="bold" fill="#374151" text-anchor="start">Place</text><rect x="259.0" y="66.0" width="224.0" height="214.0" rx="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.3"/><text x="269.0" y="85.0" font-size="12" font-weight="bold" fill="#1e3a8a" text-anchor="start">Flowchart (process map)</text><text x="269.0" y="240.0" font-size="10.2" font-weight="normal" fill="#6b7280" text-anchor="start">Shows steps, decisions and loops of a</text><text x="269.0" y="252.2" font-size="10.2" font-weight="normal" fill="#6b7280" text-anchor="start">process. Use to find waste and weak</text><text x="269.0" y="264.5" font-size="10.2" font-weight="normal" fill="#6b7280" text-anchor="start">handoffs.</text><rect x="275.0" y="100.0" width="72.0" height="24.0" rx="12" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.6"/><text x="311.0" y="115.2" font-size="10" font-weight="normal" fill="#374151" text-anchor="middle">Start</text><line x1="311.0" y1="124.0" x2="311.0" y2="138.0" stroke="#1f2937" stroke-width="1.6" marker-end="url(#ah0)"/><rect x="275.0" y="138.0" width="72.0" height="26.0" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="311.0" y="154.2" font-size="10" font-weight="normal" fill="#1e3a8a" text-anchor="middle">Build</text><line x1="311.0" y1="164.0" x2="311.0" y2="178.0" stroke="#1f2937" stroke-width="1.6" marker-end="url(#ah0)"/><polygon points="311.0,178.0 347.0,196.0 311.0,214.0 275.0,196.0" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/><text x="311.0" y="200.0" font-size="10" font-weight="bold" fill="#78350f" text-anchor="middle">Pass?</text><line x1="347.0" y1="196.0" x2="407.0" y2="196.0" stroke="#1f2937" stroke-width="1.6" marker-end="url(#ah0)"/><text x="377.0" y="190.0" font-size="9.5" font-weight="normal" fill="#1f2937" text-anchor="middle">yes</text><rect x="409.0" y="184.0" width="62.0" height="24.0" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="440.0" y="199.2" font-size="10" font-weight="normal" fill="#14532d" text-anchor="middle">Release</text><polyline points="275.0,196.0 265.0,196.0 265.0,151.0 274.0,151.0" fill="none" stroke="#dc2626" stroke-width="1.6" marker-end="url(#ah1)" stroke-linejoin="round"/><text x="267.0" y="216.0" font-size="9.5" font-weight="normal" fill="#991b1b" text-anchor="start">no: fix</text><rect x="497.0" y="66.0" width="224.0" height="214.0" rx="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.3"/><text x="507.0" y="85.0" font-size="12" font-weight="bold" fill="#1e3a8a" text-anchor="start">Checklist / check sheet</text><text x="507.0" y="240.0" font-size="10.2" font-weight="normal" fill="#6b7280" text-anchor="start">Lists items to verify or tallies defects by type.</text><text x="507.0" y="252.2" font-size="10.2" font-weight="normal" fill="#6b7280" text-anchor="start">Built from lessons learned; never exhaustive.</text><text x="509.0" y="118.0" font-size="10.5" font-weight="normal" fill="#1f2937" text-anchor="start">Scratch</text><line x1="567.0" y1="124.0" x2="709.0" y2="124.0" stroke="#d1d5db" stroke-width="1"/><line x1="577.0" y1="106.0" x2="577.0" y2="121.0" stroke="#1f2937" stroke-width="1.8"/><line x1="589.0" y1="106.0" x2="589.0" y2="121.0" stroke="#1f2937" stroke-width="1.8"/><line x1="601.0" y1="106.0" x2="601.0" y2="121.0" stroke="#1f2937" stroke-width="1.8"/><line x1="613.0" y1="106.0" x2="613.0" y2="121.0" stroke="#1f2937" stroke-width="1.8"/><line x1="585.0" y1="118.0" x2="629.0" y2="109.0" stroke="#1f2937" stroke-width="1.8"/><text x="509.0" y="148.0" font-size="10.5" font-weight="normal" fill="#1f2937" text-anchor="start">Crack</text><line x1="567.0" y1="154.0" x2="709.0" y2="154.0" stroke="#d1d5db" stroke-width="1"/><line x1="577.0" y1="136.0" x2="577.0" y2="151.0" stroke="#1f2937" stroke-width="1.8"/><line x1="589.0" y1="136.0" x2="589.0" y2="151.0" stroke="#1f2937" stroke-width="1.8"/><line x1="601.0" y1="136.0" x2="601.0" y2="151.0" stroke="#1f2937" stroke-width="1.8"/><text x="509.0" y="178.0" font-size="10.5" font-weight="normal" fill="#1f2937" text-anchor="start">Misfit</text><line x1="567.0" y1="184.0" x2="709.0" y2="184.0" stroke="#d1d5db" stroke-width="1"/><line x1="577.0" y1="166.0" x2="577.0" y2="181.0" stroke="#1f2937" stroke-width="1.8"/><line x1="589.0" y1="166.0" x2="589.0" y2="181.0" stroke="#1f2937" stroke-width="1.8"/><line x1="601.0" y1="166.0" x2="601.0" y2="181.0" stroke="#1f2937" stroke-width="1.8"/><line x1="613.0" y1="166.0" x2="613.0" y2="181.0" stroke="#1f2937" stroke-width="1.8"/><line x1="585.0" y1="178.0" x2="629.0" y2="169.0" stroke="#1f2937" stroke-width="1.8"/><line x1="639.0" y1="166.0" x2="639.0" y2="181.0" stroke="#1f2937" stroke-width="1.8"/><line x1="651.0" y1="166.0" x2="651.0" y2="181.0" stroke="#1f2937" stroke-width="1.8"/><text x="509.0" y="208.0" font-size="10.5" font-weight="normal" fill="#1f2937" text-anchor="start">Other</text><line x1="567.0" y1="214.0" x2="709.0" y2="214.0" stroke="#d1d5db" stroke-width="1"/><line x1="577.0" y1="196.0" x2="577.0" y2="211.0" stroke="#1f2937" stroke-width="1.8"/><line x1="589.0" y1="196.0" x2="589.0" y2="211.0" stroke="#1f2937" stroke-width="1.8"/><rect x="735.0" y="66.0" width="224.0" height="214.0" rx="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.3"/><text x="745.0" y="85.0" font-size="12" font-weight="bold" fill="#1e3a8a" text-anchor="start">Histogram</text><text x="745.0" y="240.0" font-size="10.2" font-weight="normal" fill="#6b7280" text-anchor="start">Shows how data are distributed across</text><text x="745.0" y="252.2" font-size="10.2" font-weight="normal" fill="#6b7280" text-anchor="start">ranges (discrete data). Reveals shape,</text><text x="745.0" y="264.5" font-size="10.2" font-weight="normal" fill="#6b7280" text-anchor="start">spread and outliers.</text><rect x="755.0" y="201.3" width="23.3" height="14.7" rx="2" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/><rect x="781.3" y="180.3" width="23.3" height="35.7" rx="2" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/><rect x="807.6" y="150.9" width="23.3" height="65.1" rx="2" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/><rect x="833.9" y="123.6" width="23.3" height="92.4" rx="2" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/><rect x="860.1" y="153.0" width="23.3" height="63.0" rx="2" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/><rect x="886.4" y="184.5" width="23.3" height="31.5" rx="2" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/><rect x="912.7" y="203.4" width="23.3" height="12.6" rx="2" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/><line x1="753.0" y1="216.0" x2="943.0" y2="216.0" stroke="#6b7280" stroke-width="1.4"/><rect x="21.0" y="294.0" width="224.0" height="214.0" rx="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.3"/><text x="31.0" y="313.0" font-size="12" font-weight="bold" fill="#1e3a8a" text-anchor="start">Pareto chart [Beyond PMBOK 8]</text><text x="31.0" y="468.0" font-size="10.2" font-weight="normal" fill="#6b7280" text-anchor="start">Ranks causes by frequency with a</text><text x="31.0" y="480.2" font-size="10.2" font-weight="normal" fill="#6b7280" text-anchor="start">cumulative line (80/20 idea). Fix the vital few</text><text x="31.0" y="492.5" font-size="10.2" font-weight="normal" fill="#6b7280" text-anchor="start">first.</text><rect x="41.0" y="345.4" width="30.0" height="98.6" rx="2" fill="#fef3c7" stroke="#d97706" stroke-width="1.2"/><circle cx="56.0" cy="386.0" r="3" fill="#dc2626" stroke="#ffffff" stroke-width="1"/><rect x="77.0" y="403.2" width="30.0" height="40.8" rx="2" fill="#fef3c7" stroke="#d97706" stroke-width="1.2"/><circle cx="92.0" cy="362.0" r="3" fill="#dc2626" stroke="#ffffff" stroke-width="1"/><line x1="56.0" y1="386.0" x2="92.0" y2="362.0" stroke="#dc2626" stroke-width="1.6"/><rect x="113.0" y="427.0" width="30.0" height="17.0" rx="2" fill="#fef3c7" stroke="#d97706" stroke-width="1.2"/><circle cx="128.0" cy="352.0" r="3" fill="#dc2626" stroke="#ffffff" stroke-width="1"/><line x1="92.0" y1="362.0" x2="128.0" y2="352.0" stroke="#dc2626" stroke-width="1.6"/><rect x="149.0" y="435.5" width="30.0" height="8.5" rx="2" fill="#fef3c7" stroke="#d97706" stroke-width="1.2"/><circle cx="164.0" cy="347.0" r="3" fill="#dc2626" stroke="#ffffff" stroke-width="1"/><line x1="128.0" y1="352.0" x2="164.0" y2="347.0" stroke="#dc2626" stroke-width="1.6"/><rect x="185.0" y="438.9" width="30.0" height="5.1" rx="2" fill="#fef3c7" stroke="#d97706" stroke-width="1.2"/><circle cx="200.0" cy="344.0" r="3" fill="#dc2626" stroke="#ffffff" stroke-width="1"/><line x1="164.0" y1="347.0" x2="200.0" y2="344.0" stroke="#dc2626" stroke-width="1.6"/><line x1="37.0" y1="444.0" x2="233.0" y2="444.0" stroke="#6b7280" stroke-width="1.4"/><rect x="259.0" y="294.0" width="224.0" height="214.0" rx="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.3"/><text x="269.0" y="313.0" font-size="12" font-weight="bold" fill="#1e3a8a" text-anchor="start">Scatter diagram [Beyond PMBOK 8]</text><text x="269.0" y="468.0" font-size="10.2" font-weight="normal" fill="#6b7280" text-anchor="start">Plots two variables to see correlation</text><text x="269.0" y="480.2" font-size="10.2" font-weight="normal" fill="#6b7280" text-anchor="start">(positive, negative or none). Correlation is</text><text x="269.0" y="492.5" font-size="10.2" font-weight="normal" fill="#6b7280" text-anchor="start">not proof of cause.</text><circle cx="296.4" cy="425.1" r="3.4" fill="#2563eb" stroke="#ffffff" stroke-width="1"/><circle cx="310.3" cy="431.4" r="3.4" fill="#2563eb" stroke="#ffffff" stroke-width="1"/><circle cx="322.5" cy="410.4" r="3.4" fill="#2563eb" stroke="#ffffff" stroke-width="1"/><circle cx="334.7" cy="414.6" r="3.4" fill="#2563eb" stroke="#ffffff" stroke-width="1"/><circle cx="348.6" cy="396.8" r="3.4" fill="#2563eb" stroke="#ffffff" stroke-width="1"/><circle cx="362.5" cy="399.9" r="3.4" fill="#2563eb" stroke="#ffffff" stroke-width="1"/><circle cx="374.7" cy="381.0" r="3.4" fill="#2563eb" stroke="#ffffff" stroke-width="1"/><circle cx="386.9" cy="386.2" r="3.4" fill="#2563eb" stroke="#ffffff" stroke-width="1"/><circle cx="400.8" cy="368.4" r="3.4" fill="#2563eb" stroke="#ffffff" stroke-width="1"/><circle cx="418.2" cy="370.5" r="3.4" fill="#2563eb" stroke="#ffffff" stroke-width="1"/><circle cx="432.1" cy="353.7" r="3.4" fill="#2563eb" stroke="#ffffff" stroke-width="1"/><line x1="283.0" y1="434.0" x2="459.0" y2="346.0" stroke="#dc2626" stroke-width="1.6" stroke-dasharray="5 3"/><line x1="277.0" y1="444.0" x2="471.0" y2="444.0" stroke="#6b7280" stroke-width="1.4"/><line x1="277.0" y1="340.0" x2="277.0" y2="444.0" stroke="#6b7280" stroke-width="1.4"/><rect x="497.0" y="294.0" width="224.0" height="214.0" rx="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.3"/><text x="507.0" y="313.0" font-size="12" font-weight="bold" fill="#1e3a8a" text-anchor="start">Control chart</text><text x="507.0" y="468.0" font-size="10.2" font-weight="normal" fill="#6b7280" text-anchor="start">Shows whether a process is stable and</text><text x="507.0" y="480.2" font-size="10.2" font-weight="normal" fill="#6b7280" text-anchor="start">predictable, with control limits from the data</text><text x="507.0" y="492.5" font-size="10.2" font-weight="normal" fill="#6b7280" text-anchor="start">(see the next figure).</text><line x1="511.0" y1="350.0" x2="707.0" y2="350.0" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="5 3"/><line x1="511.0" y1="390.0" x2="707.0" y2="390.0" stroke="#16a34a" stroke-width="1.5"/><line x1="511.0" y1="430.0" x2="707.0" y2="430.0" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="5 3"/><polyline points="517.0,390.0 532.5,374.0 548.0,402.0 563.5,382.0 579.0,410.0 594.5,370.0 610.0,398.0 625.5,378.0 641.0,406.0 656.5,386.0 672.0,400.0 687.5,372.0" fill="none" stroke="#2563eb" stroke-width="1.8" stroke-linejoin="round"/><circle cx="517.0" cy="390.0" r="2.6" fill="#2563eb" stroke="#ffffff" stroke-width="1"/><circle cx="532.5" cy="374.0" r="2.6" fill="#2563eb" stroke="#ffffff" stroke-width="1"/><circle cx="548.0" cy="402.0" r="2.6" fill="#2563eb" stroke="#ffffff" stroke-width="1"/><circle cx="563.5" cy="382.0" r="2.6" fill="#2563eb" stroke="#ffffff" stroke-width="1"/><circle cx="579.0" cy="410.0" r="2.6" fill="#2563eb" stroke="#ffffff" stroke-width="1"/><circle cx="594.5" cy="370.0" r="2.6" fill="#2563eb" stroke="#ffffff" stroke-width="1"/><circle cx="610.0" cy="398.0" r="2.6" fill="#2563eb" stroke="#ffffff" stroke-width="1"/><circle cx="625.5" cy="378.0" r="2.6" fill="#2563eb" stroke="#ffffff" stroke-width="1"/><circle cx="641.0" cy="406.0" r="2.6" fill="#2563eb" stroke="#ffffff" stroke-width="1"/><circle cx="656.5" cy="386.0" r="2.6" fill="#2563eb" stroke="#ffffff" stroke-width="1"/><circle cx="672.0" cy="400.0" r="2.6" fill="#2563eb" stroke="#ffffff" stroke-width="1"/><circle cx="687.5" cy="372.0" r="2.6" fill="#2563eb" stroke="#ffffff" stroke-width="1"/><text x="705.0" y="346.0" font-size="9.5" font-weight="bold" fill="#991b1b" text-anchor="end">UCL</text><text x="705.0" y="444.0" font-size="9.5" font-weight="bold" fill="#991b1b" text-anchor="end">LCL</text><rect x="735.0" y="294.0" width="224.0" height="214.0" rx="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.3"/><text x="745.0" y="313.0" font-size="12" font-weight="bold" fill="#1e3a8a" text-anchor="start">Affinity diagram</text><text x="745.0" y="468.0" font-size="10.2" font-weight="normal" fill="#6b7280" text-anchor="start">Groups many ideas or causes into related</text><text x="745.0" y="480.2" font-size="10.2" font-weight="normal" fill="#6b7280" text-anchor="start">clusters for review. Use after brainstorming.</text><rect x="747.0" y="332.0" width="62.0" height="22.0" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="778.0" y="346.2" font-size="9.8" font-weight="bold" fill="#1e3a8a" text-anchor="middle">Process</text><rect x="751.0" y="360.0" width="54.0" height="20.0" rx="3" fill="#dbeafe" stroke="#2563eb" stroke-width="1"/><rect x="751.0" y="386.0" width="54.0" height="20.0" rx="3" fill="#dbeafe" stroke="#2563eb" stroke-width="1"/><rect x="751.0" y="412.0" width="54.0" height="20.0" rx="3" fill="#dbeafe" stroke="#2563eb" stroke-width="1"/><rect x="815.0" y="332.0" width="62.0" height="22.0" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="846.0" y="346.2" font-size="9.8" font-weight="bold" fill="#14532d" text-anchor="middle">People</text><rect x="819.0" y="360.0" width="54.0" height="20.0" rx="3" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/><rect x="819.0" y="386.0" width="54.0" height="20.0" rx="3" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/><rect x="883.0" y="332.0" width="62.0" height="22.0" rx="4" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="914.0" y="346.2" font-size="9.8" font-weight="bold" fill="#78350f" text-anchor="middle">Tools</text><rect x="887.0" y="360.0" width="54.0" height="20.0" rx="3" fill="#fef3c7" stroke="#d97706" stroke-width="1"/><rect x="887.0" y="386.0" width="54.0" height="20.0" rx="3" fill="#fef3c7" stroke="#d97706" stroke-width="1"/><rect x="887.0" y="412.0" width="54.0" height="20.0" rx="3" fill="#fef3c7" stroke="#d97706" stroke-width="1"/></svg>