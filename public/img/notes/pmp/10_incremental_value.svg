<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 440" width="920" height="440" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">Incremental value delivery versus a single final delivery</title><desc id="d">Cumulative value over time: a big-bang delivery produces no value until the end; incremental delivery realizes value earlier and allows feedback.</desc><defs></defs><rect x="0.75" y="0.75" width="918.5" height="438.5" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><text x="20.0" y="28.0" font-size="18" font-weight="bold" fill="#1f2937" text-anchor="start">Why deliver value incrementally</text><text x="20.0" y="48.0" font-size="12" font-weight="normal" fill="#6b7280" text-anchor="start">Cumulative value over time (illustrative): earlier value, earlier feedback, and the option to stop when enough value is reached</text><line x1="80.0" y1="70.0" x2="80.0" y2="350.0" stroke="#1f2937" stroke-width="2"/><line x1="80.0" y1="350.0" x2="860.0" y2="350.0" stroke="#1f2937" stroke-width="2"/><text x="70.0" y="78.0" font-size="11.5" font-weight="bold" fill="#6b7280" text-anchor="end">High</text><text x="70.0" y="350.0" font-size="11.5" font-weight="bold" fill="#6b7280" text-anchor="end">Low</text><text x="860.0" y="370.0" font-size="12" font-weight="bold" fill="#1f2937" text-anchor="end">Time</text><text x="28.0" y="210.0" transform="rotate(-90 28.0 210.0)" font-size="12" font-weight="bold" fill="#1f2937" text-anchor="middle">Cumulative value delivered</text><polyline points="80.0,350.0 782.0,350.0 782.0,116.0 860.0,116.0" fill="none" stroke="#9ca3af" stroke-width="3.4" stroke-linejoin="round"/><polyline points="80.0,350.0 275.0,350.0 275.0,272.0 470.0,272.0 470.0,207.0 665.0,207.0 665.0,147.2 782.0,147.2 782.0,95.2 860.0,95.2" fill="none" stroke="#16a34a" stroke-width="3.6" stroke-linejoin="round"/><circle cx="275.0" cy="272.0" r="6" fill="#16a34a" stroke="#14532d" stroke-width="1.5"/><text x="279.0" y="260.0" font-size="11" font-weight="bold" fill="#14532d" text-anchor="start">MVP / first release</text><circle cx="470.0" cy="207.0" r="6" fill="#16a34a" stroke="#14532d" stroke-width="1.5"/><text x="474.0" y="195.0" font-size="11" font-weight="bold" fill="#14532d" text-anchor="start">Increment 2</text><circle cx="665.0" cy="147.2" r="6" fill="#16a34a" stroke="#14532d" stroke-width="1.5"/><text x="669.0" y="135.2" font-size="11" font-weight="bold" fill="#14532d" text-anchor="start">Increment 3</text><circle cx="782.0" cy="95.2" r="6" fill="#16a34a" stroke="#14532d" stroke-width="1.5"/><text x="786.0" y="83.2" font-size="11" font-weight="bold" fill="#14532d" text-anchor="start">Increment 4</text><text x="792.0" y="233.0" font-size="11.5" font-weight="bold" fill="#4b5563" text-anchor="start">single final delivery</text><text x="95.6" y="342.0" font-size="11.5" font-weight="bold" fill="#4b5563" text-anchor="start">no value yet (big bang)</text><polygon points="275.0,272.0 782.0,147.2 782.0,350.0 275.0,350.0" fill="#16a34a" opacity="0.07"/><rect x="80.0" y="376.0" width="780.0" height="48.0" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.6"/><text x="470.0" y="396.4" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">Value arrives earlier, stakeholders give feedback on working increments, risks surface sooner, and the sponsor can stop when remaining value</text><text x="470.0" y="411.4" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">no longer justifies the cost. Not every deliverable can be split; use incremental delivery where it adds value.</text></svg>