<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 520" width="980" height="520" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">Kano model: curves and evaluation table</title><desc id="d">Four curves show customer satisfaction against how fully a feature is implemented: must-be, one-dimensional, attractive and indifferent. A table maps survey answers (feature present and feature absent) to a category.</desc><defs><marker id="ah0" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker></defs><rect x="0.75" y="0.75" width="978.5" height="518.5" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><text x="20.0" y="28.0" font-size="18" font-weight="bold" fill="#1f2937" text-anchor="start">Kano model: how features affect satisfaction</text><text x="20.0" y="48.0" font-size="12" font-weight="normal" fill="#6b7280" text-anchor="start">Survey each feature twice: how do you feel if it is present, and how if it is absent?</text><rect x="90.0" y="86.0" width="350.0" height="290.0" rx="4" fill="#ffffff" stroke="#d1d5db" stroke-width="1.2"/><line x1="90.0" y1="231.0" x2="440.0" y2="231.0" stroke="#9ca3af" stroke-width="1.4" stroke-dasharray="5 4"/><line x1="90.0" y1="376.0" x2="454.0" y2="376.0" stroke="#1f2937" stroke-width="1.8" marker-end="url(#ah0)"/><line x1="90.0" y1="376.0" x2="90.0" y2="72.0" stroke="#1f2937" stroke-width="1.8" marker-end="url(#ah0)"/><text x="265.0" y="400.0" font-size="12" font-weight="bold" fill="#1f2937" text-anchor="middle">Feature: not implemented  →  fully implemented</text><text x="34.0" y="231.0" transform="rotate(-90 34 231.0)" font-size="12" font-weight="bold" fill="#1f2937" text-anchor="middle">Customer satisfaction</text><text x="84.0" y="96.0" font-size="10.5" font-weight="normal" fill="#6b7280" text-anchor="end">Delighted</text><text x="84.0" y="374.0" font-size="10.5" font-weight="normal" fill="#6b