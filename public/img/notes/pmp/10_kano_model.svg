 238.8,231.0 247.5,231.0 256.2,231.0 265.0,231.0 273.8,231.0 282.5,231.0 291.2,231.0 300.0,231.0 308.8,231.0 317.5,231.0 326.2,231.0 335.0,231.0 343.8,231.0 352.5,231.0 361.2,231.0 370.0,231.0 378.8,231.0 387.5,231.0 396.2,231.0 405.0,231.0 413.8,231.0 422.5,231.0 431.2,231.0 440.0,231.0" fill="none" stroke="#6b7280" stroke-width="2.4" stroke-dasharray="6 4" stroke-linejoin="round"/><line x1="104" y1="102" x2="132" y2="102" stroke="#16a34a" stroke-width="3"/><text x="140.0" y="106.0" font-size="11.5" font-weight="bold" fill="#374151" text-anchor="start">A  Attractive (delighter)</text><line x1="104" y1="122" x2="132" y2="122" stroke="#2563eb" stroke-width="3"/><text x="140.0" y="126.0" font-size="11.5" font-weight="bold" fill="#374151" text-anchor="start">O  One-dimensional (performance)</text><line x1="104" y1="142" x2="132" y2="142" stroke="#dc2626" stroke-width="3"/><text x="140.0" y="146.0" font-size="11.5" font-weight="bold" fill="#374151" text-anchor="start">M  Must-be (basic)</text><line x1="104" y1="162" x2="132" y2="162" stroke="#6b7280" stroke-width="2.4" stroke-dasharray="6 4"/><text x="140.0" y="166.0" font-size="11.5" font-weight="bold" fill="#374151" text-anchor="start">I  Indifferent</text><text x="792.0" y="92.0" font-size="12" font-weight="bold" fill="#1f2937" text-anchor="middle">If the feature is ABSENT, I feel...</text><rect x="520.0" y="100.0" width="112.0" height="34.0" rx="8" fill="#1e3a8a" stroke="#1e3a8a" stroke-width="1.6"/><text x="576.0" y="113.8" font-size="10.5" font-weight="bold" fill="#ffffff" text-anchor="middle">If PRESENT, I</text><text x="576.0" y="127.0" font-size="10.5" font-weight="bold" fill="#ffffff" text-anchor="middle">feel...</text><rect x="632.0" y="100.0" width="64.0" height="34.0" rx="8" fill="#1e3a8a" stroke="#1e3a8a" stroke-width="1.6"/><text x="664.0" y="120.6" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">Like</text><rect x="696.0" y="100.0" width="64.0" height="34.0" rx="8" fill="#1e3a8a" stroke="#1e3a8a" stroke-width="1.6"/><text x="728.0" y="120.6" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">Expect</text><rect x="760.0" y="100.0" width="64.0" height="34.0" rx="8" fill="#1e3a8a" stroke="#1e3a8a" stroke-width="1.6"/><text x="792.0" y="120.6" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">Neutral</text><rect x="824.0" y="100.0" width="64.0" height="34.0" rx="8" fill="#1e3a8a" stroke="#1e3a8a" stroke-width="1.6"/><text x="856.0" y="120.6" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">Live with</text><rect x="888.0" y="100.0" width="64.0" height="34.0" rx="8" fill="#1e3a8a" stroke="#1e3a8a" stroke-width="1.6"/><text x="920.0" y="120.6" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">Dislike</text><rect x="520.0" y="134.0" width="112.0" height="34.0" rx="8" fill="#1e3a8a" stroke="#1e3a8a" stroke-width="1.6"/><text x="576.0" y="154.6" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">Like</text><rect x="632.0" y="134.0" width="64.0" height="34.0" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.6"/><text x="664.0" y="155.6" font-size="14" font-weight="bold" fill="#4c1d95" text-anchor="middle">Q</text><rect x="696.0" y="134.0" width="64.0" height="34.0" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="728.0" y="155.6" font-size="14" font-weight="bold" fill="#14532d" text-anchor="middle">A</text><rect x="760.0" y="134.0" width="64.0" height="34.0" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="792.0" y="155.6" font-size="14" font-weight="bold" fill="#14532d" text-anchor="middle">A</text><rect x="824.0" y="134.0" width="64.0" height="34.0" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="856.0" y="155.6" font-size="14" font-weight="bold" fill="#14532d" text-anchor="middle">A</text><rect x="888.0" y="134.0" width="64.0" height="34.0" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="920.0" y="155.6" font-size="14" font-weight="bold" fill="#1e3a8a" text-anchor="middle">O</text><rect x="520.0" y="168.0" width="112.0" height="34.0" rx="8" fill="#1e3a8a" stroke="#1e3a8a" stroke-width="1.6"/><text x="576.0" y="188.6" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">Expect</text><rect x="632.0" y="168.0" width="64.0" height="34.0" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="664.0" y="189.6" font-size="14" font-weight="bold" fill="#78350f" text-anchor="middle">R</text><rect x="696.0" y="168.0" width="64.0" height="34.0" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.6"/><text x="728.0" y="189.6" font-size="14" font-weight="bold" fill="#374151" text-anchor="middle">I</text><rect x="760.0" y="168.0" width="64.0" height="34.0" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.6"/><text x="792.0" y="189.6" font-size="14" font-weight="bold" fill="#374151" text-anchor="middle">I</text><rect x="824.0" y="168.0" width="64.0" height="34.0" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.6"/><text x="856.0" y="189.6" font-size="14" font-weight="bold" fill="#374151" text-anchor="middle">I</text><rect x="888.0" y="168.0" width="64.0" height="34.0" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.6"/><text x="920.0" y="189.6" font-size="14" font-weight="bold" fill="#7f1d1d" text-anchor="middle">M</text><rect x="520.0" y="202.0" width="112.0" height="34.0" rx="8" fill="#1e3a8a" stroke="#1e3a8a" stroke-width="1.6"/><text x="576.0" y="222.6" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">Neutral</text><rect x="632.0" y="202.0" width="64.0" height="34.0" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="664.0" y="223.6" font-size="14" font-weight="bold" fill="#78350f" text-anchor="middle">R</text><rect x="696.0" y="202.0" width="64.0" height="34.0" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.6"/><text x="728.0" y="223.6" font-size="14" font-weight="bold" fill="#374151" text-anchor="middle">I</text><rect x="760.0" y="202.0" width="64.0" height="34.0" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.6"/><text x="792.0" y="223.6" font-size="14" font-weight="bold" fill="#374151" text-anchor="middle">I</text><rect x="824.0" y="202.0" width="64.0" height="34.0" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.6"/><text x="856.0" y="223.6" font-size="14" font-weight="bold" fill="#374151" text-anchor="middle">I</text><rect x="888.0" y="202.0" width="64.0" height="34.0" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.6"/><text x="920.0" y="223.6" font-size="14" font-weight="bold" fill="#7f1d1d" text-anchor="middle">M</text><rect x="520.0" y="236.0" width="112.0" height="34.0" rx="8" fill="#1e3a8a" stroke="#1e3a8a" stroke-width="1.6"/><text x="576.0" y="256.6" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">Live with</text><rect x="632.0" y="236.0" width="64.0" height="34.0" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="664.0" y="257.6" font-size="14" font-weight="bold" fill="#78350f" text-anchor="middle">R</text><rect x="696.0" y="236.0" width="64.0" height="34.0" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.6"/><text x="728.0" y="257.6" font-size="14" font-weight="bold" fill="#374151" text-anchor="middle">I</text><rect x="760.0" y="236.0" width="64.0" height="34.0" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.6"/><text x="792.0" y="257.6" font-size="14" font-weight="bold" fill="#374151" text-anchor="middle">I</text><rect x="824.0" y="236.0" width="64.0" height="34.0" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.6"/><text x="856.0" y="257.6" font-size="14" font-weight="bold" fill="#374151" text-anchor="middle">I</text><rect x="888.0" y="236.0" width="64.0" height="34.0" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.6"/><text x="920.0" y="257.6" font-size="14" font-weight="bold" fill="#7f1d1d" text-anchor="middle">M</text><rect x="520.0" y="270.0" width="112.0" height="34.0" rx="8" fill="#1e3a8a" stroke="#1e3a8a" stroke-width="1.6"/><text x="576.0" y="290.6" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">Dislike</text><rect x="632.0" y="270.0" width="64.0" height="34.0" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="664.0" y="291.6" font-size="14" font-weight="bold" fill="#78350f" text-anchor="middle">R</text><rect x="696.0" y="270.0" width="64.0" height="34.0" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="728.0" y="291.6" font-size="14" font-weight="bold" fill="#78350f" text-anchor="middle">R</text><rect x="760.0" y="270.0" width="64.0" height="34.0" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="792.0" y="291.6" font-size="14" font-weight="bold" fill="#78350f" text-anchor="middle">R</text><rect x="824.0" y="270.0" width="64.0" height="34.0" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="856.0" y="291.6" font-size="14" font-weight="bold" fill="#78350f" text-anchor="middle">R</text><rect x="888.0" y="270.0" width="64.0" height="34.0" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.6"/><text x="920.0" y="291.6" font-size="14" font-weight="bold" fill="#4c1d95" text-anchor="middle">Q</text><text x="520.0" y="326.0" font-size="11.5" font-weight="normal" fill="#1f2937" text-anchor="start">A attractive · O one-dimensional · M must-be · I indifferent</text><text x="520.0" y="344.0" font-size="11.5" font-weight="normal" fill="#1f2937" text-anchor="start">R reverse (they prefer it absent) · Q questionable (contradictory answers)</text><rect x="520.0" y="372.0" width="440.0" height="62.0" rx="8" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.4"/><text x="534.0" y="392.0" font-size="11.5" font-weight="normal" fill="#1f2937" text-anchor="start">Example: present = 'I can live with it', absent = 'I dislike it' gives row Live with,</text><text x="534.0" y="406.0" font-size="11.5" font-weight="normal" fill="#1f2937" text-anchor="start">column Dislike: M (must-be). Customers take it for granted, but its absence</text><text x="534.0" y="420.1" font-size="11.5" font-weight="normal" fill="#1f2937" text-anchor="start">hurts.</text><rect x="20.0" y="452.0" width="940.0" height="50.0" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.6"/><text x="490.0" y="473.4" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">Priority: M first (without them the product fails), then O (more is better), then A (cheap delighters), and skip I and R. Satisfaction needs and expectations drift over time:</text><text x="490.0" y="488.4" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">today's delighter becomes tomorrow's must-be.</text></svg>