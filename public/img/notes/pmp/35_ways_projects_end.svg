<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 598" width="980" height="598" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">Ways a project can end</title><desc id="d">Normal completion, phase or iteration closure, early termination because value was achieved, early termination because value is no longer achievable or the need, resources or legal basis is gone, and contract completion or termination. In every case closure is formal: criteria, acceptance, transition, final activities and authorization by the sponsor or governance.</desc><defs></defs><rect x="0.75" y="0.75" width="978.5" height="596.5" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><text x="20.0" y="28.0" font-size="18" font-weight="bold" fill="#1f2937" text-anchor="start">Ways a project ends</text><text x="20.0" y="48.0" font-size="12" font-weight="normal" fill="#6b7280" text-anchor="start">Every ending closes formally; only the trigger and the emphasis differ</text><text x="28.0" y="76.0" font-size="11.5" font-weight="bold" fill="#6b7280" text-anchor="start">How it ends</text><text x="238.0" y="76.0" font-size="11.5" font-weight="bold" fill="#6b7280" text-anchor="start">Trigger</text><text x="498.0" y="76.0" font-size="11.5" font-weight="bold" fill="#6b7280" text-anchor="start">What still must happen</text><rect x="22.0" y="86.0" width="936.0" height="78.0" rx="10" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/><rect x="22.0" y="86.0" width="200.0" height="78.0" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/><text x="34.0" y="129.0" font-size="12" font-weight="bold" fill="#14532d" text-anchor="start">Normal completion</text><text x="240.0" y="107.0" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">Objectives achieved; deliverables accepted</text><text x="500.0" y="107.0" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">Complete the closing activities; transition to operations; archive; authorize completion;</text><text x="500.0" y="120.5" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">benefits tracked by the owner</text><rect x="22.0" y="172.0" width="936.0" height="78.0" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/><rect x="22.0" y="172.0" width="200.0" height="78.0" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><text x="34.0" y="215.0" font-size="12" font-weight="bold" fill="#1e3a8a" text-anchor="start">Phase, release or iteration</text><text x="240.0" y="193.0" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">A phase, release or iteration finishes</text><text x="500.0" y="193.0" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">Formal acceptance and gate approval; lessons and open risks pass to the next phase;</text><text x="500.0" y="206.5" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">adaptive: retrospective and backlog handed to the product owner</text><rect x="22.0" y="258.0" width="936.0" height="78.0" rx="10" fill="#ffffff" stroke="#0d9488" stroke-width="1.5"/><rect x="22.0" y="258.0" width="200.0" height="78.0" rx="10" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.5"/><text x="34.0" y="293.5" font-size="12" font-weight="bold" fill="#134e4a" text-anchor="start">Early termination: value</text><text x="34.0" y="308.5" font-size="12" font-weight="bold" fill="#134e4a" text-anchor="start">achieved</text><text x="240.0" y="279.0" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">The desired value impact is reached before the</text><text x="240.0" y="292.5" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">schedule or budget is used up</text><text x="500.0" y="279.0" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">Confirm the value with the sponsor; transition what exists; release unused funds and</text><text x="500.0" y="292.5" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">resources; close formally</text><rect x="22.0" y="344.0" width="936.0" height="78.0" rx="10" fill="#ffffff" stroke="#dc2626" stroke-width="1.5"/><rect x="22.0" y="344.0" width="200.0" height="78.0" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/><text x="34.0" y="379.5" font-size="12" font-weight="bold" fill="#7f1d1d" text-anchor="start">Early termination: value not</text><text x="34.0" y="394.5" font-size="12" font-weight="bold" fill="#7f1d1d" text-anchor="start">achievable</text><text x="240.0" y="365.0" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">Objectives cannot be met; the need is gone</text><text x="240.0" y="378.5" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">because of strategy, priority or external change;</text><text x="240.0" y="392.0" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">resources are exhausted; legal or regulatory</text><text x="240.0" y="405.5" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">reasons</text><text x="500.0" y="365.0" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">Governance decides; document delivered work, the reasons and the lessons; settle</text><text x="500.0" y="378.5" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">contracts; release people; ignore sunk costs in the decision</text><rect x="22.0" y="430.0" width="936.0" height="78.0" rx="10" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/><rect x="22.0" y="430.0" width="200.0" height="78.0" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/><text x="34.0" y="465.5" font-size="12" font-weight="bold" fill="#4c1d95" text-anchor="start">Contract completion or</text><text x="34.0" y="480.5" font-size="12" font-weight="bold" fill="#4c1d95" text-anchor="start">termination</text><text x="240.0" y="451.0" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">The seller's work is complete, or the contract is</text><text x="240.0" y="464.5" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">ended</text><text x="500.0" y="451.0" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">Formal written acceptance; claims, guarantees, warranties and invoices finalized; disputes</text><text x="500.0" y="464.5" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">resolved or referred; records archived</text><rect x="22.0" y="518.0" width="936.0" height="50.8" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/><text x="34.0" y="538.0" font-size="11" font-weight="bold" fill="#78350f" text-anchor="start">A canceled or terminated project still needs formal closure: finishing it only to save sunk costs ignores the decision, and walking away leaves records, contracts and people</text><text x="34.0" y="551.4" font-size="11" font-weight="bold" fill="#78350f" text-anchor="start">unresolved.</text></svg>