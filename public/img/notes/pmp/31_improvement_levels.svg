<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 600" width="980" height="600" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">Improvement happens at four levels</title><desc id="d">Level one the work, reviewed at sprint reviews and milestones; level two the team's process, improved through retrospectives and after-action reviews; level three the improvement process itself, inspected and adapted periodically; level four the organization, improved through updates to organizational process assets by the PMO or process owner.</desc><defs></defs><rect x="0.75" y="0.75" width="978.5" height="598.5" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><text x="20.0" y="28.0" font-size="18" font-weight="bold" fill="#1f2937" text-anchor="start">Continuous improvement works at four levels</text><text x="20.0" y="48.0" font-size="12" font-weight="normal" fill="#6b7280" text-anchor="start">Improve the work, the way the team works, the way it improves, and the organization's standards</text><text x="26.0" y="76.0" font-size="11.5" font-weight="bold" fill="#6b7280" text-anchor="start">Level</text><text x="202.0" y="76.0" font-size="11.5" font-weight="bold" fill="#6b7280" text-anchor="start">Feedback event</text><text x="382.0" y="76.0" font-size="11.5" font-weight="bold" fill="#6b7280" text-anchor="start">Key question</text><text x="602.0" y="76.0" font-size="11.5" font-weight="bold" fill="#6b7280" text-anchor="start">Typical output</text><text x="842.0" y="76.0" font-size="11.5" font-weight="bold" fill="#6b7280" text-anchor="start">Who owns it</text><rect x="22.0" y="86.0" width="936.0" height="88.0" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="1.6"/><rect x="22.0" y="86.0" width="166.0" height="88.0" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="32.0" y="134.0" font-size="12.5" font-weight="bold" fill="#1e3a8a" text-anchor="start">1 The work</text><text x="202.0" y="108.0" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="start">Sprint review, demo, milestone</text><text x="202.0" y="121.8" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="start">and quality reviews</text><text x="382.0" y="108.0" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="start">Are we building the right thing, to the</text><text x="382.0" y="121.8" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="start">agreed quality?</text><text x="602.0" y="108.0" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="start">Backlog reordered, defects fixed, plan</text><text x="602.0" y="121.8" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="start">adjusted</text><text x="842.0" y="108.0" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="start">Team and product</text><text x="842.0" y="121.8" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="start">owner</text><rect x="22.0" y="182.0" width="936.0" height="88.0" rx="10" fill="#ffffff" stroke="#16a34a" stroke-width="1.6"/><rect x="22.0" y="182.0" width="166.0" height="88.0" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="32.0" y="230.0" font-size="12.5" font-weight="bold" fill="#14532d" text-anchor="start">2 The team's process</text><text x="202.0" y="204.0" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="start">Retrospective (at least every</text><text x="202.0" y="217.8" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="start">iteration), after-action review</text><text x="382.0" y="204.0" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="start">How do we work? What helps us, what</text><text x="382.0" y="217.8" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="start">slows us?</text><text x="602.0" y="204.0" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="start">A few actions in the next backlog or plan;</text><text x="602.0" y="217.8" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="start">working agreement updated</text><text x="842.0" y="204.0" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="start">Team, with the PM or</text><text x="842.0" y="217.8" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="start">scrum master</text><rect x="22.0" y="278.0" width="936.0" height="88.0" rx="10" fill="#ffffff" stroke="#d97706" stroke-width="1.6"/><rect x="22.0" y="278.0" width="166.0" height="88.0" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="32.0" y="318.0" font-size="12.5" font-weight="bold" fill="#78350f" text-anchor="start">3 The improvement</text><text x="32.0" y="333.6" font-size="12.5" font-weight="bold" fill="#78350f" text-anchor="start">process itself</text><text x="202.0" y="300.0" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="start">Periodic check of the</text><text x="202.0" y="313.8" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="start">retrospectives; cross-team</text><text x="202.0" y="327.5" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="start">retrospective for shared</text><text x="202.0" y="341.2" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="start">problems</text><text x="382.0" y="300.0" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="start">Do actions get done, and do results</text><text x="382.0" y="313.8" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="start">improve? Has the format gone stale?</text><text x="602.0" y="300.0" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="start">New formats, follow-through tracking, data</text><text x="602.0" y="313.8" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="start">on effect, cross-team fixes</text><text x="842.0" y="300.0" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="start">Team, PM and an</text><text x="842.0" y="313.8" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="start">internal sponsor</text><rect x="22.0" y="374.0" width="936.0" height="88.0" rx="10" fill="#ffffff" stroke="#7c3aed" stroke-width="1.6"/><rect x="22.0" y="374.0" width="166.0" height="88.0" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.6"/><text x="32.0" y="422.0" font-size="12.5" font-weight="bold" fill="#4c1d95" text-anchor="start">4 The organization</text><text x="202.0" y="396.0" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="start">Phase and project close, audits,</text><text x="202.0" y="409.8" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="start">PMO reviews, communities of</text><text x="202.0" y="423.5" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="start">practice</text><text x="382.0" y="396.0" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="start">Should this become the standard?</text><text x="602.0" y="396.0" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="start">OPA updates: templates, checklists,</text><text x="602.0" y="409.8" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="start">procedures, repository</text><text x="842.0" y="396.0" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="start">PMO or process</text><text x="842.0" y="409.8" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="start">owner</text><rect x="22.0" y="472.0" width="936.0" height="50.8" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/><text x="34.0" y="492.0" font-size="11" font-weight="bold" fill="#78350f" text-anchor="start">Proven improvements move down the table into the organization's standards; the standards then flow back into every project. Skipping level 3 is the classic failure: more</text><text x="34.0" y="505.4" font-size="11" font-weight="bold" fill="#78350f" text-anchor="start">retrospectives, same results.</text><rect x="22.0" y="532.8" width="936.0" height="50.8" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/><text x="34.0" y="552.8" font-size="11" font-weight="bold" fill="#7f1d1d" text-anchor="start">Common failures: long action lists nobody completes; the same retrospective format for years; improvements left in notes or a personal drive; standards never updated, so</text><text x="34.0" y="566.3" font-size="11" font-weight="bold" fill="#7f1d1d" text-anchor="start">each team improvises.</text></svg>