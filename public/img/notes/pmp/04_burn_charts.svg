<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 440" width="980" height="440" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">Burndown and burnup charts</title><desc id="d">Left: iteration burndown with ideal line, actual remaining work and forecast trend. Right: burnup with a total-scope line that steps up when scope is added and a completed-work line.</desc><defs></defs><rect x="0.75" y="0.75" width="978.5" height="438.5" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><text x="20.0" y="28.0" font-size="18" font-weight="bold" fill="#1f2937" text-anchor="start">Burndown vs burnup: what each one shows</text><text x="20.0" y="48.0" font-size="12" font-weight="normal" fill="#6b7280" text-anchor="start">Burndown = work remaining vs time. Burnup = work completed vs total scope (so scope growth is visible)</text><text x="250.0" y="78.0" font-size="13" font-weight="bold" fill="#1f2937" text-anchor="middle">Iteration burndown (story points remaining)</text><line x1="80.0" y1="90.0" x2="80.0" y2="320.0" stroke="#1f2937" stroke-width="1.8"/><line x1="80.0" y1="320.0" x2="420.0" y2="320.0" stroke="#1f2937" stroke-width="1.8"/><line x1="80.0" y1="320.0" x2="420.0" y2="320.0" stroke="#e5e7eb" stroke-width="1"/><text x="72.0" y="324.0" font-size="10.5" font-weight="normal" fill="#6b7280" text-anchor="end">0</text><line x1="80.0" y1="262.5" x2="420.0" y2="262.5" stroke="#e5e7eb" stroke-width="1"/><text x="72.0" y="266.5" font-size="10.5" font-weight="normal" fill="#6b7280" text-anchor="end">10</text><line x1="80.0" y1="205.0" x2="420.0" y2="205.0" stroke="#e5e7eb" stroke-width="1"/><text x="72.0" y="209.0" font-size="10.5" font-weight="normal" fill="#6b7280" text-anchor="end">20</text><line x1="80.0" y1="147.5" x2="420.0" y2="147.5" stroke="#e5e7eb" stroke-width="1"/><text x="72.0" y="151.5" font-size="10.5" font-weight="normal" fill="#6b7280" text-anchor="end">30</text><line x1="80.0" y1="90.0" x2="420.0" y2="90.0" stroke="#e5e7eb" stroke-width="1"/><text x="72.0" y="94.0" font-size="10.5" font-weight="normal" fill="#6b7280" text-anchor="end">40</text><text x="80.0" y="336.0" font-size="10.5" font-weight="normal" fill="#6b7280" text-anchor="middle">0</text><text x="114.0" y="336.0" font-size="10.5" font-weight="normal" fill="#6b7280" text-anchor="middle">1</text><text x="148.0" y="336.0" font-size="10.5" font-weight="normal" fill="#6b7280" text-anchor="middle">2</text><text x="182.0" y="336.0" font-size="10.5" font-weight="normal" fill="#6b7280" text-anchor="middle">3</text><text x="216.0" y="336.0" font-size="10.5" font-weight="normal" fill="#6b7280" text-anchor="middle">4</text><text x="250.0" y="336.0" font-size="10.5" font-weight="normal" fill="#6b7280" text-anchor="middle">5</text><text x="284.0" y="336.0" font-size="10.5" font-weight="normal" fill="#6b7280" text-anchor="middle">6</text><text x="318.0" y="336.0" font-size="10.5" font-weight="normal" fill="#6b7280" text-anchor="middle">7</text><text x="352.0" y="336.0" font-size="10.5" font-weight="normal" fill="#6b7280" text-anchor="middle">8</text><text x="386.0" y="336.0" font-size="10.5" font-weight="normal" fill="#6b7280" text-anchor="middle">9</text><text x="420.0" y="336.0" font-size="10.5" font-weight="normal" fill="#6b7280" text-anchor="middle">10</text><text x="250.0" y="354.0" font-size="11.5" font-weight="bold" fill="#1f2937" text-anchor="middle">Day of iteration</text><text x="40.0" y="205.0" transform="rotate(-90 40.0 205.0)" font-size="11.5" font-weight="bold" fill="#1f2937" text-anchor="middle">Story points remaining</text><polyline points="80.0,90.0 420.0,320.0" fill="none" stroke="#9ca3af" stroke-width="2.2" stroke-dasharray="6 4" stroke-linejoin="round"/><polyline points="80.0,90.0 114.0,95.8 148.0,113.0 182.0,118.8 216.0,147.5 250.0,153.2 284.0,170.5" fill="none" stroke="#2563eb" stroke-width="3.2" stroke-linejoin="round"/><polyline points="284.0,170.5 420.0,256.8" fill="none" stroke="#dc2626" stroke-width="2.4" stroke-dasharray="4 3" stroke-linejoin="round"/><text x="416.0" y="106.0" font-size="11" font-weight="bold" fill="#dc2626" text-anchor="end">red dashed = forecast: behind plan</text><text x="120.8" y="124.0" font-size="11" font-weight="bold" fill="#6b7280" text-anchor="start">ideal</text><text x="168.4" y="141.5" font-size="11" font-weight="bold" fill="#1d4ed8" text-anchor="start">actual</text><text x="730.0" y="78.0" font-size="13" font-weight="bold" fill="#1f2937" text-anchor="middle">Burnup (story points)</text><line x1="560.0" y1="90.0" x2="560.0" y2="320.0" stroke="#1f2937" stroke-width="1.8"/><line x1="560.0" y1="320.0" x2="900.0" y2="320.0" stroke="#1f2937" stroke-width="1.8"/><line x1="560.0" y1="320.0" x2="900.0" y2="320.0" stroke="#e5e7eb" stroke-width="1"/><text x="552.0" y="324.0" font-size="10.5" font-weight="normal" fill="#6b7280" text-anchor="end">0</text><line x1="560.0" y1="262.5" x2="900.0" y2="262.5" stroke="#e5e7eb" stroke-width="1"/><text x="552.0" y="266.5" font-size="10.5" font-weight="normal" fill="#6b7280" text-anchor="end">10</text><line x1="560.0" y1="205.0" x2="900.0" y2="205.0" stroke="#e5e7eb" stroke-width="1"/><text x="552.0" y="209.0" font-size="10.5" font-weight="normal" fill="#6b7280" text-anchor="end">20</text><line x1="560.0" y1="147.5" x2="900.0" y2="147.5" stroke="#e5e7eb" stroke-width="1"/><text x="552.0" y="151.5" font-size="10.5" font-weight="normal" fill="#6b7280" text-anchor="end">30</text><line x1="560.0" y1="90.0" x2="900.0" y2="90.0" stroke="#e5e7eb" stroke-width="1"/><text x="552.0" y="94.0" font-size="10.5" font-weight="normal" fill="#6b7280" text-anchor="end">40</text><text x="560.0" y="336.0" font-size="10.5" font-weight="normal" fill="#6b7280" text-anchor="middle">0</text><text x="594.0" y="336.0" font-size="10.5" font-weight="normal" fill="#6b7280" text-anchor="middle">1</text><text x="628.0" y="336.0" font-size="10.5" font-weight="normal" fill="#6b7280" text-anchor="middle">2</text><text x="662.0" y="336.0" font-size="10.5" font-weight="normal" fill="#6b7280" text-anchor="middle">3</text><text x="696.0" y="336.0" font-size="10.5" font-weight="normal" fill="#6b7280" text-anchor="middle">4</text><text x="730.0" y="336.0" font-size="10.5" font-weight="normal" fill="#6b7280" text-anchor="middle">5</text><text x="764.0" y="336.0" font-size="10.5" font-weight="normal" fill="#6b7280" text-anchor="middle">6</text><text x="798.0" y="336.0" font-size="10.5" font-weight="normal" fill="#6b7280" text-anchor="middle">7</text><text x="832.0" y="336.0" font-size="10.5" font-weight="normal" fill="#6b7280" text-anchor="middle">8</text><text x="866.0" y="336.0" font-size="10.5" font-weight="normal" fill="#6b7280" text-anchor="middle">9</text><text x="900.0" y="336.0" font-size="10.5" font-weight="normal" fill="#6b7280" text-anchor="middle">10</text><text x="730.0" y="354.0" font-size="11.5" font-weight="bold" fill="#1f2937" text-anchor="middle">Day of iteration</text><text x="520.0" y="205.0" transform="rotate(-90 520.0 205.0)" font-size="11.5" font-weight="bold" fill="#1f2937" text-anchor="middle">Story points</text><polyline points="560.0,147.5 730.0,147.5 730.0,147.5 764.0,101.5 900.0,101.5" fill="none" stroke="#d97706" stroke-width="3.2" stroke-linejoin="round"/><polyline points="560.0,320.0 594.0,308.5 628.0,291.2 662.0,274.0 696.0,256.8 730.0,239.5 764.0,222.2 798.0,205.0 832.0,187.8 866.0,170.5 900.0,153.2" fill="none" stroke="#16a34a" stroke-width="3.2" stroke-linejoin="round"/><text x="570.2" y="139.5" font-size="11" font-weight="bold" fill="#b45309" text-anchor="start">total scope</text><text x="770.8" y="93.5" font-size="11" font-weight="bold" fill="#b45309" text-anchor="start">scope added on day 6</text><text x="777.6" y="244.2" font-size="11" font-weight="bold" fill="#15803d" text-anchor="start">work completed</text><rect x="20.0" y="370.0" width="940.0" height="54.0" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.6"/><text x="490.0" y="393.4" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">Exam use: if stakeholders think the team is slowing down but the burnup shows completed work rising steadily while the scope line rises, scope growth (not team speed) is</text><text x="490.0" y="408.4" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">the cause. A burndown alone can hide scope changes. Velocity = work accepted per interval.</text></svg>