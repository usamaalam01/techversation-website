<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 598" width="980" height="598" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">The issue and impediment management cycle</title><desc id="d">Capture items from daily meetings, status reviews, retrospectives and occurred risks; evaluate the impact; prioritize and highlight; choose and apply an intervention together with stakeholders; reassess continually and evaluate again if the item is not cleared or has shifted; close, learn and update assets.</desc><defs><marker id="ah0" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker><marker id="ah1" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker></defs><rect x="0.75" y="0.75" width="978.5" height="596.5" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><text x="20.0" y="28.0" font-size="18" font-weight="bold" fill="#1f2937" text-anchor="start">Remove impediments and manage issues</text><text x="20.0" y="48.0" font-size="12" font-weight="normal" fill="#6b7280" text-anchor="start">A loop, not a list: nothing is finished until the team confirms that work flows again</text><rect x="20.0" y="70.0" width="290.0" height="152.0" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.8"/><text x="32.0" y="94.0" font-size="12.5" font-weight="bold" fill="#1e3a8a" text-anchor="start">1  Capture and log</text><text x="32.0" y="114.0" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="start">Record each impediment or issue in the impediment</text><text x="32.0" y="127.8" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="start">list or issue log: description, work affected, severity,</text><text x="32.0" y="141.5" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="start">owner, date. Log small ones too.</text><rect x="32.0" y="194.0" width="224.0" height="20.0" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="1.2"/><text x="144.0" y="208.0" font-size="10" font-weight="bold" fill="#1e3a8a" text-anchor="middle">ECO: recognize a risk that became an issue</text><rect x="345.0" y="70.0" width="290.0" height="152.0" rx="10" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.8"/><text x="357.0" y="94.0" font-size="12.5" font-weight="bold" fill="#134e4a" text-anchor="start">2  Evaluate the impact</text><text x="357.0" y="114.0" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="start">What is blocked, for whom and for how long? Effect</text><text x="357.0" y="127.8" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="start">on schedule, cost, quality, scope, benefits and</text><text x="357.0" y="141.5" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="start">commitments. Find the root cause, not only the</text><text x="357.0" y="155.2" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="start">symptom.</text><rect x="357.0" y="194.0" width="136.9" height="20.0" rx="10" fill="#ffffff" stroke="#0d9488" stroke-width="1.2"/><text x="425.4" y="208.0" font-size="10" font-weight="bold" fill="#134e4a" text-anchor="middle">ECO: evaluate the impact</text><rect x="670.0" y="70.0" width="290.0" height="152.0" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.8"/><text x="682.0" y="94.0" font-size="12.5" font-weight="bold" fill="#78350f" text-anchor="start">3  Prioritize and highlight</text><text x="682.0" y="114.0" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="start">Rank by impact and urgency and work the highest</text><text x="682.0" y="127.8" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="start">first. Make the top items visible on the board and in</text><text x="682.0" y="141.5" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="start">reports. One owner for each item.</text><rect x="682.0" y="194.0" width="151.7" height="20.0" rx="10" fill="#ffffff" stroke="#d97706" stroke-width="1.2"/><text x="757.9" y="208.0" font-size="10" font-weight="bold" fill="#78350f" text-anchor="middle">ECO: prioritize and highlight</text><rect x="670.0" y="282.0" width="290.0" height="152.0" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.8"/><text x="682.0" y="306.0" font-size="12.5" font-weight="bold" fill="#4c1d95" text-anchor="start">4  Choose and apply an intervention</text><text x="682.0" y="326.0" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="start">Remove the cause, work with the owning group,</text><text x="682.0" y="339.8" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="start">negotiate, change the plan, or escalate beyond your</text><text x="682.0" y="353.5" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="start">authority. Collaborate with the stakeholders involved.</text><rect x="682.0" y="406.0" width="166.0" height="20.0" rx="10" fill="#ffffff" stroke="#7c3aed" stroke-width="1.2"/><text x="765.0" y="420.0" font-size="10" font-weight="bold" fill="#4c1d95" text-anchor="middle">ECO: intervention + collaborate</text><rect x="345.0" y="282.0" width="290.0" height="152.0" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.8"/><text x="357.0" y="306.0" font-size="12.5" font-weight="bold" fill="#14532d" text-anchor="start">5  Reassess continually</text><text x="357.0" y="326.0" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="start">Ask the team: is it cleared, or has it shifted? Check at</text><text x="357.0" y="339.8" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="start">every daily meeting and review. Watch for items that</text><text x="357.0" y="353.5" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="start">keep coming back.</text><rect x="357.0" y="406.0" width="142.6" height="20.0" rx="10" fill="#ffffff" stroke="#16a34a" stroke-width="1.2"/><text x="428.3" y="420.0" font-size="10" font-weight="bold" fill="#14532d" text-anchor="middle">ECO: reassess continually</text><rect x="20.0" y="282.0" width="290.0" height="152.0" rx="10" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.8"/><text x="32.0" y="306.0" font-size="12.5" font-weight="bold" fill="#374151" text-anchor="start">6  Close and learn</text><text x="32.0" y="326.0" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="start">Verify that work flows, close the item with date and</text><text x="32.0" y="339.8" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="start">result, record the lesson, and fix the system (OPAs) if</text><text x="32.0" y="353.5" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="start">the cause was systemic.</text><rect x="32.0" y="406.0" width="107.4" height="20.0" rx="10" fill="#ffffff" stroke="#9ca3af" stroke-width="1.2"/><text x="85.7" y="420.0" font-size="10" font-weight="bold" fill="#374151" text-anchor="middle">Lessons and OPAs</text><line x1="311.0" y1="146.0" x2="344.0" y2="146.0" stroke="#1f2937" stroke-width="2.4" marker-end="url(#ah0)"/><line x1="636.0" y1="146.0" x2="669.0" y2="146.0" stroke="#1f2937" stroke-width="2.4" marker-end="url(#ah0)"/><line x1="815.0" y1="223.0" x2="815.0" y2="281.0" stroke="#1f2937" stroke-width="2.4" marker-end="url(#ah0)"/><line x1="669.0" y1="358.0" x2="636.0" y2="358.0" stroke="#1f2937" stroke-width="2.4" marker-end="url(#ah0)"/><line x1="344.0" y1="358.0" x2="311.0" y2="358.0" stroke="#1f2937" stroke-width="2.4" marker-end="url(#ah0)"/><line x1="490.0" y1="281.0" x2="490.0" y2="223.0" stroke="#16a34a" stroke-width="2.2" stroke-dasharray="6 4" marker-end="url(#ah1)"/><text x="500.0" y="257.0" font-size="11" font-weight="bold" fill="#14532d" text-anchor="start">Not cleared, or it has shifted: evaluate again</text><rect x="20.0" y="456.0" width="940.0" height="131.5" rx="8" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.3"/><text x="32.0" y="478.0" font-size="12.5" font-weight="bold" fill="#1f2937" text-anchor="start">Where items come from</text><rect x="32.0" y="490.0" width="157.5" height="21.0" rx="10.5" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.2"/><text x="110.7" y="502.5" font-size="11" font-weight="bold" fill="#374151" text-anchor="middle">Daily coordination meeting</text><rect x="197.5" y="490.0" width="125.7" height="21.0" rx="10.5" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.2"/><text x="260.3" y="502.5" font-size="11" font-weight="bold" fill="#374151" text-anchor="middle">Team member report</text><rect x="331.1" y="490.0" width="152.2" height="21.0" rx="10.5" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.2"/><text x="407.2" y="502.5" font-size="11" font-weight="bold" fill="#374151" text-anchor="middle">Status review and metrics</text><rect x="491.3" y="490.0" width="88.9" height="21.0" rx="10.5" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.2"/><text x="535.8" y="502.5" font-size="11" font-weight="bold" fill="#374151" text-anchor="middle">Retrospective</text><rect x="588.2" y="490.0" width="142.3" height="21.0" rx="10.5" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.2"/><text x="659.4" y="502.5" font-size="11" font-weight="bold" fill="#374151" text-anchor="middle">A risk that has occurred</text><rect x="738.5" y="490.0" width="130.1" height="21.0" rx="10.5" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.2"/><text x="803.5" y="502.5" font-size="11" font-weight="bold" fill="#374151" text-anchor="middle">Stakeholder feedback</text><rect x="32.0" y="518.0" width="156.0" height="21.0" rx="10.5" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.2"/><text x="110.0" y="530.5" font-size="11" font-weight="bold" fill="#374151" text-anchor="middle">Audit or inspection finding</text><rect x="196.0" y="518.0" width="165.1" height="21.0" rx="10.5" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.2"/><text x="278.6" y="530.5" font-size="11" font-weight="bold" fill="#374151" text-anchor="middle">Dependency owner's update</text><text x="32.0" y="556.0" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="start">Predictive: the issue log is reviewed in status meetings and by governance. Adaptive: the impediment list or board is reviewed every day; the scrum master or project manager removes</text><text x="32.0" y="569.8" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="start">what the team cannot, and the retrospective tackles repeats.</text></svg>