<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="960" height="480" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">Decision tree with expected monetary value</title><desc id="d">Choose between mitigating a risk with a prototype costing 30 thousand, giving expected monetary value minus 50 thousand, and accepting the risk, giving minus 60 thousand. Pick the higher EMV.</desc><defs><marker id="ah0" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#9ca3af"/></marker><marker id="ah1" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker></defs><rect x="0.75" y="0.75" width="958.5" height="478.5" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><text x="20.0" y="28.0" font-size="18" font-weight="bold" fill="#1f2937" text-anchor="start">Decision tree analysis: pick the path with the better EMV</text><text x="20.0" y="48.0" font-size="12" font-weight="normal" fill="#6b7280" text-anchor="start">Worked example. EMV = probability x impact, summed along each branch (threat impacts are negative).</text><rect x="48.0" y="223.0" width="44.0" height="44.0" rx="3" fill="#1e3a8a" stroke="#1e3a8a" stroke-width="1.5"/><text x="70.0" y="250.0" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">Decide</text><line x1="92.0" y1="245.0" x2="170.0" y2="245.0" stroke="#4b5563" stroke-width="2.5"/><polyline points="170.0,245.0 170.0,355.0 255.0,355.0" fill="none" stroke="#9ca3af" stroke-width="2.2" marker-end="url(#ah0)" stroke-linejoin="round"/><polyline points="170.0,245.0 170.0,135.0 255.0,135.0" fill="none" stroke="#16a34a" stroke-width="3" marker-end="url(#ah1)" stroke-linejoin="round"/><text x="176.0" y="97.0" font-size="13" font-weight="bold" fill="#14532d" text-anchor="start">Mitigate: build prototype</text><text x="176.0" y="113.0" font-size="12.5" font-weight="normal" fill="#14532d" text-anchor="start">cost  -$30K</text><text x="176.0" y="391.0" font-size="13" font-weight="bold" fill="#374151" text-anchor="start">Accept the risk</text><text x="176.0" y="407.0" font-size="12.5" font-weight="normal" fill="#374151" text-anchor="start">cost  $0 now</text><circle cx="275.0" cy="135.0" r="20" fill="#ffffff" stroke="#16a34a" stroke-width="2.5"/><text x="275.0" y="139.0" font-size="14" font-weight="bold" fill="#14532d" text-anchor="middle">?</text><circle cx="275.0" cy="355.0" r="20" fill="#ffffff" stroke="#9ca3af" stroke-width="2.5"/><text x="275.0" y="359.0" font-size="14" font-weight="bold" fill="#374151" text-anchor="middle">?</text><polyline points="295.0,135.0 360.0,90.0 480.0,90.0" fill="none" stroke="#16a34a" stroke-width="2" marker-end="url(#ah1)" stroke-linejoin="round"/><polyline points="295.0,135.0 360.0,180.0 480.0,180.0" fill="none" stroke="#16a34a" stroke-width="2" marker-end="url(#ah1)" stroke-linejoin="round"/><text x="366.0" y="82.0" font-size="12" font-weight="bold" fill="#14532d" text-anchor="start">Failure 10%</text><text x="486.0" y="95.0" font-size="12.5" font-weight="normal" fill="#1f2937" text-anchor="start">10% x -$200K = -$20K</text><text x="366.0" y="172.0" font-size="12" font-weight="bold" fill="#14532d" text-anchor="start">No failure 90%</text><text x="486.0" y="185.0" font-size="12.5" font-weight="normal" fill="#1f2937" text-anchor="start">90% x $0 = $0</text><polyline points="295.0,355.0 360.0,310.0 480.0,310.0" fill="none" stroke="#9ca3af" stroke-width="2" marker-end="url(#ah0)" stroke-linejoin="round"/><polyline points="295.0,355.0 360.0,400.0 480.0,400.0" fill="none" stroke="#9ca3af" stroke-width="2" marker-end="url(#ah0)" stroke-linejoin="round"/><text x="366.0" y="302.0" font-size="12" font-weight="bold" fill="#374151" text-anchor="start">Failure 30%</text><text x="486.0" y="315.0" font-size="12.5" font-weight="normal" fill="#1f2937" text-anchor="start">30% x -$200K = -$60K</text><text x="366.0" y="392.0" font-size="12" font-weight="bold" fill="#374151" text-anchor="start">No failure 70%</text><text x="486.0" y="405.0" font-size="12.5" font-weight="normal" fill="#1f2937" text-anchor="start">70% x $0 = $0</text><rect x="730.0" y="97.0" width="200.0" height="76.0" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="830.0" y="130.8" font-size="14" font-weight="bold" fill="#14532d" text-anchor="middle">EMV = -$50K</text><text x="830.0" y="148.3" font-size="14" font-weight="normal" fill="#14532d" text-anchor="middle">-30 + (-20) + 0</text><rect x="730.0" y="317.0" width="200.0" height="76.0" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.6"/><text x="830.0" y="350.8" font-size="14" font-weight="bold" fill="#374151" text-anchor="middle">EMV = -$60K</text><text x="830.0" y="368.3" font-size="14" font-weight="normal" fill="#374151" text-anchor="middle">0 + (-60) + 0</text><line x1="628.0" y1="90.0" x2="642.0" y2="90.0" stroke="#16a34a" stroke-width="2"/><line x1="642.0" y1="90.0" x2="642.0" y2="180.0" stroke="#16a34a" stroke-width="2"/><line x1="628.0" y1="180.0" x2="642.0" y2="180.0" stroke="#16a34a" stroke-width="2"/><line x1="642.0" y1="135.0" x2="724.0" y2="135.0" stroke="#16a34a" stroke-width="2" marker-end="url(#ah1)"/><text x="660.0" y="127.0" font-size="11.5" font-weight="normal" fill="#6b7280" text-anchor="start">add up</text><line x1="628.0" y1="310.0" x2="642.0" y2="310.0" stroke="#9ca3af" stroke-width="2"/><line x1="642.0" y1="310.0" x2="642.0" y2="400.0" stroke="#9ca3af" stroke-width="2"/><line x1="628.0" y1="400.0" x2="642.0" y2="400.0" stroke="#9ca3af" stroke-width="2"/><line x1="642.0" y1="355.0" x2="724.0" y2="355.0" stroke="#9ca3af" stroke-width="2" marker-end="url(#ah0)"/><text x="660.0" y="347.0" font-size="11.5" font-weight="normal" fill="#6b7280" text-anchor="start">add up</text><rect x="730.0" y="73.0" width="124.9" height="21.0" rx="10.5" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/><text x="792.4" y="85.5" font-size="11" font-weight="bold" fill="#14532d" text-anchor="middle">CHOOSE THIS PATH</text><text x="480.0" y="466.0" font-size="11.5" font-weight="normal" fill="#6b7280" text-anchor="middle" font-style="italic">Impact if the risk occurs: -$200K. EMV -$50K beats -$60K, so mitigating is the better expected outcome. Exam shortcut: compare expected values, not worst cases.</text></svg>