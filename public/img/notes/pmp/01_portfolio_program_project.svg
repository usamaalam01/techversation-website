<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 470" width="920" height="470" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">Portfolio, program, project and operations</title><desc id="d">Organizational strategy at the top. A portfolio contains programs, projects, operations and products managed as a group. A program groups related projects. Projects can also stand alone. Operations and products interact with all of them.</desc><defs><marker id="ah0" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker></defs><rect x="0.75" y="0.75" width="918.5" height="468.5" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><text x="20.0" y="28.0" font-size="18" font-weight="bold" fill="#1f2937" text-anchor="start">How portfolio, program, project and operations fit together</text><text x="20.0" y="48.0" font-size="12" font-weight="normal" fill="#6b7280" text-anchor="start">Strategy drives the portfolio; portfolio, program and project managers coordinate with operations leaders on shared stakeholders and resources</text><rect x="20.0" y="62.0" width="880.0" height="40.0" rx="8" fill="#1e3a8a" stroke="#1e3a8a" stroke-width="1.6"/><text x="460.0" y="86.5" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">Organizational strategy: vision, mission, objectives (internal and external environment)</text><line x1="460.0" y1="104.0" x2="460.0" y2="124.0" stroke="#1f2937" stroke-width="2" marker-end="url(#ah0)"/><rect x="20.0" y="126.0" width="880.0" height="270.0" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="36.0" y="150.0" font-size="15" font-weight="bold" fill="#1e3a8a" text-anchor="start">PORTFOLIO</text><text x="130.0" y="150.0" font-size="12.5" font-weight="normal" fill="#1e3a8a" text-anchor="start">Selects, prioritizes, balances and optimizes work to maximize value and meet strategic objectives</text><rect x="40.0" y="168.0" width="400.0" height="212.0" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.8"/><text x="54.0" y="192.0" font-size="14" font-weight="bold" fill="#4c1d95" text-anchor="start">PROGRAM</text><text x="54.0" y="210.0" font-size="12" font-weight="normal" fill="#4c1d95" text-anchor="start">Related projects and program activities managed together for</text><text x="54.0" y="225.0" font-size="12" font-weight="normal" fill="#4c1d95" text-anchor="start">benefits not available from managing them individually. Not just a big</text><text x="54.0" y="240.0" font-size="12" font-weight="normal" fill="#4c1d95" text-anchor="start">project.</text><rect x="56.0" y="284.0" width="112.0" height="50.0" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="112.0" y="313.2" font-size="13" font-weight="bold" fill="#14532d" text-anchor="middle">Project 1</text><rect x="180.0" y="284.0" width="112.0" height="50.0" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="236.0" y="313.2" font-size="13" font-weight="bold" fill="#14532d" text-anchor="middle">Project 2</text><rect x="304.0" y="284.0" width="112.0" height="50.0" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="360.0" y="313.2" font-size="13" font-weight="bold" fill="#14532d" text-anchor="middle">Project 3</text><text x="54.0" y="356.0" font-size="11.5" font-weight="normal" fill="#4c1d95" text-anchor="start">Component projects and sub-programs; the program tracks</text><text x="54.0" y="370.4" font-size="11.5" font-weight="normal" fill="#4c1d95" text-anchor="start">interdependencies and benefits</text><rect x="460.0" y="168.0" width="224.0" height="100.0" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.8"/><text x="474.0" y="192.0" font-size="13.5" font-weight="bold" fill="#14532d" text-anchor="start">PROJECT (stand-alone)</text><text x="474.0" y="210.0" font-size="12" font-weight="normal" fill="#14532d" text-anchor="start">Temporary initiative in a unique</text><text x="474.0" y="225.0" font-size="12" font-weight="normal" fill="#14532d" text-anchor="start">context to create value</text><rect x="474.0" y="236.0" width="90.0" height="22.0" rx="5" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="519.0" y="250.7" font-size="11.5" font-weight="bold" fill="#1f2937" text-anchor="middle">Project 4</text><rect x="574.0" y="236.0" width="90.0" height="22.0" rx="5" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="619.0" y="250.7" font-size="11.5" font-weight="bold" fill="#1f2937" text-anchor="middle">Project 5</text><rect x="700.0" y="168.0" width="184.0" height="100.0" rx="10" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.8" stroke-dasharray="6 4"/><text x="714.0" y="192.0" font-size="13.5" font-weight="bold" fill="#374151" text-anchor="start">OPERATIONS</text><text x="714.0" y="210.0" font-size="12" font-weight="normal" fill="#374151" text-anchor="start">Ongoing production of goods</text><text x="714.0" y="225.0" font-size="12" font-weight="normal" fill="#374151" text-anchor="start">and services; outside a</text><text x="714.0" y="240.0" font-size="12" font-weight="normal" fill="#374151" text-anchor="start">project's scope</text><rect x="460.0" y="282.0" width="424.0" height="98.0" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.8" stroke-dasharray="6 4"/><text x="474.0" y="306.0" font-size="13" font-weight="bold" fill="#78350f" text-anchor="start">PRODUCT (life cycle: introduction, growth, maturity, retirement)</text><text x="474.0" y="324.0" font-size="12" font-weight="normal" fill="#78350f" text-anchor="start">Projects and programs create, enhance and retire a product over its life.</text><text x="474.0" y="339.0" font-size="12" font-weight="normal" fill="#78350f" text-anchor="start">Product management supplies vision and strategy; projects deliver.</text><rect x="20.0" y="408.0" width="880.0" height="46.0" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.6"/><text x="460.0" y="427.4" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">Shared stakeholders and shared resources: portfolio, program and project managers work with operations leaders to avoid competing for the same people and</text><text x="460.0" y="442.4" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">funds. At handover, deliverables, people and knowledge move between project and operations.</text></svg>