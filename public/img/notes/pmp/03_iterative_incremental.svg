<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 500" width="980" height="500" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">Predictive, incremental, iterative and agile delivery</title><desc id="d">Four delivery shapes: a single final delivery, incremental delivery of usable parts, iterative refinement through cycles, and agile combining both with feedback.</desc><defs><marker id="ah0" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker><marker id="ah1" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker></defs><rect x="0.75" y="0.75" width="978.5" height="498.5" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><text x="20.0" y="28.0" font-size="18" font-weight="bold" fill="#1f2937" text-anchor="start">Single, incremental, iterative and agile delivery</text><text x="20.0" y="48.0" font-size="12" font-weight="normal" fill="#6b7280" text-anchor="start">Incremental = usable pieces that build up. Iterative = repeated cycles that refine. Adaptive/agile usually does both.</text><rect x="20.0" y="70.0" width="940.0" height="90.0" rx="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.2"/><rect x="28.0" y="78.0" width="190.0" height="74.0" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.6"/><text x="123.0" y="119.4" font-size="13.5" font-weight="bold" fill="#374151" text-anchor="middle">Predictive (single delivery)</text><text x="230.0" y="96.0" font-size="12" font-weight="normal" fill="#1f2937" text-anchor="start">Plan up front, build everything, deliver at the end. Scope</text><text x="230.0" y="111.6" font-size="12" font-weight="normal" fill="#1f2937" text-anchor="start">and timeline largely fixed.</text><rect x="560.0" y="100.0" width="270.0" height="28.0" rx="4" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.2"/><text x="695.0" y="119.0" font-size="11.5" font-weight="normal" fill="#6b7280" text-anchor="middle">plan + build everything</text><line x1="832.0" y1="114.0" x2="850.0" y2="114.0" stroke="#6b7280" stroke-width="2" marker-end="url(#ah0)"/><rect x="852.0" y="92.0" width="88.0" height="44.0" rx="4" fill="#9ca3af" stroke="#6b7280" stroke-width="1.5"/><text x="896.0" y="119.0" font-size="11.5" font-weight="bold" fill="#ffffff" text-anchor="middle">Release</text><rect x="20.0" y="170.0" width="940.0" height="90.0" rx="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.2"/><rect x="28.0" y="178.0" width="190.0" height="74.0" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="123.0" y="219.4" font-size="13.5" font-weight="bold" fill="#1e3a8a" text-anchor="middle">Incremental</text><text x="230.0" y="196.0" font-size="12" font-weight="normal" fill="#1f2937" text-anchor="start">Scope understood up front, delivered in usable</text><text x="230.0" y="211.6" font-size="12" font-weight="normal" fill="#1f2937" text-anchor="start">segments. Each increment adds features; value arrives</text><text x="230.0" y="227.2" font-size="12" font-weight="normal" fill="#1f2937" text-anchor="start">earlier.</text><rect x="560.0" y="208.0" width="112.0" height="26.0" rx="4" fill="#bfdbfe" stroke="#2563eb" stroke-width="1.4"/><text x="616.0" y="225.0" font-size="11.5" font-weight="bold" fill="#1e3a8a" text-anchor="middle">Increment 1</text><rect x="684.0" y="196.0" width="112.0" height="38.0" rx="4" fill="#bfdbfe" stroke="#2563eb" stroke-width="1.4"/><text x="740.0" y="219.0" font-size="11.5" font-weight="bold" fill="#1e3a8a" text-anchor="middle">Increment 2</text><rect x="808.0" y="184.0" width="112.0" height="50.0" rx="4" fill="#bfdbfe" stroke="#2563eb" stroke-width="1.4"/><text x="864.0" y="213.0" font-size="11.5" font-weight="bold" fill="#1e3a8a" text-anchor="middle">Increment 3</text><text x="560.0" y="254.0" font-size="10.5" font-weight="normal" fill="#6b7280" text-anchor="start">each usable, each builds on the last</text><rect x="20.0" y="270.0" width="940.0" height="90.0" rx="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.2"/><rect x="28.0" y="278.0" width="190.0" height="74.0" rx="8" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.6"/><text x="123.0" y="319.4" font-size="13.5" font-weight="bold" fill="#134e4a" text-anchor="middle">Iterative</text><text x="230.0" y="296.0" font-size="12" font-weight="normal" fill="#1f2937" text-anchor="start">Refine the same deliverable through repeated cycles</text><text x="230.0" y="311.6" font-size="12" font-weight="normal" fill="#1f2937" text-anchor="start">(rough to polished) using feedback.</text><rect x="560.0" y="288.0" width="112.0" height="46.0" rx="22" fill="#fde68a" stroke="#0d9488" stroke-width="1.4"/><text x="616.0" y="316.0" font-size="11.5" font-weight="bold" fill="#134e4a" text-anchor="middle">Version 1</text><rect x="684.0" y="288.0" width="112.0" height="46.0" rx="12" fill="#a7f3d0" stroke="#0d9488" stroke-width="1.4"/><text x="740.0" y="316.0" font-size="11.5" font-weight="bold" fill="#134e4a" text-anchor="middle">Version 2</text><rect x="808.0" y="288.0" width="112.0" height="46.0" rx="4" fill="#6ee7b7" stroke="#0d9488" stroke-width="1.4"/><text x="864.0" y="316.0" font-size="11.5" font-weight="bold" fill="#134e4a" text-anchor="middle">Version 3</text><text x="560.0" y="354.0" font-size="10.5" font-weight="normal" fill="#6b7280" text-anchor="start">same product, refined with feedback each cycle</text><rect x="20.0" y="370.0" width="940.0" height="90.0" rx="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.2"/><rect x="28.0" y="378.0" width="190.0" height="74.0" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="123.0" y="419.4" font-size="13.5" font-weight="bold" fill="#14532d" text-anchor="middle">Adaptive / agile</text><text x="230.0" y="396.0" font-size="12" font-weight="normal" fill="#1f2937" text-anchor="start">Iterative AND incremental: short timeboxes (often 1 to 4</text><text x="230.0" y="411.6" font-size="12" font-weight="normal" fill="#1f2937" text-anchor="start">weeks), demo, feedback, backlog reprioritized each</text><text x="230.0" y="427.2" font-size="12" font-weight="normal" fill="#1f2937" text-anchor="start">time.</text><rect x="560.0" y="382.0" width="112.0" height="52.0" rx="6" fill="#bbf7d0" stroke="#16a34a" stroke-width="1.4"/><text x="616.0" y="406.0" font-size="11.5" font-weight="bold" fill="#14532d" text-anchor="middle">Iteration 1</text><text x="616.0" y="422.0" font-size="10" font-weight="normal" fill="#14532d" text-anchor="middle">demo + feedback</text><line x1="673.0" y1="408.0" x2="683.0" y2="408.0" stroke="#16a34a" stroke-width="2" marker-end="url(#ah1)"/><rect x="684.0" y="382.0" width="112.0" height="52.0" rx="6" fill="#bbf7d0" stroke="#16a34a" stroke-width="1.4"/><text x="740.0" y="406.0" font-size="11.5" font-weight="bold" fill="#14532d" text-anchor="middle">Iteration 2</text><text x="740.0" y="422.0" font-size="10" font-weight="normal" fill="#14532d" text-anchor="middle">demo + feedback</text><line x1="797.0" y1="408.0" x2="807.0" y2="408.0" stroke="#16a34a" stroke-width="2" marker-end="url(#ah1)"/><rect x="808.0" y="382.0" width="112.0" height="52.0" rx="6" fill="#bbf7d0" stroke="#16a34a" stroke-width="1.4"/><text x="864.0" y="406.0" font-size="11.5" font-weight="bold" fill="#14532d" text-anchor="middle">Iteration 3</text><text x="864.0" y="422.0" font-size="10" font-weight="normal" fill="#14532d" text-anchor="middle">demo + feedback</text><text x="560.0" y="454.0" font-size="10.5" font-weight="normal" fill="#6b7280" text-anchor="start">working increments + backlog reprioritization</text></svg>