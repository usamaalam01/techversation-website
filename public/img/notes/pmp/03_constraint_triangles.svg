<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="900" height="400" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">Constraint options for adaptive approaches</title><desc id="d">When scope is fixed, budget and schedule vary; when budget and schedule are fixed, scope varies.</desc><defs></defs><rect x="0.75" y="0.75" width="898.5" height="398.5" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><text x="20.0" y="28.0" font-size="18" font-weight="bold" fill="#1f2937" text-anchor="start">Fixed vs variable constraints (the inverted triangle)</text><text x="20.0" y="48.0" font-size="12" font-weight="normal" fill="#6b7280" text-anchor="start">In adaptive work you decide which constraints are fixed; the rest flex to absorb change</text><text x="230.0" y="88.0" font-size="15" font-weight="bold" fill="#1f2937" text-anchor="middle">Scope is fixed</text><polygon points="60.0,112.0 400.0,112.0 230.0,302.0" fill="#ffffff" stroke="#6b7280" stroke-width="2"/><rect x="150.0" y="130.0" width="160.0" height="34.0" rx="8" fill="#1e3a8a" stroke="#1e3a8a" stroke-width="1.6"/><text x="230.0" y="151.2" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">Fixed scope</text><rect x="100.0" y="182.0" width="120.0" height="34.0" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="160.0" y="203.1" font-size="12.5" font-weight="bold" fill="#78350f" text-anchor="middle">Budget varies</text><rect x="240.0" y="182.0" width="120.0" height="34.0" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="300.0" y="203.1" font-size="12.5" font-weight="bold" fill="#78350f" text-anchor="middle">Schedule varies</text><text x="230.0" y="330.0" font-size="12.5" font-weight="normal" fill="#1f2937" text-anchor="middle">Unexpected change is absorbed by altering budget or schedule</text><text x="670.0" y="88.0" font-size="15" font-weight="bold" fill="#1f2937" text-anchor="middle">Budget and schedule are fixed</text><polygon points="500.0,112.0 840.0,112.0 670.0,302.0" fill="#ffffff" stroke="#6b7280" stroke-width="2"/><rect x="535.0" y="130.0" width="130.0" height="34.0" rx="8" fill="#1e3a8a" stroke="#1e3a8a" stroke-width="1.6"/><text x="600.0" y="151.1" font-size="12.5" font-weight="bold" fill="#ffffff" text-anchor="middle">Fixed budget</text><rect x="675.0" y="130.0" width="130.0" height="34.0" rx="8" fill="#1e3a8a" stroke="#1e3a8a" stroke-width="1.6"/><text x="740.0" y="151.1" font-size="12.5" font-weight="bold" fill="#ffffff" text-anchor="middle">Fixed schedule</text><rect x="600.0" y="190.0" width="140.0" height="34.0" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="670.0" y="211.2" font-size="13" font-weight="bold" fill="#78350f" text-anchor="middle">Scope varies</text><text x="670.0" y="330.0" font-size="12.5" font-weight="normal" fill="#1f2937" text-anchor="middle">Unexpected change is absorbed by varying scope (drop or add</text><text x="670.0" y="346.2" font-size="12.5" font-weight="normal" fill="#1f2937" text-anchor="middle">backlog items)</text><text x="450.0" y="386.0" font-size="11.5" font-weight="normal" fill="#6b7280" text-anchor="middle" font-style="italic">Navy = fixed constraint, amber = variable constraint. Time-boxed iterations fix schedule and cost per iteration; scope flexes.</text></svg>