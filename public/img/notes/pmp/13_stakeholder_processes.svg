<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 400" width="920" height="400" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">Stakeholder engagement processes across the project</title><desc id="d">Identify Stakeholders in Initiating, Plan Stakeholder Engagement in Planning, Manage Stakeholder Engagement in Executing, Monitor Stakeholder Engagement in Monitoring and Controlling; each produces or updates the stakeholder register and the stakeholder engagement plan.</desc><defs><marker id="ah0" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker><marker id="ah1" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker></defs><rect x="0.75" y="0.75" width="918.5" height="398.5" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><text x="20.0" y="28.0" font-size="18" font-weight="bold" fill="#1f2937" text-anchor="start">Stakeholder engagement: four processes, one continuous loop</text><text x="20.0" y="48.0" font-size="12" font-weight="normal" fill="#6b7280" text-anchor="start">PMBOK 8 Stakeholders performance domain (engagement processes only; communications processes are in Topic 20)</text><rect x="28.0" y="80.0" width="66.0" height="22.0" rx="11.0" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/><text x="61.0" y="93.5" font-size="12" font-weight="bold" fill="#1e3a8a" text-anchor="middle">Initiating</text><rect x="24.0" y="116.0" width="200.0" height="78.0" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="124.0" y="150.5" font-size="15" font-weight="bold" fill="#1e3a8a" text-anchor="middle">Identify</text><text x="124.0" y="169.2" font-size="15" font-weight="bold" fill="#1e3a8a" text-anchor="middle">Stakeholders</text><rect x="24.0" y="208.0" width="200.0" height="62.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="124.0" y="242.9" font-size="12" font-weight="normal" fill="#1f2937" text-anchor="middle">Output: stakeholder register</text><line x1="226.0" y1="155.0" x2="246.0" y2="155.0" stroke="#1f2937" stroke-width="2.2" marker-end="url(#ah0)"/><rect x="252.0" y="80.0" width="66.8" height="22.0" rx="11.0" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.2"/><text x="285.4" y="93.5" font-size="12" font-weight="bold" fill="#134e4a" text-anchor="middle">Planning</text><rect x="248.0" y="116.0" width="200.0" height="78.0" rx="8" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.6"/><text x="348.0" y="150.5" font-size="15" font-weight="bold" fill="#134e4a" text-anchor="middle">Plan Stakeholder</text><text x="348.0" y="169.2" font-size="15" font-weight="bold" fill="#134e4a" text-anchor="middle">Engagement</text><rect x="248.0" y="208.0" width="200.0" height="62.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="348.0" y="235.4" font-size="12" font-weight="normal" fill="#1f2937" text-anchor="middle">Output: stakeholder engagement</text><text x="348.0" y="250.4" font-size="12" font-weight="normal" fill="#1f2937" text-anchor="middle">plan</text><line x1="450.0" y1="155.0" x2="470.0" y2="155.0" stroke="#1f2937" stroke-width="2.2" marker-end="url(#ah0)"/><rect x="476.0" y="80.0" width="73.5" height="22.0" rx="11.0" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/><text x="512.7" y="93.5" font-size="12" font-weight="bold" fill="#14532d" text-anchor="middle">Executing</text><rect x="472.0" y="116.0" width="200.0" height="78.0" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="572.0" y="150.5" font-size="15" font-weight="bold" fill="#14532d" text-anchor="middle">Manage Stakeholder</text><text x="572.0" y="169.2" font-size="15" font-weight="bold" fill="#14532d" text-anchor="middle">Engagement</text><rect x="472.0" y="208.0" width="200.0" height="62.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="572.0" y="227.9" font-size="12" font-weight="normal" fill="#1f2937" text-anchor="middle">Work with stakeholders; address</text><text x="572.0" y="242.9" font-size="12" font-weight="normal" fill="#1f2937" text-anchor="middle">issues; build support, cut</text><text x="572.0" y="257.9" font-size="12" font-weight="normal" fill="#1f2937" text-anchor="middle">resistance</text><line x1="674.0" y1="155.0" x2="694.0" y2="155.0" stroke="#1f2937" stroke-width="2.2" marker-end="url(#ah0)"/><rect x="700.0" y="80.0" width="157.2" height="22.0" rx="11.0" fill="#fef3c7" stroke="#d97706" stroke-width="1.2"/><text x="778.6" y="93.5" font-size="12" font-weight="bold" fill="#78350f" text-anchor="middle">Monitoring &amp; Controlling</text><rect x="696.0" y="116.0" width="200.0" height="78.0" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="796.0" y="150.5" font-size="15" font-weight="bold" fill="#78350f" text-anchor="middle">Monitor Stakeholder</text><text x="796.0" y="169.2" font-size="15" font-weight="bold" fill="#78350f" text-anchor="middle">Engagement</text><rect x="696.0" y="208.0" width="200.0" height="62.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="796.0" y="235.4" font-size="12" font-weight="normal" fill="#1f2937" text-anchor="middle">Compare current vs desired</text><text x="796.0" y="250.4" font-size="12" font-weight="normal" fill="#1f2937" text-anchor="middle">engagement; adjust strategy</text><polyline points="796.0,272.0 796.0,302.0 124.0,302.0 124.0,274.0" fill="none" stroke="#7c3aed" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#ah1)" stroke-linejoin="round"/><text x="460.0" y="294.0" font-size="12.5" font-weight="bold" fill="#5b21b6" text-anchor="middle">Findings feed back: update the register, the engagement plan and the communications plan</text><rect x="24.0" y="330.0" width="872.0" height="52.0" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.6"/><text x="460.0" y="352.2" font-size="12.5" font-weight="normal" fill="#374151" text-anchor="middle">Performed periodically and throughout the project: at least at every phase change, whenever the environment shifts, and whenever monitoring shows a</text><text x="460.0" y="367.9" font-size="12.5" font-weight="normal" fill="#374151" text-anchor="middle">gap.</text></svg>