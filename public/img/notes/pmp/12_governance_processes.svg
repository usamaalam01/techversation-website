<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 440" width="980" height="440" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">The nine Governance domain processes</title><desc id="d">Initiate Project or Phase; Integrate and Align Project Plans; Plan Sourcing Strategy; Manage Project Execution; Manage Quality Assurance; Manage Project Knowledge; Monitor and Control Project Performance; Assess and Implement Changes; Close Project or Phase.</desc><defs></defs><rect x="0.75" y="0.75" width="978.5" height="438.5" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><text x="20.0" y="28.0" font-size="18" font-weight="bold" fill="#1f2937" text-anchor="start">Governance is pervasive: nine processes across the life cycle</text><text x="20.0" y="48.0" font-size="12" font-weight="normal" fill="#6b7280" text-anchor="start">PMBOK 8 Figure 2-2, with the topic that covers each in these notes</text><rect x="20.0" y="66.0" width="180.0" height="36.0" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="110.0" y="88.1" font-size="12.5" font-weight="bold" fill="#1e3a8a" text-anchor="middle">Initiating</text><rect x="20.0" y="112.0" width="180.0" height="76.0" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.6"/><text x="30.0" y="134.0" font-size="12.5" font-weight="bold" fill="#1e3a8a" text-anchor="start">Initiate Project or Phase</text><text x="30.0" y="176.0" font-size="11.5" font-weight="normal" fill="#6b7280" text-anchor="start">Topic 09</text><rect x="214.0" y="66.0" width="180.0" height="36.0" rx="8" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.6"/><text x="304.0" y="88.1" font-size="12.5" font-weight="bold" fill="#134e4a" text-anchor="middle">Planning</text><rect x="214.0" y="112.0" width="180.0" height="76.0" rx="8" fill="#ffffff" stroke="#0d9488" stroke-width="1.6"/><text x="224.0" y="134.0" font-size="12.5" font-weight="bold" fill="#134e4a" text-anchor="start">Integrate and Align Project</text><text x="224.0" y="149.0" font-size="12.5" font-weight="bold" fill="#134e4a" text-anchor="start">Plans</text><text x="224.0" y="176.0" font-size="11.5" font-weight="normal" fill="#6b7280" text-anchor="start">Topic 14</text><rect x="214.0" y="196.0" width="180.0" height="76.0" rx="8" fill="#ffffff" stroke="#0d9488" stroke-width="1.6"/><text x="224.0" y="218.0" font-size="12.5" font-weight="bold" fill="#134e4a" text-anchor="start">Plan Sourcing Strategy</text><text x="224.0" y="260.0" font-size="11.5" font-weight="normal" fill="#6b7280" text-anchor="start">Topic 22</text><rect x="408.0" y="66.0" width="180.0" height="36.0" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="498.0" y="88.1" font-size="12.5" font-weight="bold" fill="#14532d" text-anchor="middle">Executing</text><rect x="408.0" y="112.0" width="180.0" height="76.0" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="1.6"/><text x="418.0" y="134.0" font-size="12.5" font-weight="bold" fill="#14532d" text-anchor="start">Manage Project Execution</text><text x="418.0" y="176.0" font-size="11.5" font-weight="normal" fill="#6b7280" text-anchor="start">Topic 24</text><rect x="408.0" y="196.0" width="180.0" height="76.0" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="1.6"/><text x="418.0" y="218.0" font-size="12.5" font-weight="bold" fill="#14532d" text-anchor="start">Manage Quality</text><text x="418.0" y="233.0" font-size="12.5" font-weight="bold" fill="#14532d" text-anchor="start">Assurance</text><text x="418.0" y="260.0" font-size="11.5" font-weight="normal" fill="#6b7280" text-anchor="start">Topic 18</text><rect x="408.0" y="280.0" width="180.0" height="76.0" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="1.6"/><text x="418.0" y="302.0" font-size="12.5" font-weight="bold" fill="#14532d" text-anchor="start">Manage Project</text><text x="418.0" y="317.0" font-size="12.5" font-weight="bold" fill="#14532d" text-anchor="start">Knowledge</text><text x="418.0" y="344.0" font-size="11.5" font-weight="normal" fill="#6b7280" text-anchor="start">Topic 27</text><rect x="602.0" y="66.0" width="180.0" height="36.0" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="692.0" y="88.1" font-size="12.5" font-weight="bold" fill="#78350f" text-anchor="middle">Monitoring &amp; Controlling</text><rect x="602.0" y="112.0" width="180.0" height="76.0" rx="8" fill="#ffffff" stroke="#d97706" stroke-width="1.6"/><text x="612.0" y="134.0" font-size="12.5" font-weight="bold" fill="#78350f" text-anchor="start">Monitor and Control</text><text x="612.0" y="149.0" font-size="12.5" font-weight="bold" fill="#78350f" text-anchor="start">Project Performance</text><text x="612.0" y="176.0" font-size="11.5" font-weight="normal" fill="#6b7280" text-anchor="start">Topic 28</text><rect x="602.0" y="196.0" width="180.0" height="76.0" rx="8" fill="#ffffff" stroke="#d97706" stroke-width="1.6"/><text x="612.0" y="218.0" font-size="12.5" font-weight="bold" fill="#78350f" text-anchor="start">Assess and Implement</text><text x="612.0" y="233.0" font-size="12.5" font-weight="bold" fill="#78350f" text-anchor="start">Changes</text><text x="612.0" y="260.0" font-size="11.5" font-weight="normal" fill="#6b7280" text-anchor="start">Topic 29</text><rect x="796.0" y="66.0" width="180.0" height="36.0" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.6"/><text x="886.0" y="88.1" font-size="12.5" font-weight="bold" fill="#4c1d95" text-anchor="middle">Closing</text><rect x="796.0" y="112.0" width="180.0" height="76.0" rx="8" fill="#ffffff" stroke="#7c3aed" stroke-width="1.6"/><text x="806.0" y="134.0" font-size="12.5" font-weight="bold" fill="#4c1d95" text-anchor="start">Close Project or Phase</text><text x="806.0" y="176.0" font-size="11.5" font-weight="normal" fill="#6b7280" text-anchor="start">Topic 35</text><rect x="20.0" y="376.0" width="940.0" height="50.0" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.6"/><text x="490.0" y="397.4" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">Governance also decides the sourcing strategy (insource or outsource), manages dependencies, risks, issues and escalations, balances competing demands, and keeps the</text><text x="490.0" y="412.4" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">governance framework itself under review.</text></svg>