<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 540" width="980" height="540" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">Tuckman ladder and leadership emphasis</title><desc id="d">Five stages of team development: forming, storming, norming, performing and adjourning, with a team performance curve and the leader's emphasis at each stage, from more directive to more delegating.</desc><defs></defs><rect x="0.75" y="0.75" width="978.5" height="538.5" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><text x="20.0" y="28.0" font-size="18" font-weight="bold" fill="#1f2937" text-anchor="start">Team development (Tuckman ladder) and what the leader emphasizes</text><text x="20.0" y="48.0" font-size="12" font-weight="normal" fill="#6b7280" text-anchor="start">Stages usually run in order but teams can get stuck, regress, or skip a stage; match the style to the stage</text><line x1="20.0" y1="236.0" x2="960.0" y2="236.0" stroke="#6b7280" stroke-width="1.2"/><text x="20.0" y="78.0" font-size="11" font-weight="bold" fill="#6b7280" text-anchor="start">Team performance</text><polyline points="110.0,190.0 119.5,190.2 129.0,190.7 138.5,191.5 148.0,192.5 157.5,193.8 167.0,195.2 176.5,196.8 186.0,198.4 195.5,200.2 205.0,202.0 214.5,203.8 224.0,205.6 233.5,207.2 243.0,208.8 252.5,210.2 262.0,211.5 271.5,212.5 281.0,213.3 290.5,213.8 300.0,214.0 300.0,214.0 309.5,213.5 319.0,212.2 328.5,210.1 338.0,207.3 347.5,204.0 357.0,200.2 366.5,196.0 376.0,191.5 385.5,186.8 395.0,182.0 404.5,177.2 414.0,172.5 423.5,168.0 433.0,163.8 442.5,160.0 452.0,156.7 461.5,153.9 471.0,151.8 480.5,150.5 490.0,150.0 490.0,150.0 499.5,149.6 509.0,148.5 518.5,146.7 528.0,144.4 537.5,141.6 547.0,138.3 556.5,134.8 566.0,131.0 575.5,127.0 585.0,123.0 594.5,119.0 604.0,115.0 613.5,111.2 623.0,107.7 632.5,104.4 642.0,101.6 651.5,99.3 661.0,97.5 670.5,96.4 680.0,96.0 680.0,96.0 689.5,96.3 699.0,97.2 708.5,98.7 718.0,100.6 727.5,102.9 737.0,105.5 746.5,108.4 756.0,111.5 765.5,114.7 775.0,118.0 784.5,121.3 794.0,124.5 803.5,127.6 813.0,130.5 822.5,133.1 832.0,135.4 841.5,137.3 851.0,138.8 860.5,139.7 870.0,140.0" fill="none" stroke="#1e3a8a" stroke-width="3.2" stroke-linejoin="round"/><circle cx="110.0" cy="190.0" r="7" fill="#dbeafe" stroke="#2563eb" stroke-width="2.2"/><circle cx="300.0" cy="214.0" r="7" fill="#fee2e2" stroke="#dc2626" stroke-width="2.2"/><circle cx="490.0" cy="150.0" r="7" fill="#ccfbf1" stroke="#0d9488" stroke-width="2.2"/><circle cx="680.0" cy="96.0" r="7" fill="#dcfce7" stroke="#16a34a" stroke-width="2.2"/><circle cx="870.0" cy="140.0" r="7" fill="#ede9fe" stroke="#7c3aed" stroke-width="2.2"/><rect x="20.0" y="246.0" width="180.0" height="206.0" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="1.7"/><rect x="20.0" y="246.0" width="180.0" height="32.0" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.7"/><text x="110.0" y="268.0" font-size="13" font-weight="bold" fill="#1e3a8a" text-anchor="middle">Forming</text><text x="30.0" y="298.0" font-size="10" font-weight="bold" fill="#6b7280" text-anchor="start">The team</text><text x="30.0" y="312.0" font-size="10.6" font-weight="normal" fill="#1f2937" text-anchor="start">Members meet, learn the project</text><text x="30.0" y="324.9" font-size="10.6" font-weight="normal" fill="#1f2937" text-anchor="start">and formal roles; independent,</text><text x="30.0" y="337.9" font-size="10.6" font-weight="normal" fill="#1f2937" text-anchor="start">polite, not yet open.</text><text x="30.0" y="358.8" font-size="10" font-weight="bold" fill="#6b7280" text-anchor="start">Leader emphasis</text><text x="30.0" y="372.8" font-size="10.6" font-weight="bold" fill="#1e3a8a" text-anchor="start">Set direction: vision, roles,</text><text x="30.0" y="385.7" font-size="10.6" font-weight="bold" fill="#1e3a8a" text-anchor="start">expectations and ground rules;</text><text x="30.0" y="398.7" font-size="10.6" font-weight="bold" fill="#1e3a8a" text-anchor="start">give structure.</text><rect x="210.0" y="246.0" width="180.0" height="206.0" rx="10" fill="#ffffff" stroke="#dc2626" stroke-width="1.7"/><rect x="210.0" y="246.0" width="180.0" height="32.0" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="1.7"/><text x="300.0" y="268.0" font-size="13" font-weight="bold" fill="#7f1d1d" text-anchor="middle">Storming</text><text x="220.0" y="298.0" font-size="10" font-weight="bold" fill="#6b7280" text-anchor="start">The team</text><text x="220.0" y="312.0" font-size="10.6" font-weight="normal" fill="#1f2937" text-anchor="start">Work, technical decisions and</text><text x="220.0" y="324.9" font-size="10.6" font-weight="normal" fill="#1f2937" text-anchor="start">approach are contested;</text><text x="220.0" y="337.9" font-size="10.6" font-weight="normal" fill="#1f2937" text-anchor="start">counterproductive if people are</text><text x="220.0" y="350.8" font-size="10.6" font-weight="normal" fill="#1f2937" text-anchor="start">not open to other views.</text><text x="220.0" y="371.7" font-size="10" font-weight="bold" fill="#6b7280" text-anchor="start">Leader emphasis</text><text x="220.0" y="385.7" font-size="10.6" font-weight="bold" fill="#7f1d1d" text-anchor="start">Coach and facilitate: surface</text><text x="220.0" y="398.7" font-size="10.6" font-weight="bold" fill="#7f1d1d" text-anchor="start">conflict early, reinforce team</text><text x="220.0" y="411.6" font-size="10.6" font-weight="bold" fill="#7f1d1d" text-anchor="start">agreements, keep people</text><text x="220.0" y="424.5" font-size="10.6" font-weight="bold" fill="#7f1d1d" text-anchor="start">talking.</text><rect x="400.0" y="246.0" width="180.0" height="206.0" rx="10" fill="#ffffff" stroke="#0d9488" stroke-width="1.7"/><rect x="400.0" y="246.0" width="180.0" height="32.0" rx="10" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.7"/><text x="490.0" y="268.0" font-size="13" font-weight="bold" fill="#134e4a" text-anchor="middle">Norming</text><text x="410.0" y="298.0" font-size="10" font-weight="bold" fill="#6b7280" text-anchor="start">The team</text><text x="410.0" y="312.0" font-size="10.6" font-weight="normal" fill="#1f2937" text-anchor="start">Habits adjust; members start to</text><text x="410.0" y="324.9" font-size="10.6" font-weight="normal" fill="#1f2937" text-anchor="start">trust one another and work</text><text x="410.0" y="337.9" font-size="10.6" font-weight="normal" fill="#1f2937" text-anchor="start">together.</text><text x="410.0" y="358.8" font-size="10" font-weight="bold" fill="#6b7280" text-anchor="start">Leader emphasis</text><text x="410.0" y="372.8" font-size="10.6" font-weight="bold" fill="#134e4a" text-anchor="start">Support: encourage</text><text x="410.0" y="385.7" font-size="10.6" font-weight="bold" fill="#134e4a" text-anchor="start">collaboration, build processes,</text><text x="410.0" y="398.7" font-size="10.6" font-weight="bold" fill="#134e4a" text-anchor="start">begin to delegate.</text><rect x="590.0" y="246.0" width="180.0" height="206.0" rx="10" fill="#ffffff" stroke="#16a34a" stroke-width="1.7"/><rect x="590.0" y="246.0" width="180.0" height="32.0" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.7"/><text x="680.0" y="268.0" font-size="13" font-weight="bold" fill="#14532d" text-anchor="middle">Performing</text><text x="600.0" y="298.0" font-size="10" font-weight="bold" fill="#6b7280" text-anchor="start">The team</text><text x="600.0" y="312.0" font-size="10.6" font-weight="normal" fill="#1f2937" text-anchor="start">A well-organized, interdependent</text><text x="600.0" y="324.9" font-size="10.6" font-weight="normal" fill="#1f2937" text-anchor="start">unit that works through issues</text><text x="600.0" y="337.9" font-size="10.6" font-weight="normal" fill="#1f2937" text-anchor="start">smoothly.</text><text x="600.0" y="358.8" font-size="10" font-weight="bold" fill="#6b7280" text-anchor="start">Leader emphasis</text><text x="600.0" y="372.8" font-size="10.6" font-weight="bold" fill="#14532d" text-anchor="start">Delegate and empower:</text><text x="600.0" y="385.7" font-size="10.6" font-weight="bold" fill="#14532d" text-anchor="start">remove impediments,</text><text x="600.0" y="398.7" font-size="10.6" font-weight="bold" fill="#14532d" text-anchor="start">recognize, develop people.</text><rect x="780.0" y="246.0" width="180.0" height="206.0" rx="10" fill="#ffffff" stroke="#7c3aed" stroke-width="1.7"/><rect x="780.0" y="246.0" width="180.0" height="32.0" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.7"/><text x="870.0" y="268.0" font-size="13" font-weight="bold" fill="#4c1d95" text-anchor="middle">Adjourning</text><text x="790.0" y="298.0" font-size="10" font-weight="bold" fill="#6b7280" text-anchor="start">The team</text><text x="790.0" y="312.0" font-size="10.6" font-weight="normal" fill="#1f2937" text-anchor="start">Work completes and people</text><text x="790.0" y="324.9" font-size="10.6" font-weight="normal" fill="#1f2937" text-anchor="start">move on as deliverables finish.</text><text x="790.0" y="345.9" font-size="10" font-weight="bold" fill="#6b7280" text-anchor="start">Leader emphasis</text><text x="790.0" y="359.9" font-size="10.6" font-weight="bold" fill="#4c1d95" text-anchor="start">Recognize and celebrate,</text><text x="790.0" y="372.8" font-size="10.6" font-weight="bold" fill="#4c1d95" text-anchor="start">capture lessons, support</text><text x="790.0" y="385.7" font-size="10.6" font-weight="bold" fill="#4c1d95" text-anchor="start">transitions, release resources.</text><rect x="20.0" y="466.0" width="940.0" height="60.0" rx="8" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.3"/><text x="32.0" y="486.0" font-size="11.5" font-weight="bold" fill="#1f2937" text-anchor="start">Style moves from directive to delegating as the team matures</text><rect x="32.0" y="494.0" width="140.0" height="24.0" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/><text x="102.0" y="511.0" font-size="11.5" font-weight="bold" fill="#2563eb" text-anchor="middle">Directive</text><rect x="188.0" y="494.0" width="140.0" height="24.0" rx="12" fill="#fee2e2" stroke="#dc2626" stroke-width="1.4"/><text x="258.0" y="511.0" font-size="11.5" font-weight="bold" fill="#dc2626" text-anchor="middle">Coaching</text><rect x="344.0" y="494.0" width="140.0" height="24.0" rx="12" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.4"/><text x="414.0" y="511.0" font-size="11.5" font-weight="bold" fill="#0d9488" text-anchor="middle">Supporting</text><rect x="500.0" y="494.0" width="140.0" height="24.0" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="1.4"/><text x="570.0" y="511.0" font-size="11.5" font-weight="bold" fill="#16a34a" text-anchor="middle">Delegating</text><text x="668.0" y="502.0" font-size="10.5" font-weight="normal" fill="#6b7280" text-anchor="start">Crises, safety and compliance can call for a directive style</text><text x="668.0" y="514.6" font-size="10.5" font-weight="normal" fill="#6b7280" text-anchor="start">at any stage; mixed or experienced teams may skip stages.</text></svg>