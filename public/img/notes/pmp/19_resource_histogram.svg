<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 540" width="980" height="540" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">Resource histogram before and after optimization</title><desc id="d">Demand for one resource type by week against a capacity of four, with over-allocation in weeks 4 to 6, and the same work after resource optimization with demand within capacity.</desc><defs></defs><rect x="0.75" y="0.75" width="978.5" height="538.5" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><text x="20.0" y="28.0" font-size="18" font-weight="bold" fill="#1f2937" text-anchor="start">Resource histogram: over-allocation and optimization</text><text x="20.0" y="48.0" font-size="12" font-weight="normal" fill="#6b7280" text-anchor="start">Demand per week against available capacity; optimization moves work so demand fits supply</text><text x="30.0" y="92.0" font-size="12" font-weight="bold" fill="#1e3a8a" text-anchor="start">Before: demand exceeds capacity in weeks 4 to 6</text><rect x="43.0" y="221.4" width="34.0" height="48.6" rx="2" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/><text x="60.0" y="284.0" font-size="10" font-weight="normal" fill="#6b7280" text-anchor="middle">1</text><text x="60.0" y="217.4" font-size="10" font-weight="bold" fill="#2563eb" text-anchor="middle">2</text><rect x="83.0" y="197.1" width="34.0" height="72.9" rx="2" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/><text x="100.0" y="284.0" font-size="10" font-weight="normal" fill="#6b7280" text-anchor="middle">2</text><text x="100.0" y="193.1" font-size="10" font-weight="bold" fill="#2563eb" text-anchor="middle">3</text><rect x="123.0" y="172.9" width="34.0" height="97.1" rx="2" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/><text x="140.0" y="284.0" font-size="10" font-weight="normal" fill="#6b7280" text-anchor="middle">3</text><text x="140.0" y="168.9" font-size="10" font-weight="bold" fill="#2563eb" text-anchor="middle">4</text><rect x="163.0" y="124.3" width="34.0" height="145.7" rx="2" fill="#fee2e2" stroke="#dc2626" stroke-width="1.4"/><text x="180.0" y="284.0" font-size="10" font-weight="normal" fill="#6b7280" text-anchor="middle">4</text><text x="180.0" y="120.3" font-size="10" font-weight="bold" fill="#dc2626" text-anchor="middle">6</text><rect x="203.0" y="124.3" width="34.0" height="145.7" rx="2" fill="#fee2e2" stroke="#dc2626" stroke-width="1.4"/><text x="220.0" y="284.0" font-size="10" font-weight="normal" fill="#6b7280" text-anchor="middle">5</text><text x="220.0" y="120.3" font-size="10" font-weight="bold" fill="#dc2626" text-anchor="middle">6</text><rect x="243.0" y="148.6" width="34.0" height="121.4" rx="2" fill="#fee2e2" stroke="#dc2626" stroke-width="1.4"/><text x="260.0" y="284.0" font-size="10" font-weight="normal" fill="#6b7280" text-anchor="middle">6</text><text x="260.0" y="144.6" font-size="10" font-weight="bold" fill="#dc2626" text-anchor="middle">5</text><rect x="283.0" y="197.1" width="34.0" height="72.9" rx="2" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/><text x="300.0" y="284.0" font-size="10" font-weight="normal" fill="#6b7280" text-anchor="middle">7</text><text x="300.0" y="193.1" font-size="10" font-weight="bold" fill="#2563eb" text-anchor="middle">3</text><rect x="323.0" y="221.4" width="34.0" height="48.6" rx="2" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/><text x="340.0" y="284.0" font-size="10" font-weight="normal" fill="#6b7280" text-anchor="middle">8</text><text x="340.0" y="217.4" font-size="10" font-weight="bold" fill="#2563eb" text-anchor="middle">2</text><rect x="363.0" y="245.7" width="34.0" height="24.3" rx="2" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/><text x="380.0" y="284.0" font-size="10" font-weight="normal" fill="#6b7280" text-anchor="middle">9</text><text x="380.0" y="241.7" font-size="10" font-weight="bold" fill="#2563eb" text-anchor="middle">1</text><rect x="403.0" y="245.7" width="34.0" height="24.3" rx="2" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/><text x="420.0" y="284.0" font-size="10" font-weight="normal" fill="#6b7280" text-anchor="middle">10</text><text x="420.0" y="241.7" font-size="10" font-weight="bold" fill="#2563eb" text-anchor="middle">1</text><line x1="30.0" y1="172.9" x2="450.0" y2="172.9" stroke="#16a34a" stroke-width="2" stroke-dasharray="6 4"/><text x="448.0" y="167.9" font-size="10.5" font-weight="bold" fill="#14532d" text-anchor="end">capacity 4</text><line x1="30.0" y1="270.0" x2="450.0" y2="270.0" stroke="#6b7280" stroke-width="1.4"/><text x="240.0" y="300.0" font-size="10.5" font-weight="bold" fill="#6b7280" text-anchor="middle">Week</text><text x="30.0" y="322.0" font-size="12" font-weight="bold" fill="#1e3a8a" text-anchor="start">After: work shifted within the plan, demand within capacity</text><rect x="43.0" y="451.4" width="34.0" height="48.6" rx="2" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/><text x="60.0" y="514.0" font-size="10" font-weight="normal" fill="#6b7280" text-anchor="middle">1</text><text x="60.0" y="447.4" font-size="10" font-weight="bold" fill="#2563eb" text-anchor="middle">2</text><rect x="83.0" y="427.1" width="34.0" height="72.9" rx="2" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/><text x="100.0" y="514.0" font-size="10" font-weight="normal" fill="#6b7280" text-anchor="middle">2</text><text x="100.0" y="423.1" font-size="10" font-weight="bold" fill="#2563eb" text-anchor="middle">3</text><rect x="123.0" y="402.9" width="34.0" height="97.1" rx="2" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/><text x="140.0" y="514.0" font-size="10" font-weight="normal" fill="#6b7280" text-anchor="middle">3</text><text x="140.0" y="398.9" font-size="10" font-weight="bold" fill="#2563eb" text-anchor="middle">4</text><rect x="163.0" y="402.9" width="34.0" height="97.1" rx="2" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/><text x="180.0" y="514.0" font-size="10" font-weight="normal" fill="#6b7280" text-anchor="middle">4</text><text x="180.0" y="398.9" font-size="10" font-weight="bold" fill="#2563eb" text-anchor="middle">4</text><rect x="203.0" y="402.9" width="34.0" height="97.1" rx="2" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/><text x="220.0" y="514.0" font-size="10" font-weight="normal" fill="#6b7280" text-anchor="middle">5</text><text x="220.0" y="398.9" font-size="10" font-weight="bold" fill="#2563eb" text-anchor="middle">4</text><rect x="243.0" y="402.9" width="34.0" height="97.1" rx="2" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/><text x="260.0" y="514.0" font-size="10" font-weight="normal" fill="#6b7280" text-anchor="middle">6</text><text x="260.0" y="398.9" font-size="10" font-weight="bold" fill="#2563eb" text-anchor="middle">4</text><rect x="283.0" y="402.9" width="34.0" height="97.1" rx="2" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/><text x="300.0" y="514.0" font-size="10" font-weight="normal" fill="#6b7280" text-anchor="middle">7</text><text x="300.0" y="398.9" font-size="10" font-weight="bold" fill="#2563eb" text-anchor="middle">4</text><rect x="323.0" y="402.9" width="34.0" height="97.1" rx="2" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/><text x="340.0" y="514.0" font-size="10" font-weight="normal" fill="#6b7280" text-anchor="middle">8</text><text x="340.0" y="398.9" font-size="10" font-weight="bold" fill="#2563eb" text-anchor="middle">4</text><rect x="363.0" y="427.1" width="34.0" height="72.9" rx="2" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/><text x="380.0" y="514.0" font-size="10" font-weight="normal" fill="#6b7280" text-anchor="middle">9</text><text x="380.0" y="423.1" font-size="10" font-weight="bold" fill="#2563eb" text-anchor="middle">3</text><rect x="403.0" y="475.7" width="34.0" height="24.3" rx="2" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/><text x="420.0" y="514.0" font-size="10" font-weight="normal" fill="#6b7280" text-anchor="middle">10</text><text x="420.0" y="471.7" font-size="10" font-weight="bold" fill="#2563eb" text-anchor="middle">1</text><line x1="30.0" y1="402.9" x2="450.0" y2="402.9" stroke="#16a34a" stroke-width="2" stroke-dasharray="6 4"/><text x="448.0" y="397.9" font-size="10.5" font-weight="bold" fill="#14532d" text-anchor="end">capacity 4</text><line x1="30.0" y1="500.0" x2="450.0" y2="500.0" stroke="#6b7280" stroke-width="1.4"/><text x="240.0" y="530.0" font-size="10.5" font-weight="bold" fill="#6b7280" text-anchor="middle">Week</text><rect x="500.0" y="64.0" width="460.0" height="440.0" rx="8" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.2"/><text x="514.0" y="86.0" font-size="12.5" font-weight="bold" fill="#1f2937" text-anchor="start">What the histogram tells you and what to do</text><text x="514.0" y="108.0" font-size="11.2" font-weight="bold" fill="#6b7280" text-anchor="start">•</text><text x="526.0" y="108.0" font-size="11.2" font-weight="normal" fill="#1f2937" text-anchor="start">A resource histogram (schedule data) shows required resources by period. Bars</text><text x="526.0" y="121.7" font-size="11.2" font-weight="normal" fill="#1f2937" text-anchor="start">above capacity mark over-allocation; deep valleys show idle capacity.</text><text x="514.0" y="141.3" font-size="11.2" font-weight="bold" fill="#6b7280" text-anchor="start">•</text><text x="526.0" y="141.3" font-size="11.2" font-weight="normal" fill="#1f2937" text-anchor="start">Same total work, same people: the demand moves from the peak to the weeks that</text><text x="526.0" y="155.0" font-size="11.2" font-weight="normal" fill="#1f2937" text-anchor="start">have room.</text><rect x="514.0" y="178.7" width="432.0" height="57.6" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.4"/><text x="526.0" y="198.7" font-size="12" font-weight="bold" fill="#14532d" text-anchor="start">Resource smoothing</text><text x="526.0" y="214.7" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="start">Moves activities only within their free and total float: the critical path and end date</text><text x="526.0" y="228.4" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="start">stay the same. Try first for non-critical work.</text><rect x="514.0" y="246.3" width="432.0" height="57.6" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.4"/><text x="526.0" y="266.3" font-size="12" font-weight="bold" fill="#4c1d95" text-anchor="start">Resource leveling</text><text x="526.0" y="282.3" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="start">Adjusts start and finish dates to fit supply when shared or critical resources are</text><text x="526.0" y="296.0" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="start">limited. May change the critical path and delay the end date.</text><rect x="514.0" y="313.9" width="432.0" height="71.4" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.4"/><text x="526.0" y="333.9" font-size="12" font-weight="bold" fill="#78350f" text-anchor="start">Other options</text><text x="526.0" y="349.9" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="start">Reassign or share resources, add capacity (contractor, overtime with care), reduce</text><text x="526.0" y="363.6" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="start">scope or change sequence; use alternative analysis and cost-benefit analysis, then</text><text x="526.0" y="377.4" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="start">change control.</text><text x="514.0" y="401.3" font-size="10.8" font-weight="normal" fill="#6b7280" text-anchor="start">Also watch utilization (planned vs actual use), downtime, and the cost effects of</text><text x="514.0" y="414.4" font-size="10.8" font-weight="normal" fill="#6b7280" text-anchor="start">shortages: expedited shipping, rental surcharges, overtime, late-delivery penalties.</text></svg>