<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 540" width="980" height="540" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">Cost of quality</title><desc id="d">Cost of conformance (prevention and appraisal) rises with quality effort while cost of nonconformance (internal and external failure) falls; their sum is lowest at an optimal level of quality investment.</desc><defs></defs><rect x="0.75" y="0.75" width="978.5" height="538.5" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><text x="20.0" y="28.0" font-size="18" font-weight="bold" fill="#1f2937" text-anchor="start">Cost of quality (CoQ)</text><text x="20.0" y="48.0" font-size="12" font-weight="normal" fill="#6b7280" text-anchor="start">Money spent to avoid failures versus money spent because of failures; there is an optimal balance</text><rect x="20.0" y="66.0" width="440.0" height="20.0" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/><text x="240.0" y="81.0" font-size="11" font-weight="bold" fill="#14532d" text-anchor="middle">COST OF CONFORMANCE: spent during the project to avoid failures</text><rect x="20.0" y="92.0" width="215.0" height="116.0" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="31.0" y="132.9" font-size="11" font-weight="bold" fill="#14532d" text-anchor="start">Prevention</text><text x="31.0" y="146.7" font-size="11" font-weight="normal" fill="#14532d" text-anchor="start">Build a quality product: training,</text><text x="31.0" y="160.4" font-size="11" font-weight="normal" fill="#14532d" text-anchor="start">documented processes, equipment,</text><text x="31.0" y="174.2" font-size="11" font-weight="normal" fill="#14532d" text-anchor="start">time to do it right</text><rect x="245.0" y="92.0" width="215.0" height="116.0" rx="8" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.6"/><text x="256.0" y="139.8" font-size="11" font-weight="bold" fill="#134e4a" text-anchor="start">Appraisal</text><text x="256.0" y="153.6" font-size="11" font-weight="normal" fill="#134e4a" text-anchor="start">Assess the quality: testing, inspections,</text><text x="256.0" y="167.3" font-size="11" font-weight="normal" fill="#134e4a" text-anchor="start">destructive-testing loss, audits</text><rect x="20.0" y="226.0" width="440.0" height="20.0" rx="4" fill="#fee2e2" stroke="#dc2626" stroke-width="1.2"/><text x="240.0" y="241.0" font-size="11" font-weight="bold" fill="#7f1d1d" text-anchor="middle">COST OF NONCONFORMANCE: spent because of failures</text><rect x="20.0" y="252.0" width="215.0" height="116.0" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="31.0" y="299.8" font-size="11" font-weight="bold" fill="#78350f" text-anchor="start">Internal failure</text><text x="31.0" y="313.6" font-size="11" font-weight="normal" fill="#78350f" text-anchor="start">Found by the project: rework, scrap,</text><text x="31.0" y="327.3" font-size="11" font-weight="normal" fill="#78350f" text-anchor="start">retesting, delay</text><rect x="245.0" y="252.0" width="215.0" height="116.0" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.6"/><text x="256.0" y="292.9" font-size="11" font-weight="bold" fill="#7f1d1d" text-anchor="start">External failure</text><text x="256.0" y="306.7" font-size="11" font-weight="normal" fill="#7f1d1d" text-anchor="start">Found by the customer: warranty work,</text><text x="256.0" y="320.4" font-size="11" font-weight="normal" fill="#7f1d1d" text-anchor="start">liabilities, returns, lost business,</text><text x="256.0" y="334.2" font-size="11" font-weight="normal" fill="#7f1d1d" text-anchor="start">reputation</text><rect x="20.0" y="384.0" width="440.0" height="138.0" rx="8" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.2"/><text x="32.0" y="404.0" font-size="11.3" font-weight="bold" fill="#6b7280" text-anchor="start">•</text><text x="44.0" y="404.0" font-size="11.2" font-weight="normal" fill="#1f2937" text-anchor="start">Prevention costs less than appraisal, and appraisal costs less than failure;</text><text x="44.0" y="417.7" font-size="11.2" font-weight="normal" fill="#1f2937" text-anchor="start">failures found by the customer cost the most.</text><text x="32.0" y="435.3" font-size="11.3" font-weight="bold" fill="#6b7280" text-anchor="start">•</text><text x="44.0" y="435.3" font-size="11.2" font-weight="normal" fill="#1f2937" text-anchor="start">Finding defects early (early testing) lowers the cost of fixing them.</text><text x="32.0" y="453.0" font-size="11.3" font-weight="bold" fill="#6b7280" text-anchor="start">•</text><text x="44.0" y="453.0" font-size="11.2" font-weight="normal" fill="#1f2937" text-anchor="start">Sustainability link: rework and scrap waste materials and energy, so prevention</text><text x="44.0" y="466.7" font-size="11.2" font-weight="normal" fill="#1f2937" text-anchor="start">also cuts environmental cost.</text><text x="32.0" y="484.3" font-size="11.3" font-weight="bold" fill="#6b7280" text-anchor="start">•</text><text x="44.0" y="484.3" font-size="11.2" font-weight="normal" fill="#1f2937" text-anchor="start">More inspection alone does not fix a process that creates defects; invest in</text><text x="44.0" y="498.0" font-size="11.2" font-weight="normal" fill="#1f2937" text-anchor="start">prevention.</text><line x1="520.0" y1="84.0" x2="520.0" y2="440.0" stroke="#6b7280" stroke-width="1.6"/><line x1="520.0" y1="440.0" x2="940.0" y2="440.0" stroke="#6b7280" stroke-width="1.6"/><text x="730.0" y="466.0" font-size="11.5" font-weight="bold" fill="#6b7280" text-anchor="middle">Level of conformance (quality effort and results)</text><text x="484.0" y="262.0" font-size="11.5" font-weight="bold" fill="#6b7280" text-anchor="middle" transform="rotate(-90 484.0 262.0)">Cost</text><polyline points="520.0,398.9 527.0,398.9 534.0,398.7 541.0,398.3 548.0,397.9 555.0,397.3 562.0,396.6 569.0,395.8 576.0,394.8 583.0,393.7 590.0,392.5 597.0,391.1 604.0,389.6 611.0,388.0 618.0,386.3 625.0,384.4 632.0,382.4 639.0,380.2 646.0,378.0 653.0,375.6 660.0,373.1 667.0,370.4 674.0,367.6 681.0,364.7 688.0,361.7 695.0,358.5 702.0,355.2 709.0,351.8 716.0,348.2 723.0,344.5 730.0,340.7 737.0,336.8 744.0,332.7 751.0,328.5 758.0,324.2 765.0,319.7 772.0,315.1 779.0,310.4 786.0,305.6 793.0,300.6 800.0,295.5 807.0,290.2 814.0,284.9 821.0,279.4 828.0,273.7 835.0,268.0 842.0,262.1 849.0,256.1 856.0,250.0 863.0,243.7 870.0,237.3 877.0,230.7 884.0,224.1 891.0,217.3 898.0,210.4 905.0,203.3 912.0,196.2 919.0,188.8 926.0,181.4 933.0,173.8 940.0,166.2" fill="none" stroke="#16a34a" stroke-width="3" stroke-linejoin="round"/><polyline points="520.0,138.8 527.0,147.8 534.0,156.7 541.0,165.5 548.0,174.1 555.0,182.5 562.0,190.8 569.0,198.9 576.0,206.9 583.0,214.8 590.0,222.4 597.0,230.0 604.0,237.4 611.0,244.6 618.0,251.7 625.0,258.6 632.0,265.3 639.0,272.0 646.0,278.4 653.0,284.7 660.0,290.9 667.0,296.9 674.0,302.8 681.0,308.5 688.0,314.0 695.0,319.4 702.0,324.7 709.0,329.8 716.0,334.7 723.0,339.5 730.0,344.2 737.0,348.6 744.0,353.0 751.0,357.2 758.0,361.2 765.0,365.1 772.0,368.8 779.0,372.4 786.0,375.8 793.0,379.1 800.0,382.2 807.0,385.2 814.0,388.0 821.0,390.6 828.0,393.1 835.0,395.5 842.0,397.7 849.0,399.8 856.0,401.7 863.0,403.4 870.0,405.0 877.0,406.5 884.0,407.7 891.0,408.9 898.0,409.9 905.0,410.7 912.0,411.4 919.0,411.9 926.0,412.3 933.0,412.5 940.0,412.6" fill="none" stroke="#dc2626" stroke-width="3" stroke-linejoin="round"/><polyline points="520.0,97.7 527.0,106.7 534.0,115.4 541.0,123.8 548.0,132.0 555.0,139.8 562.0,147.4 569.0,154.7 576.0,161.7 583.0,168.4 590.0,174.9 597.0,181.1 604.0,187.0 611.0,192.6 618.0,197.9 625.0,203.0 632.0,207.7 639.0,212.2 646.0,216.4 653.0,220.3 660.0,224.0 667.0,227.3 674.0,230.4 681.0,233.2 688.0,235.7 695.0,237.9 702.0,239.9 709.0,241.6 716.0,243.0 723.0,244.1 730.0,244.9 737.0,245.4 744.0,245.7 751.0,245.7 758.0,245.4 765.0,244.8 772.0,243.9 779.0,242.8 786.0,241.4 793.0,239.6 800.0,237.7 807.0,235.4 814.0,232.8 821.0,230.0 828.0,226.9 835.0,223.5 842.0,219.8 849.0,215.9 856.0,211.6 863.0,207.1 870.0,202.3 877.0,197.2 884.0,191.8 891.0,186.2 898.0,180.3 905.0,174.0 912.0,167.6 919.0,160.8 926.0,153.7 933.0,146.4 940.0,138.8" fill="none" stroke="#1e3a8a" stroke-width="3.5" stroke-linejoin="round"/><line x1="747.0" y1="245.7" x2="747.0" y2="440.0" stroke="#7c3aed" stroke-width="1.6" stroke-dasharray="4 3"/><circle cx="747.0" cy="245.7" r="5" fill="#7c3aed" stroke="#ffffff" stroke-width="1.5"/><text x="747.0" y="452.0" font-size="10.5" font-weight="bold" fill="#4c1d95" text-anchor="middle">optimal</text><line x1="620.8" y1="96.4" x2="646.8" y2="96.4" stroke="#1e3a8a" stroke-width="3.2"/><text x="654.8" y="100.4" font-size="11" font-weight="bold" fill="#1e3a8a" text-anchor="start">Total cost of quality</text><line x1="620.8" y1="114.4" x2="646.8" y2="114.4" stroke="#16a34a" stroke-width="3.2"/><text x="654.8" y="118.4" font-size="11" font-weight="bold" fill="#14532d" text-anchor="start">Cost of conformance (prevention + appraisal)</text><line x1="620.8" y1="132.4" x2="646.8" y2="132.4" stroke="#dc2626" stroke-width="3.2"/><text x="654.8" y="136.4" font-size="11" font-weight="bold" fill="#dc2626" text-anchor="start">Cost of nonconformance (failures)</text><text x="528.0" y="488.0" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">Models show an optimal quality cost: beyond it, extra prevention and appraisal are</text><text x="528.0" y="501.0" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">neither beneficial nor cost-effective.</text></svg>