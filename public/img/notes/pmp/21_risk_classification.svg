<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">Risk classification: known and unknown</title><desc id="d">Four cells: Unknown-Known hidden fact, Unknown-Unknown emergent risk, Known-Known facts and requirements (not a risk), Known-Unknown classic risk.</desc><defs></defs><rect x="0.75" y="0.75" width="798.5" height="498.5" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><text x="20.0" y="28.0" font-size="18" font-weight="bold" fill="#1f2937" text-anchor="start">What counts as a risk? Known / unknown classification</text><text x="20.0" y="48.0" font-size="12" font-weight="normal" fill="#6b7280" text-anchor="start">PMBOK 8 Figure 2-46, with how each cell is handled in practice</text><rect x="24.0" y="66.0" width="376.0" height="190.0" rx="0" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.6"/><text x="212.0" y="102.0" font-size="19" font-weight="bold" fill="#4c1d95" text-anchor="middle">Unknown–Known</text><text x="212.0" y="124.0" font-size="14" font-weight="normal" fill="#4c1d95" text-anchor="middle">(Hidden fact)</text><text x="212.0" y="156.0" font-size="13" font-weight="normal" fill="#1f2937" text-anchor="middle">Knowledge exists in the community but not with the entity</text><text x="212.0" y="172.9" font-size="13" font-weight="normal" fill="#1f2937" text-anchor="middle">working on the endeavor.</text><text x="212.0" y="201.8" font-size="12.5" font-weight="bold" fill="#4c1d95" text-anchor="middle">Handle: surface it through experts, lessons learned,</text><text x="212.0" y="218.1" font-size="12.5" font-weight="bold" fill="#4c1d95" text-anchor="middle">historical information, stakeholders.</text><rect x="400.0" y="66.0" width="376.0" height="190.0" rx="0" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="588.0" y="102.0" font-size="19" font-weight="bold" fill="#1e3a8a" text-anchor="middle">Unknown–Unknown</text><text x="588.0" y="124.0" font-size="14" font-weight="normal" fill="#1e3a8a" text-anchor="middle">(Emergent risk)</text><text x="588.0" y="156.0" font-size="13" font-weight="normal" fill="#1f2937" text-anchor="middle">Knowledge does not exist within the sphere of influence.</text><text x="588.0" y="184.9" font-size="12.5" font-weight="bold" fill="#1e3a8a" text-anchor="middle">Handle: management reserve plus resilience (ability to</text><text x="588.0" y="201.2" font-size="12.5" font-weight="bold" fill="#1e3a8a" text-anchor="middle">absorb and recover).</text><rect x="24.0" y="256.0" width="376.0" height="190.0" rx="0" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="212.0" y="292.0" font-size="19" font-weight="bold" fill="#78350f" text-anchor="middle">Known–Known</text><text x="212.0" y="314.0" font-size="14" font-weight="normal" fill="#78350f" text-anchor="middle">(Facts and requirements)</text><text x="212.0" y="346.0" font-size="13" font-weight="normal" fill="#1f2937" text-anchor="middle">Managed as a part of scope. Not a risk.</text><text x="212.0" y="374.9" font-size="12.5" font-weight="bold" fill="#78350f" text-anchor="middle">Handle: plan it into scope, schedule and budget.</text><rect x="400.0" y="256.0" width="376.0" height="190.0" rx="0" fill="#fee2e2" stroke="#dc2626" stroke-width="1.6"/><text x="588.0" y="292.0" font-size="19" font-weight="bold" fill="#7f1d1d" text-anchor="middle">Known–Unknown</text><text x="588.0" y="314.0" font-size="14" font-weight="normal" fill="#7f1d1d" text-anchor="middle">(Classic risk)</text><text x="588.0" y="346.0" font-size="13" font-weight="normal" fill="#1f2937" text-anchor="middle">There is knowledge to identify probability and impact.</text><text x="588.0" y="374.9" font-size="12.5" font-weight="bold" fill="#7f1d1d" text-anchor="middle">Handle: risk register, response strategy, contingency</text><text x="588.0" y="391.1" font-size="12.5" font-weight="bold" fill="#7f1d1d" text-anchor="middle">reserve.</text><text x="400.0" y="486.0" font-size="12" font-weight="normal" fill="#6b7280" text-anchor="middle" font-style="italic">Rule of thumb: contingency reserve covers known-unknowns; management reserve covers unknown-unknowns.</text></svg>