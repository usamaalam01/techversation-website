<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 520" width="980" height="520" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">Structure of the project management plan</title><desc id="d">The integrated project management plan contains subsidiary management plans, the scope, schedule and cost baselines, the development approach and life cycle, and plans such as change and configuration management. Project documents are separate.</desc><defs></defs><rect x="0.75" y="0.75" width="978.5" height="518.5" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><text x="20.0" y="28.0" font-size="18" font-weight="bold" fill="#1f2937" text-anchor="start">What the integrated project management plan contains</text><text x="20.0" y="48.0" font-size="12" font-weight="normal" fill="#6b7280" text-anchor="start">PMBOK 8 Section 4: a living document that describes how the project is executed, monitored, controlled and closed; tailor its content</text><rect x="300.0" y="62.0" width="380.0" height="44.0" rx="8" fill="#1e3a8a" stroke="#1e3a8a" stroke-width="1.6"/><text x="490.0" y="88.4" font-size="13.5" font-weight="bold" fill="#ffffff" text-anchor="middle">PROJECT MANAGEMENT PLAN (living document)</text><text x="20.0" y="134.0" font-size="13.5" font-weight="bold" fill="#1e3a8a" text-anchor="start">Subsidiary management plans</text><rect x="20.0" y="146.0" width="188.0" height="40.0" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="114.0" y="169.6" font-size="11.2" font-weight="bold" fill="#1e3a8a" text-anchor="middle">Scope management plan</text><rect x="218.0" y="146.0" width="188.0" height="40.0" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="312.0" y="162.6" font-size="11.2" font-weight="bold" fill="#1e3a8a" text-anchor="middle">Requirements management</text><text x="312.0" y="176.6" font-size="11.2" font-weight="bold" fill="#1e3a8a" text-anchor="middle">plan</text><rect x="416.0" y="146.0" width="188.0" height="40.0" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="510.0" y="169.6" font-size="11.2" font-weight="bold" fill="#1e3a8a" text-anchor="middle">Schedule management plan</text><rect x="20.0" y="194.0" width="188.0" height="40.0" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="114.0" y="217.6" font-size="11.2" font-weight="bold" fill="#1e3a8a" text-anchor="middle">Financial management plan</text><rect x="218.0" y="194.0" width="188.0" height="40.0" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="312.0" y="217.6" font-size="11.2" font-weight="bold" fill="#1e3a8a" text-anchor="middle">Quality management plan</text><rect x="416.0" y="194.0" width="188.0" height="40.0" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="510.0" y="217.6" font-size="11.2" font-weight="bold" fill="#1e3a8a" text-anchor="middle">Resource management plan</text><rect x="20.0" y="242.0" width="188.0" height="40.0" rx="8" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.6"/><text x="114.0" y="258.6" font-size="11.2" font-weight="bold" fill="#134e4a" text-anchor="middle">Communications management</text><text x="114.0" y="272.6" font-size="11.2" font-weight="bold" fill="#134e4a" text-anchor="middle">plan</text><rect x="218.0" y="242.0" width="188.0" height="40.0" rx="8" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.6"/><text x="312.0" y="265.6" font-size="11.2" font-weight="bold" fill="#134e4a" text-anchor="middle">Stakeholder engagement plan</text><rect x="416.0" y="242.0" width="188.0" height="40.0" rx="8" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.6"/><text x="510.0" y="265.6" font-size="11.2" font-weight="bold" fill="#134e4a" text-anchor="middle">Risk management plan</text><rect x="20.0" y="290.0" width="188.0" height="40.0" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="114.0" y="313.6" font-size="11.2" font-weight="bold" fill="#14532d" text-anchor="middle">Sourcing strategy plan</text><rect x="218.0" y="290.0" width="188.0" height="40.0" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="312.0" y="313.6" font-size="11.2" font-weight="bold" fill="#14532d" text-anchor="middle">Procurement management plan</text><rect x="416.0" y="290.0" width="188.0" height="40.0" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="510.0" y="313.6" font-size="11.2" font-weight="bold" fill="#14532d" text-anchor="middle">Change management plan</text><text x="650.0" y="134.0" font-size="13.5" font-weight="bold" fill="#7c2d12" text-anchor="start">Baselines (performance measurement baseline)</text><rect x="650.0" y="146.0" width="310.0" height="48.0" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="805.0" y="166.6" font-size="11.5" font-weight="bold" fill="#78350f" text-anchor="middle">Scope baseline</text><text x="805.0" y="180.9" font-size="11.5" font-weight="normal" fill="#78350f" text-anchor="middle">scope statement + WBS + WBS dictionary</text><rect x="650.0" y="202.0" width="310.0" height="48.0" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="805.0" y="222.6" font-size="11.5" font-weight="bold" fill="#78350f" text-anchor="middle">Schedule baseline</text><text x="805.0" y="236.9" font-size="11.5" font-weight="normal" fill="#78350f" text-anchor="middle">approved schedule model</text><rect x="650.0" y="258.0" width="310.0" height="48.0" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="805.0" y="278.6" font-size="11.5" font-weight="bold" fill="#78350f" text-anchor="middle">Cost baseline</text><text x="805.0" y="292.9" font-size="11.5" font-weight="normal" fill="#78350f" text-anchor="middle">time-phased budget (excl. management reserve)</text><text x="650.0" y="322.0" font-size="13.5" font-weight="bold" fill="#14532d" text-anchor="start">Approach and other plans</text><rect x="650.0" y="334.0" width="310.0" height="40.0" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.6"/><text x="805.0" y="357.6" font-size="11.2" font-weight="bold" fill="#4c1d95" text-anchor="middle">Development approach and life cycle (tailoring)</text><rect x="650.0" y="382.0" width="310.0" height="40.0" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.6"/><text x="805.0" y="405.6" font-size="11.2" font-weight="bold" fill="#374151" text-anchor="middle">Configuration management plan</text><rect x="20.0" y="366.0" width="600.0" height="56.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="320.0" y="390.6" font-size="11.5" font-weight="bold" fill="#1f2937" text-anchor="middle">Adaptive plans too:</text><text x="320.0" y="404.9" font-size="11.5" font-weight="normal" fill="#1f2937" text-anchor="middle">release plan, iteration plan, test plan, product roadmap and backlog support the plan in agile work</text><rect x="20.0" y="438.0" width="940.0" height="64.0" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.6"/><text x="490.0" y="459.4" font-size="11.5" font-weight="bold" fill="#374151" text-anchor="middle">Not in the plan: project documents</text><text x="490.0" y="473.7" font-size="11.5" font-weight="normal" fill="#374151" text-anchor="middle">registers and logs (risk register, issue log, stakeholder register, assumption log, change log), schedule, requirements, lessons learned. They support the plan and change often;</text><text x="490.0" y="488.1" font-size="11.5" font-weight="normal" fill="#374151" text-anchor="middle">baselines change only through change control.</text></svg>