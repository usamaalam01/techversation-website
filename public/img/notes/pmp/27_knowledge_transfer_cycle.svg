<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 520" width="980" height="520" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">Knowledge transfer: identify, gather, foster, apply</title><desc id="d">Identify knowledge critical to the project and who holds it; gather it through documentation and interaction; foster an environment where knowledge flows; apply and improve, with triggers such as staff leaving, phase end, handover and each iteration or milestone.</desc><defs><marker id="ah0" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker><marker id="ah1" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker></defs><rect x="0.75" y="0.75" width="978.5" height="518.5" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><text x="20.0" y="28.0" font-size="18" font-weight="bold" fill="#1f2937" text-anchor="start">Helping ensure knowledge transfer</text><text x="20.0" y="48.0" font-size="12" font-weight="normal" fill="#6b7280" text-anchor="start">Three ECO enablers plus the loop that makes knowledge useful; act before the window closes</text><rect x="20.0" y="66.0" width="220.0" height="186.0" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.7"/><text x="32.0" y="90.0" font-size="12.5" font-weight="bold" fill="#1e3a8a" text-anchor="start">1 Identify critical knowledge</text><text x="32.0" y="132.0" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="start">What must not be lost or must be</text><text x="32.0" y="145.6" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="start">available later? Who holds it? Is it at</text><text x="32.0" y="159.3" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="start">risk of leaving (experts, retirees, vendor</text><text x="32.0" y="172.9" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="start">specialists, departing teams)?</text><line x1="241.0" y1="159.0" x2="259.0" y2="159.0" stroke="#1f2937" stroke-width="2.2" marker-end="url(#ah0)"/><rect x="260.0" y="66.0" width="220.0" height="186.0" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.7"/><text x="272.0" y="90.0" font-size="12.5" font-weight="bold" fill="#14532d" text-anchor="start">2 Gather knowledge</text><text x="272.0" y="132.0" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="start">Capture explicit knowledge in registers</text><text x="272.0" y="145.6" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="start">and repositories; capture tacit</text><text x="272.0" y="159.3" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="start">knowledge through interviews,</text><text x="272.0" y="172.9" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="start">shadowing, pairing, storytelling, AARs,</text><text x="272.0" y="186.6" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="start">retrospectives</text><line x1="481.0" y1="159.0" x2="499.0" y2="159.0" stroke="#1f2937" stroke-width="2.2" marker-end="url(#ah0)"/><rect x="500.0" y="66.0" width="220.0" height="186.0" rx="10" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.7"/><text x="512.0" y="90.0" font-size="12.5" font-weight="bold" fill="#134e4a" text-anchor="start">3 Foster the transfer</text><text x="512.0" y="104.4" font-size="12.5" font-weight="bold" fill="#134e4a" text-anchor="start">environment</text><text x="512.0" y="132.0" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="start">Trust, safety, time and space to share;</text><text x="512.0" y="145.6" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="start">networks and communities; mentoring;</text><text x="512.0" y="159.3" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="start">hands-on practice; searchable,</text><text x="512.0" y="172.9" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="start">accessible repository</text><line x1="721.0" y1="159.0" x2="739.0" y2="159.0" stroke="#1f2937" stroke-width="2.2" marker-end="url(#ah0)"/><rect x="740.0" y="66.0" width="220.0" height="186.0" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.7"/><text x="752.0" y="90.0" font-size="12.5" font-weight="bold" fill="#4c1d95" text-anchor="start">4 Apply and improve</text><text x="752.0" y="132.0" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="start">Use lessons in planning and work;</text><text x="752.0" y="145.6" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="start">update OPAs, checklists and</text><text x="752.0" y="159.3" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="start">processes; check that the receiver can</text><text x="752.0" y="172.9" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="start">now do the work</text><polyline points="850.0,253.0 850.0,270.0 130.0,270.0 130.0,254.0" fill="none" stroke="#7c3aed" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#ah1)" stroke-linejoin="round"/><text x="490.0" y="264.0" font-size="10.5" font-weight="bold" fill="#4c1d95" text-anchor="middle">repeat: new people, new phases, new lessons</text><rect x="20.0" y="290.0" width="460.0" height="224.0" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/><text x="32.0" y="310.0" font-size="12.5" font-weight="bold" fill="#78350f" text-anchor="start">Triggers: capture or transfer now</text><text x="32.0" y="330.0" font-size="11" font-weight="bold" fill="#6b7280" text-anchor="start">•</text><text x="44.0" y="330.0" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="start">An expert, retiree or vendor specialist is about to leave</text><text x="32.0" y="347.2" font-size="11" font-weight="bold" fill="#6b7280" text-anchor="start">•</text><text x="44.0" y="347.2" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="start">A crew, team or contractor is being released (phase end, handover)</text><text x="32.0" y="364.4" font-size="11" font-weight="bold" fill="#6b7280" text-anchor="start">•</text><text x="44.0" y="364.4" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="start">A milestone or iteration has just finished (retrospective, after-action review)</text><text x="32.0" y="381.6" font-size="11" font-weight="bold" fill="#6b7280" text-anchor="start">•</text><text x="44.0" y="381.6" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="start">A problem was solved or a surprise occurred (lesson while fresh)</text><text x="32.0" y="398.8" font-size="11" font-weight="bold" fill="#6b7280" text-anchor="start">•</text><text x="44.0" y="398.8" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="start">A new team will take over operations or the next phase</text><text x="32.0" y="416.0" font-size="11" font-weight="bold" fill="#6b7280" text-anchor="start">•</text><text x="44.0" y="416.0" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="start">A similar project is starting (pull earlier lessons forward)</text><rect x="500.0" y="290.0" width="460.0" height="224.0" rx="8" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.3"/><text x="512.0" y="310.0" font-size="12.5" font-weight="bold" fill="#1f2937" text-anchor="start">Make the transfer real, not just documented</text><text x="512.0" y="330.0" font-size="11" font-weight="bold" fill="#6b7280" text-anchor="start">•</text><text x="524.0" y="330.0" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="start">Pair receivers with the expert while the work is done (installation, commissioning,</text><text x="524.0" y="343.2" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="start">troubleshooting)</text><text x="512.0" y="360.4" font-size="11" font-weight="bold" fill="#6b7280" text-anchor="start">•</text><text x="524.0" y="360.4" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="start">Have receivers perform the task with support before handover: watching is not doing</text><text x="512.0" y="377.6" font-size="11" font-weight="bold" fill="#6b7280" text-anchor="start">•</text><text x="524.0" y="377.6" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="start">Make lessons searchable and walk the next team through the key ones</text><text x="512.0" y="394.8" font-size="11" font-weight="bold" fill="#6b7280" text-anchor="start">•</text><text x="524.0" y="394.8" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="start">Record context (video, pictures, audio) when text cannot carry it</text><text x="512.0" y="412.0" font-size="11" font-weight="bold" fill="#6b7280" text-anchor="start">•</text><text x="524.0" y="412.0" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="start">Name owners and an internal sponsor so improvements get implemented</text><text x="512.0" y="429.2" font-size="11" font-weight="bold" fill="#6b7280" text-anchor="start">•</text><text x="524.0" y="429.2" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="start">Use AI tools under a responsible-AI policy: protect sensitive data and check for</text><text x="524.0" y="442.4" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="start">hallucinations</text></svg>