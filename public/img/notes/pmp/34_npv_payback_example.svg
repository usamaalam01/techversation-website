<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 528" width="980" height="528" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">NPV, IRR and payback worked example</title><desc id="d">Project A invests 100,000 and receives 40,000, 50,000 and 60,000 in years one to three. At a 10 percent discount rate the present values are 36,364, 41,322 and 45,079, so NPV is 22,765, IRR is about 21.7 percent and payback is 2.17 years. Project B invests 70,000 and receives 40,000, 40,000 and 20,000; it has NPV 14,448, IRR about 22.7 percent and payback 1.75 years. Choose the project with the higher NPV.</desc><defs></defs><rect x="0.75" y="0.75" width="978.5" height="526.5" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><text x="20.0" y="28.0" font-size="18" font-weight="bold" fill="#1f2937" text-anchor="start">NPV, IRR and payback: a worked example</text><text x="20.0" y="48.0" font-size="12" font-weight="normal" fill="#6b7280" text-anchor="start">Project A: invest 100,000; receive 40,000, 50,000 and 60,000 in years 1 to 3; discount rate 10%</text><line x1="60.0" y1="208.0" x2="518.0" y2="208.0" stroke="#1f2937" stroke-width="1.5"/><text x="22.0" y="212.0" font-size="10.5" font-weight="normal" fill="#6b7280" text-anchor="start">0</text><rect x="60.0" y="70.0" width="14.0" height="12.0" rx="2" fill="#93c5fd" stroke="#2563eb" stroke-width="1.2"/><text x="80.0" y="80.0" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="start">Cash flow</text><rect x="160.0" y="70.0" width="14.0" height="12.0" rx="2" fill="#86efac" stroke="#16a34a" stroke-width="1.2"/><text x="180.0" y="80.0" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="start">Present value at 10%</text><rect x="70.0" y="208.0" width="36.0" height="115.0" rx="3" fill="#93c5fd" stroke="#2563eb" stroke-width="1.3"/><text x="108.0" y="335.0" font-size="9.5" font-weight="bold" fill="#1f2937" text-anchor="middle">−100,000 (PV equal)</text><rect x="110.0" y="208.0" width="36.0" height="115.0" rx="3" fill="#86efac" stroke="#16a34a" stroke-width="1.3"/><text x="108.0" y="360.0" font-size="11.5" font-weight="bold" fill="#1f2937" text-anchor="middle">Year 0</text><rect x="182.0" y="162.0" width="36.0" height="46.0" rx="3" fill="#93c5fd" stroke="#2563eb" stroke-width="1.3"/><text x="200.0" y="157.0" font-size="9.5" font-weight="bold" fill="#1f2937" text-anchor="middle">40,000</text><rect x="222.0" y="166.2" width="36.0" height="41.8" rx="3" fill="#86efac" stroke="#16a34a" stroke-width="1.3"/><text x="240.0" y="161.2" font-size="9.5" font-weight="bold" fill="#1f2937" text-anchor="middle">36,364</text><text x="220.0" y="360.0" font-size="11.5" font-weight="bold" fill="#1f2937" text-anchor="middle">Year 1</text><rect x="294.0" y="150.5" width="36.0" height="57.5" rx="3" fill="#93c5fd" stroke="#2563eb" stroke-width="1.3"/><text x="312.0" y="145.5" font-size="9.5" font-weight="bold" fill="#1f2937" text-anchor="middle">50,000</text><rect x="334.0" y="160.5" width="36.0" height="47.5" rx="3" fill="#86efac" stroke="#16a34a" stroke-width="1.3"/><text x="352.0" y="155.5" font-size="9.5" font-weight="bold" fill="#1f2937" text-anchor="middle">41,322</text><text x="332.0" y="360.0" font-size="11.5" font-weight="bold" fill="#1f2937" text-anchor="middle">Year 2</text><rect x="406.0" y="139.0" width="36.0" height="69.0" rx="3" fill="#93c5fd" stroke="#2563eb" stroke-width="1.3"/><text x="424.0" y="134.0" font-size="9.5" font-weight="bold" fill="#1f2937" text-anchor="middle">60,000</text><rect x="446.0" y="156.2" width="36.0" height="51.8" rx="3" fill="#86efac" stroke="#16a34a" stroke-width="1.3"/><text x="464.0" y="151.2" font-size="9.5" font-weight="bold" fill="#1f2937" text-anchor="middle">45,079</text><text x="444.0" y="360.0" font-size="11.5" font-weight="bold" fill="#1f2937" text-anchor="middle">Year 3</text><text x="22.0" y="382.0" font-size="10.5" font-weight="bold" fill="#6b7280" text-anchor="start">Cumulative PV</text><text x="108.0" y="400.0" font-size="11.5" font-weight="bold" fill="#dc2626" text-anchor="middle">-100,000</text><text x="220.0" y="400.0" font-size="11.5" font-weight="bold" fill="#dc2626" text-anchor="middle">-63,636</text><text x="332.0" y="400.0" font-size="11.5" font-weight="bold" fill="#dc2626" text-anchor="middle">-22,314</text><text x="444.0" y="400.0" font-size="11.5" font-weight="bold" fill="#16a34a" text-anchor="middle">+22,765</text><text x="444.0" y="416.0" font-size="10.5" font-weight="bold" fill="#16a34a" text-anchor="middle">= NPV</text><rect x="560.0" y="62.0" width="398.0" height="222.0" rx="10" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/><text x="572.0" y="84.0" font-size="12.5" font-weight="bold" fill="#1f2937" text-anchor="start">Compare A with B</text><text x="572.0" y="100.0" font-size="10.5" font-weight="normal" fill="#6b7280" text-anchor="start">B: invest 70,000; receive 40,000, 40,000 and 20,000</text><text x="572.0" y="120.0" font-size="11" font-weight="bold" fill="#6b7280" text-anchor="start">Project</text><text x="652.0" y="120.0" font-size="11" font-weight="bold" fill="#6b7280" text-anchor="start">NPV at 10%</text><text x="752.0" y="120.0" font-size="11" font-weight="bold" fill="#6b7280" text-anchor="start">IRR</text><text x="822.0" y="120.0" font-size="11" font-weight="bold" fill="#6b7280" text-anchor="start">Payback</text><rect x="568.0" y="130.0" width="382.0" height="34.0" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.3"/><text x="580.0" y="152.0" font-size="12" font-weight="bold" fill="#1f2937" text-anchor="start">A</text><text x="652.0" y="152.0" font-size="12" font-weight="bold" fill="#14532d" text-anchor="start">+22,765</text><text x="752.0" y="152.0" font-size="12" font-weight="normal" fill="#1f2937" text-anchor="start">21.7%</text><text x="822.0" y="152.0" font-size="12" font-weight="normal" fill="#1f2937" text-anchor="start">2.17 years</text><rect x="568.0" y="172.0" width="382.0" height="34.0" rx="6" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.3"/><text x="580.0" y="194.0" font-size="12" font-weight="bold" fill="#1f2937" text-anchor="start">B</text><text x="652.0" y="194.0" font-size="12" font-weight="bold" fill="#1f2937" text-anchor="start">+14,448</text><text x="752.0" y="194.0" font-size="12" font-weight="normal" fill="#1f2937" text-anchor="start">22.7%</text><text x="822.0" y="194.0" font-size="12" font-weight="normal" fill="#1f2937" text-anchor="start">1.75 years</text><text x="572.0" y="226.0" font-size="11" font-weight="bold" fill="#14532d" text-anchor="start">Choose A: it adds the most value (highest NPV). B wins on IRR and</text><text x="572.0" y="239.4" font-size="11" font-weight="bold" fill="#14532d" text-anchor="start">payback, but neither measures total value, and payback ignores</text><text x="572.0" y="252.8" font-size="11" font-weight="bold" fill="#14532d" text-anchor="start">money after recovery and the time value of money.</text><rect x="560.0" y="298.0" width="398.0" height="214.0" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="572.0" y="320.0" font-size="12.5" font-weight="bold" fill="#78350f" text-anchor="start">Formulas</text><text x="572.0" y="340.0" font-size="10.8" font-weight="bold" fill="#6b7280" text-anchor="start">•</text><text x="584.0" y="340.0" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">PV = FV ÷ (1 + r)^n</text><text x="572.0" y="357.2" font-size="10.8" font-weight="bold" fill="#6b7280" text-anchor="start">•</text><text x="584.0" y="357.2" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">NPV = sum of CFt ÷ (1 + r)^t − initial investment; accept if NPV &gt; 0;</text><text x="584.0" y="370.4" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">compare by the higher NPV</text><text x="572.0" y="387.5" font-size="10.8" font-weight="bold" fill="#6b7280" text-anchor="start">•</text><text x="584.0" y="387.5" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">IRR = the discount rate at which NPV = 0; accept if IRR exceeds the</text><text x="584.0" y="400.7" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">required rate</text><text x="572.0" y="417.9" font-size="10.8" font-weight="bold" fill="#6b7280" text-anchor="start">•</text><text x="584.0" y="417.9" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">Payback = investment ÷ net annual inflow (even flows); for uneven flows,</text><text x="584.0" y="431.1" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">add the cumulative inflows until they reach the investment (A: 2 + 10,000 ÷</text><text x="584.0" y="444.2" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">60,000 = 2.17 years)</text><text x="572.0" y="461.4" font-size="10.8" font-weight="bold" fill="#6b7280" text-anchor="start">•</text><text x="584.0" y="461.4" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">ROI = net benefit ÷ cost; BCR = PV of benefits ÷ PV of costs (&gt; 1</text><text x="584.0" y="474.6" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">acceptable)</text><text x="572.0" y="491.8" font-size="10.8" font-weight="bold" fill="#6b7280" text-anchor="start">•</text><text x="584.0" y="491.8" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">Sunk cost is ignored; opportunity cost is the best alternative given up</text></svg>