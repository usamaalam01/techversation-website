<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 440" width="980" height="440" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">Benefits management cycle</title><desc id="d">Identify target benefits, plan how they will be measured and who owns them, deliver, measure and realize, then sustain in operations; learn and reprioritize throughout.</desc><defs><marker id="ah0" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker><marker id="ah1" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker></defs><rect x="0.75" y="0.75" width="978.5" height="438.5" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><text x="20.0" y="28.0" font-size="18" font-weight="bold" fill="#1f2937" text-anchor="start">Benefits management: create, maximize, sustain</text><text x="20.0" y="48.0" font-size="12" font-weight="normal" fill="#6b7280" text-anchor="start">Benefits are realized during, at the end of, or after the project; the benefits owner keeps tracking after closure</text><rect x="20.0" y="80.0" width="170.0" height="44.0" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="105.0" y="106.4" font-size="13.5" font-weight="bold" fill="#1e3a8a" text-anchor="middle">1 Identify</text><rect x="20.0" y="130.0" width="170.0" height="150.0" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/><text x="30.0" y="152.0" font-size="11.5" font-weight="normal" fill="#1f2937" text-anchor="start">Define target benefits with</text><text x="30.0" y="166.7" font-size="11.5" font-weight="normal" fill="#1f2937" text-anchor="start">key stakeholders (business</text><text x="30.0" y="181.4" font-size="11.5" font-weight="normal" fill="#1f2937" text-anchor="start">case, needs assessment);</text><text x="30.0" y="196.2" font-size="11.5" font-weight="normal" fill="#1f2937" text-anchor="start">tangible and intangible;</text><text x="30.0" y="210.9" font-size="11.5" font-weight="normal" fill="#1f2937" text-anchor="start">strategic alignment</text><line x1="192.0" y1="102.0" x2="210.0" y2="102.0" stroke="#1f2937" stroke-width="2.2" marker-end="url(#ah0)"/><rect x="212.0" y="80.0" width="170.0" height="44.0" rx="8" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.6"/><text x="297.0" y="106.4" font-size="13.5" font-weight="bold" fill="#134e4a" text-anchor="middle">2 Plan</text><rect x="212.0" y="130.0" width="170.0" height="150.0" rx="8" fill="#ffffff" stroke="#0d9488" stroke-width="1.5"/><text x="222.0" y="152.0" font-size="11.5" font-weight="normal" fill="#1f2937" text-anchor="start">Benefits management plan:</text><text x="222.0" y="166.7" font-size="11.5" font-weight="normal" fill="#1f2937" text-anchor="start">timeframe, benefits owner,</text><text x="222.0" y="181.4" font-size="11.5" font-weight="normal" fill="#1f2937" text-anchor="start">metrics, assumptions, risks;</text><text x="222.0" y="196.2" font-size="11.5" font-weight="normal" fill="#1f2937" text-anchor="start">measurement system in</text><text x="222.0" y="210.9" font-size="11.5" font-weight="normal" fill="#1f2937" text-anchor="start">place</text><line x1="384.0" y1="102.0" x2="402.0" y2="102.0" stroke="#1f2937" stroke-width="2.2" marker-end="url(#ah0)"/><rect x="404.0" y="80.0" width="170.0" height="44.0" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="489.0" y="106.4" font-size="13.5" font-weight="bold" fill="#14532d" text-anchor="middle">3 Deliver</text><rect x="404.0" y="130.0" width="170.0" height="150.0" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/><text x="414.0" y="152.0" font-size="11.5" font-weight="normal" fill="#1f2937" text-anchor="start">Build deliverables that</text><text x="414.0" y="166.7" font-size="11.5" font-weight="normal" fill="#1f2937" text-anchor="start">enable the outcomes;</text><text x="414.0" y="181.4" font-size="11.5" font-weight="normal" fill="#1f2937" text-anchor="start">prioritize by value; deliver</text><text x="414.0" y="196.2" font-size="11.5" font-weight="normal" fill="#1f2937" text-anchor="start">incrementally; enable</text><text x="414.0" y="210.9" font-size="11.5" font-weight="normal" fill="#1f2937" text-anchor="start">adoption (training, change</text><text x="414.0" y="225.6" font-size="11.5" font-weight="normal" fill="#1f2937" text-anchor="start">support)</text><line x1="576.0" y1="102.0" x2="594.0" y2="102.0" stroke="#1f2937" stroke-width="2.2" marker-end="url(#ah0)"/><rect x="596.0" y="80.0" width="170.0" height="44.0" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="681.0" y="106.4" font-size="13.5" font-weight="bold" fill="#78350f" text-anchor="middle">4 Measure and realize</text><rect x="596.0" y="130.0" width="170.0" height="150.0" rx="8" fill="#ffffff" stroke="#d97706" stroke-width="1.5"/><text x="606.0" y="152.0" font-size="11.5" font-weight="normal" fill="#1f2937" text-anchor="start">Track metrics against the</text><text x="606.0" y="166.7" font-size="11.5" font-weight="normal" fill="#1f2937" text-anchor="start">benefit targets; confirm</text><text x="606.0" y="181.4" font-size="11.5" font-weight="normal" fill="#1f2937" text-anchor="start">outcomes, not just outputs;</text><text x="606.0" y="196.2" font-size="11.5" font-weight="normal" fill="#1f2937" text-anchor="start">report to sponsor</text><line x1="768.0" y1="102.0" x2="786.0" y2="102.0" stroke="#1f2937" stroke-width="2.2" marker-end="url(#ah0)"/><rect x="788.0" y="80.0" width="170.0" height="44.0" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.6"/><text x="873.0" y="106.4" font-size="13.5" font-weight="bold" fill="#4c1d95" text-anchor="middle">5 Sustain</text><rect x="788.0" y="130.0" width="170.0" height="150.0" rx="8" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/><text x="798.0" y="152.0" font-size="11.5" font-weight="normal" fill="#1f2937" text-anchor="start">Transition to operations with</text><text x="798.0" y="166.7" font-size="11.5" font-weight="normal" fill="#1f2937" text-anchor="start">an owner; keep measuring</text><text x="798.0" y="181.4" font-size="11.5" font-weight="normal" fill="#1f2937" text-anchor="start">through the timeframe, even</text><text x="798.0" y="196.2" font-size="11.5" font-weight="normal" fill="#1f2937" text-anchor="start">after project closure</text><polyline points="873.0,284.0 873.0,316.0 105.0,316.0 105.0,286.0" fill="none" stroke="#7c3aed" stroke-width="2.2" stroke-dasharray="7 5" marker-end="url(#ah1)" stroke-linejoin="round"/><text x="489.0" y="308.0" font-size="12.5" font-weight="bold" fill="#5b21b6" text-anchor="middle">Examine business value throughout: revalidate the case, reprioritize, adjust or stop</text><rect x="20.0" y="350.0" width="940.0" height="62.0" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.6"/><text x="490.0" y="377.2" font-size="12.5" font-weight="normal" fill="#374151" text-anchor="middle">Outputs are not outcomes and outcomes are not benefits. A feature delivered is an output; changed behavior or performance is an outcome; the gain the organization</text><text x="490.0" y="392.9" font-size="12.5" font-weight="normal" fill="#374151" text-anchor="middle">measures against the target is the benefit. Track the benefit.</text></svg>