<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 430" width="980" height="430" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">The tailoring process</title><desc id="d">Four steps: select the initial development approach, tailor for the organization, tailor for the project, implement ongoing improvement by inspecting and adapting.</desc><defs><marker id="ah0" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker><marker id="ah1" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker></defs><rect x="0.75" y="0.75" width="978.5" height="428.5" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><text x="20.0" y="28.0" font-size="18" font-weight="bold" fill="#1f2937" text-anchor="start">The tailoring process (PMBOK 8 Guide Figure 3-1 and 3-3)</text><text x="20.0" y="48.0" font-size="12" font-weight="normal" fill="#6b7280" text-anchor="start">Not a one-time exercise: review points, phase gates and retrospectives feed back into tailoring</text><rect x="20.0" y="70.0" width="224.0" height="56.0" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="132.0" y="94.1" font-size="13" font-weight="bold" fill="#1e3a8a" text-anchor="middle">1 Select initial development</text><text x="132.0" y="110.3" font-size="13" font-weight="bold" fill="#1e3a8a" text-anchor="middle">approach</text><rect x="20.0" y="132.0" width="224.0" height="226.0" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/><text x="32.0" y="154.0" font-size="13" font-weight="bold" fill="#2563eb" text-anchor="start">•</text><text x="46.0" y="154.0" font-size="11.8" font-weight="normal" fill="#1f2937" text-anchor="start">Choose predictive, adaptive or</text><text x="46.0" y="168.8" font-size="11.8" font-weight="normal" fill="#1f2937" text-anchor="start">hybrid for the endeavor</text><text x="32.0" y="191.5" font-size="13" font-weight="bold" fill="#2563eb" text-anchor="start">•</text><text x="46.0" y="191.5" font-size="11.8" font-weight="normal" fill="#1f2937" text-anchor="start">Use a suitability filter: culture, team</text><text x="46.0" y="206.2" font-size="11.8" font-weight="normal" fill="#1f2937" text-anchor="start">dynamics, project factors (a</text><text x="46.0" y="221.0" font-size="11.8" font-weight="normal" fill="#1f2937" text-anchor="start">decision aid, not a formula)</text><text x="32.0" y="243.8" font-size="13" font-weight="bold" fill="#2563eb" text-anchor="start">•</text><text x="46.0" y="243.8" font-size="11.8" font-weight="normal" fill="#1f2937" text-anchor="start">Draw on product knowledge,</text><text x="46.0" y="258.5" font-size="11.8" font-weight="normal" fill="#1f2937" text-anchor="start">delivery cadence, available options</text><line x1="246.0" y1="98.0" x2="260.0" y2="98.0" stroke="#1f2937" stroke-width="2.4" marker-end="url(#ah0)"/><rect x="262.0" y="70.0" width="224.0" height="56.0" rx="8" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.6"/><text x="374.0" y="102.2" font-size="13" font-weight="bold" fill="#134e4a" text-anchor="middle">2 Tailor for the organization</text><rect x="262.0" y="132.0" width="224.0" height="226.0" rx="8" fill="#ffffff" stroke="#0d9488" stroke-width="1.5"/><text x="274.0" y="154.0" font-size="13" font-weight="bold" fill="#0d9488" text-anchor="start">•</text><text x="288.0" y="154.0" font-size="11.8" font-weight="normal" fill="#1f2937" text-anchor="start">Start from the organization's</text><text x="288.0" y="168.8" font-size="11.8" font-weight="normal" fill="#1f2937" text-anchor="start">methodologies and guides</text><text x="274.0" y="191.5" font-size="13" font-weight="bold" fill="#0d9488" text-anchor="start">•</text><text x="288.0" y="191.5" font-size="11.8" font-weight="normal" fill="#1f2937" text-anchor="start">Add, remove, reconfigure elements</text><text x="288.0" y="206.2" font-size="11.8" font-weight="normal" fill="#1f2937" text-anchor="start">within process governance and</text><text x="288.0" y="221.0" font-size="11.8" font-weight="normal" fill="#1f2937" text-anchor="start">policy</text><text x="274.0" y="243.8" font-size="13" font-weight="bold" fill="#0d9488" text-anchor="start">•</text><text x="288.0" y="243.8" font-size="11.8" font-weight="normal" fill="#1f2937" text-anchor="start">PMO reviews and approves where</text><text x="288.0" y="258.5" font-size="11.8" font-weight="normal" fill="#1f2937" text-anchor="start">it applies; consider program and</text><text x="288.0" y="273.2" font-size="11.8" font-weight="normal" fill="#1f2937" text-anchor="start">portfolio context; multi-organization</text><text x="288.0" y="288.0" font-size="11.8" font-weight="normal" fill="#1f2937" text-anchor="start">projects need integration planning</text><line x1="488.0" y1="98.0" x2="502.0" y2="98.0" stroke="#1f2937" stroke-width="2.4" marker-end="url(#ah0)"/><rect x="504.0" y="70.0" width="224.0" height="56.0" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="616.0" y="102.2" font-size="13" font-weight="bold" fill="#14532d" text-anchor="middle">3 Tailor for the project</text><rect x="504.0" y="132.0" width="224.0" height="226.0" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/><text x="516.0" y="154.0" font-size="13" font-weight="bold" fill="#16a34a" text-anchor="start">•</text><text x="530.0" y="154.0" font-size="11.8" font-weight="normal" fill="#1f2937" text-anchor="start">Adjust for size, criticality and other</text><text x="530.0" y="168.8" font-size="11.8" font-weight="normal" fill="#1f2937" text-anchor="start">factors</text><text x="516.0" y="191.5" font-size="13" font-weight="bold" fill="#16a34a" text-anchor="start">•</text><text x="530.0" y="191.5" font-size="11.8" font-weight="normal" fill="#1f2937" text-anchor="start">Ask about the product or</text><text x="530.0" y="206.2" font-size="11.8" font-weight="normal" fill="#1f2937" text-anchor="start">deliverable, the project team and</text><text x="530.0" y="221.0" font-size="11.8" font-weight="normal" fill="#1f2937" text-anchor="start">the culture</text><text x="516.0" y="243.8" font-size="13" font-weight="bold" fill="#16a34a" text-anchor="start">•</text><text x="530.0" y="243.8" font-size="11.8" font-weight="normal" fill="#1f2937" text-anchor="start">PM approval is usually enough for</text><text x="530.0" y="258.5" font-size="11.8" font-weight="normal" fill="#1f2937" text-anchor="start">internal tailoring; PMO approval if</text><text x="530.0" y="273.2" font-size="11.8" font-weight="normal" fill="#1f2937" text-anchor="start">external groups are affected</text><line x1="730.0" y1="98.0" x2="744.0" y2="98.0" stroke="#1f2937" stroke-width="2.4" marker-end="url(#ah0)"/><rect x="746.0" y="70.0" width="224.0" height="56.0" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="858.0" y="94.1" font-size="13" font-weight="bold" fill="#78350f" text-anchor="middle">4 Implement ongoing</text><text x="858.0" y="110.3" font-size="13" font-weight="bold" fill="#78350f" text-anchor="middle">improvement</text><rect x="746.0" y="132.0" width="224.0" height="226.0" rx="8" fill="#ffffff" stroke="#d97706" stroke-width="1.5"/><text x="758.0" y="154.0" font-size="13" font-weight="bold" fill="#d97706" text-anchor="start">•</text><text x="772.0" y="154.0" font-size="11.8" font-weight="normal" fill="#1f2937" text-anchor="start">Inspect and adapt: retrospectives,</text><text x="772.0" y="168.8" font-size="11.8" font-weight="normal" fill="#1f2937" text-anchor="start">phase gates, review points</text><text x="758.0" y="191.5" font-size="13" font-weight="bold" fill="#d97706" text-anchor="start">•</text><text x="772.0" y="191.5" font-size="11.8" font-weight="normal" fill="#1f2937" text-anchor="start">Engage and empower the team to</text><text x="772.0" y="206.2" font-size="11.8" font-weight="normal" fill="#1f2937" text-anchor="start">improve its own process</text><text x="758.0" y="229.0" font-size="13" font-weight="bold" fill="#d97706" text-anchor="start">•</text><text x="772.0" y="229.0" font-size="11.8" font-weight="normal" fill="#1f2937" text-anchor="start">Verify and validate that the tailored</text><text x="772.0" y="243.8" font-size="11.8" font-weight="normal" fill="#1f2937" text-anchor="start">approach is effective</text><polyline points="858.0,360.0 858.0,388.0 132.0,388.0 132.0,362.0" fill="none" stroke="#7c3aed" stroke-width="2.2" stroke-dasharray="7 5" marker-end="url(#ah1)" stroke-linejoin="round"/><text x="495.0" y="380.0" font-size="12.5" font-weight="bold" fill="#5b21b6" text-anchor="middle">Learnings send you back to re-select, re-tailor and re-check</text><text x="490.0" y="414.0" font-size="11.5" font-weight="normal" fill="#6b7280" text-anchor="middle" font-style="italic">Limits: organizational policy or a contract may mandate an approach and restrict tailoring.</text></svg>