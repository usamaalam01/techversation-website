<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 454" width="980" height="454" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">Projects drive organizational change</title><desc id="d">A project moves the organization from its current state, optionally through a transition state, to a future state that delivers value. The product side covers deliverables, transition and readiness requirements and handover; the people side covers readiness, engagement, training, support and reinforcement. Change control governs changes to the project, while change management moves people and organizations to the future state.</desc><defs><marker id="ah0" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker></defs><rect x="0.75" y="0.75" width="978.5" height="452.5" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><text x="20.0" y="28.0" font-size="18" font-weight="bold" fill="#1f2937" text-anchor="start">Projects drive organizational change</text><text x="20.0" y="48.0" font-size="12" font-weight="normal" fill="#6b7280" text-anchor="start">Value arrives when the organization reaches the future state, which means people adopt what the project delivers</text><rect x="22.0" y="66.0" width="230.0" height="104.0" rx="12" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.8"/><text x="36.0" y="92.0" font-size="13" font-weight="bold" fill="#374151" text-anchor="start">Current state (as-is)</text><text x="36.0" y="112.0" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="start">How the organization works today:</text><text x="36.0" y="125.8" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="start">processes, tools, roles, habits and</text><text x="36.0" y="139.5" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="start">culture.</text><rect x="300.0" y="66.0" width="380.0" height="104.0" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="1.8"/><text x="316.0" y="92.0" font-size="13" font-weight="bold" fill="#1e3a8a" text-anchor="start">The project</text><text x="316.0" y="112.0" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="start">Builds the new capability and moves the organization across, in one</text><text x="316.0" y="125.8" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="start">step or through a structured transition state.</text><rect x="316.0" y="140.0" width="220.0" height="22.0" rx="11" fill="#ffffff" stroke="#2563eb" stroke-width="1.3" stroke-dasharray="5 3"/><text x="426.0" y="155.0" font-size="10.5" font-weight="bold" fill="#1e3a8a" text-anchor="middle">Transition state (optional)</text><rect x="728.0" y="66.0" width="230.0" height="104.0" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="1.8"/><text x="742.0" y="92.0" font-size="13" font-weight="bold" fill="#14532d" text-anchor="start">Future state (to-be)</text><text x="742.0" y="112.0" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="start">The desired result: intended benefits and</text><text x="742.0" y="125.8" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="start">value as defined by key stakeholders.</text><line x1="253.0" y1="118.0" x2="298.0" y2="118.0" stroke="#1f2937" stroke-width="2.6" marker-end="url(#ah0)"/><line x1="681.0" y1="118.0" x2="726.0" y2="118.0" stroke="#1f2937" stroke-width="2.6" marker-end="url(#ah0)"/><rect x="22.0" y="194.0" width="456.0" height="150.0" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="34.0" y="216.0" font-size="12.5" font-weight="bold" fill="#1e3a8a" text-anchor="start">Product side: what is delivered</text><text x="34.0" y="236.0" font-size="10.8" font-weight="bold" fill="#6b7280" text-anchor="start">•</text><text x="46.0" y="236.0" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">Deliverables built, verified and accepted</text><text x="34.0" y="253.2" font-size="10.8" font-weight="bold" fill="#6b7280" text-anchor="start">•</text><text x="46.0" y="253.2" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">Transition and readiness requirements: temporary capabilities such as data conversion</text><text x="46.0" y="266.4" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">and training needed to get from the as-is state to the future state</text><text x="34.0" y="283.5" font-size="10.8" font-weight="bold" fill="#6b7280" text-anchor="start">•</text><text x="46.0" y="283.5" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">Handover to operations or the next phase, with support and documentation</text><text x="34.0" y="300.7" font-size="10.8" font-weight="bold" fill="#6b7280" text-anchor="start">•</text><text x="46.0" y="300.7" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">Final product, service or result transition (Topic 35)</text><rect x="502.0" y="194.0" width="456.0" height="150.0" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="514.0" y="216.0" font-size="12.5" font-weight="bold" fill="#14532d" text-anchor="start">People side: how the organization adopts it</text><text x="514.0" y="236.0" font-size="10.8" font-weight="bold" fill="#6b7280" text-anchor="start">•</text><text x="526.0" y="236.0" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">Assess culture and readiness</text><text x="514.0" y="253.2" font-size="10.8" font-weight="bold" fill="#6b7280" text-anchor="start">•</text><text x="526.0" y="253.2" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">Engage stakeholders: explain why, and what changes for them</text><text x="514.0" y="270.4" font-size="10.8" font-weight="bold" fill="#6b7280" text-anchor="start">•</text><text x="526.0" y="270.4" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">Involve people in shaping how it will work</text><text x="514.0" y="287.5" font-size="10.8" font-weight="bold" fill="#6b7280" text-anchor="start">•</text><text x="526.0" y="287.5" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">Train, coach and support; remove barriers</text><text x="514.0" y="304.7" font-size="10.8" font-weight="bold" fill="#6b7280" text-anchor="start">•</text><text x="526.0" y="304.7" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">Reinforce, measure adoption and sustain the change</text><rect x="22.0" y="360.0" width="456.0" height="50.8" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/><text x="34.0" y="380.0" font-size="11" font-weight="bold" fill="#78350f" text-anchor="start">Value is realized only when the change sticks: track adoption and benefits, not</text><text x="34.0" y="393.4" font-size="11" font-weight="bold" fill="#78350f" text-anchor="start">only delivery.</text><rect x="502.0" y="360.0" width="456.0" height="64.3" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/><text x="514.0" y="380.0" font-size="11" font-weight="bold" fill="#7f1d1d" text-anchor="start">Do not confuse: change control (CCB, baselines, change requests) governs</text><text x="514.0" y="393.4" font-size="11" font-weight="bold" fill="#7f1d1d" text-anchor="start">changes to the project; change management moves people and organizations to</text><text x="514.0" y="406.8" font-size="11" font-weight="bold" fill="#7f1d1d" text-anchor="start">the future state.</text></svg>