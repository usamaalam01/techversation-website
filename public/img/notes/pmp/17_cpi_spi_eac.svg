<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 540" width="980" height="540" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">Reading CPI and SPI, choosing the EAC formula, and TCPI</title><desc id="d">A two by two reading of cost performance index and schedule performance index, the four EAC formulas with when to use each, and the TCPI interpretation.</desc><defs></defs><rect x="0.75" y="0.75" width="978.5" height="538.5" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><text x="20.0" y="28.0" font-size="18" font-weight="bold" fill="#1f2937" text-anchor="start">CPI and SPI together, EAC formulas, TCPI</text><text x="20.0" y="48.0" font-size="12" font-weight="normal" fill="#6b7280" text-anchor="start">Index above 1 is favorable; choose the EAC formula by what you believe about the remaining work</text><text x="170.0" y="82.0" font-size="11.5" font-weight="bold" fill="#374151" text-anchor="middle">SPI &lt; 1: behind</text><text x="370.0" y="82.0" font-size="11.5" font-weight="bold" fill="#374151" text-anchor="middle">SPI &gt; 1: ahead</text><text x="62.0" y="164.0" font-size="11.5" font-weight="bold" fill="#374151" text-anchor="end">CPI &lt; 1</text><text x="62.0" y="284.0" font-size="11.5" font-weight="bold" fill="#374151" text-anchor="end">CPI &gt; 1</text><rect x="72.0" y="102.0" width="196.0" height="116.0" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.6"/><text x="82.0" y="124.0" font-size="12" font-weight="bold" fill="#7f1d1d" text-anchor="start">Over budget, behind schedule</text><text x="82.0" y="158.0" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">Worst case: find causes, replan,</text><text x="82.0" y="171.2" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">consider scope or resources,</text><text x="82.0" y="184.4" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">escalate</text><rect x="272.0" y="102.0" width="196.0" height="116.0" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="282.0" y="124.0" font-size="12" font-weight="bold" fill="#78350f" text-anchor="start">Over budget, ahead of</text><text x="282.0" y="138.4" font-size="12" font-weight="bold" fill="#78350f" text-anchor="start">schedule</text><text x="282.0" y="158.0" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">Check why (overtime, crashing,</text><text x="282.0" y="171.2" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">rework); report the cost variance</text><text x="282.0" y="184.4" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">through governance</text><rect x="72.0" y="222.0" width="196.0" height="116.0" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="82.0" y="244.0" font-size="12" font-weight="bold" fill="#78350f" text-anchor="start">Under budget, behind</text><text x="82.0" y="258.4" font-size="12" font-weight="bold" fill="#78350f" text-anchor="start">schedule</text><text x="82.0" y="278.0" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">Check critical path and why work is</text><text x="82.0" y="291.2" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">late (cheap resources, waiting)</text><rect x="272.0" y="222.0" width="196.0" height="116.0" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="282.0" y="244.0" font-size="12" font-weight="bold" fill="#14532d" text-anchor="start">Under budget, ahead of</text><text x="282.0" y="258.4" font-size="12" font-weight="bold" fill="#14532d" text-anchor="start">schedule</text><text x="282.0" y="278.0" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">Verify quality and scope; confirm the</text><text x="282.0" y="291.2" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">baseline is realistic</text><rect x="20.0" y="360.0" width="460.0" height="156.0" rx="8" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.2"/><text x="32.0" y="380.0" font-size="12.5" font-weight="bold" fill="#1f2937" text-anchor="start">TCPI: efficiency needed on the remaining work</text><text x="32.0" y="400.0" font-size="11.3" font-weight="normal" fill="#1f2937" text-anchor="start">TCPI (BAC) = (BAC − EV) ÷ (BAC − AC): the cost performance needed to finish within</text><text x="32.0" y="413.8" font-size="11.3" font-weight="normal" fill="#1f2937" text-anchor="start">the original budget.</text><text x="32.0" y="436.0" font-size="11.3" font-weight="normal" fill="#1f2937" text-anchor="start">TCPI (EAC) = (BAC − EV) ÷ (EAC − AC): the performance needed to finish within an</text><text x="32.0" y="449.8" font-size="11.3" font-weight="normal" fill="#1f2937" text-anchor="start">approved new estimate.</text><text x="32.0" y="472.0" font-size="11.3" font-weight="bold" fill="#1e3a8a" text-anchor="start">Above 1.0 = harder to complete; 1.0 = same efficiency as planned; below 1.0 =</text><text x="32.0" y="485.8" font-size="11.3" font-weight="bold" fill="#1e3a8a" text-anchor="start">easier. If BAC is no longer viable, forecast with the EAC.</text><text x="500.0" y="82.0" font-size="13" font-weight="bold" fill="#1f2937" text-anchor="start">Choosing the EAC formula</text><rect x="500.0" y="96.0" width="460.0" height="62.0" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><text x="512.0" y="118.0" font-size="12.5" font-weight="bold" fill="#1e3a8a" text-anchor="start">EAC = BAC ÷ CPI</text><text x="512.0" y="136.0" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="start">Past cost performance is typical: the current CPI will continue for the rest of the work</text><rect x="500.0" y="166.0" width="460.0" height="62.0" rx="8" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.5"/><text x="512.0" y="188.0" font-size="12.5" font-weight="bold" fill="#134e4a" text-anchor="start">EAC = AC + (BAC − EV)</text><text x="512.0" y="206.0" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="start">The variance was a one-off: remaining work will be done at the planned rate</text><rect x="500.0" y="236.0" width="460.0" height="62.0" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/><text x="512.0" y="258.0" font-size="12.5" font-weight="bold" fill="#4c1d95" text-anchor="start">EAC = AC + bottom-up ETC</text><text x="512.0" y="276.0" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="start">The original estimates are no longer valid: reestimate what is left</text><rect x="500.0" y="306.0" width="460.0" height="62.0" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/><text x="512.0" y="328.0" font-size="12.5" font-weight="bold" fill="#78350f" text-anchor="start">EAC = AC + (BAC − EV) ÷ (CPI × SPI)</text><text x="512.0" y="346.0" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="start">Both cost and schedule performance influence the remaining work</text><rect x="500.0" y="380.0" width="460.0" height="136.0" rx="8" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.2"/><text x="512.0" y="400.0" font-size="12.5" font-weight="bold" fill="#1f2937" text-anchor="start">Related formulas</text><text x="514.0" y="418.0" font-size="11.3" font-weight="bold" fill="#6b7280" text-anchor="start">•</text><text x="528.0" y="418.0" font-size="11.3" font-weight="normal" fill="#1f2937" text-anchor="start">ETC = EAC − AC (or a bottom-up reestimate)</text><text x="514.0" y="436.0" font-size="11.3" font-weight="bold" fill="#6b7280" text-anchor="start">•</text><text x="528.0" y="436.0" font-size="11.3" font-weight="normal" fill="#1f2937" text-anchor="start">VAC = BAC − EAC (negative = over budget)</text><text x="514.0" y="454.0" font-size="11.3" font-weight="bold" fill="#6b7280" text-anchor="start">•</text><text x="528.0" y="454.0" font-size="11.3" font-weight="normal" fill="#1f2937" text-anchor="start">CV = EV − AC; CPI = EV ÷ AC (cost)</text><text x="514.0" y="472.0" font-size="11.3" font-weight="bold" fill="#6b7280" text-anchor="start">•</text><text x="528.0" y="472.0" font-size="11.3" font-weight="normal" fill="#1f2937" text-anchor="start">SV = EV − PV; SPI = EV ÷ PV (schedule)</text><text x="514.0" y="490.0" font-size="11.3" font-weight="bold" fill="#6b7280" text-anchor="start">•</text><text x="528.0" y="490.0" font-size="11.3" font-weight="normal" fill="#1f2937" text-anchor="start">A forecast of the total cost uses the EAC, not the BAC and not SPI alone</text></svg>