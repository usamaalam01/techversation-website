<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 506" width="980" height="506" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">Cumulative flow diagram with a bottleneck</title><desc id="d">Stacked bands show how many items sit in each workflow state over ten weeks. The approval band widens from 2 to 19 items while the other bands keep a steady width, so approval is the bottleneck and the Done line rises slowly.</desc><defs><marker id="ah0" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#7f1d1d"/></marker></defs><rect x="0.75" y="0.75" width="978.5" height="504.5" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><text x="20.0" y="28.0" font-size="18" font-weight="bold" fill="#1f2937" text-anchor="start">Cumulative flow diagram: spot the bottleneck</text><text x="20.0" y="48.0" font-size="12" font-weight="normal" fill="#6b7280" text-anchor="start">Each band is one workflow state; the band's height at a date is the number of items in that state</text><line x1="80.0" y1="400.0" x2="620.0" y2="400.0" stroke="#e5e7eb" stroke-width="1"/><text x="72.0" y="404.0" font-size="11" font-weight="normal" fill="#6b7280" text-anchor="end">0</text><line x1="80.0" y1="346.3" x2="620.0" y2="346.3" stroke="#e5e7eb" stroke-width="1"/><text x="72.0" y="350.3" font-size="11" font-weight="normal" fill="#6b7280" text-anchor="end">10</text><line x1="80.0" y1="292.7" x2="620.0" y2="292.7" stroke="#e5e7eb" stroke-width="1"/><text x="72.0" y="296.7" font-size="11" font-weight="normal" fill="#6b7280" text-anchor="end">20</text><line x1="80.0" y1="239.0" x2="620.0" y2="239.0" stroke="#e5e7eb" stroke-width="1"/><text x="72.0" y="243.0" font-size="11" font-weight="normal" fill="#6b7280" text-anchor="end">30</text><line x1="80.0" y1="185.3" x2="620.0" y2="185.3" stroke="#e5e7eb" stroke-width="1"/><text x="72.0" y="189.3" font-size="11" font-weight="normal" fill="#6b7280" text-anchor="end">40</text><line x1="80.0" y1="131.7" x2="620.0" y2="131.7" stroke="#e5e7eb" stroke-width="1"/><text x="72.0" y="135.7" font-size="11" font-weight="normal" fill="#6b7280" text-anchor="end">50</text><line x1="80.0" y1="78.0" x2="620.0" y2="78.0" stroke="#e5e7eb" stroke-width="1"/><text x="72.0" y="82.0" font-size="11" font-weight="normal" fill="#6b7280" text-anchor="end">60</text><text x="80.0" y="418.0" font-size="11" font-weight="normal" fill="#6b7280" text-anchor="middle">1</text><text x="140.0" y="418.0" font-size="11" font-weight="normal" fill="#6b7280" text-anchor="middle">2</text><text x="200.0" y="418.0" font-size="11" font-weight="normal" fill="#6b7280" text-anchor="middle">3</text><text x="260.0" y="418.0" font-size="11" font-weight="normal" fill="#6b7280" text-anchor="middle">4</text><text x="320.0" y="418.0" font-size="11" font-weight="normal" fill="#6b7280" text-anchor="middle">5</text><text x="380.0" y="418.0" font-size="11" font-weight="normal" fill="#6b7280" text-anchor="middle">6</text><text x="440.0" y="418.0" font-size="11" font-weight="normal" fill="#6b7280" text-anchor="middle">7</text><text x="500.0" y="418.0" font-size="11" font-weight="normal" fill="#6b7280" text-anchor="middle">8</text><text x="560.0" y="418.0" font-size="11" font-weight="normal" fill="#6b7280" text-anchor="middle">9</text><text x="620.0" y="418.0" font-size="11" font-weight="normal" fill="#6b7280" text-anchor="middle">10</text><text x="350.0" y="438.0" font-size="12" font-weight="bold" fill="#1f2937" text-anchor="middle">Weeks</text><text x="24.0" y="239.0" transform="rotate(-90 24 239.0)" font-size="12" font-weight="bold" fill="#1f2937" text-anchor="middle">Cumulative number of items</text><polygon points="80.0,400.0 140.0,389.3 200.0,373.2 260.0,357.1 320.0,341.0 380.0,324.9 440.0,308.8 500.0,292.7 560.0,276.6 620.0,260.5 620.0,400.0 560.0,400.0 500.0,400.0 440.0,400.0 380.0,400.0 320.0,400.0 260.0,400.0 200.0,400.0 140.0,400.0 80.0,400.0" fill="#dcfce7" stroke="#16a34a" stroke-width="1.4"/><text x="630.0" y="334.2" font-size="12" font-weight="bold" fill="#14532d" text-anchor="start">Done</text><polygon points="80.0,389.3 140.0,378.5 200.0,362.4 260.0,346.3 320.0,330.2 380.0,314.1 440.0,298.0 500.0,281.9 560.0,265.8 620.0,249.7 620.0,260.5 560.0,276.6 500.0,292.7 440.0,308.8 380.0,324.9 320.0,341.0 260.0,357.1 200.0,373.2 140.0,389.3 80.0,400.0" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.4"/><text x="630.0" y="259.1" font-size="12" font-weight="bold" fill="#134e4a" text-anchor="start">In test</text><polygon points="80.0,378.5 140.0,357.1 200.0,335.6 260.0,308.8 320.0,281.9 380.0,255.1 440.0,228.3 500.0,201.4 560.0,174.6 620.0,147.8 620.0,249.7 560.0,265.8 500.0,281.9 440.0,298.0 380.0,314.1 320.0,330.2 260.0,346.3 200.0,362.4 140.0,378.5 80.0,389.3" fill="#fee2e2" stroke="#dc2626" stroke-width="1.4"/><text x="630.0" y="202.8" font-size="12" font-weight="bold" fill="#7f1d1d" text-anchor="start">In approval</text><polygon points="80.0,367.8 140.0,346.3 200.0,324.9 260.0,298.0 320.0,271.2 380.0,244.4 440.0,217.5 500.0,190.7 560.0,163.9 620.0,137.0 620.0,147.8 560.0,174.6 500.0,201.4 440.0,228.3 380.0,255.1 320.0,281.9 260.0,308.8 200.0,335.6 140.0,357.1 80.0,378.5" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/><text x="630.0" y="146.4" font-size="12" font-weight="bold" fill="#1e3a8a" text-anchor="start">In progress</text><polygon points="80.0,99.5 140.0,99.5 200.0,99.5 260.0,99.5 320.0,99.5 380.0,99.5 440.0,99.5 500.0,99.5 560.0,99.5 620.0,99.5 620.0,137.0 560.0,163.9 500.0,190.7 440.0,217.5 380.0,244.4 320.0,271.2 260.0,298.0 200.0,324.9 140.0,346.3 80.0,367.8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.4"/><text x="630.0" y="122.2" font-size="12" font-weight="bold" fill="#374151" text-anchor="start">Backlog</text><line x1="80.0" y1="78.0" x2="80.0" y2="400.0" stroke="#1f2937" stroke-width="1.6"/><line x1="80.0" y1="400.0" x2="620.0" y2="400.0" stroke="#1f2937" stroke-width="1.6"/><line x1="608.0" y1="249.7" x2="608.0" y2="147.8" stroke="#7f1d1d" stroke-width="2.4"/><circle cx="608.0" cy="249.7" r="3.5" fill="#7f1d1d" stroke="#7f1d1d" stroke-width="1.5"/><circle cx="608.0" cy="147.8" r="3.5" fill="#7f1d1d" stroke="#7f1d1d" stroke-width="1.5"/><text x="600.0" y="202.8" font-size="12" font-weight="bold" fill="#7f1d1d" text-anchor="end">19 items</text><rect x="250.0" y="98.0" width="190.0" height="44.0" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.6"/><text x="345.0" y="116.7" font-size="11" font-weight="bold" fill="#7f1d1d" text-anchor="middle">Approval band: 2 items in week</text><text x="345.0" y="130.4" font-size="11" font-weight="bold" fill="#7f1d1d" text-anchor="middle">1, 19 in week 10</text><line x1="400.0" y1="142.0" x2="546.0" y2="190.8" stroke="#7f1d1d" stroke-width="1.8" marker-end="url(#ah0)"/><rect x="700.0" y="78.0" width="256.0" height="322.0" rx="8" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.4"/><text x="714.0" y="100.0" font-size="14" font-weight="bold" fill="#1f2937" text-anchor="start">How to read it</text><text x="714.0" y="122.0" font-size="12" font-weight="bold" fill="#1e3a8a" text-anchor="start">Vertical gap</text><text x="714.0" y="137.0" font-size="11.5" font-weight="normal" fill="#1f2937" text-anchor="start">at one date = items in that state (work in</text><text x="714.0" y="150.8" font-size="11.5" font-weight="normal" fill="#1f2937" text-anchor="start">progress).</text><text x="714.0" y="172.6" font-size="12" font-weight="bold" fill="#1e3a8a" text-anchor="start">Horizontal gap</text><text x="714.0" y="187.6" font-size="11.5" font-weight="normal" fill="#1f2937" text-anchor="start">between two lines = about how long an item</text><text x="714.0" y="201.4" font-size="11.5" font-weight="normal" fill="#1f2937" text-anchor="start">takes to cross those states (cycle time).</text><text x="714.0" y="223.2" font-size="12" font-weight="bold" fill="#1e3a8a" text-anchor="start">A band that keeps widening</text><text x="714.0" y="238.2" font-size="11.5" font-weight="normal" fill="#1f2937" text-anchor="start">means items arrive faster than they leave:</text><text x="714.0" y="252.0" font-size="11.5" font-weight="normal" fill="#1f2937" text-anchor="start">that state is the bottleneck.</text><text x="714.0" y="273.8" font-size="12" font-weight="bold" fill="#1e3a8a" text-anchor="start">A flat or slowly rising Done line</text><text x="714.0" y="288.8" font-size="11.5" font-weight="normal" fill="#1f2937" text-anchor="start">means little is being finished (low</text><text x="714.0" y="302.6" font-size="11.5" font-weight="normal" fill="#1f2937" text-anchor="start">throughput).</text><text x="714.0" y="324.4" font-size="12" font-weight="bold" fill="#1e3a8a" text-anchor="start">Parallel bands</text><text x="714.0" y="339.4" font-size="11.5" font-weight="normal" fill="#1f2937" text-anchor="start">of steady width mean a smooth flow.</text><rect x="20.0" y="462.0" width="940.0" height="30.0" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.6"/><text x="490.0" y="480.9" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">Fix the constraint, not the symptom: add capacity or reduce the arrival rate at the widening state, and limit work in progress upstream (Kanban WIP limits).</text></svg>