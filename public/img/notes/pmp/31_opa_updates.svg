<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 512" width="980" height="512" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">Organizational process assets: who may update what</title><desc id="d">Policies, processes, procedures, templates and checklists are owned outside the project and changed only through the organization's update policy; the team may tailor them for its project and forwards suggestions to the owning unit. Knowledge repositories are updated throughout the project with project information. A proven improvement follows an update path: prove, document, submit, review and approve, publish, communicate and track.</desc><defs><marker id="ah0" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker></defs><rect x="0.75" y="0.75" width="978.5" height="510.5" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><text x="20.0" y="28.0" font-size="18" font-weight="bold" fill="#1f2937" text-anchor="start">Update organizational process assets the right way</text><text x="20.0" y="48.0" font-size="12" font-weight="normal" fill="#6b7280" text-anchor="start">Know which assets the team may update directly and which need the owner</text><rect x="20.0" y="62.0" width="460.0" height="150.0" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="32.0" y="84.0" font-size="12.5" font-weight="bold" fill="#1e3a8a" text-anchor="start">Policies, processes, procedures, templates</text><text x="32.0" y="104.0" font-size="10.8" font-weight="bold" fill="#6b7280" text-anchor="start">•</text><text x="44.0" y="104.0" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">Owned outside the project, usually by the PMO or another function</text><text x="32.0" y="121.2" font-size="10.8" font-weight="bold" fill="#6b7280" text-anchor="start">•</text><text x="44.0" y="121.2" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">Generally not changed as part of project work</text><text x="32.0" y="138.4" font-size="10.8" font-weight="bold" fill="#6b7280" text-anchor="start">•</text><text x="44.0" y="138.4" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">Changed only by following the organization's own update policy</text><text x="32.0" y="155.5" font-size="10.8" font-weight="bold" fill="#6b7280" text-anchor="start">•</text><text x="44.0" y="155.5" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">Where encouraged, the team tailors templates, life cycles and checklists for its project</text><text x="32.0" y="172.7" font-size="10.8" font-weight="bold" fill="#6b7280" text-anchor="start">•</text><text x="44.0" y="172.7" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">The team collects improvement suggestions and forwards them to the appropriate unit</text><rect x="500.0" y="62.0" width="460.0" height="150.0" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="512.0" y="84.0" font-size="12.5" font-weight="bold" fill="#14532d" text-anchor="start">Organizational knowledge repositories</text><text x="512.0" y="104.0" font-size="10.8" font-weight="bold" fill="#6b7280" text-anchor="start">•</text><text x="524.0" y="104.0" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">Updated throughout the project with project information</text><text x="512.0" y="121.2" font-size="10.8" font-weight="bold" fill="#6b7280" text-anchor="start">•</text><text x="524.0" y="121.2" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">Lessons learned; at the end, the lessons learned repository</text><text x="512.0" y="138.4" font-size="10.8" font-weight="bold" fill="#6b7280" text-anchor="start">•</text><text x="524.0" y="138.4" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">Financial performance, performance metrics, issues and defects</text><text x="512.0" y="155.5" font-size="10.8" font-weight="bold" fill="#6b7280" text-anchor="start">•</text><text x="524.0" y="155.5" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">Historical information: completed schedules, risk data, earned value data</text><text x="512.0" y="172.7" font-size="10.8" font-weight="bold" fill="#6b7280" text-anchor="start">•</text><text x="524.0" y="172.7" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">Inputs to many processes, so a better repository improves the next project</text><text x="20.0" y="238.0" font-size="13" font-weight="bold" fill="#1f2937" text-anchor="start">Update path for a proven improvement</text><rect x="20.0" y="250.0" width="144.0" height="108.0" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="30.0" y="272.0" font-size="12" font-weight="bold" fill="#1e3a8a" text-anchor="start">1  Prove it</text><text x="30.0" y="290.0" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">Show results from a pilot</text><text x="30.0" y="303.2" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">or from project data</text><line x1="165.0" y1="304.0" x2="178.0" y2="304.0" stroke="#1f2937" stroke-width="1.8" marker-end="url(#ah0)"/><rect x="179.0" y="250.0" width="144.0" height="108.0" rx="10" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.6"/><text x="189.0" y="272.0" font-size="12" font-weight="bold" fill="#134e4a" text-anchor="start">2  Document it</text><text x="189.0" y="290.0" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">Draft the new version</text><text x="189.0" y="303.2" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">with the evidence and the</text><text x="189.0" y="316.4" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">reason</text><line x1="324.0" y1="304.0" x2="337.0" y2="304.0" stroke="#1f2937" stroke-width="1.8" marker-end="url(#ah0)"/><rect x="338.0" y="250.0" width="144.0" height="108.0" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="348.0" y="272.0" font-size="12" font-weight="bold" fill="#78350f" text-anchor="start">3  Submit it</text><text x="348.0" y="290.0" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">Send it to the owner of</text><text x="348.0" y="303.2" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">the asset: PMO or</text><text x="348.0" y="316.4" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">process owner</text><line x1="483.0" y1="304.0" x2="496.0" y2="304.0" stroke="#1f2937" stroke-width="1.8" marker-end="url(#ah0)"/><rect x="497.0" y="250.0" width="144.0" height="108.0" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.6"/><text x="507.0" y="272.0" font-size="12" font-weight="bold" fill="#4c1d95" text-anchor="start">4  Review, approve</text><text x="507.0" y="290.0" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">Owner decides under the</text><text x="507.0" y="303.2" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">organization's update</text><text x="507.0" y="316.4" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">policy</text><line x1="642.0" y1="304.0" x2="655.0" y2="304.0" stroke="#1f2937" stroke-width="1.8" marker-end="url(#ah0)"/><rect x="656.0" y="250.0" width="144.0" height="108.0" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="666.0" y="272.0" font-size="12" font-weight="bold" fill="#14532d" text-anchor="start">5  Publish</text><text x="666.0" y="290.0" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">Release a new controlled</text><text x="666.0" y="303.2" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">version and retire the old</text><text x="666.0" y="316.4" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">one</text><line x1="801.0" y1="304.0" x2="814.0" y2="304.0" stroke="#1f2937" stroke-width="1.8" marker-end="url(#ah0)"/><rect x="815.0" y="250.0" width="144.0" height="108.0" rx="10" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.6"/><text x="825.0" y="272.0" font-size="12" font-weight="bold" fill="#374151" text-anchor="start">6  Communicate, track</text><text x="825.0" y="290.0" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">Tell the teams, train if</text><text x="825.0" y="303.2" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">needed, check adoption</text><rect x="20.0" y="378.0" width="460.0" height="116.0" rx="10" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.6"/><text x="32.0" y="400.0" font-size="12.5" font-weight="bold" fill="#134e4a" text-anchor="start">Update when</text><text x="32.0" y="420.0" font-size="10.8" font-weight="bold" fill="#6b7280" text-anchor="start">•</text><text x="44.0" y="420.0" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">An improvement has proven itself</text><text x="32.0" y="437.2" font-size="10.8" font-weight="bold" fill="#6b7280" text-anchor="start">•</text><text x="44.0" y="437.2" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">Teams vary and one tested standard would serve (for example checklists)</text><text x="32.0" y="454.4" font-size="10.8" font-weight="bold" fill="#6b7280" text-anchor="start">•</text><text x="44.0" y="454.4" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">The same lessons repeat across projects</text><text x="32.0" y="471.5" font-size="10.8" font-weight="bold" fill="#6b7280" text-anchor="start">•</text><text x="44.0" y="471.5" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">An audit, or the end of a phase or project, shows a gap</text><rect x="500.0" y="378.0" width="460.0" height="116.0" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="1.6"/><text x="512.0" y="400.0" font-size="12.5" font-weight="bold" fill="#7f1d1d" text-anchor="start">Do not</text><text x="512.0" y="420.0" font-size="10.8" font-weight="bold" fill="#6b7280" text-anchor="start">•</text><text x="524.0" y="420.0" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">Change the master copy on your own</text><text x="512.0" y="437.2" font-size="10.8" font-weight="bold" fill="#6b7280" text-anchor="start">•</text><text x="524.0" y="437.2" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">Leave the improvement in the project's lessons log or a personal drive</text><text x="512.0" y="454.4" font-size="10.8" font-weight="bold" fill="#6b7280" text-anchor="start">•</text><text x="524.0" y="454.4" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">Update before it is proven</text><text x="512.0" y="471.5" font-size="10.8" font-weight="bold" fill="#6b7280" text-anchor="start">•</text><text x="524.0" y="471.5" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">Let each team keep its own variant when one standard would raise quality</text></svg>