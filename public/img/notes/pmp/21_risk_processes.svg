font-weight="normal" fill="#1f2937" text-anchor="middle">real risks from concerns</text><text x="265.0" y="302.0" font-size="10.5" font-weight="bold" fill="#6b7280" text-anchor="middle">Key output</text><rect x="191.0" y="310.0" width="148.0" height="58.0" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.6"/><text x="265.0" y="342.9" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">Risk register, risk report</text><line x1="341.0" y1="155.0" x2="359.0" y2="155.0" stroke="#1f2937" stroke-width="2.2" marker-end="url(#ah0)"/><rect x="361.0" y="118.0" width="148.0" height="74.0" rx="8" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.6"/><text x="435.0" y="150.7" font-size="14.5" font-weight="bold" fill="#134e4a" text-anchor="middle">Perform Risk</text><text x="435.0" y="168.8" font-size="14.5" font-weight="bold" fill="#134e4a" text-anchor="middle">Analysis</text><rect x="361.0" y="204.0" width="148.0" height="78.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="435.0" y="231.9" font-size="12" font-weight="normal" fill="#1f2937" text-anchor="middle">Qualitative always;</text><text x="435.0" y="246.9" font-size="12" font-weight="normal" fill="#1f2937" text-anchor="middle">quantitative when</text><text x="435.0" y="261.9" font-size="12" font-weight="normal" fill="#1f2937" text-anchor="middle">needed</text><text x="435.0" y="302.0" font-size="10.5" font-weight="bold" fill="#6b7280" text-anchor="middle">Key output</text><rect x="361.0" y="310.0" width="148.0" height="58.0" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.6"/><text x="435.0" y="335.4" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">Register and report</text><text x="435.0" y="350.4" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">updated</text><line x1="511.0" y1="155.0" x2="529.0" y2="155.0" stroke="#1f2937" stroke-width="2.2" marker-end="url(#ah0)"/><rect x="531.0" y="118.0" width="148.0" height="74.0" rx="8" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.6"/><text x="605.0" y="150.7" font-size="14.5" font-weight="bold" fill="#134e4a" text-anchor="middle">Plan Risk</text><text x="605.0" y="168.8" font-size="14.5" font-weight="bold" fill="#134e4a" text-anchor="middle">Responses</text><rect x="531.0" y="204.0" width="148.0" height="78.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="605.0" y="239.4" font-size="12" font-weight="normal" fill="#1f2937" text-anchor="middle">Strategies, owners,</text><text x="605.0" y="254.4" font-size="12" font-weight="normal" fill="#1f2937" text-anchor="middle">reserves</text><text x="605.0" y="302.0" font-size="10.5" font-weight="bold" fill="#6b7280" text-anchor="middle">Key output</text><rect x="531.0" y="310.0" width="148.0" height="58.0" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.6"/><text x="605.0" y="335.4" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">Change requests; plan</text><text x="605.0" y="350.4" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">and baseline updates</text><line x1="681.0" y1="155.0" x2="699.0" y2="155.0" stroke="#1f2937" stroke-width="2.2" marker-end="url(#ah0)"/><rect x="701.0" y="118.0" width="148.0" height="74.0" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="775.0" y="150.7" font-size="14.5" font-weight="bold" fill="#14532d" text-anchor="middle">Implement Risk</text><text x="775.0" y="168.8" font-size="14.5" font-weight="bold" fill="#14532d" text-anchor="middle">Responses</text><rect x="701.0" y="204.0" width="148.0" height="78.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="775.0" y="239.4" font-size="12" font-weight="normal" fill="#1f2937" text-anchor="middle">Risk owners carry out</text><text x="775.0" y="254.4" font-size="12" font-weight="normal" fill="#1f2937" text-anchor="middle">the agreed responses</text><text x="775.0" y="302.0" font-size="10.5" font-weight="bold" fill="#6b7280" text-anchor="middle">Key output</text><rect x="701.0" y="310.0" width="148.0" height="58.0" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.6"/><text x="775.0" y="335.4" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">Change requests;</text><text x="775.0" y="350.4" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">register updated</text><line x1="851.0" y1="155.0" x2="869.0" y2="155.0" stroke="#1f2937" stroke-width="2.2" marker-end="url(#ah0)"/><rect x="871.0" y="118.0" width="148.0" height="74.0" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="945.0" y="150.7" font-size="14.5" font-weight="bold" fill="#78350f" text-anchor="middle">Monitor</text><text x="945.0" y="168.8" font-size="14.5" font-weight="bold" fill="#78350f" text-anchor="middle">Risks</text><rect x="871.0" y="204.0" width="148.0" height="78.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="945.0" y="231.9" font-size="12" font-weight="normal" fill="#1f2937" text-anchor="middle">Track risks, find new</text><text x="945.0" y="246.9" font-size="12" font-weight="normal" fill="#1f2937" text-anchor="middle">ones, test responses,</text><text x="945.0" y="261.9" font-size="12" font-weight="normal" fill="#1f2937" text-anchor="middle">review reserves, audit</text><text x="945.0" y="302.0" font-size="10.5" font-weight="bold" fill="#6b7280" text-anchor="middle">Key output</text><rect x="871.0" y="310.0" width="148.0" height="58.0" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.6"/><text x="945.0" y="335.4" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">Work performance</text><text x="945.0" y="350.4" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">information; updates</text><polyline points="945.0,370.0 945.0,410.0 265.0,410.0 265.0,372.0" fill="none" stroke="#7c3aed" stroke-width="2.2" stroke-dasharray="7 5" marker-end="url(#ah1)" stroke-linejoin="round"/><text x="605.0" y="402.0" font-size="13" font-weight="bold" fill="#5b21b6" text-anchor="middle">Iterate: new information means identify, analyze and plan responses again</text></svg>