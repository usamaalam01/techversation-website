<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 440" width="1040" height="440" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">Risk management processes</title><desc id="d">Plan Risk Management, Identify Risks, Perform Risk Analysis, Plan Risk Responses (Planning), Implement Risk Responses (Executing), Monitor Risks (Monitoring and Controlling), with a feedback loop from monitoring back to identification.</desc><defs><marker id="ah0" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker><marker id="ah1" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker></defs><rect x="0.75" y="0.75" width="1038.5" height="438.5" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><text x="20.0" y="28.0" font-size="18" font-weight="bold" fill="#1f2937" text-anchor="start">Risk management: six processes, applied iteratively</text><text x="20.0" y="48.0" font-size="12" font-weight="normal" fill="#6b7280" text-anchor="start">PMBOK 8 Risk performance domain. New information keeps sending you back to identify, analyze and re-plan.</text><rect x="21.0" y="66.0" width="658.0" height="36.0" rx="18" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/><text x="350.0" y="89.0" font-size="13" font-weight="bold" fill="#1e3a8a" text-anchor="middle">Planning (Plan Risk Management starts at project conception)</text><rect x="701.0" y="66.0" width="148.0" height="36.0" rx="18" fill="#dcfce7" stroke="#16a34a" stroke-width="1.4"/><text x="775.0" y="89.0" font-size="13" font-weight="bold" fill="#14532d" text-anchor="middle">Executing</text><rect x="871.0" y="66.0" width="148.0" height="36.0" rx="18" fill="#fef3c7" stroke="#d97706" stroke-width="1.4"/><text x="945.0" y="89.0" font-size="13" font-weight="bold" fill="#78350f" text-anchor="middle">Monitor &amp; Control</tex