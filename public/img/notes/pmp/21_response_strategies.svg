<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 600" width="920" height="600" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">Risk response strategies for threats and opportunities</title><desc id="d">Five mirrored strategies: escalate and escalate, avoid and exploit, transfer and share, mitigate and enhance, accept and accept.</desc><defs><marker id="ah0" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker></defs><rect x="0.75" y="0.75" width="918.5" height="598.5" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><text x="20.0" y="28.0" font-size="18" font-weight="bold" fill="#1f2937" text-anchor="start">Risk response strategies: the threat and opportunity mirror</text><text x="20.0" y="48.0" font-size="12" font-weight="normal" fill="#6b7280" text-anchor="start">Same five ideas, opposite direction. Pick by priority, cost-effectiveness and who is best placed to own the response.</text><rect x="20.0" y="62.0" width="420.0" height="28.0" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="1.6"/><text x="230.0" y="80.4" font-size="13.5" font-weight="bold" fill="#7f1d1d" text-anchor="middle">THREATS</text><rect x="480.0" y="62.0" width="420.0" height="28.0" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="690.0" y="80.4" font-size="13.5" font-weight="bold" fill="#14532d" text-anchor="middle">OPPORTUNITIES</text><rect x="20.0" y="100.0" width="420.0" height="82.0" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/><text x="34.0" y="124.0" font-size="15" font-weight="bold" fill="#7f1d1d" text-anchor="start">Escalate</text><text x="34.0" y="144.0" font-size="12.2" font-weight="normal" fill="#1f2937" text-anchor="start">Outside project scope or PM authority. Hand ownership to portfolio,</text><text x="34.0" y="159.6" font-size="12.2" font-weight="normal" fill="#1f2937" text-anchor="start">program or organization level; the team stops monitoring it.</text><rect x="480.0" y="100.0" width="420.0" height="82.0" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/><text x="494.0" y="124.0" font-size="15" font-weight="bold" fill="#14532d" text-anchor="start">Escalate</text><text x="494.0" y="144.0" font-size="12.2" font-weight="normal" fill="#1f2937" text-anchor="start">Same logic for an opportunity beyond the project's scope or authority;</text><text x="494.0" y="159.6" font-size="12.2" font-weight="normal" fill="#1f2937" text-anchor="start">the receiving party must accept ownership.</text><line x1="446.0" y1="141.0" x2="474.0" y2="141.0" stroke="#6b7280" stroke-width="2" marker-end="url(#ah0)"/><line x1="474.0" y1="141.0" x2="446.0" y2="141.0" stroke="#6b7280" stroke-width="2" marker-end="url(#ah0)"/><rect x="20.0" y="190.0" width="420.0" height="82.0" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/><text x="34.0" y="214.0" font-size="15" font-weight="bold" fill="#7f1d1d" text-anchor="start">Avoid</text><text x="34.0" y="234.0" font-size="12.2" font-weight="normal" fill="#1f2937" text-anchor="start">Eliminate the threat or protect the objectives from it: remove the cause,</text><text x="34.0" y="249.6" font-size="12.2" font-weight="normal" fill="#1f2937" text-anchor="start">change the plan, cut scope, extend the schedule.</text><rect x="480.0" y="190.0" width="420.0" height="82.0" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/><text x="494.0" y="214.0" font-size="15" font-weight="bold" fill="#14532d" text-anchor="start">Exploit</text><text x="494.0" y="234.0" font-size="12.2" font-weight="normal" fill="#1f2937" text-anchor="start">Make sure the opportunity happens (probability to 100%): assign the</text><text x="494.0" y="249.6" font-size="12.2" font-weight="normal" fill="#1f2937" text-anchor="start">best people, adopt new technology.</text><line x1="446.0" y1="231.0" x2="474.0" y2="231.0" stroke="#6b7280" stroke-width="2" marker-end="url(#ah0)"/><line x1="474.0" y1="231.0" x2="446.0" y2="231.0" stroke="#6b7280" stroke-width="2" marker-end="url(#ah0)"/><rect x="20.0" y="280.0" width="420.0" height="82.0" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/><text x="34.0" y="304.0" font-size="15" font-weight="bold" fill="#7f1d1d" text-anchor="start">Transfer</text><text x="34.0" y="324.0" font-size="12.2" font-weight="normal" fill="#1f2937" text-anchor="start">Shift impact and ownership to a third party (insurance, bonds,</text><text x="34.0" y="339.6" font-size="12.2" font-weight="normal" fill="#1f2937" text-anchor="start">warranties, fixed-price contract); usually costs a risk premium.</text><rect x="480.0" y="280.0" width="420.0" height="82.0" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/><text x="494.0" y="304.0" font-size="15" font-weight="bold" fill="#14532d" text-anchor="start">Share</text><text x="494.0" y="324.0" font-size="12.2" font-weight="normal" fill="#1f2937" text-anchor="start">Give ownership to the party best able to capture it (joint venture,</text><text x="494.0" y="339.6" font-size="12.2" font-weight="normal" fill="#1f2937" text-anchor="start">partnership) and share the benefit.</text><line x1="446.0" y1="321.0" x2="474.0" y2="321.0" stroke="#6b7280" stroke-width="2" marker-end="url(#ah0)"/><line x1="474.0" y1="321.0" x2="446.0" y2="321.0" stroke="#6b7280" stroke-width="2" marker-end="url(#ah0)"/><rect x="20.0" y="370.0" width="420.0" height="82.0" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/><text x="34.0" y="394.0" font-size="15" font-weight="bold" fill="#7f1d1d" text-anchor="start">Mitigate</text><text x="34.0" y="414.0" font-size="12.2" font-weight="normal" fill="#1f2937" text-anchor="start">Reduce probability and/or impact: more testing, simpler process,</text><text x="34.0" y="429.6" font-size="12.2" font-weight="normal" fill="#1f2937" text-anchor="start">redundancy, prototype, a more stable seller.</text><rect x="480.0" y="370.0" width="420.0" height="82.0" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/><text x="494.0" y="394.0" font-size="15" font-weight="bold" fill="#14532d" text-anchor="start">Enhance</text><text x="494.0" y="414.0" font-size="12.2" font-weight="normal" fill="#1f2937" text-anchor="start">Increase probability and/or impact: focus on the causes, add resources</text><text x="494.0" y="429.6" font-size="12.2" font-weight="normal" fill="#1f2937" text-anchor="start">so work finishes early.</text><line x1="446.0" y1="411.0" x2="474.0" y2="411.0" stroke="#6b7280" stroke-width="2" marker-end="url(#ah0)"/><line x1="474.0" y1="411.0" x2="446.0" y2="411.0" stroke="#6b7280" stroke-width="2" marker-end="url(#ah0)"/><rect x="20.0" y="460.0" width="420.0" height="82.0" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/><text x="34.0" y="484.0" font-size="15" font-weight="bold" fill="#7f1d1d" text-anchor="start">Accept</text><text x="34.0" y="504.0" font-size="12.2" font-weight="normal" fill="#1f2937" text-anchor="start">Acknowledge it, no proactive response. Active: set aside a contingency</text><text x="34.0" y="519.6" font-size="12.2" font-weight="normal" fill="#1f2937" text-anchor="start">reserve. Passive: just review it periodically.</text><rect x="480.0" y="460.0" width="420.0" height="82.0" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/><text x="494.0" y="484.0" font-size="15" font-weight="bold" fill="#14532d" text-anchor="start">Accept</text><text x="494.0" y="504.0" font-size="12.2" font-weight="normal" fill="#1f2937" text-anchor="start">Same: active (contingency reserve to use the opportunity) or passive</text><text x="494.0" y="519.6" font-size="12.2" font-weight="normal" fill="#1f2937" text-anchor="start">(periodic review).</text><line x1="446.0" y1="501.0" x2="474.0" y2="501.0" stroke="#6b7280" stroke-width="2" marker-end="url(#ah0)"/><line x1="474.0" y1="501.0" x2="446.0" y2="501.0" stroke="#6b7280" stroke-width="2" marker-end="url(#ah0)"/><rect x="20.0" y="552.0" width="880.0" height="40.0" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.6"/><text x="460.0" y="568.3" font-size="12.2" font-weight="normal" fill="#374151" text-anchor="middle">Overall project risk uses the same ideas (avoid, exploit, transfer/share, mitigate/enhance, accept). The most extreme form of avoiding overall threat is</text><text x="460.0" y="583.6" font-size="12.2" font-weight="normal" fill="#374151" text-anchor="middle">canceling the project.</text></svg>