<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 470" width="940" height="470" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">Ethical decision flow</title><desc id="d">Recognize and gather facts; check law, policy and the Code; consider stakeholder and safety impacts; consult; act by disclosing, refusing, correcting or reporting; document and follow up.</desc><defs><marker id="ah0" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker></defs><rect x="0.75" y="0.75" width="938.5" height="468.5" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><text x="20.0" y="28.0" font-size="18" font-weight="bold" fill="#1f2937" text-anchor="start">A practical flow for ethical dilemmas</text><text x="20.0" y="48.0" font-size="12" font-weight="normal" fill="#6b7280" text-anchor="start">[Beyond PMBOK 8] A study aid that follows the Code's duties; the Code and organizational policy always rule</text><rect x="20.0" y="66.0" width="270.0" height="34.0" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="155.0" y="87.2" font-size="13" font-weight="bold" fill="#1e3a8a" text-anchor="middle">1 Recognize and get the facts</text><rect x="20.0" y="104.0" width="270.0" height="70.0" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="1.4"/><text x="30.0" y="124.0" font-size="11.5" font-weight="normal" fill="#1f2937" text-anchor="start">What exactly is happening? Who is affected? Do</text><text x="30.0" y="138.4" font-size="11.5" font-weight="normal" fill="#1f2937" text-anchor="start">not accuse without facts.</text><line x1="292.0" y1="83.0" x2="318.0" y2="83.0" stroke="#1f2937" stroke-width="2" marker-end="url(#ah0)"/><rect x="320.0" y="66.0" width="270.0" height="34.0" rx="8" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.6"/><text x="455.0" y="87.2" font-size="13" font-weight="bold" fill="#134e4a" text-anchor="middle">2 Check law, policy and the Code</text><rect x="320.0" y="104.0" width="270.0" height="70.0" rx="6" fill="#ffffff" stroke="#0d9488" stroke-width="1.4"/><text x="330.0" y="124.0" font-size="11.5" font-weight="normal" fill="#1f2937" text-anchor="start">Is something illegal, against policy, or against</text><text x="330.0" y="138.4" font-size="11.5" font-weight="normal" fill="#1f2937" text-anchor="start">the four values?</text><line x1="592.0" y1="83.0" x2="618.0" y2="83.0" stroke="#1f2937" stroke-width="2" marker-end="url(#ah0)"/><rect x="620.0" y="66.0" width="270.0" height="34.0" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="755.0" y="87.2" font-size="13" font-weight="bold" fill="#14532d" text-anchor="middle">3 Weigh the impacts</text><rect x="620.0" y="104.0" width="270.0" height="70.0" rx="6" fill="#ffffff" stroke="#16a34a" stroke-width="1.4"/><text x="630.0" y="124.0" font-size="11.5" font-weight="normal" fill="#1f2937" text-anchor="start">Safety, environment, stakeholders,</text><text x="630.0" y="138.4" font-size="11.5" font-weight="normal" fill="#1f2937" text-anchor="start">confidentiality, conflicts of interest, fairness.</text><polyline points="755.0,174.0 755.0,196.0 155.0,196.0 155.0,214.0" fill="none" stroke="#1f2937" stroke-width="2" marker-end="url(#ah0)" stroke-linejoin="round"/><rect x="20.0" y="216.0" width="270.0" height="34.0" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="155.0" y="237.2" font-size="13" font-weight="bold" fill="#78350f" text-anchor="middle">4 Consult the right people</text><rect x="20.0" y="254.0" width="270.0" height="70.0" rx="6" fill="#ffffff" stroke="#d97706" stroke-width="1.4"/><text x="30.0" y="274.0" font-size="11.5" font-weight="normal" fill="#1f2937" text-anchor="start">Manager, sponsor, legal or compliance, PMO</text><text x="30.0" y="288.4" font-size="11.5" font-weight="normal" fill="#1f2937" text-anchor="start">ethics channel. Be direct, not gossip.</text><line x1="292.0" y1="233.0" x2="318.0" y2="233.0" stroke="#1f2937" stroke-width="2" marker-end="url(#ah0)"/><rect x="320.0" y="216.0" width="270.0" height="34.0" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.6"/><text x="455.0" y="237.2" font-size="13" font-weight="bold" fill="#4c1d95" text-anchor="middle">5 Act</text><rect x="320.0" y="254.0" width="270.0" height="70.0" rx="6" fill="#ffffff" stroke="#7c3aed" stroke-width="1.4"/><text x="330.0" y="274.0" font-size="11.5" font-weight="normal" fill="#1f2937" text-anchor="start">Disclose conflicts, refuse improper requests,</text><text x="330.0" y="288.4" font-size="11.5" font-weight="normal" fill="#1f2937" text-anchor="start">correct errors, share bad news, report violations</text><text x="330.0" y="302.8" font-size="11.5" font-weight="normal" fill="#1f2937" text-anchor="start">to the appropriate body.</text><line x1="592.0" y1="233.0" x2="618.0" y2="233.0" stroke="#1f2937" stroke-width="2" marker-end="url(#ah0)"/><rect x="620.0" y="216.0" width="270.0" height="34.0" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.6"/><text x="755.0" y="237.2" font-size="13" font-weight="bold" fill="#374151" text-anchor="middle">6 Document and follow up</text><rect x="620.0" y="254.0" width="270.0" height="70.0" rx="6" fill="#ffffff" stroke="#9ca3af" stroke-width="1.4"/><text x="630.0" y="274.0" font-size="11.5" font-weight="normal" fill="#1f2937" text-anchor="start">Record decisions; protect people who raise</text><text x="630.0" y="288.4" font-size="11.5" font-weight="normal" fill="#1f2937" text-anchor="start">concerns from retaliation.</text><rect x="20.0" y="340.0" width="900.0" height="106.0" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.8"/><text x="36.0" y="364.0" font-size="13" font-weight="bold" fill="#991b1b" text-anchor="start">Red lines under the Code (never):</text><text x="40.0" y="386.0" font-size="12" font-weight="normal" fill="#1f2937" text-anchor="start">• Deceive: false statements, half-truths, withholding that misleads</text><text x="490.0" y="386.0" font-size="12" font-weight="normal" fill="#1f2937" text-anchor="start">• Offer or accept bribes, favors or gifts that influence decisions</text><text x="40.0" y="406.0" font-size="12" font-weight="normal" fill="#1f2937" text-anchor="start">• Hide a real or apparent conflict of interest</text><text x="490.0" y="406.0" font-size="12" font-weight="normal" fill="#1f2937" text-anchor="start">• Breach confidentiality or misuse proprietary information</text><text x="40.0" y="426.0" font-size="12" font-weight="normal" fill="#1f2937" text-anchor="start">• Take credit for others' work or misrepresent qualifications</text><text x="490.0" y="426.0" font-size="12" font-weight="normal" fill="#1f2937" text-anchor="start">• Retaliate against someone who raises an ethics concern</text></svg>