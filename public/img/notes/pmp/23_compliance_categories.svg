<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 490" width="980" height="490" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">Compliance categories with examples and evidence</title><desc id="d">Eight categories: legal and regulatory, security and privacy, health and safety, environmental and sustainability, quality and industry standards, financial and reporting, contractual, organizational policy and ethics; each with examples and typical verification evidence.</desc><defs></defs><rect x="0.75" y="0.75" width="978.5" height="488.5" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><text x="20.0" y="28.0" font-size="18" font-weight="bold" fill="#1f2937" text-anchor="start">Compliance categories</text><text x="20.0" y="48.0" font-size="12" font-weight="normal" fill="#6b7280" text-anchor="start">Classify requirements so each has an owner, a way to verify it and a priority (categories are a study aid)</text><rect x="21.0" y="70.0" width="224.0" height="190.0" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="1.6"/><rect x="21.0" y="70.0" width="224.0" height="38.0" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="133.0" y="87.0" font-size="12" font-weight="bold" fill="#1e3a8a" text-anchor="middle">Legal and regulatory</text><text x="31.0" y="128.0" font-size="10" font-weight="bold" fill="#6b7280" text-anchor="start">Examples</text><text x="31.0" y="142.0" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">Laws and regulations for the product,</text><text x="31.0" y="155.2" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">industry, location and market;</text><text x="31.0" y="168.4" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">employment, procurement, trade and</text><text x="31.0" y="181.5" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">sanctions</text><text x="31.0" y="202.7" font-size="10" font-weight="bold" fill="#6b7280" text-anchor="start">Typical evidence</text><text x="31.0" y="216.7" font-size="10.8" font-weight="bold" fill="#1e3a8a" text-anchor="start">Legal opinion, permits, licenses,</text><text x="31.0" y="229.9" font-size="10.8" font-weight="bold" fill="#1e3a8a" text-anchor="start">regulator correspondence</text><rect x="259.0" y="70.0" width="224.0" height="190.0" rx="10" fill="#ffffff" stroke="#dc2626" stroke-width="1.6"/><rect x="259.0" y="70.0" width="224.0" height="38.0" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="1.6"/><text x="371.0" y="87.0" font-size="12" font-weight="bold" fill="#7f1d1d" text-anchor="middle">Security and privacy</text><text x="269.0" y="128.0" font-size="10" font-weight="bold" fill="#6b7280" text-anchor="start">Examples</text><text x="269.0" y="142.0" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">Data protection and residency, information</text><text x="269.0" y="155.2" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">security, access control, AI and privacy</text><text x="269.0" y="168.4" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">rules</text><text x="269.0" y="189.5" font-size="10" font-weight="bold" fill="#6b7280" text-anchor="start">Typical evidence</text><text x="269.0" y="203.5" font-size="10.8" font-weight="bold" fill="#7f1d1d" text-anchor="start">Security tests, access logs, data</text><text x="269.0" y="216.7" font-size="10.8" font-weight="bold" fill="#7f1d1d" text-anchor="start">protection assessments</text><rect x="497.0" y="70.0" width="224.0" height="190.0" rx="10" fill="#ffffff" stroke="#d97706" stroke-width="1.6"/><rect x="497.0" y="70.0" width="224.0" height="38.0" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="609.0" y="87.0" font-size="12" font-weight="bold" fill="#78350f" text-anchor="middle">Health and safety</text><text x="507.0" y="128.0" font-size="10" font-weight="bold" fill="#6b7280" text-anchor="start">Examples</text><text x="507.0" y="142.0" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">Public health protocols, workplace safety,</text><text x="507.0" y="155.2" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">infection control, safety-critical standards</text><text x="507.0" y="176.4" font-size="10" font-weight="bold" fill="#6b7280" text-anchor="start">Typical evidence</text><text x="507.0" y="190.4" font-size="10.8" font-weight="bold" fill="#78350f" text-anchor="start">Inspections, safety plans, incident</text><text x="507.0" y="203.5" font-size="10.8" font-weight="bold" fill="#78350f" text-anchor="start">records, certifications</text><rect x="735.0" y="70.0" width="224.0" height="190.0" rx="10" fill="#ffffff" stroke="#16a34a" stroke-width="1.6"/><rect x="735.0" y="70.0" width="224.0" height="38.0" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="847.0" y="87.0" font-size="12" font-weight="bold" fill="#14532d" text-anchor="middle">Environmental and sustainability</text><text x="745.0" y="128.0" font-size="10" font-weight="bold" fill="#6b7280" text-anchor="start">Examples</text><text x="745.0" y="142.0" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">Emissions, energy and water use, waste,</text><text x="745.0" y="155.2" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">ESG commitments, sustainability KPIs</text><text x="745.0" y="176.4" font-size="10" font-weight="bold" fill="#6b7280" text-anchor="start">Typical evidence</text><text x="745.0" y="190.4" font-size="10.8" font-weight="bold" fill="#14532d" text-anchor="start">Measurements, certifications,</text><text x="745.0" y="203.5" font-size="10.8" font-weight="bold" fill="#14532d" text-anchor="start">sustainability reports</text><rect x="21.0" y="274.0" width="224.0" height="190.0" rx="10" fill="#ffffff" stroke="#0d9488" stroke-width="1.6"/><rect x="21.0" y="274.0" width="224.0" height="38.0" rx="10" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.6"/><text x="133.0" y="291.0" font-size="12" font-weight="bold" fill="#134e4a" text-anchor="middle">Quality and industry standards</text><text x="31.0" y="332.0" font-size="10" font-weight="bold" fill="#6b7280" text-anchor="start">Examples</text><text x="31.0" y="346.0" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">Product and process standards, ISO-type</text><text x="31.0" y="359.2" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">certifications, accessibility standards</text><text x="31.0" y="380.4" font-size="10" font-weight="bold" fill="#6b7280" text-anchor="start">Typical evidence</text><text x="31.0" y="394.4" font-size="10.8" font-weight="bold" fill="#134e4a" text-anchor="start">Test results, audits, certificates, DoD</text><text x="31.0" y="407.5" font-size="10.8" font-weight="bold" fill="#134e4a" text-anchor="start">checks</text><rect x="259.0" y="274.0" width="224.0" height="190.0" rx="10" fill="#ffffff" stroke="#7c3aed" stroke-width="1.6"/><rect x="259.0" y="274.0" width="224.0" height="38.0" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.6"/><text x="371.0" y="291.0" font-size="12" font-weight="bold" fill="#4c1d95" text-anchor="middle">Financial and reporting</text><text x="269.0" y="332.0" font-size="10" font-weight="bold" fill="#6b7280" text-anchor="start">Examples</text><text x="269.0" y="346.0" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">Financial controls and data integrity</text><text x="269.0" y="359.2" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">(SOX-type), tax, statutory reporting,</text><text x="269.0" y="372.4" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">funding conditions</text><text x="269.0" y="393.5" font-size="10" font-weight="bold" fill="#6b7280" text-anchor="start">Typical evidence</text><text x="269.0" y="407.5" font-size="10.8" font-weight="bold" fill="#4c1d95" text-anchor="start">Control tests, audit trails,</text><text x="269.0" y="420.7" font-size="10.8" font-weight="bold" fill="#4c1d95" text-anchor="start">reconciliations</text><rect x="497.0" y="274.0" width="224.0" height="190.0" rx="10" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><rect x="497.0" y="274.0" width="224.0" height="38.0" rx="10" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.6"/><text x="609.0" y="291.0" font-size="12" font-weight="bold" fill="#374151" text-anchor="middle">Contractual</text><text x="507.0" y="332.0" font-size="10" font-weight="bold" fill="#6b7280" text-anchor="start">Examples</text><text x="507.0" y="346.0" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">Terms in customer and supplier</text><text x="507.0" y="359.2" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">agreements: SLAs, acceptance criteria,</text><text x="507.0" y="372.4" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">flow-down clauses, penalties</text><text x="507.0" y="393.5" font-size="10" font-weight="bold" fill="#6b7280" text-anchor="start">Typical evidence</text><text x="507.0" y="407.5" font-size="10.8" font-weight="bold" fill="#374151" text-anchor="start">Contract compliance matrix,</text><text x="507.0" y="420.7" font-size="10.8" font-weight="bold" fill="#374151" text-anchor="start">acceptance records, supplier audits</text><rect x="735.0" y="274.0" width="224.0" height="190.0" rx="10" fill="#ffffff" stroke="#1e3a8a" stroke-width="1.6"/><rect x="735.0" y="274.0" width="224.0" height="38.0" rx="10" fill="#1e3a8a" stroke="#1e3a8a" stroke-width="1.6"/><text x="847.0" y="291.0" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">Organizational policy and ethics</text><text x="745.0" y="332.0" font-size="10" font-weight="bold" fill="#6b7280" text-anchor="start">Examples</text><text x="745.0" y="346.0" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">Code of conduct, gift and</text><text x="745.0" y="359.2" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">conflict-of-interest rules, procurement and</text><text x="745.0" y="372.4" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">approval policies</text><text x="745.0" y="393.5" font-size="10" font-weight="bold" fill="#6b7280" text-anchor="start">Typical evidence</text><text x="745.0" y="407.5" font-size="10.8" font-weight="bold" fill="#1e3a8a" text-anchor="start">Ethics reviews, approvals, training</text><text x="745.0" y="420.7" font-size="10.8" font-weight="bold" fill="#1e3a8a" text-anchor="start">records, declarations</text></svg>