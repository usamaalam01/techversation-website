<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 560" width="980" height="560" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">Five conflict resolution techniques</title><desc id="d">Force or direct, collaborate or problem-solve, withdraw or avoid, smooth or accommodate, and compromise or reconcile, arranged by concern for own goals and concern for the relationship, with when to use each.</desc><defs></defs><rect x="0.75" y="0.75" width="978.5" height="558.5" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><text x="20.0" y="28.0" font-size="18" font-weight="bold" fill="#1f2937" text-anchor="start">Five conflict resolution techniques (PMBOK 8)</text><text x="20.0" y="48.0" font-size="12" font-weight="normal" fill="#6b7280" text-anchor="start">Each has its place; the right one depends on importance, time, power and the relationship</text><rect x="70.0" y="76.0" width="470.0" height="400.0" rx="8" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.3"/><line x1="305.0" y1="76.0" x2="305.0" y2="476.0" stroke="#d1d5db" stroke-width="1.2" stroke-dasharray="4 4"/><line x1="70.0" y1="276.0" x2="540.0" y2="276.0" stroke="#d1d5db" stroke-width="1.2" stroke-dasharray="4 4"/><text x="32" y="276.0" font-size="11.5" font-weight="bold" fill="#6b7280" text-anchor="middle" transform="rotate(-90 32 276.0)">Concern for own goals (assertive)</text><text x="305.0" y="498.0" font-size="11.5" font-weight="bold" fill="#6b7280" text-anchor="middle">Concern for the relationship (cooperative)</text><text x="76.0" y="498.0" font-size="10.5" font-weight="normal" fill="#6b7280" text-anchor="start">low</text><text x="534.0" y="498.0" font-size="10.5" font-weight="normal" fill="#6b7280" text-anchor="end">high</text><rect x="100.0" y="111.0" width="190.0" height="100.0" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="1.8"/><text x="195.0" y="139.0" font-size="13" font-weight="bold" fill="#7f1d1d" text-anchor="middle">Force / direct</text><text x="195.0" y="175.0" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="middle">Push your viewpoint; win-lose,</text><text x="195.0" y="188.0" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="middle">backed by power</text><rect x="320.0" y="111.0" width="190.0" height="100.0" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.8"/><text x="415.0" y="139.0" font-size="13" font-weight="bold" fill="#14532d" text-anchor="middle">Collaborate / problem-solve</text><text x="415.0" y="175.0" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="middle">Combine viewpoints; consensus</text><text x="415.0" y="188.0" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="middle">and commitment; win-win</text><rect x="210.0" y="226.0" width="190.0" height="100.0" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.8"/><text x="305.0" y="254.0" font-size="13" font-weight="bold" fill="#78350f" text-anchor="middle">Compromise / reconcile</text><text x="305.0" y="290.0" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="middle">Some satisfaction for all; partial or</text><text x="305.0" y="303.0" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="middle">temporary; can be lose-lose</text><rect x="100.0" y="341.0" width="190.0" height="100.0" rx="10" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.8"/><text x="195.0" y="369.0" font-size="13" font-weight="bold" fill="#374151" text-anchor="middle">Withdraw / avoid</text><text x="195.0" y="405.0" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="middle">Retreat or postpone the issue</text><rect x="320.0" y="341.0" width="190.0" height="100.0" rx="10" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.8"/><text x="415.0" y="369.0" font-size="13" font-weight="bold" fill="#134e4a" text-anchor="middle">Smooth / accommodate</text><text x="415.0" y="405.0" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="middle">Stress agreement; concede to keep</text><text x="415.0" y="418.0" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="middle">harmony</text><text x="590.0" y="82.0" font-size="13" font-weight="bold" fill="#1f2937" text-anchor="start">When each technique fits</text><rect x="590.0" y="96.0" width="370.0" height="56.8" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/><text x="602.0" y="116.0" font-size="11.8" font-weight="bold" fill="#14532d" text-anchor="start">Collaborate / problem-solve</text><text x="602.0" y="131.0" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">Important issue, time available, relationship matters, differing views</text><text x="602.0" y="144.2" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">have value. The preferred approach when feasible.</text><rect x="590.0" y="160.8" width="370.0" height="56.8" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/><text x="602.0" y="180.8" font-size="11.8" font-weight="bold" fill="#78350f" text-anchor="start">Compromise / reconcile</text><text x="602.0" y="195.8" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">Time pressure, roughly equal power, both positions sound; a workable,</text><text x="602.0" y="209.0" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">possibly temporary answer.</text><rect x="590.0" y="225.6" width="370.0" height="56.8" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/><text x="602.0" y="245.6" font-size="11.8" font-weight="bold" fill="#7f1d1d" text-anchor="start">Force / direct</text><text x="602.0" y="260.6" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">Emergencies, safety or compliance, a necessary but unpopular</text><text x="602.0" y="273.8" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">decision; the person with authority decides.</text><rect x="590.0" y="290.4" width="370.0" height="56.8" rx="8" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.5"/><text x="602.0" y="310.4" font-size="11.8" font-weight="bold" fill="#134e4a" text-anchor="start">Smooth / accommodate</text><text x="602.0" y="325.4" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">The relationship matters more than this issue, or the issue is minor to</text><text x="602.0" y="338.6" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">you.</text><rect x="590.0" y="355.2" width="370.0" height="56.8" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/><text x="602.0" y="375.2" font-size="11.8" font-weight="bold" fill="#374151" text-anchor="start">Withdraw / avoid</text><text x="602.0" y="390.2" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">Trivial issue, emotions too high (cool down first), or you need</text><text x="602.0" y="403.4" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">preparation; revisit it.</text></svg>