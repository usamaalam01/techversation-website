<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 458" width="980" height="458" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">The six Scope performance domain processes</title><desc id="d">Plan Scope Management, Elicit and Analyze Requirements, Define Scope and Develop Scope Structure in Planning; Monitor and Control Scope and Validate Scope in Monitoring and Controlling. Predictive uses a scope baseline; adaptive uses a prioritized backlog.</desc><defs><marker id="ah0" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker></defs><rect x="0.75" y="0.75" width="978.5" height="456.5" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><text x="20.0" y="28.0" font-size="18" font-weight="bold" fill="#1f2937" text-anchor="start">Scope domain: six processes from plan to acceptance</text><text x="20.0" y="48.0" font-size="12" font-weight="normal" fill="#6b7280" text-anchor="start">PMBOK 8 Figure 2-13: four planning processes, then monitor and control, then validate (formal acceptance)</text><rect x="22.0" y="62.0" width="620.0" height="24.0" rx="12" fill="#f0fdfa" stroke="#0d9488" stroke-width="1.2"/><text x="332.0" y="79.0" font-size="11.5" font-weight="bold" fill="#134e4a" text-anchor="middle">PLANNING Focus Area</text><rect x="654.0" y="62.0" width="304.0" height="24.0" rx="12" fill="#fffbeb" stroke="#d97706" stroke-width="1.2"/><text x="806.0" y="79.0" font-size="11.5" font-weight="bold" fill="#78350f" text-anchor="middle">MONITORING AND CONTROLLING</text><rect x="22.0" y="96.0" width="146.0" height="52.0" rx="8" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.6"/><text x="95.0" y="118.2" font-size="12.5" font-weight="bold" fill="#134e4a" text-anchor="middle">Plan Scope</text><text x="95.0" y="133.9" font-size="12.5" font-weight="bold" fill="#134e4a" text-anchor="middle">Management</text><rect x="22.0" y="154.0" width="146.0" height="172.0" rx="8" fill="#ffffff" stroke="#0d9488" stroke-width="1.5"/><text x="32.0" y="174.0" font-size="10.5" font-weight="bold" fill="#6b7280" text-anchor="start">Purpose</text><text x="32.0" y="189.0" font-size="11.2" font-weight="normal" fill="#1f2937" text-anchor="start">Defines how scope will</text><text x="32.0" y="203.0" font-size="11.2" font-weight="normal" fill="#1f2937" text-anchor="start">be defined, validated and</text><text x="32.0" y="217.0" font-size="11.2" font-weight="normal" fill="#1f2937" text-anchor="start">controlled</text><text x="32.0" y="243.0" font-size="10.5" font-weight="bold" fill="#6b7280" text-anchor="start">Key output</text><text x="32.0" y="258.0" font-size="11.2" font-weight="bold" fill="#134e4a" text-anchor="start">Scope management</text><text x="32.0" y="272.0" font-size="11.2" font-weight="bold" fill="#134e4a" text-anchor="start">plan; requirements</text><text x="32.0" y="286.0" font-size="11.2" font-weight="bold" fill="#134e4a" text-anchor="start">management plan</text><line x1="169.0" y1="122.0" x2="179.0" y2="122.0" stroke="#1f2937" stroke-width="2" marker-end="url(#ah0)"/><rect x="180.0" y="96.0" width="146.0" height="52.0" rx="8" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.6"/><text x="253.0" y="118.2" font-size="12.5" font-weight="bold" fill="#134e4a" text-anchor="middle">Elicit and Analyze</text><text x="253.0" y="133.9" font-size="12.5" font-weight="bold" fill="#134e4a" text-anchor="middle">Requirements</text><rect x="180.0" y="154.0" width="146.0" height="172.0" rx="8" fill="#ffffff" stroke="#0d9488" stroke-width="1.5"/><text x="190.0" y="174.0" font-size="10.5" font-weight="bold" fill="#6b7280" text-anchor="start">Purpose</text><text x="190.0" y="189.0" font-size="11.2" font-weight="normal" fill="#1f2937" text-anchor="start">Finds, documents and</text><text x="190.0" y="203.0" font-size="11.2" font-weight="normal" fill="#1f2937" text-anchor="start">manages stakeholder</text><text x="190.0" y="217.0" font-size="11.2" font-weight="normal" fill="#1f2937" text-anchor="start">needs and requirements</text><text x="190.0" y="243.0" font-size="10.5" font-weight="bold" fill="#6b7280" text-anchor="start">Key output</text><text x="190.0" y="258.0" font-size="11.2" font-weight="bold" fill="#134e4a" text-anchor="start">Requirements</text><text x="190.0" y="272.0" font-size="11.2" font-weight="bold" fill="#134e4a" text-anchor="start">documentation (user</text><text x="190.0" y="286.0" font-size="11.2" font-weight="bold" fill="#134e4a" text-anchor="start">stories in a backlog</text><text x="190.0" y="300.0" font-size="11.2" font-weight="bold" fill="#134e4a" text-anchor="start">when adaptive)</text><line x1="327.0" y1="122.0" x2="337.0" y2="122.0" stroke="#1f2937" stroke-width="2" marker-end="url(#ah0)"/><rect x="338.0" y="96.0" width="146.0" height="52.0" rx="8" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.6"/><text x="411.0" y="126.1" font-size="12.5" font-weight="bold" fill="#134e4a" text-anchor="middle">Define Scope</text><rect x="338.0" y="154.0" width="146.0" height="172.0" rx="8" fill="#ffffff" stroke="#0d9488" stroke-width="1.5"/><text x="348.0" y="174.0" font-size="10.5" font-weight="bold" fill="#6b7280" text-anchor="start">Purpose</text><text x="348.0" y="189.0" font-size="11.2" font-weight="normal" fill="#1f2937" text-anchor="start">Describes the project,</text><text x="348.0" y="203.0" font-size="11.2" font-weight="normal" fill="#1f2937" text-anchor="start">the product and the</text><text x="348.0" y="217.0" font-size="11.2" font-weight="normal" fill="#1f2937" text-anchor="start">value expected; sets</text><text x="348.0" y="231.0" font-size="11.2" font-weight="normal" fill="#1f2937" text-anchor="start">quality requirements and</text><text x="348.0" y="245.0" font-size="11.2" font-weight="normal" fill="#1f2937" text-anchor="start">standards</text><text x="348.0" y="271.0" font-size="10.5" font-weight="bold" fill="#6b7280" text-anchor="start">Key output</text><text x="348.0" y="286.0" font-size="11.2" font-weight="bold" fill="#134e4a" text-anchor="start">Project scope statement</text><text x="348.0" y="300.0" font-size="11.2" font-weight="bold" fill="#134e4a" text-anchor="start">(acceptance criteria,</text><text x="348.0" y="314.0" font-size="11.2" font-weight="bold" fill="#134e4a" text-anchor="start">exclusions)</text><line x1="485.0" y1="122.0" x2="495.0" y2="122.0" stroke="#1f2937" stroke-width="2" marker-end="url(#ah0)"/><rect x="496.0" y="96.0" width="146.0" height="52.0" rx="8" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.6"/><text x="569.0" y="118.2" font-size="12.5" font-weight="bold" fill="#134e4a" text-anchor="middle">Develop Scope</text><text x="569.0" y="133.9" font-size="12.5" font-weight="bold" fill="#134e4a" text-anchor="middle">Structure</text><rect x="496.0" y="154.0" width="146.0" height="172.0" rx="8" fill="#ffffff" stroke="#0d9488" stroke-width="1.5"/><text x="506.0" y="174.0" font-size="10.5" font-weight="bold" fill="#6b7280" text-anchor="start">Purpose</text><text x="506.0" y="189.0" font-size="11.2" font-weight="normal" fill="#1f2937" text-anchor="start">Subdivides deliverables</text><text x="506.0" y="203.0" font-size="11.2" font-weight="normal" fill="#1f2937" text-anchor="start">and work into</text><text x="506.0" y="217.0" font-size="11.2" font-weight="normal" fill="#1f2937" text-anchor="start">manageable parts</text><text x="506.0" y="243.0" font-size="10.5" font-weight="bold" fill="#6b7280" text-anchor="start">Key output</text><text x="506.0" y="258.0" font-size="11.2" font-weight="bold" fill="#134e4a" text-anchor="start">WBS, WBS dictionary,</text><text x="506.0" y="272.0" font-size="11.2" font-weight="bold" fill="#134e4a" text-anchor="start">scope baseline</text><text x="506.0" y="286.0" font-size="11.2" font-weight="bold" fill="#134e4a" text-anchor="start">(adaptive: backlog, user</text><text x="506.0" y="300.0" font-size="11.2" font-weight="bold" fill="#134e4a" text-anchor="start">stories)</text><line x1="643.0" y1="122.0" x2="653.0" y2="122.0" stroke="#1f2937" stroke-width="2" marker-end="url(#ah0)"/><rect x="654.0" y="96.0" width="146.0" height="52.0" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="727.0" y="118.2" font-size="12.5" font-weight="bold" fill="#78350f" text-anchor="middle">Monitor and Control</text><text x="727.0" y="133.9" font-size="12.5" font-weight="bold" fill="#78350f" text-anchor="middle">Scope</text><rect x="654.0" y="154.0" width="146.0" height="172.0" rx="8" fill="#ffffff" stroke="#d97706" stroke-width="1.5"/><text x="664.0" y="174.0" font-size="10.5" font-weight="bold" fill="#6b7280" text-anchor="start">Purpose</text><text x="664.0" y="189.0" font-size="11.2" font-weight="normal" fill="#1f2937" text-anchor="start">Tracks scope status,</text><text x="664.0" y="203.0" font-size="11.2" font-weight="normal" fill="#1f2937" text-anchor="start">manages baseline</text><text x="664.0" y="217.0" font-size="11.2" font-weight="normal" fill="#1f2937" text-anchor="start">changes, measures</text><text x="664.0" y="231.0" font-size="11.2" font-weight="normal" fill="#1f2937" text-anchor="start">quality of deliverables</text><text x="664.0" y="257.0" font-size="10.5" font-weight="bold" fill="#6b7280" text-anchor="start">Key output</text><text x="664.0" y="272.0" font-size="11.2" font-weight="bold" fill="#78350f" text-anchor="start">Verified deliverables,</text><text x="664.0" y="286.0" font-size="11.2" font-weight="bold" fill="#78350f" text-anchor="start">quality reports, change</text><text x="664.0" y="300.0" font-size="11.2" font-weight="bold" fill="#78350f" text-anchor="start">requests</text><line x1="801.0" y1="122.0" x2="811.0" y2="122.0" stroke="#1f2937" stroke-width="2" marker-end="url(#ah0)"/><rect x="812.0" y="96.0" width="146.0" height="52.0" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="885.0" y="126.1" font-size="12.5" font-weight="bold" fill="#78350f" text-anchor="middle">Validate Scope</text><rect x="812.0" y="154.0" width="146.0" height="172.0" rx="8" fill="#ffffff" stroke="#d97706" stroke-width="1.5"/><text x="822.0" y="174.0" font-size="10.5" font-weight="bold" fill="#6b7280" text-anchor="start">Purpose</text><text x="822.0" y="189.0" font-size="11.2" font-weight="normal" fill="#1f2937" text-anchor="start">Formalizes acceptance</text><text x="822.0" y="203.0" font-size="11.2" font-weight="normal" fill="#1f2937" text-anchor="start">of completed</text><text x="822.0" y="217.0" font-size="11.2" font-weight="normal" fill="#1f2937" text-anchor="start">deliverables</text><text x="822.0" y="243.0" font-size="10.5" font-weight="bold" fill="#6b7280" text-anchor="start">Key output</text><text x="822.0" y="258.0" font-size="11.2" font-weight="bold" fill="#78350f" text-anchor="start">Accepted deliverables,</text><text x="822.0" y="272.0" font-size="11.2" font-weight="bold" fill="#78350f" text-anchor="start">change requests</text><rect x="20.0" y="342.0" width="460.0" height="100.0" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="32.0" y="381.4" font-size="11.5" font-weight="bold" fill="#1e3a8a" text-anchor="start">Predictive / hybrid fixed scope</text><text x="32.0" y="395.7" font-size="11.5" font-weight="normal" fill="#1e3a8a" text-anchor="start">Scope is fixed in a baseline: project scope statement + WBS + WBS dictionary. The</text><text x="32.0" y="410.1" font-size="11.5" font-weight="normal" fill="#1e3a8a" text-anchor="start">WBS decomposes the total scope; changes go through formal change control.</text><rect x="500.0" y="342.0" width="460.0" height="100.0" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="512.0" y="374.2" font-size="11.5" font-weight="bold" fill="#14532d" text-anchor="start">Adaptive scope</text><text x="512.0" y="388.6" font-size="11.5" font-weight="normal" fill="#14532d" text-anchor="start">Scope is a prioritized backlog (roadmap, releases, iterations; epics, features, user</text><text x="512.0" y="402.9" font-size="11.5" font-weight="normal" fill="#14532d" text-anchor="start">stories). The product owner reorders it by value; the baseline is set at the start of</text><text x="512.0" y="417.3" font-size="11.5" font-weight="normal" fill="#14532d" text-anchor="start">each iteration; a definition of done defines complete.</text></svg>