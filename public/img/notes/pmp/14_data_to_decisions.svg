<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 470" width="980" height="470" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">From data to decisions</title><desc id="d">Work performance data becomes work performance information when analyzed against the plan, then work performance reports that drive decisions; techniques for gathering, analyzing, representing and deciding.</desc><defs><marker id="ah0" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker></defs><rect x="0.75" y="0.75" width="978.5" height="468.5" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><text x="20.0" y="28.0" font-size="18" font-weight="bold" fill="#1f2937" text-anchor="start">Collect and analyze data to make informed decisions</text><text x="20.0" y="48.0" font-size="12" font-weight="normal" fill="#6b7280" text-anchor="start">PMBOK 8: raw data → information (compared with the plan) → reports → decisions and actions</text><rect x="20.0" y="72.0" width="214.0" height="44.0" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.6"/><text x="127.0" y="98.1" font-size="12.5" font-weight="bold" fill="#374151" text-anchor="middle">Work performance data</text><rect x="20.0" y="122.0" width="214.0" height="80.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="127.0" y="151.4" font-size="11.5" font-weight="normal" fill="#1f2937" text-anchor="middle">Raw observations: work completed,</text><text x="127.0" y="165.7" font-size="11.5" font-weight="normal" fill="#1f2937" text-anchor="middle">actual costs and dates, story points</text><text x="127.0" y="180.1" font-size="11.5" font-weight="normal" fill="#1f2937" text-anchor="middle">done, defects, change requests, KPIs</text><line x1="236.0" y1="94.0" x2="260.0" y2="94.0" stroke="#1f2937" stroke-width="2.2" marker-end="url(#ah0)"/><rect x="262.0" y="72.0" width="214.0" height="44.0" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="369.0" y="98.1" font-size="12.5" font-weight="bold" fill="#1e3a8a" text-anchor="middle">Work performance information</text><rect x="262.0" y="122.0" width="214.0" height="80.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="369.0" y="151.4" font-size="11.5" font-weight="normal" fill="#1f2937" text-anchor="middle">Data compared with the plan and</text><text x="369.0" y="165.7" font-size="11.5" font-weight="normal" fill="#1f2937" text-anchor="middle">thresholds: variances, trends,</text><text x="369.0" y="180.1" font-size="11.5" font-weight="normal" fill="#1f2937" text-anchor="middle">forecasts</text><line x1="478.0" y1="94.0" x2="502.0" y2="94.0" stroke="#1f2937" stroke-width="2.2" marker-end="url(#ah0)"/><rect x="504.0" y="72.0" width="214.0" height="44.0" rx="8" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.6"/><text x="611.0" y="98.1" font-size="12.5" font-weight="bold" fill="#134e4a" text-anchor="middle">Work performance reports</text><rect x="504.0" y="122.0" width="214.0" height="80.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="611.0" y="151.4" font-size="11.5" font-weight="normal" fill="#1f2937" text-anchor="middle">Status and progress reports,</text><text x="611.0" y="165.7" font-size="11.5" font-weight="normal" fill="#1f2937" text-anchor="middle">dashboards, EV and burn charts, risk</text><text x="611.0" y="180.1" font-size="11.5" font-weight="normal" fill="#1f2937" text-anchor="middle">summaries</text><line x1="720.0" y1="94.0" x2="744.0" y2="94.0" stroke="#1f2937" stroke-width="2.2" marker-end="url(#ah0)"/><rect x="746.0" y="72.0" width="214.0" height="44.0" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="853.0" y="98.1" font-size="12.5" font-weight="bold" fill="#14532d" text-anchor="middle">Decisions and actions</text><rect x="746.0" y="122.0" width="214.0" height="80.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="853.0" y="151.4" font-size="11.5" font-weight="normal" fill="#1f2937" text-anchor="middle">Corrective or preventive action,</text><text x="853.0" y="165.7" font-size="11.5" font-weight="normal" fill="#1f2937" text-anchor="middle">change requests, replanning,</text><text x="853.0" y="180.1" font-size="11.5" font-weight="normal" fill="#1f2937" text-anchor="middle">escalation</text><rect x="20.0" y="222.0" width="224.0" height="34.0" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="132.0" y="243.2" font-size="13" font-weight="bold" fill="#1e3a8a" text-anchor="middle">Gather</text><rect x="20.0" y="260.0" width="224.0" height="136.0" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/><text x="30.0" y="280.0" font-size="12" font-weight="bold" fill="#2563eb" text-anchor="start">•</text><text x="44.0" y="280.0" font-size="11.3" font-weight="normal" fill="#1f2937" text-anchor="start">Brainstorming, interviews, focus</text><text x="44.0" y="293.6" font-size="11.3" font-weight="normal" fill="#1f2937" text-anchor="start">groups</text><text x="30.0" y="312.1" font-size="12" font-weight="bold" fill="#2563eb" text-anchor="start">•</text><text x="44.0" y="312.1" font-size="11.3" font-weight="normal" fill="#1f2937" text-anchor="start">Questionnaires and surveys</text><text x="30.0" y="330.7" font-size="12" font-weight="bold" fill="#2563eb" text-anchor="start">•</text><text x="44.0" y="330.7" font-size="11.3" font-weight="normal" fill="#1f2937" text-anchor="start">Benchmarking, checklists</text><text x="30.0" y="349.2" font-size="12" font-weight="bold" fill="#2563eb" text-anchor="start">•</text><text x="44.0" y="349.2" font-size="11.3" font-weight="normal" fill="#1f2937" text-anchor="start">Observation, document analysis</text><rect x="258.0" y="222.0" width="224.0" height="34.0" rx="8" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.6"/><text x="370.0" y="243.2" font-size="13" font-weight="bold" fill="#134e4a" text-anchor="middle">Analyze</text><rect x="258.0" y="260.0" width="224.0" height="136.0" rx="8" fill="#ffffff" stroke="#0d9488" stroke-width="1.5"/><text x="268.0" y="280.0" font-size="12" font-weight="bold" fill="#0d9488" text-anchor="start">•</text><text x="282.0" y="280.0" font-size="11.3" font-weight="normal" fill="#1f2937" text-anchor="start">Variance, trend, regression, earned</text><text x="282.0" y="293.6" font-size="11.3" font-weight="normal" fill="#1f2937" text-anchor="start">value</text><text x="268.0" y="312.1" font-size="12" font-weight="bold" fill="#0d9488" text-anchor="start">•</text><text x="282.0" y="312.1" font-size="11.3" font-weight="normal" fill="#1f2937" text-anchor="start">Root cause, alternative, cost-benefit</text><text x="268.0" y="330.7" font-size="12" font-weight="bold" fill="#0d9488" text-anchor="start">•</text><text x="282.0" y="330.7" font-size="11.3" font-weight="normal" fill="#1f2937" text-anchor="start">What-if, simulation, sensitivity</text><text x="268.0" y="349.2" font-size="12" font-weight="bold" fill="#0d9488" text-anchor="start">•</text><text x="282.0" y="349.2" font-size="11.3" font-weight="normal" fill="#1f2937" text-anchor="start">SWOT, stakeholder, process analysis</text><rect x="496.0" y="222.0" width="224.0" height="34.0" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="608.0" y="243.2" font-size="13" font-weight="bold" fill="#78350f" text-anchor="middle">Represent</text><rect x="496.0" y="260.0" width="224.0" height="136.0" rx="8" fill="#ffffff" stroke="#d97706" stroke-width="1.5"/><text x="506.0" y="280.0" font-size="12" font-weight="bold" fill="#d97706" text-anchor="start">•</text><text x="520.0" y="280.0" font-size="11.3" font-weight="normal" fill="#1f2937" text-anchor="start">Charts: pie, bar, histogram, line</text><text x="506.0" y="298.6" font-size="12" font-weight="bold" fill="#d97706" text-anchor="start">•</text><text x="520.0" y="298.6" font-size="11.3" font-weight="normal" fill="#1f2937" text-anchor="start">Cause-and-effect, flowcharts, matrices</text><text x="506.0" y="317.1" font-size="12" font-weight="bold" fill="#d97706" text-anchor="start">•</text><text x="520.0" y="317.1" font-size="11.3" font-weight="normal" fill="#1f2937" text-anchor="start">Dashboards and information radiators</text><text x="506.0" y="335.7" font-size="12" font-weight="bold" fill="#d97706" text-anchor="start">•</text><text x="520.0" y="335.7" font-size="11.3" font-weight="normal" fill="#1f2937" text-anchor="start">Mind maps, affinity diagrams</text><rect x="734.0" y="222.0" width="224.0" height="34.0" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.6"/><text x="846.0" y="243.2" font-size="13" font-weight="bold" fill="#4c1d95" text-anchor="middle">Decide</text><rect x="734.0" y="260.0" width="224.0" height="136.0" rx="8" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/><text x="744.0" y="280.0" font-size="12" font-weight="bold" fill="#7c3aed" text-anchor="start">•</text><text x="758.0" y="280.0" font-size="11.3" font-weight="normal" fill="#1f2937" text-anchor="start">Voting: unanimity, majority, plurality</text><text x="744.0" y="298.6" font-size="12" font-weight="bold" fill="#7c3aed" text-anchor="start">•</text><text x="758.0" y="298.6" font-size="11.3" font-weight="normal" fill="#1f2937" text-anchor="start">Autocratic (one decider)</text><text x="744.0" y="317.1" font-size="12" font-weight="bold" fill="#7c3aed" text-anchor="start">•</text><text x="758.0" y="317.1" font-size="11.3" font-weight="normal" fill="#1f2937" text-anchor="start">Multicriteria decision analysis</text><text x="744.0" y="335.7" font-size="12" font-weight="bold" fill="#7c3aed" text-anchor="start">•</text><text x="758.0" y="335.7" font-size="11.3" font-weight="normal" fill="#1f2937" text-anchor="start">Diverge, then converge; escalate</text><text x="758.0" y="349.2" font-size="11.3" font-weight="normal" fill="#1f2937" text-anchor="start">beyond authority</text><rect x="20.0" y="410.0" width="940.0" height="44.0" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.6"/><text x="490.0" y="435.8" font-size="11.8" font-weight="normal" fill="#374151" text-anchor="middle">Pitfalls: validate data quality, avoid vanity metrics, confirmation bias and correlation-vs-causation errors; use AI to help analyze but keep human judgment and accountability.</text></svg>