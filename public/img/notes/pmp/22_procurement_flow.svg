<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 520" width="980" height="520" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">Procurement flow from need to contract closure</title><desc id="d">Plan: make-or-buy, procurement strategy, procurement management plan, statement of work and estimates, bid documents. Conduct: advertise, bidder conference, proposals, evaluation and source selection, negotiation and award. Administer and close: monitor performance, control changes and payments, handle claims and disputes, close contracts.</desc><defs><marker id="ah0" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker></defs><rect x="0.75" y="0.75" width="978.5" height="518.5" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><text x="20.0" y="28.0" font-size="18" font-weight="bold" fill="#1f2937" text-anchor="start">Procurement flow</text><text x="20.0" y="48.0" font-size="12" font-weight="normal" fill="#6b7280" text-anchor="start">Not a separate PMBOK 8 domain: sourcing strategy sits in Governance; the Procurement appendix (X4) covers the rest</text><rect x="20.0" y="66.0" width="120.0" height="130.0" rx="10" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.6"/><text x="80.0" y="96.0" font-size="12" font-weight="bold" fill="#134e4a" text-anchor="middle">PLAN</text><text x="80.0" y="132.0" font-size="9.8" font-weight="normal" fill="#1f2937" text-anchor="middle">Plan Sourcing Strategy</text><text x="80.0" y="143.8" font-size="9.8" font-weight="normal" fill="#1f2937" text-anchor="middle">(Governance domain)</text><text x="80.0" y="155.5" font-size="9.8" font-weight="normal" fill="#1f2937" text-anchor="middle">and Appendix X4</text><rect x="150.0" y="66.0" width="187.5" height="130.0" rx="8" fill="#ffffff" stroke="#0d9488" stroke-width="1.5"/><text x="160.0" y="90.0" font-size="11.8" font-weight="bold" fill="#134e4a" text-anchor="start">Need identified; make-or-buy</text><text x="160.0" y="104.2" font-size="11.8" font-weight="bold" fill="#134e4a" text-anchor="start">analysis</text><text x="160.0" y="144.0" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">Buy only if it beats doing the work</text><text x="160.0" y="157.2" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">in house</text><line x1="338.5" y1="131.0" x2="356.5" y2="131.0" stroke="#1f2937" stroke-width="2" marker-end="url(#ah0)"/><rect x="357.5" y="66.0" width="187.5" height="130.0" rx="8" fill="#ffffff" stroke="#0d9488" stroke-width="1.5"/><text x="367.5" y="90.0" font-size="11.8" font-weight="bold" fill="#134e4a" text-anchor="start">Sourcing and procurement</text><text x="367.5" y="104.2" font-size="11.8" font-weight="bold" fill="#134e4a" text-anchor="start">strategy</text><text x="367.5" y="144.0" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">Delivery method, agreement type,</text><text x="367.5" y="157.2" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">phases</text><line x1="546.0" y1="131.0" x2="564.0" y2="131.0" stroke="#1f2937" stroke-width="2" marker-end="url(#ah0)"/><rect x="565.0" y="66.0" width="187.5" height="130.0" rx="8" fill="#ffffff" stroke="#0d9488" stroke-width="1.5"/><text x="575.0" y="90.0" font-size="11.8" font-weight="bold" fill="#134e4a" text-anchor="start">Procurement management</text><text x="575.0" y="104.2" font-size="11.8" font-weight="bold" fill="#134e4a" text-anchor="start">plan, SOW, estimates</text><text x="575.0" y="144.0" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">Rules, roles, metrics, timetable</text><line x1="753.5" y1="131.0" x2="771.5" y2="131.0" stroke="#1f2937" stroke-width="2" marker-end="url(#ah0)"/><rect x="772.5" y="66.0" width="187.5" height="130.0" rx="8" fill="#ffffff" stroke="#0d9488" stroke-width="1.5"/><text x="782.5" y="90.0" font-size="11.8" font-weight="bold" fill="#134e4a" text-anchor="start">Bid documents</text><text x="782.5" y="144.0" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">RFI, then RFP, RFQ or IFB (ITT)</text><rect x="20.0" y="212.0" width="120.0" height="130.0" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="80.0" y="242.0" font-size="12" font-weight="bold" fill="#14532d" text-anchor="middle">CONDUCT</text><text x="80.0" y="278.0" font-size="9.8" font-weight="normal" fill="#1f2937" text-anchor="middle">Appendix X4: bid</text><text x="80.0" y="289.8" font-size="9.8" font-weight="normal" fill="#1f2937" text-anchor="middle">process and source</text><text x="80.0" y="301.5" font-size="9.8" font-weight="normal" fill="#1f2937" text-anchor="middle">selection</text><rect x="150.0" y="212.0" width="146.0" height="130.0" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/><text x="160.0" y="236.0" font-size="11.8" font-weight="bold" fill="#14532d" text-anchor="start">Advertise; qualified</text><text x="160.0" y="250.2" font-size="11.8" font-weight="bold" fill="#14532d" text-anchor="start">sellers</text><text x="160.0" y="290.0" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">Equal opportunity</text><line x1="297.0" y1="277.0" x2="315.0" y2="277.0" stroke="#1f2937" stroke-width="2" marker-end="url(#ah0)"/><rect x="316.0" y="212.0" width="146.0" height="130.0" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/><text x="326.0" y="236.0" font-size="11.8" font-weight="bold" fill="#14532d" text-anchor="start">Bidder conference</text><text x="326.0" y="290.0" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">Same answers to all</text><line x1="463.0" y1="277.0" x2="481.0" y2="277.0" stroke="#1f2937" stroke-width="2" marker-end="url(#ah0)"/><rect x="482.0" y="212.0" width="146.0" height="130.0" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/><text x="492.0" y="236.0" font-size="11.8" font-weight="bold" fill="#14532d" text-anchor="start">Proposals or quotes</text><text x="492.0" y="290.0" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">Responses by the due</text><text x="492.0" y="303.2" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">date</text><line x1="629.0" y1="277.0" x2="647.0" y2="277.0" stroke="#1f2937" stroke-width="2" marker-end="url(#ah0)"/><rect x="648.0" y="212.0" width="146.0" height="130.0" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/><text x="658.0" y="236.0" font-size="11.8" font-weight="bold" fill="#14532d" text-anchor="start">Evaluate and select</text><text x="658.0" y="290.0" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">Published, weighted</text><text x="658.0" y="303.2" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">criteria</text><line x1="795.0" y1="277.0" x2="813.0" y2="277.0" stroke="#1f2937" stroke-width="2" marker-end="url(#ah0)"/><rect x="814.0" y="212.0" width="146.0" height="130.0" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/><text x="824.0" y="236.0" font-size="11.8" font-weight="bold" fill="#14532d" text-anchor="start">Negotiate and award</text><text x="824.0" y="290.0" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">Signed agreement</text><rect x="20.0" y="358.0" width="120.0" height="130.0" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="80.0" y="388.0" font-size="12" font-weight="bold" fill="#78350f" text-anchor="middle">ADMINISTER AND</text><text x="80.0" y="402.4" font-size="12" font-weight="bold" fill="#78350f" text-anchor="middle">CLOSE</text><text x="80.0" y="424.0" font-size="9.8" font-weight="normal" fill="#1f2937" text-anchor="middle">Monitor and control the</text><text x="80.0" y="435.8" font-size="9.8" font-weight="normal" fill="#1f2937" text-anchor="middle">agreement; close</text><rect x="150.0" y="358.0" width="187.5" height="130.0" rx="8" fill="#ffffff" stroke="#d97706" stroke-width="1.5"/><text x="160.0" y="382.0" font-size="11.8" font-weight="bold" fill="#78350f" text-anchor="start">Monitor performance</text><text x="160.0" y="436.0" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">Metrics, inspections, audits</text><line x1="338.5" y1="423.0" x2="356.5" y2="423.0" stroke="#1f2937" stroke-width="2" marker-end="url(#ah0)"/><rect x="357.5" y="358.0" width="187.5" height="130.0" rx="8" fill="#ffffff" stroke="#d97706" stroke-width="1.5"/><text x="367.5" y="382.0" font-size="11.8" font-weight="bold" fill="#78350f" text-anchor="start">Control changes and</text><text x="367.5" y="396.2" font-size="11.8" font-weight="bold" fill="#78350f" text-anchor="start">payments</text><text x="367.5" y="436.0" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">Formal change control</text><line x1="546.0" y1="423.0" x2="564.0" y2="423.0" stroke="#1f2937" stroke-width="2" marker-end="url(#ah0)"/><rect x="565.0" y="358.0" width="187.5" height="130.0" rx="8" fill="#ffffff" stroke="#d97706" stroke-width="1.5"/><text x="575.0" y="382.0" font-size="11.8" font-weight="bold" fill="#78350f" text-anchor="start">Claims and disputes</text><text x="575.0" y="436.0" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">Negotiation first, then ADR</text><line x1="753.5" y1="423.0" x2="771.5" y2="423.0" stroke="#1f2937" stroke-width="2" marker-end="url(#ah0)"/><rect x="772.5" y="358.0" width="187.5" height="130.0" rx="8" fill="#ffffff" stroke="#d97706" stroke-width="1.5"/><text x="782.5" y="382.0" font-size="11.8" font-weight="bold" fill="#78350f" text-anchor="start">Close contracts</text><text x="782.5" y="436.0" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">All contracts before the project</text><text x="20.0" y="508.0" font-size="10.8" font-weight="normal" fill="#6b7280" text-anchor="start">Authority: the buyer's procurement staff with authority to sign contracts lead negotiations; the project manager and team support, and often run the day-to-day administration.</text></svg>