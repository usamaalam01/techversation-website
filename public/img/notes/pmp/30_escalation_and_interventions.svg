<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 580" width="980" height="580" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">Escalation ladder and intervention choices</title><desc id="d">Escalation climbs from the project team to the project manager or scrum master, then the sponsor and functional managers, then the governance board or steering committee, then executives or formal dispute procedures. Escalate when beyond authority, when the cause sits outside the project, when the item persists or is severe and time critical, or when compliance is threatened. Bring facts, impact, what was tried, options, a recommendation and the decision needed.</desc><defs><marker id="ah0" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker></defs><rect x="0.75" y="0.75" width="978.5" height="578.5" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><text x="20.0" y="28.0" font-size="18" font-weight="bold" fill="#1f2937" text-anchor="start">Intervene at the lowest level that has the authority</text><text x="20.0" y="48.0" font-size="12" font-weight="normal" fill="#6b7280" text-anchor="start">Try, analyze, then escalate with options; define the path with the sponsor if none exists</text><rect x="20.0" y="66.0" width="440.0" height="72.0" rx="10" fill="#1e3a8a" stroke="#1e3a8a" stroke-width="1.8"/><text x="32.0" y="90.0" font-size="12.5" font-weight="bold" fill="#ffffff" text-anchor="start">5  Executives and formal procedures</text><text x="32.0" y="107.0" font-size="11" font-weight="normal" fill="#ffffff" text-anchor="start">Organization-level decisions; contract disputes follow the agreed dispute steps</text><rect x="20.0" y="156.0" width="440.0" height="72.0" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.8"/><text x="32.0" y="180.0" font-size="12.5" font-weight="bold" fill="#4c1d95" text-anchor="start">4  Governance board, steering committee, CCB</text><text x="32.0" y="197.0" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="start">Funding, scope, contracts and cross-project priorities beyond lower authority</text><rect x="20.0" y="246.0" width="440.0" height="72.0" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.8"/><text x="32.0" y="270.0" font-size="12.5" font-weight="bold" fill="#78350f" text-anchor="start">3  Sponsor, functional managers, PMO</text><text x="32.0" y="287.0" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="start">Resources, priorities, policy and decisions outside the project manager's authority</text><rect x="20.0" y="336.0" width="440.0" height="72.0" rx="10" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.8"/><text x="32.0" y="360.0" font-size="12.5" font-weight="bold" fill="#134e4a" text-anchor="start">2  Project manager / scrum master</text><text x="32.0" y="377.0" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="start">Clears what the team cannot: works with outside groups, negotiates, re-plans,</text><text x="32.0" y="390.4" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="start">facilitates</text><rect x="20.0" y="426.0" width="440.0" height="72.0" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.8"/><text x="32.0" y="450.0" font-size="12.5" font-weight="bold" fill="#14532d" text-anchor="start">1  Project team</text><text x="32.0" y="467.0" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="start">Solves what it can within its skills and authority and raises the rest at once</text><line x1="240.0" y1="155.0" x2="240.0" y2="139.0" stroke="#1f2937" stroke-width="2.2" marker-end="url(#ah0)"/><line x1="240.0" y1="245.0" x2="240.0" y2="229.0" stroke="#1f2937" stroke-width="2.2" marker-end="url(#ah0)"/><line x1="240.0" y1="335.0" x2="240.0" y2="319.0" stroke="#1f2937" stroke-width="2.2" marker-end="url(#ah0)"/><line x1="240.0" y1="425.0" x2="240.0" y2="409.0" stroke="#1f2937" stroke-width="2.2" marker-end="url(#ah0)"/><text x="252.0" y="152.0" font-size="10.5" font-weight="bold" fill="#6b7280" text-anchor="start">unresolved, or beyond that level's authority</text><rect x="490.0" y="66.0" width="470.0" height="138.0" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="1.6"/><text x="502.0" y="88.0" font-size="12.5" font-weight="bold" fill="#7f1d1d" text-anchor="start">Escalate when</text><text x="502.0" y="108.0" font-size="10.8" font-weight="bold" fill="#6b7280" text-anchor="start">•</text><text x="514.0" y="108.0" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">The decision, money, resource or policy is beyond your authority</text><text x="502.0" y="125.2" font-size="10.8" font-weight="bold" fill="#6b7280" text-anchor="start">•</text><text x="514.0" y="125.2" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">The cause sits outside the project (another department, a vendor's management)</text><text x="502.0" y="142.4" font-size="10.8" font-weight="bold" fill="#6b7280" text-anchor="start">•</text><text x="514.0" y="142.4" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">It persists after reasonable attempts, or the impact is severe and time-critical</text><text x="502.0" y="159.5" font-size="10.8" font-weight="bold" fill="#6b7280" text-anchor="start">•</text><text x="514.0" y="159.5" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">A compliance, safety or ethical threat is involved</text><text x="502.0" y="176.7" font-size="10.8" font-weight="bold" fill="#6b7280" text-anchor="start">•</text><text x="514.0" y="176.7" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">No path exists: define it with the sponsor first, do not guess</text><rect x="490.0" y="216.0" width="470.0" height="122.0" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="502.0" y="238.0" font-size="12.5" font-weight="bold" fill="#1e3a8a" text-anchor="start">How to escalate</text><text x="502.0" y="258.0" font-size="10.8" font-weight="bold" fill="#6b7280" text-anchor="start">•</text><text x="514.0" y="258.0" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">Use the defined path and thresholds (governance, communications management plan)</text><text x="502.0" y="275.2" font-size="10.8" font-weight="bold" fill="#6b7280" text-anchor="start">•</text><text x="514.0" y="275.2" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">Bring the facts: what happened, the impact, what was tried, options, your</text><text x="514.0" y="288.4" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">recommendation, the decision needed and by when</text><text x="502.0" y="305.5" font-size="10.8" font-weight="bold" fill="#6b7280" text-anchor="start">•</text><text x="514.0" y="305.5" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">Agree who owns it after the hand-off; keep working the parts you can</text><rect x="490.0" y="350.0" width="470.0" height="148.0" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.6"/><text x="502.0" y="372.0" font-size="12.5" font-weight="bold" fill="#4c1d95" text-anchor="start">Intervention strategies</text><rect x="502.0" y="384.0" width="108.5" height="20.5" rx="10.25" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/><text x="556.3" y="396.0" font-size="10.5" font-weight="bold" fill="#14532d" text-anchor="middle">Remove the cause</text><rect x="617.5" y="384.0" width="157.2" height="20.5" rx="10.25" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/><text x="696.1" y="396.0" font-size="10.5" font-weight="bold" fill="#1e3a8a" text-anchor="middle">Work with the owning group</text><rect x="781.7" y="384.0" width="126.5" height="20.5" rx="10.25" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.2"/><text x="845.0" y="396.0" font-size="10.5" font-weight="bold" fill="#134e4a" text-anchor="middle">Negotiate or influence</text><rect x="502.0" y="413.0" width="133.0" height="20.5" rx="10.25" fill="#fef3c7" stroke="#d97706" stroke-width="1.2"/><text x="568.5" y="425.0" font-size="10.5" font-weight="bold" fill="#78350f" text-anchor="middle">Re-plan or re-sequence</text><rect x="642.0" y="413.0" width="95.5" height="20.5" rx="10.25" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.2"/><text x="689.7" y="425.0" font-size="10.5" font-weight="bold" fill="#4c1d95" text-anchor="middle">Change request</text><rect x="744.5" y="413.0" width="137.6" height="20.5" rx="10.25" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.2"/><text x="813.2" y="425.0" font-size="10.5" font-weight="bold" fill="#374151" text-anchor="middle">Temporary workaround*</text><rect x="502.0" y="442.0" width="106.6" height="20.5" rx="10.25" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.2"/><text x="555.3" y="454.0" font-size="10.5" font-weight="bold" fill="#374151" text-anchor="middle">Accept and adjust</text><text x="502.0" y="486.0" font-size="10" font-weight="normal" fill="#6b7280" text-anchor="start">* a workaround buys time; it does not replace removing the cause</text><rect x="20.0" y="514.0" width="940.0" height="50.8" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/><text x="32.0" y="534.0" font-size="11" font-weight="bold" fill="#78350f" text-anchor="start">Principle: act at the lowest level that has the authority, analyze before you escalate, and bring solutions as well as problems. Never sit on a blocked item, never hide it from</text><text x="32.0" y="547.4" font-size="11" font-weight="bold" fill="#78350f" text-anchor="start">the sponsor, and never escalate without facts and options.</text></svg>