<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 530" width="980" height="530" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">Requirement types and traceability</title><desc id="d">Business, stakeholder, solution (functional and nonfunctional), transition and readiness, project and quality requirements. A requirements traceability matrix links each requirement from its origin to the deliverable, test and acceptance that satisfy it.</desc><defs><marker id="ah0" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker></defs><rect x="0.75" y="0.75" width="978.5" height="528.5" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><text x="20.0" y="28.0" font-size="18" font-weight="bold" fill="#1f2937" text-anchor="start">Requirement types and traceability</text><text x="20.0" y="48.0" font-size="12" font-weight="normal" fill="#6b7280" text-anchor="start">PMBOK 8 classifications, and the chain the requirements traceability matrix (RTM) keeps intact</text><rect x="20.0" y="64.0" width="300.0" height="100.0" rx="8" fill="#1e3a8a" stroke="#1e3a8a" stroke-width="1.6"/><text x="170.0" y="103.1" font-size="11.8" font-weight="bold" fill="#ffffff" text-anchor="middle">Business requirements</text><text x="170.0" y="117.8" font-size="11.8" font-weight="normal" fill="#ffffff" text-anchor="middle">Strategic objectives and high-level needs of the</text><text x="170.0" y="132.6" font-size="11.8" font-weight="normal" fill="#ffffff" text-anchor="middle">organization; keep the project aligned with strategy</text><rect x="340.0" y="64.0" width="300.0" height="100.0" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="490.0" y="103.1" font-size="11.8" font-weight="bold" fill="#1e3a8a" text-anchor="middle">Stakeholder requirements</text><text x="490.0" y="117.8" font-size="11.8" font-weight="normal" fill="#1e3a8a" text-anchor="middle">Needs of a stakeholder or stakeholder group (users,</text><text x="490.0" y="132.6" font-size="11.8" font-weight="normal" fill="#1e3a8a" text-anchor="middle">sponsor, regulators, operations)</text><rect x="660.0" y="64.0" width="300.0" height="160.0" rx="8" fill="#ecfdf5" stroke="#16a34a" stroke-width="1.6"/><text x="672.0" y="84.0" font-size="12.5" font-weight="bold" fill="#14532d" text-anchor="start">Solution requirements</text><text x="672.0" y="99.0" font-size="10.8" font-weight="normal" fill="#14532d" text-anchor="start">Features, functions and characteristics of the product</text><rect x="670.0" y="110.0" width="135.0" height="104.0" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="737.5" y="145.3" font-size="10.8" font-weight="bold" fill="#14532d" text-anchor="middle">Functional</text><text x="737.5" y="158.8" font-size="10.8" font-weight="normal" fill="#14532d" text-anchor="middle">Behaviors: actions,</text><text x="737.5" y="172.3" font-size="10.8" font-weight="normal" fill="#14532d" text-anchor="middle">processes, data,</text><text x="737.5" y="185.8" font-size="10.8" font-weight="normal" fill="#14532d" text-anchor="middle">interactions</text><rect x="815.0" y="110.0" width="135.0" height="104.0" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="882.5" y="145.3" font-size="10.8" font-weight="bold" fill="#14532d" text-anchor="middle">Nonfunctional</text><text x="882.5" y="158.8" font-size="10.8" font-weight="normal" fill="#14532d" text-anchor="middle">Performance, security,</text><text x="882.5" y="172.3" font-size="10.8" font-weight="normal" fill="#14532d" text-anchor="middle">reliability, safety, level of</text><text x="882.5" y="185.8" font-size="10.8" font-weight="normal" fill="#14532d" text-anchor="middle">service, supportability</text><rect x="20.0" y="174.0" width="300.0" height="50.0" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="170.0" y="195.7" font-size="11" font-weight="bold" fill="#78350f" text-anchor="middle">Transition and readiness</text><text x="170.0" y="209.4" font-size="11" font-weight="normal" fill="#78350f" text-anchor="middle">Temporary capabilities: data conversion, training</text><rect x="340.0" y="174.0" width="300.0" height="50.0" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.6"/><text x="490.0" y="195.7" font-size="11" font-weight="bold" fill="#374151" text-anchor="middle">Project requirements</text><text x="490.0" y="209.4" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">Milestone dates, contractual obligations, constraints</text><rect x="660.0" y="234.0" width="300.0" height="40.0" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.6"/><text x="810.0" y="250.7" font-size="11" font-weight="bold" fill="#4c1d95" text-anchor="middle">Quality requirements</text><text x="810.0" y="264.4" font-size="11" font-weight="normal" fill="#4c1d95" text-anchor="middle">Tests, certifications, validations</text><rect x="20.0" y="234.0" width="620.0" height="40.0" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.6"/><text x="330.0" y="250.7" font-size="11" font-weight="bold" fill="#374151" text-anchor="middle">Good requirements (before baselining): unambiguous (measurable, testable) · traceable · complete · consistent ·</text><text x="330.0" y="264.4" font-size="11" font-weight="bold" fill="#374151" text-anchor="middle">acceptable to key stakeholders</text><text x="20.0" y="308.0" font-size="13" font-weight="bold" fill="#1f2937" text-anchor="start">Traceability: every approved requirement is followed from its origin to its acceptance</text><rect x="20.0" y="322.0" width="140.0" height="66.0" rx="8" fill="#1e3a8a" stroke="#1e3a8a" stroke-width="1.6"/><text x="90.0" y="351.6" font-size="11.5" font-weight="bold" fill="#ffffff" text-anchor="middle">Business need or</text><text x="90.0" y="365.9" font-size="11.5" font-weight="bold" fill="#ffffff" text-anchor="middle">objective</text><line x1="161.0" y1="355.0" x2="179.0" y2="355.0" stroke="#1f2937" stroke-width="2" marker-end="url(#ah0)"/><rect x="180.0" y="322.0" width="140.0" height="66.0" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="250.0" y="344.4" font-size="11.5" font-weight="bold" fill="#1e3a8a" text-anchor="middle">Requirement (ID,</text><text x="250.0" y="358.7" font-size="11.5" font-weight="bold" fill="#1e3a8a" text-anchor="middle">source, priority,</text><text x="250.0" y="373.1" font-size="11.5" font-weight="bold" fill="#1e3a8a" text-anchor="middle">owner)</text><line x1="321.0" y1="355.0" x2="339.0" y2="355.0" stroke="#1f2937" stroke-width="2" marker-end="url(#ah0)"/><rect x="340.0" y="322.0" width="140.0" height="66.0" rx="8" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.6"/><text x="410.0" y="351.6" font-size="11.5" font-weight="bold" fill="#134e4a" text-anchor="middle">WBS deliverable or</text><text x="410.0" y="365.9" font-size="11.5" font-weight="bold" fill="#134e4a" text-anchor="middle">backlog item</text><line x1="481.0" y1="355.0" x2="499.0" y2="355.0" stroke="#1f2937" stroke-width="2" marker-end="url(#ah0)"/><rect x="500.0" y="322.0" width="140.0" height="66.0" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="570.0" y="358.7" font-size="11.5" font-weight="bold" fill="#14532d" text-anchor="middle">Design and build</text><line x1="641.0" y1="355.0" x2="659.0" y2="355.0" stroke="#1f2937" stroke-width="2" marker-end="url(#ah0)"/><rect x="660.0" y="322.0" width="140.0" height="66.0" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="730.0" y="351.6" font-size="11.5" font-weight="bold" fill="#78350f" text-anchor="middle">Test case and</text><text x="730.0" y="365.9" font-size="11.5" font-weight="bold" fill="#78350f" text-anchor="middle">acceptance criteria</text><line x1="801.0" y1="355.0" x2="819.0" y2="355.0" stroke="#1f2937" stroke-width="2" marker-end="url(#ah0)"/><rect x="820.0" y="322.0" width="140.0" height="66.0" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.6"/><text x="890.0" y="358.7" font-size="11.5" font-weight="bold" fill="#4c1d95" text-anchor="middle">Accepted deliverable</text><rect x="20.0" y="404.0" width="940.0" height="112.0" rx="8" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.2"/><text x="32.0" y="424.0" font-size="11.5" font-weight="bold" fill="#6b7280" text-anchor="start">•</text><text x="44.0" y="424.0" font-size="11.3" font-weight="normal" fill="#1f2937" text-anchor="start">RTM: a grid that links product requirements from origin to the deliverables that satisfy them; typical attributes are ID, source, priority, owner, status and acceptance criteria.</text><text x="32.0" y="441.8" font-size="11.5" font-weight="bold" fill="#6b7280" text-anchor="start">•</text><text x="44.0" y="441.8" font-size="11.3" font-weight="normal" fill="#1f2937" text-anchor="start">Purpose: ensure every approved requirement is delivered, that each adds business value (it links to a business or project objective), and to give a structure for managing changes</text><text x="44.0" y="455.6" font-size="11.3" font-weight="normal" fill="#1f2937" text-anchor="start">to product scope.</text><text x="32.0" y="473.4" font-size="11.5" font-weight="bold" fill="#6b7280" text-anchor="start">•</text><text x="44.0" y="473.4" font-size="11.3" font-weight="normal" fill="#1f2937" text-anchor="start">A requirement without a source is a candidate for removal (possible gold plating); a deliverable that traces to no requirement is out of scope until a change is approved.</text><text x="32.0" y="491.1" font-size="11.5" font-weight="bold" fill="#6b7280" text-anchor="start">•</text><text x="44.0" y="491.1" font-size="11.3" font-weight="normal" fill="#1f2937" text-anchor="start">Adaptive: user stories with acceptance criteria and a definition of done play the same role; the product owner keeps the backlog aligned with the vision and business value.</text></svg>