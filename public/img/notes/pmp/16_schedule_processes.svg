<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 486" width="980" height="486" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">Schedule performance domain: three processes and four development steps</title><desc id="d">Plan Schedule Management, then Develop Schedule in four steps (define activities, determine sequence, estimate effort and duration, adjust), then Monitor and Control Schedule, with predictive and adaptive differences.</desc><defs><marker id="ah0" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker><marker id="ah1" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker></defs><rect x="0.75" y="0.75" width="978.5" height="484.5" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><text x="20.0" y="28.0" font-size="18" font-weight="bold" fill="#1f2937" text-anchor="start">Schedule domain: three processes</text><text x="20.0" y="48.0" font-size="12" font-weight="normal" fill="#6b7280" text-anchor="start">PMBOK 8 Figures 2-20 and 2-23: plan, develop in four steps, then monitor and control</text><rect x="20.0" y="64.0" width="270.0" height="40.0" rx="8" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.6"/><text x="155.0" y="88.2" font-size="13" font-weight="bold" fill="#134e4a" text-anchor="middle">Plan Schedule Management</text><rect x="310.0" y="64.0" width="360.0" height="40.0" rx="8" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.6"/><text x="490.0" y="88.2" font-size="13" font-weight="bold" fill="#134e4a" text-anchor="middle">Develop Schedule</text><rect x="690.0" y="64.0" width="270.0" height="40.0" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="825.0" y="88.2" font-size="13" font-weight="bold" fill="#78350f" text-anchor="middle">Monitor and Control Schedule</text><line x1="291.0" y1="84.0" x2="309.0" y2="84.0" stroke="#1f2937" stroke-width="2" marker-end="url(#ah0)"/><line x1="671.0" y1="84.0" x2="689.0" y2="84.0" stroke="#1f2937" stroke-width="2" marker-end="url(#ah0)"/><rect x="20.0" y="116.0" width="270.0" height="358.0" rx="8" fill="#ffffff" stroke="#0d9488" stroke-width="1.5"/><text x="32.0" y="137.0" font-size="12" font-weight="bold" fill="#134e4a" text-anchor="start">The schedule management plan sets</text><text x="32.0" y="158.0" font-size="11.3" font-weight="bold" fill="#6b7280" text-anchor="start">•</text><text x="44.0" y="158.0" font-size="11.3" font-weight="normal" fill="#1f2937" text-anchor="start">Scheduling method and tool</text><text x="32.0" y="178.8" font-size="11.3" font-weight="bold" fill="#6b7280" text-anchor="start">•</text><text x="44.0" y="178.8" font-size="11.3" font-weight="normal" fill="#1f2937" text-anchor="start">Release and iteration length (timeboxes,</text><text x="44.0" y="192.6" font-size="11.3" font-weight="normal" fill="#1f2937" text-anchor="start">adaptive)</text><text x="32.0" y="213.4" font-size="11.3" font-weight="bold" fill="#6b7280" text-anchor="start">•</text><text x="44.0" y="213.4" font-size="11.3" font-weight="normal" fill="#1f2937" text-anchor="start">Level of accuracy and contingencies</text><text x="32.0" y="234.1" font-size="11.3" font-weight="bold" fill="#6b7280" text-anchor="start">•</text><text x="44.0" y="234.1" font-size="11.3" font-weight="normal" fill="#1f2937" text-anchor="start">Units of measure</text><text x="32.0" y="254.9" font-size="11.3" font-weight="bold" fill="#6b7280" text-anchor="start">•</text><text x="44.0" y="254.9" font-size="11.3" font-weight="normal" fill="#1f2937" text-anchor="start">Link to the WBS and organizational</text><text x="44.0" y="268.7" font-size="11.3" font-weight="normal" fill="#1f2937" text-anchor="start">procedures</text><text x="32.0" y="289.5" font-size="11.3" font-weight="bold" fill="#6b7280" text-anchor="start">•</text><text x="44.0" y="289.5" font-size="11.3" font-weight="normal" fill="#1f2937" text-anchor="start">How the schedule model is maintained</text><text x="32.0" y="310.3" font-size="11.3" font-weight="bold" fill="#6b7280" text-anchor="start">•</text><text x="44.0" y="310.3" font-size="11.3" font-weight="normal" fill="#1f2937" text-anchor="start">Control thresholds (allowed variance)</text><text x="32.0" y="331.1" font-size="11.3" font-weight="bold" fill="#6b7280" text-anchor="start">•</text><text x="44.0" y="331.1" font-size="11.3" font-weight="normal" fill="#1f2937" text-anchor="start">Performance measurement rules (EVM,</text><text x="44.0" y="344.9" font-size="11.3" font-weight="normal" fill="#1f2937" text-anchor="start">percent complete)</text><text x="32.0" y="365.6" font-size="11.3" font-weight="bold" fill="#6b7280" text-anchor="start">•</text><text x="44.0" y="365.6" font-size="11.3" font-weight="normal" fill="#1f2937" text-anchor="start">Reporting formats and frequency</text><rect x="310.0" y="116.0" width="330.0" height="68.0" rx="8" fill="#f0fdfa" stroke="#0d9488" stroke-width="1.5"/><text x="322.0" y="136.0" font-size="12.5" font-weight="bold" fill="#134e4a" text-anchor="start">1  Define activities</text><text x="322.0" y="152.0" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="start">Break work packages into schedule activities; activity list,</text><text x="322.0" y="165.2" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="start">attributes, milestones</text><line x1="475.0" y1="184.0" x2="475.0" y2="196.0" stroke="#1f2937" stroke-width="1.8" marker-end="url(#ah0)"/><rect x="310.0" y="196.0" width="330.0" height="68.0" rx="8" fill="#f0fdfa" stroke="#0d9488" stroke-width="1.5"/><text x="322.0" y="216.0" font-size="12.5" font-weight="bold" fill="#134e4a" text-anchor="start">2  Determine sequence</text><text x="322.0" y="232.0" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="start">Logical relationships (FS, SS, FF, SF), leads and lags; every</text><text x="322.0" y="245.2" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="start">activity except the first and last has a predecessor and a</text><text x="322.0" y="258.4" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="start">successor</text><line x1="475.0" y1="264.0" x2="475.0" y2="276.0" stroke="#1f2937" stroke-width="1.8" marker-end="url(#ah0)"/><rect x="310.0" y="276.0" width="330.0" height="68.0" rx="8" fill="#f0fdfa" stroke="#0d9488" stroke-width="1.5"/><text x="322.0" y="296.0" font-size="12.5" font-weight="bold" fill="#134e4a" text-anchor="start">3  Estimate effort and duration</text><text x="322.0" y="312.0" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="start">Work periods needed with the estimated resources and</text><text x="322.0" y="325.2" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="start">calendars; estimates from the people who know the work</text><line x1="475.0" y1="344.0" x2="475.0" y2="356.0" stroke="#1f2937" stroke-width="1.8" marker-end="url(#ah0)"/><rect x="310.0" y="356.0" width="330.0" height="68.0" rx="8" fill="#f0fdfa" stroke="#0d9488" stroke-width="1.5"/><text x="322.0" y="376.0" font-size="12.5" font-weight="bold" fill="#134e4a" text-anchor="start">4  Adjust</text><text x="322.0" y="392.0" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="start">Review the draft: compression, resource optimization,</text><text x="322.0" y="405.2" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="start">reserves; team confirms dates against calendars and other</text><text x="322.0" y="418.4" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="start">work</text><polyline points="640.0,390.0 656.0,390.0 656.0,230.0 641.0,230.0" fill="none" stroke="#7c3aed" stroke-width="1.8" stroke-dasharray="5 3" marker-end="url(#ah1)" stroke-linejoin="round"/><text x="670" y="316.0" font-size="10.5" fill="#4c1d95" text-anchor="middle" transform="rotate(-90 670 316.0)">repeat until acceptable</text><rect x="310.0" y="436.0" width="330.0" height="38.0" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.6"/><text x="475.0" y="451.8" font-size="10.8" font-weight="normal" fill="#374151" text-anchor="middle">Outputs: schedule baseline, project schedule, schedule data,</text><text x="475.0" y="465.3" font-size="10.8" font-weight="normal" fill="#374151" text-anchor="middle">calendars, change requests</text><rect x="690.0" y="116.0" width="270.0" height="166.0" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="701.0" y="174.6" font-size="11.2" font-weight="bold" fill="#1e3a8a" text-anchor="start">Predictive</text><text x="701.0" y="188.6" font-size="11.2" font-weight="normal" fill="#1e3a8a" text-anchor="start">Compare actual with the baseline (variance,</text><text x="701.0" y="202.6" font-size="11.2" font-weight="normal" fill="#1e3a8a" text-anchor="start">trend, earned value). Baseline changes only</text><text x="701.0" y="216.6" font-size="11.2" font-weight="normal" fill="#1e3a8a" text-anchor="start">through Assess and Implement Changes.</text><text x="701.0" y="230.6" font-size="11.2" font-weight="normal" fill="#1e3a8a" text-anchor="start">Reconsider reserves and update forecasts.</text><rect x="690.0" y="294.0" width="270.0" height="180.0" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="701.0" y="359.6" font-size="11.2" font-weight="bold" fill="#14532d" text-anchor="start">Adaptive</text><text x="701.0" y="373.6" font-size="11.2" font-weight="normal" fill="#14532d" text-anchor="start">Compare work delivered and accepted with</text><text x="701.0" y="387.6" font-size="11.2" font-weight="normal" fill="#14532d" text-anchor="start">estimates; track velocity and burn charts; run</text><text x="701.0" y="401.6" font-size="11.2" font-weight="normal" fill="#14532d" text-anchor="start">retrospectives; reprioritize the backlog; replan</text><text x="701.0" y="415.6" font-size="11.2" font-weight="normal" fill="#14532d" text-anchor="start">each iteration or release.</text></svg>