<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 628" width="980" height="628" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">Assess the organization's culture, then tailor to it</title><desc id="d">Six cultural dials: functional or hierarchical structure against network or flat structure; managing and directing against self-managed teams; risk-averse and fixed against uncertainty-tolerant; formal channels against open informal channels; specify-and-check against empower and trust local decisions; low trust or buy-in against high trust and buy-in. Left poles lean predictive, right poles lean adaptive. The results guide approach, governance, communication, engagement, team norms and change activities.</desc><defs></defs><rect x="0.75" y="0.75" width="978.5" height="626.5" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><text x="20.0" y="28.0" font-size="18" font-weight="bold" fill="#1f2937" text-anchor="start">Assess the culture, then tailor to it</text><text x="20.0" y="48.0" font-size="12" font-weight="normal" fill="#6b7280" text-anchor="start">Where the dials sit decides the approach, the governance, the communication style and how you engage people</text><text x="122.0" y="74.0" font-size="11.5" font-weight="bold" fill="#1e3a8a" text-anchor="middle">Leans predictive</text><text x="540.0" y="74.0" font-size="11.5" font-weight="bold" fill="#14532d" text-anchor="middle">Leans adaptive</text><rect x="22.0" y="86.0" width="618.0" height="64.0" rx="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.2"/><text x="32.0" y="115.5" font-size="10.8" font-weight="normal" fill="#1e3a8a" text-anchor="start">Functional, hierarchical structure;</text><text x="32.0" y="128.5" font-size="10.8" font-weight="normal" fill="#1e3a8a" text-anchor="start">preferred lines of authority</text><text x="440.0" y="122.0" font-size="10.8" font-weight="normal" fill="#14532d" text-anchor="start">Network-oriented, flat structure</text><line x1="238.0" y1="118.0" x2="428.0" y2="118.0" stroke="#d1d5db" stroke-width="3"/><circle cx="238.0" cy="118.0" r="7" fill="#2563eb" stroke="#1e3a8a" stroke-width="1.5"/><circle cx="428.0" cy="118.0" r="7" fill="#16a34a" stroke="#14532d" stroke-width="1.5"/><circle cx="333.0" cy="118.0" r="8" fill="#ffffff" stroke="#1f2937" stroke-width="2"/><rect x="22.0" y="158.0" width="618.0" height="64.0" rx="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.2"/><text x="32.0" y="187.5" font-size="10.8" font-weight="normal" fill="#1e3a8a" text-anchor="start">Managing and directing; progress</text><text x="32.0" y="200.5" font-size="10.8" font-weight="normal" fill="#1e3a8a" text-anchor="start">measured against baselines</text><text x="440.0" y="187.5" font-size="10.8" font-weight="normal" fill="#14532d" text-anchor="start">Self-managed teams, flexible thinking,</text><text x="440.0" y="200.5" font-size="10.8" font-weight="normal" fill="#14532d" text-anchor="start">innovation</text><line x1="238.0" y1="190.0" x2="428.0" y2="190.0" stroke="#d1d5db" stroke-width="3"/><circle cx="238.0" cy="190.0" r="7" fill="#2563eb" stroke="#1e3a8a" stroke-width="1.5"/><circle cx="428.0" cy="190.0" r="7" fill="#16a34a" stroke="#14532d" stroke-width="1.5"/><circle cx="333.0" cy="190.0" r="8" fill="#ffffff" stroke="#1f2937" stroke-width="2"/><rect x="22.0" y="230.0" width="618.0" height="64.0" rx="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.2"/><text x="32.0" y="259.5" font-size="10.8" font-weight="normal" fill="#1e3a8a" text-anchor="start">Risk-averse; prefers detailed, fixed</text><text x="32.0" y="272.5" font-size="10.8" font-weight="normal" fill="#1e3a8a" text-anchor="start">schedules</text><text x="440.0" y="259.5" font-size="10.8" font-weight="normal" fill="#14532d" text-anchor="start">Embraces uncertainty; tolerates fluid</text><text x="440.0" y="272.5" font-size="10.8" font-weight="normal" fill="#14532d" text-anchor="start">schedules</text><line x1="238.0" y1="262.0" x2="428.0" y2="262.0" stroke="#d1d5db" stroke-width="3"/><circle cx="238.0" cy="262.0" r="7" fill="#2563eb" stroke="#1e3a8a" stroke-width="1.5"/><circle cx="428.0" cy="262.0" r="7" fill="#16a34a" stroke="#14532d" stroke-width="1.5"/><circle cx="333.0" cy="262.0" r="8" fill="#ffffff" stroke="#1f2937" stroke-width="2"/><rect x="22.0" y="302.0" width="618.0" height="64.0" rx="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.2"/><text x="32.0" y="338.0" font-size="10.8" font-weight="normal" fill="#1e3a8a" text-anchor="start">Formal communication channels</text><text x="440.0" y="338.0" font-size="10.8" font-weight="normal" fill="#14532d" text-anchor="start">Open, informal channels</text><line x1="238.0" y1="334.0" x2="428.0" y2="334.0" stroke="#d1d5db" stroke-width="3"/><circle cx="238.0" cy="334.0" r="7" fill="#2563eb" stroke="#1e3a8a" stroke-width="1.5"/><circle cx="428.0" cy="334.0" r="7" fill="#16a34a" stroke="#14532d" stroke-width="1.5"/><circle cx="333.0" cy="334.0" r="8" fill="#ffffff" stroke="#1f2937" stroke-width="2"/><rect x="22.0" y="374.0" width="618.0" height="64.0" rx="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.2"/><text x="32.0" y="403.5" font-size="10.8" font-weight="normal" fill="#1e3a8a" text-anchor="start">Specify and check; external</text><text x="32.0" y="416.5" font-size="10.8" font-weight="normal" fill="#1e3a8a" text-anchor="start">decision-making</text><text x="440.0" y="403.5" font-size="10.8" font-weight="normal" fill="#14532d" text-anchor="start">Empower the team; trust local</text><text x="440.0" y="416.5" font-size="10.8" font-weight="normal" fill="#14532d" text-anchor="start">decisions</text><line x1="238.0" y1="406.0" x2="428.0" y2="406.0" stroke="#d1d5db" stroke-width="3"/><circle cx="238.0" cy="406.0" r="7" fill="#2563eb" stroke="#1e3a8a" stroke-width="1.5"/><circle cx="428.0" cy="406.0" r="7" fill="#16a34a" stroke="#14532d" stroke-width="1.5"/><circle cx="333.0" cy="406.0" r="8" fill="#ffffff" stroke="#1f2937" stroke-width="2"/><rect x="22.0" y="446.0" width="618.0" height="64.0" rx="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.2"/><text x="32.0" y="475.5" font-size="10.8" font-weight="normal" fill="#1e3a8a" text-anchor="start">Low buy-in or trust in the proposed</text><text x="32.0" y="488.5" font-size="10.8" font-weight="normal" fill="#1e3a8a" text-anchor="start">approach</text><text x="440.0" y="475.5" font-size="10.8" font-weight="normal" fill="#14532d" text-anchor="start">High buy-in and trust that the team will</text><text x="440.0" y="488.5" font-size="10.8" font-weight="normal" fill="#14532d" text-anchor="start">deliver</text><line x1="238.0" y1="478.0" x2="428.0" y2="478.0" stroke="#d1d5db" stroke-width="3"/><circle cx="238.0" cy="478.0" r="7" fill="#2563eb" stroke="#1e3a8a" stroke-width="1.5"/><circle cx="428.0" cy="478.0" r="7" fill="#16a34a" stroke="#14532d" stroke-width="1.5"/><circle cx="333.0" cy="478.0" r="8" fill="#ffffff" stroke="#1f2937" stroke-width="2"/><text x="333.0" y="524.0" font-size="10.5" font-weight="normal" fill="#6b7280" text-anchor="middle">Place the organization on each dial (observe, ask, check past projects)</text><rect x="660.0" y="70.0" width="298.0" height="156.0" rx="10" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.6"/><text x="672.0" y="92.0" font-size="12.5" font-weight="bold" fill="#134e4a" text-anchor="start">How to assess</text><text x="672.0" y="112.0" font-size="10.8" font-weight="bold" fill="#6b7280" text-anchor="start">•</text><text x="684.0" y="112.0" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">Review EEFs: vision, values, norms, leadership styles,</text><text x="684.0" y="125.2" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">hierarchy, ethics</text><text x="672.0" y="142.4" font-size="10.8" font-weight="bold" fill="#6b7280" text-anchor="start">•</text><text x="684.0" y="142.4" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">Interview and survey stakeholders; observe how</text><text x="684.0" y="155.5" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">decisions really get made</text><text x="672.0" y="172.7" font-size="10.8" font-weight="bold" fill="#6b7280" text-anchor="start">•</text><text x="684.0" y="172.7" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">Study lessons learned and past project history</text><text x="672.0" y="189.9" font-size="10.8" font-weight="bold" fill="#6b7280" text-anchor="start">•</text><text x="684.0" y="189.9" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">Ask the sponsor, PMO and HR; note subcultures</text><text x="684.0" y="203.1" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">(departments, regions, partners)</text><rect x="660.0" y="238.0" width="298.0" height="130.0" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.6"/><text x="672.0" y="260.0" font-size="12.5" font-weight="bold" fill="#4c1d95" text-anchor="start">Then tailor</text><text x="672.0" y="280.0" font-size="10.8" font-weight="bold" fill="#6b7280" text-anchor="start">•</text><text x="684.0" y="280.0" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">Approach: predictive, agile or hybrid</text><text x="672.0" y="297.2" font-size="10.8" font-weight="bold" fill="#6b7280" text-anchor="start">•</text><text x="684.0" y="297.2" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">Governance: formal or light</text><text x="672.0" y="314.4" font-size="10.8" font-weight="bold" fill="#6b7280" text-anchor="start">•</text><text x="684.0" y="314.4" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">Communication and engagement style</text><text x="672.0" y="331.5" font-size="10.8" font-weight="bold" fill="#6b7280" text-anchor="start">•</text><text x="684.0" y="331.5" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">Team norms and working agreements</text><text x="672.0" y="348.7" font-size="10.8" font-weight="bold" fill="#6b7280" text-anchor="start">•</text><text x="684.0" y="348.7" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">Change activities: coaching, training, pace</text><rect x="660.0" y="380.0" width="298.0" height="138.0" rx="10" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.6"/><text x="672.0" y="402.0" font-size="12.5" font-weight="bold" fill="#374151" text-anchor="start">PMBOK 8 anchors</text><text x="672.0" y="422.0" font-size="10.8" font-weight="bold" fill="#6b7280" text-anchor="start">•</text><text x="684.0" y="422.0" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">Structure, culture and capability influence the choice</text><text x="684.0" y="435.2" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">of approach</text><text x="672.0" y="452.4" font-size="10.8" font-weight="bold" fill="#6b7280" text-anchor="start">•</text><text x="684.0" y="452.4" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">Culture is a key driver for tailoring stakeholder</text><text x="684.0" y="465.5" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">engagement</text><text x="672.0" y="482.7" font-size="10.8" font-weight="bold" fill="#6b7280" text-anchor="start">•</text><text x="684.0" y="482.7" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">Tailoring checks buy-in, trust, empowerment and</text><text x="684.0" y="495.9" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">organizational culture</text><rect x="22.0" y="548.0" width="936.0" height="50.8" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/><text x="34.0" y="568.0" font-size="11" font-weight="bold" fill="#78350f" text-anchor="start">Mismatch between the way the project works and the culture? Coach and tailor, pilot, or use a hybrid. Do not force the approach and do not abandon it. Avoid cultural</text><text x="34.0" y="581.4" font-size="11" font-weight="bold" fill="#78350f" text-anchor="start">stereotyping: use cultural intelligence.</text></svg>