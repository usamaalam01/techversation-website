<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 540" width="980" height="540" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">What runs in the Executing Focus Area</title><desc id="d">Manage Project Execution at the center, with the other Executing processes from the Governance, Stakeholders, Resources and Risk domains, and Monitoring and Controlling running in parallel and receiving work performance data.</desc><defs><marker id="ah0" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker><marker id="ah1" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker></defs><rect x="0.75" y="0.75" width="978.5" height="538.5" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><text x="20.0" y="28.0" font-size="18" font-weight="bold" fill="#1f2937" text-anchor="start">The Executing Focus Area</text><text x="20.0" y="48.0" font-size="12" font-weight="normal" fill="#6b7280" text-anchor="start">Complete the work consistent with the agreed course of action; the plan can and should change when a change enhances value</text><rect x="330.0" y="210.0" width="320.0" height="96.0" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="490.0" y="240.2" font-size="11.5" font-weight="bold" fill="#14532d" text-anchor="middle">Manage Project Execution</text><text x="490.0" y="254.6" font-size="11.5" font-weight="normal" fill="#14532d" text-anchor="middle">Lead and perform the work in the plan; implement</text><text x="490.0" y="268.9" font-size="11.5" font-weight="normal" fill="#14532d" text-anchor="middle">approved changes; produce deliverables; collect work</text><text x="490.0" y="283.3" font-size="11.5" font-weight="normal" fill="#14532d" text-anchor="middle">performance data</text><rect x="20.0" y="70.0" width="460.0" height="100.0" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="1.6"/><rect x="20.0" y="70.0" width="460.0" height="30.0" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="32.0" y="91.0" font-size="12.5" font-weight="bold" fill="#1e3a8a" text-anchor="start">Governance domain</text><text x="36.0" y="122.0" font-size="11.5" font-weight="normal" fill="#1f2937" text-anchor="start">• Manage Quality Assurance (Topic 18)</text><text x="36.0" y="142.0" font-size="11.5" font-weight="normal" fill="#1f2937" text-anchor="start">• Manage Project Knowledge (Topic 27)</text><rect x="500.0" y="70.0" width="460.0" height="100.0" rx="10" fill="#ffffff" stroke="#0d9488" stroke-width="1.6"/><rect x="500.0" y="70.0" width="460.0" height="30.0" rx="10" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.6"/><text x="512.0" y="91.0" font-size="12.5" font-weight="bold" fill="#134e4a" text-anchor="start">Stakeholders domain</text><text x="516.0" y="122.0" font-size="11.5" font-weight="normal" fill="#1f2937" text-anchor="start">• Manage Stakeholder Engagement (Topic 13)</text><text x="516.0" y="142.0" font-size="11.5" font-weight="normal" fill="#1f2937" text-anchor="start">• Manage Communications (Topic 20)</text><rect x="20.0" y="370.0" width="460.0" height="100.0" rx="10" fill="#ffffff" stroke="#7c3aed" stroke-width="1.6"/><rect x="20.0" y="370.0" width="460.0" height="30.0" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.6"/><text x="32.0" y="391.0" font-size="12.5" font-weight="bold" fill="#4c1d95" text-anchor="start">Resources domain</text><text x="36.0" y="422.0" font-size="11.5" font-weight="normal" fill="#1f2937" text-anchor="start">• Acquire Resources (Topic 19)</text><text x="36.0" y="442.0" font-size="11.5" font-weight="normal" fill="#1f2937" text-anchor="start">• Lead the Team (Topics 25 and 26)</text><rect x="500.0" y="370.0" width="460.0" height="100.0" rx="10" fill="#ffffff" stroke="#d97706" stroke-width="1.6"/><rect x="500.0" y="370.0" width="460.0" height="30.0" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="512.0" y="391.0" font-size="12.5" font-weight="bold" fill="#78350f" text-anchor="start">Risk domain</text><text x="516.0" y="422.0" font-size="11.5" font-weight="normal" fill="#1f2937" text-anchor="start">• Implement Risk Responses (Topic 21)</text><text x="516.0" y="442.0" font-size="11.5" font-weight="normal" fill="#1f2937" text-anchor="start">• Issues and impediments handled as they occur (Topic 30)</text><line x1="250.0" y1="170.0" x2="340.0" y2="214.0" stroke="#6b7280" stroke-width="2" marker-end="url(#ah0)"/><line x1="730.0" y1="170.0" x2="640.0" y2="214.0" stroke="#6b7280" stroke-width="2" marker-end="url(#ah0)"/><line x1="250.0" y1="370.0" x2="340.0" y2="302.0" stroke="#6b7280" stroke-width="2" marker-end="url(#ah0)"/><line x1="730.0" y1="370.0" x2="640.0" y2="302.0" stroke="#6b7280" stroke-width="2" marker-end="url(#ah0)"/><rect x="20.0" y="486.0" width="940.0" height="40.0" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="1.6"/><text x="490.0" y="511.0" font-size="11.5" font-weight="bold" fill="#78350f" text-anchor="middle">Monitoring and Controlling runs in parallel: work performance data go in; variances, forecasts, change requests and corrective action come out (Topics 28 and 29)</text><line x1="490.0" y1="307.0" x2="490.0" y2="485.0" stroke="#d97706" stroke-width="2.4" stroke-dasharray="6 4" marker-end="url(#ah1)"/></svg>