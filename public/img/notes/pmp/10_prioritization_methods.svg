<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 470" width="980" height="470" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">Ranking work by value</title><desc id="d">MoSCoW buckets and a Kano chart showing basic, performance and delight features; plus cost of delay and the 100-point method.</desc><defs></defs><rect x="0.75" y="0.75" width="978.5" height="468.5" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><text x="20.0" y="28.0" font-size="18" font-weight="bold" fill="#1f2937" text-anchor="start">Prioritizing by value and stakeholder feedback</text><text x="20.0" y="48.0" font-size="12" font-weight="normal" fill="#6b7280" text-anchor="start">PMBOK 8 names MoSCoW, the 100-point method, cost of delay and Kano analysis; backlog items are ranked by business value</text><text x="250.0" y="82.0" font-size="14" font-weight="bold" fill="#1f2937" text-anchor="middle">MoSCoW</text><rect x="20.0" y="94.0" width="120.0" height="64.0" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.6"/><text x="80.0" y="129.9" font-size="12" font-weight="bold" fill="#7f1d1d" text-anchor="middle">MUST have</text><rect x="146.0" y="94.0" width="208.0" height="64.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="250.0" y="122.5" font-size="11.5" font-weight="normal" fill="#1f2937" text-anchor="middle">Non-negotiable; the release fails</text><text x="250.0" y="136.9" font-size="11.5" font-weight="normal" fill="#1f2937" text-anchor="middle">without it</text><rect x="20.0" y="170.0" width="120.0" height="64.0" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="80.0" y="205.9" font-size="12" font-weight="bold" fill="#78350f" text-anchor="middle">SHOULD have</text><rect x="146.0" y="170.0" width="208.0" height="64.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="250.0" y="198.6" font-size="11.5" font-weight="normal" fill="#1f2937" text-anchor="middle">Important; painful 