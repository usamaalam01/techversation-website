<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 520" width="980" height="520" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">Estimating techniques</title><desc id="d">Analogous, parametric, bottom-up, multipoint (triangular or PERT) and relative-size estimating, positioned by effort and accuracy, with the common formulas.</desc><defs></defs><rect x="0.75" y="0.75" width="978.5" height="518.5" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><text x="20.0" y="28.0" font-size="18" font-weight="bold" fill="#1f2937" text-anchor="start">Estimating effort, duration, cost and resources</text><text x="20.0" y="48.0" font-size="12" font-weight="normal" fill="#6b7280" text-anchor="start">Pick the technique by the information available and the accuracy needed; use ranges and record the basis of estimates</text><line x1="70.0" y1="90.0" x2="70.0" y2="390.0" stroke="#1f2937" stroke-width="1.8"/><line x1="70.0" y1="390.0" x2="510.0" y2="390.0" stroke="#1f2937" stroke-width="1.8"/><text x="290.0" y="418.0" font-size="12" font-weight="bold" fill="#1f2937" text-anchor="middle">Effort and detail needed</text><text x="26.0" y="240.0" transform="rotate(-90 26.0 240.0)" font-size="12" font-weight="bold" fill="#1f2937" text-anchor="middle">Accuracy</text><circle cx="122.8" cy="315.0" r="9" fill="#fef3c7" stroke="#d97706" stroke-width="2.2"/><text x="136.8" y="313.0" font-size="11" font-weight="bold" fill="#78350f" text-anchor="start">Analogous (top-down, from</text><text x="136.8" y="325.6" font-size="11" font-weight="bold" fill="#78350f" text-anchor="start">similar projects)</text><circle cx="158.0" cy="276.0" r="9" fill="#f3f4f6" stroke="#9ca3af" stroke-width="2.2"/><text x="172.0" y="274.0" font-size="11" font-weight="bold" fill="#374151" text-anchor="start">Expert judgment</text><circle cx="202.0" cy="240.0" r="9" fill="#ccfbf1" stroke="#0d9488" stroke-width="2.2"/><text x="216.0" y="238.0" font-size="11" font-weight="bold" fill="#134e4a" text-anchor="start">Relative size / story points</text><circle cx="312.0" cy="192.0" r="9" fill="#dbeafe" stroke="#2563eb" stroke-width="2.2"/><text x="326.0" y="190.0" font-size="11" font-weight="bold" fill="#1e3a8a" text-anchor="start">Parametric (statistical</text><text x="326.0" y="202.7" font-size="11" font-weight="bold" fill="#1e3a8a" text-anchor="start">model)</text><circle cx="369.2" cy="168.0" r="9" fill="#ede9fe" stroke="#7c3aed" stroke-width="2.2"/><text x="383.2" y="166.0" font-size="11" font-weight="bold" fill="#4c1d95" text-anchor="start">Multipoint (3-point / PERT)</text><circle cx="466.0" cy="114.0" r="9" fill="#dcfce7" stroke="#16a34a" stroke-width="2.2"/><text x="452.0" y="112.0" font-size="11" font-weight="bold" fill="#14532d" text-anchor="end">Bottom-up (from WBS)</text><text x="76.0" y="102.0" font-size="11" font-weight="bold" fill="#6b7280" text-anchor="start">High</text><text x="76.0" y="384.0" font-size="11" font-weight="bold" fill="#6b7280" text-anchor="start">Low</text><rect x="540.0" y="76.0" width="420.0" height="330.0" rx="10" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.4"/><text x="556.0" y="100.0" font-size="14" font-weight="bold" fill="#1f2937" text-anchor="start">Common formulas</text><text x="556.0" y="124.0" font-size="11.5" font-weight="bold" fill="#374151" text-anchor="start">Triangular (PMBOK 8)</text><text x="556.0" y="142.0" font-size="12.5" font-weight="normal" fill="#1e3a8a" text-anchor="start">tE = (tO + tM + tP) / 3</text><text x="556.0" y="170.0" font-size="11.5" font-weight="bold" fill="#374151" text-anchor="start">Beta / PERT [Beyond PMBOK 8 formula]</text><text x="556.0" y="188.0" font-size="12.5" font-weight="normal" fill="#1e3a8a" text-anchor="start">tE = (tO + 4 tM + tP) / 6</text><text x="556.0" y="216.0" font-size="11.5" font-weight="bold" fill="#374151" text-anchor="start">Standard deviation [Beyond]</text><text x="556.0" y="234.0" font-size="12.5" font-weight="normal" fill="#1e3a8a" text-anchor="start">SD = (tP - tO) / 6</text><text x="556.0" y="262.0" font-size="11.5" font-weight="bold" fill="#374151" text-anchor="start">Variance [Beyond]</text><text x="556.0" y="280.0" font-size="12.5" font-weight="normal" fill="#1e3a8a" text-anchor="start">Variance = ((tP - tO) / 6)^2</text><text x="556.0" y="308.0" font-size="11.5" font-weight="bold" fill="#374151" text-anchor="start">Parametric (PMBOK 8 example)</text><text x="556.0" y="326.0" font-size="12.5" font-weight="normal" fill="#1e3a8a" text-anchor="start">1,000 m of cable at 25 m/hour = 40 hours</text><text x="556.0" y="354.0" font-size="11.5" font-weight="bold" fill="#374151" text-anchor="start">Contingency</text><text x="556.0" y="372.0" font-size="12.5" font-weight="normal" fill="#1e3a8a" text-anchor="start">Reserve = ranges and risks; record in basis of estimates</text><text x="556.0" y="404.0" font-size="11" font-weight="normal" fill="#6b7280" text-anchor="start" font-style="italic">tO optimistic, tM most likely, tP pessimistic, tE expected</text><rect x="20.0" y="424.0" width="940.0" height="78.0" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.6"/><text x="34.0" y="452.4" font-size="11.5" font-weight="bold" fill="#374151" text-anchor="start">Good estimating practice</text><text x="34.0" y="466.7" font-size="11.5" font-weight="normal" fill="#374151" text-anchor="start">Involve the people who will do the work; use historical data and benchmarks; state assumptions, constraints, ranges (for example plus or minus 10 percent) and confidence level</text><text x="34.0" y="481.1" font-size="11.5" font-weight="normal" fill="#374151" text-anchor="start">in the basis of estimates; refine as information arrives (progressive elaboration); keep effort, duration, cost and resources consistent with each other.</text></svg>