<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" width="760" height="420" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">Directions of influence</title><desc id="d">Stakeholders classified as upward, downward, outward or sideward relative to the project team.</desc><defs><marker id="ah0" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker></defs><rect x="0.75" y="0.75" width="758.5" height="418.5" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><text x="20.0" y="28.0" font-size="18" font-weight="bold" fill="#1f2937" text-anchor="start">Directions of influence</text><text x="20.0" y="48.0" font-size="12" font-weight="normal" fill="#6b7280" text-anchor="start">Classify stakeholders by where their influence comes from relative to the project team</text><rect x="290.0" y="199.0" width="180.0" height="72.0" rx="8" fill="#1e3a8a" stroke="#1e3a8a" stroke-width="1.6"/><text x="380.0" y="230.8" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">Project team</text><text x="380.0" y="248.3" font-size="14" font-weight="normal" fill="#ffffff" text-anchor="middle">and project manager</text><rect x="210.0" y="66.0" width="340.0" height="78.0" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="380.0" y="93.4" font-size="12.5" font-weight="bold" fill="#1e3a8a" text-anchor="middle">UPWARD</text><text x="380.0" y="109.1" font-size="12.5" font-weight="normal" fill="#1e3a8a" text-anchor="middle">Senior management, sponsor, steering committee,</text><text x="380.0" y="124.7" font-size="12.5" font-weight="normal" fill="#1e3a8a" text-anchor="middle">customer organization</text><rect x="210.0" y="326.0" width="340.0" height="78.0" rx="8" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.6"/><text x="380.0" y="353.4" font-size="12.5" font-weight="bold" fill="#134e4a" text-anchor="middle">DOWNWARD</text><text x="380.0" y="369.1" font-size="12.5" font-weight="normal" fill="#134e4a" text-anchor="middle">Team or specialists contributing knowledge or skills</text><text x="380.0" y="384.7" font-size="12.5" font-weight="normal" fill="#134e4a" text-anchor="middle">temporarily</text><rect x="20.0" y="183.0" width="210.0" height="104.0" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="125.0" y="216.4" font-size="12" font-weight="bold" fill="#78350f" text-anchor="middle">SIDEWARD</text><text x="125.0" y="231.4" font-size="12" font-weight="normal" fill="#78350f" text-anchor="middle">Peer project managers and middle</text><text x="125.0" y="246.4" font-size="12" font-weight="normal" fill="#78350f" text-anchor="middle">managers competing for or sharing</text><text x="125.0" y="261.4" font-size="12" font-weight="normal" fill="#78350f" text-anchor="middle">resources and information</text><rect x="530.0" y="183.0" width="210.0" height="104.0" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="635.0" y="223.9" font-size="12" font-weight="bold" fill="#14532d" text-anchor="middle">OUTWARD</text><text x="635.0" y="238.9" font-size="12" font-weight="normal" fill="#14532d" text-anchor="middle">Suppliers, government, public, end</text><text x="635.0" y="253.9" font-size="12" font-weight="normal" fill="#14532d" text-anchor="middle">users, regulators outside the team</text><line x1="380.0" y1="146.0" x2="380.0" y2="197.0" stroke="#1f2937" stroke-width="2" marker-end="url(#ah0)"/><line x1="380.0" y1="324.0" x2="380.0" y2="273.0" stroke="#1f2937" stroke-width="2" marker-end="url(#ah0)"/><line x1="232.0" y1="235.0" x2="288.0" y2="235.0" stroke="#1f2937" stroke-width="2" marker-end="url(#ah0)"/><line x1="528.0" y1="235.0" x2="472.0" y2="235.0" stroke="#1f2937" stroke-width="2" marker-end="url(#ah0)"/></svg>