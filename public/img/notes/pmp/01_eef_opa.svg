<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" width="960" height="500" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">Enterprise environmental factors and organizational process assets</title><desc id="d">Two categories of influence. EEFs are conditions not directly influenced by the team, internal or external. OPAs are internal: policies, processes and procedures (not updated by the project) and knowledge repositories (updated throughout the project).</desc><defs><marker id="ah0" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker></defs><rect x="0.75" y="0.75" width="958.5" height="498.5" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><text x="20.0" y="28.0" font-size="18" font-weight="bold" fill="#1f2937" text-anchor="start">Project influences: EEFs vs OPAs</text><text x="20.0" y="48.0" font-size="12" font-weight="normal" fill="#6b7280" text-anchor="start">Know what the project can update: only the knowledge repositories, never the organization's policies</text><rect x="330.0" y="58.0" width="300.0" height="40.0" rx="8" fill="#1e3a8a" stroke="#1e3a8a" stroke-width="1.6"/><text x="480.0" y="82.9" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">Influences on the project</text><line x1="400.0" y1="100.0" x2="250.0" y2="124.0" stroke="#1f2937" stroke-width="2" marker-end="url(#ah0)"/><line x1="560.0" y1="100.0" x2="720.0" y2="124.0" stroke="#1f2937" stroke-width="2" marker-end="url(#ah0)"/><rect x="20.0" y="126.0" width="440.0" height="292.0" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="36.0" y="150.0" font-size="13.5" font-weight="bold" fill="#1e3a8a" text-anchor="start">ENTERPRISE ENVIRONMENTAL FACTORS (EEFs)</text><text x="36.0" y="168.0" font-size="12" font-weight="normal" fill="#1e3a8a" text-anchor="start">Conditions not directly influenced by the project team that impact, constrain</text><text x="36.0" y="183.0" font-size="12" font-weight="normal" fill="#1e3a8a" text-anchor="start">or direct the project; inputs to most planning processes</text><rect x="36.0" y="208.0" width="196.0" height="196.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="134.0" y="266.6" font-size="11.5" font-weight="bold" fill="#1f2937" text-anchor="middle">Internal</text><text x="134.0" y="281.0" font-size="11.5" font-weight="normal" fill="#1f2937" text-anchor="middle">Culture, structure, governance</text><text x="134.0" y="295.4" font-size="11.5" font-weight="normal" fill="#1f2937" text-anchor="middle">Geographic distribution</text><text x="134.0" y="309.7" font-size="11.5" font-weight="normal" fill="#1f2937" text-anchor="middle">Infrastructure and IT systems</text><text x="134.0" y="324.1" font-size="11.5" font-weight="normal" fill="#1f2937" text-anchor="middle">Resource availability</text><text x="134.0" y="338.5" font-size="11.5" font-weight="normal" fill="#1f2937" text-anchor="middle">Employee capability</text><text x="134.0" y="352.9" font-size="11.5" font-weight="normal" fill="#1f2937" text-anchor="middle">Financial capability</text><rect x="244.0" y="208.0" width="200.0" height="196.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="344.0" y="252.2" font-size="11.5" font-weight="bold" fill="#1f2937" text-anchor="middle">External</text><text x="344.0" y="266.6" font-size="11.5" font-weight="normal" fill="#1f2937" text-anchor="middle">Marketplace conditions</text><text x="344.0" y="281.0" font-size="11.5" font-weight="normal" fill="#1f2937" text-anchor="middle">Social and cultural influences</text><text x="344.0" y="295.4" font-size="11.5" font-weight="normal" fill="#1f2937" text-anchor="middle">Legal restrictions</text><text x="344.0" y="309.7" font-size="11.5" font-weight="normal" fill="#1f2937" text-anchor="middle">Government or industry standards</text><text x="344.0" y="324.1" font-size="11.5" font-weight="normal" fill="#1f2937" text-anchor="middle">Financial considerations</text><text x="344.0" y="338.5" font-size="11.5" font-weight="normal" fill="#1f2937" text-anchor="middle">Physical environment</text><text x="344.0" y="352.9" font-size="11.5" font-weight="normal" fill="#1f2937" text-anchor="middle">Emerging technology (e.g., AI)</text><text x="344.0" y="367.2" font-size="11.5" font-weight="normal" fill="#1f2937" text-anchor="middle">Public health and safety rules</text><rect x="480.0" y="126.0" width="460.0" height="292.0" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/><text x="496.0" y="150.0" font-size="13.5" font-weight="bold" fill="#14532d" text-anchor="start">ORGANIZATIONAL PROCESS ASSETS (OPAs)</text><text x="496.0" y="168.0" font-size="12" font-weight="normal" fill="#14532d" text-anchor="start">Internal plans, processes, documents, templates, lessons learned and historical</text><text x="496.0" y="183.0" font-size="12" font-weight="normal" fill="#14532d" text-anchor="start">information used to execute or govern the project</text><rect x="496.0" y="208.0" width="204.0" height="196.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="598.0" y="252.2" font-size="11.5" font-weight="bold" fill="#1f2937" text-anchor="middle">Policies, processes, procedures</text><text x="598.0" y="266.6" font-size="11.5" font-weight="normal" fill="#1f2937" text-anchor="middle">Set by the PMO or a function</text><text x="598.0" y="281.0" font-size="11.5" font-weight="normal" fill="#1f2937" text-anchor="middle">outside the project</text><text x="598.0" y="295.4" font-size="11.5" font-weight="normal" fill="#1f2937" text-anchor="middle">Tailoring guidelines, templates, life</text><text x="598.0" y="309.7" font-size="11.5" font-weight="normal" fill="#1f2937" text-anchor="middle">cycles, checklists, change control,</text><text x="598.0" y="324.1" font-size="11.5" font-weight="normal" fill="#1f2937" text-anchor="middle">closure rules</text><text x="598.0" y="338.5" font-size="11.5" font-weight="normal" fill="#1f2937" text-anchor="middle">NOT updated by project work; tailor</text><text x="598.0" y="352.9" font-size="11.5" font-weight="normal" fill="#1f2937" text-anchor="middle">only; change via organizational</text><text x="598.0" y="367.2" font-size="11.5" font-weight="normal" fill="#1f2937" text-anchor="middle">policy</text><rect x="712.0" y="208.0" width="212.0" height="196.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="818.0" y="259.4" font-size="11.5" font-weight="bold" fill="#1f2937" text-anchor="middle">Organizational knowledge</text><text x="818.0" y="273.8" font-size="11.5" font-weight="bold" fill="#1f2937" text-anchor="middle">repositories</text><text x="818.0" y="288.2" font-size="11.5" font-weight="normal" fill="#1f2937" text-anchor="middle">Updated throughout the project</text><text x="818.0" y="302.6" font-size="11.5" font-weight="normal" fill="#1f2937" text-anchor="middle">Lessons learned, historical</text><text x="818.0" y="316.9" font-size="11.5" font-weight="normal" fill="#1f2937" text-anchor="middle">information, financial data, metrics,</text><text x="818.0" y="331.3" font-size="11.5" font-weight="normal" fill="#1f2937" text-anchor="middle">issue and defect records, past project</text><text x="818.0" y="345.7" font-size="11.5" font-weight="normal" fill="#1f2937" text-anchor="middle">files</text><text x="818.0" y="360.1" font-size="11.5" font-weight="normal" fill="#1f2937" text-anchor="middle">YES: the project updates these</text><rect x="20.0" y="430.0" width="920.0" height="52.0" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.6"/><text x="480.0" y="452.2" font-size="12.5" font-weight="normal" fill="#374151" text-anchor="middle">Exam use: a proven new procedure or lessons learned goes into the organizational repository (update OPAs). A regulation change or a market shift is an EEF: you</text><text x="480.0" y="467.9" font-size="12.5" font-weight="normal" fill="#374151" text-anchor="middle">cannot change it, you respond to it.</text></svg>