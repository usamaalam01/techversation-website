<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 540" width="980" height="540" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">Managing compliance: seven steps and a review loop</title><desc id="d">Confirm compliance requirements, classify categories, determine threats, analyze consequences of noncompliance, determine the approach and actions, use methods that support compliance, measure compliance, and review again when scope, jurisdiction or rules change.</desc><defs><marker id="ah0" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker><marker id="ah1" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker></defs><rect x="0.75" y="0.75" width="978.5" height="538.5" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><text x="20.0" y="28.0" font-size="18" font-weight="bold" fill="#1f2937" text-anchor="start">Planning and managing project compliance</text><text x="20.0" y="48.0" font-size="12" font-weight="normal" fill="#6b7280" text-anchor="start">The seven ECO enablers as a working loop; the sources of requirements feed step 1</text><text x="20.0" y="82.0" font-size="12" font-weight="bold" fill="#1f2937" text-anchor="start">Where requirements come from</text><rect x="20.0" y="92.0" width="122.5" height="26.0" rx="13" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.3"/><text x="81.3" y="109.0" font-size="10.2" font-weight="bold" fill="#4c1d95" text-anchor="middle">Laws and regulations</text><rect x="150.6" y="92.0" width="194.1" height="26.0" rx="13" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.3"/><text x="247.6" y="109.0" font-size="10.2" font-weight="bold" fill="#4c1d95" text-anchor="middle">Government and industry standards</text><rect x="352.6" y="92.0" width="167.4" height="26.0" rx="13" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.3"/><text x="436.3" y="109.0" font-size="10.2" font-weight="bold" fill="#4c1d95" text-anchor="middle">Organizational policies (OPAs)</text><rect x="528.0" y="92.0" width="166.2" height="26.0" rx="13" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.3"/><text x="611.1" y="109.0" font-size="10.2" font-weight="bold" fill="#4c1d95" text-anchor="middle">Contracts and customer terms</text><rect x="702.2" y="92.0" width="207.2" height="26.0" rx="13" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.3"/><text x="805.8" y="109.0" font-size="10.2" font-weight="bold" fill="#4c1d95" text-anchor="middle">Sustainability and ethics commitments</text><rect x="20.0" y="150.0" width="216.0" height="124.0" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.7"/><text x="32.0" y="172.0" font-size="12.5" font-weight="bold" fill="#1e3a8a" text-anchor="start">1  Confirm requirements</text><text x="32.0" y="190.0" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">Identify the laws, standards, policies</text><text x="32.0" y="203.2" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">and contract terms that apply (security,</text><text x="32.0" y="216.4" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">health and safety, sustainability,</text><text x="32.0" y="229.5" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">regulatory); confirm with legal and the</text><text x="32.0" y="242.7" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">sponsor</text><line x1="237.0" y1="212.0" x2="260.0" y2="212.0" stroke="#1f2937" stroke-width="2.2" marker-end="url(#ah0)"/><rect x="261.0" y="150.0" width="216.0" height="124.0" rx="10" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.7"/><text x="273.0" y="172.0" font-size="12.5" font-weight="bold" fill="#134e4a" text-anchor="start">2  Classify categories</text><text x="273.0" y="190.0" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">Group them (legal, security and privacy,</text><text x="273.0" y="203.2" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">safety, environmental, contractual,</text><text x="273.0" y="216.4" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">policy); mandatory vs voluntary; set</text><text x="273.0" y="229.5" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">owners and priority</text><line x1="478.0" y1="212.0" x2="501.0" y2="212.0" stroke="#1f2937" stroke-width="2.2" marker-end="url(#ah0)"/><rect x="502.0" y="150.0" width="216.0" height="124.0" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.7"/><text x="514.0" y="172.0" font-size="12.5" font-weight="bold" fill="#78350f" text-anchor="start">3  Determine threats</text><text x="514.0" y="190.0" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">What could make the project</text><text x="514.0" y="203.2" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">noncompliant: rule changes, scope or</text><text x="514.0" y="216.4" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">market changes, suppliers, skills gaps,</text><text x="514.0" y="229.5" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">shortcuts, evidence gaps</text><line x1="719.0" y1="212.0" x2="742.0" y2="212.0" stroke="#1f2937" stroke-width="2.2" marker-end="url(#ah0)"/><rect x="743.0" y="150.0" width="216.0" height="124.0" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="1.7"/><text x="755.0" y="172.0" font-size="12.5" font-weight="bold" fill="#7f1d1d" text-anchor="start">4  Analyze consequences</text><text x="755.0" y="190.0" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">Fines, legal action, stop-work, lost</text><text x="755.0" y="203.2" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">license, contract breach, rework and</text><text x="755.0" y="216.4" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">delay, reputation, harm, cancellation</text><rect x="743.0" y="318.0" width="216.0" height="124.0" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.7"/><text x="755.0" y="340.0" font-size="12.2" font-weight="bold" fill="#4c1d95" text-anchor="start">5  Decide approach and actions</text><text x="755.0" y="358.0" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">Build requirements into scope, backlog,</text><text x="755.0" y="371.2" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">schedule, budget; assign owners; plan</text><text x="755.0" y="384.4" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">verification; mitigate, transfer or</text><text x="755.0" y="397.5" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">escalate; formal exceptions only</text><text x="755.0" y="410.7" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">through governance</text><rect x="502.0" y="318.0" width="216.0" height="124.0" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.7"/><text x="514.0" y="340.0" font-size="12.2" font-weight="bold" fill="#14532d" text-anchor="start">6  Use supporting methods</text><text x="514.0" y="358.0" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">Policies, compliance matrix, checklists,</text><text x="514.0" y="371.2" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">definition of done, training, audits,</text><text x="514.0" y="384.4" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">change control, controlled repository,</text><text x="514.0" y="397.5" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">contract clauses</text><rect x="261.0" y="318.0" width="216.0" height="124.0" rx="10" fill="#1e3a8a" stroke="#1e3a8a" stroke-width="1.7"/><text x="273.0" y="340.0" font-size="12.2" font-weight="bold" fill="#ffffff" text-anchor="start">7  Measure compliance</text><text x="273.0" y="358.0" font-size="10.8" font-weight="normal" fill="#ffffff" text-anchor="start">Percent of requirements verified, open</text><text x="273.0" y="371.2" font-size="10.8" font-weight="normal" fill="#ffffff" text-anchor="start">audit findings, nonconformances,</text><text x="273.0" y="384.4" font-size="10.8" font-weight="normal" fill="#ffffff" text-anchor="start">remediation time, incidents; report to</text><text x="273.0" y="397.5" font-size="10.8" font-weight="normal" fill="#ffffff" text-anchor="start">governance</text><line x1="851.0" y1="275.0" x2="851.0" y2="317.0" stroke="#1f2937" stroke-width="2.2" marker-end="url(#ah0)"/><line x1="742.0" y1="380.0" x2="719.0" y2="380.0" stroke="#1f2937" stroke-width="2.2" marker-end="url(#ah0)"/><line x1="501.0" y1="380.0" x2="478.0" y2="380.0" stroke="#1f2937" stroke-width="2.2" marker-end="url(#ah0)"/><polyline points="260.0,380.0 128.0,380.0 128.0,276.0" fill="none" stroke="#7c3aed" stroke-width="2.2" stroke-dasharray="6 4" marker-end="url(#ah1)" stroke-linejoin="round"/><rect x="20.0" y="368.0" width="176.0" height="54.0" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.6"/><text x="108.0" y="385.0" font-size="10.8" font-weight="bold" fill="#4c1d95" text-anchor="middle">Review when scope,</text><text x="108.0" y="398.5" font-size="10.8" font-weight="bold" fill="#4c1d95" text-anchor="middle">jurisdiction, product or rules</text><text x="108.0" y="412.0" font-size="10.8" font-weight="bold" fill="#4c1d95" text-anchor="middle">change</text><rect x="20.0" y="462.0" width="940.0" height="62.0" rx="8" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.3"/><text x="32.0" y="482.0" font-size="11" font-weight="bold" fill="#6b7280" text-anchor="start">•</text><text x="44.0" y="482.0" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="start">Mandatory requirements (law, regulation, contract) must be met; voluntary standards and internal policy follow governance decisions, with documented exceptions.</text><text x="32.0" y="498.2" font-size="11" font-weight="bold" fill="#6b7280" text-anchor="start">•</text><text x="44.0" y="498.2" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="start">Compliance threats are managed as risks (owner, response); once they occur they are issues. Evidence matters as much as compliance itself.</text></svg>