<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 500" width="980" height="500" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">Claims and alternative dispute resolution</title><desc id="d">Alternative dispute resolution methods from least to most formal: negotiation, mediation, dispute review board, expert determination, arbitration, litigation, with the project manager's role and ethical cautions.</desc><defs><marker id="ah0" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker></defs><rect x="0.75" y="0.75" width="978.5" height="498.5" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><text x="20.0" y="28.0" font-size="18" font-weight="bold" fill="#1f2937" text-anchor="start">Claims and alternative dispute resolution (ADR)</text><text x="20.0" y="48.0" font-size="12" font-weight="normal" fill="#6b7280" text-anchor="start">Try the lightest effective step first; keep records; stay factual and impartial</text><rect x="20.0" y="390.0" width="300.0" height="56.0" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="32.0" y="412.0" font-size="12.5" font-weight="bold" fill="#14532d" text-anchor="start">1  Negotiation</text><text x="32.0" y="428.0" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">Direct talks between the parties, no third party</text><rect x="20.0" y="326.0" width="322.0" height="56.0" rx="8" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.6"/><text x="32.0" y="348.0" font-size="12.5" font-weight="bold" fill="#134e4a" text-anchor="start">2  Mediation</text><text x="32.0" y="364.0" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">A neutral third party facilitates; the parties reach their own</text><text x="32.0" y="377.0" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">agreement</text><rect x="20.0" y="262.0" width="344.0" height="56.0" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="32.0" y="284.0" font-size="12.5" font-weight="bold" fill="#1e3a8a" text-anchor="start">3  Dispute review board</text><text x="32.0" y="300.0" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">Neutral experts appointed at the start for ongoing avoidance and</text><text x="32.0" y="313.0" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">resolution</text><rect x="20.0" y="198.0" width="366.0" height="56.0" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.6"/><text x="32.0" y="220.0" font-size="12.5" font-weight="bold" fill="#4c1d95" text-anchor="start">4  Expert determination</text><text x="32.0" y="236.0" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">An independent expert decides a specific technical or financial issue</text><rect x="20.0" y="134.0" width="388.0" height="56.0" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="32.0" y="156.0" font-size="12.5" font-weight="bold" fill="#78350f" text-anchor="start">5  Arbitration</text><text x="32.0" y="172.0" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">An arbitrator or panel hears both sides and makes a binding decision</text><rect x="20.0" y="70.0" width="410.0" height="56.0" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.6"/><text x="32.0" y="92.0" font-size="12.5" font-weight="bold" fill="#7f1d1d" text-anchor="start">6  Litigation</text><text x="32.0" y="108.0" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">A court decides; the last resort when everything else fails</text><text x="20.0" y="460.0" font-size="11" font-weight="bold" fill="#6b7280" text-anchor="start">More formal, slower, costlier and more relationship damage as you go up the steps</text><line x1="458.0" y1="440.0" x2="458.0" y2="74.0" stroke="#6b7280" stroke-width="2" marker-end="url(#ah0)"/><rect x="500.0" y="64.0" width="460.0" height="196.0" rx="8" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.3"/><text x="512.0" y="84.0" font-size="12.5" font-weight="bold" fill="#1f2937" text-anchor="start">The project manager's role</text><text x="512.0" y="104.0" font-size="11" font-weight="bold" fill="#6b7280" text-anchor="start">•</text><text x="524.0" y="104.0" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="start">Understand the contract terms and spot likely dispute areas early</text><text x="512.0" y="121.4" font-size="11" font-weight="bold" fill="#6b7280" text-anchor="start">•</text><text x="524.0" y="121.4" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="start">Keep detailed records of activities, changes and communications to support or defend</text><text x="524.0" y="134.8" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="start">claims</text><text x="512.0" y="152.3" font-size="11" font-weight="bold" fill="#6b7280" text-anchor="start">•</text><text x="524.0" y="152.3" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="start">Communicate openly to prevent misunderstandings; address conflicts early</text><text x="512.0" y="169.7" font-size="11" font-weight="bold" fill="#6b7280" text-anchor="start">•</text><text x="524.0" y="169.7" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="start">Build negotiation and conflict-resolution skills: you are usually the first to engage</text><text x="512.0" y="187.1" font-size="11" font-weight="bold" fill="#6b7280" text-anchor="start">•</text><text x="524.0" y="187.1" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="start">Work with the organization's legal team; AI tools can help analyze clauses and risk</text><rect x="500.0" y="276.0" width="460.0" height="190.0" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/><text x="512.0" y="296.0" font-size="12.5" font-weight="bold" fill="#78350f" text-anchor="start">Handle legal sensitivity and ethics carefully</text><text x="512.0" y="316.0" font-size="11" font-weight="bold" fill="#6b7280" text-anchor="start">•</text><text x="524.0" y="316.0" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="start">Nuanced communication: written messages, including email, can become evidence</text><text x="512.0" y="333.4" font-size="11" font-weight="bold" fill="#6b7280" text-anchor="start">•</text><text x="524.0" y="333.4" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="start">Escalation protocols: agree when and how disputes move to legal action</text><text x="512.0" y="350.8" font-size="11" font-weight="bold" fill="#6b7280" text-anchor="start">•</text><text x="524.0" y="350.8" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="start">Confidentiality: protect dispute details</text><text x="512.0" y="368.3" font-size="11" font-weight="bold" fill="#6b7280" text-anchor="start">•</text><text x="524.0" y="368.3" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="start">Impartiality: stick to facts, not emotions or personal relationships</text><text x="512.0" y="385.7" font-size="11" font-weight="bold" fill="#6b7280" text-anchor="start">•</text><text x="524.0" y="385.7" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="start">Variation orders and unresolved changes are a leading cause of claims: control</text><text x="524.0" y="399.1" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="start">changes formally</text></svg>