<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 490" width="980" height="490" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">Four motivation models</title><desc id="d">Herzberg hygiene and motivational factors; Pink's autonomy, mastery and purpose; McClelland's needs of achievement, power and affiliation; McGregor's Theory X, Theory Y and Theory Z, each with its implication for the project manager.</desc><defs></defs><rect x="0.75" y="0.75" width="978.5" height="488.5" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><text x="20.0" y="28.0" font-size="18" font-weight="bold" fill="#1f2937" text-anchor="start">Motivation models named in PMBOK 8</text><text x="20.0" y="48.0" font-size="12" font-weight="normal" fill="#6b7280" text-anchor="start">People are motivated by different things: understand what drives each person and tailor recognition and work design</text><rect x="20.0" y="62.0" width="463.0" height="198.0" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="1.7"/><rect x="20.0" y="62.0" width="463.0" height="32.0" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.7"/><text x="32.0" y="83.0" font-size="12.5" font-weight="bold" fill="#1e3a8a" text-anchor="start">Herzberg: hygiene and motivational factors</text><text x="32.0" y="112.0" font-size="11" font-weight="bold" fill="#1e3a8a" text-anchor="start">Hygiene factors</text><text x="122.7" y="112.0" font-size="10.6" font-weight="normal" fill="#1f2937" text-anchor="start">Company policies, salary, physical environment. If insufficient they cause</text><text x="122.7" y="124.7" font-size="10.6" font-weight="normal" fill="#1f2937" text-anchor="start">dissatisfaction; even when sufficient they do not create satisfaction.</text><text x="32.0" y="141.4" font-size="11" font-weight="bold" fill="#1e3a8a" text-anchor="start">Motivational factors</text><text x="144.1" y="141.4" font-size="10.6" font-weight="normal" fill="#1f2937" text-anchor="start">Content of the work: achievement, growth, advancement. Sufficient</text><text x="144.1" y="154.2" font-size="10.6" font-weight="normal" fill="#1f2937" text-anchor="start">ones lead to satisfaction.</text><rect x="30.0" y="208.0" width="443.0" height="42.0" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/><text x="40.0" y="224.0" font-size="10.6" font-weight="bold" fill="#1e3a8a" text-anchor="start">For the PM: Fix the basics so people are not dissatisfied, then design work that</text><text x="40.0" y="236.7" font-size="10.6" font-weight="bold" fill="#1e3a8a" text-anchor="start">offers achievement and growth.</text><rect x="497.0" y="62.0" width="463.0" height="198.0" rx="10" fill="#ffffff" stroke="#16a34a" stroke-width="1.7"/><rect x="497.0" y="62.0" width="463.0" height="32.0" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.7"/><text x="509.0" y="83.0" font-size="12.5" font-weight="bold" fill="#14532d" text-anchor="start">Pink: intrinsic motivation</text><text x="509.0" y="112.0" font-size="11" font-weight="bold" fill="#14532d" text-anchor="start">Autonomy</text><text x="571.3" y="112.0" font-size="10.6" font-weight="normal" fill="#1f2937" text-anchor="start">Direct your own work: how, where and when; flexible hours; self-managing</text><text x="571.3" y="124.7" font-size="10.6" font-weight="normal" fill="#1f2937" text-anchor="start">teams.</text><text x="509.0" y="141.4" font-size="11" font-weight="bold" fill="#14532d" text-anchor="start">Mastery</text><text x="558.7" y="141.4" font-size="10.6" font-weight="normal" fill="#1f2937" text-anchor="start">Improve and excel: learn, do excellent work, reach goals.</text><text x="509.0" y="158.2" font-size="11" font-weight="bold" fill="#14532d" text-anchor="start">Purpose</text><text x="561.1" y="158.2" font-size="10.6" font-weight="normal" fill="#1f2937" text-anchor="start">Make a difference: know the vision and how your work contributes.</text><rect x="507.0" y="208.0" width="443.0" height="42.0" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/><text x="517.0" y="224.0" font-size="10.6" font-weight="bold" fill="#14532d" text-anchor="start">For the PM: Once pay is fair, extrinsic rewards fade; for complex work intrinsic</text><text x="517.0" y="236.7" font-size="10.6" font-weight="bold" fill="#14532d" text-anchor="start">motivators last longer.</text><rect x="20.0" y="274.0" width="463.0" height="198.0" rx="10" fill="#ffffff" stroke="#d97706" stroke-width="1.7"/><rect x="20.0" y="274.0" width="463.0" height="32.0" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.7"/><text x="32.0" y="295.0" font-size="12.5" font-weight="bold" fill="#78350f" text-anchor="start">McClelland: theory of needs</text><text x="32.0" y="324.0" font-size="11" font-weight="bold" fill="#78350f" text-anchor="start">Achievement</text><text x="108.6" y="324.0" font-size="10.6" font-weight="normal" fill="#1f2937" text-anchor="start">Challenging but reasonable goals.</text><text x="32.0" y="340.7" font-size="11" font-weight="bold" fill="#78350f" text-anchor="start">Power</text><text x="73.1" y="340.7" font-size="10.6" font-weight="normal" fill="#1f2937" text-anchor="start">Organizing, motivating and leading others; more responsibility.</text><text x="32.0" y="357.4" font-size="11" font-weight="bold" fill="#78350f" text-anchor="start">Affiliation</text><text x="90.7" y="357.4" font-size="10.6" font-weight="normal" fill="#1f2937" text-anchor="start">Acceptance and belonging; being part of a team.</text><rect x="30.0" y="420.0" width="443.0" height="42.0" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.2"/><text x="40.0" y="436.0" font-size="10.6" font-weight="bold" fill="#78350f" text-anchor="start">For the PM: Assign work to match each person's strongest need; the mix varies</text><text x="40.0" y="448.7" font-size="10.6" font-weight="bold" fill="#78350f" text-anchor="start">with experience and culture.</text><rect x="497.0" y="274.0" width="463.0" height="198.0" rx="10" fill="#ffffff" stroke="#7c3aed" stroke-width="1.7"/><rect x="497.0" y="274.0" width="463.0" height="32.0" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.7"/><text x="509.0" y="295.0" font-size="12.5" font-weight="bold" fill="#4c1d95" text-anchor="start">McGregor: Theory X, Y and Z</text><text x="509.0" y="324.0" font-size="11" font-weight="bold" fill="#4c1d95" text-anchor="start">Theory X</text><text x="564.2" y="324.0" font-size="10.6" font-weight="normal" fill="#1f2937" text-anchor="start">People work only for income and avoid ambition: a hands-on, top-down style</text><text x="564.2" y="336.7" font-size="10.6" font-weight="normal" fill="#1f2937" text-anchor="start">(labor-intensive, many management layers).</text><text x="509.0" y="353.4" font-size="11" font-weight="bold" fill="#4c1d95" text-anchor="start">Theory Y</text><text x="564.2" y="353.4" font-size="10.6" font-weight="normal" fill="#1f2937" text-anchor="start">People are intrinsically motivated: a coaching style that encourages creativity</text><text x="564.2" y="366.2" font-size="10.6" font-weight="normal" fill="#1f2937" text-anchor="start">and discussion (knowledge work).</text><text x="509.0" y="382.9" font-size="11" font-weight="bold" fill="#4c1d95" text-anchor="start">Theory Z</text><text x="563.5" y="382.9" font-size="10.6" font-weight="normal" fill="#1f2937" text-anchor="start">Self-realization, values and a higher calling (Maslow); Ouchi's version stresses</text><text x="563.5" y="395.6" font-size="10.6" font-weight="normal" fill="#1f2937" text-anchor="start">employee well-being and long-term commitment.</text><rect x="507.0" y="420.0" width="443.0" height="42.0" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.2"/><text x="517.0" y="436.0" font-size="10.6" font-weight="bold" fill="#4c1d95" text-anchor="start">For the PM: Choose the style that fits the people and the work; most projects lean</text><text x="517.0" y="448.7" font-size="10.6" font-weight="bold" fill="#4c1d95" text-anchor="start">toward Y.</text></svg>