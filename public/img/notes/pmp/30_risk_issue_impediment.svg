<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 544" width="980" height="544" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">Risk, issue and impediment</title><desc id="d">A risk is a possible future event recorded in the risk register. An issue is a current condition that has already occurred and is recorded in the issue log. An impediment is an obstacle that blocks the team's work. When a risk occurs it becomes an issue: confirm, log, run the planned response, update the register, check knock-on effects, inform stakeholders.</desc><defs><marker id="ah0" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker><marker id="ah1" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker></defs><rect x="0.75" y="0.75" width="978.5" height="542.5" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><text x="20.0" y="28.0" font-size="18" font-weight="bold" fill="#1f2937" text-anchor="start">Risk, issue, impediment: where is the problem in time?</text><text x="20.0" y="48.0" font-size="12" font-weight="normal" fill="#6b7280" text-anchor="start">A risk is a possibility, an issue is a fact, and an impediment is a fact that blocks the team's work</text><rect x="20.0" y="64.0" width="244.0" height="178.0" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="32.0" y="86.0" font-size="12.5" font-weight="bold" fill="#1e3a8a" text-anchor="start">RISK: might happen</text><text x="32.0" y="106.0" font-size="10.8" font-weight="bold" fill="#6b7280" text-anchor="start">•</text><text x="44.0" y="106.0" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">Uncertain future event: a threat or an</text><text x="44.0" y="119.2" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">opportunity</text><text x="32.0" y="136.4" font-size="10.8" font-weight="bold" fill="#6b7280" text-anchor="start">•</text><text x="44.0" y="136.4" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">Lives in the risk register with an owner, a</text><text x="44.0" y="149.5" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">response and triggers</text><text x="32.0" y="166.7" font-size="10.8" font-weight="bold" fill="#6b7280" text-anchor="start">•</text><text x="44.0" y="166.7" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">Handled by Implement Risk Responses</text><text x="44.0" y="179.9" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">and Monitor Risks</text><text x="32.0" y="197.1" font-size="10.8" font-weight="bold" fill="#6b7280" text-anchor="start">•</text><text x="44.0" y="197.1" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">Ask: how likely, how big, which response?</text><rect x="368.0" y="64.0" width="244.0" height="178.0" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="380.0" y="86.0" font-size="12.5" font-weight="bold" fill="#78350f" text-anchor="start">ISSUE: is happening</text><text x="380.0" y="106.0" font-size="10.8" font-weight="bold" fill="#6b7280" text-anchor="start">•</text><text x="392.0" y="106.0" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">Current condition that may affect</text><text x="392.0" y="119.2" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">objectives; it has occurred or is occurring</text><text x="380.0" y="136.4" font-size="10.8" font-weight="bold" fill="#6b7280" text-anchor="start">•</text><text x="392.0" y="136.4" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">Lives in the issue log with an owner,</text><text x="392.0" y="149.5" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">action, due date, status</text><text x="380.0" y="166.7" font-size="10.8" font-weight="bold" fill="#6b7280" text-anchor="start">•</text><text x="392.0" y="166.7" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">Needs action or management attention</text><text x="392.0" y="179.9" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">now</text><text x="380.0" y="197.1" font-size="10.8" font-weight="bold" fill="#6b7280" text-anchor="start">•</text><text x="392.0" y="197.1" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">Ask: what is the impact, who resolves it?</text><rect x="716.0" y="64.0" width="244.0" height="178.0" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="1.6"/><text x="728.0" y="86.0" font-size="12.5" font-weight="bold" fill="#7f1d1d" text-anchor="start">IMPEDIMENT: blocks the work</text><text x="728.0" y="106.0" font-size="10.8" font-weight="bold" fill="#6b7280" text-anchor="start">•</text><text x="740.0" y="106.0" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">Obstacle (blocker) that prevents the team</text><text x="740.0" y="119.2" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">from reaching its objectives</text><text x="728.0" y="136.4" font-size="10.8" font-weight="bold" fill="#6b7280" text-anchor="start">•</text><text x="740.0" y="136.4" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">Lives on the impediment list or board with</text><text x="740.0" y="149.5" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">severity and actions</text><text x="728.0" y="166.7" font-size="10.8" font-weight="bold" fill="#6b7280" text-anchor="start">•</text><text x="740.0" y="166.7" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">Removed by the team, PM or scrum</text><text x="740.0" y="179.9" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">master; escalated if beyond authority</text><text x="728.0" y="197.1" font-size="10.8" font-weight="bold" fill="#6b7280" text-anchor="start">•</text><text x="740.0" y="197.1" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">Ask: what is stopping the work, who can</text><text x="740.0" y="210.2" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">clear it?</text><line x1="266.0" y1="168.0" x2="366.0" y2="168.0" stroke="#1f2937" stroke-width="2.6" marker-end="url(#ah0)"/><text x="316.0" y="147.0" font-size="10.5" font-weight="bold" fill="#1f2937" text-anchor="middle">Event occurs, or</text><text x="316.0" y="159.6" font-size="10.5" font-weight="bold" fill="#1f2937" text-anchor="middle">a trigger fires</text><line x1="614.0" y1="168.0" x2="714.0" y2="168.0" stroke="#1f2937" stroke-width="2.6" marker-end="url(#ah0)"/><text x="664.0" y="147.0" font-size="10.5" font-weight="bold" fill="#1f2937" text-anchor="middle">Stops or slows</text><text x="664.0" y="159.6" font-size="10.5" font-weight="bold" fill="#1f2937" text-anchor="middle">the team's work</text><rect x="20.0" y="266.0" width="244.0" height="52.0" rx="8" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.3"/><text x="30.0" y="286.0" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">A risk that never occurs, or whose time has</text><text x="30.0" y="299.2" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">passed, is closed in the register.</text><rect x="368.0" y="266.0" width="244.0" height="52.0" rx="8" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.3"/><text x="378.0" y="286.0" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">An unforeseen problem arrives directly as an</text><text x="378.0" y="299.2" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">issue, with no risk entry behind it.</text><rect x="716.0" y="266.0" width="244.0" height="52.0" rx="8" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.3"/><text x="726.0" y="286.0" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">Many issues are impediments. Both follow the</text><text x="726.0" y="299.2" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">same loop: capture, evaluate, prioritize,</text><text x="726.0" y="312.4" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">intervene, reassess.</text><line x1="490.0" y1="266.0" x2="490.0" y2="244.0" stroke="#6b7280" stroke-width="1.8" stroke-dasharray="4 3" marker-end="url(#ah1)"/><text x="20.0" y="340.0" font-size="13" font-weight="bold" fill="#1f2937" text-anchor="start">When a risk becomes an issue: recognize it, then act</text><rect x="20.0" y="352.0" width="144.0" height="112.0" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="30.0" y="374.0" font-size="12" font-weight="bold" fill="#1e3a8a" text-anchor="start">1  Confirm</text><text x="30.0" y="392.0" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">Check that it has really</text><text x="30.0" y="405.2" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">occurred, with facts</text><text x="30.0" y="418.4" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">rather than rumor.</text><line x1="165.0" y1="408.0" x2="178.0" y2="408.0" stroke="#1f2937" stroke-width="1.8" marker-end="url(#ah0)"/><rect x="179.0" y="352.0" width="144.0" height="112.0" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="189.0" y="374.0" font-size="12" font-weight="bold" fill="#78350f" text-anchor="start">2  Log</text><text x="189.0" y="392.0" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">Record it in the issue log</text><text x="189.0" y="405.2" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">with an owner, an action</text><text x="189.0" y="418.4" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">and a date.</text><line x1="324.0" y1="408.0" x2="337.0" y2="408.0" stroke="#1f2937" stroke-width="1.8" marker-end="url(#ah0)"/><rect x="338.0" y="352.0" width="144.0" height="112.0" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="348.0" y="374.0" font-size="12" font-weight="bold" fill="#14532d" text-anchor="start">3  Respond</text><text x="348.0" y="392.0" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">Run the planned</text><text x="348.0" y="405.2" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">response; use reserves</text><text x="348.0" y="418.4" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">as the plan allows.</text><line x1="483.0" y1="408.0" x2="496.0" y2="408.0" stroke="#1f2937" stroke-width="1.8" marker-end="url(#ah0)"/><rect x="497.0" y="352.0" width="144.0" height="112.0" rx="10" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.6"/><text x="507.0" y="374.0" font-size="12" font-weight="bold" fill="#134e4a" text-anchor="start">4  Update</text><text x="507.0" y="392.0" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">Update the risk register</text><text x="507.0" y="405.2" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">and report. Do not just</text><text x="507.0" y="418.4" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">re-rate probability to</text><text x="507.0" y="431.5" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">100%.</text><line x1="642.0" y1="408.0" x2="655.0" y2="408.0" stroke="#1f2937" stroke-width="1.8" marker-end="url(#ah0)"/><rect x="656.0" y="352.0" width="144.0" height="112.0" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.6"/><text x="666.0" y="374.0" font-size="12" font-weight="bold" fill="#4c1d95" text-anchor="start">5  Check effects</text><text x="666.0" y="392.0" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">Look for secondary or</text><text x="666.0" y="405.2" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">new risks; raise a change</text><text x="666.0" y="418.4" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">request if a baseline</text><text x="666.0" y="431.5" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">moves.</text><line x1="801.0" y1="408.0" x2="814.0" y2="408.0" stroke="#1f2937" stroke-width="1.8" marker-end="url(#ah0)"/><rect x="815.0" y="352.0" width="144.0" height="112.0" rx="10" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.6"/><text x="825.0" y="374.0" font-size="12" font-weight="bold" fill="#374151" text-anchor="start">6  Tell and learn</text><text x="825.0" y="392.0" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">Inform stakeholders;</text><text x="825.0" y="405.2" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">escalate beyond your</text><text x="825.0" y="418.4" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">authority; record the</text><text x="825.0" y="431.5" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">lesson.</text><rect x="20.0" y="478.0" width="940.0" height="50.8" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/><text x="32.0" y="498.0" font-size="11" font-weight="bold" fill="#78350f" text-anchor="start">Exam signal: a stated event has now happened (an authority announced a delay, a supplier failed, a trigger condition was met). The possibility is gone, so treat it as an issue</text><text x="32.0" y="511.4" font-size="11" font-weight="bold" fill="#78350f" text-anchor="start">and run the planned response; do not raise the probability rating.</text></svg>