<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 598" width="980" height="598" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">When the organization changes: evaluate the impact, then act</title><desc id="d">Triggers such as a merger, restructuring, new sponsor, strategy shift, budget change or new approval path lead to five steps: confirm the facts with the sponsor, assess the impact across objectives, scope, schedule, budget, resources, stakeholders, governance, contracts, risks and compliance, determine actions, act and communicate, then monitor and reassess. A table maps typical changes to typical actions.</desc><defs><marker id="ah0" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker></defs><rect x="0.75" y="0.75" width="978.5" height="596.5" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><text x="20.0" y="28.0" font-size="18" font-weight="bold" fill="#1f2937" text-anchor="start">When the organization changes: evaluate the impact, then act</text><text x="20.0" y="48.0" font-size="12" font-weight="normal" fill="#6b7280" text-anchor="start">Do not pause everything and do not carry on unchanged; assess, decide with the sponsor, then act</text><text x="22.0" y="84.0" font-size="11.5" font-weight="bold" fill="#6b7280" text-anchor="start">Triggers:</text><rect x="92.0" y="68.0" width="123.0" height="20.5" rx="10.25" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.2"/><text x="153.5" y="80.0" font-size="10.5" font-weight="bold" fill="#374151" text-anchor="middle">Merger or acquisition</text><rect x="223.0" y="68.0" width="206.5" height="20.5" rx="10.25" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.2"/><text x="326.2" y="80.0" font-size="10.5" font-weight="bold" fill="#374151" text-anchor="middle">Restructuring or new operating model</text><rect x="437.5" y="68.0" width="151.1" height="20.5" rx="10.25" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.2"/><text x="513.0" y="80.0" font-size="10.5" font-weight="bold" fill="#374151" text-anchor="middle">New sponsor or leadership</text><rect x="596.6" y="68.0" width="135.8" height="20.5" rx="10.25" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.2"/><text x="664.5" y="80.0" font-size="10.5" font-weight="bold" fill="#374151" text-anchor="middle">Strategy or priority shift</text><rect x="740.4" y="68.0" width="161.4" height="20.5" rx="10.25" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.2"/><text x="821.1" y="80.0" font-size="10.5" font-weight="bold" fill="#374151" text-anchor="middle">Budget or headcount change</text><rect x="22.0" y="96.0" width="181.5" height="20.5" rx="10.25" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.2"/><text x="112.7" y="108.0" font-size="10.5" font-weight="bold" fill="#374151" text-anchor="middle">New policy, tool or approval path</text><rect x="211.5" y="96.0" width="182.5" height="20.5" rx="10.25" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.2"/><text x="302.7" y="108.0" font-size="10.5" font-weight="bold" fill="#374151" text-anchor="middle">Staff moving to permanent teams</text><rect x="22.0" y="132.0" width="172.0" height="142.0" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.7"/><text x="32.0" y="154.0" font-size="12" font-weight="bold" fill="#1e3a8a" text-anchor="start">1  Confirm the facts</text><text x="32.0" y="172.0" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">With the sponsor and</text><text x="32.0" y="185.2" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">governance: what is changing,</text><text x="32.0" y="198.4" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">when, what is still unknown.</text><text x="32.0" y="211.5" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">Respect confidentiality.</text><line x1="195.0" y1="203.0" x2="213.0" y2="203.0" stroke="#1f2937" stroke-width="2.0" marker-end="url(#ah0)"/><rect x="214.0" y="132.0" width="172.0" height="142.0" rx="10" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.7"/><text x="224.0" y="154.0" font-size="12" font-weight="bold" fill="#134e4a" text-anchor="start">2  Assess the impact</text><text x="224.0" y="172.0" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">Objectives and business case,</text><text x="224.0" y="185.2" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">scope, schedule, budget,</text><text x="224.0" y="198.4" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">resources, stakeholders,</text><text x="224.0" y="211.5" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">governance, contracts, risks,</text><text x="224.0" y="224.7" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">compliance.</text><line x1="387.0" y1="203.0" x2="405.0" y2="203.0" stroke="#1f2937" stroke-width="2.0" marker-end="url(#ah0)"/><rect x="406.0" y="132.0" width="172.0" height="142.0" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.7"/><text x="416.0" y="154.0" font-size="12" font-weight="bold" fill="#78350f" text-anchor="start">3  Determine actions</text><text x="416.0" y="172.0" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">Continue, adapt, re-plan,</text><text x="416.0" y="185.2" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">re-baseline through change</text><text x="416.0" y="198.4" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">control, or recommend pause</text><text x="416.0" y="211.5" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">or stop through governance.</text><line x1="579.0" y1="203.0" x2="597.0" y2="203.0" stroke="#1f2937" stroke-width="2.0" marker-end="url(#ah0)"/><rect x="598.0" y="132.0" width="172.0" height="142.0" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.7"/><text x="608.0" y="154.0" font-size="12" font-weight="bold" fill="#4c1d95" text-anchor="start">4  Act and communicate</text><text x="608.0" y="172.0" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">Update plans and registers,</text><text x="608.0" y="185.2" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">brief new people, agree</text><text x="608.0" y="198.4" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">transitions, tell stakeholders</text><text x="608.0" y="211.5" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">what changes.</text><line x1="771.0" y1="203.0" x2="789.0" y2="203.0" stroke="#1f2937" stroke-width="2.0" marker-end="url(#ah0)"/><rect x="790.0" y="132.0" width="172.0" height="142.0" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.7"/><text x="800.0" y="154.0" font-size="12" font-weight="bold" fill="#14532d" text-anchor="start">5  Monitor and reassess</text><text x="800.0" y="172.0" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">The situation may keep</text><text x="800.0" y="185.2" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">moving: track decisions,</text><text x="800.0" y="198.4" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">revalidate benefits, adjust</text><text x="800.0" y="211.5" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">again.</text><text x="22.0" y="298.0" font-size="13" font-weight="bold" fill="#1f2937" text-anchor="start">If this changes, typically do this</text><rect x="22.0" y="310.0" width="462.0" height="64.0" rx="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.2"/><text x="32.0" y="328.0" font-size="11.2" font-weight="bold" fill="#1e3a8a" text-anchor="start">New sponsor or key stakeholder</text><text x="32.0" y="343.0" font-size="10.6" font-weight="normal" fill="#1f2937" text-anchor="start">Brief them, reconfirm objectives, success criteria and support; update the stakeholder register</text><text x="32.0" y="355.7" font-size="10.6" font-weight="normal" fill="#1f2937" text-anchor="start">and engagement plan</text><rect x="498.0" y="310.0" width="462.0" height="64.0" rx="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.2"/><text x="508.0" y="328.0" font-size="11.2" font-weight="bold" fill="#1e3a8a" text-anchor="start">Team members reassigned</text><text x="508.0" y="343.0" font-size="10.6" font-weight="normal" fill="#1f2937" text-anchor="start">Plan the transition with the new leaders; hand over knowledge; update the resource plan and</text><text x="508.0" y="355.7" font-size="10.6" font-weight="normal" fill="#1f2937" text-anchor="start">schedule through change control</text><rect x="22.0" y="382.0" width="462.0" height="64.0" rx="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.2"/><text x="32.0" y="400.0" font-size="11.2" font-weight="bold" fill="#1e3a8a" text-anchor="start">Strategy or priorities shift</text><text x="32.0" y="415.0" font-size="10.6" font-weight="normal" fill="#1f2937" text-anchor="start">Revalidate the business case and benefits with the sponsor; recommend continue, adapt or</text><text x="32.0" y="427.7" font-size="10.6" font-weight="normal" fill="#1f2937" text-anchor="start">stop through governance</text><rect x="498.0" y="382.0" width="462.0" height="64.0" rx="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.2"/><text x="508.0" y="400.0" font-size="11.2" font-weight="bold" fill="#1e3a8a" text-anchor="start">Funding or headcount cut</text><text x="508.0" y="415.0" font-size="10.6" font-weight="normal" fill="#1f2937" text-anchor="start">Reprioritize scope or backlog with the sponsor; use change control; update the risk register</text><rect x="22.0" y="454.0" width="462.0" height="64.0" rx="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.2"/><text x="32.0" y="472.0" font-size="11.2" font-weight="bold" fill="#1e3a8a" text-anchor="start">New approval path or policy</text><text x="32.0" y="487.0" font-size="10.6" font-weight="normal" fill="#1f2937" text-anchor="start">Update governance, procurement and compliance plans; inform those affected; adjust the</text><text x="32.0" y="499.7" font-size="10.6" font-weight="normal" fill="#1f2937" text-anchor="start">schedule</text><rect x="498.0" y="454.0" width="462.0" height="64.0" rx="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.2"/><text x="508.0" y="472.0" font-size="11.2" font-weight="bold" fill="#1e3a8a" text-anchor="start">New platform, vendor or tool after a merger</text><text x="508.0" y="487.0" font-size="10.6" font-weight="normal" fill="#1f2937" text-anchor="start">Assess integration, contracts and dependencies with procurement and the sponsor; re-plan</text><rect x="22.0" y="528.0" width="936.0" height="50.8" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/><text x="34.0" y="548.0" font-size="11" font-weight="bold" fill="#7f1d1d" text-anchor="start">Do not: pause all work or carry on unchanged · decide alone beyond your authority · spread unconfirmed rumors · reassign people or change scope without the agreed</text><text x="34.0" y="561.4" font-size="11" font-weight="bold" fill="#7f1d1d" text-anchor="start">process.</text></svg>