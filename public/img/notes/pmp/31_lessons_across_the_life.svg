<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 514" width="980" height="514" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">Utilize lessons learned: before, during and after</title><desc id="d">Lessons are pulled in from the lessons learned repository at the start, captured in the lessons learned register during execution through retrospectives, after-action reviews and in-progress postmortems, applied at once to the plan and backlog, analyzed at phase end, and transferred to the repository at closure for the next project.</desc><defs><marker id="ah0" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker></defs><rect x="0.75" y="0.75" width="978.5" height="512.5" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><text x="20.0" y="28.0" font-size="18" font-weight="bold" fill="#1f2937" text-anchor="start">Utilize lessons learned: before, during and after</text><text x="20.0" y="48.0" font-size="12" font-weight="normal" fill="#6b7280" text-anchor="start">Pull lessons in at the start, capture and apply them as the work proceeds, hand them to the organization at the end</text><rect x="22.0" y="64.0" width="222.0" height="166.0" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="34.0" y="86.0" font-size="12.5" font-weight="bold" fill="#1e3a8a" text-anchor="start">1  Start and plan</text><text x="34.0" y="106.0" font-size="10.8" font-weight="bold" fill="#6b7280" text-anchor="start">•</text><text x="46.0" y="106.0" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">Consult the repository and historical</text><text x="46.0" y="119.2" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">information</text><text x="34.0" y="136.4" font-size="10.8" font-weight="bold" fill="#6b7280" text-anchor="start">•</text><text x="46.0" y="136.4" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">Talk to people from similar projects</text><text x="34.0" y="153.5" font-size="10.8" font-weight="bold" fill="#6b7280" text-anchor="start">•</text><text x="46.0" y="153.5" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">Use the lessons to tailor the approach,</text><text x="46.0" y="166.7" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">estimate, find risks (checklists) and</text><text x="46.0" y="179.9" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">pick templates</text><line x1="245.0" y1="147.0" x2="259.0" y2="147.0" stroke="#1f2937" stroke-width="2.2" marker-end="url(#ah0)"/><rect x="260.0" y="64.0" width="222.0" height="166.0" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="272.0" y="86.0" font-size="12.5" font-weight="bold" fill="#14532d" text-anchor="start">2  Execute and control</text><text x="272.0" y="106.0" font-size="10.8" font-weight="bold" fill="#6b7280" text-anchor="start">•</text><text x="284.0" y="106.0" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">Capture as events happen:</text><text x="284.0" y="119.2" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">retrospective at least every iteration,</text><text x="284.0" y="132.4" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">after-action review after a milestone,</text><text x="284.0" y="145.5" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">in-progress postmortem at stages</text><text x="272.0" y="162.7" font-size="10.8" font-weight="bold" fill="#6b7280" text-anchor="start">•</text><text x="284.0" y="162.7" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">Apply at once: reorder the backlog,</text><text x="284.0" y="175.9" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">adjust the plan, change working</text><text x="284.0" y="189.1" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">agreements</text><line x1="483.0" y1="147.0" x2="497.0" y2="147.0" stroke="#1f2937" stroke-width="2.2" marker-end="url(#ah0)"/><rect x="498.0" y="64.0" width="222.0" height="166.0" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="510.0" y="86.0" font-size="12.5" font-weight="bold" fill="#78350f" text-anchor="start">3  Phase or release end</text><text x="510.0" y="106.0" font-size="10.8" font-weight="bold" fill="#6b7280" text-anchor="start">•</text><text x="522.0" y="106.0" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">Retrospective and formal acceptance</text><text x="510.0" y="123.2" font-size="10.8" font-weight="bold" fill="#6b7280" text-anchor="start">•</text><text x="522.0" y="123.2" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">Analyze the entries for patterns and</text><text x="522.0" y="136.4" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">common issues</text><text x="510.0" y="153.5" font-size="10.8" font-weight="bold" fill="#6b7280" text-anchor="start">•</text><text x="522.0" y="153.5" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">Carry the lessons into the next phase</text><text x="522.0" y="166.7" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">before it starts</text><line x1="721.0" y1="147.0" x2="735.0" y2="147.0" stroke="#1f2937" stroke-width="2.2" marker-end="url(#ah0)"/><rect x="736.0" y="64.0" width="222.0" height="166.0" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.6"/><text x="748.0" y="86.0" font-size="12.5" font-weight="bold" fill="#4c1d95" text-anchor="start">4  Project close</text><text x="748.0" y="106.0" font-size="10.8" font-weight="bold" fill="#6b7280" text-anchor="start">•</text><text x="760.0" y="106.0" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">Final lessons session for the</text><text x="760.0" y="119.2" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">project-level lessons</text><text x="748.0" y="136.4" font-size="10.8" font-weight="bold" fill="#6b7280" text-anchor="start">•</text><text x="760.0" y="136.4" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">Archive; make them searchable and</text><text x="760.0" y="149.5" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">walk the next team through the key</text><text x="760.0" y="162.7" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">ones</text><text x="748.0" y="179.9" font-size="10.8" font-weight="bold" fill="#6b7280" text-anchor="start">•</text><text x="760.0" y="179.9" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">Forward suggested policy and</text><text x="760.0" y="193.1" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">procedure improvements to the</text><text x="760.0" y="206.2" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">owning unit</text><rect x="260.0" y="256.0" width="460.0" height="66.0" rx="10" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.7"/><text x="272.0" y="277.0" font-size="12.5" font-weight="bold" fill="#134e4a" text-anchor="start">Lessons learned register (a project document)</text><text x="272.0" y="294.0" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">Category, description, impact, recommendation, proposed action. Created early by</text><text x="272.0" y="307.2" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">Manage Project Knowledge; read and updated by many processes; the people doing the</text><text x="272.0" y="320.4" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">work help capture it.</text><line x1="371.0" y1="231.0" x2="371.0" y2="255.0" stroke="#1f2937" stroke-width="2.0" marker-end="url(#ah0)"/><text x="379.0" y="248.0" font-size="10.5" font-weight="bold" fill="#6b7280" text-anchor="start">capture</text><line x1="609.0" y1="255.0" x2="609.0" y2="231.0" stroke="#1f2937" stroke-width="2.0" marker-end="url(#ah0)"/><text x="617.0" y="248.0" font-size="10.5" font-weight="bold" fill="#6b7280" text-anchor="start">analyze and apply</text><rect x="22.0" y="358.0" width="936.0" height="62.0" rx="10" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.7"/><text x="34.0" y="380.0" font-size="12.5" font-weight="bold" fill="#374151" text-anchor="start">Lessons learned repository (an organizational process asset)</text><text x="34.0" y="400.0" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="start">Holds lessons and historical information from earlier projects; receives this project's lessons when the project or phase ends.</text><line x1="133.0" y1="357.0" x2="133.0" y2="231.0" stroke="#1f2937" stroke-width="2.0" marker-end="url(#ah0)"/><text x="141.0" y="270.0" font-size="10.5" font-weight="bold" fill="#6b7280" text-anchor="start">pull in</text><line x1="847.0" y1="231.0" x2="847.0" y2="357.0" stroke="#1f2937" stroke-width="2.0" marker-end="url(#ah0)"/><text x="839.0" y="270.0" font-size="10.5" font-weight="bold" fill="#6b7280" text-anchor="end">transfer and archive</text><line x1="490.0" y1="323.0" x2="490.0" y2="357.0" stroke="#1f2937" stroke-width="2.0" marker-end="url(#ah0)"/><text x="498.0" y="344.0" font-size="10.5" font-weight="bold" fill="#6b7280" text-anchor="start">transferred at the end of a project or phase</text><rect x="22.0" y="436.0" width="936.0" height="50.8" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/><text x="34.0" y="456.0" font-size="11" font-weight="bold" fill="#78350f" text-anchor="start">Utilize means apply: a lesson that changes no plan, backlog, checklist or procedure has not been used. Lessons are incorporated during the ongoing processes, not only at</text><text x="34.0" y="469.4" font-size="11" font-weight="bold" fill="#78350f" text-anchor="start">the end.</text></svg>