<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 494" width="980" height="494" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">The project closure sequence</title><desc id="d">Five gates: set closure criteria early; verify deliverables and obtain formal acceptance; validate transition readiness; conclude financial, procurement, resource, records and lessons activities; authorize completion. If criteria are not met, fix or renegotiate and check again instead of closing. Phases, iterations, contracts and terminated projects close in the same way.</desc><defs><marker id="ah0" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker><marker id="ah1" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker></defs><rect x="0.75" y="0.75" width="978.5" height="492.5" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><text x="20.0" y="28.0" font-size="18" font-weight="bold" fill="#1f2937" text-anchor="start">Manage project closure</text><text x="20.0" y="48.0" font-size="12" font-weight="normal" fill="#6b7280" text-anchor="start">Each ECO enabler is a gate: do not close until it is passed</text><rect x="22.0" y="64.0" width="172.0" height="204.0" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.7"/><text x="32.0" y="86.0" font-size="12.5" font-weight="bold" fill="#1e3a8a" text-anchor="start">1  Set the criteria</text><text x="32.0" y="104.0" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">Agree exit criteria early with the</text><text x="32.0" y="117.2" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">sponsor and customer:</text><text x="32.0" y="130.4" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">acceptance, quality,</text><text x="32.0" y="143.5" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">compliance, transition,</text><text x="32.0" y="156.7" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">administrative, contractual and</text><text x="32.0" y="169.9" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">value.</text><rect x="30.0" y="238.0" width="120.4" height="20.0" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="1.2"/><text x="90.2" y="252.0" font-size="9.5" font-weight="bold" fill="#1e3a8a" text-anchor="middle">ECO: determine criteria</text><line x1="195.0" y1="166.0" x2="213.0" y2="166.0" stroke="#1f2937" stroke-width="2.2" marker-end="url(#ah0)"/><rect x="214.0" y="64.0" width="172.0" height="204.0" rx="10" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.7"/><text x="224.0" y="86.0" font-size="12.5" font-weight="bold" fill="#134e4a" text-anchor="start">2  Obtain acceptance</text><text x="224.0" y="104.0" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">Verify the deliverables; the</text><text x="224.0" y="117.2" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">customer formally accepts</text><text x="224.0" y="130.4" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">them against the acceptance</text><text x="224.0" y="143.5" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">criteria; vendors' work is</text><text x="224.0" y="156.7" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">accepted; issues are resolved.</text><rect x="222.0" y="238.0" width="136.3" height="20.0" rx="10" fill="#ffffff" stroke="#0d9488" stroke-width="1.2"/><text x="290.1" y="252.0" font-size="9.5" font-weight="bold" fill="#134e4a" text-anchor="middle">ECO: stakeholder approval</text><line x1="387.0" y1="166.0" x2="405.0" y2="166.0" stroke="#1f2937" stroke-width="2.2" marker-end="url(#ah0)"/><rect x="406.0" y="64.0" width="172.0" height="204.0" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.7"/><text x="416.0" y="86.0" font-size="12.5" font-weight="bold" fill="#78350f" text-anchor="start">3  Validate readiness</text><text x="416.0" y="104.0" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">The receiving team is trained,</text><text x="416.0" y="117.2" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">equipped and supported; open</text><text x="416.0" y="130.4" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">items and risks are handed</text><text x="416.0" y="143.5" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">over; a benefits owner is</text><text x="416.0" y="156.7" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">named.</text><rect x="414.0" y="238.0" width="121.9" height="20.0" rx="10" fill="#ffffff" stroke="#d97706" stroke-width="1.2"/><text x="475.0" y="252.0" font-size="9.5" font-weight="bold" fill="#78350f" text-anchor="middle">ECO: validate transition</text><line x1="579.0" y1="166.0" x2="597.0" y2="166.0" stroke="#1f2937" stroke-width="2.2" marker-end="url(#ah0)"/><rect x="598.0" y="64.0" width="172.0" height="204.0" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.7"/><text x="608.0" y="86.0" font-size="12.5" font-weight="bold" fill="#4c1d95" text-anchor="start">4  Conclude activities</text><text x="608.0" y="104.0" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">Financials, contracts and</text><text x="608.0" y="117.2" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">claims, resources, records,</text><text x="608.0" y="130.4" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">final lessons and the final</text><text x="608.0" y="143.5" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">report are finished.</text><rect x="606.0" y="238.0" width="125.7" height="20.0" rx="10" fill="#ffffff" stroke="#7c3aed" stroke-width="1.2"/><text x="668.9" y="252.0" font-size="9.5" font-weight="bold" fill="#4c1d95" text-anchor="middle">ECO: conclude activities</text><line x1="771.0" y1="166.0" x2="789.0" y2="166.0" stroke="#1f2937" stroke-width="2.2" marker-end="url(#ah0)"/><rect x="790.0" y="64.0" width="172.0" height="204.0" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.7"/><text x="800.0" y="86.0" font-size="12.5" font-weight="bold" fill="#14532d" text-anchor="start">5  Authorize completion</text><text x="800.0" y="104.0" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">The sponsor or governance</text><text x="800.0" y="117.2" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">authorizes closure;</text><text x="800.0" y="130.4" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">stakeholders are told; benefits</text><text x="800.0" y="143.5" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">tracking continues with the</text><text x="800.0" y="156.7" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">owner.</text><rect x="798.0" y="238.0" width="136.3" height="20.0" rx="10" fill="#ffffff" stroke="#16a34a" stroke-width="1.2"/><text x="866.1" y="252.0" font-size="9.5" font-weight="bold" fill="#14532d" text-anchor="middle">ECO: stakeholder approval</text><polyline points="684.0,269.0 684.0,292.0 300.0,292.0 300.0,270.0" fill="none" stroke="#dc2626" stroke-width="2.0" stroke-dasharray="6 4" marker-end="url(#ah1)" stroke-linejoin="round"/><text x="492.0" y="308.0" font-size="11" font-weight="bold" fill="#7f1d1d" text-anchor="middle">Criteria not met or a gap found: fix or renegotiate, then re-check; do not close</text><rect x="22.0" y="328.0" width="300.0" height="136.0" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="34.0" y="350.0" font-size="12.5" font-weight="bold" fill="#1e3a8a" text-anchor="start">Phase, release or iteration</text><text x="34.0" y="370.0" font-size="10.6" font-weight="bold" fill="#6b7280" text-anchor="start">•</text><text x="46.0" y="370.0" font-size="10.6" font-weight="normal" fill="#1f2937" text-anchor="start">Closes with acceptance, even if the sponsor continues</text><text x="34.0" y="386.9" font-size="10.6" font-weight="bold" fill="#6b7280" text-anchor="start">•</text><text x="46.0" y="386.9" font-size="10.6" font-weight="normal" fill="#1f2937" text-anchor="start">Lessons and open risks pass to the next phase</text><text x="34.0" y="403.9" font-size="10.6" font-weight="bold" fill="#6b7280" text-anchor="start">•</text><text x="46.0" y="403.9" font-size="10.6" font-weight="normal" fill="#1f2937" text-anchor="start">Adaptive: finished backlog items, retrospective, transfer</text><text x="46.0" y="416.8" font-size="10.6" font-weight="normal" fill="#1f2937" text-anchor="start">of the rest to the product owner</text><rect x="340.0" y="328.0" width="300.0" height="136.0" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="1.6"/><text x="352.0" y="350.0" font-size="12.5" font-weight="bold" fill="#7f1d1d" text-anchor="start">Early termination</text><text x="352.0" y="370.0" font-size="10.6" font-weight="bold" fill="#6b7280" text-anchor="start">•</text><text x="364.0" y="370.0" font-size="10.6" font-weight="normal" fill="#1f2937" text-anchor="start">Value achieved (positive cause) or no longer achievable</text><text x="364.0" y="382.9" font-size="10.6" font-weight="normal" fill="#1f2937" text-anchor="start">(negative cause)</text><text x="352.0" y="399.9" font-size="10.6" font-weight="bold" fill="#6b7280" text-anchor="start">•</text><text x="364.0" y="399.9" font-size="10.6" font-weight="normal" fill="#1f2937" text-anchor="start">Still closes formally: document delivered work, reasons</text><text x="364.0" y="412.8" font-size="10.6" font-weight="normal" fill="#1f2937" text-anchor="start">and lessons</text><text x="352.0" y="429.7" font-size="10.6" font-weight="bold" fill="#6b7280" text-anchor="start">•</text><text x="364.0" y="429.7" font-size="10.6" font-weight="normal" fill="#1f2937" text-anchor="start">Settle contracts, release resources</text><rect x="658.0" y="328.0" width="300.0" height="136.0" rx="10" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.6"/><text x="670.0" y="350.0" font-size="12.5" font-weight="bold" fill="#134e4a" text-anchor="start">Contract</text><text x="670.0" y="370.0" font-size="10.6" font-weight="bold" fill="#6b7280" text-anchor="start">•</text><text x="682.0" y="370.0" font-size="10.6" font-weight="normal" fill="#1f2937" text-anchor="start">Formal acceptance of the seller's work</text><text x="670.0" y="386.9" font-size="10.6" font-weight="bold" fill="#6b7280" text-anchor="start">•</text><text x="682.0" y="386.9" font-size="10.6" font-weight="normal" fill="#1f2937" text-anchor="start">Claims, guarantees and warranties finalized; invoices</text><text x="682.0" y="399.9" font-size="10.6" font-weight="normal" fill="#1f2937" text-anchor="start">paid</text><text x="670.0" y="416.8" font-size="10.6" font-weight="bold" fill="#6b7280" text-anchor="start">•</text><text x="682.0" y="416.8" font-size="10.6" font-weight="normal" fill="#1f2937" text-anchor="start">Disputes resolved or referred; records archived</text></svg>