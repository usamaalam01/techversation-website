<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 540" width="980" height="540" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">Communications processes and the communications management plan</title><desc id="d">Plan Communications Management, Manage Communications and Monitor Communications, all in the Stakeholders performance domain, and the main contents of the communications management plan.</desc><defs><marker id="ah0" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker></defs><rect x="0.75" y="0.75" width="978.5" height="538.5" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><text x="20.0" y="28.0" font-size="18" font-weight="bold" fill="#1f2937" text-anchor="start">Communications processes (Stakeholders domain)</text><text x="20.0" y="48.0" font-size="12" font-weight="normal" fill="#6b7280" text-anchor="start">PMBOK 8 §2.5: plan how to communicate, do it, and check that information needs are met</text><rect x="20.0" y="66.0" width="300.0" height="42.0" rx="8" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.6"/><text x="170.0" y="91.2" font-size="13" font-weight="bold" fill="#134e4a" text-anchor="middle">Plan Communications Management</text><rect x="20.0" y="114.0" width="300.0" height="150.0" rx="8" fill="#ffffff" stroke="#0d9488" stroke-width="1.5"/><text x="30.0" y="132.0" font-size="10.3" font-weight="bold" fill="#6b7280" text-anchor="start">Planning</text><text x="30.0" y="148.0" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="start">Plan how to communicate with identified stakeholders</text><text x="30.0" y="161.4" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="start">inside and outside the team; aligned with the stakeholder</text><text x="30.0" y="174.8" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="start">engagement plan; categorize information (internal or</text><text x="30.0" y="188.3" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="start">external, sensitive or public, general or detailed)</text><text x="30.0" y="209.7" font-size="10.3" font-weight="bold" fill="#6b7280" text-anchor="start">Key outputs</text><text x="30.0" y="222.7" font-size="11" font-weight="bold" fill="#134e4a" text-anchor="start">Communications management plan, stakeholder</text><text x="30.0" y="235.9" font-size="11" font-weight="bold" fill="#134e4a" text-anchor="start">engagement plan updates</text><line x1="321.0" y1="87.0" x2="339.0" y2="87.0" stroke="#1f2937" stroke-width="2" marker-end="url(#ah0)"/><rect x="340.0" y="66.0" width="300.0" height="42.0" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="490.0" y="91.2" font-size="13" font-weight="bold" fill="#14532d" text-anchor="middle">Manage Communications</text><rect x="340.0" y="114.0" width="300.0" height="150.0" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/><text x="350.0" y="132.0" font-size="10.3" font-weight="bold" fill="#6b7280" text-anchor="start">Executing</text><text x="350.0" y="148.0" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="start">Set up and conduct communications: timely and</text><text x="350.0" y="161.4" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="start">appropriate collection, creation, distribution, storage,</text><text x="350.0" y="174.8" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="start">retrieval, management, monitoring and disposition of</text><text x="350.0" y="188.3" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="start">project information</text><text x="350.0" y="209.7" font-size="10.3" font-weight="bold" fill="#6b7280" text-anchor="start">Key outputs</text><text x="350.0" y="222.7" font-size="11" font-weight="bold" fill="#14532d" text-anchor="start">Project communications, plan updates, issue and</text><text x="350.0" y="235.9" font-size="11" font-weight="bold" fill="#14532d" text-anchor="start">lessons learned updates</text><line x1="641.0" y1="87.0" x2="659.0" y2="87.0" stroke="#1f2937" stroke-width="2" marker-end="url(#ah0)"/><rect x="660.0" y="66.0" width="300.0" height="42.0" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="810.0" y="91.2" font-size="13" font-weight="bold" fill="#78350f" text-anchor="middle">Monitor Communications</text><rect x="660.0" y="114.0" width="300.0" height="150.0" rx="8" fill="#ffffff" stroke="#d97706" stroke-width="1.5"/><text x="670.0" y="132.0" font-size="10.3" font-weight="bold" fill="#6b7280" text-anchor="start">Monitoring and Controlling</text><text x="670.0" y="148.0" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="start">Make sure the information needs of the project and its</text><text x="670.0" y="161.4" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="start">stakeholders are met; optimal information flow as the</text><text x="670.0" y="174.8" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="start">plans define</text><text x="670.0" y="196.3" font-size="10.3" font-weight="bold" fill="#6b7280" text-anchor="start">Key outputs</text><text x="670.0" y="209.3" font-size="11" font-weight="bold" fill="#78350f" text-anchor="start">Work performance information, change requests,</text><text x="670.0" y="222.5" font-size="11" font-weight="bold" fill="#78350f" text-anchor="start">plan updates</text><rect x="20.0" y="280.0" width="940.0" height="244.0" rx="8" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.3"/><text x="32.0" y="302.0" font-size="13" font-weight="bold" fill="#1f2937" text-anchor="start">What the communications management plan covers</text><text x="32.0" y="324.0" font-size="11" font-weight="bold" fill="#6b7280" text-anchor="start">•</text><text x="44.0" y="324.0" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="start">Stakeholder communication requirements</text><text x="32.0" y="342.2" font-size="11" font-weight="bold" fill="#6b7280" text-anchor="start">•</text><text x="44.0" y="342.2" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="start">Information to communicate: language, format, content, level of detail</text><text x="32.0" y="360.4" font-size="11" font-weight="bold" fill="#6b7280" text-anchor="start">•</text><text x="44.0" y="360.4" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="start">Reason for distributing it</text><text x="32.0" y="378.6" font-size="11" font-weight="bold" fill="#6b7280" text-anchor="start">•</text><text x="44.0" y="378.6" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="start">Timing and frequency, and any acknowledgment or response expected</text><text x="32.0" y="396.8" font-size="11" font-weight="bold" fill="#6b7280" text-anchor="start">•</text><text x="44.0" y="396.8" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="start">Who communicates, and who authorizes release of confidential information</text><text x="32.0" y="415.0" font-size="11" font-weight="bold" fill="#6b7280" text-anchor="start">•</text><text x="44.0" y="415.0" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="start">Who receives it, with their needs and expectations</text><text x="32.0" y="433.2" font-size="11" font-weight="bold" fill="#6b7280" text-anchor="start">•</text><text x="44.0" y="433.2" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="start">Methods and technologies (memos, email, press releases, social media)</text><text x="500.0" y="324.0" font-size="11" font-weight="bold" fill="#6b7280" text-anchor="start">•</text><text x="512.0" y="324.0" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="start">Resources for communication activities: time and budget</text><text x="500.0" y="342.2" font-size="11" font-weight="bold" fill="#6b7280" text-anchor="start">•</text><text x="512.0" y="342.2" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="start">Escalation processes</text><text x="500.0" y="360.4" font-size="11" font-weight="bold" fill="#6b7280" text-anchor="start">•</text><text x="512.0" y="360.4" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="start">How the plan is updated as phases and stakeholders change</text><text x="500.0" y="378.6" font-size="11" font-weight="bold" fill="#6b7280" text-anchor="start">•</text><text x="512.0" y="378.6" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="start">Glossary of common terms</text><text x="500.0" y="396.8" font-size="11" font-weight="bold" fill="#6b7280" text-anchor="start">•</text><text x="512.0" y="396.8" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="start">Information flow charts, workflows with authorization sequence, list of reports, meeting</text><text x="512.0" y="410.0" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="start">plans</text><text x="500.0" y="428.2" font-size="11" font-weight="bold" fill="#6b7280" text-anchor="start">•</text><text x="512.0" y="428.2" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="start">Constraints from legislation, regulations, technology and organizational policies</text><text x="500.0" y="446.4" font-size="11" font-weight="bold" fill="#6b7280" text-anchor="start">•</text><text x="512.0" y="446.4" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="start">Guidelines and templates for status meetings, team and virtual meetings, and email</text><rect x="32.0" y="470.0" width="916.0" height="40.0" rx="8" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.6"/><text x="490.0" y="486.7" font-size="11" font-weight="normal" fill="#134e4a" text-anchor="middle">The plan is both an input (who gets what, when, how) and a living output: revise it when scope, stakeholders, team structure or environment change; review it periodically and tailor it to</text><text x="490.0" y="500.4" font-size="11" font-weight="normal" fill="#134e4a" text-anchor="middle">stakeholder needs.</text></svg>