<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 530" width="980" height="530" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">Events during execution and where they go</title><desc id="d">A routing table for common execution events: new scope request, defect, impediment, risk event, approved change, team conflict, knowledge or lesson, variance beyond threshold, and external change, with the first action, owner, record and topic.</desc><defs></defs><rect x="0.75" y="0.75" width="978.5" height="528.5" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><text x="20.0" y="28.0" font-size="18" font-weight="bold" fill="#1f2937" text-anchor="start">Where does an execution event go?</text><text x="20.0" y="48.0" font-size="12" font-weight="normal" fill="#6b7280" text-anchor="start">First action, owner and record for the events a project manager meets every week</text><rect x="20.0" y="64.0" width="940.0" height="28.0" rx="4" fill="#1e3a8a" stroke="#1e3a8a" stroke-width="1"/><text x="30.0" y="83.0" font-size="11.5" font-weight="bold" fill="#ffffff" text-anchor="start">Event</text><text x="220.0" y="83.0" font-size="11.5" font-weight="bold" fill="#ffffff" text-anchor="start">First action</text><text x="600.0" y="83.0" font-size="11.5" font-weight="bold" fill="#ffffff" text-anchor="start">Owner</text><text x="730.0" y="83.0" font-size="11.5" font-weight="bold" fill="#ffffff" text-anchor="start">Record</text><text x="900.0" y="83.0" font-size="11.5" font-weight="bold" fill="#ffffff" text-anchor="start">Topic</text><rect x="20.0" y="92.0" width="940.0" height="46.0" rx="0" fill="#ffffff" stroke="#d1d5db" stroke-width="1"/><rect x="20.0" y="92.0" width="6.0" height="46.0" rx="0" fill="#2563eb" stroke="#2563eb" stroke-width="1"/><text x="34.0" y="110.0" font-size="11" font-weight="bold" fill="#1e3a8a" text-anchor="start">New request that changes</text><text x="34.0" y="122.7" font-size="11" font-weight="bold" fill="#1e3a8a" text-anchor="start">scope</text><text x="220.0" y="110.0" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">Predictive: raise a change request and assess impact. Adaptive: product</text><text x="220.0" y="122.4" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">owner prioritizes it in the backlog</text><text x="600.0" y="110.0" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">CCB / product owner</text><text x="730.0" y="110.0" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">Change log, backlog</text><text x="900.0" y="119.0" font-size="11" font-weight="bold" fill="#6b7280" text-anchor="start">29, 15</text><rect x="20.0" y="138.0" width="940.0" height="46.0" rx="0" fill="#f9fafb" stroke="#d1d5db" stroke-width="1"/><rect x="20.0" y="138.0" width="6.0" height="46.0" rx="0" fill="#16a34a" stroke="#16a34a" stroke-width="1"/><text x="34.0" y="156.0" font-size="11" font-weight="bold" fill="#14532d" text-anchor="start">Defect found in a deliverable</text><text x="220.0" y="156.0" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">Repair per the quality plan and re-verify; look for the root cause if it repeats</text><text x="600.0" y="156.0" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">Team, quality</text><text x="730.0" y="156.0" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">Quality report</text><text x="900.0" y="165.0" font-size="11" font-weight="bold" fill="#6b7280" text-anchor="start">18</text><rect x="20.0" y="184.0" width="940.0" height="46.0" rx="0" fill="#ffffff" stroke="#d1d5db" stroke-width="1"/><rect x="20.0" y="184.0" width="6.0" height="46.0" rx="0" fill="#d97706" stroke="#d97706" stroke-width="1"/><text x="34.0" y="202.0" font-size="11" font-weight="bold" fill="#78350f" text-anchor="start">Team blocked by an</text><text x="34.0" y="214.7" font-size="11" font-weight="bold" fill="#78350f" text-anchor="start">impediment</text><text x="220.0" y="202.0" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">Evaluate impact and remove it or escalate; do not just log it again</text><text x="600.0" y="202.0" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">Project manager</text><text x="730.0" y="202.0" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">Issue or impediment log</text><text x="900.0" y="211.0" font-size="11" font-weight="bold" fill="#6b7280" text-anchor="start">30</text><rect x="20.0" y="230.0" width="940.0" height="46.0" rx="0" fill="#f9fafb" stroke="#d1d5db" stroke-width="1"/><rect x="20.0" y="230.0" width="6.0" height="46.0" rx="0" fill="#dc2626" stroke="#dc2626" stroke-width="1"/><text x="34.0" y="248.0" font-size="11" font-weight="bold" fill="#7f1d1d" text-anchor="start">A risk occurs</text><text x="220.0" y="248.0" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">Treat as an issue: execute the planned response, inform stakeholders,</text><text x="220.0" y="260.4" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">update the register</text><text x="600.0" y="248.0" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">Risk owner</text><text x="730.0" y="248.0" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">Issue log, risk register</text><text x="900.0" y="257.0" font-size="11" font-weight="bold" fill="#6b7280" text-anchor="start">21, 30</text><rect x="20.0" y="276.0" width="940.0" height="46.0" rx="0" fill="#ffffff" stroke="#d1d5db" stroke-width="1"/><rect x="20.0" y="276.0" width="6.0" height="46.0" rx="0" fill="#7c3aed" stroke="#7c3aed" stroke-width="1"/><text x="34.0" y="294.0" font-size="11" font-weight="bold" fill="#4c1d95" text-anchor="start">Change approved</text><text x="220.0" y="294.0" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">Implement it; update plans, baselines, schedule and documents;</text><text x="220.0" y="306.4" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">communicate</text><text x="600.0" y="294.0" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">Project manager, team</text><text x="730.0" y="294.0" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">Change log, baselines</text><text x="900.0" y="303.0" font-size="11" font-weight="bold" fill="#6b7280" text-anchor="start">29</text><rect x="20.0" y="322.0" width="940.0" height="46.0" rx="0" fill="#f9fafb" stroke="#d1d5db" stroke-width="1"/><rect x="20.0" y="322.0" width="6.0" height="46.0" rx="0" fill="#0d9488" stroke="#0d9488" stroke-width="1"/><text x="34.0" y="340.0" font-size="11" font-weight="bold" fill="#134e4a" text-anchor="start">Conflict between people or</text><text x="34.0" y="352.6" font-size="11" font-weight="bold" fill="#134e4a" text-anchor="start">groups</text><text x="220.0" y="340.0" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">Address early; find the source; facilitate an agreed resolution</text><text x="600.0" y="340.0" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">Project manager</text><text x="730.0" y="340.0" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">Issue log if needed</text><text x="900.0" y="349.0" font-size="11" font-weight="bold" fill="#6b7280" text-anchor="start">26</text><rect x="20.0" y="368.0" width="940.0" height="46.0" rx="0" fill="#ffffff" stroke="#d1d5db" stroke-width="1"/><rect x="20.0" y="368.0" width="6.0" height="46.0" rx="0" fill="#9ca3af" stroke="#9ca3af" stroke-width="1"/><text x="34.0" y="386.0" font-size="11" font-weight="bold" fill="#374151" text-anchor="start">New knowledge or a lesson</text><text x="220.0" y="386.0" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">Capture it now, share it, and use it in later work packages</text><text x="600.0" y="386.0" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">Team</text><text x="730.0" y="386.0" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">Lessons learned register</text><text x="900.0" y="395.0" font-size="11" font-weight="bold" fill="#6b7280" text-anchor="start">27</text><rect x="20.0" y="414.0" width="940.0" height="46.0" rx="0" fill="#f9fafb" stroke="#d1d5db" stroke-width="1"/><rect x="20.0" y="414.0" width="6.0" height="46.0" rx="0" fill="#d97706" stroke="#d97706" stroke-width="1"/><text x="34.0" y="432.0" font-size="11" font-weight="bold" fill="#78350f" text-anchor="start">Variance beyond threshold</text><text x="220.0" y="432.0" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">Find the cause, forecast, propose corrective action; escalate beyond</text><text x="220.0" y="444.4" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">authority</text><text x="600.0" y="432.0" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">Project manager</text><text x="730.0" y="432.0" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">Work performance reports</text><text x="900.0" y="441.0" font-size="11" font-weight="bold" fill="#6b7280" text-anchor="start">28, 29</text><rect x="20.0" y="460.0" width="940.0" height="46.0" rx="0" fill="#ffffff" stroke="#d1d5db" stroke-width="1"/><rect x="20.0" y="460.0" width="6.0" height="46.0" rx="0" fill="#2563eb" stroke="#2563eb" stroke-width="1"/><text x="34.0" y="478.0" font-size="11" font-weight="bold" fill="#1e3a8a" text-anchor="start">External change (rule, market,</text><text x="34.0" y="490.6" font-size="11" font-weight="bold" fill="#1e3a8a" text-anchor="start">technology)</text><text x="220.0" y="478.0" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">Assess impact on scope and backlog; reprioritize or raise a change</text><text x="600.0" y="478.0" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">PM with sponsor</text><text x="730.0" y="478.0" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">Change log, backlog</text><text x="900.0" y="487.0" font-size="11" font-weight="bold" fill="#6b7280" text-anchor="start">33</text></svg>