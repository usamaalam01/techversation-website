<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 560" width="980" height="560" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">Contract types and who carries the cost risk</title><desc id="d">Fixed-price puts cost risk on the seller; cost-reimbursable puts it on the buyer; target-cost shares savings and overruns; time and materials is a hybrid. Common names for variants and emerging contracting practices are listed.</desc><defs></defs><rect x="0.75" y="0.75" width="978.5" height="558.5" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><text x="20.0" y="28.0" font-size="18" font-weight="bold" fill="#1f2937" text-anchor="start">Contract types: who carries the cost risk?</text><text x="20.0" y="48.0" font-size="12" font-weight="normal" fill="#6b7280" text-anchor="start">Pick the type by how well the scope is defined, how risky the work is, and what flexibility is needed</text><rect x="20.0" y="62.0" width="940.0" height="30.0" rx="15" fill="#f3f4f6" stroke="#d1d5db" stroke-width="1.2"/><polygon points="20.0,62.0 20.0,92.0 6.0,77.0" fill="#16a34a" stroke="#16a34a" stroke-width="1"/><text x="40.0" y="82.0" font-size="11.5" font-weight="bold" fill="#14532d" text-anchor="start">Seller carries the cost risk; buyer has budget certainty</text><text x="940.0" y="82.0" font-size="11.5" font-weight="bold" fill="#7f1d1d" text-anchor="end">Buyer carries the cost risk; maximum flexibility</text><polygon points="960.0,62.0 960.0,92.0 974.0,77.0" fill="#dc2626" stroke="#dc2626" stroke-width="1"/><rect x="20.0" y="102.0" width="225.0" height="244.0" rx="10" fill="#ffffff" stroke="#16a34a" stroke-width="1.6"/><rect x="20.0" y="102.0" width="225.0" height="34.0" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="132.5" y="124.0" font-size="12.5" font-weight="bold" fill="#14532d" text-anchor="middle">Fixed-price</text><text x="30.0" y="154.0" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">Predetermined fee for a clearly defined</text><text x="30.0" y="167.2" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">scope; transfers cost risk to the seller.</text><text x="30.0" y="188.4" font-size="10" font-weight="bold" fill="#6b7280" text-anchor="start">Use when</text><text x="30.0" y="201.4" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">Scope can be estimated accurately:</text><text x="30.0" y="214.5" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">construction, product development,</text><text x="30.0" y="227.7" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">service delivery.</text><text x="30.0" y="248.9" font-size="10" font-weight="bold" fill="#6b7280" text-anchor="start">Buyer</text><text x="30.0" y="261.9" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">Budget certainty; may pay risk premiums.</text><text x="30.0" y="283.1" font-size="10" font-weight="bold" fill="#6b7280" text-anchor="start">Seller</text><text x="30.0" y="296.1" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">Profit if efficient; bears overrun risk.</text><rect x="258.0" y="102.0" width="225.0" height="244.0" rx="10" fill="#ffffff" stroke="#0d9488" stroke-width="1.6"/><rect x="258.0" y="102.0" width="225.0" height="34.0" rx="10" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.6"/><text x="370.5" y="124.0" font-size="12.5" font-weight="bold" fill="#134e4a" text-anchor="middle">Target-cost</text><text x="268.0" y="154.0" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">A target cost with agreed sharing of</text><text x="268.0" y="167.2" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">savings and overruns between buyer and</text><text x="268.0" y="180.4" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">seller.</text><text x="268.0" y="201.5" font-size="10" font-weight="bold" fill="#6b7280" text-anchor="start">Use when</text><text x="268.0" y="214.5" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">Large infrastructure or complex</text><text x="268.0" y="227.7" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">manufacturing; encourage efficiency and</text><text x="268.0" y="240.9" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">keep flexibility.</text><text x="268.0" y="262.1" font-size="10" font-weight="bold" fill="#6b7280" text-anchor="start">Buyer</text><text x="268.0" y="275.1" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">Encourages cost control; needs clear</text><text x="268.0" y="288.2" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">target and sharing rules.</text><text x="268.0" y="309.4" font-size="10" font-weight="bold" fill="#6b7280" text-anchor="start">Seller</text><text x="268.0" y="322.4" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">Incentive for efficiency; bears part of an</text><text x="268.0" y="335.6" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">overrun.</text><rect x="496.0" y="102.0" width="225.0" height="244.0" rx="10" fill="#ffffff" stroke="#d97706" stroke-width="1.6"/><rect x="496.0" y="102.0" width="225.0" height="34.0" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="608.5" y="124.0" font-size="12.5" font-weight="bold" fill="#78350f" text-anchor="middle">Time and materials (T&amp;M)</text><text x="506.0" y="154.0" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">Buyer pays actual time and materials plus</text><text x="506.0" y="167.2" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">a margin: a hybrid of fixed-price and</text><text x="506.0" y="180.4" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">cost-reimbursable.</text><text x="506.0" y="201.5" font-size="10" font-weight="bold" fill="#6b7280" text-anchor="start">Use when</text><text x="506.0" y="214.5" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">Smaller projects, maintenance, consulting,</text><text x="506.0" y="227.7" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">scope not clear at the start.</text><text x="506.0" y="248.9" font-size="10" font-weight="bold" fill="#6b7280" text-anchor="start">Buyer</text><text x="506.0" y="261.9" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">Flexible; needs close monitoring (a ceiling</text><text x="506.0" y="275.1" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">caps exposure).</text><text x="506.0" y="296.2" font-size="10" font-weight="bold" fill="#6b7280" text-anchor="start">Seller</text><text x="506.0" y="309.2" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">Costs covered; time and resources are</text><text x="506.0" y="322.4" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">scrutinized.</text><rect x="734.0" y="102.0" width="225.0" height="244.0" rx="10" fill="#ffffff" stroke="#dc2626" stroke-width="1.6"/><rect x="734.0" y="102.0" width="225.0" height="34.0" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="1.6"/><text x="846.5" y="124.0" font-size="12.5" font-weight="bold" fill="#7f1d1d" text-anchor="middle">Cost-reimbursable</text><text x="744.0" y="154.0" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">Pays the seller's actual costs plus a fee</text><text x="744.0" y="167.2" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">(typically the profit).</text><text x="744.0" y="188.4" font-size="10" font-weight="bold" fill="#6b7280" text-anchor="start">Use when</text><text x="744.0" y="201.4" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">Scope uncertain or work high risk:</text><text x="744.0" y="214.5" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">research and development, complex</text><text x="744.0" y="227.7" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">construction.</text><text x="744.0" y="248.9" font-size="10" font-weight="bold" fill="#6b7280" text-anchor="start">Buyer</text><text x="744.0" y="261.9" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">Flexible; risk of cost escalation.</text><text x="744.0" y="283.1" font-size="10" font-weight="bold" fill="#6b7280" text-anchor="start">Seller</text><text x="744.0" y="296.1" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">Lower financial risk; may limit profit.</text><rect x="20.0" y="360.0" width="460.0" height="186.0" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/><text x="32.0" y="380.0" font-size="12" font-weight="bold" fill="#78350f" text-anchor="start">Names often used on the exam [Beyond PMBOK 8]</text><text x="32.0" y="398.0" font-size="10.8" font-weight="bold" fill="#6b7280" text-anchor="start">•</text><text x="44.0" y="398.0" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">Fixed-price family: firm fixed-price (FFP), fixed-price incentive fee (FPIF), fixed-price with</text><text x="44.0" y="411.0" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">economic price adjustment (FP-EPA) for long contracts</text><text x="32.0" y="427.9" font-size="10.8" font-weight="bold" fill="#6b7280" text-anchor="start">•</text><text x="44.0" y="427.9" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">Cost-reimbursable family: cost plus fixed fee (CPFF), cost plus incentive fee (CPIF),</text><text x="44.0" y="440.9" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">cost plus award fee (CPAF)</text><text x="32.0" y="457.8" font-size="10.8" font-weight="bold" fill="#6b7280" text-anchor="start">•</text><text x="44.0" y="457.8" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">T&amp;M with a not-to-exceed value caps the buyer's exposure when scope is still evolving</text><text x="32.0" y="474.8" font-size="10.8" font-weight="bold" fill="#6b7280" text-anchor="start">•</text><text x="44.0" y="474.8" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">Hybrid contracts mix elements of both models</text><rect x="500.0" y="360.0" width="460.0" height="186.0" rx="8" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.3"/><text x="512.0" y="380.0" font-size="12" font-weight="bold" fill="#1f2937" text-anchor="start">Emerging practices (PMBOK 8)</text><text x="512.0" y="398.0" font-size="10.8" font-weight="bold" fill="#6b7280" text-anchor="start">•</text><text x="524.0" y="398.0" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">Agile contracting: flexibility and iterative delivery, for example T&amp;M with iteration-based</text><text x="524.0" y="411.0" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">deliverables</text><text x="512.0" y="427.9" font-size="10.8" font-weight="bold" fill="#6b7280" text-anchor="start">•</text><text x="524.0" y="427.9" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">Collaborative contracting: shared risk or reward, caps, reduced rates, performance</text><text x="524.0" y="440.9" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">incentives</text><text x="512.0" y="457.8" font-size="10.8" font-weight="bold" fill="#6b7280" text-anchor="start">•</text><text x="524.0" y="457.8" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">Outcome-based contracts: pay for measurable results, not prescribed processes</text><text x="512.0" y="474.8" font-size="10.8" font-weight="bold" fill="#6b7280" text-anchor="start">•</text><text x="524.0" y="474.8" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">Sustainable contracting: ESG principles with measurable outcomes</text><text x="512.0" y="491.8" font-size="10.8" font-weight="bold" fill="#6b7280" text-anchor="start">•</text><text x="524.0" y="491.8" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">Smart contracts: blockchain-based, automated execution, often milestone payments</text></svg>