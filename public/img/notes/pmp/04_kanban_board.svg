<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 430" width="980" height="430" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">Kanban board with WIP limits</title><desc id="d">Columns Ready, Develop and Unit Test, Development Done, System Test, Done with work-in-progress limits; cycle time measured from start of work to done, lead time from entering the board to delivery.</desc><defs><marker id="ah0" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/></marker><marker id="ah1" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker></defs><rect x="0.75" y="0.75" width="978.5" height="428.5" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><text x="20.0" y="28.0" font-size="18" font-weight="bold" fill="#1f2937" text-anchor="start">Task board / Kanban board: limit work in progress, manage flow</text><text x="20.0" y="48.0" font-size="12" font-weight="normal" fill="#6b7280" text-anchor="start">PMBOK 8 Figure 5-25 (redrawn). WIP limits expose bottlenecks; the team swarms when a column nears its limit</text><rect x="20.0" y="70.0" width="172.0" height="230.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><rect x="20.0" y="70.0" width="172.0" height="44.0" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.6"/><text x="106.0" y="90.0" font-size="13" font-weight="bold" fill="#374151" text-anchor="middle">Ready</text><text x="106.0" y="107.0" font-size="11" font-weight="normal" fill="#374151" text-anchor="middle">WIP limit: 8</text><rect x="38.0" y="126.0" width="136.0" height="44.0" rx="4" fill="#fef9c3" stroke="#a16207" stroke-width="1.2"/><text x="106.0" y="152.0" font-size="11.5" font-weight="bold" fill="#1f2937" text-anchor="middle">Item 1</text><rect x="38.0" y="182.0" width="136.0" height="44.0" rx="4" fill="#fef9c3" stroke="#a16207" stroke-width="1.2"/><text x="106.0" y="208.0" font-size="11.5" font-weight="bold" fill="#1f2937" text-anchor="middle">Item 2</text><rect x="38.0" y="238.0" width="136.0" height="44.0" rx="4" fill="#fef9c3" stroke="#a16207" stroke-width="1.2"/><text x="106.0" y="264.0" font-size="11.5" font-weight="bold" fill="#1f2937" text-anchor="middle">Item 3</text><rect x="202.0" y="70.0" width="172.0" height="230.0" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.6"/><rect x="202.0" y="70.0" width="172.0" height="44.0" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="288.0" y="90.0" font-size="13" font-weight="bold" fill="#1e3a8a" text-anchor="middle">Develop and unit test</text><text x="288.0" y="107.0" font-size="11" font-weight="normal" fill="#1e3a8a" text-anchor="middle">WIP limit: 3</text><rect x="220.0" y="126.0" width="136.0" height="44.0" rx="4" fill="#fef9c3" stroke="#a16207" stroke-width="1.2"/><text x="288.0" y="152.0" font-size="11.5" font-weight="bold" fill="#1f2937" text-anchor="middle">Item 1</text><rect x="220.0" y="182.0" width="136.0" height="44.0" rx="4" fill="#fef9c3" stroke="#a16207" stroke-width="1.2"/><text x="288.0" y="208.0" font-size="11.5" font-weight="bold" fill="#1f2937" text-anchor="middle">Item 2</text><rect x="220.0" y="238.0" width="136.0" height="44.0" rx="4" fill="#fef9c3" stroke="#a16207" stroke-width="1.2"/><text x="288.0" y="264.0" font-size="11.5" font-weight="bold" fill="#1f2937" text-anchor="middle">Item 3</text><rect x="384.0" y="70.0" width="172.0" height="230.0" rx="8" fill="#ffffff" stroke="#0d9488" stroke-width="1.6"/><rect x="384.0" y="70.0" width="172.0" height="44.0" rx="8" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.6"/><text x="470.0" y="90.0" font-size="13" font-weight="bold" fill="#134e4a" text-anchor="middle">Development done</text><text x="470.0" y="107.0" font-size="11" font-weight="normal" fill="#134e4a" text-anchor="middle">no limit</text><rect x="402.0" y="126.0" width="136.0" height=