dth="136.0" height="44.0" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/><text x="834.0" y="264.0" font-size="11.5" font-weight="bold" fill="#1f2937" text-anchor="middle">Item 3</text><line x1="212.0" y1="328.0" x2="900.0" y2="328.0" stroke="#1d4ed8" stroke-width="2.4" marker-end="url(#ah0)"/><text x="556.0" y="322.0" font-size="12" font-weight="bold" fill="#1d4ed8" text-anchor="middle">Cycle time: from work starting until it is done</text><line x1="30.0" y1="362.0" x2="900.0" y2="362.0" stroke="#b45309" stroke-width="2.4" marker-end="url(#ah1)"/><text x="465.0" y="356.0" font-size="12" font-weight="bold" fill="#b45309" text-anchor="middle">Lead time: from the item entering the board until it is delivered to the customer</text><rect x="20.0" y="378.0" width="940.0" height="36.0" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.6"/><text x="490.0" y="399.9" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">Near a WIP limit? Stop starting, start finishing: the team swarms on the slowing work. Items in Ready can be reordered, so lead time can be unpredictable.</text></svg>