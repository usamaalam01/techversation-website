<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 520" width="980" height="520" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">The execution loop: work, data, change, implement</title><desc id="d">Do the planned work and produce deliverables; collect work performance data; Monitoring and Controlling analyzes variances and trends; corrective or preventive action, defect repair or new ideas become change requests; Assess and Implement Changes approves, defers or rejects them; approved changes are implemented in Manage Project Execution and the plan and documents are updated.</desc><defs><marker id="ah0" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker><marker id="ah1" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker></defs><rect x="0.75" y="0.75" width="978.5" height="518.5" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><text x="20.0" y="28.0" font-size="18" font-weight="bold" fill="#1f2937" text-anchor="start">The execution loop</text><text x="20.0" y="48.0" font-size="12" font-weight="normal" fill="#6b7280" text-anchor="start">Execution is not just doing the plan: it feeds control and implements the changes that control approves</text><rect x="20.0" y="80.0" width="280.0" height="126.0" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.8"/><text x="32.0" y="104.0" font-size="12.5" font-weight="bold" fill="#14532d" text-anchor="start">1  Do the planned work</text><text x="32.0" y="124.0" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="start">Perform activities or iteration work; coordinate</text><text x="32.0" y="137.8" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="start">people, vendors and dependencies; produce</text><text x="32.0" y="151.5" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="start">deliverables; apply quality assurance</text><rect x="350.0" y="80.0" width="280.0" height="126.0" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.8"/><text x="362.0" y="104.0" font-size="12.5" font-weight="bold" fill="#1e3a8a" text-anchor="start">2  Collect work performance data</text><text x="362.0" y="124.0" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="start">Work completed, actual dates and costs, effort,</text><text x="362.0" y="137.8" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="start">story points done, defects, change requests, KPIs</text><rect x="680.0" y="80.0" width="280.0" height="126.0" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.8"/><text x="692.0" y="104.0" font-size="12.5" font-weight="bold" fill="#78350f" text-anchor="start">3  Monitor and Control analyzes</text><text x="692.0" y="124.0" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="start">Compare with plan and thresholds: variances,</text><text x="692.0" y="137.8" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="start">trends, forecasts; find causes</text><rect x="680.0" y="280.0" width="280.0" height="126.0" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="1.8"/><text x="692.0" y="304.0" font-size="12.5" font-weight="bold" fill="#7f1d1d" text-anchor="start">4  Raise change requests</text><text x="692.0" y="324.0" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="start">Corrective action, preventive action, defect repair, or</text><text x="692.0" y="337.8" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="start">an update that enhances value; record issues and</text><text x="692.0" y="351.5" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="start">risks</text><rect x="350.0" y="280.0" width="280.0" height="126.0" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.8"/><text x="362.0" y="304.0" font-size="12.5" font-weight="bold" fill="#4c1d95" text-anchor="start">5  Assess and Implement Changes</text><text x="362.0" y="324.0" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="start">Evaluate impact on all domains; approve, defer or</text><text x="362.0" y="337.8" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="start">reject; record in the change log; communicate</text><rect x="20.0" y="280.0" width="280.0" height="126.0" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.8"/><text x="32.0" y="304.0" font-size="12.5" font-weight="bold" fill="#14532d" text-anchor="start">6  Implement approved changes</text><text x="32.0" y="324.0" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="start">Manage Project Execution carries out the change;</text><text x="32.0" y="337.8" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="start">update plans, baselines and documents; tell</text><text x="32.0" y="351.5" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="start">stakeholders</text><line x1="301.0" y1="143.0" x2="349.0" y2="143.0" stroke="#1f2937" stroke-width="2.4" marker-end="url(#ah0)"/><line x1="631.0" y1="143.0" x2="679.0" y2="143.0" stroke="#1f2937" stroke-width="2.4" marker-end="url(#ah0)"/><line x1="820.0" y1="207.0" x2="820.0" y2="279.0" stroke="#1f2937" stroke-width="2.4" marker-end="url(#ah0)"/><line x1="679.0" y1="343.0" x2="631.0" y2="343.0" stroke="#1f2937" stroke-width="2.4" marker-end="url(#ah0)"/><line x1="349.0" y1="343.0" x2="301.0" y2="343.0" stroke="#1f2937" stroke-width="2.4" marker-end="url(#ah0)"/><line x1="160.0" y1="279.0" x2="160.0" y2="207.0" stroke="#7c3aed" stroke-width="2.4" stroke-dasharray="6 4" marker-end="url(#ah1)"/><text x="172.0" y="246.0" font-size="10.5" font-weight="bold" fill="#4c1d95" text-anchor="start">back to the work, with the plan updated</text><rect x="20.0" y="428.0" width="940.0" height="78.0" rx="8" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.3"/><text x="32.0" y="448.0" font-size="11" font-weight="bold" fill="#6b7280" text-anchor="start">•</text><text x="44.0" y="448.0" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="start">Any stakeholder may request a change; requests are processed through Assess and Implement Changes (Topic 29). Deferred or rejected requests are communicated to the requester.</text><text x="32.0" y="464.2" font-size="11" font-weight="bold" fill="#6b7280" text-anchor="start">•</text><text x="44.0" y="464.2" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="start">The plan can and should change when a change enhances the value proposition; in adaptive work most changes flow through the backlog and the product owner instead of a formal</text><text x="44.0" y="477.4" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="start">board.</text><text x="32.0" y="493.6" font-size="11" font-weight="bold" fill="#6b7280" text-anchor="start">•</text><text x="44.0" y="493.6" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="start">An approved change is not finished until the schedule, drawings or backlog and other documents reflect it.</text></svg>