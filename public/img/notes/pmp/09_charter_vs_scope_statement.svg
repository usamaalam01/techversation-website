<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 470" width="980" height="470" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">Project charter contents and charter versus scope statement</title><desc id="d">Left: elements of the project charter. Right: elements of the project scope statement. The charter is high level; the scope statement is detailed and progressively elaborated.</desc><defs></defs><rect x="0.75" y="0.75" width="978.5" height="468.5" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><text x="20.0" y="28.0" font-size="18" font-weight="bold" fill="#1f2937" text-anchor="start">Charter vs scope statement (PMBOK 8 Table 4-1)</text><text x="20.0" y="48.0" font-size="12" font-weight="normal" fill="#6b7280" text-anchor="start">Charter = authorization and high-level agreement. Scope statement = detailed description of what is in and out</text><rect x="20.0" y="62.0" width="580.0" height="36.0" rx="8" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.6"/><text x="310.0" y="84.5" font-size="14" font-weight="bold" fill="#134e4a" text-anchor="middle">PROJECT CHARTER</text><rect x="20.0" y="102.0" width="580.0" height="318.0" rx="8" fill="#ffffff" stroke="#0d9488" stroke-width="1.5"/><text x="34.0" y="124.0" font-size="13" font-weight="bold" fill="#0d9488" text-anchor="start">•</text><text x="48.0" y="124.0" font-size="11.8" font-weight="normal" fill="#1f2937" text-anchor="start">Project purpose</text><text x="322.0" y="124.0" font-size="13" font-weight="bold" fill="#0d9488" text-anchor="start">•</text><text x="336.0" y="124.0" font-size="11.8" font-weight="normal" fill="#1f2937" text-anchor="start">Measurable project objectives and related</text><text x="336.0" y="138.2" font-size="11.8" font-weight="normal" fill="#1f2937" text-anchor="start">success criteria</text><text x="34.0" y="172.0" font-size="13" font-weight="bold" fill="#0d9488" text-anchor="start">•</text><text x="48.0" y="172.0" font-size="11.8" font-weight="normal" fill="#1f2937" text-anchor="start">High-level requirements</text><text x="322.0" y="172.0" font-size="13" font-weight="bold" fill="#0d9488" text-anchor="start">•</text><text x="336.0" y="172.0" font-size="11.8" font-weight="normal" fill="#1f2937" text-anchor="start">High-level project description, boundaries and</text><text x="336.0" y="186.2" font-size="11.8" font-weight="normal" fill="#1f2937" text-anchor="start">key deliverables</text><text x="34.0" y="220.0" font-size="13" font-weight="bold" fill="#0d9488" text-anchor="start">•</text><text x="48.0" y="220.0" font-size="11.8" font-weight="normal" fill="#1f2937" text-anchor="start">Overall project risk</text><text x="322.0" y="220.0" font-size="13" font-weight="bold" fill="#0d9488" text-anchor="start">•</text><text x="336.0" y="220.0" font-size="11.8" font-weight="normal" fill="#1f2937" text-anchor="start">Summary milestone schedule</text><text x="34.0" y="268.0" font-size="13" font-weight="bold" fill="#0d9488" text-anchor="start">•</text><text x="48.0" y="268.0" font-size="11.8" font-weight="normal" fill="#1f2937" text-anchor="start">Preapproved financial resources</text><text x="322.0" y="268.0" font-size="13" font-weight="bold" fill="#0d9488" text-anchor="start">•</text><text x="336.0" y="268.0" font-size="11.8" font-weight="normal" fill="#1f2937" text-anchor="start">Key stakeholder list</text><text x="34.0" y="316.0" font-size="13" font-weight="bold" fill="#0d9488" text-anchor="start">•</text><text x="48.0" y="316.0" font-size="11.8" font-weight="normal" fill="#1f2937" text-anchor="start">Project approval requirements (what is success,</text><text x="48.0" y="330.2" font-size="11.8" font-weight="normal" fill="#1f2937" text-anchor="start">who decides, who approves)</text><text x="322.0" y="316.0" font-size="13" font-weight="bold" fill="#0d9488" text-anchor="start">•</text><text x="336.0" y="316.0" font-size="11.8" font-weight="normal" fill="#1f2937" text-anchor="start">Project exit criteria (conditions to close or</text><text x="336.0" y="330.2" font-size="11.8" font-weight="normal" fill="#1f2937" text-anchor="start">cancel the project or phase)</text><text x="34.0" y="364.0" font-size="13" font-weight="bold" fill="#0d9488" text-anchor="start">•</text><text x="48.0" y="364.0" font-size="11.8" font-weight="normal" fill="#1f2937" text-anchor="start">Assigned project manager, responsibility and</text><text x="48.0" y="378.2" font-size="11.8" font-weight="normal" fill="#1f2937" text-anchor="start">authority level</text><text x="322.0" y="364.0" font-size="13" font-weight="bold" fill="#0d9488" text-anchor="start">•</text><text x="336.0" y="364.0" font-size="11.8" font-weight="normal" fill="#1f2937" text-anchor="start">Name and authority of the sponsor or authorizer</text><rect x="620.0" y="62.0" width="340.0" height="36.0" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="790.0" y="84.5" font-size="14" font-weight="bold" fill="#14532d" text-anchor="middle">PROJECT SCOPE STATEMENT</text><rect x="620.0" y="102.0" width="340.0" height="318.0" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/><text x="636.0" y="126.0" font-size="12.5" font-weight="bold" fill="#14532d" text-anchor="start">Project scope description</text><text x="636.0" y="142.0" font-size="11.5" font-weight="normal" fill="#1f2937" text-anchor="start">progressively elaborated</text><text x="636.0" y="169.8" font-size="12.5" font-weight="bold" fill="#14532d" text-anchor="start">Project deliverables</text><text x="636.0" y="185.8" font-size="11.5" font-weight="normal" fill="#1f2937" text-anchor="start">unique, verifiable products, results or capabilities</text><text x="636.0" y="213.6" font-size="12.5" font-weight="bold" fill="#14532d" text-anchor="start">Acceptance criteria</text><text x="636.0" y="229.6" font-size="11.5" font-weight="normal" fill="#1f2937" text-anchor="start">conditions met before deliverables are accepted</text><text x="636.0" y="257.4" font-size="12.5" font-weight="bold" fill="#14532d" text-anchor="start">Project exclusions</text><text x="636.0" y="273.4" font-size="11.5" font-weight="normal" fill="#1f2937" text-anchor="start">explicitly out of scope; manages expectations and reduces</text><text x="636.0" y="287.2" font-size="11.5" font-weight="normal" fill="#1f2937" text-anchor="start">scope creep</text><rect x="620.0" y="322.0" width="340.0" height="88.0" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.6"/><text x="790.0" y="348.2" font-size="11.5" font-weight="normal" fill="#374151" text-anchor="middle">Charter is issued by the sponsor or initiator; it authorizes the</text><text x="790.0" y="362.6" font-size="11.5" font-weight="normal" fill="#374151" text-anchor="middle">project and the PM's authority to apply resources. The scope</text><text x="790.0" y="376.9" font-size="11.5" font-weight="normal" fill="#374151" text-anchor="middle">statement is owned by the project team and baselines what is</text><text x="790.0" y="391.3" font-size="11.5" font-weight="normal" fill="#374151" text-anchor="middle">in or out.</text><text x="490.0" y="448.0" font-size="11.5" font-weight="normal" fill="#6b7280" text-anchor="middle" font-style="italic">Adaptive charters can be a one-page canvas or vision statement answering: why, who, what, where, when, how, and who is the customer.</text></svg>