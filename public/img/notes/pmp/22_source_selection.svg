<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 540" width="980" height="540" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">Source selection methods and weighted scoring</title><desc id="d">Six selection methods with when to use each, and a worked weighted scoring example in which bidder A scores 7.5, bidder B 7.1 and bidder C 7.0.</desc><defs></defs><rect x="0.75" y="0.75" width="978.5" height="538.5" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><text x="20.0" y="28.0" font-size="18" font-weight="bold" fill="#1f2937" text-anchor="start">Source selection: methods and weighted scoring</text><text x="20.0" y="48.0" font-size="12" font-weight="normal" fill="#6b7280" text-anchor="start">Publish the evaluation method and criteria in the tender documents so bidders know how they will be judged</text><rect x="20.0" y="70.0" width="450.0" height="56.0" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.4"/><text x="32.0" y="90.0" font-size="12" font-weight="bold" fill="#374151" text-anchor="start">Least cost</text><text x="32.0" y="106.0" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">Standard, routine work with well-defined outcomes; avoid for complex work (quality may</text><text x="32.0" y="119.0" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">suffer)</text><rect x="20.0" y="132.0" width="450.0" height="56.0" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/><text x="32.0" y="152.0" font-size="12" font-weight="bold" fill="#1e3a8a" text-anchor="start">Qualifications only</text><text x="32.0" y="168.0" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">Small value: short list, pick the strongest qualifications, expertise and references</text><rect x="20.0" y="194.0" width="450.0" height="56.0" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.4"/><text x="32.0" y="214.0" font-size="12" font-weight="bold" fill="#4c1d95" text-anchor="start">Quality-based (highest technical score)</text><text x="32.0" y="230.0" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">Rank technical proposals first; negotiate price with the top-ranked bidder</text><rect x="20.0" y="256.0" width="450.0" height="56.0" rx="8" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.4"/><text x="32.0" y="276.0" font-size="12" font-weight="bold" fill="#134e4a" text-anchor="start">Quality and cost based</text><text x="32.0" y="292.0" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">Cost is one factor; give quality more weight when risk or uncertainty is high</text><rect x="20.0" y="318.0" width="450.0" height="56.0" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.4"/><text x="32.0" y="338.0" font-size="12" font-weight="bold" fill="#78350f" text-anchor="start">Single source</text><text x="32.0" y="354.0" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">Only one supplier can meet the need (patents, exclusive rights); not a favored provider</text><rect x="20.0" y="380.0" width="450.0" height="56.0" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.4"/><text x="32.0" y="400.0" font-size="12" font-weight="bold" fill="#14532d" text-anchor="start">Fixed budget</text><text x="32.0" y="416.0" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">Disclose the budget; choose the best technical proposal within it; only for a precise SOW</text><text x="32.0" y="429.0" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">with no expected change</text><text x="500.0" y="66.0" font-size="12.5" font-weight="bold" fill="#1f2937" text-anchor="start">Weighted scoring example (scores 1 to 10, higher is better)</text><rect x="500.0" y="78.0" width="460.0" height="28.0" rx="4" fill="#1e3a8a" stroke="#1e3a8a" stroke-width="1"/><text x="508.0" y="97.0" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="start">Criterion</text><text x="685.0" y="97.0" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">Weight</text><text x="760.0" y="97.0" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">Bidder A</text><text x="840.0" y="97.0" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">Bidder B</text><text x="920.0" y="97.0" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">Bidder C</text><rect x="500.0" y="106.0" width="460.0" height="28.0" rx="0" fill="#ffffff" stroke="#d1d5db" stroke-width="1"/><text x="508.0" y="125.0" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="start">Technical approach</text><text x="685.0" y="125.0" font-size="11" font-weight="bold" fill="#1f2937" text-anchor="middle">40%</text><text x="760.0" y="125.0" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="middle">8  (3.2)</text><text x="840.0" y="125.0" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="middle">9  (3.6)</text><text x="920.0" y="125.0" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="middle">6  (2.4)</text><rect x="500.0" y="134.0" width="460.0" height="28.0" rx="0" fill="#f9fafb" stroke="#d1d5db" stroke-width="1"/><text x="508.0" y="153.0" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="start">Price</text><text x="685.0" y="153.0" font-size="11" font-weight="bold" fill="#1f2937" text-anchor="middle">30%</text><text x="760.0" y="153.0" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="middle">6  (1.8)</text><text x="840.0" y="153.0" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="middle">5  (1.5)</text><text x="920.0" y="153.0" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="middle">9  (2.7)</text><rect x="500.0" y="162.0" width="460.0" height="28.0" rx="0" fill="#ffffff" stroke="#d1d5db" stroke-width="1"/><text x="508.0" y="181.0" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="start">Past performance</text><text x="685.0" y="181.0" font-size="11" font-weight="bold" fill="#1f2937" text-anchor="middle">20%</text><text x="760.0" y="181.0" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="middle">9  (1.8)</text><text x="840.0" y="181.0" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="middle">6  (1.2)</text><text x="920.0" y="181.0" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="middle">7  (1.4)</text><rect x="500.0" y="190.0" width="460.0" height="28.0" rx="0" fill="#f9fafb" stroke="#d1d5db" stroke-width="1"/><text x="508.0" y="209.0" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="start">Sustainability</text><text x="685.0" y="209.0" font-size="11" font-weight="bold" fill="#1f2937" text-anchor="middle">10%</text><text x="760.0" y="209.0" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="middle">7  (0.7)</text><text x="840.0" y="209.0" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="middle">8  (0.8)</text><text x="920.0" y="209.0" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="middle">5  (0.5)</text><rect x="500.0" y="218.0" width="460.0" height="30.0" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="1.4"/><text x="508.0" y="238.0" font-size="11.5" font-weight="bold" fill="#14532d" text-anchor="start">Weighted total</text><text x="760.0" y="238.0" font-size="12" font-weight="bold" fill="#14532d" text-anchor="middle">7.5</text><text x="840.0" y="238.0" font-size="12" font-weight="bold" fill="#14532d" text-anchor="middle">7.1</text><text x="920.0" y="238.0" font-size="12" font-weight="bold" fill="#14532d" text-anchor="middle">7.0</text><text x="500.0" y="270.0" font-size="11.5" font-weight="bold" fill="#14532d" text-anchor="start">Bidder A ranks first (7.5), then B (7.1), then C (7.0).</text><text x="500.0" y="288.0" font-size="10.5" font-weight="normal" fill="#6b7280" text-anchor="start">Each cell shows score (weight × score). Weights reflect the relative importance of each criterion.</text><rect x="500.0" y="330.0" width="460.0" height="196.0" rx="8" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.3"/><text x="512.0" y="350.0" font-size="12" font-weight="bold" fill="#1f2937" text-anchor="start">Typical selection criteria (PMBOK 8)</text><text x="512.0" y="368.0" font-size="10.8" font-weight="bold" fill="#6b7280" text-anchor="start">•</text><text x="524.0" y="368.0" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">Capability and capacity; product cost and life cycle cost; delivery dates</text><text x="512.0" y="385.0" font-size="10.8" font-weight="bold" fill="#6b7280" text-anchor="start">•</text><text x="524.0" y="385.0" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">Technical expertise and approach; adequacy of the proposed work plan against the</text><text x="524.0" y="397.9" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">SOW</text><text x="512.0" y="414.9" font-size="10.8" font-weight="bold" fill="#6b7280" text-anchor="start">•</text><text x="524.0" y="414.9" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">Relevant experience and past performance; key team members' qualifications and</text><text x="524.0" y="427.8" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">availability</text><text x="512.0" y="444.8" font-size="10.8" font-weight="bold" fill="#6b7280" text-anchor="start">•</text><text x="524.0" y="444.8" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">Regulatory, compliance or industry-standard experience; financial stability; management</text><text x="524.0" y="457.8" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">experience</text><text x="512.0" y="474.7" font-size="10.8" font-weight="bold" fill="#6b7280" text-anchor="start">•</text><text x="524.0" y="474.7" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">Knowledge transfer and training; sustainability credentials; local content for international</text><text x="524.0" y="487.7" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">projects</text></svg>