<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 330" width="940" height="330" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">From deliverables to value</title><desc id="d">Deliverables produce outcomes; outcomes create benefits or disbenefits; benefits create value. Expected value must meet or exceed the investment threshold.</desc><defs><marker id="ah0" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker><marker id="ah1" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker></defs><rect x="0.75" y="0.75" width="938.5" height="328.5" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><text x="20.0" y="28.0" font-size="18" font-weight="bold" fill="#1f2937" text-anchor="start">From deliverables to value</text><text x="20.0" y="48.0" font-size="12" font-weight="normal" fill="#6b7280" text-anchor="start">A project is an investment: expected value (financial or not) must meet or exceed the target threshold</text><rect x="24.0" y="84.0" width="196.0" height="46.0" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="122.0" y="111.7" font-size="14.5" font-weight="bold" fill="#1e3a8a" text-anchor="middle">Outputs / deliverables</text><rect x="24.0" y="140.0" width="196.0" height="70.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="122.0" y="171.4" font-size="12" font-weight="normal" fill="#1f2937" text-anchor="middle">Products, services or results the</text><text x="122.0" y="186.4" font-size="12" font-weight="normal" fill="#1f2937" text-anchor="middle">project produces</text><line x1="223.0" y1="107.0" x2="253.0" y2="107.0" stroke="#1f2937" stroke-width="2.4" marker-end="url(#ah0)"/><rect x="256.0" y="84.0" width="196.0" height="46.0" rx="8" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.6"/><text x="354.0" y="111.7" font-size="14.5" font-weight="bold" fill="#134e4a" text-anchor="middle">Outcomes</text><rect x="256.0" y="140.0" width="196.0" height="70.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="354.0" y="171.4" font-size="12" font-weight="normal" fill="#1f2937" text-anchor="middle">End results or consequences of</text><text x="354.0" y="186.4" font-size="12" font-weight="normal" fill="#1f2937" text-anchor="middle">the work (positive or negative)</text><line x1="455.0" y1="107.0" x2="485.0" y2="107.0" stroke="#1f2937" stroke-width="2.4" marker-end="url(#ah0)"/><rect x="488.0" y="84.0" width="196.0" height="46.0" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="586.0" y="111.7" font-size="14.5" font-weight="bold" fill="#14532d" text-anchor="middle">Benefits</text><rect x="488.0" y="140.0" width="196.0" height="70.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="586.0" y="163.9" font-size="12" font-weight="normal" fill="#1f2937" text-anchor="middle">Positive outcomes: gains or</text><text x="586.0" y="178.9" font-size="12" font-weight="normal" fill="#1f2937" text-anchor="middle">assets for the organization and</text><text x="586.0" y="193.9" font-size="12" font-weight="normal" fill="#1f2937" text-anchor="middle">stakeholders</text><line x1="687.0" y1="107.0" x2="717.0" y2="107.0" stroke="#1f2937" stroke-width="2.4" marker-end="url(#ah0)"/><rect x="720.0" y="84.0" width="196.0" height="46.0" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="818.0" y="111.7" font-size="14.5" font-weight="bold" fill="#78350f" text-anchor="middle">Value</text><rect x="720.0" y="140.0" width="196.0" height="70.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="818.0" y="163.9" font-size="12" font-weight="normal" fill="#1f2937" text-anchor="middle">Excess of financial and</text><text x="818.0" y="178.9" font-size="12" font-weight="normal" fill="#1f2937" text-anchor="middle">nonfinancial benefits over the</text><text x="818.0" y="193.9" font-size="12" font-weight="normal" fill="#1f2937" text-anchor="middle">investment</text><rect x="488.0" y="232.0" width="196.0" height="46.0" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.6"/><text x="586.0" y="259.6" font-size="14" font-weight="bold" fill="#7f1d1d" text-anchor="middle">Disbenefits</text><rect x="720.0" y="232.0" width="196.0" height="46.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="818.0" y="251.4" font-size="12" font-weight="normal" fill="#1f2937" text-anchor="middle">Negative outcomes: unintended</text><text x="818.0" y="266.4" font-size="12" font-weight="normal" fill="#1f2937" text-anchor="middle">adverse effects, costs or losses</text><line x1="354.0" y1="212.0" x2="354.0" y2="255.0" stroke="#dc2626" stroke-width="2" stroke-dasharray="5 4"/><polyline points="354.0,255.0 485.0,255.0" fill="none" stroke="#dc2626" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#ah1)" stroke-linejoin="round"/><text x="24.0" y="252.0" font-size="12" font-weight="bold" fill="#991b1b" text-anchor="start">Negative</text><text x="24.0" y="268.0" font-size="12" font-weight="bold" fill="#991b1b" text-anchor="start">side of outcomes</text><text x="470.0" y="314.0" font-size="12" font-weight="normal" fill="#6b7280" text-anchor="middle" font-style="italic">Value is perceived differently: business (ROI), customers (convenience), governments and NGOs (societal impact).</text></svg>