<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 380" width="980" height="380" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">Diagnosing a persistent misunderstanding of the vision</title><desc id="d">When clarifications are acknowledged but the misunderstanding recurs, find the root cause: listen, analyze causes such as language, culture, channel, assumptions or conflicting priorities, fix, and verify understanding.</desc><defs><marker id="ah0" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker></defs><rect x="0.75" y="0.75" width="978.5" height="378.5" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><text x="20.0" y="28.0" font-size="18" font-weight="bold" fill="#1f2937" text-anchor="start">When the vision keeps being misunderstood</text><text x="20.0" y="48.0" font-size="12" font-weight="normal" fill="#6b7280" text-anchor="start">Symptom: the same misreading returns although messages were sent and acknowledged. More messages will not fix it</text><rect x="20.0" y="80.0" width="142.0" height="52.0" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.6"/><text x="91.0" y="109.9" font-size="12" font-weight="bold" fill="#7f1d1d" text-anchor="middle">Notice the pattern</text><rect x="20.0" y="138.0" width="142.0" height="150.0" rx="8" fill="#ffffff" stroke="#dc2626" stroke-width="1.5"/><text x="30.0" y="158.0" font-size="11.2" font-weight="normal" fill="#1f2937" text-anchor="start">Same misunderstanding</text><text x="30.0" y="172.3" font-size="11.2" font-weight="normal" fill="#1f2937" text-anchor="start">recurs across people or</text><text x="30.0" y="186.7" font-size="11.2" font-weight="normal" fill="#1f2937" text-anchor="start">work packages</text><line x1="163.0" y1="106.0" x2="177.0" y2="106.0" stroke="#1f2937" stroke-width="2" marker-end="url(#ah0)"/><rect x="178.0" y="80.0" width="142.0" height="52.0" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.6"/><text x="249.0" y="102.4" font-size="12" font-weight="bold" fill="#374151" text-anchor="middle">Stop repeating the</text><text x="249.0" y="117.4" font-size="12" font-weight="bold" fill="#374151" text-anchor="middle">message</text><rect x="178.0" y="138.0" width="142.0" height="150.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5"/><text x="188.0" y="158.0" font-size="11.2" font-weight="normal" fill="#1f2937" text-anchor="start">A restated email, deck</text><text x="188.0" y="172.3" font-size="11.2" font-weight="normal" fill="#1f2937" text-anchor="start">or note treats the</text><text x="188.0" y="186.7" font-size="11.2" font-weight="normal" fill="#1f2937" text-anchor="start">symptom</text><line x1="321.0" y1="106.0" x2="335.0" y2="106.0" stroke="#1f2937" stroke-width="2" marker-end="url(#ah0)"/><rect x="336.0" y="80.0" width="142.0" height="52.0" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="407.0" y="109.9" font-size="12" font-weight="bold" fill="#1e3a8a" text-anchor="middle">Ask and listen</text><rect x="336.0" y="138.0" width="142.0" height="150.0" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/><text x="346.0" y="158.0" font-size="11.2" font-weight="normal" fill="#1f2937" text-anchor="start">Interviews, observation,</text><text x="346.0" y="172.3" font-size="11.2" font-weight="normal" fill="#1f2937" text-anchor="start">active listening: how do</text><text x="346.0" y="186.7" font-size="11.2" font-weight="normal" fill="#1f2937" text-anchor="start">they understand it?</text><text x="346.0" y="201.0" font-size="11.2" font-weight="normal" fill="#1f2937" text-anchor="start">what do they expect?</text><line x1="479.0" y1="106.0" x2="493.0" y2="106.0" stroke="#1f2937" stroke-width="2" marker-end="url(#ah0)"/><rect x="494.0" y="80.0" width="142.0" height="52.0" rx="8" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.6"/><text x="565.0" y="109.9" font-size="12" font-weight="bold" fill="#134e4a" text-anchor="middle">Analyze root causes</text><rect x="494.0" y="138.0" width="142.0" height="150.0" rx="8" fill="#ffffff" stroke="#0d9488" stroke-width="1.5"/><text x="504.0" y="158.0" font-size="11.2" font-weight="normal" fill="#1f2937" text-anchor="start">Language or cultural</text><text x="504.0" y="172.3" font-size="11.2" font-weight="normal" fill="#1f2937" text-anchor="start">gaps, wrong channel,</text><text x="504.0" y="186.7" font-size="11.2" font-weight="normal" fill="#1f2937" text-anchor="start">missing context,</text><text x="504.0" y="201.0" font-size="11.2" font-weight="normal" fill="#1f2937" text-anchor="start">conflicting priorities,</text><text x="504.0" y="215.3" font-size="11.2" font-weight="normal" fill="#1f2937" text-anchor="start">unspoken assumptions,</text><text x="504.0" y="229.7" font-size="11.2" font-weight="normal" fill="#1f2937" text-anchor="start">no shared picture of the</text><text x="504.0" y="244.0" font-size="11.2" font-weight="normal" fill="#1f2937" text-anchor="start">end state</text><line x1="637.0" y1="106.0" x2="651.0" y2="106.0" stroke="#1f2937" stroke-width="2" marker-end="url(#ah0)"/><rect x="652.0" y="80.0" width="142.0" height="52.0" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="723.0" y="109.9" font-size="12" font-weight="bold" fill="#14532d" text-anchor="middle">Fix the cause</text><rect x="652.0" y="138.0" width="142.0" height="150.0" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/><text x="662.0" y="158.0" font-size="11.2" font-weight="normal" fill="#1f2937" text-anchor="start">Alignment session,</text><text x="662.0" y="172.3" font-size="11.2" font-weight="normal" fill="#1f2937" text-anchor="start">visuals and examples, a</text><text x="662.0" y="186.7" font-size="11.2" font-weight="normal" fill="#1f2937" text-anchor="start">different channel,</text><text x="662.0" y="201.0" font-size="11.2" font-weight="normal" fill="#1f2937" text-anchor="start">resolve conflicting</text><text x="662.0" y="215.3" font-size="11.2" font-weight="normal" fill="#1f2937" text-anchor="start">priorities, update the</text><text x="662.0" y="229.7" font-size="11.2" font-weight="normal" fill="#1f2937" text-anchor="start">vision artifacts</text><line x1="795.0" y1="106.0" x2="809.0" y2="106.0" stroke="#1f2937" stroke-width="2" marker-end="url(#ah0)"/><rect x="810.0" y="80.0" width="142.0" height="52.0" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.6"/><text x="881.0" y="109.9" font-size="12" font-weight="bold" fill="#4c1d95" text-anchor="middle">Verify and monitor</text><rect x="810.0" y="138.0" width="142.0" height="150.0" rx="8" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/><text x="820.0" y="158.0" font-size="11.2" font-weight="normal" fill="#1f2937" text-anchor="start">Ask people to explain it</text><text x="820.0" y="172.3" font-size="11.2" font-weight="normal" fill="#1f2937" text-anchor="start">back; check decisions</text><text x="820.0" y="186.7" font-size="11.2" font-weight="normal" fill="#1f2937" text-anchor="start">and work against the</text><text x="820.0" y="201.0" font-size="11.2" font-weight="normal" fill="#1f2937" text-anchor="start">vision; revisit if it drifts</text><rect x="20.0" y="310.0" width="940.0" height="50.0" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.6"/><text x="490.0" y="338.9" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">Tools PMBOK 8 offers: root cause analysis, cause-and-effect diagram, interviews, observation/conversation, active listening, cultural awareness, facilitation, and feedback.</text></svg>