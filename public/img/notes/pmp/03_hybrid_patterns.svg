<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 500" width="980" height="500" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">Four common hybrid patterns</title><desc id="d">Adaptive then predictive rollout; adaptive and predictive used simultaneously; mainly predictive with a small adaptive element; mainly adaptive with a predictive component.</desc><defs></defs><rect x="0.75" y="0.75" width="978.5" height="498.5" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><text x="20.0" y="28.0" font-size="18" font-weight="bold" fill="#1f2937" text-anchor="start">Four common hybrid patterns</text><text x="20.0" y="48.0" font-size="12" font-weight="normal" fill="#6b7280" text-anchor="start">PMBOK 8 Figures 4-8 to 4-11 (green = adaptive, blue = predictive)</text><rect x="20.0" y="70.0" width="940.0" height="88.0" rx="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.2"/><text x="34.0" y="96.0" font-size="13.5" font-weight="bold" fill="#1f2937" text-anchor="start">Adaptive early, predictive rollout</text><text x="34.0" y="132.0" font-size="11.5" font-weight="normal" fill="#6b7280" text-anchor="start">Discover and shape iteratively, then roll out under a plan (design</text><text x="34.0" y="146.4" font-size="11.5" font-weight="normal" fill="#6b7280" text-anchor="start">the solution adaptively, deploy predictively)</text><rect x="400.0" y="96.0" width="324.0" height="34.0" rx="6" fill="#bbf7d0" stroke="#16a34a" stroke-width="1.5"/><text x="562.0" y="118.0" font-size="11.5" font-weight="bold" fill="#16a34a" text-anchor="middle">ADAPTIVE</text><rect x="724.0" y="96.0" width="216.0" height="34.0" rx="6" fill="#bfdbfe" stroke="#2563eb" stroke-width="1.5"/><text x="832.0" y="118.0" font-size="11.5" font-weight="bold" fill="#2563eb" text-anchor="middle">PREDICTIVE</text><rect x="20.0" y="168.0" width="940.0" height="88.0" rx="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.2"/><text x="34.0" y="194.0" font-size="13.5" font-weight="bold" fill="#1f2937" text-anchor="start">Adaptive and predictive at the same time</text><text x="34.0" y="230.0" font-size="11.5" font-weight="normal" fill="#6b7280" text-anchor="start">Two streams in parallel, e.g., software built adaptively while the</text><text x="34.0" y="244.4" font-size="11.5" font-weight="normal" fill="#6b7280" text-anchor="start">data center is built predictively</text><rect x="400.0" y="180.0" width="540.0" height="30.0" rx="6" fill="#bbf7d0" stroke="#16a34a" stroke-width="1.5"/><text x="670.0" y="200.0" font-size="11.5" font-weight="bold" fill="#16a34a" text-anchor="middle">ADAPTIVE</text><rect x="400.0" y="216.0" width="540.0" height="30.0" rx="6" fill="#bfdbfe" stroke="#2563eb" stroke-width="1.5"/><text x="670.0" y="236.0" font-size="11.5" font-weight="bold" fill="#2563eb" text-anchor="middle">PREDICTIVE</text><rect x="20.0" y="266.0" width="940.0" height="88.0" rx="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.2"/><text x="34.0" y="292.0" font-size="13.5" font-weight="bold" fill="#1f2937" text-anchor="start">Mainly predictive with a small adaptive element</text><text x="34.0" y="328.0" font-size="11.5" font-weight="normal" fill="#6b7280" text-anchor="start">A plan-driven project uses iterations for one uncertain piece (e.g.,</text><text x="34.0" y="342.4" font-size="11.5" font-weight="normal" fill="#6b7280" text-anchor="start">UI inside a hospital system rollout)</text><rect x="400.0" y="278.0" width="540.0" height="30.0" rx="6" fill="#bfdbfe" stroke="#2563eb" stroke-width="1.5"/><text x="670.0" y="298.0" font-size="11.5" font-weight="bold" fill="#2563eb" text-anchor="middle">PREDICTIVE</text><rect x="589.0" y="314.0" width="162.0" height="30.0" rx="6" fill="#bbf7d0" stroke="#16a34a" stroke-width="1.5"/><text x="670.0" y="334.0" font-size="11.5" font-weight="bold" fill="#16a34a" text-anchor="middle">ADAPTIVE</text><rect x="20.0" y="364.0" width="940.0" height="88.0" rx="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.2"/><text x="34.0" y="390.0" font-size="13.5" font-weight="bold" fill="#1f2937" text-anchor="start">Mainly adaptive with a predictive component</text><text x="34.0" y="426.0" font-size="11.5" font-weight="normal" fill="#6b7280" text-anchor="start">An agile project includes one fixed, planned component (e.g.,</text><text x="34.0" y="440.4" font-size="11.5" font-weight="normal" fill="#6b7280" text-anchor="start">regulatory approval or fixed hardware)</text><rect x="400.0" y="376.0" width="540.0" height="30.0" rx="6" fill="#bbf7d0" stroke="#16a34a" stroke-width="1.5"/><text x="670.0" y="396.0" font-size="11.5" font-weight="bold" fill="#16a34a" text-anchor="middle">ADAPTIVE</text><rect x="697.0" y="412.0" width="162.0" height="30.0" rx="6" fill="#bfdbfe" stroke="#2563eb" stroke-width="1.5"/><text x="778.0" y="432.0" font-size="11.5" font-weight="bold" fill="#2563eb" text-anchor="middle">PREDICTIVE</text><text x="490.0" y="486.0" font-size="11.5" font-weight="normal" fill="#6b7280" text-anchor="middle" font-style="italic">DA hybrid levels: L1 mostly predictive + some adaptive; L2 both contribute significantly; L3 mostly adaptive + some predictive.</text></svg>