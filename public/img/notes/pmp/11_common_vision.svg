<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 490" width="980" height="490" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">Developing and keeping a common vision</title><desc id="d">Develop the vision with key stakeholders, promote it, keep it current, and diagnose the root cause when it is misunderstood. A good vision is clear, concise and actionable.</desc><defs></defs><rect x="0.75" y="0.75" width="978.5" height="488.5" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><text x="20.0" y="28.0" font-size="18" font-weight="bold" fill="#1f2937" text-anchor="start">A common vision: develop, promote, keep current, diagnose</text><text x="20.0" y="48.0" font-size="12" font-weight="normal" fill="#6b7280" text-anchor="start">ECO People Task 1: four enablers around one shared picture of the future</text><rect x="340.0" y="170.0" width="300.0" height="150.0" rx="8" fill="#1e3a8a" stroke="#1e3a8a" stroke-width="1.6"/><text x="490.0" y="217.8" font-size="12.5" font-weight="bold" fill="#ffffff" text-anchor="middle">SHARED VISION</text><text x="490.0" y="233.4" font-size="12.5" font-weight="normal" fill="#ffffff" text-anchor="middle">What is the project purpose?</text><text x="490.0" y="249.1" font-size="12.5" font-weight="normal" fill="#ffffff" text-anchor="middle">What defines success?</text><text x="490.0" y="264.7" font-size="12.5" font-weight="normal" fill="#ffffff" text-anchor="middle">How will the future be better?</text><text x="490.0" y="280.3" font-size="12.5" font-weight="normal" fill="#ffffff" text-anchor="middle">How will we know we are drifting?</text><rect x="20.0" y="66.0" width="320.0" height="34.0" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="180.0" y="87.2" font-size="13" font-weight="bold" fill="#1e3a8a" text-anchor="middle">1 Develop with key stakeholders</text><rect x="20.0" y="104.0" width="320.0" height="104.0" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/><text x="30.0" y="124.0" font-size="12" font-weight="bold" fill="#2563eb" text-anchor="start">•</text><text x="44.0" y="124.0" font-size="11.5" font-weight="normal" fill="#1f2937" text-anchor="start">Co-create with the team and key stakeholders</text><text x="44.0" y="138.0" font-size="11.5" font-weight="normal" fill="#1f2937" text-anchor="start">(workshops, interviews, facilitation)</text><text x="30.0" y="157.1" font-size="12" font-weight="bold" fill="#2563eb" text-anchor="start">•</text><text x="44.0" y="157.1" font-size="11.5" font-weight="normal" fill="#1f2937" text-anchor="start">Reconcile different definitions of success into one</text><text x="44.0" y="171.1" font-size="11.5" font-weight="normal" fill="#1f2937" text-anchor="start">statement</text><text x="30.0" y="190.1" font-size="12" font-weight="bold" fill="#2563eb" text-anchor="start">•</text><text x="44.0" y="190.1" font-size="11.5" font-weight="normal" fill="#1f2937" text-anchor="start">Keep it clear, concise, actionable, inspiring</text><rect x="640.0" y="66.0" width="320.0" height="34.0" rx="8" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.6"/><text x="800.0" y="87.2" font-size="13" font-weight="bold" fill="#134e4a" text-anchor="middle">2 Promote it</text><rect x="640.0" y="104.0" width="320.0" height="104.0" rx="8" fill="#ffffff" stroke="#0d9488" stroke-width="1.5"/><text x="650.0" y="124.0" font-size="12" font-weight="bold" fill="#0d9488" text-anchor="start">•</text><text x="664.0" y="124.0" font-size="11.5" font-weight="normal" fill="#1f2937" text-anchor="start">Communicate throughout the project, from kickoff on</text><text x="650.0" y="143.0" font-size="12" font-weight="bold" fill="#0d9488" text-anchor="start">•</text><text x="664.0" y="143.0" font-size="11.5" font-weight="normal" fill="#1f2937" text-anchor="start">Reference it when making decisions and solving</text><text x="664.0" y="157.1" font-size="11.5" font-weight="normal" fill="#1f2937" text-anchor="start">problems</text><text x="650.0" y="176.1" font-size="12" font-weight="bold" fill="#0d9488" text-anchor="start">•</text><text x="664.0" y="176.1" font-size="11.5" font-weight="normal" fill="#1f2937" text-anchor="start">Show how each person's work contributes; recognize it</text><rect x="640.0" y="330.0" width="320.0" height="34.0" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="800.0" y="351.2" font-size="13" font-weight="bold" fill="#14532d" text-anchor="middle">3 Keep it current</text><rect x="640.0" y="368.0" width="320.0" height="104.0" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/><text x="650.0" y="388.0" font-size="12" font-weight="bold" fill="#16a34a" text-anchor="start">•</text><text x="664.0" y="388.0" font-size="11.5" font-weight="normal" fill="#1f2937" text-anchor="start">Revisit at gates, iteration and release reviews</text><text x="650.0" y="407.0" font-size="12" font-weight="bold" fill="#16a34a" text-anchor="start">•</text><text x="664.0" y="407.0" font-size="11.5" font-weight="normal" fill="#1f2937" text-anchor="start">Update with sponsor and stakeholder agreement when</text><text x="664.0" y="421.1" font-size="11.5" font-weight="normal" fill="#1f2937" text-anchor="start">context changes</text><text x="650.0" y="440.1" font-size="12" font-weight="bold" fill="#16a34a" text-anchor="start">•</text><text x="664.0" y="440.1" font-size="11.5" font-weight="normal" fill="#1f2937" text-anchor="start">Watch indicators that the project is drifting</text><rect x="20.0" y="330.0" width="320.0" height="34.0" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="180.0" y="351.2" font-size="13" font-weight="bold" fill="#78350f" text-anchor="middle">4 Diagnose misunderstandings</text><rect x="20.0" y="368.0" width="320.0" height="104.0" rx="8" fill="#ffffff" stroke="#d97706" stroke-width="1.5"/><text x="30.0" y="388.0" font-size="12" font-weight="bold" fill="#d97706" text-anchor="start">•</text><text x="44.0" y="388.0" font-size="11.5" font-weight="normal" fill="#1f2937" text-anchor="start">If it keeps being misread, do not just resend the</text><text x="44.0" y="402.0" font-size="11.5" font-weight="normal" fill="#1f2937" text-anchor="start">message</text><text x="30.0" y="421.1" font-size="12" font-weight="bold" fill="#d97706" text-anchor="start">•</text><text x="44.0" y="421.1" font-size="11.5" font-weight="normal" fill="#1f2937" text-anchor="start">Find the root cause: listen, ask why, analyze</text><text x="30.0" y="440.1" font-size="12" font-weight="bold" fill="#d97706" text-anchor="start">•</text><text x="44.0" y="440.1" font-size="11.5" font-weight="normal" fill="#1f2937" text-anchor="start">Fix the cause, then verify understanding</text></svg>