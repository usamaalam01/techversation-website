<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 520" width="980" height="520" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">Artifact management lifecycle</title><desc id="d">Identify and tailor artifacts, create them, review and approve, update and keep them under version or change control, make them accessible, assess effectiveness, then retire or archive what is not useful.</desc><defs><marker id="ah0" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker></defs><rect x="0.75" y="0.75" width="978.5" height="518.5" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><text x="20.0" y="28.0" font-size="18" font-weight="bold" fill="#1f2937" text-anchor="start">Managing project artifacts</text><text x="20.0" y="48.0" font-size="12" font-weight="normal" fill="#6b7280" text-anchor="start">Artifacts exist to help manage the project and inform people; tailor them, keep them current and findable, and drop the ones nobody uses</text><rect x="20.0" y="66.0" width="300.0" height="128.0" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.7"/><text x="32.0" y="90.0" font-size="12.5" font-weight="bold" fill="#1e3a8a" text-anchor="start">1  Identify and tailor</text><text x="32.0" y="112.0" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="start">Start from OPA templates; choose only what adds value</text><text x="32.0" y="125.6" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="start">for size, risk, regulation, approach and audience</text><rect x="340.0" y="66.0" width="300.0" height="128.0" rx="10" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.7"/><text x="352.0" y="90.0" font-size="12.5" font-weight="bold" fill="#134e4a" text-anchor="start">2  Create</text><text x="352.0" y="112.0" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="start">Assign an owner, a template and a due date; create</text><text x="352.0" y="125.6" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="start">when needed, not all up front</text><rect x="660.0" y="66.0" width="300.0" height="128.0" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.7"/><text x="672.0" y="90.0" font-size="12.5" font-weight="bold" fill="#14532d" text-anchor="start">3  Review and approve</text><text x="672.0" y="112.0" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="start">Check completeness and accuracy with the right</text><text x="672.0" y="125.6" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="start">reviewers; approve baselines through governance</text><rect x="660.0" y="208.0" width="300.0" height="128.0" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.7"/><text x="672.0" y="232.0" font-size="12.5" font-weight="bold" fill="#78350f" text-anchor="start">4  Update and control</text><text x="672.0" y="254.0" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="start">Update as work proceeds on a set cadence; version</text><text x="672.0" y="267.6" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="start">control; baselines only via change control</text><rect x="340.0" y="208.0" width="300.0" height="128.0" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.7"/><text x="352.0" y="232.0" font-size="12.5" font-weight="bold" fill="#4c1d95" text-anchor="start">5  Make accessible</text><text x="352.0" y="254.0" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="start">Controlled repository or PMIS; permissions and security;</text><text x="352.0" y="267.6" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="start">searchable; approved versions findable</text><rect x="20.0" y="208.0" width="300.0" height="128.0" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="1.7"/><text x="32.0" y="232.0" font-size="12.5" font-weight="bold" fill="#7f1d1d" text-anchor="start">6  Assess effectiveness</text><text x="32.0" y="254.0" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="start">Used? Does it inform decisions? Cost vs value?</text><text x="32.0" y="267.6" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="start">Stakeholder feedback; simplify, merge or retire</text><line x1="321.0" y1="130.0" x2="339.0" y2="130.0" stroke="#1f2937" stroke-width="2.2" marker-end="url(#ah0)"/><line x1="641.0" y1="130.0" x2="659.0" y2="130.0" stroke="#1f2937" stroke-width="2.2" marker-end="url(#ah0)"/><line x1="810.0" y1="195.0" x2="810.0" y2="207.0" stroke="#1f2937" stroke-width="2.2" marker-end="url(#ah0)"/><line x1="659.0" y1="272.0" x2="641.0" y2="272.0" stroke="#1f2937" stroke-width="2.2" marker-end="url(#ah0)"/><line x1="339.0" y1="272.0" x2="321.0" y2="272.0" stroke="#1f2937" stroke-width="2.2" marker-end="url(#ah0)"/><rect x="20.0" y="360.0" width="460.0" height="156.0" rx="8" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.3"/><text x="32.0" y="380.0" font-size="12" font-weight="bold" fill="#1f2937" text-anchor="start">Kinds of artifacts and how they change</text><text x="32.0" y="398.0" font-size="10.8" font-weight="bold" fill="#6b7280" text-anchor="start">•</text><text x="44.0" y="398.0" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">Management plans and baselines: change only through approval and change control</text><text x="32.0" y="415.0" font-size="10.8" font-weight="bold" fill="#6b7280" text-anchor="start">•</text><text x="44.0" y="415.0" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">Project documents (registers, logs, reports): updated continuously by their owners</text><text x="32.0" y="431.9" font-size="10.8" font-weight="bold" fill="#6b7280" text-anchor="start">•</text><text x="44.0" y="431.9" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">Reports and dashboards: produced on a cadence for specific audiences</text><text x="32.0" y="448.9" font-size="10.8" font-weight="bold" fill="#6b7280" text-anchor="start">•</text><text x="44.0" y="448.9" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">Deliverables and product artifacts (requirements, designs, backlog): under configuration</text><text x="44.0" y="461.8" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">control</text><text x="32.0" y="478.8" font-size="10.8" font-weight="bold" fill="#6b7280" text-anchor="start">•</text><text x="44.0" y="478.8" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">Lessons learned: captured continuously; organizational assets updated at the end</text><rect x="500.0" y="360.0" width="460.0" height="156.0" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/><text x="512.0" y="380.0" font-size="12" font-weight="bold" fill="#78350f" text-anchor="start">Red flags</text><text x="512.0" y="398.0" font-size="10.8" font-weight="bold" fill="#6b7280" text-anchor="start">•</text><text x="524.0" y="398.0" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">A risk register last updated at kickoff</text><text x="512.0" y="415.0" font-size="10.8" font-weight="bold" fill="#6b7280" text-anchor="start">•</text><text x="524.0" y="415.0" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">Approved requirements kept on personal drives; auditors cannot find the latest version</text><text x="512.0" y="431.9" font-size="10.8" font-weight="bold" fill="#6b7280" text-anchor="start">•</text><text x="524.0" y="431.9" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">A status report, risk log, decision log and three dashboards that few people read</text><text x="512.0" y="448.9" font-size="10.8" font-weight="bold" fill="#6b7280" text-anchor="start">•</text><text x="524.0" y="448.9" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">A proven procedure left only in a project log while the library holds the old one</text><text x="512.0" y="465.8" font-size="10.8" font-weight="bold" fill="#6b7280" text-anchor="start">•</text><text x="524.0" y="465.8" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">Roadmap or backlog frozen while releases keep changing priorities</text></svg>