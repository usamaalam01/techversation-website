<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 520" width="980" height="520" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">Stakeholder salience model</title><desc id="d">Three overlapping circles for power, legitimacy and urgency create seven classes: dormant, discretionary, demanding, dominant, dangerous, dependent and definitive. Stakeholders with none of the three are not salient.</desc><defs></defs><rect x="0.75" y="0.75" width="978.5" height="518.5" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><text x="20.0" y="28.0" font-size="18" font-weight="bold" fill="#1f2937" text-anchor="start">Salience model: power, legitimacy and urgency</text><text x="20.0" y="48.0" font-size="12" font-weight="normal" fill="#6b7280" text-anchor="start">Count the attributes a stakeholder has now; the class (and the attention it deserves) changes as attributes are gained or lost</text><circle cx="230" cy="215" r="112" fill="#2563eb" fill-opacity="0.18" stroke="#2563eb" stroke-width="2.2"/><circle cx="360" cy="215" r="112" fill="#16a34a" fill-opacity="0.18" stroke="#16a34a" stroke-width="2.2"/><circle cx="295" cy="328" r="112" fill="#d97706" fill-opacity="0.18" stroke="#d97706" stroke-width="2.2"/><text x="160.0" y="95.0" font-size="14" font-weight="bold" fill="#1e3a8a" text-anchor="middle">POWER</text><text x="430.0" y="95.0" font-size="14" font-weight="bold" fill="#14532d" text-anchor="middle">LEGITIMACY</text><text x="417.0" y="332.0" font-size="14" font-weight="bold" fill="#78350f" text-anchor="start">URGENCY</text><text x="172.0" y="190.0" font-size="15" font-weight="bold" fill="#1f2937" text-anchor="middle">1</text><text x="172.0" y="205.0" font-size="11" font-weight="bold" fill="#1f2937" text-anchor="middle">Dormant</text><text x="418.0" y="190.0" font-size="15" font-weight="bold" fill="#1f2937" text-anchor="middle">2</text><text x="418.0" y="205.0" font-size="11" font-weight="bold" fill="#1f2937" text-anchor="middle">Discretionary</text><text x="295.0" y="398.0" font-size="15" font-weight="bold" fill="#1f2937" text-anchor="middle">3</text><text x="295.0" y="413.0" font-size="11" font-weight="bold" fill="#1f2937" text-anchor="middle">Demanding</text><text x="295.0" y="150.0" font-size="15" font-weight="bold" fill="#1f2937" text-anchor="middle">4</text><text x="295.0" y="165.0" font-size="11" font-weight="bold" fill="#1f2937" text-anchor="middle">Dominant</text><text x="228.0" y="292.0" font-size="15" font-weight="bold" fill="#1f2937" text-anchor="middle">5</text><text x="228.0" y="307.0" font-size="11" font-weight="bold" fill="#1f2937" text-anchor="middle">Dangerous</text><text x="362.0" y="292.0" font-size="15" font-weight="bold" fill="#1f2937" text-anchor="middle">6</text><text x="362.0" y="307.0" font-size="11" font-weight="bold" fill="#1f2937" text-anchor="middle">Dependent</text><text x="295.0" y="238.0" font-size="15" font-weight="bold" fill="#1f2937" text-anchor="middle">7</text><text x="295.0" y="253.0" font-size="11" font-weight="bold" fill="#1f2937" text-anchor="middle">Definitive</text><rect x="540.0" y="92.0" width="30.0" height="28.0" rx="8" fill="#1e3a8a" stroke="#1e3a8a" stroke-width="1.6"/><text x="555.0" y="109.6" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">#</text><rect x="570.0" y="92.0" width="108.0" height="28.0" rx="8" fill="#1e3a8a" stroke="#1e3a8a" stroke-width="1.6"/><text x="624.0" y="109.6" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">Class</text><rect x="678.0" y="92.0" width="150.0" height="28.0" rx="8" fill="#1e3a8a" stroke="#1e3a8a" stroke-width="1.6"/><text x="753.0" y="109.6" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">Attributes</text><rect x="828.0" y="92.0" width="150.0" height="28.0" rx="8" fill="#1e3a8a" stroke="#1e3a8a" stroke-width="1.6"/><text x="903.0" y="109.6" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">Typical handling</text><rect x="540.0" y="120.0" width="30.0" height="44.0" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="555.0" y="145.9" font-size="12" font-weight="bold" fill="#1e3a8a" text-anchor="middle">1</text><rect x="570.0" y="120.0" width="108.0" height="44.0" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="624.0" y="145.9" font-size="12" font-weight="bold" fill="#1e3a8a" text-anchor="middle">Dormant</text><rect x="678.0" y="120.0" width="150.0" height="44.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="753.0" y="145.4" font-size="10.5" font-weight="normal" fill="#1f2937" text-anchor="middle">Power only</text><rect x="828.0" y="120.0" width="150.0" height="44.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="903.0" y="138.8" font-size="10.5" font-weight="normal" fill="#1f2937" text-anchor="middle">Monitor; may gain another</text><text x="903.0" y="152.0" font-size="10.5" font-weight="normal" fill="#1f2937" text-anchor="middle">attribute</text><rect x="540.0" y="164.0" width="30.0" height="44.0" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="555.0" y="189.9" font-size="12" font-weight="bold" fill="#14532d" text-anchor="middle">2</text><rect x="570.0" y="164.0" width="108.0" height="44.0" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="624.0" y="189.9" font-size="12" font-weight="bold" fill="#14532d" text-anchor="middle">Discretionary</text><rect x="678.0" y="164.0" width="150.0" height="44.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="753.0" y="189.4" font-size="10.5" font-weight="normal" fill="#1f2937" text-anchor="middle">Legitimacy only</text><rect x="828.0" y="164.0" width="150.0" height="44.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="903.0" y="182.8" font-size="10.5" font-weight="normal" fill="#1f2937" text-anchor="middle">Keep informed; no pressure</text><text x="903.0" y="196.0" font-size="10.5" font-weight="normal" fill="#1f2937" text-anchor="middle">to act</text><rect x="540.0" y="208.0" width="30.0" height="44.0" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="555.0" y="233.9" font-size="12" font-weight="bold" fill="#78350f" text-anchor="middle">3</text><rect x="570.0" y="208.0" width="108.0" height="44.0" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="624.0" y="233.9" font-size="12" font-weight="bold" fill="#78350f" text-anchor="middle">Demanding</text><rect x="678.0" y="208.0" width="150.0" height="44.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="753.0" y="233.4" font-size="10.5" font-weight="normal" fill="#1f2937" text-anchor="middle">Urgency only</text><rect x="828.0" y="208.0" width="150.0" height="44.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="903.0" y="233.4" font-size="10.5" font-weight="normal" fill="#1f2937" text-anchor="middle">Monitor; noisy but weak</text><rect x="540.0" y="252.0" width="30.0" height="44.0" rx="8" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.6"/><text x="555.0" y="277.9" font-size="12" font-weight="bold" fill="#134e4a" text-anchor="middle">4</text><rect x="570.0" y="252.0" width="108.0" height="44.0" rx="8" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.6"/><text x="624.0" y="277.9" font-size="12" font-weight="bold" fill="#134e4a" text-anchor="middle">Dominant</text><rect x="678.0" y="252.0" width="150.0" height="44.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="753.0" y="277.4" font-size="10.5" font-weight="normal" fill="#1f2937" text-anchor="middle">Power + legitimacy</text><rect x="828.0" y="252.0" width="150.0" height="44.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="903.0" y="270.9" font-size="10.5" font-weight="normal" fill="#1f2937" text-anchor="middle">Engage actively; expects</text><text x="903.0" y="284.0" font-size="10.5" font-weight="normal" fill="#1f2937" text-anchor="middle">attention</text><rect x="540.0" y="296.0" width="30.0" height="44.0" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.6"/><text x="555.0" y="321.9" font-size="12" font-weight="bold" fill="#7f1d1d" text-anchor="middle">5</text><rect x="570.0" y="296.0" width="108.0" height="44.0" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.6"/><text x="624.0" y="321.9" font-size="12" font-weight="bold" fill="#7f1d1d" text-anchor="middle">Dangerous</text><rect x="678.0" y="296.0" width="150.0" height="44.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="753.0" y="321.4" font-size="10.5" font-weight="normal" fill="#1f2937" text-anchor="middle">Power + urgency</text><rect x="828.0" y="296.0" width="150.0" height="44.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="903.0" y="314.9" font-size="10.5" font-weight="normal" fill="#1f2937" text-anchor="middle">Manage with care; may use</text><text x="903.0" y="328.0" font-size="10.5" font-weight="normal" fill="#1f2937" text-anchor="middle">pressure</text><rect x="540.0" y="340.0" width="30.0" height="44.0" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.6"/><text x="555.0" y="365.9" font-size="12" font-weight="bold" fill="#4c1d95" text-anchor="middle">6</text><rect x="570.0" y="340.0" width="108.0" height="44.0" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.6"/><text x="624.0" y="365.9" font-size="12" font-weight="bold" fill="#4c1d95" text-anchor="middle">Dependent</text><rect x="678.0" y="340.0" width="150.0" height="44.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="753.0" y="365.4" font-size="10.5" font-weight="normal" fill="#1f2937" text-anchor="middle">Legitimacy + urgency</text><rect x="828.0" y="340.0" width="150.0" height="44.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="903.0" y="358.9" font-size="10.5" font-weight="normal" fill="#1f2937" text-anchor="middle">Needs a powerful ally;</text><text x="903.0" y="372.0" font-size="10.5" font-weight="normal" fill="#1f2937" text-anchor="middle">protect their interests</text><rect x="540.0" y="384.0" width="30.0" height="44.0" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.6"/><text x="555.0" y="409.9" font-size="12" font-weight="bold" fill="#374151" text-anchor="middle">7</text><rect x="570.0" y="384.0" width="108.0" height="44.0" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.6"/><text x="624.0" y="409.9" font-size="12" font-weight="bold" fill="#374151" text-anchor="middle">Definitive</text><rect x="678.0" y="384.0" width="150.0" height="44.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="753.0" y="409.4" font-size="10.5" font-weight="normal" fill="#1f2937" text-anchor="middle">All three</text><rect x="828.0" y="384.0" width="150.0" height="44.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="903.0" y="409.4" font-size="10.5" font-weight="normal" fill="#1f2937" text-anchor="middle">Top priority; engage now</text><rect x="20.0" y="452.0" width="940.0" height="50.0" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.6"/><text x="490.0" y="473.4" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">Outside all three circles: not a salient stakeholder at the moment (re-check when the situation changes). PMBOK 8 names salience and proximity as stakeholder mapping</text><text x="490.0" y="488.4" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">models; the seven class names are [Beyond PMBOK 8 exam vocabulary].</text></svg>