<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 520" width="980" height="520" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">Quality management across the project</title><desc id="d">Plan quality (requirements, standards, metrics, quality management plan), quality assurance (process focus, Manage Quality Assurance), quality control (product focus, Monitor and Control Scope), and acceptance (Validate Scope), with a continuous improvement loop back to planning and assurance.</desc><defs><marker id="ah0" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker><marker id="ah1" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker></defs><rect x="0.75" y="0.75" width="978.5" height="518.5" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><text x="20.0" y="28.0" font-size="18" font-weight="bold" fill="#1f2937" text-anchor="start">Quality management across the project</text><text x="20.0" y="48.0" font-size="12" font-weight="normal" fill="#6b7280" text-anchor="start">Where quality work happens in PMBOK 8: plan it, assure the processes, control the product, get acceptance, improve</text><rect x="20.0" y="66.0" width="222.0" height="40.0" rx="8" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.6"/><text x="131.0" y="90.2" font-size="13" font-weight="bold" fill="#134e4a" text-anchor="middle">1 Plan quality</text><rect x="20.0" y="112.0" width="222.0" height="178.0" rx="8" fill="#ffffff" stroke="#0d9488" stroke-width="1.5"/><text x="30.0" y="130.0" font-size="10.3" font-weight="bold" fill="#6b7280" text-anchor="start">Planning</text><text x="30.0" y="150.4" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="start">Gather quality requirements and</text><text x="30.0" y="163.8" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="start">standards (Define Scope); set objectives</text><text x="30.0" y="177.2" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="start">and metrics; plan tests, inspections and</text><text x="30.0" y="190.6" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="start">reviews</text><text x="30.0" y="214.0" font-size="10.3" font-weight="bold" fill="#6b7280" text-anchor="start">Key outputs</text><text x="30.0" y="228.0" font-size="11" font-weight="bold" fill="#134e4a" text-anchor="start">Quality management plan, quality</text><text x="30.0" y="241.5" font-size="11" font-weight="bold" fill="#134e4a" text-anchor="start">metrics</text><line x1="243.0" y1="86.0" x2="258.0" y2="86.0" stroke="#1f2937" stroke-width="2" marker-end="url(#ah0)"/><rect x="259.0" y="66.0" width="222.0" height="40.0" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="370.0" y="90.2" font-size="13" font-weight="bold" fill="#14532d" text-anchor="middle">2 Quality assurance</text><rect x="259.0" y="112.0" width="222.0" height="178.0" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/><text x="269.0" y="130.0" font-size="10.3" font-weight="bold" fill="#6b7280" text-anchor="start">Executing (Manage Quality Assurance)</text><text x="269.0" y="150.4" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="start">Use the processes effectively and follow</text><text x="269.0" y="163.8" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="start">standards: audits, checklists, process</text><text x="269.0" y="177.2" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="start">analysis, root cause analysis, process</text><text x="269.0" y="190.6" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="start">improvement</text><text x="269.0" y="214.0" font-size="10.3" font-weight="bold" fill="#6b7280" text-anchor="start">Key outputs</text><text x="269.0" y="228.0" font-size="11" font-weight="bold" fill="#14532d" text-anchor="start">Quality reports, change requests</text><line x1="482.0" y1="86.0" x2="497.0" y2="86.0" stroke="#1f2937" stroke-width="2" marker-end="url(#ah0)"/><rect x="498.0" y="66.0" width="222.0" height="40.0" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="609.0" y="90.2" font-size="13" font-weight="bold" fill="#78350f" text-anchor="middle">3 Quality control</text><rect x="498.0" y="112.0" width="222.0" height="178.0" rx="8" fill="#ffffff" stroke="#d97706" stroke-width="1.5"/><text x="508.0" y="130.0" font-size="10.3" font-weight="bold" fill="#6b7280" text-anchor="start">Monitoring and Controlling (Monitor and</text><text x="508.0" y="142.4" font-size="10.3" font-weight="bold" fill="#6b7280" text-anchor="start">Control Scope)</text><text x="508.0" y="162.7" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="start">Check the deliverables against</text><text x="508.0" y="176.1" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="start">specifications: inspections, testing,</text><text x="508.0" y="189.6" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="start">control charts, variance and trend</text><text x="508.0" y="203.0" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="start">analysis</text><text x="508.0" y="226.4" font-size="10.3" font-weight="bold" fill="#6b7280" text-anchor="start">Key outputs</text><text x="508.0" y="240.4" font-size="11" font-weight="bold" fill="#78350f" text-anchor="start">Verified deliverables, quality control</text><text x="508.0" y="253.8" font-size="11" font-weight="bold" fill="#78350f" text-anchor="start">measurements</text><line x1="721.0" y1="86.0" x2="736.0" y2="86.0" stroke="#1f2937" stroke-width="2" marker-end="url(#ah0)"/><rect x="737.0" y="66.0" width="222.0" height="40.0" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.6"/><text x="848.0" y="90.2" font-size="13" font-weight="bold" fill="#4c1d95" text-anchor="middle">4 Acceptance</text><rect x="737.0" y="112.0" width="222.0" height="178.0" rx="8" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/><text x="747.0" y="130.0" font-size="10.3" font-weight="bold" fill="#6b7280" text-anchor="start">Monitoring and Controlling (Validate</text><text x="747.0" y="142.4" font-size="10.3" font-weight="bold" fill="#6b7280" text-anchor="start">Scope)</text><text x="747.0" y="162.7" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="start">Customer review against acceptance</text><text x="747.0" y="176.1" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="start">criteria; also checks the processes used</text><text x="747.0" y="189.6" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="start">to reach the quality standards</text><text x="747.0" y="213.0" font-size="10.3" font-weight="bold" fill="#6b7280" text-anchor="start">Key outputs</text><text x="747.0" y="227.0" font-size="11" font-weight="bold" fill="#4c1d95" text-anchor="start">Accepted deliverables</text><polyline points="848.0,290.0 848.0,312.0 131.0,312.0 131.0,291.0" fill="none" stroke="#7c3aed" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#ah1)" stroke-linejoin="round"/><rect x="300.0" y="296.0" width="380.0" height="32.0" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.6"/><text x="490.0" y="308.6" font-size="11.3" font-weight="bold" fill="#4c1d95" text-anchor="middle">Continuous improvement: lessons learned, retrospectives, PDCA,</text><text x="490.0" y="322.7" font-size="11.3" font-weight="bold" fill="#4c1d95" text-anchor="middle">update OPAs</text><rect x="20.0" y="346.0" width="460.0" height="156.0" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="32.0" y="400.1" font-size="11" font-weight="bold" fill="#14532d" text-anchor="start">Quality assurance (process focus)</text><text x="32.0" y="413.8" font-size="11" font-weight="normal" fill="#14532d" text-anchor="start">Using project processes effectively and following standards, so stakeholders can trust</text><text x="32.0" y="427.6" font-size="11" font-weight="normal" fill="#14532d" text-anchor="start">the final results will meet needs. Related ideas: regulations, compliance, audits.</text><text x="32.0" y="441.3" font-size="11" font-weight="normal" fill="#14532d" text-anchor="start">Preventive in nature. Done throughout the project, formally in predictive work and</text><text x="32.0" y="455.1" font-size="11" font-weight="normal" fill="#14532d" text-anchor="start">formally or informally in adaptive work, by the project team, an external party, or both.</text><rect x="500.0" y="346.0" width="460.0" height="156.0" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="512.0" y="400.1" font-size="11" font-weight="bold" fill="#78350f" text-anchor="start">Quality control (product focus)</text><text x="512.0" y="413.8" font-size="11" font-weight="normal" fill="#78350f" text-anchor="start">Creating deliverables that meet defined specifications and thresholds: defining the</text><text x="512.0" y="427.6" font-size="11" font-weight="normal" fill="#78350f" text-anchor="start">attributes that create value and confirming deliverables achieve them. Related ideas:</text><text x="512.0" y="441.3" font-size="11" font-weight="normal" fill="#78350f" text-anchor="start">product design, testing, defects. Detects nonconformance so it can be repaired. PMBOK</text><text x="512.0" y="455.1" font-size="11" font-weight="normal" fill="#78350f" text-anchor="start">8 performs it inside Monitor and Control Scope.</text></svg>