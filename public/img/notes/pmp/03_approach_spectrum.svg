<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 520" width="980" height="520" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">Spectrum of development approaches</title><desc id="d">Predictive on one end, adaptive on the other, hybrid in between, with the factors that push a project toward each end.</desc><defs><marker id="ah0" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1e3a8a"/></marker></defs><rect x="0.75" y="0.75" width="978.5" height="518.5" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><text x="20.0" y="28.0" font-size="18" font-weight="bold" fill="#1f2937" text-anchor="start">The spectrum of development approaches</text><text x="20.0" y="48.0" font-size="12" font-weight="normal" fill="#6b7280" text-anchor="start">Choose by deliverables, project and organization factors; many projects mix approaches</text><rect x="40.0" y="84.0" width="300.0" height="40.0" rx="0" fill="#bfdbfe" stroke="#6b7280" stroke-width="1.5"/><text x="190.0" y="110.0" font-size="15" font-weight="bold" fill="#1f2937" text-anchor="middle">PREDICTIVE</text><rect x="340.0" y="84.0" width="300.0" height="40.0" rx="0" fill="#ddd6fe" stroke="#6b7280" stroke-width="1.5"/><text x="490.0" y="110.0" font-size="15" font-weight="bold" fill="#1f2937" text-anchor="middle">HYBRID</text><rect x="640.0" y="84.0" width="300.0" height="40.0" rx="0" fill="#bbf7d0" stroke="#6b7280" stroke-width="1.5"/><text x="790.0" y="110.0" font-size="15" font-weight="bold" fill="#1f2937" text-anchor="middle">ADAPTIVE (agile)</text><line x1="40.0" y1="140.0" x2="940.0" y2="140.0" stroke="#1e3a8a" stroke-width="2.4" marker-end="url(#ah0)"/><text x="40.0" y="158.0" font-size="12" font-weight="bold" fill="#1e3a8a" text-anchor="start">Plan up front, change control, single or phased delivery</text><text x="940.0" y="158.0" font-size="12" font-weight="bold" fill="#1e3a8a" text-anchor="end">Increasingly iterative and incremental, feedback-driven</text><rect x="40.0" y="190.0" width="290.0" height="306.0" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="54.0" y="216.0" font-size="14" font-weight="bold" fill="#1e3a8a" text-anchor="start">Favors PREDICTIVE</text><text x="54.0" y="236.0" font-size="13" font-weight="bold" fill="#1e3a8a" text-anchor="start">•</text><text x="68.0" y="236.0" font-size="12" font-weight="normal" fill="#1f2937" text-anchor="start">Requirements well known and stable</text><text x="54.0" y="257.0" font-size="13" font-weight="bold" fill="#1e3a8a" text-anchor="start">•</text><text x="68.0" y="257.0" font-size="12" font-weight="normal" fill="#1f2937" text-anchor="start">Scope stable; change is costly or hard</text><text x="54.0" y="278.0" font-size="13" font-weight="bold" fill="#1e3a8a" text-anchor="start">•</text><text x="68.0" y="278.0" font-size="12" font-weight="normal" fill="#1f2937" text-anchor="start">Rigorous safety requirements</text><text x="54.0" y="299.0" font-size="13" font-weight="bold" fill="#1e3a8a" text-anchor="start">•</text><text x="68.0" y="299.0" font-size="12" font-weight="normal" fill="#1f2937" text-anchor="start">Heavy regulation (documentation, phase</text><text x="68.0" y="314.0" font-size="12" font-weight="normal" fill="#1f2937" text-anchor="start">gates)</text><text x="54.0" y="335.0" font-size="13" font-weight="bold" fill="#1e3a8a" text-anchor="start">•</text><text x="68.0" y="335.0" font-size="12" font-weight="normal" fill="#1f2937" text-anchor="start">Fixed end date; large investment</text><text x="54.0" y="356.0" font-size="13" font-weight="bold" fill="#1e3a8a" text-anchor="start">•</text><text x="68.0" y="356.0" font-size="12" font-weight="normal" fill="#1f2937" text-anchor="start">Functional or hierarchical structure;</text><text x="68.0" y="371.0" font-size="12" font-weight="normal" fill="#1f2937" text-anchor="start">managing-and-directing culture</text><rect x="345.0" y="190.0" width="290.0" height="306.0" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.6"/><text x="359.0" y="216.0" font-size="14" font-weight="bold" fill="#4c1d95" text-anchor="start">Favors HYBRID</text><text x="359.0" y="236.0" font-size="13" font-weight="bold" fill="#4c1d95" text-anchor="start">•</text><text x="373.0" y="236.0" font-size="12" font-weight="normal" fill="#1f2937" text-anchor="start">Some deliverables certain, others uncertain</text><text x="359.0" y="257.0" font-size="13" font-weight="bold" fill="#4c1d95" text-anchor="start">•</text><text x="373.0" y="257.0" font-size="12" font-weight="normal" fill="#1f2937" text-anchor="start">Modular deliverables or different teams</text><text x="359.0" y="278.0" font-size="13" font-weight="bold" fill="#4c1d95" text-anchor="start">•</text><text x="373.0" y="278.0" font-size="12" font-weight="normal" fill="#1f2937" text-anchor="start">Uncertain requirements early, stable build later</text><text x="373.0" y="293.0" font-size="12" font-weight="normal" fill="#1f2937" text-anchor="start">(custom home)</text><text x="359.0" y="314.0" font-size="13" font-weight="bold" fill="#4c1d95" text-anchor="start">•</text><text x="373.0" y="314.0" font-size="12" font-weight="normal" fill="#1f2937" text-anchor="start">Software inside a physical build (smart</text><text x="373.0" y="329.0" font-size="12" font-weight="normal" fill="#1f2937" text-anchor="start">building, hospital records)</text><text x="359.0" y="350.0" font-size="13" font-weight="bold" fill="#4c1d95" text-anchor="start">•</text><text x="373.0" y="350.0" font-size="12" font-weight="normal" fill="#1f2937" text-anchor="start">Most modern projects</text><rect x="650.0" y="190.0" width="290.0" height="306.0" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="664.0" y="216.0" font-size="14" font-weight="bold" fill="#14532d" text-anchor="start">Favors ADAPTIVE</text><text x="664.0" y="236.0" font-size="13" font-weight="bold" fill="#14532d" text-anchor="start">•</text><text x="678.0" y="236.0" font-size="12" font-weight="normal" fill="#1f2937" text-anchor="start">High innovation; requirements uncertain or</text><text x="678.0" y="251.0" font-size="12" font-weight="normal" fill="#1f2937" text-anchor="start">volatile</text><text x="664.0" y="272.0" font-size="13" font-weight="bold" fill="#14532d" text-anchor="start">•</text><text x="678.0" y="272.0" font-size="12" font-weight="normal" fill="#1f2937" text-anchor="start">Unstable scope; frequent feedback is valuable</text><text x="664.0" y="293.0" font-size="13" font-weight="bold" fill="#14532d" text-anchor="start">•</text><text x="678.0" y="293.0" font-size="12" font-weight="normal" fill="#1f2937" text-anchor="start">Value in early or incremental delivery</text><text x="664.0" y="314.0" font-size="13" font-weight="bold" fill="#14532d" text-anchor="start">•</text><text x="678.0" y="314.0" font-size="12" font-weight="normal" fill="#1f2937" text-anchor="start">Financing uncertainty</text><text x="664.0" y="335.0" font-size="13" font-weight="bold" fill="#14532d" text-anchor="start">•</text><text x="678.0" y="335.0" font-size="12" font-weight="normal" fill="#1f2937" text-anchor="start">Complex projects with evolving needs</text><text x="664.0" y="356.0" font-size="13" font-weight="bold" fill="#14532d" text-anchor="start">•</text><text x="678.0" y="356.0" font-size="12" font-weight="normal" fill="#1f2937" text-anchor="start">Network-oriented structure; self-managed,</text><text x="678.0" y="371.0" font-size="12" font-weight="normal" fill="#1f2937" text-anchor="start">collaborative culture; small teams (often 3 to 9)</text></svg>