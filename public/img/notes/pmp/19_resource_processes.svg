<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 476" width="980" height="476" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">Resources performance domain: five processes</title><desc id="d">Plan Resource Management and Estimate Resources in Planning; Acquire Resources and Lead the Team in Executing; Monitor and Control Resourcing in Monitoring and Controlling. Resources are team members and physical or virtual resources.</desc><defs><marker id="ah0" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker></defs><rect x="0.75" y="0.75" width="978.5" height="474.5" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><text x="20.0" y="28.0" font-size="18" font-weight="bold" fill="#1f2937" text-anchor="start">Resources domain: five processes</text><text x="20.0" y="48.0" font-size="12" font-weight="normal" fill="#6b7280" text-anchor="start">PMBOK 8 Figure 2-40: plan, estimate, acquire, lead the team, monitor and control resourcing</text><rect x="20.0" y="60.0" width="367.0" height="22.0" rx="11" fill="#f0fdfa" stroke="#0d9488" stroke-width="1.2"/><text x="203.5" y="75.0" font-size="10.5" font-weight="bold" fill="#134e4a" text-anchor="middle">PLANNING</text><rect x="402.0" y="60.0" width="367.0" height="22.0" rx="11" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.2"/><text x="585.5" y="75.0" font-size="10.5" font-weight="bold" fill="#14532d" text-anchor="middle">EXECUTING</text><rect x="784.0" y="60.0" width="176.0" height="22.0" rx="11" fill="#fffbeb" stroke="#d97706" stroke-width="1.2"/><text x="872.0" y="75.0" font-size="9.4" font-weight="bold" fill="#78350f" text-anchor="middle">MONITORING AND CONTROLLING</text><rect x="20.0" y="90.0" width="176.0" height="50.0" rx="8" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.6"/><text x="108.0" y="111.3" font-size="12.2" font-weight="bold" fill="#134e4a" text-anchor="middle">Plan Resource</text><text x="108.0" y="126.6" font-size="12.2" font-weight="bold" fill="#134e4a" text-anchor="middle">Management</text><rect x="20.0" y="146.0" width="176.0" height="150.0" rx="8" fill="#ffffff" stroke="#0d9488" stroke-width="1.5"/><text x="29.0" y="164.0" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">Define how to estimate, acquire,</text><text x="29.0" y="177.2" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">lead and use team, physical and</text><text x="29.0" y="190.4" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">virtual resources</text><text x="29.0" y="211.5" font-size="10" font-weight="bold" fill="#6b7280" text-anchor="start">Key outputs</text><text x="29.0" y="224.5" font-size="10.8" font-weight="bold" fill="#134e4a" text-anchor="start">Resource management plan,</text><text x="29.0" y="237.5" font-size="10.8" font-weight="bold" fill="#134e4a" text-anchor="start">team charter</text><line x1="197.0" y1="115.0" x2="210.0" y2="115.0" stroke="#1f2937" stroke-width="2" marker-end="url(#ah0)"/><rect x="211.0" y="90.0" width="176.0" height="50.0" rx="8" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.6"/><text x="299.0" y="119.0" font-size="12.2" font-weight="bold" fill="#134e4a" text-anchor="middle">Estimate Resources</text><rect x="211.0" y="146.0" width="176.0" height="150.0" rx="8" fill="#ffffff" stroke="#0d9488" stroke-width="1.5"/><text x="220.0" y="164.0" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">Estimate the team and the type</text><text x="220.0" y="177.2" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">and quantity of physical or virtual</text><text x="220.0" y="190.4" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">resources for the work</text><text x="220.0" y="211.5" font-size="10" font-weight="bold" fill="#6b7280" text-anchor="start">Key outputs</text><text x="220.0" y="224.5" font-size="10.8" font-weight="bold" fill="#134e4a" text-anchor="start">Resource requirements, basis</text><text x="220.0" y="237.5" font-size="10.8" font-weight="bold" fill="#134e4a" text-anchor="start">of estimates, resource</text><text x="220.0" y="250.4" font-size="10.8" font-weight="bold" fill="#134e4a" text-anchor="start">breakdown structure</text><line x1="388.0" y1="115.0" x2="401.0" y2="115.0" stroke="#1f2937" stroke-width="2" marker-end="url(#ah0)"/><rect x="402.0" y="90.0" width="176.0" height="50.0" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="490.0" y="119.0" font-size="12.2" font-weight="bold" fill="#14532d" text-anchor="middle">Acquire Resources</text><rect x="402.0" y="146.0" width="176.0" height="150.0" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/><text x="411.0" y="164.0" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">Obtain the team, physical and</text><text x="411.0" y="177.2" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">virtual resources the activities</text><text x="411.0" y="190.4" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">need</text><text x="411.0" y="211.5" font-size="10" font-weight="bold" fill="#6b7280" text-anchor="start">Key outputs</text><text x="411.0" y="224.5" font-size="10.8" font-weight="bold" fill="#14532d" text-anchor="start">Resource and team</text><text x="411.0" y="237.5" font-size="10.8" font-weight="bold" fill="#14532d" text-anchor="start">assignments, resource</text><text x="411.0" y="250.4" font-size="10.8" font-weight="bold" fill="#14532d" text-anchor="start">calendars</text><line x1="579.0" y1="115.0" x2="592.0" y2="115.0" stroke="#1f2937" stroke-width="2" marker-end="url(#ah0)"/><rect x="593.0" y="90.0" width="176.0" height="50.0" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="681.0" y="119.0" font-size="12.2" font-weight="bold" fill="#14532d" text-anchor="middle">Lead the Team</text><rect x="593.0" y="146.0" width="176.0" height="150.0" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/><text x="602.0" y="164.0" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">Guide, develop and manage the</text><text x="602.0" y="177.2" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">team: feedback, collaboration,</text><text x="602.0" y="190.4" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">conflict resolution, escalation</text><text x="602.0" y="211.5" font-size="10" font-weight="bold" fill="#6b7280" text-anchor="start">Key outputs</text><text x="602.0" y="224.5" font-size="10.8" font-weight="bold" fill="#14532d" text-anchor="start">Team performance</text><text x="602.0" y="237.5" font-size="10.8" font-weight="bold" fill="#14532d" text-anchor="start">assessments, change</text><text x="602.0" y="250.4" font-size="10.8" font-weight="bold" fill="#14532d" text-anchor="start">requests (Topic 25)</text><line x1="770.0" y1="115.0" x2="783.0" y2="115.0" stroke="#1f2937" stroke-width="2" marker-end="url(#ah0)"/><rect x="784.0" y="90.0" width="176.0" height="50.0" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="872.0" y="111.3" font-size="12.2" font-weight="bold" fill="#78350f" text-anchor="middle">Monitor and Control</text><text x="872.0" y="126.6" font-size="12.2" font-weight="bold" fill="#78350f" text-anchor="middle">Resourcing</text><rect x="784.0" y="146.0" width="176.0" height="150.0" rx="8" fill="#ffffff" stroke="#d97706" stroke-width="1.5"/><text x="793.0" y="164.0" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">Keep physical and virtual</text><text x="793.0" y="177.2" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">resources available as planned,</text><text x="793.0" y="190.4" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">used as planned and released</text><text x="793.0" y="203.5" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">when done</text><text x="793.0" y="224.7" font-size="10" font-weight="bold" fill="#6b7280" text-anchor="start">Key outputs</text><text x="793.0" y="237.7" font-size="10.8" font-weight="bold" fill="#78350f" text-anchor="start">Work performance</text><text x="793.0" y="250.7" font-size="10.8" font-weight="bold" fill="#78350f" text-anchor="start">information, change requests</text><rect x="20.0" y="312.0" width="460.0" height="150.0" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/><text x="32.0" y="332.0" font-size="12.5" font-weight="bold" fill="#1e3a8a" text-anchor="start">Team resources (people)</text><text x="32.0" y="352.0" font-size="11" font-weight="bold" fill="#6b7280" text-anchor="start">•</text><text x="44.0" y="352.0" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="start">Individuals with assigned roles and responsibilities, working toward a shared goal</text><text x="32.0" y="370.4" font-size="11" font-weight="bold" fill="#6b7280" text-anchor="start">•</text><text x="44.0" y="370.4" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="start">Internal: assigned by functional or resource managers. External: partnerships, joint</text><text x="44.0" y="383.8" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="start">ventures, procurement (Topic 22)</text><text x="32.0" y="402.3" font-size="11" font-weight="bold" fill="#6b7280" text-anchor="start">•</text><text x="44.0" y="402.3" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="start">Authority must match responsibility; competence gaps need training, hiring, schedule</text><text x="44.0" y="415.7" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="start">or scope changes</text><text x="32.0" y="434.1" font-size="11" font-weight="bold" fill="#6b7280" text-anchor="start">•</text><text x="44.0" y="434.1" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="start">Managed through Lead the Team (Topic 25)</text><rect x="500.0" y="312.0" width="460.0" height="150.0" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/><text x="512.0" y="332.0" font-size="12.5" font-weight="bold" fill="#4c1d95" text-anchor="start">Physical and virtual resources</text><text x="512.0" y="352.0" font-size="11" font-weight="bold" fill="#6b7280" text-anchor="start">•</text><text x="524.0" y="352.0" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="start">Anything that is not a person: equipment, materials, supplies, facilities, infrastructure,</text><text x="524.0" y="365.4" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="start">software, testing environments, licenses, services, information or documents</text><text x="512.0" y="383.8" font-size="11" font-weight="bold" fill="#6b7280" text-anchor="start">•</text><text x="524.0" y="383.8" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="start">Plan availability, utilization and maintenance; they may need procurement (Topic 22)</text><text x="512.0" y="402.3" font-size="11" font-weight="bold" fill="#6b7280" text-anchor="start">•</text><text x="524.0" y="402.3" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="start">Managed through Monitor and Control Resourcing: right time, right place, right</text><text x="524.0" y="415.7" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="start">amount, released when no longer needed</text></svg>