<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 540" width="980" height="540" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">Choosing the approach and understanding the consequences of noncompliance</title><desc id="d">A decision flow from identified requirement to mandatory or voluntary treatment, and a grouping of consequences of noncompliance by severity.</desc><defs><marker id="ah0" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker></defs><rect x="0.75" y="0.75" width="978.5" height="538.5" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><text x="20.0" y="28.0" font-size="18" font-weight="bold" fill="#1f2937" text-anchor="start">Approach to a compliance need and the cost of getting it wrong</text><text x="20.0" y="48.0" font-size="12" font-weight="normal" fill="#6b7280" text-anchor="start">Mandatory means comply; voluntary or policy-based choices go through governance and are documented</text><rect x="20.0" y="70.0" width="300.0" height="44.0" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="170.0" y="95.9" font-size="12" font-weight="bold" fill="#1e3a8a" text-anchor="middle">Compliance requirement identified</text><line x1="170.0" y1="115.0" x2="170.0" y2="140.0" stroke="#1f2937" stroke-width="2.2" marker-end="url(#ah0)"/><polygon points="170.0,142.0 320.0,188.0 170.0,234.0 20.0,188.0" fill="#fef3c7" stroke="#d97706" stroke-width="1.8"/><text x="170.0" y="184.0" font-size="12.5" font-weight="bold" fill="#78350f" text-anchor="middle">Mandatory?</text><text x="170.0" y="200.0" font-size="10.5" font-weight="normal" fill="#78350f" text-anchor="middle">law, regulation, contract</text><line x1="320.0" y1="188.0" x2="372.0" y2="188.0" stroke="#1f2937" stroke-width="2.2" marker-end="url(#ah0)"/><text x="346.0" y="180.0" font-size="11" font-weight="bold" fill="#1f2937" text-anchor="middle">yes</text><rect x="374.0" y="140.0" width="260.0" height="98.0" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="384.0" y="172.3" font-size="10.8" font-weight="bold" fill="#14532d" text-anchor="start">Build it in</text><text x="384.0" y="185.8" font-size="10.8" font-weight="normal" fill="#14532d" text-anchor="start">Scope, backlog or WBS, schedule, budget,</text><text x="384.0" y="199.3" font-size="10.8" font-weight="normal" fill="#14532d" text-anchor="start">definition of done; assign an owner; plan how it</text><text x="384.0" y="212.8" font-size="10.8" font-weight="normal" fill="#14532d" text-anchor="start">will be verified and evidenced; train; monitor</text><line x1="170.0" y1="235.0" x2="170.0" y2="270.0" stroke="#1f2937" stroke-width="2.2" marker-end="url(#ah0)"/><text x="184.0" y="258.0" font-size="11" font-weight="bold" fill="#1f2937" text-anchor="start">no</text><rect x="20.0" y="272.0" width="300.0" height="84.0" rx="8" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.6"/><text x="30.0" y="304.0" font-size="10.8" font-weight="bold" fill="#134e4a" text-anchor="start">Voluntary standard or internal policy</text><text x="30.0" y="317.5" font-size="10.8" font-weight="normal" fill="#134e4a" text-anchor="start">Evaluate value, cost, risk and stakeholder expectations;</text><text x="30.0" y="331.0" font-size="10.8" font-weight="normal" fill="#134e4a" text-anchor="start">decide with governance</text><line x1="321.0" y1="314.0" x2="372.0" y2="314.0" stroke="#1f2937" stroke-width="2.2" marker-end="url(#ah0)"/><rect x="374.0" y="272.0" width="260.0" height="84.0" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.6"/><text x="384.0" y="304.0" font-size="10.8" font-weight="bold" fill="#4c1d95" text-anchor="start">Adopt, or deviate formally</text><text x="384.0" y="317.5" font-size="10.8" font-weight="normal" fill="#4c1d95" text-anchor="start">Any exception or waiver is requested through</text><text x="384.0" y="331.0" font-size="10.8" font-weight="normal" fill="#4c1d95" text-anchor="start">governance, risk-assessed and documented</text><rect x="20.0" y="376.0" width="614.0" height="146.0" rx="8" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.3"/><text x="32.0" y="396.0" font-size="12" font-weight="bold" fill="#1f2937" text-anchor="start">Responses to a threat to compliance (also in the risk register)</text><text x="32.0" y="414.0" font-size="10.8" font-weight="bold" fill="#6b7280" text-anchor="start">•</text><text x="44.0" y="414.0" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">Avoid or mitigate: change the design, process or scope; add controls and training; confirm requirements early</text><text x="32.0" y="431.0" font-size="10.8" font-weight="bold" fill="#6b7280" text-anchor="start">•</text><text x="44.0" y="431.0" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">Transfer carefully: contracts, indemnities and insurance move financial loss, but do not create compliance</text><text x="32.0" y="447.9" font-size="10.8" font-weight="bold" fill="#6b7280" text-anchor="start">•</text><text x="44.0" y="447.9" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">Escalate when it is beyond your authority or crosses jurisdictions (program or portfolio governance)</text><text x="32.0" y="464.9" font-size="10.8" font-weight="bold" fill="#6b7280" text-anchor="start">•</text><text x="44.0" y="464.9" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">Accept only with documented approval; never as a silent default for a mandatory requirement</text><text x="660.0" y="84.0" font-size="12.5" font-weight="bold" fill="#1f2937" text-anchor="start">Consequences, by severity</text><rect x="660.0" y="98.0" width="300.0" height="97.0" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.6"/><text x="672.0" y="119.0" font-size="12.5" font-weight="bold" fill="#7f1d1d" text-anchor="start">Severe</text><text x="674.0" y="140.0" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="start">• Harm to people or the environment</text><text x="674.0" y="161.0" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="start">• Stop-work order or loss of license to operate</text><text x="674.0" y="182.0" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="start">• Project termination or cancellation</text><rect x="660.0" y="205.0" width="300.0" height="97.0" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="672.0" y="226.0" font-size="12.5" font-weight="bold" fill="#78350f" text-anchor="start">High</text><text x="674.0" y="247.0" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="start">• Fines and penalties</text><text x="674.0" y="268.0" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="start">• Legal action and personal liability</text><text x="674.0" y="289.0" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="start">• Contract termination or contractual penalties</text><rect x="660.0" y="312.0" width="300.0" height="97.0" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="672.0" y="333.0" font-size="12.5" font-weight="bold" fill="#1e3a8a" text-anchor="start">Medium</text><text x="674.0" y="354.0" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="start">• Rework and delay (fixing later costs more)</text><text x="674.0" y="375.0" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="start">• Loss of market access</text><text x="674.0" y="396.0" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="start">• Reputation damage and stakeholder dissatisfaction</text><rect x="660.0" y="419.0" width="300.0" height="103.0" rx="8" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.3"/><text x="672.0" y="439.0" font-size="10.8" font-weight="bold" fill="#1e3a8a" text-anchor="start">Compare the cost of compliance with the cost of</text><text x="672.0" y="452.2" font-size="10.8" font-weight="bold" fill="#1e3a8a" text-anchor="start">noncompliance, as with cost of quality; for</text><text x="672.0" y="465.4" font-size="10.8" font-weight="bold" fill="#1e3a8a" text-anchor="start">mandatory requirements the question is how, not</text><text x="672.0" y="478.5" font-size="10.8" font-weight="bold" fill="#1e3a8a" text-anchor="start">whether.</text></svg>