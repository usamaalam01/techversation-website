<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 470" width="980" height="470" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">Where sustainability enters the project</title><desc id="d">Sustainability touchpoints across initiating, planning, executing, monitoring and controlling, and closing.</desc><defs></defs><rect x="0.75" y="0.75" width="978.5" height="468.5" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><text x="20.0" y="28.0" font-size="18" font-weight="bold" fill="#1f2937" text-anchor="start">Sustainability across the project</text><text x="20.0" y="48.0" font-size="12" font-weight="normal" fill="#6b7280" text-anchor="start">Integrated in every area and phase, not added at the end</text><rect x="20.0" y="70.0" width="172.0" height="38.0" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="106.0" y="93.1" font-size="12.5" font-weight="bold" fill="#1e3a8a" text-anchor="middle">Initiating</text><rect x="20.0" y="114.0" width="172.0" height="304.0" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/><text x="30.0" y="134.0" font-size="12" font-weight="bold" fill="#2563eb" text-anchor="start">•</text><text x="42.0" y="134.0" font-size="11.2" font-weight="normal" fill="#1f2937" text-anchor="start">Sustainability goals and</text><text x="42.0" y="147.7" font-size="11.2" font-weight="normal" fill="#1f2937" text-anchor="start">KPIs in the business case,</text><text x="42.0" y="161.3" font-size="11.2" font-weight="normal" fill="#1f2937" text-anchor="start">charter and authorizing</text><text x="42.0" y="175.0" font-size="11.2" font-weight="normal" fill="#1f2937" text-anchor="start">documents</text><text x="30.0" y="196.7" font-size="12" font-weight="bold" fill="#2563eb" text-anchor="start">•</text><text x="42.0" y="196.7" font-size="11.2" font-weight="normal" fill="#1f2937" text-anchor="start">Sponsor confirms goals; if</text><text x="42.0" y="210.3" font-size="11.2" font-weight="normal" fill="#1f2937" text-anchor="start">absent, raise the discussion</text><text x="30.0" y="232.0" font-size="12" font-weight="bold" fill="#2563eb" text-anchor="start">•</text><text x="42.0" y="232.0" font-size="11.2" font-weight="normal" fill="#1f2937" text-anchor="start">Broader stakeholders:</text><text x="42.0" y="245.6" font-size="11.2" font-weight="normal" fill="#1f2937" text-anchor="start">community, society, future</text><text x="42.0" y="259.3" font-size="11.2" font-weight="normal" fill="#1f2937" text-anchor="start">generations</text><rect x="206.0" y="70.0" width="172.0" height="38.0" rx="8" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.6"/><text x="292.0" y="93.1" font-size="12.5" font-weight="bold" fill="#134e4a" text-anchor="middle">Planning</text><rect x="206.0" y="114.0" width="172.0" height="304.0" rx="8" fill="#ffffff" stroke="#0d9488" stroke-width="1.5"/><text x="216.0" y="134.0" font-size="12" font-weight="bold" fill="#0d9488" text-anchor="start">•</text><text x="228.0" y="134.0" font-size="11.2" font-weight="normal" fill="#1f2937" text-anchor="start">Requirements and scope</text><text x="228.0" y="147.7" font-size="11.2" font-weight="normal" fill="#1f2937" text-anchor="start">statement include</text><text x="228.0" y="161.3" font-size="11.2" font-weight="normal" fill="#1f2937" text-anchor="start">sustainability KPIs</text><text x="216.0" y="183.0" font-size="12" font-weight="bold" fill="#0d9488" text-anchor="start">•</text><text x="228.0" y="183.0" font-size="11.2" font-weight="normal" fill="#1f2937" text-anchor="start">WBS or backlog has</text><text x="228.0" y="196.7" font-size="11.2" font-weight="normal" fill="#1f2937" text-anchor="start">activities to manage</text><text x="228.0" y="210.3" font-size="11.2" font-weight="normal" fill="#1f2937" text-anchor="start">sustainability (e.g., CO2</text><text x="228.0" y="224.0" font-size="11.2" font-weight="normal" fill="#1f2937" text-anchor="start">emissions, biodiversity</text><text x="228.0" y="237.6" font-size="11.2" font-weight="normal" fill="#1f2937" text-anchor="start">impact)</text><text x="216.0" y="259.3" font-size="12" font-weight="bold" fill="#0d9488" text-anchor="start">•</text><text x="228.0" y="259.3" font-size="11.2" font-weight="normal" fill="#1f2937" text-anchor="start">Sourcing criteria and</text><text x="228.0" y="273.0" font-size="11.2" font-weight="normal" fill="#1f2937" text-anchor="start">contracts: sustainability</text><text x="228.0" y="286.6" font-size="11.2" font-weight="normal" fill="#1f2937" text-anchor="start">goals, ESG</text><text x="216.0" y="308.3" font-size="12" font-weight="bold" fill="#0d9488" text-anchor="start">•</text><text x="228.0" y="308.3" font-size="11.2" font-weight="normal" fill="#1f2937" text-anchor="start">Risks: sustainability threats</text><text x="228.0" y="322.0" font-size="11.2" font-weight="normal" fill="#1f2937" text-anchor="start">and opportunities</text><text x="216.0" y="343.6" font-size="12" font-weight="bold" fill="#0d9488" text-anchor="start">•</text><text x="228.0" y="343.6" font-size="11.2" font-weight="normal" fill="#1f2937" text-anchor="start">Budget: green investments</text><text x="228.0" y="357.3" font-size="11.2" font-weight="normal" fill="#1f2937" text-anchor="start">vs long-term savings</text><rect x="392.0" y="70.0" width="172.0" height="38.0" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="478.0" y="93.1" font-size="12.5" font-weight="bold" fill="#14532d" text-anchor="middle">Executing</text><rect x="392.0" y="114.0" width="172.0" height="304.0" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/><text x="402.0" y="134.0" font-size="12" font-weight="bold" fill="#16a34a" text-anchor="start">•</text><text x="414.0" y="134.0" font-size="11.2" font-weight="normal" fill="#1f2937" text-anchor="start">Sustainable materials and</text><text x="414.0" y="147.7" font-size="11.2" font-weight="normal" fill="#1f2937" text-anchor="start">practices; green HR</text><text x="402.0" y="169.3" font-size="12" font-weight="bold" fill="#16a34a" text-anchor="start">•</text><text x="414.0" y="169.3" font-size="11.2" font-weight="normal" fill="#1f2937" text-anchor="start">Suppliers apply agreed</text><text x="414.0" y="183.0" font-size="11.2" font-weight="normal" fill="#1f2937" text-anchor="start">standards</text><text x="402.0" y="204.7" font-size="12" font-weight="bold" fill="#16a34a" text-anchor="start">•</text><text x="414.0" y="204.7" font-size="11.2" font-weight="normal" fill="#1f2937" text-anchor="start">Stakeholder engagement</text><text x="414.0" y="218.3" font-size="11.2" font-weight="normal" fill="#1f2937" text-anchor="start">and education on</text><text x="414.0" y="232.0" font-size="11.2" font-weight="normal" fill="#1f2937" text-anchor="start">sustainability</text><text x="402.0" y="253.6" font-size="12" font-weight="bold" fill="#16a34a" text-anchor="start">•</text><text x="414.0" y="253.6" font-size="11.2" font-weight="normal" fill="#1f2937" text-anchor="start">Quality: processes that</text><text x="414.0" y="267.3" font-size="11.2" font-weight="normal" fill="#1f2937" text-anchor="start">avoid waste and rework</text><rect x="578.0" y="70.0" width="172.0" height="38.0" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="664.0" y="93.1" font-size="12.5" font-weight="bold" fill="#78350f" text-anchor="middle">Monitoring &amp; Controlling</text><rect x="578.0" y="114.0" width="172.0" height="304.0" rx="8" fill="#ffffff" stroke="#d97706" stroke-width="1.5"/><text x="588.0" y="134.0" font-size="12" font-weight="bold" fill="#d97706" text-anchor="start">•</text><text x="600.0" y="134.0" font-size="11.2" font-weight="normal" fill="#1f2937" text-anchor="start">Monitor compliance and</text><text x="600.0" y="147.7" font-size="11.2" font-weight="normal" fill="#1f2937" text-anchor="start">sustainability KPIs</text><text x="588.0" y="169.3" font-size="12" font-weight="bold" fill="#d97706" text-anchor="start">•</text><text x="600.0" y="169.3" font-size="11.2" font-weight="normal" fill="#1f2937" text-anchor="start">Tools give the team the</text><text x="600.0" y="183.0" font-size="11.2" font-weight="normal" fill="#1f2937" text-anchor="start">information to manage</text><text x="600.0" y="196.7" font-size="11.2" font-weight="normal" fill="#1f2937" text-anchor="start">sustainability</text><text x="588.0" y="218.3" font-size="12" font-weight="bold" fill="#d97706" text-anchor="start">•</text><text x="600.0" y="218.3" font-size="11.2" font-weight="normal" fill="#1f2937" text-anchor="start">Change control weighs</text><text x="600.0" y="232.0" font-size="11.2" font-weight="normal" fill="#1f2937" text-anchor="start">environmental and social</text><text x="600.0" y="245.6" font-size="11.2" font-weight="normal" fill="#1f2937" text-anchor="start">impact</text><text x="588.0" y="267.3" font-size="12" font-weight="bold" fill="#d97706" text-anchor="start">•</text><text x="600.0" y="267.3" font-size="11.2" font-weight="normal" fill="#1f2937" text-anchor="start">Manage sustainability risks</text><rect x="764.0" y="70.0" width="172.0" height="38.0" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.6"/><text x="850.0" y="93.1" font-size="12.5" font-weight="bold" fill="#4c1d95" text-anchor="middle">Closing</text><rect x="764.0" y="114.0" width="172.0" height="304.0" rx="8" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/><text x="774.0" y="134.0" font-size="12" font-weight="bold" fill="#7c3aed" text-anchor="start">•</text><text x="786.0" y="134.0" font-size="11.2" font-weight="normal" fill="#1f2937" text-anchor="start">Verify outcomes and</text><text x="786.0" y="147.7" font-size="11.2" font-weight="normal" fill="#1f2937" text-anchor="start">benefits, including</text><text x="786.0" y="161.3" font-size="11.2" font-weight="normal" fill="#1f2937" text-anchor="start">sustainability results</text><text x="774.0" y="183.0" font-size="12" font-weight="bold" fill="#7c3aed" text-anchor="start">•</text><text x="786.0" y="183.0" font-size="11.2" font-weight="normal" fill="#1f2937" text-anchor="start">Transition, handover and</text><text x="786.0" y="196.7" font-size="11.2" font-weight="normal" fill="#1f2937" text-anchor="start">disposal with minimal</text><text x="786.0" y="210.3" font-size="11.2" font-weight="normal" fill="#1f2937" text-anchor="start">impact</text><text x="774.0" y="232.0" font-size="12" font-weight="bold" fill="#7c3aed" text-anchor="start">•</text><text x="786.0" y="232.0" font-size="11.2" font-weight="normal" fill="#1f2937" text-anchor="start">Lessons learned and OPA</text><text x="786.0" y="245.6" font-size="11.2" font-weight="normal" fill="#1f2937" text-anchor="start">updates for future projects</text><text x="490.0" y="454.0" font-size="11.5" font-weight="normal" fill="#6b7280" text-anchor="middle" font-style="italic">Challenge: broader scope and more stakeholders can add cost and complexity. There are no universal sustainability criteria, so tailor KPIs to the project.</text></svg>