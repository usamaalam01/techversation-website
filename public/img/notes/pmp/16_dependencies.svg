<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 524" width="980" height="524" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">Logical relationships, leads and lags, dependency types</title><desc id="d">Finish-to-start, start-to-start, finish-to-finish and start-to-finish relationships; a lag and a lead on finish-to-start; and the mandatory or discretionary, internal or external classification of dependencies.</desc><defs><marker id="ah0" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker></defs><rect x="0.75" y="0.75" width="978.5" height="522.5" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><text x="20.0" y="28.0" font-size="18" font-weight="bold" fill="#1f2937" text-anchor="start">Dependencies: relationships, leads and lags, types</text><text x="20.0" y="48.0" font-size="12" font-weight="normal" fill="#6b7280" text-anchor="start">Precedence diagramming method (activities as nodes) with the four relationship types</text><rect x="20.0" y="64.0" width="268.0" height="128.0" rx="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.3"/><text x="30.0" y="82.0" font-size="11.8" font-weight="bold" fill="#1e3a8a" text-anchor="start">Finish-to-start (FS): most common</text><text x="30.0" y="97.0" font-size="10.3" font-weight="normal" fill="#6b7280" text-anchor="start">B cannot start until A finishes (install the OS after the</text><text x="30.0" y="109.2" font-size="10.3" font-weight="normal" fill="#6b7280" text-anchor="start">PC is assembled)</text><rect x="34.0" y="128.0" width="105.0" height="16.0" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><text x="86.5" y="140.0" font-size="11" font-weight="bold" fill="#1e3a8a" text-anchor="middle">A</text><rect x="139.0" y="160.0" width="105.0" height="16.0" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/><text x="191.5" y="172.0" font-size="11" font-weight="bold" fill="#14532d" text-anchor="middle">B</text><line x1="138.0" y1="144.0" x2="140.0" y2="160.0" stroke="#dc2626" stroke-width="1.8" marker-end="url(#ah0)"/><rect x="298.0" y="64.0" width="268.0" height="128.0" rx="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.3"/><text x="308.0" y="82.0" font-size="11.8" font-weight="bold" fill="#1e3a8a" text-anchor="start">Start-to-start (SS)</text><text x="308.0" y="97.0" font-size="10.3" font-weight="normal" fill="#6b7280" text-anchor="start">B cannot start until A starts (level the concrete once</text><text x="308.0" y="109.2" font-size="10.3" font-weight="normal" fill="#6b7280" text-anchor="start">the pour begins)</text><rect x="312.0" y="128.0" width="126.0" height="16.0" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><text x="375.0" y="140.0" font-size="11" font-weight="bold" fill="#1e3a8a" text-anchor="middle">A</text><rect x="312.0" y="160.0" width="105.0" height="16.0" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/><text x="364.5" y="172.0" font-size="11" font-weight="bold" fill="#14532d" text-anchor="middle">B</text><line x1="314.0" y1="144.0" x2="314.0" y2="160.0" stroke="#dc2626" stroke-width="1.8" marker-end="url(#ah0)"/><rect x="20.0" y="202.0" width="268.0" height="128.0" rx="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.3"/><text x="30.0" y="220.0" font-size="11.8" font-weight="bold" fill="#1e3a8a" text-anchor="start">Finish-to-finish (FF)</text><text x="30.0" y="235.0" font-size="10.3" font-weight="normal" fill="#6b7280" text-anchor="start">B cannot finish until A finishes (editing finishes after</text><text x="30.0" y="247.2" font-size="10.3" font-weight="normal" fill="#6b7280" text-anchor="start">writing finishes)</text><rect x="34.0" y="266.0" width="126.0" height="16.0" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><text x="97.0" y="278.0" font-size="11" font-weight="bold" fill="#1e3a8a" text-anchor="middle">A</text><rect x="76.0" y="298.0" width="84.0" height="16.0" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/><text x="118.0" y="310.0" font-size="11" font-weight="bold" fill="#14532d" text-anchor="middle">B</text><line x1="158.0" y1="282.0" x2="158.0" y2="298.0" stroke="#dc2626" stroke-width="1.8" marker-end="url(#ah0)"/><rect x="298.0" y="202.0" width="268.0" height="128.0" rx="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.3"/><text x="308.0" y="220.0" font-size="11.8" font-weight="bold" fill="#1e3a8a" text-anchor="start">Start-to-finish (SF): very rare</text><text x="308.0" y="235.0" font-size="10.3" font-weight="normal" fill="#6b7280" text-anchor="start">A cannot finish until B starts (shut the old system once</text><text x="308.0" y="247.2" font-size="10.3" font-weight="normal" fill="#6b7280" text-anchor="start">the new one starts)</text><rect x="312.0" y="266.0" width="105.0" height="16.0" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><text x="364.5" y="278.0" font-size="11" font-weight="bold" fill="#1e3a8a" text-anchor="middle">A</text><rect x="417.0" y="298.0" width="105.0" height="16.0" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/><text x="469.5" y="310.0" font-size="11" font-weight="bold" fill="#14532d" text-anchor="middle">B</text><line x1="418.0" y1="298.0" x2="416.0" y2="282.0" stroke="#dc2626" stroke-width="1.8" marker-end="url(#ah0)"/><rect x="590.0" y="64.0" width="370.0" height="128.0" rx="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.3"/><text x="600.0" y="82.0" font-size="11.8" font-weight="bold" fill="#1e3a8a" text-anchor="start">Lag: wait time added (FS + 2)</text><text x="600.0" y="96.0" font-size="10.3" font-weight="normal" fill="#6b7280" text-anchor="start">e.g., concrete cures before the next activity starts</text><rect x="604.0" y="108.0" width="84.0" height="16.0" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><text x="646.0" y="120.0" font-size="11" font-weight="bold" fill="#1e3a8a" text-anchor="middle">A</text><rect x="688.0" y="108.0" width="42.0" height="16.0" rx="3" fill="#fee2e2" stroke="#dc2626" stroke-width="1.2" stroke-dasharray="3 2"/><text x="709.0" y="120.0" font-size="10" font-weight="bold" fill="#991b1b" text-anchor="middle">lag</text><rect x="730.0" y="140.0" width="84.0" height="16.0" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/><text x="772.0" y="152.0" font-size="11" font-weight="bold" fill="#14532d" text-anchor="middle">B</text><line x1="731.0" y1="124.0" x2="731.0" y2="140.0" stroke="#dc2626" stroke-width="1.8" marker-end="url(#ah0)"/><text x="600.0" y="176.0" font-size="10.3" font-weight="normal" fill="#1f2937" text-anchor="start">A lag delays the successor; durations do not include lags.</text><rect x="590.0" y="202.0" width="370.0" height="128.0" rx="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.3"/><text x="600.0" y="220.0" font-size="11.8" font-weight="bold" fill="#1e3a8a" text-anchor="start">Lead: overlap allowed (FS − 2)</text><text x="600.0" y="234.0" font-size="10.3" font-weight="normal" fill="#6b7280" text-anchor="start">e.g., landscaping starts 2 weeks before the punch list is done</text><rect x="604.0" y="246.0" width="126.0" height="16.0" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><text x="667.0" y="258.0" font-size="11" font-weight="bold" fill="#1e3a8a" text-anchor="middle">A</text><rect x="688.0" y="278.0" width="105.0" height="16.0" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/><text x="740.5" y="290.0" font-size="11" font-weight="bold" fill="#14532d" text-anchor="middle">B</text><rect x="688.0" y="246.0" width="42.0" height="16.0" rx="3" fill="#fee2e2" stroke="#dc2626" stroke-width="1.2" stroke-dasharray="3 2"/><text x="709.0" y="258.0" font-size="10" font-weight="bold" fill="#991b1b" text-anchor="middle">lead</text><line x1="689.0" y1="262.0" x2="689.0" y2="278.0" stroke="#dc2626" stroke-width="1.8" marker-end="url(#ah0)"/><text x="600.0" y="314.0" font-size="10.3" font-weight="normal" fill="#1f2937" text-anchor="start">A lead lets the successor start early; use sparingly and document it.</text><text x="20.0" y="358.0" font-size="13" font-weight="bold" fill="#1f2937" text-anchor="start">Dependency attributes (two apply at the same time)</text><rect x="250.0" y="372.0" width="346.0" height="26.0" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/><text x="423.0" y="390.0" font-size="11.5" font-weight="bold" fill="#1e3a8a" text-anchor="middle">Internal (team controls)</text><rect x="600.0" y="372.0" width="360.0" height="26.0" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/><text x="780.0" y="390.0" font-size="11.5" font-weight="bold" fill="#1e3a8a" text-anchor="middle">External (outside the project)</text><rect x="20.0" y="404.0" width="226.0" height="46.0" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/><text x="133.0" y="422.0" font-size="11.5" font-weight="bold" fill="#14532d" text-anchor="middle">Mandatory</text><text x="133.0" y="435.0" font-size="9.5" font-weight="normal" fill="#14532d" text-anchor="middle">(hard logic: law, contract, nature of the work)</text><rect x="250.0" y="404.0" width="346.0" height="46.0" rx="4" fill="#ffffff" stroke="#d1d5db" stroke-width="1.2"/><text x="423.0" y="431.0" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="middle">Prototype is built before it can be tested</text><rect x="600.0" y="404.0" width="360.0" height="46.0" rx="4" fill="#ffffff" stroke="#d1d5db" stroke-width="1.2"/><text x="780.0" y="431.0" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="middle">Regulator's permit before construction starts</text><rect x="20.0" y="456.0" width="226.0" height="46.0" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/><text x="133.0" y="474.0" font-size="11.5" font-weight="bold" fill="#14532d" text-anchor="middle">Discretionary</text><text x="133.0" y="487.0" font-size="9.5" font-weight="normal" fill="#14532d" text-anchor="middle">(soft or preferred logic: good practice)</text><rect x="250.0" y="456.0" width="346.0" height="46.0" rx="4" fill="#ffffff" stroke="#d1d5db" stroke-width="1.2"/><text x="423.0" y="483.0" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="middle">Plumbing before electrical, although parallel is possible</text><rect x="600.0" y="456.0" width="360.0" height="46.0" rx="4" fill="#ffffff" stroke="#d1d5db" stroke-width="1.2"/><text x="780.0" y="483.0" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="middle">Order the full lot after a supplier's trial batch (preference)</text></svg>