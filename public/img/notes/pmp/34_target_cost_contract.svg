<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 542" width="980" height="542" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">Target-cost contract with a ceiling and the point of total assumption</title><desc id="d">Target cost 200,000, target fee 20,000, target price 220,000, ceiling price 250,000, sharing ratio 80 percent buyer and 20 percent seller. The buyer's price rises by 80 cents for each dollar of actual cost until the point of total assumption at an actual cost of 237,500, where the price reaches the 250,000 ceiling; beyond that the seller bears every extra dollar.</desc><defs></defs><rect x="0.75" y="0.75" width="978.5" height="540.5" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><text x="20.0" y="28.0" font-size="18" font-weight="bold" fill="#1f2937" text-anchor="start">Target-cost contract: sharing and the point of total assumption [Beyond PMBOK 8 numbers]</text><text x="20.0" y="48.0" font-size="12" font-weight="normal" fill="#6b7280" text-anchor="start">Target cost 200,000 · target fee 20,000 · target price 220,000 · ceiling 250,000 · share 80 / 20 (buyer / seller)</text><rect x="70.0" y="86.0" width="520.0" height="250.0" rx="4" fill="#ffffff" stroke="#d1d5db" stroke-width="1.2"/><line x1="70.0" y1="336.0" x2="590.0" y2="336.0" stroke="#eef2f7" stroke-width="1"/><text x="64.0" y="340.0" font-size="9.5" font-weight="normal" fill="#6b7280" text-anchor="end">190,000</text><line x1="70.0" y1="300.3" x2="590.0" y2="300.3" stroke="#eef2f7" stroke-width="1"/><text x="64.0" y="304.3" font-size="9.5" font-weight="normal" fill="#6b7280" text-anchor="end">200,000</text><line x1="70.0" y1="264.6" x2="590.0" y2="264.6" stroke="#eef2f7" stroke-width="1"/><text x="64.0" y="268.6" font-size="9.5" font-weight="normal" fill="#6b7280" text-anchor="end">210,000</text><line x1="70.0" y1="228.9" x2="590.0" y2="228.9" stroke="#eef2f7" stroke-width="1"/><text x="64.0" y="232.9" font-size="9.5" font-weight="normal" fill="#6b7280" text-anchor="end">220,000</text><line x1="70.0" y1="193.1" x2="590.0" y2="193.1" stroke="#eef2f7" stroke-width="1"/><text x="64.0" y="197.1" font-size="9.5" font-weight="normal" fill="#6b7280" text-anchor="end">230,000</text><line x1="70.0" y1="157.4" x2="590.0" y2="157.4" stroke="#eef2f7" stroke-width="1"/><text x="64.0" y="161.4" font-size="9.5" font-weight="normal" fill="#6b7280" text-anchor="end">240,000</text><line x1="70.0" y1="121.7" x2="590.0" y2="121.7" stroke="#eef2f7" stroke-width="1"/><text x="64.0" y="125.7" font-size="9.5" font-weight="normal" fill="#6b7280" text-anchor="end">250,000</text><line x1="70.0" y1="86.0" x2="590.0" y2="86.0" stroke="#eef2f7" stroke-width="1"/><text x="64.0" y="90.0" font-size="9.5" font-weight="normal" fill="#6b7280" text-anchor="end">260,000</text><line x1="70.0" y1="86.0" x2="70.0" y2="336.0" stroke="#eef2f7" stroke-width="1"/><text x="70.0" y="350.0" font-size="9.5" font-weight="normal" fill="#6b7280" text-anchor="middle">170,000</text><line x1="174.0" y1="86.0" x2="174.0" y2="336.0" stroke="#eef2f7" stroke-width="1"/><text x="174.0" y="350.0" font-size="9.5" font-weight="normal" fill="#6b7280" text-anchor="middle">190,000</text><line x1="278.0" y1="86.0" x2="278.0" y2="336.0" stroke="#eef2f7" stroke-width="1"/><text x="278.0" y="350.0" font-size="9.5" font-weight="normal" fill="#6b7280" text-anchor="middle">210,000</text><line x1="382.0" y1="86.0" x2="382.0" y2="336.0" stroke="#eef2f7" stroke-width="1"/><text x="382.0" y="350.0" font-size="9.5" font-weight="normal" fill="#6b7280" text-anchor="middle">230,000</text><line x1="486.0" y1="86.0" x2="486.0" y2="336.0" stroke="#eef2f7" stroke-width="1"/><text x="486.0" y="350.0" font-size="9.5" font-weight="normal" fill="#6b7280" text-anchor="middle">250,000</text><line x1="590.0" y1="86.0" x2="590.0" y2="336.0" stroke="#eef2f7" stroke-width="1"/><text x="590.0" y="350.0" font-size="9.5" font-weight="normal" fill="#6b7280" text-anchor="middle">270,000</text><text x="330.0" y="366.0" font-size="10.5" font-weight="bold" fill="#6b7280" text-anchor="middle">Actual cost</text><text x="22.0" y="78.0" font-size="10.5" font-weight="bold" fill="#6b7280" text-anchor="start">Buyer pays (price)</text><line x1="70.0" y1="121.7" x2="590.0" y2="121.7" stroke="#dc2626" stroke-width="1.8" stroke-dasharray="6 4"/><text x="586.0" y="115.7" font-size="10.5" font-weight="bold" fill="#dc2626" text-anchor="end">Ceiling price 250,000</text><line x1="70.0" y1="314.6" x2="421.0" y2="121.7" stroke="#2563eb" stroke-width="3"/><line x1="421.0" y1="121.7" x2="590.0" y2="121.7" stroke="#2563eb" stroke-width="3"/><circle cx="226.0" cy="228.9" r="6" fill="#fef3c7" stroke="#d97706" stroke-width="2"/><text x="236.0" y="244.9" font-size="10.5" font-weight="bold" fill="#78350f" text-anchor="start">Target: cost 200,000, price 220,000</text><circle cx="421.0" cy="121.7" r="6" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><line x1="421.0" y1="121.7" x2="421.0" y2="336.0" stroke="#2563eb" stroke-width="1.2" stroke-dasharray="3 3"/><text x="415.0" y="328.0" font-size="10.5" font-weight="bold" fill="#1e3a8a" text-anchor="end">PTA 237,500</text><text x="80.4" y="136.0" font-size="10" font-weight="normal" fill="#1e3a8a" text-anchor="start">Slope 0.8: the buyer pays 80% of each change in cost</text><text x="475.6" y="139.7" font-size="10" font-weight="bold" fill="#7f1d1d" text-anchor="start">seller bears 100%</text><rect x="612.0" y="62.0" width="346.0" height="300.0" rx="10" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/><text x="624.0" y="84.0" font-size="12.5" font-weight="bold" fill="#1f2937" text-anchor="start">Scenarios</text><text x="622.0" y="106.0" font-size="10.5" font-weight="bold" fill="#6b7280" text-anchor="start">Actual cost</text><text x="710.0" y="106.0" font-size="10.5" font-weight="bold" fill="#6b7280" text-anchor="start">Seller fee</text><text x="796.0" y="106.0" font-size="10.5" font-weight="bold" fill="#6b7280" text-anchor="start">Buyer pays</text><text x="880.0" y="106.0" font-size="10.5" font-weight="bold" fill="#6b7280" text-anchor="start">Seller</text><rect x="618.0" y="116.0" width="334.0" height="34.0" rx="6" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.2"/><text x="622.0" y="131.0" font-size="11.5" font-weight="bold" fill="#1f2937" text-anchor="start">180,000</text><text x="622.0" y="144.0" font-size="9.5" font-weight="normal" fill="#6b7280" text-anchor="start">saves 20,000</text><text x="710.0" y="138.0" font-size="11.5" font-weight="bold" fill="#1f2937" text-anchor="start">24,000</text><text x="796.0" y="138.0" font-size="11.5" font-weight="bold" fill="#1f2937" text-anchor="start">204,000</text><text x="880.0" y="138.0" font-size="10.5" font-weight="normal" fill="#14532d" text-anchor="start">earns fee</text><rect x="618.0" y="156.0" width="334.0" height="34.0" rx="6" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.2"/><text x="622.0" y="171.0" font-size="11.5" font-weight="bold" fill="#1f2937" text-anchor="start">200,000</text><text x="622.0" y="184.0" font-size="9.5" font-weight="normal" fill="#6b7280" text-anchor="start">on target</text><text x="710.0" y="178.0" font-size="11.5" font-weight="bold" fill="#1f2937" text-anchor="start">20,000</text><text x="796.0" y="178.0" font-size="11.5" font-weight="bold" fill="#1f2937" text-anchor="start">220,000</text><text x="880.0" y="178.0" font-size="10.5" font-weight="normal" fill="#14532d" text-anchor="start">earns fee</text><rect x="618.0" y="196.0" width="334.0" height="34.0" rx="6" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.2"/><text x="622.0" y="211.0" font-size="11.5" font-weight="bold" fill="#1f2937" text-anchor="start">230,000</text><text x="622.0" y="224.0" font-size="9.5" font-weight="normal" fill="#6b7280" text-anchor="start">overrun 30,000</text><text x="710.0" y="218.0" font-size="11.5" font-weight="bold" fill="#1f2937" text-anchor="start">14,000</text><text x="796.0" y="218.0" font-size="11.5" font-weight="bold" fill="#1f2937" text-anchor="start">244,000</text><text x="880.0" y="218.0" font-size="10.5" font-weight="normal" fill="#14532d" text-anchor="start">earns fee</text><rect x="618.0" y="236.0" width="334.0" height="34.0" rx="6" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.2"/><text x="622.0" y="251.0" font-size="11.5" font-weight="bold" fill="#1f2937" text-anchor="start">237,500</text><text x="622.0" y="264.0" font-size="9.5" font-weight="normal" fill="#6b7280" text-anchor="start">at PTA</text><text x="710.0" y="258.0" font-size="11.5" font-weight="bold" fill="#1f2937" text-anchor="start">12,500</text><text x="796.0" y="258.0" font-size="11.5" font-weight="bold" fill="#1f2937" text-anchor="start">250,000</text><text x="880.0" y="258.0" font-size="10.5" font-weight="normal" fill="#14532d" text-anchor="start">earns fee</text><rect x="618.0" y="276.0" width="334.0" height="34.0" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="1.2"/><text x="622.0" y="291.0" font-size="11.5" font-weight="bold" fill="#1f2937" text-anchor="start">260,000</text><text x="622.0" y="304.0" font-size="9.5" font-weight="normal" fill="#6b7280" text-anchor="start">over PTA</text><text x="710.0" y="298.0" font-size="11.5" font-weight="bold" fill="#7f1d1d" text-anchor="start">−10,000</text><text x="796.0" y="298.0" font-size="11.5" font-weight="bold" fill="#1f2937" text-anchor="start">250,000</text><text x="880.0" y="298.0" font-size="10.5" font-weight="normal" fill="#7f1d1d" text-anchor="start">loses money</text><text x="624.0" y="322.0" font-size="10.4" font-weight="normal" fill="#1f2937" text-anchor="start">Price = actual cost + fee, capped at the ceiling. Fee = target fee +</text><text x="624.0" y="334.5" font-size="10.4" font-weight="normal" fill="#1f2937" text-anchor="start">seller share × (target cost − actual cost).</text><rect x="22.0" y="384.0" width="456.0" height="128.0" rx="10" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.6"/><text x="34.0" y="406.0" font-size="12.5" font-weight="bold" fill="#134e4a" text-anchor="start">Formulas</text><text x="34.0" y="426.0" font-size="10.8" font-weight="bold" fill="#6b7280" text-anchor="start">•</text><text x="46.0" y="426.0" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">Target price = target cost + target fee</text><text x="34.0" y="443.2" font-size="10.8" font-weight="bold" fill="#6b7280" text-anchor="start">•</text><text x="46.0" y="443.2" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">Seller fee = target fee + seller share × (target cost − actual cost)</text><text x="34.0" y="460.4" font-size="10.8" font-weight="bold" fill="#6b7280" text-anchor="start">•</text><text x="46.0" y="460.4" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">PTA = (ceiling price − target price) ÷ buyer share + target cost = (250,000 − 220,000) ÷</text><text x="46.0" y="473.5" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">0.8 + 200,000 = 237,500</text><rect x="502.0" y="384.0" width="456.0" height="128.0" rx="10" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.6"/><text x="514.0" y="406.0" font-size="12.5" font-weight="bold" fill="#374151" text-anchor="start">What to remember</text><text x="514.0" y="426.0" font-size="10.8" font-weight="bold" fill="#6b7280" text-anchor="start">•</text><text x="526.0" y="426.0" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">Above the PTA the seller absorbs every extra dollar of cost</text><text x="514.0" y="443.2" font-size="10.8" font-weight="bold" fill="#6b7280" text-anchor="start">•</text><text x="526.0" y="443.2" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">PMBOK 8 names the target-cost contract (sharing of savings and overruns) but prints</text><text x="526.0" y="456.4" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">no formulas</text><text x="514.0" y="473.5" font-size="10.8" font-weight="bold" fill="#6b7280" text-anchor="start">•</text><text x="526.0" y="473.5" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">Fixed price: seller carries cost risk; cost-reimbursable: buyer carries it</text></svg>