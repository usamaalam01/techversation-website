<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 450" width="960" height="450" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">Agile planning layers</title><desc id="d">Product vision drives the product roadmap, which drives release plans, which drive iteration plans; detail and precision increase as the horizon shortens.</desc><defs><marker id="ah0" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker><marker id="ah1" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker></defs><rect x="0.75" y="0.75" width="958.5" height="448.5" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><text x="20.0" y="28.0" font-size="18" font-weight="bold" fill="#1f2937" text-anchor="start">Agile planning layers: from vision to the daily plan</text><text x="20.0" y="48.0" font-size="12" font-weight="normal" fill="#6b7280" text-anchor="start">PMBOK 8 Figure 5-1: vision drives roadmap, roadmap drives releases, releases establish iterations</text><rect x="20.0" y="64.0" width="640.0" height="56.0" rx="8" fill="#1e3a8a" stroke="#1e3a8a" stroke-width="1.6"/><text x="34.0" y="84.0" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="start">Product vision</text><text x="34.0" y="101.0" font-size="11.5" font-weight="normal" fill="#ffffff" text-anchor="start">Why the product exists and where it is going; shared by team and stakeholders</text><text x="690.0" y="92.0" font-size="12.5" font-weight="bold" fill="#1f2937" text-anchor="start">Strategic, long horizon</text><line x1="340.0" y1="120.0" x2="353.0" y2="130.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#ah0)"/><rect x="46.0" y="130.0" width="608.8" height="56.0" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="60.0" y="150.0" font-size="14" font-weight="bold" fill="#1e3a8a" text-anchor="start">Product roadmap</text><text x="60.0" y="167.0" font-size="11.5" font-weight="normal" fill="#1e3a8a" text-anchor="start">Themes and major capabilities over time; reviewed as the market and feedback change</text><text x="690.0" y="158.0" font-size="12.5" font-weight="bold" fill="#1f2937" text-anchor="start">Quarters to a year or more</text><line x1="350.4" y1="186.0" x2="363.4" y2="196.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#ah0)"/><rect x="72.0" y="196.0" width="577.6" height="56.0" rx="8" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.6"/><text x="86.0" y="216.0" font-size="14" font-weight="bold" fill="#134e4a" text-anchor="start">Release plan</text><text x="86.0" y="233.0" font-size="11.5" font-weight="normal" fill="#134e4a" text-anchor="start">High-level timeline (typically 3 to 6 months): number of iterations; which features arrive when</text><text x="690.0" y="224.0" font-size="12.5" font-weight="bold" fill="#1f2937" text-anchor="start">3 to 6 months</text><line x1="360.8" y1="252.0" x2="373.8" y2="262.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#ah0)"/><rect x="98.0" y="262.0" width="546.4" height="56.0" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="112.0" y="282.0" font-size="14" font-weight="bold" fill="#14532d" text-anchor="start">Iteration plan</text><text x="112.0" y="299.0" font-size="11.5" font-weight="normal" fill="#14532d" text-anchor="start">Stories selected from the backlog, broken into tasks, estimated (story points for stories, hours for</text><text x="112.0" y="312.8" font-size="11.5" font-weight="normal" fill="#14532d" text-anchor="start">tasks)</text><text x="690.0" y="290.0" font-size="12.5" font-weight="bold" fill="#1f2937" text-anchor="start">1 to 4 weeks</text><line x1="371.2" y1="318.0" x2="384.2" y2="328.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#ah0)"/><rect x="124.0" y="328.0" width="515.2" height="56.0" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="138.0" y="348.0" font-size="14" font-weight="bold" fill="#78350f" text-anchor="start">Daily plan</text><text x="138.0" y="365.0" font-size="11.5" font-weight="normal" fill="#78350f" text-anchor="start">Daily coordination meeting: yesterday, today, obstacles</text><text x="690.0" y="356.0" font-size="12.5" font-weight="bold" fill="#1f2937" text-anchor="start">Every day (15 minutes or less)</text><line x1="930.0" y1="70.0" x2="930.0" y2="360.0" stroke="#7c3aed" stroke-width="2.4" marker-end="url(#ah1)"/><text x="922.0" y="215.0" transform="rotate(-90 922 215)" font-size="11.5" font-weight="bold" fill="#5b21b6" text-anchor="middle">More detail, more precision, shorter horizon</text><rect x="20.0" y="394.0" width="920.0" height="44.0" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.6"/><text x="480.0" y="412.4" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">Estimate relative size (story points) rather than absolute time where possible: teams compare work items better than they predict durations. Replan frequently at every</text><text x="480.0" y="427.4" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">level.</text></svg>