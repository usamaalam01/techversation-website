<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 468" width="980" height="468" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">Transition readiness checks</title><desc id="d">Eight checks before handing a product, service or result to operations or the next phase: people and skills practiced hands-on, documentation and captured knowledge, a support model, environment and access, verification and compliance, open items and risks handed over with owners, receiver acceptance and benefits ownership, and communication. Scope complete is not the same as transition ready.</desc><defs></defs><rect x="0.75" y="0.75" width="978.5" height="466.5" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><text x="20.0" y="28.0" font-size="18" font-weight="bold" fill="#1f2937" text-anchor="start">Is the receiver ready?</text><text x="20.0" y="48.0" font-size="12" font-weight="normal" fill="#6b7280" text-anchor="start">Scope complete is not transition ready: validate readiness before the formal handover</text><rect x="22.0" y="62.0" width="224.0" height="112.0" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="34.0" y="84.0" font-size="12" font-weight="bold" fill="#1e3a8a" text-anchor="start">1  People and skills</text><text x="34.0" y="104.0" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">Can the receivers do the work</text><text x="34.0" y="117.2" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">themselves? Practice runs with support,</text><text x="34.0" y="130.4" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">trained support staff.</text><rect x="260.7" y="62.0" width="224.0" height="112.0" rx="10" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.6"/><text x="272.7" y="84.0" font-size="12" font-weight="bold" fill="#134e4a" text-anchor="start">2  Documentation and knowledge</text><text x="272.7" y="104.0" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">Operating and support documents are</text><text x="272.7" y="117.2" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">complete; know-how is captured from</text><text x="272.7" y="130.4" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">people who are leaving.</text><rect x="499.3" y="62.0" width="224.0" height="112.0" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="511.3" y="84.0" font-size="12" font-weight="bold" fill="#14532d" text-anchor="start">3  Support model</text><text x="511.3" y="104.0" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">Who fixes what after go-live? Service</text><text x="511.3" y="117.2" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">levels, contacts, escalation, warranty or</text><text x="511.3" y="130.4" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">hypercare period.</text><rect x="738.0" y="62.0" width="224.0" height="112.0" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="750.0" y="84.0" font-size="12" font-weight="bold" fill="#78350f" text-anchor="start">4  Environment and access</text><text x="750.0" y="104.0" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">Production environment, tools, licenses</text><text x="750.0" y="117.2" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">and access are ready; data migrated;</text><text x="750.0" y="130.4" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">cut-over and rollback tested.</text><rect x="22.0" y="186.0" width="224.0" height="112.0" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.6"/><text x="34.0" y="208.0" font-size="12" font-weight="bold" fill="#4c1d95" text-anchor="start">5  Verification and compliance</text><text x="34.0" y="228.0" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">Operational acceptance criteria met;</text><text x="34.0" y="241.2" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">performance, security and regulatory</text><text x="34.0" y="254.4" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">checks passed.</text><rect x="260.7" y="186.0" width="224.0" height="112.0" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="1.6"/><text x="272.7" y="208.0" font-size="12" font-weight="bold" fill="#7f1d1d" text-anchor="start">6  Open items and risks</text><text x="272.7" y="228.0" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">Open issues, defects and outstanding</text><text x="272.7" y="241.2" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">risks are handed over with named</text><text x="272.7" y="254.4" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">owners and plans.</text><rect x="499.3" y="186.0" width="224.0" height="112.0" rx="10" fill="#1e3a8a" stroke="#1e3a8a" stroke-width="1.6"/><text x="511.3" y="208.0" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="start">7  Ownership and benefits</text><text x="511.3" y="228.0" font-size="10.8" font-weight="normal" fill="#ffffff" text-anchor="start">The receiving owner accepts in writing; a</text><text x="511.3" y="241.2" font-size="10.8" font-weight="normal" fill="#ffffff" text-anchor="start">benefits owner and measures are set;</text><text x="511.3" y="254.4" font-size="10.8" font-weight="normal" fill="#ffffff" text-anchor="start">run budget exists.</text><rect x="738.0" y="186.0" width="224.0" height="112.0" rx="10" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.6"/><text x="750.0" y="208.0" font-size="12" font-weight="bold" fill="#374151" text-anchor="start">8  Communication</text><text x="750.0" y="228.0" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">Users and stakeholders know what</text><text x="750.0" y="241.2" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">changes, when, and where to get help.</text><rect x="22.0" y="314.0" width="456.0" height="124.0" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="34.0" y="336.0" font-size="12.5" font-weight="bold" fill="#78350f" text-anchor="start">Signals from the field</text><text x="34.0" y="356.0" font-size="10.8" font-weight="bold" fill="#6b7280" text-anchor="start">•</text><text x="46.0" y="356.0" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">Watching a demonstration is not doing: have the receivers run it with support before</text><text x="46.0" y="369.2" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">handover</text><text x="34.0" y="386.4" font-size="10.8" font-weight="bold" fill="#6b7280" text-anchor="start">•</text><text x="46.0" y="386.4" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">A crew or expert leaves soon: capture critical knowledge from the people first;</text><text x="46.0" y="399.5" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">documents can be reviewed later</text><rect x="502.0" y="314.0" width="456.0" height="124.0" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="1.6"/><text x="514.0" y="336.0" font-size="12.5" font-weight="bold" fill="#7f1d1d" text-anchor="start">If the receiver is not ready</text><text x="514.0" y="356.0" font-size="10.8" font-weight="bold" fill="#6b7280" text-anchor="start">•</text><text x="526.0" y="356.0" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">Complete the training or readiness work before the formal handover</text><text x="514.0" y="373.2" font-size="10.8" font-weight="bold" fill="#6b7280" text-anchor="start">•</text><text x="526.0" y="373.2" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">Do not close the project and leave operations to arrange it</text><text x="514.0" y="390.4" font-size="10.8" font-weight="bold" fill="#6b7280" text-anchor="start">•</text><text x="526.0" y="390.4" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">Agree dates and owners with the sponsor if readiness needs more time</text></svg>