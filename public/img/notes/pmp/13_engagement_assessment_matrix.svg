<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 470" width="860" height="470" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">Stakeholder engagement assessment matrix</title><desc id="d">Rows are stakeholders; columns are engagement levels Unaware, Resistant, Neutral, Supportive, Leading. C marks current engagement and D marks desired engagement; the gap drives the engagement effort.</desc><defs><marker id="ah0" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker></defs><rect x="0.75" y="0.75" width="858.5" height="468.5" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><text x="20.0" y="28.0" font-size="18" font-weight="bold" fill="#1f2937" text-anchor="start">Stakeholder engagement assessment matrix</text><text x="20.0" y="48.0" font-size="12" font-weight="normal" fill="#6b7280" text-anchor="start">C = current level, D = desired level. The gap between C and D tells you where to spend engagement effort.</text><rect x="170.0" y="78.0" width="130.0" height="44.0" rx="0" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.6"/><text x="235.0" y="104.5" font-size="14" font-weight="bold" fill="#374151" text-anchor="middle">Unaware</text><rect x="300.0" y="78.0" width="130.0" height="44.0" rx="0" fill="#fee2e2" stroke="#dc2626" stroke-width="1.6"/><text x="365.0" y="104.5" font-size="14" font-weight="bold" fill="#7f1d1d" text-anchor="middle">Resistant</text><rect x="430.0" y="78.0" width="130.0" height="44.0" rx="0" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="495.0" y="104.5" font-size="14" font-weight="bold" fill="#78350f" text-anchor="middle">Neutral</text><rect x="560.0" y="78.0" width="130.0" height="44.0" rx="0" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.6"/><text x="625.0" y="104.5" font-size="14" font-weight="bold" fill="#134e4a" text-anchor="middle">Supportive</text><rect x="690.0" y="78.0" width="130.0" height="44.0" rx="0" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="755.0" y="104.5" font-size="14" font-weight="bold" fill="#14532d" text-anchor="middle">Leading</text><rect x="24.0" y="122.0" width="146.0" height="56.0" rx="0" fill="#ffffff" stroke="#d1d5db" stroke-width="1.2"/><text x="34.0" y="155.0" font-size="13.5" font-weight="bold" fill="#1f2937" text-anchor="start">Sponsor</text><rect x="170.0" y="122.0" width="130.0" height="56.0" rx="0" fill="#ffffff" stroke="#d1d5db" stroke-width="1.2"/><rect x="300.0" y="122.0" width="130.0" height="56.0" rx="0" fill="#ffffff" stroke="#d1d5db" stroke-width="1.2"/><rect x="430.0" y="122.0" width="130.0" height="56.0" rx="0" fill="#ffffff" stroke="#d1d5db" stroke-width="1.2"/><rect x="560.0" y="122.0" width="130.0" height="56.0" rx="0" fill="#ffffff" stroke="#d1d5db" stroke-width="1.2"/><rect x="690.0" y="122.0" width="130.0" height="56.0" rx="0" fill="#ffffff" stroke="#d1d5db" stroke-width="1.2"/><line x1="645.0" y1="150.0" x2="735.0" y2="150.0" stroke="#7c3aed" stroke-width="2.4" marker-end="url(#ah0)"/><circle cx="625.0" cy="150.0" r="15" fill="#1e3a8a" stroke="#1e3a8a" stroke-width="1.5"/><text x="625.0" y="155.0" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">C</text><circle cx="755.0" cy="150.0" r="15" fill="#ffffff" stroke="#16a34a" stroke-width="2.5"/><text x="755.0" y="155.0" font-size="14" font-weight="bold" fill="#16a34a" text-anchor="middle">D</text><rect x="24.0" y="178.0" width="146.0" height="56.0" rx="0" fill="#ffffff" stroke="#d1d5db" stroke-width="1.2"/><text x="34.0" y="211.0" font-size="13.5" font-weight="bold" fill="#1f2937" text-anchor="start">Regulator</text><rect x="170.0" y="178.0" width="130.0" height="56.0" rx="0" fill="#ffffff" stroke="#d1d5db" stroke-width="1.2"/><rect x="300.0" y="178.0" width="130.0" height="56.0" rx="0" fill="#ffffff" stroke="#d1d5db" stroke-width="1.2"/><rect x="430.0" y="178.0" width="130.0" height="56.0" rx="0" fill="#ffffff" stroke="#d1d5db" stroke-width="1.2"/><rect x="560.0" y="178.0" width="130.0" height="56.0" rx="0" fill="#ffffff" stroke="#d1d5db" stroke-width="1.2"/><rect x="690.0" y="178.0" width="130.0" height="56.0" rx="0" fill="#ffffff" stroke="#d1d5db" stroke-width="1.2"/><line x1="385.0" y1="206.0" x2="475.0" y2="206.0" stroke="#7c3aed" stroke-width="2.4" marker-end="url(#ah0)"/><circle cx="365.0" cy="206.0" r="15" fill="#1e3a8a" stroke="#1e3a8a" stroke-width="1.5"/><text x="365.0" y="211.0" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">C</text><circle cx="495.0" cy="206.0" r="15" fill="#ffffff" stroke="#16a34a" stroke-width="2.5"/><text x="495.0" y="211.0" font-size="14" font-weight="bold" fill="#16a34a" text-anchor="middle">D</text><rect x="24.0" y="234.0" width="146.0" height="56.0" rx="0" fill="#ffffff" stroke="#d1d5db" stroke-width="1.2"/><text x="34.0" y="267.0" font-size="13.5" font-weight="bold" fill="#1f2937" text-anchor="start">End-user group</text><rect x="170.0" y="234.0" width="130.0" height="56.0" rx="0" fill="#ffffff" stroke="#d1d5db" stroke-width="1.2"/><rect x="300.0" y="234.0" width="130.0" height="56.0" rx="0" fill="#ffffff" stroke="#d1d5db" stroke-width="1.2"/><rect x="430.0" y="234.0" width="130.0" height="56.0" rx="0" fill="#ffffff" stroke="#d1d5db" stroke-width="1.2"/><rect x="560.0" y="234.0" width="130.0" height="56.0" rx="0" fill="#ffffff" stroke="#d1d5db" stroke-width="1.2"/><rect x="690.0" y="234.0" width="130.0" height="56.0" rx="0" fill="#ffffff" stroke="#d1d5db" stroke-width="1.2"/><line x1="255.0" y1="262.0" x2="605.0" y2="262.0" stroke="#7c3aed" stroke-width="2.4" marker-end="url(#ah0)"/><circle cx="235.0" cy="262.0" r="15" fill="#1e3a8a" stroke="#1e3a8a" stroke-width="1.5"/><text x="235.0" y="267.0" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">C</text><circle cx="625.0" cy="262.0" r="15" fill="#ffffff" stroke="#16a34a" stroke-width="2.5"/><text x="625.0" y="267.0" font-size="14" font-weight="bold" fill="#16a34a" text-anchor="middle">D</text><rect x="24.0" y="290.0" width="146.0" height="56.0" rx="0" fill="#ffffff" stroke="#d1d5db" stroke-width="1.2"/><text x="34.0" y="323.0" font-size="13.5" font-weight="bold" fill="#1f2937" text-anchor="start">Vendor lead</text><rect x="170.0" y="290.0" width="130.0" height="56.0" rx="0" fill="#ffffff" stroke="#d1d5db" stroke-width="1.2"/><rect x="300.0" y="290.0" width="130.0" height="56.0" rx="0" fill="#ffffff" stroke="#d1d5db" stroke-width="1.2"/><rect x="430.0" y="290.0" width="130.0" height="56.0" rx="0" fill="#ffffff" stroke="#d1d5db" stroke-width="1.2"/><rect x="560.0" y="290.0" width="130.0" height="56.0" rx="0" fill="#ffffff" stroke="#d1d5db" stroke-width="1.2"/><rect x="690.0" y="290.0" width="130.0" height="56.0" rx="0" fill="#ffffff" stroke="#d1d5db" stroke-width="1.2"/><circle cx="625.0" cy="318.0" r="15" fill="#1e3a8a" stroke="#1e3a8a" stroke-width="1.5"/><text x="625.0" y="323.0" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">C=D</text><text x="24.0" y="374.0" font-size="13" font-weight="bold" fill="#1f2937" text-anchor="start">Reading it:</text><text x="24.0" y="394.0" font-size="12.5" font-weight="normal" fill="#1f2937" text-anchor="start">C to D gap  =  targeted engagement needed (e.g. End-user group: Unaware to Supportive).</text><text x="24.0" y="410.9" font-size="12.5" font-weight="normal" fill="#1f2937" text-anchor="start">C = D  =  maintain the current approach and keep monitoring.</text><text x="24.0" y="427.8" font-size="12.5" font-weight="normal" fill="#1f2937" text-anchor="start">Closing the gap is the heart of Monitor Stakeholder Engagement.</text></svg>