<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 500" width="980" height="500" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">Communication model: send, acknowledge, feedback</title><desc id="d">Sender encodes, transmits through a medium with noise, the receiver decodes. Interactive communication adds acknowledgment and feedback so the sender can confirm the message was understood. Emotional state, culture and biases shape both sides.</desc><defs><marker id="ah0" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker><marker id="ah1" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker></defs><rect x="0.75" y="0.75" width="978.5" height="498.5" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><text x="20.0" y="28.0" font-size="18" font-weight="bold" fill="#1f2937" text-anchor="start">Communication model</text><text x="20.0" y="48.0" font-size="12" font-weight="normal" fill="#6b7280" text-anchor="start">The basic model checks delivery; the interactive model checks understanding. Noise can arise anywhere</text><rect x="20.0" y="96.0" width="150.0" height="56.0" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="95.0" y="128.1" font-size="12.5" font-weight="bold" fill="#1e3a8a" text-anchor="middle">Sender</text><line x1="171.0" y1="124.0" x2="216.0" y2="124.0" stroke="#1f2937" stroke-width="2.4" marker-end="url(#ah0)"/><rect x="217.0" y="96.0" width="150.0" height="56.0" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="292.0" y="128.1" font-size="12.5" font-weight="bold" fill="#1e3a8a" text-anchor="middle">Encode</text><line x1="368.0" y1="124.0" x2="413.0" y2="124.0" stroke="#1f2937" stroke-width="2.4" marker-end="url(#ah0)"/><rect x="414.0" y="96.0" width="150.0" height="56.0" rx="8" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.6"/><text x="489.0" y="120.2" font-size="12.5" font-weight="bold" fill="#134e4a" text-anchor="middle">Transmit through a</text><text x="489.0" y="135.9" font-size="12.5" font-weight="bold" fill="#134e4a" text-anchor="middle">medium</text><line x1="565.0" y1="124.0" x2="610.0" y2="124.0" stroke="#1f2937" stroke-width="2.4" marker-end="url(#ah0)"/><rect x="611.0" y="96.0" width="150.0" height="56.0" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="686.0" y="128.1" font-size="12.5" font-weight="bold" fill="#14532d" text-anchor="middle">Decode</text><line x1="762.0" y1="124.0" x2="807.0" y2="124.0" stroke="#1f2937" stroke-width="2.4" marker-end="url(#ah0)"/><rect x="808.0" y="96.0" width="150.0" height="56.0" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="883.0" y="128.1" font-size="12.5" font-weight="bold" fill="#14532d" text-anchor="middle">Receiver</text><text x="20.0" y="84.0" font-size="12" font-weight="bold" fill="#1e3a8a" text-anchor="start">Basic model (message delivered)</text><rect x="408.0" y="160.0" width="162.0" height="26.0" rx="13" fill="#fee2e2" stroke="#dc2626" stroke-width="1.4" stroke-dasharray="4 3"/><text x="489.0" y="177.0" font-size="10.5" font-weight="bold" fill="#991b1b" text-anchor="middle">Noise: distraction, barriers</text><text x="20.0" y="232.0" font-size="12" font-weight="bold" fill="#1e3a8a" text-anchor="start">Interactive model (message understood)</text><rect x="808.0" y="244.0" width="150.0" height="64.0" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="883.0" y="272.6" font-size="11.5" font-weight="bold" fill="#14532d" text-anchor="middle">Receiver acknowledges</text><text x="883.0" y="286.9" font-size="11.5" font-weight="bold" fill="#14532d" text-anchor="middle">receipt</text><line x1="807.0" y1="276.0" x2="762.0" y2="276.0" stroke="#7c3aed" stroke-width="2.4" marker-end="url(#ah1)"/><rect x="611.0" y="244.0" width="150.0" height="64.0" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="686.0" y="279.7" font-size="11.5" font-weight="bold" fill="#14532d" text-anchor="middle">Encode feedback</text><line x1="610.0" y1="276.0" x2="565.0" y2="276.0" stroke="#7c3aed" stroke-width="2.4" marker-end="url(#ah1)"/><rect x="414.0" y="244.0" width="150.0" height="64.0" rx="8" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.6"/><text x="489.0" y="279.7" font-size="11.5" font-weight="bold" fill="#134e4a" text-anchor="middle">Transmit feedback</text><line x1="413.0" y1="276.0" x2="368.0" y2="276.0" stroke="#7c3aed" stroke-width="2.4" marker-end="url(#ah1)"/><rect x="217.0" y="244.0" width="150.0" height="64.0" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="292.0" y="279.7" font-size="11.5" font-weight="bold" fill="#1e3a8a" text-anchor="middle">Decode</text><line x1="216.0" y1="276.0" x2="171.0" y2="276.0" stroke="#7c3aed" stroke-width="2.4" marker-end="url(#ah1)"/><rect x="20.0" y="244.0" width="150.0" height="64.0" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="95.0" y="265.4" font-size="11.5" font-weight="bold" fill="#1e3a8a" text-anchor="middle">Sender confirms</text><text x="95.0" y="279.7" font-size="11.5" font-weight="bold" fill="#1e3a8a" text-anchor="middle">feedback matches the</text><text x="95.0" y="294.1" font-size="11.5" font-weight="bold" fill="#1e3a8a" text-anchor="middle">message</text><text x="883.0" y="330.0" font-size="10.5" font-weight="bold" fill="#4c1d95" text-anchor="middle">Acknowledgment shows receipt only</text><text x="883.0" y="344.0" font-size="10.5" font-weight="normal" fill="#4c1d95" text-anchor="middle">(not agreement or understanding)</text><rect x="20.0" y="366.0" width="460.0" height="120.0" rx="8" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.2"/><text x="32.0" y="386.0" font-size="12" font-weight="bold" fill="#1f2937" text-anchor="start">What shapes both sender and receiver</text><text x="32.0" y="404.0" font-size="11" font-weight="bold" fill="#6b7280" text-anchor="start">•</text><text x="44.0" y="404.0" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="start">Emotional state, knowledge, background, personality</text><text x="32.0" y="420.2" font-size="11" font-weight="bold" fill="#6b7280" text-anchor="start">•</text><text x="44.0" y="420.2" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="start">Culture (generational, national, professional discipline, gender)</text><text x="32.0" y="436.4" font-size="11" font-weight="bold" fill="#6b7280" text-anchor="start">•</text><text x="44.0" y="436.4" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="start">Biases and assumptions</text><text x="32.0" y="452.6" font-size="11" font-weight="bold" fill="#6b7280" text-anchor="start">•</text><text x="44.0" y="452.6" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="start">Differences in language, working methods and protocols</text><rect x="500.0" y="366.0" width="460.0" height="120.0" rx="8" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.2"/><text x="512.0" y="386.0" font-size="12" font-weight="bold" fill="#1f2937" text-anchor="start">Responsibilities</text><text x="512.0" y="404.0" font-size="11" font-weight="bold" fill="#6b7280" text-anchor="start">•</text><text x="524.0" y="404.0" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="start">Sender: transmit clearly and completely, and confirm the message was interpreted</text><text x="524.0" y="417.2" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="start">correctly</text><text x="512.0" y="433.4" font-size="11" font-weight="bold" fill="#6b7280" text-anchor="start">•</text><text x="524.0" y="433.4" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="start">Receiver: receive it in full, interpret it correctly, and acknowledge or respond</text><text x="512.0" y="449.6" font-size="11" font-weight="bold" fill="#6b7280" text-anchor="start">•</text><text x="524.0" y="449.6" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="start">Active listening (acknowledge, clarify, confirm) creates the feedback</text><text x="512.0" y="465.8" font-size="11" font-weight="bold" fill="#6b7280" text-anchor="start">•</text><text x="524.0" y="465.8" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="start">The model suits person-to-person talks, not emails or broadcasts</text></svg>