<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 560" width="980" height="560" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">The change control flow</title><desc id="d">A change request is received and logged, impact is assessed across domains, options are developed, an authorized decision-maker approves, defers, rejects or asks for more information, the decision is communicated, approved changes are implemented and documents updated, and results are verified.</desc><defs><marker id="ah0" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker></defs><rect x="0.75" y="0.75" width="978.5" height="558.5" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><text x="20.0" y="28.0" font-size="18" font-weight="bold" fill="#1f2937" text-anchor="start">Assess and implement changes</text><text x="20.0" y="48.0" font-size="12" font-weight="normal" fill="#6b7280" text-anchor="start">Any stakeholder may request a change; the decision belongs to the authority defined in the change management plan</text><rect x="20.0" y="70.0" width="280.0" height="138.0" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.8"/><text x="32.0" y="94.0" font-size="12.5" font-weight="bold" fill="#1e3a8a" text-anchor="start">1  Receive and log</text><text x="32.0" y="114.0" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="start">Any stakeholder may request; document it in writing</text><text x="32.0" y="127.8" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="start">even if raised verbally; enter in the change log</text><rect x="350.0" y="70.0" width="280.0" height="138.0" rx="10" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.8"/><text x="362.0" y="94.0" font-size="12.5" font-weight="bold" fill="#134e4a" text-anchor="start">2  Assess impact</text><text x="362.0" y="114.0" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="start">Scope, schedule, cost, quality, resources, risk,</text><text x="362.0" y="127.8" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="start">stakeholders, benefits, compliance, contracts;</text><text x="362.0" y="141.5" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="start">estimate effects</text><rect x="680.0" y="70.0" width="280.0" height="138.0" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.8"/><text x="692.0" y="94.0" font-size="12.5" font-weight="bold" fill="#78350f" text-anchor="start">3  Develop options</text><text x="692.0" y="114.0" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="start">Alternatives, cost-benefit; keep executing planned</text><text x="692.0" y="127.8" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="start">work while the decision is pending</text><rect x="680.0" y="270.0" width="280.0" height="138.0" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.8"/><text x="692.0" y="294.0" font-size="12.5" font-weight="bold" fill="#4c1d95" text-anchor="start">4  Decide</text><text x="692.0" y="314.0" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="start">Authorized person or CCB: approve, defer, reject, or</text><text x="692.0" y="327.8" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="start">ask for more information; sponsor or customer</text><text x="692.0" y="341.5" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="start">approval if required</text><rect x="350.0" y="270.0" width="280.0" height="138.0" rx="10" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.8"/><text x="362.0" y="294.0" font-size="12.5" font-weight="bold" fill="#374151" text-anchor="start">5  Communicate</text><text x="362.0" y="314.0" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="start">Record the decision in the change log; tell the</text><text x="362.0" y="327.8" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="start">requester (including deferred or rejected), the team</text><text x="362.0" y="341.5" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="start">and affected stakeholders</text><rect x="20.0" y="270.0" width="280.0" height="138.0" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.8"/><text x="32.0" y="294.0" font-size="12.5" font-weight="bold" fill="#14532d" text-anchor="start">6  Implement and update</text><text x="32.0" y="314.0" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="start">Manage Project Execution carries out approved</text><text x="32.0" y="327.8" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="start">changes; update baselines, plans and documents</text><line x1="301.0" y1="139.0" x2="349.0" y2="139.0" stroke="#1f2937" stroke-width="2.4" marker-end="url(#ah0)"/><line x1="631.0" y1="139.0" x2="679.0" y2="139.0" stroke="#1f2937" stroke-width="2.4" marker-end="url(#ah0)"/><line x1="820.0" y1="209.0" x2="820.0" y2="269.0" stroke="#1f2937" stroke-width="2.4" marker-end="url(#ah0)"/><line x1="679.0" y1="339.0" x2="631.0" y2="339.0" stroke="#1f2937" stroke-width="2.4" marker-end="url(#ah0)"/><line x1="349.0" y1="339.0" x2="301.0" y2="339.0" stroke="#1f2937" stroke-width="2.4" marker-end="url(#ah0)"/><rect x="20.0" y="428.0" width="940.0" height="54.0" rx="8" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.3"/><text x="32.0" y="448.0" font-size="12" font-weight="bold" fill="#1f2937" text-anchor="start">Decisions:</text><rect x="112.0" y="432.0" width="79.7" height="24.0" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="1.4"/><text x="151.9" y="449.0" font-size="11.5" font-weight="bold" fill="#16a34a" text-anchor="middle">Approved</text><rect x="201.7" y="432.0" width="73.4" height="24.0" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="1.4"/><text x="238.4" y="449.0" font-size="11.5" font-weight="bold" fill="#d97706" text-anchor="middle">Deferred</text><rect x="285.1" y="432.0" width="74.1" height="24.0" rx="12" fill="#fee2e2" stroke="#dc2626" stroke-width="1.4"/><text x="322.1" y="449.0" font-size="11.5" font-weight="bold" fill="#dc2626" text-anchor="middle">Rejected</text><rect x="369.2" y="432.0" width="120.0" height="24.0" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/><text x="429.1" y="449.0" font-size="11.5" font-weight="bold" fill="#2563eb" text-anchor="middle">More information</text><text x="509.1" y="449.0" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="start">All recorded in the change log; approved ones go to step 6</text><text x="32.0" y="472.0" font-size="11" font-weight="bold" fill="#134e4a" text-anchor="start">7  Verify: monitor the results of the change; confirm it delivered the intended effect and close it in the log.</text><rect x="20.0" y="492.0" width="940.0" height="56.0" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/><text x="32.0" y="512.0" font-size="11" font-weight="bold" fill="#78350f" text-anchor="start">Predictive: changes are not formally controlled until baselines exist; afterward every change goes through this process, and requests normally carry estimated schedule and</text><text x="32.0" y="525.4" font-size="11" font-weight="bold" fill="#78350f" text-anchor="start">cost impacts. Adaptive: changes are backlog items with an impact analysis and prioritization by the product owner.</text></svg>