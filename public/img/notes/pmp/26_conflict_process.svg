<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 556" width="980" height="556" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">Conflict management process and escalation</title><desc id="d">Identify the sources, analyze the context (importance and intensity, time pressure, relative power, importance of the relationship, long or short term), choose and implement an agreed resolution, follow up; escalate from the parties to the project manager to management to formal procedures.</desc><defs><marker id="ah0" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker></defs><rect x="0.75" y="0.75" width="978.5" height="554.5" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><text x="20.0" y="28.0" font-size="18" font-weight="bold" fill="#1f2937" text-anchor="start">Managing a conflict, step by step</text><text x="20.0" y="48.0" font-size="12" font-weight="normal" fill="#6b7280" text-anchor="start">Address it early, usually in private, with a direct, collaborative approach; escalate only as far as needed</text><rect x="20.0" y="66.0" width="176.0" height="130.0" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.7"/><text x="30.0" y="88.0" font-size="12.2" font-weight="bold" fill="#1e3a8a" text-anchor="start">1 Identify the sources</text><text x="30.0" y="114.0" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">Find what the conflict is really</text><text x="30.0" y="127.2" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">about (not the symptom):</text><text x="30.0" y="140.4" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">resources, priorities, work</text><text x="30.0" y="153.5" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">styles, roles, incentives</text><line x1="197.0" y1="131.0" x2="210.0" y2="131.0" stroke="#1f2937" stroke-width="2.2" marker-end="url(#ah0)"/><rect x="211.0" y="66.0" width="176.0" height="130.0" rx="10" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.7"/><text x="221.0" y="88.0" font-size="12.2" font-weight="bold" fill="#134e4a" text-anchor="start">2 Analyze the context</text><text x="221.0" y="114.0" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">Importance and intensity, time</text><text x="221.0" y="127.2" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">pressure, relative power,</text><text x="221.0" y="140.4" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">importance of the relationship,</text><text x="221.0" y="153.5" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">long or short term</text><line x1="388.0" y1="131.0" x2="401.0" y2="131.0" stroke="#1f2937" stroke-width="2.2" marker-end="url(#ah0)"/><rect x="402.0" y="66.0" width="176.0" height="130.0" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.7"/><text x="412.0" y="88.0" font-size="12.2" font-weight="bold" fill="#78350f" text-anchor="start">3 Choose an approach</text><text x="412.0" y="114.0" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">Pick the technique that fits the</text><text x="412.0" y="127.2" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">context; collaborate when you</text><text x="412.0" y="140.4" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">can</text><line x1="579.0" y1="131.0" x2="592.0" y2="131.0" stroke="#1f2937" stroke-width="2.2" marker-end="url(#ah0)"/><rect x="593.0" y="66.0" width="176.0" height="130.0" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.7"/><text x="603.0" y="88.0" font-size="12.2" font-weight="bold" fill="#14532d" text-anchor="start">4 Implement and agree</text><text x="603.0" y="114.0" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">Facilitate; agree on the</text><text x="603.0" y="127.2" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">resolution; document who will</text><text x="603.0" y="140.4" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">do what</text><line x1="770.0" y1="131.0" x2="783.0" y2="131.0" stroke="#1f2937" stroke-width="2.2" marker-end="url(#ah0)"/><rect x="784.0" y="66.0" width="176.0" height="130.0" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.7"/><text x="794.0" y="88.0" font-size="12.2" font-weight="bold" fill="#4c1d95" text-anchor="start">5 Follow up</text><text x="794.0" y="114.0" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">Check it holds; adjust ground</text><text x="794.0" y="127.2" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">rules, roles or processes;</text><text x="794.0" y="140.4" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">capture the lesson</text><rect x="20.0" y="214.0" width="300.0" height="196.0" rx="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.4"/><text x="32.0" y="235.0" font-size="12.5" font-weight="bold" fill="#1f2937" text-anchor="start">Common sources of conflict</text><text x="32.0" y="254.0" font-size="10.8" font-weight="bold" fill="#6b7280" text-anchor="start">•</text><text x="44.0" y="254.0" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">PMBOK 8: scarce resources, scheduling priorities,</text><text x="44.0" y="267.0" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">personal work styles</text><text x="32.0" y="283.9" font-size="10.8" font-weight="bold" fill="#6b7280" text-anchor="start">•</text><text x="44.0" y="283.9" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">Unclear roles, authority or accountability</text><text x="32.0" y="300.9" font-size="10.8" font-weight="bold" fill="#6b7280" text-anchor="start">•</text><text x="44.0" y="300.9" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">Different priorities, requirements or technical</text><text x="44.0" y="313.8" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">approaches</text><text x="32.0" y="330.8" font-size="10.8" font-weight="bold" fill="#6b7280" text-anchor="start">•</text><text x="44.0" y="330.8" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">Conflicting incentives or objectives</text><text x="32.0" y="347.8" font-size="10.8" font-weight="bold" fill="#6b7280" text-anchor="start">•</text><text x="44.0" y="347.8" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">Communication gaps, cultural differences</text><text x="32.0" y="364.7" font-size="10.8" font-weight="bold" fill="#6b7280" text-anchor="start">•</text><text x="44.0" y="364.7" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">Changes (organizational, scope) and ground-rule</text><text x="44.0" y="377.7" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">violations</text><text x="340.0" y="232.0" font-size="12.5" font-weight="bold" fill="#1f2937" text-anchor="start">Who resolves it</text><rect x="340.0" y="246.0" width="380.0" height="38.0" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/><text x="350.0" y="262.0" font-size="11.5" font-weight="bold" fill="#14532d" text-anchor="start">1  Parties involved</text><text x="350.0" y="276.0" font-size="10" font-weight="normal" fill="#1f2937" text-anchor="start">The people involved resolve a conflict that is becoming a problem</text><rect x="340.0" y="288.0" width="410.0" height="38.0" rx="8" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.5"/><text x="350.0" y="304.0" font-size="11.5" font-weight="bold" fill="#134e4a" text-anchor="start">2  Project manager facilitates</text><text x="350.0" y="318.0" font-size="10" font-weight="normal" fill="#1f2937" text-anchor="start">If it escalates: private, direct, collaborative; focus on the issue</text><rect x="340.0" y="330.0" width="440.0" height="38.0" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/><text x="350.0" y="346.0" font-size="11.5" font-weight="bold" fill="#78350f" text-anchor="start">3  Management or sponsor</text><text x="350.0" y="360.0" font-size="10" font-weight="normal" fill="#1f2937" text-anchor="start">Align objectives and incentives across functions; decide beyond PM authority</text><rect x="340.0" y="372.0" width="470.0" height="38.0" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/><text x="350.0" y="388.0" font-size="11.5" font-weight="bold" fill="#7f1d1d" text-anchor="start">4  Formal procedures</text><text x="350.0" y="402.0" font-size="10" font-weight="normal" fill="#1f2937" text-anchor="start">If disruptive conflict continues, including disciplinary action</text><rect x="20.0" y="426.0" width="940.0" height="116.0" rx="8" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.3"/><text x="32.0" y="446.0" font-size="12.5" font-weight="bold" fill="#1f2937" text-anchor="start">Principles to communicate to the team and to external stakeholders</text><text x="32.0" y="466.0" font-size="11" font-weight="bold" fill="#1e3a8a" text-anchor="start">Keep communication open and respectful: </text><text x="257.9" y="466.0" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="start">a safe environment; nonthreatening words, tone and body language</text><text x="32.0" y="486.0" font-size="11" font-weight="bold" fill="#1e3a8a" text-anchor="start">Focus on the issues, not the people: </text><text x="226.2" y="486.0" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="start">perceptions differ; resolve the situation, do not assign blame</text><text x="32.0" y="506.0" font-size="11" font-weight="bold" fill="#1e3a8a" text-anchor="start">Focus on the present and future: </text><text x="207.0" y="506.0" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="start">bringing up the past can intensify the conflict</text><text x="32.0" y="526.0" font-size="11" font-weight="bold" fill="#1e3a8a" text-anchor="start">Search for alternatives together: </text><text x="204.8" y="526.0" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="start">turn the conflict into joint problem-solving</text></svg>