<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 500" width="980" height="500" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">From business case to project management plan</title><desc id="d">Business documents (business case, benefits management plan) exist before the project; the project charter authorizes the project; the scope statement and project management plan elaborate the detail.</desc><defs><marker id="ah0" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker></defs><rect x="0.75" y="0.75" width="978.5" height="498.5" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><text x="20.0" y="28.0" font-size="18" font-weight="bold" fill="#1f2937" text-anchor="start">From justification to detailed plans</text><text x="20.0" y="48.0" font-size="12" font-weight="normal" fill="#6b7280" text-anchor="start">Business documents come first and are referenced after the project; keep the success measures aligned across all of them</text><rect x="20.0" y="62.0" width="940.0" height="150.0" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/><text x="36.0" y="84.0" font-size="12.5" font-weight="bold" fill="#1e3a8a" text-anchor="start">BUSINESS DOCUMENTS (developed before the project; sponsor accountable; reviewed periodically)</text><rect x="36.0" y="98.0" width="250.0" height="100.0" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="161.0" y="123.0" font-size="11.5" font-weight="bold" fill="#1e3a8a" text-anchor="middle">Business case</text><text x="161.0" y="137.4" font-size="11.5" font-weight="normal" fill="#1e3a8a" text-anchor="middle">Documented economic feasibility study:</text><text x="161.0" y="151.7" font-size="11.5" font-weight="normal" fill="#1e3a8a" text-anchor="middle">objectives, reasons, costs, benefits, how</text><text x="161.0" y="166.1" font-size="11.5" font-weight="normal" fill="#1e3a8a" text-anchor="middle">value is created, success criteria; basis for go</text><text x="161.0" y="180.5" font-size="11.5" font-weight="normal" fill="#1e3a8a" text-anchor="middle">/ no-go</text><rect x="365.0" y="98.0" width="250.0" height="100.0" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="490.0" y="123.0" font-size="11.5" font-weight="bold" fill="#1e3a8a" text-anchor="middle">Benefits management plan</text><text x="490.0" y="137.4" font-size="11.5" font-weight="normal" fill="#1e3a8a" text-anchor="middle">How and when benefits are delivered and</text><text x="490.0" y="151.7" font-size="11.5" font-weight="normal" fill="#1e3a8a" text-anchor="middle">measured: target benefits, alignment,</text><text x="490.0" y="166.1" font-size="11.5" font-weight="normal" fill="#1e3a8a" text-anchor="middle">timeframe, benefits owner, metrics,</text><text x="490.0" y="180.5" font-size="11.5" font-weight="normal" fill="#1e3a8a" text-anchor="middle">assumptions, risks</text><rect x="694.0" y="98.0" width="250.0" height="100.0" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.6"/><text x="819.0" y="137.4" font-size="11.5" font-weight="bold" fill="#374151" text-anchor="middle">Agreements</text><text x="819.0" y="151.7" font-size="11.5" font-weight="normal" fill="#374151" text-anchor="middle">Contract, SLA, MOU, letter of agreement,</text><text x="819.0" y="166.1" font-size="11.5" font-weight="normal" fill="#374151" text-anchor="middle">PO, even email: define initial intentions</text><line x1="288.0" y1="148.0" x2="363.0" y2="148.0" stroke="#1f2937" stroke-width="2" marker-end="url(#ah0)"/><text x="36.0" y="232.0" font-size="11.5" font-weight="normal" fill="#6b7280" text-anchor="start">Inputs also include enterprise environmental factors and organizational process assets.</text><line x1="490.0" y1="214.0" x2="490.0" y2="250.0" stroke="#1f2937" stroke-width="2.4" marker-end="url(#ah0)"/><rect x="160.0" y="252.0" width="660.0" height="62.0" rx="8" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.6"/><text x="490.0" y="271.9" font-size="12" font-weight="bold" fill="#134e4a" text-anchor="middle">Initiate Project or Phase → PROJECT CHARTER</text><text x="490.0" y="286.9" font-size="12" font-weight="normal" fill="#134e4a" text-anchor="middle">High-level: purpose, measurable objectives and success criteria, requirements, boundaries, risks, milestones, funds,</text><text x="490.0" y="301.9" font-size="12" font-weight="normal" fill="#134e4a" text-anchor="middle">stakeholders, exit criteria, PM and sponsor authority</text><line x1="490.0" y1="316.0" x2="490.0" y2="346.0" stroke="#1f2937" stroke-width="2.4" marker-end="url(#ah0)"/><rect x="160.0" y="348.0" width="320.0" height="62.0" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="320.0" y="368.4" font-size="11.5" font-weight="bold" fill="#14532d" text-anchor="middle">Project scope statement</text><text x="320.0" y="382.7" font-size="11.5" font-weight="normal" fill="#14532d" text-anchor="middle">Detailed scope: description, deliverables, acceptance</text><text x="320.0" y="397.1" font-size="11.5" font-weight="normal" fill="#14532d" text-anchor="middle">criteria, exclusions</text><rect x="500.0" y="348.0" width="320.0" height="62.0" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="660.0" y="368.4" font-size="11.5" font-weight="bold" fill="#14532d" text-anchor="middle">Project management plan</text><text x="660.0" y="382.7" font-size="11.5" font-weight="normal" fill="#14532d" text-anchor="middle">Integrated plan and baselines: how work is executed,</text><text x="660.0" y="397.1" font-size="11.5" font-weight="normal" fill="#14532d" text-anchor="middle">monitored, controlled and closed</text><line x1="482.0" y1="380.0" x2="498.0" y2="380.0" stroke="#1f2937" stroke-width="2" marker-end="url(#ah0)"/><rect x="20.0" y="430.0" width="940.0" height="52.0" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.6"/><text x="490.0" y="452.4" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">Alignment loop: the PM works with the sponsor so the charter, project management plan and benefits management plan stay aligned with the business case and</text><text x="490.0" y="467.4" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">organizational goals. If the business case collapses mid-project, revalidate value with the sponsor.</text></svg>