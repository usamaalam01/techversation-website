<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 470" width="980" height="470" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">Structured versus self-governed projects</title><desc id="d">Structured governance: executive sponsor, PMO leader, governance board and project manager providing oversight. Self-governance: a team or group of project managers collectively accountable, with clear measurable objectives, leading indicators and feedback.</desc><defs><marker id="ah0" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker></defs><rect x="0.75" y="0.75" width="978.5" height="468.5" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><text x="20.0" y="28.0" font-size="18" font-weight="bold" fill="#1f2937" text-anchor="start">Governance models: structured vs self-governing</text><text x="20.0" y="48.0" font-size="12" font-weight="normal" fill="#6b7280" text-anchor="start">PMBOK 8 Figure 2-1: choose the right amount of governance. Too much wastes resources; too little risks misalignment</text><rect x="20.0" y="66.0" width="450.0" height="34.0" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="245.0" y="87.2" font-size="13" font-weight="bold" fill="#1e3a8a" text-anchor="middle">STRUCTURED GOVERNANCE (often predictive)</text><rect x="70.0" y="112.0" width="350.0" height="36.0" rx="8" fill="#1e3a8a" stroke="#1e3a8a" stroke-width="1.6"/><text x="245.0" y="133.9" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">Executive project sponsor</text><line x1="245.0" y1="148.0" x2="245.0" y2="156.0" stroke="#6b7280" stroke-width="1.6" marker-end="url(#ah0)"/><rect x="78.0" y="156.0" width="334.0" height="36.0" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="245.0" y="177.9" font-size="12" font-weight="bold" fill="#1e3a8a" text-anchor="middle">Governance board / steering committee (and CCB)</text><line x1="245.0" y1="192.0" x2="245.0" y2="200.0" stroke="#6b7280" stroke-width="1.6" marker-end="url(#ah0)"/><rect x="86.0" y="200.0" width="318.0" height="36.0" rx="8" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.6"/><text x="245.0" y="221.9" font-size="12" font-weight="bold" fill="#134e4a" text-anchor="middle">PMO leader</text><line x1="245.0" y1="236.0" x2="245.0" y2="244.0" stroke="#6b7280" stroke-width="1.6" marker-end="url(#ah0)"/><rect x="94.0" y="244.0" width="302.0" height="36.0" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="245.0" y="265.9" font-size="12" font-weight="bold" fill="#14532d" text-anchor="middle">Project manager (integrates all domains)</text><line x1="245.0" y1="280.0" x2="245.0" y2="288.0" stroke="#6b7280" stroke-width="1.6" marker-end="url(#ah0)"/><rect x="102.0" y="288.0" width="286.0" height="36.0" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.6"/><text x="245.0" y="309.9" font-size="12" font-weight="bold" fill="#374151" text-anchor="middle">Project team</text><rect x="20.0" y="340.0" width="450.0" height="120.0" rx="8" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.2"/><text x="32.0" y="358.0" font-size="12" font-weight="bold" fill="#6b7280" text-anchor="start">•</text><text x="44.0" y="358.0" font-size="11.5" font-weight="normal" fill="#1f2937" text-anchor="start">Constituents inside or outside the project govern performance by organizational</text><text x="44.0" y="372.0" font-size="11.5" font-weight="normal" fill="#1f2937" text-anchor="start">requirements</text><text x="32.0" y="390.1" font-size="12" font-weight="bold" fill="#6b7280" text-anchor="start">•</text><text x="44.0" y="390.1" font-size="11.5" font-weight="normal" fill="#1f2937" text-anchor="start">Predictive additions: escalation (authority outside the team) and investment</text><text x="44.0" y="404.1" font-size="11.5" font-weight="normal" fill="#1f2937" text-anchor="start">control (stewardship of funding, decision points)</text><text x="32.0" y="422.1" font-size="12" font-weight="bold" fill="#6b7280" text-anchor="start">•</text><text x="44.0" y="422.1" font-size="11.5" font-weight="normal" fill="#1f2937" text-anchor="start">Strengths: clear authority and control. Risk: bureaucracy, slow decisions</text><rect x="510.0" y="66.0" width="450.0" height="34.0" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="735.0" y="87.2" font-size="13" font-weight="bold" fill="#14532d" text-anchor="middle">SELF-GOVERNANCE (often adaptive)</text><rect x="560.0" y="112.0" width="350.0" height="130.0" rx="14" fill="#ecfdf5" stroke="#16a34a" stroke-width="1.8" stroke-dasharray="6 4"/><text x="735.0" y="134.0" font-size="11.5" font-weight="bold" fill="#14532d" text-anchor="middle">Guardrails: clear, measurable common objectives,</text><text x="735.0" y="150.0" font-size="11.5" font-weight="bold" fill="#14532d" text-anchor="middle">leading indicators, feedback mechanisms</text><rect x="580.0" y="166.0" width="140.0" height="28.0" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="650.0" y="183.7" font-size="11.5" font-weight="bold" fill="#14532d" text-anchor="middle">Team member</text><rect x="740.0" y="166.0" width="140.0" height="28.0" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="810.0" y="183.7" font-size="11.5" font-weight="bold" fill="#14532d" text-anchor="middle">Product owner</text><rect x="580.0" y="202.0" width="140.0" height="28.0" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="650.0" y="219.7" font-size="11.5" font-weight="bold" fill="#14532d" text-anchor="middle">Team member</text><rect x="740.0" y="202.0" width="140.0" height="28.0" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="810.0" y="219.7" font-size="11.5" font-weight="bold" fill="#14532d" text-anchor="middle">Scrum master / PM</text><text x="735.0" y="258.0" font-size="11.2" font-weight="normal" fill="#6b7280" text-anchor="middle">Project management responsibilities are distributed among the team,</text><text x="735.0" y="272.0" font-size="11.2" font-weight="normal" fill="#6b7280" text-anchor="middle">or a group of project managers is collectively accountable</text><rect x="510.0" y="340.0" width="450.0" height="120.0" rx="8" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.2"/><text x="522.0" y="358.0" font-size="12" font-weight="bold" fill="#6b7280" text-anchor="start">•</text><text x="534.0" y="358.0" font-size="11.5" font-weight="normal" fill="#1f2937" text-anchor="start">The team ensures the project delivers value; no external governance body in</text><text x="534.0" y="372.0" font-size="11.5" font-weight="normal" fill="#1f2937" text-anchor="start">some cases</text><text x="522.0" y="390.1" font-size="12" font-weight="bold" fill="#6b7280" text-anchor="start">•</text><text x="534.0" y="390.1" font-size="11.5" font-weight="normal" fill="#1f2937" text-anchor="start">Daily coordination meetings, reviews and retrospectives act as governance</text><text x="534.0" y="404.1" font-size="11.5" font-weight="normal" fill="#1f2937" text-anchor="start">mechanisms</text><text x="522.0" y="422.1" font-size="12" font-weight="bold" fill="#6b7280" text-anchor="start">•</text><text x="534.0" y="422.1" font-size="11.5" font-weight="normal" fill="#1f2937" text-anchor="start">Key challenge: fragmented, conflicting decisions. Fix with shared objectives,</text><text x="534.0" y="436.1" font-size="11.5" font-weight="normal" fill="#1f2937" text-anchor="start">leading indicators and feedback</text></svg>