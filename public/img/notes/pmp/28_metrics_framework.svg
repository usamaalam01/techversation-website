<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 540" width="980" height="540" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">A balanced set of project metrics</title><desc id="d">Metrics at four levels: inputs, process, outputs and outcomes, with examples; leading and lagging indicators; SMART criteria; and common measurement pitfalls.</desc><defs></defs><rect x="0.75" y="0.75" width="978.5" height="538.5" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><text x="20.0" y="28.0" font-size="18" font-weight="bold" fill="#1f2937" text-anchor="start">Choosing metrics that drive decisions</text><text x="20.0" y="48.0" font-size="12" font-weight="normal" fill="#6b7280" text-anchor="start">Measure what matters and is actionable: balance inputs, outputs and outcomes, leading and lagging</text><rect x="20.0" y="66.0" width="520.0" height="76.0" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.7"/><text x="32.0" y="88.0" font-size="13" font-weight="bold" fill="#4c1d95" text-anchor="start">Outcomes</text><text x="528.0" y="88.0" font-size="10.5" font-weight="normal" fill="#6b7280" text-anchor="end">What the organization gets</text><text x="32.0" y="108.0" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="start">Benefits and value: benefits realized, ROI, customer adoption and usage, satisfaction (NPS)</text><rect x="34.0" y="150.0" width="492.0" height="76.0" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.7"/><text x="46.0" y="172.0" font-size="13" font-weight="bold" fill="#14532d" text-anchor="start">Outputs</text><text x="514.0" y="172.0" font-size="10.5" font-weight="normal" fill="#6b7280" text-anchor="end">What the project produces</text><text x="46.0" y="192.0" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="start">Deliverables accepted, features done, velocity, defects escaped, scope definition accuracy</text><rect x="48.0" y="234.0" width="464.0" height="76.0" rx="10" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.7"/><text x="60.0" y="256.0" font-size="13" font-weight="bold" fill="#134e4a" text-anchor="start">Process</text><text x="500.0" y="256.0" font-size="10.5" font-weight="normal" fill="#6b7280" text-anchor="end">How the work is going</text><text x="60.0" y="276.0" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="start">Schedule and cost performance (SPI, CPI), cycle time, rework, audit findings, risk</text><text x="60.0" y="289.4" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="start">exposure</text><rect x="62.0" y="318.0" width="436.0" height="76.0" rx="10" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.7"/><text x="74.0" y="340.0" font-size="13" font-weight="bold" fill="#374151" text-anchor="start">Inputs</text><text x="486.0" y="340.0" font-size="10.5" font-weight="normal" fill="#6b7280" text-anchor="end">What goes in</text><text x="74.0" y="360.0" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="start">Resource utilization, hours worked, training completed, budget spent</text><text x="20.0" y="412.0" font-size="11.5" font-weight="bold" fill="#4c1d95" text-anchor="start">Governance guidance: prefer metrics that show target outcomes over input metrics</text><rect x="560.0" y="66.0" width="400.0" height="150.0" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/><text x="572.0" y="88.0" font-size="12.5" font-weight="bold" fill="#1e3a8a" text-anchor="start">Leading indicators</text><text x="572.0" y="106.0" font-size="10.8" font-weight="bold" fill="#6b7280" text-anchor="start">•</text><text x="584.0" y="106.0" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">Show upcoming changes or trends; preferable because they prevent</text><text x="584.0" y="119.0" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">problems</text><text x="572.0" y="135.9" font-size="10.8" font-weight="bold" fill="#6b7280" text-anchor="start">•</text><text x="584.0" y="135.9" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">Examples: size of the backlog in progress, no risk process, stakeholders</text><text x="584.0" y="148.9" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">not engaged, poorly defined success criteria</text><text x="572.0" y="165.8" font-size="10.8" font-weight="bold" fill="#6b7280" text-anchor="start">•</text><text x="584.0" y="165.8" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">Evaluate the root cause of an unfavorable trend and correct it before</text><text x="584.0" y="178.8" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">tolerance is crossed</text><rect x="560.0" y="226.0" width="400.0" height="130.0" rx="10" fill="#fff7ed" stroke="#d97706" stroke-width="1.6"/><text x="572.0" y="248.0" font-size="12.5" font-weight="bold" fill="#78350f" text-anchor="start">Lagging indicators</text><text x="572.0" y="266.0" font-size="10.8" font-weight="bold" fill="#6b7280" text-anchor="start">•</text><text x="584.0" y="266.0" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">Reflect past performance: easier to measure, after the fact</text><text x="572.0" y="283.0" font-size="10.8" font-weight="bold" fill="#6b7280" text-anchor="start">•</text><text x="584.0" y="283.0" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">Examples: deliverables completed, schedule or cost variance, resources</text><text x="584.0" y="295.9" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">consumed</text><text x="572.0" y="312.9" font-size="10.8" font-weight="bold" fill="#6b7280" text-anchor="start">•</text><text x="584.0" y="312.9" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">Can reveal correlations, for example schedule variance with team</text><text x="584.0" y="325.8" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">dissatisfaction</text><rect x="560.0" y="366.0" width="400.0" height="90.0" rx="8" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.3"/><text x="572.0" y="386.0" font-size="12" font-weight="bold" fill="#1f2937" text-anchor="start">SMART criteria for goals and metrics</text><text x="572.0" y="404.0" font-size="11.5" font-weight="bold" fill="#1e3a8a" text-anchor="start">Specific · Measurable · Achievable · Realistic · Time-bound</text><text x="572.0" y="422.0" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">Measure only what is relevant and actionable; measurement costs time.</text><rect x="20.0" y="428.0" width="520.0" height="100.0" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/><text x="32.0" y="448.0" font-size="12" font-weight="bold" fill="#7f1d1d" text-anchor="start">Measurement pitfalls (PMBOK 8)</text><text x="32.0" y="464.0" font-size="10.6" font-weight="bold" fill="#6b7280" text-anchor="start">•</text><text x="44.0" y="464.0" font-size="10.6" font-weight="normal" fill="#1f2937" text-anchor="start">Hawthorne effect: measuring changes behavior (output-only measures reward volume)</text><text x="32.0" y="478.5" font-size="10.6" font-weight="bold" fill="#6b7280" text-anchor="start">•</text><text x="44.0" y="478.5" font-size="10.6" font-weight="normal" fill="#1f2937" text-anchor="start">Vanity metrics: data that does not inform decisions</text><text x="32.0" y="493.0" font-size="10.6" font-weight="bold" fill="#6b7280" text-anchor="start">•</text><text x="44.0" y="493.0" font-size="10.6" font-weight="normal" fill="#1f2937" text-anchor="start">Demoralizing, unachievable targets; gaming (short-term, easy out-of-sequence work)</text><text x="32.0" y="507.5" font-size="10.6" font-weight="bold" fill="#6b7280" text-anchor="start">•</text><text x="44.0" y="507.5" font-size="10.6" font-weight="normal" fill="#1f2937" text-anchor="start">Confirmation bias; confusing correlation with causation</text><rect x="560.0" y="466.0" width="400.0" height="62.0" rx="8" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.3"/><text x="572.0" y="486.0" font-size="10.8" font-weight="bold" fill="#134e4a" text-anchor="start">Reconcile data from different sources (accounting, tools, accepted work)</text><text x="572.0" y="499.0" font-size="10.8" font-weight="bold" fill="#134e4a" text-anchor="start">and use consistent definitions before reporting.</text></svg>