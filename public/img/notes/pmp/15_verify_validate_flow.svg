<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 480" width="980" height="480" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">From deliverable to acceptance: verify, validate, control changes</title><desc id="d">Deliverables produced in execution are verified in Monitor and Control Scope, then validated and formally accepted in Validate Scope, then handed to closure. Defects go back for repair and re-verification; scope changes go through change control.</desc><defs><marker id="ah0" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker><marker id="ah1" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker></defs><rect x="0.75" y="0.75" width="978.5" height="478.5" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><text x="20.0" y="28.0" font-size="18" font-weight="bold" fill="#1f2937" text-anchor="start">From deliverable to acceptance</text><text x="20.0" y="48.0" font-size="12" font-weight="normal" fill="#6b7280" text-anchor="start">Verify (is it built right?) comes first; validate (is it what the customer needs?) gives formal acceptance</text><rect x="21.0" y="74.0" width="138.0" height="150.0" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.7"/><text x="90.0" y="96.0" font-size="12.5" font-weight="bold" fill="#14532d" text-anchor="middle">Deliverable</text><text x="90.0" y="111.0" font-size="12.5" font-weight="bold" fill="#14532d" text-anchor="middle">produced</text><text x="90.0" y="134.0" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="middle">Manage Project</text><text x="90.0" y="147.8" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="middle">Execution</text><line x1="160.0" y1="149.0" x2="180.0" y2="149.0" stroke="#1f2937" stroke-width="2.2" marker-end="url(#ah0)"/><rect x="181.0" y="74.0" width="138.0" height="150.0" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.7"/><text x="250.0" y="96.0" font-size="12.5" font-weight="bold" fill="#78350f" text-anchor="middle">VERIFY: Monitor</text><text x="250.0" y="111.0" font-size="12.5" font-weight="bold" fill="#78350f" text-anchor="middle">and Control Scope</text><text x="250.0" y="134.0" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="middle">Inspect, test, measure</text><text x="250.0" y="147.8" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="middle">quality against</text><text x="250.0" y="161.5" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="middle">requirements and</text><text x="250.0" y="175.2" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="middle">standards; variance</text><text x="250.0" y="189.0" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="middle">analysis</text><line x1="320.0" y1="149.0" x2="340.0" y2="149.0" stroke="#1f2937" stroke-width="2.2" marker-end="url(#ah0)"/><rect x="341.0" y="74.0" width="138.0" height="150.0" rx="10" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.7"/><text x="410.0" y="96.0" font-size="12.5" font-weight="bold" fill="#374151" text-anchor="middle">Verified</text><text x="410.0" y="111.0" font-size="12.5" font-weight="bold" fill="#374151" text-anchor="middle">deliverables</text><text x="410.0" y="134.0" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="middle">Plus quality reports and</text><text x="410.0" y="147.8" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="middle">quality control</text><text x="410.0" y="161.5" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="middle">measurements</text><line x1="480.0" y1="149.0" x2="500.0" y2="149.0" stroke="#1f2937" stroke-width="2.2" marker-end="url(#ah0)"/><rect x="501.0" y="74.0" width="138.0" height="150.0" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.7"/><text x="570.0" y="96.0" font-size="12.5" font-weight="bold" fill="#78350f" text-anchor="middle">VALIDATE: Validate</text><text x="570.0" y="111.0" font-size="12.5" font-weight="bold" fill="#78350f" text-anchor="middle">Scope</text><text x="570.0" y="134.0" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="middle">Review with the</text><text x="570.0" y="147.8" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="middle">customer or sponsor;</text><text x="570.0" y="161.5" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="middle">inspection, customer</text><text x="570.0" y="175.2" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="middle">talks and tests, against</text><text x="570.0" y="189.0" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="middle">acceptance criteria</text><line x1="640.0" y1="149.0" x2="660.0" y2="149.0" stroke="#1f2937" stroke-width="2.2" marker-end="url(#ah0)"/><rect x="661.0" y="74.0" width="138.0" height="150.0" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.7"/><text x="730.0" y="96.0" font-size="12.5" font-weight="bold" fill="#14532d" text-anchor="middle">Accepted</text><text x="730.0" y="111.0" font-size="12.5" font-weight="bold" fill="#14532d" text-anchor="middle">deliverables</text><text x="730.0" y="134.0" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="middle">Formal, documented</text><text x="730.0" y="147.8" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="middle">acceptance</text><line x1="800.0" y1="149.0" x2="820.0" y2="149.0" stroke="#1f2937" stroke-width="2.2" marker-end="url(#ah0)"/><rect x="821.0" y="74.0" width="138.0" height="150.0" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.7"/><text x="890.0" y="96.0" font-size="12.5" font-weight="bold" fill="#4c1d95" text-anchor="middle">Close or transition</text><text x="890.0" y="119.0" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="middle">Close Project or Phase;</text><text x="890.0" y="132.8" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="middle">hand over to operations</text><rect x="181.0" y="262.0" width="138.0" height="76.0" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.6"/><text x="250.0" y="289.6" font-size="11.2" font-weight="bold" fill="#7f1d1d" text-anchor="middle">Defects found</text><text x="250.0" y="303.6" font-size="11.2" font-weight="normal" fill="#7f1d1d" text-anchor="middle">Defect repair, then</text><text x="250.0" y="317.6" font-size="11.2" font-weight="normal" fill="#7f1d1d" text-anchor="middle">re-inspect</text><line x1="250.0" y1="224.0" x2="250.0" y2="262.0" stroke="#dc2626" stroke-width="1.8" marker-end="url(#ah1)"/><rect x="501.0" y="262.0" width="138.0" height="76.0" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.6"/><text x="570.0" y="289.6" font-size="11.2" font-weight="bold" fill="#7f1d1d" text-anchor="middle">Not accepted, or new</text><text x="570.0" y="303.6" font-size="11.2" font-weight="bold" fill="#7f1d1d" text-anchor="middle">request</text><text x="570.0" y="317.6" font-size="11.2" font-weight="normal" fill="#7f1d1d" text-anchor="middle">Change request</text><line x1="570.0" y1="224.0" x2="570.0" y2="262.0" stroke="#dc2626" stroke-width="1.8" marker-end="url(#ah1)"/><rect x="21.0" y="262.0" width="138.0" height="76.0" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.6"/><text x="90.0" y="289.6" font-size="11.2" font-weight="bold" fill="#374151" text-anchor="middle">Back to execution</text><text x="90.0" y="303.6" font-size="11.2" font-weight="normal" fill="#374151" text-anchor="middle">Rework, then verify</text><text x="90.0" y="317.6" font-size="11.2" font-weight="normal" fill="#374151" text-anchor="middle">again</text><line x1="180.0" y1="300.0" x2="160.0" y2="300.0" stroke="#dc2626" stroke-width="1.8" marker-end="url(#ah1)"/><polyline points="570.0,338.0 570.0,352.0 90.0,352.0 90.0,340.0" fill="none" stroke="#dc2626" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#ah1)" stroke-linejoin="round"/><text x="361.0" y="366.0" font-size="11" font-weight="normal" fill="#991b1b" text-anchor="start">Scope changes: assess and implement through change control (Topic 29)</text><rect x="20.0" y="384.0" width="300.0" height="84.0" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="30.0" y="408.6" font-size="11.2" font-weight="bold" fill="#78350f" text-anchor="start">Verify</text><text x="30.0" y="422.6" font-size="11.2" font-weight="normal" fill="#78350f" text-anchor="start">Checks the deliverable against requirements and quality</text><text x="30.0" y="436.6" font-size="11.2" font-weight="normal" fill="#78350f" text-anchor="start">standards. Passing quality control does not mean the</text><text x="30.0" y="450.6" font-size="11.2" font-weight="normal" fill="#78350f" text-anchor="start">customer has accepted it.</text><rect x="340.0" y="384.0" width="300.0" height="84.0" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="350.0" y="408.6" font-size="11.2" font-weight="bold" fill="#78350f" text-anchor="start">Validate</text><text x="350.0" y="422.6" font-size="11.2" font-weight="normal" fill="#78350f" text-anchor="start">Obtains formal acceptance from the customer or</text><text x="350.0" y="436.6" font-size="11.2" font-weight="normal" fill="#78350f" text-anchor="start">sponsor against acceptance criteria defined up front;</text><text x="350.0" y="450.6" font-size="11.2" font-weight="normal" fill="#78350f" text-anchor="start">the right person must sign.</text><rect x="660.0" y="384.0" width="300.0" height="84.0" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="670.0" y="408.6" font-size="11.2" font-weight="bold" fill="#14532d" text-anchor="start">Adaptive</text><text x="670.0" y="422.6" font-size="11.2" font-weight="normal" fill="#14532d" text-anchor="start">Sprint reviews and demos give incremental feedback;</text><text x="670.0" y="436.6" font-size="11.2" font-weight="normal" fill="#14532d" text-anchor="start">each item meets its definition of done; customer talks</text><text x="670.0" y="450.6" font-size="11.2" font-weight="normal" fill="#14532d" text-anchor="start">and tests run throughout.</text></svg>