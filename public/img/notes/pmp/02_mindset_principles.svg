<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 470" width="980" height="470" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">Project management mindset: three dimensions and six principles</title><desc id="d">Proactive combines Adopt a Holistic View and Embed Quality; Ownership combines Be an Accountable Leader and Build an Empowered Culture; Value-driven combines Focus on Value and Integrate Sustainability.</desc><defs><marker id="ah0" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker></defs><rect x="0.75" y="0.75" width="978.5" height="468.5" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><text x="20.0" y="28.0" font-size="18" font-weight="bold" fill="#1f2937" text-anchor="start">The project management mindset</text><text x="20.0" y="48.0" font-size="12" font-weight="normal" fill="#6b7280" text-anchor="start">Three dimensions, six principles (the 'why'), expressed through seven performance domains (the 'mechanics')</text><rect x="20.0" y="66.0" width="300.0" height="40.0" rx="8" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.6"/><text x="170.0" y="90.9" font-size="15" font-weight="bold" fill="#134e4a" text-anchor="middle">PROACTIVE dimension</text><rect x="20.0" y="112.0" width="300.0" height="62.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="170.0" y="139.4" font-size="12" font-weight="normal" fill="#1f2937" text-anchor="middle">Anticipate challenges, plan at the right level, embed</text><text x="170.0" y="154.4" font-size="12" font-weight="normal" fill="#1f2937" text-anchor="middle">quality in every phase, continuous improvement</text><rect x="20.0" y="188.0" width="300.0" height="100.0" rx="8" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.6"/><text x="32.0" y="210.0" font-size="13" font-weight="bold" fill="#134e4a" text-anchor="start">Adopt a Holistic View</text><text x="32.0" y="227.6" font-size="12" font-weight="normal" fill="#1f2937" text-anchor="start">Systems thinking: see components,</text><text x="32.0" y="243.0" font-size="12" font-weight="normal" fill="#1f2937" text-anchor="start">interdependencies and patterns, not snapshots</text><rect x="20.0" y="300.0" width="300.0" height="100.0" rx="8" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.6"/><text x="32.0" y="322.0" font-size="13" font-weight="bold" fill="#134e4a" text-anchor="start">Embed Quality Into Processes and</text><text x="32.0" y="337.6" font-size="13" font-weight="bold" fill="#134e4a" text-anchor="start">Deliverables</text><text x="32.0" y="355.2" font-size="12" font-weight="normal" fill="#1f2937" text-anchor="start">Meet acceptance criteria and fitness for use; build</text><text x="32.0" y="370.6" font-size="12" font-weight="normal" fill="#1f2937" text-anchor="start">quality in; improve continuously; eliminate waste</text><rect x="340.0" y="66.0" width="300.0" height="40.0" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="490.0" y="90.9" font-size="15" font-weight="bold" fill="#1e3a8a" text-anchor="middle">OWNERSHIP dimension</text><rect x="340.0" y="112.0" width="300.0" height="62.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="490.0" y="139.4" font-size="12" font-weight="normal" fill="#1f2937" text-anchor="middle">Accountable leaders and a high-performing,</text><text x="490.0" y="154.4" font-size="12" font-weight="normal" fill="#1f2937" text-anchor="middle">self-reliant team culture with shared commitment</text><rect x="340.0" y="188.0" width="300.0" height="100.0" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="352.0" y="210.0" font-size="13" font-weight="bold" fill="#1e3a8a" text-anchor="start">Be an Accountable Leader</text><text x="352.0" y="227.6" font-size="12" font-weight="normal" fill="#1f2937" text-anchor="start">Integrity, self-awareness, humility (servant</text><text x="352.0" y="243.0" font-size="12" font-weight="normal" fill="#1f2937" text-anchor="start">leadership), adaptability, shared leadership,</text><text x="352.0" y="258.3" font-size="12" font-weight="normal" fill="#1f2937" text-anchor="start">psychological safety</text><rect x="340.0" y="300.0" width="300.0" height="100.0" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="352.0" y="322.0" font-size="13" font-weight="bold" fill="#1e3a8a" text-anchor="start">Build an Empowered Culture</text><text x="352.0" y="339.6" font-size="12" font-weight="normal" fill="#1f2937" text-anchor="start">Mutual trust, clear roles and team agreements,</text><text x="352.0" y="355.0" font-size="12" font-weight="normal" fill="#1f2937" text-anchor="start">diversity, stakeholders and team empowered to</text><text x="352.0" y="370.3" font-size="12" font-weight="normal" fill="#1f2937" text-anchor="start">contribute</text><rect x="660.0" y="66.0" width="300.0" height="40.0" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="810.0" y="90.9" font-size="15" font-weight="bold" fill="#78350f" text-anchor="middle">VALUE-DRIVEN dimension</text><rect x="660.0" y="112.0" width="300.0" height="62.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="810.0" y="139.4" font-size="12" font-weight="normal" fill="#1f2937" text-anchor="middle">Maximize value and balance people, planet and</text><text x="810.0" y="154.4" font-size="12" font-weight="normal" fill="#1f2937" text-anchor="middle">profit (triple bottom line)</text><rect x="660.0" y="188.0" width="300.0" height="100.0" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="672.0" y="210.0" font-size="13" font-weight="bold" fill="#78350f" text-anchor="start">Focus on Value</text><text x="672.0" y="227.6" font-size="12" font-weight="normal" fill="#1f2937" text-anchor="start">Value per unit of investment is the ultimate success</text><text x="672.0" y="243.0" font-size="12" font-weight="normal" fill="#1f2937" text-anchor="start">indicator; outcomes over deliverables</text><rect x="660.0" y="300.0" width="300.0" height="100.0" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="672.0" y="322.0" font-size="13" font-weight="bold" fill="#78350f" text-anchor="start">Integrate Sustainability Within All Project</text><text x="672.0" y="337.6" font-size="13" font-weight="bold" fill="#78350f" text-anchor="start">Areas</text><text x="672.0" y="355.2" font-size="12" font-weight="normal" fill="#1f2937" text-anchor="start">Meet present needs without compromising the</text><text x="672.0" y="370.6" font-size="12" font-weight="normal" fill="#1f2937" text-anchor="start">future; avoid, minimize, restore or offset negative</text><text x="672.0" y="385.9" font-size="12" font-weight="normal" fill="#1f2937" text-anchor="start">impacts</text><line x1="490.0" y1="412.0" x2="490.0" y2="426.0" stroke="#1f2937" stroke-width="2" marker-end="url(#ah0)"/><rect x="20.0" y="428.0" width="940.0" height="34.0" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.6"/><text x="490.0" y="449.1" font-size="12.5" font-weight="normal" fill="#374151" text-anchor="middle">Performance domains operationalize the principles: Governance, Scope (including quality), Schedule, Finance, Stakeholders, Resources, Risk.</text></svg>