-weight="bold" fill="#4c1d95" text-anchor="middle">data date</text><circle cx="289.6" cy="295.2" r="4.5" fill="#2563eb" stroke="#ffffff" stroke-width="1.2"/><circle cx="289.6" cy="324.2" r="4.5" fill="#16a34a" stroke="#ffffff" stroke-width="1.2"/><circle cx="289.6" cy="301.0" r="4.5" fill="#dc2626" stroke="#ffffff" stroke-width="1.2"/><text x="436.3" y="186.0" font-size="12" font-weight="bold" fill="#1e3a8a" text-anchor="start">PV (planned)</text><text x="170.8" y="392.5" font-size="12" font-weight="bold" fill="#7f1d1d" text-anchor="end">AC (actual)</text><text x="198.8" y="420.7" font-size="12" font-weight="bold" fill="#14532d" text-anchor="start">EV (earned)</text><text x="598.0" y="84.5" font-size="11" font-weight="bold" fill="#7f1d1d" text-anchor="end">EAC = 120</text><line x1="301.6" y1="301.0" x2="301.6" y2="324.2" stroke="#dc2626" stroke-width="2.4"/><line x1="310.6" y1="295.2" x2="310.6" y2="324.2" stroke="#2563eb" stroke-width="2.4"/><rect x="299.6" y="344.1" width="10.0" height="10.0" rx="2" fill="#dc2626" stroke="#dc2626" stroke-width="1"/><text x="313.6" y="353.1" font-size="11" font-weight="bold" fill="#7f1d1d" text-anchor="start">CV = EV − AC = −8</text><rect x="299.6" y="367.3" width="10.0" height="10.0" rx="2" fill="#2563eb" stroke="#2563eb" stroke-width="1"/><text x="313.6" y="376.3" font-size="11" font-weight="bold" fill="#1e3a8a" text-anchor="start">SV = EV − PV = −10</text><line x1="612.0" y1="150.4" x2="612.0" y2="92.5" stroke="#7c3aed" stroke-width="2.4"/><text x="618.0" y="125.4" font-size="10.5" font-weight="bold" fill="#4c1d95" text-anchor="start">VAC = −20</text><rect x="700.0" y="64.0" width="262.0" height="440.0" rx="8" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.2"/><text x="712.0" y="86.0" font-size="12.5" font-weight="bold" fill="#1f2937" text-anchor="start">Reading the example</text><text x="712.0" y="108.0" font-size="11" font-weight="bold" fill="#1e3a8a" text-anchor="start">CV = EV − AC</text><text x="712.0" y="122.0" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="start">40 − 48 = −8 (over budget)</text><text x="712.0" y="143.2" font-size="11" font-weight="bold" fill="#1e3a8a" text-anchor="start">SV = EV − PV</text><text x="712.0" y="157.2" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="start">40 − 50 = −10 (behind schedule)</text><text x="712.0" y="178.4" font-size="11" font-weight="bold" fill="#1e3a8a" text-anchor="start">CPI = EV ÷ AC</text><text x="712.0" y="192.4" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="start">40 ÷ 48 = 0.83</text><text x="712.0" y="213.6" font-size="11" font-weight="bold" fill="#1e3a8a" text-anchor="start">SPI = EV ÷ PV</text><text x="712.0" y="227.6" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="start">40 ÷ 50 = 0.80</text><text x="712.0" y="248.8" font-size="11" font-weight="bold" fill="#1e3a8a" text-anchor="start">EAC = BAC ÷ CPI</text><text x="712.0" y="262.8" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="start">100 ÷ 0.833 = 120</text><text x="712.0" y="284.0" font-size="11" font-weight="bold" fill="#1e3a8a" text-anchor="start">ETC = EAC − AC</text><text x="712.0" y="298.0" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="start">120 − 48 = 72</text><text x="712.0" y="319.2" font-size="11" font-weight="bold" fill="#1e3a8a" text-anchor="start">VAC = BAC − EAC</text><text x="712.0" y="333.2" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="start">100 − 120 = −20</text><text x="712.0" y="354.4" font-size="11" font-weight="bold" fill="#1e3a8a" text-anchor="start">TCPI (BAC) = (BAC − EV) ÷ (BAC − AC)</text><text x="712.0" y="368.4" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="start">60 ÷ 52 = 1.15: harder to complete</text><text x="712.0" y="395.6" font-size="10.5" font-weight="normal" fill="#6b7280" text-anchor="start">Positive variances and indices above 1 are</text><text x="712.0" y="408.4" font-size="10.5" font-weight="normal" fill="#6b7280" text-anchor="start">favorable (under budget, ahead of schedule). The</text><text x="712.0" y="421.2" font-size="10.5" font-weight="normal" fill="#6b7280" text-anchor="start">EAC shown assumes the current cost efficiency</text><text x="712.0" y="434.0" font-size="10.5" font-weight="normal" fill="#6b7280" text-anchor="start">continues.</text><rect x="80.0" y="476.0" width="524.0" height="56.0" rx="8" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.2"/><text x="92.0" y="496.0" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="start">Solid lines: results to date. Dashed lines: forecast of EV and AC. Dotted line: budget at completion.</text><text x="92.0" y="516.0" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="start">In adaptive work, PV and EV are counted in story points and AC is the team's cost for the iteration.</text></svg>