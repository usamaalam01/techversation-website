<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 580" width="980" height="580" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">The project inside its internal and external environments</title><desc id="d">The project sits inside the organization, which sits inside the external environment. PMBOK 8 lists nine groups of external enterprise environmental factors: marketplace conditions, social and cultural influences, legal restrictions, government or industry standards, public health and safety regulations, financial considerations, physical environmental elements, emerging technologies and innovations, and academic research with commercial databases. The ECO examples regulations, technology, geopolitical and market map onto these groups.</desc><defs></defs><rect x="0.75" y="0.75" width="978.5" height="578.5" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><text x="20.0" y="28.0" font-size="18" font-weight="bold" fill="#1f2937" text-anchor="start">The external environment around the project</text><text x="20.0" y="48.0" font-size="12" font-weight="normal" fill="#6b7280" text-anchor="start">EEFs are conditions outside the team's immediate control that influence, constrain or direct the project, for better or worse</text><rect x="22.0" y="62.0" width="216.0" height="372.0" rx="12" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.8"/><text x="34.0" y="84.0" font-size="12.5" font-weight="bold" fill="#374151" text-anchor="start">External environment</text><rect x="38.0" y="98.0" width="184.0" height="316.0" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/><text x="48.0" y="118.0" font-size="11.5" font-weight="bold" fill="#1e3a8a" text-anchor="start">Organization (internal</text><text x="48.0" y="131.8" font-size="11.5" font-weight="bold" fill="#1e3a8a" text-anchor="start">environment)</text><text x="48.0" y="148.0" font-size="10.5" font-weight="normal" fill="#1f2937" text-anchor="start">Culture, structure, governance,</text><text x="48.0" y="160.6" font-size="10.5" font-weight="normal" fill="#1f2937" text-anchor="start">OPAs, resources</text><rect x="52.0" y="192.0" width="156.0" height="128.0" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.8"/><text x="130.0" y="220.0" font-size="13" font-weight="bold" fill="#14532d" text-anchor="middle">Your project</text><text x="130.0" y="240.0" font-size="10.5" font-weight="normal" fill="#1f2937" text-anchor="middle">scope, backlog, schedule,</text><text x="130.0" y="252.6" font-size="10.5" font-weight="normal" fill="#1f2937" text-anchor="middle">budget, risks</text><text x="130.0" y="275.0" font-size="10.5" font-weight="bold" fill="#14532d" text-anchor="middle">Value and benefits depend</text><text x="130.0" y="287.6" font-size="10.5" font-weight="bold" fill="#14532d" text-anchor="middle">on what the outside world</text><text x="130.0" y="300.2" font-size="10.5" font-weight="bold" fill="#14532d" text-anchor="middle">does</text><rect x="258.0" y="62.0" width="224.0" height="116.0" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="268.0" y="83.0" font-size="12" font-weight="bold" fill="#78350f" text-anchor="start">Marketplace conditions</text><text x="268.0" y="101.4" font-size="10.6" font-weight="normal" fill="#1f2937" text-anchor="start">Competitors, customer behavior, market</text><text x="268.0" y="114.3" font-size="10.6" font-weight="normal" fill="#1f2937" text-anchor="start">share, brand recognition, trademarks</text><rect x="496.0" y="62.0" width="224.0" height="116.0" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.6"/><text x="506.0" y="83.0" font-size="12" font-weight="bold" fill="#4c1d95" text-anchor="start">Social and cultural influences</text><text x="506.0" y="101.4" font-size="10.6" font-weight="normal" fill="#1f2937" text-anchor="start">Political climate, codes of conduct, ethics,</text><text x="506.0" y="114.3" font-size="10.6" font-weight="normal" fill="#1f2937" text-anchor="start">perceptions</text><rect x="734.0" y="62.0" width="224.0" height="116.0" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="1.6"/><text x="744.0" y="83.0" font-size="12" font-weight="bold" fill="#7f1d1d" text-anchor="start">Legal restrictions</text><text x="744.0" y="101.4" font-size="10.6" font-weight="normal" fill="#1f2937" text-anchor="start">Laws and regulations on security, data</text><text x="744.0" y="114.3" font-size="10.6" font-weight="normal" fill="#1f2937" text-anchor="start">protection, business conduct, employment,</text><text x="744.0" y="127.3" font-size="10.6" font-weight="normal" fill="#1f2937" text-anchor="start">procurement</text><rect x="258.0" y="190.0" width="224.0" height="116.0" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="1.6"/><text x="268.0" y="211.0" font-size="12" font-weight="bold" fill="#7f1d1d" text-anchor="start">Government or industry standards</text><text x="268.0" y="229.4" font-size="10.6" font-weight="normal" fill="#1f2937" text-anchor="start">Regulatory agency rules and standards for</text><text x="268.0" y="242.3" font-size="10.6" font-weight="normal" fill="#1f2937" text-anchor="start">products, production, environment, safety,</text><text x="268.0" y="255.3" font-size="10.6" font-weight="normal" fill="#1f2937" text-anchor="start">quality, workmanship</text><rect x="496.0" y="190.0" width="224.0" height="116.0" rx="10" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.6"/><text x="506.0" y="211.0" font-size="12" font-weight="bold" fill="#134e4a" text-anchor="start">Public health and safety rules</text><text x="506.0" y="229.4" font-size="10.6" font-weight="normal" fill="#1f2937" text-anchor="start">Health protocols, travel restrictions,</text><text x="506.0" y="242.3" font-size="10.6" font-weight="normal" fill="#1f2937" text-anchor="start">quarantine, public safety mandates</text><rect x="734.0" y="190.0" width="224.0" height="116.0" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="744.0" y="211.0" font-size="12" font-weight="bold" fill="#14532d" text-anchor="start">Financial considerations</text><text x="744.0" y="229.4" font-size="10.6" font-weight="normal" fill="#1f2937" text-anchor="start">Exchange and interest rates, inflation,</text><text x="744.0" y="242.3" font-size="10.6" font-weight="normal" fill="#1f2937" text-anchor="start">tariffs, taxes, geographic location</text><rect x="258.0" y="318.0" width="224.0" height="116.0" rx="10" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.6"/><text x="268.0" y="339.0" font-size="12" font-weight="bold" fill="#374151" text-anchor="start">Physical environmental elements</text><text x="268.0" y="357.4" font-size="10.6" font-weight="normal" fill="#1f2937" text-anchor="start">Working conditions, weather, constraints</text><text x="268.0" y="370.3" font-size="10.6" font-weight="normal" fill="#1f2937" text-anchor="start">such as geopolitical issues</text><rect x="496.0" y="318.0" width="224.0" height="116.0" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="506.0" y="339.0" font-size="12" font-weight="bold" fill="#1e3a8a" text-anchor="start">Emerging technologies and</text><text x="506.0" y="353.4" font-size="12" font-weight="bold" fill="#1e3a8a" text-anchor="start">innovations</text><text x="506.0" y="371.8" font-size="10.6" font-weight="normal" fill="#1f2937" text-anchor="start">Artificial intelligence, automation,</text><text x="506.0" y="384.7" font-size="10.6" font-weight="normal" fill="#1f2937" text-anchor="start">blockchain, Internet of Things</text><rect x="734.0" y="318.0" width="224.0" height="116.0" rx="10" fill="#1e3a8a" stroke="#1e3a8a" stroke-width="1.6"/><text x="744.0" y="339.0" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="start">Research and commercial</text><text x="744.0" y="353.4" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="start">databases</text><text x="744.0" y="371.8" font-size="10.6" font-weight="normal" fill="#ffffff" text-anchor="start">Industry studies, benchmarking, trends;</text><text x="744.0" y="384.7" font-size="10.6" font-weight="normal" fill="#ffffff" text-anchor="start">cost estimating and risk databases</text><text x="22.0" y="456.0" font-size="13" font-weight="bold" fill="#1f2937" text-anchor="start">How the ECO examples map onto the PMBOK 8 groups</text><rect x="22.0" y="468.0" width="224.0" height="82.0" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/><text x="32.0" y="487.0" font-size="12" font-weight="bold" fill="#7f1d1d" text-anchor="start">Regulations</text><text x="32.0" y="503.0" font-size="10.4" font-weight="normal" fill="#1f2937" text-anchor="start">Legal restrictions; government or industry</text><text x="32.0" y="515.5" font-size="10.4" font-weight="normal" fill="#1f2937" text-anchor="start">standards; public health and safety rules</text><rect x="260.7" y="468.0" width="224.0" height="82.0" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><text x="270.7" y="487.0" font-size="12" font-weight="bold" fill="#1e3a8a" text-anchor="start">Technology</text><text x="270.7" y="503.0" font-size="10.4" font-weight="normal" fill="#1f2937" text-anchor="start">Emerging technologies and innovations</text><rect x="499.3" y="468.0" width="224.0" height="82.0" rx="10" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/><text x="509.3" y="487.0" font-size="12" font-weight="bold" fill="#374151" text-anchor="start">Geopolitical</text><text x="509.3" y="503.0" font-size="10.4" font-weight="normal" fill="#1f2937" text-anchor="start">Physical environmental elements</text><text x="509.3" y="515.5" font-size="10.4" font-weight="normal" fill="#1f2937" text-anchor="start">(geopolitical constraints); financial (tariffs);</text><text x="509.3" y="528.0" font-size="10.4" font-weight="normal" fill="#1f2937" text-anchor="start">social and cultural (political climate)</text><rect x="738.0" y="468.0" width="224.0" height="82.0" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/><text x="748.0" y="487.0" font-size="12" font-weight="bold" fill="#78350f" text-anchor="start">Market</text><text x="748.0" y="503.0" font-size="10.4" font-weight="normal" fill="#1f2937" text-anchor="start">Marketplace conditions; financial</text><text x="748.0" y="515.5" font-size="10.4" font-weight="normal" fill="#1f2937" text-anchor="start">considerations (exchange rates, inflation)</text></svg>