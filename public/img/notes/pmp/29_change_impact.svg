<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 524" width="980" height="524" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">Impact assessment of a change request</title><desc id="d">Questions to ask about the effect of a proposed change on scope, schedule, finance, quality, resources, risk, stakeholders, benefits and business case, compliance and contracts.</desc><defs></defs><rect x="0.75" y="0.75" width="978.5" height="522.5" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><text x="20.0" y="28.0" font-size="18" font-weight="bold" fill="#1f2937" text-anchor="start">Assess the impact across the whole project</text><text x="20.0" y="48.0" font-size="12" font-weight="normal" fill="#6b7280" text-anchor="start">A change in one domain ripples into the others; decide with the full picture</text><rect x="21.0" y="66.0" width="224.0" height="104.0" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.7"/><text x="33.0" y="90.0" font-size="12.5" font-weight="bold" fill="#1e3a8a" text-anchor="start">Scope</text><text x="33.0" y="110.0" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">Does it alter the scope baseline,</text><text x="33.0" y="123.2" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">requirements, backlog or acceptance</text><text x="33.0" y="136.4" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">criteria? Is it really a change or already in</text><text x="33.0" y="149.5" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">scope?</text><rect x="259.0" y="66.0" width="224.0" height="104.0" rx="10" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.7"/><text x="271.0" y="90.0" font-size="12.5" font-weight="bold" fill="#134e4a" text-anchor="start">Schedule</text><text x="271.0" y="110.0" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">Effect on the critical path, milestones,</text><text x="271.0" y="123.2" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">dependencies, release dates, resource</text><text x="271.0" y="136.4" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">calendars</text><rect x="497.0" y="66.0" width="224.0" height="104.0" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.7"/><text x="509.0" y="90.0" font-size="12.5" font-weight="bold" fill="#78350f" text-anchor="start">Finance</text><text x="509.0" y="110.0" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">Effect on cost baseline, funding,</text><text x="509.0" y="123.2" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">reserves, forecasts, contract value</text><rect x="735.0" y="66.0" width="224.0" height="104.0" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.7"/><text x="747.0" y="90.0" font-size="12.5" font-weight="bold" fill="#14532d" text-anchor="start">Quality</text><text x="747.0" y="110.0" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">New tests, standards, defects risk,</text><text x="747.0" y="123.2" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">rework; effect on acceptance criteria</text><rect x="21.0" y="182.0" width="224.0" height="104.0" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.7"/><text x="33.0" y="206.0" font-size="12.5" font-weight="bold" fill="#4c1d95" text-anchor="start">Resources</text><text x="33.0" y="226.0" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">Skills, capacity, procurement, team</text><text x="33.0" y="239.2" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">workload and morale</text><rect x="259.0" y="182.0" width="224.0" height="104.0" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="1.7"/><text x="271.0" y="206.0" font-size="12.5" font-weight="bold" fill="#7f1d1d" text-anchor="start">Risk</text><text x="271.0" y="226.0" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">New or changed risks and responses;</text><text x="271.0" y="239.2" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">secondary risks; reserve use</text><rect x="497.0" y="182.0" width="224.0" height="104.0" rx="10" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.7"/><text x="509.0" y="206.0" font-size="12.5" font-weight="bold" fill="#374151" text-anchor="start">Stakeholders</text><text x="509.0" y="226.0" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">Who is affected or must approve;</text><text x="509.0" y="239.2" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">expectations and communication needs</text><rect x="735.0" y="182.0" width="224.0" height="104.0" rx="10" fill="#1e3a8a" stroke="#1e3a8a" stroke-width="1.7"/><text x="747.0" y="206.0" font-size="12.5" font-weight="bold" fill="#ffffff" text-anchor="start">Benefits and business case</text><text x="747.0" y="226.0" font-size="10.8" font-weight="normal" fill="#ffffff" text-anchor="start">Does the case still hold? Value, benefits</text><text x="747.0" y="239.2" font-size="10.8" font-weight="normal" fill="#ffffff" text-anchor="start">timing, strategic alignment</text><rect x="260.0" y="298.0" width="224.0" height="104.0" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="1.7"/><text x="272.0" y="322.0" font-size="12.5" font-weight="bold" fill="#7f1d1d" text-anchor="start">Compliance and ethics</text><text x="272.0" y="342.0" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">Regulatory, security, safety,</text><text x="272.0" y="355.2" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">sustainability; policy and contract</text><text x="272.0" y="368.4" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">obligations</text><rect x="508.0" y="298.0" width="224.0" height="104.0" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.7"/><text x="520.0" y="322.0" font-size="12.5" font-weight="bold" fill="#78350f" text-anchor="start">Contracts</text><text x="520.0" y="342.0" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">Amendments, variation orders, penalties,</text><text x="520.0" y="355.2" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">supplier obligations</text><rect x="20.0" y="414.0" width="940.0" height="98.0" rx="8" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.3"/><text x="32.0" y="432.0" font-size="12.5" font-weight="bold" fill="#1f2937" text-anchor="start">Before the decision</text><text x="32.0" y="448.0" font-size="11" font-weight="bold" fill="#6b7280" text-anchor="start">•</text><text x="44.0" y="448.0" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="start">Estimate the effect on schedule and cost before the change can be approved; document assumptions.</text><text x="32.0" y="465.2" font-size="11" font-weight="bold" fill="#6b7280" text-anchor="start">•</text><text x="44.0" y="465.2" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="start">Compare options: implement, modify, defer or reject; use cost-benefit and multicriteria analysis when several factors compete.</text><text x="32.0" y="482.4" font-size="11" font-weight="bold" fill="#6b7280" text-anchor="start">•</text><text x="44.0" y="482.4" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="start">Within your authority and tolerance, decide and record; beyond it, take the change to the CCB, sponsor or customer with analysis and a recommendation.</text><text x="32.0" y="499.6" font-size="11" font-weight="bold" fill="#6b7280" text-anchor="start">•</text><text x="44.0" y="499.6" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="start">While waiting for a decision, keep executing the planned work and keep analyzing impact and risk.</text></svg>