<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 440" width="980" height="440" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">Tailoring at organization and project level</title><desc id="d">General development approach and methodology, shaped by environmental factors, are tailored into organizational methodologies for small and for large or sensitive projects, which projects then tailor into their own methodologies.</desc><defs><marker id="ah0" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker><marker id="ah1" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker></defs><rect x="0.75" y="0.75" width="978.5" height="438.5" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><text x="20.0" y="28.0" font-size="18" font-weight="bold" fill="#1f2937" text-anchor="start">Tailoring at organization level and at project level</text><text x="20.0" y="48.0" font-size="12" font-weight="normal" fill="#6b7280" text-anchor="start">PMBOK 8 Figure 3-2: each level narrows the general guidance to fit</text><rect x="250.0" y="62.0" width="480.0" height="52.0" rx="8" fill="#1e3a8a" stroke="#1e3a8a" stroke-width="1.6"/><text x="490.0" y="84.1" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">General project management methodology</text><text x="490.0" y="100.3" font-size="13" font-weight="normal" fill="#ffffff" text-anchor="middle">and general development approach</text><rect x="20.0" y="62.0" width="200.0" height="52.0" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.6"/><text x="120.0" y="84.4" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">Environmental factors and general</text><text x="120.0" y="99.4" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">guides</text><line x1="222.0" y1="88.0" x2="248.0" y2="88.0" stroke="#1f2937" stroke-width="2" marker-end="url(#ah0)"/><text x="490.0" y="134.0" font-size="12.5" font-weight="bold" fill="#1e3a8a" text-anchor="middle">TAILORING AT THE ORGANIZATIONAL LEVEL</text><line x1="400.0" y1="142.0" x2="260.0" y2="172.0" stroke="#1f2937" stroke-width="2" marker-end="url(#ah0)"/><line x1="580.0" y1="142.0" x2="720.0" y2="172.0" stroke="#1f2937" stroke-width="2" marker-end="url(#ah0)"/><rect x="80.0" y="174.0" width="360.0" height="52.0" rx="8" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.6"/><text x="260.0" y="204.2" font-size="13" font-weight="normal" fill="#134e4a" text-anchor="middle">Organization's methodology for small projects</text><rect x="540.0" y="174.0" width="360.0" height="52.0" rx="8" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.6"/><text x="720.0" y="204.2" font-size="13" font-weight="normal" fill="#134e4a" text-anchor="middle">Organization's methodology for large or sensitive projects</text><rect x="330.0" y="244.0" width="320.0" height="24.0" rx="4" fill="#ffffff" stroke="#ffffff" stroke-width="0"/><text x="490.0" y="262.0" font-size="12.5" font-weight="bold" fill="#14532d" text-anchor="middle">TAILORING AT THE PROJECT LEVEL</text><rect x="20.0" y="280.0" width="170.0" height="50.0" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="105.0" y="308.9" font-size="12" font-weight="bold" fill="#14532d" text-anchor="middle">Methodology for Project A</text><rect x="210.0" y="280.0" width="170.0" height="50.0" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="295.0" y="308.9" font-size="12" font-weight="bold" fill="#14532d" text-anchor="middle">Methodology for Project B</text><rect x="400.0" y="280.0" width="170.0" height="50.0" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="485.0" y="308.9" font-size="12" font-weight="bold" fill="#14532d" text-anchor="middle">Methodology for Project C</text><rect x="590.0" y="280.0" width="170.0" height="50.0" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="675.0" y="308.9" font-size="12" font-weight="bold" fill="#14532d" text-anchor="middle">Methodology for Project D</text><rect x="780.0" y="280.0" width="170.0" height="50.0" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="865.0" y="308.9" font-size="12" font-weight="bold" fill="#14532d" text-anchor="middle">Methodology for Project E</text><line x1="260.0" y1="228.0" x2="105.0" y2="278.0" stroke="#6b7280" stroke-width="1.6" marker-end="url(#ah1)"/><line x1="260.0" y1="228.0" x2="295.0" y2="278.0" stroke="#6b7280" stroke-width="1.6" marker-end="url(#ah1)"/><line x1="720.0" y1="228.0" x2="485.0" y2="278.0" stroke="#6b7280" stroke-width="1.6" marker-end="url(#ah1)"/><line x1="720.0" y1="228.0" x2="675.0" y2="278.0" stroke="#6b7280" stroke-width="1.6" marker-end="url(#ah1)"/><line x1="720.0" y1="228.0" x2="865.0" y2="278.0" stroke="#6b7280" stroke-width="1.6" marker-end="url(#ah1)"/><rect x="20.0" y="352.0" width="940.0" height="64.0" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.6"/><text x="490.0" y="380.4" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">Approvals: tailoring that affects only the project team usually needs just the project manager's approval; tailoring that affects external groups may need PMO approval. The</text><text x="490.0" y="395.4" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">PMO can also share ideas and solutions from other projects. Projects with several organizations tailor jointly to keep governance and processes aligned.</text></svg>