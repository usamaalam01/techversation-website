<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 470" width="940" height="470" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">SECI knowledge conversion</title><desc id="d">A two by two matrix: from tacit or explicit knowledge to tacit or explicit knowledge gives socialization, externalization, combination and internalization, arranged as a spiral.</desc><defs><marker id="ah0" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker></defs><rect x="0.75" y="0.75" width="938.5" height="468.5" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><text x="20.0" y="28.0" font-size="18" font-weight="bold" fill="#1f2937" text-anchor="start">SECI: four ways knowledge changes form</text><text x="20.0" y="48.0" font-size="12" font-weight="normal" fill="#6b7280" text-anchor="start">Name the mode from the form the knowledge starts in and the form it ends in [Beyond PMBOK 8 exam practice]</text><rect x="150.0" y="76.0" width="318.0" height="28.0" rx="8" fill="#1e3a8a" stroke="#1e3a8a" stroke-width="1.6"/><text x="309.0" y="94.1" font-size="12.5" font-weight="bold" fill="#ffffff" text-anchor="middle">To TACIT knowledge</text><rect x="508.0" y="76.0" width="318.0" height="28.0" rx="8" fill="#1e3a8a" stroke="#1e3a8a" stroke-width="1.6"/><text x="667.0" y="94.1" font-size="12.5" font-weight="bold" fill="#ffffff" text-anchor="middle">To EXPLICIT knowledge</text><rect x="20.0" y="110.0" width="120.0" height="124.0" rx="8" fill="#1e3a8a" stroke="#1e3a8a" stroke-width="1.6"/><text x="80.0" y="168.2" font-size="12.5" font-weight="bold" fill="#ffffff" text-anchor="middle">From TACIT</text><text x="80.0" y="183.9" font-size="12.5" font-weight="bold" fill="#ffffff" text-anchor="middle">knowledge</text><rect x="20.0" y="274.0" width="120.0" height="124.0" rx="8" fill="#1e3a8a" stroke="#1e3a8a" stroke-width="1.6"/><text x="80.0" y="332.2" font-size="12.5" font-weight="bold" fill="#ffffff" text-anchor="middle">From EXPLICIT</text><text x="80.0" y="347.9" font-size="12.5" font-weight="bold" fill="#ffffff" text-anchor="middle">knowledge</text><rect x="150.0" y="110.0" width="318.0" height="124.0" rx="10" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.8"/><text x="166.0" y="140.0" font-size="16" font-weight="bold" fill="#134e4a" text-anchor="start">1  Socialization</text><text x="166.0" y="166.0" font-size="12.5" font-weight="normal" fill="#134e4a" text-anchor="start">Shared experience: shadowing, mentoring,</text><text x="166.0" y="181.6" font-size="12.5" font-weight="normal" fill="#134e4a" text-anchor="start">apprenticeship, working side by side</text><rect x="508.0" y="110.0" width="318.0" height="124.0" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.8"/><text x="524.0" y="140.0" font-size="16" font-weight="bold" fill="#14532d" text-anchor="start">2  Externalization</text><text x="524.0" y="166.0" font-size="12.5" font-weight="normal" fill="#14532d" text-anchor="start">Putting know-how into words and models:</text><text x="524.0" y="181.6" font-size="12.5" font-weight="normal" fill="#14532d" text-anchor="start">interviews, checklists, guides, stories</text><rect x="508.0" y="274.0" width="318.0" height="124.0" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.8"/><text x="524.0" y="304.0" font-size="16" font-weight="bold" fill="#1e3a8a" text-anchor="start">3  Combination</text><text x="524.0" y="330.0" font-size="12.5" font-weight="normal" fill="#1e3a8a" text-anchor="start">Sorting and merging documents: wikis, databases,</text><text x="524.0" y="345.6" font-size="12.5" font-weight="normal" fill="#1e3a8a" text-anchor="start">consolidated reports</text><rect x="150.0" y="274.0" width="318.0" height="124.0" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.8"/><text x="166.0" y="304.0" font-size="16" font-weight="bold" fill="#4c1d95" text-anchor="start">4  Internalization</text><text x="166.0" y="330.0" font-size="12.5" font-weight="normal" fill="#4c1d95" text-anchor="start">Learning by doing with documented guidance:</text><text x="166.0" y="345.6" font-size="12.5" font-weight="normal" fill="#4c1d95" text-anchor="start">playbooks, practice, simulations</text><line x1="466.0" y1="172.0" x2="510.0" y2="172.0" stroke="#1f2937" stroke-width="2.4" marker-end="url(#ah0)"/><line x1="667.0" y1="232.0" x2="667.0" y2="276.0" stroke="#1f2937" stroke-width="2.4" marker-end="url(#ah0)"/><line x1="506.0" y1="336.0" x2="470.0" y2="336.0" stroke="#1f2937" stroke-width="2.4" marker-end="url(#ah0)"/><line x1="309.0" y1="276.0" x2="309.0" y2="232.0" stroke="#1f2937" stroke-width="2.4" marker-end="url(#ah0)"/><rect x="20.0" y="410.0" width="900.0" height="40.0" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.6"/><text x="470.0" y="426.4" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">Tacit to tacit needs people together; tacit to explicit needs capture; explicit to explicit is the easiest to automate; explicit to tacit needs practice. Knowledge keeps</text><text x="470.0" y="441.4" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">cycling through all four.</text></svg>