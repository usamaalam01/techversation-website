<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 470" width="980" height="470" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">Surveying and reviewing external changes</title><desc id="d">Five steps: survey external changes in regulations, technology, geopolitics and markets; assess the facts and the impact on objectives, business case, scope and backlog, schedule and cost, risk, compliance, suppliers and stakeholders; prioritize with mandatory and dated items first; act through backlog reprioritization, change requests, risk or opportunity responses, business case revalidation or escalation; and review continually, returning to the survey.</desc><defs><marker id="ah0" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker><marker id="ah1" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker></defs><rect x="0.75" y="0.75" width="978.5" height="468.5" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><text x="20.0" y="28.0" font-size="18" font-weight="bold" fill="#1f2937" text-anchor="start">Evaluate external business environment changes</text><text x="20.0" y="48.0" font-size="12" font-weight="normal" fill="#6b7280" text-anchor="start">A standing loop, not a reaction: look outward on a cadence, then assess, prioritize and act</text><rect x="22.0" y="64.0" width="172.0" height="214.0" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.7"/><text x="32.0" y="86.0" font-size="12.5" font-weight="bold" fill="#1e3a8a" text-anchor="start">1  Survey</text><text x="32.0" y="104.0" font-size="10.6" font-weight="normal" fill="#1f2937" text-anchor="start">Scan regulations, technology,</text><text x="32.0" y="116.9" font-size="10.6" font-weight="normal" fill="#1f2937" text-anchor="start">geopolitical and market</text><text x="32.0" y="129.9" font-size="10.6" font-weight="normal" fill="#1f2937" text-anchor="start">changes. Sources: regulators,</text><text x="32.0" y="142.8" font-size="10.6" font-weight="normal" fill="#1f2937" text-anchor="start">legal counsel, standards</text><text x="32.0" y="155.7" font-size="10.6" font-weight="normal" fill="#1f2937" text-anchor="start">bodies, industry news,</text><text x="32.0" y="168.7" font-size="10.6" font-weight="normal" fill="#1f2937" text-anchor="start">customers, suppliers, the PMO.</text><text x="32.0" y="181.6" font-size="10.6" font-weight="normal" fill="#1f2937" text-anchor="start">Prompts: PESTLE, TECOP,</text><text x="32.0" y="194.5" font-size="10.6" font-weight="normal" fill="#1f2937" text-anchor="start">VUCA.</text><rect x="30.0" y="248.0" width="112.5" height="20.0" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="1.2"/><text x="86.3" y="262.0" font-size="9.5" font-weight="bold" fill="#1e3a8a" text-anchor="middle">ECO: survey changes</text><line x1="195.0" y1="171.0" x2="213.0" y2="171.0" stroke="#1f2937" stroke-width="2.2" marker-end="url(#ah0)"/><rect x="214.0" y="64.0" width="172.0" height="214.0" rx="10" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.7"/><text x="224.0" y="86.0" font-size="12.5" font-weight="bold" fill="#134e4a" text-anchor="start">2  Assess</text><text x="224.0" y="104.0" font-size="10.6" font-weight="normal" fill="#1f2937" text-anchor="start">Confirm the facts and the</text><text x="224.0" y="116.9" font-size="10.6" font-weight="normal" fill="#1f2937" text-anchor="start">effective date. Impact on</text><text x="224.0" y="129.9" font-size="10.6" font-weight="normal" fill="#1f2937" text-anchor="start">objectives and business case,</text><text x="224.0" y="142.8" font-size="10.6" font-weight="normal" fill="#1f2937" text-anchor="start">scope and backlog, schedule</text><text x="224.0" y="155.7" font-size="10.6" font-weight="normal" fill="#1f2937" text-anchor="start">and cost, risk, compliance,</text><text x="224.0" y="168.7" font-size="10.6" font-weight="normal" fill="#1f2937" text-anchor="start">suppliers, stakeholders.</text><rect x="222.0" y="248.0" width="122.6" height="20.0" rx="10" fill="#ffffff" stroke="#0d9488" stroke-width="1.2"/><text x="283.3" y="262.0" font-size="9.5" font-weight="bold" fill="#134e4a" text-anchor="middle">ECO: assess the impact</text><line x1="387.0" y1="171.0" x2="405.0" y2="171.0" stroke="#1f2937" stroke-width="2.2" marker-end="url(#ah0)"/><rect x="406.0" y="64.0" width="172.0" height="214.0" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.7"/><text x="416.0" y="86.0" font-size="12.5" font-weight="bold" fill="#78350f" text-anchor="start">3  Prioritize</text><text x="416.0" y="104.0" font-size="10.6" font-weight="normal" fill="#1f2937" text-anchor="start">Mandatory and dated items</text><text x="416.0" y="116.9" font-size="10.6" font-weight="normal" fill="#1f2937" text-anchor="start">first; then value and cost of</text><text x="416.0" y="129.9" font-size="10.6" font-weight="normal" fill="#1f2937" text-anchor="start">delay, effort, risk of doing</text><text x="416.0" y="142.8" font-size="10.6" font-weight="normal" fill="#1f2937" text-anchor="start">nothing and dependencies.</text><rect x="414.0" y="248.0" width="156.0" height="20.0" rx="10" fill="#ffffff" stroke="#d97706" stroke-width="1.2"/><text x="492.0" y="262.0" font-size="9.5" font-weight="bold" fill="#78350f" text-anchor="middle">ECO: prioritize scope or backlog</text><line x1="579.0" y1="171.0" x2="597.0" y2="171.0" stroke="#1f2937" stroke-width="2.2" marker-end="url(#ah0)"/><rect x="598.0" y="64.0" width="172.0" height="214.0" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.7"/><text x="608.0" y="86.0" font-size="12.5" font-weight="bold" fill="#4c1d95" text-anchor="start">4  Act</text><text x="608.0" y="104.0" font-size="10.6" font-weight="normal" fill="#1f2937" text-anchor="start">Reprioritize the backlog, raise a</text><text x="608.0" y="116.9" font-size="10.6" font-weight="normal" fill="#1f2937" text-anchor="start">change request, plan a risk or</text><text x="608.0" y="129.9" font-size="10.6" font-weight="normal" fill="#1f2937" text-anchor="start">opportunity response, revalidate</text><text x="608.0" y="142.8" font-size="10.6" font-weight="normal" fill="#1f2937" text-anchor="start">the business case, escalate, or</text><text x="608.0" y="155.7" font-size="10.6" font-weight="normal" fill="#1f2937" text-anchor="start">stop through governance.</text><rect x="606.0" y="248.0" width="110.8" height="20.0" rx="10" fill="#ffffff" stroke="#7c3aed" stroke-width="1.2"/><text x="661.4" y="262.0" font-size="9.5" font-weight="bold" fill="#4c1d95" text-anchor="middle">Use the right channel</text><line x1="771.0" y1="171.0" x2="789.0" y2="171.0" stroke="#1f2937" stroke-width="2.2" marker-end="url(#ah0)"/><rect x="790.0" y="64.0" width="172.0" height="214.0" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.7"/><text x="800.0" y="86.0" font-size="12.5" font-weight="bold" fill="#14532d" text-anchor="start">5  Review</text><text x="800.0" y="104.0" font-size="10.6" font-weight="normal" fill="#1f2937" text-anchor="start">Keep a standing cadence:</text><text x="800.0" y="116.9" font-size="10.6" font-weight="normal" fill="#1f2937" text-anchor="start">planning events, reviews, gates.</text><text x="800.0" y="129.9" font-size="10.6" font-weight="normal" fill="#1f2937" text-anchor="start">Watch early signals. Update the</text><text x="800.0" y="142.8" font-size="10.6" font-weight="normal" fill="#1f2937" text-anchor="start">registers and the roadmap.</text><rect x="798.0" y="248.0" width="123.1" height="20.0" rx="10" fill="#ffffff" stroke="#16a34a" stroke-width="1.2"/><text x="859.5" y="262.0" font-size="9.5" font-weight="bold" fill="#14532d" text-anchor="middle">ECO: review continually</text><polyline points="876.0,279.0 876.0,300.0 108.0,300.0 108.0,280.0" fill="none" stroke="#16a34a" stroke-width="2.2" stroke-dasharray="6 4" marker-end="url(#ah1)" stroke-linejoin="round"/><text x="500.0" y="294.0" font-size="11" font-weight="bold" fill="#14532d" text-anchor="middle">repeat on a cadence and whenever a trigger appears</text><rect x="22.0" y="322.0" width="460.0" height="118.0" rx="10" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.6"/><text x="34.0" y="344.0" font-size="12.5" font-weight="bold" fill="#134e4a" text-anchor="start">Where the result is recorded</text><text x="34.0" y="364.0" font-size="10.8" font-weight="bold" fill="#6b7280" text-anchor="start">•</text><text x="46.0" y="364.0" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">Risk register: threats and opportunities; issue log if it has happened</text><text x="34.0" y="381.2" font-size="10.8" font-weight="bold" fill="#6b7280" text-anchor="start">•</text><text x="46.0" y="381.2" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">Assumption log, stakeholder register, backlog and roadmap</text><text x="34.0" y="398.4" font-size="10.8" font-weight="bold" fill="#6b7280" text-anchor="start">•</text><text x="46.0" y="398.4" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">Change log and scope baseline when a baseline moves</text><text x="34.0" y="415.5" font-size="10.8" font-weight="bold" fill="#6b7280" text-anchor="start">•</text><text x="46.0" y="415.5" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">Compliance requirements and business case or benefits plan</text><rect x="502.0" y="322.0" width="456.0" height="118.0" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.6"/><text x="514.0" y="344.0" font-size="12.5" font-weight="bold" fill="#4c1d95" text-anchor="start">Who needs to know</text><text x="514.0" y="364.0" font-size="10.8" font-weight="bold" fill="#6b7280" text-anchor="start">•</text><text x="526.0" y="364.0" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">Sponsor and governance: anything touching value, funding or authority</text><text x="514.0" y="381.2" font-size="10.8" font-weight="bold" fill="#6b7280" text-anchor="start">•</text><text x="526.0" y="381.2" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">Product owner and team: backlog and priority effects</text><text x="514.0" y="398.4" font-size="10.8" font-weight="bold" fill="#6b7280" text-anchor="start">•</text><text x="526.0" y="398.4" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">Procurement and suppliers: contract, cost or supply effects</text><text x="514.0" y="415.5" font-size="10.8" font-weight="bold" fill="#6b7280" text-anchor="start">•</text><text x="526.0" y="415.5" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">Affected stakeholders: what changes and when</text></svg>