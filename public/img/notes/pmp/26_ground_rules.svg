<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 520" width="980" height="520" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">Ground rules: create, communicate, reinforce, respond</title><desc id="d">A cycle for common ground rules: co-create them in the team charter, communicate them to the team and external parties, model and reinforce them, monitor adherence, respond to violations promptly and privately, and review and update them.</desc><defs><marker id="ah0" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker></defs><rect x="0.75" y="0.75" width="978.5" height="518.5" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><text x="20.0" y="28.0" font-size="18" font-weight="bold" fill="#1f2937" text-anchor="start">Common ground rules and what to do when they are broken</text><text x="20.0" y="48.0" font-size="12" font-weight="normal" fill="#6b7280" text-anchor="start">Ground rules set expected behavior and are defined in the team charter; the team owns them</text><rect x="20.0" y="64.0" width="300.0" height="104.0" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.7"/><text x="32.0" y="88.0" font-size="12.5" font-weight="bold" fill="#1e3a8a" text-anchor="start">1  Create together</text><text x="32.0" y="108.0" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="start">Co-create values, communication, decision-making,</text><text x="32.0" y="121.4" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="start">meeting and conflict rules in the team charter</text><rect x="340.0" y="64.0" width="300.0" height="104.0" rx="10" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.7"/><text x="352.0" y="88.0" font-size="12.5" font-weight="bold" fill="#134e4a" text-anchor="start">2  Communicate</text><text x="352.0" y="108.0" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="start">Share with the team, new members, vendors and other</text><text x="352.0" y="121.4" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="start">stakeholders; reflect them in agreements</text><rect x="660.0" y="64.0" width="300.0" height="104.0" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.7"/><text x="672.0" y="88.0" font-size="12.5" font-weight="bold" fill="#14532d" text-anchor="start">3  Model and reinforce</text><text x="672.0" y="108.0" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="start">Leaders follow them first; recognize adherence; apply</text><text x="672.0" y="121.4" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="start">them consistently</text><rect x="660.0" y="182.0" width="300.0" height="104.0" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.7"/><text x="672.0" y="206.0" font-size="12.5" font-weight="bold" fill="#78350f" text-anchor="start">4  Monitor</text><text x="672.0" y="226.0" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="start">Watch behavior, retrospectives and feedback; notice</text><text x="672.0" y="239.4" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="start">early drift</text><rect x="340.0" y="182.0" width="300.0" height="104.0" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="1.7"/><text x="352.0" y="206.0" font-size="12.5" font-weight="bold" fill="#7f1d1d" text-anchor="start">5  Respond to violations</text><text x="352.0" y="226.0" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="start">Promptly, privately, factually, with reference to the</text><text x="352.0" y="239.4" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="start">agreement</text><rect x="20.0" y="182.0" width="300.0" height="104.0" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.7"/><text x="32.0" y="206.0" font-size="12.5" font-weight="bold" fill="#4c1d95" text-anchor="start">6  Review and update</text><text x="32.0" y="226.0" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="start">Revisit when members join or context changes; fix gaps</text><text x="32.0" y="239.4" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="start">in the rules</text><line x1="321.0" y1="116.0" x2="339.0" y2="116.0" stroke="#1f2937" stroke-width="2.2" marker-end="url(#ah0)"/><line x1="641.0" y1="116.0" x2="659.0" y2="116.0" stroke="#1f2937" stroke-width="2.2" marker-end="url(#ah0)"/><line x1="810.0" y1="169.0" x2="810.0" y2="181.0" stroke="#1f2937" stroke-width="2.2" marker-end="url(#ah0)"/><line x1="659.0" y1="234.0" x2="641.0" y2="234.0" stroke="#1f2937" stroke-width="2.2" marker-end="url(#ah0)"/><line x1="339.0" y1="234.0" x2="321.0" y2="234.0" stroke="#1f2937" stroke-width="2.2" marker-end="url(#ah0)"/><text x="20.0" y="318.0" font-size="13" font-weight="bold" fill="#1f2937" text-anchor="start">Responding to a violation: start light, escalate only if needed</text><rect x="20.0" y="332.0" width="180.0" height="150.0" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="30.0" y="354.0" font-size="11.5" font-weight="bold" fill="#14532d" text-anchor="start">Notice and talk privately</text><text x="30.0" y="394.0" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">Describe what you saw, listen to</text><text x="30.0" y="407.2" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">the reason; assume nothing</text><text x="178.0" y="472.0" font-size="12" font-weight="bold" fill="#14532d" text-anchor="middle">1</text><rect x="210.0" y="332.0" width="180.0" height="150.0" rx="10" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.6"/><text x="220.0" y="354.0" font-size="11.5" font-weight="bold" fill="#134e4a" text-anchor="start">Refer to the agreement</text><text x="220.0" y="394.0" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">Remind the person of the rule</text><text x="220.0" y="407.2" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">they helped create; agree what</text><text x="220.0" y="420.4" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">changes</text><text x="368.0" y="472.0" font-size="12" font-weight="bold" fill="#134e4a" text-anchor="middle">2</text><rect x="400.0" y="332.0" width="180.0" height="150.0" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="410.0" y="354.0" font-size="11.5" font-weight="bold" fill="#1e3a8a" text-anchor="start">Involve the team if the rule is</text><text x="410.0" y="367.2" font-size="11.5" font-weight="bold" fill="#1e3a8a" text-anchor="start">theirs</text><text x="410.0" y="394.0" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">A team-made charter is</text><text x="410.0" y="407.2" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">addressed by the team, with</text><text x="410.0" y="420.4" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">facilitation</text><text x="558.0" y="472.0" font-size="12" font-weight="bold" fill="#1e3a8a" text-anchor="middle">3</text><rect x="590.0" y="332.0" width="180.0" height="150.0" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="600.0" y="354.0" font-size="11.5" font-weight="bold" fill="#78350f" text-anchor="start">Coach and follow up</text><text x="600.0" y="394.0" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">Support, check progress,</text><text x="600.0" y="407.2" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">recognize improvement</text><text x="748.0" y="472.0" font-size="12" font-weight="bold" fill="#78350f" text-anchor="middle">4</text><rect x="780.0" y="332.0" width="180.0" height="150.0" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="1.6"/><text x="790.0" y="354.0" font-size="11.5" font-weight="bold" fill="#7f1d1d" text-anchor="start">Formal route</text><text x="790.0" y="394.0" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">Management or HR procedures</text><text x="790.0" y="407.2" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">for repeated or serious breaches;</text><text x="790.0" y="420.4" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">ethics or compliance violations</text><text x="790.0" y="433.5" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">follow policy</text><text x="938.0" y="472.0" font-size="12" font-weight="bold" fill="#7f1d1d" text-anchor="middle">5</text><text x="20.0" y="504.0" font-size="11" font-weight="normal" fill="#6b7280" text-anchor="start">External parties: put ground rules and escalation paths into agreements and kickoff briefings; raise breaches with their management per the agreement.</text></svg>