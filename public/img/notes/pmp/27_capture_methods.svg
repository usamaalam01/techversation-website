<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 520" width="980" height="520" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">Methods for capturing lessons and sharing knowledge</title><desc id="d">Retrospective, after-action review, in-progress postmortem, learning review workshop, community of practice, work shadowing, knowledge cafe and storytelling, with when to use each and what it produces.</desc><defs></defs><rect x="0.75" y="0.75" width="978.5" height="518.5" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><text x="20.0" y="28.0" font-size="18" font-weight="bold" fill="#1f2937" text-anchor="start">Methods to capture and share knowledge</text><text x="20.0" y="48.0" font-size="12" font-weight="normal" fill="#6b7280" text-anchor="start">Use several: each fits a different timing and type of knowledge</text><rect x="20.0" y="62.0" width="940.0" height="28.0" rx="4" fill="#1e3a8a" stroke="#1e3a8a" stroke-width="1"/><text x="30.0" y="81.0" font-size="11.5" font-weight="bold" fill="#ffffff" text-anchor="start">Method</text><text x="230.0" y="81.0" font-size="11.5" font-weight="bold" fill="#ffffff" text-anchor="start">When</text><text x="450.0" y="81.0" font-size="11.5" font-weight="bold" fill="#ffffff" text-anchor="start">How it works</text><text x="780.0" y="81.0" font-size="11.5" font-weight="bold" fill="#ffffff" text-anchor="start">What you get</text><rect x="20.0" y="90.0" width="940.0" height="58.0" rx="0" fill="#ffffff" stroke="#d1d5db" stroke-width="1"/><rect x="20.0" y="90.0" width="6.0" height="58.0" rx="0" fill="#2563eb" stroke="#2563eb" stroke-width="1"/><text x="34.0" y="110.0" font-size="11" font-weight="bold" fill="#1e3a8a" text-anchor="start">Retrospective</text><text x="230.0" y="110.0" font-size="10.6" font-weight="normal" fill="#1f2937" text-anchor="start">End of each iteration at minimum; any</text><text x="230.0" y="122.5" font-size="10.6" font-weight="normal" fill="#1f2937" text-anchor="start">lessons session</text><text x="450.0" y="110.0" font-size="10.6" font-weight="normal" fill="#1f2937" text-anchor="start">Whole team: what worked, what did not, recommendations for the</text><text x="450.0" y="122.5" font-size="10.6" font-weight="normal" fill="#1f2937" text-anchor="start">next iteration</text><text x="780.0" y="110.0" font-size="10.6" font-weight="normal" fill="#1f2937" text-anchor="start">Actionable improvements with</text><text x="780.0" y="122.5" font-size="10.6" font-weight="normal" fill="#1f2937" text-anchor="start">owners</text><rect x="20.0" y="148.0" width="940.0" height="58.0" rx="0" fill="#f9fafb" stroke="#d1d5db" stroke-width="1"/><rect x="20.0" y="148.0" width="6.0" height="58.0" rx="0" fill="#16a34a" stroke="#16a34a" stroke-width="1"/><text x="34.0" y="168.0" font-size="11" font-weight="bold" fill="#14532d" text-anchor="start">After-action review (AAR)</text><text x="230.0" y="168.0" font-size="10.6" font-weight="normal" fill="#1f2937" text-anchor="start">After a milestone or at the end of a project</text><text x="230.0" y="180.5" font-size="10.6" font-weight="normal" fill="#1f2937" text-anchor="start">or activity</text><text x="450.0" y="168.0" font-size="10.6" font-weight="normal" fill="#1f2937" text-anchor="start">Whole team, structured: What was supposed to happen? What</text><text x="450.0" y="180.5" font-size="10.6" font-weight="normal" fill="#1f2937" text-anchor="start">actually happened? Why the differences? What can we learn?</text><text x="780.0" y="168.0" font-size="10.6" font-weight="normal" fill="#1f2937" text-anchor="start">Documented findings shared with</text><text x="780.0" y="180.5" font-size="10.6" font-weight="normal" fill="#1f2937" text-anchor="start">stakeholders</text><rect x="20.0" y="206.0" width="940.0" height="58.0" rx="0" fill="#ffffff" stroke="#d1d5db" stroke-width="1"/><rect x="20.0" y="206.0" width="6.0" height="58.0" rx="0" fill="#0d9488" stroke="#0d9488" stroke-width="1"/><text x="34.0" y="226.0" font-size="11" font-weight="bold" fill="#134e4a" text-anchor="start">In-progress postmortem</text><text x="230.0" y="226.0" font-size="10.6" font-weight="normal" fill="#1f2937" text-anchor="start">Periodically during the life cycle, not only at</text><text x="230.0" y="238.5" font-size="10.6" font-weight="normal" fill="#1f2937" text-anchor="start">the end</text><text x="450.0" y="226.0" font-size="10.6" font-weight="normal" fill="#1f2937" text-anchor="start">Analyze current performance, issues and improvements</text><text x="780.0" y="226.0" font-size="10.6" font-weight="normal" fill="#1f2937" text-anchor="start">Timely fixes and updates</text><rect x="20.0" y="264.0" width="940.0" height="58.0" rx="0" fill="#f9fafb" stroke="#d1d5db" stroke-width="1"/><rect x="20.0" y="264.0" width="6.0" height="58.0" rx="0" fill="#d97706" stroke="#d97706" stroke-width="1"/><text x="34.0" y="284.0" font-size="11" font-weight="bold" fill="#78350f" text-anchor="start">Learning review workshop</text><text x="230.0" y="284.0" font-size="10.6" font-weight="normal" fill="#1f2937" text-anchor="start">After a significant event or phase</text><text x="450.0" y="284.0" font-size="10.6" font-weight="normal" fill="#1f2937" text-anchor="start">Facilitated problem-solving session to identify lessons</text><text x="780.0" y="284.0" font-size="10.6" font-weight="normal" fill="#1f2937" text-anchor="start">Lessons learned register entries</text><rect x="20.0" y="322.0" width="940.0" height="58.0" rx="0" fill="#ffffff" stroke="#d1d5db" stroke-width="1"/><rect x="20.0" y="322.0" width="6.0" height="58.0" rx="0" fill="#7c3aed" stroke="#7c3aed" stroke-width="1"/><text x="34.0" y="342.0" font-size="11" font-weight="bold" fill="#4c1d95" text-anchor="start">Community of practice, forums,</text><text x="34.0" y="354.6" font-size="11" font-weight="bold" fill="#4c1d95" text-anchor="start">knowledge cafés</text><text x="230.0" y="342.0" font-size="10.6" font-weight="normal" fill="#1f2937" text-anchor="start">Ongoing across projects</text><text x="450.0" y="342.0" font-size="10.6" font-weight="normal" fill="#1f2937" text-anchor="start">Connect people with shared problems; open questions to</text><text x="450.0" y="354.5" font-size="10.6" font-weight="normal" fill="#1f2937" text-anchor="start">specialists</text><text x="780.0" y="342.0" font-size="10.6" font-weight="normal" fill="#1f2937" text-anchor="start">Shared solutions; tacit knowledge</text><text x="780.0" y="354.5" font-size="10.6" font-weight="normal" fill="#1f2937" text-anchor="start">flowing</text><rect x="20.0" y="380.0" width="940.0" height="58.0" rx="0" fill="#f9fafb" stroke="#d1d5db" stroke-width="1"/><rect x="20.0" y="380.0" width="6.0" height="58.0" rx="0" fill="#dc2626" stroke="#dc2626" stroke-width="1"/><text x="34.0" y="400.0" font-size="11" font-weight="bold" fill="#7f1d1d" text-anchor="start">Work shadowing and reverse</text><text x="34.0" y="412.6" font-size="11" font-weight="bold" fill="#7f1d1d" text-anchor="start">shadowing</text><text x="230.0" y="400.0" font-size="10.6" font-weight="normal" fill="#1f2937" text-anchor="start">Before a person or team leaves; when</text><text x="230.0" y="412.5" font-size="10.6" font-weight="normal" fill="#1f2937" text-anchor="start">training successors</text><text x="450.0" y="400.0" font-size="10.6" font-weight="normal" fill="#1f2937" text-anchor="start">Learner follows the expert; then the expert watches the learner</text><text x="780.0" y="400.0" font-size="10.6" font-weight="normal" fill="#1f2937" text-anchor="start">Transferred judgment and skills</text><rect x="20.0" y="438.0" width="940.0" height="58.0" rx="0" fill="#ffffff" stroke="#d1d5db" stroke-width="1"/><rect x="20.0" y="438.0" width="6.0" height="58.0" rx="0" fill="#9ca3af" stroke="#9ca3af" stroke-width="1"/><text x="34.0" y="458.0" font-size="11" font-weight="bold" fill="#374151" text-anchor="start">Storytelling</text><text x="230.0" y="458.0" font-size="10.6" font-weight="normal" fill="#1f2937" text-anchor="start">Sharing lessons, good practice, outcomes</text><text x="450.0" y="458.0" font-size="10.6" font-weight="normal" fill="#1f2937" text-anchor="start">Narratives of real scenarios and solutions</text><text x="780.0" y="458.0" font-size="10.6" font-weight="normal" fill="#1f2937" text-anchor="start">Memorable, relatable,</text><text x="780.0" y="470.5" font-size="10.6" font-weight="normal" fill="#1f2937" text-anchor="start">culture-shaping lessons</text></svg>