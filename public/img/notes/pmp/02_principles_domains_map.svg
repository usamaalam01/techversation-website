t><circle cx="330.0" cy="396.0" r="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.8"/><text x="346.0" y="401.0" font-size="12" font-weight="normal" fill="#1f2937" text-anchor="start">Still related, but not singled out as strongest</text><text x="460.0" y="440.0" font-size="11.5" font-weight="normal" fill="#6b7280" text-anchor="middle" font-style="italic">Holistic view, sustainability and empowered culture span all domains; accountable leadership is strongest in Governance, Stakeholders and Risk.</text></svg>