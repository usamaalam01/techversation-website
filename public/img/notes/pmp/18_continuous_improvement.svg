<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 500" width="980" height="500" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">Continuous improvement: PDCA and related approaches</title><desc id="d">The plan-do-check-act cycle with project examples, and the approaches PMBOK 8 names for continuous improvement: Lean, Total Quality Management, Six Sigma and the Five Focusing Steps, plus sources of improvement ideas.</desc><defs><marker id="ah0" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker></defs><rect x="0.75" y="0.75" width="978.5" height="498.5" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><text x="20.0" y="28.0" font-size="18" font-weight="bold" fill="#1f2937" text-anchor="start">Continuous improvement</text><text x="20.0" y="48.0" font-size="12" font-weight="normal" fill="#6b7280" text-anchor="start">Improve processes and products in small, repeated steps; PDCA is the basic loop</text><rect x="58.0" y="78.0" width="170.0" height="150.0" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="1.8"/><text x="143.0" y="106.0" font-size="16" font-weight="bold" fill="#1e3a8a" text-anchor="middle">PLAN</text><text x="70.0" y="132.0" font-size="11.3" font-weight="normal" fill="#1f2937" text-anchor="start">Define the problem and</text><text x="70.0" y="146.1" font-size="11.3" font-weight="normal" fill="#1f2937" text-anchor="start">target; find the root cause;</text><text x="70.0" y="160.2" font-size="11.3" font-weight="normal" fill="#1f2937" text-anchor="start">design a change</text><rect x="272.0" y="78.0" width="170.0" height="150.0" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="1.8"/><text x="357.0" y="106.0" font-size="16" font-weight="bold" fill="#14532d" text-anchor="middle">DO</text><text x="284.0" y="132.0" font-size="11.3" font-weight="normal" fill="#1f2937" text-anchor="start">Try the change on a small</text><text x="284.0" y="146.1" font-size="11.3" font-weight="normal" fill="#1f2937" text-anchor="start">scale (a sprint, a pilot, one</text><text x="284.0" y="160.2" font-size="11.3" font-weight="normal" fill="#1f2937" text-anchor="start">work package)</text><rect x="272.0" y="272.0" width="170.0" height="150.0" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="1.8"/><text x="357.0" y="300.0" font-size="16" font-weight="bold" fill="#78350f" text-anchor="middle">CHECK</text><text x="284.0" y="326.0" font-size="11.3" font-weight="normal" fill="#1f2937" text-anchor="start">Measure the result against</text><text x="284.0" y="340.1" font-size="11.3" font-weight="normal" fill="#1f2937" text-anchor="start">the target; review with the</text><text x="284.0" y="354.2" font-size="11.3" font-weight="normal" fill="#1f2937" text-anchor="start">team</text><rect x="58.0" y="272.0" width="170.0" height="150.0" rx="12" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.8"/><text x="143.0" y="300.0" font-size="16" font-weight="bold" fill="#4c1d95" text-anchor="middle">ACT</text><text x="70.0" y="326.0" font-size="11.3" font-weight="normal" fill="#1f2937" text-anchor="start">Standardize what worked</text><text x="70.0" y="340.1" font-size="11.3" font-weight="normal" fill="#1f2937" text-anchor="start">(update OPAs, checklists,</text><text x="70.0" y="354.2" font-size="11.3" font-weight="normal" fill="#1f2937" text-anchor="start">DoD); otherwise start again</text><line x1="230.0" y1="153.0" x2="270.0" y2="153.0" stroke="#1f2937" stroke-width="2.6" marker-end="url(#ah0)"/><line x1="357.0" y1="230.0" x2="357.0" y2="270.0" stroke="#1f2937" stroke-width="2.6" marker-end="url(#ah0)"/><line x1="270.0" y1="347.0" x2="230.0" y2="347.0" stroke="#1f2937" stroke-width="2.6" marker-end="url(#ah0)"/><line x1="143.0" y1="270.0" x2="143.0" y2="230.0" stroke="#1f2937" stroke-width="2.6" marker-end="url(#ah0)"/><circle cx="250.0" cy="250.0" r="24" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="250.0" y="248.0" font-size="10.5" font-weight="bold" fill="#374151" text-anchor="middle">repeat</text><text x="250.0" y="261.0" font-size="10.5" font-weight="bold" fill="#374151" text-anchor="middle">often</text><text x="500.0" y="76.0" font-size="13" font-weight="bold" fill="#1f2937" text-anchor="start">Approaches named in PMBOK 8</text><rect x="500.0" y="88.0" width="460.0" height="62.0" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/><text x="512.0" y="108.0" font-size="12" font-weight="bold" fill="#14532d" text-anchor="start">Lean</text><text x="512.0" y="125.0" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">Maximize value, minimize waste; value stream mapping shows the steps and time in each</text><text x="512.0" y="138.0" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">to find waste</text><rect x="500.0" y="158.0" width="460.0" height="62.0" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><text x="512.0" y="178.0" font-size="12" font-weight="bold" fill="#1e3a8a" text-anchor="start">Total Quality Management</text><text x="512.0" y="195.0" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">Organization-wide commitment to quality and customer focus; everyone owns quality</text><rect x="500.0" y="228.0" width="460.0" height="62.0" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/><text x="512.0" y="248.0" font-size="12" font-weight="bold" fill="#78350f" text-anchor="start">Six Sigma</text><text x="512.0" y="265.0" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">Reduce defects and variation with data; about 3.4 defects per million is the 6-sigma target</text><rect x="500.0" y="298.0" width="460.0" height="62.0" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/><text x="512.0" y="318.0" font-size="12" font-weight="bold" fill="#4c1d95" text-anchor="start">Five Focusing Steps (theory of constraints)</text><text x="512.0" y="335.0" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">Identify, exploit and subordinate to the constraint, elevate it, repeat [steps beyond the</text><text x="512.0" y="348.0" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">name are Beyond PMBOK 8]</text><rect x="500.0" y="372.0" width="460.0" height="114.0" rx="8" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.2"/><text x="512.0" y="392.0" font-size="12" font-weight="bold" fill="#1f2937" text-anchor="start">Where improvement ideas come from</text><text x="514.0" y="410.0" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">• Retrospectives and sprint reviews</text><text x="742.0" y="410.0" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">• Quality audits and process analysis</text><text x="514.0" y="430.0" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">• Root cause analysis of defects</text><text x="742.0" y="430.0" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">• Lessons learned and benchmarking</text><text x="514.0" y="450.0" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">• Stakeholder and customer feedback</text><text x="512.0" y="470.0" font-size="10.8" font-weight="bold" fill="#4c1d95" text-anchor="start">Keep improving the improvement process itself: inspect and adapt how the team</text><text x="512.0" y="483.0" font-size="10.8" font-weight="bold" fill="#4c1d95" text-anchor="start">improves, not only what it builds.</text></svg>