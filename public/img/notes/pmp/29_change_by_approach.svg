<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 520" width="980" height="520" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">Change control in predictive, adaptive and hybrid work</title><desc id="d">Predictive: change request, impact analysis, CCB decision, baseline update. Adaptive: backlog item, impact analysis, product owner prioritization; lower priority means deferred, not added means rejected. Hybrid: formal control for the baselined envelope, backlog inside it.</desc><defs><marker id="ah0" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker></defs><rect x="0.75" y="0.75" width="978.5" height="518.5" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><text x="20.0" y="28.0" font-size="18" font-weight="bold" fill="#1f2937" text-anchor="start">How changes are handled by approach</text><text x="20.0" y="48.0" font-size="12" font-weight="normal" fill="#6b7280" text-anchor="start">The principle is the same (assess, decide, record); the mechanism and authority differ</text><rect x="20.0" y="64.0" width="460.0" height="296.0" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/><text x="34.0" y="88.0" font-size="13" font-weight="bold" fill="#1e3a8a" text-anchor="start">Predictive (once baselines exist)</text><rect x="40.0" y="104.0" width="420.0" height="38.0" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="250.0" y="126.7" font-size="11.5" font-weight="bold" fill="#1e3a8a" text-anchor="middle">1 Change request in writing</text><line x1="250.0" y1="142.0" x2="250.0" y2="154.0" stroke="#1f2937" stroke-width="1.8" marker-end="url(#ah0)"/><rect x="40.0" y="154.0" width="420.0" height="38.0" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="250.0" y="176.7" font-size="11.5" font-weight="bold" fill="#1e3a8a" text-anchor="middle">2 Impact analysis (schedule and cost estimates)</text><line x1="250.0" y1="192.0" x2="250.0" y2="204.0" stroke="#1f2937" stroke-width="1.8" marker-end="url(#ah0)"/><rect x="40.0" y="204.0" width="420.0" height="38.0" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="250.0" y="226.7" font-size="11.5" font-weight="bold" fill="#1e3a8a" text-anchor="middle">3 CCB or designated approver decides</text><line x1="250.0" y1="242.0" x2="250.0" y2="254.0" stroke="#1f2937" stroke-width="1.8" marker-end="url(#ah0)"/><rect x="40.0" y="254.0" width="420.0" height="38.0" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="250.0" y="276.7" font-size="11.5" font-weight="bold" fill="#1e3a8a" text-anchor="middle">4 Approved: update baselines and plans</text><line x1="250.0" y1="292.0" x2="250.0" y2="304.0" stroke="#1f2937" stroke-width="1.8" marker-end="url(#ah0)"/><rect x="40.0" y="304.0" width="420.0" height="38.0" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="250.0" y="326.7" font-size="11.5" font-weight="bold" fill="#1e3a8a" text-anchor="middle">5 Communicate, implement, verify</text><rect x="500.0" y="64.0" width="460.0" height="296.0" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.6"/><text x="514.0" y="88.0" font-size="13" font-weight="bold" fill="#14532d" text-anchor="start">Adaptive</text><rect x="520.0" y="104.0" width="420.0" height="38.0" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="730.0" y="126.7" font-size="11.5" font-weight="bold" fill="#14532d" text-anchor="middle">1 Idea becomes a backlog item</text><line x1="730.0" y1="142.0" x2="730.0" y2="154.0" stroke="#1f2937" stroke-width="1.8" marker-end="url(#ah0)"/><rect x="520.0" y="154.0" width="420.0" height="38.0" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="730.0" y="176.7" font-size="11.5" font-weight="bold" fill="#14532d" text-anchor="middle">2 Impact analysis and sizing</text><line x1="730.0" y1="192.0" x2="730.0" y2="204.0" stroke="#1f2937" stroke-width="1.8" marker-end="url(#ah0)"/><rect x="520.0" y="204.0" width="420.0" height="38.0" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="730.0" y="226.7" font-size="11.5" font-weight="bold" fill="#14532d" text-anchor="middle">3 Product owner orders by value</text><line x1="730.0" y1="242.0" x2="730.0" y2="254.0" stroke="#1f2937" stroke-width="1.8" marker-end="url(#ah0)"/><rect x="520.0" y="254.0" width="420.0" height="38.0" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="730.0" y="276.7" font-size="11.5" font-weight="bold" fill="#14532d" text-anchor="middle">4 Higher priority: into a coming iteration</text><line x1="730.0" y1="292.0" x2="730.0" y2="304.0" stroke="#1f2937" stroke-width="1.8" marker-end="url(#ah0)"/><rect x="520.0" y="304.0" width="420.0" height="38.0" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="730.0" y="326.7" font-size="11.5" font-weight="bold" fill="#14532d" text-anchor="middle">5 Lower priority = deferred; not added = rejected</text><rect x="20.0" y="372.0" width="940.0" height="134.0" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/><text x="32.0" y="394.0" font-size="12.5" font-weight="bold" fill="#78350f" text-anchor="start">Hybrid and contractual boundaries</text><text x="32.0" y="412.0" font-size="11" font-weight="bold" fill="#6b7280" text-anchor="start">•</text><text x="44.0" y="412.0" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="start">Formal change control applies to the baselined envelope: milestones, committed scope, budget, regulatory or contractual commitments.</text><text x="32.0" y="429.2" font-size="11" font-weight="bold" fill="#6b7280" text-anchor="start">•</text><text x="44.0" y="429.2" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="start">Inside the envelope the backlog adapts; a contract threshold (for example scope changes above a percentage of effort) triggers formal approval.</text><text x="32.0" y="446.4" font-size="11" font-weight="bold" fill="#6b7280" text-anchor="start">•</text><text x="44.0" y="446.4" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="start">The degree of change management depends on scope, complexity, contract requirements and development approach; the CCB or board is involved where applicable.</text><text x="32.0" y="463.6" font-size="11" font-weight="bold" fill="#6b7280" text-anchor="start">•</text><text x="44.0" y="463.6" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="start">No formal approval for routine backlog reordering, but still an impact analysis and transparency about trade-offs.</text></svg>