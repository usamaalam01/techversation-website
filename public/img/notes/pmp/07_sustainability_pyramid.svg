<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 470" width="940" height="470" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">Sustainability pyramid and triple bottom line</title><desc id="d">Pyramid of responses to negative outcomes from most to least desirable: avoid, minimize, restore, compensate or offset. Triple bottom line: people, planet, profit.</desc><defs><marker id="ah0" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#166534"/></marker></defs><rect x="0.75" y="0.75" width="938.5" height="468.5" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><text x="20.0" y="28.0" font-size="18" font-weight="bold" fill="#1f2937" text-anchor="start">Sustainability: the pyramid and the triple bottom line</text><text x="20.0" y="48.0" font-size="12" font-weight="normal" fill="#6b7280" text-anchor="start">PMBOK 8 Standard Figures 3-6 and 3-7 and §3.7</text><polygon points="235.0,74.0 325.0,74.0 375.0,146.0 185.0,146.0" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="280.0" y="103.0" font-size="10.5" font-weight="bold" fill="#16a34a" text-anchor="middle">AVOID negative</text><text x="280.0" y="115.6" font-size="10.5" font-weight="bold" fill="#16a34a" text-anchor="middle">outcomes altogether</text><polygon points="185.0,150.0 375.0,150.0 425.0,222.0 135.0,222.0" fill="#ccfbf1" stroke="#0d9488" stroke-width="2"/><text x="280.0" y="179.0" font-size="12" font-weight="bold" fill="#0d9488" text-anchor="middle">MINIMIZE negative outcomes</text><text x="280.0" y="193.4" font-size="12" font-weight="bold" fill="#0d9488" text-anchor="middle">generated</text><polygon points="135.0,226.0 425.0,226.0 475.0,298.0 85.0,298.0" fill="#fef3c7" stroke="#d97706" stroke-width="2"/><text x="280.0" y="262.0" font-size="12" font-weight="bold" fill="#d97706" text-anchor="middle">RESTORE the impacts of negative outcomes</text><polygon points="85.0,302.0 475.0,302.0 525.0,374.0 35.0,374.0" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/><text x="280.0" y="338.0" font-size="12" font-weight="bold" fill="#dc2626" text-anchor="middle">COMPENSATE / OFFSET for negative outcomes</text><text x="44.0" y="88.0" font-size="12" font-weight="bold" fill="#166534" text-anchor="start">More desirable</text><text x="44.0" y="386.0" font-size="12" font-weight="bold" fill="#991b1b" text-anchor="start">Less desirable</text><line x1="26.0" y1="368.0" x2="26.0" y2="98.0" stroke="#166534" stroke-width="2" marker-end="url(#ah0)"/><text x="700.0" y="76.0" font-size="14" font-weight="bold" fill="#1f2937" text-anchor="middle">Triple bottom line</text><circle cx="660.0" cy="190.0" r="78" fill="#bbf7d0" stroke="#16a34a" stroke-width="2"/><circle cx="740.0" cy="190.0" r="78" fill="#bfdbfe" stroke="#2563eb" stroke-width="2"/><circle cx="700.0" cy="250.0" r="78" fill="#fde68a" stroke="#d97706" stroke-width="2"/><text x="622.0" y="170.0" font-size="12.5" font-weight="bold" fill="#14532d" text-anchor="middle">PLANET</text><text x="622.0" y="186.0" font-size="11" font-weight="normal" fill="#14532d" text-anchor="middle">environment</text><text x="780.0" y="170.0" font-size="12.5" font-weight="bold" fill="#1e3a8a" text-anchor="middle">PEOPLE</text><text x="780.0" y="186.0" font-size="11" font-weight="normal" fill="#1e3a8a" text-anchor="middle">society</text><text x="700.0" y="290.0" font-size="12.5" font-weight="bold" fill="#78350f" text-anchor="middle">PROFIT</text><text x="700.0" y="306.0" font-size="11" font-weight="normal" fill="#78350f" text-anchor="middle">economy</text><text x="700.0" y="224.0" font-size="11.5" font-weight="bold" fill="#1f2937" text-anchor="middle">Sustainable</text><text x="700.0" y="238.0" font-size="11.5" font-weight="bold" fill="#1f2937" text-anchor="middle">projects</text><rect x="540.0" y="346.0" width="380.0" height="78.0" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.6"/><text x="730.0" y="373.9" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">Meet present needs without compromising future generations' ability</text><text x="730.0" y="388.9" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">to meet theirs. Project managers, teams AND sponsors are jointly</text><text x="730.0" y="403.9" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">accountable.</text></svg>