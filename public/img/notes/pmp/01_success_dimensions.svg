<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" width="880" height="470" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">Two dimensions of project success</title><desc id="d">Management success (cost, scope, time, quality) against outcome success (value realized). Four combinations with PMBOK 8 examples.</desc><defs><marker id="ah0" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker></defs><rect x="0.75" y="0.75" width="878.5" height="468.5" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><text x="20.0" y="28.0" font-size="18" font-weight="bold" fill="#1f2937" text-anchor="start">Assessing project success: two dimensions</text><text x="20.0" y="48.0" font-size="12" font-weight="normal" fill="#6b7280" text-anchor="start">Project success = consensus that the project delivered value that was worth the effort and expense</text><rect x="110.0" y="70.0" width="360.0" height="165.0" rx="0" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="290.0" y="102.0" font-size="15" font-weight="bold" fill="#78350f" text-anchor="middle">Well managed, little value</text><text x="290.0" y="128.0" font-size="12" font-weight="normal" fill="#1f2937" text-anchor="middle">On time, on budget, to quality, but the outcome failed.</text><text x="290.0" y="143.6" font-size="12" font-weight="normal" fill="#1f2937" text-anchor="middle">Example: a well-built overpass demolished because it did not</text><text x="290.0" y="159.2" font-size="12" font-weight="normal" fill="#1f2937" text-anchor="middle">fit the redevelopment design.</text><rect x="470.0" y="70.0" width="360.0" height="165.0" rx="0" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="650.0" y="102.0" font-size="15" font-weight="bold" fill="#14532d" text-anchor="middle">Ideal</text><text x="650.0" y="128.0" font-size="12" font-weight="normal" fill="#1f2937" text-anchor="middle">Efficient management and the intended outcomes and value.</text><rect x="110.0" y="235.0" width="360.0" height="165.0" rx="0" fill="#fee2e2" stroke="#dc2626" stroke-width="1.6"/><text x="290.0" y="267.0" font-size="15" font-weight="bold" fill="#7f1d1d" text-anchor="middle">Failure</text><text x="290.0" y="293.0" font-size="12" font-weight="normal" fill="#1f2937" text-anchor="middle">Neither efficient delivery nor the intended value.</text><rect x="470.0" y="235.0" width="360.0" height="165.0" rx="0" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="650.0" y="267.0" font-size="15" font-weight="bold" fill="#1e3a8a" text-anchor="middle">Poorly managed, great value</text><text x="650.0" y="293.0" font-size="12" font-weight="normal" fill="#1f2937" text-anchor="middle">Over budget and late, yet the outcome exceeded</text><text x="650.0" y="308.6" font-size="12" font-weight="normal" fill="#1f2937" text-anchor="middle">expectations.</text><text x="650.0" y="324.2" font-size="12" font-weight="normal" fill="#1f2937" text-anchor="middle">Example: the Sydney Opera House (AUS$7M and 4 years</text><text x="650.0" y="339.8" font-size="12" font-weight="normal" fill="#1f2937" text-anchor="middle">planned; AUS$102M and 14 years actual).</text><line x1="96.0" y1="400.0" x2="96.0" y2="70.0" stroke="#1f2937" stroke-width="2" marker-end="url(#ah0)"/><text x="84.0" y="235.0" transform="rotate(-90 84.0 235.0)" font-size="12" font-weight="bold" fill="#1f2937" text-anchor="middle">MANAGEMENT SUCCESS</text><line x1="110.0" y1="416.0" x2="830.0" y2="416.0" stroke="#1f2937" stroke-width="2" marker-end="url(#ah0)"/><text x="470.0" y="438.0" font-size="12" font-weight="bold" fill="#1f2937" text-anchor="middle">OUTCOME SUCCESS (value realized, now or later)</text><text x="116.0" y="434.0" font-size="11" font-weight="normal" fill="#6b7280" text-anchor="start">Low</text><text x="824.0" y="434.0" font-size="11" font-weight="normal" fill="#6b7280" text-anchor="end">High</text><text x="90.0" y="82.0" font-size="11" font-weight="normal" fill="#6b7280" text-anchor="end">High</text><text x="90.0" y="398.0" font-size="11" font-weight="normal" fill="#6b7280" text-anchor="end">Low</text></svg>