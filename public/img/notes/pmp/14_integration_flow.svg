<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 486" width="980" height="486" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">Integrating and maintaining the plan</title><desc id="d">Establish approach and tailoring; gather subsidiary plans and baselines; integrate and verify dependencies, gaps and business value; resolve conflicts; approve and baseline; communicate; maintain through progressive elaboration and change control.</desc><defs><marker id="ah0" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker><marker id="ah1" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker></defs><rect x="0.75" y="0.75" width="978.5" height="484.5" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><text x="20.0" y="28.0" font-size="18" font-weight="bold" fill="#1f2937" text-anchor="start">Integrate and Align Project Plans: from pieces to one plan</text><text x="20.0" y="48.0" font-size="12" font-weight="normal" fill="#6b7280" text-anchor="start">Resolve cross-plan clashes before baselining; keep the plan alive afterward</text><rect x="20.0" y="74.0" width="170.0" height="42.0" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="105.0" y="99.1" font-size="12.5" font-weight="bold" fill="#1e3a8a" text-anchor="middle">1 Set the frame</text><rect x="20.0" y="122.0" width="170.0" height="140.0" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/><text x="30.0" y="142.0" font-size="11.2" font-weight="normal" fill="#1f2937" text-anchor="start">Charter, EEFs, OPAs.</text><text x="30.0" y="156.2" font-size="11.2" font-weight="normal" fill="#1f2937" text-anchor="start">Choose development</text><text x="30.0" y="170.4" font-size="11.2" font-weight="normal" fill="#1f2937" text-anchor="start">approach, life cycle, tailoring</text><text x="30.0" y="184.7" font-size="11.2" font-weight="normal" fill="#1f2937" text-anchor="start">(Topics 03, 05)</text><line x1="192.0" y1="95.0" x2="210.0" y2="95.0" stroke="#1f2937" stroke-width="2.2" marker-end="url(#ah0)"/><rect x="212.0" y="74.0" width="170.0" height="42.0" rx="8" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.6"/><text x="297.0" y="99.1" font-size="12.5" font-weight="bold" fill="#134e4a" text-anchor="middle">2 Gather</text><rect x="212.0" y="122.0" width="170.0" height="140.0" rx="8" fill="#ffffff" stroke="#0d9488" stroke-width="1.5"/><text x="222.0" y="142.0" font-size="11.2" font-weight="normal" fill="#1f2937" text-anchor="start">Plans and baselines from</text><text x="222.0" y="156.2" font-size="11.2" font-weight="normal" fill="#1f2937" text-anchor="start">every domain: scope,</text><text x="222.0" y="170.4" font-size="11.2" font-weight="normal" fill="#1f2937" text-anchor="start">schedule, finance, quality,</text><text x="222.0" y="184.7" font-size="11.2" font-weight="normal" fill="#1f2937" text-anchor="start">resources, communications,</text><text x="222.0" y="198.9" font-size="11.2" font-weight="normal" fill="#1f2937" text-anchor="start">stakeholders, risk, sourcing,</text><text x="222.0" y="213.1" font-size="11.2" font-weight="normal" fill="#1f2937" text-anchor="start">change</text><line x1="384.0" y1="95.0" x2="402.0" y2="95.0" stroke="#1f2937" stroke-width="2.2" marker-end="url(#ah0)"/><rect x="404.0" y="74.0" width="170.0" height="42.0" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="489.0" y="99.1" font-size="12.5" font-weight="bold" fill="#14532d" text-anchor="middle">3 Integrate and align</text><rect x="404.0" y="122.0" width="170.0" height="140.0" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/><text x="414.0" y="142.0" font-size="11.2" font-weight="normal" fill="#1f2937" text-anchor="start">Combine into one plan; check</text><text x="414.0" y="156.2" font-size="11.2" font-weight="normal" fill="#1f2937" text-anchor="start">dependencies, gaps,</text><text x="414.0" y="170.4" font-size="11.2" font-weight="normal" fill="#1f2937" text-anchor="start">overlaps, conflicting</text><text x="414.0" y="184.7" font-size="11.2" font-weight="normal" fill="#1f2937" text-anchor="start">assumptions, and that the</text><text x="414.0" y="198.9" font-size="11.2" font-weight="normal" fill="#1f2937" text-anchor="start">business case still holds</text><line x1="576.0" y1="95.0" x2="594.0" y2="95.0" stroke="#1f2937" stroke-width="2.2" marker-end="url(#ah0)"/><rect x="596.0" y="74.0" width="170.0" height="42.0" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="681.0" y="99.1" font-size="12.5" font-weight="bold" fill="#78350f" text-anchor="middle">4 Resolve and approve</text><rect x="596.0" y="122.0" width="170.0" height="140.0" rx="8" fill="#ffffff" stroke="#d97706" stroke-width="1.5"/><text x="606.0" y="142.0" font-size="11.2" font-weight="normal" fill="#1f2937" text-anchor="start">Fix clashes in the integrated</text><text x="606.0" y="156.2" font-size="11.2" font-weight="normal" fill="#1f2937" text-anchor="start">plan, estimate again if</text><text x="606.0" y="170.4" font-size="11.2" font-weight="normal" fill="#1f2937" text-anchor="start">needed, get approval, set the</text><text x="606.0" y="184.7" font-size="11.2" font-weight="normal" fill="#1f2937" text-anchor="start">baselines</text><line x1="768.0" y1="95.0" x2="786.0" y2="95.0" stroke="#1f2937" stroke-width="2.2" marker-end="url(#ah0)"/><rect x="788.0" y="74.0" width="170.0" height="42.0" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.6"/><text x="873.0" y="99.1" font-size="12.5" font-weight="bold" fill="#4c1d95" text-anchor="middle">5 Communicate</text><rect x="788.0" y="122.0" width="170.0" height="140.0" rx="8" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/><text x="798.0" y="142.0" font-size="11.2" font-weight="normal" fill="#1f2937" text-anchor="start">Share the plan and what it</text><text x="798.0" y="156.2" font-size="11.2" font-weight="normal" fill="#1f2937" text-anchor="start">means with the team and key</text><text x="798.0" y="170.4" font-size="11.2" font-weight="normal" fill="#1f2937" text-anchor="start">stakeholders</text><rect x="20.0" y="296.0" width="940.0" height="70.0" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.6"/><text x="36.0" y="320.0" font-size="13.5" font-weight="bold" fill="#4c1d95" text-anchor="start">6  Maintain (throughout)</text><text x="36.0" y="340.0" font-size="11.8" font-weight="normal" fill="#1f2937" text-anchor="start">Progressive elaboration and rolling wave planning; update for approved changes, corrective and preventive actions, lessons learned, retrospectives and gate decisions;</text><text x="36.0" y="354.8" font-size="11.8" font-weight="normal" fill="#1f2937" text-anchor="start">baselines change only through change control; configuration control keeps versions consistent; replan each iteration or release in adaptive work.</text><line x1="490.0" y1="266.0" x2="490.0" y2="294.0" stroke="#7c3aed" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#ah1)"/><rect x="20.0" y="382.0" width="940.0" height="80.0" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.6"/><text x="34.0" y="410.9" font-size="12" font-weight="bold" fill="#374151" text-anchor="start">How much planning?</text><text x="34.0" y="425.9" font-size="12" font-weight="normal" fill="#374151" text-anchor="start">Enough to move forward appropriately and to confirm stakeholder expectations and give them the information they need to decide and stay aligned, but not more detailed</text><text x="34.0" y="440.9" font-size="12" font-weight="normal" fill="#374151" text-anchor="start">than necessary. Predictive front-loads planning; adaptive plans at several levels and replans often.</text></svg>