<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 520" width="980" height="520" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">Finance performance domain: four processes, money build-up and funding strategies</title><desc id="d">Plan Financial Management, Estimate Costs, Develop Budget, Monitor and Control Finances. Work package estimates are aggregated to control accounts, contingency is added inside or outside the cost baseline, management reserve sits above the baseline, and funding requirements follow. Seven funding strategies are listed.</desc><defs><marker id="ah0" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker></defs><rect x="0.75" y="0.75" width="978.5" height="518.5" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><text x="20.0" y="28.0" font-size="18" font-weight="bold" fill="#1f2937" text-anchor="start">Finance domain: four processes and how the money builds up</text><text x="20.0" y="48.0" font-size="12" font-weight="normal" fill="#6b7280" text-anchor="start">PMBOK 8 Figure 2-26: plan, estimate, budget, then monitor and control</text><rect x="20.0" y="64.0" width="222.0" height="40.0" rx="8" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.6"/><text x="131.0" y="88.2" font-size="12.8" font-weight="bold" fill="#134e4a" text-anchor="middle">Plan Financial Management</text><rect x="20.0" y="110.0" width="222.0" height="168.0" rx="8" fill="#ffffff" stroke="#0d9488" stroke-width="1.5"/><text x="30.0" y="128.0" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="start">How revenues and expenses are</text><text x="30.0" y="141.4" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="start">estimated, budgeted, managed,</text><text x="30.0" y="154.8" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="start">monitored and controlled</text><text x="30.0" y="176.3" font-size="10.3" font-weight="bold" fill="#6b7280" text-anchor="start">Key outputs</text><text x="30.0" y="189.3" font-size="11" font-weight="bold" fill="#134e4a" text-anchor="start">Financial management plan, funding</text><text x="30.0" y="202.7" font-size="11" font-weight="bold" fill="#134e4a" text-anchor="start">strategy</text><text x="30.0" y="224.1" font-size="10.3" font-weight="bold" fill="#6b7280" text-anchor="start">Decision tools</text><text x="30.0" y="237.1" font-size="10.5" font-weight="normal" fill="#1f2937" text-anchor="start">Expert judgment, alternative analysis,</text><text x="30.0" y="249.7" font-size="10.5" font-weight="normal" fill="#1f2937" text-anchor="start">meetings</text><line x1="243.0" y1="84.0" x2="258.0" y2="84.0" stroke="#1f2937" stroke-width="2" marker-end="url(#ah0)"/><rect x="259.0" y="64.0" width="222.0" height="40.0" rx="8" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.6"/><text x="370.0" y="88.2" font-size="12.8" font-weight="bold" fill="#134e4a" text-anchor="middle">Estimate Costs</text><rect x="259.0" y="110.0" width="222.0" height="168.0" rx="8" fill="#ffffff" stroke="#0d9488" stroke-width="1.5"/><text x="269.0" y="128.0" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="start">Approximate the cost of resources</text><text x="269.0" y="141.4" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="start">needed for the work; repeated as the</text><text x="269.0" y="154.8" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="start">project progresses</text><text x="269.0" y="176.3" font-size="10.3" font-weight="bold" fill="#6b7280" text-anchor="start">Key outputs</text><text x="269.0" y="189.3" font-size="11" font-weight="bold" fill="#134e4a" text-anchor="start">Cost estimates, basis of estimates</text><text x="269.0" y="210.7" font-size="10.3" font-weight="bold" fill="#6b7280" text-anchor="start">Decision tools</text><text x="269.0" y="223.7" font-size="10.5" font-weight="normal" fill="#1f2937" text-anchor="start">Analogous, parametric, bottom-up,</text><text x="269.0" y="236.3" font-size="10.5" font-weight="normal" fill="#1f2937" text-anchor="start">multipoint, reserve analysis, cost of quality</text><line x1="482.0" y1="84.0" x2="497.0" y2="84.0" stroke="#1f2937" stroke-width="2" marker-end="url(#ah0)"/><rect x="498.0" y="64.0" width="222.0" height="40.0" rx="8" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.6"/><text x="609.0" y="88.2" font-size="12.8" font-weight="bold" fill="#134e4a" text-anchor="middle">Develop Budget</text><rect x="498.0" y="110.0" width="222.0" height="168.0" rx="8" fill="#ffffff" stroke="#0d9488" stroke-width="1.5"/><text x="508.0" y="128.0" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="start">Aggregate estimates into an authorized</text><text x="508.0" y="141.4" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="start">cost baseline and funding requirements</text><text x="508.0" y="162.8" font-size="10.3" font-weight="bold" fill="#6b7280" text-anchor="start">Key outputs</text><text x="508.0" y="175.8" font-size="11" font-weight="bold" fill="#134e4a" text-anchor="start">Cost baseline, project funding</text><text x="508.0" y="189.3" font-size="11" font-weight="bold" fill="#134e4a" text-anchor="start">requirements</text><text x="508.0" y="210.7" font-size="10.3" font-weight="bold" fill="#6b7280" text-anchor="start">Decision tools</text><text x="508.0" y="223.7" font-size="10.5" font-weight="normal" fill="#1f2937" text-anchor="start">Cost aggregation, reserve analysis,</text><text x="508.0" y="236.3" font-size="10.5" font-weight="normal" fill="#1f2937" text-anchor="start">historical information review, funding limit</text><text x="508.0" y="248.9" font-size="10.5" font-weight="normal" fill="#1f2937" text-anchor="start">reconciliation, financing</text><line x1="721.0" y1="84.0" x2="736.0" y2="84.0" stroke="#1f2937" stroke-width="2" marker-end="url(#ah0)"/><rect x="737.0" y="64.0" width="222.0" height="40.0" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="848.0" y="88.2" font-size="12.8" font-weight="bold" fill="#78350f" text-anchor="middle">Monitor and Control Finances</text><rect x="737.0" y="110.0" width="222.0" height="168.0" rx="8" fill="#ffffff" stroke="#d97706" stroke-width="1.5"/><text x="747.0" y="128.0" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="start">Track spending, update forecasts,</text><text x="747.0" y="141.4" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="start">manage baseline changes, keep the</text><text x="747.0" y="154.8" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="start">project financially viable</text><text x="747.0" y="176.3" font-size="10.3" font-weight="bold" fill="#6b7280" text-anchor="start">Key outputs</text><text x="747.0" y="189.3" font-size="11" font-weight="bold" fill="#78350f" text-anchor="start">Cost and revenue forecasts, change</text><text x="747.0" y="202.7" font-size="11" font-weight="bold" fill="#78350f" text-anchor="start">requests, funding proposals</text><text x="747.0" y="224.1" font-size="10.3" font-weight="bold" fill="#6b7280" text-anchor="start">Decision tools</text><text x="747.0" y="237.1" font-size="10.5" font-weight="normal" fill="#1f2937" text-anchor="start">Earned value, trend analysis, reserve</text><text x="747.0" y="249.7" font-size="10.5" font-weight="normal" fill="#1f2937" text-anchor="start">analysis, TCPI, PMIS</text><text x="20.0" y="304.0" font-size="12.8" font-weight="bold" fill="#1f2937" text-anchor="start">How the money builds up (PMBOK 8 Figure 2-25 shows two variants for the contingency reserve)</text><rect x="20.0" y="318.0" width="146.0" height="74.0" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="93.0" y="351.8" font-size="10.6" font-weight="bold" fill="#1e3a8a" text-anchor="middle">Work package cost</text><text x="93.0" y="365.1" font-size="10.6" font-weight="bold" fill="#1e3a8a" text-anchor="middle">estimates</text><line x1="167.0" y1="355.0" x2="177.4" y2="355.0" stroke="#1f2937" stroke-width="1.8" marker-end="url(#ah0)"/><rect x="178.4" y="318.0" width="146.0" height="74.0" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="251.4" y="351.8" font-size="10.6" font-weight="bold" fill="#1e3a8a" text-anchor="middle">Cost aggregation: control</text><text x="251.4" y="365.1" font-size="10.6" font-weight="bold" fill="#1e3a8a" text-anchor="middle">accounts, project total</text><line x1="325.4" y1="355.0" x2="335.8" y2="355.0" stroke="#1f2937" stroke-width="1.8" marker-end="url(#ah0)"/><rect x="336.8" y="318.0" width="146.0" height="74.0" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="409.8" y="345.2" font-size="10.6" font-weight="bold" fill="#78350f" text-anchor="middle">+ Contingency reserve</text><text x="409.8" y="358.4" font-size="10.6" font-weight="bold" fill="#78350f" text-anchor="middle">(known risks): inside or</text><text x="409.8" y="371.7" font-size="10.6" font-weight="bold" fill="#78350f" text-anchor="middle">outside the baseline</text><line x1="483.8" y1="355.0" x2="494.2" y2="355.0" stroke="#1f2937" stroke-width="1.8" marker-end="url(#ah0)"/><rect x="495.2" y="318.0" width="146.0" height="74.0" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="568.2" y="345.2" font-size="10.6" font-weight="bold" fill="#14532d" text-anchor="middle">= Cost baseline</text><text x="568.2" y="358.4" font-size="10.6" font-weight="bold" fill="#14532d" text-anchor="middle">(time-phased, excludes</text><text x="568.2" y="371.7" font-size="10.6" font-weight="bold" fill="#14532d" text-anchor="middle">management reserve)</text><line x1="642.2" y1="355.0" x2="652.6" y2="355.0" stroke="#1f2937" stroke-width="1.8" marker-end="url(#ah0)"/><rect x="653.6" y="318.0" width="146.0" height="74.0" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.6"/><text x="726.6" y="345.2" font-size="10.6" font-weight="bold" fill="#4c1d95" text-anchor="middle">+ Management reserve</text><text x="726.6" y="358.4" font-size="10.6" font-weight="bold" fill="#4c1d95" text-anchor="middle">(unknown-unknowns, in</text><text x="726.6" y="371.7" font-size="10.6" font-weight="bold" fill="#4c1d95" text-anchor="middle">addition to the baseline)</text><line x1="800.6" y1="355.0" x2="811.0" y2="355.0" stroke="#1f2937" stroke-width="1.8" marker-end="url(#ah0)"/><rect x="812.0" y="318.0" width="146.0" height="74.0" rx="8" fill="#1e3a8a" stroke="#1e3a8a" stroke-width="1.6"/><text x="885.0" y="351.8" font-size="10.6" font-weight="bold" fill="#ffffff" text-anchor="middle">= Funding requirements</text><text x="885.0" y="365.1" font-size="10.6" font-weight="bold" fill="#ffffff" text-anchor="middle">(total and periodic)</text><rect x="20.0" y="406.0" width="940.0" height="102.0" rx="8" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.2"/><text x="32.0" y="426.0" font-size="12" font-weight="bold" fill="#1f2937" text-anchor="start">Funding strategies (PMBOK 8)</text><rect x="32.0" y="439.0" width="202.3" height="21.0" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/><text x="133.1" y="454.0" font-size="10.5" font-weight="bold" fill="#1e3a8a" text-anchor="middle">Fixed or reallocated internal budgets</text><rect x="242.3" y="439.0" width="71.1" height="21.0" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/><text x="277.8" y="454.0" font-size="10.5" font-weight="bold" fill="#1e3a8a" text-anchor="middle">Lump sum</text><rect x="321.4" y="439.0" width="270.1" height="21.0" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/><text x="456.5" y="454.0" font-size="10.5" font-weight="bold" fill="#1e3a8a" text-anchor="middle">Incremental disbursement (by phase or milestone)</text><rect x="599.5" y="439.0" width="118.1" height="21.0" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/><text x="658.5" y="454.0" font-size="10.5" font-weight="bold" fill="#1e3a8a" text-anchor="middle">External investment</text><rect x="725.6" y="439.0" width="155.3" height="21.0" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/><text x="803.2" y="454.0" font-size="10.5" font-weight="bold" fill="#1e3a8a" text-anchor="middle">Government or NGO grants</text><rect x="32.0" y="465.0" width="89.1" height="21.0" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/><text x="76.5" y="480.0" font-size="10.5" font-weight="bold" fill="#1e3a8a" text-anchor="middle">Crowdfunding</text><rect x="129.1" y="465.0" width="91.6" height="21.0" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/><text x="174.9" y="480.0" font-size="10.5" font-weight="bold" fill="#1e3a8a" text-anchor="middle">Client contract</text></svg>