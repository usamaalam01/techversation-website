<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 508" width="980" height="508" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">Schedule representations and when to use them</title><desc id="d">Bar (Gantt) chart, milestone schedule, network diagram and an agile roadmap with releases and iterations, plus a velocity forecast example.</desc><defs><marker id="ah0" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker><marker id="ah1" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker></defs><rect x="0.75" y="0.75" width="978.5" height="506.5" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><text x="20.0" y="28.0" font-size="18" font-weight="bold" fill="#1f2937" text-anchor="start">Schedule representations</text><text x="20.0" y="48.0" font-size="12" font-weight="normal" fill="#6b7280" text-anchor="start">Same schedule, different views: choose the one that answers the audience's question</text><rect x="20.0" y="64.0" width="460.0" height="204.0" rx="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.3"/><text x="32.0" y="84.0" font-size="12.8" font-weight="bold" fill="#1e3a8a" text-anchor="start">Bar chart (Gantt)</text><text x="32.0" y="100.0" font-size="10.6" font-weight="normal" fill="#6b7280" text-anchor="start">Activities against a calendar with dates, durations and progress. Good for detailed predictive</text><text x="32.0" y="112.7" font-size="10.6" font-weight="normal" fill="#6b7280" text-anchor="start">schedules and team coordination.</text><text x="34.0" y="151.0" font-size="10.5" font-weight="normal" fill="#1f2937" text-anchor="start">Design</text><rect x="100.0" y="138.0" width="108.0" height="18.0" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><text x="154.0" y="151.0" font-size="11" font-weight="bold" fill="#1e3a8a" text-anchor="middle"></text><line x1="206.5" y1="156.0" x2="206.5" y2="166.0" stroke="#6b7280" stroke-width="1.2" marker-end="url(#ah0)"/><text x="34.0" y="179.0" font-size="10.5" font-weight="normal" fill="#1f2937" text-anchor="start">Build</text><rect x="208.0" y="166.0" width="135.0" height="18.0" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/><text x="275.5" y="179.0" font-size="11" font-weight="bold" fill="#14532d" text-anchor="middle"></text><line x1="341.5" y1="184.0" x2="341.5" y2="194.0" stroke="#6b7280" stroke-width="1.2" marker-end="url(#ah0)"/><text x="34.0" y="207.0" font-size="10.5" font-weight="normal" fill="#1f2937" text-anchor="start">Test</text><rect x="343.0" y="194.0" width="81.0" height="18.0" rx="4" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/><text x="383.5" y="207.0" font-size="11" font-weight="bold" fill="#78350f" text-anchor="middle"></text><line x1="422.5" y1="212.0" x2="422.5" y2="222.0" stroke="#6b7280" stroke-width="1.2" marker-end="url(#ah0)"/><text x="34.0" y="235.0" font-size="10.5" font-weight="normal" fill="#1f2937" text-anchor="start">Deploy</text><rect x="424.0" y="222.0" width="27.0" height="18.0" rx="4" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/><text x="437.5" y="235.0" font-size="11" font-weight="bold" fill="#4c1d95" text-anchor="middle"></text><rect x="500.0" y="64.0" width="460.0" height="204.0" rx="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.3"/><text x="512.0" y="84.0" font-size="12.8" font-weight="bold" fill="#1e3a8a" text-anchor="start">Milestone schedule</text><text x="512.0" y="100.0" font-size="10.6" font-weight="normal" fill="#6b7280" text-anchor="start">Significant events with planned dates, no activity detail. Good for executives, sponsors and</text><text x="512.0" y="112.7" font-size="10.6" font-weight="normal" fill="#6b7280" text-anchor="start">contract milestones.</text><line x1="524.0" y1="192.0" x2="936.0" y2="192.0" stroke="#6b7280" stroke-width="2.5"/><polygon points="540.0,178.0 552.0,192.0 540.0,206.0 528.0,192.0" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="540.0" y="228.0" font-size="10.5" font-weight="bold" fill="#78350f" text-anchor="middle">Charter</text><polygon points="638.0,178.0 650.0,192.0 638.0,206.0 626.0,192.0" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="638.0" y="242.0" font-size="10.5" font-weight="bold" fill="#78350f" text-anchor="middle">Design approved</text><polygon points="757.0,178.0 769.0,192.0 757.0,206.0 745.0,192.0" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="757.0" y="228.0" font-size="10.5" font-weight="bold" fill="#78350f" text-anchor="middle">Go-live</text><polygon points="872.5,178.0 884.5,192.0 872.5,206.0 860.5,192.0" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="872.5" y="242.0" font-size="10.5" font-weight="bold" fill="#78350f" text-anchor="middle">Handover</text><rect x="20.0" y="284.0" width="460.0" height="204.0" rx="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.3"/><text x="32.0" y="304.0" font-size="12.8" font-weight="bold" fill="#1e3a8a" text-anchor="start">Network diagram</text><text x="32.0" y="320.0" font-size="10.6" font-weight="normal" fill="#6b7280" text-anchor="start">Activities as nodes linked by logical relationships. Good for finding the critical path, float and</text><text x="32.0" y="332.7" font-size="10.6" font-weight="normal" fill="#6b7280" text-anchor="start">dependencies.</text><line x1="112.0" y1="406.0" x2="188.0" y2="376.0" stroke="#6b7280" stroke-width="1.4" marker-end="url(#ah0)"/><line x1="112.0" y1="406.0" x2="188.0" y2="438.0" stroke="#dc2626" stroke-width="1.8" marker-end="url(#ah1)"/><line x1="242.0" y1="376.0" x2="338.0" y2="406.0" stroke="#6b7280" stroke-width="1.4" marker-end="url(#ah0)"/><line x1="242.0" y1="438.0" x2="338.0" y2="406.0" stroke="#dc2626" stroke-width="1.8" marker-end="url(#ah1)"/><rect x="60.0" y="392.0" width="52.0" height="28.0" rx="5" fill="#fff1f2" stroke="#dc2626" stroke-width="1.6"/><text x="86.0" y="411.0" font-size="12" font-weight="bold" fill="#1f2937" text-anchor="middle">A</text><rect x="190.0" y="362.0" width="52.0" height="28.0" rx="5" fill="#ffffff" stroke="#6b7280" stroke-width="1.6"/><text x="216.0" y="381.0" font-size="12" font-weight="bold" fill="#1f2937" text-anchor="middle">B</text><rect x="190.0" y="424.0" width="52.0" height="28.0" rx="5" fill="#fff1f2" stroke="#dc2626" stroke-width="1.6"/><text x="216.0" y="443.0" font-size="12" font-weight="bold" fill="#1f2937" text-anchor="middle">C</text><rect x="340.0" y="392.0" width="52.0" height="28.0" rx="5" fill="#fff1f2" stroke="#dc2626" stroke-width="1.6"/><text x="366.0" y="411.0" font-size="12" font-weight="bold" fill="#1f2937" text-anchor="middle">D</text><text x="34.0" y="474.0" font-size="10.3" font-weight="normal" fill="#991b1b" text-anchor="start">Red path = critical path</text><rect x="500.0" y="284.0" width="460.0" height="204.0" rx="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.3"/><text x="512.0" y="304.0" font-size="12.8" font-weight="bold" fill="#1e3a8a" text-anchor="start">Agile roadmap and release plan</text><text x="512.0" y="320.0" font-size="10.6" font-weight="normal" fill="#6b7280" text-anchor="start">Product vision → roadmap → release plan → iterations. Good for adaptive work and hybrid</text><text x="512.0" y="332.7" font-size="10.6" font-weight="normal" fill="#6b7280" text-anchor="start">schedules beneath milestones.</text><rect x="514.0" y="358.0" width="146.0" height="26.0" rx="5" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="587.0" y="374.4" font-size="10.5" font-weight="bold" fill="#14532d" text-anchor="middle">Release 1</text><rect x="518.0" y="390.0" width="42.0" height="24.0" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="539.0" y="405.1" font-size="9.5" font-weight="normal" fill="#14532d" text-anchor="middle">It 1</text><rect x="564.0" y="390.0" width="42.0" height="24.0" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="585.0" y="405.1" font-size="9.5" font-weight="normal" fill="#14532d" text-anchor="middle">It 2</text><rect x="610.0" y="390.0" width="42.0" height="24.0" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="631.0" y="405.1" font-size="9.5" font-weight="normal" fill="#14532d" text-anchor="middle">It 3</text><rect x="670.0" y="358.0" width="146.0" height="26.0" rx="5" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.6"/><text x="743.0" y="374.4" font-size="10.5" font-weight="bold" fill="#134e4a" text-anchor="middle">Release 2</text><rect x="674.0" y="390.0" width="42.0" height="24.0" rx="4" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.6"/><text x="695.0" y="405.1" font-size="9.5" font-weight="normal" fill="#134e4a" text-anchor="middle">It 1</text><rect x="720.0" y="390.0" width="42.0" height="24.0" rx="4" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.6"/><text x="741.0" y="405.1" font-size="9.5" font-weight="normal" fill="#134e4a" text-anchor="middle">It 2</text><rect x="766.0" y="390.0" width="42.0" height="24.0" rx="4" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.6"/><text x="787.0" y="405.1" font-size="9.5" font-weight="normal" fill="#134e4a" text-anchor="middle">It 3</text><rect x="826.0" y="358.0" width="100.0" height="26.0" rx="5" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.6"/><text x="876.0" y="374.4" font-size="10.5" font-weight="bold" fill="#4c1d95" text-anchor="middle">Release 3</text><rect x="830.0" y="390.0" width="42.0" height="24.0" rx="4" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.6"/><text x="851.0" y="405.1" font-size="9.5" font-weight="normal" fill="#4c1d95" text-anchor="middle">It 1</text><rect x="876.0" y="390.0" width="42.0" height="24.0" rx="4" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.6"/><text x="897.0" y="405.1" font-size="9.5" font-weight="normal" fill="#4c1d95" text-anchor="middle">It 2</text><text x="514.0" y="438.0" font-size="10.8" font-weight="bold" fill="#1f2937" text-anchor="start">Velocity forecast: remaining backlog ÷ velocity per iteration</text><text x="514.0" y="454.0" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">120 points ÷ 24 points = 5 more iterations (10 weeks at 2 weeks each)</text><text x="514.0" y="470.0" font-size="10.3" font-weight="normal" fill="#6b7280" text-anchor="start">Use a velocity range for a range of dates; hybrid: milestones with iterations beneath</text></svg>