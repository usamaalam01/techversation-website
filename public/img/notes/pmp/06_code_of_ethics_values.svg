<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 500" width="980" height="500" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">PMI Code of Ethics and Professional Conduct: four values</title><desc id="d">Responsibility, respect, fairness and honesty. Each has aspirational standards (strive to meet) and mandatory standards (firm requirements; violations lead to disciplinary procedures).</desc><defs></defs><rect x="0.75" y="0.75" width="978.5" height="498.5" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><text x="20.0" y="28.0" font-size="18" font-weight="bold" fill="#1f2937" text-anchor="start">PMI Code of Ethics and Professional Conduct</text><text x="20.0" y="48.0" font-size="12" font-weight="normal" fill="#6b7280" text-anchor="start">Four values. Aspirational standards: we strive (not optional). Mandatory standards: firm requirements, disciplinary action if breached</text><rect x="20.0" y="66.0" width="226.0" height="34.0" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="133.0" y="87.5" font-size="14" font-weight="bold" fill="#1e3a8a" text-anchor="middle">RESPONSIBILITY</text><rect x="20.0" y="104.0" width="226.0" height="62.0" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="1.4"/><text x="30.0" y="122.0" font-size="11.2" font-weight="italic" fill="#1e3a8a" text-anchor="start" font-style="italic">Duty to take ownership of decisions,</text><text x="30.0" y="135.7" font-size="11.2" font-weight="italic" fill="#1e3a8a" text-anchor="start" font-style="italic">actions and consequences</text><rect x="20.0" y="172.0" width="226.0" height="150.0" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/><text x="30.0" y="190.0" font-size="11" font-weight="bold" fill="#1e3a8a" text-anchor="start">ASPIRATIONAL (strive)</text><text x="30.0" y="205.0" font-size="11" font-weight="bold" fill="#1e3a8a" text-anchor="start">•</text><text x="42.0" y="205.0" font-size="10.6" font-weight="normal" fill="#1f2937" text-anchor="start">Act in the best interests of society, public</text><text x="42.0" y="217.7" font-size="10.6" font-weight="normal" fill="#1f2937" text-anchor="start">safety, the environment</text><text x="30.0" y="233.4" font-size="11" font-weight="bold" fill="#1e3a8a" text-anchor="start">•</text><text x="42.0" y="233.4" font-size="10.6" font-weight="normal" fill="#1f2937" text-anchor="start">Accept only assignments that fit your</text><text x="42.0" y="246.2" font-size="10.6" font-weight="normal" fill="#1f2937" text-anchor="start">background and skills</text><text x="30.0" y="261.9" font-size="11" font-weight="bold" fill="#1e3a8a" text-anchor="start">•</text><text x="42.0" y="261.9" font-size="10.6" font-weight="normal" fill="#1f2937" text-anchor="start">Do what you say; own and promptly</text><text x="42.0" y="274.6" font-size="10.6" font-weight="normal" fill="#1f2937" text-anchor="start">correct errors</text><text x="30.0" y="290.3" font-size="11" font-weight="bold" fill="#1e3a8a" text-anchor="start">•</text><text x="42.0" y="290.3" font-size="10.6" font-weight="normal" fill="#1f2937" text-anchor="start">Protect confidential and proprietary</text><text x="42.0" y="303.0" font-size="10.6" font-weight="normal" fill="#1f2937" text-anchor="start">information</text><rect x="20.0" y="328.0" width="226.0" height="156.0" rx="6" fill="#fff7ed" stroke="#ea580c" stroke-width="1.4"/><text x="30.0" y="346.0" font-size="11" font-weight="bold" fill="#9a3412" text-anchor="start">MANDATORY (must)</text><text x="30.0" y="361.0" font-size="11" font-weight="bold" fill="#9a3412" text-anchor="start">•</text><text x="42.0" y="361.0" font-size="10.6" font-weight="normal" fill="#1f2937" text-anchor="start">Know and uphold the laws, rules and</text><text x="42.0" y="373.7" font-size="10.6" font-weight="normal" fill="#1f2937" text-anchor="start">policies</text><text x="30.0" y="389.4" font-size="11" font-weight="bold" fill="#9a3412" text-anchor="start">•</text><text x="42.0" y="389.4" font-size="10.6" font-weight="normal" fill="#1f2937" text-anchor="start">Report unethical or illegal conduct to</text><text x="42.0" y="402.2" font-size="10.6" font-weight="normal" fill="#1f2937" text-anchor="start">management and, if needed, those</text><text x="42.0" y="414.9" font-size="10.6" font-weight="normal" fill="#1f2937" text-anchor="start">affected</text><text x="30.0" y="430.6" font-size="11" font-weight="bold" fill="#9a3412" text-anchor="start">•</text><text x="42.0" y="430.6" font-size="10.6" font-weight="normal" fill="#1f2937" text-anchor="start">Bring Code violations to the appropriate</text><text x="42.0" y="443.3" font-size="10.6" font-weight="normal" fill="#1f2937" text-anchor="start">body; file complaints only when backed</text><text x="42.0" y="456.0" font-size="10.6" font-weight="normal" fill="#1f2937" text-anchor="start">by facts</text><rect x="258.0" y="66.0" width="226.0" height="34.0" rx="8" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.6"/><text x="371.0" y="87.5" font-size="14" font-weight="bold" fill="#134e4a" text-anchor="middle">RESPECT</text><rect x="258.0" y="104.0" width="226.0" height="62.0" rx="6" fill="#ffffff" stroke="#0d9488" stroke-width="1.4"/><text x="268.0" y="122.0" font-size="11.2" font-weight="italic" fill="#134e4a" text-anchor="start" font-style="italic">Duty to show high regard for yourself,</text><text x="268.0" y="135.7" font-size="11.2" font-weight="italic" fill="#134e4a" text-anchor="start" font-style="italic">others and resources entrusted to you</text><rect x="258.0" y="172.0" width="226.0" height="150.0" rx="6" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.4"/><text x="268.0" y="190.0" font-size="11" font-weight="bold" fill="#134e4a" text-anchor="start">ASPIRATIONAL (strive)</text><text x="268.0" y="205.0" font-size="11" font-weight="bold" fill="#134e4a" text-anchor="start">•</text><text x="280.0" y="205.0" font-size="10.6" font-weight="normal" fill="#1f2937" text-anchor="start">Learn others' norms and customs; avoid</text><text x="280.0" y="217.7" font-size="10.6" font-weight="normal" fill="#1f2937" text-anchor="start">disrespect</text><text x="268.0" y="233.4" font-size="11" font-weight="bold" fill="#134e4a" text-anchor="start">•</text><text x="280.0" y="233.4" font-size="10.6" font-weight="normal" fill="#1f2937" text-anchor="start">Listen to understand</text><text x="268.0" y="249.2" font-size="11" font-weight="bold" fill="#134e4a" text-anchor="start">•</text><text x="280.0" y="249.2" font-size="10.6" font-weight="normal" fill="#1f2937" text-anchor="start">Approach people directly when you</text><text x="280.0" y="261.9" font-size="10.6" font-weight="normal" fill="#1f2937" text-anchor="start">disagree</text><text x="268.0" y="277.6" font-size="11" font-weight="bold" fill="#134e4a" text-anchor="start">•</text><text x="280.0" y="277.6" font-size="10.6" font-weight="normal" fill="#1f2937" text-anchor="start">Stay professional even when it is not</text><text x="280.0" y="290.3" font-size="10.6" font-weight="normal" fill="#1f2937" text-anchor="start">returned</text><rect x="258.0" y="328.0" width="226.0" height="156.0" rx="6" fill="#fff7ed" stroke="#ea580c" stroke-width="1.4"/><text x="268.0" y="346.0" font-size="11" font-weight="bold" fill="#9a3412" text-anchor="start">MANDATORY (must)</text><text x="268.0" y="361.0" font-size="11" font-weight="bold" fill="#9a3412" text-anchor="start">•</text><text x="280.0" y="361.0" font-size="10.6" font-weight="normal" fill="#1f2937" text-anchor="start">Negotiate in good faith</text><text x="268.0" y="376.7" font-size="11" font-weight="bold" fill="#9a3412" text-anchor="start">•</text><text x="280.0" y="376.7" font-size="10.6" font-weight="normal" fill="#1f2937" text-anchor="start">Never use expertise or position for</text><text x="280.0" y="389.4" font-size="10.6" font-weight="normal" fill="#1f2937" text-anchor="start">personal benefit at others' expense</text><text x="268.0" y="405.2" font-size="11" font-weight="bold" fill="#9a3412" text-anchor="start">•</text><text x="280.0" y="405.2" font-size="10.6" font-weight="normal" fill="#1f2937" text-anchor="start">No abusive behavior</text><text x="268.0" y="420.9" font-size="11" font-weight="bold" fill="#9a3412" text-anchor="start">•</text><text x="280.0" y="420.9" font-size="10.6" font-weight="normal" fill="#1f2937" text-anchor="start">Respect property rights (including</text><text x="280.0" y="433.6" font-size="10.6" font-weight="normal" fill="#1f2937" text-anchor="start">intellectual property)</text><rect x="496.0" y="66.0" width="226.0" height="34.0" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="609.0" y="87.5" font-size="14" font-weight="bold" fill="#78350f" text-anchor="middle">FAIRNESS</text><rect x="496.0" y="104.0" width="226.0" height="62.0" rx="6" fill="#ffffff" stroke="#d97706" stroke-width="1.4"/><text x="506.0" y="122.0" font-size="11.2" font-weight="italic" fill="#78350f" text-anchor="start" font-style="italic">Duty to decide and act impartially and</text><text x="506.0" y="135.7" font-size="11.2" font-weight="italic" fill="#78350f" text-anchor="start" font-style="italic">objectively, free from self-interest,</text><text x="506.0" y="149.3" font-size="11.2" font-weight="italic" fill="#78350f" text-anchor="start" font-style="italic">prejudice and favoritism</text><rect x="496.0" y="172.0" width="226.0" height="150.0" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.4"/><text x="506.0" y="190.0" font-size="11" font-weight="bold" fill="#78350f" text-anchor="start">ASPIRATIONAL (strive)</text><text x="506.0" y="205.0" font-size="11" font-weight="bold" fill="#78350f" text-anchor="start">•</text><text x="518.0" y="205.0" font-size="10.6" font-weight="normal" fill="#1f2937" text-anchor="start">Be transparent in decision-making</text><text x="506.0" y="220.7" font-size="11" font-weight="bold" fill="#78350f" text-anchor="start">•</text><text x="518.0" y="220.7" font-size="10.6" font-weight="normal" fill="#1f2937" text-anchor="start">Re-examine your impartiality; correct</text><text x="518.0" y="233.4" font-size="10.6" font-weight="normal" fill="#1f2937" text-anchor="start">course</text><text x="506.0" y="249.2" font-size="11" font-weight="bold" fill="#78350f" text-anchor="start">•</text><text x="518.0" y="249.2" font-size="10.6" font-weight="normal" fill="#1f2937" text-anchor="start">Give equal access to information to those</text><text x="518.0" y="261.9" font-size="10.6" font-weight="normal" fill="#1f2937" text-anchor="start">authorized</text><text x="506.0" y="277.6" font-size="11" font-weight="bold" fill="#78350f" text-anchor="start">•</text><text x="518.0" y="277.6" font-size="10.6" font-weight="normal" fill="#1f2937" text-anchor="start">Make opportunities equally available to</text><text x="518.0" y="290.3" font-size="10.6" font-weight="normal" fill="#1f2937" text-anchor="start">qualified candidates</text><rect x="496.0" y="328.0" width="226.0" height="156.0" rx="6" fill="#fff7ed" stroke="#ea580c" stroke-width="1.4"/><text x="506.0" y="346.0" font-size="11" font-weight="bold" fill="#9a3412" text-anchor="start">MANDATORY (must)</text><text x="506.0" y="361.0" font-size="11" font-weight="bold" fill="#9a3412" text-anchor="start">•</text><text x="518.0" y="361.0" font-size="10.6" font-weight="normal" fill="#1f2937" text-anchor="start">Disclose real or potential conflicts of</text><text x="518.0" y="373.7" font-size="10.6" font-weight="normal" fill="#1f2937" text-anchor="start">interest to stakeholders</text><text x="506.0" y="389.4" font-size="11" font-weight="bold" fill="#9a3412" text-anchor="start">•</text><text x="518.0" y="389.4" font-size="10.6" font-weight="normal" fill="#1f2937" text-anchor="start">Stay out of the decision until disclosure,</text><text x="518.0" y="402.2" font-size="10.6" font-weight="normal" fill="#1f2937" text-anchor="start">an approved mitigation plan and</text><text x="518.0" y="414.9" font-size="10.6" font-weight="normal" fill="#1f2937" text-anchor="start">stakeholder consent</text><text x="506.0" y="430.6" font-size="11" font-weight="bold" fill="#9a3412" text-anchor="start">•</text><text x="518.0" y="430.6" font-size="10.6" font-weight="normal" fill="#1f2937" text-anchor="start">No favoritism, nepotism, bribery or</text><text x="518.0" y="443.3" font-size="10.6" font-weight="normal" fill="#1f2937" text-anchor="start">discrimination</text><text x="506.0" y="459.0" font-size="11" font-weight="bold" fill="#9a3412" text-anchor="start">•</text><text x="518.0" y="459.0" font-size="10.6" font-weight="normal" fill="#1f2937" text-anchor="start">Apply rules without favoritism or</text><text x="518.0" y="471.8" font-size="10.6" font-weight="normal" fill="#1f2937" text-anchor="start">prejudice</text><rect x="734.0" y="66.0" width="226.0" height="34.0" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.6"/><text x="847.0" y="87.5" font-size="14" font-weight="bold" fill="#4c1d95" text-anchor="middle">HONESTY</text><rect x="734.0" y="104.0" width="226.0" height="62.0" rx="6" fill="#ffffff" stroke="#7c3aed" stroke-width="1.4"/><text x="744.0" y="122.0" font-size="11.2" font-weight="italic" fill="#4c1d95" text-anchor="start" font-style="italic">Duty to understand the truth and act</text><text x="744.0" y="135.7" font-size="11.2" font-weight="italic" fill="#4c1d95" text-anchor="start" font-style="italic">truthfully in communication and conduct</text><rect x="734.0" y="172.0" width="226.0" height="150.0" rx="6" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.4"/><text x="744.0" y="190.0" font-size="11" font-weight="bold" fill="#4c1d95" text-anchor="start">ASPIRATIONAL (strive)</text><text x="744.0" y="205.0" font-size="11" font-weight="bold" fill="#4c1d95" text-anchor="start">•</text><text x="756.0" y="205.0" font-size="10.6" font-weight="normal" fill="#1f2937" text-anchor="start">Seek the truth; be truthful</text><text x="744.0" y="220.7" font-size="11" font-weight="bold" fill="#4c1d95" text-anchor="start">•</text><text x="756.0" y="220.7" font-size="10.6" font-weight="normal" fill="#1f2937" text-anchor="start">Provide accurate information in a timely</text><text x="756.0" y="233.4" font-size="10.6" font-weight="normal" fill="#1f2937" text-anchor="start">manner</text><text x="744.0" y="249.2" font-size="11" font-weight="bold" fill="#4c1d95" text-anchor="start">•</text><text x="756.0" y="249.2" font-size="10.6" font-weight="normal" fill="#1f2937" text-anchor="start">Have the courage to share bad news; do</text><text x="756.0" y="261.9" font-size="10.6" font-weight="normal" fill="#1f2937" text-anchor="start">not bury or shift blame</text><text x="744.0" y="277.6" font-size="11" font-weight="bold" fill="#4c1d95" text-anchor="start">•</text><text x="756.0" y="277.6" font-size="10.6" font-weight="normal" fill="#1f2937" text-anchor="start">Make commitments in good faith; make it</text><text x="756.0" y="290.3" font-size="10.6" font-weight="normal" fill="#1f2937" text-anchor="start">safe for others to tell the truth</text><rect x="734.0" y="328.0" width="226.0" height="156.0" rx="6" fill="#fff7ed" stroke="#ea580c" stroke-width="1.4"/><text x="744.0" y="346.0" font-size="11" font-weight="bold" fill="#9a3412" text-anchor="start">MANDATORY (must)</text><text x="744.0" y="361.0" font-size="11" font-weight="bold" fill="#9a3412" text-anchor="start">•</text><text x="756.0" y="361.0" font-size="10.6" font-weight="normal" fill="#1f2937" text-anchor="start">No deceiving: no false or misleading</text><text x="756.0" y="373.7" font-size="10.6" font-weight="normal" fill="#1f2937" text-anchor="start">statements, half-truths, information out of</text><text x="756.0" y="386.4" font-size="10.6" font-weight="normal" fill="#1f2937" text-anchor="start">context, or withholding that misleads</text><text x="744.0" y="402.2" font-size="11" font-weight="bold" fill="#9a3412" text-anchor="start">•</text><text x="756.0" y="402.2" font-size="10.6" font-weight="normal" fill="#1f2937" text-anchor="start">No dishonest behavior for personal gain</text><text x="756.0" y="414.9" font-size="10.6" font-weight="normal" fill="#1f2937" text-anchor="start">or at another's expense</text></svg>