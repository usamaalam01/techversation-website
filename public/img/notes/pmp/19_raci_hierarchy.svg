l="#ede9fe" stroke="#7c3aed" stroke-width="1.6"/><text x="886.0" y="371.1" font-size="9.5" font-weight="normal" fill="#4c1d95" text-anchor="middle">Materials</text><rect x="20.0" y="440.0" width="940.0" height="80.0" rx="8" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.2"/><text x="32.0" y="460.0" font-size="11" font-weight="bold" fill="#6b7280" text-anchor="start">•</text><text x="44.0" y="460.0" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="start">Text-oriented formats (position descriptions, role-responsibility-authority forms) detail responsibilities, authority, competencies and qualifications; reuse them as templates and update</text><text x="44.0" y="473.2" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="start">them with lessons learned.</text><text x="32.0" y="489.4" font-size="11" font-weight="bold" fill="#6b7280" text-anchor="start">•</text><text x="44.0" y="489.4" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="start">A skill matrix maps required skills against available skills to expose gaps early; keep it current. Authority should match responsibility.</text></svg>