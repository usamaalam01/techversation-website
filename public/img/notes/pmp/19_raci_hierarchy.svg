idth="38.0" height="24.0" rx="5" fill="#fef3c7" stroke="#78350f" stroke-width="1.2"/><text x="461.0" y="165.0" font-size="12" font-weight="bold" fill="#78350f" text-anchor="middle">C</text><rect x="520.0" y="148.0" width="38.0" height="24.0" rx="5" fill="#fef3c7" stroke="#78350f" stroke-width="1.2"/><text x="539.0" y="165.0" font-size="12" font-weight="bold" fill="#78350f" text-anchor="middle">C</text><rect x="20.0" y="178.0" width="558.0" height="36.0" rx="0" fill="#ffffff" stroke="#d1d5db" stroke-width="1"/><text x="30.0" y="201.0" font-size="11.5" font-weight="normal" fill="#1f2937" text-anchor="start">Build the feature</text><rect x="208.0" y="184.0" width="38.0" height="24.0" rx="5" fill="#f3f4f6" stroke="#374151" stroke-width="1.2"/><text x="227.0" y="201.0" font-size="12" font-weight="bold" fill="#374151" text-anchor="middle">I</text><rect x="286.0" y="184.0" width="38.0" height="24.0" rx="5" fill="#fee2e2" stroke="#7f1d1d" stroke-width="1.2"/><text x="305.0" y="201.0" font-size="12" font-weight="bold" fill="#7f1d1d" text-anchor="middle">A</text><rect x="364.0" y="184.0" width="38.0" height="24.0" rx="5" fill="#fef3c7" stroke="#78350f" stroke-width="1.2"/><text x="383.0" y="201.0" font-size="12" font-weight="bold" fill="#78350f" text-anchor="middle">C</text><rect x="442.0" y="184.0" width="38.0" height="24.0" rx="5" fill="#dbeafe" stroke="#1e3a8a" stroke-width="1.2"/><text x="461.0" y="201.0" font-size="12" font-weight="bold" fill="#1e3a8a" text-anchor="middle">R</text><rect x="520.0" y="184.0" width="38.0" height="24.0" rx="5" fill="#f3f4f6" stroke="#374151" stroke-width="1.2"/><text x="539.0" y="201.0" font-size="12" font-weight="bold" fill="#374151" text-anchor="middle">I</text><rect x="20.0" y="214.0" width="558.0" height="36.0" rx="0" fill="#f9fafb" stroke="#d1d5db" stroke-width="1"/><text x="30.0" y="237.0" font-size="11.5" font-weight="normal" fill="#1f2937" text-anchor="start">Test the release</text><rect x="208.0" y="220.0" width="38.0" height="24.0" rx="5" fill="#f3f4f6" stroke="#374151" stroke-width="1.2"/><text x="227.0" y="237.0" font-size="12" font-weight="bold" fill="#374151" text-anchor="middle">I</text><rect x="286.0" y="220.0" width="38.0" height="24.0" rx="5" fill="#fee2e2" stroke="#7f1d1d" stroke-width="1.2"/><text x="305.0" y="237.0" font-size="12" font-weight="bold" fill="#7f1d1d" text-anchor="middle">A</text><rect x="364.0" y="220.0" width="38.0" height="24.0" rx="5" fill="#fef3c7" stroke="#78350f" stroke-width="1.2"/><text x="383.0" y="237.0" font-size="12" font-weight="bold" fill="#78350f" text-anchor="middle">C</text><rect x="442.0" y="220.0" width="38.0" height="24.0" rx="5" fill="#fef3c7" stroke="#78350f" stroke-width="1.2"/><text x="461.0" y="237.0" font-size="12" font-weight="bold" fill="#78350f" text-anchor="middle">C</text><rect x="520.0" y="220.0" width="38.0" height="24.0" rx="5" fill="#dbeafe" stroke="#1e3a8a" stroke-width="1.2"/><text x="539.0" y="237.0" font-size="12" font-weight="bold" fill="#1e3a8a" text-anchor="middle">R</text><rect x="20.0" y="258.0" width="22.0" height="20.0" rx="4" fill="#dbeafe" stroke="#1e3a8a" stroke-width="1.2"/><text x="31.0" y="273.0" font-size="11.5" font-weight="bold" fill="#1e3a8a" text-anchor="middle">R</text><text x="50.0" y="273.0" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="start">Responsible: does the work</text><rect x="300.0" y="258.0" width="22.0" height="20.0" rx="4" fill="#fee2e2" stroke="#7f1d1d" stroke-width="1.2"/><text x="311.0" y="273.0" font-size="11.5" font-weight="bold" fill="#7f1d1d" text-anchor="middle">A</text><text x="330.0" y="273.0" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="start">Accountable: one owner, signs off</text><rect x="20.0" y="282.0" width="22.0" height="20.0" rx="4" fill="#fef3c7" stroke="#78350f" stroke-width="1.2"/><text x="31.0" y="297.0" font-size="11.5" font-weight="bold" fill="#78350f" text-anchor="middle">C</text><text x="50.0" y="297.0" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="start">Consulted: gives input</text><rect x="300.0" y="282.0" width="22.0" height="20.0" rx="4" fill="#f3f4f6" stroke="#374151" stroke-width="1.2"/><text x="311.0" y="297.0" font-size="11.5" font-weight="bold" fill="#374151" text-anchor="middle">I</text><text x="330.0" y="297.0" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="start">Informed: kept up to date</text><rect x="20.0" y="340.0" width="560.0" height="86.0" rx="8" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.2"/><text x="32.0" y="360.0" font-size="11" font-weight="bold" fill="#6b7280" text-anchor="start">•</text><text x="44.0" y="360.0" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="start">Exactly one A per row; at least one R. Two accountable owners (or none) is the classic fault.</text><text x="32.0" y="376.2" font-size="11" font-weight="bold" fill="#6b7280" text-anchor="start">•</text><text x="44.0" y="376.2" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="start">RAM shows all the work of one person and all the people on one activity; RACI is one common form (lead /</text><text x="44.0" y="389.4" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="start">resource variants also exist).</text><text x="32.0" y="405.6" font-size="11" font-weight="bold" fill="#6b7280" text-anchor="start">•</text><text x="44.0" y="405.6" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="start">Particularly useful when the team mixes internal and external resources.</text><rect x="610.0" y="64.0" width="350.0" height="362.0" rx="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.3"/><text x="622.0" y="84.0" font-size="12.5" font-weight="bold" fill="#1f2937" text-anchor="start">Hierarchical charts</text><text x="622.0" y="106.0" font-size="11" font-weight="bold" fill="#1e3a8a" text-anchor="start">OBS: who performs the work</text><rect x="740.0" y="114.0" width="90.0" height="22.0" rx="4" fill="#dbeafe" stroke="#2563eb" 