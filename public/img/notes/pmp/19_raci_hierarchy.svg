<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 540" width="980" height="540" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">Defining roles: RACI matrix and breakdown structures</title><desc id="d">A RACI matrix with exactly one accountable person per activity, and small examples of an organizational breakdown structure, a work breakdown structure and a resource breakdown structure.</desc><defs></defs><rect x="0.75" y="0.75" width="978.5" height="538.5" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><text x="20.0" y="28.0" font-size="18" font-weight="bold" fill="#1f2937" text-anchor="start">Defining roles and resources</text><text x="20.0" y="48.0" font-size="12" font-weight="normal" fill="#6b7280" text-anchor="start">Responsibility assignment matrix (RACI) and the hierarchical charts used in resource planning</text><rect x="20.0" y="70.0" width="558.0" height="36.0" rx="4" fill="#1e3a8a" stroke="#1e3a8a" stroke-width="1"/><text x="30.0" y="93.0" font-size="11.5" font-weight="bold" fill="#ffffff" text-anchor="start">Activity</text><text x="227.0" y="85.0" font-size="10.5" font-weight="bold" fill="#ffffff" text-anchor="middle">Sponsor</text><text x="305.0" y="85.0" font-size="10.5" font-weight="bold" fill="#ffffff" text-anchor="middle">Project</text><text x="305.0" y="96.5" font-size="10.5" font-weight="bold" fill="#ffffff" text-anchor="middle">manager</text><text x="383.0" y="85.0" font-size="10.5" font-weight="bold" fill="#ffffff" text-anchor="middle">Analyst</text><text x="461.0" y="85.0" font-size="10.5" font-weight="bold" fill="#ffffff" text-anchor="middle">Developer</text><text x="539.0" y="85.0" font-size="10.5" font-weight="bold" fill="#ffffff" text-anchor="middle">Tester</text><rect x="20.0" y="106.0" width="558.0" height="36.0" rx="0" fill="#ffffff" stroke="#d1d5db" stroke-width="1"/><text x="30.0" y="129.0" font-size="11.5" font-weight="normal" fill="#1f2937" text-anchor="start">Approve chart