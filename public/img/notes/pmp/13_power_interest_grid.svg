<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" width="760" height="470" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">Power/interest grid with engagement strategy</title><desc id="d">Two by two grid: high power and high interest means manage closely; high power and low interest means keep satisfied; low power and high interest means keep informed; low power and low interest means monitor.</desc><defs><marker id="ah0" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker></defs><rect x="0.75" y="0.75" width="758.5" height="468.5" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><text x="20.0" y="28.0" font-size="18" font-weight="bold" fill="#1f2937" text-anchor="start">Power / interest grid</text><text x="20.0" y="48.0" font-size="12" font-weight="normal" fill="#6b7280" text-anchor="start">Classify stakeholders, then match the engagement effort to the quadrant</text><rect x="120.0" y="70.0" width="300.0" height="165.0" rx="0" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="270.0" y="106.0" font-size="16" font-weight="bold" fill="#78350f" text-anchor="middle">KEEP SATISFIED</text><text x="270.0" y="136.0" font-size="12.5" font-weight="normal" fill="#78350f" text-anchor="middle">High power, low interest.</text><text x="270.0" y="152.2" font-size="12.5" font-weight="normal" fill="#78350f" text-anchor="middle">Consult on key decisions; avoid overloading with</text><text x="270.0" y="168.5" font-size="12.5" font-weight="normal" fill="#78350f" text-anchor="middle">detail.</text><rect x="420.0" y="70.0" width="300.0" height="165.0" rx="0" fill="#fee2e2" stroke="#dc2626" stroke-width="1.6"/><text x="570.0" y="106.0" font-size="16" font-weight="bold" fill="#7f1d1d" text-anchor="middle">MANAGE CLOSELY</text><text x="570.0" y="136.0" font-size="12.5" font-weight="normal" fill="#7f1d1d" text-anchor="middle">High power, high interest.</text><text x="570.0" y="152.2" font-size="12.5" font-weight="normal" fill="#7f1d1d" text-anchor="middle">Engage fully, partner on decisions, frequent</text><text x="570.0" y="168.5" font-size="12.5" font-weight="normal" fill="#7f1d1d" text-anchor="middle">two-way contact.</text><rect x="120.0" y="235.0" width="300.0" height="165.0" rx="0" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.6"/><text x="270.0" y="271.0" font-size="16" font-weight="bold" fill="#374151" text-anchor="middle">MONITOR</text><text x="270.0" y="301.0" font-size="12.5" font-weight="normal" fill="#374151" text-anchor="middle">Low power, low interest.</text><text x="270.0" y="317.2" font-size="12.5" font-weight="normal" fill="#374151" text-anchor="middle">Minimum effort; watch for change in their</text><text x="270.0" y="333.5" font-size="12.5" font-weight="normal" fill="#374151" text-anchor="middle">position.</text><rect x="420.0" y="235.0" width="300.0" height="165.0" rx="0" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="570.0" y="271.0" font-size="16" font-weight="bold" fill="#14532d" text-anchor="middle">KEEP INFORMED</text><text x="570.0" y="301.0" font-size="12.5" font-weight="normal" fill="#14532d" text-anchor="middle">Low power, high interest.</text><text x="570.0" y="317.2" font-size="12.5" font-weight="normal" fill="#14532d" text-anchor="middle">Regular updates; listen for useful input and early</text><text x="570.0" y="333.5" font-size="12.5" font-weight="normal" fill="#14532d" text-anchor="middle">warnings.</text><line x1="106.0" y1="400.0" x2="106.0" y2="70.0" stroke="#1f2937" stroke-width="2" marker-end="url(#ah0)"/><text x="96.0" y="235.0" transform="rotate(-90 96.0 235.0)" font-size="13" font-weight="bold" fill="#1f2937" text-anchor="middle">POWER</text><text x="100.0" y="84.0" font-size="11.5" font-weight="normal" fill="#6b7280" text-anchor="end">High</text><text x="100.0" y="396.0" font-size="11.5" font-weight="normal" fill="#6b7280" text-anchor="end">Low</text><line x1="120.0" y1="416.0" x2="720.0" y2="416.0" stroke="#1f2937" stroke-width="2" marker-end="url(#ah0)"/><text x="420.0" y="438.0" font-size="13" font-weight="bold" fill="#1f2937" text-anchor="middle">INTEREST</text><text x="124.0" y="434.0" font-size="11.5" font-weight="normal" fill="#6b7280" text-anchor="start">Low</text><text x="716.0" y="434.0" font-size="11.5" font-weight="normal" fill="#6b7280" text-anchor="end">High</text><text x="380.0" y="456.0" font-size="11.5" font-weight="normal" fill="#6b7280" text-anchor="middle" font-style="italic">Same idea, different axes: power/influence grid, impact/influence grid. Choose the model that fits the stakeholder community.</text></svg>