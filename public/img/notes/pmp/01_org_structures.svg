<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 482" width="980" height="482" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">Organizational structures and project manager authority</title><desc id="d">From functional to project-oriented: project manager authority and resource availability rise from low to high; the matrix variants sit in between.</desc><defs><marker id="ah0" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1e3a8a"/></marker></defs><rect x="0.75" y="0.75" width="978.5" height="480.5" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><text x="20.0" y="28.0" font-size="18" font-weight="bold" fill="#1f2937" text-anchor="start">Organizational structure and the project manager's power</text><text x="20.0" y="48.0" font-size="12" font-weight="normal" fill="#6b7280" text-anchor="start">PMBOK 8 Table 2-1: the more project-oriented the structure, the more authority and resource availability the PM has</text><line x1="20.0" y1="96.0" x2="960.0" y2="96.0" stroke="#1e3a8a" stroke-width="3" marker-end="url(#ah0)"/><text x="20.0" y="86.0" font-size="12" font-weight="bold" fill="#1e3a8a" text-anchor="start">Low PM authority and resource availability</text><text x="960.0" y="86.0" font-size="12" font-weight="bold" fill="#1e3a8a" text-anchor="end">High</text><rect x="20.0" y="118.0" width="176.0" height="44.0" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.6"/><text x="108.0" y="144.6" font-size="14" font-weight="bold" fill="#374151" text-anchor="middle">Functional</text><rect x="20.0" y="170.0" width="176.0" height="236.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.4"/><text x="30.0" y="194.0" font-size="10.5" font-weight="bold" fill="#6b7280" text-anchor="start">Work group arrangement</text><text x="30.0" y="209.0" font-size="12" font-weight="normal" fill="#1f2937" text-anchor="start">Work grouped by job being</text><text x="30.0" y="224.0" font-size="12" font-weight="normal" fill="#1f2937" text-anchor="start">done (engineering,</text><text x="30.0" y="239.0" font-size="12" font-weight="normal" fill="#1f2937" text-anchor="start">manufacturing)</text><text x="30.0" y="264.0" font-size="10.5" font-weight="bold" fill="#6b7280" text-anchor="start">PM authority</text><text x="30.0" y="279.0" font-size="12" font-weight="bold" fill="#1f2937" text-anchor="start">Low</text><text x="30.0" y="304.0" font-size="10.5" font-weight="bold" fill="#6b7280" text-anchor="start">PM role</text><text x="30.0" y="319.0" font-size="12" font-weight="normal" fill="#1f2937" text-anchor="start">Part-time; may not be a</text><text x="30.0" y="334.0" font-size="12" font-weight="normal" fill="#1f2937" text-anchor="start">designated role (e.g.,</text><text x="30.0" y="349.0" font-size="12" font-weight="normal" fill="#1f2937" text-anchor="start">coordinator)</text><text x="30.0" y="374.0" font-size="10.5" font-weight="bold" fill="#6b7280" text-anchor="start">Resource availability</text><text x="30.0" y="389.0" font-size="12" font-weight="normal" fill="#1f2937" text-anchor="start">Low</text><rect x="210.0" y="118.0" width="176.0" height="44.0" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="298.0" y="144.6" font-size="14" font-weight="bold" fill="#78350f" text-anchor="middle">Matrix: weak</text><rect x="210.0" y="170.0" width="176.0" height="236.0" rx="8" fill="#ffffff" stroke="#d97706" stroke-width="1.4"/><text x="220.0" y="194.0" font-size="10.5" font-weight="bold" fill="#6b7280" text-anchor="start">Work group arrangement</text><text x="220.0" y="209.0" font-size="12" font-weight="normal" fill="#1f2937" text-anchor="start">By job function; PM is a</text><text x="220.0" y="224.0" font-size="12" font-weight="normal" fill="#1f2937" text-anchor="start">coordinator</text><text x="220.0" y="249.0" font-size="10.5" font-weight="bold" fill="#6b7280" text-anchor="start">PM authority</text><text x="220.0" y="264.0" font-size="12" font-weight="bold" fill="#1f2937" text-anchor="start">Low</text><text x="220.0" y="289.0" font-size="10.5" font-weight="bold" fill="#6b7280" text-anchor="start">PM role</text><text x="220.0" y="304.0" font-size="12" font-weight="normal" fill="#1f2937" text-anchor="start">Part-time; done as part of</text><text x="220.0" y="319.0" font-size="12" font-weight="normal" fill="#1f2937" text-anchor="start">another job; not a</text><text x="220.0" y="334.0" font-size="12" font-weight="normal" fill="#1f2937" text-anchor="start">designated role</text><text x="220.0" y="359.0" font-size="10.5" font-weight="bold" fill="#6b7280" text-anchor="start">Resource availability</text><text x="220.0" y="374.0" font-size="12" font-weight="normal" fill="#1f2937" text-anchor="start">Low</text><rect x="400.0" y="118.0" width="176.0" height="44.0" rx="8" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.6"/><text x="488.0" y="144.6" font-size="14" font-weight="bold" fill="#134e4a" text-anchor="middle">Matrix: balanced</text><rect x="400.0" y="170.0" width="176.0" height="236.0" rx="8" fill="#ffffff" stroke="#0d9488" stroke-width="1.4"/><text x="410.0" y="194.0" font-size="10.5" font-weight="bold" fill="#6b7280" text-anchor="start">Work group arrangement</text><text x="410.0" y="209.0" font-size="12" font-weight="normal" fill="#1f2937" text-anchor="start">By job function; power</text><text x="410.0" y="224.0" font-size="12" font-weight="normal" fill="#1f2937" text-anchor="start">shared</text><text x="410.0" y="249.0" font-size="10.5" font-weight="bold" fill="#6b7280" text-anchor="start">PM authority</text><text x="410.0" y="264.0" font-size="12" font-weight="bold" fill="#1f2937" text-anchor="start">Low to moderate</text><text x="410.0" y="289.0" font-size="10.5" font-weight="bold" fill="#6b7280" text-anchor="start">PM role</text><text x="410.0" y="304.0" font-size="12" font-weight="normal" fill="#1f2937" text-anchor="start">Part-time; embedded in the</text><text x="410.0" y="319.0" font-size="12" font-weight="normal" fill="#1f2937" text-anchor="start">functions as a skill</text><text x="410.0" y="344.0" font-size="10.5" font-weight="bold" fill="#6b7280" text-anchor="start">Resource availability</text><text x="410.0" y="359.0" font-size="12" font-weight="normal" fill="#1f2937" text-anchor="start">Low to moderate</text><rect x="590.0" y="118.0" width="176.0" height="44.0" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="678.0" y="144.6" font-size="14" font-weight="bold" fill="#1e3a8a" text-anchor="middle">Matrix: strong</text><rect x="590.0" y="170.0" width="176.0" height="236.0" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.4"/><text x="600.0" y="194.0" font-size="10.5" font-weight="bold" fill="#6b7280" text-anchor="start">Work group arrangement</text><text x="600.0" y="209.0" font-size="12" font-weight="normal" fill="#1f2937" text-anchor="start">By job function, with project</text><text x="600.0" y="224.0" font-size="12" font-weight="normal" fill="#1f2937" text-anchor="start">management as a function</text><text x="600.0" y="249.0" font-size="10.5" font-weight="bold" fill="#6b7280" text-anchor="start">PM authority</text><text x="600.0" y="264.0" font-size="12" font-weight="bold" fill="#1f2937" text-anchor="start">Moderate to high</text><text x="600.0" y="289.0" font-size="10.5" font-weight="bold" fill="#6b7280" text-anchor="start">PM role</text><text x="600.0" y="304.0" font-size="12" font-weight="normal" fill="#1f2937" text-anchor="start">Full-time, designated job role</text><text x="600.0" y="329.0" font-size="10.5" font-weight="bold" fill="#6b7280" text-anchor="start">Resource availability</text><text x="600.0" y="344.0" font-size="12" font-weight="normal" fill="#1f2937" text-anchor="start">Moderate to high</text><rect x="780.0" y="118.0" width="176.0" height="44.0" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="868.0" y="144.6" font-size="14" font-weight="bold" fill="#14532d" text-anchor="middle">Project-oriented</text><rect x="780.0" y="170.0" width="176.0" height="236.0" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="1.4"/><text x="790.0" y="194.0" font-size="10.5" font-weight="bold" fill="#6b7280" text-anchor="start">Work group arrangement</text><text x="790.0" y="209.0" font-size="12" font-weight="normal" fill="#1f2937" text-anchor="start">By project</text><text x="790.0" y="234.0" font-size="10.5" font-weight="bold" fill="#6b7280" text-anchor="start">PM authority</text><text x="790.0" y="249.0" font-size="12" font-weight="bold" fill="#1f2937" text-anchor="start">High to almost total</text><text x="790.0" y="274.0" font-size="10.5" font-weight="bold" fill="#6b7280" text-anchor="start">PM role</text><text x="790.0" y="289.0" font-size="12" font-weight="normal" fill="#1f2937" text-anchor="start">Full-time, designated job role</text><text x="790.0" y="314.0" font-size="10.5" font-weight="bold" fill="#6b7280" text-anchor="start">Resource availability</text><text x="790.0" y="329.0" font-size="12" font-weight="normal" fill="#1f2937" text-anchor="start">High to almost total</text><rect x="20.0" y="418.0" width="940.0" height="46.0" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.6"/><text x="490.0" y="437.4" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">Also in PMBOK 8: organic/simple, multidivisional (may replicate functions per division), virtual/network (nodes at points of contact) and hybrid (a mix). Exam cue: in a weak</text><text x="490.0" y="452.4" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle">matrix the PM cannot overrule functional managers, so negotiate and align them.</text></svg>