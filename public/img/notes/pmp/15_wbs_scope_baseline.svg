<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 540" width="980" height="540" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">WBS decomposition and the scope baseline</title><desc id="d">A sample WBS for a city park: level 1 project, level 2 major deliverables, level 3 work packages, one planning package, and a control account. The scope baseline is the project scope statement plus the WBS plus the WBS dictionary.</desc><defs></defs><rect x="0.75" y="0.75" width="978.5" height="538.5" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><text x="20.0" y="28.0" font-size="18" font-weight="bold" fill="#1f2937" text-anchor="start">WBS decomposition and the scope baseline</text><text x="20.0" y="48.0" font-size="12" font-weight="normal" fill="#6b7280" text-anchor="start">Sample WBS (city park, illustrative): deliverable-oriented, 100% of the scope, decomposed to work packages</text><rect x="258.0" y="64.0" width="130.0" height="34.0" rx="8" fill="#1e3a8a" stroke="#1e3a8a" stroke-width="1.6"/><text x="323.0" y="84.9" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">0 City park project</text><line x1="323.0" y1="98.0" x2="323.0" y2="114.0" stroke="#6b7280" stroke-width="1.5"/><line x1="76.0" y1="114.0" x2="564.0" y2="114.0" stroke="#6b7280" stroke-width="1.5"/><line x1="76.0" y1="114.0" x2="76.0" y2="126.0" stroke="#6b7280" stroke-width="1.5"/><rect x="20.0" y="126.0" width="112.0" height="40.0" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="76.0" y="149.7" font-size="11.5" font-weight="bold" fill="#1e3a8a" text-anchor="middle">1 Design</text><line x1="76.0" y1="166.0" x2="76.0" y2="186.0" stroke="#6b7280" stroke-width="1.2"/><rect x="20.0" y="186.0" width="112.0" height="36.0" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="76.0" y="200.8" font-size="10.5" font-weight="normal" fill="#14532d" text-anchor="middle">1.1 Concept</text><text x="76.0" y="214.0" font-size="10.5" font-weight="normal" fill="#14532d" text-anchor="middle">mock-ups</text><line x1="76.0" y1="222.0" x2="76.0" y2="230.0" stroke="#6b7280" stroke-width="1.2"/><rect x="20.0" y="230.0" width="112.0" height="36.0" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="76.0" y="251.4" font-size="10.5" font-weight="normal" fill="#14532d" text-anchor="middle">1.2 Detailed plans</text><line x1="198.0" y1="114.0" x2="198.0" y2="126.0" stroke="#6b7280" stroke-width="1.5"/><rect x="142.0" y="126.0" width="112.0" height="40.0" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="198.0" y="149.7" font-size="11.5" font-weight="bold" fill="#1e3a8a" text-anchor="middle">2 Site works</text><line x1="198.0" y1="166.0" x2="198.0" y2="186.0" stroke="#6b7280" stroke-width="1.2"/><rect x="142.0" y="186.0" width="112.0" height="36.0" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="198.0" y="200.8" font-size="10.5" font-weight="normal" fill="#14532d" text-anchor="middle">2.1 Clearing and</text><text x="198.0" y="214.0" font-size="10.5" font-weight="normal" fill="#14532d" text-anchor="middle">grading</text><line x1="198.0" y1="222.0" x2="198.0" y2="230.0" stroke="#6b7280" stroke-width="1.2"/><rect x="142.0" y="230.0" width="112.0" height="36.0" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="198.0" y="251.4" font-size="10.5" font-weight="normal" fill="#14532d" text-anchor="middle">2.2 Drainage</text><line x1="320.0" y1="114.0" x2="320.0" y2="126.0" stroke="#6b7280" stroke-width="1.5"/><rect x="264.0" y="126.0" width="112.0" height="40.0" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="320.0" y="149.7" font-size="11.5" font-weight="bold" fill="#1e3a8a" text-anchor="middle">3 Facilities</text><line x1="320.0" y1="166.0" x2="320.0" y2="186.0" stroke="#6b7280" stroke-width="1.2"/><rect x="264.0" y="186.0" width="112.0" height="36.0" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="320.0" y="207.4" font-size="10.5" font-weight="normal" fill="#14532d" text-anchor="middle">3.1 Playground</text><line x1="320.0" y1="222.0" x2="320.0" y2="230.0" stroke="#6b7280" stroke-width="1.2"/><rect x="264.0" y="230.0" width="112.0" height="36.0" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="320.0" y="244.8" font-size="10.5" font-weight="normal" fill="#14532d" text-anchor="middle">3.2 Paths and</text><text x="320.0" y="258.0" font-size="10.5" font-weight="normal" fill="#14532d" text-anchor="middle">lighting</text><line x1="320.0" y1="266.0" x2="320.0" y2="274.0" stroke="#6b7280" stroke-width="1.2"/><rect x="264.0" y="274.0" width="112.0" height="36.0" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="320.0" y="295.4" font-size="10.5" font-weight="normal" fill="#14532d" text-anchor="middle">3.3 Restrooms</text><line x1="442.0" y1="114.0" x2="442.0" y2="126.0" stroke="#6b7280" stroke-width="1.5"/><rect x="386.0" y="126.0" width="112.0" height="40.0" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="442.0" y="149.7" font-size="11.5" font-weight="bold" fill="#1e3a8a" text-anchor="middle">4 Planting</text><line x1="442.0" y1="166.0" x2="442.0" y2="186.0" stroke="#6b7280" stroke-width="1.2"/><rect x="386.0" y="186.0" width="112.0" height="36.0" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="442.0" y="200.8" font-size="10.5" font-weight="normal" fill="#14532d" text-anchor="middle">4.1 Trees and</text><text x="442.0" y="214.0" font-size="10.5" font-weight="normal" fill="#14532d" text-anchor="middle">shrubs</text><line x1="442.0" y1="222.0" x2="442.0" y2="230.0" stroke="#6b7280" stroke-width="1.2"/><rect x="386.0" y="230.0" width="112.0" height="36.0" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.6" stroke-dasharray="5 3"/><text x="442.0" y="244.8" font-size="10.5" font-weight="normal" fill="#78350f" text-anchor="middle">4.2 Lawn and</text><text x="442.0" y="258.0" font-size="10.5" font-weight="normal" fill="#78350f" text-anchor="middle">irrigation</text><line x1="564.0" y1="114.0" x2="564.0" y2="126.0" stroke="#6b7280" stroke-width="1.5"/><rect x="508.0" y="126.0" width="112.0" height="40.0" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="564.0" y="142.6" font-size="11.5" font-weight="bold" fill="#1e3a8a" text-anchor="middle">5 Project</text><text x="564.0" y="156.9" font-size="11.5" font-weight="bold" fill="#1e3a8a" text-anchor="middle">management</text><line x1="564.0" y1="166.0" x2="564.0" y2="186.0" stroke="#6b7280" stroke-width="1.2"/><rect x="508.0" y="186.0" width="112.0" height="36.0" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="564.0" y="200.8" font-size="10.5" font-weight="normal" fill="#14532d" text-anchor="middle">5.1 Planning and</text><text x="564.0" y="214.0" font-size="10.5" font-weight="normal" fill="#14532d" text-anchor="middle">reporting</text><line x1="564.0" y1="222.0" x2="564.0" y2="230.0" stroke="#6b7280" stroke-width="1.2"/><rect x="508.0" y="230.0" width="112.0" height="36.0" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="564.0" y="244.8" font-size="10.5" font-weight="normal" fill="#14532d" text-anchor="middle">5.2 Stakeholder</text><text x="564.0" y="258.0" font-size="10.5" font-weight="normal" fill="#14532d" text-anchor="middle">engagement</text><rect x="259.0" y="180.0" width="122.0" height="134.0" rx="8" fill="none" stroke="#6b7280" stroke-width="1.4" stroke-dasharray="4 3"/><text x="320.0" y="330.0" font-size="10.5" font-weight="bold" fill="#6b7280" text-anchor="middle">Control account</text><rect x="20.0" y="348.0" width="12.0" height="12.0" rx="3" fill="#dcfce7" stroke="#16a34a" stroke-width="1.3"/><text x="38.0" y="358.0" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">Work package: lowest level; cost and duration can be estimated, assigned, controlled</text><rect x="20.0" y="368.0" width="12.0" height="12.0" rx="3" fill="#fef3c7" stroke="#d97706" stroke-width="1.3"/><text x="38.0" y="378.0" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">Planning package: known work content, no detailed activities yet (rolling wave)</text><rect x="20.0" y="388.0" width="12.0" height="12.0" rx="3" fill="#ffffff" stroke="#6b7280" stroke-width="1.3" stroke-dasharray="3 2"/><text x="38.0" y="398.0" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">Control account: management control point where scope, budget and schedule are integrated</text><rect x="660.0" y="62.0" width="300.0" height="30.0" rx="8" fill="#1e3a8a" stroke="#1e3a8a" stroke-width="1.6"/><text x="810.0" y="81.1" font-size="12.5" font-weight="bold" fill="#ffffff" text-anchor="middle">SCOPE BASELINE (predictive)</text><rect x="660.0" y="100.0" width="300.0" height="64.0" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="810.0" y="121.4" font-size="11.5" font-weight="bold" fill="#1e3a8a" text-anchor="middle">Project scope statement</text><text x="810.0" y="135.7" font-size="11.5" font-weight="normal" fill="#1e3a8a" text-anchor="middle">Scope description, deliverables, acceptance criteria,</text><text x="810.0" y="150.1" font-size="11.5" font-weight="normal" fill="#1e3a8a" text-anchor="middle">exclusions</text><rect x="660.0" y="172.0" width="300.0" height="64.0" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="810.0" y="193.4" font-size="11.5" font-weight="bold" fill="#1e3a8a" text-anchor="middle">Work breakdown structure (WBS)</text><text x="810.0" y="207.7" font-size="11.5" font-weight="normal" fill="#1e3a8a" text-anchor="middle">Hierarchical decomposition of the total scope; the</text><text x="810.0" y="222.1" font-size="11.5" font-weight="normal" fill="#1e3a8a" text-anchor="middle">100% rule</text><rect x="660.0" y="244.0" width="300.0" height="78.0" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="810.0" y="272.4" font-size="11.5" font-weight="bold" fill="#1e3a8a" text-anchor="middle">WBS dictionary</text><text x="810.0" y="286.7" font-size="11.5" font-weight="normal" fill="#1e3a8a" text-anchor="middle">Per element: description, owner, milestones,</text><text x="810.0" y="301.1" font-size="11.5" font-weight="normal" fill="#1e3a8a" text-anchor="middle">resources, cost, quality, acceptance criteria</text><rect x="660.0" y="332.0" width="300.0" height="68.0" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="810.0" y="355.4" font-size="11.5" font-weight="bold" fill="#14532d" text-anchor="middle">Adaptive equivalent</text><text x="810.0" y="369.7" font-size="11.5" font-weight="normal" fill="#14532d" text-anchor="middle">Epics, features and user stories in the product backlog;</text><text x="810.0" y="384.1" font-size="11.5" font-weight="normal" fill="#14532d" text-anchor="middle">baseline set per iteration</text><rect x="20.0" y="418.0" width="940.0" height="108.0" rx="8" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.2"/><text x="32.0" y="438.0" font-size="11.5" font-weight="bold" fill="#6b7280" text-anchor="start">•</text><text x="44.0" y="438.0" font-size="11.3" font-weight="normal" fill="#1f2937" text-anchor="start">100% rule: the WBS holds all product and project work (including project management work) and nothing more; lower levels roll up to the higher ones.</text><text x="32.0" y="454.8" font-size="11.5" font-weight="bold" fill="#6b7280" text-anchor="start">•</text><text x="44.0" y="454.8" font-size="11.3" font-weight="normal" fill="#1f2937" text-anchor="start">Decompose until the components are necessary and sufficient for the deliverable and can be estimated, assigned and controlled. Excessive decomposition wastes effort and</text><text x="44.0" y="468.6" font-size="11.3" font-weight="normal" fill="#1f2937" text-anchor="start">complicates roll-up.</text><text x="32.0" y="485.4" font-size="11.5" font-weight="bold" fill="#6b7280" text-anchor="start">•</text><text x="44.0" y="485.4" font-size="11.3" font-weight="normal" fill="#1f2937" text-anchor="start">Work far in the future stays at planning-package level and is decomposed later (rolling wave planning).</text><text x="32.0" y="502.1" font-size="11.5" font-weight="bold" fill="#6b7280" text-anchor="start">•</text><text x="44.0" y="502.1" font-size="11.3" font-weight="normal" fill="#1f2937" text-anchor="start">Build it top-down, from organizational guidelines or templates; group by phase or by major deliverable; bottom-up grouping is possible; the team helps create it.</text></svg>