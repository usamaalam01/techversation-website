<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 482" width="980" height="482" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">Leading the project team: seven enablers</title><desc id="d">Establish team-level expectations, empower the team, solve problems, represent the voice of the team, support varied experience and perspectives, determine a leadership style, and establish clear roles and responsibilities, around the Lead the Team process.</desc><defs></defs><rect x="0.75" y="0.75" width="978.5" height="480.5" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><text x="20.0" y="28.0" font-size="18" font-weight="bold" fill="#1f2937" text-anchor="start">Leading the project team: the seven ECO enablers</text><text x="20.0" y="48.0" font-size="12" font-weight="normal" fill="#6b7280" text-anchor="start">Management activities (processes, planning, measuring) plus leadership activities (influencing, motivating, listening, enabling)</text><rect x="330.0" y="222.0" width="320.0" height="78.0" rx="8" fill="#1e3a8a" stroke="#1e3a8a" stroke-width="1.6"/><text x="490.0" y="250.4" font-size="11.5" font-weight="bold" fill="#ffffff" text-anchor="middle">Lead the Team</text><text x="490.0" y="264.7" font-size="11.5" font-weight="normal" fill="#ffffff" text-anchor="middle">Guide, develop and manage the team through feedback,</text><text x="490.0" y="279.1" font-size="11.5" font-weight="normal" fill="#ffffff" text-anchor="middle">collaboration, conflict resolution and escalation</text><rect x="20.0" y="64.0" width="224.0" height="124.0" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.7"/><text x="30.0" y="86.0" font-size="12" font-weight="bold" fill="#1e3a8a" text-anchor="start">1 Establish team-level expectations</text><text x="30.0" y="122.0" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">Shared vision; team charter and working</text><text x="30.0" y="135.2" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">agreements; ground rules; definition of</text><text x="30.0" y="148.4" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">done; revisit when members join</text><line x1="132.0" y1="188.0" x2="490.0" y2="222.0" stroke="#9ca3af" stroke-width="1.6"/><rect x="264.0" y="64.0" width="224.0" height="124.0" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.7"/><text x="274.0" y="86.0" font-size="12" font-weight="bold" fill="#14532d" text-anchor="start">2 Empower the team</text><text x="274.0" y="122.0" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">Delegate decisions within clear</text><text x="274.0" y="135.2" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">boundaries; autonomy, mastery, purpose;</text><text x="274.0" y="148.4" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">trust; avoid micromanaging</text><line x1="376.0" y1="188.0" x2="490.0" y2="222.0" stroke="#9ca3af" stroke-width="1.6"/><rect x="508.0" y="64.0" width="224.0" height="124.0" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.7"/><text x="518.0" y="86.0" font-size="12" font-weight="bold" fill="#78350f" text-anchor="start">3 Solve problems</text><text x="518.0" y="122.0" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">Structured steps, critical thinking, root</text><text x="518.0" y="135.2" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">cause; facilitate, do not solve everything</text><text x="518.0" y="148.4" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">yourself; escalate beyond authority</text><line x1="620.0" y1="188.0" x2="490.0" y2="222.0" stroke="#9ca3af" stroke-width="1.6"/><rect x="752.0" y="64.0" width="224.0" height="124.0" rx="10" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.7"/><text x="762.0" y="86.0" font-size="12" font-weight="bold" fill="#134e4a" text-anchor="start">4 Represent the team's voice</text><text x="762.0" y="122.0" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">Speak for capacity and needs with</text><text x="762.0" y="135.2" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">sponsor and stakeholders; protect from</text><text x="762.0" y="148.4" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">unplanned demands; remove</text><text x="762.0" y="161.5" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">impediments</text><line x1="864.0" y1="188.0" x2="490.0" y2="222.0" stroke="#9ca3af" stroke-width="1.6"/><rect x="140.0" y="338.0" width="224.0" height="124.0" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.7"/><text x="150.0" y="360.0" font-size="12" font-weight="bold" fill="#4c1d95" text-anchor="start">5 Support varied experience and</text><text x="150.0" y="374.2" font-size="12" font-weight="bold" fill="#4c1d95" text-anchor="start">perspectives</text><text x="150.0" y="396.0" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">Inclusion; mentoring and coaching; skill</text><text x="150.0" y="409.2" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">matrix; cultural intelligence; accommodate</text><text x="150.0" y="422.4" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">working styles; psychological safety</text><line x1="252.0" y1="338.0" x2="490.0" y2="300.0" stroke="#9ca3af" stroke-width="1.6"/><rect x="378.0" y="338.0" width="224.0" height="124.0" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="1.7"/><text x="388.0" y="360.0" font-size="12" font-weight="bold" fill="#7f1d1d" text-anchor="start">6 Determine a leadership style</text><text x="388.0" y="396.0" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">Team maturity (Tuckman), task, risk and</text><text x="388.0" y="409.2" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">culture; centralized or distributed; servant</text><text x="388.0" y="422.4" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">leadership; directive when needed</text><line x1="490.0" y1="338.0" x2="490.0" y2="300.0" stroke="#9ca3af" stroke-width="1.6"/><rect x="616.0" y="338.0" width="224.0" height="124.0" rx="10" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.7"/><text x="626.0" y="360.0" font-size="12" font-weight="bold" fill="#374151" text-anchor="start">7 Clarify roles and responsibilities</text><text x="626.0" y="396.0" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">RACI; one accountable owner; authority</text><text x="626.0" y="409.2" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">matches responsibility; agile and vendor</text><text x="626.0" y="422.4" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">roles</text><line x1="728.0" y1="338.0" x2="490.0" y2="300.0" stroke="#9ca3af" stroke-width="1.6"/><rect x="330.0" y="222.0" width="320.0" height="78.0" rx="8" fill="#1e3a8a" stroke="#1e3a8a" stroke-width="1.6"/><text x="490.0" y="250.4" font-size="11.5" font-weight="bold" fill="#ffffff" text-anchor="middle">Lead the Team</text><text x="490.0" y="264.7" font-size="11.5" font-weight="normal" fill="#ffffff" text-anchor="middle">Guide, develop and manage the team through feedback,</text><text x="490.0" y="279.1" font-size="11.5" font-weight="normal" fill="#ffffff" text-anchor="middle">collaboration, conflict resolution and escalation</text></svg>