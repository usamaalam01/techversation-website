<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900" height="470" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">AI classification</title><desc id="d">Nested classification: artificial intelligence contains machine learning, which contains deep learning, which contains generative AI built on large language models.</desc><defs></defs><rect x="0.75" y="0.75" width="898.5" height="468.5" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><text x="20.0" y="28.0" font-size="18" font-weight="bold" fill="#1f2937" text-anchor="start">How the AI terms fit together</text><text x="20.0" y="48.0" font-size="12" font-weight="normal" fill="#6b7280" text-anchor="start">PMBOK 8 Appendix X3 (Figure X3-1 and §X3.1)</text><circle cx="230.0" cy="262.0" r="170" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><circle cx="230.0" cy="262.0" r="128" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><circle cx="230.0" cy="262.0" r="88" fill="#bfdbfe" stroke="#1d4ed8" stroke-width="2"/><circle cx="230.0" cy="262.0" r="50" fill="#93c5fd" stroke="#1e3a8a" stroke-width="2"/><text x="230.0" y="127.0" font-size="13" font-weight="bold" fill="#1e3a8a" text-anchor="middle">Artificial intelligence (AI)</text><text x="230.0" y="169.0" font-size="12.5" font-weight="bold" fill="#1e3a8a" text-anchor="middle">Machine learning (ML)</text><text x="230.0" y="207.0" font-size="12" font-weight="bold" fill="#1e3a8a" text-anchor="middle">Deep learning (DL)</text><text x="230.0" y="259.0" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">Generative AI</text><text x="230.0" y="274.0" font-size="11" font-weight="normal" fill="#ffffff" text-anchor="middle">(LLMs, GPT)</text><rect x="440.0" y="74.0" width="440.0" height="54.0" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/><text x="452.0" y="94.0" font-size="12.5" font-weight="bold" fill="#2563eb" text-anchor="start">AI</text><text x="452.0" y="110.0" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="start">Systems that can reason, learn and act autonomously; machines with patterns and</text><text x="452.0" y="123.2" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="start">processes like those of humans</text><rect x="440.0" y="136.0" width="440.0" height="54.0" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/><text x="452.0" y="156.0" font-size="12.5" font-weight="bold" fill="#2563eb" text-anchor="start">Machine learning</text><text x="452.0" y="172.0" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="start">Subfield of AI: models trained on data predict outputs from previous inputs; learns</text><text x="452.0" y="185.2" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="start">from past experience</text><rect x="440.0" y="198.0" width="440.0" height="54.0" rx="8" fill="#ffffff" stroke="#1d4ed8" stroke-width="1.5"/><text x="452.0" y="218.0" font-size="12.5" font-weight="bold" fill="#1d4ed8" text-anchor="start">Deep learning</text><text x="452.0" y="234.0" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="start">Advanced ML using multilayered neural networks; needs large data sets and much</text><text x="452.0" y="247.2" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="start">computing</text><rect x="440.0" y="260.0" width="440.0" height="54.0" rx="8" fill="#ffffff" stroke="#1e3a8a" stroke-width="1.5"/><text x="452.0" y="280.0" font-size="12.5" font-weight="bold" fill="#1e3a8a" text-anchor="start">Generative AI</text><text x="452.0" y="296.0" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="start">Subset of deep learning; large language models (LLMs) generate new text, speech,</text><text x="452.0" y="309.2" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="start">audio, images, video</text><rect x="440.0" y="322.0" width="440.0" height="54.0" rx="8" fill="#ffffff" stroke="#0d9488" stroke-width="1.5"/><text x="452.0" y="342.0" font-size="12.5" font-weight="bold" fill="#0d9488" text-anchor="start">NLP</text><text x="452.0" y="358.0" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="start">Software that processes natural language: chatbots, speech recognition,</text><text x="452.0" y="371.2" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="start">summarization, sentiment analysis</text><rect x="440.0" y="384.0" width="440.0" height="54.0" rx="8" fill="#ffffff" stroke="#d97706" stroke-width="1.5"/><text x="452.0" y="404.0" font-size="12.5" font-weight="bold" fill="#d97706" text-anchor="start">Predictive analytics</text><text x="452.0" y="420.0" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="start">ML on current and historical data to forecast performance, trends and risks</text></svg>