<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 480" width="980" height="480" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">Responsible use of AI in projects</title><desc id="d">Eight concerns with mitigations: bias, privacy, accountability, reliability, safety, transparency, copyright and sustainability.</desc><defs></defs><rect x="0.75" y="0.75" width="978.5" height="478.5" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><text x="20.0" y="28.0" font-size="18" font-weight="bold" fill="#1f2937" text-anchor="start">Responsible use of AI: eight concerns</text><text x="20.0" y="48.0" font-size="12" font-weight="normal" fill="#6b7280" text-anchor="start">PMBOK 8 Appendix X3.3 plus Guide statements on knowledge and communications. A human stays accountable</text><rect x="20.0" y="70.0" width="226.0" height="168.0" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.6"/><text x="32.0" y="94.0" font-size="14" font-weight="bold" fill="#7f1d1d" text-anchor="start">Bias</text><text x="32.0" y="114.0" font-size="11.5" font-weight="bold" fill="#1f2937" text-anchor="start">Biased training data or algorithms</text><text x="32.0" y="134.0" font-size="11.2" font-weight="normal" fill="#1f2937" text-anchor="start">Diversify data sets; test periodically for</text><text x="32.0" y="148.0" font-size="11.2" font-weight="normal" fill="#1f2937" text-anchor="start">bias; involve different teams</text><rect x="260.0" y="70.0" width="226.0" height="168.0" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="272.0" y="94.0" font-size="14" font-weight="bold" fill="#1e3a8a" text-anchor="start">Privacy</text><text x="272.0" y="114.0" font-size="11.5" font-weight="bold" fill="#1f2937" text-anchor="start">Sensitive data, regulated by privacy</text><text x="272.0" y="128.0" font-size="11.5" font-weight="bold" fill="#1f2937" text-anchor="start">laws and policies</text><text x="272.0" y="148.1" font-size="11.2" font-weight="normal" fill="#1f2937" text-anchor="start">Secure data; privacy policy in place;</text><text x="272.0" y="162.1" font-size="11.2" font-weight="normal" fill="#1f2937" text-anchor="start">paid tools can limit use of your data for</text><text x="272.0" y="176.1" font-size="11.2" font-weight="normal" fill="#1f2937" text-anchor="start">training; never paste confidential data</text><text x="272.0" y="190.1" font-size="11.2" font-weight="normal" fill="#1f2937" text-anchor="start">into public tools</text><rect x="500.0" y="70.0" width="226.0" height="168.0" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.6"/><text x="512.0" y="94.0" font-size="14" font-weight="bold" fill="#4c1d95" text-anchor="start">Accountability</text><text x="512.0" y="114.0" font-size="11.5" font-weight="bold" fill="#1f2937" text-anchor="start">AI may make or shape decisions</text><text x="512.0" y="134.0" font-size="11.2" font-weight="normal" fill="#1f2937" text-anchor="start">A human is accountable for every</text><text x="512.0" y="148.0" font-size="11.2" font-weight="normal" fill="#1f2937" text-anchor="start">decision; define accountability clearly</text><rect x="740.0" y="70.0" width="226.0" height="168.0" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="752.0" y="94.0" font-size="14" font-weight="bold" fill="#78350f" text-anchor="start">Reliability</text><text x="752.0" y="114.0" font-size="11.5" font-weight="bold" fill="#1f2937" text-anchor="start">Output can be biased, incorrect or</text><text x="752.0" y="128.0" font-size="11.5" font-weight="bold" fill="#1f2937" text-anchor="start">irrelevant (hallucinations)</text><text x="752.0" y="148.1" font-size="11.2" font-weight="normal" fill="#1f2937" text-anchor="start">Check and validate every output before</text><text x="752.0" y="162.1" font-size="11.2" font-weight="normal" fill="#1f2937" text-anchor="start">use or distribution</text><rect x="20.0" y="252.0" width="226.0" height="168.0" rx="8" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.6"/><text x="32.0" y="276.0" font-size="14" font-weight="bold" fill="#134e4a" text-anchor="start">Safety</text><text x="32.0" y="296.0" font-size="11.5" font-weight="bold" fill="#1f2937" text-anchor="start">System failures can cause harm</text><text x="32.0" y="316.0" font-size="11.2" font-weight="normal" fill="#1f2937" text-anchor="start">Design, test and monitor to the required</text><text x="32.0" y="330.0" font-size="11.2" font-weight="normal" fill="#1f2937" text-anchor="start">safety level</text><rect x="260.0" y="252.0" width="226.0" height="168.0" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="272.0" y="276.0" font-size="14" font-weight="bold" fill="#14532d" text-anchor="start">Transparency</text><text x="272.0" y="296.0" font-size="11.5" font-weight="bold" fill="#1f2937" text-anchor="start">Users and affected parties should</text><text x="272.0" y="310.0" font-size="11.5" font-weight="bold" fill="#1f2937" text-anchor="start">know how data and algorithms are</text><text x="272.0" y="324.1" font-size="11.5" font-weight="bold" fill="#1f2937" text-anchor="start">used</text><text x="272.0" y="344.1" font-size="11.2" font-weight="normal" fill="#1f2937" text-anchor="start">Share how data is handled, how</text><text x="272.0" y="358.1" font-size="11.2" font-weight="normal" fill="#1f2937" text-anchor="start">algorithms work and how decisions are</text><text x="272.0" y="372.1" font-size="11.2" font-weight="normal" fill="#1f2937" text-anchor="start">made</text><rect x="500.0" y="252.0" width="226.0" height="168.0" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.6"/><text x="512.0" y="276.0" font-size="14" font-weight="bold" fill="#374151" text-anchor="start">Copyright</text><text x="512.0" y="296.0" font-size="11.5" font-weight="bold" fill="#1f2937" text-anchor="start">Ownership of AI-generated content is</text><text x="512.0" y="310.0" font-size="11.5" font-weight="bold" fill="#1f2937" text-anchor="start">unclear</text><text x="512.0" y="330.1" font-size="11.2" font-weight="normal" fill="#1f2937" text-anchor="start">Know the laws and the data's licensing;</text><text x="512.0" y="344.1" font-size="11.2" font-weight="normal" fill="#1f2937" text-anchor="start">consider the level of human contribution</text><rect x="740.0" y="252.0" width="226.0" height="168.0" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="752.0" y="276.0" font-size="14" font-weight="bold" fill="#14532d" text-anchor="start">Sustainability</text><text x="752.0" y="296.0" font-size="11.5" font-weight="bold" fill="#1f2937" text-anchor="start">Each request consumes electricity,</text><text x="752.0" y="310.0" font-size="11.5" font-weight="bold" fill="#1f2937" text-anchor="start">water and other resources</text><text x="752.0" y="330.1" font-size="11.2" font-weight="normal" fill="#1f2937" text-anchor="start">Weigh resource use when deciding</text><text x="752.0" y="344.1" font-size="11.2" font-weight="normal" fill="#1f2937" text-anchor="start">whether and where to use AI</text><text x="490.0" y="466.0" font-size="11.5" font-weight="normal" fill="#6b7280" text-anchor="middle" font-style="italic">Also: organizational AI policies and ethical guidelines set the baseline; foster a culture of awareness and ethical use; engage cybersecurity before adopting a tool.</text></svg>