<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 510" width="980" height="510" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">Schedule compression and resource optimization</title><desc id="d">A normal 15-day sequence compared with fast tracking (overlap, rework and coordination risk) and crashing (more resources, higher cost). Resource leveling can delay the finish and change the critical path; resource smoothing uses float only.</desc><defs></defs><rect x="0.75" y="0.75" width="978.5" height="508.5" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><text x="20.0" y="28.0" font-size="18" font-weight="bold" fill="#1f2937" text-anchor="start">Schedule compression and resource optimization</text><text x="20.0" y="48.0" font-size="12" font-weight="normal" fill="#6b7280" text-anchor="start">Compression shortens the schedule without cutting scope: only on the critical path, and each option costs something</text><line x1="150.0" y1="64.0" x2="150.0" y2="228.0" stroke="#d1d5db" stroke-width="1" stroke-dasharray="3 3"/><text x="150.0" y="60.0" font-size="10" font-weight="normal" fill="#6b7280" text-anchor="middle">day 0</text><line x1="260.0" y1="64.0" x2="260.0" y2="228.0" stroke="#d1d5db" stroke-width="1" stroke-dasharray="3 3"/><text x="260.0" y="60.0" font-size="10" font-weight="normal" fill="#6b7280" text-anchor="middle">day 5</text><line x1="370.0" y1="64.0" x2="370.0" y2="228.0" stroke="#d1d5db" stroke-width="1" stroke-dasharray="3 3"/><text x="370.0" y="60.0" font-size="10" font-weight="normal" fill="#6b7280" text-anchor="middle">day 10</text><line x1="480.0" y1="64.0" x2="480.0" y2="228.0" stroke="#d1d5db" stroke-width="1" stroke-dasharray="3 3"/><text x="480.0" y="60.0" font-size="10" font-weight="normal" fill="#6b7280" text-anchor="middle">day 15</text><text x="20.0" y="90.0" font-size="12.5" font-weight="bold" fill="#1f2937" text-anchor="start">Normal</text><text x="20.0" y="106.0" font-size="10.5" font-weight="normal" fill="#6b7280" text-anchor="start">A, B, C in sequence</text><rect x="150.0" y="72.0" width="110.0" height="24.0" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><text x="205.0" y="88.0" font-size="11" font-weight="bold" fill="#1e3a8a" text-anchor="middle">A</text><rect x="260.0" y="72.0" width="110.0" height="24.0" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><text x="315.0" y="88.0" font-size="11" font-weight="bold" fill="#1e3a8a" text-anchor="middle">B</text><rect x="370.0" y="72.0" width="110.0" height="24.0" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><text x="425.0" y="88.0" font-size="11" font-weight="bold" fill="#1e3a8a" text-anchor="middle">C</text><text x="492.0" y="90.0" font-size="12" font-weight="bold" fill="#1f2937" text-anchor="start">15 days</text><text x="492.0" y="106.0" font-size="10.5" font-weight="normal" fill="#6b7280" text-anchor="start">baseline logic</text><text x="20.0" y="142.0" font-size="12.5" font-weight="bold" fill="#1f2937" text-anchor="start">Fast tracking</text><text x="20.0" y="158.0" font-size="10.5" font-weight="normal" fill="#6b7280" text-anchor="start">overlap sequential work</text><rect x="150.0" y="124.0" width="110.0" height="24.0" rx="4" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/><text x="172.0" y="140.0" font-size="11" font-weight="bold" fill="#78350f" text-anchor="middle">A</text><rect x="194.0" y="124.0" width="110.0" height="24.0" rx="4" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/><text x="249.0" y="140.0" font-size="11" font-weight="bold" fill="#78350f" text-anchor="middle">B</text><rect x="304.0" y="124.0" width="110.0" height="24.0" rx="4" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/><text x="359.0" y="140.0" font-size="11" font-weight="bold" fill="#78350f" text-anchor="middle">C</text><text x="492.0" y="142.0" font-size="12" font-weight="bold" fill="#1f2937" text-anchor="start">12 days</text><text x="492.0" y="158.0" font-size="10.5" font-weight="normal" fill="#92400e" text-anchor="start">rework, risk, coordination</text><rect x="194.0" y="124.0" width="66.0" height="24.0" rx="3" fill="none" stroke="#dc2626" stroke-width="1.8" stroke-dasharray="3 2"/><text x="227.0" y="164.0" font-size="10" font-weight="normal" fill="#991b1b" text-anchor="middle">B overlaps A by 3 days</text><text x="20.0" y="194.0" font-size="12.5" font-weight="bold" fill="#1f2937" text-anchor="start">Crashing</text><text x="20.0" y="210.0" font-size="10.5" font-weight="normal" fill="#6b7280" text-anchor="start">add resources to B</text><rect x="150.0" y="176.0" width="110.0" height="24.0" rx="4" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/><text x="205.0" y="192.0" font-size="11" font-weight="bold" fill="#7f1d1d" text-anchor="middle">A</text><rect x="260.0" y="176.0" width="44.0" height="24.0" rx="4" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/><text x="282.0" y="192.0" font-size="11" font-weight="bold" fill="#7f1d1d" text-anchor="middle">B</text><rect x="304.0" y="176.0" width="110.0" height="24.0" rx="4" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/><text x="359.0" y="192.0" font-size="11" font-weight="bold" fill="#7f1d1d" text-anchor="middle">C</text><text x="492.0" y="194.0" font-size="12" font-weight="bold" fill="#1f2937" text-anchor="start">12 days</text><text x="492.0" y="210.0" font-size="10.5" font-weight="normal" fill="#991b1b" text-anchor="start">higher cost, may not work</text><text x="282.0" y="216.0" font-size="10" font-weight="normal" fill="#991b1b" text-anchor="middle">B crashed from 5 to 2 days with more people</text><rect x="20.0" y="250.0" width="300.0" height="118.0" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="31.0" y="285.1" font-size="11" font-weight="bold" fill="#78350f" text-anchor="start">Fast tracking</text><text x="31.0" y="298.8" font-size="11" font-weight="normal" fill="#78350f" text-anchor="start">Do in parallel what was planned in sequence (for part of</text><text x="31.0" y="312.6" font-size="11" font-weight="normal" fill="#78350f" text-anchor="start">the duration), e.g., start the foundation before all</text><text x="31.0" y="326.3" font-size="11" font-weight="normal" fill="#78350f" text-anchor="start">drawings are done. Works only if activities can overlap;</text><text x="31.0" y="340.1" font-size="11" font-weight="normal" fill="#78350f" text-anchor="start">can cause rework, quality risk and higher cost.</text><rect x="340.0" y="250.0" width="300.0" height="118.0" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.6"/><text x="351.0" y="285.1" font-size="11" font-weight="bold" fill="#7f1d1d" text-anchor="start">Crashing</text><text x="351.0" y="298.8" font-size="11" font-weight="normal" fill="#7f1d1d" text-anchor="start">Add resources (overtime, extra people, expedited</text><text x="351.0" y="312.6" font-size="11" font-weight="normal" fill="#7f1d1d" text-anchor="start">delivery) to shorten critical-path activities for the least</text><text x="351.0" y="326.3" font-size="11" font-weight="normal" fill="#7f1d1d" text-anchor="start">extra cost. Works only where more resources shorten</text><text x="351.0" y="340.1" font-size="11" font-weight="normal" fill="#7f1d1d" text-anchor="start">the work; may raise cost and risk.</text><rect x="660.0" y="250.0" width="300.0" height="118.0" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.6"/><text x="671.0" y="285.1" font-size="11" font-weight="bold" fill="#374151" text-anchor="start">Negative float analysis</text><text x="671.0" y="298.8" font-size="11" font-weight="normal" fill="#374151" text-anchor="start">When constraints force dates earlier than the logic</text><text x="671.0" y="312.6" font-size="11" font-weight="normal" fill="#374151" text-anchor="start">allows, total float turns negative. Use it to see how much</text><text x="671.0" y="326.3" font-size="11" font-weight="normal" fill="#374151" text-anchor="start">compression is needed, then pick options by cost and</text><text x="671.0" y="340.1" font-size="11" font-weight="normal" fill="#374151" text-anchor="start">risk.</text><rect x="20.0" y="384.0" width="460.0" height="112.0" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.6"/><text x="31.0" y="429.8" font-size="11" font-weight="bold" fill="#4c1d95" text-anchor="start">Resource leveling</text><text x="31.0" y="443.6" font-size="11" font-weight="normal" fill="#4c1d95" text-anchor="start">Adjusts start and finish dates to balance demand with available supply (over-allocated or</text><text x="31.0" y="457.3" font-size="11" font-weight="normal" fill="#4c1d95" text-anchor="start">limited resources). It can change the critical path and delay the finish date.</text><rect x="500.0" y="384.0" width="460.0" height="112.0" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="511.0" y="429.8" font-size="11" font-weight="bold" fill="#14532d" text-anchor="start">Resource smoothing</text><text x="511.0" y="443.6" font-size="11" font-weight="normal" fill="#14532d" text-anchor="start">Uses free and total float only, so the critical path does not change and the end date is not</text><text x="511.0" y="457.3" font-size="11" font-weight="normal" fill="#14532d" text-anchor="start">delayed; limits resource peaks within float. It may not fix every peak.</text></svg>