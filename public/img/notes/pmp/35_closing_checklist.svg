<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 534" width="980" height="534" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">What to conclude when closing a project or phase</title><desc id="d">Six groups of closing activities from PMBOK 8: scope and deliverables; financial closure; procurement and contracts; people and resources; knowledge, records and lessons; obligations, risks and benefits. A final report summarizes performance against scope, quality, cost, schedule, benefits and business needs, and the risks and issues met.</desc><defs></defs><rect x="0.75" y="0.75" width="978.5" height="532.5" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><text x="20.0" y="28.0" font-size="18" font-weight="bold" fill="#1f2937" text-anchor="start">Conclude activities: what to close</text><text x="20.0" y="48.0" font-size="12" font-weight="normal" fill="#6b7280" text-anchor="start">Work through each group; the final report records the result</text><rect x="22.0" y="62.0" width="300.0" height="152.0" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="34.0" y="84.0" font-size="12.5" font-weight="bold" fill="#1e3a8a" text-anchor="start">Scope and deliverables</text><text x="34.0" y="104.0" font-size="10.8" font-weight="bold" fill="#6b7280" text-anchor="start">•</text><text x="46.0" y="104.0" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">Deliverables accepted formally by the customer</text><text x="34.0" y="121.2" font-size="10.8" font-weight="bold" fill="#6b7280" text-anchor="start">•</text><text x="46.0" y="121.2" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">Documents updated; all issues resolved or transferred</text><text x="34.0" y="138.4" font-size="10.8" font-weight="bold" fill="#6b7280" text-anchor="start">•</text><text x="46.0" y="138.4" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">Final product, service or result transitioned</text><rect x="340.0" y="62.0" width="300.0" height="152.0" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="352.0" y="84.0" font-size="12.5" font-weight="bold" fill="#14532d" text-anchor="start">Financial closure</text><text x="352.0" y="104.0" font-size="10.8" font-weight="bold" fill="#6b7280" text-anchor="start">•</text><text x="364.0" y="104.0" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">All costs charged to the project</text><text x="352.0" y="121.2" font-size="10.8" font-weight="bold" fill="#6b7280" text-anchor="start">•</text><text x="364.0" y="121.2" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">Project accounts closed; unused funds and reserves</text><text x="364.0" y="134.4" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">released</text><text x="352.0" y="151.5" font-size="10.8" font-weight="bold" fill="#6b7280" text-anchor="start">•</text><text x="364.0" y="151.5" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">Final cost report prepared</text><rect x="658.0" y="62.0" width="300.0" height="152.0" rx="10" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.6"/><text x="670.0" y="84.0" font-size="12.5" font-weight="bold" fill="#134e4a" text-anchor="start">Procurement and contracts</text><text x="670.0" y="104.0" font-size="10.8" font-weight="bold" fill="#6b7280" text-anchor="start">•</text><text x="682.0" y="104.0" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">Formal acceptance of the seller's work</text><text x="670.0" y="121.2" font-size="10.8" font-weight="bold" fill="#6b7280" text-anchor="start">•</text><text x="682.0" y="121.2" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">Open claims, guarantees and warranties finalized</text><text x="670.0" y="138.4" font-size="10.8" font-weight="bold" fill="#6b7280" text-anchor="start">•</text><text x="682.0" y="138.4" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">Invoices paid; disputes resolved or referred to the</text><text x="682.0" y="151.5" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">dispute board</text><text x="670.0" y="168.7" font-size="10.8" font-weight="bold" fill="#6b7280" text-anchor="start">•</text><text x="682.0" y="168.7" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">Records updated and archived</text><rect x="22.0" y="226.0" width="300.0" height="152.0" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.6"/><text x="34.0" y="248.0" font-size="12.5" font-weight="bold" fill="#4c1d95" text-anchor="start">People and resources</text><text x="34.0" y="268.0" font-size="10.8" font-weight="bold" fill="#6b7280" text-anchor="start">•</text><text x="46.0" y="268.0" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">Reassign or release project personnel</text><text x="34.0" y="285.2" font-size="10.8" font-weight="bold" fill="#6b7280" text-anchor="start">•</text><text x="46.0" y="285.2" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">Address excess project materials</text><text x="34.0" y="302.4" font-size="10.8" font-weight="bold" fill="#6b7280" text-anchor="start">•</text><text x="46.0" y="302.4" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">Release facilities, equipment and other resources</text><rect x="340.0" y="226.0" width="300.0" height="152.0" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="352.0" y="248.0" font-size="12.5" font-weight="bold" fill="#78350f" text-anchor="start">Knowledge, records and lessons</text><text x="352.0" y="268.0" font-size="10.8" font-weight="bold" fill="#6b7280" text-anchor="start">•</text><text x="364.0" y="268.0" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">Final lessons learned session and retrospectives</text><text x="352.0" y="285.2" font-size="10.8" font-weight="bold" fill="#6b7280" text-anchor="start">•</text><text x="364.0" y="285.2" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">Collect and audit project records; archive for future use</text><text x="352.0" y="302.4" font-size="10.8" font-weight="bold" fill="#6b7280" text-anchor="start">•</text><text x="364.0" y="302.4" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">Update OPAs; forward policy and procedure</text><text x="364.0" y="315.5" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">suggestions</text><rect x="658.0" y="226.0" width="300.0" height="152.0" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="1.6"/><text x="670.0" y="248.0" font-size="12.5" font-weight="bold" fill="#7f1d1d" text-anchor="start">Obligations, risks and benefits</text><text x="670.0" y="268.0" font-size="10.8" font-weight="bold" fill="#6b7280" text-anchor="start">•</text><text x="682.0" y="268.0" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">Contractual, regulatory, legal, social and</text><text x="682.0" y="281.2" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">environmental obligations met</text><text x="670.0" y="298.4" font-size="10.8" font-weight="bold" fill="#6b7280" text-anchor="start">•</text><text x="682.0" y="298.4" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">Outstanding risks accepted or transitioned to</text><text x="682.0" y="311.5" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">operations</text><text x="670.0" y="328.7" font-size="10.8" font-weight="bold" fill="#6b7280" text-anchor="start">•</text><text x="682.0" y="328.7" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">Measurable value delivered and a plan to maintain it;</text><text x="682.0" y="341.9" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">benefits owner named; stakeholder satisfaction</text><text x="682.0" y="355.1" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">measured</text><rect x="22.0" y="394.0" width="936.0" height="112.0" rx="10" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.6"/><text x="34.0" y="416.0" font-size="12.5" font-weight="bold" fill="#374151" text-anchor="start">Final report (summary of project performance)</text><text x="34.0" y="436.0" font-size="10.4" font-weight="bold" fill="#6b7280" text-anchor="start">•</text><text x="46.0" y="436.0" font-size="10.4" font-weight="normal" fill="#1f2937" text-anchor="start">Project or phase summary</text><text x="34.0" y="451.5" font-size="10.4" font-weight="bold" fill="#6b7280" text-anchor="start">•</text><text x="46.0" y="451.5" font-size="10.4" font-weight="normal" fill="#1f2937" text-anchor="start">Scope objectives and evidence that completion criteria</text><text x="46.0" y="464.0" font-size="10.4" font-weight="normal" fill="#1f2937" text-anchor="start">were met</text><text x="34.0" y="479.4" font-size="10.4" font-weight="bold" fill="#6b7280" text-anchor="start">•</text><text x="46.0" y="479.4" font-size="10.4" font-weight="normal" fill="#1f2937" text-anchor="start">Quality objectives, verification and variances</text><text x="340.0" y="436.0" font-size="10.4" font-weight="bold" fill="#6b7280" text-anchor="start">•</text><text x="352.0" y="436.0" font-size="10.4" font-weight="normal" fill="#1f2937" text-anchor="start">Cost objectives, actual cost and reasons for variances</text><text x="340.0" y="451.5" font-size="10.4" font-weight="bold" fill="#6b7280" text-anchor="start">•</text><text x="352.0" y="451.5" font-size="10.4" font-weight="normal" fill="#1f2937" text-anchor="start">Schedule objectives and actual dates</text><text x="340.0" y="467.0" font-size="10.4" font-weight="bold" fill="#6b7280" text-anchor="start">•</text><text x="352.0" y="467.0" font-size="10.4" font-weight="normal" fill="#1f2937" text-anchor="start">Validation of the final product, service or result</text><text x="646.0" y="436.0" font-size="10.4" font-weight="bold" fill="#6b7280" text-anchor="start">•</text><text x="658.0" y="436.0" font-size="10.4" font-weight="normal" fill="#1f2937" text-anchor="start">Benefits and business needs achieved, or an estimate of</text><text x="658.0" y="448.5" font-size="10.4" font-weight="normal" fill="#1f2937" text-anchor="start">when they will be</text><text x="646.0" y="464.0" font-size="10.4" font-weight="bold" fill="#6b7280" text-anchor="start">•</text><text x="658.0" y="464.0" font-size="10.4" font-weight="normal" fill="#1f2937" text-anchor="start">Risks and issues met and how they were handled</text></svg>