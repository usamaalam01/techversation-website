<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 572" width="980" height="572" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">Triage an external change</title><desc id="d">Six kinds of external change and the typical response: confirmed, mandatory and dated changes are classified and prioritized now; proposed or uncertain changes are monitored with triggers and options; changes that threaten the business case are revalidated with the sponsor; opportunities get an opportunity response; supply and cost changes get an impact assessment and alternatives; changes to how work is done adapt the ways of working.</desc><defs></defs><rect x="0.75" y="0.75" width="978.5" height="570.5" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><text x="20.0" y="28.0" font-size="18" font-weight="bold" fill="#1f2937" text-anchor="start">Triage an external change</text><text x="20.0" y="48.0" font-size="12" font-weight="normal" fill="#6b7280" text-anchor="start">Ask what kind of change it is, then respond in proportion to how certain, how dated and how valuable it is</text><text x="28.0" y="76.0" font-size="11.5" font-weight="bold" fill="#6b7280" text-anchor="start">Kind of change</text><text x="238.0" y="76.0" font-size="11.5" font-weight="bold" fill="#6b7280" text-anchor="start">Typical signal</text><text x="468.0" y="76.0" font-size="11.5" font-weight="bold" fill="#6b7280" text-anchor="start">Typical response</text><rect x="22.0" y="86.0" width="936.0" height="64.0" rx="10" fill="#ffffff" stroke="#dc2626" stroke-width="1.5"/><rect x="22.0" y="86.0" width="200.0" height="64.0" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/><text x="34.0" y="114.5" font-size="12" font-weight="bold" fill="#7f1d1d" text-anchor="start">Confirmed, mandatory and</text><text x="34.0" y="129.5" font-size="12" font-weight="bold" fill="#7f1d1d" text-anchor="start">dated</text><text x="240.0" y="107.0" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">A law passed, a standard in force, a ban</text><text x="240.0" y="120.5" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">announced with an effective date</text><text x="470.0" y="107.0" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">Classify the compliance requirement; assess the impact; reprioritize the backlog or scope now by</text><text x="470.0" y="120.5" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">effective date; plan how compliance will be verified (Topic 23)</text><rect x="22.0" y="158.0" width="936.0" height="64.0" rx="10" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5"/><rect x="22.0" y="158.0" width="200.0" height="64.0" rx="10" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/><text x="34.0" y="194.0" font-size="12" font-weight="bold" fill="#374151" text-anchor="start">Proposed or uncertain</text><text x="240.0" y="179.0" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">A draft rule, a trade agreement under</text><text x="240.0" y="192.5" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">negotiation, a forecast</text><text x="470.0" y="179.0" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">Monitor and assess the potential impact early; define triggers and options; record as a risk; do not</text><text x="470.0" y="192.5" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">cut scope on speculation and do not ignore it</text><rect x="22.0" y="230.0" width="936.0" height="64.0" rx="10" fill="#ffffff" stroke="#d97706" stroke-width="1.5"/><rect x="22.0" y="230.0" width="200.0" height="64.0" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/><text x="34.0" y="258.5" font-size="12" font-weight="bold" fill="#78350f" text-anchor="start">Threatens value or the</text><text x="34.0" y="273.5" font-size="12" font-weight="bold" fill="#78350f" text-anchor="start">business case</text><text x="240.0" y="251.0" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">A target market closes, a competitor</text><text x="240.0" y="264.5" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">launches, price forecasts fall</text><text x="470.0" y="251.0" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">Revalidate the business case with the sponsor even if cost and schedule are on track; continue,</text><text x="470.0" y="264.5" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">adapt or stop through governance</text><rect x="22.0" y="302.0" width="936.0" height="64.0" rx="10" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/><rect x="22.0" y="302.0" width="200.0" height="64.0" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/><text x="34.0" y="338.0" font-size="12" font-weight="bold" fill="#14532d" text-anchor="start">An opportunity</text><text x="240.0" y="323.0" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">A new technology or an opening market</text><text x="240.0" y="336.5" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">could cut cost or time</text><text x="470.0" y="323.0" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">Evaluate it; plan an opportunity response (exploit, enhance, share or escalate); pilot; update the</text><text x="470.0" y="336.5" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">business case if adopted</text><rect x="22.0" y="374.0" width="936.0" height="64.0" rx="10" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/><rect x="22.0" y="374.0" width="200.0" height="64.0" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/><text x="34.0" y="410.0" font-size="12" font-weight="bold" fill="#4c1d95" text-anchor="start">Affects supply or cost</text><text x="240.0" y="395.0" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">Sanctions, tariffs, currency swings,</text><text x="240.0" y="408.5" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">shortages</text><text x="470.0" y="395.0" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">Assess the supply and cost impact; plan alternatives; update estimates, contracts and the risk</text><text x="470.0" y="408.5" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">register</text><rect x="22.0" y="446.0" width="936.0" height="64.0" rx="10" fill="#ffffff" stroke="#0d9488" stroke-width="1.5"/><rect x="22.0" y="446.0" width="200.0" height="64.0" rx="10" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.5"/><text x="34.0" y="482.0" font-size="12" font-weight="bold" fill="#134e4a" text-anchor="start">Affects how work is done</text><text x="240.0" y="467.0" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">Public health rules, working conditions,</text><text x="240.0" y="480.5" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">weather</text><text x="470.0" y="467.0" font-size="10.8" font-weight="normal" fill="#1f2937" text-anchor="start">Adapt ways of working, schedule and safety measures; communicate to the team and stakeholders</text><rect x="22.0" y="520.0" width="936.0" height="37.4" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/><text x="34.0" y="540.0" font-size="11" font-weight="bold" fill="#78350f" text-anchor="start">Good performance against the plan does not prove the plan is still worth doing: external change can erode value while cost and schedule stay green.</text></svg>