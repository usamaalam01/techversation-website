<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 480" width="880" height="480" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">m15-pairs</title><desc id="d">Seven look-alike pairs and the difference between them in one line.</desc><defs></defs><rect x="0.75" y="0.75" width="878.5" height="478.5" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><rect x="306.0" y="8.0" width="566.0" height="42.0" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="589.0" y="34.5" font-size="17" font-weight="bold" fill="#1e3a8a" text-anchor="middle">The difference</text><rect x="8.0" y="58.0" width="290.0" height="52.0" rx="8" fill="#1e3a8a" stroke="#1e3a8a" stroke-width="1.6"/><text x="153.0" y="89.2" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">DPIA, FRIA</text><rect x="306.0" y="58.0" width="566.0" height="52.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="316.0" y="89.2" font-size="16" font-weight="normal" fill="#1f2937" text-anchor="start">personal data rights (GDPR); rights risk by certain deployers (AI Act)</text><rect x="8.0" y="118.0" width="290.0" height="52.0" rx="8" fill="#1e3a8a" stroke="#1e3a8a" stroke-width="1.6"/><text x="153.0" y="149.2" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">Provider, deployer</text><rect x="306.0" y="118.0" width="566.0" height="52.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="316.0" y="149.2" font-size="16" font-weight="normal" fill="#1f2937" text-anchor="start">builds and places on the market; uses</text><rect x="8.0" y="178.0" width="290.0" height="52.0" rx="8" fill="#1e3a8a" stroke="#1e3a8a" stroke-width="1.6"/><text x="153.0" y="209.2" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">Controller, processor</text><rect x="306.0" y="178.0" width="566.0" height="52.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="316.0" y="209.2" font-size="16" font-weight="normal" fill="#1f2937" text-anchor="start">decides purposes; processes on behalf</text><rect x="8.0" y="238.0" width="290.0" height="52.0" rx="8" fill="#1e3a8a" stroke="#1e3a8a" stroke-width="1.6"/><text x="153.0" y="269.2" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">Red team, audit, threat model</text><rect x="306.0" y="238.0" width="566.0" height="52.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="316.0" y="269.2" font-size="16" font-weight="normal" fill="#1f2937" text-anchor="start">try to break it; check compliance; map attack paths</text><rect x="8.0" y="298.0" width="290.0" height="52.0" rx="8" fill="#1e3a8a" stroke="#1e3a8a" stroke-width="1.6"/><text x="153.0" y="329.2" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">Incident, issue, risk</text><rect x="306.0" y="298.0" width="566.0" height="52.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="316.0" y="329.2" font-size="16" font-weight="normal" fill="#1f2937" text-anchor="start">it happened and harmed; a problem found; it may happen</text><rect x="8.0" y="358.0" width="290.0" height="52.0" rx="8" fill="#1e3a8a" stroke="#1e3a8a" stroke-width="1.6"/><text x="153.0" y="389.2" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">Deactivate, localize</text><rect x="306.0" y="358.0" width="566.0" height="52.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="316.0" y="389.2" font-size="16" font-weight="normal" fill="#1f2937" text-anchor="start">switch off; limit by region, group or feature</text><rect x="8.0" y="418.0" width="290.0" height="52.0" rx="8" fill="#1e3a8a" stroke="#1e3a8a" stroke-width="1.6"/><text x="153.0" y="449.2" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">NIST, ISO, OECD</text><rect x="306.0" y="418.0" width="566.0" height="52.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="316.0" y="449.2" font-size="16" font-weight="normal" fill="#1f2937" text-anchor="start">voluntary framework; certifiable standard; non-binding principles</text></svg>