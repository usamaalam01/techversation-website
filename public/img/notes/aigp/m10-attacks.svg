<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 178" width="880" height="178" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">m10-attacks</title><desc id="d">Five AI-specific attacks: data poisoning, evasion, model extraction, inversion and membership inference, prompt injection.</desc><defs></defs><rect x="0.75" y="0.75" width="878.5" height="176.5" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><rect x="8.0" y="8.0" width="166.4" height="160.0" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.6"/><text x="91.2" y="73.2" font-size="16" font-weight="bold" fill="#7f1d1d" text-anchor="middle">Data poisoning</text><text x="91.2" y="93.2" font-size="16" font-weight="normal" fill="#7f1d1d" text-anchor="middle">tamper with training</text><text x="91.2" y="113.2" font-size="16" font-weight="normal" fill="#7f1d1d" text-anchor="middle">data</text><rect x="182.4" y="8.0" width="166.4" height="160.0" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="265.6" y="73.2" font-size="16" font-weight="bold" fill="#78350f" text-anchor="middle">Evasion</text><text x="265.6" y="93.2" font-size="16" font-weight="normal" fill="#78350f" text-anchor="middle">inputs crafted to</text><text x="265.6" y="113.2" font-size="16" font-weight="normal" fill="#78350f" text-anchor="middle">cause mistakes</text><rect x="356.8" y="8.0" width="166.4" height="160.0" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.6"/><text x="440.0" y="73.2" font-size="16" font-weight="bold" fill="#4c1d95" text-anchor="middle">Model extraction</text><text x="440.0" y="93.2" font-size="16" font-weight="normal" fill="#4c1d95" text-anchor="middle">copy a model by</text><text x="440.0" y="113.2" font-size="16" font-weight="normal" fill="#4c1d95" text-anchor="middle">querying it</text><rect x="531.2" y="8.0" width="166.4" height="160.0" rx="8" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.6"/><text x="614.4" y="53.2" font-size="16" font-weight="bold" fill="#134e4a" text-anchor="middle">Inversion,</text><text x="614.4" y="73.2" font-size="16" font-weight="bold" fill="#134e4a" text-anchor="middle">membership</text><text x="614.4" y="93.2" font-size="16" font-weight="bold" fill="#134e4a" text-anchor="middle">inference</text><text x="614.4" y="113.2" font-size="16" font-weight="normal" fill="#134e4a" text-anchor="middle">recover or detect</text><text x="614.4" y="133.2" font-size="16" font-weight="normal" fill="#134e4a" text-anchor="middle">training data</text><rect x="705.6" y="8.0" width="166.4" height="160.0" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="788.8" y="63.2" font-size="16" font-weight="bold" fill="#1e3a8a" text-anchor="middle">Prompt injection</text><text x="788.8" y="83.2" font-size="16" font-weight="normal" fill="#1e3a8a" text-anchor="middle">hidden instructions</text><text x="788.8" y="103.2" font-size="16" font-weight="normal" fill="#1e3a8a" text-anchor="middle">hijack a language</text><text x="788.8" y="123.2" font-size="16" font-weight="normal" fill="#1e3a8a" text-anchor="middle">model</text></svg>