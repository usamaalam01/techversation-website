<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 275.9" width="880" height="275.9" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">m12-opportunities</title><desc id="d">Opportunities of running your own model against its costs and duties.</desc><defs></defs><rect x="0.75" y="0.75" width="878.5" height="274.4" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><rect x="8.0" y="8.0" width="420.0" height="52.0" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="218.0" y="40.5" font-size="20" font-weight="bold" fill="#14532d" text-anchor="middle">Opportunities</text><rect x="8.0" y="66.0" width="420.0" height="199.9" rx="10" fill="#ffffff" stroke="#16a34a" stroke-width="1.8"/><circle cx="27.0" cy="92.0" r="3.4" fill="#16a34a" stroke="#16a34a" stroke-width="1"/><text x="44.0" y="98.0" font-size="19" font-weight="normal" fill="#1f2937" text-anchor="start">control of data, behavior and updates</text><circle cx="27.0" cy="125.2" r="3.4" fill="#16a34a" stroke="#16a34a" stroke-width="1"/><text x="44.0" y="131.2" font-size="19" font-weight="normal" fill="#1f2937" text-anchor="start">better fit to your domain</text><circle cx="27.0" cy="158.3" r="3.4" fill="#16a34a" stroke="#16a34a" stroke-width="1"/><text x="44.0" y="164.4" font-size="19" font-weight="normal" fill="#1f2937" text-anchor="start">ownership of the resulting IP</text><circle cx="27.0" cy="191.5" r="3.4" fill="#16a34a" stroke="#16a34a" stroke-width="1"/><text x="44.0" y="197.6" font-size="19" font-weight="normal" fill="#1f2937" text-anchor="start">less dependence on a vendor</text><circle cx="27.0" cy="224.7" r="3.4" fill="#16a34a" stroke="#16a34a" stroke-width="1"/><text x="44.0" y="230.8" font-size="19" font-weight="normal" fill="#1f2937" text-anchor="start">possible lower cost at scale</text><rect x="452.0" y="8.0" width="420.0" height="52.0" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.6"/><text x="662.0" y="40.5" font-size="20" font-weight="bold" fill="#7f1d1d" text-anchor="middle">Costs and duties</text><rect x="452.0" y="66.0" width="420.0" height="199.9" rx="10" fill="#ffffff" stroke="#dc2626" stroke-width="1.8"/><circle cx="471.0" cy="92.0" r="3.4" fill="#dc2626" stroke="#dc2626" stroke-width="1"/><text x="488.0" y="98.0" font-size="19" font-weight="normal" fill="#1f2937" text-anchor="start">the provider's obligations</text><circle cx="471.0" cy="125.2" r="3.4" fill="#dc2626" stroke="#dc2626" stroke-width="1"/><text x="488.0" y="131.2" font-size="19" font-weight="normal" fill="#1f2937" text-anchor="start">higher liability</text><circle cx="471.0" cy="158.3" r="3.4" fill="#dc2626" stroke="#dc2626" stroke-width="1"/><text x="488.0" y="164.4" font-size="19" font-weight="normal" fill="#1f2937" text-anchor="start">talent and infrastructure</text><circle cx="471.0" cy="191.5" r="3.4" fill="#dc2626" stroke="#dc2626" stroke-width="1"/><text x="488.0" y="197.6" font-size="19" font-weight="normal" fill="#1f2937" text-anchor="start">retraining and monitoring</text><circle cx="471.0" cy="224.7" r="3.4" fill="#dc2626" stroke="#dc2626" stroke-width="1"/><text x="488.0" y="230.8" font-size="19" font-weight="normal" fill="#1f2937" text-anchor="start">security of weights and data</text></svg>