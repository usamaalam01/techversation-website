<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 392" width="880" height="392" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">m03-supply-chain</title><desc id="d">Five supplier layers sit under every AI system: data, model, components, cloud and the vendor's application.</desc><defs><marker id="ah0" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/></marker></defs><rect x="0.75" y="0.75" width="878.5" height="390.5" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><rect x="8.0" y="8.0" width="230.0" height="54.0" rx="8" fill="#1e3a8a" stroke="#1e3a8a" stroke-width="1.6"/><text x="123.0" y="40.5" font-size="17" font-weight="bold" fill="#ffffff" text-anchor="middle">Helios</text><rect x="248.0" y="8.0" width="400.0" height="54.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="264.0" y="40.2" font-size="16" font-weight="normal" fill="#1f2937" text-anchor="start">the organization that uses the system</text><rect x="8.0" y="72.0" width="230.0" height="54.0" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="123.0" y="104.5" font-size="17" font-weight="bold" fill="#1e3a8a" text-anchor="middle">Vendor application</text><rect x="248.0" y="72.0" width="400.0" height="54.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="264.0" y="104.2" font-size="16" font-weight="normal" fill="#1f2937" text-anchor="start">the product you buy or subscribe to</text><rect x="8.0" y="136.0" width="230.0" height="54.0" rx="8" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.6"/><text x="123.0" y="168.5" font-size="17" font-weight="bold" fill="#134e4a" text-anchor="middle">Cloud and hosting</text><rect x="248.0" y="136.0" width="400.0" height="54.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="264.0" y="168.2" font-size="16" font-weight="normal" fill="#1f2937" text-anchor="start">where it runs</text><rect x="8.0" y="200.0" width="230.0" height="54.0" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="123.0" y="232.5" font-size="17" font-weight="bold" fill="#14532d" text-anchor="middle">Components and tools</text><rect x="248.0" y="200.0" width="400.0" height="54.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="264.0" y="232.2" font-size="16" font-weight="normal" fill="#1f2937" text-anchor="start">libraries, plug-ins, APIs</text><rect x="8.0" y="264.0" width="230.0" height="54.0" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="123.0" y="296.5" font-size="17" font-weight="bold" fill="#78350f" text-anchor="middle">Pretrained model</text><rect x="248.0" y="264.0" width="400.0" height="54.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="264.0" y="296.2" font-size="16" font-weight="normal" fill="#1f2937" text-anchor="start">built by someone else</text><rect x="8.0" y="328.0" width="230.0" height="54.0" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.6"/><text x="123.0" y="360.5" font-size="17" font-weight="bold" fill="#4c1d95" text-anchor="middle">Data and labeling</text><rect x="248.0" y="328.0" width="400.0" height="54.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="264.0" y="360.2" font-size="16" font-weight="normal" fill="#1f2937" text-anchor="start">collected and prepared by others</text><line x1="700.0" y1="372.0" x2="700.0" y2="14.0" stroke="#b91c1c" stroke-width="5" marker-end="url(#ah0)"/><text x="724.0" y="112.0" font-size="18" font-weight="bold" fill="#7f1d1d" text-anchor="start">You inherit</text><text x="724.0" y="138.0" font-size="18" font-weight="bold" fill="#7f1d1d" text-anchor="start">their quality,</text><text x="724.0" y="164.0" font-size="18" font-weight="bold" fill="#7f1d1d" text-anchor="start">bias, security</text><text x="724.0" y="190.0" font-size="18" font-weight="bold" fill="#7f1d1d" text-anchor="start">and legal</text><text x="724.0" y="216.0" font-size="18" font-weight="bold" fill="#7f1d1d" text-anchor="start">exposure;</text><text x="724.0" y="242.0" font-size="18" font-weight="bold" fill="#7f1d1d" text-anchor="start">changes can</text><text x="724.0" y="268.0" font-size="18" font-weight="bold" fill="#7f1d1d" text-anchor="start">arrive unseen</text></svg>