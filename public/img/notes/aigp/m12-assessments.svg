<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 370" width="880" height="370" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">m12-assessments</title><desc id="d">The design-stage assessment covers a planned use case; the assessment of the chosen system covers the real product, version and setting.</desc><defs></defs><rect x="0.75" y="0.75" width="878.5" height="368.5" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><rect x="118.0" y="8.0" width="372.0" height="48.0" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.6"/><text x="304.0" y="37.8" font-size="18" font-weight="bold" fill="#374151" text-anchor="middle">Design stage (module 8)</text><rect x="500.0" y="8.0" width="372.0" height="48.0" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="686.0" y="37.8" font-size="18" font-weight="bold" fill="#14532d" text-anchor="middle">Chosen system (module 12)</text><text x="102.0" y="104.0" font-size="15" font-weight="bold" fill="#6b7280" text-anchor="end">When</text><rect x="118.0" y="66.0" width="372.0" height="66.0" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.6"/><text x="130.0" y="104.5" font-size="17" font-weight="normal" fill="#374151" text-anchor="start">before the system is built or bought</text><rect x="500.0" y="66.0" width="372.0" height="66.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="512.0" y="104.5" font-size="17" font-weight="normal" fill="#1f2937" text-anchor="start">after one is chosen, before first use</text><text x="102.0" y="180.0" font-size="15" font-weight="bold" fill="#6b7280" text-anchor="end">What</text><rect x="118.0" y="142.0" width="372.0" height="66.0" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.6"/><text x="130.0" y="180.5" font-size="17" font-weight="normal" fill="#374151" text-anchor="start">a planned use case</text><rect x="500.0" y="142.0" width="372.0" height="66.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="512.0" y="180.5" font-size="17" font-weight="normal" fill="#1f2937" text-anchor="start">the actual product, version and settings</text><text x="102.0" y="256.0" font-size="15" font-weight="bold" fill="#6b7280" text-anchor="end">Evidence</text><rect x="118.0" y="218.0" width="372.0" height="66.0" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.6"/><text x="130.0" y="256.5" font-size="17" font-weight="normal" fill="#374151" text-anchor="start">your assumptions and early data</text><rect x="500.0" y="218.0" width="372.0" height="66.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="512.0" y="256.5" font-size="17" font-weight="normal" fill="#1f2937" text-anchor="start">provider documents and your own tests</text><text x="102.0" y="332.0" font-size="15" font-weight="bold" fill="#6b7280" text-anchor="end">Who</text><rect x="118.0" y="294.0" width="372.0" height="66.0" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.6"/><text x="130.0" y="332.5" font-size="17" font-weight="normal" fill="#374151" text-anchor="start">use-case owner with the committee</text><rect x="500.0" y="294.0" width="372.0" height="66.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="512.0" y="332.5" font-size="17" font-weight="normal" fill="#1f2937" text-anchor="start">deployer, with input from the provider</text></svg>