<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 300" width="880" height="300" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">m01-harms-matrix</title><desc id="d">AI harms by who bears them: individuals, groups, organizations and society, with examples.</desc><defs></defs><rect x="0.75" y="0.75" width="878.5" height="298.5" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><rect x="8.0" y="8.0" width="205.5" height="52.0" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="110.8" y="39.8" font-size="18" font-weight="bold" fill="#1e3a8a" text-anchor="middle">Individuals</text><rect x="8.0" y="68.0" width="205.5" height="156.0" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="1.8"/><circle cx="27.0" cy="91.5" r="3.4" fill="#2563eb" stroke="#2563eb" stroke-width="1"/><text x="44.0" y="96.2" font-size="15" font-weight="normal" fill="#1f2937" text-anchor="start">A job or loan wrongly</text><text x="44.0" y="114.5" font-size="15" font-weight="normal" fill="#1f2937" text-anchor="start">refused</text><circle cx="27.0" cy="140.0" r="3.4" fill="#2563eb" stroke="#2563eb" stroke-width="1"/><text x="44.0" y="144.8" font-size="15" font-weight="normal" fill="#1f2937" text-anchor="start">Privacy lost</text><circle cx="27.0" cy="170.3" r="3.4" fill="#2563eb" stroke="#2563eb" stroke-width="1"/><text x="44.0" y="175.2" font-size="15" font-weight="normal" fill="#1f2937" text-anchor="start">Physical or</text><text x="44.0" y="193.5" font-size="15" font-weight="normal" fill="#1f2937" text-anchor="start">psychological harm</text><rect x="227.5" y="8.0" width="205.5" height="52.0" rx="8" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.6"/><text x="330.2" y="39.8" font-size="18" font-weight="bold" fill="#134e4a" text-anchor="middle">Groups</text><rect x="227.5" y="68.0" width="205.5" height="156.0" rx="10" fill="#ffffff" stroke="#0d9488" stroke-width="1.8"/><circle cx="246.5" cy="91.5" r="3.4" fill="#0d9488" stroke="#0d9488" stroke-width="1"/><text x="263.5" y="96.2" font-size="15" font-weight="normal" fill="#1f2937" text-anchor="start">Discrimination against</text><text x="263.5" y="114.5" font-size="15" font-weight="normal" fill="#1f2937" text-anchor="start">a sub-group</text><circle cx="246.5" cy="140.0" r="3.4" fill="#0d9488" stroke="#0d9488" stroke-width="1"/><text x="263.5" y="144.8" font-size="15" font-weight="normal" fill="#1f2937" text-anchor="start">Stereotyping</text><circle cx="246.5" cy="170.3" r="3.4" fill="#0d9488" stroke="#0d9488" stroke-width="1"/><text x="263.5" y="175.2" font-size="15" font-weight="normal" fill="#1f2937" text-anchor="start">Unequal error rates</text><rect x="447.0" y="8.0" width="205.5" height="52.0" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="549.8" y="39.8" font-size="18" font-weight="bold" fill="#78350f" text-anchor="middle">Organizations</text><rect x="447.0" y="68.0" width="205.5" height="156.0" rx="10" fill="#ffffff" stroke="#d97706" stroke-width="1.8"/><circle cx="466.0" cy="91.5" r="3.4" fill="#d97706" stroke="#d97706" stroke-width="1"/><text x="483.0" y="96.2" font-size="15" font-weight="normal" fill="#1f2937" text-anchor="start">Disrupted operations</text><circle cx="466.0" cy="121.8" r="3.4" fill="#d97706" stroke="#d97706" stroke-width="1"/><text x="483.0" y="126.5" font-size="15" font-weight="normal" fill="#1f2937" text-anchor="start">Breaches, monetary</text><text x="483.0" y="144.8" font-size="15" font-weight="normal" fill="#1f2937" text-anchor="start">loss</text><circle cx="466.0" cy="170.3" r="3.4" fill="#d97706" stroke="#d97706" stroke-width="1"/><text x="483.0" y="175.2" font-size="15" font-weight="normal" fill="#1f2937" text-anchor="start">Damaged reputation</text><rect x="666.5" y="8.0" width="205.5" height="52.0" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.6"/><text x="769.2" y="39.8" font-size="18" font-weight="bold" fill="#4c1d95" text-anchor="middle">Society</text><rect x="666.5" y="68.0" width="205.5" height="156.0" rx="10" fill="#ffffff" stroke="#7c3aed" stroke-width="1.8"/><circle cx="685.5" cy="91.5" r="3.4" fill="#7c3aed" stroke="#7c3aed" stroke-width="1"/><text x="702.5" y="96.2" font-size="15" font-weight="normal" fill="#1f2937" text-anchor="start">Weaker democratic</text><text x="702.5" y="114.5" font-size="15" font-weight="normal" fill="#1f2937" text-anchor="start">participation</text><circle cx="685.5" cy="140.0" r="3.4" fill="#7c3aed" stroke="#7c3aed" stroke-width="1"/><text x="702.5" y="144.8" font-size="15" font-weight="normal" fill="#1f2937" text-anchor="start">Unequal access to</text><text x="702.5" y="163.2" font-size="15" font-weight="normal" fill="#1f2937" text-anchor="start">education</text><circle cx="685.5" cy="188.7" r="3.4" fill="#7c3aed" stroke="#7c3aed" stroke-width="1"/><text x="702.5" y="193.5" font-size="15" font-weight="normal" fill="#1f2937" text-anchor="start">Disinformation at scale</text><rect x="8.0" y="234.0" width="864.0" height="56.0" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.6"/><text x="440.0" y="266.9" font-size="15" font-weight="normal" fill="#374151" text-anchor="middle">Also: ecosystems, meaning connected systems, supply chains, natural resources and the environment</text></svg>