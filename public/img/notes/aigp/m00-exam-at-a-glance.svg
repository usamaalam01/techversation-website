<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 302" width="880" height="302" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">m00-exam-at-a-glance</title><desc id="d">The exam in six numbers: 100 items, 2.75 hours, a 15-minute break, a pass mark of 300, a scale of 100 to 500, one point each.</desc><defs></defs><rect x="0.75" y="0.75" width="878.5" height="300.5" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><rect x="8.0" y="8.0" width="278.7" height="136.0" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="1.8"/><text x="147.3" y="78.7" font-size="44" font-weight="bold" fill="#1e3a8a" text-anchor="middle">100</text><text x="147.3" y="104.7" font-size="17" font-weight="normal" fill="#1e3a8a" text-anchor="middle">items, all multiple choice, with</text><text x="147.3" y="125.1" font-size="17" font-weight="normal" fill="#1e3a8a" text-anchor="middle">case studies</text><rect x="300.7" y="8.0" width="278.7" height="136.0" rx="12" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.8"/><text x="440.0" y="78.7" font-size="44" font-weight="bold" fill="#134e4a" text-anchor="middle">2.75 h</text><text x="440.0" y="104.7" font-size="17" font-weight="normal" fill="#134e4a" text-anchor="middle">of testing time</text><rect x="593.3" y="8.0" width="278.7" height="136.0" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="1.8"/><text x="732.7" y="78.7" font-size="44" font-weight="bold" fill="#14532d" text-anchor="middle">15 min</text><text x="732.7" y="104.7" font-size="17" font-weight="normal" fill="#14532d" text-anchor="middle">break halfway through</text><rect x="8.0" y="158.0" width="278.7" height="136.0" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="1.8"/><text x="147.3" y="228.7" font-size="44" font-weight="bold" fill="#78350f" text-anchor="middle">300</text><text x="147.3" y="254.7" font-size="17" font-weight="normal" fill="#78350f" text-anchor="middle">is the pass mark</text><rect x="300.7" y="158.0" width="278.7" height="136.0" rx="12" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.8"/><text x="440.0" y="228.7" font-size="44" font-weight="bold" fill="#4c1d95" text-anchor="middle">100–500</text><text x="440.0" y="254.7" font-size="17" font-weight="normal" fill="#4c1d95" text-anchor="middle">is the score scale</text><rect x="593.3" y="158.0" width="278.7" height="136.0" rx="12" fill="#fee2e2" stroke="#dc2626" stroke-width="1.8"/><text x="732.7" y="228.7" font-size="44" font-weight="bold" fill="#7f1d1d" text-anchor="middle">1 point</text><text x="732.7" y="254.7" font-size="17" font-weight="normal" fill="#7f1d1d" text-anchor="middle">per correct answer, no essays</text></svg>