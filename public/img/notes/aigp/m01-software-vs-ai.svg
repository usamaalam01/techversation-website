<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 408" width="880" height="408" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">m01-software-vs-ai</title><desc id="d">Five contrasts between traditional software and AI: logic, output, failure, behavior after release and testing.</desc><defs></defs><rect x="0.75" y="0.75" width="878.5" height="406.5" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><rect x="148.0" y="8.0" width="357.0" height="50.0" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.6"/><text x="326.5" y="38.8" font-size="18" font-weight="bold" fill="#374151" text-anchor="middle">Traditional software</text><rect x="515.0" y="8.0" width="357.0" height="50.0" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="693.5" y="38.8" font-size="18" font-weight="bold" fill="#1e3a8a" text-anchor="middle">AI</text><text x="132.0" y="102.0" font-size="15" font-weight="bold" fill="#6b7280" text-anchor="end">Logic</text><rect x="148.0" y="68.0" width="357.0" height="58.0" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.6"/><text x="160.0" y="102.5" font-size="17" font-weight="normal" fill="#374151" text-anchor="start">written by people</text><rect x="515.0" y="68.0" width="357.0" height="58.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="527.0" y="102.5" font-size="17" font-weight="normal" fill="#1f2937" text-anchor="start">learned from data</text><text x="132.0" y="170.0" font-size="15" font-weight="bold" fill="#6b7280" text-anchor="end">Output</text><rect x="148.0" y="136.0" width="357.0" height="58.0" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.6"/><text x="160.0" y="170.5" font-size="17" font-weight="normal" fill="#374151" text-anchor="start">same input, same output</text><rect x="515.0" y="136.0" width="357.0" height="58.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="527.0" y="170.5" font-size="17" font-weight="normal" fill="#1f2937" text-anchor="start">probabilistic, can vary</text><text x="132.0" y="238.0" font-size="15" font-weight="bold" fill="#6b7280" text-anchor="end">Failure</text><rect x="148.0" y="204.0" width="357.0" height="58.0" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.6"/><text x="160.0" y="238.5" font-size="17" font-weight="normal" fill="#374151" text-anchor="start">a bug to find and fix</text><rect x="515.0" y="204.0" width="357.0" height="58.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="527.0" y="238.5" font-size="17" font-weight="normal" fill="#1f2937" text-anchor="start">an error rate to manage</text><text x="132.0" y="306.0" font-size="15" font-weight="bold" fill="#6b7280" text-anchor="end">After release</text><rect x="148.0" y="272.0" width="357.0" height="58.0" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.6"/><text x="160.0" y="306.5" font-size="17" font-weight="normal" fill="#374151" text-anchor="start">stays as built</text><rect x="515.0" y="272.0" width="357.0" height="58.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="527.0" y="306.5" font-size="17" font-weight="normal" fill="#1f2937" text-anchor="start">can drift as data change</text><text x="132.0" y="374.0" font-size="15" font-weight="bold" fill="#6b7280" text-anchor="end">Testing</text><rect x="148.0" y="340.0" width="357.0" height="58.0" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.6"/><text x="160.0" y="374.5" font-size="17" font-weight="normal" fill="#374151" text-anchor="start">cases with known answers</text><rect x="515.0" y="340.0" width="357.0" height="58.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="527.0" y="374.5" font-size="17" font-weight="normal" fill="#1f2937" text-anchor="start">statistical, on samples</text></svg>