<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 452" width="880" height="452" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">m09-test-types</title><desc id="d">Seven kinds of test and what each checks.</desc><defs></defs><rect x="0.75" y="0.75" width="878.5" height="450.5" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><rect x="186.0" y="8.0" width="686.0" height="42.0" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="529.0" y="34.5" font-size="17" font-weight="bold" fill="#1e3a8a" text-anchor="middle">What it checks</text><rect x="8.0" y="58.0" width="170.0" height="48.0" rx="8" fill="#1e3a8a" stroke="#1e3a8a" stroke-width="1.6"/><text x="93.0" y="87.2" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">Unit</text><rect x="186.0" y="58.0" width="686.0" height="48.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="196.0" y="87.2" font-size="16" font-weight="normal" fill="#1f2937" text-anchor="start">individual components behave correctly</text><rect x="8.0" y="114.0" width="170.0" height="48.0" rx="8" fill="#1e3a8a" stroke="#1e3a8a" stroke-width="1.6"/><text x="93.0" y="143.2" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">Integration</text><rect x="186.0" y="114.0" width="686.0" height="48.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="196.0" y="143.2" font-size="16" font-weight="normal" fill="#1f2937" text-anchor="start">components and data pipelines work together</text><rect x="8.0" y="170.0" width="170.0" height="48.0" rx="8" fill="#1e3a8a" stroke="#1e3a8a" stroke-width="1.6"/><text x="93.0" y="199.2" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">Validation</text><rect x="186.0" y="170.0" width="686.0" height="48.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="196.0" y="199.2" font-size="16" font-weight="normal" fill="#1f2937" text-anchor="start">the model meets the requirements for its intended use</text><rect x="8.0" y="226.0" width="170.0" height="48.0" rx="8" fill="#1e3a8a" stroke="#1e3a8a" stroke-width="1.6"/><text x="93.0" y="255.2" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">Performance</text><rect x="186.0" y="226.0" width="686.0" height="48.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="196.0" y="255.2" font-size="16" font-weight="normal" fill="#1f2937" text-anchor="start">accuracy, error rates, speed and stability</text><rect x="8.0" y="282.0" width="170.0" height="48.0" rx="8" fill="#1e3a8a" stroke="#1e3a8a" stroke-width="1.6"/><text x="93.0" y="311.2" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">Security</text><rect x="186.0" y="282.0" width="686.0" height="48.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="196.0" y="311.2" font-size="16" font-weight="normal" fill="#1f2937" text-anchor="start">resists attacks and leakage of data</text><rect x="8.0" y="338.0" width="170.0" height="48.0" rx="8" fill="#1e3a8a" stroke="#1e3a8a" stroke-width="1.6"/><text x="93.0" y="367.2" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">Bias</text><rect x="186.0" y="338.0" width="686.0" height="48.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="196.0" y="367.2" font-size="16" font-weight="normal" fill="#1f2937" text-anchor="start">outcomes are acceptable across groups</text><rect x="8.0" y="394.0" width="170.0" height="48.0" rx="8" fill="#1e3a8a" stroke="#1e3a8a" stroke-width="1.6"/><text x="93.0" y="423.2" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">Interpretability</text><rect x="186.0" y="394.0" width="686.0" height="48.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="196.0" y="423.2" font-size="16" font-weight="normal" fill="#1f2937" text-anchor="start">reasons can be given to users and overseers</text></svg>