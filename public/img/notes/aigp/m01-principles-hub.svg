<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 450" width="880" height="450" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">m01-principles-hub</title><desc id="d">Six principles of responsible AI around the center: fairness, safety and reliability, privacy and security, transparency and explainability, accountability and human-centricity.</desc><defs></defs><rect x="0.75" y="0.75" width="878.5" height="448.5" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><line x1="440.0" y1="188.0" x2="440.0" y2="117.0" stroke="#6b7280" stroke-width="2.2"/><rect x="320.0" y="18.0" width="240.0" height="96.0" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="440.0" y="61.5" font-size="15" font-weight="bold" fill="#1e3a8a" text-anchor="middle">Fairness</text><text x="440.0" y="80.2" font-size="15" font-weight="normal" fill="#1e3a8a" text-anchor="middle">Are people treated equitably?</text><line x1="548.0" y1="195.0" x2="595.9" y2="181.3" stroke="#6b7280" stroke-width="2.2"/><rect x="598.9" y="98.0" width="240.0" height="96.0" rx="8" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.6"/><text x="718.9" y="141.5" font-size="15" font-weight="bold" fill="#134e4a" text-anchor="middle">Safety and reliability</text><text x="718.9" y="160.2" font-size="15" font-weight="normal" fill="#134e4a" text-anchor="middle">Does it work without harm?</text><line x1="548.0" y1="257.0" x2="595.9" y2="270.7" stroke="#6b7280" stroke-width="2.2"/><rect x="598.9" y="258.0" width="240.0" height="96.0" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="718.9" y="301.5" font-size="15" font-weight="bold" fill="#14532d" text-anchor="middle">Privacy and security</text><text x="718.9" y="320.2" font-size="15" font-weight="normal" fill="#14532d" text-anchor="middle">Are data and system protected?</text><line x1="440.0" y1="264.0" x2="440.0" y2="335.0" stroke="#6b7280" stroke-width="2.2"/><rect x="320.0" y="338.0" width="240.0" height="96.0" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="440.0" y="372.1" font-size="15" font-weight="bold" fill="#78350f" text-anchor="middle">Transparency and</text><text x="440.0" y="390.9" font-size="15" font-weight="bold" fill="#78350f" text-anchor="middle">explainability</text><text x="440.0" y="409.6" font-size="15" font-weight="normal" fill="#78350f" text-anchor="middle">Can people understand it?</text><line x1="332.0" y1="257.0" x2="284.1" y2="270.7" stroke="#6b7280" stroke-width="2.2"/><rect x="41.1" y="258.0" width="240.0" height="96.0" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.6"/><text x="161.1" y="301.5" font-size="15" font-weight="bold" fill="#4c1d95" text-anchor="middle">Accountability</text><text x="161.1" y="320.2" font-size="15" font-weight="normal" fill="#4c1d95" text-anchor="middle">Who answers for the outcome?</text><line x1="332.0" y1="195.0" x2="284.1" y2="181.3" stroke="#6b7280" stroke-width="2.2"/><rect x="41.1" y="98.0" width="240.0" height="96.0" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.6"/><text x="161.1" y="132.1" font-size="15" font-weight="bold" fill="#7f1d1d" text-anchor="middle">Human-centricity</text><text x="161.1" y="150.9" font-size="15" font-weight="normal" fill="#7f1d1d" text-anchor="middle">Does it serve people's rights and</text><text x="161.1" y="169.6" font-size="15" font-weight="normal" fill="#7f1d1d" text-anchor="middle">agency?</text><rect x="335.0" y="191.0" width="210.0" height="70.0" rx="8" fill="#1e3a8a" stroke="#1e3a8a" stroke-width="1.6"/><text x="440.0" y="232.5" font-size="20" font-weight="bold" fill="#ffffff" text-anchor="middle">Responsible AI</text></svg>