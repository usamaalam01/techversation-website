<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 438" width="880" height="438" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">m14-tiers</title><desc id="d">Five tiers of the AI Act: prohibited, high-risk, transparency, minimal risk and general-purpose models, with the basis and what follows.</desc><defs></defs><rect x="0.75" y="0.75" width="878.5" height="436.5" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><rect x="8.0" y="8.0" width="190.0" height="40.0" rx="8" fill="#1e3a8a" stroke="#1e3a8a" stroke-width="1.6"/><text x="103.0" y="33.2" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">Tier</text><rect x="206.0" y="8.0" width="220.0" height="40.0" rx="8" fill="#1e3a8a" stroke="#1e3a8a" stroke-width="1.6"/><text x="316.0" y="33.2" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">Basis</text><rect x="434.0" y="8.0" width="438.0" height="40.0" rx="8" fill="#1e3a8a" stroke="#1e3a8a" stroke-width="1.6"/><text x="653.0" y="33.2" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">What follows</text><rect x="8.0" y="56.0" width="190.0" height="68.0" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.6"/><text x="103.0" y="95.5" font-size="17" font-weight="bold" fill="#7f1d1d" text-anchor="middle">Prohibited</text><rect x="206.0" y="56.0" width="220.0" height="68.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="218.0" y="95.2" font-size="16" font-weight="normal" fill="#1f2937" text-anchor="start">Article 5</text><rect x="434.0" y="56.0" width="438.0" height="68.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="446.0" y="95.2" font-size="16" font-weight="normal" fill="#1f2937" text-anchor="start">banned</text><rect x="8.0" y="132.0" width="190.0" height="68.0" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="103.0" y="171.5" font-size="17" font-weight="bold" fill="#78350f" text-anchor="middle">High-risk</text><rect x="206.0" y="132.0" width="220.0" height="68.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="218.0" y="171.2" font-size="16" font-weight="normal" fill="#1f2937" text-anchor="start">Article 6, Annex III, Annex I</text><rect x="434.0" y="132.0" width="438.0" height="68.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="446.0" y="171.2" font-size="16" font-weight="normal" fill="#1f2937" text-anchor="start">requirements, conformity, registration, deployer duties</text><rect x="8.0" y="208.0" width="190.0" height="68.0" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="103.0" y="247.5" font-size="17" font-weight="bold" fill="#1e3a8a" text-anchor="middle">Transparency</text><rect x="206.0" y="208.0" width="220.0" height="68.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="218.0" y="247.2" font-size="16" font-weight="normal" fill="#1f2937" text-anchor="start">Article 50</text><rect x="434.0" y="208.0" width="438.0" height="68.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="446.0" y="247.2" font-size="16" font-weight="normal" fill="#1f2937" text-anchor="start">people told they interact with AI; synthetic content marked</text><rect x="8.0" y="284.0" width="190.0" height="68.0" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="103.0" y="323.5" font-size="17" font-weight="bold" fill="#14532d" text-anchor="middle">Minimal risk</text><rect x="206.0" y="284.0" width="220.0" height="68.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="218.0" y="323.2" font-size="16" font-weight="normal" fill="#1f2937" text-anchor="start">no specific duties</text><rect x="434.0" y="284.0" width="438.0" height="68.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="446.0" y="323.2" font-size="16" font-weight="normal" fill="#1f2937" text-anchor="start">voluntary codes</text><rect x="8.0" y="360.0" width="190.0" height="68.0" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.6"/><text x="103.0" y="388.9" font-size="17" font-weight="bold" fill="#4c1d95" text-anchor="middle">General-purpose</text><text x="103.0" y="410.1" font-size="17" font-weight="bold" fill="#4c1d95" text-anchor="middle">models</text><rect x="206.0" y="360.0" width="220.0" height="68.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="218.0" y="399.2" font-size="16" font-weight="normal" fill="#1f2937" text-anchor="start">Articles 51, 53, 55</text><rect x="434.0" y="360.0" width="438.0" height="68.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="446.0" y="389.2" font-size="16" font-weight="normal" fill="#1f2937" text-anchor="start">documentation, copyright policy, training summary; more</text><text x="446.0" y="409.2" font-size="16" font-weight="normal" fill="#1f2937" text-anchor="start">for systemic risk</text></svg>