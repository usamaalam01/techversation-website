<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 382" width="880" height="382" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">m12-build-buy</title><desc id="d">Four routes: buy, host an open model, build, or a hybrid, with what you gain and what you take on.</desc><defs></defs><rect x="0.75" y="0.75" width="878.5" height="380.5" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><rect x="226.0" y="8.0" width="319.0" height="44.0" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="385.5" y="35.5" font-size="17" font-weight="bold" fill="#14532d" text-anchor="middle">What you gain</text><rect x="553.0" y="8.0" width="319.0" height="44.0" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.6"/><text x="712.5" y="35.5" font-size="17" font-weight="bold" fill="#7f1d1d" text-anchor="middle">What you take on</text><rect x="8.0" y="60.0" width="210.0" height="72.0" rx="8" fill="#1e3a8a" stroke="#1e3a8a" stroke-width="1.6"/><text x="113.0" y="101.5" font-size="17" font-weight="bold" fill="#ffffff" text-anchor="middle">Buy from a vendor</text><rect x="226.0" y="60.0" width="319.0" height="72.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="236.0" y="91.2" font-size="16" font-weight="normal" fill="#1f2937" text-anchor="start">fastest start; vendor carries the build</text><text x="236.0" y="111.2" font-size="16" font-weight="normal" fill="#1f2937" text-anchor="start">duties</text><rect x="553.0" y="60.0" width="319.0" height="72.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="563.0" y="101.2" font-size="16" font-weight="normal" fill="#1f2937" text-anchor="start">the contract is your main control</text><rect x="8.0" y="140.0" width="210.0" height="72.0" rx="8" fill="#1e3a8a" stroke="#1e3a8a" stroke-width="1.6"/><text x="113.0" y="181.5" font-size="17" font-weight="bold" fill="#ffffff" text-anchor="middle">Host an open model</text><rect x="226.0" y="140.0" width="319.0" height="72.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="236.0" y="181.2" font-size="16" font-weight="normal" fill="#1f2937" text-anchor="start">control and visibility</text><rect x="553.0" y="140.0" width="319.0" height="72.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="563.0" y="181.2" font-size="16" font-weight="normal" fill="#1f2937" text-anchor="start">hosting, security, testing, updates</text><rect x="8.0" y="220.0" width="210.0" height="72.0" rx="8" fill="#1e3a8a" stroke="#1e3a8a" stroke-width="1.6"/><text x="113.0" y="261.5" font-size="17" font-weight="bold" fill="#ffffff" text-anchor="middle">Build your own</text><rect x="226.0" y="220.0" width="319.0" height="72.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="236.0" y="261.2" font-size="16" font-weight="normal" fill="#1f2937" text-anchor="start">most control and fit</text><rect x="553.0" y="220.0" width="319.0" height="72.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="563.0" y="261.2" font-size="16" font-weight="normal" fill="#1f2937" text-anchor="start">all provider duties and liability</text><rect x="8.0" y="300.0" width="210.0" height="72.0" rx="8" fill="#1e3a8a" stroke="#1e3a8a" stroke-width="1.6"/><text x="113.0" y="341.5" font-size="17" font-weight="bold" fill="#ffffff" text-anchor="middle">Hybrid</text><rect x="226.0" y="300.0" width="319.0" height="72.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="236.0" y="341.2" font-size="16" font-weight="normal" fill="#1f2937" text-anchor="start">fit without a full build</text><rect x="553.0" y="300.0" width="319.0" height="72.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="563.0" y="331.2" font-size="16" font-weight="normal" fill="#1f2937" text-anchor="start">check whether the changes make you a</text><text x="563.0" y="351.2" font-size="16" font-weight="normal" fill="#1f2937" text-anchor="start">provider</t