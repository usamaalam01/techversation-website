<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 368" width="880" height="368" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">m12-rights</title><desc id="d">Five rights to secure: service levels, performance statements, documentation, testing and audit rights, and cooperation.</desc><defs></defs><rect x="0.75" y="0.75" width="878.5" height="366.5" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><rect x="8.0" y="8.0" width="240.0" height="62.0" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="128.0" y="44.8" font-size="18" font-weight="bold" fill="#1e3a8a" text-anchor="middle">Service levels</text><rect x="258.0" y="8.0" width="614.0" height="62.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="274.0" y="44.2" font-size="16" font-weight="normal" fill="#1f2937" text-anchor="start">availability, response and support times, with remedies</text><rect x="8.0" y="80.0" width="240.0" height="62.0" rx="8" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.6"/><text x="128.0" y="116.8" font-size="18" font-weight="bold" fill="#134e4a" text-anchor="middle">Performance statements</text><rect x="258.0" y="80.0" width="614.0" height="62.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="274.0" y="116.2" font-size="16" font-weight="normal" fill="#1f2937" text-anchor="start">accuracy and limits, ideally by group</text><rect x="8.0" y="152.0" width="240.0" height="62.0" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="128.0" y="188.8" font-size="18" font-weight="bold" fill="#14532d" text-anchor="middle">Documentation</text><rect x="258.0" y="152.0" width="614.0" height="62.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="274.0" y="188.2" font-size="16" font-weight="normal" fill="#1f2937" text-anchor="start">instructions for use and model information, kept current</text><rect x="8.0" y="224.0" width="240.0" height="62.0" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="128.0" y="260.9" font-size="18" font-weight="bold" fill="#78350f" text-anchor="middle">Testing, audit rights</text><rect x="258.0" y="224.0" width="614.0" height="62.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="274.0" y="260.2" font-size="16" font-weight="normal" fill="#1f2937" text-anchor="start">test, assess or audit, or receive independent reports</text><rect x="8.0" y="296.0" width="240.0" height="62.0" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.6"/><text x="128.0" y="332.9" font-size="18" font-weight="bold" fill="#4c1d95" text-anchor="middle">Cooperation</text><rect x="258.0" y="296.0" width="614.0" height="62.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="274.0" y="332.2" font-size="16" font-weight="normal" fill="#1f2937" text-anchor="start">information, capabilities and technical access for high-risk systems</text></svg>