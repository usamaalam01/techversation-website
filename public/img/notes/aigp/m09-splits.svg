<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 320" width="880" height="320" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">m09-splits</title><desc id="d">Training, validation and test data, with leakage and overfitting as the risks.</desc><defs></defs><rect x="0.75" y="0.75" width="878.5" height="318.5" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><rect x="8.0" y="8.0" width="278.7" height="52.0" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="147.3" y="39.8" font-size="18" font-weight="bold" fill="#1e3a8a" text-anchor="middle">Training set</text><rect x="8.0" y="68.0" width="278.7" height="160.0" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="1.8"/><circle cx="27.0" cy="92.1" r="3.4" fill="#2563eb" stroke="#2563eb" stroke-width="1"/><text x="44.0" y="97.2" font-size="16" font-weight="normal" fill="#1f2937" text-anchor="start">the model learns from it</text><circle cx="27.0" cy="125.6" r="3.4" fill="#2563eb" stroke="#2563eb" stroke-width="1"/><text x="44.0" y="130.7" font-size="16" font-weight="normal" fill="#1f2937" text-anchor="start">the largest share</text><circle cx="27.0" cy="159.1" r="3.4" fill="#2563eb" stroke="#2563eb" stroke-width="1"/><text x="44.0" y="164.2" font-size="16" font-weight="normal" fill="#1f2937" text-anchor="start">can be overfitted</text><rect x="300.7" y="8.0" width="278.7" height="52.0" rx="8" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.6"/><text x="440.0" y="39.8" font-size="18" font-weight="bold" fill="#134e4a" text-anchor="middle">Validation set</text><rect x="300.7" y="68.0" width="278.7" height="160.0" rx="10" fill="#ffffff" stroke="#0d9488" stroke-width="1.8"/><circle cx="319.7" cy="92.1" r="3.4" fill="#0d9488" stroke="#0d9488" stroke-width="1"/><text x="336.7" y="97.2" font-size="16" font-weight="normal" fill="#1f2937" text-anchor="start">tunes settings</text><circle cx="319.7" cy="125.6" r="3.4" fill="#0d9488" stroke="#0d9488" stroke-width="1"/><text x="336.7" y="130.7" font-size="16" font-weight="normal" fill="#1f2937" text-anchor="start">chooses between models</text><circle cx="319.7" cy="159.1" r="3.4" fill="#0d9488" stroke="#0d9488" stroke-width="1"/><text x="336.7" y="164.2" font-size="16" font-weight="normal" fill="#1f2937" text-anchor="start">used many times</text><rect x="593.3" y="8.0" width="278.7" height="52.0" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="732.7" y="39.8" font-size="18" font-weight="bold" fill="#14532d" text-anchor="middle">Test set</text><rect x="593.3" y="68.0" width="278.7" height="160.0" rx="10" fill="#ffffff" stroke="#16a34a" stroke-width="1.8"/><circle cx="612.3" cy="92.1" r="3.4" fill="#16a34a" stroke="#16a34a" stroke-width="1"/><text x="629.3" y="97.2" font-size="16" font-weight="normal" fill="#1f2937" text-anchor="start">held out</text><circle cx="612.3" cy="125.6" r="3.4" fill="#16a34a" stroke="#16a34a" stroke-width="1"/><text x="629.3" y="130.7" font-size="16" font-weight="normal" fill="#1f2937" text-anchor="start">one final unbiased check</text><circle cx="612.3" cy="159.1" r="3.4" fill="#16a34a" stroke="#16a34a" stroke-width="1"/><text x="629.3" y="164.2" font-size="16" font-weight="normal" fill="#1f2937" text-anchor="start">never tuned on</text><rect x="8.0" y="244.0" width="864.0" height="66.0" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.6"/><text x="440.0" y="282.9" font-size="18" font-weight="bold" fill="#7f1d1d" text-anchor="middle">Leakage mixes the sets and inflates results; overfitting memorizes the training set</text></svg>