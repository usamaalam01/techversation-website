<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 368" width="880" height="368" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">m15-role-instrument-stage</title><desc id="d">Three lenses for a scenario, what each asks, and the Helios candidate chat as an example.</desc><defs></defs><rect x="0.75" y="0.75" width="878.5" height="366.5" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><rect x="156.0" y="8.0" width="354.0" height="44.0" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="333.0" y="35.5" font-size="17" font-weight="bold" fill="#1e3a8a" text-anchor="middle">What it asks</text><rect x="518.0" y="8.0" width="354.0" height="44.0" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="695.0" y="35.5" font-size="17" font-weight="bold" fill="#78350f" text-anchor="middle">At Helios</text><rect x="8.0" y="60.0" width="140.0" height="94.0" rx="8" fill="#1e3a8a" stroke="#1e3a8a" stroke-width="1.6"/><text x="78.0" y="112.8" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="middle">Role</text><rect x="156.0" y="60.0" width="354.0" height="94.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="166.0" y="102.2" font-size="16" font-weight="normal" fill="#1f2937" text-anchor="start">who are we: provider, deployer, controller,</text><text x="166.0" y="122.2" font-size="16" font-weight="normal" fill="#1f2937" text-anchor="start">processor</text><rect x="518.0" y="60.0" width="354.0" height="94.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="528.0" y="102.2" font-size="16" font-weight="normal" fill="#1f2937" text-anchor="start">provider of the chat built on a Corvid Labs</text><text x="528.0" y="122.2" font-size="16" font-weight="normal" fill="#1f2937" text-anchor="start">model</text><rect x="8.0" y="162.0" width="140.0" height="94.0" rx="8" fill="#1e3a8a" stroke="#1e3a8a" stroke-width="1.6"/><text x="78.0" y="214.8" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="middle">Instrument</text><rect x="156.0" y="162.0" width="354.0" height="94.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="166.0" y="214.2" font-size="16" font-weight="normal" fill="#1f2937" text-anchor="start">which law, standard or framework governs</text><rect x="518.0" y="162.0" width="354.0" height="94.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="528.0" y="204.2" font-size="16" font-weight="normal" fill="#1f2937" text-anchor="start">GDPR and the AI Act: personal data, and an</text><text x="528.0" y="224.2" font-size="16" font-weight="normal" fill="#1f2937" text-anchor="start">AI system that talks to people</text><rect x="8.0" y="264.0" width="140.0" height="94.0" rx="8" fill="#1e3a8a" stroke="#1e3a8a" stroke-width="1.6"/><text x="78.0" y="316.9" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="middle">Stage</text><rect x="156.0" y="264.0" width="354.0" height="94.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="166.0" y="306.2" font-size="16" font-weight="normal" fill="#1f2937" text-anchor="start">where in the life cycle: design, data, release,</text><text x="166.0" y="326.2" font-size="16" font-weight="normal" fill="#1f2937" text-anchor="start">deploy, monitor, retire</text><rect x="518.0" y="264.0" width="354.0" height="94.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="528.0" y="316.2" font-size="16" font-weight="normal" fill="#1f2937" text-anchor="start">before launch: the decision to deploy</text></svg>