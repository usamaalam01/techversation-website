<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 210" width="880" height="210" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">m04-dpia-flow</title><desc id="d">Six steps of an impact assessment: trigger, describe, necessity, risks, measures, consult and review.</desc><defs></defs><rect x="0.75" y="0.75" width="878.5" height="208.5" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><polygon points="8.0,8.0 125.3,8.0 145.3,39.0 125.3,70.0 8.0,70.0" fill="#dbeafe" stroke="#2563eb" stroke-width="1.8"/><text x="69.7" y="43.8" font-size="15" font-weight="bold" fill="#1e3a8a" text-anchor="middle">Trigger</text><rect x="10.0" y="74.0" width="123.3" height="130.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="18.0" y="134.8" font-size="14" font-weight="normal" fill="#1f2937" text-anchor="start">likely high risk to</text><text x="18.0" y="152.3" font-size="14" font-weight="normal" fill="#1f2937" text-anchor="start">people</text><polygon points="153.3,8.0 270.7,8.0 290.7,39.0 270.7,70.0 153.3,70.0 173.3,39.0" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.8"/><text x="222.0" y="43.8" font-size="15" font-weight="bold" fill="#134e4a" text-anchor="middle">Describe</text><rect x="155.3" y="74.0" width="123.3" height="130.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="163.3" y="134.8" font-size="14" font-weight="normal" fill="#1f2937" text-anchor="start">the processing</text><text x="163.3" y="152.3" font-size="14" font-weight="normal" fill="#1f2937" text-anchor="start">and its purposes</text><polygon points="298.7,8.0 416.0,8.0 436.0,39.0 416.0,70.0 298.7,70.0 318.7,39.0" fill="#dcfce7" stroke="#16a34a" stroke-width="1.8"/><text x="367.3" y="43.8" font-size="15" font-weight="bold" fill="#14532d" text-anchor="middle">Necessity</text><rect x="300.7" y="74.0" width="123.3" height="130.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="308.7" y="126.0" font-size="14" font-weight="normal" fill="#1f2937" text-anchor="start">is it</text><text x="308.7" y="143.6" font-size="14" font-weight="normal" fill="#1f2937" text-anchor="start">proportionate to</text><text x="308.7" y="161.1" font-size="14" font-weight="normal" fill="#1f2937" text-anchor="start">the aim?</text><polygon points="444.0,8.0 561.3,8.0 581.3,39.0 561.3,70.0 444.0,70.0 464.0,39.0" fill="#fef3c7" stroke="#d97706" stroke-width="1.8"/><text x="512.7" y="43.8" font-size="15" font-weight="bold" fill="#78350f" text-anchor="middle">Risks</text><rect x="446.0" y="74.0" width="123.3" height="130.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="454.0" y="126.0" font-size="14" font-weight="normal" fill="#1f2937" text-anchor="start">to the rights and</text><text x="454.0" y="143.6" font-size="14" font-weight="normal" fill="#1f2937" text-anchor="start">freedoms of</text><text x="454.0" y="161.1" font-size="14" font-weight="normal" fill="#1f2937" text-anchor="start">people</text><polygon points="589.3,8.0 706.7,8.0 726.7,39.0 706.7,70.0 589.3,70.0 609.3,39.0" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.8"/><text x="658.0" y="43.8" font-size="15" font-weight="bold" fill="#4c1d95" text-anchor="middle">Measures</text><rect x="591.3" y="74.0" width="123.3" height="130.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="599.3" y="134.8" font-size="14" font-weight="normal" fill="#1f2937" text-anchor="start">technical and</text><text x="599.3" y="152.3" font-size="14" font-weight="normal" fill="#1f2937" text-anchor="start">organizational</text><polygon points="734.7,8.0 852.0,8.0 872.0,39.0 852.0,70.0 734.7,70.0 754.7,39.0" fill="#fee2e2" stroke="#dc2626" stroke-width="1.8"/><text x="803.3" y="34.8" font-size="15" font-weight="bold" fill="#7f1d1d" text-anchor="middle">Consult,</text><text x="803.3" y="52.8" font-size="15" font-weight="bold" fill="#7f1d1d" text-anchor="middle">review</text><rect x="736.7" y="74.0" width="123.3" height="130.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="744.7" y="126.0" font-size="14" font-weight="normal" fill="#1f2937" text-anchor="start">DPO advice;</text><text x="744.7" y="143.6" font-size="14" font-weight="normal" fill="#1f2937" text-anchor="start">review as things</text><text x="744.7" y="161.1" font-size="14" font-weight="normal" fill="#1f2937" text-anchor="start">change</text></svg>