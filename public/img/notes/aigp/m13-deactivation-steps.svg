<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 188" width="880" height="188" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">m13-deactivation-steps</title><desc id="d">A deactivation runs from trigger to decision, action, notification, and record and review.</desc><defs></defs><rect x="0.75" y="0.75" width="878.5" height="186.5" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><polygon points="8.0,8.0 156.0,8.0 176.0,41.0 156.0,74.0 8.0,74.0" fill="#fee2e2" stroke="#dc2626" stroke-width="1.8"/><text x="85.0" y="46.1" font-size="16" font-weight="bold" fill="#7f1d1d" text-anchor="middle">1 Trigger</text><rect x="10.0" y="78.0" width="154.0" height="104.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="18.0" y="134.9" font-size="15" font-weight="normal" fill="#1f2937" text-anchor="start">a defined event</text><polygon points="182.0,8.0 330.0,8.0 350.0,41.0 330.0,74.0 182.0,74.0 202.0,41.0" fill="#fef3c7" stroke="#d97706" stroke-width="1.8"/><text x="266.0" y="46.1" font-size="16" font-weight="bold" fill="#78350f" text-anchor="middle">2 Decide</text><rect x="184.0" y="78.0" width="154.0" height="104.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="192.0" y="125.5" font-size="15" font-weight="normal" fill="#1f2937" text-anchor="start">a named authority,</text><text x="192.0" y="144.2" font-size="15" font-weight="normal" fill="#1f2937" text-anchor="start">any hour</text><polygon points="356.0,8.0 504.0,8.0 524.0,41.0 504.0,74.0 356.0,74.0 376.0,41.0" fill="#dbeafe" stroke="#2563eb" stroke-width="1.8"/><text x="440.0" y="46.1" font-size="16" font-weight="bold" fill="#1e3a8a" text-anchor="middle">3 Act</text><rect x="358.0" y="78.0" width="154.0" height="104.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="366.0" y="125.5" font-size="15" font-weight="normal" fill="#1f2937" text-anchor="start">switch off or limit;</text><text x="366.0" y="144.2" font-size="15" font-weight="normal" fill="#1f2937" text-anchor="start">verify</text><polygon points="530.0,8.0 678.0,8.0 698.0,41.0 678.0,74.0 530.0,74.0 550.0,41.0" fill="#dcfce7" stroke="#16a34a" stroke-width="1.8"/><text x="614.0" y="46.1" font-size="16" font-weight="bold" fill="#14532d" text-anchor="middle">4 Notify</text><rect x="532.0" y="78.0" width="154.0" height="104.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="540.0" y="116.1" font-size="15" font-weight="normal" fill="#1f2937" text-anchor="start">users, affected</text><text x="540.0" y="134.9" font-size="15" font-weight="normal" fill="#1f2937" text-anchor="start">people, provider,</text><text x="540.0" y="153.6" font-size="15" font-weight="normal" fill="#1f2937" text-anchor="start">authorities</text><polygon points="704.0,8.0 852.0,8.0 872.0,41.0 852.0,74.0 704.0,74.0 724.0,41.0" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.8"/><text x="788.0" y="36.5" font-size="16" font-weight="bold" fill="#4c1d95" text-anchor="middle">5 Record,</text><text x="788.0" y="55.7" font-size="16" font-weight="bold" fill="#4c1d95" text-anchor="middle">review</text><rect x="706.0" y="78.0" width="154.0" height="104.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="714.0" y="116.1" font-size="15" font-weight="normal" fill="#1f2937" text-anchor="start">decision, time,</text><text x="714.0" y="134.9" font-size="15" font-weight="normal" fill="#1f2937" text-anchor="start">reason, who;</text><text x="714.0" y="153.6" font-size="15" font-weight="normal" fill="#1f2937" text-anchor="start">lessons</text></svg>