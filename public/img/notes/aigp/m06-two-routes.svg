<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 272.44" width="880" height="272.44" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">m06-two-routes</title><desc id="d">Route one is product safety under Annex I; route two is a listed use under Annex III.</desc><defs></defs><rect x="0.75" y="0.75" width="878.5" height="270.94" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><rect x="8.0" y="8.0" width="420.0" height="50.0" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="218.0" y="39.5" font-size="20" font-weight="bold" fill="#14532d" text-anchor="middle">Route 1: product safety (Article 6(1))</text><rect x="8.0" y="64.0" width="420.0" height="198.4" rx="10" fill="#ffffff" stroke="#16a34a" stroke-width="1.8"/><circle cx="27.0" cy="88.7" r="3.4" fill="#16a34a" stroke="#16a34a" stroke-width="1"/><text x="44.0" y="94.2" font-size="17" font-weight="normal" fill="#1f2937" text-anchor="start">a safety component of a product, or a product</text><text x="44.0" y="114.9" font-size="17" font-weight="normal" fill="#1f2937" text-anchor="start">itself</text><circle cx="27.0" cy="140.2" r="3.4" fill="#16a34a" stroke="#16a34a" stroke-width="1"/><text x="44.0" y="145.6" font-size="17" font-weight="normal" fill="#1f2937" text-anchor="start">covered by Annex I harmonized legislation</text><circle cx="27.0" cy="170.9" r="3.4" fill="#16a34a" stroke="#16a34a" stroke-width="1"/><text x="44.0" y="176.4" font-size="17" font-weight="normal" fill="#1f2937" text-anchor="start">the product needs a third-party conformity</text><text x="44.0" y="197.1" font-size="17" font-weight="normal" fill="#1f2937" text-anchor="start">assessment</text><circle cx="27.0" cy="222.4" r="3.4" fill="#16a34a" stroke="#16a34a" stroke-width="1"/><text x="44.0" y="227.9" font-size="17" font-weight="normal" fill="#1f2937" text-anchor="start">e.g. machinery, medical devices, vehicles, toys</text><rect x="452.0" y="8.0" width="420.0" height="50.0" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.6"/><text x="662.0" y="39.5" font-size="20" font-weight="bold" fill="#7f1d1d" text-anchor="middle">Route 2: listed uses (Article 6(2))</text><rect x="452.0" y="64.0" width="420.0" height="198.4" rx="10" fill="#ffffff" stroke="#dc2626" stroke-width="1.8"/><circle cx="471.0" cy="88.7" r="3.4" fill="#dc2626" stroke="#dc2626" stroke-width="1"/><text x="488.0" y="94.2" font-size="17" font-weight="normal" fill="#1f2937" text-anchor="start">a use named in one of the eight Annex III areas</text><circle cx="471.0" cy="119.4" r="3.4" fill="#dc2626" stroke="#dc2626" stroke-width="1"/><text x="488.0" y="124.9" font-size="17" font-weight="normal" fill="#1f2937" text-anchor="start">e.g. recruitment, credit scoring, education,</text><text x="488.0" y="145.6" font-size="17" font-weight="normal" fill="#1f2937" text-anchor="start">essential services</text><circle cx="471.0" cy="170.9" r="3.4" fill="#dc2626" stroke="#dc2626" stroke-width="1"/><text x="488.0" y="176.4" font-size="17" font-weight="normal" fill="#1f2937" text-anchor="start">same Articles 9 to 15 requirements</text><circle cx="471.0" cy="201.7" r="3.4" fill="#dc2626" stroke="#dc2626" stroke-width="1"/><text x="488.0" y="207.1" font-size="17" font-weight="normal" fill="#1f2937" text-anchor="start">Article 6(3) filter can apply, never for profiling</text></svg>