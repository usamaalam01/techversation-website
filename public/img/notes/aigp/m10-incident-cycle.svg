<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 330" width="880" height="330" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">m10-incident-cycle</title><desc id="d">Six steps of incident response: detect and report, triage, contain, investigate, remediate and retest, communicate and learn.</desc><defs></defs><rect x="0.75" y="0.75" width="878.5" height="328.5" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><polygon points="8.0,8.0 269.3,8.0 289.3,36.0 269.3,64.0 8.0,64.0" fill="#dbeafe" stroke="#2563eb" stroke-width="1.8"/><text x="141.7" y="41.4" font-size="17" font-weight="bold" fill="#1e3a8a" text-anchor="middle">1 Detect, report</text><rect x="10.0" y="68.0" width="267.3" height="64.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="18.0" y="95.5" font-size="15" font-weight="normal" fill="#1f2937" text-anchor="start">monitoring, users, staff or partners</text><text x="18.0" y="114.2" font-size="15" font-weight="normal" fill="#1f2937" text-anchor="start">raise it</text><polygon points="299.3,8.0 560.7,8.0 580.7,36.0 560.7,64.0 299.3,64.0 319.3,36.0" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.8"/><text x="440.0" y="41.4" font-size="17" font-weight="bold" fill="#134e4a" text-anchor="middle">2 Triage</text><rect x="301.3" y="68.0" width="267.3" height="64.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="309.3" y="104.9" font-size="15" font-weight="normal" fill="#1f2937" text-anchor="start">set the severity and an owner</text><polygon points="590.7,8.0 852.0,8.0 872.0,36.0 852.0,64.0 590.7,64.0 610.7,36.0" fill="#fee2e2" stroke="#dc2626" stroke-width="1.8"/><text x="731.3" y="41.4" font-size="17" font-weight="bold" fill="#7f1d1d" text-anchor="middle">3 Contain</text><rect x="592.7" y="68.0" width="267.3" height="64.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="600.7" y="95.5" font-size="15" font-weight="normal" fill="#1f2937" text-anchor="start">pause, limit or correct to stop the</text><text x="600.7" y="114.2" font-size="15" font-weight="normal" fill="#1f2937" text-anchor="start">harm</text><polygon points="8.0,142.0 269.3,142.0 289.3,170.0 269.3,198.0 8.0,198.0" fill="#fef3c7" stroke="#d97706" stroke-width="1.8"/><text x="141.7" y="175.4" font-size="17" font-weight="bold" fill="#78350f" text-anchor="middle">4 Investigate</text><rect x="10.0" y="202.0" width="267.3" height="64.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="18.0" y="238.9" font-size="15" font-weight="normal" fill="#1f2937" text-anchor="start">find the root cause</text><polygon points="299.3,142.0 560.7,142.0 580.7,170.0 560.7,198.0 299.3,198.0 319.3,170.0" fill="#dcfce7" stroke="#16a34a" stroke-width="1.8"/><text x="440.0" y="175.4" font-size="17" font-weight="bold" fill="#14532d" text-anchor="middle">5 Remediate</text><rect x="301.3" y="202.0" width="267.3" height="64.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="309.3" y="238.9" font-size="15" font-weight="normal" fill="#1f2937" text-anchor="start">fix and retest</text><polygon points="590.7,142.0 852.0,142.0 872.0,170.0 852.0,198.0 590.7,198.0 610.7,170.0" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.8"/><text x="731.3" y="175.4" font-size="17" font-weight="bold" fill="#4c1d95" text-anchor="middle">6 Communicate, learn</text><rect x="592.7" y="202.0" width="267.3" height="64.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="600.7" y="238.9" font-size="15" font-weight="normal" fill="#1f2937" text-anchor="start">inform those affected; update tests</text><rect x="8.0" y="276.0" width="864.0" height="44.0" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.6" stroke-dasharray="6 4"/><text x="440.0" y="303.5" font-size="17" font-weight="normal" fill="#374151" text-anchor="middle">Document at every step</text></svg>