<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 378" width="880" height="378" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">m09-representativeness</title><desc id="d">Real use compared with training data coverage, and the effect of gaps.</desc><defs></defs><rect x="0.75" y="0.75" width="878.5" height="376.5" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><rect x="138.0" y="8.0" width="362.0" height="48.0" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="319.0" y="37.8" font-size="18" font-weight="bold" fill="#1e3a8a" text-anchor="middle">Real use</text><rect x="510.0" y="8.0" width="362.0" height="48.0" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="691.0" y="37.8" font-size="18" font-weight="bold" fill="#78350f" text-anchor="middle">Training data</text><text x="122.0" y="105.0" font-size="15" font-weight="bold" fill="#6b7280" text-anchor="end">Groups</text><rect x="138.0" y="66.0" width="362.0" height="68.0" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="150.0" y="105.5" font-size="17" font-weight="normal" fill="#1e3a8a" text-anchor="start">everyone the system will affect</text><rect x="510.0" y="66.0" width="362.0" height="68.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="522.0" y="105.5" font-size="17" font-weight="normal" fill="#1f2937" text-anchor="start">enough records for each group</text><text x="122.0" y="183.0" font-size="15" font-weight="bold" fill="#6b7280" text-anchor="end">Settings</text><rect x="138.0" y="144.0" width="362.0" height="68.0" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="150.0" y="183.5" font-size="17" font-weight="normal" fill="#1e3a8a" text-anchor="start">regions, devices, contexts</text><rect x="510.0" y="144.0" width="362.0" height="68.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="522.0" y="183.5" font-size="17" font-weight="normal" fill="#1f2937" text-anchor="start">data from the same settings</text><text x="122.0" y="261.0" font-size="15" font-weight="bold" fill="#6b7280" text-anchor="end">Conditions</text><rect x="138.0" y="222.0" width="362.0" height="68.0" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="150.0" y="261.5" font-size="17" font-weight="normal" fill="#1e3a8a" text-anchor="start">noise, seasons, behavior</text><rect x="510.0" y="222.0" width="362.0" height="68.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="522.0" y="261.5" font-size="17" font-weight="normal" fill="#1f2937" text-anchor="start">covered, or flagged as gaps</text><text x="122.0" y="339.0" font-size="15" font-weight="bold" fill="#6b7280" text-anchor="end">If it fails</text><rect x="138.0" y="300.0" width="362.0" height="68.0" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="150.0" y="339.5" font-size="17" font-weight="normal" fill="#1e3a8a" text-anchor="start">the system is used here</text><rect x="510.0" y="300.0" width="362.0" height="68.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="522.0" y="339.5" font-size="17" font-weight="normal" fill="#1f2937" text-anchor="start">worse or unpredictable results</text></svg>