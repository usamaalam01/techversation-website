<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 380" width="880" height="380" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">m09-model-card</title><desc id="d">A one-page model card with six sections.</desc><defs></defs><rect x="0.75" y="0.75" width="878.5" height="378.5" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><rect x="8.0" y="8.0" width="864.0" height="364.0" rx="14" fill="#ffffff" stroke="#1e3a8a" stroke-width="3"/><rect x="24.0" y="20.0" width="832.0" height="52.0" rx="8" fill="#1e3a8a" stroke="#1e3a8a" stroke-width="1.6"/><text x="440.0" y="52.2" font-size="19" font-weight="bold" fill="#ffffff" text-anchor="middle">Model card: hiring screening tool</text><rect x="24.0" y="90.0" width="269.3" height="126.0" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="158.7" y="147.9" font-size="17" font-weight="bold" fill="#1e3a8a" text-anchor="middle">Model details</text><text x="158.7" y="169.2" font-size="17" font-weight="normal" fill="#1e3a8a" text-anchor="middle">name, version, owner</text><rect x="305.3" y="90.0" width="269.3" height="126.0" rx="8" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.6"/><text x="440.0" y="147.9" font-size="17" font-weight="bold" fill="#134e4a" text-anchor="middle">Intended use</text><text x="440.0" y="169.2" font-size="17" font-weight="normal" fill="#134e4a" text-anchor="middle">and out-of-scope uses</text><rect x="586.7" y="90.0" width="269.3" height="126.0" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="721.3" y="137.3" font-size="17" font-weight="bold" fill="#14532d" text-anchor="middle">Data</text><text x="721.3" y="158.5" font-size="17" font-weight="normal" fill="#14532d" text-anchor="middle">training and evaluation,</text><text x="721.3" y="179.8" font-size="17" font-weight="normal" fill="#14532d" text-anchor="middle">datasheet link</text><rect x="24.0" y="228.0" width="269.3" height="126.0" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="158.7" y="285.9" font-size="17" font-weight="bold" fill="#78350f" text-anchor="middle">Performance</text><text x="158.7" y="307.1" font-size="17" font-weight="normal" fill="#78350f" text-anchor="middle">overall and by group</text><rect x="305.3" y="228.0" width="269.3" height="126.0" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.6"/><text x="440.0" y="285.9" font-size="17" font-weight="bold" fill="#7f1d1d" text-anchor="middle">Limitations, risks</text><text x="440.0" y="307.1" font-size="17" font-weight="normal" fill="#7f1d1d" text-anchor="middle">where it does not work</text><rect x="586.7" y="228.0" width="269.3" height="126.0" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.6"/><text x="721.3" y="285.9" font-size="17" font-weight="bold" fill="#4c1d95" text-anchor="middle">Approvals</text><text x="721.3" y="307.1" font-size="17" font-weight="normal" fill="#4c1d95" text-anchor="middle">monitoring plan, review date</text></svg>