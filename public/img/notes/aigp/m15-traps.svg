<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 420" width="880" height="420" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">m15-traps</title><desc id="d">Six traps that make a wrong option look right, and how each looks.</desc><defs></defs><rect x="0.75" y="0.75" width="878.5" height="418.5" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><rect x="266.0" y="8.0" width="606.0" height="42.0" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.6"/><text x="569.0" y="34.5" font-size="17" font-weight="bold" fill="#7f1d1d" text-anchor="middle">How it looks</text><rect x="8.0" y="58.0" width="250.0" height="52.0" rx="8" fill="#1e3a8a" stroke="#1e3a8a" stroke-width="1.6"/><text x="133.0" y="89.5" font-size="17" font-weight="bold" fill="#ffffff" text-anchor="middle">Absolute words</text><rect x="266.0" y="58.0" width="606.0" height="52.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="276.0" y="89.5" font-size="17" font-weight="normal" fill="#1f2937" text-anchor="start">always, never, only, all</text><rect x="8.0" y="118.0" width="250.0" height="52.0" rx="8" fill="#1e3a8a" stroke="#1e3a8a" stroke-width="1.6"/><text x="133.0" y="149.5" font-size="17" font-weight="bold" fill="#ffffff" text-anchor="middle">Wrong role</text><rect x="266.0" y="118.0" width="606.0" height="52.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="276.0" y="149.5" font-size="17" font-weight="normal" fill="#1f2937" text-anchor="start">a provider duty given to the deployer</text><rect x="8.0" y="178.0" width="250.0" height="52.0" rx="8" fill="#1e3a8a" stroke="#1e3a8a" stroke-width="1.6"/><text x="133.0" y="209.5" font-size="17" font-weight="bold" fill="#ffffff" text-anchor="middle">Wrong stage</text><rect x="266.0" y="178.0" width="606.0" height="52.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="276.0" y="209.5" font-size="17" font-weight="normal" fill="#1f2937" text-anchor="start">a monitoring fix for a design problem</text><rect x="8.0" y="238.0" width="250.0" height="52.0" rx="8" fill="#1e3a8a" stroke="#1e3a8a" stroke-width="1.6"/><text x="133.0" y="269.5" font-size="17" font-weight="bold" fill="#ffffff" text-anchor="middle">Wrong instrument</text><rect x="266.0" y="238.0" width="606.0" height="52.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="276.0" y="269.5" font-size="17" font-weight="normal" fill="#1f2937" text-anchor="start">a GDPR rule for an AI Act question</text><rect x="8.0" y="298.0" width="250.0" height="52.0" rx="8" fill="#1e3a8a" stroke="#1e3a8a" stroke-width="1.6"/><text x="133.0" y="329.5" font-size="17" font-weight="bold" fill="#ffffff" text-anchor="middle">True but off-question</text><rect x="266.0" y="298.0" width="606.0" height="52.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="276.0" y="329.5" font-size="17" font-weight="normal" fill="#1f2937" text-anchor="start">a correct fact that does not answer the stem</text><rect x="8.0" y="358.0" width="250.0" height="52.0" rx="8" fill="#1e3a8a" stroke="#1e3a8a" stroke-width="1.6"/><text x="133.0" y="389.5" font-size="17" font-weight="bold" fill="#ffffff" text-anchor="middle">Skipped step</text><rect x="266.0" y="358.0" width="606.0" height="52.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="276.0" y="389.5" font-size="17" font-weight="normal" fill="#1f2937" text-anchor="start">going live before the assessment</text></svg>