<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 174" width="880" height="174" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">m12-contract-life</title><desc id="d">The life of the agreement: sign, run, change and exit.</desc><defs></defs><rect x="0.75" y="0.75" width="878.5" height="172.5" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><polygon points="8.0,8.0 198.0,8.0 218.0,38.0 198.0,68.0 8.0,68.0" fill="#dbeafe" stroke="#2563eb" stroke-width="1.8"/><text x="106.0" y="44.1" font-size="19" font-weight="bold" fill="#1e3a8a" text-anchor="middle">1 Sign</text><rect x="10.0" y="72.0" width="196.0" height="96.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="18.0" y="115.2" font-size="16" font-weight="normal" fill="#1f2937" text-anchor="start">baseline terms and</text><text x="18.0" y="135.2" font-size="16" font-weight="normal" fill="#1f2937" text-anchor="start">versions</text><polygon points="226.0,8.0 416.0,8.0 436.0,38.0 416.0,68.0 226.0,68.0 246.0,38.0" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.8"/><text x="331.0" y="44.1" font-size="19" font-weight="bold" fill="#134e4a" text-anchor="middle">2 Run</text><rect x="228.0" y="72.0" width="196.0" height="96.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="236.0" y="115.2" font-size="16" font-weight="normal" fill="#1f2937" text-anchor="start">service levels and</text><text x="236.0" y="135.2" font-size="16" font-weight="normal" fill="#1f2937" text-anchor="start">monitoring</text><polygon points="444.0,8.0 634.0,8.0 654.0,38.0 634.0,68.0 444.0,68.0 464.0,38.0" fill="#fef3c7" stroke="#d97706" stroke-width="1.8"/><text x="549.0" y="44.1" font-size="19" font-weight="bold" fill="#78350f" text-anchor="middle">3 Change</text><rect x="446.0" y="72.0" width="196.0" height="96.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="454.0" y="125.2" font-size="16" font-weight="normal" fill="#1f2937" text-a