<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 330" width="880" height="330" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">m05-defect-types</title><desc id="d">Manufacturing, design and warning defects, each with an AI example.</desc><defs></defs><rect x="0.75" y="0.75" width="878.5" height="328.5" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><rect x="8.0" y="8.0" width="278.7" height="60.0" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="147.3" y="43.8" font-size="18" font-weight="bold" fill="#1e3a8a" text-anchor="middle">Manufacturing defect</text><rect x="8.0" y="76.0" width="278.7" height="100.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="147.3" y="131.5" font-size="17" font-weight="normal" fill="#1f2937" text-anchor="middle">departs from the intended design</text><text x="147.3" y="206.0" font-size="15" font-weight="bold" fill="#6b7280" text-anchor="middle">AI example</text><rect x="8.0" y="216.0" width="278.7" height="104.0" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="147.3" y="273.5" font-size="17" font-weight="normal" fill="#1e3a8a" text-anchor="middle">a corrupted model is shipped</text><rect x="300.7" y="8.0" width="278.7" height="60.0" rx="8" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.6"/><text x="440.0" y="43.8" font-size="18" font-weight="bold" fill="#134e4a" text-anchor="middle">Design defect</text><rect x="300.7" y="76.0" width="278.7" height="100.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="440.0" y="120.9" font-size="17" font-weight="normal" fill="#1f2937" text-anchor="middle">the design itself is unreasonably</text><text x="440.0" y="142.2" font-size="17" font-weight="normal" fill="#1f2937" text-anchor="middle">dangerous</text><text x="440.0" y="206.0" font-size="15" font-weight="bold" fill="#6b7280" text-anchor="middle">AI example</text><rect x="300.7" y="216.0" width="278.7" height="104.0" rx="8" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.6"/><text x="440.0" y="262.9" font-size="17" font-weight="normal" fill="#134e4a" text-anchor="middle">a triage model under-ranks a</text><text x="440.0" y="284.1" font-size="17" font-weight="normal" fill="#134e4a" text-anchor="middle">symptom</text><rect x="593.3" y="8.0" width="278.7" height="60.0" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="732.7" y="43.8" font-size="18" font-weight="bold" fill="#78350f" text-anchor="middle">Warning defect</text><rect x="593.3" y="76.0" width="278.7" height="100.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="732.7" y="120.9" font-size="17" font-weight="normal" fill="#1f2937" text-anchor="middle">inadequate instructions or</text><text x="732.7" y="142.2" font-size="17" font-weight="normal" fill="#1f2937" text-anchor="middle">warnings</text><text x="732.7" y="206.0" font-size="15" font-weight="bold" fill="#6b7280" text-anchor="middle">AI example</text><rect x="593.3" y="216.0" width="278.7" height="104.0" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="732.7" y="262.9" font-size="17" font-weight="normal" fill="#78350f" text-anchor="middle">no notice that outputs may be</text><text x="732.7" y="284.1" font-size="17" font-weight="normal" fill="#78350f" text-anchor="middle">wrong</text></svg>