<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 260" width="880" height="260" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">m07-oecd-principles</title><desc id="d">The five OECD values-based principles, 1.1 to 1.5.</desc><defs></defs><rect x="0.75" y="0.75" width="878.5" height="258.5" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><rect x="8.0" y="8.0" width="280.0" height="120.0" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="148.0" y="41.6" font-size="17" font-weight="bold" fill="#1e3a8a" text-anchor="middle">1.1 Inclusive growth and</text><text x="148.0" y="62.9" font-size="17" font-weight="bold" fill="#1e3a8a" text-anchor="middle">well-being</text><text x="148.0" y="84.2" font-size="17" font-weight="normal" fill="#1e3a8a" text-anchor="middle">stewardship for people and the</text><text x="148.0" y="105.4" font-size="17" font-weight="normal" fill="#1e3a8a" text-anchor="middle">planet</text><rect x="300.0" y="8.0" width="280.0" height="120.0" rx="8" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.6"/><text x="440.0" y="52.3" font-size="17" font-weight="bold" fill="#134e4a" text-anchor="middle">1.2 Human rights and</text><text x="440.0" y="73.5" font-size="17" font-weight="bold" fill="#134e4a" text-anchor="middle">democratic values</text><text x="440.0" y="94.8" font-size="17" font-weight="normal" fill="#134e4a" text-anchor="middle">fairness, privacy, human oversight</text><rect x="592.0" y="8.0" width="280.0" height="120.0" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="732.0" y="52.3" font-size="17" font-weight="bold" fill="#14532d" text-anchor="middle">1.3 Transparency and</text><text x="732.0" y="73.5" font-size="17" font-weight="bold" fill="#14532d" text-anchor="middle">explainability</text><text x="732.0" y="94.8" font-size="17" font-weight="normal" fill="#14532d" text-anchor="middle">responsible disclosure</text><rect x="8.0" y="140.0" width="426.0" height="110.0" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="221.0" y="189.9" font-size="17" font-weight="bold" fill="#78350f" text-anchor="middle">1.4 Robustness, security and safety</text><text x="221.0" y="211.2" font-size="17" font-weight="normal" fill="#78350f" text-anchor="middle">override, repair or decommission safely</text><rect x="446.0" y="140.0" width="426.0" height="110.0" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.6"/><text x="659.0" y="189.9" font-size="17" font-weight="bold" fill="#4c1d95" text-anchor="middle">1.5 Accountability</text><text x="659.0" y="211.2" font-size="17" font-weight="normal" fill="#4c1d95" text-anchor="middle">traceability and systematic risk management</text></svg>