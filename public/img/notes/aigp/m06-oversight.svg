<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 254" width="880" height="254" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">m06-oversight</title><desc id="d">Five abilities of human overseers: understand, watch for over-reliance, interpret, override and stop.</desc><defs></defs><rect x="0.75" y="0.75" width="878.5" height="252.5" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><rect x="8.0" y="8.0" width="164.8" height="160.0" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="90.4" y="73.2" font-size="16" font-weight="bold" fill="#1e3a8a" text-anchor="middle">Understand</text><text x="90.4" y="93.2" font-size="16" font-weight="normal" fill="#1e3a8a" text-anchor="middle">capacities and limits</text><text x="90.4" y="113.2" font-size="16" font-weight="normal" fill="#1e3a8a" text-anchor="middle">of the system</text><rect x="182.8" y="8.0" width="164.8" height="160.0" rx="8" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.6"/><text x="265.2" y="73.2" font-size="16" font-weight="bold" fill="#134e4a" text-anchor="middle">Watch</text><text x="265.2" y="93.2" font-size="16" font-weight="normal" fill="#134e4a" text-anchor="middle">for automation bias</text><text x="265.2" y="113.2" font-size="16" font-weight="normal" fill="#134e4a" text-anchor="middle">and over-reliance</text><rect x="357.6" y="8.0" width="164.8" height="160.0" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="440.0" y="83.2" font-size="16" font-weight="bold" fill="#14532d" text-anchor="middle">Interpret</text><text x="440.0" y="103.2" font-size="16" font-weight="normal" fill="#14532d" text-anchor="middle">the output correctly</text><rect x="532.4" y="8.0" width="164.8" height="160.0" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="614.8" y="73.2" font-size="16" font-weight="bold" fill="#78350f" text-anchor="middle">Override</text><text x="614.8" y="93.2" font-size="16" font-weight="normal" fill="#78350f" text-anchor="middle">disregard, reverse,</text><text x="614.8" y="113.2" font-size="16" font-weight="normal" fill="#78350f" text-anchor="middle">or decide not to use</text><rect x="707.2" y="8.0" width="164.8" height="160.0" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.6"/><text x="789.6" y="73.2" font-size="16" font-weight="bold" fill="#7f1d1d" text-anchor="middle">Stop</text><text x="789.6" y="93.2" font-size="16" font-weight="normal" fill="#7f1d1d" text-anchor="middle">intervene with a</text><text x="789.6" y="113.2" font-size="16" font-weight="normal" fill="#7f1d1d" text-anchor="middle">stop button</text><rect x="8.0" y="188.0" width="864.0" height="56.0" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.6" stroke-dasharray="6 4"/><text x="440.0" y="220.9" font-size="15" font-weight="normal" fill="#374151" text-anchor="middle">Remote biometric identification: a result is acted on only after separate verification by two people</text></svg>