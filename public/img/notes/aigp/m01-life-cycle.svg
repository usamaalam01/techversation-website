<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 440" width="880" height="440" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">m01-life-cycle</title><desc id="d">Seven life-cycle stages from plan and design to monitor and maintain, with retirement as the exit.</desc><defs><marker id="ah0" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker></defs><rect x="0.75" y="0.75" width="878.5" height="438.5" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><rect x="251.0" y="36.0" width="170.0" height="52.0" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="336.0" y="67.2" font-size="16" font-weight="bold" fill="#1e3a8a" text-anchor="middle">Plan and design</text><rect x="412.1" y="96.2" width="170.0" height="52.0" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="497.1" y="127.4" font-size="16" font-weight="bold" fill="#1e3a8a" text-anchor="middle">Collect data</text><rect x="451.8" y="231.6" width="170.0" height="52.0" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="536.8" y="262.8" font-size="16" font-weight="bold" fill="#1e3a8a" text-anchor="middle">Build and train</text><rect x="340.4" y="340.2" width="170.0" height="52.0" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="425.4" y="371.4" font-size="16" font-weight="bold" fill="#1e3a8a" text-anchor="middle">Test and validate</text><rect x="161.6" y="340.2" width="170.0" height="52.0" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="246.6" y="371.4" font-size="16" font-weight="bold" fill="#1e3a8a" text-anchor="middle">Release</text><rect x="50.2" y="231.6" width="170.0" height="52.0" rx="8" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.6"/><text x="135.2" y="262.8" font-size="16" font-weight="bold" fill="#134e4a" text-anchor="middle">Deploy and use</text><rect x="89.9" y="96.2" width="170.0" height="52.0" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.6"/><text x="174.9" y="117.4" font-size="16" font-weight="bold" fill="#4c1d95" text-anchor="middle">Monitor and</text><text x="174.9" y="137.4" font-size="16" font-weight="bold" fill="#4c1d95" text-anchor="middle">maintain</text><line x1="413.5" y1="91.0" x2="419.5" y2="93.2" stroke="#1f2937" stroke-width="2.6" marker-end="url(#ah0)"/><line x1="505.6" y1="151.2" x2="528.3" y2="228.6" stroke="#1f2937" stroke-width="2.6" marker-end="url(#ah0)"/><line x1="507.1" y1="286.6" x2="455.2" y2="337.2" stroke="#1f2937" stroke-width="2.6" marker-end="url(#ah0)"/><line x1="337.4" y1="366.2" x2="334.6" y2="366.2" stroke="#1f2937" stroke-width="2.6" marker-end="url(#ah0)"/><line x1="216.8" y1="337.2" x2="164.9" y2="286.6" stroke="#1f2937" stroke-width="2.6" marker-end="url(#ah0)"/><line x1="143.7" y1="228.6" x2="166.4" y2="151.2" stroke="#1f2937" stroke-width="2.6" marker-end="url(#ah0)"/><line x1="252.5" y1="93.2" x2="258.5" y2="91.0" stroke="#1f2937" stroke-width="2.6" marker-end="url(#ah0)"/><rect x="251.0" y="192.0" width="170.0" height="60.0" rx="8" fill="#1e3a8a" stroke="#1e3a8a" stroke-width="1.6"/><text x="336.0" y="227.8" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="middle">AI life cycle</text><rect x="660.0" y="40.0" width="212.0" height="64.0" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="766.0" y="67.2" font-size="16" font-weight="bold" fill="#1e3a8a" text-anchor="middle">Developer's view</text><text x="766.0" y="87.2" font-size="16" font-weight="normal" fill="#1e3a8a" text-anchor="middle">domain III</text><rect x="660.0" y="120.0" width="212.0" height="64.0" rx="8" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.6"/><text x="766.0" y="147.2" font-size="16" font-weight="bold" fill="#134e4a" text-anchor="middle">Deployer's view</text><text x="766.0" y="167.2" font-size="16" font-weight="normal" fill="#134e4a" text-anchor="middle">domain IV</text><rect x="660.0" y="200.0" width="212.0" height="64.0" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.6"/><text x="766.0" y="227.2" font-size="16" font-weight="bold" fill="#4c1d95" text-anchor="middle">Monitoring appears in</text><text x="766.0" y="247.2" font-size="16" font-weight="bold" fill="#4c1d95" text-anchor="middle">both</text><rect x="660.0" y="300.0" width="212.0" height="64.0" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.6" stroke-dasharray="6 4"/><text x="766.0" y="327.2" font-size="16" font-weight="bold" fill="#374151" text-anchor="middle">Retire</text><text x="766.0" y="347.2" font-size="16" font-weight="normal" fill="#374151" text-anchor="middle">the exit from the cycle</text><line x1="526.0" y1="366.0" x2="658.0" y2="338.0" stroke="#1f2937" stroke-width="2.4" stroke-dasharray="6 4" marker-end="url(#ah0)"/></svg>