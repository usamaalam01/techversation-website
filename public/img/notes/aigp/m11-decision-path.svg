<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 184" width="880" height="184" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">m11-decision-path</title><desc id="d">Five steps from context to decision: context, model type, deployment option, impact assessment and the go, conditional go or no-go decision.</desc><defs></defs><rect x="0.75" y="0.75" width="878.5" height="182.5" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><polygon points="8.0,8.0 156.0,8.0 176.0,41.0 156.0,74.0 8.0,74.0" fill="#dbeafe" stroke="#2563eb" stroke-width="1.8"/><text x="85.0" y="46.1" font-size="16" font-weight="bold" fill="#1e3a8a" text-anchor="middle">Context</text><rect x="10.0" y="78.0" width="154.0" height="100.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="18.0" y="123.5" font-size="15" font-weight="normal" fill="#1f2937" text-anchor="start">goals, needs, data,</text><text x="18.0" y="142.2" font-size="15" font-weight="normal" fill="#1f2937" text-anchor="start">ethics, people</text><polygon points="182.0,8.0 330.0,8.0 350.0,41.0 330.0,74.0 182.0,74.0 202.0,41.0" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.8"/><text x="266.0" y="46.1" font-size="16" font-weight="bold" fill="#134e4a" text-anchor="middle">Model type</text><rect x="184.0" y="78.0" width="154.0" height="100.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="192.0" y="114.1" font-size="15" font-weight="normal" fill="#1f2937" text-anchor="start">classic or</text><text x="192.0" y="132.9" font-size="15" font-weight="normal" fill="#1f2937" text-anchor="start">generative, closed</text><text x="192.0" y="151.6" font-size="15" font-weight="normal" fill="#1f2937" text-anchor="start">or open</text><polygon points="356.0,8.0 504.0,8.0 524.0,41.0 504.0,74.0 356.0,74.0 376.0,41.0" fill="#dcfce7" stroke="#16a34a" stroke-width="1.8"/><text x="440.0" y="36.5" font-size="16" font-weight="bold" fill="#14532d" text-anchor="middle">Deployment</text><text x="440.0" y="55.7" font-size="16" font-weight="bold" fill="#14532d" text-anchor="middle">option</text><rect x="358.0" y="78.0" width="154.0" height="100.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="366.0" y="123.5" font-size="15" font-weight="normal" fill="#1f2937" text-anchor="start">where it runs; how it</text><text x="366.0" y="142.2" font-size="15" font-weight="normal" fill="#1f2937" text-anchor="start">is used</text><polygon points="530.0,8.0 678.0,8.0 698.0,41.0 678.0,74.0 530.0,74.0 550.0,41.0" fill="#fef3c7" stroke="#d97706" stroke-width="1.8"/><text x="614.0" y="36.5" font-size="16" font-weight="bold" fill="#78350f" text-anchor="middle">Impact</text><text x="614.0" y="55.7" font-size="16" font-weight="bold" fill="#78350f" text-anchor="middle">assessment</text><rect x="532.0" y="78.0" width="154.0" height="100.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="540.0" y="132.9" font-size="15" font-weight="normal" fill="#1f2937" text-anchor="start">module 12</text><polygon points="704.0,8.0 852.0,8.0 872.0,41.0 852.0,74.0 704.0,74.0 724.0,41.0" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.8"/><text x="788.0" y="46.1" font-size="16" font-weight="bold" fill="#4c1d95" text-anchor="middle">Decision</text><rect x="706.0" y="78.0" width="154.0" height="100.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="714.0" y="123.5" font-size="15" font-weight="normal" fill="#1f2937" text-anchor="start">go, go with</text><text x="714.0" y="142.2" font-size="15" font-weight="normal" fill="#1f2937" text-anchor="start">conditions, or no-go</text></svg>