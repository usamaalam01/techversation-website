<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 370" width="880" height="370" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">m10-red-team</title><desc id="d">The red-team cycle: define scope and goals, attack, record findings with severity, fix and retest.</desc><defs><marker id="ah0" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker></defs><rect x="0.75" y="0.75" width="878.5" height="368.5" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><rect x="315.0" y="36.0" width="250.0" height="74.0" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="440.0" y="68.2" font-size="16" font-weight="bold" fill="#1e3a8a" text-anchor="middle">1 Scope and goals</text><text x="440.0" y="88.2" font-size="16" font-weight="normal" fill="#1e3a8a" text-anchor="middle">what to try to break</text><rect x="625.0" y="148.0" width="250.0" height="74.0" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.6"/><text x="750.0" y="170.2" font-size="16" font-weight="bold" fill="#7f1d1d" text-anchor="middle">2 Attack</text><text x="750.0" y="190.2" font-size="16" font-weight="normal" fill="#7f1d1d" text-anchor="middle">misuse, jailbreaks, bias probes,</text><text x="750.0" y="210.2" font-size="16" font-weight="normal" fill="#7f1d1d" text-anchor="middle">extraction</text><rect x="315.0" y="260.0" width="250.0" height="74.0" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="440.0" y="292.2" font-size="16" font-weight="bold" fill="#78350f" text-anchor="middle">3 Record findings</text><text x="440.0" y="312.2" font-size="16" font-weight="normal" fill="#78350f" text-anchor="middle">with severity</text><rect x="5.0" y="148.0" width="250.0" height="74.0" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="130.0" y="180.2" font-size="16" font-weight="bold" fill="#14532d" text-anchor="middle">4 Fix and retest</text><text x="130.0" y="200.2" font-size="16" font-weight="normal" fill="#14532d" text-anchor="middle">then repeat periodically</text><line x1="550.7" y1="113.0" x2="639.3" y2="145.0" stroke="#1f2937" stroke-width="2.6" marker-end="url(#ah0)"/><line x1="639.3" y1="225.0" x2="550.7" y2="257.0" stroke="#1f2937" stroke-width="2.6" marker-end="url(#ah0)"/><line x1="329.3" y1="257.0" x2="240.7" y2="225.0" stroke="#1f2937" stroke-width="2.6" marker-end="url(#ah0)"/><line x1="240.7" y1="145.0" x2="329.3" y2="113.0" stroke="#1f2937" stroke-width="2.6" marker-end="url(#ah0)"/><rect x="315.0" y="143.0" width="250.0" height="84.0" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.6"/><text x="440.0" y="180.2" font-size="16" font-weight="bold" fill="#374151" text-anchor="middle">Independent testers see what</text><text x="440.0" y="200.2" font-size="16" font-weight="bold" fill="#374151" text-anchor="middle">builders miss</text></svg>