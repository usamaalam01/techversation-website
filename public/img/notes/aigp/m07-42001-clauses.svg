<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 460" width="880" height="460" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">m07-42001-clauses</title><desc id="d">The seven clauses of ISO/IEC 42001, from context to improvement, in a plan-do-check-act cycle.</desc><defs><marker id="ah0" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker></defs><rect x="0.75" y="0.75" width="878.5" height="458.5" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><rect x="330.0" y="39.0" width="220.0" height="62.0" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="440.0" y="75.2" font-size="16" font-weight="bold" fill="#1e3a8a" text-anchor="middle">4 Context</text><rect x="588.0" y="99.2" width="220.0" height="62.0" rx="8" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.6"/><text x="698.0" y="135.4" font-size="16" font-weight="bold" fill="#134e4a" text-anchor="middle">5 Leadership, AI policy</text><rect x="651.7" y="234.6" width="220.0" height="62.0" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="761.7" y="260.8" font-size="16" font-weight="bold" fill="#14532d" text-anchor="middle">6 Planning</text><text x="761.7" y="280.8" font-size="16" font-weight="normal" fill="#14532d" text-anchor="middle">risk and impact assessment</text><rect x="473.2" y="343.2" width="220.0" height="62.0" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="583.2" y="379.4" font-size="16" font-weight="bold" fill="#78350f" text-anchor="middle">7 Support</text><rect x="186.8" y="343.2" width="220.0" height="62.0" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.6"/><text x="296.8" y="369.4" font-size="16" font-weight="bold" fill="#4c1d95" text-anchor="middle">8 Operation</text><text x="296.8" y="389.4" font-size="16" font-weight="normal" fill="#4c1d95" text-anchor="middle">life-cycle processes</text><rect