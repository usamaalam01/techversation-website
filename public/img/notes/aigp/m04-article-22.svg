<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 286" width="880" height="286" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">m04-article-22</title><desc id="d">Article 22: solely automated, legal or similarly significant effect, exception needed, safeguards required.</desc><defs></defs><rect x="0.75" y="0.75" width="878.5" height="284.5" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><polygon points="8.0,8.0 195.0,8.0 215.0,39.0 195.0,70.0 8.0,70.0" fill="#dbeafe" stroke="#2563eb" stroke-width="1.8"/><text x="104.5" y="44.4" font-size="17" font-weight="bold" fill="#1e3a8a" text-anchor="middle">Solely automated?</text><rect x="10.0" y="74.0" width="193.0" height="130.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="18.0" y="125.1" font-size="15" font-weight="normal" fill="#1f2937" text-anchor="start">no meaningful human</text><text x="18.0" y="143.9" font-size="15" font-weight="normal" fill="#1f2937" text-anchor="start">involvement, including</text><text x="18.0" y="162.6" font-size="15" font-weight="normal" fill="#1f2937" text-anchor="start">profiling</text><polygon points="227.0,8.0 414.0,8.0 434.0,39.0 414.0,70.0 227.0,70.0 247.0,39.0" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.8"/><text x="330.5" y="44.4" font-size="17" font-weight="bold" fill="#134e4a" text-anchor="middle">Significant effect?</text><rect x="229.0" y="74.0" width="193.0" height="130.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="237.0" y="134.5" font-size="15" font-weight="normal" fill="#1f2937" text-anchor="start">legal effect or similarly</text><text x="237.0" y="153.2" font-size="15" font-weight="normal" fill="#1f2937" text-anchor="start">significant</text><polygon points="446.0,8.0 633.0,8.0 653.0,39.0 633.0,70.0 446.0,70.0 466.0,39.0" fill="#fef3c7" stroke="#d97706" stroke-width="1.8"/><text x="549.5" y="44.4" font-size="17" font-weight="bold" fill="#78350f" text-anchor="middle">Exception needed</text><rect x="448.0" y="74.0" width="193.0" height="130.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="456.0" y="125.1" font-size="15" font-weight="normal" fill="#1f2937" text-anchor="start">contract, law with</text><text x="456.0" y="143.9" font-size="15" font-weight="normal" fill="#1f2937" text-anchor="start">safeguards, or explicit</text><text x="456.0" y="162.6" font-size="15" font-weight="normal" fill="#1f2937" text-anchor="start">consent</text><polygon points="665.0,8.0 852.0,8.0 872.0,39.0 852.0,70.0 665.0,70.0 685.0,39.0" fill="#dcfce7" stroke="#16a34a" stroke-width="1.8"/><text x="768.5" y="44.4" font-size="17" font-weight="bold" fill="#14532d" text-anchor="middle">Safeguards</text><rect x="667.0" y="74.0" width="193.0" height="130.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="675.0" y="134.5" font-size="15" font-weight="normal" fill="#1f2937" text-anchor="start">human intervention,</text><text x="675.0" y="153.2" font-size="15" font-weight="normal" fill="#1f2937" text-anchor="start">express a view, contest</text><rect x="8.0" y="216.0" width="864.0" height="60.0" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.6"/><text x="440.0" y="251.5" font-size="17" font-weight="bold" fill="#7f1d1d" text-anchor="middle">Special-category data: only with explicit consent or substantial public interest, plus safeguards</text></svg>