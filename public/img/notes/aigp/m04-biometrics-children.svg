<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 274" width="880" height="274" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">m04-biometrics-children</title><desc id="d">Biometric data, children's data and the pointer to AI-specific law.</desc><defs></defs><rect x="0.75" y="0.75" width="878.5" height="272.5" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><rect x="8.0" y="8.0" width="278.7" height="52.0" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.6"/><text x="147.3" y="39.8" font-size="18" font-weight="bold" fill="#4c1d95" text-anchor="middle">Biometric data</text><rect x="8.0" y="68.0" width="278.7" height="196.0" rx="10" fill="#ffffff" stroke="#7c3aed" stroke-width="1.8"/><circle cx="27.0" cy="92.1" r="3.4" fill="#7c3aed" stroke="#7c3aed" stroke-width="1"/><text x="44.0" y="97.2" font-size="16" font-weight="normal" fill="#1f2937" text-anchor="start">technical processing of physical</text><text x="44.0" y="116.7" font-size="16" font-weight="normal" fill="#1f2937" text-anchor="start">or behavioral traits</text><circle cx="27.0" cy="145.1" r="3.4" fill="#7c3aed" stroke="#7c3aed" stroke-width="1"/><text x="44.0" y="150.2" font-size="16" font-weight="normal" fill="#1f2937" text-anchor="start">special category when used to</text><text x="44.0" y="169.8" font-size="16" font-weight="normal" fill="#1f2937" text-anchor="start">identify</text><circle cx="27.0" cy="198.2" r="3.4" fill="#7c3aed" stroke="#7c3aed" stroke-width="1"/><text x="44.0" y="203.3" font-size="16" font-weight="normal" fill="#1f2937" text-anchor="start">Illinois BIPA: written release,</text><text x="44.0" y="222.8" font-size="16" font-weight="normal" fill="#1f2937" text-anchor="start">retention policy, damages</text><rect x="300.7" y="8.0" width="278.7" height="52.0" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="440.0" y="39.8" font-size="18" font-weight="bold" fill="#78350f" text-anchor="middle">Children's data</text><rect x="300.7" y="68.0" width="278.7" height="196.0" rx="10" fill="#ffffff" stroke="#d97706" stroke-width="1.8"/><circle cx="319.7" cy="92.1" r="3.4" fill="#d97706" stroke="#d97706" stroke-width="1"/><text x="336.7" y="97.2" font-size="16" font-weight="normal" fill="#1f2937" text-anchor="start">consent age 16 online; Member</text><text x="336.7" y="116.7" font-size="16" font-weight="normal" fill="#1f2937" text-anchor="start">States may lower it to 13</text><circle cx="319.7" cy="145.1" r="3.4" fill="#d97706" stroke="#d97706" stroke-width="1"/><text x="336.7" y="150.2" font-size="16" font-weight="normal" fill="#1f2937" text-anchor="start">extra care in notices and design</text><circle cx="319.7" cy="178.6" r="3.4" fill="#d97706" stroke="#d97706" stroke-width="1"/><text x="336.7" y="183.8" font-size="16" font-weight="normal" fill="#1f2937" text-anchor="start">a parent or guardian steps in</text><text x="336.7" y="203.3" font-size="16" font-weight="normal" fill="#1f2937" text-anchor="start">below the age</text><rect x="593.3" y="8.0" width="278.7" height="52.0" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.6"/><text x="732.7" y="39.8" font-size="18" font-weight="bold" fill="#374151" text-anchor="middle">AI-specific law</text><rect x="593.3" y="68.0" width="278.7" height="196.0" rx="10" fill="#ffffff" stroke="#9ca3af" stroke-width="1.8"/><circle cx="612.3" cy="92.1" r="3.4" fill="#9ca3af" stroke="#9ca3af" stroke-width="1"/><text x="629.3" y="97.2" font-size="16" font-weight="normal" fill="#1f2937" text-anchor="start">restricts some biometric uses</text><circle cx="612.3" cy="125.6" r="3.4" fill="#9ca3af" stroke="#9ca3af" stroke-width="1"/><text x="629.3" y="130.7" font-size="16" font-weight="normal" fill="#1f2937" text-anchor="start">adds duties for high-risk</text><text x="629.3" y="150.2" font-size="16" font-weight="normal" fill="#1f2937" text-anchor="start">systems</text><circle cx="612.3" cy="178.6" r="3.4" fill="#9ca3af" stroke="#9ca3af" stroke-width="1"/><text x="629.3" y="183.8" font-size="16" font-weight="normal" fill="#1f2937" text-anchor="start">see module 6</text></svg>