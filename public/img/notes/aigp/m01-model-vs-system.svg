<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 362" width="880" height="362" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">m01-model-vs-system</title><desc id="d">A stack from data to model to system to application, with the general-purpose AI model and system marked.</desc><defs></defs><rect x="0.75" y="0.75" width="878.5" height="360.5" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><rect x="8.0" y="8.0" width="150.0" height="76.0" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.6"/><text x="83.0" y="51.8" font-size="18" font-weight="bold" fill="#374151" text-anchor="middle">Application</text><rect x="168.0" y="8.0" width="410.0" height="76.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="180.0" y="41.5" font-size="15" font-weight="bold" fill="#1f2937" text-anchor="start">the task the system serves</text><text x="180.0" y="60.2" font-size="15" font-weight="normal" fill="#1f2937" text-anchor="start">Helios: answering customer questions</text><rect x="8.0" y="98.0" width="150.0" height="76.0" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="83.0" y="141.8" font-size="18" font-weight="bold" fill="#1e3a8a" text-anchor="middle">AI system</text><rect x="168.0" y="98.0" width="410.0" height="76.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="180.0" y="131.5" font-size="15" font-weight="bold" fill="#1f2937" text-anchor="start">model + data flows + interface + rules + purpose</text><text x="180.0" y="150.2" font-size="15" font-weight="normal" fill="#1f2937" text-anchor="start">Helios: the support assistant</text><rect x="8.0" y="188.0" width="150.0" height="76.0" rx="8" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.6"/><text x="83.0" y="231.8" font-size="18" font-weight="bold" fill="#134e4a" text-anchor="middle">AI model</text><rect x="168.0" y="188.0" width="410.0" height="76.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="180.0" y="221.5" font-size="15" font-weight="bold" fill="#1f2937" text-anchor="start">trained patterns that turn input into output</text><text x="180.0" y="240.2" font-size="15" font-weight="normal" fill="#1f2937" text-anchor="start">Helios: the Corvid Labs model</text><rect x="8.0" y="278.0" width="150.0" height="76.0" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="83.0" y="321.9" font-size="18" font-weight="bold" fill="#14532d" text-anchor="middle">Data</text><rect x="168.0" y="278.0" width="410.0" height="76.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="180.0" y="311.5" font-size="15" font-weight="bold" fill="#1f2937" text-anchor="start">what the model learned from and what it receives</text><text x="180.0" y="330.2" font-size="15" font-weight="normal" fill="#1f2937" text-anchor="start">Helios: support documents and customer questions</text><rect x="600.0" y="98.0" width="272.0" height="76.0" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="736.0" y="131.2" font-size="16" font-weight="bold" fill="#78350f" text-anchor="middle">General-purpose AI system</text><text x="736.0" y="151.2" font-size="16" font-weight="normal" fill="#78350f" text-anchor="middle">Article 3(66)</text><rect x="600.0" y="188.0" width="272.0" height="76.0" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="736.0" y="221.2" font-size="16" font-weight="bold" fill="#78350f" text-anchor="middle">General-purpose AI model</text><text x="736.0" y="241.2" font-size="16" font-weight="normal" fill="#78350f" text-anchor="middle">Article 3(63)</text><line x1="586.0" y1="136.0" x2="598.0" y2="136.0" stroke="#1f2937" stroke-width="2.4"/><line x1="586.0" y1="226.0" x2="598.0" y2="226.0" stroke="#1f2937" stroke-width="2.4"/></svg>