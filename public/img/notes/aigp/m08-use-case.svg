<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 268" width="880" height="268" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">m08-use-case</title><desc id="d">Six parts of a use-case definition.</desc><defs></defs><rect x="0.75" y="0.75" width="878.5" height="266.5" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><rect x="8.0" y="8.0" width="280.0" height="120.0" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="148.0" y="52.3" font-size="17" font-weight="bold" fill="#1e3a8a" text-anchor="middle">Purpose</text><text x="148.0" y="73.5" font-size="17" font-weight="normal" fill="#1e3a8a" text-anchor="middle">the problem and the decision</text><text x="148.0" y="94.8" font-size="17" font-weight="normal" fill="#1e3a8a" text-anchor="middle">supported</text><rect x="300.0" y="8.0" width="280.0" height="120.0" rx="8" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.6"/><text x="440.0" y="52.3" font-size="17" font-weight="bold" fill="#134e4a" text-anchor="middle">Users and affected people</text><text x="440.0" y="73.5" font-size="17" font-weight="normal" fill="#134e4a" text-anchor="middle">who operates it, who is subject to</text><text x="440.0" y="94.8" font-size="17" font-weight="normal" fill="#134e4a" text-anchor="middle">it</text><rect x="592.0" y="8.0" width="280.0" height="120.0" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="732.0" y="52.3" font-size="17" font-weight="bold" fill="#14532d" text-anchor="middle">Benefits, success criteria</text><text x="732.0" y="73.5" font-size="17" font-weight="normal" fill="#14532d" text-anchor="middle">how success and harm limits are</text><text x="732.0" y="94.8" font-size="17" font-weight="normal" fill="#14532d" text-anchor="middle">measured</text><rect x="8.0" y="140.0" width="280.0" height="120.0" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="148.0" y="194.9" font-size="17" font-weight="bold" fill="#78350f" text-anchor="middle">Constraints</text><text x="148.0" y="216.2" font-size="17" font-weight="normal" fill="#78350f" text-anchor="middle">data, cost, time, risk tolerance</text><rect x="300.0" y="140.0" width="280.0" height="120.0" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.6"/><text x="440.0" y="194.9" font-size="17" font-weight="bold" fill="#4c1d95" text-anchor="middle">Legal and ethical context</text><text x="440.0" y="216.2" font-size="17" font-weight="normal" fill="#4c1d95" text-anchor="middle">laws, standards, values</text><rect x="592.0" y="140.0" width="280.0" height="120.0" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.6"/><text x="732.0" y="194.9" font-size="17" font-weight="bold" fill="#7f1d1d" text-anchor="middle">Alternatives</text><text x="732.0" y="216.2" font-size="17" font-weight="normal" fill="#7f1d1d" text-anchor="middle">including a non-AI option</text></svg>