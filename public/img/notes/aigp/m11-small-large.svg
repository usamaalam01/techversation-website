<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 408" width="880" height="408" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">m11-small-large</title><desc id="d">Large models offer breadth at higher cost and with harder testing; small models are cheaper and easier to keep in-house but narrower.</desc><defs></defs><rect x="0.75" y="0.75" width="878.5" height="406.5" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><rect x="128.0" y="8.0" width="367.0" height="48.0" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.6"/><text x="311.5" y="37.8" font-size="18" font-weight="bold" fill="#4c1d95" text-anchor="middle">Large</text><rect x="505.0" y="8.0" width="367.0" height="48.0" rx="8" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.6"/><text x="688.5" y="37.8" font-size="18" font-weight="bold" fill="#134e4a" text-anchor="middle">Small</text><text x="112.0" y="100.0" font-size="15" font-weight="bold" fill="#6b7280" text-anchor="end">Breadth</text><rect x="128.0" y="66.0" width="367.0" height="58.0" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.6"/><text x="140.0" y="100.5" font-size="17" font-weight="normal" fill="#4c1d95" text-anchor="start">broad abilities, varied tasks</text><rect x="505.0" y="66.0" width="367.0" height="58.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="517.0" y="100.5" font-size="17" font-weight="normal" fill="#1f2937" text-anchor="start">narrower task range</text><text x="112.0" y="168.0" font-size="15" font-weight="bold" fill="#6b7280" text-anchor="end">Cost, speed</text><rect x="128.0" y="134.0" width="367.0" height="58.0" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.6"/><text x="140.0" y="168.5" font-size="17" font-weight="normal" fill="#4c1d95" text-anchor="start">higher cost, slower answers</text><rect x="505.0" y="134.0" width="367.0" height="58.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="517.0" y="168.5" font-size="17" font-weight="normal" fill="#1f2937" text-anchor="start">cheaper and faster</text><text x="112.0" y="236.0" font-size="15" font-weight="bold" fill="#6b7280" text-anchor="end">Where</text><rect x="128.0" y="202.0" width="367.0" height="58.0" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.6"/><text x="140.0" y="236.5" font-size="17" font-weight="normal" fill="#4c1d95" text-anchor="start">usually through a provider</text><rect x="505.0" y="202.0" width="367.0" height="58.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="517.0" y="236.5" font-size="17" font-weight="normal" fill="#1f2937" text-anchor="start">your own hardware or a device</text><text x="112.0" y="304.0" font-size="15" font-weight="bold" fill="#6b7280" text-anchor="end">Testing</text><rect x="128.0" y="270.0" width="367.0" height="58.0" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.6"/><text x="140.0" y="304.5" font-size="17" font-weight="normal" fill="#4c1d95" text-anchor="start">harder to cover fully</text><rect x="505.0" y="270.0" width="367.0" height="58.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="517.0" y="293.9" font-size="17" font-weight="normal" fill="#1f2937" text-anchor="start">easier to cover; may need retrieval or</text><text x="517.0" y="315.1" font-size="17" font-weight="normal" fill="#1f2937" text-anchor="start">fine-tuning</text><rect x="8.0" y="344.0" width="864.0" height="54.0" rx="8" fill="#1e3a8a" stroke="#1e3a8a" stroke-width="1.6"/><text x="440.0" y="376.9" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="middle">Choose the smallest model that meets the requirements</text></svg>