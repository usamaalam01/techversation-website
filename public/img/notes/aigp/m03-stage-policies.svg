<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 374" width="880" height="374" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">m03-stage-policies</title><desc id="d">Nine life-cycle policy topics, from intake and use-case review to incident response.</desc><defs></defs><rect x="0.75" y="0.75" width="878.5" height="372.5" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><rect x="8.0" y="8.0" width="278.7" height="110.0" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="147.3" y="57.9" font-size="17" font-weight="bold" fill="#1e3a8a" text-anchor="middle">1 Intake and use-case review</text><text x="147.3" y="79.2" font-size="17" font-weight="normal" fill="#1e3a8a" text-anchor="middle">is AI right, and allowed?</text><rect x="300.7" y="8.0" width="278.7" height="110.0" rx="8" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.6"/><text x="440.0" y="57.9" font-size="17" font-weight="bold" fill="#134e4a" text-anchor="middle">2 Risk assessment</text><text x="440.0" y="79.2" font-size="17" font-weight="normal" fill="#134e4a" text-anchor="middle">how risky, which controls?</text><rect x="593.3" y="8.0" width="278.7" height="110.0" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="732.7" y="47.3" font-size="17" font-weight="bold" fill="#14532d" text-anchor="middle">3 Ethics and design review</text><text x="732.7" y="68.5" font-size="17" font-weight="normal" fill="#14532d" text-anchor="middle">fairness and oversight designed</text><text x="732.7" y="89.8" font-size="17" font-weight="normal" fill="#14532d" text-anchor="middle">in</text><rect x="8.0" y="132.0" width="278.7" height="110.0" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="147.3" y="181.9" font-size="17" font-weight="bold" fill="#78350f" text-anchor="middle">4 Data sourcing and use</text><text x="147.3" y="203.2" font-size="17" font-weight="normal" fill="#78350f" text-anchor="middle">rights, quality, privacy</text><rect x="300.7" y="132.0" width="278.7" height="110.0" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.6"/><text x="440.0" y="171.3" font-size="17" font-weight="bold" fill="#4c1d95" text-anchor="middle">5 Build standards</text><text x="440.0" y="192.5" font-size="17" font-weight="normal" fill="#4c1d95" text-anchor="middle">tools, versions, secure</text><text x="440.0" y="213.8" font-size="17" font-weight="normal" fill="#4c1d95" text-anchor="middle">development</text><rect x="593.3" y="132.0" width="278.7" height="110.0" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.6"/><text x="732.7" y="181.9" font-size="17" font-weight="bold" fill="#7f1d1d" text-anchor="middle">6 Test and validation</text><text x="732.7" y="203.2" font-size="17" font-weight="normal" fill="#7f1d1d" text-anchor="middle">performance, bias, security</text><rect x="8.0" y="256.0" width="278.7" height="110.0" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="147.3" y="305.9" font-size="17" font-weight="bold" fill="#1e3a8a" text-anchor="middle">7 Release and live monitoring</text><text x="147.3" y="327.1" font-size="17" font-weight="normal" fill="#1e3a8a" text-anchor="middle">gates, thresholds, owners</text><rect x="300.7" y="256.0" width="278.7" height="110.0" rx="8" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.6"/><text x="440.0" y="305.9" font-size="17" font-weight="bold" fill="#134e4a" text-anchor="middle">8 Records and reporting</text><text x="440.0" y="327.1" font-size="17" font-weight="normal" fill="#134e4a" text-anchor="middle">documentation, retention</text><rect x="593.3" y="256.0" width="278.7" height="110.0" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="732.7" y="305.9" font-size="17" font-weight="bold" fill="#14532d" text-anchor="middle">9 Incident response</text><text x="732.7" y="327.1" font-size="17" font-weight="normal" fill="#14532d" text-anchor="middle">report, escalate, learn</text></svg>