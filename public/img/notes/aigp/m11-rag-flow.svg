<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 246" width="880" height="246" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">m11-rag-flow</title><desc id="d">Retrieval-augmented generation: question, retrieve passages, add them to the prompt, generate, and answer with a source.</desc><defs></defs><rect x="0.75" y="0.75" width="878.5" height="244.5" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><polygon points="8.0,8.0 156.0,8.0 176.0,39.0 156.0,70.0 8.0,70.0" fill="#dbeafe" stroke="#2563eb" stroke-width="1.8"/><text x="85.0" y="44.1" font-size="16" font-weight="bold" fill="#1e3a8a" text-anchor="middle">1 Question</text><rect x="10.0" y="74.0" width="154.0" height="96.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="18.0" y="126.9" font-size="15" font-weight="normal" fill="#1f2937" text-anchor="start">the user asks</text><polygon points="182.0,8.0 330.0,8.0 350.0,39.0 330.0,70.0 182.0,70.0 202.0,39.0" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.8"/><text x="266.0" y="44.1" font-size="16" font-weight="bold" fill="#134e4a" text-anchor="middle">2 Retrieve</text><rect x="184.0" y="74.0" width="154.0" height="96.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="192.0" y="117.5" font-size="15" font-weight="normal" fill="#1f2937" text-anchor="start">find passages in</text><text x="192.0" y="136.2" font-size="15" font-weight="normal" fill="#1f2937" text-anchor="start">your documents</text><polygon points="356.0,8.0 504.0,8.0 524.0,39.0 504.0,70.0 356.0,70.0 376.0,39.0" fill="#dcfce7" stroke="#16a34a" stroke-width="1.8"/><text x="440.0" y="34.5" font-size="16" font-weight="bold" fill="#14532d" text-anchor="middle">3 Add to</text><text x="440.0" y="53.7" font-size="16" font-weight="bold" fill="#14532d" text-anchor="middle">prompt</text><rect x="358.0" y="74.0" width="154.0" height="96.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="366.0" y="1