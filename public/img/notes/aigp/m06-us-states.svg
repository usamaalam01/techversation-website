<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 432" width="880" height="432" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">m06-us-states</title><desc id="d">Colorado, Texas, California, Illinois and New York City: what each regulates.</desc><defs></defs><rect x="0.75" y="0.75" width="878.5" height="430.5" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><rect x="186.0" y="8.0" width="686.0" height="44.0" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="529.0" y="35.5" font-size="17" font-weight="bold" fill="#1e3a8a" text-anchor="middle">Slice of private-sector AI</text><rect x="8.0" y="60.0" width="170.0" height="66.0" rx="8" fill="#1e3a8a" stroke="#1e3a8a" stroke-width="1.6"/><text x="93.0" y="98.5" font-size="17" font-weight="bold" fill="#ffffff" text-anchor="middle">Colorado</text><rect x="186.0" y="60.0" width="686.0" height="66.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="196.0" y="88.2" font-size="16" font-weight="normal" fill="#1f2937" text-anchor="start">replacement law from 1 January 2027: notice, explanation and human review for</text><text x="196.0" y="108.2" font-size="16" font-weight="normal" fill="#1f2937" text-anchor="start">consequential decisions</text><rect x="8.0" y="134.0" width="170.0" height="66.0" rx="8" fill="#1e3a8a" stroke="#1e3a8a" stroke-width="1.6"/><text x="93.0" y="172.5" font-size="17" font-weight="bold" fill="#ffffff" text-anchor="middle">Texas</text><rect x="186.0" y="134.0" width="686.0" height="66.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="196.0" y="172.2" font-size="16" font-weight="normal" fill="#1f2937" text-anchor="start">narrow bans on intentionally harmful uses; Attorney General enforcement; sandbox</text><rect x="8.0" y="208.0" width="170.0" height="66.0" rx="8" fill="#1e3a8a" stroke="#1e3a8a" stroke-width="1.6"/><text x="93.0" y="246.5" font-size="17" font-weight="bold" fill="#ffffff" text-anchor="middle">California</text><rect x="186.0" y="208.0" width="686.0" height="66.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="196.0" y="246.2" font-size="16" font-weight="normal" fill="#1f2937" text-anchor="start">frontier-model transparency and incident reporting; privacy rules on automated decisions</text><rect x="8.0" y="282.0" width="170.0" height="66.0" rx="8" fill="#1e3a8a" stroke="#1e3a8a" stroke-width="1.6"/><text x="93.0" y="320.5" font-size="17" font-weight="bold" fill="#ffffff" text-anchor="middle">Illinois</text><rect x="186.0" y="282.0" width="686.0" height="66.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="196.0" y="320.2" font-size="16" font-weight="normal" fill="#1f2937" text-anchor="start">AI in employment: notice to employees; no discriminatory use or zip-code proxies</text><rect x="8.0" y="356.0" width="170.0" height="66.0" rx="8" fill="#1e3a8a" stroke="#1e3a8a" stroke-width="1.6"/><text x="93.0" y="394.5" font-size="17" font-weight="bold" fill="#ffffff" text-anchor="middle">New York City</text><rect x="186.0" y="356.0" width="686.0" height="66.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="196.0" y="394.2" font-size="16" font-weight="normal" fill="#1f2937" text-anchor="start">hiring tools: annual independent bias audit and candidate notice</text></svg>