<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 312" width="880" height="312" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">m06-incident-clocks</title><desc id="d">Serious incident reporting limits of 2, 10 and 15 days, with post-market monitoring above.</desc><defs></defs><rect x="0.75" y="0.75" width="878.5" height="310.5" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><rect x="8.0" y="8.0" width="864.0" height="60.0" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="440.0" y="33.2" font-size="16" font-weight="bold" fill="#1e3a8a" text-anchor="middle">Post-market monitoring</text><text x="440.0" y="53.2" font-size="16" font-weight="normal" fill="#1e3a8a" text-anchor="middle">proportionate system, lifetime performance data, plan in the technical documentation</text><line x1="60.0" y1="190.0" x2="820.0" y2="190.0" stroke="#6b7280" stroke-width="3"/><line x1="60.0" y1="184.0" x2="60.0" y2="196.0" stroke="#6b7280" stroke-width="2"/><text x="60.0" y="216.0" font-size="14" font-weight="normal" fill="#6b7280" text-anchor="middle">0 days</text><line x1="313.3" y1="184.0" x2="313.3" y2="196.0" stroke="#6b7280" stroke-width="2"/><text x="313.3" y="216.0" font-size="14" font-weight="normal" fill="#6b7280" text-anchor="middle">5 days</text><line x1="566.7" y1="184.0" x2="566.7" y2="196.0" stroke="#6b7280" stroke-width="2"/><text x="566.7" y="216.0" font-size="14" font-weight="normal" fill="#6b7280" text-anchor="middle">10 days</text><line x1="820.0" y1="184.0" x2="820.0" y2="196.0" stroke="#6b7280" stroke-width="2"/><text x="820.0" y="216.0" font-size="14" font-weight="normal" fill="#6b7280" text-anchor="middle">15 days</text><circle cx="161.3" cy="190.0" r="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2.6"/><circle cx="566.7" cy="190.0" r="10" fill="#fef3c7" stroke="#d97706" stroke-width="2.6"/><circle cx="820.0" cy="190.0" r="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2.6"/><rect x="40.0" y="84.0" width="290.0" height="70.0" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.6"/><text x="185.0" y="105.1" font-size="15" font-weight="bold" fill="#7f1d1d" text-anchor="middle">2 days</text><text x="185.0" y="123.9" font-size="15" font-weight="normal" fill="#7f1d1d" text-anchor="middle">widespread infringement or the most</text><text x="185.0" y="142.6" font-size="15" font-weight="normal" fill="#7f1d1d" text-anchor="middle">serious disruption</text><line x1="161.3" y1="154.0" x2="161.3" y2="180.0" stroke="#6b7280" stroke-width="1.8"/><rect x="430.0" y="84.0" width="260.0" height="70.0" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="560.0" y="114.5" font-size="15" font-weight="bold" fill="#78350f" text-anchor="middle">10 days</text><text x="560.0" y="133.2" font-size="15" font-weight="normal" fill="#78350f" text-anchor="middle">after a death</text><line x1="566.7" y1="154.0" x2="566.7" y2="180.0" stroke="#6b7280" stroke-width="1.8"/><rect x="600.0" y="232.0" width="260.0" height="70.0" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="730.0" y="262.5" font-size="15" font-weight="bold" fill="#1e3a8a" text-anchor="middle">15 days</text><text x="730.0" y="281.2" font-size="15" font-weight="normal" fill="#1e3a8a" text-anchor="middle">the general rule, after awareness</text><line x1="820.0" y1="222.0" x2="820.0" y2="232.0" stroke="#6b7280" stroke-width="1.8"/><rect x="40.0" y="232.0" width="520.0" height="70.0" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.6" stroke-dasharray="6 4"/><text x="300.0" y="262.5" font-size="15" font-weight="bold" fill="#374151" text-anchor="middle">Report immediately</text><text x="300.0" y="281.2" font-size="15" font-weight="normal" fill="#374151" text-anchor="middle">once a causal link is established, within these limits</text></svg>