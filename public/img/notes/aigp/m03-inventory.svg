<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 296" width="880" height="296" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">m03-inventory</title><desc id="d">The first Helios inventory: 38 registered AI uses and 9 unregistered, 47 in all.</desc><defs></defs><rect x="0.75" y="0.75" width="878.5" height="294.5" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><text x="8.0" y="34.0" font-size="20" font-weight="bold" fill="#1e3a8a" text-anchor="start">47 AI uses found at Helios</text><rect x="8.0" y="50.0" width="698.6" height="80.0" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="357.3" y="96.2" font-size="19" font-weight="bold" fill="#14532d" text-anchor="middle">38 registered</text><rect x="706.6" y="50.0" width="165.4" height="80.0" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.6"/><text x="789.3" y="96.2" font-size="19" font-weight="bold" fill="#7f1d1d" text-anchor="middle">9 shadow AI</text><rect x="8.0" y="156.0" width="278.7" height="130.0" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="147.3" y="206.2" font-size="16" font-weight="bold" fill="#1e3a8a" text-anchor="middle">How it arises</text><text x="147.3" y="226.2" font-size="16" font-weight="normal" fill="#1e3a8a" text-anchor="middle">free web tools, features switched on</text><text x="147.3" y="246.2" font-size="16" font-weight="normal" fill="#1e3a8a" text-anchor="middle">inside software, team purchases</text><rect x="300.7" y="156.0" width="278.7" height="130.0" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="440.0" y="206.2" font-size="16" font-weight="bold" fill="#78350f" text-anchor="middle">Why it matters</text><text x="440.0" y="226.2" font-size="16" font-weight="normal" fill="#78350f" text-anchor="middle">you cannot govern, assess or retire</text><text x="440.0" y="246.2" font-size="16" font-weight="normal" fill="#78350f" text-anchor="middle">what you cannot see</text><rect x="593.3" y="156.0" width="278.7" height="130.0" rx="8" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.6"/><text x="732.7" y="206.2" font-size="16" font-weight="bold" fill="#134e4a" text-anchor="middle">How to find it</text><text x="732.7" y="226.2" font-size="16" font-weight="normal" fill="#134e4a" text-anchor="middle">surveys, network and expense data,</text><text x="732.7" y="246.2" font-size="16" font-weight="normal" fill="#134e4a" text-anchor="middle">procurement records, an amnesty</text></svg>