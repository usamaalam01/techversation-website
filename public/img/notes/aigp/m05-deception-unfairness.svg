<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 402" width="880" height="402" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">m05-deception-unfairness</title><desc id="d">Deception compared with unfairness by definition, test, AI example and remedy.</desc><defs></defs><rect x="0.75" y="0.75" width="878.5" height="400.5" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><rect x="128.0" y="8.0" width="367.0" height="48.0" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="311.5" y="37.8" font-size="18" font-weight="bold" fill="#78350f" text-anchor="middle">Deception</text><rect x="505.0" y="8.0" width="367.0" height="48.0" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.6"/><text x="688.5" y="37.8" font-size="18" font-weight="bold" fill="#7f1d1d" text-anchor="middle">Unfairness</text><text x="112.0" y="108.0" font-size="15" font-weight="bold" fill="#6b7280" text-anchor="end">What it is</text><rect x="128.0" y="66.0" width="367.0" height="74.0" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="140.0" y="108.2" font-size="16" font-weight="normal" fill="#78350f" text-anchor="start">a claim or omission likely to mislead</text><rect x="505.0" y="66.0" width="367.0" height="74.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="517.0" y="108.2" font-size="16" font-weight="normal" fill="#1f2937" text-anchor="start">a practice that causes substantial injury</text><text x="112.0" y="192.0" font-size="15" font-weight="bold" fill="#6b7280" text-anchor="end">Test</text><rect x="128.0" y="150.0" width="367.0" height="74.0" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="140.0" y="192.2" font-size="16" font-weight="normal" fill="#78350f" text-anchor="start">reasonable consumer; material to the choice</text><rect x="505.0" y="150.0" width="367.0" height="74.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="517.0" y="192.2" font-size="16" font-weight="normal" fill="#1f2937" text-anchor="start">not avoidable; not outweighed by benefits</text><text x="112.0" y="276.0" font-size="15" font-weight="bold" fill="#6b7280" text-anchor="end">AI example</text><rect x="128.0" y="234.0" width="367.0" height="74.0" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="140.0" y="276.2" font-size="16" font-weight="normal" fill="#78350f" text-anchor="start">calling a tool always accurate</text><rect x="505.0" y="234.0" width="367.0" height="74.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="517.0" y="276.2" font-size="16" font-weight="normal" fill="#1f2937" text-anchor="start">a design that traps users or misuses data</text><text x="112.0" y="360.0" font-size="15" font-weight="bold" fill="#6b7280" text-anchor="end">Remedy</text><rect x="128.0" y="318.0" width="367.0" height="74.0" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="140.0" y="360.2" font-size="16" font-weight="normal" fill="#78350f" text-anchor="start">orders, penalties, corrections</text><rect x="505.0" y="318.0" width="367.0" height="74.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="517.0" y="360.2" font-size="16" font-weight="normal" fill="#1f2937" text-anchor="start">orders, penalties, deletion of data or models</text></svg>