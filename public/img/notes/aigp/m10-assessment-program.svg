<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 430" width="880" height="430" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">m10-assessment-program</title><desc id="d">Four periodic assessments: audit, red teaming, threat modeling and security testing, with what each checks, who does it and when.</desc><defs></defs><rect x="0.75" y="0.75" width="878.5" height="428.5" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><rect x="166.0" y="8.0" width="230.0" height="44.0" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="281.0" y="35.5" font-size="17" font-weight="bold" fill="#1e3a8a" text-anchor="middle">What it checks</text><rect x="404.0" y="8.0" width="230.0" height="44.0" rx="8" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.6"/><text x="519.0" y="35.5" font-size="17" font-weight="bold" fill="#134e4a" text-anchor="middle">Who</text><rect x="642.0" y="8.0" width="230.0" height="44.0" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="757.0" y="35.5" font-size="17" font-weight="bold" fill="#14532d" text-anchor="middle">When</text><rect x="8.0" y="60.0" width="150.0" height="84.0" rx="8" fill="#1e3a8a" stroke="#1e3a8a" stroke-width="1.6"/><text x="83.0" y="107.2" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">Audit</text><rect x="166.0" y="60.0" width="230.0" height="84.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="176.0" y="106.9" font-size="15" font-weight="normal" fill="#1f2937" text-anchor="start">compliance with policy and law</text><rect x="404.0" y="60.0" width="230.0" height="84.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="414.0" y="106.9" font-size="15" font-weight="normal" fill="#1f2937" text-anchor="start">independent or internal audit</text><rect x="642.0" y="60.0" width="230.0" height="84.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="652.0" y="97.5" font-size="15" font-weight="normal" fill="#1f2937" text-anchor="start">annually, or after a major</text><text x="652.0" y="116.2" font-size="15" font-weight="normal" fill="#1f2937" text-anchor="start">change</text><rect x="8.0" y="152.0" width="150.0" height="84.0" rx="8" fill="#1e3a8a" stroke="#1e3a8a" stroke-width="1.6"/><text x="83.0" y="199.2" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">Red teaming</text><rect x="166.0" y="152.0" width="230.0" height="84.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="176.0" y="189.5" font-size="15" font-weight="normal" fill="#1f2937" text-anchor="start">ways to make it fail or</text><text x="176.0" y="208.2" font-size="15" font-weight="normal" fill="#1f2937" text-anchor="start">misbehave</text><rect x="404.0" y="152.0" width="230.0" height="84.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="414.0" y="198.9" font-size="15" font-weight="normal" fill="#1f2937" text-anchor="start">red team, internal or external</text><rect x="642.0" y="152.0" width="230.0" height="84.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="652.0" y="189.5" font-size="15" font-weight="normal" fill="#1f2937" text-anchor="start">before release, then</text><text x="652.0" y="208.2" font-size="15" font-weight="normal" fill="#1f2937" text-anchor="start">periodically</text><rect x="8.0" y="244.0" width="150.0" height="84.0" rx="8" fill="#1e3a8a" stroke="#1e3a8a" stroke-width="1.6"/><text x="83.0" y="291.2" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">Threat modeling</text><rect x="166.0" y="244.0" width="230.0" height="84.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="176.0" y="281.5" font-size="15" font-weight="normal" fill="#1f2937" text-anchor="start">how an attacker could reach</text><text x="176.0" y="300.2" font-size="15" font-weight="normal" fill="#1f2937" text-anchor="start">and abuse it</text><rect x="404.0" y="244.0" width="230.0" height="84.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="414.0" y="290.9" font-size="15" font-weight="normal" fill="#1f2937" text-anchor="start">security and engineering</text><rect x="642.0" y="244.0" width="230.0" height="84.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="652.0" y="281.5" font-size="15" font-weight="normal" fill="#1f2937" text-anchor="start">at design, and at each major</text><text x="652.0" y="300.2" font-size="15" font-weight="normal" fill="#1f2937" text-anchor="start">change</text><rect x="8.0" y="336.0" width="150.0" height="84.0" rx="8" fill="#1e3a8a" stroke="#1e3a8a" stroke-width="1.6"/><text x="83.0" y="383.2" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">Security testing</text><rect x="166.0" y="336.0" width="230.0" height="84.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="176.0" y="373.5" font-size="15" font-weight="normal" fill="#1f2937" text-anchor="start">vulnerabilities in code, models,</text><text x="176.0" y="392.2" font-size="15" font-weight="normal" fill="#1f2937" text-anchor="start">infrastructure</text><rect x="404.0" y="336.0" width="230.0" height="84.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="414.0" y="382.9" font-size="15" font-weight="normal" fill="#1f2937" text-anchor="start">security team</text><rect x="642.0" y="336.0" width="230.0" height="84.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="652.0" y="382.9" font-size="15" font-weight="normal" fill="#1f2937" text-anchor="start">regularly, by risk</text></svg>