<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 310" width="880" height="310" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">m10-drift</title><desc id="d">Three kinds of drift: data drift, concept drift and performance drift, each with an example and a way to detect it.</desc><defs></defs><rect x="0.75" y="0.75" width="878.5" height="308.5" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><rect x="8.0" y="8.0" width="278.7" height="52.0" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="147.3" y="39.8" font-size="18" font-weight="bold" fill="#1e3a8a" text-anchor="middle">Data drift</text><rect x="8.0" y="68.0" width="278.7" height="160.0" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="1.8"/><circle cx="27.0" cy="92.1" r="3.4" fill="#2563eb" stroke="#2563eb" stroke-width="1"/><text x="44.0" y="97.2" font-size="16" font-weight="normal" fill="#1f2937" text-anchor="start">the input mix changes</text><circle cx="27.0" cy="125.6" r="3.4" fill="#2563eb" stroke="#2563eb" stroke-width="1"/><text x="44.0" y="130.7" font-size="16" font-weight="normal" fill="#1f2937" text-anchor="start">e.g. applicants from a new</text><text x="44.0" y="150.2" font-size="16" font-weight="normal" fill="#1f2937" text-anchor="start">region</text><circle cx="27.0" cy="178.6" r="3.4" fill="#2563eb" stroke="#2563eb" stroke-width="1"/><text x="44.0" y="183.8" font-size="16" font-weight="normal" fill="#1f2937" text-anchor="start">detect: compare inputs with the</text><text x="44.0" y="203.3" font-size="16" font-weight="normal" fill="#1f2937" text-anchor="start">training data</text><rect x="300.7" y="8.0" width="278.7" height="52.0" rx="8" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.6"/><text x="440.0" y="39.8" font-size="18" font-weight="bold" fill="#134e4a" text-anchor="middle">Concept drift</text><rect x="300.7" y="68.0" width="278.7" height="160.0" rx="10" fill="#ffffff" stroke="#0d9488" stroke-width="1.8"/><circle cx="319.7" cy="92.1" r="3.4" fill="#0d9488" stroke="#0d9488" stroke-width="1"/><text x="336.7" y="97.2" font-size="16" font-weight="normal" fill="#1f2937" text-anchor="start">what the right answer is</text><text x="336.7" y="116.7" font-size="16" font-weight="normal" fill="#1f2937" text-anchor="start">changes</text><circle cx="319.7" cy="145.1" r="3.4" fill="#0d9488" stroke="#0d9488" stroke-width="1"/><text x="336.7" y="150.2" font-size="16" font-weight="normal" fill="#1f2937" text-anchor="start">e.g. a new refund policy</text><circle cx="319.7" cy="178.6" r="3.4" fill="#0d9488" stroke="#0d9488" stroke-width="1"/><text x="336.7" y="183.8" font-size="16" font-weight="normal" fill="#1f2937" text-anchor="start">detect: review outputs against</text><text x="336.7" y="203.3" font-size="16" font-weight="normal" fill="#1f2937" text-anchor="start">current rules</text><rect x="593.3" y="8.0" width="278.7" height="52.0" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.6"/><text x="732.7" y="39.8" font-size="18" font-weight="bold" fill="#7f1d1d" text-anchor="middle">Performance drift</text><rect x="593.3" y="68.0" width="278.7" height="160.0" rx="10" fill="#ffffff" stroke="#dc2626" stroke-width="1.8"/><circle cx="612.3" cy="92.1" r="3.4" fill="#dc2626" stroke="#dc2626" stroke-width="1"/><text x="629.3" y="97.2" font-size="16" font-weight="normal" fill="#1f2937" text-anchor="start">accuracy or fairness falls</text><circle cx="612.3" cy="125.6" r="3.4" fill="#dc2626" stroke="#dc2626" stroke-width="1"/><text x="629.3" y="130.7" font-size="16" font-weight="normal" fill="#1f2937" text-anchor="start">the visible result, and it may lag</text><circle cx="612.3" cy="159.1" r="3.4" fill="#dc2626" stroke="#dc2626" stroke-width="1"/><text x="629.3" y="164.2" font-size="16" font-weight="normal" fill="#1f2937" text-anchor="start">detect: track metrics by group</text><rect x="8.0" y="242.0" width="864.0" height="58.0" rx="8" fill="#1e3a8a" stroke="#1e3a8a" stroke-width="1.6"/><text x="440.0" y="276.9" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="middle">React: investigate, retrain or recalibrate, or roll back, then retest</text></svg>