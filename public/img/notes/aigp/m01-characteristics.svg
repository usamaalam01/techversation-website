<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 272" width="880" height="272" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">m01-characteristics</title><desc id="d">Seven characteristics of AI that call for a comprehensive approach to governance.</desc><defs></defs><rect x="0.75" y="0.75" width="878.5" height="270.5" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><rect x="8.0" y="8.0" width="205.5" height="120.0" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="110.8" y="52.3" font-size="17" font-weight="bold" fill="#1e3a8a" text-anchor="middle">Complexity</text><text x="110.8" y="73.5" font-size="17" font-weight="normal" fill="#1e3a8a" text-anchor="middle">many parts, hard to</text><text x="110.8" y="94.8" font-size="17" font-weight="normal" fill="#1e3a8a" text-anchor="middle">reason about</text><rect x="227.5" y="8.0" width="205.5" height="120.0" rx="8" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.6"/><text x="330.2" y="52.3" font-size="17" font-weight="bold" fill="#134e4a" text-anchor="middle">Opacity</text><text x="330.2" y="73.5" font-size="17" font-weight="normal" fill="#134e4a" text-anchor="middle">hard to see why an</text><text x="330.2" y="94.8" font-size="17" font-weight="normal" fill="#134e4a" text-anchor="middle">output came</text><rect x="447.0" y="8.0" width="205.5" height="120.0" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="549.8" y="52.3" font-size="17" font-weight="bold" fill="#14532d" text-anchor="middle">Autonomy</text><text x="549.8" y="73.5" font-size="17" font-weight="normal" fill="#14532d" text-anchor="middle">acts with little or no</text><text x="549.8" y="94.8" font-size="17" font-weight="normal" fill="#14532d" text-anchor="middle">human step</text><rect x="666.5" y="8.0" width="205.5" height="120.0" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="769.2" y="62.9" font-size="17" font-weight="bold" fill="#78350f" text-anchor="middle">Speed and scale</text><text x="769.2" y="84.2" font-size="17" font-weight="normal" fill="#78350f" text-anchor="middle">volume multiplies errors</text><rect x="8.0" y="142.0" width="278.7" height="120.0" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.6"/><text x="147.3" y="186.3" font-size="17" font-weight="bold" fill="#7f1d1d" text-anchor="middle">Potential for harm or misuse</text><text x="147.3" y="207.5" font-size="17" font-weight="normal" fill="#7f1d1d" text-anchor="middle">powerful tools can be turned to</text><text x="147.3" y="228.8" font-size="17" font-weight="normal" fill="#7f1d1d" text-anchor="middle">bad ends</text><rect x="300.7" y="142.0" width="278.7" height="120.0" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.6"/><text x="440.0" y="196.9" font-size="17" font-weight="bold" fill="#4c1d95" text-anchor="middle">Data dependency</text><text x="440.0" y="218.2" font-size="17" font-weight="normal" fill="#4c1d95" text-anchor="middle">quality follows data quality</text><rect x="593.3" y="142.0" width="278.7" height="120.0" rx="8" fill="#1e3a8a" stroke="#1e3a8a" stroke-width="1.6"/><text x="732.7" y="196.9" font-size="17" font-weight="bold" fill="#ffffff" text-anchor="middle">Probabilistic outputs</text><text x="732.7" y="218.2" font-size="17" font-weight="normal" fill="#ffffff" text-anchor="middle">likelihoods, not certainties</text></svg>