<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 342" width="880" height="342" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">m13-localizing</title><desc id="d">Four ways to localize a system, with a Helios example for each.</desc><defs></defs><rect x="0.75" y="0.75" width="878.5" height="340.5" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><rect x="266.0" y="8.0" width="606.0" height="44.0" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="569.0" y="35.5" font-size="17" font-weight="bold" fill="#14532d" text-anchor="middle">Example at Helios</text><rect x="8.0" y="60.0" width="250.0" height="62.0" rx="8" fill="#1e3a8a" stroke="#1e3a8a" stroke-width="1.6"/><text x="133.0" y="96.5" font-size="17" font-weight="bold" fill="#ffffff" text-anchor="middle">Regional switch</text><rect x="266.0" y="60.0" width="606.0" height="62.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="276.0" y="96.5" font-size="17" font-weight="normal" fill="#1f2937" text-anchor="start">emotion analysis off for EU applicants</text><rect x="8.0" y="130.0" width="250.0" height="62.0" rx="8" fill="#1e3a8a" stroke="#1e3a8a" stroke-width="1.6"/><text x="133.0" y="166.5" font-size="17" font-weight="bold" fill="#ffffff" text-anchor="middle">Feature flag</text><rect x="266.0" y="130.0" width="606.0" height="62.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="276.0" y="166.5" font-size="17" font-weight="normal" fill="#1f2937" text-anchor="start">the agentic function held back</text><rect x="8.0" y="200.0" width="250.0" height="62.0" rx="8" fill="#1e3a8a" stroke="#1e3a8a" stroke-width="1.6"/><text x="133.0" y="236.5" font-size="17" font-weight="bold" fill="#ffffff" text-anchor="middle">User-group limit</text><rect x="266.0" y="200.0" width="606.0" height="62.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="276.0" y="236.5" font-size="17" font-weight="normal" fill