<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 334" width="880" height="334" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">m09-bias-mitigation</title><desc id="d">Bias mitigation before, during and after training.</desc><defs></defs><rect x="0.75" y="0.75" width="878.5" height="332.5" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><polygon points="8.0,8.0 266.7,8.0 286.7,39.0 266.7,70.0 8.0,70.0" fill="#dbeafe" stroke="#2563eb" stroke-width="1.8"/><text x="140.3" y="44.8" font-size="18" font-weight="bold" fill="#1e3a8a" text-anchor="middle">Before training</text><rect x="10.0" y="74.0" width="264.7" height="180.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="18.0" y="149.2" font-size="16" font-weight="normal" fill="#1f2937" text-anchor="start">collect representative data;</text><text x="18.0" y="169.2" font-size="16" font-weight="normal" fill="#1f2937" text-anchor="start">re-sample or re-weight; fix labels;</text><text x="18.0" y="189.2" font-size="16" font-weight="normal" fill="#1f2937" text-anchor="start">remove proxies</text><polygon points="300.7,8.0 559.3,8.0 579.3,39.0 559.3,70.0 300.7,70.0 320.7,39.0" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.8"/><text x="440.0" y="44.8" font-size="18" font-weight="bold" fill="#134e4a" text-anchor="middle">During training</text><rect x="302.7" y="74.0" width="264.7" height="180.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="310.7" y="149.2" font-size="16" font-weight="normal" fill="#1f2937" text-anchor="start">add fairness constraints or</text><text x="310.7" y="169.2" font-size="16" font-weight="normal" fill="#1f2937" text-anchor="start">objectives; compare models on</text><text x="310.7" y="189.2" font-size="16" font-weight="normal" fill="#1f2937" text-anchor="start">group metrics</text><polygon points="593.3,8.0 852.0,8.0 872.0,39.0 852.0,70.0 593.3,70.0 613.3,39.0" fill="#dcfce7" stroke="#16a34a" stroke-width="1.8"/><text x="732.7" y="44.8" font-size="18" font-weight="bold" fill="#14532d" text-anchor="middle">After training</text><rect x="595.3" y="74.0" width="264.7" height="180.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="603.3" y="149.2" font-size="16" font-weight="normal" fill="#1f2937" text-anchor="start">adjust thresholds where lawful;</text><text x="603.3" y="169.2" font-size="16" font-weight="normal" fill="#1f2937" text-anchor="start">add human review; keep</text><text x="603.3" y="189.2" font-size="16" font-weight="normal" fill="#1f2937" text-anchor="start">monitoring</text><rect x="8.0" y="266.0" width="864.0" height="58.0" rx="8" fill="#1e3a8a" stroke="#1e3a8a" stroke-width="1.6"/><text x="440.0" y="300.9" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="middle">Retest after each change and record the trade-offs with accuracy</text></svg>