<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 430" width="880" height="430" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">m13-unintended-uses</title><desc id="d">Secondary use, unintended use, misuse and downstream harm, with a meaning and a Helios example for each.</desc><defs></defs><rect x="0.75" y="0.75" width="878.5" height="428.5" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><rect x="186.0" y="8.0" width="339.0" height="44.0" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="355.5" y="35.5" font-size="17" font-weight="bold" fill="#1e3a8a" text-anchor="middle">Meaning</text><rect x="533.0" y="8.0" width="339.0" height="44.0" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="702.5" y="35.5" font-size="17" font-weight="bold" fill="#78350f" text-anchor="middle">Example at Helios</text><rect x="8.0" y="60.0" width="170.0" height="84.0" rx="8" fill="#1e3a8a" stroke="#1e3a8a" stroke-width="1.6"/><text x="93.0" y="107.5" font-size="17" font-weight="bold" fill="#ffffff" text-anchor="middle">Secondary use</text><rect x="186.0" y="60.0" width="339.0" height="84.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="196.0" y="107.2" font-size="16" font-weight="normal" fill="#1f2937" text-anchor="start">a new purpose beyond the approved one</text><rect x="533.0" y="60.0" width="339.0" height="84.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="543.0" y="97.2" font-size="16" font-weight="normal" fill="#1f2937" text-anchor="start">the assistant also asked to summarize</text><text x="543.0" y="117.2" font-size="16" font-weight="normal" fill="#1f2937" text-anchor="start">résumés</text><rect x="8.0" y="152.0" width="170.0" height="84.0" rx="8" fill="#1e3a8a" stroke="#1e3a8a" stroke-width="1.6"/><text x="93.0" y="199.5" font-size="17" font-weight="bold" fill="#ffffff" text-anchor="middle">Unintended use</text><rect x="186.0" y="152.0" width="339.0" height="84.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="196.0" y="199.2" font-size="16" font-weight="normal" fill="#1f2937" text-anchor="start">a use the builders did not foresee</text><rect x="533.0" y="152.0" width="339.0" height="84.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="543.0" y="189.2" font-size="16" font-weight="normal" fill="#1f2937" text-anchor="start">a recruiter ranks candidates with the</text><text x="543.0" y="209.2" font-size="16" font-weight="normal" fill="#1f2937" text-anchor="start">assistant</text><rect x="8.0" y="244.0" width="170.0" height="84.0" rx="8" fill="#1e3a8a" stroke="#1e3a8a" stroke-width="1.6"/><text x="93.0" y="291.5" font-size="17" font-weight="bold" fill="#ffffff" text-anchor="middle">Misuse</text><rect x="186.0" y="244.0" width="339.0" height="84.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="196.0" y="291.2" font-size="16" font-weight="normal" fill="#1f2937" text-anchor="start">deliberate harmful use</text><rect x="533.0" y="244.0" width="339.0" height="84.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="543.0" y="291.2" font-size="16" font-weight="normal" fill="#1f2937" text-anchor="start">prompt injection to extract data</text><rect x="8.0" y="336.0" width="170.0" height="84.0" rx="8" fill="#1e3a8a" stroke="#1e3a8a" stroke-width="1.6"/><text x="93.0" y="383.5" font-size="17" font-weight="bold" fill="#ffffff" text-anchor="middle">Downstream harm</text><rect x="186.0" y="336.0" width="339.0" height="84.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="196.0" y="373.2" font-size="16" font-weight="normal" fill="#1f2937" text-anchor="start">harm to those who receive or rely on the</text><text x="196.0" y="393.2" font-size="16" font-weight="normal" fill="#1f2937" text-anchor="start">output</text><rect x="533.0" y="336.0" width="339.0" height="84.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="543.0" y="373.2" font-size="16" font-weight="normal" fill="#1f2937" text-anchor="start">a customer repeats a wrong refund</text><text x="543.0" y="393.2" font-size="16" font-weight="normal" fill="#1f2937" text-anchor="start">statement</text></svg>