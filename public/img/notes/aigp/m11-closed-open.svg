<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 370" width="880" height="370" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">m11-closed-open</title><desc id="d">Proprietary models trade control for convenience; open models give control and visibility but leave more of the safety work with the deployer.</desc><defs></defs><rect x="0.75" y="0.75" width="878.5" height="368.5" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><rect x="128.0" y="8.0" width="367.0" height="48.0" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="311.5" y="37.8" font-size="18" font-weight="bold" fill="#1e3a8a" text-anchor="middle">Proprietary (closed)</text><rect x="505.0" y="8.0" width="367.0" height="48.0" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="688.5" y="37.8" font-size="18" font-weight="bold" fill="#14532d" text-anchor="middle">Open-source or open-weight</text><text x="112.0" y="104.0" font-size="15" font-weight="bold" fill="#6b7280" text-anchor="end">Access</text><rect x="128.0" y="66.0" width="367.0" height="66.0" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="140.0" y="104.5" font-size="17" font-weight="normal" fill="#1e3a8a" text-anchor="start">through the provider's interface</text><rect x="505.0" y="66.0" width="367.0" height="66.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="517.0" y="104.5" font-size="17" font-weight="normal" fill="#1f2937" text-anchor="start">weights are public: inspect, host, adapt</text><text x="112.0" y="180.0" font-size="15" font-weight="bold" fill="#6b7280" text-anchor="end">Visibility</text><rect x="128.0" y="142.0" width="367.0" height="66.0" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="140.0" y="180.5" font-size="17" font-weight="normal" fill="#1e3a8a" text-anchor="start">internals and training data usually hidden</text><rect x="505.0" y="142.0" width="367.0" height="66.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="517.0" y="180.5" font-size="17" font-weight="normal" fill="#1f2937" text-anchor="start">architecture and weights visible</text><text x="112.0" y="256.0" font-size="15" font-weight="bold" fill="#6b7280" text-anchor="end">Control</text><rect x="128.0" y="218.0" width="367.0" height="66.0" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="140.0" y="256.5" font-size="17" font-weight="normal" fill="#1e3a8a" text-anchor="start">less: the provider manages updates</text><rect x="505.0" y="218.0" width="367.0" height="66.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="517.0" y="256.5" font-size="17" font-weight="normal" fill="#1f2937" text-anchor="start">more: you own hosting, security, testing</text><text x="112.0" y="332.0" font-size="15" font-weight="bold" fill="#6b7280" text-anchor="end">Watch for</text><rect x="128.0" y="294.0" width="367.0" height="66.0" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="140.0" y="332.5" font-size="17" font-weight="normal" fill="#1e3a8a" text-anchor="start">dependence on the provider</text><rect x="505.0" y="294.0" width="367.0" height="66.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="517.0" y="332.5" font-size="17" font-weight="normal" fill="#1f2937" text-anchor="start">usage limits in the license</text></svg>