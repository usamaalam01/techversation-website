<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 186" width="880" height="186" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">m03-intake</title><desc id="d">Five steps every AI use case follows: propose, assess, tier, decide, register.</desc><defs></defs><rect x="0.75" y="0.75" width="878.5" height="184.5" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><polygon points="8.0,8.0 152.8,8.0 172.8,37.0 152.8,66.0 8.0,66.0" fill="#dbeafe" stroke="#2563eb" stroke-width="1.8"/><text x="83.4" y="42.4" font-size="17" font-weight="bold" fill="#1e3a8a" text-anchor="middle">Propose</text><rect x="10.0" y="70.0" width="150.8" height="110.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="18.0" y="120.5" font-size="15" font-weight="normal" fill="#1f2937" text-anchor="start">any team, built or</text><text x="18.0" y="139.2" font-size="15" font-weight="normal" fill="#1f2937" text-anchor="start">bought</text><polygon points="182.8,8.0 327.6,8.0 347.6,37.0 327.6,66.0 182.8,66.0 202.8,37.0" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.8"/><text x="265.2" y="42.4" font-size="17" font-weight="bold" fill="#134e4a" text-anchor="middle">Assess</text><rect x="184.8" y="70.0" width="150.8" height="110.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="192.8" y="120.5" font-size="15" font-weight="normal" fill="#1f2937" text-anchor="start">purpose, data,</text><text x="192.8" y="139.2" font-size="15" font-weight="normal" fill="#1f2937" text-anchor="start">people, law</text><polygon points="357.6,8.0 502.4,8.0 522.4,37.0 502.4,66.0 357.6,66.0 377.6,37.0" fill="#dcfce7" stroke="#16a34a" stroke-width="1.8"/><text x="440.0" y="42.4" font-size="17" font-weight="bold" fill="#14532d" text-anchor="middle">Tier</text><rect x="359.6" y="70.0" width="150.8" height="110.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="367.6" y="120.5" font-size="15" font-weight="normal" fill="#1f2937" text-anchor="start">review</text><text x="367.6" y="139.2" font-size="15" font-weight="normal" fill="#1f2937" text-anchor="start">proportionate to risk</text><polygon points="532.4,8.0 677.2,8.0 697.2,37.0 677.2,66.0 532.4,66.0 552.4,37.0" fill="#fef3c7" stroke="#d97706" stroke-width="1.8"/><text x="614.8" y="42.4" font-size="17" font-weight="bold" fill="#78350f" text-anchor="middle">Decide</text><rect x="534.4" y="70.0" width="150.8" height="110.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="542.4" y="120.5" font-size="15" font-weight="normal" fill="#1f2937" text-anchor="start">go, no-go, or go</text><text x="542.4" y="139.2" font-size="15" font-weight="normal" fill="#1f2937" text-anchor="start">with conditions</text><polygon points="707.2,8.0 852.0,8.0 872.0,37.0 852.0,66.0 707.2,66.0 727.2,37.0" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.8"/><text x="789.6" y="42.4" font-size="17" font-weight="bold" fill="#4c1d95" text-anchor="middle">Register</text><rect x="709.2" y="70.0" width="150.8" height="110.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="717.2" y="120.5" font-size="15" font-weight="normal" fill="#1f2937" text-anchor="start">approved use</text><text x="717.2" y="139.2" font-size="15" font-weight="normal" fill="#1f2937" text-anchor="start">enters the inventory</text></svg>