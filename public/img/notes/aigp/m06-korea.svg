<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 440" width="880" height="440" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">m06-korea</title><desc id="d">South Korea's AI Basic Act: high-impact AI, generative AI, foreign operators and enforcement.</desc><defs></defs><rect x="0.75" y="0.75" width="878.5" height="438.5" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><line x1="354.0" y1="172.0" x2="333.9" y2="161.9" stroke="#6b7280" stroke-width="2.2"/><rect x="82.9" y="58.9" width="290.0" height="100.0" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="227.9" y="85.7" font-size="15" font-weight="bold" fill="#1e3a8a" text-anchor="middle">High-impact AI</text><text x="227.9" y="104.4" font-size="15" font-weight="normal" fill="#1e3a8a" text-anchor="middle">healthcare, hiring, lending: risk</text><text x="227.9" y="123.2" font-size="15" font-weight="normal" fill="#1e3a8a" text-anchor="middle">management, user notice, human</text><text x="227.9" y="141.9" font-size="15" font-weight="normal" fill="#1e3a8a" text-anchor="middle">oversight</text><line x1="526.0" y1="172.0" x2="546.1" y2="161.9" stroke="#6b7280" stroke-width="2.2"/><rect x="507.1" y="58.9" width="290.0" height="100.0" rx="8" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.6"/><text x="652.1" y="95.1" font-size="15" font-weight="bold" fill="#134e4a" text-anchor="middle">Generative AI</text><text x="652.1" y="113.8" font-size="15" font-weight="normal" fill="#134e4a" text-anchor="middle">advance notice to users and labeling of</text><text x="652.1" y="132.6" font-size="15" font-weight="normal" fill="#134e4a" text-anchor="middle">output</text><line x1="526.0" y1="258.0" x2="546.1" y2="268.1" stroke="#6b7280" stroke-width="2.2"/><rect x="507.1" y="271.1" width="290.0" height="100.0" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="652.1" y="307.2" font-size="15" font-weight="bold" fill="#78350f" text-anchor="middle">Foreign operators</text><text x="652.1" y="325.9" font-size="15" font-weight="normal" fill="#78350f" text-anchor="middle">a domestic representative above</text><text x="652.1" y="344.7" font-size="15" font-weight="normal" fill="#78350f" text-anchor="middle">thresholds</text><line x1="354.0" y1="258.0" x2="333.9" y2="268.1" stroke="#6b7280" stroke-width="2.2"/><rect x="82.9" y="271.1" width="290.0" height="100.0" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.6"/><text x="227.9" y="307.2" font-size="15" font-weight="bold" fill="#7f1d1d" text-anchor="middle">Enforcement</text><text x="227.9" y="325.9" font-size="15" font-weight="normal" fill="#7f1d1d" text-anchor="middle">fines up to KRW 30 million; a grace</text><text x="227.9" y="344.7" font-size="15" font-weight="normal" fill="#7f1d1d" text-anchor="middle">period first</text><rect x="320.0" y="175.0" width="240.0" height="80.0" rx="8" fill="#1e3a8a" stroke="#1e3a8a" stroke-width="1.6"/><text x="440.0" y="196.5" font-size="20" font-weight="bold" fill="#ffffff" text-anchor="middle">AI Basic Act</text><text x="440.0" y="221.5" font-size="20" font-weight="normal" fill="#ffffff" text-anchor="middle">in force since 22 January</text><text x="440.0" y="246.5" font-size="20" font-weight="normal" fill="#ffffff" text-anchor="middle">2026</text></svg>