<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 430" width="880" height="430" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">m06-enforcement-bodies</title><desc id="d">The AI Office and AI Board at EU level, national authorities, and notified bodies.</desc><defs><marker id="ah0" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker></defs><rect x="0.75" y="0.75" width="878.5" height="428.5" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><rect x="272.0" y="8.0" width="336.0" height="52.0" rx="8" fill="#1e3a8a" stroke="#1e3a8a" stroke-width="1.6"/><text x="440.0" y="39.8" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="middle">European Commission</text><rect x="40.0" y="100.0" width="380.0" height="70.0" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="230.0" y="130.2" font-size="16" font-weight="bold" fill="#1e3a8a" text-anchor="middle">AI Office</text><text x="230.0" y="150.2" font-size="16" font-weight="normal" fill="#1e3a8a" text-anchor="middle">general-purpose models, fines under Article 101</text><rect x="460.0" y="100.0" width="380.0" height="70.0" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="650.0" y="130.2" font-size="16" font-weight="bold" fill="#1e3a8a" text-anchor="middle">European AI Board</text><text x="650.0" y="150.2" font-size="16" font-weight="normal" fill="#1e3a8a" text-anchor="middle">coordination with Member States</text><line x1="380.0" y1="62.0" x2="230.0" y2="98.0" stroke="#1f2937" stroke-width="2.4" marker-end="url(#ah0)"/><line x1="500.0" y1="62.0" x2="650.0" y2="98.0" stroke="#1f2937" stroke-width="2.4" marker-end="url(#ah0)"/><rect x="40.0" y="230.0" width="380.0" height="78.0" rx="8" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.6"/><text x="230.0" y="264.2" font-size="16" font-weight="bold" fill="#134e4a" text-anchor="middle">Market surveillance authorities</text><text x="230.0" y="284.2" font-size="16" font-weight="normal" fill="#134e4a" text-anchor="middle">supervise, require corrective action, recall, fine</text><rect x="460.0" y="230.0" width="380.0" height="78.0" rx="8" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.6"/><text x="650.0" y="264.2" font-size="16" font-weight="bold" fill="#134e4a" text-anchor="middle">Notifying authorities</text><text x="650.0" y="284.2" font-size="16" font-weight="normal" fill="#134e4a" text-anchor="middle">designate and oversee notified bodies</text><text x="440.0" y="207.0" font-size="15" font-weight="bold" fill="#6b7280" text-anchor="middle">each Member State designates at least one of each</text><rect x="460.0" y="350.0" width="380.0" height="70.0" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="650.0" y="380.2" font-size="16" font-weight="bold" fill="#14532d" text-anchor="middle">Notified bodies</text><text x="650.0" y="400.2" font-size="16" font-weight="normal" fill="#14532d" text-anchor="middle">third-party conformity assessment where required</text><line x1="650.0" y1="310.0" x2="650.0" y2="348.0" stroke="#1f2937" stroke-width="2.4" marker-end="url(#ah0)"/></svg>