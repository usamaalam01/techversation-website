<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 422" width="880" height="422" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">m04-transfers</title><desc id="d">A transfer needs an adequacy decision or appropriate safeguards; three AI cases show where transfers hide.</desc><defs><marker id="ah0" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker></defs><rect x="0.75" y="0.75" width="878.5" height="420.5" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><rect x="214.0" y="8.0" width="452.0" height="52.0" rx="8" fill="#1e3a8a" stroke="#1e3a8a" stroke-width="1.6"/><text x="440.0" y="39.8" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="middle">Personal data going to a third country?</text><line x1="330.0" y1="62.0" x2="190.0" y2="94.0" stroke="#1f2937" stroke-width="2.6" marker-end="url(#ah0)"/><line x1="550.0" y1="62.0" x2="640.0" y2="94.0" stroke="#1f2937" stroke-width="2.6" marker-end="url(#ah0)"/><rect x="8.0" y="96.0" width="360.0" height="74.0" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="188.0" y="128.2" font-size="16" font-weight="bold" fill="#1e3a8a" text-anchor="middle">Adequacy decision? (Article 45)</text><text x="188.0" y="148.2" font-size="16" font-weight="normal" fill="#1e3a8a" text-anchor="middle">the Commission found the country adequate</text><rect x="480.0" y="96.0" width="392.0" height="56.0" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="676.0" y="119.2" font-size="16" font-weight="bold" fill="#78350f" text-anchor="middle">If not: appropriate safeguards</text><text x="676.0" y="139.2" font-size="16" font-weight="normal" fill="#78350f" text-anchor="middle">(Article 46)</text><rect x="8.0" y="196.0" width="360.0" height="56.0" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="188.0" y="219.2" font-size="16" font-weight="bold" fill="#14532d" text-anchor="middle">Yes: transfer allowed</text><text x="188.0" y="239.2" font-size="16" font-weight="normal" fill="#14532d" text-anchor="middle">no further authorization</text><line x1="188.0" y1="172.0" x2="188.0" y2="194.0" stroke="#1f2937" stroke-width="2.6" marker-end="url(#ah0)"/><rect x="480.0" y="168.0" width="190.0" height="48.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="575.0" y="187.8" font-size="14" font-weight="normal" fill="#1f2937" text-anchor="middle">Standard data protection</text><text x="575.0" y="205.3" font-size="14" font-weight="normal" fill="#1f2937" text-anchor="middle">clauses</text><rect x="678.0" y="168.0" width="190.0" height="48.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="773.0" y="196.6" font-size="14" font-weight="normal" fill="#1f2937" text-anchor="middle">Binding corporate rules</text><rect x="480.0" y="224.0" width="190.0" height="48.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="575.0" y="252.6" font-size="14" font-weight="normal" fill="#1f2937" text-anchor="middle">Approved code of conduct</text><rect x="678.0" y="224.0" width="190.0" height="48.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="773.0" y="252.6" font-size="14" font-weight="normal" fill="#1f2937" text-anchor="middle">Approved certification</text><rect x="8.0" y="300.0" width="864.0" height="112.0" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.6"/><text x="440.0" y="350.9" font-size="17" font-weight="bold" fill="#374151" text-anchor="middle">AI cases to check</text><text x="440.0" y="372.1" font-size="17" font-weight="normal" fill="#374151" text-anchor="middle">training or inference in another region · a hosted model interface abroad · support staff with remote access</text></svg>