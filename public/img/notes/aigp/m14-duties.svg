<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 476" width="880" height="476" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">m14-duties</title><desc id="d">Provider and deployer duties side by side: before the market, in use, incidents and transparency.</desc><defs></defs><rect x="0.75" y="0.75" width="878.5" height="474.5" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><rect x="156.0" y="8.0" width="354.0" height="42.0" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="333.0" y="34.5" font-size="17" font-weight="bold" fill="#1e3a8a" text-anchor="middle">Provider</text><rect x="518.0" y="8.0" width="354.0" height="42.0" rx="8" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.6"/><text x="695.0" y="34.5" font-size="17" font-weight="bold" fill="#134e4a" text-anchor="middle">Deployer</text><rect x="8.0" y="58.0" width="140.0" height="96.0" rx="8" fill="#1e3a8a" stroke="#1e3a8a" stroke-width="1.6"/><text x="78.0" y="101.2" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">Before the</text><text x="78.0" y="121.2" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">market</text><rect x="156.0" y="58.0" width="354.0" height="96.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="166.0" y="92.1" font-size="15" font-weight="normal" fill="#1f2937" text-anchor="start">requirements, Articles 9 to 15; quality system,</text><text x="166.0" y="110.9" font-size="15" font-weight="normal" fill="#1f2937" text-anchor="start">Article 17; conformity, declaration, CE marking,</text><text x="166.0" y="129.6" font-size="15" font-weight="normal" fill="#1f2937" text-anchor="start">registration, Articles 43, 47, 48, 49</text><rect x="518.0" y="58.0" width="354.0" height="96.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="528.0" y="101.5" font-size="15" font-weight="normal" fill="#1f2937" text-anchor="start">assess fit; fundamental rights impact assessment,</text><text x="528.0" y="120.2" font-size="15" font-weight="normal" fill="#1f2937" text-anchor="start">Article 27, where it applies</text><rect x="8.0" y="162.0" width="140.0" height="96.0" rx="8" fill="#1e3a8a" stroke="#1e3a8a" stroke-width="1.6"/><text x="78.0" y="215.2" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">In use</text><rect x="156.0" y="162.0" width="354.0" height="96.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="166.0" y="205.5" font-size="15" font-weight="normal" fill="#1f2937" text-anchor="start">instructions for use, Article 13; post-market</text><text x="166.0" y="224.2" font-size="15" font-weight="normal" fill="#1f2937" text-anchor="start">monitoring, Article 72</text><rect x="518.0" y="162.0" width="354.0" height="96.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="528.0" y="196.1" font-size="15" font-weight="normal" fill="#1f2937" text-anchor="start">Article 26: follow the instructions, competent</text><text x="528.0" y="214.9" font-size="15" font-weight="normal" fill="#1f2937" text-anchor="start">oversight, check inputs, monitor, keep logs at</text><text x="528.0" y="233.6" font-size="15" font-weight="normal" fill="#1f2937" text-anchor="start">least six months</text><rect x="8.0" y="266.0" width="140.0" height="96.0" rx="8" fill="#1e3a8a" stroke="#1e3a8a" stroke-width="1.6"/><text x="78.0" y="319.2" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">Incidents</text><rect x="156.0" y="266.0" width="354.0" height="96.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="166.0" y="318.9" font-size="15" font-weight="normal" fill="#1f2937" text-anchor="start">report serious incidents, Article 73</text><rect x="518.0" y="266.0" width="354.0" height="96.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="528.0" y="309.5" font-size="15" font-weight="normal" fill="#1f2937" text-anchor="start">inform the provider, suspend use if there is a risk,</text><text x="528.0" y="328.2" font-size="15" font-weight="normal" fill="#1f2937" text-anchor="start">report a serious incident</text><rect x="8.0" y="370.0" width="140.0" height="96.0" rx="8" fill="#1e3a8a" stroke="#1e3a8a" stroke-width="1.6"/><text x="78.0" y="423.2" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">Transparency</text><rect x="156.0" y="370.0" width="354.0" height="96.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="166.0" y="413.5" font-size="15" font-weight="normal" fill="#1f2937" text-anchor="start">Article 50: design so people know they interact</text><text x="166.0" y="432.2" font-size="15" font-weight="normal" fill="#1f2937" text-anchor="start">with AI; mark synthetic content</text><rect x="518.0" y="370.0" width="354.0" height="96.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="528.0" y="413.5" font-size="15" font-weight="normal" fill="#1f2937" text-anchor="start">inform affected people and workers; inform those</text><text x="528.0" y="432.2" font-size="15" font-weight="normal" fill="#1f2937" text-anchor="start">exposed to emotion recognition</text></svg>