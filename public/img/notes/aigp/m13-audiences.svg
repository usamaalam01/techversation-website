<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 420" width="880" height="420" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">m13-audiences</title><desc id="d">Six audiences of an external communication plan and what each needs to hear.</desc><defs></defs><rect x="0.75" y="0.75" width="878.5" height="418.5" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><rect x="246.0" y="8.0" width="626.0" height="42.0" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="559.0" y="34.5" font-size="17" font-weight="bold" fill="#1e3a8a" text-anchor="middle">What they need</text><rect x="8.0" y="58.0" width="230.0" height="52.0" rx="8" fill="#1e3a8a" stroke="#1e3a8a" stroke-width="1.6"/><text x="123.0" y="89.2" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">Users, customers</text><rect x="246.0" y="58.0" width="626.0" height="52.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="256.0" y="89.2" font-size="16" font-weight="normal" fill="#1f2937" text-anchor="start">notice that AI is used, limits, how to reach a person</text><rect x="8.0" y="118.0" width="230.0" height="52.0" rx="8" fill="#1e3a8a" stroke="#1e3a8a" stroke-width="1.6"/><text x="123.0" y="149.2" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">Affected people</text><rect x="246.0" y="118.0" width="626.0" height="52.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="256.0" y="149.2" font-size="16" font-weight="normal" fill="#1f2937" text-anchor="start">explanations, how to object or appeal</text><rect x="8.0" y="178.0" width="230.0" height="52.0" rx="8" fill="#1e3a8a" stroke="#1e3a8a" stroke-width="1.6"/><text x="123.0" y="209.2" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">Regulators, authorities</text><rect x="246.0" y="178.0" width="626.0" height="52.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="256.0" y="209.2" font-size="16" font-weight="normal" fill="#1f2937" text-anchor="start">reports and documentation on request</text><rect x="8.0" y="238.0" width="230.0" height="52.0" rx="8" fill="#1e3a8a" stroke="#1e3a8a" stroke-width="1.6"/><text x="123.0" y="269.2" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">Providers, partners</text><rect x="246.0" y="238.0" width="626.0" height="52.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="256.0" y="269.2" font-size="16" font-weight="normal" fill="#1f2937" text-anchor="start">incident and feedback information</text><rect x="8.0" y="298.0" width="230.0" height="52.0" rx="8" fill="#1e3a8a" stroke="#1e3a8a" stroke-width="1.6"/><text x="123.0" y="329.2" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">Staff</text><rect x="246.0" y="298.0" width="626.0" height="52.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="256.0" y="329.2" font-size="16" font-weight="normal" fill="#1f2937" text-anchor="start">rules, training, changes</text><rect x="8.0" y="358.0" width="230.0" height="52.0" rx="8" fill="#1e3a8a" stroke="#1e3a8a" stroke-width="1.6"/><text x="123.0" y="389.2" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">Public, media</text><rect x="246.0" y="358.0" width="626.0" height="52.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="256.0" y="389.2" font-size="16" font-weight="normal" fill="#1f2937" text-anchor="start">statements when public trust is at stake</text></svg>