<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 420" width="880" height="420" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">m09-issues</title><desc id="d">Six issues with their symptom and response.</desc><defs></defs><rect x="0.75" y="0.75" width="878.5" height="418.5" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><rect x="216.0" y="8.0" width="324.0" height="42.0" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="378.0" y="34.5" font-size="17" font-weight="bold" fill="#78350f" text-anchor="middle">Symptom</text><rect x="548.0" y="8.0" width="324.0" height="42.0" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="710.0" y="34.5" font-size="17" font-weight="bold" fill="#14532d" text-anchor="middle">Response</text><rect x="8.0" y="58.0" width="200.0" height="52.0" rx="8" fill="#1e3a8a" stroke="#1e3a8a" stroke-width="1.6"/><text x="108.0" y="88.9" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">Overfitting</text><rect x="216.0" y="58.0" width="324.0" height="52.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="226.0" y="88.9" font-size="15" font-weight="normal" fill="#1f2937" text-anchor="start">great on training data, poor on new data</text><rect x="548.0" y="58.0" width="324.0" height="52.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="558.0" y="88.9" font-size="15" font-weight="normal" fill="#1f2937" text-anchor="start">simplify, add data, regularize</text><rect x="8.0" y="118.0" width="200.0" height="52.0" rx="8" fill="#1e3a8a" stroke="#1e3a8a" stroke-width="1.6"/><text x="108.0" y="148.9" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">Leakage</text><rect x="216.0" y="118.0" width="324.0" height="52.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="226.0" y="148.9" font-size="15" font-weight="normal" fill="#1f2937" text-anchor="start">suspiciously high scores</text><rect x="548.0" y="118.0" width="324.0" height="52.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="558.0" y="148.9" font-size="15" font-weight="normal" fill="#1f2937" text-anchor="start">fix the split and retest</text><rect x="8.0" y="178.0" width="200.0" height="52.0" rx="8" fill="#1e3a8a" stroke="#1e3a8a" stroke-width="1.6"/><text x="108.0" y="208.9" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">Label errors</text><rect x="216.0" y="178.0" width="324.0" height="52.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="226.0" y="208.9" font-size="15" font-weight="normal" fill="#1f2937" text-anchor="start">inconsistent labels</text><rect x="548.0" y="178.0" width="324.0" height="52.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="558.0" y="208.9" font-size="15" font-weight="normal" fill="#1f2937" text-anchor="start">audit and relabel</text><rect x="8.0" y="238.0" width="200.0" height="52.0" rx="8" fill="#1e3a8a" stroke="#1e3a8a" stroke-width="1.6"/><text x="108.0" y="268.9" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">Unrepresentative data</text><rect x="216.0" y="238.0" width="324.0" height="52.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="226.0" y="268.9" font-size="15" font-weight="normal" fill="#1f2937" text-anchor="start">poor results for some groups</text><rect x="548.0" y="238.0" width="324.0" height="52.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="558.0" y="268.9" font-size="15" font-weight="normal" fill="#1f2937" text-anchor="start">collect more, re-sample</text><rect x="8.0" y="298.0" width="200.0" height="52.0" rx="8" fill="#1e3a8a" stroke="#1e3a8a" stroke-width="1.6"/><text x="108.0" y="328.9" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">Poisoning</text><rect x="216.0" y="298.0" width="324.0" height="52.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="226.0" y="328.9" font-size="15" font-weight="normal" fill="#1f2937" text-anchor="start">odd records or behavior</text><rect x="548.0" y="298.0" width="324.0" height="52.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="558.0" y="328.9" font-size="15" font-weight="normal" fill="#1f2937" text-anchor="start">quarantine and investigate</text><rect x="8.0" y="358.0" width="200.0" height="52.0" rx="8" fill="#1e3a8a" stroke="#1e3a8a" stroke-width="1.6"/><text x="108.0" y="388.9" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">Unlawful data</text><rect x="216.0" y="358.0" width="324.0" height="52.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="226.0" y="388.9" font-size="15" font-weight="normal" fill="#1f2937" text-anchor="start">rights unclear or breached</text><rect x="548.0" y="358.0" width="324.0" height="52.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="558.0" y="388.9" font-size="15" font-weight="normal" fill="#1f2937" text-anchor="start">stop, quarantine, escalate</text></svg>