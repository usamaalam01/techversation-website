<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 402" width="880" height="402" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">m03-policy-gaps</title><desc id="d">Four existing policies and the AI gap each one leaves.</desc><defs></defs><rect x="0.75" y="0.75" width="878.5" height="400.5" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><rect x="186.0" y="8.0" width="339.0" height="48.0" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.6"/><text x="355.5" y="37.8" font-size="18" font-weight="bold" fill="#374151" text-anchor="middle">What it covers today</text><rect x="533.0" y="8.0" width="339.0" height="48.0" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.6"/><text x="702.5" y="37.8" font-size="18" font-weight="bold" fill="#7f1d1d" text-anchor="middle">The AI gap</text><rect x="8.0" y="64.0" width="170.0" height="76.0" rx="8" fill="#1e3a8a" stroke="#1e3a8a" stroke-width="1.6"/><text x="93.0" y="107.5" font-size="17" font-weight="bold" fill="#ffffff" text-anchor="middle">Privacy</text><rect x="186.0" y="64.0" width="339.0" height="76.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="196.0" y="107.5" font-size="17" font-weight="normal" fill="#1f2937" text-anchor="start">collection and use of customer data</text><rect x="533.0" y="64.0" width="339.0" height="76.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="543.0" y="96.9" font-size="17" font-weight="normal" fill="#1f2937" text-anchor="start">training use, inferences, automated</text><text x="543.0" y="118.2" font-size="17" font-weight="normal" fill="#1f2937" text-anchor="start">decisions</text><rect x="8.0" y="148.0" width="170.0" height="76.0" rx="8" fill="#1e3a8a" stroke="#1e3a8a" stroke-width="1.6"/><text x="93.0" y="191.5" font-size="17" font-weight="bold" fill="#ffffff" text-anchor="middle">Security</text><rect x="186.0" y="148.0" width="339.0" height="76.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="196.0" y="191.5" font-size="17" font-weight="normal" fill="#1f2937" text-anchor="start">access, encryption, incident handling</text><rect x="533.0" y="148.0" width="339.0" height="76.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="543.0" y="180.9" font-size="17" font-weight="normal" fill="#1f2937" text-anchor="start">model theft, data poisoning, prompt</text><text x="543.0" y="202.2" font-size="17" font-weight="normal" fill="#1f2937" text-anchor="start">injection</text><rect x="8.0" y="232.0" width="170.0" height="76.0" rx="8" fill="#1e3a8a" stroke="#1e3a8a" stroke-width="1.6"/><text x="93.0" y="275.5" font-size="17" font-weight="bold" fill="#ffffff" text-anchor="middle">Data governance</text><rect x="186.0" y="232.0" width="339.0" height="76.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="196.0" y="275.5" font-size="17" font-weight="normal" fill="#1f2937" text-anchor="start">data quality, ownership, retention</text><rect x="533.0" y="232.0" width="339.0" height="76.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="543.0" y="264.9" font-size="17" font-weight="normal" fill="#1f2937" text-anchor="start">training-data provenance, dataset</text><text x="543.0" y="286.1" font-size="17" font-weight="normal" fill="#1f2937" text-anchor="start">documentation</text><rect x="8.0" y="316.0" width="170.0" height="76.0" rx="8" fill="#1e3a8a" stroke="#1e3a8a" stroke-width="1.6"/><text x="93.0" y="359.5" font-size="17" font-weight="bold" fill="#ffffff" text-anchor="middle">IP</text><rect x="186.0" y="316.0" width="339.0" height="76.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="196.0" y="359.5" font-size="17" font-weight="normal" fill="#1f2937" text-anchor="start">ownership of content and software</text><rect x="533.0" y="316.0" width="339.0" height="76.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="543.0" y="348.9" font-size="17" font-w