<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 308" width="880" height="308" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">m06-prohibited</title><desc id="d">Ten prohibited practices in Article 5, two of them new.</desc><defs></defs><rect x="0.75" y="0.75" width="878.5" height="306.5" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><rect x="8.0" y="8.0" width="164.8" height="140.0" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.6"/><text x="90.4" y="64.1" font-size="15" font-weight="bold" fill="#7f1d1d" text-anchor="middle">Manipulation</text><text x="90.4" y="82.9" font-size="15" font-weight="normal" fill="#7f1d1d" text-anchor="middle">subliminal or</text><text x="90.4" y="101.6" font-size="15" font-weight="normal" fill="#7f1d1d" text-anchor="middle">deceptive</text><rect x="182.8" y="8.0" width="164.8" height="140.0" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.6"/><text x="265.2" y="54.8" font-size="15" font-weight="bold" fill="#7f1d1d" text-anchor="middle">Exploiting</text><text x="265.2" y="73.5" font-size="15" font-weight="bold" fill="#7f1d1d" text-anchor="middle">vulnerabilities</text><text x="265.2" y="92.2" font-size="15" font-weight="normal" fill="#7f1d1d" text-anchor="middle">age, disability,</text><text x="265.2" y="111.0" font-size="15" font-weight="normal" fill="#7f1d1d" text-anchor="middle">situation</text><rect x="357.6" y="8.0" width="164.8" height="140.0" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.6"/><text x="440.0" y="73.5" font-size="15" font-weight="bold" fill="#7f1d1d" text-anchor="middle">Social scoring</text><text x="440.0" y="92.2" font-size="15" font-weight="normal" fill="#7f1d1d" text-anchor="middle">unrelated detriment</text><rect x="532.4" y="8.0" width="164.8" height="140.0" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.6"/><text x="614.8" y="73.5" font-size="15" font-weight="bold" fill="#7f1d1d" text-anchor="middle">Crime prediction</text><text x="614.8" y="92.2" font-size="15" font-weight="normal" fill="#7f1d1d" text-anchor="middle">from profiling alone</text><rect x="707.2" y="8.0" width="164.8" height="140.0" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.6"/><text x="789.6" y="64.1" font-size="15" font-weight="bold" fill="#7f1d1d" text-anchor="middle">Face scraping</text><text x="789.6" y="82.9" font-size="15" font-weight="normal" fill="#7f1d1d" text-anchor="middle">untargeted, internet</text><text x="789.6" y="101.6" font-size="15" font-weight="normal" fill="#7f1d1d" text-anchor="middle">or CCTV</text><rect x="8.0" y="160.0" width="164.8" height="140.0" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.6"/><text x="90.4" y="225.5" font-size="15" font-weight="bold" fill="#7f1d1d" text-anchor="middle">Emotion inference</text><text x="90.4" y="244.2" font-size="15" font-weight="normal" fill="#7f1d1d" text-anchor="middle">at work and school</text><rect x="182.8" y="160.0" width="164.8" height="140.0" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.6"/><text x="265.2" y="206.8" font-size="15" font-weight="bold" fill="#7f1d1d" text-anchor="middle">Sensitive</text><text x="265.2" y="225.5" font-size="15" font-weight="bold" fill="#7f1d1d" text-anchor="middle">categorization</text><text x="265.2" y="244.2" font-size="15" font-weight="normal" fill="#7f1d1d" text-anchor="middle">race, beliefs,</text><text x="265.2" y="263.0" font-size="15" font-weight="normal" fill="#7f1d1d" text-anchor="middle">orientation</text><rect x="357.6" y="160.0" width="164.8" height="140.0" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.6"/><text x="440.0" y="216.1" font-size="15" font-weight="bold" fill="#7f1d1d" text-anchor="middle">Real-time remote ID</text><text x="440.0" y="234.9" font-size="15" font-weight="normal" fill="#7f1d1d" text-anchor="middle">law enforcement, in</text><text x="440.0" y="253.6" font-size="15" font-weight="normal" fill="#7f1d1d" text-anchor="middle">public</text><rect x="532.4" y="160.0" width="164.8" height="140.0" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.6"/><text x="614.8" y="216.1" font-size="15" font-weight="bold" fill="#4c1d95" text-anchor="middle">Intimate imagery</text><text x="614.8" y="234.9" font-size="15" font-weight="normal" fill="#4c1d95" text-anchor="middle">without consent:</text><text x="614.8" y="253.6" font-size="15" font-weight="normal" fill="#4c1d95" text-anchor="middle">NEW</text><rect x="707.2" y="160.0" width="164.8" height="140.0" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.6"/><text x="789.6" y="216.1" font-size="15" font-weight="bold" fill="#4c1d95" text-anchor="middle">Child abuse</text><text x="789.6" y="234.9" font-size="15" font-weight="bold" fill="#4c1d95" text-anchor="middle">material</text><text x="789.6" y="253.6" font-size="15" font-weight="normal" fill="#4c1d95" text-anchor="middle">generating it: NEW</text></svg>