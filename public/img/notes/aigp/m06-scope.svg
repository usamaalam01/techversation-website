<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" width="880" height="470" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">m06-scope</title><desc id="d">The AI Act reaches providers anywhere that supply the EU market, deployers in the EU and third-country operators whose output is used in the EU.</desc><defs></defs><rect x="0.75" y="0.75" width="878.5" height="468.5" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><line x1="440.0" y1="157.0" x2="440.0" y2="85.0" stroke="#6b7280" stroke-width="2.2"/><rect x="315.0" y="8.0" width="250.0" height="74.0" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="440.0" y="30.2" font-size="16" font-weight="bold" fill="#1e3a8a" text-anchor="middle">Providers</text><text x="440.0" y="50.2" font-size="16" font-weight="normal" fill="#1e3a8a" text-anchor="middle">placing on the EU market,</text><text x="440.0" y="70.2" font-size="16" font-weight="normal" fill="#1e3a8a" text-anchor="middle">anywhere</text><line x1="553.0" y1="165.3" x2="597.8" y2="153.6" stroke="#6b7280" stroke-width="2.2"/><rect x="600.8" y="83.0" width="250.0" height="74.0" rx="8" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.6"/><text x="725.8" y="115.2" font-size="16" font-weight="bold" fill="#134e4a" text-anchor="middle">Deployers</text><text x="725.8" y="135.2" font-size="16" font-weight="normal" fill="#134e4a" text-anchor="middle">established or located in the EU</text><line x1="553.0" y1="224.7" x2="597.8" y2="236.4" stroke="#6b7280" stroke-width="2.2"/><rect x="600.8" y="233.0" width="250.0" height="74.0" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="725.8" y="265.2" font-size="16" font-weight="bold" fill="#14532d" text-anchor="middle">Third countries</text><text x="725.8" y="285.2" font-size="16" font-weight="normal" fill="#14532d" text-anchor="middle">output is used in the EU</text><line x1="440.0" y1="233.0" x2="440.0" y2="305.0" stroke="#6b7280" stroke-width="2.2"/><rect x="315.0" y="308.0" width="250.0" height="74.0" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="440.0" y="340.2" font-size="16" font-weight="bold" fill="#78350f" text-anchor="middle">Importers, distributors</text><text x="440.0" y="360.2" font-size="16" font-weight="normal" fill="#78350f" text-anchor="middle">supply chain in the EU</text><line x1="327.0" y1="224.7" x2="282.2" y2="236.4" stroke="#6b7280" stroke-width="2.2"/><rect x="29.2" y="233.0" width="250.0" height="74.0" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.6"/><text x="154.2" y="265.2" font-size="16" font-weight="bold" fill="#4c1d95" text-anchor="middle">Product manufacturers</text><text x="154.2" y="285.2" font-size="16" font-weight="normal" fill="#4c1d95" text-anchor="middle">system placed with their product</text><line x1="327.0" y1="165.3" x2="282.2" y2="153.6" stroke="#6b7280" stroke-width="2.2"/><rect x="29.2" y="83.0" width="250.0" height="74.0" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.6"/><text x="154.2" y="115.2" font-size="16" font-weight="bold" fill="#7f1d1d" text-anchor="middle">Authorized representatives</text><text x="154.2" y="135.2" font-size="16" font-weight="normal" fill="#7f1d1d" text-anchor="middle">of non-EU providers</text><rect x="330.0" y="160.0" width="220.0" height="70.0" rx="8" fill="#1e3a8a" stroke="#1e3a8a" stroke-width="1.6"/><text x="440.0" y="201.8" font-size="21" font-weight="bold" fill="#ffffff" text-anchor="middle">EU market</text><rect x="8.0" y="386.0" width="864.0" height="72.0" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.6" stroke-dasharray="6 4"/><text x="440.0" y="417.2" font-size="16" font-weight="bold" fill="#374151" text-anchor="middle">Excluded</text><text x="440.0" y="437.2" font-size="16" font-weight="normal" fill="#374151" text-anchor="middle">military and national security · research before market placement · personal non-professional use · certain open source</text></svg>