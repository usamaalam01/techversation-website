<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 292" width="880" height="292" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">m09-test-plan</title><desc id="d">Seven parts of a test plan.</desc><defs></defs><rect x="0.75" y="0.75" width="878.5" height="290.5" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><rect x="8.0" y="8.0" width="207.0" height="130.0" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="111.5" y="57.3" font-size="17" font-weight="bold" fill="#1e3a8a" text-anchor="middle">Objectives</text><text x="111.5" y="78.5" font-size="17" font-weight="normal" fill="#1e3a8a" text-anchor="middle">what the tests must</text><text x="111.5" y="99.8" font-size="17" font-weight="normal" fill="#1e3a8a" text-anchor="middle">show</text><rect x="227.0" y="8.0" width="207.0" height="130.0" rx="8" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.6"/><text x="330.5" y="67.9" font-size="17" font-weight="bold" fill="#134e4a" text-anchor="middle">Data splits</text><text x="330.5" y="89.2" font-size="17" font-weight="normal" fill="#134e4a" text-anchor="middle">training, validation, test</text><rect x="446.0" y="8.0" width="207.0" height="130.0" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="549.5" y="67.9" font-size="17" font-weight="bold" fill="#14532d" text-anchor="middle">Metrics, thresholds</text><text x="549.5" y="89.2" font-size="17" font-weight="normal" fill="#14532d" text-anchor="middle">set first</text><rect x="665.0" y="8.0" width="207.0" height="130.0" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="768.5" y="67.9" font-size="17" font-weight="bold" fill="#78350f" text-anchor="middle">Test types</text><text x="768.5" y="89.2" font-size="17" font-weight="normal" fill="#78350f" text-anchor="middle">unit to interpretability</text><rect x="8.0" y="152.0" width="280.0" height="130.0" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.6"/><text x="14