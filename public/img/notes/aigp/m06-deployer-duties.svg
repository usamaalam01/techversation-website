<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 290" width="880" height="290" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">m06-deployer-duties</title><desc id="d">Six deployer duties, and the three ways a deployer becomes a provider.</desc><defs></defs><rect x="0.75" y="0.75" width="878.5" height="288.5" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><polygon points="8.0,8.0 125.3,8.0 145.3,39.0 125.3,70.0 8.0,70.0" fill="#dbeafe" stroke="#2563eb" stroke-width="1.8"/><text x="69.7" y="44.1" font-size="16" font-weight="bold" fill="#1e3a8a" text-anchor="middle">Use</text><rect x="10.0" y="74.0" width="123.3" height="100.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="18.0" y="128.6" font-size="14" font-weight="normal" fill="#1f2937" text-anchor="start">per instructions</text><polygon points="153.3,8.0 270.7,8.0 290.7,39.0 270.7,70.0 153.3,70.0 173.3,39.0" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.8"/><text x="222.0" y="44.1" font-size="16" font-weight="bold" fill="#134e4a" text-anchor="middle">Oversee</text><rect x="155.3" y="74.0" width="123.3" height="100.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="163.3" y="119.8" font-size="14" font-weight="normal" fill="#1f2937" text-anchor="start">competent,</text><text x="163.3" y="137.3" font-size="14" font-weight="normal" fill="#1f2937" text-anchor="start">trained people</text><polygon points="298.7,8.0 416.0,8.0 436.0,39.0 416.0,70.0 298.7,70.0 318.7,39.0" fill="#dcfce7" stroke="#16a34a" stroke-width="1.8"/><text x="367.3" y="44.1" font-size="16" font-weight="bold" fill="#14532d" text-anchor="middle">Feed</text><rect x="300.7" y="74.0" width="123.3" height="100.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="308.7" y="111.0" font-size="14" font-weight="normal" fill="#1f2937" text-anchor="start">relevant,</text><text x="308.7" y="128.6" font-size="14" font-weight="normal" fill="#1f2937" text-anchor="start">representative</text><text x="308.7" y="146.1" font-size="14" font-weight="normal" fill="#1f2937" text-anchor="start">input</text><polygon points="444.0,8.0 561.3,8.0 581.3,39.0 561.3,70.0 444.0,70.0 464.0,39.0" fill="#fef3c7" stroke="#d97706" stroke-width="1.8"/><text x="512.7" y="44.1" font-size="16" font-weight="bold" fill="#78350f" text-anchor="middle">Monitor</text><rect x="446.0" y="74.0" width="123.3" height="100.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="454.0" y="119.8" font-size="14" font-weight="normal" fill="#1f2937" text-anchor="start">inform, suspend,</text><text x="454.0" y="137.3" font-size="14" font-weight="normal" fill="#1f2937" text-anchor="start">report</text><polygon points="589.3,8.0 706.7,8.0 726.7,39.0 706.7,70.0 589.3,70.0 609.3,39.0" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.8"/><text x="658.0" y="44.1" font-size="16" font-weight="bold" fill="#4c1d95" text-anchor="middle">Log</text><rect x="591.3" y="74.0" width="123.3" height="100.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="599.3" y="119.8" font-size="14" font-weight="normal" fill="#1f2937" text-anchor="start">keep for at least</text><text x="599.3" y="137.3" font-size="14" font-weight="normal" fill="#1f2937" text-anchor="start">six months</text><polygon points="734.7,8.0 852.0,8.0 872.0,39.0 852.0,70.0 734.7,70.0 754.7,39.0" fill="#fee2e2" stroke="#dc2626" stroke-width="1.8"/><text x="803.3" y="44.1" font-size="16" font-weight="bold" fill="#7f1d1d" text-anchor="middle">Inform</text><rect x="736.7" y="74.0" width="123.3" height="100.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="744.7" y="119.8" font-size="14" font-weight="normal" fill="#1f2937" text-anchor="start">workers and</text><text x="744.7" y="137.3" font-size="14" font-weight="normal" fill="#1f2937" text-anchor="start">affected people</text><rect x="8.0" y="188.0" width="864.0" height="92.0" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.6"/><text x="440.0" y="219.2" font-size="16" font-weight="bold" fill="#7f1d1d" text-anchor="middle">A deployer becomes a provider (Article 25) if it</text><text x="440.0" y="239.2" font-size="16" font-weight="normal" fill="#7f1d1d" text-anchor="middle">puts its own name on a high-risk system · makes a substantial modification · changes the intended purpose so the</text><text x="440.0" y="259.2" font-size="16" font-weight="normal" fill="#7f1d1d" text-anchor="middle">system becomes high-risk</text></svg>