<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 214" width="880" height="214" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">m13-lenses</title><desc id="d">Four lenses for forecasting unintended use: the busy user, the curious user, the bad actor and the downstream receiver.</desc><defs></defs><rect x="0.75" y="0.75" width="878.5" height="212.5" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><rect x="8.0" y="8.0" width="207.0" height="120.0" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="111.5" y="62.6" font-size="18" font-weight="bold" fill="#1e3a8a" text-anchor="middle">Busy user</text><text x="111.5" y="85.1" font-size="18" font-weight="normal" fill="#1e3a8a" text-anchor="middle">takes shortcuts</text><rect x="227.0" y="8.0" width="207.0" height="120.0" rx="8" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.6"/><text x="330.5" y="62.6" font-size="18" font-weight="bold" fill="#134e4a" text-anchor="middle">Curious user</text><text x="330.5" y="85.1" font-size="18" font-weight="normal" fill="#134e4a" text-anchor="middle">tries everything</text><rect x="446.0" y="8.0" width="207.0" height="120.0" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.6"/><text x="549.5" y="62.6" font-size="18" font-weight="bold" fill="#7f1d1d" text-anchor="middle">Bad actor</text><text x="549.5" y="85.1" font-size="18" font-weight="normal" fill="#7f1d1d" text-anchor="middle">looks for abuse</text><rect x="665.0" y="8.0" width="207.0" height="120.0" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="768.5" y="62.6" font-size="18" font-weight="bold" fill="#78350f" text-anchor="middle">Downstream receiver</text><text x="768.5" y="85.1" font-size="18" font-weight="normal" fill="#78350f" text-anchor="middle">relies on the output</text><rect x="8.0" y="148.0" width="864.0" height="56.0" rx="8" fill="#1e3a8a" stroke="#1e3a8a" stroke-width="1.6"/><text x="440.0" y="181.8" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="middle">Workshops, pre-mortems, red teaming, scenario analysis, query logs</text></svg>