<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 400" width="880" height="400" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">m10-causes</title><desc id="d">Five causes of AI incidents, each with a Helios example: brittleness, weak robustness, poor data, insufficient testing and drift.</desc><defs></defs><rect x="0.75" y="0.75" width="878.5" height="398.5" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><rect x="206.0" y="8.0" width="329.0" height="42.0" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="370.5" y="34.5" font-size="17" font-weight="bold" fill="#1e3a8a" text-anchor="middle">What it means</text><rect x="543.0" y="8.0" width="329.0" height="42.0" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="707.5" y="34.5" font-size="17" font-weight="bold" fill="#78350f" text-anchor="middle">Example</text><rect x="8.0" y="58.0" width="190.0" height="60.0" rx="8" fill="#1e3a8a" stroke="#1e3a8a" stroke-width="1.6"/><text x="103.0" y="93.5" font-size="17" font-weight="bold" fill="#ffffff" text-anchor="middle">Brittleness</text><rect x="206.0" y="58.0" width="329.0" height="60.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="216.0" y="93.2" font-size="16" font-weight="normal" fill="#1f2937" text-anchor="start">works only in narrow conditions</text><rect x="543.0" y="58.0" width="329.0" height="60.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="553.0" y="93.2" font-size="16" font-weight="normal" fill="#1f2937" text-anchor="start">fails on a new phrasing</text><rect x="8.0" y="126.0" width="190.0" height="60.0" rx="8" fill="#1e3a8a" stroke="#1e3a8a" stroke-width="1.6"/><text x="103.0" y="161.5" font-size="17" font-weight="bold" fill="#ffffff" text-anchor="middle">Weak robustness</text><rect x="206.0" y="126.0" width="329.0" height="60.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="216.0" y="161.2" font-size="16" font-weight="normal" fill="#1f2937" text-anchor="start">breaks under noise or attack</text><rect x="543.0" y="126.0" width="329.0" height="60.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="553.0" y="161.2" font-size="16" font-weight="normal" fill="#1f2937" text-anchor="start">odd input derails an answer</text><rect x="8.0" y="194.0" width="190.0" height="60.0" rx="8" fill="#1e3a8a" stroke="#1e3a8a" stroke-width="1.6"/><text x="103.0" y="229.5" font-size="17" font-weight="bold" fill="#ffffff" text-anchor="middle">Poor data</text><rect x="206.0" y="194.0" width="329.0" height="60.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="216.0" y="229.2" font-size="16" font-weight="normal" fill="#1f2937" text-anchor="start">stale, wrong or unrepresentative</text><rect x="543.0" y="194.0" width="329.0" height="60.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="553.0" y="229.2" font-size="16" font-weight="normal" fill="#1f2937" text-anchor="start">out-of-date support documents</text><rect x="8.0" y="262.0" width="190.0" height="60.0" rx="8" fill="#1e3a8a" stroke="#1e3a8a" stroke-width="1.6"/><text x="103.0" y="297.5" font-size="17" font-weight="bold" fill="#ffffff" text-anchor="middle">Thin testing</text><rect x="206.0" y="262.0" width="329.0" height="60.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="216.0" y="297.2" font-size="16" font-weight="normal" fill="#1f2937" text-anchor="start">a case or change never tested</text><rect x="543.0" y="262.0" width="329.0" height="60.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="553.0" y="297.2" font-size="16" font-weight="normal" fill="#1f2937" text-anchor="start">a refund-policy change</text><rect x="8.0" y="330.0" width="190.0" height="60.0" rx="8" fill="#1e3a8a" stroke="#1e3a8a" stroke-width="1.6"/><text x="103.0" y="365.5" font-size="17" font-weight="bold" fill="#ffffff" text-anchor="middle">Drift</text><rect x="206.0" y="330.0" width="329.0" height="60.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="216.0" y="365.2" font-size="16" font-weight="normal" fill="#1f2937" text-anchor="start">the data or world changed</text><rect x="543.0" y="330.0" width="329.0" height="60.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="553.0" y="365.2" font-size="16" font-weight="normal" fill="#1f2937" text-anchor="start">applicant mix from a new region</text></svg>