<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 324" width="880" height="324" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">m11-classic-generative</title><desc id="d">Classic models score or classify within a narrow task; generative models create open-ended content with wider failure modes.</desc><defs></defs><rect x="0.75" y="0.75" width="878.5" height="322.5" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><rect x="128.0" y="8.0" width="367.0" height="48.0" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="311.5" y="37.8" font-size="18" font-weight="bold" fill="#1e3a8a" text-anchor="middle">Classic (predictive)</text><rect x="505.0" y="8.0" width="367.0" height="48.0" rx="8" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.6"/><text x="688.5" y="37.8" font-size="18" font-weight="bold" fill="#134e4a" text-anchor="middle">Generative</text><text x="112.0" y="109.0" font-size="15" font-weight="bold" fill="#6b7280" text-anchor="end">Output</text><rect x="128.0" y="66.0" width="367.0" height="76.0" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="140.0" y="109.5" font-size="17" font-weight="normal" fill="#1e3a8a" text-anchor="start">a score, class or number</text><rect x="505.0" y="66.0" width="367.0" height="76.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="517.0" y="109.5" font-size="17" font-weight="normal" fill="#1f2937" text-anchor="start">new text, images, code or audio</text><text x="112.0" y="195.0" font-size="15" font-weight="bold" fill="#6b7280" text-anchor="end">Task</text><rect x="128.0" y="152.0" width="367.0" height="76.0" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="140.0" y="195.5" font-size="17" font-weight="normal" fill="#1e3a8a" text-anchor="start">narrow, easier to measure</text><rect x="505.0" y="152.0" width="367.0" height="76.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="517.0" y="195.5" font-size="17" font-weight="normal" fill="#1f2937" text-anchor="start">broad, harder to test</text><text x="112.0" y="281.0" font-size="15" font-weight="bold" fill="#6b7280" text-anchor="end">Main risks</text><rect x="128.0" y="238.0" width="367.0" height="76.0" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="140.0" y="281.5" font-size="17" font-weight="normal" fill="#1e3a8a" text-anchor="start">bias, opacity, data quality</text><rect x="505.0" y="238.0" width="367.0" height="76.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="517.0" y="270.9" font-size="17" font-weight="normal" fill="#1f2937" text-anchor="start">confabulation, harmful content, leakage,</text><text x="517.0" y="292.1" font-size="17" font-weight="normal" fill="#1f2937" text-anchor="start">intellectual property</text></svg>