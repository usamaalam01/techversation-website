<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 306" width="880" height="306" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">m06-requirements</title><desc id="d">Seven requirements in Articles 9 to 15.</desc><defs></defs><rect x="0.75" y="0.75" width="878.5" height="304.5" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><rect x="8.0" y="8.0" width="207.0" height="100.0" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="111.5" y="52.9" font-size="17" font-weight="bold" fill="#1e3a8a" text-anchor="middle">Article 9</text><text x="111.5" y="74.2" font-size="17" font-weight="normal" fill="#1e3a8a" text-anchor="middle">risk management system</text><rect x="227.0" y="8.0" width="207.0" height="100.0" rx="8" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.6"/><text x="330.5" y="42.3" font-size="17" font-weight="bold" fill="#134e4a" text-anchor="middle">Article 10</text><text x="330.5" y="63.5" font-size="17" font-weight="normal" fill="#134e4a" text-anchor="middle">data and data</text><text x="330.5" y="84.8" font-size="17" font-weight="normal" fill="#134e4a" text-anchor="middle">governance</text><rect x="446.0" y="8.0" width="207.0" height="100.0" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="549.5" y="52.9" font-size="17" font-weight="bold" fill="#14532d" text-anchor="middle">Article 11</text><text x="549.5" y="74.2" font-size="17" font-weight="normal" fill="#14532d" text-anchor="middle">technical documentation</text><rect x="665.0" y="8.0" width="207.0" height="100.0" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="768.5" y="52.9" font-size="17" font-weight="bold" fill="#78350f" text-anchor="middle">Article 12</text><text x="768.5" y="74.2" font-size="17" font-weight="normal" fill="#78350f" text-anchor="middle">record-keeping (logs)</text><rect x="8.0" y="120.0" width="280.0" height="100.0" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.6"/><text x="148.0" y="164.9" font-size="17" font-weight="bold" fill="#4c1d95" text-anchor="middle">Article 13</text><text x="148.0" y="186.2" font-size="17" font-weight="normal" fill="#4c1d95" text-anchor="middle">transparency and instructions</text><rect x="300.0" y="120.0" width="280.0" height="100.0" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.6"/><text x="440.0" y="164.9" font-size="17" font-weight="bold" fill="#7f1d1d" text-anchor="middle">Article 14</text><text x="440.0" y="186.2" font-size="17" font-weight="normal" fill="#7f1d1d" text-anchor="middle">human oversight</text><rect x="592.0" y="120.0" width="280.0" height="100.0" rx="8" fill="#1e3a8a" stroke="#1e3a8a" stroke-width="1.6"/><text x="732.0" y="154.3" font-size="17" font-weight="bold" fill="#ffffff" text-anchor="middle">Article 15</text><text x="732.0" y="175.5" font-size="17" font-weight="normal" fill="#ffffff" text-anchor="middle">accuracy, robustness,</text><text x="732.0" y="196.8" font-size="17" font-weight="normal" fill="#ffffff" text-anchor="middle">cybersecurity</text><rect x="8.0" y="236.0" width="864.0" height="60.0" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.6"/><text x="440.0" y="271.9" font-size="18" font-weight="bold" fill="#374151" text-anchor="middle">The provider meets them; the deployer relies on and supports them</text></svg>