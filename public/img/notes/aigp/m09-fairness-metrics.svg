<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 400" width="880" height="400" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">m09-fairness-metrics</title><desc id="d">Four fairness measures: selection rate and impact ratio, demographic parity, equal opportunity and equalized odds.</desc><defs></defs><rect x="0.75" y="0.75" width="878.5" height="398.5" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><rect x="226.0" y="8.0" width="319.0" height="46.0" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="385.5" y="36.5" font-size="17" font-weight="bold" fill="#1e3a8a" text-anchor="middle">What it compares</text><rect x="553.0" y="8.0" width="319.0" height="46.0" rx="8" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.6"/><text x="712.5" y="36.5" font-size="17" font-weight="bold" fill="#134e4a" text-anchor="middle">The idea of fairness</text><rect x="8.0" y="62.0" width="210.0" height="76.0" rx="8" fill="#1e3a8a" stroke="#1e3a8a" stroke-width="1.6"/><text x="113.0" y="95.2" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">Selection rate, impact</text><text x="113.0" y="115.2" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">ratio</text><rect x="226.0" y="62.0" width="319.0" height="76.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="236.0" y="105.2" font-size="16" font-weight="normal" fill="#1f2937" text-anchor="start">selection rate by group; lower over higher</text><rect x="553.0" y="62.0" width="319.0" height="76.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="563.0" y="105.2" font-size="16" font-weight="normal" fill="#1f2937" text-anchor="start">a ratio under 0.8 is a red flag</text><rect x="8.0" y="146.0" width="210.0" height="76.0" rx="8" fill="#1e3a8a" stroke="#1e3a8a" stroke-width="1.6"/><text x="113.0" y="189.2" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">Demographic parity</text><rect x="226.0" y="146.0" width="319.0" height="76.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="236.0" y="189.2" font-size="16" font-weight="normal" fill="#1f2937" text-anchor="start">selection rates</text><rect x="553.0" y="146.0" width="319.0" height="76.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="563.0" y="189.2" font-size="16" font-weight="normal" fill="#1f2937" text-anchor="start">equal rates across groups</text><rect x="8.0" y="230.0" width="210.0" height="76.0" rx="8" fill="#1e3a8a" stroke="#1e3a8a" stroke-width="1.6"/><text x="113.0" y="273.2" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">Equal opportunity</text><rect x="226.0" y="230.0" width="319.0" height="76.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="236.0" y="263.2" font-size="16" font-weight="normal" fill="#1f2937" text-anchor="start">true-positive rates among those who</text><text x="236.0" y="283.2" font-size="16" font-weight="normal" fill="#1f2937" text-anchor="start">qualify</text><rect x="553.0" y="230.0" width="319.0" height="76.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="563.0" y="273.2" font-size="16" font-weight="normal" fill="#1f2937" text-anchor="start">equal chance for the qualified</text><rect x="8.0" y="314.0" width="210.0" height="76.0" rx="8" fill="#1e3a8a" stroke="#1e3a8a" stroke-width="1.6"/><text x="113.0" y="357.2" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">Equalized odds</text><rect x="226.0" y="314.0" width="319.0" height="76.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="236.0" y="357.2" font-size="16" font-weight="normal" fill="#1f2937" text-anchor="start">true- and false-positive rates</text><rect x="553.0" y="314.0" width="319.0" height="76.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="563.0" y="357.2" font-size="16" font-weight="normal" fill="#1f2937" text-anchor="start">equal error profile across groups</text></svg>