<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 428" width="880" height="428" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">m14-standards</title><desc id="d">NIST AI RMF, ISO/IEC 42001 and the OECD principles compared on nature, structure, certification and use at Helios.</desc><defs></defs><rect x="0.75" y="0.75" width="878.5" height="426.5" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><rect x="156.0" y="8.0" width="233.3" height="42.0" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="272.7" y="34.5" font-size="17" font-weight="bold" fill="#1e3a8a" text-anchor="middle">NIST AI RMF</text><rect x="397.3" y="8.0" width="233.3" height="42.0" rx="8" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.6"/><text x="514.0" y="34.5" font-size="17" font-weight="bold" fill="#134e4a" text-anchor="middle">ISO/IEC 42001</text><rect x="638.7" y="8.0" width="233.3" height="42.0" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="755.3" y="34.5" font-size="17" font-weight="bold" fill="#14532d" text-anchor="middle">OECD principles</text><rect x="8.0" y="58.0" width="140.0" height="84.0" rx="8" fill="#1e3a8a" stroke="#1e3a8a" stroke-width="1.6"/><text x="78.0" y="105.2" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">Nature</text><rect x="156.0" y="58.0" width="233.3" height="84.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="166.0" y="104.9" font-size="15" font-weight="normal" fill="#1f2937" text-anchor="start">voluntary framework</text><rect x="397.3" y="58.0" width="233.3" height="84.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="407.3" y="104.9" font-size="15" font-weight="normal" fill="#1f2937" text-anchor="start">management system standard</text><rect x="638.7" y="58.0" width="233.3" height="84.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="648.7" y="104.9" font-size="15" font-weight="nor