<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 278" width="880" height="278" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">m01-what-how-why</title><desc id="d">Transparency tells what happened, explainability how a decision was made, interpretability why and what it means.</desc><defs><marker id="ah0" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker></defs><rect x="0.75" y="0.75" width="878.5" height="276.5" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><rect x="8.0" y="8.0" width="268.0" height="118.0" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="142.0" y="61.6" font-size="18" font-weight="bold" fill="#1e3a8a" text-anchor="middle">Transparency</text><text x="142.0" y="84.1" font-size="18" font-weight="normal" fill="#1e3a8a" text-anchor="middle">What happened?</text><line x1="278.0" y1="67.0" x2="304.0" y2="67.0" stroke="#1f2937" stroke-width="2.6" marker-end="url(#ah0)"/><rect x="306.0" y="8.0" width="268.0" height="118.0" rx="8" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.6"/><text x="440.0" y="61.6" font-size="18" font-weight="bold" fill="#134e4a" text-anchor="middle">Explainability</text><text x="440.0" y="84.1" font-size="18" font-weight="normal" fill="#134e4a" text-anchor="middle">How was the decision made?</text><line x1="576.0" y1="67.0" x2="602.0" y2="67.0" stroke="#1f2937" stroke-width="2.6" marker-end="url(#ah0)"/><rect x="604.0" y="8.0" width="268.0" height="118.0" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="738.0" y="50.3" font-size="18" font-weight="bold" fill="#14532d" text-anchor="middle">Interpretability</text><text x="738.0" y="72.8" font-size="18" font-weight="normal" fill="#14532d" text-anchor="middle">Why, and what does it mean</text><text x="738.0" y="95.3" font-size="18" font-weight="normal" fill="#14532d" text-anchor="middle">to the user?</text><text x="142.0" y="156.0" font-size="15" font-weight="bold" fill="#6b7280" text-anchor="middle">At Helios</text><rect x="8.0" y="166.0" width="268.0" height="100.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="142.0" y="211.2" font-size="16" font-weight="normal" fill="#1f2937" text-anchor="middle">Applicants are told that AI screens</text><text x="142.0" y="231.2" font-size="16" font-weight="normal" fill="#1f2937" text-anchor="middle">applications</text><text x="440.0" y="156.0" font-size="15" font-weight="bold" fill="#6b7280" text-anchor="middle">At Helios</text><rect x="306.0" y="166.0" width="268.0" height="100.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="440.0" y="211.2" font-size="16" font-weight="normal" fill="#1f2937" text-anchor="middle">The recruiter sees which factors</text><text x="440.0" y="231.2" font-size="16" font-weight="normal" fill="#1f2937" text-anchor="middle">drove the score</text><text x="738.0" y="156.0" font-size="15" font-weight="bold" fill="#6b7280" text-anchor="middle">At Helios</text><rect x="604.0" y="166.0" width="268.0" height="100.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="738.0" y="211.2" font-size="16" font-weight="normal" fill="#1f2937" text-anchor="middle">The recruiter understands what</text><text x="738.0" y="231.2" font-size="16" font-weight="normal" fill="#1f2937" text-anchor="middle">the score means for the role</text></svg>