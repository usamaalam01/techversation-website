<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 268" width="880" height="268" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">m10-conformity</title><desc id="d">Four steps before an EU high-risk system is placed on the market: conformity assessment, declaration, CE marking and registration.</desc><defs></defs><rect x="0.75" y="0.75" width="878.5" height="266.5" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><polygon points="8.0,8.0 198.0,8.0 218.0,39.0 198.0,70.0 8.0,70.0" fill="#dbeafe" stroke="#2563eb" stroke-width="1.8"/><text x="106.0" y="34.5" font-size="16" font-weight="bold" fill="#1e3a8a" text-anchor="middle">1 Conformity</text><text x="106.0" y="53.7" font-size="16" font-weight="bold" fill="#1e3a8a" text-anchor="middle">assessment</text><rect x="10.0" y="74.0" width="196.0" height="110.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="18.0" y="115.1" font-size="15" font-weight="normal" fill="#1f2937" text-anchor="start">Article 43: check the</text><text x="18.0" y="133.9" font-size="15" font-weight="normal" fill="#1f2937" text-anchor="start">system against the</text><text x="18.0" y="152.6" font-size="15" font-weight="normal" fill="#1f2937" text-anchor="start">requirements</text><polygon points="226.0,8.0 416.0,8.0 436.0,39.0 416.0,70.0 226.0,70.0 246.0,39.0" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.8"/><text x="331.0" y="44.1" font-size="16" font-weight="bold" fill="#134e4a" text-anchor="middle">2 EU declaration</text><rect x="228.0" y="74.0" width="196.0" height="110.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="236.0" y="124.5" font-size="15" font-weight="normal" fill="#1f2937" text-anchor="start">Article 47: the provider</text><text x="236.0" y="143.2" font-size="15" font-weight="normal" fill="#1f2937" text-anchor="start">declares conformity</text><polygon points="444.0,8.0 634.0,8.0 654.0,39.0 634.0,70.0 444.0,70.0 464.0,39.0" fill="#dcfce7" stroke="#16a34a" stroke-width="1.8"/><text x="549.0" y="44.1" font-size="16" font-weight="bold" fill="#14532d" text-anchor="middle">3 CE marking</text><rect x="446.0" y="74.0" width="196.0" height="110.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="454.0" y="124.5" font-size="15" font-weight="normal" fill="#1f2937" text-anchor="start">Article 48: the marking is</text><text x="454.0" y="143.2" font-size="15" font-weight="normal" fill="#1f2937" text-anchor="start">affixed</text><polygon points="662.0,8.0 852.0,8.0 872.0,39.0 852.0,70.0 662.0,70.0 682.0,39.0" fill="#fef3c7" stroke="#d97706" stroke-width="1.8"/><text x="767.0" y="44.1" font-size="16" font-weight="bold" fill="#78350f" text-anchor="middle">4 Registration</text><rect x="664.0" y="74.0" width="196.0" height="110.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="672.0" y="124.5" font-size="15" font-weight="normal" fill="#1f2937" text-anchor="start">Article 49: entry in the EU</text><text x="672.0" y="143.2" font-size="15" font-weight="normal" fill="#1f2937" text-anchor="start">database</text><rect x="8.0" y="196.0" width="864.0" height="62.0" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.6" stroke-dasharray="6 4"/><text x="440.0" y="232.2" font-size="16" font-weight="normal" fill="#374151" text-anchor="middle">Substantial modification: assess again. Other laws and standards may add checks.</text></svg>