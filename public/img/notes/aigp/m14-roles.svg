<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 478" width="880" height="478" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">m14-roles</title><desc id="d">Six roles: provider, deployer, importer or distributor, authorized representative, controller and processor, with the law and the defining question.</desc><defs></defs><rect x="0.75" y="0.75" width="878.5" height="476.5" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><rect x="8.0" y="8.0" width="200.0" height="40.0" rx="8" fill="#1e3a8a" stroke="#1e3a8a" stroke-width="1.6"/><text x="108.0" y="33.2" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">Role</text><rect x="216.0" y="8.0" width="100.0" height="40.0" rx="8" fill="#1e3a8a" stroke="#1e3a8a" stroke-width="1.6"/><text x="266.0" y="33.2" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">Law</text><rect x="324.0" y="8.0" width="548.0" height="40.0" rx="8" fill="#1e3a8a" stroke="#1e3a8a" stroke-width="1.6"/><text x="598.0" y="33.2" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">What defines it</text><rect x="8.0" y="56.0" width="200.0" height="62.0" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="108.0" y="92.5" font-size="17" font-weight="bold" fill="#1e3a8a" text-anchor="middle">Provider</text><rect x="216.0" y="56.0" width="100.0" height="62.0" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="266.0" y="92.5" font-size="17" font-weight="bold" fill="#1e3a8a" text-anchor="middle">AI Act</text><rect x="324.0" y="56.0" width="548.0" height="62.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="336.0" y="82.2" font-size="16" font-weight="normal" fill="#1f2937" text-anchor="start">develops a system or model and places it on the market or puts it into</text><text x="336.0" y="102.2" font-size="16" font-weight="normal" fill="#1f2937" text-anchor="start">service under its own name</text><rect x="8.0" y="126.0" width="200.0" height="62.0" rx="8" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.6"/><text x="108.0" y="162.5" font-size="17" font-weight="bold" fill="#134e4a" text-anchor="middle">Deployer</text><rect x="216.0" y="126.0" width="100.0" height="62.0" rx="8" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.6"/><text x="266.0" y="162.5" font-size="17" font-weight="bold" fill="#134e4a" text-anchor="middle">AI Act</text><rect x="324.0" y="126.0" width="548.0" height="62.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="336.0" y="162.2" font-size="16" font-weight="normal" fill="#1f2937" text-anchor="start">uses a system under its authority</text><rect x="8.0" y="196.0" width="200.0" height="62.0" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="108.0" y="232.5" font-size="17" font-weight="bold" fill="#14532d" text-anchor="middle">Importer, distributor</text><rect x="216.0" y="196.0" width="100.0" height="62.0" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="266.0" y="232.5" font-size="17" font-weight="bold" fill="#14532d" text-anchor="middle">AI Act</text><rect x="324.0" y="196.0" width="548.0" height="62.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="336.0" y="232.2" font-size="16" font-weight="normal" fill="#1f2937" text-anchor="start">brings in, or passes on, a system in the supply chain</text><rect x="8.0" y="266.0" width="200.0" height="62.0" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="108.0" y="291.9" font-size="17" font-weight="bold" fill="#78350f" text-anchor="middle">Authorized</text><text x="108.0" y="313.1" font-size="17" font-weight="bold" fill="#78350f" text-anchor="middle">representative</text><rect x="216.0" y="266.0" width="100.0" height="62.0" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="266.0" y="302.5" font-size="17" font-weight="bold" fill="#78350f" text-anchor="middle">AI Act</text><rect x="324.0" y="266.0" width="548.0" height="62.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="336.0" y="302.2" font-size="16" font-weight="normal" fill="#1f2937" text-anchor="start">holds a written mandate from a provider outside the Union</text><rect x="8.0" y="336.0" width="200.0" height="62.0" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.6"/><text x="108.0" y="372.5" font-size="17" font-weight="bold" fill="#4c1d95" text-anchor="middle">Controller</text><rect x="216.0" y="336.0" width="100.0" height="62.0" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.6"/><text x="266.0" y="372.5" font-size="17" font-weight="bold" fill="#4c1d95" text-anchor="middle">GDPR</text><rect x="324.0" y="336.0" width="548.0" height="62.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="336.0" y="372.2" font-size="16" font-weight="normal" fill="#1f2937" text-anchor="start">decides the purposes and means of processing</text><rect x="8.0" y="406.0" width="200.0" height="62.0" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.6"/><text x="108.0" y="442.5" font-size="17" font-weight="bold" fill="#7f1d1d" text-anchor="middle">Processor</text><rect x="216.0" y="406.0" width="100.0" height="62.0" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.6"/><text x="266.0" y="442.5" font-size="17" font-weight="bold" fill="#7f1d1d" text-anchor="middle">GDPR</text><rect x="324.0" y="406.0" width="548.0" height="62.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="336.0" y="442.2" font-size="16" font-weight="normal" fill="#1f2937" text-anchor="start">processes on the controller's behalf, under a contract</text></svg>