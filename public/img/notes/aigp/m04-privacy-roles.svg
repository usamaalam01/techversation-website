<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 362" width="880" height="362" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">m04-privacy-roles</title><desc id="d">Helios is the controller; Veridex and Corvid Labs are processors unless they decide purposes of their own.</desc><defs><marker id="ah0" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker><marker id="ah1" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker></defs><rect x="0.75" y="0.75" width="878.5" height="360.5" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><rect x="262.0" y="8.0" width="356.0" height="74.0" rx="8" fill="#1e3a8a" stroke="#1e3a8a" stroke-width="1.6"/><text x="440.0" y="39.3" font-size="19" font-weight="bold" fill="#ffffff" text-anchor="middle">Helios</text><text x="440.0" y="63.0" font-size="19" font-weight="normal" fill="#ffffff" text-anchor="middle">controller of the applicant data</text><rect x="8.0" y="150.0" width="420.0" height="80.0" rx="8" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.6"/><text x="218.0" y="184.9" font-size="17" font-weight="bold" fill="#134e4a" text-anchor="middle">Veridex: processor</text><text x="218.0" y="206.2" font-size="17" font-weight="normal" fill="#134e4a" text-anchor="middle">hiring tool: screens on Helios's instructions</text><rect x="8.0" y="270.0" width="420.0" height="80.0" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.6" stroke-dasharray="6 4"/><text x="218.0" y="305.2" font-size="16" font-weight="bold" fill="#374151" text-anchor="middle">becomes a controller or joint controller</text><text x="218.0" y="325.2" font-size="16" font-weight="normal" fill="#374151" text-anchor="middle">if it uses the data for its own purposes</text><line x1="440.0" y1="84.0" x2="218.0" y2="148.0" stroke="#1f2937" stroke-width="2.6" marker-end="url(#ah0)"/><line x1="218.0" y1="232.0" x2="218.0" y2="268.0" stroke="#6b7280" stroke-width="2.2" stroke-dasharray="6 4" marker-end="url(#ah1)"/><rect x="452.0" y="150.0" width="420.0" height="80.0" rx="8" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.6"/><text x="662.0" y="184.9" font-size="17" font-weight="bold" fill="#134e4a" text-anchor="middle">Corvid Labs: processor</text><text x="662.0" y="206.2" font-size="17" font-weight="normal" fill="#134e4a" text-anchor="middle">assistant model: answers chats through its interface</text><rect x="452.0" y="270.0" width="420.0" height="80.0" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.6" stroke-dasharray="6 4"/><text x="662.0" y="305.2" font-size="16" font-weight="bold" fill="#374151" text-anchor="middle">becomes a controller or joint controller</text><text x="662.0" y="325.2" font-size="16" font-weight="normal" fill="#374151" text-anchor="middle">if it uses the data for its own purposes</text><line x1="440.0" y1="84.0" x2="662.0" y2="148.0" stroke="#1f2937" stroke-width="2.6" marker-end="url(#ah0)"/><line x1="662.0" y1="232.0" x2="662.0" y2="268.0" stroke="#6b7280" stroke-width="2.2" stroke-dasharray="6 4" marker-end="url(#ah1)"/></svg>