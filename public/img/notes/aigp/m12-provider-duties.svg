<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 394" width="880" height="394" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">m12-provider-duties</title><desc id="d">Provider duties for a high-risk system: requirements, quality management, conformity steps before release, and post-market duties.</desc><defs></defs><rect x="0.75" y="0.75" width="878.5" height="392.5" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><rect x="8.0" y="8.0" width="220.0" height="70.0" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="118.0" y="48.8" font-size="18" font-weight="bold" fill="#1e3a8a" text-anchor="middle">Requirements</text><rect x="238.0" y="8.0" width="634.0" height="70.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="254.0" y="38.2" font-size="16" font-weight="normal" fill="#1f2937" text-anchor="start">Articles 9 to 15: risk management, data, documents, logs, oversight, accuracy,</text><text x="254.0" y="58.2" font-size="16" font-weight="normal" fill="#1f2937" text-anchor="start">security</text><rect x="8.0" y="88.0" width="220.0" height="70.0" rx="8" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.6"/><text x="118.0" y="128.8" font-size="18" font-weight="bold" fill="#134e4a" text-anchor="middle">Quality management</text><rect x="238.0" y="88.0" width="634.0" height="70.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="254.0" y="128.2" font-size="16" font-weight="normal" fill="#1f2937" text-anchor="start">Article 17, within the Article 16 duties</text><rect x="8.0" y="168.0" width="220.0" height="70.0" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="118.0" y="208.8" font-size="18" font-weight="bold" fill="#78350f" text-anchor="middle">Before release</text><rect x="238.0" y="168.0" width="634.0" height="70.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="254.0" y="198.2" font-size="16" font-weight="normal" fill="#1f2937" text-anchor="start">conformity assessment, declaration, CE marking, registration (Articles 43, 47, 48,</text><text x="254.0" y="218.2" font-size="16" font-weight="normal" fill="#1f2937" text-anchor="start">49)</text><rect x="8.0" y="248.0" width="220.0" height="70.0" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.6"/><text x="118.0" y="288.9" font-size="18" font-weight="bold" fill="#4c1d95" text-anchor="middle">After release</text><rect x="238.0" y="248.0" width="634.0" height="70.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="254.0" y="288.2" font-size="16" font-weight="normal" fill="#1f2937" text-anchor="start">post-market monitoring and serious incident reporting (Articles 72, 73)</text><rect x="8.0" y="336.0" width="864.0" height="48.0" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.6" stroke-dasharray="6 4"/><text x="440.0" y="365.5" font-size="17" font-weight="normal" fill="#374151" text-anchor="middle">General-purpose models add the Article 53(1) duties</text></svg>