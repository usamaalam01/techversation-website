<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 280" width="880" height="280" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">m13-triggers</title><desc id="d">Six triggers for switching off or limiting a system: regulatory, performance, incident, rights, supply and policy.</desc><defs></defs><rect x="0.75" y="0.75" width="878.5" height="278.5" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><rect x="8.0" y="8.0" width="280.0" height="126.0" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.6"/><text x="148.0" y="55.3" font-size="17" font-weight="bold" fill="#7f1d1d" text-anchor="middle">Regulatory</text><text x="148.0" y="76.5" font-size="17" font-weight="normal" fill="#7f1d1d" text-anchor="middle">a ban, a prohibited practice, an</text><text x="148.0" y="97.8" font-size="17" font-weight="normal" fill="#7f1d1d" text-anchor="middle">order</text><rect x="300.0" y="8.0" width="280.0" height="126.0" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="440.0" y="65.9" font-size="17" font-weight="bold" fill="#78350f" text-anchor="middle">Performance</text><text x="440.0" y="87.2" font-size="17" font-weight="normal" fill="#78350f" text-anchor="middle">below thresholds, unsafe behavior</text><rect x="592.0" y="8.0" width="280.0" height="126.0" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.6"/><text x="732.0" y="65.9" font-size="17" font-weight="bold" fill="#4c1d95" text-anchor="middle">Incident</text><text x="732.0" y="87.2" font-size="17" font-weight="normal" fill="#4c1d95" text-anchor="middle">a serious incident</text><rect x="8.0" y="146.0" width="280.0" height="126.0" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="148.0" y="203.9" font-size="17" font-weight="bold" fill="#1e3a8a" text-anchor="middle">Rights</text><text x="148.0" y="225.2" font-size="17" font-weight="normal" fill="#1e3a8a" text-anchor="middle">a breach of people's rights</text><rect x="300.0" y="146.0" width="280.0" height="126.0" rx="8" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.6"/><text x="440.0" y="203.9" font-size="17" font-weight="bold" fill="#134e4a" text-anchor="middle">Supply</text><text x="440.0" y="225.2" font-size="17" font-weight="normal" fill="#134e4a" text-anchor="middle">vendor change, withdrawal, failure</text><rect x="592.0" y="146.0" width="280.0" height="126.0" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="732.0" y="203.9" font-size="17" font-weight="bold" fill="#14532d" text-anchor="middle">Policy</text><text x="732.0" y="225.2" font-size="17" font-weight="normal" fill="#14532d" text-anchor="middle">use outside the approved scope</text></svg>