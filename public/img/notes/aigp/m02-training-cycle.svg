<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 210" width="880" height="210" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">m02-training-cycle</title><desc id="d">Five steps: assess needs, design by role, deliver and record, check understanding, refresh.</desc><defs></defs><rect x="0.75" y="0.75" width="878.5" height="208.5" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><polygon points="8.0,8.0 152.8,8.0 172.8,39.0 152.8,70.0 8.0,70.0" fill="#dbeafe" stroke="#2563eb" stroke-width="1.8"/><text x="83.4" y="44.1" font-size="16" font-weight="bold" fill="#1e3a8a" text-anchor="middle">Assess needs</text><rect x="10.0" y="74.0" width="150.8" height="130.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="18.0" y="125.1" font-size="15" font-weight="normal" fill="#1f2937" text-anchor="start">who uses, builds,</text><text x="18.0" y="143.9" font-size="15" font-weight="normal" fill="#1f2937" text-anchor="start">buys and oversees</text><text x="18.0" y="162.6" font-size="15" font-weight="normal" fill="#1f2937" text-anchor="start">AI</text><polygon points="182.8,8.0 327.6,8.0 347.6,39.0 327.6,70.0 182.8,70.0 202.8,39.0" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.8"/><text x="265.2" y="44.1" font-size="16" font-weight="bold" fill="#134e4a" text-anchor="middle">Design by role</text><rect x="184.8" y="74.0" width="150.8" height="130.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="192.8" y="125.1" font-size="15" font-weight="normal" fill="#1f2937" text-anchor="start">short, practical, in</text><text x="192.8" y="143.9" font-size="15" font-weight="normal" fill="#1f2937" text-anchor="start">the audience's</text><text x="192.8" y="162.6" font-size="15" font-weight="normal" fill="#1f2937" text-anchor="start">language</text><polygon points="357.6,8.0 502.4,8.0 522.4,39.0 502.4,70.0 357.6,70.0 377.6,39.0" fill="#dcfce7" stroke="#16a34a" stroke-width="1.8"/><text x="440.0" y="34.5" font-size="16" font-weight="bold" fill="#14532d" text-anchor="middle">Deliver and</text><text x="440.0" y="53.7" font-size="16" font-weight="bold" fill="#14532d" text-anchor="middle">record</text><rect x="359.6" y="74.0" width="150.8" height="130.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="367.6" y="134.5" font-size="15" font-weight="normal" fill="#1f2937" text-anchor="start">keep attendance as</text><text x="367.6" y="153.2" font-size="15" font-weight="normal" fill="#1f2937" text-anchor="start">evidence</text><polygon points="532.4,8.0 677.2,8.0 697.2,39.0 677.2,70.0 532.4,70.0 552.4,39.0" fill="#fef3c7" stroke="#d97706" stroke-width="1.8"/><text x="614.8" y="34.5" font-size="16" font-weight="bold" fill="#78350f" text-anchor="middle">Check</text><text x="614.8" y="53.7" font-size="16" font-weight="bold" fill="#78350f" text-anchor="middle">understanding</text><rect x="534.4" y="74.0" width="150.8" height="130.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="542.4" y="125.1" font-size="15" font-weight="normal" fill="#1f2937" text-anchor="start">scenarios and</text><text x="542.4" y="143.9" font-size="15" font-weight="normal" fill="#1f2937" text-anchor="start">quizzes, not just</text><text x="542.4" y="162.6" font-size="15" font-weight="normal" fill="#1f2937" text-anchor="start">completion</text><polygon points="707.2,8.0 852.0,8.0 872.0,39.0 852.0,70.0 707.2,70.0 727.2,39.0" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.8"/><text x="789.6" y="44.1" font-size="16" font-weight="bold" fill="#4c1d95" text-anchor="middle">Refresh</text><rect x="709.2" y="74.0" width="150.8" height="130.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="717.2" y="125.1" font-size="15" font-weight="normal" fill="#1f2937" text-anchor="start">when systems,</text><text x="717.2" y="143.9" font-size="15" font-weight="normal" fill="#1f2937" text-anchor="start">rules or roles</text><text x="717.2" y="162.6" font-size="15" font-weight="normal" fill="#1f2937" text-anchor="start">change</text></svg>