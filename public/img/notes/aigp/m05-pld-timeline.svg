<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 268" width="880" height="268" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">m05-pld-timeline</title><desc id="d">The Directive enters into force, then applies to products placed on the market after the transposition deadline.</desc><defs></defs><rect x="0.75" y="0.75" width="878.5" height="266.5" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><line x1="40.0" y1="118.0" x2="840.0" y2="118.0" stroke="#6b7280" stroke-width="3"/><rect x="40.0" y="8.0" width="380.0" height="78.0" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="230.0" y="41.9" font-size="17" font-weight="bold" fill="#1e3a8a" text-anchor="middle">8 December 2024</text><text x="230.0" y="63.1" font-size="17" font-weight="normal" fill="#1e3a8a" text-anchor="middle">entered into force</text><line x1="230.0" y1="86.0" x2="230.0" y2="109.0" stroke="#6b7280" stroke-width="1.8"/><circle cx="230.0" cy="118.0" r="9" fill="#dbeafe" stroke="#2563eb" stroke-width="2.4"/><rect x="460.0" y="8.0" width="380.0" height="78.0" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="650.0" y="31.3" font-size="17" font-weight="bold" fill="#14532d" text-anchor="middle">9 December 2026</text><text x="650.0" y="52.5" font-size="17" font-weight="normal" fill="#14532d" text-anchor="middle">applies to products placed on the market;</text><text x="650.0" y="73.8" font-size="17" font-weight="normal" fill="#14532d" text-anchor="middle">transposition deadline</text><line x1="650.0" y1="86.0" x2="650.0" y2="109.0" stroke="#6b7280" stroke-width="1.8"/><circle cx="650.0" cy="118.0" r="9" fill="#dcfce7" stroke="#16a34a" stroke-width="2.4"/><rect x="8.0" y="156.0" width="280.0" height="100.0" rx="8" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.6"/><text x="148.0" y="191.2" font-size="16" font-weight="bold" fill="#134e4a" text-anchor="middle">Software is a product</text><text x="148.0" y="211.2" font-size="16" font-weight="normal" fill="#134e4a" text-anchor="middle">applications, operating systems and</text><text x="148.0" y="231.2" font-size="16" font-weight="normal" fill="#134e4a" text-anchor="middle">AI systems</text><rect x="300.0" y="156.0" width="280.0" height="100.0" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="440.0" y="191.2" font-size="16" font-weight="bold" fill="#78350f" text-anchor="middle">Defects after release count</text><text x="440.0" y="211.2" font-size="16" font-weight="normal" fill="#78350f" text-anchor="middle">updates, upgrades, machine</text><text x="440.0" y="231.2" font-size="16" font-weight="normal" fill="#78350f" text-anchor="middle">learning</text><rect x="592.0" y="156.0" width="280.0" height="100.0" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.6"/><text x="732.0" y="191.2" font-size="16" font-weight="bold" fill="#4c1d95" text-anchor="middle">Evidence and proof</text><text x="732.0" y="211.2" font-size="16" font-weight="normal" fill="#4c1d95" text-anchor="middle">disclosure where proportionate and</text><text x="732.0" y="231.2" font-size="16" font-weight="normal" fill="#4c1d95" text-anchor="middle">necessary</text></svg>