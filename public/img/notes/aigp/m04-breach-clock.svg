<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 330" width="880" height="330" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">m04-breach-clock</title><desc id="d">A breach timeline: aware, processor tells controller, authority within 72 hours, individuals if high risk, document everything.</desc><defs></defs><rect x="0.75" y="0.75" width="878.5" height="328.5" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><line x1="90.0" y1="172.0" x2="790.0" y2="172.0" stroke="#6b7280" stroke-width="3"/><circle cx="160.0" cy="172.0" r="9" fill="#fee2e2" stroke="#dc2626" stroke-width="2.4"/><rect x="41.0" y="60.0" width="238.0" height="90.0" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.6"/><text x="160.0" y="91.1" font-size="15" font-weight="bold" fill="#7f1d1d" text-anchor="middle">Aware</text><text x="160.0" y="109.9" font-size="15" font-weight="normal" fill="#7f1d1d" text-anchor="middle">the controller becomes aware of</text><text x="160.0" y="128.6" font-size="15" font-weight="normal" fill="#7f1d1d" text-anchor="middle">the breach</text><line x1="160.0" y1="150.0" x2="160.0" y2="163.0" stroke="#6b7280" stroke-width="1.8"/><circle cx="300.0" cy="172.0" r="9" fill="#fef3c7" stroke="#d97706" stroke-width="2.4"/><rect x="181.0" y="194.0" width="238.0" height="90.0" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="300.0" y="225.1" font-size="15" font-weight="bold" fill="#78350f" text-anchor="middle">Processor</text><text x="300.0" y="243.9" font-size="15" font-weight="normal" fill="#78350f" text-anchor="middle">tells the controller without undue</text><text x="300.0" y="262.6" font-size="15" font-weight="normal" fill="#78350f" text-anchor="middle">delay</text><line x1="300.0" y1="194.0" x2="300.0" y2="181.0" stroke="#6b7280" stroke-width="1.8"/><circle cx="440.0" cy="172.0" r="9" fill="#dbeafe" stroke="#2563eb" stroke-width="2.4"/><rect x="321.0" y="60.0" width="238.0" height="90.0" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="440.0" y="91.1" font-size="15" font-weight="bold" fill="#1e3a8a" text-anchor="middle">Authority</text><text x="440.0" y="109.9" font-size="15" font-weight="normal" fill="#1e3a8a" text-anchor="middle">within 72 hours where feasible,</text><text x="440.0" y="128.6" font-size="15" font-weight="normal" fill="#1e3a8a" text-anchor="middle">unless unlikely to risk</text><line x1="440.0" y1="150.0" x2="440.0" y2="163.0" stroke="#6b7280" stroke-width="1.8"/><circle cx="580.0" cy="172.0" r="9" fill="#ccfbf1" stroke="#0d9488" stroke-width="2.4"/><rect x="461.0" y="194.0" width="238.0" height="90.0" rx="8" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.6"/><text x="580.0" y="225.1" font-size="15" font-weight="bold" fill="#134e4a" text-anchor="middle">Individuals</text><text x="580.0" y="243.9" font-size="15" font-weight="normal" fill="#134e4a" text-anchor="middle">without undue delay if the risk is</text><text x="580.0" y="262.6" font-size="15" font-weight="normal" fill="#134e4a" text-anchor="middle">high</text><line x1="580.0" y1="194.0" x2="580.0" y2="181.0" stroke="#6b7280" stroke-width="1.8"/><circle cx="720.0" cy="172.0" r="9" fill="#dcfce7" stroke="#16a34a" stroke-width="2.4"/><rect x="601.0" y="60.0" width="238.0" height="90.0" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="720.0" y="91.1" font-size="15" font-weight="bold" fill="#14532d" text-anchor="middle">Record</text><text x="720.0" y="109.9" font-size="15" font-weight="normal" fill="#14532d" text-anchor="middle">document every breach: facts,</text><text x="720.0" y="128.6" font-size="15" font-weight="normal" fill="#14532d" text-anchor="middle">effects, remedy</text><line x1="720.0" y1="150.0" x2="720.0" y2="163.0" stroke="#6b7280" stroke-width="1.8"/></svg>