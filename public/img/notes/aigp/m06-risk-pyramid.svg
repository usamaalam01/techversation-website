<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 392" width="880" height="392" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">m06-risk-pyramid</title><desc id="d">A four-level pyramid: prohibited, high-risk, transparency duties and minimal risk, with general-purpose models on a separate track.</desc><defs></defs><rect x="0.75" y="0.75" width="878.5" height="390.5" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><polygon points="305.0,10.0 385.0,10.0 460.0,102.0 230.0,102.0" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/><text x="345.0" y="54.0" font-size="18" font-weight="bold" fill="#7f1d1d" text-anchor="middle">Prohibited</text><text x="345.0" y="74.0" font-size="14" font-weight="normal" fill="#7f1d1d" text-anchor="middle">Article 5</text><polygon points="230.0,102.0 460.0,102.0 535.0,194.0 155.0,194.0" fill="#fef3c7" stroke="#d97706" stroke-width="2"/><text x="345.0" y="146.0" font-size="18" font-weight="bold" fill="#78350f" text-anchor="middle">High-risk</text><text x="345.0" y="166.0" font-size="14" font-weight="normal" fill="#78350f" text-anchor="middle">Annex I, Annex III</text><polygon points="155.0,194.0 535.0,194.0 610.0,286.0 80.0,286.0" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="345.0" y="238.0" font-size="18" font-weight="bold" fill="#1e3a8a" text-anchor="middle">Transparency</text><text x="345.0" y="258.0" font-size="14" font-weight="normal" fill="#1e3a8a" text-anchor="middle">Article 50</text><polygon points="80.0,286.0 610.0,286.0 685.0,378.0 5.0,378.0" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="345.0" y="330.0" font-size="18" font-weight="bold" fill="#14532d" text-anchor="middle">Minimal risk</text><text x="345.0" y="350.0" font-size="14" font-weight="normal" fill="#14532d" text-anchor="middle">no specific duties</text><rect x="710.0" y="130.0" width="162.0" height="150.0" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.6"/><text x="791.0" y="180.2" font-size="16" font-weight="bold" fill="#4c1d95" text-anchor="middle">General-purpose</text><text x="791.0" y="200.2" font-size="16" font-weight="bold" fill="#4c1d95" text-anchor="middle">AI models</text><text x="791.0" y="220.2" font-size="16" font-weight="normal" fill="#4c1d95" text-anchor="middle">their own track of</text><text x="791.0" y="240.2" font-size="16" font-weight="normal" fill="#4c1d95" text-anchor="middle">obligations</text></svg>