<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 302" width="880" height="302" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">m13-reporting</title><desc id="d">Three reporting routes: risk or serious incident, personal data breach, and a provider's serious incident.</desc><defs></defs><rect x="0.75" y="0.75" width="878.5" height="300.5" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><rect x="246.0" y="8.0" width="309.0" height="44.0" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="400.5" y="35.5" font-size="17" font-weight="bold" fill="#1e3a8a" text-anchor="middle">Who tells whom</text><rect x="563.0" y="8.0" width="309.0" height="44.0" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="717.5" y="35.5" font-size="17" font-weight="bold" fill="#78350f" text-anchor="middle">Basis</text><rect x="8.0" y="60.0" width="230.0" height="72.0" rx="8" fill="#1e3a8a" stroke="#1e3a8a" stroke-width="1.6"/><text x="123.0" y="101.2" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">Risk or serious incident</text><rect x="246.0" y="60.0" width="309.0" height="72.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="256.0" y="81.2" font-size="16" font-weight="normal" fill="#1f2937" text-anchor="start">deployer informs the provider, suspends</text><text x="256.0" y="101.2" font-size="16" font-weight="normal" fill="#1f2937" text-anchor="start">use if there is a risk, reports a serious</text><text x="256.0" y="121.2" font-size="16" font-weight="normal" fill="#1f2937" text-anchor="start">incident</text><rect x="563.0" y="60.0" width="309.0" height="72.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="573.0" y="101.2" font-size="16" font-weight="normal" fill="#1f2937" text-anchor="start">Article 26</text><rect x="8.0" y="140.0" width="230.0" height="72.0" rx="8" fill="#1e3a8a" stroke="#1e3a8a" stroke-width="1.6"/><text x="123.0" y="181.2" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">Personal data breach</text><rect x="246.0" y="140.0" width="309.0" height="72.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="256.0" y="171.2" font-size="16" font-weight="normal" fill="#1f2937" text-anchor="start">controller notifies the supervisory</text><text x="256.0" y="191.2" font-size="16" font-weight="normal" fill="#1f2937" text-anchor="start">authority</text><rect x="563.0" y="140.0" width="309.0" height="72.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="573.0" y="171.2" font-size="16" font-weight="normal" fill="#1f2937" text-anchor="start">GDPR Article 33: 72 hours where</text><text x="573.0" y="191.2" font-size="16" font-weight="normal" fill="#1f2937" text-anchor="start">feasible</text><rect x="8.0" y="220.0" width="230.0" height="72.0" rx="8" fill="#1e3a8a" stroke="#1e3a8a" stroke-width="1.6"/><text x="123.0" y="261.2" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">Provider's serious incident</text><rect x="246.0" y="220.0" width="309.0" height="72.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="256.0" y="251.2" font-size="16" font-weight="normal" fill="#1f2937" text-anchor="start">provider reports to the market</text><text x="256.0" y="271.2" font-size="16" font-weight="normal" fill="#1f2937" text-anchor="start">surveillance authority</text><rect x="563.0" y="220.0" width="309.0" height="72.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="573.0" y="261.2" font-size="16" font-weight="normal" fill="#1f2937" text-anchor="start">Article 73: clocks in module 10</text></svg>