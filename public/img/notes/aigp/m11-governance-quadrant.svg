<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 380" width="880" height="380" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">m11-governance-quadrant</title><desc id="d">A two-by-two matrix: effect on people against how much the system acts on its own, from light governance to the strongest controls.</desc><defs></defs><rect x="0.75" y="0.75" width="878.5" height="378.5" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><rect x="84.0" y="8.0" width="386.0" height="164.0" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="277.0" y="84.6" font-size="18" font-weight="bold" fill="#78350f" text-anchor="middle">Human review</text><text x="277.0" y="107.1" font-size="18" font-weight="normal" fill="#78350f" text-anchor="middle">and an impact assessment</text><rect x="478.0" y="8.0" width="386.0" height="164.0" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.6"/><text x="671.0" y="84.6" font-size="18" font-weight="bold" fill="#7f1d1d" text-anchor="middle">Strongest controls</text><text x="671.0" y="107.1" font-size="18" font-weight="normal" fill="#7f1d1d" text-anchor="middle">possibly do not deploy</text><rect x="84.0" y="180.0" width="386.0" height="164.0" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="277.0" y="256.6" font-size="18" font-weight="bold" fill="#14532d" text-anchor="middle">Light governance</text><text x="277.0" y="279.1" font-size="18" font-weight="normal" fill="#14532d" text-anchor="middle">basic monitoring</text><rect x="478.0" y="180.0" width="386.0" height="164.0" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="671.0" y="256.6" font-size="18" font-weight="bold" fill="#1e3a8a" text-anchor="middle">Limits and monitoring</text><text x="671.0" y="279.1" font-size="18" font-weight="normal" fill="#1e3a8a" text-anchor="middle">caps on what it can do</text><text x="474.0" y="366.0" font-size="15" font-weight="bold" fill="#6b7280" text-anchor="middle">How much the system acts on its own</text><text x="88.0" y="366.0" font-size="13" font-weight="normal" fill="#6b7280" text-anchor="start">suggests</text><text x="860.0" y="366.0" font-size="13" font-weight="normal" fill="#6b7280" text-anchor="end">decides</text><text x="70.0" y="176.0" transform="rotate(-90 70.0 176.0)" font-size="15" font-weight="bold" fill="#6b7280" text-anchor="middle">Effect on people</text><text x="78.0" y="340.0" font-size="13" font-weight="normal" fill="#6b7280" text-anchor="end">low</text><text x="78.0" y="22.0" font-size="13" font-weight="normal" fill="#6b7280" text-anchor="end">high</text></svg>