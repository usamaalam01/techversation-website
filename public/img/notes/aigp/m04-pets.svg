<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 320" width="880" height="320" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">m04-pets</title><desc id="d">Privacy by design techniques and privacy by default settings.</desc><defs></defs><rect x="0.75" y="0.75" width="878.5" height="318.5" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><rect x="8.0" y="8.0" width="864.0" height="42.0" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="440.0" y="34.5" font-size="17" font-weight="bold" fill="#1e3a8a" text-anchor="middle">By design: build the control into the system (Article 25(1))</text><rect x="8.0" y="58.0" width="207.0" height="96.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="111.5" y="92.1" font-size="15" font-weight="bold" fill="#1f2937" text-anchor="middle">Pseudonymization</text><text x="111.5" y="110.9" font-size="15" font-weight="normal" fill="#1f2937" text-anchor="middle">replace identifiers; keep the</text><text x="111.5" y="129.6" font-size="15" font-weight="normal" fill="#1f2937" text-anchor="middle">key apart</text><rect x="227.0" y="58.0" width="207.0" height="96.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="330.5" y="92.1" font-size="15" font-weight="bold" fill="#1f2937" text-anchor="middle">Differential privacy</text><text x="330.5" y="110.9" font-size="15" font-weight="normal" fill="#1f2937" text-anchor="middle">add noise so no one can be</text><text x="330.5" y="129.6" font-size="15" font-weight="normal" fill="#1f2937" text-anchor="middle">singled out</text><rect x="446.0" y="58.0" width="207.0" height="96.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="549.5" y="92.1" font-size="15" font-weight="bold" fill="#1f2937" text-anchor="middle">Federated learning</text><text x="549.5" y="110.9" font-size="15" font-weight="normal" fill="#1f2937" text-anchor="middle">train where data live; share</text><text x="549.5" y="129.6" font-size="15" font-weight="normal" fill="#1f2937" text-anchor="middle">updates, not data</text><rect x="665.0" y="58.0" width="207.0" height="96.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="768.5" y="92.1" font-size="15" font-weight="bold" fill="#1f2937" text-anchor="middle">Synthetic data</text><text x="768.5" y="110.9" font-size="15" font-weight="normal" fill="#1f2937" text-anchor="middle">artificial data that mimic real</text><text x="768.5" y="129.6" font-size="15" font-weight="normal" fill="#1f2937" text-anchor="middle">patterns</text><rect x="8.0" y="176.0" width="864.0" height="42.0" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="440.0" y="202.5" font-size="17" font-weight="bold" fill="#14532d" text-anchor="middle">By default: collect and share the minimum (Article 25(2))</text><rect x="8.0" y="226.0" width="280.0" height="84.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="148.0" y="263.5" font-size="15" font-weight="bold" fill="#1f2937" text-anchor="middle">Amount</text><text x="148.0" y="282.2" font-size="15" font-weight="normal" fill="#1f2937" text-anchor="middle">only the data needed for each purpose</text><rect x="300.0" y="226.0" width="280.0" height="84.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="440.0" y="263.5" font-size="15" font-weight="bold" fill="#1f2937" text-anchor="middle">Extent and storage</text><text x="440.0" y="282.2" font-size="15" font-weight="normal" fill="#1f2937" text-anchor="middle">limited processing, short retention</text><rect x="592.0" y="226.0" width="280.0" height="84.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="732.0" y="254.1" font-size="15" font-weight="bold" fill="#1f2937" text-anchor="middle">Accessibility</text><text x="732.0" y="272.9" font-size="15" font-weight="normal" fill="#1f2937" text-anchor="middle">narrow access; nothing public by</text><text x="732.0" y="291.6" font-size="15" font-weight="normal" fill="#1f2937" text-anchor="middle">default</text></svg>