<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 184" width="880" height="184" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">m15-five-steps</title><desc id="d">Five reading steps: find the ask, read the facts, mark role, instrument and stage, predict an answer, match and eliminate.</desc><defs></defs><rect x="0.75" y="0.75" width="878.5" height="182.5" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><polygon points="8.0,8.0 156.0,8.0 176.0,41.0 156.0,74.0 8.0,74.0" fill="#fee2e2" stroke="#dc2626" stroke-width="1.8"/><text x="85.0" y="46.1" font-size="16" font-weight="bold" fill="#7f1d1d" text-anchor="middle">1 Find the ask</text><rect x="10.0" y="78.0" width="154.0" height="100.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="18.0" y="123.5" font-size="15" font-weight="normal" fill="#1f2937" text-anchor="start">last sentence: best,</text><text x="18.0" y="142.2" font-size="15" font-weight="normal" fill="#1f2937" text-anchor="start">first, most likely</text><polygon points="182.0,8.0 330.0,8.0 350.0,41.0 330.0,74.0 182.0,74.0 202.0,41.0" fill="#dbeafe" stroke="#2563eb" stroke-width="1.8"/><text x="266.0" y="36.5" font-size="16" font-weight="bold" fill="#1e3a8a" text-anchor="middle">2 Read the</text><text x="266.0" y="55.7" font-size="16" font-weight="bold" fill="#1e3a8a" text-anchor="middle">facts</text><rect x="184.0" y="78.0" width="154.0" height="100.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="192.0" y="123.5" font-size="15" font-weight="normal" fill="#1f2937" text-anchor="start">who, what system,</text><text x="192.0" y="142.2" font-size="15" font-weight="normal" fill="#1f2937" text-anchor="start">where, when</text><polygon points="356.0,8.0 504.0,8.0 524.0,41.0 504.0,74.0 356.0,74.0 376.0,41.0" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.8"/><text x="440.0" y="46.1" font-size="16" font-weight="bold" fill="#134e4a" text-anchor="middle">3 Mark R-I-S</text><rect x="358.0" y="78.0" width="154.0" height="100.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="366.0" y="123.5" font-size="15" font-weight="normal" fill="#1f2937" text-anchor="start">role, instrument,</text><text x="366.0" y="142.2" font-size="15" font-weight="normal" fill="#1f2937" text-anchor="start">stage</text><polygon points="530.0,8.0 678.0,8.0 698.0,41.0 678.0,74.0 530.0,74.0 550.0,41.0" fill="#fef3c7" stroke="#d97706" stroke-width="1.8"/><text x="614.0" y="46.1" font-size="16" font-weight="bold" fill="#78350f" text-anchor="middle">4 Predict</text><rect x="532.0" y="78.0" width="154.0" height="100.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="540.0" y="123.5" font-size="15" font-weight="normal" fill="#1f2937" text-anchor="start">an answer before</text><text x="540.0" y="142.2" font-size="15" font-weight="normal" fill="#1f2937" text-anchor="start">the options</text><polygon points="704.0,8.0 852.0,8.0 872.0,41.0 852.0,74.0 704.0,74.0 724.0,41.0" fill="#dcfce7" stroke="#16a34a" stroke-width="1.8"/><text x="788.0" y="36.5" font-size="16" font-weight="bold" fill="#14532d" text-anchor="middle">5 Match,</text><text x="788.0" y="55.7" font-size="16" font-weight="bold" fill="#14532d" text-anchor="middle">eliminate</text><rect x="706.0" y="78.0" width="154.0" height="100.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="714.0" y="114.1" font-size="15" font-weight="normal" fill="#1f2937" text-anchor="start">compare each</text><text x="714.0" y="132.9" font-size="15" font-weight="normal" fill="#1f2937" text-anchor="start">option with your</text><text x="714.0" y="151.6" font-size="15" font-weight="normal" fill="#1f2937" text-anchor="start">prediction</text></svg>