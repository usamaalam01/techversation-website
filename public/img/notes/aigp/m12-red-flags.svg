<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 420" width="880" height="420" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">m12-red-flags</title><desc id="d">Six red flags in AI vendor agreements and what to ask for instead.</desc><defs></defs><rect x="0.75" y="0.75" width="878.5" height="418.5" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><rect x="8.0" y="8.0" width="350.0" height="42.0" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.6"/><text x="183.0" y="34.5" font-size="17" font-weight="bold" fill="#7f1d1d" text-anchor="middle">Red flag</text><rect x="366.0" y="8.0" width="506.0" height="42.0" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="619.0" y="34.5" font-size="17" font-weight="bold" fill="#14532d" text-anchor="middle">Ask for</text><rect x="8.0" y="58.0" width="350.0" height="52.0" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.6"/><text x="183.0" y="89.2" font-size="16" font-weight="bold" fill="#7f1d1d" text-anchor="middle">Broad right to train on your data</text><rect x="366.0" y="58.0" width="506.0" height="52.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="376.0" y="89.2" font-size="16" font-weight="normal" fill="#1f2937" text-anchor="start">no training without agreement</text><rect x="8.0" y="118.0" width="350.0" height="52.0" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.6"/><text x="183.0" y="149.2" font-size="16" font-weight="bold" fill="#7f1d1d" text-anchor="middle">No IP indemnity</text><rect x="366.0" y="118.0" width="506.0" height="52.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="376.0" y="149.2" font-size="16" font-weight="normal" fill="#1f2937" text-anchor="start">defense and payment for infringement claims</text><rect x="8.0" y="178.0" width="350.0" height="52.0" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.6"/><text x="183.0" y="209.2" font-size="16" font-weight="bold" fill="#7f1d1d" text-anchor="middle">Liability capped at fees, no carve-outs</text><rect x="366.0" y="178.0" width="506.0" height="52.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="376.0" y="209.2" font-size="16" font-weight="normal" fill="#1f2937" text-anchor="start">a higher cap for data, IP and confidentiality</text><rect x="8.0" y="238.0" width="350.0" height="52.0" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.6"/><text x="183.0" y="269.2" font-size="16" font-weight="bold" fill="#7f1d1d" text-anchor="middle">Model changes without notice</text><rect x="366.0" y="238.0" width="506.0" height="52.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="376.0" y="269.2" font-size="16" font-weight="normal" fill="#1f2937" text-anchor="start">notice, release notes, version pinning</text><rect x="8.0" y="298.0" width="350.0" height="52.0" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.6"/><text x="183.0" y="329.2" font-size="16" font-weight="bold" fill="#7f1d1d" text-anchor="middle">No documentation or audit rights</text><rect x="366.0" y="298.0" width="506.0" height="52.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="376.0" y="329.2" font-size="16" font-weight="normal" fill="#1f2937" text-anchor="start">documentation, testing and audit rights</text><rect x="8.0" y="358.0" width="350.0" height="52.0" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.6"/><text x="183.0" y="389.2" font-size="16" font-weight="bold" fill="#7f1d1d" text-anchor="middle">No incident notice</text><rect x="366.0" y="358.0" width="506.0" height="52.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="376.0" y="389.2" font-size="16" font-weight="normal" fill="#1f2937" text-anchor="start">a fixed short notice period</text></svg>