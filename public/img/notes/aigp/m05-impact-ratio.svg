<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 288" width="880" height="288" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">m05-impact-ratio</title><desc id="d">Selection rates of 50% and 30% give an impact ratio of 0.6, below the four-fifths line of 40%.</desc><defs></defs><rect x="0.75" y="0.75" width="878.5" height="286.5" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><text x="188.0" y="63.3" font-size="18" font-weight="normal" fill="#1f2937" text-anchor="end">Group A selected</text><rect x="198.0" y="30.0" width="503.3" height="54.0" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="709.3" y="63.3" font-size="18" font-weight="bold" fill="#1f2937" text-anchor="start">50%</text><text x="188.0" y="139.3" font-size="18" font-weight="normal" fill="#1f2937" text-anchor="end">Group B selected</text><rect x="198.0" y="106.0" width="302.0" height="54.0" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="508.0" y="139.3" font-size="18" font-weight="bold" fill="#1f2937" text-anchor="start">30%</text><line x1="600.7" y1="14.0" x2="600.7" y2="168.0" stroke="#b91c1c" stroke-width="3" stroke-dasharray="8 5"/><text x="608.7" y="192.0" font-size="16" font-weight="bold" fill="#7f1d1d" text-anchor="start">four-fifths of the higher rate: 40%</text><rect x="8.0" y="214.0" width="864.0" height="62.0" rx="8" fill="#1e3a8a" stroke="#1e3a8a" stroke-width="1.6"/><text x="440.0" y="251.2" font-size="19" font-weight="bold" fill="#ffffff" text-anchor="middle">Impact ratio = 30 ÷ 50 = 0.6, below 0.8: evidence of adverse impact</text></svg>