<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 396" width="880" height="396" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">m14-clocks</title><desc id="d">Reporting clocks: serious incidents under the AI Act and personal data breaches under the GDPR.</desc><defs></defs><rect x="0.75" y="0.75" width="878.5" height="394.5" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><rect x="226.0" y="8.0" width="210.0" height="42.0" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="331.0" y="34.5" font-size="17" font-weight="bold" fill="#1e3a8a" text-anchor="middle">Who reports</text><rect x="444.0" y="8.0" width="210.0" height="42.0" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.6"/><text x="549.0" y="34.5" font-size="17" font-weight="bold" fill="#7f1d1d" text-anchor="middle">Clock</text><rect x="662.0" y="8.0" width="210.0" height="42.0" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.6"/><text x="767.0" y="34.5" font-size="17" font-weight="bold" fill="#374151" text-anchor="middle">Basis</text><rect x="8.0" y="58.0" width="210.0" height="76.0" rx="8" fill="#1e3a8a" stroke="#1e3a8a" stroke-width="1.6"/><text x="113.0" y="101.2" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">Serious incident</text><rect x="226.0" y="58.0" width="210.0" height="76.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="236.0" y="91.5" font-size="15" font-weight="normal" fill="#1f2937" text-anchor="start">provider to the market</text><text x="236.0" y="110.2" font-size="15" font-weight="normal" fill="#1f2937" text-anchor="start">surveillance authority</text><rect x="444.0" y="58.0" width="210.0" height="76.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="454.0" y="91.5" font-size="15" font-weight="normal" fill="#1f2937" text-anchor="start">not later than 15 days after</text><text x="454.0" y="110.2" font-size="15" font-weight="normal" fill="#1f2937" text-anchor="start">awareness</text><rect x="662.0" y="58.0" width="210.0" height="76.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="672.0" y="100.9" font-size="15" font-weight="normal" fill="#1f2937" text-anchor="start">Article 73</text><rect x="8.0" y="142.0" width="210.0" height="76.0" rx="8" fill="#1e3a8a" stroke="#1e3a8a" stroke-width="1.6"/><text x="113.0" y="185.2" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">Widespread infringement</text><rect x="226.0" y="142.0" width="210.0" height="76.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="236.0" y="184.9" font-size="15" font-weight="normal" fill="#1f2937" text-anchor="start">the provider</text><rect x="444.0" y="142.0" width="210.0" height="76.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="454.0" y="184.9" font-size="15" font-weight="normal" fill="#1f2937" text-anchor="start">not later than 2 days</text><rect x="662.0" y="142.0" width="210.0" height="76.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="672.0" y="184.9" font-size="15" font-weight="normal" fill="#1f2937" text-anchor="start">Article 73</text><rect x="8.0" y="226.0" width="210.0" height="76.0" rx="8" fill="#1e3a8a" stroke="#1e3a8a" stroke-width="1.6"/><text x="113.0" y="269.2" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">Incident with a death</text><rect x="226.0" y="226.0" width="210.0" height="76.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="236.0" y="268.9" font-size="15" font-weight="normal" fill="#1f2937" text-anchor="start">the provider</text><rect x="444.0" y="226.0" width="210.0" height="76.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="454.0" y="259.5" font-size="15" font-weight="normal" fill="#1f2937" text-anchor="start">not later than 10 days after</text><text x="454.0" y="278.2" font-size="15" font-weight="normal" fill="#1f2937" text-anchor="start">the death</text><rect x="662.0" y="226.0" width="210.0" height="76.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="672.0" y="268.9" font-size="15" font-weight="normal" fill="#1f2937" text-anchor="start">Article 73</text><rect x="8.0" y="310.0" width="210.0" height="76.0" rx="8" fill="#1e3a8a" stroke="#1e3a8a" stroke-width="1.6"/><text x="113.0" y="353.2" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">Personal data breach</text><rect x="226.0" y="310.0" width="210.0" height="76.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="236.0" y="343.5" font-size="15" font-weight="normal" fill="#1f2937" text-anchor="start">controller to the supervisory</text><text x="236.0" y="362.2" font-size="15" font-weight="normal" fill="#1f2937" text-anchor="start">authority</text><rect x="444.0" y="310.0" width="210.0" height="76.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="454.0" y="343.5" font-size="15" font-weight="normal" fill="#1f2937" text-anchor="start">without undue delay; within</text><text x="454.0" y="362.2" font-size="15" font-weight="normal" fill="#1f2937" text-anchor="start">72 hours where feasible</text><rect x="662.0" y="310.0" width="210.0" height="76.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="672.0" y="352.9" font-size="15" font-weight="normal" fill="#1f2937" text-anchor="start">GDPR Article 33</text></svg>