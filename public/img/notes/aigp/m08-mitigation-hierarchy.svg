<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 364" width="880" height="364" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">m08-mitigation-hierarchy</title><desc id="d">Four levels from most to least preferred: eliminate by design, mitigate and control, inform and train, accept residual risk.</desc><defs><marker id="ah0" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1e3a8a"/></marker></defs><rect x="0.75" y="0.75" width="878.5" height="362.5" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><rect x="8.0" y="8.0" width="230.0" height="76.0" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="123.0" y="51.8" font-size="18" font-weight="bold" fill="#14532d" text-anchor="middle">1 Eliminate</text><rect x="248.0" y="8.0" width="520.0" height="76.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="264.0" y="51.2" font-size="16" font-weight="normal" fill="#1f2937" text-anchor="start">remove the feature, the data or the use through design</text><rect x="8.0" y="98.0" width="230.0" height="76.0" rx="8" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.6"/><text x="123.0" y="141.8" font-size="18" font-weight="bold" fill="#134e4a" text-anchor="middle">2 Mitigate and control</text><rect x="248.0" y="98.0" width="520.0" height="76.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="264.0" y="141.2" font-size="16" font-weight="normal" fill="#1f2937" text-anchor="start">technical safeguards, thresholds, human oversight</text><rect x="8.0" y="188.0" width="230.0" height="76.0" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="123.0" y="231.8" font-size="18" font-weight="bold" fill="#78350f" text-anchor="middle">3 Inform and train</text><rect x="248.0" y="188.0" width="520.0" height="76.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="264.0" y="231.2" font-size="16" font-weight="normal" fill="#1f2937" text-anchor="start">instructions, warnings, deployer training</text><rect x="8.0" y="278.0" width="230.0" height="76.0" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.6"/><text x="123.0" y="321.9" font-size="18" font-weight="bold" fill="#7f1d1d" text-anchor="middle">4 Accept residual risk</text><rect x="248.0" y="278.0" width="520.0" height="76.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="264.0" y="321.2" font-size="16" font-weight="normal" fill="#1f2937" text-anchor="start">documented, approved by the owner</text><line x1="840.0" y1="372.0" x2="840.0" y2="22.0" stroke="#1e3a8a" stroke-width="4" marker-end="url(#ah0)"/><text x="822.0" y="200.0" transform="rotate(-90 822.0 200.0)" font-size="15" font-weight="bold" fill="#1e3a8a" text-anchor="middle">more preferred</text></svg>