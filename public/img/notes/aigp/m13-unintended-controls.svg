<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 368" width="880" height="368" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">m13-unintended-controls</title><desc id="d">Five layers of control against unintended use: scope, access, technical limits, monitoring and people.</desc><defs></defs><rect x="0.75" y="0.75" width="878.5" height="366.5" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><rect x="8.0" y="8.0" width="230.0" height="62.0" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="123.0" y="44.8" font-size="18" font-weight="bold" fill="#1e3a8a" text-anchor="middle">Scope</text><rect x="248.0" y="8.0" width="624.0" height="62.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="264.0" y="44.2" font-size="16" font-weight="normal" fill="#1f2937" text-anchor="start">intended and out-of-scope uses stated</text><rect x="8.0" y="80.0" width="230.0" height="62.0" rx="8" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.6"/><text x="123.0" y="116.8" font-size="18" font-weight="bold" fill="#134e4a" text-anchor="middle">Access</text><rect x="248.0" y="80.0" width="624.0" height="62.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="264.0" y="116.2" font-size="16" font-weight="normal" fill="#1f2937" text-anchor="start">least privilege: only the people and features that need it</text><rect x="8.0" y="152.0" width="230.0" height="62.0" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="123.0" y="188.8" font-size="18" font-weight="bold" fill="#14532d" text-anchor="middle">Technical limits</text><rect x="248.0" y="152.0" width="624.0" height="62.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="264.0" y="188.2" font-size="16" font-weight="normal" fill="#1f2937" text-anchor="start">system prompt limits, filters, blocked actions, rate limits</text><rect x="8.0" y="224.0" width="230.0" height="62.0" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="123.0" y="260.9" font-size="18" font-weight="bold" fill="#78350f" text-anchor="middle">Monitoring</text><rect x="248.0" y="224.0" width="624.0" height="62.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="264.0" y="260.2" font-size="16" font-weight="normal" fill="#1f2937" text-anchor="start">alerts for out-of-scope queries, log review</text><rect x="8.0" y="296.0" width="230.0" height="62.0" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.6"/><text x="123.0" y="332.9" font-size="18" font-weight="bold" fill="#4c1d95" text-anchor="middle">People</text><rect x="248.0" y="296.0" width="624.0" height="62.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="264.0" y="332.2" font-size="16" font-weight="normal" fill="#1f2937" text-anchor="start">training, user agreements, consequences</text></svg>