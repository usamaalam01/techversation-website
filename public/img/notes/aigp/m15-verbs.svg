<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 398" width="880" height="398" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">m15-verbs</title><desc id="d">Four verb families, what the question asks for, and how to choose between two true options.</desc><defs></defs><rect x="0.75" y="0.75" width="878.5" height="396.5" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><rect x="226.0" y="8.0" width="319.0" height="44.0" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="385.5" y="35.5" font-size="17" font-weight="bold" fill="#1e3a8a" text-anchor="middle">The question asks for</text><rect x="553.0" y="8.0" width="319.0" height="44.0" rx="8" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.6"/><text x="712.5" y="35.5" font-size="17" font-weight="bold" fill="#134e4a" text-anchor="middle">Between two true options</text><rect x="8.0" y="60.0" width="210.0" height="76.0" rx="8" fill="#1e3a8a" stroke="#1e3a8a" stroke-width="1.6"/><text x="113.0" y="103.5" font-size="17" font-weight="bold" fill="#ffffff" text-anchor="middle">Understand, identify</text><rect x="226.0" y="60.0" width="319.0" height="76.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="236.0" y="103.2" font-size="16" font-weight="normal" fill="#1f2937" text-anchor="start">the correct statement or the term that fits</text><rect x="553.0" y="60.0" width="319.0" height="76.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="563.0" y="103.2" font-size="16" font-weight="normal" fill="#1f2937" text-anchor="start">pick the one about the thing asked</text><rect x="8.0" y="144.0" width="210.0" height="76.0" rx="8" fill="#1e3a8a" stroke="#1e3a8a" stroke-width="1.6"/><text x="113.0" y="187.5" font-size="17" font-weight="bold" fill="#ffffff" text-anchor="middle">Apply, conduct, perform</text><rect x="226.0" y="144.0" width="319.0" height="76.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="236.0" y="187.2" font-size="16" font-weight="normal" fill="#1f2937" text-anchor="start">the best action in the situation</text><rect x="553.0" y="144.0" width="319.0" height="76.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="563.0" y="187.2" font-size="16" font-weight="normal" fill="#1f2937" text-anchor="start">pick the one that acts</text><rect x="8.0" y="228.0" width="210.0" height="76.0" rx="8" fill="#1e3a8a" stroke="#1e3a8a" stroke-width="1.6"/><text x="113.0" y="271.5" font-size="17" font-weight="bold" fill="#ffffff" text-anchor="middle">Evaluate, assess</text><rect x="226.0" y="228.0" width="319.0" height="76.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="236.0" y="271.2" font-size="16" font-weight="normal" fill="#1f2937" text-anchor="start">the best-justified judgment</text><rect x="553.0" y="228.0" width="319.0" height="76.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="563.0" y="271.2" font-size="16" font-weight="normal" fill="#1f2937" text-anchor="start">pick the one with the stronger reason</text><rect x="8.0" y="312.0" width="210.0" height="76.0" rx="8" fill="#1e3a8a" stroke="#1e3a8a" stroke-width="1.6"/><text x="113.0" y="355.5" font-size="17" font-weight="bold" fill="#ffffff" text-anchor="middle">Create, establish</text><rect x="226.0" y="312.0" width="319.0" height="76.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="236.0" y="355.2" font-size="16" font-weight="normal" fill="#1f2937" text-anchor="start">the policy or control that must exist</text><rect x="553.0" y="312.0" width="319.0" height="76.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="563.0" y="355.2" font-size="16" font-weight="normal" fill="#1f2937" text-anchor="start">pick the one that puts it in place</text></svg>