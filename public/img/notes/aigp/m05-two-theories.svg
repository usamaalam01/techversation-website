<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 386" width="880" height="386" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">m05-two-theories</title><desc id="d">Disparate treatment and disparate impact compared by definition, AI example, proof and defense.</desc><defs></defs><rect x="0.75" y="0.75" width="878.5" height="384.5" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><rect x="138.0" y="8.0" width="362.0" height="48.0" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="319.0" y="37.8" font-size="18" font-weight="bold" fill="#78350f" text-anchor="middle">Disparate treatment</text><rect x="510.0" y="8.0" width="362.0" height="48.0" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="691.0" y="37.8" font-size="18" font-weight="bold" fill="#1e3a8a" text-anchor="middle">Disparate impact</text><text x="122.0" y="106.0" font-size="15" font-weight="bold" fill="#6b7280" text-anchor="end">What it is</text><rect x="138.0" y="66.0" width="362.0" height="70.0" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="150.0" y="106.2" font-size="16" font-weight="normal" fill="#78350f" text-anchor="start">different treatment because of a protected trait</text><rect x="510.0" y="66.0" width="362.0" height="70.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="522.0" y="96.2" font-size="16" font-weight="normal" fill="#1f2937" text-anchor="start">a neutral practice that falls harder on a</text><text x="522.0" y="116.2" font-size="16" font-weight="normal" fill="#1f2937" text-anchor="start">protected group</text><text x="122.0" y="186.0" font-size="15" font-weight="bold" fill="#6b7280" text-anchor="end">AI example</text><rect x="138.0" y="146.0" width="362.0" height="70.0" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="150.0" y="186.2" font-size="16" font-weight="normal" fill="#78350f" text-anchor="start">a rule that scores women lower</text><rect x="510.0" y="146.0" width="362.0" height="70.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="522.0" y="176.2" font-size="16" font-weight="normal" fill="#1f2937" text-anchor="start">a proxy such as a postal code or a work-history</text><text x="522.0" y="196.2" font-size="16" font-weight="normal" fill="#1f2937" text-anchor="start">gap</text><text x="122.0" y="266.0" font-size="15" font-weight="bold" fill="#6b7280" text-anchor="end">Proof</text><rect x="138.0" y="226.0" width="362.0" height="70.0" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="150.0" y="266.2" font-size="16" font-weight="normal" fill="#78350f" text-anchor="start">intent, or the trait used in the decision</text><rect x="510.0" y="226.0" width="362.0" height="70.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="522.0" y="266.2" font-size="16" font-weight="normal" fill="#1f2937" text-anchor="start">statistics comparing outcomes across groups</text><text x="122.0" y="346.0" font-size="15" font-weight="bold" fill="#6b7280" text-anchor="end">Defense</text><rect x="138.0" y="306.0" width="362.0" height="70.0" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="150.0" y="346.2" font-size="16" font-weight="normal" fill="#78350f" text-anchor="start">very limited</text><rect x="510.0" y="306.0" width="362.0" height="70.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="522.0" y="336.2" font-size="16" font-weight="normal" fill="#1f2937" text-anchor="start">job related and consistent with business</text><text x="522.0" y="356.2" font-size="16" font-weight="normal" fill="#1f2937" text-anchor="start">necessity</text></svg>