<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 312" width="880" height="312" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">m06-penalties</title><desc id="d">Fine ceilings of EUR 35 million or 7%, EUR 15 million or 3%, and EUR 7.5 million or 1%, whichever is higher.</desc><defs></defs><rect x="0.75" y="0.75" width="878.5" height="310.5" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><text x="308.0" y="48.0" font-size="17" font-weight="normal" fill="#1f2937" text-anchor="end">Prohibited practices (7%)</text><rect x="318.0" y="14.0" width="423.5" height="56.0" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="1.6"/><text x="749.5" y="48.0" font-size="17" font-weight="bold" fill="#1f2937" text-anchor="start">EUR 35 million</text><text x="308.0" y="122.0" font-size="17" font-weight="normal" fill="#1f2937" text-anchor="end">Other obligations (3%)</text><rect x="318.0" y="88.0" width="181.5" height="56.0" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="507.5" y="122.0" font-size="17" font-weight="bold" fill="#1f2937" text-anchor="start">EUR 15 million</text><text x="308.0" y="195.9" font-size="17" font-weight="normal" fill="#1f2937" text-anchor="end">Incorrect information (1%)</text><rect x="318.0" y="162.0" width="90.8" height="56.0" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="416.8" y="195.9" font-size="17" font-weight="bold" fill="#1f2937" text-anchor="start">EUR 7.5 million</text><rect x="8.0" y="232.0" width="864.0" height="70.0" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.6"/><text x="440.0" y="262.2" font-size="16" font-weight="bold" fill="#374151" text-anchor="middle">For SMEs and start-ups, the lower of the amount and the percentage applies</text><text x="440.0" y="282.2" font-size="16" font-weight="normal" fill="#374151" text-anchor="middle">General-purpose model providers: up to 3% or EUR 15 million, fined by the Commission</text></svg>