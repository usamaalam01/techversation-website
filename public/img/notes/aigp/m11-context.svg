<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 400" width="880" height="400" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">m11-context</title><desc id="d">Five context factors around a use case: goals and value, performance needs, data, ethics and risk, and people and skills.</desc><defs></defs><rect x="0.75" y="0.75" width="878.5" height="398.5" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><line x1="440.0" y1="167.0" x2="440.0" y2="93.0" stroke="#6b7280" stroke-width="2.2"/><rect x="315.0" y="20.0" width="250.0" height="70.0" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="440.0" y="50.2" font-size="16" font-weight="bold" fill="#1e3a8a" text-anchor="middle">Goals and value</text><text x="440.0" y="70.2" font-size="16" font-weight="normal" fill="#1e3a8a" text-anchor="middle">problem, benefit, measure</text><line x1="543.0" y1="188.8" x2="606.8" y2="178.8" stroke="#6b7280" stroke-width="2.2"/><rect x="609.8" y="123.6" width="250.0" height="70.0" rx="8" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.6"/><text x="734.8" y="153.8" font-size="16" font-weight="bold" fill="#134e4a" text-anchor="middle">Performance needs</text><text x="734.8" y="173.8" font-size="16" font-weight="normal" fill="#134e4a" text-anchor="middle">accuracy, speed, explainability</text><line x1="497.1" y1="243.0" x2="565.2" y2="288.4" stroke="#6b7280" stroke-width="2.2"/><rect x="497.2" y="291.4" width="250.0" height="70.0" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="622.2" y="321.6" font-size="16" font-weight="bold" fill="#14532d" text-anchor="middle">Data</text><text x="622.2" y="341.6" font-size="16" font-weight="normal" fill="#14532d" text-anchor="middle">exists, good enough, allowed</text><line x1="382.9" y1="243.0" x2="314.8" y2="288.4" stroke="#6b7280" stroke-width="2.2"/><rect x="132.8" y="291.4" width="250.0" height="70.0" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="257.8" y="321.6" font-size="16" font-weight="bold" fill="#78350f" text-anchor="middle">Ethics and risk</text><text x="257.8" y="341.6" font-size="16" font-weight="normal" fill="#78350f" text-anchor="middle">who is affected, oversight</text><line x1="337.0" y1="188.8" x2="273.2" y2="178.8" stroke="#6b7280" stroke-width="2.2"/><rect x="20.2" y="123.6" width="250.0" height="70.0" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.6"/><text x="145.2" y="153.8" font-size="16" font-weight="bold" fill="#4c1d95" text-anchor="middle">People and skills</text><text x="145.2" y="173.8" font-size="16" font-weight="normal" fill="#4c1d95" text-anchor="middle">who operates and checks</text><rect x="340.0" y="170.0" width="200.0" height="70.0" rx="8" fill="#1e3a8a" stroke="#1e3a8a" stroke-width="1.6"/><text x="440.0" y="211.2" font-size="19" font-weight="bold" fill="#ffffff" text-anchor="middle">Use-case context</text></svg>