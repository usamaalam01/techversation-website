<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 424" width="880" height="424" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">m04-tension</title><desc id="d">What model teams want compared with what privacy law asks, and how governance resolves it.</desc><defs></defs><rect x="0.75" y="0.75" width="878.5" height="422.5" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><rect x="138.0" y="8.0" width="362.0" height="48.0" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="319.0" y="37.8" font-size="18" font-weight="bold" fill="#78350f" text-anchor="middle">What model teams want</text><rect x="510.0" y="8.0" width="362.0" height="48.0" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="691.0" y="37.8" font-size="18" font-weight="bold" fill="#1e3a8a" text-anchor="middle">What privacy law asks</text><text x="122.0" y="102.0" font-size="15" font-weight="bold" fill="#6b7280" text-anchor="end">Volume</text><rect x="138.0" y="66.0" width="362.0" height="62.0" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="150.0" y="102.2" font-size="16" font-weight="normal" fill="#78350f" text-anchor="start">as much as improves accuracy</text><rect x="510.0" y="66.0" width="362.0" height="62.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="522.0" y="102.2" font-size="16" font-weight="normal" fill="#1f2937" text-anchor="start">only what is necessary</text><text x="122.0" y="174.0" font-size="15" font-weight="bold" fill="#6b7280" text-anchor="end">Retention</text><rect x="138.0" y="138.0" width="362.0" height="62.0" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="150.0" y="174.2" font-size="16" font-weight="normal" fill="#78350f" text-anchor="start">keep it for retraining</text><rect x="510.0" y="138.0" width="362.0" height="62.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="522.0" y="174.2" font-size="16" font-weight="normal" fill="#1f2937" text-anchor="start">no longer than necessary</text><text x="122.0" y="246.0" font-size="15" font-weight="bold" fill="#6b7280" text-anchor="end">Sources</text><rect x="138.0" y="210.0" width="362.0" height="62.0" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="150.0" y="246.2" font-size="16" font-weight="normal" fill="#78350f" text-anchor="start">any data available</text><rect x="510.0" y="210.0" width="362.0" height="62.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="522.0" y="246.2" font-size="16" font-weight="normal" fill="#1f2937" text-anchor="start">a known source and a lawful basis</text><text x="122.0" y="318.0" font-size="15" font-weight="bold" fill="#6b7280" text-anchor="end">Sensitivity</text><rect x="138.0" y="282.0" width="362.0" height="62.0" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="150.0" y="318.2" font-size="16" font-weight="normal" fill="#78350f" text-anchor="start">every signal, even sensitive ones</text><rect x="510.0" y="282.0" width="362.0" height="62.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="522.0" y="308.2" font-size="16" font-weight="normal" fill="#1f2937" text-anchor="start">special categories prohibited unless an</text><text x="522.0" y="328.2" font-size="16" font-weight="normal" fill="#1f2937" text-anchor="start">exception applies</text><rect x="8.0" y="360.0" width="864.0" height="54.0" rx="8" fill="#1e3a8a" stroke="#1e3a8a" stroke-width="1.6"/><text x="440.0" y="392.9" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="middle">Resolve it: a defined purpose, curated data and privacy-enhancing techniques</text></svg>