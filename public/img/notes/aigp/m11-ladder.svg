<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 296" width="880" height="296" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">m11-ladder</title><desc id="d">A ladder from using a model as is, through retrieval and fine-tuning, to agentic systems, with more fit, effort and risk at each step.</desc><defs><marker id="ah0" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1e3a8a"/></marker></defs><rect x="0.75" y="0.75" width="878.5" height="294.5" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><rect x="8.0" y="8.0" width="250.0" height="62.0" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.6"/><text x="133.0" y="44.8" font-size="18" font-weight="bold" fill="#7f1d1d" text-anchor="middle">Agentic</text><rect x="268.0" y="8.0" width="540.0" height="62.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="284.0" y="44.5" font-size="17" font-weight="normal" fill="#1f2937" text-anchor="start">plans steps and acts with tools</text><rect x="8.0" y="80.0" width="250.0" height="62.0" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="133.0" y="116.8" font-size="18" font-weight="bold" fill="#78350f" text-anchor="middle">Fine-tuned</text><rect x="268.0" y="80.0" width="540.0" height="62.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="284.0" y="116.5" font-size="17" font-weight="normal" fill="#1f2937" text-anchor="start">trained further on your data</text><rect x="8.0" y="152.0" width="250.0" height="62.0" rx="8" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.6"/><text x="133.0" y="188.8" font-size="18" font-weight="bold" fill="#134e4a" text-anchor="middle">Retrieval-augmented</text><rect x="268.0" y="152.0" width="540.0" height="62.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="284.0" y="188.5" font-size="17" font-weight="normal" fill="#1f2937" text-anchor="start">your documents at answer time</text><rect x="8.0" y="224.0" width="250.0" height="62.0" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="133.0" y="260.9" font-size="18" font-weight="bold" fill="#1e3a8a" text-anchor="middle">As is</text><rect x="268.0" y="224.0" width="540.0" height="62.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="284.0" y="260.5" font-size="17" font-weight="normal" fill="#1f2937" text-anchor="start">careful prompts and guardrails</text><line x1="840.0" y1="298.0" x2="840.0" y2="22.0" stroke="#1e3a8a" stroke-width="4" marker-end="url(#ah0)"/><text x="862.0" y="160.0" transform="rotate(-90 862.0 160.0)" font-size="15" font-weight="bold" fill="#1e3a8a" text-anchor="middle">more fit, effort, risk</text></svg>