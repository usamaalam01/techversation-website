<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 280" width="880" height="280" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">m10-monitoring-families</title><desc id="d">Six families to monitor: performance, data and drift, fairness, safety and security, usage and feedback, operations.</desc><defs></defs><rect x="0.75" y="0.75" width="878.5" height="278.5" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><rect x="8.0" y="8.0" width="280.0" height="126.0" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="148.0" y="65.6" font-size="18" font-weight="bold" fill="#1e3a8a" text-anchor="middle">Performance</text><text x="148.0" y="88.1" font-size="18" font-weight="normal" fill="#1e3a8a" text-anchor="middle">accuracy, error rates</text><rect x="300.0" y="8.0" width="280.0" height="126.0" rx="8" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.6"/><text x="440.0" y="65.6" font-size="18" font-weight="bold" fill="#134e4a" text-anchor="middle">Data and drift</text><text x="440.0" y="88.1" font-size="18" font-weight="normal" fill="#134e4a" text-anchor="middle">inputs and outputs over time</text><rect x="592.0" y="8.0" width="280.0" height="126.0" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="732.0" y="65.6" font-size="18" font-weight="bold" fill="#14532d" text-anchor="middle">Fairness</text><text x="732.0" y="88.1" font-size="18" font-weight="normal" fill="#14532d" text-anchor="middle">outcomes by group</text><rect x="8.0" y="146.0" width="280.0" height="126.0" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.6"/><text x="148.0" y="203.6" font-size="18" font-weight="bold" fill="#7f1d1d" text-anchor="middle">Safety, security</text><text x="148.0" y="226.1" font-size="18" font-weight="normal" fill="#7f1d1d" text-anchor="middle">abuse, attacks, harmful output</text><rect x="300.0" y="146.0" width="280.0" height="126.0" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="440.0" y="203.6" font-size="18" font-weight="bold" fill="#78350f" text-anchor="middle">Usage, feedback</text><text x="440.0" y="226.1" font-size="18" font-weight="normal" fill="#78350f" text-anchor="middle">volume, complaints, overrides</text><rect x="592.0" y="146.0" width="280.0" height="126.0" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.6"/><text x="732.0" y="203.6" font-size="18" font-weight="bold" fill="#4c1d95" text-anchor="middle">Operations</text><text x="732.0" y="226.1" font-size="18" font-weight="normal" fill="#4c1d95" text-anchor="middle">latency, availability, cost</text></svg>