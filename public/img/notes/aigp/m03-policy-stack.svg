<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 396" width="880" height="396" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">m03-policy-stack</title><desc id="d">Four layers of governance documents: policy, standards, procedures and records, each with a Helios example.</desc><defs></defs><rect x="0.75" y="0.75" width="878.5" height="394.5" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><text x="180.0" y="28.0" font-size="15" font-weight="bold" fill="#6b7280" text-anchor="start">What it is</text><text x="560.0" y="28.0" font-size="15" font-weight="bold" fill="#6b7280" text-anchor="start">At Helios</text><rect x="8.0" y="40.0" width="160.0" height="76.0" rx="8" fill="#1e3a8a" stroke="#1e3a8a" stroke-width="1.6"/><text x="88.0" y="84.2" font-size="19" font-weight="bold" fill="#ffffff" text-anchor="middle">Policy</text><rect x="178.0" y="40.0" width="370.0" height="76.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="192.0" y="83.2" font-size="16" font-weight="normal" fill="#1f2937" text-anchor="start">the rule and its reason, approved by leadership</text><rect x="558.0" y="40.0" width="314.0" height="76.0" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.6"/><text x="572.0" y="73.2" font-size="16" font-weight="normal" fill="#374151" text-anchor="start">Every AI use case is reviewed before</text><text x="572.0" y="93.2" font-size="16" font-weight="normal" fill="#374151" text-anchor="start">use</text><rect x="8.0" y="130.0" width="160.0" height="76.0" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="88.0" y="174.2" font-size="19" font-weight="bold" fill="#1e3a8a" text-anchor="middle">Standards</text><rect x="178.0" y="130.0" width="370.0" height="76.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="192.0" y="173.2" font-size="16" font-weight="normal" fill="#1f2937" text-anchor="start">measurable requirements that meet the policy</text><rect x="558.0" y="130.0" width="314.0" height="76.0" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.6"/><text x="572.0" y="173.2" font-size="16" font-weight="normal" fill="#374151" text-anchor="start">Risk tiers and the tests each tier needs</text><rect x="8.0" y="220.0" width="160.0" height="76.0" rx="8" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.6"/><text x="88.0" y="264.2" font-size="19" font-weight="bold" fill="#134e4a" text-anchor="middle">Procedures</text><rect x="178.0" y="220.0" width="370.0" height="76.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="192.0" y="263.2" font-size="16" font-weight="normal" fill="#1f2937" text-anchor="start">the steps people follow</text><rect x="558.0" y="220.0" width="314.0" height="76.0" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.6"/><text x="572.0" y="263.2" font-size="16" font-weight="normal" fill="#374151" text-anchor="start">The intake form and the approval route</text><rect x="8.0" y="310.0" width="160.0" height="76.0" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="88.0" y="354.2" font-size="19" font-weight="bold" fill="#14532d" text-anchor="middle">Records</text><rect x="178.0" y="310.0" width="370.0" height="76.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="192.0" y="353.2" font-size="16" font-weight="normal" fill="#1f2937" text-anchor="start">evidence that the steps happened</text><rect x="558.0" y="310.0" width="314.0" height="76.0" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.6"/><text x="572.0" y="353.2" font-size="16" font-weight="normal" fill="#374151" text-anchor="start">Approvals, test results and logs</text></svg>