<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 330" width="880" height="330" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">m07-core</title><desc id="d">GOVERN surrounds a loop of MAP, MEASURE and MANAGE.</desc><defs><marker id="ah0" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#ffffff"/></marker></defs><rect x="0.75" y="0.75" width="878.5" height="328.5" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><rect x="8.0" y="8.0" width="864.0" height="314.0" rx="18" fill="#1e3a8a" stroke="#1e3a8a" stroke-width="2.5"/><text x="440.0" y="50.0" font-size="21" font-weight="bold" fill="#ffffff" text-anchor="middle">GOVERN: culture, policy, accountability, third parties</text><rect x="48.0" y="90.0" width="230.0" height="100.0" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="163.0" y="123.3" font-size="18" font-weight="bold" fill="#1e3a8a" text-anchor="middle">MAP</text><text x="163.0" y="145.8" font-size="18" font-weight="normal" fill="#1e3a8a" text-anchor="middle">frame the context and</text><text x="163.0" y="168.3" font-size="18" font-weight="normal" fill="#1e3a8a" text-anchor="middle">impacts</text><line x1="280.0" y1="140.0" x2="324.0" y2="140.0" stroke="#ffffff" stroke-width="3.5" marker-end="url(#ah0)"/><rect x="328.0" y="90.0" width="230.0" height="100.0" rx="8" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.6"/><text x="443.0" y="134.6" font-size="18" font-weight="bold" fill="#134e4a" text-anchor="middle">MEASURE</text><text x="443.0" y="157.1" font-size="18" font-weight="normal" fill="#134e4a" text-anchor="middle">analyze, test and track</text><line x1="560.0" y1="140.0" x2="604.0" y2="140.0" stroke="#ffffff" stroke-width="3.5" marker-end="url(#ah0)"/><rect x="608.0" y="90.0" width="230.0" height="100.0" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="723.0" y="134.6" font-size="18" font-weight="bold" fill="#14532d" text-anchor="middle">MANAGE</text><text x="723.0" y="157.1" font-size="18" font-weight="normal" fill="#14532d" text-anchor="middle">prioritize, respond, recover</text><polyline points="715.0,192.0 715.0,250.0 163.0,250.0 163.0,194.0" fill="none" stroke="#ffffff" stroke-width="3.5" marker-end="url(#ah0)" stroke-linejoin="round"/><text x="440.0" y="285.0" font-size="17" font-weight="bold" fill="#ffffff" text-anchor="middle">iterate: new context, new risks</text></svg>