<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 368" width="880" height="368" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">m11-agent-controls</title><desc id="d">Five controls for agentic systems: least-privilege tools, limits, human approval, logging and a kill switch.</desc><defs></defs><rect x="0.75" y="0.75" width="878.5" height="366.5" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><rect x="8.0" y="8.0" width="250.0" height="62.0" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="133.0" y="44.8" font-size="18" font-weight="bold" fill="#1e3a8a" text-anchor="middle">Least-privilege tools</text><rect x="268.0" y="8.0" width="604.0" height="62.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="284.0" y="44.5" font-size="17" font-weight="normal" fill="#1f2937" text-anchor="start">only the functions and permissions the task needs</text><rect x="8.0" y="80.0" width="250.0" height="62.0" rx="8" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.6"/><text x="133.0" y="116.8" font-size="18" font-weight="bold" fill="#134e4a" text-anchor="middle">Limits</text><rect x="268.0" y="80.0" width="604.0" height="62.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="284.0" y="116.5" font-size="17" font-weight="normal" fill="#1f2937" text-anchor="start">on actions, spending and scope</text><rect x="8.0" y="152.0" width="250.0" height="62.0" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="133.0" y="188.8" font-size="18" font-weight="bold" fill="#14532d" text-anchor="middle">Human approval</text><rect x="268.0" y="152.0" width="604.0" height="62.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="284.0" y="188.5" font-size="17" font-weight="normal" fill="#1f2937" text-anchor="start">for consequential steps</text><rect x="8.0" y="224.0" width="250.0" height="62.0" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="133.0" y="260.9" font-size="18" font-weight="bold" fill="#78350f" text-anchor="middle">Logging</text><rect x="268.0" y="224.0" width="604.0" height="62.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="284.0" y="260.5" font-size="17" font-weight="normal" fill="#1f2937" text-anchor="start">every action traceable</text><rect x="8.0" y="296.0" width="250.0" height="62.0" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.6"/><text x="133.0" y="332.9" font-size="18" font-weight="bold" fill="#7f1d1d" text-anchor="middle">Kill switch</text><rect x="268.0" y="296.0" width="604.0" height="62.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="284.0" y="332.5" font-size="17" font-weight="normal" fill="#1f2937" text-anchor="start">a tested way to stop the agent</text></svg>