<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 304" width="880" height="304" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">m04-data-stages</title><desc id="d">Personal data appears in training data, inputs and prompts, outputs and inferences.</desc><defs><marker id="ah0" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker></defs><rect x="0.75" y="0.75" width="878.5" height="302.5" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><rect x="8.0" y="8.0" width="193.5" height="62.0" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="104.8" y="45.2" font-size="19" font-weight="bold" fill="#1e3a8a" text-anchor="middle">Training data</text><line x1="203.5" y1="39.0" x2="229.5" y2="39.0" stroke="#1f2937" stroke-width="2.6" marker-end="url(#ah0)"/><rect x="231.5" y="8.0" width="193.5" height="62.0" rx="8" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.6"/><text x="328.2" y="33.3" font-size="19" font-weight="bold" fill="#134e4a" text-anchor="middle">Inputs and</text><text x="328.2" y="57.0" font-size="19" font-weight="bold" fill="#134e4a" text-anchor="middle">prompts</text><line x1="427.0" y1="39.0" x2="453.0" y2="39.0" stroke="#1f2937" stroke-width="2.6" marker-end="url(#ah0)"/><rect x="455.0" y="8.0" width="193.5" height="62.0" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="551.8" y="45.2" font-size="19" font-weight="bold" fill="#14532d" text-anchor="middle">Outputs</text><line x1="650.5" y1="39.0" x2="676.5" y2="39.0" stroke="#1f2937" stroke-width="2.6" marker-end="url(#ah0)"/><rect x="678.5" y="8.0" width="193.5" height="62.0" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="775.2" y="45.2" font-size="19" font-weight="bold" fill="#78350f" text-anchor="middle">Inferences</text><rect x="8.0" y="88.0" width="193.5" height="120.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="104.8" y="133.2" font-size="16" font-weight="normal" fill="#1f2937" text-anchor="middle">résumés, interview</text><text x="104.8" y="153.2" font-size="16" font-weight="normal" fill="#1f2937" text-anchor="middle">recordings, support</text><text x="104.8" y="173.2" font-size="16" font-weight="normal" fill="#1f2937" text-anchor="middle">chats</text><rect x="231.5" y="88.0" width="193.5" height="120.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="328.2" y="133.2" font-size="16" font-weight="normal" fill="#1f2937" text-anchor="middle">a recruiter pastes a</text><text x="328.2" y="153.2" font-size="16" font-weight="normal" fill="#1f2937" text-anchor="middle">candidate's details into</text><text x="328.2" y="173.2" font-size="16" font-weight="normal" fill="#1f2937" text-anchor="middle">the assistant</text><rect x="455.0" y="88.0" width="193.5" height="120.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="551.8" y="133.2" font-size="16" font-weight="normal" fill="#1f2937" text-anchor="middle">a generated answer that</text><text x="551.8" y="153.2" font-size="16" font-weight="normal" fill="#1f2937" text-anchor="middle">repeats a customer's</text><text x="551.8" y="173.2" font-size="16" font-weight="normal" fill="#1f2937" text-anchor="middle">name and order</text><rect x="678.5" y="88.0" width="193.5" height="120.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="775.2" y="143.2" font-size="16" font-weight="normal" fill="#1f2937" text-anchor="middle">a model guesses a</text><text x="775.2" y="163.2" font-size="16" font-weight="normal" fill="#1f2937" text-anchor="middle">person's health or age</text><rect x="8.0" y="232.0" width="864.0" height="62.0" rx="8" fill="#1e3a8a" stroke="#1e3a8a" stroke-width="1.6"/><text x="440.0" y="269.2" font-size="19" font-weight="bold" fill="#ffffff" text-anchor="middle">If it relates to an identifiable person, privacy law applies</text></svg>