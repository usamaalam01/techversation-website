<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 342" width="880" height="342" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">m11-model-task</title><desc id="d">Four tasks matched to a suitable model type and the main risk to weigh.</desc><defs></defs><rect x="0.75" y="0.75" width="878.5" height="340.5" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><rect x="266.0" y="8.0" width="299.0" height="44.0" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="415.5" y="35.5" font-size="17" font-weight="bold" fill="#1e3a8a" text-anchor="middle">Suitable model type</text><rect x="573.0" y="8.0" width="299.0" height="44.0" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="722.5" y="35.5" font-size="17" font-weight="bold" fill="#78350f" text-anchor="middle">Main risk to weigh</text><rect x="8.0" y="60.0" width="250.0" height="62.0" rx="8" fill="#1e3a8a" stroke="#1e3a8a" stroke-width="1.6"/><text x="133.0" y="96.2" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">Rank or score applicants</text><rect x="266.0" y="60.0" width="299.0" height="62.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="276.0" y="96.2" font-size="16" font-weight="normal" fill="#1f2937" text-anchor="start">classic predictive model</text><rect x="573.0" y="60.0" width="299.0" height="62.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="583.0" y="96.2" font-size="16" font-weight="normal" fill="#1f2937" text-anchor="start">bias and opacity</text><rect x="8.0" y="130.0" width="250.0" height="62.0" rx="8" fill="#1e3a8a" stroke="#1e3a8a" stroke-width="1.6"/><text x="133.0" y="156.2" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">Answer from company</text><text x="133.0" y="176.2" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">documents</text><rect x="266.0" y="130.0" width="299.0" height="62.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="276.0" y="156.2" font-size="16" font-weight="normal" fill="#1f2937" text-anchor="start">generative language model, grounded</text><text x="276.0" y="176.2" font-size="16" font-weight="normal" fill="#1f2937" text-anchor="start">on documents</text><rect x="573.0" y="130.0" width="299.0" height="62.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="583.0" y="166.2" font-size="16" font-weight="normal" fill="#1f2937" text-anchor="start">confabulation and stale content</text><rect x="8.0" y="200.0" width="250.0" height="62.0" rx="8" fill="#1e3a8a" stroke="#1e3a8a" stroke-width="1.6"/><text x="133.0" y="236.2" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">Read scans and photos</text><rect x="266.0" y="200.0" width="299.0" height="62.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="276.0" y="236.2" font-size="16" font-weight="normal" fill="#1f2937" text-anchor="start">multimodal model</text><rect x="573.0" y="200.0" width="299.0" height="62.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="583.0" y="236.2" font-size="16" font-weight="normal" fill="#1f2937" text-anchor="start">privacy and accuracy by condition</text><rect x="8.0" y="270.0" width="250.0" height="62.0" rx="8" fill="#1e3a8a" stroke="#1e3a8a" stroke-width="1.6"/><text x="133.0" y="306.2" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">Classify on a device</text><rect x="266.0" y="270.0" width="299.0" height="62.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="276.0" y="306.2" font-size="16" font-weight="normal" fill="#1f2937" text-anchor="start">small model</text><rect x="573.0" y="270.0" width="299.0" height="62.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="583.0" y="306.2" font-size="16" font-weight="normal" fill="#1f2937" text-anchor="start">limited breadth</text></svg>