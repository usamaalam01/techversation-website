<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 328" width="880" height="328" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">m01-genai-risks</title><desc id="d">NIST names twelve generative-AI risks; four to recognize on sight are confabulation, data privacy, intellectual property and information integrity.</desc><defs></defs><rect x="0.75" y="0.75" width="878.5" height="326.5" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><rect x="8.0" y="8.0" width="205.5" height="96.0" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="110.8" y="51.2" font-size="16" font-weight="bold" fill="#78350f" text-anchor="middle">Confabulation</text><text x="110.8" y="71.2" font-size="16" font-weight="normal" fill="#78350f" text-anchor="middle">confident false output</text><rect x="227.5" y="8.0" width="205.5" height="96.0" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="330.2" y="51.2" font-size="16" font-weight="bold" fill="#1e3a8a" text-anchor="middle">Data privacy</text><text x="330.2" y="71.2" font-size="16" font-weight="normal" fill="#1e3a8a" text-anchor="middle">leaked personal data</text><rect x="447.0" y="8.0" width="205.5" height="96.0" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.6"/><text x="549.8" y="51.2" font-size="16" font-weight="bold" fill="#4c1d95" text-anchor="middle">Intellectual property</text><text x="549.8" y="71.2" font-size="16" font-weight="normal" fill="#4c1d95" text-anchor="middle">copied protected content</text><rect x="666.5" y="8.0" width="205.5" height="96.0" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.6"/><text x="769.2" y="51.2" font-size="16" font-weight="bold" fill="#7f1d1d" text-anchor="middle">Information integrity</text><text x="769.2" y="71.2" font-size="16" font-weight="normal" fill="#7f1d1d" text-anchor="middle">deepfakes, disinformation</text><rect x="8.0" y="116.0" width="205.5" height="96.0" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.6"/><text x="110.8" y="159.2" font-size="16" font-weight="bold" fill="#374151" text-anchor="middle">Harmful bias or</text><text x="110.8" y="179.2" font-size="16" font-weight="bold" fill="#374151" text-anchor="middle">homogenization</text><rect x="227.5" y="116.0" width="205.5" height="96.0" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.6"/><text x="330.2" y="169.2" font-size="16" font-weight="bold" fill="#374151" text-anchor="middle">Human-AI configuration</text><rect x="447.0" y="116.0" width="205.5" height="96.0" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.6"/><text x="549.8" y="169.2" font-size="16" font-weight="bold" fill="#374151" text-anchor="middle">Information security</text><rect x="666.5" y="116.0" width="205.5" height="96.0" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.6"/><text x="769.2" y="169.2" font-size="16" font-weight="bold" fill="#374151" text-anchor="middle">Environmental impacts</text><rect x="8.0" y="224.0" width="205.5" height="96.0" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.6"/><text x="110.8" y="267.2" font-size="16" font-weight="bold" fill="#374151" text-anchor="middle">Dangerous, violent or</text><text x="110.8" y="287.2" font-size="16" font-weight="bold" fill="#374151" text-anchor="middle">hateful content</text><rect x="227.5" y="224.0" width="205.5" height="96.0" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.6"/><text x="330.2" y="267.2" font-size="16" font-weight="bold" fill="#374151" text-anchor="middle">Obscene, degrading or</text><text x="330.2" y="287.2" font-size="16" font-weight="bold" fill="#374151" text-anchor="middle">abusive content</text><rect x="447.0" y="224.0" width="205.5" height="96.0" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.6"/><text x="549.8" y="267.2" font-size="16" font-weight="bold" fill="#374151" text-anchor="middle">CBRN information or</text><text x="549.8" y="287.2" font-size="16" font-weight="bold" fill="#374151" text-anchor="middle">capabilities</text><rect x="666.5" y="224.0" width="205.5" height="96.0" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.6"/><text x="769.2" y="267.2" font-size="16" font-weight="bold" fill="#374151" text-anchor="middle">Value chain and</text><text x="769.2" y="287.2" font-size="16" font-weight="bold" fill="#374151" text-anchor="middle">component integration</text></svg>