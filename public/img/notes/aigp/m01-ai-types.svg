<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 400" width="880" height="400" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">m01-ai-types</title><desc id="d">Machine learning sits inside AI and deep learning inside machine learning; generative AI and foundation models draw on deep learning.</desc><defs><marker id="ah0" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker></defs><rect x="0.75" y="0.75" width="878.5" height="398.5" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><rect x="8.0" y="8.0" width="864.0" height="384.0" rx="14" fill="#dbeafe" stroke="#2563eb" stroke-width="2.2"/><text x="24.0" y="38.0" font-size="17" font-weight="bold" fill="#1e3a8a" text-anchor="start">Artificial intelligence: systems that perform tasks that normally need human intelligence</text><rect x="650.0" y="62.0" width="208.0" height="316.0" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.6"/><text x="754.0" y="205.2" font-size="16" font-weight="bold" fill="#374151" text-anchor="middle">Rule-based systems</text><text x="754.0" y="225.2" font-size="16" font-weight="normal" fill="#374151" text-anchor="middle">follow rules people wrote;</text><text x="754.0" y="245.2" font-size="16" font-weight="normal" fill="#374151" text-anchor="middle">they do not learn</text><rect x="24.0" y="54.0" width="610.0" height="326.0" rx="12" fill="#ccfbf1" stroke="#0d9488" stroke-width="2.2"/><text x="40.0" y="82.0" font-size="17" font-weight="bold" fill="#134e4a" text-anchor="start">Machine learning: learns patterns from data</text><rect x="40.0" y="100.0" width="578.0" height="264.0" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2.2"/><text x="56.0" y="128.0" font-size="17" font-weight="bold" fill="#14532d" text-anchor="start">Deep learning: many-layered neural networks</text><rect x="56.0" y="148.0" width="262.0" height="200.0" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="187.0" y="233.2" font-size="16" font-weight="bold" fill="#78350f" text-anchor="middle">Generative AI</text><text x="187.0" y="253.2" font-size="16" font-weight="normal" fill="#78350f" text-anchor="middle">creates new text, images, audio</text><text x="187.0" y="273.2" font-size="16" font-weight="normal" fill="#78350f" text-anchor="middle">and code</text><rect x="356.0" y="148.0" width="246.0" height="200.0" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.6"/><text x="479.0" y="223.2" font-size="16" font-weight="bold" fill="#4c1d95" text-anchor="middle">Foundation models</text><text x="479.0" y="243.2" font-size="16" font-weight="normal" fill="#4c1d95" text-anchor="middle">trained on broad data and</text><text x="479.0" y="263.2" font-size="16" font-weight="normal" fill="#4c1d95" text-anchor="middle">adapted to many tasks; large</text><text x="479.0" y="283.2" font-size="16" font-weight="normal" fill="#4c1d95" text-anchor="middle">language models are one kind</text><line x1="354.0" y1="248.0" x2="322.0" y2="248.0" stroke="#1f2937" stroke-width="3" marker-end="url(#ah0)"/></svg>