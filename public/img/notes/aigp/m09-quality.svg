<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 208" width="880" height="208" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">m09-quality</title><desc id="d">Five data quality checks: accuracy, completeness, consistency, timeliness and validity.</desc><defs></defs><rect x="0.75" y="0.75" width="878.5" height="206.5" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><rect x="8.0" y="8.0" width="164.8" height="190.0" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="90.4" y="78.2" font-size="16" font-weight="bold" fill="#1e3a8a" text-anchor="middle">Accuracy</text><text x="90.4" y="98.2" font-size="16" font-weight="normal" fill="#1e3a8a" text-anchor="middle">values match</text><text x="90.4" y="118.2" font-size="16" font-weight="normal" fill="#1e3a8a" text-anchor="middle">reality; labels are</text><text x="90.4" y="138.2" font-size="16" font-weight="normal" fill="#1e3a8a" text-anchor="middle">right</text><rect x="182.8" y="8.0" width="164.8" height="190.0" rx="8" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.6"/><text x="265.2" y="88.2" font-size="16" font-weight="bold" fill="#134e4a" text-anchor="middle">Completeness</text><text x="265.2" y="108.2" font-size="16" font-weight="normal" fill="#134e4a" text-anchor="middle">required fields and</text><text x="265.2" y="128.2" font-size="16" font-weight="normal" fill="#134e4a" text-anchor="middle">labels are present</text><rect x="357.6" y="8.0" width="164.8" height="190.0" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="440.0" y="88.2" font-size="16" font-weight="bold" fill="#14532d" text-anchor="middle">Consistency</text><text x="440.0" y="108.2" font-size="16" font-weight="normal" fill="#14532d" text-anchor="middle">same meaning</text><text x="440.0" y="128.2" font-size="16" font-weight="normal" fill="#14532d" text-anchor="middle">across sources</text><rect x="532.4" y="8.0" width="164.8" height="190.0" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="614.8" y="88.2" font-size="16" font-weight="bold" fill="#78350f" text-anchor="middle">Timeliness</text><text x="614.8" y="108.2" font-size="16" font-weight="normal" fill="#78350f" text-anchor="middle">current enough for</text><text x="614.8" y="128.2" font-size="16" font-weight="normal" fill="#78350f" text-anchor="middle">the use</text><rect x="707.2" y="8.0" width="164.8" height="190.0" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.6"/><text x="789.6" y="88.2" font-size="16" font-weight="bold" fill="#4c1d95" text-anchor="middle">Validity</text><text x="789.6" y="108.2" font-size="16" font-weight="normal" fill="#4c1d95" text-anchor="middle">allowed formats and</text><text x="789.6" y="128.2" font-size="16" font-weight="normal" fill="#4c1d95" text-anchor="middle">ranges</text></svg>