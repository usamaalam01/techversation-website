<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 206" width="880" height="206" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">m11-where-it-runs</title><desc id="d">Cloud, on-premises and edge: where the model runs, and the trade-offs of each.</desc><defs></defs><rect x="0.75" y="0.75" width="878.5" height="204.5" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><rect x="8.0" y="8.0" width="278.7" height="52.0" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="147.3" y="40.2" font-size="19" font-weight="bold" fill="#1e3a8a" text-anchor="middle">Cloud</text><rect x="8.0" y="68.0" width="278.7" height="124.0" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="1.8"/><circle cx="27.0" cy="92.7" r="3.4" fill="#2563eb" stroke="#2563eb" stroke-width="1"/><text x="44.0" y="98.2" font-size="17" font-weight="normal" fill="#1f2937" text-anchor="start">provider's infrastructure</text><circle cx="27.0" cy="127.4" r="3.4" fill="#2563eb" stroke="#2563eb" stroke-width="1"/><text x="44.0" y="132.9" font-size="17" font-weight="normal" fill="#1f2937" text-anchor="start">quick start, scales</text><circle cx="27.0" cy="162.2" r="3.4" fill="#2563eb" stroke="#2563eb" stroke-width="1"/><text x="44.0" y="167.6" font-size="17" font-weight="normal" fill="#1f2937" text-anchor="start">shared responsibility</text><rect x="300.7" y="8.0" width="278.7" height="52.0" rx="8" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.6"/><text x="440.0" y="40.2" font-size="19" font-weight="bold" fill="#134e4a" text-anchor="middle">On-premises</text><rect x="300.7" y="68.0" width="278.7" height="124.0" rx="10" fill="#ffffff" stroke="#0d9488" stroke-width="1.8"/><circle cx="319.7" cy="92.7" r="3.4" fill="#0d9488" stroke="#0d9488" stroke-width="1"/><text x="336.7" y="98.2" font-size="17" font-weight="normal" fill="#1f2937" text-anchor="start">your own data centers</text><circle cx="319.7" cy="127.4" r="3.4" fill="#0d9488" stroke="#0d