<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 298" width="880" height="298" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">m07-rmf-structure</title><desc id="d">The AI RMF: foundations, the Core of four functions, profiles, the Playbook and the generative AI profile.</desc><defs></defs><rect x="0.75" y="0.75" width="878.5" height="296.5" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><rect x="8.0" y="8.0" width="190.0" height="84.0" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="103.0" y="55.5" font-size="17" font-weight="bold" fill="#1e3a8a" text-anchor="middle">Part 1: foundations</text><rect x="206.0" y="8.0" width="420.0" height="84.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="220.0" y="45.2" font-size="16" font-weight="normal" fill="#1f2937" text-anchor="start">framing AI risk, audience, trustworthy characteristics,</text><text x="220.0" y="65.2" font-size="16" font-weight="normal" fill="#1f2937" text-anchor="start">effectiveness</text><rect x="8.0" y="106.0" width="190.0" height="84.0" rx="8" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.6"/><text x="103.0" y="153.5" font-size="17" font-weight="bold" fill="#134e4a" text-anchor="middle">Part 2: the Core</text><rect x="206.0" y="106.0" width="420.0" height="84.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="220.0" y="153.2" font-size="16" font-weight="normal" fill="#1f2937" text-anchor="start">4 functions, 19 categories, 72 subcategories</text><rect x="8.0" y="204.0" width="190.0" height="84.0" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="103.0" y="251.5" font-size="17" font-weight="bold" fill="#14532d" text-anchor="middle">Profiles</text><rect x="206.0" y="204.0" width="420.0" height="84.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="220.0" y="251.2" font-size="16" font-weight="normal" fill="#1f2937" text-anchor="start">use-case, temporal (current and target), cross-sectoral</text><rect x="660.0" y="8.0" width="212.0" height="120.0" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="766.0" y="53.2" font-size="16" font-weight="bold" fill="#78350f" text-anchor="middle">Playbook</text><text x="766.0" y="73.2" font-size="16" font-weight="normal" fill="#78350f" text-anchor="middle">suggested actions for each</text><text x="766.0" y="93.2" font-size="16" font-weight="normal" fill="#78350f" text-anchor="middle">subcategory; voluntary</text><rect x="660.0" y="142.0" width="212.0" height="120.0" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.6"/><text x="766.0" y="187.2" font-size="16" font-weight="bold" fill="#4c1d95" text-anchor="middle">Generative AI profile</text><text x="766.0" y="207.2" font-size="16" font-weight="normal" fill="#4c1d95" text-anchor="middle">twelve generative-AI risks</text><text x="766.0" y="227.2" font-size="16" font-weight="normal" fill="#4c1d95" text-anchor="middle">mapped to the functions</text></svg>