<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 320" width="880" height="320" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">m08-oversight-modes</title><desc id="d">Three oversight modes: in the loop, on the loop and in command.</desc><defs></defs><rect x="0.75" y="0.75" width="878.5" height="318.5" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><rect x="8.0" y="8.0" width="278.7" height="52.0" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="147.3" y="39.8" font-size="18" font-weight="bold" fill="#1e3a8a" text-anchor="middle">In the loop</text><rect x="8.0" y="68.0" width="278.7" height="242.0" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="1.8"/><circle cx="27.0" cy="92.1" r="3.4" fill="#2563eb" stroke="#2563eb" stroke-width="1"/><text x="44.0" y="97.2" font-size="16" font-weight="normal" fill="#1f2937" text-anchor="start">a person approves each</text><text x="44.0" y="116.7" font-size="16" font-weight="normal" fill="#1f2937" text-anchor="start">decision</text><circle cx="27.0" cy="145.1" r="3.4" fill="#2563eb" stroke="#2563eb" stroke-width="1"/><text x="44.0" y="150.2" font-size="16" font-weight="normal" fill="#1f2937" text-anchor="start">fits high-stakes individual</text><text x="44.0" y="169.8" font-size="16" font-weight="normal" fill="#1f2937" text-anchor="start">decisions</text><circle cx="27.0" cy="198.2" r="3.4" fill="#2563eb" stroke="#2563eb" stroke-width="1"/><text x="44.0" y="203.3" font-size="16" font-weight="normal" fill="#1f2937" text-anchor="start">Helios: a recruiter reviews each</text><text x="44.0" y="222.8" font-size="16" font-weight="normal" fill="#1f2937" text-anchor="start">rejection</text><rect x="300.7" y="8.0" width="278.7" height="52.0" rx="8" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.6"/><text x="440.0" y="39.8" font-size="18" font-weight="bold" fill="#134e4a" text-anchor="middle">On the loop</text><rect x="300.7" y="68.0" width="278.7" height="242.0" rx="10" fill="#ffffff" stroke="#0d9488" stroke-width="1.8"/><circle cx="319.7" cy="92.1" r="3.4" fill="#0d9488" stroke="#0d9488" stroke-width="1"/><text x="336.7" y="97.2" font-size="16" font-weight="normal" fill="#1f2937" text-anchor="start">a person monitors and can</text><text x="336.7" y="116.7" font-size="16" font-weight="normal" fill="#1f2937" text-anchor="start">intervene</text><circle cx="319.7" cy="145.1" r="3.4" fill="#0d9488" stroke="#0d9488" stroke-width="1"/><text x="336.7" y="150.2" font-size="16" font-weight="normal" fill="#1f2937" text-anchor="start">fits high-volume, lower-stakes</text><text x="336.7" y="169.8" font-size="16" font-weight="normal" fill="#1f2937" text-anchor="start">work</text><circle cx="319.7" cy="198.2" r="3.4" fill="#0d9488" stroke="#0d9488" stroke-width="1"/><text x="336.7" y="203.3" font-size="16" font-weight="normal" fill="#1f2937" text-anchor="start">Helios: support leads sample</text><text x="336.7" y="222.8" font-size="16" font-weight="normal" fill="#1f2937" text-anchor="start">assistant chats</text><rect x="593.3" y="8.0" width="278.7" height="52.0" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="732.7" y="39.8" font-size="18" font-weight="bold" fill="#14532d" text-anchor="middle">In command</text><rect x="593.3" y="68.0" width="278.7" height="242.0" rx="10" fill="#ffffff" stroke="#16a34a" stroke-width="1.8"/><circle cx="612.3" cy="92.1" r="3.4" fill="#16a34a" stroke="#16a34a" stroke-width="1"/><text x="629.3" y="97.2" font-size="16" font-weight="normal" fill="#1f2937" text-anchor="start">a person decides whether and</text><text x="629.3" y="116.7" font-size="16" font-weight="normal" fill="#1f2937" text-anchor="start">how the system is used</text><circle cx="612.3" cy="145.1" r="3.4" fill="#16a34a" stroke="#16a34a" stroke-width="1"/><text x="629.3" y="150.2" font-size="16" font-weight="normal" fill="#1f2937" text-anchor="start">sets scope, limits and stop rules</text><circle cx="612.3" cy="178.6" r="3.4" fill="#16a34a" stroke="#16a34a" stroke-width="1"/><text x="629.3" y="183.8" font-size="16" font-weight="normal" fill="#1f2937" text-anchor="start">Helios: the committee approves</text><text x="629.3" y="203.3" font-size="16" font-weight="normal" fill="#1f2937" text-anchor="start">each use</text></svg>