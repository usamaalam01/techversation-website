<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 368" width="880" height="368" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">m02-roles</title><desc id="d">Leadership sets direction, the AI governance committee decides, and seven functions advise and run the work.</desc><defs><marker id="ah0" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker></defs><rect x="0.75" y="0.75" width="878.5" height="366.5" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><rect x="222.0" y="8.0" width="440.0" height="54.0" rx="8" fill="#1e3a8a" stroke="#1e3a8a" stroke-width="1.6"/><text x="442.0" y="30.2" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">Board and executive leadership</text><text x="442.0" y="50.2" font-size="16" font-weight="normal" fill="#ffffff" text-anchor="middle">strategy, risk tolerance, accountability</text><line x1="442.0" y1="64.0" x2="442.0" y2="90.0" stroke="#1f2937" stroke-width="2.6" marker-end="url(#ah0)"/><rect x="172.0" y="92.0" width="540.0" height="54.0" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="442.0" y="114.2" font-size="16" font-weight="bold" fill="#1e3a8a" text-anchor="middle">AI governance committee and Chief AI Officer</text><text x="442.0" y="134.2" font-size="16" font-weight="normal" fill="#1e3a8a" text-anchor="middle">policy, approvals, inventory</text><line x1="442.0" y1="148.0" x2="442.0" y2="172.0" stroke="#1f2937" stroke-width="2.6" marker-end="url(#ah0)"/><rect x="8.0" y="176.0" width="207.0" height="86.0" rx="8" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.6"/><text x="111.5" y="214.2" font-size="16" font-weight="bold" fill="#134e4a" text-anchor="middle">Legal</text><text x="111.5" y="234.2" font-size="16" font-weight="normal" fill="#134e4a" text-anchor="middle">law, contracts, claims</text><rect x="227.0" y="176.0" width="207.0" height="86.