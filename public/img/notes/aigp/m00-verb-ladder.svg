<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 404" width="880" height="404" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">m00-verb-ladder</title><desc id="d">Six levels from Remember to Create; the verb that starts an indicator sets the level of the question.</desc><defs><marker id="ah0" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1e3a8a"/></marker></defs><rect x="0.75" y="0.75" width="878.5" height="402.5" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><rect x="8.0" y="8.0" width="190.0" height="56.0" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.6"/><text x="103.0" y="42.2" font-size="19" font-weight="bold" fill="#374151" text-anchor="middle">Remember</text><rect x="208.0" y="8.0" width="616.0" height="56.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="224.0" y="41.2" font-size="16" font-weight="normal" fill="#1f2937" text-anchor="start">know, define, list: recall the term, the list or the number</text><rect x="8.0" y="74.0" width="190.0" height="56.0" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="103.0" y="108.2" font-size="19" font-weight="bold" fill="#1e3a8a" text-anchor="middle">Understand</text><rect x="208.0" y="74.0" width="616.0" height="56.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="224.0" y="107.2" font-size="16" font-weight="normal" fill="#1f2937" text-anchor="start">explain, identify, describe: say why, how, and how it differs</text><rect x="8.0" y="140.0" width="190.0" height="56.0" rx="8" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.6"/><text x="103.0" y="174.2" font-size="19" font-weight="bold" fill="#134e4a" text-anchor="middle">Apply</text><rect x="208.0" y="140.0" width="616.0" height="56.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="224.0" y="173.2" font-size="16" font-weight="normal" fill="#1f2937" text-anchor="start">apply, establish, perform, conduct, document: decide what to do</text><rect x="8.0" y="206.0" width="190.0" height="56.0" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="103.0" y="240.2" font-size="19" font-weight="bold" fill="#14532d" text-anchor="middle">Analyze</text><rect x="208.0" y="206.0" width="616.0" height="56.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="224.0" y="239.2" font-size="16" font-weight="normal" fill="#1f2937" text-anchor="start">differentiate: compare options and tell them apart</text><rect x="8.0" y="272.0" width="190.0" height="56.0" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="103.0" y="306.2" font-size="19" font-weight="bold" fill="#78350f" text-anchor="middle">Evaluate</text><rect x="208.0" y="272.0" width="616.0" height="56.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="224.0" y="305.2" font-size="16" font-weight="normal" fill="#1f2937" text-anchor="start">evaluate, assess: judge and justify the choice</text><rect x="8.0" y="338.0" width="190.0" height="56.0" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.6"/><text x="103.0" y="372.2" font-size="19" font-weight="bold" fill="#4c1d95" text-anchor="middle">Create</text><rect x="208.0" y="338.0" width="616.0" height="56.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="224.0" y="371.2" font-size="16" font-weight="normal" fill="#1f2937" text-anchor="start">create: put the right policy or control in place</text><line x1="852.0" y1="372.0" x2="852.0" y2="18.0" stroke="#1e3a8a" stroke-width="4" marker-end="url(#ah0)"/><text x="836.0" y="200.0" transform="rotate(-90 836.0 200.0)" font-size="15" font-weight="bold" fill="#1e3a8a" text-anchor="middle">deeper question</text></svg>