<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 278" width="880" height="278" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">m02-ai-chain</title><desc id="d">Developer, provider, deployer and user, each with a governance focus; importers and distributors sit in the supply chain.</desc><defs></defs><rect x="0.75" y="0.75" width="878.5" height="276.5" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><polygon points="8.0,8.0 195.0,8.0 215.0,38.0 195.0,68.0 8.0,68.0" fill="#dbeafe" stroke="#2563eb" stroke-width="1.8"/><text x="104.5" y="43.8" font-size="18" font-weight="bold" fill="#1e3a8a" text-anchor="middle">Developer</text><rect x="10.0" y="72.0" width="193.0" height="140.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="18.0" y="128.1" font-size="15" font-weight="bold" fill="#1f2937" text-anchor="start">designs, builds and</text><text x="18.0" y="146.9" font-size="15" font-weight="bold" fill="#1f2937" text-anchor="start">trains</text><text x="18.0" y="165.6" font-size="15" font-weight="normal" fill="#1f2937" text-anchor="start">documents and tests</text><polygon points="227.0,8.0 414.0,8.0 434.0,38.0 414.0,68.0 227.0,68.0 247.0,38.0" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.8"/><text x="330.5" y="43.8" font-size="18" font-weight="bold" fill="#134e4a" text-anchor="middle">Provider</text><rect x="229.0" y="72.0" width="193.0" height="140.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="237.0" y="128.1" font-size="15" font-weight="bold" fill="#1f2937" text-anchor="start">makes it available under</text><text x="237.0" y="146.9" font-size="15" font-weight="bold" fill="#1f2937" text-anchor="start">its own name</text><text x="237.0" y="165.6" font-size="15" font-weight="normal" fill="#1f2937" text-anchor="start">legal duties, instructions</text><polygon points="446.0,8.0 633.0,8.0 653.0,38.0 633.0,68.0 446.0,68.0 466.0,38.0" fill="#dcfce7" stroke="#16a34a" stroke-width="1.8"/><text x="549.5" y="43.8" font-size="18" font-weight="bold" fill="#14532d" text-anchor="middle">Deployer</text><rect x="448.0" y="72.0" width="193.0" height="140.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="456.0" y="118.8" font-size="15" font-weight="bold" fill="#1f2937" text-anchor="start">uses it under its</text><text x="456.0" y="137.5" font-size="15" font-weight="bold" fill="#1f2937" text-anchor="start">authority</text><text x="456.0" y="156.2" font-size="15" font-weight="normal" fill="#1f2937" text-anchor="start">fit for use, oversight,</text><text x="456.0" y="175.0" font-size="15" font-weight="normal" fill="#1f2937" text-anchor="start">monitoring</text><polygon points="665.0,8.0 852.0,8.0 872.0,38.0 852.0,68.0 665.0,68.0 685.0,38.0" fill="#fef3c7" stroke="#d97706" stroke-width="1.8"/><text x="768.5" y="43.8" font-size="18" font-weight="bold" fill="#78350f" text-anchor="middle">User</text><rect x="667.0" y="72.0" width="193.0" height="140.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="675.0" y="118.8" font-size="15" font-weight="bold" fill="#1f2937" text-anchor="start">interacts with it or its</text><text x="675.0" y="137.5" font-size="15" font-weight="bold" fill="#1f2937" text-anchor="start">output</text><text x="675.0" y="156.2" font-size="15" font-weight="normal" fill="#1f2937" text-anchor="start">training, feedback,</text><text x="675.0" y="175.0" font-size="15" font-weight="normal" fill="#1f2937" text-anchor="start">redress</text><rect x="8.0" y="222.0" width="864.0" height="46.0" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.6" stroke-dasharray="6 4"/><text x="440.0" y="250.2" font-size="16" font-weight="normal" fill="#374151" text-anchor="middle">Importers and distributors sit in the supply chain and carry their own duties</text></svg>