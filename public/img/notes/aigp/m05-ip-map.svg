<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 330" width="880" height="330" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">m05-ip-map</title><desc id="d">Four IP rights and their AI touchpoints, with contracts and licenses as a limit on data use.</desc><defs></defs><rect x="0.75" y="0.75" width="878.5" height="328.5" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><rect x="8.0" y="8.0" width="207.0" height="50.0" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="111.5" y="38.5" font-size="17" font-weight="bold" fill="#1e3a8a" text-anchor="middle">Copyright</text><rect x="8.0" y="66.0" width="207.0" height="150.0" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="1.8"/><circle cx="27.0" cy="90.1" r="3.4" fill="#2563eb" stroke="#2563eb" stroke-width="1"/><text x="44.0" y="95.2" font-size="16" font-weight="normal" fill="#1f2937" text-anchor="start">training data</text><circle cx="27.0" cy="121.6" r="3.4" fill="#2563eb" stroke="#2563eb" stroke-width="1"/><text x="44.0" y="126.7" font-size="16" font-weight="normal" fill="#1f2937" text-anchor="start">outputs that copy</text><rect x="227.0" y="8.0" width="207.0" height="50.0" rx="8" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.6"/><text x="330.5" y="38.5" font-size="17" font-weight="bold" fill="#134e4a" text-anchor="middle">Patents</text><rect x="227.0" y="66.0" width="207.0" height="150.0" rx="10" fill="#ffffff" stroke="#0d9488" stroke-width="1.8"/><circle cx="246.0" cy="90.1" r="3.4" fill="#0d9488" stroke="#0d9488" stroke-width="1"/><text x="263.0" y="95.2" font-size="16" font-weight="normal" fill="#1f2937" text-anchor="start">human inventor</text><text x="263.0" y="114.7" font-size="16" font-weight="normal" fill="#1f2937" text-anchor="start">needed</text><circle cx="246.0" cy="141.1" r="3.4" fill="#0d9488" stroke="#0d9488" stroke-width="1"/><text x="263.0" y="146.2" font-size="16" font-weight="normal" fill="#1f2937" text-anchor="s