<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 292" width="880" height="292" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">m02-three-lines</title><desc id="d">A governing body above management, with first and second line roles, and internal audit as the independent third line.</desc><defs></defs><rect x="0.75" y="0.75" width="878.5" height="290.5" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><rect x="8.0" y="8.0" width="864.0" height="56.0" rx="8" fill="#1e3a8a" stroke="#1e3a8a" stroke-width="1.6"/><text x="440.0" y="30.9" font-size="17" font-weight="bold" fill="#ffffff" text-anchor="middle">Governing body</text><text x="440.0" y="52.1" font-size="17" font-weight="normal" fill="#ffffff" text-anchor="middle">accountable to stakeholders for oversight</text><rect x="8.0" y="78.0" width="571.3" height="40.0" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.6"/><text x="293.7" y="103.5" font-size="17" font-weight="bold" fill="#374151" text-anchor="middle">Management</text><rect x="593.3" y="78.0" width="278.7" height="40.0" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.6"/><text x="732.7" y="103.5" font-size="17" font-weight="bold" fill="#374151" text-anchor="middle">Internal audit</text><rect x="8.0" y="128.0" width="278.7" height="154.0" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="147.3" y="180.2" font-size="16" font-weight="bold" fill="#1e3a8a" text-anchor="middle">First line</text><text x="147.3" y="200.2" font-size="16" font-weight="normal" fill="#1e3a8a" text-anchor="middle">builds, runs and manages risk</text><text x="147.3" y="220.2" font-size="16" font-weight="normal" fill="#1e3a8a" text-anchor="middle">business owners, product, data</text><text x="147.3" y="240.2" font-size="16" font-weight="normal" fill="#1e3a8a" text-anchor="middle">science</text><rect x="300.7" y="128.0" width="278.7" height="154.0" rx="8" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.6"/><text x="440.0" y="170.2" font-size="16" font-weight="bold" fill="#134e4a" text-anchor="middle">Second line</text><text x="440.0" y="190.2" font-size="16" font-weight="normal" fill="#134e4a" text-anchor="middle">expertise, support, monitoring and</text><text x="440.0" y="210.2" font-size="16" font-weight="normal" fill="#134e4a" text-anchor="middle">challenge</text><text x="440.0" y="230.2" font-size="16" font-weight="normal" fill="#134e4a" text-anchor="middle">risk, compliance, legal, privacy,</text><text x="440.0" y="250.2" font-size="16" font-weight="normal" fill="#134e4a" text-anchor="middle">security</text><rect x="593.3" y="128.0" width="278.7" height="154.0" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="732.7" y="180.2" font-size="16" font-weight="bold" fill="#14532d" text-anchor="middle">Third line</text><text x="732.7" y="200.2" font-size="16" font-weight="normal" fill="#14532d" text-anchor="middle">independent and objective</text><text x="732.7" y="220.2" font-size="16" font-weight="normal" fill="#14532d" text-anchor="middle">assurance</text><text x="732.7" y="240.2" font-size="16" font-weight="normal" fill="#14532d" text-anchor="middle">internal audit</text></svg>