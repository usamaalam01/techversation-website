<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 412" width="880" height="412" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">m13-periodic-checks</title><desc id="d">Five periodic checks with what each checks and a rhythm set by risk.</desc><defs></defs><rect x="0.75" y="0.75" width="878.5" height="410.5" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><rect x="226.0" y="8.0" width="319.0" height="44.0" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="385.5" y="35.5" font-size="17" font-weight="bold" fill="#1e3a8a" text-anchor="middle">What it checks</text><rect x="553.0" y="8.0" width="319.0" height="44.0" rx="8" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.6"/><text x="712.5" y="35.5" font-size="17" font-weight="bold" fill="#134e4a" text-anchor="middle">Rhythm</text><rect x="8.0" y="60.0" width="210.0" height="62.0" rx="8" fill="#1e3a8a" stroke="#1e3a8a" stroke-width="1.6"/><text x="113.0" y="96.2" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">Metric review</text><rect x="226.0" y="60.0" width="319.0" height="62.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="236.0" y="86.2" font-size="16" font-weight="normal" fill="#1f2937" text-anchor="start">accuracy, fairness and drift against</text><text x="236.0" y="106.2" font-size="16" font-weight="normal" fill="#1f2937" text-anchor="start">thresholds</text><rect x="553.0" y="60.0" width="319.0" height="62.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="563.0" y="96.2" font-size="16" font-weight="normal" fill="#1f2937" text-anchor="start">monthly or quarterly, by risk</text><rect x="8.0" y="130.0" width="210.0" height="62.0" rx="8" fill="#1e3a8a" stroke="#1e3a8a" stroke-width="1.6"/><text x="113.0" y="166.2" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">Sample review</text><rect x="226.0" y="130.0" width="319.0" height="62.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="236.0" y="166.2" font-size="16" font-weight="normal" fill="#1f2937" text-anchor="start">people read real outputs and decisions</text><rect x="553.0" y="130.0" width="319.0" height="62.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="563.0" y="166.2" font-size="16" font-weight="normal" fill="#1f2937" text-anchor="start">regularly, with a set sample</text><rect x="8.0" y="200.0" width="210.0" height="62.0" rx="8" fill="#1e3a8a" stroke="#1e3a8a" stroke-width="1.6"/><text x="113.0" y="236.2" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">Assessment refresh</text><rect x="226.0" y="200.0" width="319.0" height="62.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="236.0" y="236.2" font-size="16" font-weight="normal" fill="#1f2937" text-anchor="start">does the assessment still fit the use?</text><rect x="553.0" y="200.0" width="319.0" height="62.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="563.0" y="236.2" font-size="16" font-weight="normal" fill="#1f2937" text-anchor="start">yearly, and on any major change</text><rect x="8.0" y="270.0" width="210.0" height="62.0" rx="8" fill="#1e3a8a" stroke="#1e3a8a" stroke-width="1.6"/><text x="113.0" y="306.2" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">Security, misuse test</text><rect x="226.0" y="270.0" width="319.0" height="62.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="236.0" y="306.2" font-size="16" font-weight="normal" fill="#1f2937" text-anchor="start">weak points in your own setup</text><rect x="553.0" y="270.0" width="319.0" height="62.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="563.0" y="306.2" font-size="16" font-weight="normal" fill="#1f2937" text-anchor="start">before changes, then periodically</text><rect x="8.0" y="340.0" width="210.0" height="62.0" rx="8" fill="#1e3a8a" stroke="#1e3a8a" stroke-width="1.6"/><text x="113.0" y="376.2" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">Vendor review</text><rect x="226.0" y="340.0" width="319.0" height="62.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="236.0" y="376.2" font-size="16" font-weight="normal" fill="#1f2937" text-anchor="start">service levels, notices, contract terms</text><rect x="553.0" y="340.0" width="319.0" height="62.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="563.0" y="376.2" font-size="16" font-weight="normal" fill="#1f2937" text-anchor="start">at each renewal and review</text></svg>