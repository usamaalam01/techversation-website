<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 290" width="880" height="290" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">m11-dimensions</title><desc id="d">The eight core dimensions of responsible AI: fairness, explainability, privacy and security, safety, controllability, veracity and robustness, governance and transparency.</desc><defs></defs><rect x="0.75" y="0.75" width="878.5" height="288.5" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><rect x="8.0" y="8.0" width="207.0" height="130.0" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="111.5" y="68.2" font-size="16" font-weight="bold" fill="#1e3a8a" text-anchor="middle">Fairness</text><text x="111.5" y="88.2" font-size="16" font-weight="normal" fill="#1e3a8a" text-anchor="middle">impact on different groups</text><rect x="227.0" y="8.0" width="207.0" height="130.0" rx="8" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.6"/><text x="330.5" y="58.2" font-size="16" font-weight="bold" fill="#134e4a" text-anchor="middle">Explainability</text><text x="330.5" y="78.2" font-size="16" font-weight="normal" fill="#134e4a" text-anchor="middle">understand and evaluate</text><text x="330.5" y="98.2" font-size="16" font-weight="normal" fill="#134e4a" text-anchor="middle">outputs</text><rect x="446.0" y="8.0" width="207.0" height="130.0" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="549.5" y="58.2" font-size="16" font-weight="bold" fill="#14532d" text-anchor="middle">Privacy and security</text><text x="549.5" y="78.2" font-size="16" font-weight="normal" fill="#14532d" text-anchor="middle">obtain, use and protect</text><text x="549.5" y="98.2" font-size="16" font-weight="normal" fill="#14532d" text-anchor="middle">data</text><rect x="665.0" y="8.0" width="207.0" height="130.0" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.6"/><text x="768.5" y="58.2" font-size="16" font-weight="bold" fill="#7f1d1d" text-anchor="middle">Safety</text><text x="768.5" y="78.2" font-size="16" font-weight="normal" fill="#7f1d1d" text-anchor="middle">prevent harmful output</text><text x="768.5" y="98.2" font-size="16" font-weight="normal" fill="#7f1d1d" text-anchor="middle">and misuse</text><rect x="8.0" y="152.0" width="207.0" height="130.0" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="111.5" y="202.2" font-size="16" font-weight="bold" fill="#78350f" text-anchor="middle">Controllability</text><text x="111.5" y="222.2" font-size="16" font-weight="normal" fill="#78350f" text-anchor="middle">monitor and steer</text><text x="111.5" y="242.2" font-size="16" font-weight="normal" fill="#78350f" text-anchor="middle">behavior</text><rect x="227.0" y="152.0" width="207.0" height="130.0" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.6"/><text x="330.5" y="202.2" font-size="16" font-weight="bold" fill="#4c1d95" text-anchor="middle">Veracity and robustness</text><text x="330.5" y="222.2" font-size="16" font-weight="normal" fill="#4c1d95" text-anchor="middle">correct outputs, even with</text><text x="330.5" y="242.2" font-size="16" font-weight="normal" fill="#4c1d95" text-anchor="middle">odd input</text><rect x="446.0" y="152.0" width="207.0" height="130.0" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.6"/><text x="549.5" y="202.2" font-size="16" font-weight="bold" fill="#374151" text-anchor="middle">Governance</text><text x="549.5" y="222.2" font-size="16" font-weight="normal" fill="#374151" text-anchor="middle">best practices across the</text><text x="549.5" y="242.2" font-size="16" font-weight="normal" fill="#374151" text-anchor="middle">AI supply chain</text><rect x="665.0" y="152.0" width="207.0" height="130.0" rx="8" fill="#1e3a8a" stroke="#1e3a8a" stroke-width="1.6"/><text x="768.5" y="202.2" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">Transparency</text><text x="768.5" y="222.2" font-size="16" font-weight="normal" fill="#ffffff" text-anchor="middle">informed choices about</text><text x="768.5" y="242.2" font-size="16" font-weight="normal" fill="#ffffff" text-anchor="middle">the system</text></svg>