<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 300" width="880" height="300" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">m02-ai-ladder</title><desc id="d">Three ways to get AI on AWS: ready-made AI services you call through an API, Amazon SageMaker AI to build your own models, and foundation models through Amazon Bedrock, with more control and more effort toward the bottom.</desc><defs><marker id="ah0" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker></defs><rect x="0.75" y="0.75" width="878.5" height="298.5" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><rect x="8.0" y="8.0" width="290.0" height="82.0" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="153.0" y="54.5" font-size="17" font-weight="bold" fill="#14532d" text-anchor="middle">Ready-made AI services</text><rect x="308.0" y="8.0" width="500.0" height="82.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="324.0" y="54.2" font-size="16" font-weight="normal" fill="#1f2937" text-anchor="start">Call an API: speech, text, images, documents. Least effort.</text><rect x="8.0" y="102.0" width="290.0" height="82.0" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="153.0" y="148.5" font-size="17" font-weight="bold" fill="#1e3a8a" text-anchor="middle">Amazon SageMaker AI</text><rect x="308.0" y="102.0" width="500.0" height="82.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="324.0" y="148.2" font-size="16" font-weight="normal" fill="#1f2937" text-anchor="start">Build, train and deploy your own ML models. Most control.</text><rect x="8.0" y="196.0" width="290.0" height="82.0" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.6"/><text x="153.0" y="231.9" font-size="17" font-weight="bold" fill="#4c1d95" text-anchor="middle">Amazon Bedrock and foundation</text><text x="153.0" y="253.2" font-size="17" font-weight="bold" fill="#4c1d95" text-anchor="middle">models</text><rect x="308.0" y="196.0" width="500.0" height="82.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="324.0" y="242.2" font-size="16" font-weight="normal" fill="#1f2937" text-anchor="start">Generative AI through one API: write, summarize, chat.</text><line x1="852.0" y1="20.0" x2="852.0" y2="270.0" stroke="#1f2937" stroke-width="2.6" marker-end="url(#ah0)"/><text x="842.0" y="148.0" transform="rotate(-90 842.0 148.0)" font-size="15" font-weight="bold" fill="#374151" text-anchor="middle">more control, more effort</text></svg>