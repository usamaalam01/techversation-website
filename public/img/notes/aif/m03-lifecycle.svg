<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 350" width="880" height="350" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">m03-lifecycle</title><desc id="d">Six phases of the ML lifecycle: business goal, problem framing, data processing, model development, deployment and monitoring, with feedback loops back to earlier phases.</desc><defs></defs><rect x="0.75" y="0.75" width="878.5" height="348.5" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><polygon points="8.0,8.0 268.0,8.0 288.0,37.0 268.0,66.0 8.0,66.0" fill="#dbeafe" stroke="#2563eb" stroke-width="1.8"/><text x="141.0" y="42.8" font-size="18" font-weight="bold" fill="#1e3a8a" text-anchor="middle">1 Business goal</text><rect x="10.0" y="70.0" width="266.0" height="64.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="18.0" y="106.9" font-size="15" font-weight="normal" fill="#1f2937" text-anchor="start">what value are we after?</text><polygon points="300.0,8.0 560.0,8.0 580.0,37.0 560.0,66.0 300.0,66.0 320.0,37.0" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.8"/><text x="440.0" y="42.8" font-size="18" font-weight="bold" fill="#134e4a" text-anchor="middle">2 Problem framing</text><rect x="302.0" y="70.0" width="266.0" height="64.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="310.0" y="106.9" font-size="15" font-weight="normal" fill="#1f2937" text-anchor="start">can ML solve it, and how?</text><polygon points="592.0,8.0 852.0,8.0 872.0,37.0 852.0,66.0 592.0,66.0 612.0,37.0" fill="#dcfce7" stroke="#16a34a" stroke-width="1.8"/><text x="732.0" y="42.8" font-size="18" font-weight="bold" fill="#14532d" text-anchor="middle">3 Data processing</text><rect x="594.0" y="70.0" width="266.0" height="64.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="602.0" y="106.9" font-size="15" font-weight="normal" fill="#1f2937" text-anchor="start">collect, clean, prepare</text><polygon points="8.0,146.0 268.0,146.0 288.0,175.0 268.0,204.0 8.0,204.0" fill="#fef3c7" stroke="#d97706" stroke-width="1.8"/><text x="141.0" y="180.8" font-size="18" font-weight="bold" fill="#78350f" text-anchor="middle">4 Model development</text><rect x="10.0" y="208.0" width="266.0" height="64.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="18.0" y="244.9" font-size="15" font-weight="normal" fill="#1f2937" text-anchor="start">train, tune, evaluate</text><polygon points="300.0,146.0 560.0,146.0 580.0,175.0 560.0,204.0 300.0,204.0 320.0,175.0" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.8"/><text x="440.0" y="180.8" font-size="18" font-weight="bold" fill="#4c1d95" text-anchor="middle">5 Deployment</text><rect x="302.0" y="208.0" width="266.0" height="64.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="310.0" y="244.9" font-size="15" font-weight="normal" fill="#1f2937" text-anchor="start">put the model to use</text><polygon points="592.0,146.0 852.0,146.0 872.0,175.0 852.0,204.0 592.0,204.0 612.0,175.0" fill="#fee2e2" stroke="#dc2626" stroke-width="1.8"/><text x="732.0" y="180.8" font-size="18" font-weight="bold" fill="#7f1d1d" text-anchor="middle">6 Monitoring</text><rect x="594.0" y="208.0" width="266.0" height="64.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="602.0" y="244.9" font-size="15" font-weight="normal" fill="#1f2937" text-anchor="start">watch quality and drift</text><rect x="8.0" y="282.0" width="864.0" height="54.0" rx="8" fill="#1e3a8a" stroke="#1e3a8a" stroke-width="1.6"/><text x="440.0" y="314.2" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">Feedback loops: monitoring sends results back to data processing and earlier phases</text></svg>