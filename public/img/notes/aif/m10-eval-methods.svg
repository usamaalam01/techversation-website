<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 252" width="880" height="252" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">m10-eval-methods</title><desc id="d">Four evaluation approaches in Amazon Bedrock: programmatic evaluation with built-in or custom datasets, human evaluation by a work team, a judge model that scores answers, and RAG evaluation of a knowledge base.</desc><defs></defs><rect x="0.75" y="0.75" width="878.5" height="250.5" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><rect x="8.0" y="8.0" width="207.0" height="52.0" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="111.5" y="39.8" font-size="18" font-weight="bold" fill="#1e3a8a" text-anchor="middle">Programmatic</text><rect x="8.0" y="66.0" width="207.0" height="170.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="111.5" y="135.3" font-size="17" font-weight="normal" fill="#1f2937" text-anchor="middle">computed scores on a</text><text x="111.5" y="156.5" font-size="17" font-weight="normal" fill="#1f2937" text-anchor="middle">built-in or custom</text><text x="111.5" y="177.8" font-size="17" font-weight="normal" fill="#1f2937" text-anchor="middle">dataset</text><rect x="227.0" y="8.0" width="207.0" height="52.0" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="330.5" y="39.8" font-size="18" font-weight="bold" fill="#14532d" text-anchor="middle">Human workers</text><rect x="227.0" y="66.0" width="207.0" height="170.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="330.5" y="145.9" font-size="17" font-weight="normal" fill="#1f2937" text-anchor="middle">employees or experts</text><text x="330.5" y="167.2" font-size="17" font-weight="normal" fill="#1f2937" text-anchor="middle">rate the answers</text><rect x="446.0" y="8.0" width="207.0" height="52.0" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.6"/><text x="549.5" y="39.8" font-size="18" font-weight="bold" fill="#4c1d95" text-anchor="middle">Judge model</text><rect x="446.0" y="66.0" width="207.0" height="170.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="549.5" y="135.3" font-size="17" font-weight="normal" fill="#1f2937" text-anchor="middle">a second model scores</text><text x="549.5" y="156.5" font-size="17" font-weight="normal" fill="#1f2937" text-anchor="middle">each answer and</text><text x="549.5" y="177.8" font-size="17" font-weight="normal" fill="#1f2937" text-anchor="middle">explains why</text><rect x="665.0" y="8.0" width="207.0" height="52.0" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="768.5" y="39.8" font-size="18" font-weight="bold" fill="#78350f" text-anchor="middle">RAG evaluation</text><rect x="665.0" y="66.0" width="207.0" height="170.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="768.5" y="135.3" font-size="17" font-weight="normal" fill="#1f2937" text-anchor="middle">checks a knowledge</text><text x="768.5" y="156.5" font-size="17" font-weight="normal" fill="#1f2937" text-anchor="middle">base for retrieval and</text><text x="768.5" y="177.8" font-size="17" font-weight="normal" fill="#1f2937" text-anchor="middle">answers</text></svg>