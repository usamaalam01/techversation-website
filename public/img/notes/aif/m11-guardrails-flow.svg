<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 232" width="880" height="232" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">m11-guardrails-flow</title><desc id="d">A guardrail checks the user input first and blocks it with a message if it breaks a policy; otherwise the model answers and the guardrail checks the response, which is blocked or masked if it breaks a policy, or returned unchanged.</desc><defs><marker id="ah0" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker></defs><rect x="0.75" y="0.75" width="878.5" height="230.5" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><polygon points="8.0,8.0 157.6,8.0 177.6,50.0 157.6,92.0 8.0,92.0" fill="#dbeafe" stroke="#2563eb" stroke-width="1.8"/><text x="85.8" y="55.1" font-size="16" font-weight="bold" fill="#1e3a8a" text-anchor="middle">User input</text><polygon points="181.6,8.0 331.2,8.0 351.2,50.0 331.2,92.0 181.6,92.0 201.6,50.0" fill="#fef3c7" stroke="#d97706" stroke-width="1.8"/><text x="266.4" y="35.9" font-size="16" font-weight="bold" fill="#78350f" text-anchor="middle">Guardrail</text><text x="266.4" y="55.1" font-size="16" font-weight="bold" fill="#78350f" text-anchor="middle">checks the</text><text x="266.4" y="74.3" font-size="16" font-weight="bold" fill="#78350f" text-anchor="middle">input</text><polygon points="355.2,8.0 504.8,8.0 524.8,50.0 504.8,92.0 355.2,92.0 375.2,50.0" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.8"/><text x="440.0" y="45.5" font-size="16" font-weight="bold" fill="#134e4a" text-anchor="middle">Foundation</text><text x="440.0" y="64.7" font-size="16" font-weight="bold" fill="#134e4a" text-anchor="middle">model</text><polygon points="528.8,8.0 678.4,8.0 698.4,50.0 678.4,92.0 528.8,92.0 548.8,50.0" fill="#fef3c7" stroke="#d97706" stroke-width="1.8"/><text x="613.6" y="35.9" font-size="16" font-weight="bold" fill="#78350f" text-anchor="middle">Guardrail</text><text x="613.6" y="55.1" font-size="16" font-weight="bold" fill="#78350f" text-anchor="middle">checks the</text><text x="613.6" y="74.3" font-size="16" font-weight="bold" fill="#78350f" text-anchor="middle">response</text><polygon points="702.4,8.0 852.0,8.0 872.0,50.0 852.0,92.0 702.4,92.0 722.4,50.0" fill="#dcfce7" stroke="#16a34a" stroke-width="1.8"/><text x="787.2" y="55.1" font-size="16" font-weight="bold" fill="#14532d" text-anchor="middle">Safe response</text><line x1="266.4" y1="96.0" x2="266.4" y2="142.0" stroke="#dc2626" stroke-width="2.6" marker-end="url(#ah0)"/><line x1="613.6" y1="96.0" x2="613.6" y2="142.0" stroke="#dc2626" stroke-width="2.6" marker-end="url(#ah0)"/><rect x="8.0" y="144.0" width="864.0" height="70.0" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.6"/><text x="440.0" y="184.5" font-size="17" font-weight="bold" fill="#7f1d1d" text-anchor="middle">If a policy is broken: the blocked message is returned, or sensitive text is masked</text></svg>