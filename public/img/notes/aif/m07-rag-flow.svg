<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 292" width="880" height="292" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">m07-rag-flow</title><desc id="d">How RAG works: the question is embedded, similar chunks are found in a vector store that was filled from your documents, the chunks are added to the prompt, and the foundation model writes the answer.</desc><defs></defs><rect x="0.75" y="0.75" width="878.5" height="290.5" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><polygon points="8.0,8.0 272.0,8.0 292.0,44.0 272.0,80.0 8.0,80.0" fill="#dbeafe" stroke="#2563eb" stroke-width="1.8"/><text x="143.0" y="49.8" font-size="18" font-weight="bold" fill="#1e3a8a" text-anchor="middle">1 Question</text><polygon points="298.0,8.0 562.0,8.0 582.0,44.0 562.0,80.0 298.0,80.0 318.0,44.0" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.8"/><text x="440.0" y="49.8" font-size="18" font-weight="bold" fill="#134e4a" text-anchor="middle">2 Embed the question</text><polygon points="588.0,8.0 852.0,8.0 872.0,44.0 852.0,80.0 588.0,80.0 608.0,44.0" fill="#dcfce7" stroke="#16a34a" stroke-width="1.8"/><text x="730.0" y="49.8" font-size="18" font-weight="bold" fill="#14532d" text-anchor="middle">3 Search the vector store</text><polygon points="8.0,96.0 272.0,96.0 292.0,132.0 272.0,168.0 8.0,168.0" fill="#fef3c7" stroke="#d97706" stroke-width="1.8"/><text x="143.0" y="137.8" font-size="18" font-weight="bold" fill="#78350f" text-anchor="middle">4 Retrieve the best chunks</text><polygon points="298.0,96.0 562.0,96.0 582.0,132.0 562.0,168.0 298.0,168.0 318.0,132.0" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.8"/><text x="440.0" y="127.0" font-size="18" font-weight="bold" fill="#4c1d95" text-anchor="middle">5 Add chunks to the</text><text x="440.0" y="148.6" font-size="18" font-weight="bold" fill="#4c1d95" text-anchor="middle">prompt</text><polygon points="588.0,96.0 852.0,96.0 872.0,132.0 852.0,168.0 588.0,168.0 608.0,132.0" fill="#fee2e2" stroke="#dc2626" stroke-width="1.8"/><text x="730.0" y="127.0" font-size="18" font-weight="bold" fill="#7f1d1d" text-anchor="middle">6 Foundation model writes</text><text x="730.0" y="148.6" font-size="18" font-weight="bold" fill="#7f1d1d" text-anchor="middle">the answer</text><rect x="8.0" y="192.0" width="864.0" height="80.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="440.0" y="227.2" font-size="16" font-weight="bold" fill="#1f2937" text-anchor="middle">The vector store is filled in advance from your documents</text><text x="440.0" y="247.2" font-size="16" font-weight="normal" fill="#1f2937" text-anchor="middle">documents are split into chunks, each chunk becomes an embedding</text></svg>