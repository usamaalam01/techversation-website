<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 232" width="880" height="232" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">m01-training-inference</title><desc id="d">Training turns data into a model once or from time to time; inference uses the model on new input every time it is needed.</desc><defs></defs><rect x="0.75" y="0.75" width="878.5" height="230.5" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><polygon points="8.0,8.0 199.5,8.0 219.5,41.0 199.5,74.0 8.0,74.0" fill="#dbeafe" stroke="#2563eb" stroke-width="1.8"/><text x="106.8" y="46.4" font-size="17" font-weight="bold" fill="#1e3a8a" text-anchor="middle">Data</text><polygon points="225.5,8.0 417.0,8.0 437.0,41.0 417.0,74.0 225.5,74.0 245.5,41.0" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.8"/><text x="331.2" y="46.4" font-size="17" font-weight="bold" fill="#134e4a" text-anchor="middle">Training</text><polygon points="443.0,8.0 634.5,8.0 654.5,41.0 634.5,74.0 443.0,74.0 463.0,41.0" fill="#dcfce7" stroke="#16a34a" stroke-width="1.8"/><text x="548.8" y="46.4" font-size="17" font-weight="bold" fill="#14532d" text-anchor="middle">Model</text><polygon points="660.5,8.0 852.0,8.0 872.0,41.0 852.0,74.0 660.5,74.0 680.5,41.0" fill="#fef3c7" stroke="#d97706" stroke-width="1.8"/><text x="766.2" y="36.2" font-size="17" font-weight="bold" fill="#78350f" text-anchor="middle">Inference +</text><text x="766.2" y="56.6" font-size="17" font-weight="bold" fill="#78350f" text-anchor="middle">predictions</text><rect x="8.0" y="96.0" width="420.0" height="112.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="218.0" y="147.2" font-size="16" font-weight="bold" fill="#1f2937" text-anchor="middle">Training</text><text x="218.0" y="167.2" font-size="16" font-weight="normal" fill="#1f2937" text-anchor="middle">happens before use: once, or from time to time</text><rect x="452.0" y="96.0" width="420.0" height="112.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="662.0" y="147.2" font-size="16" font-weight="bold" fill="#1f2937" text-anchor="middle">Inference</text><text x="662.0" y="167.2" font-size="16" font-weight="normal" fill="#1f2937" text-anchor="middle">happens at use: every time the model is needed</text></svg>