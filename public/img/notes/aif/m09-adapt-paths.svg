<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 330" width="880" height="330" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">m09-adapt-paths</title><desc id="d">A pre-trained foundation model can be adapted in four ways: fine-tuning with labeled prompt and response pairs, continued pre-training with unlabeled domain text, distillation from a larger teacher model, and RLHF with human rankings.</desc><defs><marker id="ah0" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker></defs><rect x="0.75" y="0.75" width="878.5" height="328.5" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><rect x="8.0" y="101.0" width="250.0" height="120.0" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="133.0" y="155.3" font-size="19" font-weight="bold" fill="#1e3a8a" text-anchor="middle">Pre-trained foundation</text><text x="133.0" y="179.1" font-size="19" font-weight="bold" fill="#1e3a8a" text-anchor="middle">model</text><rect x="360.0" y="8.0" width="512.0" height="66.0" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="616.0" y="35.9" font-size="17" font-weight="bold" fill="#78350f" text-anchor="middle">Fine-tuning</text><text x="616.0" y="57.1" font-size="17" font-weight="normal" fill="#78350f" text-anchor="middle">labeled prompt and response pairs</text><line x1="260.0" y1="161.0" x2="358.0" y2="41.0" stroke="#1f2937" stroke-width="2.4" marker-end="url(#ah0)"/><rect x="360.0" y="88.0" width="512.0" height="66.0" rx="8" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.6"/><text x="616.0" y="115.9" font-size="17" font-weight="bold" fill="#134e4a" text-anchor="middle">Continued pre-training</text><text x="616.0" y="137.2" font-size="17" font-weight="normal" fill="#134e4a" text-anchor="middle">unlabeled text from your domain</text><line x1="260.0" y1="161.0" x2="358.0" y2="121.0" stroke="#1f2937" stroke-width="2.4" marker-end="url(#ah0)"/><rect x="360.0" y="168.0" width="512.0" height="66.0" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.6"/><text x="616.0" y="195.9" font-size="17" font-weight="bold" fill="#4c1d95" text-anchor="middle">Distillation</text><text x="616.0" y="217.2" font-size="17" font-weight="normal" fill="#4c1d95" text-anchor="middle">responses from a larger teacher model</text><line x1="260.0" y1="161.0" x2="358.0" y2="201.0" stroke="#1f2937" stroke-width="2.4" marker-end="url(#ah0)"/><rect x="360.0" y="248.0" width="512.0" height="66.0" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="616.0" y="275.9" font-size="17" font-weight="bold" fill="#14532d" text-anchor="middle">RLHF</text><text x="616.0" y="297.1" font-size="17" font-weight="normal" fill="#14532d" text-anchor="middle">human rankings of answers</text><line x1="260.0" y1="161.0" x2="358.0" y2="281.0" stroke="#1f2937" stroke-width="2.4" marker-end="url(#ah0)"/></svg>