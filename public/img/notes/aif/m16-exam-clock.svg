<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 282" width="880" height="282" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">m16-exam-clock</title><desc id="d">The exam clock: sixty-five questions in ninety minutes is about eighty-three seconds each. Latest checkpoints: question twenty by minute twenty-eight, question forty by minute fifty-five and question sixty-five by minute eighty-five, then review.</desc><defs></defs><rect x="0.75" y="0.75" width="878.5" height="280.5" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><rect x="8.0" y="8.0" width="278.7" height="104.0" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="1.8"/><text x="147.3" y="62.1" font-size="44" font-weight="bold" fill="#1e3a8a" text-anchor="middle">65</text><text x="147.3" y="88.1" font-size="17" font-weight="normal" fill="#1e3a8a" text-anchor="middle">questions</text><rect x="300.7" y="8.0" width="278.7" height="104.0" rx="12" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.8"/><text x="440.0" y="62.1" font-size="44" font-weight="bold" fill="#134e4a" text-anchor="middle">90</text><text x="440.0" y="88.1" font-size="17" font-weight="normal" fill="#134e4a" text-anchor="middle">minutes</text><rect x="593.3" y="8.0" width="278.7" height="104.0" rx="12" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.8"/><text x="732.7" y="62.1" font-size="44" font-weight="bold" fill="#4c1d95" text-anchor="middle">83 s</text><text x="732.7" y="88.1" font-size="17" font-weight="normal" fill="#4c1d95" text-anchor="middle">per question, on average</text><rect x="8.0" y="128.0" width="278.7" height="74.0" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="147.3" y="159.9" font-size="17" font-weight="bold" fill="#14532d" text-anchor="middle">By minute 28</text><text x="147.3" y="181.2" font-size="17" font-weight="normal" fill="#14532d" text-anchor="middle">question 20</text><rect x="300.7" y="128.0" width="278.7" height="74.0" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="440.0" y="159.9" font-size="17" font-weight="bold" fill="#78350f" text-anchor="middle">By minute 55</text><text x="440.0" y="181.2" font-size="17" font-weight="normal" fill="#78350f" text-anchor="middle">question 40</text><rect x="593.3" y="128.0" width="278.7" height="74.0" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.6"/><text x="732.7" y="159.9" font-size="17" font-weight="bold" fill="#7f1d1d" text-anchor="middle">By minute 85</text><text x="732.7" y="181.2" font-size="17" font-weight="normal" fill="#7f1d1d" text-anchor="middle">question 65, then review</text><rect x="8.0" y="218.0" width="864.0" height="54.0" rx="8" fill="#1e3a8a" stroke="#1e3a8a" stroke-width="1.6"/><text x="440.0" y="250.5" font-size="17" font-weight="bold" fill="#ffffff" text-anchor="middle">Aim for about 70 seconds on a first pass; spare time is for the hard questions</text></svg>