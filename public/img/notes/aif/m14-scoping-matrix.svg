font-size="17" font-weight="normal" fill="#78350f" text-anchor="middle">Fine-tuned models</text><rect x="705.6" y="32.0" width="166.4" height="244.0" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.6"/><text x="788.8" y="148.9" font-size="17" font-weight="bold" fill="#7f1d1d" text-anchor="middle">Scope 5</text><text x="788.8" y="170.2" font-size="17" font-weight="normal" fill="#7f1d1d" text-anchor="middle">Self-trained models</text><line x1="12.0" y1="300.0" x2="868.0" y2="300.0" stroke="#1f2937" stroke-width="2.6" marker-end="url(#ah0)"/><text x="440.0" y="328.0" font-size="16" font-weight="bold" fill="#374151" text-anchor="middle">more ownership of the model and data, and more responsibility for you</text></svg>