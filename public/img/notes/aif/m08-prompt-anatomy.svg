<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 404" width="880" height="404" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">m08-prompt-anatomy</title><desc id="d">One prompt for summarizing a guest review, split into bands: instruction, context, input data, a demonstration example and a negative prompt, with the model's response underneath.</desc><defs><marker id="ah0" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker></defs><rect x="0.75" y="0.75" width="878.5" height="402.5" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><rect x="8.0" y="8.0" width="250.0" height="52.0" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="133.0" y="39.5" font-size="17" font-weight="bold" fill="#1e3a8a" text-anchor="middle">Instruction</text><rect x="268.0" y="8.0" width="604.0" height="52.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="284.0" y="39.2" font-size="16" font-weight="normal" fill="#1f2937" text-anchor="start">Summarize the guest review in two plain sentences.</text><rect x="8.0" y="68.0" width="250.0" height="52.0" rx="8" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.6"/><text x="133.0" y="99.5" font-size="17" font-weight="bold" fill="#134e4a" text-anchor="middle">Context</text><rect x="268.0" y="68.0" width="604.0" height="52.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="284.0" y="99.2" font-size="16" font-weight="normal" fill="#1f2937" text-anchor="start">You write for hotel managers at Cedar and Salt Travel.</text><rect x="8.0" y="128.0" width="250.0" height="52.0" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="133.0" y="159.5" font-size="17" font-weight="bold" fill="#14532d" text-anchor="middle">Input data</text><rect x="268.0" y="128.0" width="604.0" height="52.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="284.0" y="159.2" font-size="16" font-weight="normal" fill="#1f2937" text-anchor="start">The text of the guest review goes here.</text><rect x="8.0" y="188.0" width="250.0" height="52.0" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="133.0" y="219.5" font-size="17" font-weight="bold" fill="#78350f" text-anchor="middle">Demonstration example</text><rect x="268.0" y="188.0" width="604.0" height="52.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="284.0" y="219.2" font-size="16" font-weight="normal" fill="#1f2937" text-anchor="start">A sample review and the summary we would like.</text><rect x="8.0" y="248.0" width="250.0" height="52.0" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.6"/><text x="133.0" y="279.5" font-size="17" font-weight="bold" fill="#7f1d1d" text-anchor="middle">Negative prompt</text><rect x="268.0" y="248.0" width="604.0" height="52.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="284.0" y="279.2" font-size="16" font-weight="normal" fill="#1f2937" text-anchor="start">Do not mention the guest's name.</text><line x1="440.0" y1="310.0" x2="440.0" y2="332.0" stroke="#1f2937" stroke-width="2.6" marker-end="url(#ah0)"/><rect x="8.0" y="336.0" width="864.0" height="48.0" rx="8" fill="#1e3a8a" stroke="#1e3a8a" stroke-width="1.6"/><text x="440.0" y="365.2" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">The model's response: a short summary that follows all five parts</text></svg>