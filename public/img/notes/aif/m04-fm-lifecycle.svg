<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 360" width="880" height="360" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">m04-fm-lifecycle</title><desc id="d">The foundation model lifecycle: data selection, model selection, pre-training, fine-tuning, evaluation, deployment and feedback, with feedback leading back to earlier steps.</desc><defs></defs><rect x="0.75" y="0.75" width="878.5" height="358.5" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><polygon points="8.0,8.0 195.0,8.0 215.0,37.0 195.0,66.0 8.0,66.0" fill="#dbeafe" stroke="#2563eb" stroke-width="1.8"/><text x="104.5" y="42.4" font-size="17" font-weight="bold" fill="#1e3a8a" text-anchor="middle">1 Data selection</text><rect x="10.0" y="70.0" width="193.0" height="70.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="18.0" y="109.9" font-size="15" font-weight="normal" fill="#1f2937" text-anchor="start">choose what to learn from</text><polygon points="227.0,8.0 414.0,8.0 434.0,37.0 414.0,66.0 227.0,66.0 247.0,37.0" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.8"/><text x="330.5" y="42.4" font-size="17" font-weight="bold" fill="#134e4a" text-anchor="middle">2 Model selection</text><rect x="229.0" y="70.0" width="193.0" height="70.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="237.0" y="109.9" font-size="15" font-weight="normal" fill="#1f2937" text-anchor="start">pick the right base model</text><polygon points="446.0,8.0 633.0,8.0 653.0,37.0 633.0,66.0 446.0,66.0 466.0,37.0" fill="#dcfce7" stroke="#16a34a" stroke-width="1.8"/><text x="549.5" y="42.4" font-size="17" font-weight="bold" fill="#14532d" text-anchor="middle">3 Pre-training</text><rect x="448.0" y="70.0" width="193.0" height="70.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="456.0" y="109.9" font-size="15" font-weight="normal" fill="#1f2937" text-anchor="start">learn general patterns</text><polygon points="665.0,8.0 852.0,8.0 872.0,37.0 852.0,66.0 665.0,66.0 685.0,37.0" fill="#fef3c7" stroke="#d97706" stroke-width="1.8"/><text x="768.5" y="42.4" font-size="17" font-weight="bold" fill="#78350f" text-anchor="middle">4 Fine-tuning</text><rect x="667.0" y="70.0" width="193.0" height="70.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="675.0" y="109.9" font-size="15" font-weight="normal" fill="#1f2937" text-anchor="start">adapt to your task</text><polygon points="8.0,152.0 195.0,152.0 215.0,181.0 195.0,210.0 8.0,210.0" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.8"/><text x="104.5" y="186.4" font-size="17" font-weight="bold" fill="#4c1d95" text-anchor="middle">5 Evaluation</text><rect x="10.0" y="214.0" width="193.0" height="70.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="18.0" y="253.9" font-size="15" font-weight="normal" fill="#1f2937" text-anchor="start">test quality and safety</text><polygon points="227.0,152.0 414.0,152.0 434.0,181.0 414.0,210.0 227.0,210.0 247.0,181.0" fill="#fee2e2" stroke="#dc2626" stroke-width="1.8"/><text x="330.5" y="186.4" font-size="17" font-weight="bold" fill="#7f1d1d" text-anchor="middle">6 Deployment</text><rect x="229.0" y="214.0" width="193.0" height="70.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="237.0" y="253.9" font-size="15" font-weight="normal" fill="#1f2937" text-anchor="start">serve the model</text><polygon points="446.0,152.0 633.0,152.0 653.0,181.0 633.0,210.0 446.0,210.0 466.0,181.0" fill="#1e3a8a" stroke="#1e3a8a" stroke-width="1.8"/><text x="549.5" y="186.4" font-size="17" font-weight="bold" fill="#ffffff" text-anchor="middle">7 Feedback</text><rect x="448.0" y="214.0" width="193.0" height="70.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="456.0" y="253.9" font-size="15" font-weight="normal" fill="#1f2937" text-anchor="start">collect results and ratings</text><rect x="8.0" y="294.0" width="864.0" height="52.0" rx="8" fill="#1e3a8a" stroke="#1e3a8a" stroke-width="1.6"/><text x="440.0" y="325.2" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">Feedback leads back to data selection, model choice and fine-tuning</text></svg>