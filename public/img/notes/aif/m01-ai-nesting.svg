<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 330" width="880" height="330" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">m01-ai-nesting</title><desc id="d">Four nested boxes: AI contains machine learning, which contains deep learning, which contains generative AI.</desc><defs></defs><rect x="0.75" y="0.75" width="878.5" height="328.5" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><rect x="8.0" y="8.0" width="864.0" height="316.0" rx="14" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="26.0" y="36.0" font-size="17" font-weight="bold" fill="#1e3a8a" text-anchor="start">Artificial intelligence (AI)</text><text x="26.0" y="54.0" font-size="15" font-weight="normal" fill="#1e3a8a" text-anchor="start">machines that do tasks which normally need human intelligence</text><rect x="34.0" y="70.0" width="812.0" height="246.0" rx="14" fill="#ccfbf1" stroke="#0d9488" stroke-width="2"/><text x="52.0" y="98.0" font-size="17" font-weight="bold" fill="#134e4a" text-anchor="start">Machine learning (ML)</text><text x="52.0" y="116.0" font-size="15" font-weight="normal" fill="#134e4a" text-anchor="start">learns patterns from data instead of following fixed rules</text><rect x="60.0" y="132.0" width="760.0" height="176.0" rx="14" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/><text x="78.0" y="160.0" font-size="17" font-weight="bold" fill="#4c1d95" text-anchor="start">Deep learning</text><text x="78.0" y="178.0" font-size="15" font-weight="normal" fill="#4c1d95" text-anchor="start">ML with many-layer neural networks</text><rect x="86.0" y="194.0" width="708.0" height="106.0" rx="14" fill="#fef3c7" stroke="#d97706" stroke-width="2"/><text x="104.0" y="222.0" font-size="17" font-weight="bold" fill="#78350f" text-anchor="start">Generative AI</text><text x="104.0" y="240.0" font-size="15" font-weight="normal" fill="#78350f" text-anchor="start">deep learning that creates new text, images, code and more</text></svg>