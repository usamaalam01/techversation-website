<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 372" width="880" height="372" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">m07-customization-ladder</title><desc id="d">Five ways to customize generative AI from the cheapest to the most costly: prompt engineering, RAG, fine-tuning or continued pre-training, distillation, and pre-training a new model.</desc><defs><marker id="ah0" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker></defs><rect x="0.75" y="0.75" width="878.5" height="370.5" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><rect x="8.0" y="8.0" width="330.0" height="60.0" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="173.0" y="43.5" font-size="17" font-weight="bold" fill="#14532d" text-anchor="middle">Prompt engineering</text><rect x="348.0" y="8.0" width="460.0" height="60.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="364.0" y="43.2" font-size="16" font-weight="normal" fill="#1f2937" text-anchor="start">no training; pay for the tokens in longer prompts</text><rect x="8.0" y="78.0" width="330.0" height="60.0" rx="8" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.6"/><text x="173.0" y="113.5" font-size="17" font-weight="bold" fill="#134e4a" text-anchor="middle">RAG</text><rect x="348.0" y="78.0" width="460.0" height="60.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="364.0" y="113.2" font-size="16" font-weight="normal" fill="#1f2937" text-anchor="start">no training; adds embeddings, a vector store and retrieval</text><rect x="8.0" y="148.0" width="330.0" height="60.0" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="173.0" y="183.5" font-size="17" font-weight="bold" fill="#78350f" text-anchor="middle">Fine-tuning or continued pre-training</text><rect x="348.0" y="148.0" width="460.0" height="60.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="364.0" y="183.2" font-size="16" font-weight="normal" fill="#1f2937" text-anchor="start">training billed on tokens times epochs, plus storage</text><rect x="8.0" y="218.0" width="330.0" height="60.0" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.6"/><text x="173.0" y="253.5" font-size="17" font-weight="bold" fill="#4c1d95" text-anchor="middle">Distillation</text><rect x="348.0" y="218.0" width="460.0" height="60.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="364.0" y="253.2" font-size="16" font-weight="normal" fill="#1f2937" text-anchor="start">train once, then run a smaller, cheaper model</text><rect x="8.0" y="288.0" width="330.0" height="60.0" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.6"/><text x="173.0" y="323.5" font-size="17" font-weight="bold" fill="#7f1d1d" text-anchor="middle">Pre-training a model</text><rect x="348.0" y="288.0" width="460.0" height="60.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="364.0" y="323.2" font-size="16" font-weight="normal" fill="#1f2937" text-anchor="start">typically the highest resources and cost</text><line x1="852.0" y1="20.0" x2="852.0" y2="352.0" stroke="#1f2937" stroke-width="2.6" marker-end="url(#ah0)"/><text x="836.0" y="186.0" transform="rotate(-90 836.0 186.0)" font-size="15" font-weight="bold" fill="#1f2937" text-anchor="middle">more cost and more effort</text></svg>