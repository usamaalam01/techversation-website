<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 250" width="880" height="250" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">m01-fit</title><desc id="d">Three cards: an underfit model misses the pattern and has high bias; a good fit works on training data and new data; an overfit model memorizes the training data and has high variance.</desc><defs></defs><rect x="0.75" y="0.75" width="878.5" height="248.5" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><rect x="8.0" y="8.0" width="280.0" height="48.0" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="148.0" y="38.2" font-size="19" font-weight="bold" fill="#78350f" text-anchor="middle">Underfit</text><rect x="8.0" y="62.0" width="280.0" height="178.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="148.0" y="124.7" font-size="17" font-weight="bold" fill="#1f2937" text-anchor="middle">Misses the pattern in the data.</text><text x="148.0" y="145.9" font-size="17" font-weight="bold" fill="#1f2937" text-anchor="middle">High bias.</text><text x="148.0" y="167.2" font-size="17" font-weight="normal" fill="#1f2937" text-anchor="middle">Poor on training data and on new</text><text x="148.0" y="188.4" font-size="17" font-weight="normal" fill="#1f2937" text-anchor="middle">data</text><rect x="300.0" y="8.0" width="280.0" height="48.0" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="440.0" y="38.2" font-size="19" font-weight="bold" fill="#14532d" text-anchor="middle">Good fit</text><rect x="300.0" y="62.0" width="280.0" height="178.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="440.0" y="124.7" font-size="17" font-weight="bold" fill="#1f2937" text-anchor="middle">Learns the pattern, not the</text><text x="440.0" y="145.9" font-size="17" font-weight="bold" fill="#1f2937" text-anchor="middle">noise.</text><text x="440.0" y="167.2" font-size="17" font-weight="normal" fill="#1f2937" text-anchor="middle">Works on training data and on</text><text x="440.0" y="188.4" font-size="17" font-weight="normal" fill="#1f2937" text-anchor="middle">new data</text><rect x="592.0" y="8.0" width="280.0" height="48.0" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.6"/><text x="732.0" y="38.2" font-size="19" font-weight="bold" fill="#7f1d1d" text-anchor="middle">Overfit</text><rect x="592.0" y="62.0" width="280.0" height="178.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="732.0" y="124.7" font-size="17" font-weight="bold" fill="#1f2937" text-anchor="middle">Memorizes the training data.</text><text x="732.0" y="145.9" font-size="17" font-weight="bold" fill="#1f2937" text-anchor="middle">High variance.</text><text x="732.0" y="167.2" font-size="17" font-weight="normal" fill="#1f2937" text-anchor="middle">Great on training data, poor on</text><text x="732.0" y="188.4" font-size="17" font-weight="normal" fill="#1f2937" text-anchor="middle">new data</text></svg>