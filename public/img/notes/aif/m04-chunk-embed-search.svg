<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 214" width="880" height="214" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">m04-chunk-embed-search</title><desc id="d">Documents are split into chunks, each chunk is turned into an embedding, the embeddings are stored in a vector index, and a question is matched to the closest chunks by similarity search.</desc><defs><marker id="ah0" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker></defs><rect x="0.75" y="0.75" width="878.5" height="212.5" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><polygon points="8.0,8.0 157.6,8.0 177.6,46.0 157.6,84.0 8.0,84.0" fill="#dbeafe" stroke="#2563eb" stroke-width="1.8"/><text x="85.8" y="51.4" font-size="17" font-weight="bold" fill="#1e3a8a" text-anchor="middle">Documents</text><polygon points="181.6,8.0 331.2,8.0 351.2,46.0 331.2,84.0 181.6,84.0 201.6,46.0" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.8"/><text x="266.4" y="51.4" font-size="17" font-weight="bold" fill="#134e4a" text-anchor="middle">Chunks</text><polygon points="355.2,8.0 504.8,8.0 524.8,46.0 504.8,84.0 355.2,84.0 375.2,46.0" fill="#dcfce7" stroke="#16a34a" stroke-width="1.8"/><text x="440.0" y="51.4" font-size="17" font-weight="bold" fill="#14532d" text-anchor="middle">Embeddings</text><polygon points="528.8,8.0 678.4,8.0 698.4,46.0 678.4,84.0 528.8,84.0 548.8,46.0" fill="#fef3c7" stroke="#d97706" stroke-width="1.8"/><text x="613.6" y="51.4" font-size="17" font-weight="bold" fill="#78350f" text-anchor="middle">Vector index</text><polygon points="702.4,8.0 852.0,8.0 872.0,46.0 852.0,84.0 702.4,84.0 722.4,46.0" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.8"/><text x="787.2" y="41.2" font-size="17" font-weight="bold" fill="#4c1d95" text-anchor="middle">Similarity</text><text x="787.2" y="61.6" font-size="17" font-weight="bold" fill="#4c1d95" text-anchor="middle">search</text><line x1="787.2" y1="150.0" x2="787.2" y2="90.0" stroke="#1f2937" stroke-width="2.6" marker-end="url(#ah0)"/><rect x="457.2" y="150.0" width="404.8" height="54.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="659.6" y="172.2" font-size="16" font-weight="bold" fill="#1f2937" text-anchor="middle">A question is embedded too, and matched to the</text><text x="659.6" y="192.2" font-size="16" font-weight="bold" fill="#1f2937" text-anchor="middle">closest chunks</text></svg>