<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 332" width="880" height="332" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">m03-envelope-encryption</title><desc id="d">Envelope encryption: KMS generates a data key, the plaintext data key encrypts the data, the encrypted data key is stored beside the encrypted data, and to read it KMS decrypts the data key first.</desc><defs><marker id="ah0" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker><marker id="ah1" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6d28d9"/></marker></defs><rect x="0.75" y="0.75" width="878.5" height="330.5" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><rect x="330.0" y="8.0" width="220.0" height="62.0" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.6"/><text x="440.0" y="34.5" font-size="15" font-weight="bold" fill="#4c1d95" text-anchor="middle">KMS key</text><text x="440.0" y="53.2" font-size="15" font-weight="normal" fill="#4c1d95" text-anchor="middle">never leaves KMS</text><rect x="8.0" y="130.0" width="250.0" height="90.0" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="133.0" y="161.1" font-size="15" font-weight="bold" fill="#78350f" text-anchor="middle">Data key</text><text x="133.0" y="179.9" font-size="15" font-weight="normal" fill="#78350f" text-anchor="middle">a plaintext copy and an encrypted</text><text x="133.0" y="198.6" font-size="15" font-weight="normal" fill="#78350f" text-anchor="middle">copy</text><rect x="300.0" y="130.0" width="250.0" height="90.0" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="425.0" y="161.1" font-size="15" font-weight="bold" fill="#1e3a8a" text-anchor="middle">Encrypt the data</text><text x="425.0" y="179.9" font-size="15" font-weight="normal" fill="#1e3a8a" text-anchor="middle">with the plaintext data key, then</text><text x="425.0" y="198.6" font-size="15" font-weight="normal" fill="#1e3a8a" text-anchor="middle">discard it</text><rect x="592.0" y="130.0" width="280.0" height="90.0" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="732.0" y="170.5" font-size="15" font-weight="bold" fill="#14532d" text-anchor="middle">Store together</text><text x="732.0" y="189.2" font-size="15" font-weight="normal" fill="#14532d" text-anchor="middle">encrypted data and encrypted data key</text><line x1="380.0" y1="72.0" x2="170.0" y2="128.0" stroke="#1f2937" stroke-width="2.4" marker-end="url(#ah0)"/><text x="150.0" y="96.0" font-size="14" font-weight="bold" fill="#1f2937" text-anchor="middle">GenerateDataKey</text><line x1="260.0" y1="175.0" x2="298.0" y2="175.0" stroke="#1f2937" stroke-width="2.4" marker-end="url(#ah0)"/><line x1="552.0" y1="175.0" x2="590.0" y2="175.0" stroke="#1f2937" stroke-width="2.4" marker-end="url(#ah0)"/><line x1="760.0" y1="128.0" x2="552.0" y2="52.0" stroke="#6d28d9" stroke-width="2.4" stroke-dasharray="7 5" marker-end="url(#ah1)"/><text x="700.0" y="76.0" font-size="14" font-weight="bold" fill="#6d28d9" text-anchor="middle">Decrypt the data key</text><rect x="8.0" y="252.0" width="864.0" height="66.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="440.0" y="290.2" font-size="16" font-weight="bold" fill="#1f2937" text-anchor="middle">To read: send the encrypted data key to KMS, receive the plaintext key, then decrypt the data</text></svg>