<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 282" width="880" height="282" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">m13-backup-retention</title><desc id="d">Database backup retention on a timeline: automated backups allow point-in-time recovery inside the retention period and are deleted after it, manual snapshots stay until deleted so old ones should be removed, and long-term copies can move to cold storage.</desc><defs></defs><rect x="0.75" y="0.75" width="878.5" height="280.5" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><line x1="20.0" y1="96.0" x2="860.0" y2="96.0" stroke="#6b7280" stroke-width="3"/><circle cx="70.0" cy="96.0" r="11" fill="#dcfce7" stroke="#16a34a" stroke-width="2.6"/><text x="70.0" y="62.0" font-size="15" font-weight="bold" fill="#14532d" text-anchor="middle">Backup taken</text><circle cx="300.0" cy="96.0" r="11" fill="#fee2e2" stroke="#dc2626" stroke-width="2.6"/><text x="300.0" y="62.0" font-size="15" font-weight="bold" fill="#7f1d1d" text-anchor="middle">Retention ends</text><circle cx="450.0" cy="96.0" r="11" fill="#fef3c7" stroke="#d97706" stroke-width="2.6"/><text x="450.0" y="62.0" font-size="15" font-weight="bold" fill="#78350f" text-anchor="middle">Manual snapshot</text><circle cx="740.0" cy="96.0" r="11" fill="#f3f4f6" stroke="#9ca3af" stroke-width="2.6"/><text x="740.0" y="62.0" font-size="15" font-weight="bold" fill="#374151" text-anchor="middle">Archive step</text><rect x="70.0" y="90.0" width="230.0" height="12.0" rx="4" fill="#bbf7d0" stroke="#16a34a" stroke-width="1.4"/><rect x="8.0" y="140.0" width="304.0" height="124.0" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="160.0" y="188.1" font-size="15" font-weight="bold" fill="#14532d" text-anchor="middle">Automated backups</text><text x="160.0" y="206.9" font-size="15" font-weight="normal" fill="#14532d" text-anchor="middle">point-in-time recovery inside the retention</text><text x="160.0" y="225.6" font-size="15" font-weight="normal" fill="#14532d" text-anchor="middle">period; older backups are deleted</text><rect x="330.0" y="140.0" width="270.0" height="124.0" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="465.0" y="188.1" font-size="15" font-weight="bold" fill="#78350f" text-anchor="middle">Manual snapshots</text><text x="465.0" y="206.9" font-size="15" font-weight="normal" fill="#78350f" text-anchor="middle">kept until you delete them, so remove</text><text x="465.0" y="225.6" font-size="15" font-weight="normal" fill="#78350f" text-anchor="middle">the ones you no longer need</text><rect x="618.0" y="140.0" width="254.0" height="124.0" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.6"/><text x="745.0" y="178.8" font-size="15" font-weight="bold" fill="#374151" text-anchor="middle">Archive</text><text x="745.0" y="197.5" font-size="15" font-weight="normal" fill="#374151" text-anchor="middle">move long-term copies to cold</text><text x="745.0" y="216.2" font-size="15" font-weight="normal" fill="#374151" text-anchor="middle">storage and expire them on</text><text x="745.0" y="235.0" font-size="15" font-weight="normal" fill="#374151" text-anchor="middle">schedule</text></svg>