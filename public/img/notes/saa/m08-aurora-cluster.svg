<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 334" width="880" height="334" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">m08-aurora-cluster</title><desc id="d">An Aurora cluster: one writer instance and readers spread across three Availability Zones sit above one shared storage volume with six copies across three zones; the cluster endpoint points at the writer and the reader endpoint spreads across the readers.</desc><defs><marker id="ah0" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker></defs><rect x="0.75" y="0.75" width="878.5" height="332.5" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><rect x="8.0" y="6.0" width="280.0" height="42.0" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.6"/><text x="148.0" y="31.9" font-size="15" font-weight="bold" fill="#4c1d95" text-anchor="middle">Cluster endpoint: the writer</text><rect x="300.0" y="6.0" width="572.0" height="42.0" rx="8" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.6"/><text x="586.0" y="31.9" font-size="15" font-weight="bold" fill="#134e4a" text-anchor="middle">Reader endpoint: spreads across the readers</text><rect x="8.0" y="58.0" width="280.0" height="176.0" rx="10" fill="none" stroke="#2563eb" stroke-width="1.8" stroke-dasharray="6 4"/><text x="20.0" y="78.0" font-size="14" font-weight="bold" fill="#1e3a8a" text-anchor="start">Availability Zone A</text><rect x="22.0" y="92.0" width="252.0" height="58.0" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.6"/><text x="148.0" y="125.9" font-size="15" font-weight="bold" fill="#4c1d95" text-anchor="middle">Writer instance</text><line x1="148.0" y1="150.0" x2="148.0" y2="162.0" stroke="#1f2937" stroke-width="2.2" marker-end="url(#ah0)"/><rect x="22.0" y="162.0" width="252.0" height="58.0" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="148.0" y="195.9" font-size="15" font-weight="bold" fill="#1e3a8a" text-anchor="middle">Reader instance</text><line x1="148.0" y1="220.0" x2="148.0" y2="252.0" stroke="#1f2937" stroke-width="2.2" marker-end="url(#ah0)"/><rect x="300.0" y="58.0" width="280.0" height="176.0" rx="10" fill="none" stroke="#2563eb" stroke-width="1.8" stroke-dasharray="6 4"/><text x="312.0" y="78.0" font-size="14" font-weight="bold" fill="#1e3a8a" text-anchor="start">Availability Zone B</text><rect x="314.0" y="92.0" width="252.0" height="58.0" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="440.0" y="125.9" font-size="15" font-weight="bold" fill="#1e3a8a" text-anchor="middle">Reader instance</text><line x1="440.0" y1="150.0" x2="440.0" y2="252.0" stroke="#1f2937" stroke-width="2.2" marker-end="url(#ah0)"/><rect x="592.0" y="58.0" width="280.0" height="176.0" rx="10" fill="none" stroke="#2563eb" stroke-width="1.8" stroke-dasharray="6 4"/><text x="604.0" y="78.0" font-size="14" font-weight="bold" fill="#1e3a8a" text-anchor="start">Availability Zone C</text><rect x="606.0" y="92.0" width="252.0" height="58.0" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="732.0" y="125.9" font-size="15" font-weight="bold" fill="#1e3a8a" text-anchor="middle">Reader instance</text><line x1="732.0" y1="150.0" x2="732.0" y2="252.0" stroke="#1f2937" stroke-width="2.2" marker-end="url(#ah0)"/><rect x="8.0" y="252.0" width="864.0" height="70.0" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.6"/><text x="440.0" y="282.2" font-size="16" font-weight="bold" fill="#374151" text-anchor="middle">Shared storage volume</text><text x="440.0" y="302.2" font-size="16" font-weight="normal" fill="#374151" text-anchor="middle">six copies across three Availability Zones, grows automatically</text></svg>