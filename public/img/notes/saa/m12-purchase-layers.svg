<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 330" width="880" height="330" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">m12-purchase-layers</title><desc id="d">Layered purchase options over a daily demand curve: a Savings Plan or Reserved Instance covers the steady baseline at the bottom, On-Demand covers predictable peaks in the middle, and Spot covers restartable bursts at the top; commit to the minimum you always use.</desc><defs><marker id="ah0" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker></defs><rect x="0.75" y="0.75" width="878.5" height="328.5" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><rect x="100.0" y="8.0" width="760.0" height="50.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="480.0" y="38.2" font-size="16" font-weight="bold" fill="#1f2937" text-anchor="middle">Commit to the minimum you always use; let the layers above flex with demand</text><rect x="8.0" y="236.0" width="186.0" height="68.0" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="101.0" y="256.1" font-size="15" font-weight="bold" fill="#1e3a8a" text-anchor="middle">Steady baseline:</text><text x="101.0" y="274.9" font-size="15" font-weight="bold" fill="#1e3a8a" text-anchor="middle">Savings Plans or</text><text x="101.0" y="293.6" font-size="15" font-weight="bold" fill="#1e3a8a" text-anchor="middle">Reserved Instances</text><rect x="210.0" y="236.0" width="650.0" height="68.0" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><rect x="8.0" y="166.0" width="186.0" height="68.0" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="101.0" y="195.5" font-size="15" font-weight="bold" fill="#78350f" text-anchor="middle">Predictable peaks:</text><text x="101.0" y="214.2" font-size="15" font-weight="bold" fill="#78350f" text-anchor="middle">On-Demand</text><rect x="210.0" y="166.0" width="650.0" height="68.0" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><rect x="8.0" y="96.0" width="186.0" height="68.0" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="101.0" y="125.5" font-size="15" font-weight="bold" fill="#14532d" text-anchor="middle">Restartable bursts:</text><text x="101.0" y="144.2" font-size="15" font-weight="bold" fill="#14532d" text-anchor="middle">Spot Instances</text><rect x="210.0" y="96.0" width="650.0" height="68.0" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><polyline points="210.0,296.0 290.0,282.0 370.0,222.0 450.0,140.0 520.0,112.0 600.0,150.0 690.0,226.0 780.0,274.0 860.0,288.0" fill="none" stroke="#b91c1c" stroke-width="3.4" stroke-linejoin="round" stroke-linecap="round"/><text x="640.0" y="118.0" font-size="15" font-weight="bold" fill="#b91c1c" text-anchor="start">daily demand</text><line x1="206.0" y1="306.0" x2="870.0" y2="306.0" stroke="#1f2937" stroke-width="2.2" marker-end="url(#ah0)"/><text x="540.0" y="324.0" font-size="14" font-weight="bold" fill="#6b7280" text-anchor="middle">time of day</text></svg>