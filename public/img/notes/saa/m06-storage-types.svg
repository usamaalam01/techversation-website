<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 198" width="880" height="198" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">m06-storage-types</title><desc id="d">Three storage types: block storage like EBS and instance store is a disk for one instance, file storage like EFS and FSx is a shared file system, and object storage like S3 holds objects by key over an API.</desc><defs></defs><rect x="0.75" y="0.75" width="878.5" height="196.5" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><rect x="8.0" y="8.0" width="278.7" height="180.0" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="147.3" y="82.3" font-size="17" font-weight="bold" fill="#1e3a8a" text-anchor="middle">Block</text><text x="147.3" y="103.5" font-size="17" font-weight="normal" fill="#1e3a8a" text-anchor="middle">EBS and instance store: a disk for</text><text x="147.3" y="124.8" font-size="17" font-weight="normal" fill="#1e3a8a" text-anchor="middle">one instance, in one zone</text><rect x="300.7" y="8.0" width="278.7" height="180.0" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="440.0" y="82.3" font-size="17" font-weight="bold" fill="#14532d" text-anchor="middle">File</text><text x="440.0" y="103.5" font-size="17" font-weight="normal" fill="#14532d" text-anchor="middle">EFS and FSx: a shared file</text><text x="440.0" y="124.8" font-size="17" font-weight="normal" fill="#14532d" text-anchor="middle">system many servers mount</text><rect x="593.3" y="8.0" width="278.7" height="180.0" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="732.7" y="82.3" font-size="17" font-weight="bold" fill="#78350f" text-anchor="middle">Object</text><text x="732.7" y="103.5" font-size="17" font-weight="normal" fill="#78350f" text-anchor="middle">S3: objects by key over an API, at</text><text x="732.7" y="124.8" font-size="17" font-weight="normal" fill="#78350f" text-anchor="middle">internet scale</text></svg>