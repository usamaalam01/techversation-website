<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 384" width="880" height="384" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">m11-s3-classes</title><desc id="d">S3 storage classes as descending steps from hot to cold: Standard for frequent access, Intelligent Tiering for unknown patterns, Standard IA for monthly access, One Zone IA for re-creatable monthly access, Glacier Instant Retrieval for quarterly access, Glacier Flexible Retrieval for yearly access and Glacier Deep Archive for rare access, with storage price falling and retrieval cost and minimum storage time rising.</desc><defs><marker id="ah0" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker></defs><rect x="0.75" y="0.75" width="878.5" height="382.5" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><rect x="8.0" y="10.0" width="120.0" height="150.0" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.6"/><text x="68.0" y="80.8" font-size="14" font-weight="bold" fill="#7f1d1d" text-anchor="middle">Standard</text><text x="68.0" y="98.3" font-size="14" font-weight="normal" fill="#7f1d1d" text-anchor="middle">frequent access</text><rect x="132.0" y="40.0" width="120.0" height="150.0" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="192.0" y="102.0" font-size="14" font-weight="bold" fill="#78350f" text-anchor="middle">Intelligent</text><text x="192.0" y="119.5" font-size="14" font-weight="bold" fill="#78350f" text-anchor="middle">Tiering</text><text x="192.0" y="137.1" font-size="14" font-weight="normal" fill="#78350f" text-anchor="middle">unknown pattern</text><rect x="256.0" y="70.0" width="120.0" height="150.0" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="316.0" y="140.8" font-size="14" font-weight="bold" fill="#78350f" text-anchor="middle">Standard IA</text><text x="316.0" y="158.3" font-size="14" font-weight="normal" fill="#78350f" text-anchor="middle">monthly access</text><rect x="380.0" y="100.0" width="120.0" height="150.0" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="440.0" y="162.1" font-size="14" font-weight="bold" fill="#78350f" text-anchor="middle">One Zone IA</text><text x="440.0" y="179.6" font-size="14" font-weight="normal" fill="#78350f" text-anchor="middle">re-creatable,</text><text x="440.0" y="197.1" font-size="14" font-weight="normal" fill="#78350f" text-anchor="middle">monthly</text><rect x="504.0" y="130.0" width="120.0" height="150.0" rx="8" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.6"/><text x="564.0" y="192.1" font-size="14" font-weight="bold" fill="#134e4a" text-anchor="middle">Glacier Instant</text><text x="564.0" y="209.6" font-size="14" font-weight="bold" fill="#134e4a" text-anchor="middle">Retrieval</text><text x="564.0" y="227.1" font-size="14" font-weight="normal" fill="#134e4a" text-anchor="middle">quarterly access</text><rect x="628.0" y="160.0" width="120.0" height="150.0" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="688.0" y="213.3" font-size="14" font-weight="bold" fill="#1e3a8a" text-anchor="middle">Glacier Flexible</text><text x="688.0" y="230.8" font-size="14" font-weight="bold" fill="#1e3a8a" text-anchor="middle">Retrieval</text><text x="688.0" y="248.3" font-size="14" font-weight="normal" fill="#1e3a8a" text-anchor="middle">once or twice a</text><text x="688.0" y="265.8" font-size="14" font-weight="normal" fill="#1e3a8a" text-anchor="middle">year</text><rect x="752.0" y="190.0" width="120.0" height="150.0" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.6"/><text x="812.0" y="252.1" font-size="14" font-weight="bold" fill="#4c1d95" text-anchor="middle">Glacier Deep</text><text x="812.0" y="269.6" font-size="14" font-weight="bold" fill="#4c1d95" text-anchor="middle">Archive</text><text x="812.0" y="287.1" font-size="14" font-weight="normal" fill="#4c1d95" text-anchor="middle">rarely, if ever</text><line x1="8.0" y1="346.0" x2="864.0" y2="346.0" stroke="#1f2937" stroke-width="2.6" marker-end="url(#ah0)"/><text x="436.0" y="372.0" font-size="15" font-weight="bold" fill="#1e3a8a" text-anchor="middle">lower storage price, but higher retrieval cost and longer minimum storage time</text></svg>