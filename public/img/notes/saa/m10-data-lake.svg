<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 332" width="880" height="332" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">m10-data-lake</title><desc id="d">A data lake on S3: sources feed an S3 bucket with raw and curated zones, the Glue Data Catalog and Lake Formation form a governance layer above the bucket, and query and visualization engines read from it.</desc><defs><marker id="ah0" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker></defs><rect x="0.75" y="0.75" width="878.5" height="330.5" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><rect x="8.0" y="100.0" width="160.0" height="130.0" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="88.0" y="151.1" font-size="15" font-weight="bold" fill="#1e3a8a" text-anchor="middle">Sources</text><text x="88.0" y="169.9" font-size="15" font-weight="normal" fill="#1e3a8a" text-anchor="middle">databases, logs,</text><text x="88.0" y="188.6" font-size="15" font-weight="normal" fill="#1e3a8a" text-anchor="middle">streams, files</text><rect x="214.0" y="8.0" width="440.0" height="316.0" rx="10" fill="none" stroke="#0d9488" stroke-width="1.8" stroke-dasharray="6 4"/><text x="226.0" y="29.0" font-size="15" font-weight="bold" fill="#134e4a" text-anchor="start">S3 data lake bucket</text><rect x="230.0" y="44.0" width="408.0" height="66.0" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.6"/><text x="434.0" y="72.5" font-size="15" font-weight="bold" fill="#4c1d95" text-anchor="middle">Governance layer</text><text x="434.0" y="91.2" font-size="15" font-weight="normal" fill="#4c1d95" text-anchor="middle">Glue Data Catalog and Lake Formation</text><rect x="230.0" y="150.0" width="190.0" height="90.0" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="325.0" y="190.5" font-size="15" font-weight="bold" fill="#78350f" text-anchor="middle">Raw zone</text><text x="325.0" y="209.2" font-size="15" font-weight="normal" fill="#78350f" text-anchor="middle">data as it arrives</text><rect x="448.0" y="150.0" width="190.0" height="90.0" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="543.0" y="181.1" font-size="15" font-weight="bold" fill="#14532d" text-anchor="middle">Curated zone</text><text x="543.0" y="199.9" font-size="15" font-weight="normal" fill="#14532d" text-anchor="middle">cleaned, partitioned</text><text x="543.0" y="218.6" font-size="15" font-weight="normal" fill="#14532d" text-anchor="middle">Parquet</text><line x1="422.0" y1="195.0" x2="446.0" y2="195.0" stroke="#1f2937" stroke-width="2.4" marker-end="url(#ah0)"/><text x="434.0" y="282.0" font-size="14" font-weight="bold" fill="#374151" text-anchor="middle">schema and permissions apply across the zones</text><line x1="170.0" y1="165.0" x2="212.0" y2="165.0" stroke="#1f2937" stroke-width="2.4" marker-end="url(#ah0)"/><rect x="700.0" y="60.0" width="172.0" height="110.0" rx="8" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.6"/><text x="786.0" y="101.1" font-size="15" font-weight="bold" fill="#134e4a" text-anchor="middle">Query</text><text x="786.0" y="119.9" font-size="15" font-weight="normal" fill="#134e4a" text-anchor="middle">Athena, Redshift</text><text x="786.0" y="138.6" font-size="15" font-weight="normal" fill="#134e4a" text-anchor="middle">Spectrum, EMR</text><rect x="700.0" y="190.0" width="172.0" height="90.0" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.6"/><text x="786.0" y="230.5" font-size="15" font-weight="bold" fill="#374151" text-anchor="middle">Visualize</text><text x="786.0" y="249.2" font-size="15" font-weight="normal" fill="#374151" text-anchor="middle">Quick</text><line x1="656.0" y1="115.0" x2="698.0" y2="115.0" stroke="#1f2937" stroke-width="2.4" marker-end="url(#ah0)"/><line x1="656.0" y1="235.0" x2="698.0" y2="235.0" stroke="#1f2937" stroke-width="2.4" marker-end="url(#ah0)"/></svg>