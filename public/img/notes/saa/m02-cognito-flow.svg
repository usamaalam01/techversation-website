<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 208" width="880" height="208" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">m02-cognito-flow</title><desc id="d">Cognito sign-in flow: the user signs in to a user pool, the user pool issues tokens, an identity pool exchanges the token with STS for temporary credentials, and the app calls S3 with those credentials.</desc><defs></defs><rect x="0.75" y="0.75" width="878.5" height="206.5" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><polygon points="8.0,8.0 195.0,8.0 215.0,39.0 195.0,70.0 8.0,70.0" fill="#dbeafe" stroke="#2563eb" stroke-width="1.8"/><text x="104.5" y="44.4" font-size="17" font-weight="bold" fill="#1e3a8a" text-anchor="middle">1 User signs in</text><rect x="10.0" y="74.0" width="193.0" height="118.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="18.0" y="128.8" font-size="14" font-weight="normal" fill="#1f2937" text-anchor="start">to the user pool, or through</text><text x="18.0" y="146.3" font-size="14" font-weight="normal" fill="#1f2937" text-anchor="start">a social or SAML provider</text><polygon points="227.0,8.0 414.0,8.0 434.0,39.0 414.0,70.0 227.0,70.0 247.0,39.0" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.8"/><text x="330.5" y="44.4" font-size="17" font-weight="bold" fill="#134e4a" text-anchor="middle">2 Tokens issued</text><rect x="229.0" y="74.0" width="193.0" height="118.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="237.0" y="128.8" font-size="14" font-weight="normal" fill="#1f2937" text-anchor="start">the user pool returns ID,</text><text x="237.0" y="146.3" font-size="14" font-weight="normal" fill="#1f2937" text-anchor="start">access and refresh tokens</text><polygon points="446.0,8.0 633.0,8.0 653.0,39.0 633.0,70.0 446.0,70.0 466.0,39.0" fill="#dcfce7" stroke="#16a34a" stroke-width="1.8"/><text x="549.5" y="44.4" font-size="17" font-weight="bold" fill="#14532d" text-anchor="middle">3 Credentials</text><rect x="448.0" y="74.0" width="193.0" height="118.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="456.0" y="120.0" font-size="14" font-weight="normal" fill="#1f2937" text-anchor="start">the identity pool trades a</text><text x="456.0" y="137.6" font-size="14" font-weight="normal" fill="#1f2937" text-anchor="start">token with STS for</text><text x="456.0" y="155.1" font-size="14" font-weight="normal" fill="#1f2937" text-anchor="start">temporary keys</text><polygon points="665.0,8.0 852.0,8.0 872.0,39.0 852.0,70.0 665.0,70.0 685.0,39.0" fill="#fef3c7" stroke="#d97706" stroke-width="1.8"/><text x="768.5" y="44.4" font-size="17" font-weight="bold" fill="#78350f" text-anchor="middle">4 App calls AWS</text><rect x="667.0" y="74.0" width="193.0" height="118.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="675.0" y="128.8" font-size="14" font-weight="normal" fill="#1f2937" text-anchor="start">the app reaches S3 with</text><text x="675.0" y="146.3" font-size="14" font-weight="normal" fill="#1f2937" text-anchor="start">those temporary credentials</text></svg>