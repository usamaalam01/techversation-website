<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 326" width="880" height="326" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">m14-endpoint-path</title><desc id="d">A private subnet reaching S3: the route table sends S3 and DynamoDB traffic through a gateway endpoint with no additional charge, and all other internet traffic through a NAT gateway billed hourly and per gigabyte.</desc><defs><marker id="ah0" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker><marker id="ah1" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#15803d"/></marker><marker id="ah2" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker></defs><rect x="0.75" y="0.75" width="878.5" height="324.5" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><rect x="8.0" y="96.0" width="200.0" height="110.0" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="108.0" y="146.5" font-size="15" font-weight="bold" fill="#1e3a8a" text-anchor="middle">Private subnet</text><text x="108.0" y="165.2" font-size="15" font-weight="normal" fill="#1e3a8a" text-anchor="middle">application servers</text><rect x="250.0" y="106.0" width="150.0" height="90.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="325.0" y="156.2" font-size="16" font-weight="bold" fill="#1f2937" text-anchor="middle">Route table</text><line x1="210.0" y1="151.0" x2="248.0" y2="151.0" stroke="#1f2937" stroke-width="2.4" marker-end="url(#ah0)"/><rect x="460.0" y="20.0" width="210.0" height="84.0" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="565.0" y="57.5" font-size="15" font-weight="bold" fill="#14532d" text-anchor="middle">Gateway endpoint</text><text x="565.0" y="76.2" font-size="15" font-weight="normal" fill="#14532d" text-anchor="middle">no additional charge</text><rect x="710.0" y="20.0" width="162.0" height="84.0" rx="8" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.6"/><text x="791.0" y="66.9" font-size="15" font-weight="bold" fill="#134e4a" text-anchor="middle">S3 and DynamoDB</text><rect x="460.0" y="188.0" width="210.0" height="84.0" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="565.0" y="225.5" font-size="15" font-weight="bold" fill="#78350f" text-anchor="middle">NAT gateway</text><text x="565.0" y="244.2" font-size="15" font-weight="normal" fill="#78350f" text-anchor="middle">hourly plus per GB</text><rect x="710.0" y="188.0" width="162.0" height="84.0" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.6"/><text x="791.0" y="234.9" font-size="15" font-weight="bold" fill="#374151" text-anchor="middle">Internet</text><line x1="402.0" y1="130.0" x2="458.0" y2="66.0" stroke="#15803d" stroke-width="2.4" marker-end="url(#ah1)"/><line x1="402.0" y1="172.0" x2="458.0" y2="230.0" stroke="#b45309" stroke-width="2.4" marker-end="url(#ah2)"/><line x1="672.0" y1="62.0" x2="708.0" y2="62.0" stroke="#15803d" stroke-width="2.4" marker-end="url(#ah1)"/><line x1="672.0" y1="230.0" x2="708.0" y2="230.0" stroke="#b45309" stroke-width="2.4" marker-end="url(#ah2)"/><text x="250.0" y="312.0" font-size="15" font-weight="bold" fill="#1e3a8a" text-anchor="start">Sending S3 traffic through NAT adds a per-GB charge for nothing</text></svg>