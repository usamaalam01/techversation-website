<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 296" width="880" height="296" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">m04-alb-routing</title><desc id="d">Application Load Balancer routing: a client reaches an ALB listener whose rules send path api to a container target group, path images to a Lambda function, and everything else to an instance target group.</desc><defs><marker id="ah0" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker></defs><rect x="0.75" y="0.75" width="878.5" height="294.5" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><rect x="8.0" y="106.0" width="140.0" height="90.0" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="78.0" y="156.2" font-size="16" font-weight="bold" fill="#1e3a8a" text-anchor="middle">Client</text><rect x="184.0" y="8.0" width="232.0" height="280.0" rx="10" fill="none" stroke="#7c3aed" stroke-width="1.8" stroke-dasharray="6 4"/><text x="196.0" y="29.0" font-size="15" font-weight="bold" fill="#4c1d95" text-anchor="start">ALB listener</text><rect x="200.0" y="50.0" width="200.0" height="60.0" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.6"/><text x="300.0" y="84.9" font-size="15" font-weight="bold" fill="#4c1d95" text-anchor="middle">path /api/*</text><rect x="200.0" y="128.0" width="200.0" height="60.0" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.6"/><text x="300.0" y="162.9" font-size="15" font-weight="bold" fill="#4c1d95" text-anchor="middle">path /images/*</text><rect x="200.0" y="206.0" width="200.0" height="60.0" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.6"/><text x="300.0" y="240.9" font-size="15" font-weight="bold" fill="#4c1d95" text-anchor="middle">default rule</text><rect x="520.0" y="50.0" width="352.0" height="60.0" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="696.0" y="75.5" font-size="15" font-weight="bold" fill="#14532d" text-anchor="middle">Containers</text><text x="696.0" y="94.2" font-size="15" font-weight="normal" fill="#14532d" text-anchor="middle">ECS tasks on Fargate</text><line x1="402.0" y1="80.0" x2="518.0" y2="80.0" stroke="#1f2937" stroke-width="2.4" marker-end="url(#ah0)"/><rect x="520.0" y="128.0" width="352.0" height="60.0" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="696.0" y="153.5" font-size="15" font-weight="bold" fill="#78350f" text-anchor="middle">Lambda function</text><text x="696.0" y="172.2" font-size="15" font-weight="normal" fill="#78350f" text-anchor="middle">image processing</text><line x1="402.0" y1="158.0" x2="518.0" y2="158.0" stroke="#1f2937" stroke-width="2.4" marker-end="url(#ah0)"/><rect x="520.0" y="206.0" width="352.0" height="60.0" rx="8" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.6"/><text x="696.0" y="231.5" font-size="15" font-weight="bold" fill="#134e4a" text-anchor="middle">Instances</text><text x="696.0" y="250.2" font-size="15" font-weight="normal" fill="#134e4a" text-anchor="middle">EC2 Auto Scaling group</text><line x1="402.0" y1="236.0" x2="518.0" y2="236.0" stroke="#1f2937" stroke-width="2.4" marker-end="url(#ah0)"/><line x1="150.0" y1="151.0" x2="182.0" y2="151.0" stroke="#1f2937" stroke-width="2.4" marker-end="url(#ah0)"/></svg>