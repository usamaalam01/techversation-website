<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 336" width="880" height="336" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">m08-db-chooser</title><desc id="d">Choosing a database by data and access pattern: relational with joins goes to RDS or Aurora, key-value at scale to DynamoDB, repeated reads to ElastiCache or DAX, highly connected data to Neptune, and MongoDB or Cassandra workloads to DocumentDB or Keyspaces.</desc><defs><marker id="ah0" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker><marker id="ah1" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker></defs><rect x="0.75" y="0.75" width="878.5" height="334.5" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><rect x="8.0" y="118.0" width="190.0" height="100.0" rx="8" fill="#1e3a8a" stroke="#1e3a8a" stroke-width="1.6"/><text x="103.0" y="153.2" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">What do the data and</text><text x="103.0" y="173.2" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">the access pattern</text><text x="103.0" y="193.2" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">look like?</text><rect x="232.0" y="8.0" width="360.0" height="56.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="242.0" y="40.9" font-size="15" font-weight="normal" fill="#1f2937" text-anchor="start">Relational: joins, transactions, SQL</text><line x1="594.0" y1="36.0" x2="626.0" y2="36.0" stroke="#1f2937" stroke-width="2.4" marker-end="url(#ah0)"/><rect x="628.0" y="8.0" width="244.0" height="56.0" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="750.0" y="40.9" font-size="15" font-weight="bold" fill="#1e3a8a" text-anchor="middle">RDS or Aurora</text><rect x="232.0" y="74.0" width="360.0" height="56.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="242.0" y="106.9" font-size="15" font-weight="normal" fill="#1f2937" text-anchor="start">Key-value at scale, single-digit millisecond</text><line x1="594.0" y1="102.0" x2="626.0" y2="102.0" stroke="#1f2937" stroke-width="2.4" marker-end="url(#ah0)"/><rect x="628.0" y="74.0" width="244.0" height="56.0" rx="8" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.6"/><text x="750.0" y="106.9" font-size="15" font-weight="bold" fill="#134e4a" text-anchor="middle">DynamoDB</text><rect x="232.0" y="140.0" width="360.0" height="56.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="242.0" y="172.9" font-size="15" font-weight="normal" fill="#1f2937" text-anchor="start">Repeated reads that need microseconds</text><line x1="594.0" y1="168.0" x2="626.0" y2="168.0" stroke="#1f2937" stroke-width="2.4" marker-end="url(#ah0)"/><rect x="628.0" y="140.0" width="244.0" height="56.0" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="750.0" y="172.9" font-size="15" font-weight="bold" fill="#14532d" text-anchor="middle">ElastiCache or DAX</text><rect x="232.0" y="206.0" width="360.0" height="56.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="242.0" y="238.9" font-size="15" font-weight="normal" fill="#1f2937" text-anchor="start">Highly connected data, relationships</text><line x1="594.0" y1="234.0" x2="626.0" y2="234.0" stroke="#1f2937" stroke-width="2.4" marker-end="url(#ah0)"/><rect x="628.0" y="206.0" width="244.0" height="56.0" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="750.0" y="238.9" font-size="15" font-weight="bold" fill="#78350f" text-anchor="middle">Neptune</text><rect x="232.0" y="272.0" width="360.0" height="56.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="242.0" y="304.9" font-size="15" font-weight="normal" fill="#1f2937" text-anchor="start">MongoDB or Cassandra workloads</text><line x1="594.0" y1="300.0" x2="626.0" y2="300.0" stroke="#1f2937" stroke-width="2.4" marker-end="url(#ah0)"/><rect x="628.0" y="272.0" width="244.0" height="56.0" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.6"/><text x="750.0" y="304.9" font-size="15" font-weight="bold" fill="#4c1d95" text-anchor="middle">DocumentDB or Keyspaces</text><line x1="215.0" y1="36.0" x2="215.0" y2="300.0" stroke="#6b7280" stroke-width="2"/><line x1="198.0" y1="168.0" x2="215.0" y2="168.0" stroke="#6b7280" stroke-width="2"/><line x1="215.0" y1="36.0" x2="230.0" y2="36.0" stroke="#6b7280" stroke-width="2" marker-end="url(#ah1)"/><line x1="215.0" y1="102.0" x2="230.0" y2="102.0" stroke="#6b7280" stroke-width="2" marker-end="url(#ah1)"/><line x1="215.0" y1="168.0" x2="230.0" y2="168.0" stroke="#6b7280" stroke-width="2" marker-end="url(#ah1)"/><line x1="215.0" y1="234.0" x2="230.0" y2="234.0" stroke="#6b7280" stroke-width="2" marker-end="url(#ah1)"/><line x1="215.0" y1="300.0" x2="230.0" y2="300.0" stroke="#6b7280" stroke-width="2" marker-end="url(#ah1)"/></svg>