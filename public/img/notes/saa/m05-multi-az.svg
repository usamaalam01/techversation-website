<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 396" width="880" height="396" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">m05-multi-az</title><desc id="d">A Multi-AZ design: a load balancer spans two Availability Zones, each holding a NAT gateway and application servers, a database primary in one zone replicates synchronously to a standby in the other, and regional services such as S3 span all zones.</desc><defs><marker id="ah0" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6d28d9"/></marker></defs><rect x="0.75" y="0.75" width="878.5" height="394.5" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><rect x="8.0" y="8.0" width="864.0" height="46.0" rx="8" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.6"/><text x="440.0" y="36.2" font-size="16" font-weight="bold" fill="#134e4a" text-anchor="middle">Load balancer across both zones</text><rect x="8.0" y="66.0" width="420.0" height="262.0" rx="10" fill="none" stroke="#2563eb" stroke-width="1.8" stroke-dasharray="6 4"/><text x="20.0" y="86.0" font-size="14" font-weight="bold" fill="#1e3a8a" text-anchor="start">Availability Zone A</text><rect x="22.0" y="96.0" width="392.0" height="54.0" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="218.0" y="127.9" font-size="15" font-weight="bold" fill="#1e3a8a" text-anchor="middle">NAT gateway</text><rect x="22.0" y="160.0" width="392.0" height="60.0" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="218.0" y="185.5" font-size="15" font-weight="bold" fill="#14532d" text-anchor="middle">Application servers</text><text x="218.0" y="204.2" font-size="15" font-weight="normal" fill="#14532d" text-anchor="middle">in an Auto Scaling group</text><rect x="22.0" y="232.0" width="392.0" height="84.0" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.6"/><text x="218.0" y="269.5" font-size="15" font-weight="bold" fill="#4c1d95" text-anchor="middle">Database primary</text><text x="218.0" y="288.2" font-size="15" font-weight="normal" fill="#4c1d95" text-anchor="middle">takes writes</text><rect x="452.0" y="66.0" width="420.0" height="262.0" rx="10" fill="none" stroke="#2563eb" stroke-width="1.8" stroke-dasharray="6 4"/><text x="464.0" y="86.0" font-size="14" font-weight="bold" fill="#1e3a8a" text-anchor="start">Availability Zone B</text><rect x="466.0" y="96.0" width="392.0" height="54.0" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="662.0" y="127.9" font-size="15" font-weight="bold" fill="#1e3a8a" text-anchor="middle">NAT gateway</text><rect x="466.0" y="160.0" width="392.0" height="60.0" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="662.0" y="185.5" font-size="15" font-weight="bold" fill="#14532d" text-anchor="middle">Application servers</text><text x="662.0" y="204.2" font-size="15" font-weight="normal" fill="#14532d" text-anchor="middle">in an Auto Scaling group</text><rect x="466.0" y="232.0" width="392.0" height="84.0" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="662.0" y="269.5" font-size="15" font-weight="bold" fill="#78350f" text-anchor="middle">Database standby</text><text x="662.0" y="288.2" font-size="15" font-weight="normal" fill="#78350f" text-anchor="middle">takes over if the primary fails</text><line x1="422.0" y1="274.0" x2="450.0" y2="274.0" stroke="#6d28d9" stroke-width="2.4" marker-end="url(#ah0)"/><text x="436.0" y="346.0" font-size="15" font-weight="bold" fill="#6d28d9" text-anchor="middle">synchronous replication</text><rect x="8.0" y="354.0" width="864.0" height="34.0" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.6"/><text x="440.0" y="375.9" font-size="15" font-weight="bold" fill="#374151" text-anchor="middle">Regional services such as S3 and DynamoDB span all zones</text></svg>