<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 330" width="880" height="330" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">m01-scp-guardrails</title><desc id="d">Service control policies in AWS Organizations: the root has a default allow-all policy, a production OU has a deny SCP that applies to its member accounts, the management account is outside the guardrail, and effective permissions are the overlap of the SCP and the identity policy.</desc><defs></defs><rect x="0.75" y="0.75" width="878.5" height="328.5" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><rect x="250.0" y="8.0" width="330.0" height="62.0" rx="8" fill="#1e3a8a" stroke="#1e3a8a" stroke-width="1.6"/><text x="415.0" y="34.5" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">Organization root</text><text x="415.0" y="53.2" font-size="15" font-weight="normal" fill="#ffffff" text-anchor="middle">default FullAWSAccess SCP</text><rect x="8.0" y="120.0" width="220.0" height="96.0" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.6"/><text x="118.0" y="163.5" font-size="15" font-weight="bold" fill="#374151" text-anchor="middle">Management account</text><text x="118.0" y="182.2" font-size="15" font-weight="normal" fill="#374151" text-anchor="middle">SCPs do not apply to it</text><rect x="250.0" y="120.0" width="330.0" height="80.0" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="415.0" y="155.5" font-size="15" font-weight="bold" fill="#78350f" text-anchor="middle">Production OU</text><text x="415.0" y="174.2" font-size="15" font-weight="normal" fill="#78350f" text-anchor="middle">deny SCP attached</text><rect x="250.0" y="236.0" width="156.0" height="66.0" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="328.0" y="273.9" font-size="15" font-weight="bold" fill="#1e3a8a" text-anchor="middle">Member account A</text><rect x="424.0" y="236.0" width="156.0" height="66.0" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="502.0" y="273.9" font-size="15" font-weight="bold" fill="#1e3a8a" text-anchor="middle">Member account B</text><line x1="415.0" y1="70.0" x2="415.0" y2="95.0" stroke="#6b7280" stroke-width="2"/><line x1="118.0" y1="95.0" x2="415.0" y2="95.0" stroke="#6b7280" stroke-width="2"/><line x1="118.0" y1="95.0" x2="118.0" y2="120.0" stroke="#6b7280" stroke-width="2"/><line x1="415.0" y1="95.0" x2="415.0" y2="120.0" stroke="#6b7280" stroke-width="2"/><line x1="415.0" y1="200.0" x2="415.0" y2="218.0" stroke="#6b7280" stroke-width="2"/><line x1="328.0" y1="218.0" x2="502.0" y2="218.0" stroke="#6b7280" stroke-width="2"/><line x1="328.0" y1="218.0" x2="328.0" y2="236.0" stroke="#6b7280" stroke-width="2"/><line x1="502.0" y1="218.0" x2="502.0" y2="236.0" stroke="#6b7280" stroke-width="2"/><rect x="618.0" y="80.0" width="254.0" height="222.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="745.0" y="139.6" font-size="15" font-weight="bold" fill="#1f2937" text-anchor="middle">Effective permissions</text><text x="745.0" y="158.4" font-size="15" font-weight="normal" fill="#1f2937" text-anchor="middle">what the SCP allows</text><text x="745.0" y="177.1" font-size="15" font-weight="bold" fill="#1f2937" text-anchor="middle">AND</text><text x="745.0" y="195.9" font-size="15" font-weight="normal" fill="#1f2937" text-anchor="middle">what the identity or resource policy</text><text x="745.0" y="214.6" font-size="15" font-weight="normal" fill="#1f2937" text-anchor="middle">allows</text><text x="745.0" y="233.4" font-size="15" font-weight="bold" fill="#1f2937" text-anchor="middle">An SCP never grants access by</text><text x="745.0" y="252.1" font-size="15" font-weight="bold" fill="#1f2937" text-anchor="middle">itself</text></svg>