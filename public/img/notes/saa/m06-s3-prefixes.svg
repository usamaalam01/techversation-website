<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 346" width="880" height="346" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">m06-s3-prefixes</title><desc id="d">S3 prefixes: many clients send requests in parallel to four prefixes of one bucket, each prefix supports at least 3,500 write and 5,500 read requests per second, so the total is the sum across prefixes.</desc><defs><marker id="ah0" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker></defs><rect x="0.75" y="0.75" width="878.5" height="344.5" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><rect x="8.0" y="90.0" width="160.0" height="120.0" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="88.0" y="136.1" font-size="15" font-weight="bold" fill="#1e3a8a" text-anchor="middle">Many clients</text><text x="88.0" y="154.9" font-size="15" font-weight="normal" fill="#1e3a8a" text-anchor="middle">sending requests in</text><text x="88.0" y="173.6" font-size="15" font-weight="normal" fill="#1e3a8a" text-anchor="middle">parallel</text><rect x="256.0" y="8.0" width="616.0" height="332.0" rx="10" fill="none" stroke="#0d9488" stroke-width="1.8" stroke-dasharray="6 4"/><text x="268.0" y="29.0" font-size="15" font-weight="bold" fill="#134e4a" text-anchor="start">One S3 bucket</text><rect x="276.0" y="42.0" width="576.0" height="52.0" rx="8" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.6"/><text x="564.0" y="72.9" font-size="15" font-weight="bold" fill="#134e4a" text-anchor="middle">prefix A/ · 3,500 writes · 5,500 reads per second</text><line x1="170.0" y1="150.0" x2="274.0" y2="68.0" stroke="#1f2937" stroke-width="2.4" marker-end="url(#ah0)"/><rect x="276.0" y="104.0" width="576.0" height="52.0" rx="8" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.6"/><text x="564.0" y="134.9" font-size="15" font-weight="bold" fill="#134e4a" text-anchor="middle">prefix B/ · 3,500 writes · 5,500 reads per second</text><line x1="170.0" y1="150.0" x2="274.0" y2="130.0" stroke="#1f2937" stroke-width="2.4" marker-end="url(#ah0)"/><rect x="276.0" y="166.0" width="576.0" height="52.0" rx="8" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.6"/><text x="564.0" y="196.9" font-size="15" font-weight="bold" fill="#134e4a" text-anchor="middle">prefix C/ · 3,500 writes · 5,500 reads per second</text><line x1="170.0" y1="150.0" x2="274.0" y2="192.0" stroke="#1f2937" stroke-width="2.4" marker-end="url(#ah0)"/><rect x="276.0" y="228.0" width="576.0" height="52.0" rx="8" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.6"/><text x="564.0" y="258.9" font-size="15" font-weight="bold" fill="#134e4a" text-anchor="middle">prefix D/ · 3,500 writes · 5,500 reads per second</text><line x1="170.0" y1="150.0" x2="274.0" y2="254.0" stroke="#1f2937" stroke-width="2.4" marker-end="url(#ah0)"/><text x="564.0" y="316.0" font-size="15" font-weight="bold" fill="#1e3a8a" text-anchor="middle">Four prefixes: at least 14,000 writes and 22,000 reads per second</text></svg>