<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 344" width="880" height="344" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">m03-data-protection-cycle</title><desc id="d">The data protection cycle in six steps: classify, encrypt, control access, back up and replicate, retain and expire, and audit, each with the AWS services that fit.</desc><defs></defs><rect x="0.75" y="0.75" width="878.5" height="342.5" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><polygon points="8.0,8.0 268.0,8.0 288.0,38.0 268.0,68.0 8.0,68.0" fill="#dbeafe" stroke="#2563eb" stroke-width="1.8"/><text x="141.0" y="43.4" font-size="17" font-weight="bold" fill="#1e3a8a" text-anchor="middle">1 Classify</text><rect x="10.0" y="72.0" width="266.0" height="92.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="18.0" y="113.5" font-size="15" font-weight="normal" fill="#1f2937" text-anchor="start">Macie finds sensitive data; tags label</text><text x="18.0" y="132.2" font-size="15" font-weight="normal" fill="#1f2937" text-anchor="start">it</text><polygon points="300.0,8.0 560.0,8.0 580.0,38.0 560.0,68.0 300.0,68.0 320.0,38.0" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.8"/><text x="440.0" y="43.4" font-size="17" font-weight="bold" fill="#134e4a" text-anchor="middle">2 Encrypt</text><rect x="302.0" y="72.0" width="266.0" height="92.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="310.0" y="113.5" font-size="15" font-weight="normal" fill="#1f2937" text-anchor="start">KMS keys, SSE for S3, EBS and</text><text x="310.0" y="132.2" font-size="15" font-weight="normal" fill="#1f2937" text-anchor="start">RDS encryption, TLS with ACM</text><polygon points="592.0,8.0 852.0,8.0 872.0,38.0 852.0,68.0 592.0,68.0 612.0,38.0" fill="#dcfce7" stroke="#16a34a" stroke-width="1.8"/><text x="732.0" y="43.4" font-size="17" font-weight="bold" fill="#14532d" text-anchor="middle">3 Control access</text><rect x="594.0" y="72.0" width="266.0" height="92.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="602.0" y="113.5" font-size="15" font-weight="normal" fill="#1f2937" text-anchor="start">IAM, bucket and key policies, VPC</text><text x="602.0" y="132.2" font-size="15" font-weight="normal" fill="#1f2937" text-anchor="start">endpoints</text><polygon points="8.0,176.0 268.0,176.0 288.0,206.0 268.0,236.0 8.0,236.0" fill="#fef3c7" stroke="#d97706" stroke-width="1.8"/><text x="141.0" y="211.4" font-size="17" font-weight="bold" fill="#78350f" text-anchor="middle">4 Back up and replicate</text><rect x="10.0" y="240.0" width="266.0" height="92.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="18.0" y="281.5" font-size="15" font-weight="normal" fill="#1f2937" text-anchor="start">AWS Backup, snapshots,</text><text x="18.0" y="300.2" font-size="15" font-weight="normal" fill="#1f2937" text-anchor="start">cross-Region replication</text><polygon points="300.0,176.0 560.0,176.0 580.0,206.0 560.0,236.0 300.0,236.0 320.0,206.0" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.8"/><text x="440.0" y="211.4" font-size="17" font-weight="bold" fill="#4c1d95" text-anchor="middle">5 Retain and expire</text><rect x="302.0" y="240.0" width="266.0" height="92.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="310.0" y="281.5" font-size="15" font-weight="normal" fill="#1f2937" text-anchor="start">lifecycle rules, Object Lock, backup</text><text x="310.0" y="300.2" font-size="15" font-weight="normal" fill="#1f2937" text-anchor="start">retention</text><polygon points="592.0,176.0 852.0,176.0 872.0,206.0 852.0,236.0 592.0,236.0 612.0,206.0" fill="#fee2e2" stroke="#dc2626" stroke-width="1.8"/><text x="732.0" y="211.4" font-size="17" font-weight="bold" fill="#7f1d1d" text-anchor="middle">6 Audit</text><rect x="594.0" y="240.0" width="266.0" height="92.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="602.0" y="281.5" font-size="15" font-weight="normal" fill="#1f2937" text-anchor="start">CloudTrail, Config, S3 server access</text><text x="602.0" y="300.2" font-size="15" font-weight="normal" fill="#1f2937" text-anchor="start">logs</text></svg>