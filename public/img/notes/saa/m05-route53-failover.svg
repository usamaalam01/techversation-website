<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 312" width="880" height="312" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">m05-route53-failover</title><desc id="d">Route 53 failover: users query Route 53, which returns the primary record for a load balancer in Region A while its health check passes, and the secondary record for a standby load balancer in Region B when the check fails.</desc><defs><marker id="ah0" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker><marker id="ah1" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker></defs><rect x="0.75" y="0.75" width="878.5" height="310.5" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><rect x="8.0" y="112.0" width="130.0" height="90.0" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="73.0" y="162.2" font-size="16" font-weight="bold" fill="#1e3a8a" text-anchor="middle">Users</text><rect x="190.0" y="82.0" width="220.0" height="150.0" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.6"/><text x="300.0" y="133.8" font-size="15" font-weight="bold" fill="#4c1d95" text-anchor="middle">Route 53</text><text x="300.0" y="152.5" font-size="15" font-weight="normal" fill="#4c1d95" text-anchor="middle">failover routing policy</text><text x="300.0" y="171.2" font-size="15" font-weight="normal" fill="#4c1d95" text-anchor="middle">primary and secondary</text><text x="300.0" y="190.0" font-size="15" font-weight="normal" fill="#4c1d95" text-anchor="middle">records</text><line x1="140.0" y1="157.0" x2="188.0" y2="157.0" stroke="#1f2937" stroke-width="2.4" marker-end="url(#ah0)"/><rect x="500.0" y="8.0" width="372.0" height="128.0" rx="10" fill="none" stroke="#16a34a" stroke-width="1.8" stroke-dasharray="6 4"/><text x="512.0" y="28.0" font-size="14" font-weight="bold" fill="#14532d" text-anchor="start">Region A</text><rect x="516.0" y="44.0" width="340.0" height="78.0" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="686.0" y="78.5" font-size="15" font-weight="bold" fill="#14532d" text-anchor="middle">Primary load balancer</text><text x="686.0" y="97.2" font-size="15" font-weight="normal" fill="#14532d" text-anchor="middle">watched by a Route 53 health check</text><rect x="500.0" y="176.0" width="372.0" height="128.0" rx="10" fill="none" stroke="#9ca3af" stroke-width="1.8" stroke-dasharray="6 4"/><text x="512.0" y="196.0" font-size="14" font-weight="bold" fill="#374151" text-anchor="start">Region B</text><rect x="516.0" y="212.0" width="340.0" height="78.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6" stroke-dasharray="6 4"/><text x="686.0" y="246.5" font-size="15" font-weight="bold" fill="#1f2937" text-anchor="middle">Standby load balancer</text><text x="686.0" y="265.2" font-size="15" font-weight="normal" fill="#1f2937" text-anchor="middle">takes traffic when the check fails</text><line x1="412.0" y1="130.0" x2="514.0" y2="84.0" stroke="#1f2937" stroke-width="2.4" marker-end="url(#ah0)"/><text x="452.0" y="94.0" font-size="14" font-weight="bold" fill="#1f2937" text-anchor="middle">primary</text><line x1="412.0" y1="184.0" x2="514.0" y2="250.0" stroke="#6b7280" stroke-width="2.4" stroke-dasharray="7 5" marker-end="url(#ah1)"/><text x="452.0" y="240.0" font-size="14" font-weight="bold" fill="#6b7280" text-anchor="middle">secondary</text></svg>