<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 356" width="880" height="356" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">m09-hub-spoke</title><desc id="d">A hub-and-spoke network: a Transit Gateway connects production, shared services and analytics VPCs, an office by Site-to-Site VPN and a data center through a Direct Connect gateway, with a dashed inter-Region peering link to a second Transit Gateway.</desc><defs><marker id="ah0" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6d28d9"/></marker></defs><rect x="0.75" y="0.75" width="878.5" height="354.5" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><rect x="8.0" y="8.0" width="600.0" height="340.0" rx="10" fill="none" stroke="#2563eb" stroke-width="1.8" stroke-dasharray="6 4"/><text x="20.0" y="29.0" font-size="15" font-weight="bold" fill="#1e3a8a" text-anchor="start">Region A</text><rect x="218.0" y="148.0" width="180.0" height="70.0" rx="8" fill="#1e3a8a" stroke="#1e3a8a" stroke-width="1.6"/><text x="308.0" y="169.1" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">Transit Gateway</text><text x="308.0" y="187.9" font-size="15" font-weight="normal" fill="#ffffff" text-anchor="middle">route tables and</text><text x="308.0" y="206.6" font-size="15" font-weight="normal" fill="#ffffff" text-anchor="middle">attachments</text><rect x="24.0" y="46.0" width="180.0" height="60.0" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="114.0" y="80.9" font-size="15" font-weight="bold" fill="#1e3a8a" text-anchor="middle">Production VPC</text><line x1="114.0" y1="106.0" x2="308.0" y2="148.0" stroke="#6b7280" stroke-width="2.2"/><rect x="218.0" y="46.0" width="180.0" height="60.0" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="308.0" y="80.9" font-size="15" font-weight="bold" fill="#14532d" text-anchor="middle">Shared services VPC</text><line x1="308.0" y1="106.0" x2="308.0" y2="148.0" stroke="#6b7280" stroke-width="2.2"/><rect x="412.0" y="46.0" width="180.0" height="60.0" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="502.0" y="80.9" font-size="15" font-weight="bold" fill="#78350f" text-anchor="middle">Analytics VPC</text><line x1="502.0" y1="106.0" x2="308.0" y2="148.0" stroke="#6b7280" stroke-width="2.2"/><rect x="40.0" y="262.0" width="240.0" height="62.0" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.6"/><text x="160.0" y="288.5" font-size="15" font-weight="bold" fill="#374151" text-anchor="middle">Office</text><text x="160.0" y="307.2" font-size="15" font-weight="normal" fill="#374151" text-anchor="middle">Site-to-Site VPN</text><rect x="336.0" y="262.0" width="250.0" height="62.0" rx="8" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.6"/><text x="461.0" y="288.5" font-size="15" font-weight="bold" fill="#134e4a" text-anchor="middle">Data center</text><text x="461.0" y="307.2" font-size="15" font-weight="normal" fill="#134e4a" text-anchor="middle">Direct Connect gateway</text><line x1="160.0" y1="262.0" x2="308.0" y2="218.0" stroke="#6b7280" stroke-width="2.2"/><line x1="461.0" y1="262.0" x2="308.0" y2="218.0" stroke="#6b7280" stroke-width="2.2"/><rect x="640.0" y="8.0" width="232.0" height="340.0" rx="10" fill="none" stroke="#9ca3af" stroke-width="1.8" stroke-dasharray="6 4"/><text x="652.0" y="29.0" font-size="15" font-weight="bold" fill="#374151" text-anchor="start">Region B</text><rect x="656.0" y="128.0" width="200.0" height="70.0" rx="8" fill="#1e3a8a" stroke="#1e3a8a" stroke-width="1.6"/><text x="756.0" y="167.9" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">Transit Gateway</text><rect x="656.0" y="230.0" width="200.0" height="60.0" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="756.0" y="264.9" font-size="15" font-weight="bold" fill="#1e3a8a" text-anchor="middle">VPCs</text><line x1="756.0" y1="198.0" x2