<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 346" width="880" height="346" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">m12-compute-chooser</title><desc id="d">Choosing a compute purchase option and service: steady all-day use goes to Savings Plans or Reserved Instances, spiky or unknown use to On-Demand with Auto Scaling, restartable flexible work to Spot, work idle most of the day to Lambda or Fargate, and work that must keep memory while stopped to hibernation.</desc><defs><marker id="ah0" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker><marker id="ah1" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker></defs><rect x="0.75" y="0.75" width="878.5" height="344.5" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><rect x="8.0" y="123.0" width="190.0" height="100.0" rx="8" fill="#1e3a8a" stroke="#1e3a8a" stroke-width="1.6"/><text x="103.0" y="168.2" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">What does the</text><text x="103.0" y="188.2" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">workload look like?</text><rect x="232.0" y="8.0" width="360.0" height="58.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="242.0" y="41.9" font-size="15" font-weight="normal" fill="#1f2937" text-anchor="start">Steady, running 24 hours a day</text><line x1="594.0" y1="37.0" x2="626.0" y2="37.0" stroke="#1f2937" stroke-width="2.4" marker-end="url(#ah0)"/><rect x="628.0" y="8.0" width="244.0" height="58.0" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="750.0" y="32.5" font-size="15" font-weight="bold" fill="#1e3a8a" text-anchor="middle">Savings Plans or Reserved</text><text x="750.0" y="51.2" font-size="15" font-weight="bold" fill="#1e3a8a" text-anchor="middle">Instances</text><rect x="232.0" y="76.0" width="360.0" height="58.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="242.0" y="109.9" font-size="15" font-weight="normal" fill="#1f2937" text-anchor="start">Spiky or unknown demand</text><line x1="594.0" y1="105.0" x2="626.0" y2="105.0" stroke="#1f2937" stroke-width="2.4" marker-end="url(#ah0)"/><rect x="628.0" y="76.0" width="244.0" height="58.0" rx="8" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.6"/><text x="750.0" y="109.9" font-size="15" font-weight="bold" fill="#134e4a" text-anchor="middle">On-Demand with Auto Scaling</text><rect x="232.0" y="144.0" width="360.0" height="58.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="242.0" y="177.9" font-size="15" font-weight="normal" fill="#1f2937" text-anchor="start">Restartable and flexible</text><line x1="594.0" y1="173.0" x2="626.0" y2="173.0" stroke="#1f2937" stroke-width="2.4" marker-end="url(#ah0)"/><rect x="628.0" y="144.0" width="244.0" height="58.0" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="750.0" y="177.9" font-size="15" font-weight="bold" fill="#14532d" text-anchor="middle">Spot Instances</text><rect x="232.0" y="212.0" width="360.0" height="58.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="242.0" y="245.9" font-size="15" font-weight="normal" fill="#1f2937" text-anchor="start">Idle most of the day</text><line x1="594.0" y1="241.0" x2="626.0" y2="241.0" stroke="#1f2937" stroke-width="2.4" marker-end="url(#ah0)"/><rect x="628.0" y="212.0" width="244.0" height="58.0" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="750.0" y="245.9" font-size="15" font-weight="bold" fill="#78350f" text-anchor="middle">Lambda or Fargate</text><rect x="232.0" y="280.0" width="360.0" height="58.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="242.0" y="313.9" font-size="15" font-weight="normal" fill="#1f2937" text-anchor="start">Must keep memory while stopped</text><line x1="594.0" y1="309.0" x2="626.0" y2="309.0" stroke="#1f2937" stroke-width="2.4" marker-end="url(#ah0)"/><rect x="628.0" y="280.0" width="244.0" height="58.0" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.6"/><text x="750.0" y="313.9" font-size="15" font-weight="bold" fill="#4c1d95" text-anchor="middle">Hibernation</text><line x1="215.0" y1="37.0" x2="215.0" y2="309.0" stroke="#6b7280" stroke-width="2"/><line x1="198.0" y1="173.0" x2="215.0" y2="173.0" stroke="#6b7280" stroke-width="2"/><line x1="215.0" y1="37.0" x2="230.0" y2="37.0" stroke="#6b7280" stroke-width="2" marker-end="url(#ah1)"/><line x1="215.0" y1="105.0" x2="230.0" y2="105.0" stroke="#6b7280" stroke-width="2" marker-end="url(#ah1)"/><line x1="215.0" y1="173.0" x2="230.0" y2="173.0" stroke="#6b7280" stroke-width="2" marker-end="url(#ah1)"/><line x1="215.0" y1="241.0" x2="230.0" y2="241.0" stroke="#6b7280" stroke-width="2" marker-end="url(#ah1)"/><line x1="215.0" y1="309.0" x2="230.0" y2="309.0" stroke="#6b7280" stroke-width="2" marker-end="url(#ah1)"/></svg>