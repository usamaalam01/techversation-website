<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 372" width="880" height="372" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">m10-streaming</title><desc id="d">A streaming pipeline: producers feed Kinesis Data Streams, which branches to a Managed Flink application for live metrics and to Data Firehose, which delivers Parquet files into an S3 data lake that Athena and Quick then query and chart.</desc><defs><marker id="ah0" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker></defs><rect x="0.75" y="0.75" width="878.5" height="370.5" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><rect x="8.0" y="140.0" width="140.0" height="90.0" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="78.0" y="171.1" font-size="15" font-weight="bold" fill="#1e3a8a" text-anchor="middle">Producers</text><text x="78.0" y="189.9" font-size="15" font-weight="normal" fill="#1e3a8a" text-anchor="middle">apps, devices,</text><text x="78.0" y="208.6" font-size="15" font-weight="normal" fill="#1e3a8a" text-anchor="middle">logs</text><rect x="190.0" y="140.0" width="170.0" height="90.0" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.6"/><text x="275.0" y="189.9" font-size="15" font-weight="bold" fill="#4c1d95" text-anchor="middle">Kinesis Data Streams</text><line x1="150.0" y1="185.0" x2="188.0" y2="185.0" stroke="#1f2937" stroke-width="2.4" marker-end="url(#ah0)"/><rect x="410.0" y="30.0" width="200.0" height="80.0" rx="8" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.6"/><text x="510.0" y="65.5" font-size="15" font-weight="bold" fill="#134e4a" text-anchor="middle">Managed Flink</text><text x="510.0" y="84.2" font-size="15" font-weight="normal" fill="#134e4a" text-anchor="middle">computes live metrics</text><rect x="410.0" y="250.0" width="200.0" height="80.0" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="510.0" y="285.5" font-size="15" font-weight="bold" fill="#78350f" text-anchor="middle">Data Firehose</text><text x="510.0" y="304.2" font-size="15" font-weight="normal" fill="#78350f" text-anchor="middle">delivers Parquet files</text><line x1="362.0" y1="160.0" x2="408.0" y2="76.0" stroke="#1f2937" stroke-width="2.4" marker-end="url(#ah0)"/><line x1="362.0" y1="210.0" x2="408.0" y2="290.0" stroke="#1f2937" stroke-width="2.4" marker-end="url(#ah0)"/><rect x="660.0" y="30.0" width="212.0" height="80.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="766.0" y="65.5" font-size="15" font-weight="bold" fill="#1f2937" text-anchor="middle">Live view</text><text x="766.0" y="84.2" font-size="15" font-weight="normal" fill="#1f2937" text-anchor="middle">dashboards and alerts</text><line x1="612.0" y1="70.0" x2="658.0" y2="70.0" stroke="#1f2937" stroke-width="2.4" marker-end="url(#ah0)"/><rect x="660.0" y="250.0" width="212.0" height="80.0" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="766.0" y="285.5" font-size="15" font-weight="bold" fill="#14532d" text-anchor="middle">S3 data lake</text><text x="766.0" y="304.2" font-size="15" font-weight="normal" fill="#14532d" text-anchor="middle">Parquet, partitioned</text><line x1="612.0" y1="290.0" x2="658.0" y2="290.0" stroke="#1f2937" stroke-width="2.4" marker-end="url(#ah0)"/><rect x="660.0" y="140.0" width="212.0" height="90.0" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.6"/><text x="766.0" y="180.5" font-size="15" font-weight="bold" fill="#374151" text-anchor="middle">Athena and Quick</text><text x="766.0" y="199.2" font-size="15" font-weight="normal" fill="#374151" text-anchor="middle">query and chart the lake</text><line x1="766.0" y1="250.0" x2="766.0" y2="232.0" stroke="#1f2937" stroke-width="2.4" marker-end="url(#ah0)"/></svg>