<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 158" width="880" height="158" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">m16-answer-method</title><desc id="d">Four steps for every question: read the last line first, predict the answer before the options, eliminate the options that are clearly wrong, and confirm that what is left matches the requirement word and the verb.</desc><defs></defs><rect x="0.75" y="0.75" width="878.5" height="156.5" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><polygon points="8.0,8.0 195.0,8.0 215.0,36.0 195.0,64.0 8.0,64.0" fill="#dbeafe" stroke="#2563eb" stroke-width="1.8"/><text x="104.5" y="41.8" font-size="18" font-weight="bold" fill="#1e3a8a" text-anchor="middle">1 Read</text><rect x="10.0" y="68.0" width="193.0" height="84.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="18.0" y="105.5" font-size="15" font-weight="normal" fill="#1f2937" text-anchor="start">last line first, then the</text><text x="18.0" y="124.2" font-size="15" font-weight="normal" fill="#1f2937" text-anchor="start">scenario</text><polygon points="227.0,8.0 414.0,8.0 434.0,36.0 414.0,64.0 227.0,64.0 247.0,36.0" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.8"/><text x="330.5" y="41.8" font-size="18" font-weight="bold" fill="#134e4a" text-anchor="middle">2 Predict</text><rect x="229.0" y="68.0" width="193.0" height="84.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="237.0" y="105.5" font-size="15" font-weight="normal" fill="#1f2937" text-anchor="start">name the service or</text><text x="237.0" y="124.2" font-size="15" font-weight="normal" fill="#1f2937" text-anchor="start">pattern before the options</text><polygon points="446.0,8.0 633.0,8.0 653.0,36.0 633.0,64.0 446.0,64.0 466.0,36.0" fill="#fef3c7" stroke="#d97706" stroke-width="1.8"/><text x="549.5" y="41.8" font-size="18" font-weight="bold" fill="#78350f" text-anchor="middle">3 Eliminate</text><rect x="448.0" y="68.0" width="193.0" height="84.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="456.0" y="105.5" font-size="15" font-weight="normal" fill="#1f2937" text-anchor="start">remove options that are</text><text x="456.0" y="124.2" font-size="15" font-weight="normal" fill="#1f2937" text-anchor="start">clearly wrong</text><polygon points="665.0,8.0 852.0,8.0 872.0,36.0 852.0,64.0 665.0,64.0 685.0,36.0" fill="#dcfce7" stroke="#16a34a" stroke-width="1.8"/><text x="768.5" y="41.8" font-size="18" font-weight="bold" fill="#14532d" text-anchor="middle">4 Confirm</text><rect x="667.0" y="68.0" width="193.0" height="84.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="675.0" y="105.5" font-size="15" font-weight="normal" fill="#1f2937" text-anchor="start">match the requirement</text><text x="675.0" y="124.2" font-size="15" font-weight="normal" fill="#1f2937" text-anchor="start">word and the verb</text></svg>