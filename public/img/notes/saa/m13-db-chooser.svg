<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 366" width="880" height="366" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">m13-db-chooser</title><desc id="d">Choosing a cost-optimized database: key-value with unpredictable traffic goes to DynamoDB on-demand, key-value with steady traffic to DynamoDB provisioned, variable relational load to Aurora Serverless v2, steady relational load to RDS or Aurora with a commitment, analytics to Redshift or Athena, and sensor readings to Timestream.</desc><defs><marker id="ah0" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker><marker id="ah1" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker></defs><rect x="0.75" y="0.75" width="878.5" height="364.5" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><rect x="8.0" y="133.0" width="190.0" height="100.0" rx="8" fill="#1e3a8a" stroke="#1e3a8a" stroke-width="1.6"/><text x="103.0" y="168.2" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">What are the data</text><text x="103.0" y="188.2" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">model and the traffic</text><text x="103.0" y="208.2" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">shape?</text><rect x="232.0" y="8.0" width="360.0" height="50.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="242.0" y="37.9" font-size="15" font-weight="normal" fill="#1f2937" text-anchor="start">Key-value, unpredictable traffic</text><line x1="594.0" y1="33.0" x2="626.0" y2="33.0" stroke="#1f2937" stroke-width="2.4" marker-end="url(#ah0)"/><rect x="628.0" y="8.0" width="244.0" height="50.0" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="750.0" y="37.9" font-size="15" font-weight="bold" fill="#1e3a8a" text-anchor="middle">DynamoDB on-demand</text><rect x="232.0" y="68.0" width="360.0" height="50.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="242.0" y="97.9" font-size="15" font-weight="normal" fill="#1f2937" text-anchor="start">Key-value, steady traffic</text><line x1="594.0" y1="93.0" x2="626.0" y2="93.0" stroke="#1f2937" stroke-width="2.4" marker-end="url(#ah0)"/><rect x="628.0" y="68.0" width="244.0" height="50.0" rx="8" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.6"/><text x="750.0" y="97.9" font-size="15" font-weight="bold" fill="#134e4a" text-anchor="middle">DynamoDB provisioned</text><rect x="232.0" y="128.0" width="360.0" height="50.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="242.0" y="157.9" font-size="15" font-weight="normal" fill="#1f2937" text-anchor="start">Relational, variable load</text><line x1="594.0" y1="153.0" x2="626.0" y2="153.0" stroke="#1f2937" stroke-width="2.4" marker-end="url(#ah0)"/><rect x="628.0" y="128.0" width="244.0" height="50.0" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="750.0" y="157.9" font-size="15" font-weight="bold" fill="#14532d" text-anchor="middle">Aurora Serverless v2</text><rect x="232.0" y="188.0" width="360.0" height="50.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="242.0" y="217.9" font-size="15" font-weight="normal" fill="#1f2937" text-anchor="start">Relational, steady load</text><line x1="594.0" y1="213.0" x2="626.0" y2="213.0" stroke="#1f2937" stroke-width="2.4" marker-end="url(#ah0)"/><rect x="628.0" y="188.0" width="244.0" height="50.0" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="750.0" y="208.5" font-size="15" font-weight="bold" fill="#78350f" text-anchor="middle">RDS or Aurora with a</text><text x="750.0" y="227.2" font-size="15" font-weight="bold" fill="#78350f" text-anchor="middle">commitment</text><rect x="232.0" y="248.0" width="360.0" height="50.0" rx="8" fill="#ffffff" stroke="#9ca