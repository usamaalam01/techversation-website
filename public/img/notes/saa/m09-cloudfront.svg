<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 252" width="880" height="252" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">m09-cloudfront</title><desc id="d">How CloudFront works: a viewer requests content from a nearby edge location; a cache hit is returned at once, and a cache miss goes on to the origin, which can be S3 or an Application Load Balancer, and the answer is cached.</desc><defs><marker id="ah0" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker><marker id="ah1" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#15803d"/></marker><marker id="ah2" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker></defs><rect x="0.75" y="0.75" width="878.5" height="250.5" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><rect x="8.0" y="84.0" width="150.0" height="84.0" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="83.0" y="131.2" font-size="16" font-weight="bold" fill="#1e3a8a" text-anchor="middle">Viewer</text><rect x="226.0" y="60.0" width="230.0" height="132.0" rx="8" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.6"/><text x="341.0" y="121.5" font-size="15" font-weight="bold" fill="#134e4a" text-anchor="middle">Edge location</text><text x="341.0" y="140.2" font-size="15" font-weight="normal" fill="#134e4a" text-anchor="middle">keeps a cache of the content</text><line x1="160.0" y1="112.0" x2="224.0" y2="112.0" stroke="#1f2937" stroke-width="2.4" marker-end="url(#ah0)"/><text x="192.0" y="100.0" font-size="14" font-weight="bold" fill="#1f2937" text-anchor="middle">request</text><line x1="224.0" y1="160.0" x2="160.0" y2="160.0" stroke="#15803d" stroke-width="2.4" marker-end="url(#ah1)"/><text x="194.0" y="222.0" font-size="15" font-weight="bold" fill="#15803d" text-anchor="middle">cache hit: returned at once</text><rect x="556.0" y="8.0" width="316.0" height="236.0" rx="10" fill="none" stroke="#d97706" stroke-width="1.8" stroke-dasharray="6 4"/><text x="568.0" y="29.0" font-size="15" font-weight="bold" fill="#78350f" text-anchor="start">Origin</text><rect x="572.0" y="50.0" width="284.0" height="80.0" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="714.0" y="95.2" font-size="16" font-weight="bold" fill="#78350f" text-anchor="middle">S3 bucket</text><rect x="572.0" y="146.0" width="284.0" height="80.0" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="714.0" y="191.2" font-size="16" font-weight="bold" fill="#78350f" text-anchor="middle">Application Load Balancer</text><line x1="458.0" y1="126.0" x2="554.0" y2="126.0" stroke="#b45309" stroke-width="2.4" marker-end="url(#ah2)"/><text x="506.0" y="112.0" font-size="14" font-weight="bold" fill="#b45309" text-anchor="middle">cache miss</text></svg>