<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 292" width="880" height="292" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">m03-backup-plan</title><desc id="d">An AWS Backup plan protects resources such as EBS, RDS, DynamoDB and S3, writes to a primary vault, and copies to a vault in a second Region and a vault in a separate account.</desc><defs><marker id="ah0" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker></defs><rect x="0.75" y="0.75" width="878.5" height="290.5" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><rect x="8.0" y="80.0" width="200.0" height="124.0" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="108.0" y="128.1" font-size="15" font-weight="bold" fill="#1e3a8a" text-anchor="middle">Protected resources</text><text x="108.0" y="146.9" font-size="15" font-weight="normal" fill="#1e3a8a" text-anchor="middle">EBS, RDS, DynamoDB,</text><text x="108.0" y="165.6" font-size="15" font-weight="normal" fill="#1e3a8a" text-anchor="middle">S3, EFS</text><rect x="260.0" y="70.0" width="220.0" height="144.0" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.6"/><text x="370.0" y="128.1" font-size="15" font-weight="bold" fill="#4c1d95" text-anchor="middle">Backup plan</text><text x="370.0" y="146.9" font-size="15" font-weight="normal" fill="#4c1d95" text-anchor="middle">schedule, lifecycle and</text><text x="370.0" y="165.6" font-size="15" font-weight="normal" fill="#4c1d95" text-anchor="middle">retention rules</text><line x1="210.0" y1="142.0" x2="258.0" y2="142.0" stroke="#1f2937" stroke-width="2.4" marker-end="url(#ah0)"/><rect x="540.0" y="12.0" width="332.0" height="80.0" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="706.0" y="47.5" font-size="15" font-weight="bold" fill="#14532d" text-anchor="middle">Primary vault</text><text x="706.0" y="66.2" font-size="15" font-weight="normal" fill="#14532d" text-anchor="middle">encrypted, optional Vault Lock</text><line x1="482.0" y1="142.0" x2="538.0" y2="52.0" stroke="#1f2937" stroke-width="2.4" marker-end="url(#ah0)"/><rect x="540.0" y="106.0" width="332.0" height="80.0" rx="8" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.6"/><text x="706.0" y="141.5" font-size="15" font-weight="bold" fill="#134e4a" text-anchor="middle">Second Region vault</text><text x="706.0" y="160.2" font-size="15" font-weight="normal" fill="#134e4a" text-anchor="middle">copy for Region loss</text><line x1="482.0" y1="142.0" x2="538.0" y2="146.0" stroke="#1f2937" stroke-width="2.4" marker-end="url(#ah0)"/><rect x="540.0" y="200.0" width="332.0" height="80.0" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="706.0" y="235.5" font-size="15" font-weight="bold" fill="#78350f" text-anchor="middle">Separate account vault</text><text x="706.0" y="254.2" font-size="15" font-weight="normal" fill="#78350f" text-anchor="middle">copy for account compromise</text><line x1="482.0" y1="142.0" x2="538.0" y2="240.0" stroke="#1f2937" stroke-width="2.4" marker-end="url(#ah0)"/></svg>