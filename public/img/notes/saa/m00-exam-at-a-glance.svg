<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 254" width="880" height="254" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">m00-exam-at-a-glance</title><desc id="d">The SAA-C03 exam at a glance: 65 questions, of which 50 are scored and 15 unscored, in 130 minutes; a scaled score of 100 to 1,000 with 720 needed to pass.</desc><defs></defs><rect x="0.75" y="0.75" width="878.5" height="252.5" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><rect x="8.0" y="8.0" width="278.7" height="112.0" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="1.8"/><text x="147.3" y="66.2" font-size="42" font-weight="bold" fill="#1e3a8a" text-anchor="middle">65</text><text x="147.3" y="92.2" font-size="17" font-weight="normal" fill="#1e3a8a" text-anchor="middle">questions</text><rect x="300.7" y="8.0" width="278.7" height="112.0" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="1.8"/><text x="440.0" y="66.2" font-size="42" font-weight="bold" fill="#14532d" text-anchor="middle">50</text><text x="440.0" y="92.2" font-size="17" font-weight="normal" fill="#14532d" text-anchor="middle">scored</text><rect x="593.3" y="8.0" width="278.7" height="112.0" rx="12" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.8"/><text x="732.7" y="66.2" font-size="42" font-weight="bold" fill="#374151" text-anchor="middle">15</text><text x="732.7" y="92.2" font-size="17" font-weight="normal" fill="#374151" text-anchor="middle">unscored, not identified</text><rect x="8.0" y="134.0" width="278.7" height="112.0" rx="12" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.8"/><text x="147.3" y="192.2" font-size="42" font-weight="bold" fill="#134e4a" text-anchor="middle">130</text><text x="147.3" y="218.2" font-size="17" font-weight="normal" fill="#134e4a" text-anchor="middle">minutes</text><rect x="300.7" y="134.0" width="278.7" height="112.0" rx="12" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.8"/><text x="440.0" y="192.2" font-size="42" font-weight="bold" fill="#4c1d95" text-anchor="middle">720</text><text x="440.0" y="218.2" font-size="17" font-weight="normal" fill="#4c1d95" text-anchor="middle">to pass</text><rect x="593.3" y="134.0" width="278.7" height="112.0" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="1.8"/><text x="732.7" y="192.2" font-size="42" font-weight="bold" fill="#78350f" text-anchor="middle">100-1,000</text><text x="732.7" y="218.2" font-size="17" font-weight="normal" fill="#78350f" text-anchor="middle">scaled score</text></svg>