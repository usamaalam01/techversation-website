<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 262" width="880" height="262" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">m05-rpo-rto</title><desc id="d">RPO and RTO on a timeline: the recovery point objective is the span of data lost between the last backup or replica and the disaster, and the recovery time objective is the downtime between the disaster and restored service.</desc><defs><marker id="ah0" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker><marker id="ah1" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6d28d9"/></marker></defs><rect x="0.75" y="0.75" width="878.5" height="260.5" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><line x1="20.0" y1="104.0" x2="860.0" y2="104.0" stroke="#6b7280" stroke-width="3"/><circle cx="170.0" cy="104.0" r="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2.6"/><text x="170.0" y="64.0" font-size="16" font-weight="bold" fill="#1e3a8a" text-anchor="middle">Last backup or replica</text><circle cx="440.0" cy="104.0" r="12" fill="#fee2e2" stroke="#dc2626" stroke-width="2.6"/><text x="440.0" y="64.0" font-size="16" font-weight="bold" fill="#7f1d1d" text-anchor="middle">Disaster</text><circle cx="710.0" cy="104.0" r="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2.6"/><text x="710.0" y="64.0" font-size="16" font-weight="bold" fill="#14532d" text-anchor="middle">Service restored</text><line x1="172.0" y1="160.0" x2="438.0" y2="160.0" stroke="#b45309" stroke-width="2.6" marker-end="url(#ah0)"/><line x1="438.0" y1="160.0" x2="172.0" y2="160.0" stroke="#b45309" stroke-width="2.6" marker-end="url(#ah0)"/><rect x="190.0" y="172.0" width="232.0" height="62.0" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="306.0" y="198.2" font-size="16" font-weight="bold" fill="#78350f" text-anchor="middle">RPO</text><text x="306.0" y="218.2" font-size="16" font-weight="normal" fill="#78350f" text-anchor="middle">data you can lose</text><line x1="442.0" y1="160.0" x2="708.0" y2="160.0" stroke="#6d28d9" stroke-width="2.6" marker-end="url(#ah1)"/><line x1="708.0" y1="160.0" x2="442.0" y2="160.0" stroke="#6d28d9" stroke-width="2.6" marker-end="url(#ah1)"/><rect x="460.0" y="172.0" width="232.0" height="62.0" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.6"/><text x="576.0" y="198.2" font-size="16" font-weight="bold" fill="#4c1d95" text-anchor="middle">RTO</text><text x="576.0" y="218.2" font-size="16" font-weight="normal" fill="#4c1d95" text-anchor="middle">downtime you can accept</text></svg>