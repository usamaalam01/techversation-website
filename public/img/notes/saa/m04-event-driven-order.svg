<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 352" width="880" height="352" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">m04-event-driven-order</title><desc id="d">An event-driven order flow: a client calls API Gateway, a Lambda order function publishes an event to a topic that fans out to inventory, email and analytics queues with a dead-letter queue, and an S3 upload separately triggers a thumbnail function.</desc><defs><marker id="ah0" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker><marker id="ah1" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6d28d9"/></marker></defs><rect x="0.75" y="0.75" width="878.5" height="350.5" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><rect x="8.0" y="14.0" width="190.0" height="66.0" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="103.0" y="52.2" font-size="16" font-weight="bold" fill="#1e3a8a" text-anchor="middle">Client</text><rect x="232.0" y="14.0" width="190.0" height="66.0" rx="8" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.6"/><text x="327.0" y="52.2" font-size="16" font-weight="bold" fill="#134e4a" text-anchor="middle">API Gateway</text><rect x="456.0" y="14.0" width="190.0" height="66.0" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="551.0" y="52.2" font-size="16" font-weight="bold" fill="#14532d" text-anchor="middle">Order function</text><rect x="680.0" y="14.0" width="190.0" height="66.0" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.6"/><text x="775.0" y="52.2" font-size="16" font-weight="bold" fill="#4c1d95" text-anchor="middle">Event topic</text><line x1="200.0" y1="47.0" x2="230.0" y2="47.0" stroke="#1f2937" stroke-width="2.4" marker-end="url(#ah0)"/><line x1="424.0" y1="47.0" x2="454.0" y2="47.0" stroke="#1f2937" stroke-width="2.4" marker-end="url(#ah0)"/><line x1="648.0" y1="47.0" x2="678.0" y2="47.0" stroke="#1f2937" stroke-width="2.4" marker-end="url(#ah0)"/><rect x="232.0" y="150.0" width="190.0" height="60.0" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="327.0" y="185.2" font-size="16" font-weight="bold" fill="#78350f" text-anchor="middle">Inventory queue</text><line x1="775.0" y1="82.0" x2="327.0" y2="148.0" stroke="#6d28d9" stroke-width="2.4" marker-end="url(#ah1)"/><rect x="456.0" y="150.0" width="190.0" height="60.0" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="551.0" y="185.2" font-size="16" font-weight="bold" fill="#78350f" text-anchor="middle">Email queue</text><line x1="775.0" y1="82.0" x2="551.0" y2="148.0" stroke="#6d28d9" stroke-width="2.4" marker-end="url(#ah1)"/><rect x="680.0" y="150.0" width="190.0" height="60.0" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="775.0" y="185.2" font-size="16" font-weight="bold" fill="#78350f" text-anchor="middle">Analytics queue</text><line x1="775.0" y1="82.0" x2="775.0" y2="148.0" stroke="#6d28d9" stroke-width="2.4" marker-end="url(#ah1)"/><rect x="232.0" y="240.0" width="638.0" height="52.0" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.6"/><text x="551.0" y="270.9" font-size="15" font-weight="bold" fill="#374151" text-anchor="middle">A dead-letter queue keeps messages that fail repeatedly</text><rect x="8.0" y="130.0" width="190.0" height="62.0" rx="8" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.6"/><text x="103.0" y="166.2" font-size="16" font-weight="bold" fill="#134e4a" text-anchor="middle">S3 upload</text><rect x="8.0" y="230.0" width="190.0" height="62.0" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="103.0" y="266.2" font-size="16" font-weight="bold" fill="#14532d" text-anchor="middle">Thumbnail function</text><line x1="103.0" y1="194.0" x2="103.0" y2="228.0" stroke="#1f2937" stroke-width="2.4" marker-end="url(#ah0)"/><text x="4