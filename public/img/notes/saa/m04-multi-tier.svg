<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 352" width="880" height="352" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">m04-multi-tier</title><desc id="d">A multi-tier design across two Availability Zones: a load balancer, web tier, application tier and cache and database, each spread over both zones with Auto Scaling, and a queue feeding an Auto Scaling worker group.</desc><defs><marker id="ah0" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker></defs><rect x="0.75" y="0.75" width="878.5" height="350.5" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><text x="300.0" y="30.0" font-size="15" font-weight="bold" fill="#1e3a8a" text-anchor="middle">Availability Zone A</text><text x="530.0" y="30.0" font-size="15" font-weight="bold" fill="#1e3a8a" text-anchor="middle">Availability Zone B</text><rect x="8.0" y="44.0" width="170.0" height="64.0" rx="8" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.6"/><text x="93.0" y="80.9" font-size="15" font-weight="bold" fill="#134e4a" text-anchor="middle">Load balancer</text><rect x="190.0" y="44.0" width="220.0" height="64.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="300.0" y="80.9" font-size="15" font-weight="normal" fill="#1f2937" text-anchor="middle">balancer node</text><rect x="420.0" y="44.0" width="220.0" height="64.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="530.0" y="80.9" font-size="15" font-weight="normal" fill="#1f2937" text-anchor="middle">balancer node</text><rect x="8.0" y="118.0" width="170.0" height="64.0" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="93.0" y="154.9" font-size="15" font-weight="bold" fill="#1e3a8a" text-anchor="middle">Web tier</text><rect x="190.0" y="118.0" width="220.0" height="64.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="300.0" y="154.9" font-size="15" font-weight="normal" fill="#1f2937" text-anchor="middle">web servers</text><rect x="420.0" y="118.0" width="220.0" height="64.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="530.0" y="154.9" font-size="15" font-weight="normal" fill="#1f2937" text-anchor="middle">web servers</text><rect x="8.0" y="192.0" width="170.0" height="64.0" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="93.0" y="228.9" font-size="15" font-weight="bold" fill="#14532d" text-anchor="middle">Application tier</text><rect x="190.0" y="192.0" width="220.0" height="64.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="300.0" y="228.9" font-size="15" font-weight="normal" fill="#1f2937" text-anchor="middle">app servers</text><rect x="420.0" y="192.0" width="220.0" height="64.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="530.0" y="228.9" font-size="15" font-weight="normal" fill="#1f2937" text-anchor="middle">app servers</text><rect x="8.0" y="266.0" width="170.0" height="64.0" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.6"/><text x="93.0" y="302.9" font-size="15" font-weight="bold" fill="#4c1d95" text-anchor="middle">Cache and database</text><rect x="190.0" y="266.0" width="220.0" height="64.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="300.0" y="302.9" font-size="15" font-weight="normal" fill="#1f2937" text-anchor="middle">primary</text><rect x="420.0" y="266.0" width="220.0" height="64.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="530.0" y="302.9" font-size="15" font-weight="normal" fill="#1f2937" text-anchor="middle">standby</text><rect x="662.0" y="44.0" width="210.0" height="140.0" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.6"/><text x="767.0" y="100.1" font-size="15" font-weight="bold" fill="#374151" text-anchor="middle">Auto Scaling</text><text x="767.0" y="118.9" font-size="15" font-weight="normal" fill="#374151" text-anchor="middle">on the web, application and</text><text x="767.0" y="137.6" font-size="15" font-weight="normal" fill="#374151" text-anchor="middle">worker tiers</text><rect x="662.0" y="192.0" width="210.0" height="64.0" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="767.0" y="219.5" font-size="15" font-weight="bold" fill="#78350f" text-anchor="middle">SQS queue</text><text x="767.0" y="238.2" font-size="15" font-weight="normal" fill="#78350f" text-anchor="middle">buffers work</text><rect x="662.0" y="276.0" width="210.0" height="64.0" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.6"/><text x="767.0" y="303.5" font-size="15" font-weight="bold" fill="#7f1d1d" text-anchor="middle">Workers</text><text x="767.0" y="322.2" font-size="15" font-weight="normal" fill="#7f1d1d" text-anchor="middle">in an Auto Scaling group</text><line x1="642.0" y1="224.0" x2="660.0" y2="224.0" stroke="#1f2937" stroke-width="2.4" marker-end="url(#ah0)"/><line x1="767.0" y1="258.0" x2="767.0" y2="274.0" stroke="#1f2937" stroke-width="2.4" marker-end="url(#ah0)"/></svg>