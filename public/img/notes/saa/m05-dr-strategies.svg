<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 276" width="880" height="276" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">m05-dr-strategies</title><desc id="d">Four disaster recovery strategies as rising steps: backup and restore, pilot light, warm standby, and multi-site active/active, with cost rising and recovery getting faster at each step.</desc><defs><marker id="ah0" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker></defs><rect x="0.75" y="0.75" width="878.5" height="274.5" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><rect x="8.0" y="124.0" width="204.0" height="88.0" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.6"/><text x="110.0" y="154.1" font-size="15" font-weight="bold" fill="#374151" text-anchor="middle">Backup and restore</text><text x="110.0" y="172.9" font-size="15" font-weight="normal" fill="#374151" text-anchor="middle">copies stored; rebuild after</text><text x="110.0" y="191.6" font-size="15" font-weight="normal" fill="#374151" text-anchor="middle">a disaster</text><rect x="224.0" y="88.0" width="204.0" height="124.0" rx="8" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.6"/><text x="326.0" y="136.1" font-size="15" font-weight="bold" fill="#134e4a" text-anchor="middle">Pilot light</text><text x="326.0" y="154.9" font-size="15" font-weight="normal" fill="#134e4a" text-anchor="middle">core data live; the rest</text><text x="326.0" y="173.6" font-size="15" font-weight="normal" fill="#134e4a" text-anchor="middle">started on failure</text><rect x="440.0" y="52.0" width="204.0" height="160.0" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="542.0" y="118.1" font-size="15" font-weight="bold" fill="#78350f" text-anchor="middle">Warm standby</text><text x="542.0" y="136.9" font-size="15" font-weight="normal" fill="#78350f" text-anchor="middle">a scaled-down copy always</text><text x="542.0" y="155.6" font-size="15" font-weight="normal" fill="#78350f" text-anchor="middle">running</text><rect x="656.0" y="16.0" width="204.0" height="196.0" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="758.0" y="109.5" font-size="15" font-weight="bold" fill="#14532d" text-anchor="middle">Multi-site active/active</text><text x="758.0" y="128.2" font-size="15" font-weight="normal" fill="#14532d" text-anchor="middle">full capacity in both Regions</text><line x1="8.0" y1="238.0" x2="864.0" y2="238.0" stroke="#1f2937" stroke-width="2.6" marker-end="url(#ah0)"/><text x="436.0" y="266.0" font-size="16" font-weight="bold" fill="#1e3a8a" text-anchor="middle">higher cost, faster recovery</text></svg>