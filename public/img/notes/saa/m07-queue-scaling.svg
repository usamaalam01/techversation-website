<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 250" width="880" height="250" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">m07-queue-scaling</title><desc id="d">Scaling on queue depth: the SQS queue length divided by running instances gives the backlog per instance, a CloudWatch metric and alarm track it, and the Auto Scaling group of workers adds or removes instances while draining the queue.</desc><defs><marker id="ah0" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker><marker id="ah1" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker></defs><rect x="0.75" y="0.75" width="878.5" height="248.5" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><rect x="8.0" y="40.0" width="150.0" height="90.0" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="83.0" y="80.5" font-size="15" font-weight="bold" fill="#78350f" text-anchor="middle">SQS queue</text><text x="83.0" y="99.2" font-size="15" font-weight="normal" fill="#78350f" text-anchor="middle">messages waiting</text><rect x="196.0" y="40.0" width="214.0" height="90.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="303.0" y="71.1" font-size="15" font-weight="bold" fill="#1f2937" text-anchor="middle">Backlog per instance</text><text x="303.0" y="89.9" font-size="15" font-weight="normal" fill="#1f2937" text-anchor="middle">messages divided by running</text><text x="303.0" y="108.6" font-size="15" font-weight="normal" fill="#1f2937" text-anchor="middle">instances</text><rect x="448.0" y="40.0" width="190.0" height="90.0" rx="8" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.6"/><text x="543.0" y="80.5" font-size="15" font-weight="bold" fill="#134e4a" text-anchor="middle">CloudWatch</text><text x="543.0" y="99.2" font-size="15" font-weight="normal" fill="#134e4a" text-anchor="middle">metric and alarm</text><rect x="676.0" y="40.0" width="196.0" height="90.0" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="774.0" y="71.1" font-size="15" font-weight="bold" fill="#14532d" text-anchor="middle">Worker group</text><text x="774.0" y="89.9" font-size="15" font-weight="normal" fill="#14532d" text-anchor="middle">Auto Scaling adds or</text><text x="774.0" y="108.6" font-size="15" font-weight="normal" fill="#14532d" text-anchor="middle">removes</text><line x1="160.0" y1="85.0" x2="194.0" y2="85.0" stroke="#1f2937" stroke-width="2.4" marker-end="url(#ah0)"/><line x1="412.0" y1="85.0" x2="446.0" y2="85.0" stroke="#1f2937" stroke-width="2.4" marker-end="url(#ah0)"/><line x1="640.0" y1="85.0" x2="674.0" y2="85.0" stroke="#1f2937" stroke-width="2.4" marker-end="url(#ah0)"/><polyline points="774.0,132.0 774.0,190.0 83.0,190.0 83.0,132.0" fill="none" stroke="#6b7280" stroke-width="2.2" stroke-dasharray="6 4" marker-end="url(#ah1)" stroke-linejoin="round"/><text x="430.0" y="182.0" font-size="15" font-weight="bold" fill="#374151" text-anchor="middle">workers drain the queue, so the backlog falls</text></svg>