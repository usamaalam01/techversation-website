<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 292" width="880" height="292" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">m01-policy-evaluation</title><desc id="d">How AWS evaluates a request: an explicit deny anywhere ends in deny; otherwise the organization SCP and any permissions boundary must allow it, and an identity or resource policy must allow it; everything else is an implicit deny.</desc><defs><marker id="ah0" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker><marker id="ah1" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/></marker></defs><rect x="0.75" y="0.75" width="878.5" height="290.5" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><rect x="8.0" y="14.0" width="140.0" height="100.0" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="78.0" y="69.2" font-size="16" font-weight="bold" fill="#1e3a8a" text-anchor="middle">Request</text><rect x="189.0" y="14.0" width="140.0" height="100.0" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="259.0" y="59.2" font-size="16" font-weight="bold" fill="#78350f" text-anchor="middle">Explicit deny</text><text x="259.0" y="79.2" font-size="16" font-weight="bold" fill="#78350f" text-anchor="middle">anywhere?</text><rect x="370.0" y="14.0" width="140.0" height="100.0" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="440.0" y="49.2" font-size="16" font-weight="bold" fill="#78350f" text-anchor="middle">SCP and</text><text x="440.0" y="69.2" font-size="16" font-weight="bold" fill="#78350f" text-anchor="middle">boundary allow</text><text x="440.0" y="89.2" font-size="16" font-weight="bold" fill="#78350f" text-anchor="middle">it?</text><rect x="551.0" y="14.0" width="140.0" height="100.0" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="621.0" y="49.2" font-size="16" font-weight="bold" fill="#78350f" text-anchor="middle">Identity or</text><text x="621.0" y="69.2" font-size="16" font-weight="bold" fill="#78350f" text-anchor="middle">resource policy</text><text x="621.0" y="89.2" font-size="16" font-weight="bold" fill="#78350f" text-anchor="middle">allows it?</text><rect x="732.0" y="14.0" width="140.0" height="100.0" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="802.0" y="69.2" font-size="16" font-weight="bold" fill="#14532d" text-anchor="middle">ALLOW</text><line x1="150.0" y1="64.0" x2="187.0" y2="64.0" stroke="#1f2937" stroke-width="2.4" marker-end="url(#ah0)"/><line x1="331.0" y1="64.0" x2="368.0" y2="64.0" stroke="#1f2937" stroke-width="2.4" marker-end="url(#ah0)"/><text x="349.5" y="52.0" font-size="15" font-weight="bold" fill="#1f2937" text-anchor="middle">no</text><line x1="512.0" y1="64.0" x2="549.0" y2="64.0" stroke="#1f2937" stroke-width="2.4" marker-end="url(#ah0)"/><text x="530.5" y="52.0" font-size="15" font-weight="bold" fill="#1f2937" text-anchor="middle">yes</text><line x1="693.0" y1="64.0" x2="730.0" y2="64.0" stroke="#1f2937" stroke-width="2.4" marker-end="url(#ah0)"/><text x="711.5" y="52.0" font-size="15" font-weight="bold" fill="#1f2937" text-anchor="middle">yes</text><line x1="259.0" y1="116.0" x2="259.0" y2="186.0" stroke="#b91c1c" stroke-width="2.4" marker-end="url(#ah1)"/><text x="281.0" y="156.0" font-size="15" font-weight="bold" fill="#b91c1c" text-anchor="middle">yes</text><rect x="189.0" y="188.0" width="140.0" height="62.0" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.6"/><text x="259.0" y="224.2" font-size="16" font-weight="bold" fill="#7f1d1d" text-anchor="middle">DENY</text><line x1="440.0" y1="116.0" x2="440.0" y2="186.0" stroke="#b91c1c" stroke-width="2.4" marker-end="url(#ah1)"/><text x="462.0" y="156.0" font-size="15" font-weight="bold" fill="#b91c1c" text-anchor="middle">no</text><rect x="370.0" y="188.0" width="140.0" height="62.0" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.6"/><text x="440.0" y="224.2" font-size="16" font-weight="bold" fill="#7f1d1d" text-anchor="middle">Implicit DENY</text><line x1="621.0" y1="116.0" x2="621.0" y2="186.0" stroke="#b91c1c" stroke-width="2.4" marker-end="url(#ah1)"/><text x="643.0" y="156.0" font-size="15" font-weight="bold" fill="#b91c1c" text-anchor="middle">no</text><rect x="551.0" y="188.0" width="140.0" height="62.0" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.6"/><text x="621.0" y="224.2" font-size="16" font-weight="bold" fill="#7f1d1d" text-anchor="middle">Implicit DENY</text><text x="440.0" y="280.0" font-size="16" font-weight="bold" fill="#1e3a8a" text-anchor="middle">Anything that is not an explicit allow ends in deny</text></svg>