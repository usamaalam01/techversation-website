<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 312" width="880" height="312" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">m01-cross-account-role</title><desc id="d">Cross-account access with a role: the production account creates a role with a trust policy, a developer in the development account calls AssumeRole, STS returns temporary credentials, and the developer uses the production bucket.</desc><defs><marker id="ah0" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker><marker id="ah1" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#15803d"/></marker><marker id="ah2" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0d9488"/></marker></defs><rect x="0.75" y="0.75" width="878.5" height="310.5" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><rect x="8.0" y="8.0" width="330.0" height="296.0" rx="10" fill="none" stroke="#2563eb" stroke-width="1.8" stroke-dasharray="6 4"/><text x="20.0" y="29.0" font-size="15" font-weight="bold" fill="#1e3a8a" text-anchor="start">Development account</text><rect x="542.0" y="8.0" width="330.0" height="296.0" rx="10" fill="none" stroke="#16a34a" stroke-width="1.8" stroke-dasharray="6 4"/><text x="554.0" y="29.0" font-size="15" font-weight="bold" fill="#14532d" text-anchor="start">Production account</text><rect x="28.0" y="60.0" width="150.0" height="76.0" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="103.0" y="103.2" font-size="16" font-weight="bold" fill="#1e3a8a" text-anchor="middle">Developer or app</text><rect x="28.0" y="170.0" width="290.0" height="100.0" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="173.0" y="206.1" font-size="15" font-weight="bold" fill="#78350f" text-anchor="middle">Identity policy</text><text x="173.0" y="224.9" font-size="15" font-weight="normal" fill="#78350f" text-anchor="middle">allows sts:AssumeRole on the</text><text x="173.0" y="243.6" font-size="15" font-weight="normal" fill="#78350f" text-anchor="middle">production role</text><rect x="562.0" y="60.0" width="290.0" height="90.0" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="707.0" y="100.5" font-size="15" font-weight="bold" fill="#14532d" text-anchor="middle">1 Role with a trust policy</text><text x="707.0" y="119.2" font-size="15" font-weight="normal" fill="#14532d" text-anchor="middle">names the development account</text><rect x="562.0" y="190.0" width="290.0" height="80.0" rx="8" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.6"/><text x="707.0" y="225.5" font-size="15" font-weight="bold" fill="#134e4a" text-anchor="middle">S3 bucket</text><text x="707.0" y="244.2" font-size="15" font-weight="normal" fill="#134e4a" text-anchor="middle">the role's permissions allow access</text><line x1="180.0" y1="86.0" x2="560.0" y2="86.0" stroke="#1f2937" stroke-width="2.4" marker-end="url(#ah0)"/><text x="370.0" y="74.0" font-size="14" font-weight="bold" fill="#1f2937" text-anchor="middle">2  AssumeRole</text><line x1="560.0" y1="118.0" x2="180.0" y2="118.0" stroke="#15803d" stroke-width="2.4" marker-end="url(#ah1)"/><text x="370.0" y="138.0" font-size="14" font-weight="bold" fill="#15803d" text-anchor="middle">3  temporary credentials</text><line x1="320.0" y1="232.0" x2="560.0" y2="232.0" stroke="#0d9488" stroke-width="2.4" marker-end="url(#ah2)"/><text x="440.0" y="220.0" font-size="14" font-weight="bold" fill="#0d9488" text-anchor="middle">4  use the bucket</text></svg>