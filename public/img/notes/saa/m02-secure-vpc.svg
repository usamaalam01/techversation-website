<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 392" width="880" height="392" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">m02-secure-vpc</title><desc id="d">A secure VPC across two Availability Zones: an internet gateway feeds public subnets holding the load balancer and NAT gateway, application servers sit in private subnets, and the database sits in isolated subnets with no internet route.</desc><defs><marker id="ah0" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker></defs><rect x="0.75" y="0.75" width="878.5" height="390.5" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><rect x="8.0" y="8.0" width="864.0" height="376.0" rx="10" fill="none" stroke="#9ca3af" stroke-width="1.8" stroke-dasharray="6 4"/><text x="20.0" y="29.0" font-size="15" font-weight="bold" fill="#374151" text-anchor="start">VPC</text><rect x="310.0" y="28.0" width="260.0" height="40.0" rx="8" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.6"/><text x="440.0" y="52.9" font-size="15" font-weight="bold" fill="#134e4a" text-anchor="middle">Internet gateway</text><rect x="24.0" y="78.0" width="408.0" height="296.0" rx="10" fill="none" stroke="#2563eb" stroke-width="1.8" stroke-dasharray="6 4"/><text x="36.0" y="98.0" font-size="14" font-weight="bold" fill="#1e3a8a" text-anchor="start">Availability Zone A</text><rect x="38.0" y="108.0" width="380.0" height="76.0" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="228.0" y="141.5" font-size="15" font-weight="bold" fill="#1e3a8a" text-anchor="middle">Public subnet</text><text x="228.0" y="160.2" font-size="15" font-weight="normal" fill="#1e3a8a" text-anchor="middle">load balancer and NAT gateway</text><rect x="38.0" y="198.0" width="380.0" height="76.0" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="228.0" y="231.5" font-size="15" font-weight="bold" fill="#14532d" text-anchor="middle">Private subnet</text><text x="228.0" y="250.2" font-size="15" font-weight="normal" fill="#14532d" text-anchor="middle">application servers</text><rect x="38.0" y="288.0" width="380.0" height="76.0" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.6"/><text x="228.0" y="321.5" font-size="15" font-weight="bold" fill="#4c1d95" text-anchor="middle">Isolated subnet</text><text x="228.0" y="340.2" font-size="15" font-weight="normal" fill="#4c1d95" text-anchor="middle">database, no internet route</text><polyline points="310.0,48.0 228.0,48.0 228.0,106.0" fill="none" stroke="#1f2937" stroke-width="2.4" marker-end="url(#ah0)" stroke-linejoin="round"/><line x1="228.0" y1="186.0" x2="228.0" y2="196.0" stroke="#1f2937" stroke-width="2.4" marker-end="url(#ah0)"/><line x1="228.0" y1="276.0" x2="228.0" y2="286.0" stroke="#1f2937" stroke-width="2.4" marker-end="url(#ah0)"/><rect x="448.0" y="78.0" width="408.0" height="296.0" rx="10" fill="none" stroke="#2563eb" stroke-width="1.8" stroke-dasharray="6 4"/><text x="460.0" y="98.0" font-size="14" font-weight="bold" fill="#1e3a8a" text-anchor="start">Availability Zone B</text><rect x="462.0" y="108.0" width="380.0" height="76.0" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="652.0" y="141.5" font-size="15" font-weight="bold" fill="#1e3a8a" text-anchor="middle">Public subnet</text><text x="652.0" y="160.2" font-size="15" font-weight="normal" fill="#1e3a8a" text-anchor="middle">load balancer and NAT gateway</text><rect x="462.0" y="198.0" width="380.0" height="76.0" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="652.0" y="231.5" font-size="15" font-weight="bold" fill="#14532d" text-anchor="middle">Private subnet</text><text x="652.0" y="250.2" font-size="15" font-weight="normal" fill="#14532d" text-anchor="middle">application servers</text><rect x="462.0" y="288.0" width="380.0" height="76.0" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.6"/><text x="652.0" y="321.5" font-size="15" font-weight="bold" fill="#4c1d95" text-anchor="middle">Isolated subnet</text><text x="652.0" y="340.2" font-size="15" font-weight="normal" fill="#4c1d95" text-anchor="middle">database, no internet route</text><polyline points="570.0,48.0 652.0,48.0 652.0,106.0" fill="none" stroke="#1f2937" stroke-width="2.4" marker-end="url(#ah0)" stroke-linejoin="round"/><line x1="652.0" y1="186.0" x2="652.0" y2="196.0" stroke="#1f2937" stroke-width="2.4" marker-end="url(#ah0)"/><line x1="652.0" y1="276.0" x2="652.0" y2="286.0" stroke="#1f2937" stroke-width="2.4" marker-end="url(#ah0)"/></svg>