<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 352" width="880" height="352" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">m05-pod-affinity</title><desc id="d">Pod affinity places a Pod beside Pods with matching labels; anti-affinity keeps replicas on different nodes; the topology key decides the domain.</desc><defs></defs><rect x="0.75" y="0.75" width="878.5" height="350.5" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><text x="220.0" y="30.0" font-size="19" font-weight="bold" fill="#14532d" text-anchor="middle">Affinity: near matching Pods</text><rect x="8.0" y="48.0" width="424.0" height="190.0" rx="12" fill="#f9fafb" stroke="#9ca3af" stroke-width="2"/><text x="26.0" y="76.0" font-size="16" font-weight="bold" fill="#374151" text-anchor="start">Node 1</text><rect x="26.0" y="90.0" width="184.0" height="100.0" rx="8" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.6"/><text x="118.0" y="135.2" font-size="16" font-weight="bold" fill="#134e4a" text-anchor="middle">Cache Pod</text><text x="118.0" y="155.2" font-size="16" font-weight="normal" fill="#134e4a" text-anchor="middle">app=cache</text><rect x="226.0" y="90.0" width="188.0" height="100.0" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="320.0" y="125.2" font-size="16" font-weight="bold" fill="#14532d" text-anchor="middle">Storefront Pod</text><text x="320.0" y="145.2" font-size="16" font-weight="normal" fill="#14532d" text-anchor="middle">wants to be near</text><text x="320.0" y="165.2" font-size="16" font-weight="normal" fill="#14532d" text-anchor="middle">app=cache</text><text x="660.0" y="30.0" font-size="19" font-weight="bold" fill="#7f1d1d" text-anchor="middle">Anti-affinity: apart from matching Pods</text><rect x="448.0" y="48.0" width="134.7" height="190.0" rx="12" fill="#f9fafb" stroke="#9ca3af" stroke-width="2"/><text x="462.0" y="76.0" font-size="16" font-weight="bold" fill="#374151" text-anchor="start">Node 1</text><rect x="458.0" y="96.0" width="114.7" height="120.0" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.6"/><text x="515.3" y="151.5" font-size="15" font-weight="bold" fill="#7f1d1d" text-anchor="middle">Storefront</text><text x="515.3" y="170.2" font-size="15" font-weight="normal" fill="#7f1d1d" text-anchor="middle">app=storefront</text><rect x="592.7" y="48.0" width="134.7" height="190.0" rx="12" fill="#f9fafb" stroke="#9ca3af" stroke-width="2"/><text x="606.7" y="76.0" font-size="16" font-weight="bold" fill="#374151" text-anchor="start">Node 2</text><rect x="602.7" y="96.0" width="114.7" height="120.0" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.6"/><text x="660.0" y="151.5" font-size="15" font-weight="bold" fill="#7f1d1d" text-anchor="middle">Storefront</text><text x="660.0" y="170.2" font-size="15" font-weight="normal" fill="#7f1d1d" text-anchor="middle">app=storefront</text><rect x="737.3" y="48.0" width="134.7" height="190.0" rx="12" fill="#f9fafb" stroke="#9ca3af" stroke-width="2"/><text x="751.3" y="76.0" font-size="16" font-weight="bold" fill="#374151" text-anchor="start">Node 3</text><rect x="747.3" y="96.0" width="114.7" height="120.0" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.6"/><text x="804.7" y="151.5" font-size="15" font-weight="bold" fill="#7f1d1d" text-anchor="middle">Storefront</text><text x="804.7" y="170.2" font-size="15" font-weight="normal" fill="#7f1d1d" text-anchor="middle">app=storefront</text><rect x="8.0" y="258.0" width="864.0" height="38.0" rx="8" fill="#1e3a8a" stroke="#1e3a8a" stroke-width="1.6"/><text x="440.0" y="282.2" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">The topology key, a node label, decides what 'near' and 'apart' mean: a node, a rack or a zone</text><text x="440.0" y="328.0" font-size="16" font-weight="normal" fill="#6b7280" text-anchor="middle">These rules read the labels of other Pods, not the labels of nodes</text></svg>