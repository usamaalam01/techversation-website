<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 264" width="880" height="264" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">m07-dynamic</title><desc id="d">A claim names a StorageClass or takes the default, the provisioner creates the volume on demand and the new PV is bound to the claim; without it an administrator creates each PV by hand.</desc><defs></defs><rect x="0.75" y="0.75" width="878.5" height="262.5" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><polygon points="8.0,8.0 195.0,8.0 215.0,36.0 195.0,64.0 8.0,64.0" fill="#fef3c7" stroke="#d97706" stroke-width="1.8"/><text x="104.5" y="41.8" font-size="18" font-weight="bold" fill="#78350f" text-anchor="middle">1 PVC</text><rect x="10.0" y="68.0" width="193.0" height="96.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="18.0" y="111.5" font-size="15" font-weight="normal" fill="#1f2937" text-anchor="start">asks for storage; names a</text><text x="18.0" y="130.2" font-size="15" font-weight="normal" fill="#1f2937" text-anchor="start">class or takes the default</text><polygon points="227.0,8.0 414.0,8.0 434.0,36.0 414.0,64.0 227.0,64.0 247.0,36.0" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.8"/><text x="330.5" y="41.8" font-size="18" font-weight="bold" fill="#4c1d95" text-anchor="middle">2 StorageClass</text><rect x="229.0" y="68.0" width="193.0" height="96.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="237.0" y="111.5" font-size="15" font-weight="normal" fill="#1f2937" text-anchor="start">provisioner, parameters</text><text x="237.0" y="130.2" font-size="15" font-weight="normal" fill="#1f2937" text-anchor="start">and reclaim policy</text><polygon points="446.0,8.0 633.0,8.0 653.0,36.0 633.0,64.0 446.0,64.0 466.0,36.0" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.8"/><text x="549.5" y="41.8" font-size="18" font-weight="bold" fill="#134e4a" text-anchor="middle">3 Provisioner</text><rect x="448.0" y="68.0" width="193.0" height="96.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="456.0" y="111.5" font-size="15" font-weight="normal" fill="#1f2937" text-anchor="start">creates the volume on</text><text x="456.0" y="130.2" font-size="15" font-weight="normal" fill="#1f2937" text-anchor="start">demand</text><polygon points="665.0,8.0 852.0,8.0 872.0,36.0 852.0,64.0 665.0,64.0 685.0,36.0" fill="#dcfce7" stroke="#16a34a" stroke-width="1.8"/><text x="768.5" y="41.8" font-size="18" font-weight="bold" fill="#14532d" text-anchor="middle">4 PV bound</text><rect x="667.0" y="68.0" width="193.0" height="96.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="675.0" y="111.5" font-size="15" font-weight="normal" fill="#1f2937" text-anchor="start">the new volume is bound</text><text x="675.0" y="130.2" font-size="15" font-weight="normal" fill="#1f2937" text-anchor="start">to the claim</text><rect x="8.0" y="180.0" width="426.0" height="76.0" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.6" stroke-dasharray="7 4"/><text x="221.0" y="213.2" font-size="16" font-weight="bold" fill="#374151" text-anchor="middle">Without dynamic provisioning</text><text x="221.0" y="233.2" font-size="16" font-weight="normal" fill="#374151" text-anchor="middle">an administrator creates each PV by hand</text><rect x="446.0" y="180.0" width="426.0" height="76.0" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="659.0" y="213.2" font-size="16" font-weight="bold" fill="#1e3a8a" text-anchor="middle">WaitForFirstConsumer</text><text x="659.0" y="233.2" font-size="16" font-weight="normal" fill="#1e3a8a" text-anchor="middle">waits for a Pod, then provisions where the Pod runs</text></svg>