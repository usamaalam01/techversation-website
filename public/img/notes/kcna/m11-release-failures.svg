<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 322" width="880" height="322" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">m11-release-failures</title><desc id="d">Left, a Helm upgrade with --wait that is not ready before the timeout is marked FAILED; right, a GitOps tool shows sync status and health as two separate questions.</desc><defs><marker id="ah0" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker></defs><rect x="0.75" y="0.75" width="878.5" height="320.5" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><rect x="8.0" y="8.0" width="424.0" height="306.0" rx="12" fill="#f9fafb" stroke="#9ca3af" stroke-width="2"/><text x="220.0" y="36.0" font-size="19" font-weight="bold" fill="#374151" text-anchor="middle">Helm</text><rect x="28.0" y="50.0" width="384.0" height="50.0" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.6"/><text x="220.0" y="80.2" font-size="16" font-weight="bold" fill="#374151" text-anchor="middle">helm upgrade --wait</text><line x1="220.0" y1="100.0" x2="220.0" y2="114.0" stroke="#374151" stroke-width="2.2" marker-end="url(#ah0)"/><rect x="28.0" y="116.0" width="384.0" height="50.0" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="220.0" y="146.2" font-size="16" font-weight="bold" fill="#78350f" text-anchor="middle">Pods not ready before the timeout</text><line x1="220.0" y1="166.0" x2="220.0" y2="180.0" stroke="#374151" stroke-width="2.2" marker-end="url(#ah0)"/><rect x="28.0" y="182.0" width="384.0" height="50.0" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.6"/><text x="220.0" y="212.2" font-size="16" font-weight="bold" fill="#7f1d1d" text-anchor="middle">Release marked FAILED</text><line x1="220.0" y1="232.0" x2="220.0" y2="246.0" stroke="#374151" stroke-width="2.2" marker-end="url(#ah0)"/><rect x="28.0" y="248.0" width="384.0" height="50.0" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="220.0" y="278.2" font-size="16" font-weight="bold" fill="#14532d" text-anchor="middle">helm history, then helm rollback</text><rect x="448.0" y="8.0" width="424.0" height="306.0" rx="12" fill="#f9fafb" stroke="#9ca3af" stroke-width="2"/><text x="660.0" y="36.0" font-size="19" font-weight="bold" fill="#374151" text-anchor="middle">GitOps tool</text><rect x="468.0" y="54.0" width="384.0" height="118.0" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="660.0" y="98.2" font-size="16" font-weight="bold" fill="#1e3a8a" text-anchor="middle">Sync status</text><text x="660.0" y="118.2" font-size="16" font-weight="normal" fill="#1e3a8a" text-anchor="middle">Synced or OutOfSync</text><text x="660.0" y="138.2" font-size="16" font-weight="normal" fill="#1e3a8a" text-anchor="middle">does the cluster match Git?</text><rect x="468.0" y="188.0" width="384.0" height="118.0" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="660.0" y="232.2" font-size="16" font-weight="bold" fill="#14532d" text-anchor="middle">Health</text><text x="660.0" y="252.2" font-size="16" font-weight="normal" fill="#14532d" text-anchor="middle">Healthy, Progressing or Degraded</text><text x="660.0" y="272.2" font-size="16" font-weight="normal" fill="#14532d" text-anchor="middle">do the resources work?</text></svg>