<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 256" width="880" height="256" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">m13-slo</title><desc id="d">An SLI is a measurement, an SLO is the target for it and an SLA is a contract with consequences; the error budget is 100 percent minus the SLO.</desc><defs><marker id="ah0" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker></defs><rect x="0.75" y="0.75" width="878.5" height="254.5" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><rect x="8.0" y="8.0" width="270.0" height="100.0" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="143.0" y="42.3" font-size="17" font-weight="bold" fill="#1e3a8a" text-anchor="middle">SLI</text><text x="143.0" y="63.5" font-size="17" font-weight="normal" fill="#1e3a8a" text-anchor="middle">a measurement</text><text x="143.0" y="84.8" font-size="17" font-weight="normal" fill="#1e3a8a" text-anchor="middle">for example checkout time</text><rect x="305.0" y="8.0" width="270.0" height="100.0" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="440.0" y="52.9" font-size="17" font-weight="bold" fill="#78350f" text-anchor="middle">SLO</text><text x="440.0" y="74.2" font-size="17" font-weight="normal" fill="#78350f" text-anchor="middle">the target for the SLI</text><rect x="602.0" y="8.0" width="270.0" height="100.0" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.6"/><text x="737.0" y="52.9" font-size="17" font-weight="bold" fill="#7f1d1d" text-anchor="middle">SLA</text><text x="737.0" y="74.2" font-size="17" font-weight="normal" fill="#7f1d1d" text-anchor="middle">a contract with consequences</text><line x1="278.0" y1="58.0" x2="303.0" y2="58.0" stroke="#374151" stroke-width="2.4" marker-end="url(#ah0)"/><line x1="575.0" y1="58.0" x2="600.0" y2="58.0" stroke="#374151" stroke-width="2.4" marker-end="url(#ah0)"/><rect x="8.0" y="140.0" width="760.0" height="46.0" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="388.0" y="170.0" font-size="16" font-weight="bold" fill="#14532d" text-anchor="middle">reliability that meets the SLO</text><rect x="768.0" y="140.0" width="104.0" height="46.0" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="2"/><text x="820.0" y="170.0" font-size="16" font-weight="bold" fill="#78350f" text-anchor="middle">budget</text><text x="440.0" y="218.0" font-size="17" font-weight="bold" fill="#1e3a8a" text-anchor="middle">The error budget is 100% minus the SLO: the unreliability you may spend</text></svg>