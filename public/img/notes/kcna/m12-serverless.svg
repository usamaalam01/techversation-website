<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 234" width="880" height="234" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">m12-serverless</title><desc id="d">An order event, described as a CloudEvent, triggers a function on a serverless platform such as Knative or OpenFaaS, which runs and then scales back down, even to zero.</desc><defs></defs><rect x="0.75" y="0.75" width="878.5" height="232.5" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><polygon points="8.0,8.0 195.0,8.0 215.0,36.0 195.0,64.0 8.0,64.0" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.8"/><text x="104.5" y="41.8" font-size="18" font-weight="bold" fill="#374151" text-anchor="middle">1 Event</text><rect x="10.0" y="68.0" width="193.0" height="96.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="18.0" y="120.9" font-size="15" font-weight="normal" fill="#1f2937" text-anchor="start">an order is placed</text><polygon points="227.0,8.0 414.0,8.0 434.0,36.0 414.0,64.0 227.0,64.0 247.0,36.0" fill="#dbeafe" stroke="#2563eb" stroke-width="1.8"/><text x="330.5" y="41.8" font-size="18" font-weight="bold" fill="#1e3a8a" text-anchor="middle">2 Common format</text><rect x="229.0" y="68.0" width="193.0" height="96.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="237.0" y="111.5" font-size="15" font-weight="normal" fill="#1f2937" text-anchor="start">described as a</text><text x="237.0" y="130.2" font-size="15" font-weight="normal" fill="#1f2937" text-anchor="start">CloudEvent</text><polygon points="446.0,8.0 633.0,8.0 653.0,36.0 633.0,64.0 446.0,64.0 466.0,36.0" fill="#fef3c7" stroke="#d97706" stroke-width="1.8"/><text x="549.5" y="31.0" font-size="18" font-weight="bold" fill="#78350f" text-anchor="middle">3 Function</text><text x="549.5" y="52.6" font-size="18" font-weight="bold" fill="#78350f" text-anchor="middle">platform</text><rect x="448.0" y="68.0" width="193.0" height="96.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="456.0" y="111.5" font-size="15" font-weight="normal" fill="#1f2937" text-anchor="start">Knative or OpenFaaS</text><text x="456.0" y="130.2" font-size="15" font-weight="normal" fill="#1f2937" text-anchor="start">starts the function</text><polygon points="665.0,8.0 852.0,8.0 872.0,36.0 852.0,64.0 665.0,64.0 685.0,36.0" fill="#dcfce7" stroke="#16a34a" stroke-width="1.8"/><text x="768.5" y="31.0" font-size="18" font-weight="bold" fill="#14532d" text-anchor="middle">4 Run, then scale</text><text x="768.5" y="52.6" font-size="18" font-weight="bold" fill="#14532d" text-anchor="middle">back</text><rect x="667.0" y="68.0" width="193.0" height="96.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="675.0" y="120.9" font-size="15" font-weight="normal" fill="#1f2937" text-anchor="start">down again, even to zero</text><rect x="8.0" y="180.0" width="864.0" height="46.0" rx="8" fill="#1e3a8a" stroke="#1e3a8a" stroke-width="1.6"/><text x="440.0" y="208.8" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="middle">Pay per use, and scaling is automatic</text></svg>