<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 290" width="880" height="290" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">m09-pending</title><desc id="d">A Pending Pod is not placed yet; describe shows the reason, which is resources, placement rules or a claim that cannot bind.</desc><defs><marker id="ah0" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker></defs><rect x="0.75" y="0.75" width="878.5" height="288.5" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><rect x="250.0" y="8.0" width="380.0" height="64.0" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="440.0" y="34.9" font-size="17" font-weight="bold" fill="#78350f" text-anchor="middle">Pod is Pending</text><text x="440.0" y="56.1" font-size="17" font-weight="normal" fill="#78350f" text-anchor="middle">run describe and read the events</text><rect x="8.0" y="130.0" width="280.0" height="150.0" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="148.0" y="170.2" font-size="16" font-weight="bold" fill="#1e3a8a" text-anchor="middle">Resources</text><text x="148.0" y="190.2" font-size="16" font-weight="normal" fill="#1e3a8a" text-anchor="middle">not enough CPU or memory for the</text><text x="148.0" y="210.2" font-size="16" font-weight="normal" fill="#1e3a8a" text-anchor="middle">requests</text><text x="148.0" y="230.2" font-size="16" font-weight="normal" fill="#1e3a8a" text-anchor="middle">fix: lower requests, free resources,</text><text x="148.0" y="250.2" font-size="16" font-weight="normal" fill="#1e3a8a" text-anchor="middle">add nodes</text><line x1="440.0" y1="72.0" x2="148.0" y2="128.0" stroke="#374151" stroke-width="2.2" marker-end="url(#ah0)"/><rect x="300.0" y="130.0" width="280.0" height="150.0" rx="8" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.6"/><text x="440.0" y="180.2" font-size="16" font-weight="bold" fill="#134e4a" text-anchor="middle">Placement</text><text x="440.0" y="200.2" font-size="16" font-weight="normal" fill="#134e4a" text-anchor="middle">selectors, affinity or taints match no</text><text x="440.0" y="220.2" font-size="16" font-weight="normal" fill="#134e4a" text-anchor="middle">node</text><text x="440.0" y="240.2" font-size="16" font-weight="normal" fill="#134e4a" text-anchor="middle">a hostPort limits the places</text><line x1="440.0" y1="72.0" x2="440.0" y2="128.0" stroke="#374151" stroke-width="2.2" marker-end="url(#ah0)"/><rect x="592.0" y="130.0" width="280.0" height="150.0" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.6"/><text x="732.0" y="180.2" font-size="16" font-weight="bold" fill="#4c1d95" text-anchor="middle">Storage</text><text x="732.0" y="200.2" font-size="16" font-weight="normal" fill="#4c1d95" text-anchor="middle">a PersistentVolumeClaim cannot</text><text x="732.0" y="220.2" font-size="16" font-weight="normal" fill="#4c1d95" text-anchor="middle">bind</text><text x="732.0" y="240.2" font-size="16" font-weight="normal" fill="#4c1d95" text-anchor="middle">fix: a matching volume or class</text><line x1="440.0" y1="72.0" x2="732.0" y2="128.0" stroke="#374151" stroke-width="2.2" marker-end="url(#ah0)"/></svg>