<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 332" width="880" height="332" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">m00-path</title><desc id="d">The KCNA with arrows to the KCSA, the CKA and the CKAD, and an arrow from the CKA to the CKS; newer exams such as the CNPA also exist.</desc><defs><marker id="ah0" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker></defs><rect x="0.75" y="0.75" width="878.5" height="330.5" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><rect x="8.0" y="116.0" width="190.0" height="86.0" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="103.0" y="153.6" font-size="18" font-weight="bold" fill="#1e3a8a" text-anchor="middle">KCNA</text><text x="103.0" y="176.1" font-size="18" font-weight="normal" fill="#1e3a8a" text-anchor="middle">multiple choice</text><rect x="330.0" y="14.0" width="240.0" height="80.0" rx="8" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.6"/><text x="450.0" y="48.9" font-size="17" font-weight="bold" fill="#134e4a" text-anchor="middle">KCSA</text><text x="450.0" y="70.2" font-size="17" font-weight="normal" fill="#134e4a" text-anchor="middle">security, multiple choice</text><rect x="330.0" y="118.0" width="240.0" height="80.0" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="450.0" y="152.9" font-size="17" font-weight="bold" fill="#78350f" text-anchor="middle">CKA</text><text x="450.0" y="174.2" font-size="17" font-weight="normal" fill="#78350f" text-anchor="middle">administrator, hands-on</text><rect x="330.0" y="222.0" width="240.0" height="80.0" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="450.0" y="256.9" font-size="17" font-weight="bold" fill="#14532d" text-anchor="middle">CKAD</text><text x="450.0" y="278.1" font-size="17" font-weight="normal" fill="#14532d" text-anchor="middle">developer, hands-on</text><rect x="676.0" y="118.0" width="196.0" height="80.0" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.6"/><text x="774.0" y="152.9" font-size="17" font-weight="bold" fill="#7f1d1d" text-anchor="middle">CKS</text><text x="774.0" y="174.2" font-size="17" font-weight="normal" fill="#7f1d1d" text-anchor="middle">needs the CKA first</text><line x1="198.0" y1="140.0" x2="328.0" y2="56.0" stroke="#374151" stroke-width="2.2" marker-end="url(#ah0)"/><line x1="198.0" y1="159.0" x2="328.0" y2="159.0" stroke="#374151" stroke-width="2.2" marker-end="url(#ah0)"/><line x1="198.0" y1="178.0" x2="328.0" y2="262.0" stroke="#374151" stroke-width="2.2" marker-end="url(#ah0)"/><line x1="570.0" y1="158.0" x2="674.0" y2="158.0" stroke="#374151" stroke-width="2.2" marker-end="url(#ah0)"/><text x="440.0" y="320.0" font-size="15" font-weight="normal" fill="#6b7280" text-anchor="middle">newer exams such as the CNPA also exist</text></svg>