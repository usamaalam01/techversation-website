<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 302" width="880" height="302" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">m07-pv-pvc</title><desc id="d">A Pod uses a claim by name, the claim asks for size and access modes and is bound to one PersistentVolume, which is backed by real storage; a claim with no matching volume stays unbound.</desc><defs></defs><rect x="0.75" y="0.75" width="878.5" height="300.5" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><polygon points="8.0,8.0 195.0,8.0 215.0,36.0 195.0,64.0 8.0,64.0" fill="#dbeafe" stroke="#2563eb" stroke-width="1.8"/><text x="104.5" y="41.8" font-size="18" font-weight="bold" fill="#1e3a8a" text-anchor="middle">1 Pod</text><rect x="10.0" y="68.0" width="193.0" height="78.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="18.0" y="111.9" font-size="15" font-weight="normal" fill="#1f2937" text-anchor="start">uses the claim by name</text><polygon points="227.0,8.0 414.0,8.0 434.0,36.0 414.0,64.0 227.0,64.0 247.0,36.0" fill="#fef3c7" stroke="#d97706" stroke-width="1.8"/><text x="330.5" y="41.8" font-size="18" font-weight="bold" fill="#78350f" text-anchor="middle">2 PVC</text><rect x="229.0" y="68.0" width="193.0" height="78.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="237.0" y="102.5" font-size="15" font-weight="normal" fill="#1f2937" text-anchor="start">asks for size and access</text><text x="237.0" y="121.2" font-size="15" font-weight="normal" fill="#1f2937" text-anchor="start">modes</text><polygon points="446.0,8.0 633.0,8.0 653.0,36.0 633.0,64.0 446.0,64.0 466.0,36.0" fill="#dcfce7" stroke="#16a34a" stroke-width="1.8"/><text x="549.5" y="41.8" font-size="18" font-weight="bold" fill="#14532d" text-anchor="middle">3 PV</text><rect x="448.0" y="68.0" width="193.0" height="78.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="456.0" y="102.5" font-size="15" font-weight="normal" fill="#1f2937" text-anchor="start">storage that the cluster</text><text x="456.0" y="121.2" font-size="15" font-weight="normal" fill="#1f2937" text-anchor="start">offers</text><polygon points="665.0,8.0 852.0,8.0 872.0,36.0 852.0,64.0 665.0,64.0 685.0,36.0" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.8"/><text x="768.5" y="41.8" font-size="18" font-weight="bold" fill="#374151" text-anchor="middle">4 Storage</text><rect x="667.0" y="68.0" width="193.0" height="78.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="675.0" y="102.5" font-size="15" font-weight="normal" fill="#1f2937" text-anchor="start">a disk, NFS or a cloud</text><text x="675.0" y="121.2" font-size="15" font-weight="normal" fill="#1f2937" text-anchor="start">volume</text><rect x="8.0" y="162.0" width="426.0" height="64.0" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="221.0" y="189.2" font-size="16" font-weight="bold" fill="#1e3a8a" text-anchor="middle">The application team writes</text><text x="221.0" y="209.2" font-size="16" font-weight="normal" fill="#1e3a8a" text-anchor="middle">the Pod and the claim</text><rect x="446.0" y="162.0" width="426.0" height="64.0" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="659.0" y="189.2" font-size="16" font-weight="bold" fill="#14532d" text-anchor="middle">The administrator provides the volume,</text><text x="659.0" y="209.2" font-size="16" font-weight="normal" fill="#14532d" text-anchor="middle">or dynamic provisioning does</text><rect x="8.0" y="242.0" width="864.0" height="52.0" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.6" stroke-dasharray="7 4"/><text x="440.0" y="273.2" font-size="16" font-weight="bold" fill="#7f1d1d" text-anchor="middle">No matching volume: the claim stays unbound until one appears</text></svg>