<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 252" width="880" height="252" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">m14-maturity</title><desc id="d">Projects move from sandbox to incubating to graduated; a project that reaches the end of its life becomes archived.</desc><defs></defs><rect x="0.75" y="0.75" width="878.5" height="250.5" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><polygon points="8.0,8.0 268.0,8.0 288.0,36.0 268.0,64.0 8.0,64.0" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.8"/><text x="141.0" y="41.8" font-size="18" font-weight="bold" fill="#374151" text-anchor="middle">1 Sandbox</text><rect x="10.0" y="68.0" width="266.0" height="96.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="18.0" y="111.2" font-size="16" font-weight="normal" fill="#1f2937" text-anchor="start">experimental, not yet widely tested</text><text x="18.0" y="131.2" font-size="16" font-weight="normal" fill="#1f2937" text-anchor="start">in production</text><polygon points="300.0,8.0 560.0,8.0 580.0,36.0 560.0,64.0 300.0,64.0 320.0,36.0" fill="#fef3c7" stroke="#d97706" stroke-width="1.8"/><text x="440.0" y="41.8" font-size="18" font-weight="bold" fill="#78350f" text-anchor="middle">2 Incubating</text><rect x="302.0" y="68.0" width="266.0" height="96.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="310.0" y="101.2" font-size="16" font-weight="normal" fill="#1f2937" text-anchor="start">used in production by a small</text><text x="310.0" y="121.2" font-size="16" font-weight="normal" fill="#1f2937" text-anchor="start">number of users, with healthy</text><text x="310.0" y="141.2" font-size="16" font-weight="normal" fill="#1f2937" text-anchor="start">contributors</text><polygon points="592.0,8.0 852.0,8.0 872.0,36.0 852.0,64.0 592.0,64.0 612.0,36.0" fill="#dcfce7" stroke="#16a34a" stroke-width="1.8"/><text x="732.0" y="41.8" font-size="18" font-weight="bold" fill="#14532d" text-anchor="middle">3 Graduated</text><rect x="594.0" y="68.0" width="266.0" height="96.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="602.0" y="111.2" font-size="16" font-weight="normal" fill="#1f2937" text-anchor="start">stable, widely adopted and</text><text x="602.0" y="131.2" font-size="16" font-weight="normal" fill="#1f2937" text-anchor="start">production ready</text><rect x="8.0" y="180.0" width="864.0" height="64.0" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.6" stroke-dasharray="7 4"/><text x="440.0" y="207.2" font-size="16" font-weight="bold" fill="#7f1d1d" text-anchor="middle">Archived</text><text x="440.0" y="227.2" font-size="16" font-weight="normal" fill="#7f1d1d" text-anchor="middle">the project reached the end of its lifecycle and became inactive</text></svg>