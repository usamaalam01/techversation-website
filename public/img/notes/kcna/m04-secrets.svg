<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 330" width="880" height="330" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">m04-secrets</title><desc id="d">A Secret is base64-encoded in a manifest, stored unencrypted in etcd by default and readable by anyone with access; four protections reduce the risk.</desc><defs><marker id="ah0" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker></defs><rect x="0.75" y="0.75" width="878.5" height="328.5" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><rect x="8.0" y="8.0" width="272.0" height="96.0" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="144.0" y="40.3" font-size="17" font-weight="bold" fill="#78350f" text-anchor="middle">In a manifest</text><text x="144.0" y="61.5" font-size="17" font-weight="normal" fill="#78350f" text-anchor="middle">base64 text: encoded, not</text><text x="144.0" y="82.8" font-size="17" font-weight="normal" fill="#78350f" text-anchor="middle">encrypted</text><line x1="282.0" y1="56.0" x2="302.0" y2="56.0" stroke="#1f2937" stroke-width="2.6" marker-end="url(#ah0)"/><rect x="304.0" y="8.0" width="272.0" height="96.0" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.6"/><text x="440.0" y="50.9" font-size="17" font-weight="bold" fill="#7f1d1d" text-anchor="middle">In etcd</text><text x="440.0" y="72.2" font-size="17" font-weight="normal" fill="#7f1d1d" text-anchor="middle">stored unencrypted by default</text><line x1="578.0" y1="56.0" x2="598.0" y2="56.0" stroke="#1f2937" stroke-width="2.6" marker-end="url(#ah0)"/><rect x="600.0" y="8.0" width="272.0" height="96.0" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.6"/><text x="736.0" y="50.9" font-size="17" font-weight="bold" fill="#7f1d1d" text-anchor="middle">Who can read it</text><text x="736.0" y="72.2" font-size="17" font-weight="normal" fill="#7f1d1d" text-anchor="middle">anyone with API or etcd access</text><text x="440.0" y="146.0" font-size="20" font-weight="bold" fill="#14532d" text-anchor="middle">Protect Secrets with</text><rect x="8.0" y="166.0" width="205.5" height="100.0" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="110.8" y="221.5" font-size="17" font-weight="bold" fill="#14532d" text-anchor="middle">Encryption at rest</text><rect x="227.5" y="166.0" width="205.5" height="100.0" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="330.2" y="210.9" font-size="17" font-weight="bold" fill="#14532d" text-anchor="middle">RBAC with least</text><text x="330.2" y="232.2" font-size="17" font-weight="bold" fill="#14532d" text-anchor="middle">privilege</text><rect x="447.0" y="166.0" width="205.5" height="100.0" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="549.8" y="210.9" font-size="17" font-weight="bold" fill="#14532d" text-anchor="middle">Access for specific</text><text x="549.8" y="232.2" font-size="17" font-weight="bold" fill="#14532d" text-anchor="middle">containers only</text><rect x="666.5" y="166.0" width="205.5" height="100.0" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="769.2" y="210.9" font-size="17" font-weight="bold" fill="#14532d" text-anchor="middle">An external secret</text><text x="769.2" y="232.2" font-size="17" font-weight="bold" fill="#14532d" text-anchor="middle">store</text><rect x="8.0" y="282.0" width="864.0" height="40.0" rx="8" fill="#1e3a8a" stroke="#1e3a8a" stroke-width="1.6"/><text x="440.0" y="307.9" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="middle">base64 is not encryption</text></svg>