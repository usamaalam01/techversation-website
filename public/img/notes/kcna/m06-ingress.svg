<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 350" width="880" height="350" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">m06-ingress</title><desc id="d">Visitors reach an Ingress controller that applies the host and path rules of an Ingress and forwards each request to the storefront or orders Service.</desc><defs><marker id="ah0" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker><marker id="ah1" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker><marker id="ah2" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker></defs><rect x="0.75" y="0.75" width="878.5" height="348.5" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><rect x="8.0" y="120.0" width="148.0" height="90.0" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.6"/><text x="82.0" y="160.2" font-size="16" font-weight="bold" fill="#374151" text-anchor="middle">Visitors</text><text x="82.0" y="180.2" font-size="16" font-weight="normal" fill="#374151" text-anchor="middle">on the internet</text><rect x="196.0" y="8.0" width="240.0" height="74.0" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.6" stroke-dasharray="7 4"/><text x="316.0" y="40.2" font-size="16" font-weight="bold" fill="#4c1d95" text-anchor="middle">Ingress</text><text x="316.0" y="60.2" font-size="16" font-weight="normal" fill="#4c1d95" text-anchor="middle">rules: host and path</text><rect x="196.0" y="112.0" width="240.0" height="124.0" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="316.0" y="159.2" font-size="16" font-weight="bold" fill="#78350f" text-anchor="middle">Ingress controller</text><text x="316.0" y="179.2" font-size="16" font-weight="normal" fill="#78350f" text-anchor="middle">a running program that applies</text><text x="316.0" y="199.2" font-size="16" font-weight="normal" fill="#78350f" text-anchor="middle">the rules</text><line x1="156.0" y1="165.0" x2="194.0" y2="165.0" stroke="#374151" stroke-width="2.4" marker-end="url(#ah0)"/><line x1="316.0" y1="82.0" x2="316.0" y2="110.0" stroke="#7c3aed" stroke-width="2.2" stroke-dasharray="6 4" marker-end="url(#ah1)"/><rect x="486.0" y="40.0" width="190.0" height="86.0" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="581.0" y="78.2" font-size="16" font-weight="bold" fill="#1e3a8a" text-anchor="middle">storefront Service</text><text x="581.0" y="98.2" font-size="16" font-weight="normal" fill="#1e3a8a" text-anchor="middle">path /</text><rect x="486.0" y="196.0" width="190.0" height="86.0" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="581.0" y="234.2" font-size="16" font-weight="bold" fill="#1e3a8a" text-anchor="middle">orders Service</text><text x="581.0" y="254.2" font-size="16" font-weight="normal" fill="#1e3a8a" text-anchor="middle">path /orders</text><rect x="716.0" y="40.0" width="156.0" height="86.0" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="794.0" y="88.2" font-size="16" font-weight="bold" fill="#14532d" text-anchor="middle">storefront Pods</text><rect x="716.0" y="196.0" width="156.0" height="86.0" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="794.0" y="244.2" font-size="16" font-weight="bold" fill="#14532d" text-anchor="middle">orders Pods</text><line x1="436.0" y1="150.0" x2="484.0" y2="83.0" stroke="#d97706" stroke-width="2.2" marker-end="url(#ah2)"/><line x1="436.0" y1="198.0" x2="484.0" y2="239.0" stroke="#d97706" stroke-width="2.2" marker-end="url(#ah2)"/><line x1="676.0" y1="83.0" x2="714.0" y2="83.0" stroke="#374151" stroke-width="2.2" marker-end="url(#ah0)"/><line x1="676.0" y1="239.0" x2="714.0" y2="239.0" stroke="#374151" stroke-width="2.2" marker-end="url(#ah0)"/><rect x="8.0" y="298.0" width="864.0" height="44.0" rx="8" fill="#1e3a8a" stroke="#1e3a8a" stroke-width="1.6"/><text x="440.0" y="325.5" font-size="17" font-weight="bold" fill="#ffffff" text-anchor="middle">Without an Ingress controller, the Ingress rules do nothing</text></svg>