<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 436" width="880" height="436" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">m03-choose-controller</title><desc id="d">Decision path from the nature of the work to Job, CronJob, DaemonSet, StatefulSet or Deployment.</desc><defs><marker id="ah0" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker></defs><rect x="0.75" y="0.75" width="878.5" height="434.5" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><rect x="250.0" y="8.0" width="380.0" height="56.0" rx="8" fill="#1e3a8a" stroke="#1e3a8a" stroke-width="1.6"/><text x="440.0" y="41.8" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="middle">What is the nature of the work?</text><polyline points="440.0,64.0 440.0,86.0 190.0,86.0 190.0,104.0" fill="none" stroke="#1f2937" stroke-width="2.4" marker-end="url(#ah0)" stroke-linejoin="round"/><polyline points="440.0,64.0 440.0,86.0 630.0,86.0 630.0,104.0" fill="none" stroke="#1f2937" stroke-width="2.4" marker-end="url(#ah0)" stroke-linejoin="round"/><rect x="10.0" y="106.0" width="360.0" height="52.0" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="190.0" y="137.5" font-size="17" font-weight="bold" fill="#78350f" text-anchor="middle">It ends when the work is done</text><rect x="400.0" y="106.0" width="470.0" height="52.0" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="635.0" y="137.5" font-size="17" font-weight="bold" fill="#1e3a8a" text-anchor="middle">It keeps running</text><line x1="190.0" y1="158.0" x2="190.0" y2="184.0" stroke="#6b7280" stroke-width="2"/><rect x="10.0" y="184.0" width="360.0" height="74.0" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="190.0" y="215.6" font-size="18" font-weight="bold" fill="#14532d" text-anchor="middle">Job</text><text x="190.0" y="238.1" font-size="18" font-weight="normal" fill="#14532d" text-anchor="middle">Runs once</text><line x1="190.0" y1="258.0" x2="190.0" y2="276.0" stroke="#6b7280" stroke-width="2"/><rect x="10.0" y="276.0" width="360.0" height="74.0" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="190.0" y="307.6" font-size="18" font-weight="bold" fill="#14532d" text-anchor="middle">CronJob</text><text x="190.0" y="330.1" font-size="18" font-weight="normal" fill="#14532d" text-anchor="middle">Repeats on a schedule</text><line x1="635.0" y1="158.0" x2="635.0" y2="184.0" stroke="#6b7280" stroke-width="2"/><rect x="400.0" y="184.0" width="470.0" height="68.0" rx="8" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.6"/><text x="635.0" y="212.6" font-size="18" font-weight="bold" fill="#134e4a" text-anchor="middle">DaemonSet</text><text x="635.0" y="235.1" font-size="18" font-weight="normal" fill="#134e4a" text-anchor="middle">Needs to run on every node</text><line x1="635.0" y1="258.0" x2="635.0" y2="264.0" stroke="#6b7280" stroke-width="2"/><rect x="400.0" y="264.0" width="470.0" height="68.0" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.6"/><text x="635.0" y="292.6" font-size="18" font-weight="bold" fill="#4c1d95" text-anchor="middle">StatefulSet</text><text x="635.0" y="315.1" font-size="18" font-weight="normal" fill="#4c1d95" text-anchor="middle">Needs a stable name and its own volume</text><line x1="635.0" y1="338.0" x2="635.0" y2="344.0" stroke="#6b7280" stroke-width="2"/><rect x="400.0" y="344.0" width="470.0" height="68.0" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="635.0" y="372.6" font-size="18" font-weight="bold" fill="#1e3a8a" text-anchor="middle">Deployment</text><text x="635.0" y="395.1" font-size="18" font-weight="normal" fill="#1e3a8a" text-anchor="middle">Pods can be replaced at will</text></svg>