<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 300" width="880" height="300" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">m13-prometheus</title><desc id="d">A Prometheus server scrapes metrics over HTTP from an application and an exporter, stores time series, answers PromQL queries from Grafana and sends alerts to Alertmanager.</desc><defs><marker id="ah0" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker></defs><rect x="0.75" y="0.75" width="878.5" height="298.5" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><text x="113.0" y="26.0" font-size="17" font-weight="bold" fill="#374151" text-anchor="middle">Targets</text><rect x="8.0" y="40.0" width="210.0" height="70.0" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="113.0" y="70.2" font-size="16" font-weight="bold" fill="#14532d" text-anchor="middle">Application</text><text x="113.0" y="90.2" font-size="16" font-weight="normal" fill="#14532d" text-anchor="middle">exposes metrics</text><rect x="8.0" y="130.0" width="210.0" height="70.0" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="113.0" y="160.2" font-size="16" font-weight="bold" fill="#14532d" text-anchor="middle">Exporter</text><text x="113.0" y="180.2" font-size="16" font-weight="normal" fill="#14532d" text-anchor="middle">for a service with none</text><rect x="330.0" y="70.0" width="220.0" height="110.0" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="440.0" y="110.2" font-size="16" font-weight="bold" fill="#78350f" text-anchor="middle">Prometheus server</text><text x="440.0" y="130.2" font-size="16" font-weight="normal" fill="#78350f" text-anchor="middle">scrapes and stores time</text><text x="440.0" y="150.2" font-size="16" font-weight="normal" fill="#78350f" text-anchor="middle">series</text><line x1="328.0" y1="100.0" x2="220.0" y2="76.0" stroke="#374151" stroke-width="2.2" marker-end="url(#ah0)"/><line x1="328.0" y1="150.0" x2="220.0" y2="166.0" stroke="#374151" stroke-width="2.2" marker-end="url(#ah0)"/><text x="274.0" y="62.0" font-size="15" font-weight="bold" fill="#374151" text-anchor="middle">pull</text><rect x="662.0" y="40.0" width="210.0" height="70.0" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="767.0" y="70.2" font-size="16" font-weight="bold" fill="#1e3a8a" text-anchor="middle">Grafana</text><text x="767.0" y="90.2" font-size="16" font-weight="normal" fill="#1e3a8a" text-anchor="middle">PromQL queries</text><rect x="662.0" y="130.0" width="210.0" height="70.0" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.6"/><text x="767.0" y="160.2" font-size="16" font-weight="bold" fill="#7f1d1d" text-anchor="middle">Alertmanager</text><text x="767.0" y="180.2" font-size="16" font-weight="normal" fill="#7f1d1d" text-anchor="middle">routes alerts</text><line x1="660.0" y1="76.0" x2="552.0" y2="100.0" stroke="#374151" stroke-width="2.2" marker-end="url(#ah0)"/><line x1="552.0" y1="150.0" x2="660.0" y2="166.0" stroke="#374151" stroke-width="2.2" marker-end="url(#ah0)"/><text x="606.0" y="62.0" font-size="15" font-weight="bold" fill="#374151" text-anchor="middle">query</text><text x="606.0" y="196.0" font-size="15" font-weight="bold" fill="#374151" text-anchor="middle">alerts</text><rect x="8.0" y="232.0" width="864.0" height="56.0" rx="8" fill="#1e3a8a" stroke="#1e3a8a" stroke-width="1.6"/><text x="440.0" y="265.5" font-size="17" font-weight="bold" fill="#ffffff" text-anchor="middle">Metric types: counter, gauge, histogram, summary</text></svg>