<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 304" width="880" height="304" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">m10-pipeline</title><desc id="d">A pipeline from commit through build and test to acceptance and production; CI ends with a tested artifact, continuous delivery reaches acceptance and continuous deployment reaches production.</desc><defs></defs><rect x="0.75" y="0.75" width="878.5" height="302.5" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><polygon points="8.0,8.0 195.0,8.0 215.0,34.0 195.0,60.0 8.0,60.0" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.8"/><text x="104.5" y="39.8" font-size="18" font-weight="bold" fill="#374151" text-anchor="middle">1 Commit</text><rect x="10.0" y="64.0" width="193.0" height="64.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="18.0" y="100.9" font-size="15" font-weight="normal" fill="#1f2937" text-anchor="start">a change is pushed to Git</text><polygon points="227.0,8.0 414.0,8.0 434.0,34.0 414.0,60.0 227.0,60.0 247.0,34.0" fill="#dbeafe" stroke="#2563eb" stroke-width="1.8"/><text x="330.5" y="39.8" font-size="18" font-weight="bold" fill="#1e3a8a" text-anchor="middle">2 Build and test</text><rect x="229.0" y="64.0" width="193.0" height="64.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="237.0" y="91.5" font-size="15" font-weight="normal" fill="#1f2937" text-anchor="start">CI ends with a tested</text><text x="237.0" y="110.2" font-size="15" font-weight="normal" fill="#1f2937" text-anchor="start">artifact</text><polygon points="446.0,8.0 633.0,8.0 653.0,34.0 633.0,60.0 446.0,60.0 466.0,34.0" fill="#fef3c7" stroke="#d97706" stroke-width="1.8"/><text x="549.5" y="39.8" font-size="18" font-weight="bold" fill="#78350f" text-anchor="middle">3 Acceptance</text><rect x="448.0" y="64.0" width="193.0" height="64.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="456.0" y="91.5" font-size="15" font-weight="normal" fill="#1f2937" text-anchor="start">reached by continuous</text><text x="456.0" y="110.2" font-size="15" font-weight="normal" fill="#1f2937" text-anchor="start">delivery</text><polygon points="665.0,8.0 852.0,8.0 872.0,34.0 852.0,60.0 665.0,60.0 685.0,34.0" fill="#dcfce7" stroke="#16a34a" stroke-width="1.8"/><text x="768.5" y="39.8" font-size="18" font-weight="bold" fill="#14532d" text-anchor="middle">4 Production</text><rect x="667.0" y="64.0" width="193.0" height="64.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="675.0" y="91.5" font-size="15" font-weight="normal" fill="#1f2937" text-anchor="start">reached by continuous</text><text x="675.0" y="110.2" font-size="15" font-weight="normal" fill="#1f2937" text-anchor="start">deployment</text><rect x="8.0" y="144.0" width="426.0" height="44.0" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="221.0" y="171.5" font-size="17" font-weight="bold" fill="#1e3a8a" text-anchor="middle">CI</text><rect x="8.0" y="196.0" width="645.0" height="44.0" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="330.5" y="223.5" font-size="17" font-weight="bold" fill="#78350f" text-anchor="middle">Continuous delivery</text><rect x="8.0" y="248.0" width="864.0" height="44.0" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="440.0" y="275.5" font-size="17" font-weight="bold" fill="#14532d" text-anchor="middle">Continuous deployment</text></svg>