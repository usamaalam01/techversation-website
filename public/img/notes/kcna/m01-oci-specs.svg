dth="254.7" height="48.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="440.0" y="224.9" font-size="15" font-weight="normal" fill="#1f2937" text-anchor="middle">followed by runc</text><line x1="734.7" y1="60.0" x2="734.7" y2="80.0" stroke="#6b7280" stroke-width="2"/><rect x="597.3" y="80.0" width="274.7" height="104.0" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="734.7" y="116.3" font-size="17" font-weight="bold" fill="#78350f" text-anchor="middle">Distribution specification</text><text x="734.7" y="137.5" font-size="17" font-weight="normal" fill="#78350f" text-anchor="middle">the API protocol for distributing</text><text x="734.7" y="158.8" font-size="17" font-weight="normal" fill="#78350f" text-anchor="middle">content</text><rect x="607.3" y="196.0" width="254.7" height="48.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="734.7" y="224.9" font-size="15" font-weight="normal" fill="#1f2937" text-anchor="middle">how registries push and pull</text></svg>