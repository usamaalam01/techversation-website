<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 344" width="880" height="344" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">m03-container-types</title><desc id="d">Init containers run first, one at a time; sidecar and app containers then run together; an ephemeral container joins later for debugging.</desc><defs><marker id="ah0" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker></defs><rect x="0.75" y="0.75" width="878.5" height="342.5" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><polygon points="8.0,8.0 270.0,8.0 290.0,36.0 270.0,64.0 8.0,64.0" fill="#dbeafe" stroke="#2563eb" stroke-width="1.8"/><text x="142.0" y="41.8" font-size="18" font-weight="bold" fill="#1e3a8a" text-anchor="middle">1 Pod starts</text><polygon points="300.0,8.0 562.0,8.0 582.0,36.0 562.0,64.0 300.0,64.0 320.0,36.0" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.8"/><text x="441.0" y="41.8" font-size="18" font-weight="bold" fill="#134e4a" text-anchor="middle">2 Pod runs</text><polygon points="592.0,8.0 840.0,8.0 860.0,36.0 840.0,64.0 592.0,64.0 612.0,36.0" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.8"/><text x="726.0" y="41.8" font-size="18" font-weight="bold" fill="#4c1d95" text-anchor="middle">3 Later, to debug</text><rect x="8.0" y="84.0" width="268.0" height="56.0" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="142.0" y="117.5" font-size="17" font-weight="bold" fill="#1e3a8a" text-anchor="middle">Init container 1</text><line x1="142.0" y1="142.0" x2="142.0" y2="164.0" stroke="#1f2937" stroke-width="2.6" marker-end="url(#ah0)"/><rect x="8.0" y="166.0" width="268.0" height="56.0" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="142.0" y="199.5" font-size="17" font-weight="bold" fill="#1e3a8a" text-anchor="middle">Init container 2</text><rect x="8.0" y="240.0" width="268.0" height="84.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="18.0" y="277.5" font-size="15" font-weight="normal" fill="#1f2937" text-anchor="start">Run one at a time, in order. Each</text><text x="18.0" y="296.2" font-size="15" font-weight="normal" fill="#1f2937" text-anchor="start">must finish before the next starts.</text><rect x="300.0" y="84.0" width="128.0" height="138.0" rx="8" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.6"/><text x="364.0" y="148.2" font-size="16" font-weight="bold" fill="#134e4a" text-anchor="middle">App container</text><text x="364.0" y="168.2" font-size="16" font-weight="normal" fill="#134e4a" text-anchor="middle">runs the app</text><rect x="440.0" y="84.0" width="128.0" height="138.0" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="504.0" y="128.2" font-size="16" font-weight="bold" fill="#78350f" text-anchor="middle">Sidecar</text><text x="504.0" y="148.2" font-size="16" font-weight="bold" fill="#78350f" text-anchor="middle">container</text><text x="504.0" y="168.2" font-size="16" font-weight="normal" fill="#78350f" text-anchor="middle">restartPolicy:</text><text x="504.0" y="188.2" font-size="16" font-weight="normal" fill="#78350f" text-anchor="middle">Always</text><rect x="300.0" y="240.0" width="268.0" height="84.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="310.0" y="268.1" font-size="15" font-weight="normal" fill="#1f2937" text-anchor="start">The sidecar starts in the init</text><text x="310.0" y="286.9" font-size="15" font-weight="normal" fill="#1f2937" text-anchor="start">sequence and keeps running beside</text><text x="310.0" y="305.6" font-size="15" font-weight="normal" fill="#1f2937" text-anchor="start">the app.</text><rect x="592.0" y="84.0" width="268.0" height="138.0" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.6" stroke-dasharray="7 4"/><text x="726.0" y="148.2" font-size="16" font-weight="bold" fill="#4c1d95" text-anchor="middle">Ephemeral container</text><text x="726.0" y="168.2" font-size="16" font-weight="normal" fill="#4c1d95" text-anchor="middle">added to a running Pod</text><rect x="592.0" y="240.0" width="268.0" height="84.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="602.0" y="277.5" font-size="15" font-weight="normal" fill="#1f2937" text-anchor="start">For debugging only. It is never</text><text x="602.0" y="296.2" font-size="15" font-weight="normal" fill="#1f2937" text-anchor="start">restarted by Kubernetes.</text></svg>