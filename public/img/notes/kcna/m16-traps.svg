<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 292" width="880" height="292" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">m16-traps</title><desc id="d">Six look-alike pairs with the key difference of each: Deployment and StatefulSet, Role and ClusterRole, PV and PVC, liveness and readiness, Ingress and Gateway API, requests and limits.</desc><defs></defs><rect x="0.75" y="0.75" width="878.5" height="290.5" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><rect x="8.0" y="8.0" width="280.0" height="130.0" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="148.0" y="48.2" font-size="16" font-weight="bold" fill="#1e3a8a" text-anchor="middle">Deployment or StatefulSet</text><text x="148.0" y="68.2" font-size="16" font-weight="normal" fill="#1e3a8a" text-anchor="middle">interchangeable Pods</text><text x="148.0" y="88.2" font-size="16" font-weight="normal" fill="#1e3a8a" text-anchor="middle">versus</text><text x="148.0" y="108.2" font-size="16" font-weight="normal" fill="#1e3a8a" text-anchor="middle">stable name and storage</text><rect x="300.0" y="8.0" width="280.0" height="130.0" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="440.0" y="48.2" font-size="16" font-weight="bold" fill="#14532d" text-anchor="middle">Role or ClusterRole</text><text x="440.0" y="68.2" font-size="16" font-weight="normal" fill="#14532d" text-anchor="middle">one namespace</text><text x="440.0" y="88.2" font-size="16" font-weight="normal" fill="#14532d" text-anchor="middle">versus</text><text x="440.0" y="108.2" font-size="16" font-weight="normal" fill="#14532d" text-anchor="middle">cluster-wide</text><rect x="592.0" y="8.0" width="280.0" height="130.0" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="732.0" y="48.2" font-size="16" font-weight="bold" fill="#78350f" text-anchor="middle">PV or PVC</text><text x="732.0" y="68.2" font-size="16" font-weight="normal" fill="#78350f" text-anchor="middle">the storage</text><text x="732.0" y="88.2" font-size="16" font-weight="normal" fill="#78350f" text-anchor="middle">versus</text><text x="732.0" y="108.2" font-size="16" font-weight="normal" fill="#78350f" text-anchor="middle">the request for it</text><rect x="8.0" y="150.0" width="280.0" height="130.0" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.6"/><text x="148.0" y="190.2" font-size="16" font-weight="bold" fill="#7f1d1d" text-anchor="middle">Liveness or readiness</text><text x="148.0" y="210.2" font-size="16" font-weight="normal" fill="#7f1d1d" text-anchor="middle">restart</text><text x="148.0" y="230.2" font-size="16" font-weight="normal" fill="#7f1d1d" text-anchor="middle">versus</text><text x="148.0" y="250.2" font-size="16" font-weight="normal" fill="#7f1d1d" text-anchor="middle">traffic</text><rect x="300.0" y="150.0" width="280.0" height="130.0" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.6"/><text x="440.0" y="190.2" font-size="16" font-weight="bold" fill="#4c1d95" text-anchor="middle">Ingress or Gateway API</text><text x="440.0" y="210.2" font-size="16" font-weight="normal" fill="#4c1d95" text-anchor="middle">frozen</text><text x="440.0" y="230.2" font-size="16" font-weight="normal" fill="#4c1d95" text-anchor="middle">versus</text><text x="440.0" y="250.2" font-size="16" font-weight="normal" fill="#4c1d95" text-anchor="middle">the successor</text><rect x="592.0" y="150.0" width="280.0" height="130.0" rx="8" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.6"/><text x="732.0" y="190.2" font-size="16" font-weight="bold" fill="#134e4a" text-anchor="middle">Requests or limits</text><text x="732.0" y="210.2" font-size="16" font-weight="normal" fill="#134e4a" text-anchor="middle">placement</text><text x="732.0" y="230.2" font-size="16" font-weight="normal" fill="#134e4a" text-anchor="middle">versus</text><text x="732.0" y="250.2" font-size="16" font-weight="normal" fill="#134e4a" text-anchor="middle">enforced</text></svg