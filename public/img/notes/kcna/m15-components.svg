<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 330" width="880" height="330" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">m15-components</title><desc id="d">A control plane box with five components and a node box with three, each with its job; everything goes through the API server and only the API server talks to etcd.</desc><defs></defs><rect x="0.75" y="0.75" width="878.5" height="328.5" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><rect x="8.0" y="8.0" width="520.0" height="314.0" rx="12" fill="#f9fafb" stroke="#9ca3af" stroke-width="2"/><text x="28.0" y="34.0" font-size="18" font-weight="bold" fill="#374151" text-anchor="start">Control plane</text><rect x="28.0" y="46.0" width="480.0" height="48.0" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="268.0" y="65.5" font-size="15" font-weight="bold" fill="#1e3a8a" text-anchor="middle">kube-apiserver</text><text x="268.0" y="84.2" font-size="15" font-weight="normal" fill="#1e3a8a" text-anchor="middle">the front door</text><rect x="28.0" y="100.0" width="480.0" height="48.0" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="268.0" y="119.5" font-size="15" font-weight="bold" fill="#78350f" text-anchor="middle">etcd</text><text x="268.0" y="138.2" font-size="15" font-weight="normal" fill="#78350f" text-anchor="middle">keeps the state</text><rect x="28.0" y="154.0" width="480.0" height="48.0" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="268.0" y="173.5" font-size="15" font-weight="bold" fill="#14532d" text-anchor="middle">kube-scheduler</text><text x="268.0" y="192.2" font-size="15" font-weight="normal" fill="#14532d" text-anchor="middle">places Pods</text><rect x="28.0" y="208.0" width="480.0" height="48.0" rx="8" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.6"/><text x="268.0" y="227.5" font-size="15" font-weight="bold" fill="#134e4a" text-anchor="middle">kube-controller-manager</text><text x="268.0" y="246.2" font-size="15" font-weight="normal" fill="#134e4a" text-anchor="middle">runs the controllers</text><rect x="28.0" y="262.0" width="480.0" height="48.0" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.6"/><text x="268.0" y="281.5" font-size="15" font-weight="bold" fill="#374151" text-anchor="middle">cloud-controller-manager</text><text x="268.0" y="300.2" font-size="15" font-weight="normal" fill="#374151" text-anchor="middle">links to the cloud</text><rect x="548.0" y="8.0" width="324.0" height="200.0" rx="12" fill="#f9fafb" stroke="#9ca3af" stroke-width="2"/><text x="568.0" y="34.0" font-size="18" font-weight="bold" fill="#374151" text-anchor="start">Each node</text><rect x="568.0" y="46.0" width="284.0" height="44.0" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="710.0" y="63.5" font-size="15" font-weight="bold" fill="#14532d" text-anchor="middle">kubelet</text><text x="710.0" y="82.2" font-size="15" font-weight="normal" fill="#14532d" text-anchor="middle">runs Pods</text><rect x="568.0" y="96.0" width="284.0" height="44.0" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="710.0" y="113.5" font-size="15" font-weight="bold" fill="#78350f" text-anchor="middle">kube-proxy</text><text x="710.0" y="132.2" font-size="15" font-weight="normal" fill="#78350f" text-anchor="middle">sets up Service rules</text><rect x="568.0" y="146.0" width="284.0" height="44.0" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="710.0" y="163.5" font-size="15" font-weight="bold" fill="#1e3a8a" text-anchor="middle">container runtime</text><text x="710.0" y="182.2" font-size="15" font-weight="normal" fill="#1e3a8a" text-anchor="middle">runs containers</text><rect x="548.0" y="224.0" width="324.0" height="98.0" rx="8" fill="#1e3a8a" stroke="#1e3a8a" stroke-width="1.6"/><text x="710.0" y="268.2" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">Everything goes through the API server;</text><text x="710.0" y="288.2" font-size="16" font-weight="normal" fill="#ffffff" text-anchor="middle">only it talks to etcd</text></svg>