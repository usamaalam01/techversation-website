<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 316" width="880" height="316" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">m06-network-model</title><desc id="d">Two nodes with two Pods each; every Pod has its own IP and reaches Pods on the other node directly, with no NAT; three components assign Pod, Service and Node IPs.</desc><defs><marker id="ah0" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker></defs><rect x="0.75" y="0.75" width="878.5" height="314.5" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><rect x="8.0" y="8.0" width="380.0" height="190.0" rx="12" fill="#f9fafb" stroke="#9ca3af" stroke-width="2"/><text x="26.0" y="36.0" font-size="18" font-weight="bold" fill="#374151" text-anchor="start">Node 1</text><rect x="24.0" y="54.0" width="164.0" height="120.0" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="106.0" y="109.2" font-size="16" font-weight="bold" fill="#14532d" text-anchor="middle">Pod A</text><text x="106.0" y="129.2" font-size="16" font-weight="normal" fill="#14532d" text-anchor="middle">its own IP</text><rect x="200.0" y="54.0" width="164.0" height="120.0" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="282.0" y="109.2" font-size="16" font-weight="bold" fill="#14532d" text-anchor="middle">Pod B</text><text x="282.0" y="129.2" font-size="16" font-weight="normal" fill="#14532d" text-anchor="middle">its own IP</text><rect x="492.0" y="8.0" width="380.0" height="190.0" rx="12" fill="#f9fafb" stroke="#9ca3af" stroke-width="2"/><text x="510.0" y="36.0" font-size="18" font-weight="bold" fill="#374151" text-anchor="start">Node 2</text><rect x="508.0" y="54.0" width="164.0" height="120.0" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="590.0" y="109.2" font-size="16" font-weight="bold" fill="#14532d" text-anchor="middle">Pod C</text><text x="590.0" y="129.2" font-size="16" font-weight="normal" fill="#14532d" text-anchor="middle">its own IP</text><rect x="684.0" y="54.0" width="164.0" height="120.0" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="766.0" y="109.2" font-size="16" font-weight="bold" fill="#14532d" text-anchor="middle">Pod D</text><text x="766.0" y="129.2" font-size="16" font-weight="normal" fill="#14532d" text-anchor="middle">its own IP</text><text x="436.0" y="84.0" font-size="16" font-weight="bold" fill="#14532d" text-anchor="middle">direct</text><line x1="368.0" y1="100.0" x2="504.0" y2="100.0" stroke="#16a34a" stroke-width="2.4" marker-end="url(#ah0)"/><line x1="504.0" y1="128.0" x2="368.0" y2="128.0" stroke="#16a34a" stroke-width="2.4" marker-end="url(#ah0)"/><text x="436.0" y="158.0" font-size="16" font-weight="bold" fill="#14532d" text-anchor="middle">no NAT</text><rect x="8.0" y="214.0" width="280.0" height="92.0" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="148.0" y="255.2" font-size="16" font-weight="bold" fill="#14532d" text-anchor="middle">Pod IPs</text><text x="148.0" y="275.2" font-size="16" font-weight="normal" fill="#14532d" text-anchor="middle">set by the network plugin</text><rect x="300.0" y="214.0" width="280.0" height="92.0" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="440.0" y="255.2" font-size="16" font-weight="bold" fill="#1e3a8a" text-anchor="middle">Service IPs</text><text x="440.0" y="275.2" font-size="16" font-weight="normal" fill="#1e3a8a" text-anchor="middle">set by the kube-apiserver</text><rect x="592.0" y="214.0" width="280.0" height="92.0" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="732.0" y="245.2" font-size="16" font-weight="bold" fill="#78350f" text-anchor="middle">Node IPs</text><text x="732.0" y="265.2" font-size="16" font-weight="normal" fill="#78350f" text-anchor="middle">set by the kubelet or the</text><text x="732.0" y="285.2" font-size="16" font-weight="no