<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 268" width="880" height="268" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">m05-autoscalers</title><desc id="d">The HPA adds Pods, the VPA resizes Pods, the Cluster Autoscaler adds nodes and KEDA scales from events; the Metrics Server feeds the HPA and the VPA.</desc><defs></defs><rect x="0.75" y="0.75" width="878.5" height="266.5" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><rect x="8.0" y="8.0" width="205.5" height="56.0" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="110.8" y="41.8" font-size="18" font-weight="bold" fill="#1e3a8a" text-anchor="middle">HPA</text><rect x="8.0" y="72.0" width="205.5" height="112.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="110.8" y="122.9" font-size="17" font-weight="normal" fill="#1f2937" text-anchor="middle">changes the number of</text><text x="110.8" y="144.2" font-size="17" font-weight="normal" fill="#1f2937" text-anchor="middle">Pods</text><rect x="227.5" y="8.0" width="205.5" height="56.0" rx="8" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.6"/><text x="330.2" y="41.8" font-size="18" font-weight="bold" fill="#134e4a" text-anchor="middle">VPA</text><rect x="227.5" y="72.0" width="205.5" height="112.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="330.2" y="122.9" font-size="17" font-weight="normal" fill="#1f2937" text-anchor="middle">sets the requests of</text><text x="330.2" y="144.2" font-size="17" font-weight="normal" fill="#1f2937" text-anchor="middle">Pods from usage</text><rect x="447.0" y="8.0" width="205.5" height="56.0" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="549.8" y="41.8" font-size="18" font-weight="bold" fill="#78350f" text-anchor="middle">Cluster Autoscaler</text><rect x="447.0" y="72.0" width="205.5" height="112.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="549.8" y="122.9" font-size="17" font-weight="normal" fill="#1f2937" text-anchor="middle">changes the number of</text><text x="549.8" y="144.2" font-size="17" font-weight="normal" fill="#1f2937" text-anchor="middle">nodes</text><rect x="666.5" y="8.0" width="205.5" height="56.0" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.6"/><text x="769.2" y="41.8" font-size="18" font-weight="bold" fill="#4c1d95" text-anchor="middle">KEDA</text><rect x="666.5" y="72.0" width="205.5" height="112.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="769.2" y="122.9" font-size="17" font-weight="normal" fill="#1f2937" text-anchor="middle">scales workloads from</text><text x="769.2" y="144.2" font-size="17" font-weight="normal" fill="#1f2937" text-anchor="middle">events</text><rect x="8.0" y="204.0" width="425.0" height="52.0" rx="8" fill="#1e3a8a" stroke="#1e3a8a" stroke-width="1.6"/><text x="220.5" y="235.2" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">The Metrics Server feeds the HPA and the VPA</text><rect x="447.0" y="204.0" width="425.0" height="52.0" rx="8" fill="#1e3a8a" stroke="#1e3a8a" stroke-width="1.6"/><text x="659.5" y="235.2" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">Pods out, Pods up, nodes out</text></svg>