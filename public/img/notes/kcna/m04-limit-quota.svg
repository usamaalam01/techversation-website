<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 372" width="880" height="372" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">m04-limit-quota</title><desc id="d">A namespace holds three Pods, each shaped by a LimitRange, under a ResourceQuota that caps the namespace as a whole.</desc><defs></defs><rect x="0.75" y="0.75" width="878.5" height="370.5" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><rect x="8.0" y="8.0" width="864.0" height="356.0" rx="14" fill="#f9fafb" stroke="#9ca3af" stroke-width="2"/><text x="26.0" y="38.0" font-size="20" font-weight="bold" fill="#374151" text-anchor="start">Namespace: shop</text><rect x="26.0" y="52.0" width="828.0" height="68.0" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="440.0" y="80.9" font-size="17" font-weight="bold" fill="#78350f" text-anchor="middle">ResourceQuota</text><text x="440.0" y="102.2" font-size="17" font-weight="normal" fill="#78350f" text-anchor="middle">total CPU and memory for the namespace, and the number of objects of each kind</text><rect x="26.0" y="150.0" width="264.0" height="90.0" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="158.0" y="189.9" font-size="17" font-weight="bold" fill="#14532d" text-anchor="middle">Pod</text><text x="158.0" y="211.2" font-size="17" font-weight="normal" fill="#14532d" text-anchor="middle">storefront</text><rect x="46.0" y="252.0" width="224.0" height="56.0" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="158.0" y="275.5" font-size="15" font-weight="bold" fill="#1e3a8a" text-anchor="middle">LimitRange</text><text x="158.0" y="294.2" font-size="15" font-weight="normal" fill="#1e3a8a" text-anchor="middle">min, max, ratio, defaults</text><line x1="158.0" y1="240.0" x2="158.0" y2="252.0" stroke="#2563eb" stroke-width="2"/><rect x="308.0" y="150.0" width="264.0" height="90.0" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="440.0" y="