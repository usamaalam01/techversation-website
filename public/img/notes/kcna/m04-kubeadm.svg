<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 206" width="880" height="206" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">m04-kubeadm</title><desc id="d">Machines are made ready, kubeadm init creates the control plane, a Pod network add-on is installed, and kubeadm join adds the other nodes.</desc><defs></defs><rect x="0.75" y="0.75" width="878.5" height="204.5" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><polygon points="8.0,8.0 196.5,8.0 216.5,37.0 196.5,66.0 8.0,66.0" fill="#dbeafe" stroke="#2563eb" stroke-width="1.8"/><text x="105.2" y="42.4" font-size="17" font-weight="bold" fill="#1e3a8a" text-anchor="middle">1 Machines ready</text><rect x="10.0" y="70.0" width="194.5" height="70.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="18.0" y="100.5" font-size="15" font-weight="normal" fill="#1f2937" text-anchor="start">a container runtime on</text><text x="18.0" y="119.2" font-size="15" font-weight="normal" fill="#1f2937" text-anchor="start">each</text><polygon points="226.5,8.0 415.0,8.0 435.0,37.0 415.0,66.0 226.5,66.0 246.5,37.0" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.8"/><text x="330.8" y="42.4" font-size="17" font-weight="bold" fill="#134e4a" text-anchor="middle">2 kubeadm init</text><rect x="228.5" y="70.0" width="194.5" height="70.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="236.5" y="109.9" font-size="15" font-weight="normal" fill="#1f2937" text-anchor="start">the first control-plane node</text><polygon points="445.0,8.0 633.5,8.0 653.5,37.0 633.5,66.0 445.0,66.0 465.0,37.0" fill="#fef3c7" stroke="#d97706" stroke-width="1.8"/><text x="549.2" y="42.4" font-size="17" font-weight="bold" fill="#78350f" text-anchor="middle">3 Pod network</text><rect x="447.0" y="70.0" width="194.5" height="70.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="455.0" y="100.5" font-size="15" font-weight="normal" fill="#1f2937" text-anchor="start">an add-on so Pods can</text><text x="455.0" y="119.2" font-size="15" font-weight="normal" fill="#1f2937" text-anchor="start">talk</text><polygon points="663.5,8.0 852.0,8.0 872.0,37.0 852.0,66.0 663.5,66.0 683.5,37.0" fill="#dcfce7" stroke="#16a34a" stroke-width="1.8"/><text x="767.8" y="42.4" font-size="17" font-weight="bold" fill="#14532d" text-anchor="middle">4 kubeadm join</text><rect x="665.5" y="70.0" width="194.5" height="70.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="673.5" y="109.9" font-size="15" font-weight="normal" fill="#1f2937" text-anchor="start">other nodes, with a token</text><rect x="8.0" y="152.0" width="864.0" height="46.0" rx="8" fill="#1e3a8a" stroke="#1e3a8a" stroke-width="1.6"/><text x="440.0" y="180.5" font-size="17" font-weight="bold" fill="#ffffff" text-anchor="middle">One kubeconfig context per cluster, switched with use-context</text></svg>