<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 342" width="880" height="342" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">m06-dns</title><desc id="d">The name orders.shop.svc.cluster.local is the Service name, the namespace, a fixed part and the cluster domain; CoreDNS answers it, and a headless Service returns Pod IPs.</desc><defs></defs><rect x="0.75" y="0.75" width="878.5" height="340.5" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><rect x="69.0" y="10.0" width="160.0" height="52.0" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="149.0" y="43.1" font-size="22" font-weight="bold" fill="#1e3a8a" text-anchor="middle">orders</text><text x="149.0" y="86.0" font-size="16" font-weight="normal" fill="#6b7280" text-anchor="middle">Service name</text><text x="241.0" y="48.0" font-size="30" font-weight="bold" fill="#1f2937" text-anchor="middle">.</text><rect x="253.0" y="10.0" width="150.0" height="52.0" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="328.0" y="43.1" font-size="22" font-weight="bold" fill="#14532d" text-anchor="middle">shop</text><text x="328.0" y="86.0" font-size="16" font-weight="normal" fill="#6b7280" text-anchor="middle">namespace</text><text x="415.0" y="48.0" font-size="30" font-weight="bold" fill="#1f2937" text-anchor="middle">.</text><rect x="427.0" y="10.0" width="110.0" height="52.0" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.6"/><text x="482.0" y="43.1" font-size="22" font-weight="bold" fill="#374151" text-anchor="middle">svc</text><text x="482.0" y="86.0" font-size="16" font-weight="normal" fill="#6b7280" text-anchor="middle">fixed part</text><text x="549.0" y="48.0" font-size="30" font-weight="bold" fill="#1f2937" text-anchor="middle">.</text><rect x="561.0" y="10.0" width="250.0" height="52.0" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.6"/><text x="686.0" y="43.1" font-size="22" font-weight="bold" fill="#4c1d95" text-anchor="middle">cluster.local</text><text x="686.0" y="86.0" font-size="16" font-weight="normal" fill="#6b7280" text-anchor="middle">cluster domain</text><rect x="8.0" y="106.0" width="424.0" height="76.0" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="220.0" y="138.9" font-size="17" font-weight="bold" fill="#14532d" text-anchor="middle">Same namespace</text><text x="220.0" y="160.2" font-size="17" font-weight="normal" fill="#14532d" text-anchor="middle">use the short name: orders</text><rect x="448.0" y="106.0" width="424.0" height="76.0" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="660.0" y="138.9" font-size="17" font-weight="bold" fill="#1e3a8a" text-anchor="middle">Another namespace</text><text x="660.0" y="160.2" font-size="17" font-weight="normal" fill="#1e3a8a" text-anchor="middle">add the namespace: orders.shop</text><rect x="8.0" y="198.0" width="864.0" height="46.0" rx="8" fill="#1e3a8a" stroke="#1e3a8a" stroke-width="1.6"/><text x="440.0" y="226.8" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="middle">CoreDNS, the cluster DNS add-on, answers these names</text><rect x="8.0" y="260.0" width="424.0" height="72.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="220.0" y="290.9" font-size="17" font-weight="bold" fill="#1f2937" text-anchor="middle">A normal Service</text><text x="220.0" y="312.1" font-size="17" font-weight="normal" fill="#1f2937" text-anchor="middle">resolves to its cluster IP</text><rect x="448.0" y="260.0" width="424.0" height="72.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="660.0" y="290.9" font-size="17" font-weight="bold" fill="#1f2937" text-anchor="middle">A headless Service</text><text x="660.0" y="312.1" font-size="17" font-weight="normal" fill="#1f2937" text-anchor="middle">resolves to the Pod IPs</text></svg>