<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 372" width="880" height="372" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">m05-taints</title><desc id="d">A tainted node admits a payment Pod with a toleration and turns away a catalog Pod; the effects are NoSchedule, PreferNoSchedule and NoExecute.</desc><defs></defs><rect x="0.75" y="0.75" width="878.5" height="370.5" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><rect x="8.0" y="8.0" width="450.0" height="356.0" rx="14" fill="#fff7ed" stroke="#d97706" stroke-width="2.4"/><text x="26.0" y="38.0" font-size="18" font-weight="bold" fill="#78350f" text-anchor="start">Node with a taint</text><rect x="26.0" y="50.0" width="256.9" height="25.0" rx="12.5" fill="#fef3c7" stroke="#d97706" stroke-width="1.2"/><text x="154.4" y="66.5" font-size="15" font-weight="bold" fill="#78350f" text-anchor="middle">dedicated=payments:NoSchedule</text><rect x="26.0" y="100.0" width="410.0" height="78.0" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="231.0" y="134.2" font-size="16" font-weight="bold" fill="#14532d" text-anchor="middle">Payment Pod</text><text x="231.0" y="154.2" font-size="16" font-weight="normal" fill="#14532d" text-anchor="middle">toleration: dedicated=payments</text><text x="300.0" y="206.0" font-size="16" font-weight="bold" fill="#14532d" text-anchor="middle">allowed</text><rect x="26.0" y="238.0" width="410.0" height="78.0" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.6" stroke-dasharray="6 4"/><text x="231.0" y="272.2" font-size="16" font-weight="bold" fill="#374151" text-anchor="middle">Catalog Pod</text><text x="231.0" y="292.2" font-size="16" font-weight="normal" fill="#374151" text-anchor="middle">no toleration</text><text x="300.0" y="342.0" font-size="16" font-weight="bold" fill="#7f1d1d" text-anchor="middle">turned away</text><text x="655.0" y="34.0" font-size="18" font-weight="bold" fill="#1e3a8a" text-anchor="middle">Taint effects</text><rect x="478.0" y="52.0" width="394.0" height="92.0" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="675.0" y="93.2" font-size="16" font-weight="bold" fill="#78350f" text-anchor="middle">NoSchedule</text><text x="675.0" y="113.2" font-size="16" font-weight="normal" fill="#78350f" text-anchor="middle">no new Pods without a toleration; running Pods stay</text><rect x="478.0" y="156.0" width="394.0" height="92.0" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="675.0" y="197.2" font-size="16" font-weight="bold" fill="#1e3a8a" text-anchor="middle">PreferNoSchedule</text><text x="675.0" y="217.2" font-size="16" font-weight="normal" fill="#1e3a8a" text-anchor="middle">the soft version: the scheduler tries to avoid the node</text><rect x="478.0" y="260.0" width="394.0" height="92.0" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.6"/><text x="675.0" y="301.2" font-size="16" font-weight="bold" fill="#7f1d1d" text-anchor="middle">NoExecute</text><text x="675.0" y="321.2" font-size="16" font-weight="normal" fill="#7f1d1d" text-anchor="middle">also evicts running Pods that do not tolerate it</text></svg>