<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 372" width="880" height="372" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">m01-runtime-stack</title><desc id="d">The kubelet calls a container runtime through the CRI; the runtime uses runc, following the OCI runtime specification, to create the container.</desc><defs><marker id="ah0" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker></defs><rect x="0.75" y="0.75" width="878.5" height="370.5" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><rect x="40.0" y="8.0" width="330.0" height="56.0" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="205.0" y="30.6" font-size="18" font-weight="bold" fill="#1e3a8a" text-anchor="middle">kubelet</text><text x="205.0" y="53.1" font-size="18" font-weight="normal" fill="#1e3a8a" text-anchor="middle">the node agent</text><line x1="205.0" y1="64.0" x2="205.0" y2="106.0" stroke="#1f2937" stroke-width="2.8" marker-end="url(#ah0)"/><text x="219.0" y="94.0" font-size="16" font-weight="bold" fill="#1f2937" text-anchor="start">Container Runtime Interface (CRI)</text><rect x="40.0" y="106.0" width="330.0" height="56.0" rx="8" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.6"/><text x="205.0" y="128.6" font-size="18" font-weight="bold" fill="#134e4a" text-anchor="middle">containerd or CRI-O</text><text x="205.0" y="151.1" font-size="18" font-weight="normal" fill="#134e4a" text-anchor="middle">the container runtime</text><line x1="205.0" y1="162.0" x2="205.0" y2="204.0" stroke="#1f2937" stroke-width="2.8" marker-end="url(#ah0)"/><text x="219.0" y="190.0" font-size="16" font-weight="bold" fill="#1f2937" text-anchor="start">OCI runtime specification</text><rect x="40.0" y="204.0" width="330.0" height="56.0" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="205.0" y="226.6" font-size="18" font-weight="bold" fill="#14532d" text-anchor="middle">runc</text><text x="205.0" y="249.1" font-size="18" font-weight="normal" fill="#14532d" text-anchor="middle">the low-level runtime</text><line x1="205.0" y1="260.0" x2="205.0" y2="292.0" stroke="#1f2937" stroke-width="2.8" marker-end="url(#ah0)"/><rect x="40.0" y="292.0" width="330.0" height="56.0" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.6"/><text x="205.0" y="325.5" font-size="17" font-weight="bold" fill="#374151" text-anchor="middle">A container on the Linux kernel</text><rect x="560.0" y="106.0" width="312.0" height="100.0" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.6" stroke-dasharray="7 4"/><text x="716.0" y="141.2" font-size="16" font-weight="bold" fill="#7f1d1d" text-anchor="middle">dockershim</text><text x="716.0" y="161.2" font-size="16" font-weight="normal" fill="#7f1d1d" text-anchor="middle">the old built-in bridge to Docker Engine,</text><text x="716.0" y="181.2" font-size="16" font-weight="normal" fill="#7f1d1d" text-anchor="middle">removed in v1.24</text><rect x="560.0" y="224.0" width="312.0" height="100.0" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="716.0" y="269.2" font-size="16" font-weight="bold" fill="#14532d" text-anchor="middle">Docker-built images</text><text x="716.0" y="289.2" font-size="16" font-weight="normal" fill="#14532d" text-anchor="middle">still run on any CRI runtime</text></svg>