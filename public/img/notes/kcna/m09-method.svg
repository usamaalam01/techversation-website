<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 328" width="880" height="328" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">m09-method</title><desc id="d">Four steps from symptom to fix, above six boxes that name the layers and the symptoms that point to them.</desc><defs></defs><rect x="0.75" y="0.75" width="878.5" height="326.5" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><polygon points="8.0,8.0 195.0,8.0 215.0,34.0 195.0,60.0 8.0,60.0" fill="#dbeafe" stroke="#2563eb" stroke-width="1.8"/><text x="104.5" y="39.8" font-size="18" font-weight="bold" fill="#1e3a8a" text-anchor="middle">1 Observe</text><rect x="10.0" y="64.0" width="193.0" height="64.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="18.0" y="91.5" font-size="15" font-weight="normal" fill="#1f2937" text-anchor="start">what does kubectl get</text><text x="18.0" y="110.2" font-size="15" font-weight="normal" fill="#1f2937" text-anchor="start">show?</text><polygon points="227.0,8.0 414.0,8.0 434.0,34.0 414.0,60.0 227.0,60.0 247.0,34.0" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.8"/><text x="330.5" y="39.8" font-size="18" font-weight="bold" fill="#134e4a" text-anchor="middle">2 Locate</text><rect x="229.0" y="64.0" width="193.0" height="64.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="237.0" y="100.9" font-size="15" font-weight="normal" fill="#1f2937" text-anchor="start">which layer is it?</text><polygon points="446.0,8.0 633.0,8.0 653.0,34.0 633.0,60.0 446.0,60.0 466.0,34.0" fill="#fef3c7" stroke="#d97706" stroke-width="1.8"/><text x="549.5" y="39.8" font-size="18" font-weight="bold" fill="#78350f" text-anchor="middle">3 Inspect</text><rect x="448.0" y="64.0" width="193.0" height="64.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="456.0" y="100.9" font-size="15" font-weight="normal" fill="#1f2937" text-anchor="start">describe, events, logs</text><polygon points="665.