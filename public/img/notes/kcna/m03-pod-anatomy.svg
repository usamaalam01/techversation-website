<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 372" width="880" height="372" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">m03-pod-anatomy</title><desc id="d">A Pod holds two containers and a shared volume, with one IP address, and runs on one node.</desc><defs><marker id="ah0" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker></defs><rect x="0.75" y="0.75" width="878.5" height="370.5" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><rect x="8.0" y="8.0" width="864.0" height="356.0" rx="14" fill="#f9fafb" stroke="#9ca3af" stroke-width="2" stroke-dasharray="8 5"/><text x="26.0" y="36.0" font-size="16" font-weight="bold" fill="#6b7280" text-anchor="start">Worker node</text><rect x="52.0" y="54.0" width="776.0" height="276.0" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="2.6"/><text x="74.0" y="88.0" font-size="22" font-weight="bold" fill="#1e3a8a" text-anchor="start">Pod</text><text x="806.0" y="86.0" font-size="16" font-weight="normal" fill="#1e3a8a" text-anchor="end">one IP address, one port space</text><rect x="92.0" y="112.0" width="290.0" height="84.0" rx="8" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.6"/><text x="237.0" y="148.9" font-size="17" font-weight="bold" fill="#134e4a" text-anchor="middle">App container</text><text x="237.0" y="170.2" font-size="17" font-weight="normal" fill="#134e4a" text-anchor="middle">serves the shop</text><rect x="498.0" y="112.0" width="290.0" height="84.0" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="643.0" y="148.9" font-size="17" font-weight="bold" fill="#78350f" text-anchor="middle">Log shipper container</text><text x="643.0" y="170.2" font-size="17" font-weight="normal" fill="#78350f" text-anchor="middle">ships the logs</text><line x1="386.0" y1="154.0" x2="494.0" y2="154.0" stroke="#1f2937" stroke-width="2.6" marker-end="url(#ah0)"/><line x1="494.0" y1="154.0" x2="386.0" y2="154.0" stroke="#1f2937" stroke-width="2.6" marker-end="url(#ah0)"/><text x="440.0" y="142.0" font-size="16" font-weight="bold" fill="#1f2937" text-anchor="middle">localhost</text><rect x="92.0" y="238.0" width="696.0" height="62.0" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="440.0" y="263.9" font-size="17" font-weight="bold" fill="#14532d" text-anchor="middle">Shared volume</text><text x="440.0" y="285.1" font-size="17" font-weight="normal" fill="#14532d" text-anchor="middle">both containers can read and write it</text><line x1="237.0" y1="196.0" x2="237.0" y2="238.0" stroke="#6b7280" stroke-width="2"/><line x1="643.0" y1="196.0" x2="643.0" y2="238.0" stroke="#6b7280" stroke-width="2"/><text x="440.0" y="352.0" font-size="16" font-weight="bold" fill="#374151" text-anchor="middle">The containers are scheduled together, on one node</text></svg>