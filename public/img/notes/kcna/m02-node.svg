<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 330" width="880" height="330" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">m02-node</title><desc id="d">A node runs a kubelet, a container runtime, an optional kube-proxy and Pods; add-ons such as cluster DNS extend the cluster.</desc><defs></defs><rect x="0.75" y="0.75" width="878.5" height="328.5" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><rect x="8.0" y="8.0" width="570.0" height="314.0" rx="14" fill="#f9fafb" stroke="#9ca3af" stroke-width="2"/><text x="26.0" y="38.0" font-size="20" font-weight="bold" fill="#374151" text-anchor="start">Worker node</text><rect x="28.0" y="56.0" width="168.7" height="92.0" rx="8" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.6"/><text x="112.3" y="88.1" font-size="15" font-weight="bold" fill="#134e4a" text-anchor="middle">kubelet</text><text x="112.3" y="106.9" font-size="15" font-weight="normal" fill="#134e4a" text-anchor="middle">keeps the Pods'</text><text x="112.3" y="125.6" font-size="15" font-weight="normal" fill="#134e4a" text-anchor="middle">containers running</text><rect x="208.7" y="56.0" width="168.7" height="92.0" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="293.0" y="97.5" font-size="15" font-weight="bold" fill="#1e3a8a" text-anchor="middle">Container runtime</text><text x="293.0" y="116.2" font-size="15" font-weight="normal" fill="#1e3a8a" text-anchor="middle">runs the containers</text><rect x="389.3" y="56.0" width="168.7" height="92.0" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.6" stroke-dasharray="7 4"/><text x="473.7" y="97.5" font-size="15" font-weight="bold" fill="#78350f" text-anchor="middle">kube-proxy</text><text x="473.7" y="116.2" font-size="15" font-weight="normal" fill="#78350f" text-anchor="middle">optional network proxy</text><rect x="28.0" y="180.0" width="168.7" height="110.0" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.6"/><text x="112.3" y="230.2" font-size="16" font-weight="bold" fill="#374151" text-anchor="middle">Pod</text><text x="112.3" y="250.2" font-size="16" font-weight="normal" fill="#374151" text-anchor="middle">containers</text><rect x="208.7" y="180.0" width="168.7" height="110.0" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.6"/><text x="293.0" y="230.2" font-size="16" font-weight="bold" fill="#374151" text-anchor="middle">Pod</text><text x="293.0" y="250.2" font-size="16" font-weight="normal" fill="#374151" text-anchor="middle">containers</text><rect x="389.3" y="180.0" width="168.7" height="110.0" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.6"/><text x="473.7" y="230.2" font-size="16" font-weight="bold" fill="#374151" text-anchor="middle">Pod</text><text x="473.7" y="250.2" font-size="16" font-weight="normal" fill="#374151" text-anchor="middle">containers</text><rect x="606.0" y="8.0" width="266.0" height="314.0" rx="14" fill="#faf5ff" stroke="#7c3aed" stroke-width="2" stroke-dasharray="8 5"/><text x="739.0" y="38.0" font-size="20" font-weight="bold" fill="#4c1d95" text-anchor="middle">Add-ons</text><rect x="626.0" y="60.0" width="226.0" height="100.0" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.6"/><text x="739.0" y="105.2" font-size="16" font-weight="bold" fill="#4c1d95" text-anchor="middle">Cluster DNS</text><text x="739.0" y="125.2" font-size="16" font-weight="normal" fill="#4c1d95" text-anchor="middle">every cluster should have it</text><text x="739.0" y="214.0" font-size="16" font-weight="normal" fill="#4c1d95" text-anchor="middle">Add-ons extend</text><text x="739.0" y="236.0" font-size="16" font-weight="normal" fill="#4c1d95" text-anchor="middle">what the cluster can do</text></svg>