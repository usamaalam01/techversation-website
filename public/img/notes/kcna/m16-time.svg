<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 234" width="880" height="234" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">m16-time</title><desc id="d">Three passes: answer what you know and flag the doubtful questions, return to the flagged ones from the Review Screen, then check before Finish Exam; the timer never stops.</desc><defs></defs><rect x="0.75" y="0.75" width="878.5" height="232.5" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><polygon points="8.0,8.0 268.0,8.0 288.0,36.0 268.0,64.0 8.0,64.0" fill="#dbeafe" stroke="#2563eb" stroke-width="1.8"/><text x="141.0" y="41.8" font-size="18" font-weight="bold" fill="#1e3a8a" text-anchor="middle">1 First pass</text><rect x="10.0" y="68.0" width="266.0" height="96.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="18.0" y="111.2" font-size="16" font-weight="normal" fill="#1f2937" text-anchor="start">answer what you know; flag the</text><text x="18.0" y="131.2" font-size="16" font-weight="normal" fill="#1f2937" text-anchor="start">doubtful ones</text><polygon points="300.0,8.0 560.0,8.0 580.0,36.0 560.0,64.0 300.0,64.0 320.0,36.0" fill="#fef3c7" stroke="#d97706" stroke-width="1.8"/><text x="440.0" y="41.8" font-size="18" font-weight="bold" fill="#78350f" text-anchor="middle">2 Second pass</text><rect x="302.0" y="68.0" width="266.0" height="96.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="310.0" y="111.2" font-size="16" font-weight="normal" fill="#1f2937" text-anchor="start">return to the flagged questions</text><text x="310.0" y="131.2" font-size="16" font-weight="normal" fill="#1f2937" text-anchor="start">from the Review Screen</text><polygon points="592.0,8.0 852.0,8.0 872.0,36.0 852.0,64.0 592.0,64.0 612.0,36.0" fill="#dcfce7" stroke="#16a34a" stroke-width="1.8"/><text x="732.0" y="41.8" font-size="18" font-weight="bold" fill="#14532d" text-anchor="middle">3 Final check</text><rect x="594.0" y="68.0" width="266.0" height="96.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="602.0" y="111.2" font-size="16" font-weight="normal" fill="#1f2937" text-anchor="start">look over your answers, then</text><text x="602.0" y="131.2" font-size="16" font-weight="normal" fill="#1f2937" text-anchor="start">Finish Exam</text><rect x="8.0" y="180.0" width="864.0" height="46.0" rx="8" fill="#1e3a8a" stroke="#1e3a8a" stroke-width="1.6"/><text x="440.0" y="208.5" font-size="17" font-weight="bold" fill="#ffffff" text-anchor="middle">The timer never stops, even during a requested break</text></svg>