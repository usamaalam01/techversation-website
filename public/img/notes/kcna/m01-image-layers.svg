<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 380" width="880" height="380" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">m01-image-layers</title><desc id="d">An image is a stack of read-only layers: base image, runtime, libraries and app code; a change adds a layer on top.</desc><defs></defs><rect x="0.75" y="0.75" width="878.5" height="378.5" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><rect x="150.0" y="8.0" width="580.0" height="52.0" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.6" stroke-dasharray="7 4"/><text x="440.0" y="39.8" font-size="18" font-weight="bold" fill="#78350f" text-anchor="middle">A change adds a new layer</text><rect x="150.0" y="70.0" width="580.0" height="56.0" rx="8" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.6"/><text x="440.0" y="103.8" font-size="18" font-weight="bold" fill="#134e4a" text-anchor="middle">App code</text><rect x="150.0" y="134.0" width="580.0" height="56.0" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="440.0" y="167.8" font-size="18" font-weight="bold" fill="#14532d" text-anchor="middle">Libraries the app needs</text><rect x="150.0" y="198.0" width="580.0" height="56.0" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="440.0" y="231.8" font-size="18" font-weight="bold" fill="#1e3a8a" text-anchor="middle">Language runtime</text><rect x="150.0" y="262.0" width="580.0" height="56.0" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.6"/><text x="440.0" y="295.9" font-size="18" font-weight="bold" fill="#374151" text-anchor="middle">Base image: operating system files</text><text x="140.0" y="100.0" font-size="15" font-weight="normal" fill="#6b7280" text-anchor="end">layer 4</text><text x="140.0" y="164.0" font-size="15" font-weight="normal" fill="#6b7280" text-anchor="end">layer 3</text><text x="140.0" y="228.0" font-size="15" font-weight="normal" fill="#6b7280" text-anchor="end">layer 2</text><text x="140.0" y="292.0" font-size="15" font-weight="normal" fill="#6b7280" text-anchor="end">layer 1</text><rect x="150.0" y="330.0" width="580.0" height="40.0" rx="8" fill="#1e3a8a" stroke="#1e3a8a" stroke-width="1.6"/><text x="440.0" y="355.2" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">Each layer is a set of file system changes</text></svg>