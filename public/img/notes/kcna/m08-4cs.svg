<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 400" width="880" height="400" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">m08-4cs</title><desc id="d">Four nested layers, from the outside in: cloud, clusters, containers and code; weak outer layers cannot be repaired in the code layer.</desc><defs></defs><rect x="0.75" y="0.75" width="878.5" height="398.5" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><rect x="8.0" y="8.0" width="864.0" height="330.0" rx="16" fill="#dbeafe" stroke="#2563eb" stroke-width="2.4"/><text x="28.0" y="38.0" font-size="20" font-weight="bold" fill="#1e3a8a" text-anchor="start">Cloud</text><rect x="44.0" y="52.0" width="792.0" height="270.0" rx="14" fill="#ccfbf1" stroke="#0d9488" stroke-width="2.4"/><text x="64.0" y="82.0" font-size="20" font-weight="bold" fill="#134e4a" text-anchor="start">Clusters</text><rect x="80.0" y="96.0" width="720.0" height="210.0" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="2.4"/><text x="100.0" y="126.0" font-size="20" font-weight="bold" fill="#78350f" text-anchor="start">Containers</text><rect x="116.0" y="140.0" width="648.0" height="150.0" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2.4"/><text x="440.0" y="226.0" font-size="24" font-weight="bold" fill="#14532d" text-anchor="middle">Code</text><rect x="8.0" y="350.0" width="864.0" height="42.0" rx="8" fill="#1e3a8a" stroke="#1e3a8a" stroke-width="1.6"/><text x="440.0" y="376.5" font-size="17" font-weight="bold" fill="#ffffff" text-anchor="middle">Each layer builds on the one outside it; weak outer layers cannot be fixed in code</text></svg>