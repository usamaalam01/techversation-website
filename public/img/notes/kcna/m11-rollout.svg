<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 260" width="880" height="260" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">m11-rollout</title><desc id="d">A rollout stalls when new Pods never become ready; after the progress deadline the Deployment reports ProgressDeadlineExceeded; rollout status, history and undo are the three commands.</desc><defs></defs><rect x="0.75" y="0.75" width="878.5" height="258.5" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><polygon points="8.0,8.0 195.0,8.0 215.0,36.0 195.0,64.0 8.0,64.0" fill="#dbeafe" stroke="#2563eb" stroke-width="1.8"/><text x="104.5" y="41.8" font-size="18" font-weight="bold" fill="#1e3a8a" text-anchor="middle">1 Update</text><rect x="10.0" y="68.0" width="193.0" height="96.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="18.0" y="120.5" font-size="14" font-weight="normal" fill="#1f2937" text-anchor="start">the Pod template changes</text><polygon points="227.0,8.0 414.0,8.0 434.0,36.0 414.0,64.0 227.0,64.0 247.0,36.0" fill="#fef3c7" stroke="#d97706" stroke-width="1.8"/><text x="330.5" y="41.8" font-size="18" font-weight="bold" fill="#78350f" text-anchor="middle">2 Progressing</text><rect x="229.0" y="68.0" width="193.0" height="96.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="237.0" y="111.8" font-size="14" font-weight="normal" fill="#1f2937" text-anchor="start">new Pods start as old ones</text><text x="237.0" y="129.3" font-size="14" font-weight="normal" fill="#1f2937" text-anchor="start">stop</text><polygon points="446.0,8.0 633.0,8.0 653.0,36.0 633.0,64.0 446.0,64.0 466.0,36.0" fill="#fee2e2" stroke="#dc2626" stroke-width="1.8"/><text x="549.5" y="41.8" font-size="18" font-weight="bold" fill="#7f1d1d" text-anchor="middle">3 Stalled</text><rect x="448.0" y="68.0" width="193.0" height="96.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="456.0" y="111.8" font-size="14" font-weight="normal" fill="#1f2937" text-anchor="start">new Pods never become</text><text x="456.0" y="129.3" font-size="14" font-weight="normal" fill="#1f2937" text-anchor="start">ready</text><polygon points="665.0,8.0 852.0,8.0 872.0,36.0 852.0,64.0 665.0,64.0 685.0,36.0" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.8"/><text x="768.5" y="41.8" font-size="18" font-weight="bold" fill="#4c1d95" text-anchor="middle">4 Deadline passed</text><rect x="667.0" y="68.0" width="193.0" height="96.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="675.0" y="111.8" font-size="14" font-weight="normal" fill="#1f2937" text-anchor="start">Progressing is False:</text><text x="675.0" y="129.3" font-size="14" font-weight="normal" fill="#1f2937" text-anchor="start">ProgressDeadlineExceeded</text><rect x="8.0" y="180.0" width="280.0" height="72.0" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="148.0" y="211.2" font-size="16" font-weight="bold" fill="#1e3a8a" text-anchor="middle">rollout status</text><text x="148.0" y="231.2" font-size="16" font-weight="normal" fill="#1e3a8a" text-anchor="middle">watch the rollout</text><rect x="300.0" y="180.0" width="280.0" height="72.0" rx="8" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.6"/><text x="440.0" y="211.2" font-size="16" font-weight="bold" fill="#134e4a" text-anchor="middle">rollout history</text><text x="440.0" y="231.2" font-size="16" font-weight="normal" fill="#134e4a" text-anchor="middle">list the revisions</text><rect x="592.0" y="180.0" width="280.0" height="72.0" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="732.0" y="211.2" font-size="16" font-weight="bold" fill="#14532d" text-anchor="middle">rollout undo</text><text x="732.0" y="231.2" font-size="16" font-weight="normal" fill="#14532d" text-anchor="middle">go back to the previous revision</text></svg>