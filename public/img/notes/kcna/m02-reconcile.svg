<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 340" width="880" height="340" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">m02-reconcile</title><desc id="d">A controller observes the current state, compares it with the desired state and acts, again and again.</desc><defs><marker id="ah0" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker></defs><rect x="0.75" y="0.75" width="878.5" height="338.5" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><rect x="305.0" y="18.0" width="270.0" height="84.0" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="440.0" y="44.3" font-size="17" font-weight="bold" fill="#1e3a8a" text-anchor="middle">Observe</text><text x="440.0" y="65.5" font-size="17" font-weight="normal" fill="#1e3a8a" text-anchor="middle">the current state, through the API</text><text x="440.0" y="86.8" font-size="17" font-weight="normal" fill="#1e3a8a" text-anchor="middle">server</text><rect x="556.1" y="186.0" width="270.0" height="84.0" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="691.1" y="222.9" font-size="17" font-weight="bold" fill="#78350f" text-anchor="middle">Compare</text><text x="691.1" y="244.2" font-size="17" font-weight="normal" fill="#78350f" text-anchor="middle">with the desired state in the spec</text><rect x="53.9" y="186.0" width="270.0" height="84.0" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="188.9" y="222.9" font-size="17" font-weight="bold" fill="#14532d" text-anchor="middle">Act</text><text x="188.9" y="244.2" font-size="17" font-weight="normal" fill="#14532d" text-anchor="middle">create, change or delete objects</text><line x1="507.3" y1="105.0" x2="623.9" y2="183.0" stroke="#1f2937" stroke-width="2.6" marker-end="url(#ah0)"/><line x1="553.1" y1="228.0" x2="326.9" y2="228.0" stroke="#1f2937" stroke-width="2.6" marker-end="url(#ah0)"/><line x1="256.1" y1="183.0" x2="372.7" y2="105.0" stroke="#1f2937" stroke-width="2.6" marker-end="url(#ah0)"/><rect x="330.0" y="132.0" width="220.0" height="80.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="440.0" y="166.3" font-size="19" font-weight="bold" fill="#1f2937" text-anchor="middle">Controller</text><text x="440.0" y="190.1" font-size="19" font-weight="normal" fill="#1f2937" text-anchor="middle">like a thermostat</text></svg>