<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 300" width="880" height="300" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">m07-volume-lifetimes</title><desc id="d">Three bars of growing length: a container filesystem is lost when the container restarts, an emptyDir lasts as long as the Pod, and a PersistentVolume outlives the Pod.</desc><defs><marker id="ah0" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker></defs><rect x="0.75" y="0.75" width="878.5" height="298.5" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><rect x="8.0" y="12.0" width="300.0" height="66.0" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.6"/><text x="158.0" y="40.2" font-size="16" font-weight="bold" fill="#7f1d1d" text-anchor="middle">Container filesystem</text><text x="158.0" y="60.2" font-size="16" font-weight="normal" fill="#7f1d1d" text-anchor="middle">gone when the container restarts</text><rect x="8.0" y="90.0" width="520.0" height="66.0" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="268.0" y="118.2" font-size="16" font-weight="bold" fill="#78350f" text-anchor="middle">emptyDir (an ephemeral volume)</text><text x="268.0" y="138.2" font-size="16" font-weight="normal" fill="#78350f" text-anchor="middle">gone when the Pod is removed</text><rect x="8.0" y="168.0" width="864.0" height="66.0" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="440.0" y="196.2" font-size="16" font-weight="bold" fill="#14532d" text-anchor="middle">PersistentVolume</text><text x="440.0" y="216.2" font-size="16" font-weight="normal" fill="#14532d" text-anchor="middle">outlives the Pod: a lifecycle independent of any Pod</text><line x1="8.0" y1="260.0" x2="872.0" y2="260.0" stroke="#374151" stroke-width="2.4" marker-end="url(#ah0)"/><text x="440.0" y="288.0" font-size="16" font-weight="normal" fill="#6b7280" text-anchor="middle">how long the data lives</text></svg>