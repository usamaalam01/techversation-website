<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 254" width="880" height="254" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">m09-node</title><desc id="d">A silent node gets the Ready condition Unknown and shows NotReady; by default its Pods are evicted after 5 minutes; component logs show why.</desc><defs></defs><rect x="0.75" y="0.75" width="878.5" height="252.5" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><polygon points="8.0,8.0 268.0,8.0 288.0,36.0 268.0,64.0 8.0,64.0" fill="#fee2e2" stroke="#dc2626" stroke-width="1.8"/><text x="141.0" y="41.8" font-size="18" font-weight="bold" fill="#7f1d1d" text-anchor="middle">1 Node goes quiet</text><rect x="10.0" y="68.0" width="266.0" height="70.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="18.0" y="108.2" font-size="16" font-weight="normal" fill="#1f2937" text-anchor="start">down, cut off, or the kubelet died</text><polygon points="300.0,8.0 560.0,8.0 580.0,36.0 560.0,64.0 300.0,64.0 320.0,36.0" fill="#fef3c7" stroke="#d97706" stroke-width="1.8"/><text x="440.0" y="41.8" font-size="18" font-weight="bold" fill="#78350f" text-anchor="middle">2 Ready: Unknown</text><rect x="302.0" y="68.0" width="266.0" height="70.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="310.0" y="108.2" font-size="16" font-weight="normal" fill="#1f2937" text-anchor="start">kubectl shows NotReady</text><polygon points="592.0,8.0 852.0,8.0 872.0,36.0 852.0,64.0 592.0,64.0 612.0,36.0" fill="#dbeafe" stroke="#2563eb" stroke-width="1.8"/><text x="732.0" y="41.8" font-size="18" font-weight="bold" fill="#1e3a8a" text-anchor="middle">3 Pods evicted</text><rect x="594.0" y="68.0" width="266.0" height="70.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="602.0" y="108.2" font-size="16" font-weight="normal" fill="#1f2937" text-anchor="start">by default after 5 minutes</text><rect x="8.0" y="154.0" width="426.0" height="92.0" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="221.0" y="195.2" font-size="16" font-weight="bold" fill="#1e3a8a" text-anchor="middle">Control plane logs</text><text x="221.0" y="215.2" font-size="16" font-weight="normal" fill="#1e3a8a" text-anchor="middle">kube-apiserver, kube-scheduler, kube-controller-manager</text><rect x="446.0" y="154.0" width="426.0" height="92.0" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="659.0" y="195.2" font-size="16" font-weight="bold" fill="#14532d" text-anchor="middle">Node logs</text><text x="659.0" y="215.2" font-size="16" font-weight="normal" fill="#14532d" text-anchor="middle">kubelet and kube-proxy; journalctl on systemd hosts</text></svg>