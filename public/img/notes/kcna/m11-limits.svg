<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 340" width="880" height="340" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">m11-limits</title><desc id="d">A container over its memory limit may be killed with the reason OOMKilled and restarted, while a container at its CPU limit is throttled and slowed but not killed.</desc><defs><marker id="ah0" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker></defs><rect x="0.75" y="0.75" width="878.5" height="338.5" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><rect x="8.0" y="8.0" width="426.0" height="50.0" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.6"/><text x="221.0" y="39.2" font-size="19" font-weight="bold" fill="#7f1d1d" text-anchor="middle">Memory limit</text><rect x="8.0" y="74.0" width="426.0" height="50.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="221.0" y="104.2" font-size="16" font-weight="normal" fill="#1f2937" text-anchor="middle">the container uses more than its limit</text><line x1="221.0" y1="124.0" x2="221.0" y2="138.0" stroke="#374151" stroke-width="2.2" marker-end="url(#ah0)"/><rect x="8.0" y="140.0" width="426.0" height="50.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="221.0" y="170.2" font-size="16" font-weight="normal" fill="#1f2937" text-anchor="middle">the kernel may kill it</text><line x1="221.0" y1="190.0" x2="221.0" y2="204.0" stroke="#374151" stroke-width="2.2" marker-end="url(#ah0)"/><rect x="8.0" y="206.0" width="426.0" height="50.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="221.0" y="236.2" font-size="16" font-weight="normal" fill="#1f2937" text-anchor="middle">the reason is OOMKilled, then a restart</text><rect x="446.0" y="8.0" width="426.0" height="50.0" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="659.0" y="39.2" font-size="19" font-weight="bold" fill="#78350f" text-anchor="middle">CPU limit</text><rect x="446.0" y="74.0" width="426.0" height="50.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="659.0" y="104.2" font-size="16" font-weight="normal" fill="#1f2937" text-anchor="middle">the container reaches its limit</text><line x1="659.0" y1="124.0" x2="659.0" y2="138.0" stroke="#374151" stroke-width="2.2" marker-end="url(#ah0)"/><rect x="446.0" y="140.0" width="426.0" height="50.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="659.0" y="170.2" font-size="16" font-weight="normal" fill="#1f2937" text-anchor="middle">the kernel throttles it</text><line x1="659.0" y1="190.0" x2="659.0" y2="204.0" stroke="#374151" stroke-width="2.2" marker-end="url(#ah0)"/><rect x="446.0" y="206.0" width="426.0" height="50.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="659.0" y="236.2" font-size="16" font-weight="normal" fill="#1f2937" text-anchor="middle">it runs slower, but is not killed</text><rect x="8.0" y="284.0" width="864.0" height="46.0" rx="8" fill="#1e3a8a" stroke="#1e3a8a" stroke-width="1.6"/><text x="440.0" y="312.9" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="middle">Raise the limit, or fix the application</text></svg>