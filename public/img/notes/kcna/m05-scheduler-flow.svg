<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 230" width="880" height="230" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">m05-scheduler-flow</title><desc id="d">A new Pod is filtered, scored and bound: five nodes become three feasible nodes and the highest score wins; with no feasible node the Pod stays pending.</desc><defs><marker id="ah0" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker></defs><rect x="0.75" y="0.75" width="878.5" height="228.5" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><polygon points="8.0,8.0 196.5,8.0 216.5,37.0 196.5,66.0 8.0,66.0" fill="#dbeafe" stroke="#2563eb" stroke-width="1.8"/><text x="105.2" y="42.8" font-size="18" font-weight="bold" fill="#1e3a8a" text-anchor="middle">1 New Pod</text><rect x="10.0" y="70.0" width="194.5" height="70.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="18.0" y="110.2" font-size="16" font-weight="normal" fill="#1f2937" text-anchor="start">no node assigned yet</text><polygon points="226.5,8.0 415.0,8.0 435.0,37.0 415.0,66.0 226.5,66.0 246.5,37.0" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.8"/><text x="330.8" y="42.8" font-size="18" font-weight="bold" fill="#134e4a" text-anchor="middle">2 Filter</text><rect x="228.5" y="70.0" width="194.5" height="70.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="236.5" y="110.2" font-size="16" font-weight="normal" fill="#1f2937" text-anchor="start">five nodes become three</text><polygon points="445.0,8.0 633.5,8.0 653.5,37.0 633.5,66.0 445.0,66.0 465.0,37.0" fill="#fef3c7" stroke="#d97706" stroke-width="1.8"/><text x="549.2" y="42.8" font-size="18" font-weight="bold" fill="#78350f" text-anchor="middle">3 Score</text><rect x="447.0" y="70.0" width="194.5" height="70.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="455.0" y="110.2" font-size="16" font-weight="normal" fill="#1f2937" text-anchor="start">the highest score wins</text><polygon points="663.5,8.0 852.0,8.0 872.0,37.0 852.0,66.0 663.5,66.0 683.5,37.0" fill="#dcfce7" stroke="#16a34a" stroke-width="1.8"/><text x="767.8" y="42.8" font-size="18" font-weight="bold" fill="#14532d" text-anchor="middle">4 Bind</text><rect x="665.5" y="70.0" width="194.5" height="70.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="673.5" y="110.2" font-size="16" font-weight="normal" fill="#1f2937" text-anchor="start">the API server records it</text><rect x="226.5" y="152.0" width="218.5" height="70.0" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.6" stroke-dasharray="7 4"/><text x="335.8" y="182.2" font-size="16" font-weight="bold" fill="#7f1d1d" text-anchor="middle">No feasible node</text><text x="335.8" y="202.2" font-size="16" font-weight="normal" fill="#7f1d1d" text-anchor="middle">the Pod stays Pending</text><line x1="330.8" y1="130.0" x2="330.8" y2="150.0" stroke="#dc2626" stroke-width="2.4" marker-end="url(#ah0)"/><rect x="455.0" y="152.0" width="413.0" height="70.0" rx="8" fill="#1e3a8a" stroke="#1e3a8a" stroke-width="1.6"/><text x="661.5" y="182.2" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">Filtering uses the Pod's requests; scoring picks the</text><text x="661.5" y="202.2" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">best of the rest</text></svg>