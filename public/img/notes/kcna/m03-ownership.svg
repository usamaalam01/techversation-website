<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 372" width="880" height="372" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">m03-ownership</title><desc id="d">A Deployment owns two ReplicaSets during a rollout, the old one scaling down and the new one scaling up, and each ReplicaSet owns its Pods.</desc><defs><marker id="ah0" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker></defs><rect x="0.75" y="0.75" width="878.5" height="370.5" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><rect x="310.0" y="8.0" width="260.0" height="64.0" rx="8" fill="#1e3a8a" stroke="#1e3a8a" stroke-width="1.6"/><text x="440.0" y="34.9" font-size="17" font-weight="bold" fill="#ffffff" text-anchor="middle">Deployment</text><text x="440.0" y="56.1" font-size="17" font-weight="normal" fill="#ffffff" text-anchor="middle">storefront, 3 replicas</text><polyline points="440.0,72.0 440.0,98.0 240.0,98.0 240.0,122.0" fill="none" stroke="#1f2937" stroke-width="2.4" marker-end="url(#ah0)" stroke-linejoin="round"/><polyline points="440.0,72.0 440.0,98.0 640.0,98.0 640.0,122.0" fill="none" stroke="#1f2937" stroke-width="2.4" marker-end="url(#ah0)" stroke-linejoin="round"/><text x="338.0" y="90.0" font-size="15" font-weight="normal" fill="#6b7280" text-anchor="middle">owns</text><text x="542.0" y="90.0" font-size="15" font-weight="normal" fill="#6b7280" text-anchor="middle">owns</text><rect x="110.0" y="124.0" width="260.0" height="68.0" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.6" stroke-dasharray="7 4"/><text x="240.0" y="152.9" font-size="17" font-weight="bold" fill="#374151" text-anchor="middle">Old ReplicaSet</text><text x="240.0" y="174.2" font-size="17" font-weight="normal" fill="#374151" text-anchor="middle">scaling down</text><rect x="510.0" y="124.0" width="260.0" height="68.0" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="640.0" y="152.9" font-size="17" font-weight="bold" fill="#14532d" text-anchor="middle">New ReplicaSet</text><text x="640.0" y="174.2" font-size="17" font-weight="normal" fill="#14532d" text-anchor="middle">scaling up</text><line x1="240.0" y1="192.0" x2="146.0" y2="238.0" stroke="#9ca3af" stroke-width="1.8"/><rect x="112.0" y="238.0" width="68.0" height="46.0" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.6" stroke-dasharray="5 4"/><text x="146.0" y="266.2" font-size="16" font-weight="normal" fill="#374151" text-anchor="middle">Pod</text><line x1="240.0" y1="192.0" x2="226.0" y2="238.0" stroke="#9ca3af" stroke-width="1.8"/><rect x="192.0" y="238.0" width="68.0" height="46.0" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.6" stroke-dasharray="5 4"/><text x="226.0" y="266.2" font-size="16" font-weight="normal" fill="#374151" text-anchor="middle">Pod</text><line x1="240.0" y1="192.0" x2="306.0" y2="238.0" stroke="#9ca3af" stroke-width="1.8"/><rect x="272.0" y="238.0" width="68.0" height="46.0" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.6" stroke-dasharray="5 4"/><text x="306.0" y="266.2" font-size="16" font-weight="normal" fill="#374151" text-anchor="middle">Pod</text><line x1="640.0" y1="192.0" x2="546.0" y2="238.0" stroke="#16a34a" stroke-width="1.8"/><rect x="512.0" y="238.0" width="68.0" height="46.0" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="546.0" y="266.2" font-size="16" font-weight="normal" fill="#14532d" text-anchor="middle">Pod</text><line x1="640.0" y1="192.0" x2="626.0" y2="238.0" stroke="#16a34a" stroke-width="1.8"/><rect x="592.0" y="238.0" width="68.0" height="46.0" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="626.0" y="266.2" font-size="16" font-weight="normal" fill="#14532d" text-anchor="middle">Pod</text><line x1="640.0" y1="192.0" x2="706.0" y2="238.0" stroke="#16a34a" stroke-width="1.8"/><rect x="672.0" y="238.0" width="68.0" height="46.0" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="706.0" y="266.2" font-size="16" font-weight="normal" fill="#14532d" text-anchor="middle">Pod</text><text x="240.0" y="306.0" font-size="15" font-weight="normal" fill="#6b7280" text-anchor="middle">old Pods are replaced</text><text x="640.0" y="306.0" font-size="15" font-weight="normal" fill="#14532d" text-anchor="middle">new Pods start from the new template</text><rect x="8.0" y="322.0" width="864.0" height="42.0" rx="8" fill="#1e3a8a" stroke="#1e3a8a" stroke-width="1.6"/><text x="440.0" y="348.5" font-size="17" font-weight="bold" fill="#ffffff" text-anchor="middle">A new ReplicaSet appears only when the Pod template changes</text></svg>