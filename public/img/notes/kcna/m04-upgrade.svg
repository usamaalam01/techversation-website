<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 370" width="880" height="370" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">m04-upgrade</title><desc id="d">Upgrade the primary control plane node, then the other control plane nodes, then the workers; the kubelet may be older than the API server but never newer.</desc><defs></defs><rect x="0.75" y="0.75" width="878.5" height="368.5" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><polygon points="8.0,8.0 288.0,8.0 308.0,38.0 288.0,68.0 8.0,68.0" fill="#dbeafe" stroke="#2563eb" stroke-width="1.8"/><text x="151.0" y="43.1" font-size="16" font-weight="bold" fill="#1e3a8a" text-anchor="middle">1 Primary control plane node</text><polygon points="298.0,8.0 578.0,8.0 598.0,38.0 578.0,68.0 298.0,68.0 318.0,38.0" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.8"/><text x="448.0" y="43.1" font-size="16" font-weight="bold" fill="#134e4a" text-anchor="middle">2 Other control plane nodes</text><polygon points="588.0,8.0 852.0,8.0 872.0,38.0 852.0,68.0 588.0,68.0 608.0,38.0" fill="#dcfce7" stroke="#16a34a" stroke-width="1.8"/><text x="730.0" y="43.1" font-size="16" font-weight="bold" fill="#14532d" text-anchor="middle">3 Worker nodes: drain first</text><rect x="8.0" y="96.0" width="424.0" height="150.0" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="220.0" y="155.3" font-size="17" font-weight="bold" fill="#78350f" text-anchor="middle">kubelet</text><text x="220.0" y="176.5" font-size="17" font-weight="normal" fill="#78350f" text-anchor="middle">must not be newer than the API server</text><text x="220.0" y="197.8" font-size="17" font-weight="normal" fill="#78350f" text-anchor="middle">may be up to three minor versions older</text><rect x="448.0" y="96.0" width="424.0" height="150.0" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="660.0" y="155.3" font-size="17" font-weight="bold" fill="#1e3a8a" text-anchor="middle">controller manager, scheduler</text><text x="660.0" y="176.5" font-size="17" font-weight="normal" fill="#1e3a8a" text-anchor="middle">must not be newer than the API server</text><text x="660.0" y="197.8" font-size="17" font-weight="normal" fill="#1e3a8a" text-anchor="middle">may be one minor version older</text><rect x="8.0" y="262.0" width="864.0" height="50.0" rx="8" fill="#1e3a8a" stroke="#1e3a8a" stroke-width="1.6"/><text x="440.0" y="292.9" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="middle">Go one minor version at a time: skipping minor versions is not supported</text><text x="440.0" y="340.0" font-size="15" font-weight="normal" fill="#6b7280" text-anchor="middle">These skew limits can change between releases</text></svg>