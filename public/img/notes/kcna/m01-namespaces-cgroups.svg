<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 286.72" width="880" height="286.72" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">m01-namespaces-cgroups</title><desc id="d">Namespaces give a process its own isolated view; cgroups limit and monitor its resource use.</desc><defs></defs><rect x="0.75" y="0.75" width="878.5" height="285.22" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><rect x="8.0" y="8.0" width="864.0" height="52.0" rx="8" fill="#1e3a8a" stroke="#1e3a8a" stroke-width="1.6"/><text x="440.0" y="40.5" font-size="20" font-weight="bold" fill="#ffffff" text-anchor="middle">A container is a process on the host's kernel</text><rect x="8.0" y="76.0" width="420.0" height="48.0" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="218.0" y="106.2" font-size="19" font-weight="bold" fill="#1e3a8a" text-anchor="middle">Namespaces: isolate</text><rect x="8.0" y="130.0" width="420.0" height="146.7" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="1.8"/><polyline points="23.0,155.4 28.0,161.4 38.0,148.4" fill="none" stroke="#16a34a" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><text x="44.0" y="162.1" font-size="19" font-weight="normal" fill="#1f2937" text-anchor="start">Each group of processes gets its own view</text><text x="44.0" y="185.2" font-size="19" font-weight="normal" fill="#1f2937" text-anchor="start">of a resource</text><polyline points="23.0,211.8 28.0,217.8 38.0,204.8" fill="none" stroke="#16a34a" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><text x="44.0" y="218.4" font-size="19" font-weight="normal" fill="#1f2937" text-anchor="start">For example its own process list or its own</text><text x="44.0" y="241.6" font-size="19" font-weight="normal" fill="#1f2937" text-anchor="start">network</text><rect x="452.0" y="76.0" width="420.0" height="48.0" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="662.0" y="106.2" font-size="19" font-weight="bold" fill="#14532d" text-anchor="middle">cgroups: limit</text><rect x="452.0" y="130.0" width="420.0" height="146.7" rx="10" fill="#ffffff" stroke="#16a34a" stroke-width="1.8"/><polyline points="467.0,155.4 472.0,161.4 482.0,148.4" fill="none" stroke="#16a34a" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><text x="488.0" y="162.1" font-size="19" font-weight="normal" fill="#1f2937" text-anchor="start">Processes are put into groups</text><polyline points="467.0,188.6 472.0,194.6 482.0,181.6" fill="none" stroke="#16a34a" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><text x="488.0" y="195.2" font-size="19" font-weight="normal" fill="#1f2937" text-anchor="start">Their CPU and memory use can be limited</text><text x="488.0" y="218.4" font-size="19" font-weight="normal" fill="#1f2937" text-anchor="start">and monitored</text></svg>