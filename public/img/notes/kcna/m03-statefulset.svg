<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 386" width="880" height="386" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">m03-statefulset</title><desc id="d">A StatefulSet gives each Pod a stable name, its own volume and a DNS name through a headless Service.</desc><defs><marker id="ah0" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker></defs><rect x="0.75" y="0.75" width="878.5" height="384.5" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><rect x="230.0" y="8.0" width="420.0" height="62.0" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.6"/><text x="440.0" y="33.9" font-size="17" font-weight="bold" fill="#4c1d95" text-anchor="middle">Headless Service: db</text><text x="440.0" y="55.1" font-size="17" font-weight="normal" fill="#4c1d95" text-anchor="middle">gives each Pod its own DNS name</text><line x1="440.0" y1="70.0" x2="440.0" y2="90.0" stroke="#7c3aed" stroke-width="2"/><line x1="133.0" y1="90.0" x2="747.0" y2="90.0" stroke="#7c3aed" stroke-width="2"/><line x1="133.0" y1="90.0" x2="133.0" y2="106.0" stroke="#7c3aed" stroke-width="2"/><rect x="8.0" y="106.0" width="250.0" height="82.0" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="133.0" y="141.9" font-size="17" font-weight="bold" fill="#1e3a8a" text-anchor="middle">db-0</text><text x="133.0" y="163.2" font-size="17" font-weight="normal" fill="#1e3a8a" text-anchor="middle">db-0.db · starts first</text><line x1="133.0" y1="188.0" x2="133.0" y2="216.0" stroke="#16a34a" stroke-width="2.4"/><rect x="8.0" y="218.0" width="250.0" height="58.0" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="133.0" y="242.2" font-size="16" font-weight="bold" fill="#14532d" text-anchor="middle">Own volume</text><text x="133.0" y="262.2" font-size="16" font-weight="normal" fill="#14532d" text-anchor="middle">kept for db-0</text><li