 fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="440.0" y="340.5" font-size="17" font-weight="bold" fill="#78350f" text-anchor="middle">Pods start and update in order. Volumes are kept by default when Pods are deleted or scaled down.</text></svg>