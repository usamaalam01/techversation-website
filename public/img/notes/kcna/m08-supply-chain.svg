<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 266" width="880" height="266" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">m08-supply-chain</title><desc id="d">Scan the image, sign it, keep it in a private registry and verify the signature at deploy time; Trivy scans, Cosign signs and an admission policy verifies.</desc><defs></defs><rect x="0.75" y="0.75" width="878.5" height="264.5" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><polygon points="8.0,8.0 195.0,8.0 215.0,36.0 195.0,64.0 8.0,64.0" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.8"/><text x="104.5" y="41.8" font-size="18" font-weight="bold" fill="#134e4a" text-anchor="middle">1 Scan</text><rect x="10.0" y="68.0" width="193.0" height="104.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="18.0" y="115.5" font-size="15" font-weight="normal" fill="#1f2937" text-anchor="start">known vulnerabilities; list</text><text x="18.0" y="134.2" font-size="15" font-weight="normal" fill="#1f2937" text-anchor="start">the contents as an SBOM</text><polygon points="227.0,8.0 414.0,8.0 434.0,36.0 414.0,64.0 227.0,64.0 247.0,36.0" fill="#dbeafe" stroke="#2563eb" stroke-width="1.8"/><text x="330.5" y="41.8" font-size="18" font-weight="bold" fill="#1e3a8a" text-anchor="middle">2 Sign</text><rect x="229.0" y="68.0" width="193.0" height="104.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="237.0" y="115.5" font-size="15" font-weight="normal" fill="#1f2937" text-anchor="start">a digital signature on the</text><text x="237.0" y="134.2" font-size="15" font-weight="normal" fill="#1f2937" text-anchor="start">image</text><polygon points="446.0,8.0 633.0,8.0 653.0,36.0 633.0,64.0 446.0,64.0 466.0,36.0" fill="#fef3c7" stroke="#d97706" stroke-width="1.8"/><text x="549.5" y="41.8" font-size="18" font-weight="bold" fill="#78350f" text-anchor="middle">3 Store</text><rect x="448.0" y="68.0" width="193.0" height="104.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="456.0" y="115.5" font-size="15" font-weight="normal" fill="#1f2937" text-anchor="start">a private registry,</text><text x="456.0" y="134.2" font-size="15" font-weight="normal" fill="#1f2937" text-anchor="start">authorized pulls only</text><polygon points="665.0,8.0 852.0,8.0 872.0,36.0 852.0,64.0 665.0,64.0 685.0,36.0" fill="#dcfce7" stroke="#16a34a" stroke-width="1.8"/><text x="768.5" y="41.8" font-size="18" font-weight="bold" fill="#14532d" text-anchor="middle">4 Verify</text><rect x="667.0" y="68.0" width="193.0" height="104.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="675.0" y="115.5" font-size="15" font-weight="normal" fill="#1f2937" text-anchor="start">check the signature at</text><text x="675.0" y="134.2" font-size="15" font-weight="normal" fill="#1f2937" text-anchor="start">deploy time</text><rect x="8.0" y="186.0" width="280.0" height="72.0" rx="8" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.6"/><text x="148.0" y="217.2" font-size="16" font-weight="bold" fill="#134e4a" text-anchor="middle">Trivy</text><text x="148.0" y="237.2" font-size="16" font-weight="normal" fill="#134e4a" text-anchor="middle">scans and lists the SBOM</text><rect x="300.0" y="186.0" width="280.0" height="72.0" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="440.0" y="217.2" font-size="16" font-weight="bold" fill="#1e3a8a" text-anchor="middle">Cosign</text><text x="440.0" y="237.2" font-size="16" font-weight="normal" fill="#1e3a8a" text-anchor="middle">signs with Sigstore</text><rect x="592.0" y="186.0" width="280.0" height="72.0" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="732.0" y="217.2" font-size="16" font-weight="bold" fill="#14532d" text-anchor="middle">Admission policy</text><text x="732.0" y="237.2" font-size="16" font-weight="normal" fill="#14532d" text-anchor="middle">for example in Kyverno</text></svg>