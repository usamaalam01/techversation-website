<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 316" width="880" height="316" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">m16-ui</title><desc id="d">A mock multiple-choice exam screen with Previous, Next, Flag and a timer, beside a Review Screen that lists flagged and answered items and holds the Finish Exam button.</desc><defs><marker id="ah0" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker></defs><rect x="0.75" y="0.75" width="878.5" height="314.5" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><rect x="8.0" y="8.0" width="560.0" height="300.0" rx="12" fill="#f9fafb" stroke="#9ca3af" stroke-width="2"/><text x="28.0" y="34.0" font-size="18" font-weight="bold" fill="#374151" text-anchor="start">Exam screen</text><rect x="24.0" y="46.0" width="528.0" height="130.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="288.0" y="105.9" font-size="17" font-weight="bold" fill="#1f2937" text-anchor="middle">Question area</text><text x="288.0" y="127.2" font-size="17" font-weight="normal" fill="#1f2937" text-anchor="middle">the stem and four options</text><rect x="24.0" y="196.0" width="120.0" height="46.0" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.6"/><text x="84.0" y="224.2" font-size="16" font-weight="bold" fill="#374151" text-anchor="middle">Previous</text><rect x="154.0" y="196.0" width="120.0" height="46.0" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.6"/><text x="214.0" y="224.2" font-size="16" font-weight="bold" fill="#374151" text-anchor="middle">Next</text><rect x="284.0" y="196.0" width="120.0" height="46.0" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="344.0" y="224.2" font-size="16" font-weight="bold" fill="#78350f" text-anchor="middle">Flag</text><rect x="424.0" y="196.0" width="128.0" height="46.0" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.6"/><text x="488.0" y="224.2" font-size="16" font-weight="bold" fill="#7f1d1d" text-anchor="middle">time left</text><text x="288.0" y="280.0" font-size="16" font-weight="normal" fill="#6b7280" text-anchor="middle">last question: Review Exam</text><line x1="570.0" y1="158.0" x2="588.0" y2="158.0" stroke="#374151" stroke-width="2.4" marker-end="url(#ah0)"/><rect x="588.0" y="8.0" width="284.0" height="300.0" rx="12" fill="#f9fafb" stroke="#9ca3af" stroke-width="2"/><text x="730.0" y="34.0" font-size="18" font-weight="bold" fill="#374151" text-anchor="middle">Review Screen</text><rect x="604.0" y="50.0" width="252.0" height="72.0" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="730.0" y="81.2" font-size="16" font-weight="bold" fill="#78350f" text-anchor="middle">Flagged items</text><text x="730.0" y="101.2" font-size="16" font-weight="normal" fill="#78350f" text-anchor="middle">highlighted: go back</text><rect x="604.0" y="134.0" width="252.0" height="72.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="730.0" y="165.2" font-size="16" font-weight="bold" fill="#1f2937" text-anchor="middle">Answered items</text><text x="730.0" y="185.2" font-size="16" font-weight="normal" fill="#1f2937" text-anchor="middle">check them here</text><rect x="604.0" y="222.0" width="252.0" height="72.0" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.6"/><text x="730.0" y="263.9" font-size="18" font-weight="bold" fill="#7f1d1d" text-anchor="middle">Finish Exam</text></svg>