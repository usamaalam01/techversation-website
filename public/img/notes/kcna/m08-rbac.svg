<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 342" width="880" height="342" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">m08-rbac</title><desc id="d">Subjects get a role through a binding: a RoleBinding gives a Role in one namespace, a ClusterRoleBinding gives a ClusterRole cluster-wide; a RoleBinding may also reference a ClusterRole.</desc><defs><marker id="ah0" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker></defs><rect x="0.75" y="0.75" width="878.5" height="340.5" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><rect x="8.0" y="8.0" width="864.0" height="130.0" rx="12" fill="#f9fafb" stroke="#9ca3af" stroke-width="2"/><text x="22.0" y="32.0" font-size="16" font-weight="bold" fill="#374151" text-anchor="start">In one namespace</text><rect x="24.0" y="48.0" width="226.0" height="80.0" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="137.0" y="73.2" font-size="16" font-weight="bold" fill="#1e3a8a" text-anchor="middle">Subjects</text><text x="137.0" y="93.2" font-size="16" font-weight="normal" fill="#1e3a8a" text-anchor="middle">users, groups,</text><text x="137.0" y="113.2" font-size="16" font-weight="normal" fill="#1e3a8a" text-anchor="middle">ServiceAccounts</text><rect x="310.0" y="48.0" width="240.0" height="80.0" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="430.0" y="83.2" font-size="16" font-weight="bold" fill="#78350f" text-anchor="middle">RoleBinding</text><text x="430.0" y="103.2" font-size="16" font-weight="normal" fill="#78350f" text-anchor="middle">grants a role in this namespace</text><rect x="610.0" y="48.0" width="246.0" height="80.0" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="733.0" y="83.2" font-size="16" font-weight="bold" fill="#14532d" text-anchor="middle">Role</text><text x="733.0" y="103.2" font-size="16" font-weight="normal" fill="#14532d" text-anchor="middle">rules: verbs on resources</text><line x1="250.0" y1="88.0" x2="308.0" y2="88.0" stroke="#374151" stroke-width="2.4" marker-end="url(#ah0)"/><line x1="550.0" y1="88.0" x2="608.0" y2="88.0" stroke="#374151" stroke-width="2.4" marker-end="url(#ah0)"/><rect x="8.0" y="148.0" width="864.0" height="130.0" rx="12" fill="#f9fafb" stroke="#9ca3af" stroke-width="2"/><text x="22.0" y="172.0" font-size="16" font-weight="bold" fill="#374151" text-anchor="start">Cluster-wide</text><rect x="24.0" y="188.0" width="226.0" height="80.0" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="137.0" y="213.2" font-size="16" font-weight="bold" fill="#1e3a8a" text-anchor="middle">Subjects</text><text x="137.0" y="233.2" font-size="16" font-weight="normal" fill="#1e3a8a" text-anchor="middle">users, groups,</text><text x="137.0" y="253.2" font-size="16" font-weight="normal" fill="#1e3a8a" text-anchor="middle">ServiceAccounts</text><rect x="310.0" y="188.0" width="240.0" height="80.0" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="430.0" y="223.2" font-size="16" font-weight="bold" fill="#78350f" text-anchor="middle">ClusterRoleBinding</text><text x="430.0" y="243.2" font-size="16" font-weight="normal" fill="#78350f" text-anchor="middle">grants a role everywhere</text><rect x="610.0" y="188.0" width="246.0" height="80.0" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="733.0" y="223.2" font-size="16" font-weight="bold" fill="#14532d" text-anchor="middle">ClusterRole</text><text x="733.0" y="243.2" font-size="16" font-weight="normal" fill="#14532d" text-anchor="middle">rules; not namespaced</text><line x1="250.0" y1="228.0" x2="308.0" y2="228.0" stroke="#374151" stroke-width="2.4" marker-end="url(#ah0)"/><line x1="550.0" y1="228.0" x2="608.0" y2="228.0" stroke="#374151" stroke-width="2.4" marker-end="url(#ah0)"/><rect x="8.0" y="292.0" width="864.0" height="42.0" rx="8" fill="#1e3a8a" stroke="#1e3a8a" stroke-width="1.6"/><text x="440.0" y="318.5" font-size="17" font-weight="bold" fill="#ffffff" text-anchor="middle">A RoleBinding may also reference a ClusterRole, to reuse it in one namespace</text></svg>