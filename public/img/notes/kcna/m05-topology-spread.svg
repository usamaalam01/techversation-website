<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 330" width="880" height="330" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">m05-topology-spread</title><desc id="d">Three zones hold two, two and one Pods; with a maxSkew of one the next Pod goes to the zone with one Pod.</desc><defs></defs><rect x="0.75" y="0.75" width="878.5" height="328.5" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><rect x="8.0" y="8.0" width="190.0" height="214.0" rx="12" fill="#f9fafb" stroke="#9ca3af" stroke-width="2"/><text x="103.0" y="36.0" font-size="18" font-weight="bold" fill="#374151" text-anchor="middle">Zone A</text><rect x="28.0" y="50.0" width="150.0" height="54.0" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="103.0" y="82.2" font-size="16" font-weight="bold" fill="#14532d" text-anchor="middle">Pod</text><rect x="28.0" y="114.0" width="150.0" height="54.0" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="103.0" y="146.2" font-size="16" font-weight="bold" fill="#14532d" text-anchor="middle">Pod</text><rect x="212.0" y="8.0" width="190.0" height="214.0" rx="12" fill="#f9fafb" stroke="#9ca3af" stroke-width="2"/><text x="307.0" y="36.0" font-size="18" font-weight="bold" fill="#374151" text-anchor="middle">Zone B</text><rect x="232.0" y="50.0" width="150.0" height="54.0" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="307.0" y="82.2" font-size="16" font-weight="bold" fill="#14532d" text-anchor="middle">Pod</text><rect x="232.0" y="114.0" width="150.0" height="54.0" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="307.0" y="146.2" font-size="16" font-weight="bold" fill="#14532d" text-anchor="middle">Pod</text><rect x="416.0" y="8.0" width="190.0" height="214.0" rx="12" fill="#f9fafb" stroke="#9ca3af" stroke-width="2"/><text x="511.0" y="36.0" font-size="18" font-weight="bold" fill="#374151" text-anchor="middle">Zone C</text><rect x="436.0" y="50.0" width="150.0" height="54.0" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="511.0" y="82.2" font-size="16" font-weight="bold" fill="#14532d" text-anchor="middle">Pod</text><rect x="436.0" y="114.0" width="150.0" height="54.0" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.6" stroke-dasharray="6 4"/><text x="511.0" y="146.2" font-size="16" font-weight="bold" fill="#78350f" text-anchor="middle">next Pod</text><rect x="618.0" y="8.0" width="254.0" height="214.0" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="745.0" y="82.4" font-size="15" font-weight="bold" fill="#1e3a8a" text-anchor="middle">Settings</text><text x="745.0" y="101.1" font-size="15" font-weight="normal" fill="#1e3a8a" text-anchor="middle">maxSkew: 1</text><text x="745.0" y="119.9" font-size="15" font-weight="normal" fill="#1e3a8a" text-anchor="middle">topologyKey: zone label</text><text x="745.0" y="138.6" font-size="15" font-weight="normal" fill="#1e3a8a" text-anchor="middle">whenUnsatisfiable: DoNotSchedule</text><text x="745.0" y="157.4" font-size="15" font-weight="normal" fill="#1e3a8a" text-anchor="middle">labelSelector: which Pods count</text><rect x="8.0" y="242.0" width="864.0" height="50.0" rx="8" fill="#1e3a8a" stroke="#1e3a8a" stroke-width="1.6"/><text x="440.0" y="272.5" font-size="17" font-weight="bold" fill="#ffffff" text-anchor="middle">maxSkew is the largest allowed difference between a zone and the zone with the fewest Pods</text></svg>