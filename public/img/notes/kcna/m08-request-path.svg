<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 240" width="880" height="240" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">m08-request-path</title><desc id="d">A request meets TLS, then authentication, authorization and admission before the object is stored; reads skip admission and Kubernetes has no User object.</desc><defs></defs><rect x="0.75" y="0.75" width="878.5" height="238.5" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><polygon points="8.0,8.0 152.8,8.0 172.8,36.0 152.8,64.0 8.0,64.0" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.8"/><text x="83.4" y="41.1" font-size="16" font-weight="bold" fill="#374151" text-anchor="middle">1 TLS</text><rect x="10.0" y="68.0" width="150.8" height="104.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="18.0" y="115.5" font-size="15" font-weight="normal" fill="#1f2937" text-anchor="start">secures the</text><text x="18.0" y="134.2" font-size="15" font-weight="normal" fill="#1f2937" text-anchor="start">connection</text><polygon points="182.8,8.0 327.6,8.0 347.6,36.0 327.6,64.0 182.8,64.0 202.8,36.0" fill="#dbeafe" stroke="#2563eb" stroke-width="1.8"/><text x="265.2" y="31.5" font-size="16" font-weight="bold" fill="#1e3a8a" text-anchor="middle">2</text><text x="265.2" y="50.7" font-size="16" font-weight="bold" fill="#1e3a8a" text-anchor="middle">Authentication</text><rect x="184.8" y="68.0" width="150.8" height="104.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="192.8" y="115.5" font-size="15" font-weight="normal" fill="#1f2937" text-anchor="start">who are you?</text><text x="192.8" y="134.2" font-size="15" font-weight="normal" fill="#1f2937" text-anchor="start">failure: 401</text><polygon points="357.6,8.0 502.4,8.0 522.4,36.0 502.4,64.0 357.6,64.0 377.6,36.0" fill="#fef3c7" stroke="#d97706" stroke-width="1.8"/><text x="440.0" y="41.1" font-size="16" font-weight="bold" fill="#78350f" text-anchor="middle">3 Authorization</text><rect x="359.6" y="68.0" width="150.8" height="104.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="367.6" y="115.5" font-size="15" font-weight="normal" fill="#1f2937" text-anchor="start">what may you do?</text><text x="367.6" y="134.2" font-size="15" font-weight="normal" fill="#1f2937" text-anchor="start">denial: 403</text><polygon points="532.4,8.0 677.2,8.0 697.2,36.0 677.2,64.0 532.4,64.0 552.4,36.0" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.8"/><text x="614.8" y="41.1" font-size="16" font-weight="bold" fill="#4c1d95" text-anchor="middle">4 Admission</text><rect x="534.4" y="68.0" width="150.8" height="104.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="542.4" y="115.5" font-size="15" font-weight="normal" fill="#1f2937" text-anchor="start">may modify or</text><text x="542.4" y="134.2" font-size="15" font-weight="normal" fill="#1f2937" text-anchor="start">reject the object</text><polygon points="707.2,8.0 852.0,8.0 872.0,36.0 852.0,64.0 707.2,64.0 727.2,36.0" fill="#dcfce7" stroke="#16a34a" stroke-width="1.8"/><text x="789.6" y="41.1" font-size="16" font-weight="bold" fill="#14532d" text-anchor="middle">5 Stored</text><rect x="709.2" y="68.0" width="150.8" height="104.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="717.2" y="115.5" font-size="15" font-weight="normal" fill="#1f2937" text-anchor="start">the object is written</text><text x="717.2" y="134.2" font-size="15" font-weight="normal" fill="#1f2937" text-anchor="start">to the store</text><rect x="8.0" y="186.0" width="864.0" height="46.0" rx="8" fill="#1e3a8a" stroke="#1e3a8a" stroke-width="1.6"/><text x="440.0" y="214.5" font-size="17" font-weight="bold" fill="#ffffff" text-anchor="middle">Reads skip admission, and Kubernetes has no User object</text></svg>