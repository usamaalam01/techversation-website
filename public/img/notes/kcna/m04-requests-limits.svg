<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 272.72" width="880" height="272.72" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">m04-requests-limits</title><desc id="d">A request decides where a Pod is placed; a limit is enforced at run time: CPU is throttled and memory over-use can be killed.</desc><defs></defs><rect x="0.75" y="0.75" width="878.5" height="271.22" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><rect x="8.0" y="8.0" width="420.0" height="50.0" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="218.0" y="39.2" font-size="19" font-weight="bold" fill="#1e3a8a" text-anchor="middle">Request: used for placement</text><rect x="8.0" y="64.0" width="420.0" height="146.7" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="1.8"/><polyline points="23.0,89.4 28.0,95.4 38.0,82.4" fill="none" stroke="#16a34a" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><text x="44.0" y="96.0" font-size="19" font-weight="normal" fill="#1f2937" text-anchor="start">The scheduler picks a node with enough</text><text x="44.0" y="119.2" font-size="19" font-weight="normal" fill="#1f2937" text-anchor="start">room</text><polyline points="23.0,145.8 28.0,151.8 38.0,138.8" fill="none" stroke="#16a34a" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><text x="44.0" y="152.4" font-size="19" font-weight="normal" fill="#1f2937" text-anchor="start">The kubelet reserves that amount for the</text><text x="44.0" y="175.6" font-size="19" font-weight="normal" fill="#1f2937" text-anchor="start">container</text><rect x="452.0" y="8.0" width="420.0" height="50.0" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="662.0" y="39.2" font-size="19" font-weight="bold" fill="#78350f" text-anchor="middle">Limit: enforced at run time</text><rect x="452.0" y="64.0" width="420.0" height="146.7" rx="10" fill="#ffffff" stroke="#d97706" stroke-width="1.8"/><polyline points="467.0,89.4 472.0,95.4 482.0,82.4" fill="none" stroke="#16a34a" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><text x="488.0" y="96.0" font-size="19" font-weight="normal" fill="#1f2937" text-anchor="start">The kubelet and the kernel enforce it</text><polyline points="467.0,122.6 472.0,128.6 482.0,115.6" fill="none" stroke="#16a34a" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><text x="488.0" y="129.2" font-size="19" font-weight="normal" fill="#1f2937" text-anchor="start">Over the CPU limit: throttled</text><polyline points="467.0,155.8 472.0,161.8 482.0,148.8" fill="none" stroke="#16a34a" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><text x="488.0" y="162.4" font-size="19" font-weight="normal" fill="#1f2937" text-anchor="start">Over the memory limit: may be killed</text><rect x="8.0" y="224.7" width="864.0" height="44.0" rx="8" fill="#1e3a8a" stroke="#1e3a8a" stroke-width="1.6"/><text x="440.0" y="252.6" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="middle">CPU is throttled; memory is killed</text></svg>