<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 306" width="880" height="306" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">m10-helm</title><desc id="d">A chart from a repository and a values file are combined by helm install into releases in the cluster; the same chart installed twice gives two releases.</desc><defs><marker id="ah0" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker><marker id="ah1" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker></defs><rect x="0.75" y="0.75" width="878.5" height="304.5" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><rect x="8.0" y="8.0" width="230.0" height="46.0" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.6"/><text x="123.0" y="36.2" font-size="16" font-weight="bold" fill="#374151" text-anchor="middle">Chart repository</text><line x1="123.0" y1="54.0" x2="123.0" y2="72.0" stroke="#374151" stroke-width="2.2" marker-end="url(#ah0)"/><rect x="8.0" y="74.0" width="230.0" height="118.0" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="123.0" y="118.2" font-size="16" font-weight="bold" fill="#1e3a8a" text-anchor="middle">Chart</text><text x="123.0" y="138.2" font-size="16" font-weight="normal" fill="#1e3a8a" text-anchor="middle">Chart.yaml</text><text x="123.0" y="158.2" font-size="16" font-weight="normal" fill="#1e3a8a" text-anchor="middle">values.yaml, templates/</text><rect x="8.0" y="206.0" width="230.0" height="90.0" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="123.0" y="246.2" font-size="16" font-weight="bold" fill="#78350f" text-anchor="middle">Values</text><text x="123.0" y="266.2" font-size="16" font-weight="normal" fill="#78350f" text-anchor="middle">defaults, a -f file or --set</text><rect x="330.0" y="140.0" width="104.3" height="26.0" rx="13.0" fill="#fef3c7" stroke="#d97706" stroke-width="1.2"/><text x="382.2" y="157.5" font-size="16" font-weight="bold" fill="#78350f" text-anchor="middle">helm install</text><line x1="238.0" y1="133.0" x2="328.0" y2="152.0" stroke="#374151" stroke-width="2.2" marker-end="url(#ah0)"/><line x1="238.0" y1="250.0" x2="328.0" y2="170.0" stroke="#374151" stroke-width="2.2" marker-end="url(#ah0)"/><rect x="560.0" y="8.0" width="312.0" height="290.0" rx="12" fill="#f9fafb" stroke="#9ca3af" stroke-width="2"/><text x="578.0" y="34.0" font-size="18" font-weight="bold" fill="#374151" text-anchor="start">Cluster</text><rect x="578.0" y="48.0" width="276.0" height="112.0" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="716.0" y="99.2" font-size="16" font-weight="bold" fill="#14532d" text-anchor="middle">Release</text><text x="716.0" y="119.2" font-size="16" font-weight="normal" fill="#14532d" text-anchor="middle">one install of the chart</text><rect x="578.0" y="176.0" width="276.0" height="112.0" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="716.0" y="227.2" font-size="16" font-weight="bold" fill="#14532d" text-anchor="middle">Release</text><text x="716.0" y="247.2" font-size="16" font-weight="normal" fill="#14532d" text-anchor="middle">the same chart, other values</text><line x1="450.0" y1="152.0" x2="576.0" y2="104.0" stroke="#16a34a" stroke-width="2.2" marker-end="url(#ah1)"/><line x1="450.0" y1="164.0" x2="576.0" y2="232.0" stroke="#16a34a" stroke-width="2.2" marker-end="url(#ah1)"/></svg>