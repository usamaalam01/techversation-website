<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 328" width="880" height="328" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">m06-mesh</title><desc id="d">Two mesh designs: with sidecars each Pod holds an app and a proxy, and the proxies talk to each other; without sidecars the Pods hold only the app and the mesh work moves out of the Pods.</desc><defs><marker id="ah0" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker></defs><rect x="0.75" y="0.75" width="878.5" height="326.5" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><rect x="8.0" y="10.0" width="424.0" height="246.0" rx="12" fill="#f9fafb" stroke="#9ca3af" stroke-width="2"/><text x="220.0" y="38.0" font-size="18" font-weight="bold" fill="#78350f" text-anchor="middle">Sidecar: a proxy in every Pod</text><rect x="24.0" y="52.0" width="180.0" height="190.0" rx="10" fill="#ffffff" stroke="#9ca3af" stroke-width="1.8"/><text x="38.0" y="76.0" font-size="15" font-weight="bold" fill="#374151" text-anchor="start">Pod</text><rect x="38.0" y="88.0" width="152.0" height="56.0" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="114.0" y="121.2" font-size="16" font-weight="bold" fill="#14532d" text-anchor="middle">App</text><rect x="38.0" y="156.0" width="152.0" height="56.0" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="114.0" y="189.2" font-size="16" font-weight="bold" fill="#78350f" text-anchor="middle">Proxy</text><rect x="228.0" y="52.0" width="180.0" height="190.0" rx="10" fill="#ffffff" stroke="#9ca3af" stroke-width="1.8"/><text x="242.0" y="76.0" font-size="15" font-weight="bold" fill="#374151" text-anchor="start">Pod</text><rect x="242.0" y="88.0" width="152.0" height="56.0" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="318.0" y="121.2" font-size="16" font-weight="bold" fill="#14532d" text-anchor="middle">App</text><rect x="242.0" y="156.0" width="152.0" height="56.0" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="318.0" y="189.2" font-size="16" font-weight="bold" fill="#78350f" text-anchor="middle">Proxy</text><line x1="190.0" y1="184.0" x2="242.0" y2="184.0" stroke="#d97706" stroke-width="2.4" marker-end="url(#ah0)"/><line x1="242.0" y1="184.0" x2="190.0" y2="184.0" stroke="#d97706" stroke-width="2.4" marker-end="url(#ah0)"/><rect x="448.0" y="10.0" width="424.0" height="246.0" rx="12" fill="#f9fafb" stroke="#9ca3af" stroke-width="2"/><text x="660.0" y="38.0" font-size="18" font-weight="bold" fill="#14532d" text-anchor="middle">Sidecarless: no proxy in the Pod</text><rect x="464.0" y="52.0" width="180.0" height="108.0" rx="10" fill="#ffffff" stroke="#9ca3af" stroke-width="1.8"/><text x="478.0" y="76.0" font-size="15" font-weight="bold" fill="#374151" text-anchor="start">Pod</text><rect x="478.0" y="88.0" width="152.0" height="56.0" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="554.0" y="121.2" font-size="16" font-weight="bold" fill="#14532d" text-anchor="middle">App</text><line x1="554.0" y1="160.0" x2="554.0" y2="178.0" stroke="#d97706" stroke-width="2.2" marker-end="url(#ah0)"/><rect x="668.0" y="52.0" width="180.0" height="108.0" rx="10" fill="#ffffff" stroke="#9ca3af" stroke-width="1.8"/><text x="682.0" y="76.0" font-size="15" font-weight="bold" fill="#374151" text-anchor="start">Pod</text><rect x="682.0" y="88.0" width="152.0" height="56.0" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="758.0" y="121.2" font-size="16" font-weight="bold" fill="#14532d" text-anchor="middle">App</text><line x1="758.0" y1="160.0" x2="758.0" y2="178.0" stroke="#d97706" stroke-width="2.2" marker-end="url(#ah0)"/><rect x="464.0" y="180.0" width="384.0" height="66.0" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="656.0" y="208.2" font-size="16" font-weight="bold" fill="#78350f" text-anchor="middle">Mesh work moves out of the Pods</text><text x="656.0" y="228.2" font-size="16" font-weight="normal" fill="#78350f" text-anchor="middle">for example into the kernel with eBPF</text><rect x="8.0" y="272.0" width="864.0" height="46.0" rx="8" fill="#1e3a8a" stroke="#1e3a8a" stroke-width="1.6"/><text x="440.0" y="300.5" font-size="17" font-weight="bold" fill="#ffffff" text-anchor="middle">Either way: security, reliability and observability without code changes</text></svg>