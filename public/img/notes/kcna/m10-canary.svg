<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 330" width="880" height="330" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">m10-canary</title><desc id="d">Three rows: a canary sends a growing share of traffic to the new version, A/B testing sends users with a header or cookie to it, and a shadow release copies each request to it.</desc><defs><marker id="ah0" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker><marker id="ah1" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker></defs><rect x="0.75" y="0.75" width="878.5" height="328.5" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><rect x="8.0" y="8.0" width="170.0" height="100.0" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.6"/><text x="93.0" y="63.5" font-size="17" font-weight="bold" fill="#374151" text-anchor="middle">Canary</text><rect x="8.0" y="116.0" width="170.0" height="100.0" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.6"/><text x="93.0" y="171.5" font-size="17" font-weight="bold" fill="#374151" text-anchor="middle">A/B testing</text><rect x="8.0" y="224.0" width="170.0" height="100.0" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.6"/><text x="93.0" y="279.5" font-size="17" font-weight="bold" fill="#374151" text-anchor="middle">Shadow</text><rect x="194.0" y="12.0" width="678.0" height="26.0" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/><rect x="194.0" y="12.0" width="90.0" height="26.0" rx="4" fill="#86efac" stroke="#16a34a" stroke-width="1.4"/><text x="300.0" y="31.0" font-size="14" font-weight="bold" fill="#1e3a8a" text-anchor="start">a small share</text><rect x="194.0" y="44.0" width="678.0" height="26.0" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/><rect x="194.0" y="44.0" width="300.0" height="26.0" rx="4" fill="#86efac" stroke="#16a34a" stroke-width="1.4"/><text x="510.0" y="63.0" font-size="14" font-weight="bold" fill="#1e3a8a" text-anchor="start">a larger share</text><rect x="194.0" y="76.0" width="678.0" height="26.0" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/><rect x="194.0" y="76.0" width="678.0" height="26.0" rx="4" fill="#86efac" stroke="#16a34a" stroke-width="1.4"/><text x="210.0" y="95.0" font-size="14" font-weight="bold" fill="#14532d" text-anchor="start">all traffic to the new version</text><rect x="194.0" y="124.0" width="250.0" height="38.0" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="319.0" y="147.9" font-size="15" font-weight="bold" fill="#78350f" text-anchor="middle">users with a header or cookie</text><line x1="444.0" y1="143.0" x2="520.0" y2="143.0" stroke="#16a34a" stroke-width="2.4" marker-end="url(#ah0)"/><rect x="522.0" y="124.0" width="350.0" height="38.0" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="697.0" y="147.9" font-size="15" font-weight="bold" fill="#14532d" text-anchor="middle">new version</text><rect x="194.0" y="170.0" width="250.0" height="38.0" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.6"/><text x="319.0" y="193.9" font-size="15" font-weight="bold" fill="#374151" text-anchor="middle">all other users</text><line x1="444.0" y1="189.0" x2="520.0" y2="189.0" stroke="#2563eb" stroke-width="2.4" marker-end="url(#ah1)"/><rect x="522.0" y="170.0" width="350.0" height="38.0" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="697.0" y="193.9" font-size="15" font-weight="bold" fill="#1e3a8a" text-anchor="middle">old version</text><rect x="194.0" y="232.0" width="150.0" height="76.0" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.6"/><text x="269.0" y="274.9" font-size="15" font-weight="bold" fill="#374151" text-anchor="middle">each request</text><line x1="344.0" y1="250.0" x2="420.0" y2="250.0" stroke="#2563eb" stroke-width="2.4" marker-end