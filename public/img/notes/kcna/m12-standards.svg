<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 396" width="880" height="396" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">m12-standards</title><desc id="d">Kubernetes sits among four open interfaces: OCI for images, CRI for runtimes, CNI for networks and CSI for storage; open interfaces keep parts swappable and workloads portable.</desc><defs><marker id="ah0" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker></defs><rect x="0.75" y="0.75" width="878.5" height="394.5" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><rect x="340.0" y="126.0" width="200.0" height="100.0" rx="8" fill="#1e3a8a" stroke="#1e3a8a" stroke-width="1.6"/><text x="440.0" y="182.5" font-size="20" font-weight="bold" fill="#ffffff" text-anchor="middle">Kubernetes</text><rect x="8.0" y="8.0" width="420.0" height="90.0" rx="8" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.6"/><text x="218.0" y="47.9" font-size="17" font-weight="bold" fill="#134e4a" text-anchor="middle">OCI</text><text x="218.0" y="69.2" font-size="17" font-weight="normal" fill="#134e4a" text-anchor="middle">image format, runtime and distribution</text><rect x="452.0" y="8.0" width="420.0" height="90.0" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="662.0" y="47.9" font-size="17" font-weight="bold" fill="#1e3a8a" text-anchor="middle">CRI</text><text x="662.0" y="69.2" font-size="17" font-weight="normal" fill="#1e3a8a" text-anchor="middle">the kubelet talks to a runtime: containerd, CRI-O</text><rect x="8.0" y="254.0" width="420.0" height="90.0" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="218.0" y="293.9" font-size="17" font-weight="bold" fill="#78350f" text-anchor="middle">CNI</text><text x="218.0" y="315.1" font-size="17" font-weight="normal" fill="#78350f" text-anchor="middle">network plugins: Cilium, Calico, Flannel</text><rect x="452.0" y="254.0" width="420.0" height="90.0" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.6"/><text x="662.0" y="293.9" font-size="17" font-weight="bold" fill="#4c1d95" text-anchor="middle">CSI</text><text x="662.0" y="315.1" font-size="17" font-weight="normal" fill="#4c1d95" text-anchor="middle">storage drivers</text><line x1="360.0" y1="126.0" x2="280.0" y2="100.0" stroke="#6b7280" stroke-width="2" marker-end="url(#ah0)"/><line x1="520.0" y1="126.0" x2="600.0" y2="100.0" stroke="#6b7280" stroke-width="2" marker-end="url(#ah0)"/><line x1="360.0" y1="226.0" x2="280.0" y2="252.0" stroke="#6b7280" stroke-width="2" marker-end="url(#ah0)"/><line x1="520.0" y1="226.0" x2="600.0" y2="252.0" stroke="#6b7280" stroke-width="2" marker-end="url(#ah0)"/><rect x="8.0" y="354.0" width="864.0" height="36.0" rx="8" fill="#1e3a8a" stroke="#1e3a8a" stroke-width="1.6"/><text x="440.0" y="377.2" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">Swap an implementation, keep the workload portable</text></svg>