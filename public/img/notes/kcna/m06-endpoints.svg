<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 278" width="880" height="278" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">m06-endpoints</title><desc id="d">A Service with a selector gets EndpointSlices that list its Pods; kube-proxy on every node turns the list into forwarding rules; a headless Service is not handled by kube-proxy.</desc><defs><marker id="ah0" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker></defs><rect x="0.75" y="0.75" width="878.5" height="276.5" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><polygon points="8.0,8.0 268.0,8.0 288.0,36.0 268.0,64.0 8.0,64.0" fill="#dbeafe" stroke="#2563eb" stroke-width="1.8"/><text x="141.0" y="41.8" font-size="18" font-weight="bold" fill="#1e3a8a" text-anchor="middle">1 Service</text><rect x="10.0" y="68.0" width="266.0" height="78.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="18.0" y="112.2" font-size="16" font-weight="normal" fill="#1f2937" text-anchor="start">has a selector for its Pods</text><polygon points="300.0,8.0 560.0,8.0 580.0,36.0 560.0,64.0 300.0,64.0 320.0,36.0" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.8"/><text x="440.0" y="41.8" font-size="18" font-weight="bold" fill="#134e4a" text-anchor="middle">2 EndpointSlices</text><rect x="302.0" y="68.0" width="266.0" height="78.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="310.0" y="102.2" font-size="16" font-weight="normal" fill="#1f2937" text-anchor="start">created automatically; they list the</text><text x="310.0" y="122.2" font-size="16" font-weight="normal" fill="#1f2937" text-anchor="start">matching Pods</text><polygon points="592.0,8.0 852.0,8.0 872.0,36.0 852.0,64.0 592.0,64.0 612.0,36.0" fill="#dcfce7" stroke="#16a34a" stroke-width="1.8"/><text x="732.0" y="41.8" font-size="18" font-weight="bold" fill="#14532d" text-anchor="middle">3 Pods</text><rect x="594.0" y="68.0" width="266.0" height="78.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="602.0" y="112.2" font-size="16" font-weight="normal" fill="#1f2937" text-anchor="start">the addresses behind the Service</text><rect x="8.0" y="166.0" width="540.0" height="104.0" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="278.0" y="203.2" font-size="16" font-weight="bold" fill="#78350f" text-anchor="middle">kube-proxy on every node</text><text x="278.0" y="223.2" font-size="16" font-weight="normal" fill="#78350f" text-anchor="middle">watches Services and EndpointSlices and sets up forwarding rules:</text><text x="278.0" y="243.2" font-size="16" font-weight="normal" fill="#78350f" text-anchor="middle">iptables, ipvs or nftables</text><rect x="564.0" y="166.0" width="308.0" height="104.0" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.6" stroke-dasharray="7 4"/><text x="718.0" y="203.2" font-size="16" font-weight="bold" fill="#7f1d1d" text-anchor="middle">Headless Service</text><text x="718.0" y="223.2" font-size="16" font-weight="normal" fill="#7f1d1d" text-anchor="middle">no virtual IP, so kube-proxy does not</text><text x="718.0" y="243.2" font-size="16" font-weight="normal" fill="#7f1d1d" text-anchor="middle">handle it</text><line x1="440.0" y1="166.0" x2="440.0" y2="144.0" stroke="#d97706" stroke-width="2.4" marker-end="url(#ah0)"/></svg>