<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 262" width="880" height="262" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">m14-cncf</title><desc id="d">A mission banner above four boxes: the Governing Board for business, the TOC for technology, TAGs and TCGs for advice and communities, and the end user community for the needs of users.</desc><defs><marker id="ah0" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker></defs><rect x="0.75" y="0.75" width="878.5" height="260.5" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><rect x="8.0" y="8.0" width="864.0" height="54.0" rx="8" fill="#1e3a8a" stroke="#1e3a8a" stroke-width="1.6"/><text x="440.0" y="40.5" font-size="17" font-weight="bold" fill="#ffffff" text-anchor="middle">Mission: make cloud native computing ubiquitous with open source, vendor-neutral projects</text><rect x="8.0" y="96.0" width="207.0" height="150.0" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="111.5" y="156.2" font-size="16" font-weight="bold" fill="#1e3a8a" text-anchor="middle">Governing Board</text><text x="111.5" y="176.2" font-size="16" font-weight="normal" fill="#1e3a8a" text-anchor="middle">budget and business</text><text x="111.5" y="196.2" font-size="16" font-weight="normal" fill="#1e3a8a" text-anchor="middle">direction</text><line x1="111.5" y1="62.0" x2="111.5" y2="94.0" stroke="#6b7280" stroke-width="2" marker-end="url(#ah0)"/><rect x="227.0" y="96.0" width="207.0" height="150.0" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="330.5" y="156.2" font-size="16" font-weight="bold" fill="#78350f" text-anchor="middle">TOC</text><text x="330.5" y="176.2" font-size="16" font-weight="normal" fill="#78350f" text-anchor="middle">admits, oversees and</text><text x="330.5" y="196.2" font-size="16" font-weight="normal" fill="#78350f" text-anchor="middle">archives projects</text><line x1="330.5" y1="62.0" x2="330.5" y2="94.0" stroke="#6b7280" stroke-width="2" marker-end="url(#ah0)"/><rect x="446.0" y="96.0" width="207.0" height="150.0" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="549.5" y="156.2" font-size="16" font-weight="bold" fill="#14532d" text-anchor="middle">TAGs and TCGs</text><text x="549.5" y="176.2" font-size="16" font-weight="normal" fill="#14532d" text-anchor="middle">technical advice and</text><text x="549.5" y="196.2" font-size="16" font-weight="normal" fill="#14532d" text-anchor="middle">community groups</text><line x1="549.5" y1="62.0" x2="549.5" y2="94.0" stroke="#6b7280" stroke-width="2" marker-end="url(#ah0)"/><rect x="665.0" y="96.0" width="207.0" height="150.0" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.6"/><text x="768.5" y="156.2" font-size="16" font-weight="bold" fill="#4c1d95" text-anchor="middle">End user community</text><text x="768.5" y="176.2" font-size="16" font-weight="normal" fill="#4c1d95" text-anchor="middle">the voice of those who use</text><text x="768.5" y="196.2" font-size="16" font-weight="normal" fill="#4c1d95" text-anchor="middle">the projects</text><line x1="768.5" y1="62.0" x2="768.5" y2="94.0" stroke="#6b7280" stroke-width="2" marker-end="url(#ah0)"/></svg>