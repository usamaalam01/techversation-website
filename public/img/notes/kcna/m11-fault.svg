<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 332" width="880" height="332" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">m11-fault</title><desc id="d">Ask first whether the container started: if not, look at the platform and its events; if it started and then failed, look at the application and its logs.</desc><defs><marker id="ah0" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker></defs><rect x="0.75" y="0.75" width="878.5" height="330.5" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><rect x="250.0" y="8.0" width="380.0" height="56.0" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="440.0" y="42.2" font-size="19" font-weight="bold" fill="#78350f" text-anchor="middle">Did the container start?</text><rect x="8.0" y="112.0" width="424.0" height="150.0" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="220.0" y="162.2" font-size="16" font-weight="bold" fill="#1e3a8a" text-anchor="middle">No: look at the platform</text><text x="220.0" y="182.2" font-size="16" font-weight="normal" fill="#1e3a8a" text-anchor="middle">scheduling, image pull, volumes, quota, permissions, the</text><text x="220.0" y="202.2" font-size="16" font-weight="normal" fill="#1e3a8a" text-anchor="middle">node</text><text x="220.0" y="222.2" font-size="16" font-weight="normal" fill="#1e3a8a" text-anchor="middle">evidence: events</text><rect x="448.0" y="112.0" width="424.0" height="150.0" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="660.0" y="172.2" font-size="16" font-weight="bold" fill="#14532d" text-anchor="middle">Yes, then it failed: the application</text><text x="660.0" y="192.2" font-size="16" font-weight="normal" fill="#14532d" text-anchor="middle">the error in the logs, the configuration, probes, memory</text><text x="660.0" y="212.2" font-size="16" font-weight="normal" fill="#14532d" text-anchor="middle">evidence: logs</text><line x1="400.0" y1="64.0" x2="220.0" y2="110.0" stroke="#374151" stroke-width="2.2" marker-end="url(#ah0)"/><line x1="480.0" y1="64.0" x2="660.0" y2="110.0" stroke="#374151" stroke-width="2.2" marker-end="url(#ah0)"/><text x="290.0" y="80.0" font-size="16" font-weight="bold" fill="#1e3a8a" text-anchor="middle">no</text><text x="590.0" y="80.0" font-size="16" font-weight="bold" fill="#14532d" text-anchor="middle">yes</text><rect x="8.0" y="280.0" width="864.0" height="44.0" rx="8" fill="#1e3a8a" stroke="#1e3a8a" stroke-width="1.6"/><text x="440.0" y="307.5" font-size="17" font-weight="bold" fill="#ffffff" text-anchor="middle">Ask the owner of the layer the evidence points to</text></svg>