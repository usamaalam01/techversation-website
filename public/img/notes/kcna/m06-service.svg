<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 356" width="880" height="356" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">m06-service</title><desc id="d">A storefront Pod calls the catalog Service, which selects three catalog Pods by the label app=catalog; the Service address stays while Pods come and go.</desc><defs><marker id="ah0" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker><marker id="ah1" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker></defs><rect x="0.75" y="0.75" width="878.5" height="354.5" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><rect x="8.0" y="102.0" width="176.0" height="100.0" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="96.0" y="147.2" font-size="16" font-weight="bold" fill="#1e3a8a" text-anchor="middle">Storefront Pod</text><text x="96.0" y="167.2" font-size="16" font-weight="normal" fill="#1e3a8a" text-anchor="middle">calls catalog</text><line x1="184.0" y1="152.0" x2="244.0" y2="152.0" stroke="#374151" stroke-width="2.4" marker-end="url(#ah0)"/><rect x="244.0" y="62.0" width="226.0" height="180.0" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="357.0" y="137.2" font-size="16" font-weight="bold" fill="#78350f" text-anchor="middle">Service catalog</text><text x="357.0" y="157.2" font-size="16" font-weight="normal" fill="#78350f" text-anchor="middle">stable name and virtual IP</text><text x="357.0" y="177.2" font-size="16" font-weight="normal" fill="#78350f" text-anchor="middle">selector: app=catalog</text><rect x="560.0" y="12.0" width="312.0" height="82.0" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="716.0" y="48.2" font-size="16" font-weight="bold" fill="#14532d" text-anchor="middle">catalog Pod</text><text x="716.0" y="68.2" font-size="16" font-weight="normal" fill="#14532d" text-anchor="middle">label app=catalog</text><line x1="470.0" y1="152.0" x2="558.0" y2="53.0" stroke="#d97706" stroke-width="2.2" marker-end="url(#ah1)"/><rect x="560.0" y="110.0" width="312.0" height="82.0" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="716.0" y="146.2" font-size="16" font-weight="bold" fill="#14532d" text-anchor="middle">catalog Pod</text><text x="716.0" y="166.2" font-size="16" font-weight="normal" fill="#14532d" text-anchor="middle">label app=catalog</text><line x1="470.0" y1="152.0" x2="558.0" y2="151.0" stroke="#d97706" stroke-width="2.2" marker-end="url(#ah1)"/><rect x="560.0" y="208.0" width="312.0" height="82.0" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="716.0" y="244.2" font-size="16" font-weight="bold" fill="#14532d" text-anchor="middle">catalog Pod</text><text x="716.0" y="264.2" font-size="16" font-weight="normal" fill="#14532d" text-anchor="middle">label app=catalog</text><line x1="470.0" y1="152.0" x2="558.0" y2="249.0" stroke="#d97706" stroke-width="2.2" marker-end="url(#ah1)"/><rect x="8.0" y="300.0" width="864.0" height="48.0" rx="8" fill="#1e3a8a" stroke="#1e3a8a" stroke-width="1.6"/><text x="440.0" y="329.5" font-size="17" font-weight="bold" fill="#ffffff" text-anchor="middle">Pods come and go, but the Service keeps one name and one address</text></svg>