<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 290" width="880" height="290" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">m10-gitops</title><desc id="d">A GitOps agent pulls the desired state from Git, applies it to the cluster and observes the actual state; drift from a manual change is reconciled, while a push pipeline acts once.</desc><defs><marker id="ah0" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker></defs><rect x="0.75" y="0.75" width="878.5" height="288.5" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><rect x="8.0" y="20.0" width="230.0" height="120.0" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="123.0" y="74.9" font-size="17" font-weight="bold" fill="#1e3a8a" text-anchor="middle">Git repository</text><text x="123.0" y="96.2" font-size="17" font-weight="normal" fill="#1e3a8a" text-anchor="middle">the desired state</text><rect x="325.0" y="20.0" width="230.0" height="120.0" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="440.0" y="74.9" font-size="17" font-weight="bold" fill="#78350f" text-anchor="middle">GitOps agent</text><text x="440.0" y="96.2" font-size="17" font-weight="normal" fill="#78350f" text-anchor="middle">Argo CD or Flux</text><rect x="642.0" y="20.0" width="230.0" height="120.0" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="757.0" y="74.9" font-size="17" font-weight="bold" fill="#14532d" text-anchor="middle">Cluster</text><text x="757.0" y="96.2" font-size="17" font-weight="normal" fill="#14532d" text-anchor="middle">the actual state</text><text x="281.0" y="64.0" font-size="16" font-weight="bold" fill="#374151" text-anchor="middle">pulls</text><line x1="323.0" y1="80.0" x2="240.0" y2="80.0" stroke="#374151" stroke-width="2.4" marker-end="url(#ah0)"/><text x="598.0" y="64.0" font-size="16" font-weight="bold" fill="#374151" text-anchor="middle">applies</text><line x1="557.0" y1="80.0" x2="640.0" y2="80.0" stroke="#374151" stroke-width="2.4" marker-end="url(#ah0)"/><line x1="640.0" y1="112.0" x2="557.0" y2="112.0" stroke="#374151" stroke-width="2.4" marker-end="url(#ah0)"/><text x="598.0" y="134.0" font-size="16" font-weight="bold" fill="#374151" text-anchor="middle">observes</text><rect x="8.0" y="170.0" width="426.0" height="80.0" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.6" stroke-dasharray="7 4"/><text x="221.0" y="205.2" font-size="16" font-weight="bold" fill="#7f1d1d" text-anchor="middle">Drift</text><text x="221.0" y="225.2" font-size="16" font-weight="normal" fill="#7f1d1d" text-anchor="middle">a manual change in the cluster is noticed and reconciled</text><rect x="446.0" y="170.0" width="426.0" height="80.0" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.6"/><text x="659.0" y="205.2" font-size="16" font-weight="bold" fill="#374151" text-anchor="middle">Push model</text><text x="659.0" y="225.2" font-size="16" font-weight="normal" fill="#374151" text-anchor="middle">a pipeline applies a change once and stops watching</text></svg>