<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 226" width="880" height="226" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">m02-request-flow</title><desc id="d">Five steps from kubectl to the API server, etcd, the scheduler and the kubelet starting containers.</desc><defs></defs><rect x="0.75" y="0.75" width="878.5" height="224.5" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><polygon points="8.0,8.0 154.4,8.0 174.4,37.0 154.4,66.0 8.0,66.0" fill="#dbeafe" stroke="#2563eb" stroke-width="1.8"/><text x="84.2" y="42.4" font-size="17" font-weight="bold" fill="#1e3a8a" text-anchor="middle">1 kubectl</text><rect x="10.0" y="70.0" width="152.4" height="86.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="18.0" y="117.9" font-size="15" font-weight="normal" fill="#1f2937" text-anchor="start">sends the request</text><polygon points="182.4,8.0 328.8,8.0 348.8,37.0 328.8,66.0 182.4,66.0 202.4,37.0" fill="#dcfce7" stroke="#16a34a" stroke-width="1.8"/><text x="265.6" y="42.4" font-size="17" font-weight="bold" fill="#14532d" text-anchor="middle">2 API server</text><rect x="184.4" y="70.0" width="152.4" height="86.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="192.4" y="108.5" font-size="15" font-weight="normal" fill="#1f2937" text-anchor="start">stores the object in</text><text x="192.4" y="127.2" font-size="15" font-weight="normal" fill="#1f2937" text-anchor="start">etcd</text><polygon points="356.8,8.0 503.2,8.0 523.2,37.0 503.2,66.0 356.8,66.0 376.8,37.0" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.8"/><text x="440.0" y="42.4" font-size="17" font-weight="bold" fill="#134e4a" text-anchor="middle">3 Scheduler</text><rect x="358.8" y="70.0" width="152.4" height="86.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="366.8" y="108.5" font-size="15" font-weight="normal" fill="#1f2937" text-anchor="start">picks a node for the</text><text x="366.8" y="127.2" font-size="15" font-weight="normal" fill="#1f2937" text-anchor="start">Pod</text><polygon points="531.2,8.0 677.6,8.0 697.6,37.0 677.6,66.0 531.2,66.0 551.2,37.0" fill="#fef3c7" stroke="#d97706" stroke-width="1.8"/><text x="614.4" y="42.4" font-size="17" font-weight="bold" fill="#78350f" text-anchor="middle">4 kubelet</text><rect x="533.2" y="70.0" width="152.4" height="86.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="541.2" y="117.9" font-size="15" font-weight="normal" fill="#1f2937" text-anchor="start">starts the containers</text><polygon points="705.6,8.0 852.0,8.0 872.0,37.0 852.0,66.0 705.6,66.0 725.6,37.0" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.8"/><text x="788.8" y="42.4" font-size="17" font-weight="bold" fill="#4c1d95" text-anchor="middle">5 Status</text><rect x="707.6" y="70.0" width="152.4" height="86.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="715.6" y="108.5" font-size="15" font-weight="normal" fill="#1f2937" text-anchor="start">flows back through</text><text x="715.6" y="127.2" font-size="15" font-weight="normal" fill="#1f2937" text-anchor="start">the API server</text><rect x="8.0" y="168.0" width="864.0" height="50.0" rx="8" fill="#1e3a8a" stroke="#1e3a8a" stroke-width="1.6"/><text x="440.0" y="198.8" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="middle">Components talk to each other through the API server</text></svg>