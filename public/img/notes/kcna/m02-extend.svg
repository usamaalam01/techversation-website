<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 222" width="880" height="222" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">m02-extend</title><desc id="d">A CustomResourceDefinition adds a kind, custom resources are its objects, a custom controller acts on them, and an operator combines them.</desc><defs></defs><rect x="0.75" y="0.75" width="878.5" height="220.5" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><polygon points="8.0,8.0 269.3,8.0 289.3,37.0 269.3,66.0 8.0,66.0" fill="#dbeafe" stroke="#2563eb" stroke-width="1.8"/><text x="141.7" y="42.8" font-size="18" font-weight="bold" fill="#1e3a8a" text-anchor="middle">CRD</text><rect x="10.0" y="70.0" width="267.3" height="70.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="18.0" y="110.2" font-size="16" font-weight="normal" fill="#1f2937" text-anchor="start">adds a new kind to the API</text><polygon points="299.3,8.0 560.7,8.0 580.7,37.0 560.7,66.0 299.3,66.0 319.3,37.0" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.8"/><text x="440.0" y="42.8" font-size="18" font-weight="bold" fill="#134e4a" text-anchor="middle">Custom resources</text><rect x="301.3" y="70.0" width="267.3" height="70.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="309.3" y="110.2" font-size="16" font-weight="normal" fill="#1f2937" text-anchor="start">objects of that kind</text><polygon points="590.7,8.0 852.0,8.0 872.0,37.0 852.0,66.0 590.7,66.0 610.7,37.0" fill="#dcfce7" stroke="#16a34a" stroke-width="1.8"/><text x="731.3" y="42.8" font-size="18" font-weight="bold" fill="#14532d" text-anchor="middle">Custom controller</text><rect x="592.7" y="70.0" width="267.3" height="70.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="600.7" y="110.2" font-size="16" font-weight="normal" fill="#1f2937" text-anchor="start">watches them and acts</text><rect x="8.0" y="152.0" width="864.0" height="62.0" rx="8" fill="#1e3a8a" strok