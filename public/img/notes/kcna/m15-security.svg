<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 330" width="880" height="330" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">m15-security</title><desc id="d">A stack of five security layers from authentication down to the supply chain, with the lifecycle phases beside it.</desc><defs></defs><rect x="0.75" y="0.75" width="878.5" height="328.5" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><rect x="8.0" y="8.0" width="640.0" height="55.0" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="328.0" y="30.7" font-size="16" font-weight="bold" fill="#1e3a8a" text-anchor="middle">Authentication</text><text x="328.0" y="50.7" font-size="16" font-weight="normal" fill="#1e3a8a" text-anchor="middle">who are you?</text><rect x="8.0" y="71.0" width="640.0" height="55.0" rx="8" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.6"/><text x="328.0" y="93.7" font-size="16" font-weight="bold" fill="#134e4a" text-anchor="middle">Authorization (RBAC)</text><text x="328.0" y="113.7" font-size="16" font-weight="normal" fill="#134e4a" text-anchor="middle">what may you do?</text><rect x="8.0" y="134.0" width="640.0" height="55.0" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="328.0" y="156.7" font-size="16" font-weight="bold" fill="#78350f" text-anchor="middle">Admission</text><text x="328.0" y="176.7" font-size="16" font-weight="normal" fill="#78350f" text-anchor="middle">mutating, validating, Pod Security</text><rect x="8.0" y="197.0" width="640.0" height="55.0" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="328.0" y="219.7" font-size="16" font-weight="bold" fill="#14532d" text-anchor="middle">The workload</text><text x="328.0" y="239.7" font-size="16" font-weight="normal" fill="#14532d" text-anchor="middle">securityContext, NetworkPolicy, ServiceAccount</text><rect x="8.0" y="260.0" width="640.0" height="55.0" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.6"/><text x="328.0" y="282.7" font-size="16" font-weight="bold" fill="#4c1d95" text-anchor="middle">The supply chain</text><text x="328.0" y="302.7" font-size="16" font-weight="normal" fill="#4c1d95" text-anchor="middle">scan, sign, private registry, verify</text><rect x="668.0" y="8.0" width="204.0" height="308.0" rx="10" fill="#ffffff" stroke="#9ca3af" stroke-width="1.8"/><circle cx="687.0" cy="32.1" r="3.4" fill="#9ca3af" stroke="#9ca3af" stroke-width="1"/><text x="704.0" y="37.2" font-size="16" font-weight="normal" fill="#1f2937" text-anchor="start">Lifecycle phases:</text><circle cx="687.0" cy="59.6" r="3.4" fill="#9ca3af" stroke="#9ca3af" stroke-width="1"/><text x="704.0" y="64.7" font-size="16" font-weight="normal" fill="#1f2937" text-anchor="start">develop</text><circle cx="687.0" cy="87.1" r="3.4" fill="#9ca3af" stroke="#9ca3af" stroke-width="1"/><text x="704.0" y="92.2" font-size="16" font-weight="normal" fill="#1f2937" text-anchor="start">distribute</text><circle cx="687.0" cy="114.6" r="3.4" fill="#9ca3af" stroke="#9ca3af" stroke-width="1"/><text x="704.0" y="119.8" font-size="16" font-weight="normal" fill="#1f2937" text-anchor="start">deploy</text><circle cx="687.0" cy="142.2" r="3.4" fill="#9ca3af" stroke="#9ca3af" stroke-width="1"/><text x="704.0" y="147.3" font-size="16" font-weight="normal" fill="#1f2937" text-anchor="start">runtime</text><circle cx="687.0" cy="169.7" r="3.4" fill="#9ca3af" stroke="#9ca3af" stroke-width="1"/><text x="704.0" y="174.8" font-size="16" font-weight="normal" fill="#1f2937" text-anchor="start">Older material: the 4</text><text x="704.0" y="194.3" font-size="16" font-weight="normal" fill="#1f2937" text-anchor="start">Cs</text></svg>