<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 292" width="880" height="292" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">m10-strategies</title><desc id="d">Three rows: recreate has a gap with downtime between the old and new versions, a rolling update overlaps them, and blue/green switches traffic from one environment to the other.</desc><defs></defs><rect x="0.75" y="0.75" width="878.5" height="290.5" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><rect x="8.0" y="8.0" width="170.0" height="84.0" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.6"/><text x="93.0" y="55.5" font-size="17" font-weight="bold" fill="#374151" text-anchor="middle">Recreate</text><rect x="8.0" y="100.0" width="170.0" height="84.0" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.6"/><text x="93.0" y="147.5" font-size="17" font-weight="bold" fill="#374151" text-anchor="middle">Rolling update</text><rect x="8.0" y="192.0" width="170.0" height="84.0" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.6"/><text x="93.0" y="239.5" font-size="17" font-weight="bold" fill="#374151" text-anchor="middle">Blue/green</text><rect x="194.0" y="8.0" width="240.0" height="84.0" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="314.0" y="55.2" font-size="16" font-weight="bold" fill="#1e3a8a" text-anchor="middle">old version</text><rect x="440.0" y="8.0" width="130.0" height="84.0" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.6" stroke-dasharray="7 4"/><text x="505.0" y="55.2" font-size="16" font-weight="bold" fill="#7f1d1d" text-anchor="middle">downtime</text><rect x="576.0" y="8.0" width="296.0" height="84.0" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="724.0" y="55.2" font-size="16" font-weight="bold" fill="#14532d" text-anchor="middle">new version</text><rect x="194.0" y="100.0" width="450.0" height="38.0" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="419.0" y="123.9" font-size="15" font-weight="bold" fill="#1e3a8a" text-anchor="middle">old Pods, replaced one by one</text><rect x="420.0" y="146.0" width="452.0" height="38.0" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="646.0" y="169.9" font-size="15" font-weight="bold" fill="#14532d" text-anchor="middle">new Pods, started as old ones stop</text><rect x="194.0" y="192.0" width="340.0" height="38.0" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="364.0" y="215.9" font-size="15" font-weight="bold" fill="#1e3a8a" text-anchor="middle">blue: live, serves users</text><rect x="194.0" y="238.0" width="340.0" height="38.0" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.6" stroke-dasharray="6 4"/><text x="364.0" y="261.9" font-size="15" font-weight="bold" fill="#374151" text-anchor="middle">green: updated and tested</text><line x1="556.0" y1="192.0" x2="556.0" y2="282.0" stroke="#d97706" stroke-width="2.6" stroke-dasharray="7 4"/><text x="566.0" y="222.0" font-size="16" font-weight="bold" fill="#78350f" text-anchor="start">switch</text><rect x="640.0" y="192.0" width="232.0" height="38.0" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.6" stroke-dasharray="6 4"/><text x="756.0" y="215.9" font-size="15" font-weight="bold" fill="#374151" text-anchor="middle">blue: idle</text><rect x="640.0" y="238.0" width="232.0" height="38.0" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="756.0" y="261.9" font-size="15" font-weight="bold" fill="#14532d" text-anchor="middle">green: live</text></svg>