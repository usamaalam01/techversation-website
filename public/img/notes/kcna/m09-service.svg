<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 260" width="880" height="260" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">m09-service</title><desc id="d">Five checks in order: DNS, the Service, EndpointSlices, the Pods and kube-proxy; no endpoints means the selector and the Pod labels do not match.</desc><defs></defs><rect x="0.75" y="0.75" width="878.5" height="258.5" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><polygon points="8.0,8.0 152.8,8.0 172.8,36.0 152.8,64.0 8.0,64.0" fill="#dbeafe" stroke="#2563eb" stroke-width="1.8"/><text x="83.4" y="41.1" font-size="16" font-weight="bold" fill="#1e3a8a" text-anchor="middle">1 DNS</text><rect x="10.0" y="68.0" width="150.8" height="124.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="18.0" y="106.8" font-size="15" font-weight="normal" fill="#1f2937" text-anchor="start">does the name</text><text x="18.0" y="125.5" font-size="15" font-weight="normal" fill="#1f2937" text-anchor="start">resolve? are the</text><text x="18.0" y="144.2" font-size="15" font-weight="normal" fill="#1f2937" text-anchor="start">CoreDNS Pods</text><text x="18.0" y="163.0" font-size="15" font-weight="normal" fill="#1f2937" text-anchor="start">running?</text><polygon points="182.8,8.0 327.6,8.0 347.6,36.0 327.6,64.0 182.8,64.0 202.8,36.0" fill="#fef3c7" stroke="#d97706" stroke-width="1.8"/><text x="265.2" y="41.1" font-size="16" font-weight="bold" fill="#78350f" text-anchor="middle">2 Service</text><rect x="184.8" y="68.0" width="150.8" height="124.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="192.8" y="125.5" font-size="15" font-weight="normal" fill="#1f2937" text-anchor="start">does it exist, with</text><text x="192.8" y="144.2" font-size="15" font-weight="normal" fill="#1f2937" text-anchor="start">the right port?</text><polygon points="357.6,8.0 502.4,8.0 522.4,36.0 502.4,64.0 357.6,64.0 377.6,36.0" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.8"/><text x="440.0" y="31.5" font-size="16" font-weight="bold" fill="#134e4a" text-anchor="middle">3</text><text x="440.0" y="50.7" font-size="16" font-weight="bold" fill="#134e4a" text-anchor="middle">EndpointSlices</text><rect x="359.6" y="68.0" width="150.8" height="124.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="367.6" y="134.9" font-size="15" font-weight="normal" fill="#1f2937" text-anchor="start">do they list Pods?</text><polygon points="532.4,8.0 677.2,8.0 697.2,36.0 677.2,64.0 532.4,64.0 552.4,36.0" fill="#dcfce7" stroke="#16a34a" stroke-width="1.8"/><text x="614.8" y="41.1" font-size="16" font-weight="bold" fill="#14532d" text-anchor="middle">4 Pods</text><rect x="534.4" y="68.0" width="150.8" height="124.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="542.4" y="106.8" font-size="15" font-weight="normal" fill="#1f2937" text-anchor="start">labels match the</text><text x="542.4" y="125.5" font-size="15" font-weight="normal" fill="#1f2937" text-anchor="start">selector;</text><text x="542.4" y="144.2" font-size="15" font-weight="normal" fill="#1f2937" text-anchor="start">containerPort</text><text x="542.4" y="163.0" font-size="15" font-weight="normal" fill="#1f2937" text-anchor="start">equals targetPort</text><polygon points="707.2,8.0 852.0,8.0 872.0,36.0 852.0,64.0 707.2,64.0 727.2,36.0" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.8"/><text x="789.6" y="41.1" font-size="16" font-weight="bold" fill="#374151" text-anchor="middle">5 kube-proxy</text><rect x="709.2" y="68.0" width="150.8" height="124.0" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/><text x="717.2" y="125.5" font-size="15" font-weight="normal" fill="#1f2937" text-anchor="start">is it running on the</text><text x="717.2" y="144.2" font-size="15" font-weight="normal" fill="#1f2937" text-anchor="start">nodes?</text><rect x="8.0" y="206.0" width="864.0" height="46.0" rx="8" fill="#1e3a8a" stroke="#1e3a8a" stroke-width="1.6"/><text x="440.0" y="234.5" font-size="17" font-weight="bold" fill="#ffffff" text-anchor="middle">No endpoints: compare the selector with the Pod labels</text></svg>