<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 312" width="880" height="312" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">m13-signals</title><desc id="d">Observability means understanding a system's inside from its outputs; metrics are numbers over time, logs are timestamped messages and traces follow one request through services.</desc><defs></defs><rect x="0.75" y="0.75" width="878.5" height="310.5" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><rect x="8.0" y="8.0" width="864.0" height="52.0" rx="8" fill="#1e3a8a" stroke="#1e3a8a" stroke-width="1.6"/><text x="440.0" y="39.8" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="middle">Observability: understand the inside of a system from its outputs</text><rect x="8.0" y="76.0" width="280.0" height="164.0" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="148.0" y="142.3" font-size="17" font-weight="bold" fill="#1e3a8a" text-anchor="middle">Metrics</text><text x="148.0" y="163.5" font-size="17" font-weight="normal" fill="#1e3a8a" text-anchor="middle">numbers aggregated over time</text><text x="148.0" y="184.8" font-size="17" font-weight="normal" fill="#1e3a8a" text-anchor="middle">error rate, CPU use, request rate</text><rect x="300.0" y="76.0" width="280.0" height="164.0" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="440.0" y="142.3" font-size="17" font-weight="bold" fill="#78350f" text-anchor="middle">Logs</text><text x="440.0" y="163.5" font-size="17" font-weight="normal" fill="#78350f" text-anchor="middle">timestamped messages</text><text x="440.0" y="184.8" font-size="17" font-weight="normal" fill="#78350f" text-anchor="middle">what a service printed</text><rect x="592.0" y="76.0" width="280.0" height="164.0" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="732.0" y="142.3" font-size="17" font-weight="bold" fill="#14532d" text-anchor="middle">Traces</text><text x="732.0" y="163.5" font-size="17" font-weight="normal" fill="#14532d" text-anchor="middle">one request through services</text><text x="732.0" y="184.8" font-size="17" font-weight="normal" fill="#14532d" text-anchor="middle">made of spans</text><rect x="8.0" y="258.0" width="864.0" height="42.0" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.6"/><text x="440.0" y="284.2" font-size="16" font-weight="bold" fill="#374151" text-anchor="middle">Monitoring watches known signals and alerts when they go wrong</text></svg>