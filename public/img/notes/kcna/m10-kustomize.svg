<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 330" width="880" height="330" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d"><title id="t">m10-kustomize</title><desc id="d">A base holds the common YAML, and a staging and a production overlay each add patches; kubectl apply -k builds and applies the result of an overlay.</desc><defs><marker id="ah0" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker><marker id="ah1" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker></defs><rect x="0.75" y="0.75" width="878.5" height="328.5" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><rect x="260.0" y="8.0" width="360.0" height="70.0" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="440.0" y="38.2" font-size="16" font-weight="bold" fill="#1e3a8a" text-anchor="middle">Base</text><text x="440.0" y="58.2" font-size="16" font-weight="normal" fill="#1e3a8a" text-anchor="middle">kustomization and the common resources</text><rect x="60.0" y="130.0" width="330.0" height="80.0" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="225.0" y="165.2" font-size="16" font-weight="bold" fill="#78350f" text-anchor="middle">Overlay: staging</text><text x="225.0" y="185.2" font-size="16" font-weight="normal" fill="#78350f" text-anchor="middle">kustomization and patches</text><line x1="225.0" y1="130.0" x2="440.0" y2="80.0" stroke="#374151" stroke-width="2.2" marker-end="url(#ah0)"/><line x1="225.0" y1="210.0" x2="225.0" y2="250.0" stroke="#16a34a" stroke-width="2.2" marker-end="url(#ah1)"/><rect x="60.0" y="252.0" width="330.0" height="66.0" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="225.0" y="280.2" font-size="16" font-weight="bold" fill="#14532d" text-anchor="middle">kubectl apply -k</text><text x="225.0" y="300