<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Search | Techversation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/styles.css">
<script>try{var t=JSON.parse(localStorage.getItem("tv-theme"));if(t)document.documentElement.setAttribute("data-theme",t)}catch(e){}</script>
</head>
<body data-page="search">
<div id="top"></div>
<main class="wrap">
  <section class="search-head">
    <p class="eyebrow">Search</p>
    <h1 style="font-size:clamp(1.9rem,3.6vw,2.8rem)">Find a course, module, note or term</h1>
    <form class="search-box" id="sform" role="search" style="max-width:720px">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="Try Sprint, RBAC, governance" aria-label="Search the whole site" autocomplete="off">
      <button class="btn btn-primary" type="submit" style="padding:.7rem 1.1rem">Search</button>
    </form>
  </section>
  <div class="search-layout">
    <aside class="filters" aria-label="Filters">
      <div><h4>Institute</h4><div id="f-inst"></div></div>
      <div><h4>Type</h4><div id="f-type"></div></div>
    </aside>
    <section aria-live="polite">
      <div class="count-line" id="count"></div>
      <div class="results" id="results"></div>
    </section>
  </div>
</main>
<div id="foot"></div>
<script src="assets/data.js"></script>
<script src="assets/app.js"></script>
</body>
</html>
